<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Care Facility Simulator - Stick Figure Style</title>
    <style>
        * {
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            text-align: center;
            z-index: 10;
        }
        #ui-title {
            font-size: 16px;
            font-weight: bold;
            color: #4cd137;
            margin-bottom: 2px;
        }
        #ui-status {
            font-size: 12px;
            color: #dcdde1;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div id="ui-title">CARE SHIFT</div>
        <div id="ui-status">Phase 1: 棒人間表示モデル</div>
    </div>

    <script>
        // --- 1. シーン・カメラ・レンダラーの設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 14;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. 照明の設定 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. マップ構造データの定義 ---
        const walls = [];

        // 床の作成
        const floorGeometry = new THREE.PlaneGeometry(28, 20);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 壁の生成関数
        function createWall(x, z, width, depth) {
            const wallGeo = new THREE.BoxGeometry(width, 1.8, depth);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x636e72 });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(x, 0.9, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            walls.push(wall);
        }

        // 床エリアの色分け関数
        function createZoneFloor(x, z, width, depth, color) {
            const zoneGeo = new THREE.PlaneGeometry(width, depth);
            const zoneMat = new THREE.MeshStandardMaterial({ color: color });
            const zone = new THREE.Mesh(zoneGeo, zoneMat);
            zone.rotation.x = -Math.PI / 2;
            zone.position.set(x, 0.01, z);
            zone.receiveShadow = true;
            scene.add(zone);
        }

        // 外壁
        createWall(0, -10, 28, 0.4);
        createWall(0, 10, 28, 0.4);
        createWall(-14, 0, 0.4, 20);
        createWall(14, 0, 0.4, 20);

        // 内部仕切り壁
        createWall(-12, 3.5, 3.5, 0.4);
        createWall(-6.5, 3.5, 2.5, 0.4);
        createWall(-2.5, 3.5, 2.5, 0.4);
        createWall(2.5, 3.5, 2.5, 0.4);
        createWall(6.5, 3.5, 2.5, 0.4);
        createWall(12, 3.5, 3.5, 0.4);

        createWall(-4.5, 6.75, 0.4, 6.5);
        createWall(4.5, 6.75, 0.4, 6.5);

        createWall(-10.5, -3.5, 6.5, 0.4);
        createWall(-1.5, -3.5, 6.5, 0.4);
        createWall(10.5, -3.5, 6.5, 0.4);

        createWall(-4.5, -6.75, 0.4, 6.5);
        createWall(4.5, -6.75, 0.4, 6.5);

        // 床の色分け
        createZoneFloor(-9.25, 6.75, 9, 6, 0xf6e58d);
        createZoneFloor(0, 6.75, 8.5, 6, 0x7ed6df);
        createZoneFloor(9.25, 6.75, 9, 6, 0xbadc58);
        createZoneFloor(-9.25, -6.75, 9, 6, 0xbdc3c7);
        createZoneFloor(0, -6.75, 8.5, 6, 0xffbe76);
        createZoneFloor(9.25, -6.75, 9, 6, 0xff7979);

        // 家具
        function createFurniture(x, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            walls.push(mesh);
        }

        createFurniture(-11.5, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        createFurniture(-2.2, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        createFurniture(7, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        createFurniture(0, -6.75, 3.5, 0.7, 2.5, 0x78e08f);

        // --- 4. 棒人間（ライン型）キャラクター生成 ---
        function createStickFigure(hexColor) {
            const group = new THREE.Group();
            const material = new THREE.LineBasicMaterial({ color: hexColor, linewidth: 3 });

            // 1. 頭部（円形のライン）
            const headGeo = new THREE.BufferGeometry();
            const headPoints = [];
            const radius = 0.25;
            for (let i = 0; i <= 16; i++) {
                const theta = (i / 16) * Math.PI * 2;
                headPoints.push(new THREE.Vector3(Math.cos(theta) * radius, 1.5 + Math.sin(theta) * radius, 0));
            }
            headGeo.setFromPoints(headPoints);
            const head = new THREE.Line(headGeo, material);
            group.add(head);

            // 2. 身体・手足（線分描画）
            const bodyGeo = new THREE.BufferGeometry();
            const bodyPoints = [
                // 胴体
                new THREE.Vector3(0, 1.25, 0),
                new THREE.Vector3(0, 0.6, 0),

                // 腕
                new THREE.Vector3(-0.35, 0.95, 0),
                new THREE.Vector3(0.35, 0.95, 0),

                // 胴体下部へ戻る
                new THREE.Vector3(0, 0.6, 0),

                // 左足
                new THREE.Vector3(-0.25, 0, 0),

                // 胴体下部へ戻る
                new THREE.Vector3(0, 0.6, 0),

                // 右足
                new THREE.Vector3(0.25, 0, 0)
            ];
            bodyGeo.setFromPoints(bodyPoints);
            const body = new THREE.LineSegments(bodyGeo, material);
            group.add(body);

            scene.add(group);
            return group;
        }

        // プレイヤー (青)
        const player = createStickFigure(0x0984e3);
        player.position.set(0, 0, 0);

        // 利用者 (3人)
        const resident1 = createStickFigure(0xd63031);
        resident1.position.set(-9.25, 0, 7.5);

        const resident2 = createStickFigure(0xe17055);
        resident2.position.set(0, 0, 7.5);

        const resident3 = createStickFigure(0x00b894);
        resident3.position.set(0, 0, -6.75);

        // 棒人間が常にカメラの方を向く処理
        const allCharacters = [player, resident1, resident2, resident3];

        // --- 5. タップ/クリック移動ロジック ---
        let targetPosition = null;
        const playerSpeed = 0.12;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handlePointer(event) {
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                targetPosition = intersects[0].point.clone();
                targetPosition.y = 0;
            }
        }

        window.addEventListener('pointerdown', handlePointer);

        function movePlayer() {
            if (!targetPosition) return;

            const distance = player.position.distanceTo(targetPosition);
            if (distance < 0.15) {
                targetPosition = null;
                return;
            }

            const direction = new THREE.Vector3()
                .subVectors(targetPosition, player.position)
                .normalize();

            const playerRaycaster = new THREE.Raycaster(
                new THREE.Vector3(player.position.x, 0.5, player.position.z),
                direction,
                0,
                0.5
            );
            
            const collisions = playerRaycaster.intersectObjects(walls);
            if (collisions.length > 0) {
                targetPosition = null;
                return;
            }

            player.position.add(direction.multiplyScalar(playerSpeed));
        }

        // --- 6. ループとリサイズ ---
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            movePlayer();

            // 棒人間をカメラの向きに固定（視認性向上）
            allCharacters.forEach(char => {
                char.quaternion.copy(camera.quaternion);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
