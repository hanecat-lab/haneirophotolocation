<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Care Facility Simulator - Phase 4 Final</title>
    <style>
        * { touch-action: none; user-select: none; }
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #ui {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 20px;
            border-radius: 8px; text-align: center; pointer-events: none; z-index: 10;
            display: flex; gap: 20px; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .ui-item { font-size: 14px; }
        .ui-val { font-weight: bold; color: #4cd137; font-size: 18px; }
        
        /* リザルト画面モーダル */
        #result-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); z-index: 100;
            justify-content: center; align-items: center; flex-direction: column; color: white;
        }
        #result-card {
            background: #2c3e50; padding: 30px 40px; border-radius: 12px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2px solid #34495e;
        }
        #result-card h1 { margin: 0 0 15px 0; color: #f1c40f; font-size: 28px; }
        #result-card .score-display { font-size: 36px; font-weight: bold; color: #2ecc71; margin: 10px 0; }
        #result-card .rank-display { font-size: 24px; color: #e74c3c; font-weight: bold; margin-bottom: 20px; }
        #restart-btn {
            background: #e67e22; border: none; color: white; padding: 12px 30px;
            font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;
            transition: 0.2s;
        }
        #restart-btn:active { transform: scale(0.95); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div class="ui-item">TIME: <span id="clock" class="ui-val">09:00</span></div>
        <div class="ui-item">SCORE: <span id="score" class="ui-val">0</span></div>
    </div>

    <!-- 17:00終了時のリザルトUI -->
    <div id="result-modal">
        <div id="result-card">
            <h1>SHIFT COMPLETED!</h1>
            <div>本日の勤務成果</div>
            <div id="final-score" class="score-display">0 PTS</div>
            <div id="final-rank" class="rank-display">RANK: C</div>
            <button id="restart-btn" onclick="resetGame()">もう一度プレイ</button>
        </div>
    </div>

    <script>
        // --- 1. シーン・カメラ・レンダラー ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 14;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. 衝突判定データ ＆ マップ構築 ---
        const colliders = [];

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(28, 20),
            new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        function addBoxCollider(x, z, w, h, dep, color) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, dep),
                new THREE.MeshStandardMaterial({ color: color })
            );
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            colliders.push({
                minX: x - w / 2, maxX: x + w / 2,
                minZ: z - dep / 2, maxZ: z + dep / 2
            });
            return mesh;
        }

        function createZoneFloor(x, z, w, dep, color) {
            const zone = new THREE.Mesh(
                new THREE.PlaneGeometry(w, dep),
                new THREE.MeshStandardMaterial({ color: color })
            );
            zone.rotation.x = -Math.PI / 2;
            zone.position.set(x, 0.01, z);
            zone.receiveShadow = true;
            scene.add(zone);
        }

        // 外壁・内壁
        addBoxCollider(0, -10, 28, 1.8, 0.4, 0x636e72);
        addBoxCollider(0, 10, 28, 1.8, 0.4, 0x636e72);
        addBoxCollider(-14, 0, 0.4, 1.8, 20, 0x636e72);
        addBoxCollider(14, 0, 0.4, 1.8, 20, 0x636e72);

        addBoxCollider(-11.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-3.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(3.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(11.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);
        addBoxCollider(4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);

        addBoxCollider(-11.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-3.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(3.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(11.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);
        addBoxCollider(4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);

        createZoneFloor(-9.25, 6.75, 9, 6, 0xf6e58d);
        createZoneFloor(0, 6.75, 8.5, 6, 0x7ed6df);
        createZoneFloor(9.25, 6.75, 9, 6, 0xbadc58);
        createZoneFloor(-9.25, -6.75, 9, 6, 0xbdc3c7);
        createZoneFloor(0, -6.75, 8.5, 6, 0xffbe76);
        createZoneFloor(9.25, -6.75, 9, 6, 0xff7979);

        addBoxCollider(-11.5, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        addBoxCollider(-2.2, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        addBoxCollider(7.0, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        addBoxCollider(0, -6.75, 3.5, 0.7, 2.5, 0x78e08f);

        // --- 3. 2Dキャンバステクスチャによるアイコン吹き出し作成 ---
        function createBubbleTexture(text, isAngry = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.beginPath();
            ctx.arc(64, 64, 50, 0, Math.PI * 2);
            ctx.fillStyle = isAngry ? '#e74c3c' : '#f1c40f';
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.font = '50px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 68);

            return new THREE.CanvasTexture(canvas);
        }

        function createHachiStickFigure(hexColor) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: hexColor });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), mat);
            head.position.set(0, 1.48, 0);
            group.add(head);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.63, 8), mat);
            body.position.set(0, 0.965, 0);
            group.add(body);

            const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.55, 8), mat);
            arm.position.set(0, 1.2, 0);
            arm.rotation.z = Math.PI / 2;
            group.add(arm);

            const legLGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.68, 8);
            legLGeo.translate(0, -0.34, 0);
            const legL = new THREE.Mesh(legLGeo, mat);
            legL.position.set(0, 0.65, 0);
            legL.rotation.z = 0.28;
            group.add(legL);

            const legRGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.68, 8);
            legRGeo.translate(0, -0.34, 0);
            const legR = new THREE.Mesh(legRGeo, mat);
            legR.position.set(0, 0.65, 0);
            legR.rotation.z = -0.28;
            group.add(legR);

            // スプライト（視線固定吹き出し）
            const spriteMat = new THREE.SpriteMaterial({ transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.set(0, 2.2, 0);
            sprite.scale.set(0.8, 0.8, 1);
            sprite.visible = false;
            group.add(sprite);
            group.callSprite = sprite;

            scene.add(group);
            return group;
        }

        // --- 4. ゲーム変数とキャラクター ---
        const player = createHachiStickFigure(0x0984e3);
        player.position.set(2.0, 0, 0.0);

        const CALL_ICONS = ['💡', '🚽', '🍱'];

        const residents = [
            {
                mesh: createHachiStickFigure(0xd63031),
                waypoints: [
                    new THREE.Vector3(-8.0, 0, 6.0),
                    new THREE.Vector3(-8.0, 0, 0.0),
                    new THREE.Vector3(0.0, 0, 0.0),
                    new THREE.Vector3(0.0, 0, -4.5)
                ],
                currentWP: 0, speed: 0.035, waitTime: 0,
                isCalling: false, callTimer: 100, callDuration: 0, iconText: '💡'
            },
            {
                mesh: createHachiStickFigure(0xe17055),
                waypoints: [
                    new THREE.Vector3(8.0, 0, -6.0),
                    new THREE.Vector3(8.0, 0, 0.0),
                    new THREE.Vector3(0.0, 0, 0.0),
                    new THREE.Vector3(0.0, 0, -4.5)
                ],
                currentWP: 0, speed: 0.03, waitTime: 60,
                isCalling: false, callTimer: 250, callDuration: 0, iconText: '🚽'
            }
        ];
        residents.forEach(r => r.mesh.position.copy(r.waypoints[0]));

        const CHAR_RADIUS = 0.3;
        let score = 0;
        let isGameActive = true;
        
        // 9:00 〜 17:00 (8時間 = 480分 = 28,800秒)
        // 10分間（600秒）で終わらせるための秒速倍率は 28,800 / 600 = 48倍速
        let elapsedRealSeconds = 0;
        let lastTime = performance.now();

        function updateCallBubble(r, isAngry) {
            r.mesh.callSprite.material.map = createBubbleTexture(r.iconText, isAngry);
            r.mesh.callSprite.material.needsUpdate = true;
        }

        // --- 5. 衝突計算 ---
        function moveWithCollision(entityPos, moveStep) {
            entityPos.x += moveStep.x;
            for (let c of colliders) {
                if (entityPos.x + CHAR_RADIUS > c.minX && entityPos.x - CHAR_RADIUS < c.maxX &&
                    entityPos.z + CHAR_RADIUS > c.minZ && entityPos.z - CHAR_RADIUS < c.maxZ) {
                    if (moveStep.x > 0) entityPos.x = c.minX - CHAR_RADIUS;
                    else if (moveStep.x < 0) entityPos.x = c.maxX + CHAR_RADIUS;
                }
            }
            entityPos.z += moveStep.z;
            for (let c of colliders) {
                if (entityPos.x + CHAR_RADIUS > c.minX && entityPos.x - CHAR_RADIUS < c.maxX &&
                    entityPos.z + CHAR_RADIUS > c.minZ && entityPos.z - CHAR_RADIUS < c.maxZ) {
                    if (moveStep.z > 0) entityPos.z = c.minZ - CHAR_RADIUS;
                    else if (moveStep.z < 0) entityPos.z = c.maxZ + CHAR_RADIUS;
                }
            }
        }

        // --- 6. タップ入力 ---
        let targetPos = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (!isGameActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                targetPos = intersects[0].point.clone();
                targetPos.y = 0;
            }
        });

        // --- 7. ゲームリセット ---
        function resetGame() {
            score = 0;
            elapsedRealSeconds = 0;
            isGameActive = true;
            document.getElementById('score').innerText = '0';
            document.getElementById('result-modal').style.display = 'none';
            player.position.set(2.0, 0, 0.0);
            targetPos = null;

            residents.forEach((r, idx) => {
                r.isCalling = false;
                r.mesh.callSprite.visible = false;
                r.callTimer = 100 + idx * 150;
                r.currentWP = 0;
                r.mesh.position.copy(r.waypoints[0]);
            });
            lastTime = performance.now();
        }

        function endGame() {
            isGameActive = false;
            document.getElementById('final-score').innerText = `${score} PTS`;
            let rank = 'C';
            if (score >= 120) rank = 'S (熟練介護士)';
            else if (score >= 80) rank = 'A (一人前)';
            else if (score >= 40) rank = 'B (駆け出し)';
            document.getElementById('final-rank').innerText = `RANK: ${rank}`;
            document.getElementById('result-modal').style.display = 'flex';
        }

        // --- 8. メインループ ---
        function animate(now) {
            requestAnimationFrame(animate);

            const delta = (now - lastTime) / 1000;
            lastTime = now;

            if (isGameActive) {
                // 時間進行（10分＝600秒で実時間8時間を消化）
                elapsedRealSeconds += delta;
                if (elapsedRealSeconds >= 600) {
                    elapsedRealSeconds = 600;
                    endGame();
                }

                const totalGameMinutes = 9 * 60 + (elapsedRealSeconds / 600) * (8 * 60);
                const hours = Math.floor(totalGameMinutes / 60);
                const mins = Math.floor(totalGameMinutes % 60);
                document.getElementById('clock').innerText = 
                    `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;

                // プレイヤー移動
                if (targetPos) {
                    const dir = new THREE.Vector3().subVectors(targetPos, player.position);
                    dir.y = 0;
                    if (dir.length() < 0.2) {
                        targetPos = null;
                    } else {
                        dir.normalize().multiplyScalar(0.12);
                        moveWithCollision(player.position, dir);
                    }
                }

                // NPC＆呼出管理
                residents.forEach(r => {
                    if (!r.isCalling) {
                        r.callTimer--;
                        if (r.callTimer <= 0) {
                            r.isCalling = true;
                            r.callDuration = 0;
                            r.iconText = CALL_ICONS[Math.floor(Math.random() * CALL_ICONS.length)];
                            updateCallBubble(r, false);
                            r.mesh.callSprite.visible = true;
                        }
                    } else {
                        r.callDuration += delta;
                        
                        // 10秒放置されると怒り（赤アイコン）に変化
                        if (r.callDuration > 10 && !r.isAngry) {
                            r.isAngry = true;
                            updateCallBubble(r, true);
                        }

                        // 20秒以上放置でペナルティ＆消滅
                        if (r.callDuration > 20) {
                            r.isCalling = false;
                            r.isAngry = false;
                            r.mesh.callSprite.visible = false;
                            r.callTimer = 200 + Math.random() * 150;
                            score = Math.max(0, score - 10); // ペナルティ
                            document.getElementById('score').innerText = score;
                        }

                        // プレイヤー接触で成功
                        const distToPlayer = player.position.distanceTo(r.mesh.position);
                        if (distToPlayer < 1.2) {
                            r.isCalling = false;
                            r.isAngry = false;
                            r.mesh.callSprite.visible = false;
                            r.callTimer = 250 + Math.random() * 200;
                            score += 10;
                            document.getElementById('score').innerText = score;
                        }
                    }

                    // 巡回移動
                    if (r.waitTime > 0) {
                        r.waitTime--;
                        return;
                    }
                    const wp = r.waypoints[r.currentWP];
                    const dir = new THREE.Vector3().subVectors(wp, r.mesh.position);
                    dir.y = 0;
                    if (dir.length() < 0.3) {
                        if (!r.reverse) {
                            r.currentWP++;
                            if (r.currentWP >= r.waypoints.length) {
                                r.currentWP = r.waypoints.length - 2;
                                r.reverse = true;
                                r.waitTime = 120;
                            }
                        } else {
                            r.currentWP--;
                            if (r.currentWP < 0) {
                                r.currentWP = 1;
                                r.reverse = false;
                                r.waitTime = 120;
                            }
                        }
                    } else {
                        dir.normalize().multiplyScalar(r.speed);
                        moveWithCollision(r.mesh.position, dir);
                    }
                });

                // 向き固定
                [player, ...residents.map(r => r.mesh)].forEach(m => {
                    m.quaternion.copy(camera.quaternion);
                });
            }

            renderer.render(scene, camera);
        }

        animate(performance.now());
    </script>
</body>
</html>
