<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Facility Simulator - Phase 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #ui-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            text-align: center;
        }
        #ui-title {
            font-size: 14px;
            font-weight: bold;
            color: #4cd137;
            margin-bottom: 2px;
        }
        #ui-status {
            font-size: 12px;
            color: #dcdde1;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div id="ui-title">CARE SHIFT</div>
        <div id="ui-status">Phase 1: 施設移動テスト</div>
    </div>

    <script>
        // --- 1. シーン・カメラ・レンダラーの設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 14;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        
        // クォータービュー（斜め上）位置設定
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. 照明の設定 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. マップ構造データの定義 ---
        const walls = []; // 衝突判定用の壁メッシュ配列

        // 床の作成
        const floorGeometry = new THREE.PlaneGeometry(28, 20);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 壁の生成ヘルパー関数
        function createWall(x, z, width, depth) {
            const wallGeo = new THREE.BoxGeometry(width, 2, depth);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(x, 1, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            walls.push(wall);
        }

        // 床エリアの色分け用ヘルパー
        function createZoneFloor(x, z, width, depth, color) {
            const zoneGeo = new THREE.PlaneGeometry(width, depth);
            const zoneMat = new THREE.MeshStandardMaterial({ color: color });
            const zone = new THREE.Mesh(zoneGeo, zoneMat);
            zone.rotation.x = -Math.PI / 2;
            zone.position.set(x, 0.01, z);
            zone.receiveShadow = true;
            scene.add(zone);
        }

        // 外壁
        createWall(0, -10, 28, 0.5);
        createWall(0, 10, 28, 0.5);
        createWall(-14, 0, 0.5, 20);
        createWall(14, 0, 0.5, 20);

        // 内部仕切り壁
        createWall(-4.5, 4, 19, 0.5); // 居室と廊下の間（ドア用隙間あり）
        createWall(9.5, 4, 9, 0.5);
        createWall(-5, 3.75, 0.5, 12); // 居室A/B区切り
        createWall(4, 3.75, 0.5, 12);  // 居室B/C区切り
        createWall(-5, -4, 0.5, 12);   // 詰所区切り
        createWall(5, -4, 0.5, 12);    // 介助エリア区切り

        // 床ゾーン設定
        createZoneFloor(-9.5, 6.5, 8.5, 6.5, 0xeccc68); // 居室A
        createZoneFloor(-0.5, 6.5, 8.5, 6.5, 0xeccc68); // 居室B
        createZoneFloor(8.5, 6.5, 8.5, 6.5, 0xeccc68);  // 居室C
        createZoneFloor(-9.5, -4, 8.5, 11.5, 0x70a1ff); // 詰所
        createZoneFloor(0, -4, 9.5, 11.5, 0x7bed9f);    // 談話室
        createZoneFloor(9.5, -4, 8.5, 11.5, 0xff7875);  // 介助室

        // 家具の配置用ヘルパー
        function createFurniture(x, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            walls.push(mesh); // 障害物に追加
        }

        // 居室家具（ベッド・タンス）
        [-9.5, -0.5, 8.5].forEach(x => {
            createFurniture(x - 2, 8, 2, 0.8, 3.5, 0xffffff); // ベッド
            createFurniture(x + 2, 9, 1.5, 1.5, 1, 0x84817a); // タンス
        });

        // 談話室家具
        createFurniture(0, -4, 4, 0.8, 2.5, 0xd2dae2); // テーブル

        // --- 4. キャラクターの配置 ---
        function createCharacter(color) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.4, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.7;
            body.castShadow = true;
            group.add(body);

            const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffddd0 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.6;
            head.castShadow = true;
            group.add(head);

            scene.add(group);
            return group;
        }

        // プレイヤー (青)
        const player = createCharacter(0x1e90ff);
        player.position.set(-9.5, 0, -1);

        // 利用者 (赤・黄色・緑)
        const resident1 = createCharacter(0xff4757);
        resident1.position.set(-9.5, 0, 5);

        const resident2 = createCharacter(0xffa502);
        resident2.position.set(-0.5, 0, 5);

        const resident3 = createCharacter(0x2ed573);
        resident3.position.set(0, 0, -3);

        // --- 5. 移動ロジック & 衝突判定 ---
        let targetPosition = null;
        const playerSpeed = 0.15;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                targetPosition = intersects[0].point.clone();
                targetPosition.y = 0; // 高さを固定
            }
        });

        function movePlayer() {
            if (!targetPosition) return;

            const distance = player.position.distanceTo(targetPosition);
            if (distance < 0.1) {
                targetPosition = null;
                return;
            }

            const direction = new THREE.Vector3()
                .subVectors(targetPosition, player.position)
                .normalize();

            const nextPosition = player.position.clone().add(direction.clone().multiplyScalar(playerSpeed));

            // 壁・家具とのレイキャスト衝突判定
            let canMove = true;
            const playerRaycaster = new THREE.Raycaster(
                new THREE.Vector3(player.position.x, 0.8, player.position.z),
                direction,
                0,
                0.6
            );
            
            const collisions = playerRaycaster.intersectObjects(walls);
            if (collisions.length > 0) {
                canMove = false;
                targetPosition = null; // 障害物接触で停止
            }

            if (canMove) {
                player.position.copy(nextPosition);
            }
        }

        // --- 6. リサイズ対応 & アニメーションループ ---
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            movePlayer();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
