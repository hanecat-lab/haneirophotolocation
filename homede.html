<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Care Facility Simulator - Fully Fixed Physics</title>
    <style>
        * { touch-action: none; user-select: none; }
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #ui {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 20px;
            border-radius: 8px; text-align: center; pointer-events: none; z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div style="color:#4cd137; font-weight:bold; font-size:16px;">CARE SHIFT</div>
        <div style="font-size:12px; color:#dcdde1;">3人全表示・完全衝突判定・滑空移動修正版</div>
    </div>

    <script>
        // --- 1. シーン・カメラ・レンダラー ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 14;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. 衝突判定データ ---
        const colliders = [];

        // 床
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(28, 20),
            new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        function addBoxCollider(x, z, w, h, dep, color) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, dep),
                new THREE.MeshStandardMaterial({ color: color })
            );
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            colliders.push({
                minX: x - w / 2,
                maxX: x + w / 2,
                minZ: z - dep / 2,
                maxZ: z + dep / 2
            });
            return mesh;
        }

        function createZoneFloor(x, z, w, dep, color) {
            const zone = new THREE.Mesh(
                new THREE.PlaneGeometry(w, dep),
                new THREE.MeshStandardMaterial({ color: color })
            );
            zone.rotation.x = -Math.PI / 2;
            zone.position.set(x, 0.01, z);
            zone.receiveShadow = true;
            scene.add(zone);
        }

        // --- 建築構造 ---
        // 外壁
        addBoxCollider(0, -10, 28, 1.8, 0.4, 0x636e72);
        addBoxCollider(0, 10, 28, 1.8, 0.4, 0x636e72);
        addBoxCollider(-14, 0, 0.4, 1.8, 20, 0x636e72);
        addBoxCollider(14, 0, 0.4, 1.8, 20, 0x636e72);

        // 内壁（北部屋）
        addBoxCollider(-11.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-3.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(3.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(11.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);
        addBoxCollider(4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);

        // 内壁（南部屋）
        addBoxCollider(-11.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-3.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(3.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(11.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);
        addBoxCollider(4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);

        // 床色ゾーン
        createZoneFloor(-9.25, 6.75, 9, 6, 0xf6e58d); // 黄
        createZoneFloor(0, 6.75, 8.5, 6, 0x7ed6df);    // 水色
        createZoneFloor(9.25, 6.75, 9, 6, 0xbadc58);  // 黄緑
        createZoneFloor(-9.25, -6.75, 9, 6, 0xbdc3c7); // 灰色
        createZoneFloor(0, -6.75, 8.5, 6, 0xffbe76);   // オレンジ
        createZoneFloor(9.25, -6.75, 9, 6, 0xff7979);  // 赤

        // 家具・ベッド
        addBoxCollider(-11.5, 7.5, 2.5, 0.6, 3.5, 0xffffff); // ベッド1
        addBoxCollider(-2.2, 7.5, 2.5, 0.6, 3.5, 0xffffff);  // ベッド2
        addBoxCollider(7.0, 7.5, 2.5, 0.6, 3.5, 0xffffff);   // ベッド3
        addBoxCollider(0, -6.75, 3.5, 0.7, 2.5, 0x78e08f);   // 談話室ソファ（緑）

        // --- 3. 棒人間モデル定義 ---
        function createHachiStickFigure(hexColor) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: hexColor });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), mat);
            head.position.set(0, 1.48, 0);
            group.add(head);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.63, 8), mat);
            body.position.set(0, 0.965, 0);
            group.add(body);

            const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.55, 8), mat);
            arm.position.set(0, 1.2, 0);
            arm.rotation.z = Math.PI / 2;
            group.add(arm);

            const legLGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.68, 8);
            legLGeo.translate(0, -0.34, 0);
            const legL = new THREE.Mesh(legLGeo, mat);
            legL.position.set(0, 0.65, 0);
            legL.rotation.z = 0.28;
            group.add(legL);

            const legRGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.68, 8);
            legRGeo.translate(0, -0.34, 0);
            const legR = new THREE.Mesh(legRGeo, mat);
            legR.position.set(0, 0.65, 0);
            legR.rotation.z = -0.28;
            group.add(legR);

            scene.add(group);
            return group;
        }

        // --- キャラクターの配置（安全な初期位置） ---
        // 1. プレイヤー（青）
        const player = createHachiStickFigure(0x0984e3);
        player.position.set(2.0, 0, 0.0); // 廊下の広い中央

        // 2. 利用者A（赤）
        const residentRed = {
            mesh: createHachiStickFigure(0xd63031),
            waypoints: [
                new THREE.Vector3(-8.0, 0, 6.0),  // 黄部屋の中央（ベッドから離れた安全な場所）
                new THREE.Vector3(-8.0, 0, 0.0),  // 廊下へ出る
                new THREE.Vector3(0.0, 0, 0.0),   // 廊下中央
                new THREE.Vector3(0.0, 0, -4.5)   // 談話室中央
            ],
            currentWP: 0,
            speed: 0.035,
            waitTime: 0
        };
        residentRed.mesh.position.copy(residentRed.waypoints[0]);

        // 3. 利用者B（橙）
        const residentOrange = {
            mesh: createHachiStickFigure(0xe17055),
            waypoints: [
                new THREE.Vector3(8.0, 0, -6.0),  // 赤部屋の中央（壁から離れた安全な場所）
                new THREE.Vector3(8.0, 0, 0.0),   // 廊下へ出る
                new THREE.Vector3(0.0, 0, 0.0),   // 廊下中央
                new THREE.Vector3(0.0, 0, -4.5)   // 談話室中央
            ],
            currentWP: 0,
            speed: 0.03,
            waitTime: 60
        };
        residentOrange.mesh.position.copy(residentOrange.waypoints[0]);

        const residents = [residentRed, residentOrange];

        // --- 4. 完全な衝突判定と壁沿い移動処理 ---
        const CHAR_RADIUS = 0.3; // 衝突判定半径

        function moveWithCollision(entityPos, moveStep) {
            // X軸方向移動と衝突判定
            entityPos.x += moveStep.x;
            for (let c of colliders) {
                if (entityPos.x + CHAR_RADIUS > c.minX && entityPos.x - CHAR_RADIUS < c.maxX &&
                    entityPos.z + CHAR_RADIUS > c.minZ && entityPos.z - CHAR_RADIUS < c.maxZ) {
                    if (moveStep.x > 0) entityPos.x = c.minX - CHAR_RADIUS;
                    else if (moveStep.x < 0) entityPos.x = c.maxX + CHAR_RADIUS;
                }
            }

            // Z軸方向移動と衝突判定
            entityPos.z += moveStep.z;
            for (let c of colliders) {
                if (entityPos.x + CHAR_RADIUS > c.minX && entityPos.x - CHAR_RADIUS < c.maxX &&
                    entityPos.z + CHAR_RADIUS > c.minZ && entityPos.z - CHAR_RADIUS < c.maxZ) {
                    if (moveStep.z > 0) entityPos.z = c.minZ - CHAR_RADIUS;
                    else if (moveStep.z < 0) entityPos.z = c.maxZ + CHAR_RADIUS;
                }
            }
        }

        // キャラクター同士の重なり防止
        function resolveCharacterOverlap() {
            const all = [player, ...residents.map(r => r.mesh)];
            for (let i = 0; i < all.length; i++) {
                for (let j = i + 1; j < all.length; j++) {
                    const p1 = all[i].position;
                    const p2 = all[j].position;
                    const dx = p2.x - p1.x;
                    const dz = p2.z - p1.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    const minDist = CHAR_RADIUS * 2.0;

                    if (dist < minDist && dist > 0.0001) {
                        const overlap = (minDist - dist) / 2;
                        p1.x -= (dx / dist) * overlap;
                        p1.z -= (dz / dist) * overlap;
                        p2.x += (dx / dist) * overlap;
                        p2.z += (dz / dist) * overlap;
                    }
                }
            }
        }

        // --- 5. タップ入力 ---
        let targetPos = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                targetPos = intersects[0].point.clone();
                targetPos.y = 0;
            }
        });

        // --- 6. アニメーションメインループ ---
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            // --- A. プレイヤーの移動制御 ---
            if (targetPos) {
                const dir = new THREE.Vector3().subVectors(targetPos, player.position);
                dir.y = 0;
                const dist = dir.length();

                if (dist < 0.2) {
                    targetPos = null; // 目的地到着
                } else {
                    dir.normalize().multiplyScalar(0.12);
                    moveWithCollision(player.position, dir);
                }
            }

            // --- B. NPC（自動移動）の移動制御 ---
            residents.forEach(r => {
                if (r.waitTime > 0) {
                    r.waitTime--;
                    return;
                }

                const wp = r.waypoints[r.currentWP];
                const dir = new THREE.Vector3().subVectors(wp, r.mesh.position);
                dir.y = 0;
                const dist = dir.length();

                if (dist < 0.3) {
                    if (!r.reverse) {
                        r.currentWP++;
                        if (r.currentWP >= r.waypoints.length) {
                            r.currentWP = r.waypoints.length - 2;
                            r.reverse = true;
                            r.waitTime = 120; // 談話室で停止
                        }
                    } else {
                        r.currentWP--;
                        if (r.currentWP < 0) {
                            r.currentWP = 1;
                            r.reverse = false;
                            r.waitTime = 120; // 部屋で停止
                        }
                    }
                } else {
                    dir.normalize().multiplyScalar(r.speed);
                    moveWithCollision(r.mesh.position, dir);
                }
            });

            // キャラクター同士の押し戻し
            resolveCharacterOverlap();

            // 向きをカメラ視線に合わせる（2.5D表示の維持）
            [player, ...residents.map(r => r.mesh)].forEach(m => {
                m.quaternion.copy(camera.quaternion);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
