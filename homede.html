<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>老人ホーム 1日介護シミュレーター</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: sans-serif; user-select: none; background: #222; }
    
    #canvas-container { width: 100vw; height: 100vh; }

    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
    
    .clock-card {
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid #444;
    }
    .clock-time { font-size: 32px; font-weight: bold; color: #4deeea; }
    .clock-label { font-size: 12px; color: #aaa; }

    .bottom-bar {
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 20px 30px;
      border-radius: 16px;
      border: 1px solid #444;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-text { font-size: 18px; color: #f1f1f1; max-width: 70%; }
    
    .action-btn {
      pointer-events: auto;
      background: #ff007f;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      display: none;
    }

    .controls-hint {
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
  <!-- Three.js (r128) 軽量完全埋め込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-layer">
    <div class="top-bar">
      <div class="clock-card">
        <div class="clock-label">現在時刻</div>
        <div class="clock-time" id="clock">07:00</div>
      </div>
      <div class="controls-hint">
        <strong>【操作方法】</strong><br>
        ・マップをクリック：移動<br>
        ・[N] キー：ナースコールテスト<br>
        ・近づいて[E]キー / ボタン：誘導開始
      </div>
    </div>

    <div class="bottom-bar">
      <div class="status-text" id="status">画面を読み込んでいます...</div>
      <button class="action-btn" id="action-btn" onclick="startEscort()">[E] 介助エリアへ誘導</button>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Three.js 読み込みチェック
      if (typeof THREE === 'undefined') {
        document.getElementById('status').innerText = 'エラー: Three.jsの読み込みに失敗しました。ネット接続を確認するかブラウザを変更してください。';
        return;
      }

      // --- 1. アプリ状態管理 ---
      const STATE = { IDLE: 0, NURSE_CALL: 1, ESCORTING: 2, IN_CARE: 3 };
      let currentState = STATE.IDLE;
      let timeInMinutes = 7 * 60;
      const TIME_SCALE = 2;

      // --- 2. シーン・カメラ・レンダラー初期化 ---
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xdce1e3);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 22, 22);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // ライト
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // --- 3. マップ作成 ---
      // 床 (灰褐色)
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 20),
        new THREE.MeshStandardMaterial({ color: 0xc8c3bc })
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // オブジェクト作成関数
      function addBox(w, h, d, color, x, y, z) {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshStandardMaterial({ color: color })
        );
        mesh.position.set(x, y, z);
        scene.add(mesh);
        return mesh;
      }

      // 居室（ベッド・タンス）
      addBox(2, 0.8, 3, 0x4a90e2, -10, 0.4, -6); 
      addBox(1.5, 1.8, 1, 0x8b5a2b, -13, 0.9, -8); 

      // 談話室（テーブル・テレビ）
      addBox(4, 0.8, 2.5, 0xc08a5b, 0, 0.4, 5); 
      addBox(0.3, 1.5, 2.5, 0x222222, 5, 0.75, 5); 

      // 詰所（デスク・パソコン）
      addBox(3, 0.8, 1.5, 0x999999, -10, 0.4, 5); 
      addBox(0.6, 0.4, 0.8, 0x333333, -10, 1.0, 5); 

      // 介助エリア（床・カーテン）
      addBox(4, 0.02, 4, 0x76c7c0, 10, 0.01, -5); 
      const curtain = addBox(4.1, 2.5, 4.1, 0xe91e63, 10, 1.25, -5);
      curtain.material.transparent = true;
      curtain.material.opacity = 0.8;
      curtain.visible = false;

      // 目的地座標
      const LOCATIONS = {
        bedroom: new THREE.Vector3(-10, 0, -4),
        lounge: new THREE.Vector3(0, 0, 2),
        careArea: new THREE.Vector3(10, 0, -5)
      };

      // キャラクター作成（スタッフ＝青、利用者＝黄）
      function createHuman(color, x, z) {
        const group = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(0.4, 0.4, 1.4),
          new THREE.MeshStandardMaterial({ color: color })
        );
        body.position.y = 0.7;
        group.add(body);

        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.35),
          new THREE.MeshStandardMaterial({ color: 0xffdbac })
        );
        head.position.y = 1.6;
        group.add(head);

        group.position.set(x, 0, z);
        scene.add(group);
        return group;
      }

      const player = createHuman(0x1976d2, -8, 5);
      const resident = createHuman(0xfbc02d, -10, -4);

      let playerTarget = player.position.clone();
      let residentTarget = resident.position.clone();

      // --- 4. クリック操作 ---
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON') return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(floor);

        if (intersects.length > 0) {
          playerTarget.copy(intersects[0].point);
          playerTarget.y = 0;
        }
      });

      // キー操作
      window.addEventListener('keydown', (e) => {
        if (e.key === 'n' || e.key === 'N') {
          if (currentState === STATE.IDLE) triggerNurseCall("【手動】ナースコールが発生しました！");
        }
        if (e.key === 'e' || e.key === 'E') {
          if (currentState === STATE.NURSE_CALL && isNear()) window.startEscort();
        }
      });

      // --- 5. ゲーム制御機能 ---
      function triggerNurseCall(msg) {
        currentState = STATE.NURSE_CALL;
        updateStatus(msg);
      }

      window.startEscort = function() {
        currentState = STATE.ESCORTING;
        updateStatus("利用者を介助エリアへ誘導中...");
        residentTarget.copy(LOCATIONS.careArea);
      };

      function startCare() {
        currentState = STATE.IN_CARE;
        curtain.visible = true;
        updateStatus("介助中...（カーテンを閉めています）");

        setTimeout(() => {
          curtain.visible = false;
          currentState = STATE.IDLE;
          updateStatus("介助完了！利用者が談話室へ戻ります。");
          residentTarget.copy(LOCATIONS.lounge);
        }, 3000);
      }

      function isNear() {
        return player.position.distanceTo(resident.position) < 3.0;
      }

      let triggered = {};
      function checkSchedule(timeStr) {
        if (triggered[timeStr]) return;
        if (timeStr === "07:30" && currentState === STATE.IDLE) {
          triggered[timeStr] = true;
          updateStatus("【07:30】利用者が移動を開始しました。");
          residentTarget.copy(LOCATIONS.lounge);
        }
        if (timeStr === "10:00" && currentState === STATE.IDLE) {
          triggered[timeStr] = true;
          triggerNurseCall("【10:00】ナースコール！排泄介助が必要です。");
        }
      }

      function updateStatus(msg) {
        document.getElementById('status').innerText = msg;
      }

      // 初期ステータス設定
      updateStatus("07:30の起床時間まで待機中...（床をクリックで動けます）");

      // --- 6. ループ描画 ---
      function animate() {
        requestAnimationFrame(animate);

        // 時計更新
        timeInMinutes += (TIME_SCALE / 60);
        if (timeInMinutes >= 24 * 60) timeInMinutes = 0;
        const h = Math.floor(timeInMinutes / 60).toString().padStart(2, '0');
        const m = Math.floor(timeInMinutes % 60).toString().padStart(2, '0');
        const timeStr = `${h}:${m}`;
        document.getElementById('clock').innerText = timeStr;

        checkSchedule(timeStr);

        // 位置の追従移動
        player.position.lerp(playerTarget, 0.1);
        resident.position.lerp(residentTarget, 0.04);

        // 到着判定
        if (currentState === STATE.ESCORTING && resident.position.distanceTo(LOCATIONS.careArea) < 0.8) {
          startCare();
        }

        // ボタン制御
        const actionBtn = document.getElementById('action-btn');
        actionBtn.style.display = (currentState === STATE.NURSE_CALL && isNear()) ? 'block' : 'none';

        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    });
  </script>
</body>
</html>
