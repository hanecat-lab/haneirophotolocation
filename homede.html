<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Care Facility Simulator - Fixed Navigation</title>
    <style>
        * { touch-action: none; user-select: none; }
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #ui {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 20px;
            border-radius: 8px; text-align: center; pointer-events: none; z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div style="color:#4cd137; font-weight:bold; font-size:16px;">CARE SHIFT</div>
        <div style="font-size:12px; color:#dcdde1;">マップ全復元・ドア通過可能対応版</div>
    </div>

    <script>
        // --- 1. シーン・カメラ・レンダラー ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 14;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. 衝突用コライダーとオブジェクト ---
        const colliders = [];

        // 床
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(28, 20),
            new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 障害物（壁・ベッド）の追加関数
        function addBoxCollider(x, z, w, h, dep, color) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, dep),
                new THREE.MeshStandardMaterial({ color: color })
            );
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            colliders.push({
                minX: x - w / 2,
                maxX: x + w / 2,
                minZ: z - dep / 2,
                maxZ: z + dep / 2
            });
            return mesh;
        }

        // 床カラーゾーンの追加関数
        function createZoneFloor(x, z, w, dep, color) {
            const zone = new THREE.Mesh(
                new THREE.PlaneGeometry(w, dep),
                new THREE.MeshStandardMaterial({ color: color })
            );
            zone.rotation.x = -Math.PI / 2;
            zone.position.set(x, 0.01, z);
            zone.receiveShadow = true;
            scene.add(zone);
        }

        // --- マップ構造の完全構築 ---
        // 外壁
        addBoxCollider(0, -10, 28, 1.8, 0.4, 0x636e72); // 南
        addBoxCollider(0, 10, 28, 1.8, 0.4, 0x636e72);  // 北
        addBoxCollider(-14, 0, 0.4, 1.8, 20, 0x636e72); // 西
        addBoxCollider(14, 0, 0.4, 1.8, 20, 0x636e72);  // 東

        // 間仕切り壁（通路上・ドア口に十分な幅を確保）
        addBoxCollider(-12.5, 3.5, 3.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-6.5, 3.5, 2.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-2.5, 3.5, 2.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(2.5, 3.5, 2.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(6.5, 3.5, 2.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(12.5, 3.5, 3.0, 1.8, 0.4, 0x636e72);

        addBoxCollider(-4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);
        addBoxCollider(4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);

        addBoxCollider(-11.0, -3.5, 6.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-1.5, -3.5, 6.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(11.0, -3.5, 6.0, 1.8, 0.4, 0x636e72);

        addBoxCollider(-4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);
        addBoxCollider(4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);

        // 6箇所の床カラー（全室復元）
        createZoneFloor(-9.25, 6.75, 9, 6, 0xf6e58d); // 黄
        createZoneFloor(0, 6.75, 8.5, 6, 0x7ed6df);    // 水色
        createZoneFloor(9.25, 6.75, 9, 6, 0xbadc58);  // 黄緑
        createZoneFloor(-9.25, -6.75, 9, 6, 0xbdc3c7); // 灰色（復元）
        createZoneFloor(0, -6.75, 8.5, 6, 0xffbe76);   // オレンジ
        createZoneFloor(9.25, -6.75, 9, 6, 0xff7979);  // 赤（復元）

        // 家具・ベッド（全室復元）
        addBoxCollider(-11.5, 7.5, 2.5, 0.6, 3.5, 0xffffff); // 部屋1 ベッド
        addBoxCollider(-2.2, 7.5, 2.5, 0.6, 3.5, 0xffffff);  // 部屋2 ベッド
        addBoxCollider(7.0, 7.5, 2.5, 0.6, 3.5, 0xffffff);   // 部屋3 ベッド
        addBoxCollider(0, -6.75, 3.5, 0.7, 2.5, 0x78e08f);   // 談話室（緑の大きなベッド/ソファ）

        // --- 3. 八の字棒人間作成 ---
        function createHachiStickFigure(hexColor) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: hexColor });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), mat);
            head.position.set(0, 1.48, 0);
            group.add(head);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.63, 8), mat);
            body.position.set(0, 0.965, 0);
            group.add(body);

            const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.55, 8), mat);
            arm.position.set(0, 1.2, 0);
            arm.rotation.z = Math.PI / 2;
            group.add(arm);

            const legLGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.68, 8);
            legLGeo.translate(0, -0.34, 0);
            const legL = new THREE.Mesh(legLGeo, mat);
            legL.position.set(0, 0.65, 0);
            legL.rotation.z = 0.28;
            group.add(legL);

            const legRGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.68, 8);
            legRGeo.translate(0, -0.34, 0);
            const legR = new THREE.Mesh(legRGeo, mat);
            legR.position.set(0, 0.65, 0);
            legR.rotation.z = -0.28;
            group.add(legR);

            scene.add(group);
            return group;
        }

        const player = createHachiStickFigure(0x0984e3);
        player.position.set(0, 0, 0);

        // 利用者巡回データ（緑のベッド/談話室エリアへ完全進入可能な座標）
        const residents = [
            {
                mesh: createHachiStickFigure(0xd63031), // 利用者A (赤)
                waypoints: [
                    new THREE.Vector3(-9.25, 0, 4.0), // 居室A
                    new THREE.Vector3(-9.25, 0, 0.0), // 廊下
                    new THREE.Vector3(0, 0, 0.0),      // 廊下中央
                    new THREE.Vector3(0, 0, -4.5)     // 談話室（緑エリア内）
                ],
                currentWP: 0,
                speed: 0.035,
                waitTime: 0
            },
            {
                mesh: createHachiStickFigure(0xe17055), // 利用者B (オレンジ)
                waypoints: [
                    new THREE.Vector3(0, 0, 4.0),     // 居室B
                    new THREE.Vector3(0, 0, 0.0),     // 廊下中央
                    new THREE.Vector3(0, 0, -4.5)     // 談話室（緑エリア内）
                ],
                currentWP: 0,
                speed: 0.03,
                waitTime: 80
            }
        ];

        residents.forEach(r => r.mesh.position.copy(r.waypoints[0]));

        // --- 4. 精密衝突判定・押し戻しアルゴリズム（適正判定サイズ） ---
        const CHAR_RADIUS = 0.15; // ドア口を余裕で通過できる適正半径

        function resolveMovement(pos, moveVec) {
            pos.x += moveVec.x;
            pos.z += moveVec.z;

            // 壁・家具との押し戻し計算
            for (let iter = 0; iter < 2; iter++) {
                for (let i = 0; i < colliders.length; i++) {
                    const c = colliders[i];

                    const closestX = Math.max(c.minX, Math.min(pos.x, c.maxX));
                    const closestZ = Math.max(c.minZ, Math.min(pos.z, c.maxZ));

                    const distX = pos.x - closestX;
                    const distZ = pos.z - closestZ;
                    const distanceSq = distX * distX + distZ * distZ;

                    if (distanceSq < CHAR_RADIUS * CHAR_RADIUS) {
                        const distance = Math.sqrt(distanceSq);

                        if (distance > 0.0001) {
                            const overlap = CHAR_RADIUS - distance;
                            pos.x += (distX / distance) * overlap;
                            pos.z += (distZ / distance) * overlap;
                        } else {
                            pos.z += CHAR_RADIUS;
                        }
                    }
                }
            }
        }

        // キャラクター同士のすり抜け・重なり防止処理
        function resolveCharacterCollisions() {
            const allChars = [player, ...residents.map(r => r.mesh)];
            for (let i = 0; i < allChars.length; i++) {
                for (let j = i + 1; j < allChars.length; j++) {
                    const p1 = allChars[i].position;
                    const p2 = allChars[j].position;
                    const dx = p2.x - p1.x;
                    const dz = p2.z - p1.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    const minDist = CHAR_RADIUS * 2.2;

                    if (dist < minDist && dist > 0.0001) {
                        const overlap = (minDist - dist) / 2;
                        p1.x -= (dx / dist) * overlap;
                        p1.z -= (dz / dist) * overlap;
                        p2.x += (dx / dist) * overlap;
                        p2.z += (dz / dist) * overlap;
                    }
                }
            }
        }

        // --- 5. タップ入力操作 ---
        let targetPos = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                targetPos = intersects[0].point.clone();
                targetPos.y = 0;
            }
        });

        // --- 6. アニメーションメインループ ---
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            // プレイヤー移動
            if (targetPos) {
                const dir = new THREE.Vector3().subVectors(targetPos, player.position);
                dir.y = 0;
                const dist = dir.length();

                if (dist < 0.15) {
                    targetPos = null;
                } else {
                    dir.normalize().multiplyScalar(0.12);
                    resolveMovement(player.position, dir);
                }
            }

            // 利用者（NPC）移動
            residents.forEach(r => {
                if (r.waitTime > 0) {
                    r.waitTime--;
                    return;
                }

                const wp = r.waypoints[r.currentWP];
                const dir = new THREE.Vector3().subVectors(wp, r.mesh.position);
                dir.y = 0;
                const dist = dir.length();

                if (dist < 0.3) {
                    if (!r.reverse) {
                        r.currentWP++;
                        if (r.currentWP >= r.waypoints.length) {
                            r.currentWP = r.waypoints.length - 2;
                            r.reverse = true;
                            r.waitTime = 120; // 2秒停止
                        }
                    } else {
                        r.currentWP--;
                        if (r.currentWP < 0) {
                            r.currentWP = 1;
                            r.reverse = false;
                            r.waitTime = 120;
                        }
                    }
                } else {
                    dir.normalize().multiplyScalar(r.speed);
                    resolveMovement(r.mesh.position, dir);
                }
            });

            // キャラクター同士の衝突回避
            resolveCharacterCollisions();

            // 正面向きをカメラ視線に完全固定
            [player, ...residents.map(r => r.mesh)].forEach(m => {
                m.quaternion.copy(camera.quaternion);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
