<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Care Facility Simulator - Phase 3 Complete</title>
    <style>
        * { touch-action: none; user-select: none; }
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #ui {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 20px;
            border-radius: 8px; text-align: center; pointer-events: none; z-index: 10;
            display: flex; gap: 20px; align-items: center;
        }
        .ui-item { font-size: 14px; }
        .ui-val { font-weight: bold; color: #4cd137; font-size: 16px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div class="ui-item">TIME: <span id="clock" class="ui-val">09:00</span></div>
        <div class="ui-item">SCORE: <span id="score" class="ui-val">0</span></div>
    </div>

    <script>
        // --- 1. シーン・カメラ・レンダラー ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 14;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. 衝突判定データ ---
        const colliders = [];

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(28, 20),
            new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        function addBoxCollider(x, z, w, h, dep, color) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, dep),
                new THREE.MeshStandardMaterial({ color: color })
            );
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            colliders.push({
                minX: x - w / 2, maxX: x + w / 2,
                minZ: z - dep / 2, maxZ: z + dep / 2
            });
            return mesh;
        }

        function createZoneFloor(x, z, w, dep, color) {
            const zone = new THREE.Mesh(
                new THREE.PlaneGeometry(w, dep),
                new THREE.MeshStandardMaterial({ color: color })
            );
            zone.rotation.x = -Math.PI / 2;
            zone.position.set(x, 0.01, z);
            zone.receiveShadow = true;
            scene.add(zone);
        }

        // 外壁・内壁・床・ベッドの構築
        addBoxCollider(0, -10, 28, 1.8, 0.4, 0x636e72);
        addBoxCollider(0, 10, 28, 1.8, 0.4, 0x636e72);
        addBoxCollider(-14, 0, 0.4, 1.8, 20, 0x636e72);
        addBoxCollider(14, 0, 0.4, 1.8, 20, 0x636e72);

        addBoxCollider(-11.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-3.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(3.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(11.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);
        addBoxCollider(4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);

        addBoxCollider(-11.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-3.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(3.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(11.5, -3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);
        addBoxCollider(4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);

        createZoneFloor(-9.25, 6.75, 9, 6, 0xf6e58d);
        createZoneFloor(0, 6.75, 8.5, 6, 0x7ed6df);
        createZoneFloor(9.25, 6.75, 9, 6, 0xbadc58);
        createZoneFloor(-9.25, -6.75, 9, 6, 0xbdc3c7);
        createZoneFloor(0, -6.75, 8.5, 6, 0xffbe76);
        createZoneFloor(9.25, -6.75, 9, 6, 0xff7979);

        addBoxCollider(-11.5, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        addBoxCollider(-2.2, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        addBoxCollider(7.0, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        addBoxCollider(0, -6.75, 3.5, 0.7, 2.5, 0x78e08f);

        // --- 3. 棒人間 ＆ ナースコールポップアップ生成 ---
        function createHachiStickFigure(hexColor) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: hexColor });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), mat);
            head.position.set(0, 1.48, 0);
            group.add(head);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.63, 8), mat);
            body.position.set(0, 0.965, 0);
            group.add(body);

            const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.55, 8), mat);
            arm.position.set(0, 1.2, 0);
            arm.rotation.z = Math.PI / 2;
            group.add(arm);

            const legLGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.68, 8);
            legLGeo.translate(0, -0.34, 0);
            const legL = new THREE.Mesh(legLGeo, mat);
            legL.position.set(0, 0.65, 0);
            legL.rotation.z = 0.28;
            group.add(legL);

            const legRGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.68, 8);
            legRGeo.translate(0, -0.34, 0);
            const legR = new THREE.Mesh(legRGeo, mat);
            legR.position.set(0, 0.65, 0);
            legR.rotation.z = -0.28;
            group.add(legR);

            // 呼出ポップアップ用アイコン（黄色のアタッチ球）
            const callBubble = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xf1c40f })
            );
            callBubble.position.set(0, 2.1, 0);
            callBubble.visible = false; // 初期状態は非表示
            group.add(callBubble);
            group.callBubble = callBubble;

            scene.add(group);
            return group;
        }

        const player = createHachiStickFigure(0x0984e3);
        player.position.set(2.0, 0, 0.0);

        const residents = [
            {
                mesh: createHachiStickFigure(0xd63031),
                waypoints: [
                    new THREE.Vector3(-8.0, 0, 6.0),
                    new THREE.Vector3(-8.0, 0, 0.0),
                    new THREE.Vector3(0.0, 0, 0.0),
                    new THREE.Vector3(0.0, 0, -4.5)
                ],
                currentWP: 0, speed: 0.035, waitTime: 0,
                isCalling: false, callTimer: 180
            },
            {
                mesh: createHachiStickFigure(0xe17055),
                waypoints: [
                    new THREE.Vector3(8.0, 0, -6.0),
                    new THREE.Vector3(8.0, 0, 0.0),
                    new THREE.Vector3(0.0, 0, 0.0),
                    new THREE.Vector3(0.0, 0, -4.5)
                ],
                currentWP: 0, speed: 0.03, waitTime: 60,
                isCalling: false, callTimer: 300
            }
        ];
        residents.forEach(r => r.mesh.position.copy(r.waypoints[0]));

        // --- 4. 衝突移動＆システムパラメータ ---
        const CHAR_RADIUS = 0.3;
        let score = 0;
        let gameTimeMinutes = 9 * 60; // 09:00 スタート

        function moveWithCollision(entityPos, moveStep) {
            entityPos.x += moveStep.x;
            for (let c of colliders) {
                if (entityPos.x + CHAR_RADIUS > c.minX && entityPos.x - CHAR_RADIUS < c.maxX &&
                    entityPos.z + CHAR_RADIUS > c.minZ && entityPos.z - CHAR_RADIUS < c.maxZ) {
                    if (moveStep.x > 0) entityPos.x = c.minX - CHAR_RADIUS;
                    else if (moveStep.x < 0) entityPos.x = c.maxX + CHAR_RADIUS;
                }
            }
            entityPos.z += moveStep.z;
            for (let c of colliders) {
                if (entityPos.x + CHAR_RADIUS > c.minX && entityPos.x - CHAR_RADIUS < c.maxX &&
                    entityPos.z + CHAR_RADIUS > c.minZ && entityPos.z - CHAR_RADIUS < c.maxZ) {
                    if (moveStep.z > 0) entityPos.z = c.minZ - CHAR_RADIUS;
                    else if (moveStep.z < 0) entityPos.z = c.maxZ + CHAR_RADIUS;
                }
            }
        }

        // --- 5. タップ入力 ---
        let targetPos = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                targetPos = intersects[0].point.clone();
                targetPos.y = 0;
            }
        });

        // --- 6. ループ＆ゲーム進行制御 ---
        function animate() {
            requestAnimationFrame(animate);

            // 時計の進行（フレームカウント簡易換算）
            gameTimeMinutes += 0.03;
            const hours = Math.floor(gameTimeMinutes / 60) % 24;
            const mins = Math.floor(gameTimeMinutes % 60);
            document.getElementById('clock').innerText = 
                `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;

            // プレイヤー移動
            if (targetPos) {
                const dir = new THREE.Vector3().subVectors(targetPos, player.position);
                dir.y = 0;
                if (dir.length() < 0.2) {
                    targetPos = null;
                } else {
                    dir.normalize().multiplyScalar(0.12);
                    moveWithCollision(player.position, dir);
                }
            }

            // NPC移動 ＆ ナースコール発生
            residents.forEach(r => {
                // 呼出ロジック
                if (!r.isCalling) {
                    r.callTimer--;
                    if (r.callTimer <= 0) {
                        r.isCalling = true;
                        r.mesh.callBubble.visible = true;
                    }
                } else {
                    // プレイヤーが近づいたら介助完了
                    const distToPlayer = player.position.distanceTo(r.mesh.position);
                    if (distToPlayer < 1.2) {
                        r.isCalling = false;
                        r.mesh.callBubble.visible = false;
                        r.callTimer = 300 + Math.random() * 200; // 次の呼出までタイマーセット
                        score += 10;
                        document.getElementById('score').innerText = score;
                    }
                }

                // 巡回制御
                if (r.waitTime > 0) {
                    r.waitTime--;
                    return;
                }
                const wp = r.waypoints[r.currentWP];
                const dir = new THREE.Vector3().subVectors(wp, r.mesh.position);
                dir.y = 0;
                if (dir.length() < 0.3) {
                    if (!r.reverse) {
                        r.currentWP++;
                        if (r.currentWP >= r.waypoints.length) {
                            r.currentWP = r.waypoints.length - 2;
                            r.reverse = true;
                            r.waitTime = 120;
                        }
                    } else {
                        r.currentWP--;
                        if (r.currentWP < 0) {
                            r.currentWP = 1;
                            r.reverse = false;
                            r.waitTime = 120;
                        }
                    }
                } else {
                    dir.normalize().multiplyScalar(r.speed);
                    moveWithCollision(r.mesh.position, dir);
                }
            });

            // 向きをカメラ視線に固定
            [player, ...residents.map(r => r.mesh)].forEach(m => {
                m.quaternion.copy(camera.quaternion);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
