<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Care Facility Simulator - Navigation Fixed</title>
    <style>
        * {
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            text-align: center;
            z-index: 10;
        }
        #ui-title {
            font-size: 16px;
            font-weight: bold;
            color: #4cd137;
            margin-bottom: 2px;
        }
        #ui-status {
            font-size: 12px;
            color: #dcdde1;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div id="ui-title">CARE SHIFT</div>
        <div id="ui-status">Phase 2: 衝突判定完全修正版</div>
    </div>

    <script>
        // --- 1. シーン・カメラ・レンダラーの設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 14;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. 照明の設定 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. マップ構造データの定義 ---
        const obstacleBoxes = [];

        // 床
        const floorGeometry = new THREE.PlaneGeometry(28, 20);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 障害物（壁・家具）の生成とBBox登録
        function createObstacle(x, z, width, height, depth, color) {
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, height / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            // 判定用のBoundingBoxを生成して保持
            const box = new THREE.Box3();
            box.setFromObject(mesh);
            obstacleBoxes.push(box);
            return mesh;
        }

        // 床ゾーン生成
        function createZoneFloor(x, z, width, depth, color) {
            const zoneGeo = new THREE.PlaneGeometry(width, depth);
            const zoneMat = new THREE.MeshStandardMaterial({ color: color });
            const zone = new THREE.Mesh(zoneGeo, zoneMat);
            zone.rotation.x = -Math.PI / 2;
            zone.position.set(x, 0.01, z);
            zone.receiveShadow = true;
            scene.add(zone);
        }

        // 【壁配置】
        // 外壁
        createObstacle(0, -10, 28, 1.8, 0.4, 0x636e72);
        createObstacle(0, 10, 28, 1.8, 0.4, 0x636e72);
        createObstacle(-14, 0, 0.4, 1.8, 20, 0x636e72);
        createObstacle(14, 0, 0.4, 1.8, 20, 0x636e72);

        // 間仕切り壁（開口部・ドアスペースを十分確保）
        createObstacle(-12.0, 3.5, 4.0, 1.8, 0.4, 0x636e72);
        createObstacle(-6.5, 3.5, 2.0, 1.8, 0.4, 0x636e72);
        createObstacle(-2.5, 3.5, 2.0, 1.8, 0.4, 0x636e72);
        createObstacle(2.5, 3.5, 2.0, 1.8, 0.4, 0x636e72);
        createObstacle(6.5, 3.5, 2.0, 1.8, 0.4, 0x636e72);
        createObstacle(12.0, 3.5, 4.0, 1.8, 0.4, 0x636e72);

        createObstacle(-4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);
        createObstacle(4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);

        createObstacle(-11.0, -3.5, 6.0, 1.8, 0.4, 0x636e72);
        createObstacle(-1.5, -3.5, 6.0, 1.8, 0.4, 0x636e72);
        createObstacle(11.0, -3.5, 6.0, 1.8, 0.4, 0x636e72);

        createObstacle(-4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);
        createObstacle(4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);

        // 床色
        createZoneFloor(-9.25, 6.75, 9, 6, 0xf6e58d);
        createZoneFloor(0, 6.75, 8.5, 6, 0x7ed6df);
        createZoneFloor(9.25, 6.75, 9, 6, 0xbadc58);
        createZoneFloor(-9.25, -6.75, 9, 6, 0xbdc3c7);
        createZoneFloor(0, -6.75, 8.5, 6, 0xffbe76);
        createZoneFloor(9.25, -6.75, 9, 6, 0xff7979);

        // 【家具・ベッド配置】（奥側 Z=7.5〜8.0 付近に配置）
        createObstacle(-11.5, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        createObstacle(-2.2, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        createObstacle(7.0, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        createObstacle(0, -6.75, 3.5, 0.7, 2.5, 0x78e08f);

        // --- 4. 八の字棒人間作成 ---
        function createHachiStickFigure(hexColor) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: hexColor });

            // 1. 頭部
            const headGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const head = new THREE.Mesh(headGeo, mat);
            head.position.set(0, 1.48, 0);
            group.add(head);

            // 2. 胴体
            const bodyLength = 0.63;
            const bodyGeo = new THREE.CylinderGeometry(0.05, 0.05, bodyLength, 8);
            const body = new THREE.Mesh(bodyGeo, mat);
            body.position.set(0, 0.65 + bodyLength / 2, 0);
            group.add(body);

            // 3. 腕
            const armGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.55, 8);
            const arm = new THREE.Mesh(armGeo, mat);
            arm.position.set(0, 1.2, 0);
            arm.rotation.z = Math.PI / 2;
            group.add(arm);

            // 4. 脚部（八の字）
            const legLength = 0.68;
            const legAngle = 0.28;

            const legLeftGeo = new THREE.CylinderGeometry(0.04, 0.04, legLength, 8);
            legLeftGeo.translate(0, -legLength / 2, 0);
            const legLeft = new THREE.Mesh(legLeftGeo, mat);
            legLeft.position.set(0, 0.65, 0);
            legLeft.rotation.z = legAngle;
            group.add(legLeft);

            const legRightGeo = new THREE.CylinderGeometry(0.04, 0.04, legLength, 8);
            legRightGeo.translate(0, -legLength / 2, 0);
            const legRight = new THREE.Mesh(legRightGeo, mat);
            legRight.position.set(0, 0.65, 0);
            legRight.rotation.z = -legAngle;
            group.add(legRight);

            scene.add(group);
            return group;
        }

        // プレイヤー (青)
        const player = createHachiStickFigure(0x0984e3);
        player.position.set(0, 0, 0);

        // --- 5. 安全な経路データ（ベッド・壁から完全に独立した座標） ---
        const residents = [
            {
                mesh: createHachiStickFigure(0xd63031), // 利用者A (赤)
                waypoints: [
                    new THREE.Vector3(-9.0, 0, 2.2), // 部屋A内（ドア付近・ベッドから遠い位置）
                    new THREE.Vector3(-9.0, 0, 0.0), // 廊下
                    new THREE.Vector3(0.0, 0, 0.0),  // 廊下中央
                    new THREE.Vector3(0.0, 0, -4.5)  // 談話室入口
                ],
                currentWaypoint: 0,
                speed: 0.03,
                waitTime: 0
            },
            {
                mesh: createHachiStickFigure(0xe17055), // 利用者B (オレンジ)
                waypoints: [
                    new THREE.Vector3(0.0, 0, 2.2),   // 部屋B内（ドア前）
                    new THREE.Vector3(0.0, 0, 0.0),   // 廊下中央
                    new THREE.Vector3(0.0, 0, -4.5)  // 談話室入口
                ],
                currentWaypoint: 0,
                speed: 0.025,
                waitTime: 60
            },
            {
                mesh: createHachiStickFigure(0x00b894), // 利用者C (緑)
                waypoints: [
                    new THREE.Vector3(0.0, 0, -4.5),  // 談話室入口
                    new THREE.Vector3(0.0, 0, 0.0),   // 廊下中央
                    new THREE.Vector3(9.0, 0, 0.0),   // 廊下右側
                    new THREE.Vector3(9.0, 0, 2.2)    // 部屋C内（ドア前）
                ],
                currentWaypoint: 0,
                speed: 0.035,
                waitTime: 120
            }
        ];

        // 初期位置を厳密に適用
        residents.forEach(r => {
            r.mesh.position.copy(r.waypoints[0]);
        });

        const allCharacters = [player, ...residents.map(r => r.mesh)];

        // --- 6. 衝突判定 & 移動処理 ---
        let targetPosition = null;
        const playerSpeed = 0.12;
        const bodyRadius = 0.25; // 衝突チェック時の安全余白

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handlePointer(event) {
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                targetPosition = intersects[0].point.clone();
                targetPosition.y = 0;
            }
        }

        window.addEventListener('pointerdown', handlePointer);

        // 位置が壁や家具のBoundingBoxと衝突していないか検証
        function isPositionColliding(pos) {
            const pointMin = new THREE.Vector3(pos.x - bodyRadius, 0, pos.z - bodyRadius);
            const pointMax = new THREE.Vector3(pos.x + bodyRadius, 1.5, pos.z + bodyRadius);
            const testBox = new THREE.Box3(pointMin, pointMax);

            for (let i = 0; i < obstacleBoxes.length; i++) {
                if (obstacleBoxes[i].intersectsBox(testBox)) {
                    return true;
                }
            }
            return false;
        }

        // プレイヤー移動処理
        function movePlayer() {
            if (!targetPosition) return;

            const dist = player.position.distanceTo(targetPosition);
            if (dist < 0.15) {
                targetPosition = null;
                return;
            }

            const dir = new THREE.Vector3().subVectors(targetPosition, player.position).normalize();
            const nextPos = player.position.clone().add(dir.multiplyScalar(playerSpeed));

            if (!isPositionColliding(nextPos)) {
                player.position.copy(nextPos);
            } else {
                targetPosition = null; // 壁に突き当たったらクリア
            }
        }

        // 利用者の移動処理
        function moveResidents() {
            residents.forEach(r => {
                if (r.waitTime > 0) {
                    r.waitTime--;
                    return;
                }

                const target = r.waypoints[r.currentWaypoint];
                const dist = r.mesh.position.distanceTo(target);

                if (dist < 0.25) {
                    if (!r.reverse) {
                        r.currentWaypoint++;
                        if (r.currentWaypoint >= r.waypoints.length) {
                            r.currentWaypoint = r.waypoints.length - 2;
                            r.reverse = true;
                            r.waitTime = 120;
                        }
                    } else {
                        r.currentWaypoint--;
                        if (r.currentWaypoint < 0) {
                            r.currentWaypoint = 1;
                            r.reverse = false;
                            r.waitTime = 120;
                        }
                    }
                    return;
                }

                const dir = new THREE.Vector3().subVectors(target, r.mesh.position).normalize();
                const nextPos = r.mesh.position.clone().add(dir.multiplyScalar(r.speed));

                // 衝突しない場合のみ進む
                if (!isPositionColliding(nextPos)) {
                    r.mesh.position.copy(nextPos);
                }
            });
        }

        // --- 7. メインループ & リサイズ ---
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            movePlayer();
            moveResidents();

            // 棒人間の正面向きをカメラに合わせる
            allCharacters.forEach(char => {
                char.quaternion.copy(camera.quaternion);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
