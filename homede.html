<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Care Facility Simulator - Phase 2</title>
    <style>
        * {
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            text-align: center;
            z-index: 10;
        }
        #ui-title {
            font-size: 16px;
            font-weight: bold;
            color: #4cd137;
            margin-bottom: 2px;
        }
        #ui-status {
            font-size: 12px;
            color: #dcdde1;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div id="ui-title">CARE SHIFT</div>
        <div id="ui-status">Phase 2: 利用者の自動移動（固定ルート）</div>
    </div>

    <script>
        // --- 1. シーン・カメラ・レンダラーの設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 14;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. 照明の設定 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. マップ構造データの定義 ---
        const walls = [];

        // 床
        const floorGeometry = new THREE.PlaneGeometry(28, 20);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 壁生成
        function createWall(x, z, width, depth) {
            const wallGeo = new THREE.BoxGeometry(width, 1.8, depth);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x636e72 });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(x, 0.9, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            walls.push(wall);
        }

        // 床ゾーン生成
        function createZoneFloor(x, z, width, depth, color) {
            const zoneGeo = new THREE.PlaneGeometry(width, depth);
            const zoneMat = new THREE.MeshStandardMaterial({ color: color });
            const zone = new THREE.Mesh(zoneGeo, zoneMat);
            zone.rotation.x = -Math.PI / 2;
            zone.position.set(x, 0.01, z);
            zone.receiveShadow = true;
            scene.add(zone);
        }

        // 外壁
        createWall(0, -10, 28, 0.4);
        createWall(0, 10, 28, 0.4);
        createWall(-14, 0, 0.4, 20);
        createWall(14, 0, 0.4, 20);

        // 仕切り壁
        createWall(-12, 3.5, 3.5, 0.4);
        createWall(-6.5, 3.5, 2.5, 0.4);
        createWall(-2.5, 3.5, 2.5, 0.4);
        createWall(2.5, 3.5, 2.5, 0.4);
        createWall(6.5, 3.5, 2.5, 0.4);
        createWall(12, 3.5, 3.5, 0.4);

        createWall(-4.5, 6.75, 0.4, 6.5);
        createWall(4.5, 6.75, 0.4, 6.5);

        createWall(-10.5, -3.5, 6.5, 0.4);
        createWall(-1.5, -3.5, 6.5, 0.4);
        createWall(10.5, -3.5, 6.5, 0.4);

        createWall(-4.5, -6.75, 0.4, 6.5);
        createWall(4.5, -6.75, 0.4, 6.5);

        // 色分け
        createZoneFloor(-9.25, 6.75, 9, 6, 0xf6e58d);
        createZoneFloor(0, 6.75, 8.5, 6, 0x7ed6df);
        createZoneFloor(9.25, 6.75, 9, 6, 0xbadc58);
        createZoneFloor(-9.25, -6.75, 9, 6, 0xbdc3c7);
        createZoneFloor(0, -6.75, 8.5, 6, 0xffbe76);
        createZoneFloor(9.25, -6.75, 9, 6, 0xff7979);

        // 家具
        function createFurniture(x, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            walls.push(mesh);
        }

        createFurniture(-11.5, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        createFurniture(-2.2, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        createFurniture(7, 7.5, 2.5, 0.6, 3.5, 0xffffff);
        createFurniture(0, -6.75, 3.5, 0.7, 2.5, 0x78e08f);

        // --- 4. 視認性の高い棒人間（チューブ型）生成 ---
        function createBoldStickFigure(hexColor) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: hexColor });

            // 頭部（立体球）
            const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const head = new THREE.Mesh(headGeo, mat);
            head.position.y = 1.4;
            group.add(head);

            // 胴体・手足を太いシリンダーで構築
            function createLimb(rTop, rBot, height, posX, posY, posZ, rotZ) {
                const geo = new THREE.CylinderGeometry(rTop, rBot, height, 8);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(posX, posY, posZ);
                mesh.rotation.z = rotZ;
                group.add(mesh);
            }

            // 胴体
            createLimb(0.08, 0.08, 0.6, 0, 0.95, 0, 0);
            // 腕
            createLimb(0.06, 0.06, 0.7, 0, 1.05, 0, Math.PI / 2);
            // 左足
            createLimb(0.07, 0.07, 0.7, -0.15, 0.35, 0, 0.2);
            // 右足
            createLimb(0.07, 0.07, 0.7, 0.15, 0.35, 0, -0.2);

            scene.add(group);
            return group;
        }

        // プレイヤー (青)
        const player = createBoldStickFigure(0x0984e3);
        player.position.set(0, 0, 0);

        // --- 5. 利用者データ（固定ルート巡回設定） ---
        const residents = [
            {
                mesh: createBoldStickFigure(0xd63031), // 利用者A (赤)
                waypoints: [
                    new THREE.Vector3(-9.25, 0, 7.5), // 居室Aベッド横
                    new THREE.Vector3(-9.25, 0, 1.0), // 居室Aドア前
                    new THREE.Vector3(0, 0, 0),       // 廊下中央
                    new THREE.Vector3(0, 0, -6.75)    // 談話室
                ],
                currentWaypoint: 0,
                speed: 0.03,
                waitTime: 0
            },
            {
                mesh: createBoldStickFigure(0xe17055), // 利用者B (黄)
                waypoints: [
                    new THREE.Vector3(0, 0, 7.5),     // 居室B
                    new THREE.Vector3(0, 0, 1.0),     // 居室Bドア前
                    new THREE.Vector3(0, 0, -6.75)    // 談話室
                ],
                currentWaypoint: 0,
                speed: 0.025,
                waitTime: 100 // 初期待機時間
            },
            {
                mesh: createBoldStickFigure(0x00b894), // 利用者C (緑)
                waypoints: [
                    new THREE.Vector3(0, 0, -6.75),   // 談話室
                    new THREE.Vector3(9.25, 0, 1.0),  // 居室C前廊下
                    new THREE.Vector3(9.25, 0, 7.5)   // 居室C
                ],
                currentWaypoint: 0,
                speed: 0.035,
                waitTime: 200
            }
        ];

        // 初期位置の設定
        residents.forEach(r => {
            r.mesh.position.copy(r.waypoints[0]);
        });

        const allCharacters = [player, ...residents.map(r => r.mesh)];

        // --- 6. 移動処理 ---
        let targetPosition = null;
        const playerSpeed = 0.12;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handlePointer(event) {
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                targetPosition = intersects[0].point.clone();
                targetPosition.y = 0;
            }
        }

        window.addEventListener('pointerdown', handlePointer);

        function movePlayer() {
            if (!targetPosition) return;

            const distance = player.position.distanceTo(targetPosition);
            if (distance < 0.15) {
                targetPosition = null;
                return;
            }

            const direction = new THREE.Vector3()
                .subVectors(targetPosition, player.position)
                .normalize();

            const playerRaycaster = new THREE.Raycaster(
                new THREE.Vector3(player.position.x, 0.5, player.position.z),
                direction,
                0,
                0.5
            );
            
            const collisions = playerRaycaster.intersectObjects(walls);
            if (collisions.length > 0) {
                targetPosition = null;
                return;
            }

            player.position.add(direction.multiplyScalar(playerSpeed));
        }

        // 利用者の自動移動（Phase 2）
        function moveResidents() {
            residents.forEach(r => {
                if (r.waitTime > 0) {
                    r.waitTime--;
                    return;
                }

                const target = r.waypoints[r.currentWaypoint];
                const distance = r.mesh.position.distanceTo(target);

                if (distance < 0.1) {
                    // 次の目的地へ（末端に着いたら反転して折り返し）
                    if (!r.reverse) {
                        r.currentWaypoint++;
                        if (r.currentWaypoint >= r.waypoints.length) {
                            r.currentWaypoint = r.waypoints.length - 2;
                            r.reverse = true;
                            r.waitTime = 180; // 目的地到着時の休憩（約3秒）
                        }
                    } else {
                        r.currentWaypoint--;
                        if (r.currentWaypoint < 0) {
                            r.currentWaypoint = 1;
                            r.reverse = false;
                            r.waitTime = 180;
                        }
                    }
                    return;
                }

                const dir = new THREE.Vector3().subVectors(target, r.mesh.position).normalize();
                r.mesh.position.add(dir.multiplyScalar(r.speed));
            });
        }

        // --- 7. ループとリサイズ ---
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            movePlayer();
            moveResidents();

            // 棒人間を常にカメラ方向へ向ける
            allCharacters.forEach(char => {
                char.quaternion.copy(camera.quaternion);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
