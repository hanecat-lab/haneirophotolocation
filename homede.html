<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Care Facility Simulator - Advanced Physics Edition</title>
    <style>
        * { touch-action: none; user-select: none; }
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #ui {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 20px;
            border-radius: 8px; text-align: center; pointer-events: none; z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div style="color:#4cd137; font-weight:bold; font-size:16px;">CARE SHIFT</div>
        <div style="font-size:12px; color:#dcdde1;">Level-Up: 押し戻しベクトル物理エンジン搭載</div>
    </div>

    <script>
        // --- シーン構築 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 14;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 床・壁・家具データ ---
        const colliders = [];

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(28, 20),
            new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        function addBoxCollider(x, z, w, h, dep, color) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, dep),
                new THREE.MeshStandardMaterial({ color: color })
            );
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            // 物理衝突計算用データ（2D境界ボックス）
            colliders.push({
                minX: x - w / 2,
                maxX: x + w / 2,
                minZ: z - dep / 2,
                maxZ: z + dep / 2
            });
        }

        function createZoneFloor(x, z, w, dep, color) {
            const zone = new THREE.Mesh(
                new THREE.PlaneGeometry(w, dep),
                new THREE.MeshStandardMaterial({ color: color })
            );
            zone.rotation.x = -Math.PI / 2;
            zone.position.set(x, 0.01, z);
            scene.add(zone);
        }

        // 壁配置（中央廊下・部屋の開口部をゆったり確保）
        addBoxCollider(0, -10, 28, 1.8, 0.4, 0x636e72); // 南外壁
        addBoxCollider(0, 10, 28, 1.8, 0.4, 0x636e72);  // 北外壁
        addBoxCollider(-14, 0, 0.4, 1.8, 20, 0x636e72); // 西外壁
        addBoxCollider(14, 0, 0.4, 1.8, 20, 0x636e72);  // 東外壁

        // 室内の仕切り壁（開口部幅を2.5m以上確保）
        addBoxCollider(-11.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(-2.5, 3.5, 3.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(2.5, 3.5, 3.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(11.5, 3.5, 5.0, 1.8, 0.4, 0x636e72);

        addBoxCollider(-4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);
        addBoxCollider(4.5, 6.75, 0.4, 1.8, 6.5, 0x636e72);

        addBoxCollider(-10.5, -3.5, 7.0, 1.8, 0.4, 0x636e72);
        addBoxCollider(10.5, -3.5, 7.0, 1.8, 0.4, 0x636e72);

        addBoxCollider(-4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);
        addBoxCollider(4.5, -6.75, 0.4, 1.8, 6.5, 0x636e72);

        // 床色
        createZoneFloor(-9.25, 6.75, 9, 6, 0xf6e58d);
        createZoneFloor(0, 6.75, 8.5, 6, 0x7ed6df);
        createZoneFloor(9.25, 6.75, 9, 6, 0xbadc58);
        createZoneFloor(0, -6.75, 8.5, 6, 0xffbe76);

        // ベッド配置（壁奥寄り Z=7.8）
        addBoxCollider(-11.5, 7.8, 2.5, 0.6, 3.2, 0xffffff);
        addBoxCollider(0, 7.8, 2.5, 0.6, 3.2, 0xffffff);
        addBoxCollider(11.5, 7.8, 2.5, 0.6, 3.2, 0xffffff);
        addBoxCollider(0, -6.75, 3.5, 0.7, 2.5, 0x78e08f);

        // --- 棒人間生成 ---
        function createHachiStickFigure(hexColor) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: hexColor });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), mat);
            head.position.set(0, 1.48, 0);
            group.add(head);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.63, 8), mat);
            body.position.set(0, 0.965, 0);
            group.add(body);

            const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.55, 8), mat);
            arm.position.set(0, 1.2, 0);
            arm.rotation.z = Math.PI / 2;
            group.add(arm);

            const legLGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.68, 8);
            legLGeo.translate(0, -0.34, 0);
            const legL = new THREE.Mesh(legLGeo, mat);
            legL.position.set(0, 0.65, 0);
            legL.rotation.z = 0.28;
            group.add(legL);

            const legRGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.68, 8);
            legRGeo.translate(0, -0.34, 0);
            const legR = new THREE.Mesh(legRGeo, mat);
            legR.position.set(0, 0.65, 0);
            legR.rotation.z = -0.28;
            group.add(legR);

            scene.add(group);
            return group;
        }

        const player = createHachiStickFigure(0x0984e3);
        player.position.set(0, 0, 0);

        // 利用者の確実な回避経路設定
        const residents = [
            {
                mesh: createHachiStickFigure(0xd63031),
                waypoints: [
                    new THREE.Vector3(-6.0, 0, 1.5),  // 部屋A手前（ベッドから遠い）
                    new THREE.Vector3(-6.0, 0, 0.0),  // ドア前
                    new THREE.Vector3(0.0, 0, 0.0),   // 廊下中央
                    new THREE.Vector3(0.0, 0, -4.0)  // 談話室
                ],
                currentWP: 0,
                speed: 0.035,
                waitTime: 0
            },
            {
                mesh: createHachiStickFigure(0xe17055),
                waypoints: [
                    new THREE.Vector3(0.0, 0, 1.5),   // 部屋Bドア前
                    new THREE.Vector3(0.0, 0, 0.0),   // 廊下中央
                    new THREE.Vector3(0.0, 0, -4.0)  // 談話室
                ],
                currentWP: 0,
                speed: 0.03,
                waitTime: 90
            }
        ];

        residents.forEach(r => r.mesh.position.copy(r.waypoints[0]));

        // --- ★レベルアップ核心：円形カプセル法線押し戻しアルゴリズム ---
        const CHAR_RADIUS = 0.35; // 体の厚み＋安全マージン

        function resolveCollisionsAndMove(pos, moveVec) {
            // 移動適用
            pos.x += moveVec.x;
            pos.z += moveVec.z;

            // 衝突判定と押し戻し（2回反復計算で完全補正）
            for (let iter = 0; iter < 2; iter++) {
                for (let i = 0; i < colliders.length; i++) {
                    const c = colliders[i];

                    // ボックス内で最もキャラクターに近い点（Clamped Point）を計算
                    const closestX = Math.max(c.minX, Math.min(pos.x, c.maxX));
                    const closestZ = Math.max(c.minZ, Math.min(pos.z, c.maxZ));

                    const distX = pos.x - closestX;
                    const distZ = pos.z - closestZ;
                    const distanceSq = distX * distX + distZ * distZ;

                    // 衝突検知（半径内に侵入した場合）
                    if (distanceSq < CHAR_RADIUS * CHAR_RADIUS) {
                        const distance = Math.sqrt(distanceSq);

                        if (distance > 0.0001) {
                            // 押し戻しベクトル（侵入量）を計算
                            const overlap = CHAR_RADIUS - distance;
                            const normalX = distX / distance;
                            const normalZ = distZ / distance;

                            // キャラクターを即座に外側へ押し戻す
                            pos.x += normalX * overlap;
                            pos.z += normalZ * overlap;
                        } else {
                            // 真上に重なった場合の非常用退避
                            pos.z += CHAR_RADIUS;
                        }
                    }
                }
            }
        }

        // --- 入力制御 ---
        let targetPos = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                targetPos = intersects[0].point.clone();
                targetPos.y = 0;
            }
        });

        // --- ループ ---
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            // 1. プレイヤー移動
            if (targetPos) {
                const dir = new THREE.Vector3().subVectors(targetPos, player.position);
                dir.y = 0;
                const dist = dir.length();

                if (dist < 0.15) {
                    targetPos = null;
                } else {
                    dir.normalize().multiplyScalar(0.12);
                    resolveCollisionsAndMove(player.position, dir);
                }
            }

            // 2. 利用者（NPC）移動
            residents.forEach(r => {
                if (r.waitTime > 0) {
                    r.waitTime--;
                    return;
                }

                const wp = r.waypoints[r.currentWP];
                const dir = new THREE.Vector3().subVectors(wp, r.mesh.position);
                dir.y = 0;
                const dist = dir.length();

                if (dist < 0.3) {
                    if (!r.reverse) {
                        r.currentWP++;
                        if (r.currentWP >= r.waypoints.length) {
                            r.currentWP = r.waypoints.length - 2;
                            r.reverse = true;
                            r.waitTime = 120;
                        }
                    } else {
                        r.currentWP--;
                        if (r.currentWP < 0) {
                            r.currentWP = 1;
                            r.reverse = false;
                            r.waitTime = 120;
                        }
                    }
                } else {
                    dir.normalize().multiplyScalar(r.speed);
                    resolveCollisionsAndMove(r.mesh.position, dir);
                }
            });

            // 3. 向き固定
            [player, ...residents.map(r => r.mesh)].forEach(m => {
                m.quaternion.copy(camera.quaternion);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
