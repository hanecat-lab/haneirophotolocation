<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <meta name="description" content="撮影イベントの時間超過を自動検知し、次のキューへ進む現場向け進行管理アプリ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./pwa-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./pwa-icon.svg">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Event Flow Auto Queue</title>
  <style>
    /* Design: ダーク・ミスト・コンソール。現在・次・遅延を最短の視線で判断できる、低照度現場向けの操作面。特大文字は現場の現在キューだけで使い、管理画面の密度は標準に保つ。 */
    :root {
      --canvas:#0b1018; --canvas-soft:#111a27; --panel:rgba(20,30,45,.82); --panel-strong:rgba(27,40,59,.92);
      --ink:#f5f8fc; --muted:#a2b0c4; --faint:#6f7f95; --line:rgba(174,201,237,.14); --line-strong:rgba(174,201,237,.25);
      --mint:#46d6b0; --mint-deep:#22ab8a; --blue:#77a1ff; --violet:#9b8bff; --amber:#f2bd5b; --rose:#ff718d;
      --shadow:0 20px 45px rgba(0,0,0,.34); --radius-lg:24px; --radius-md:16px; --radius-sm:12px;
      --ease:cubic-bezier(.23,1,.32,1);
    }
    * { box-sizing:border-box }
    html { background:var(--canvas); color-scheme:dark; -webkit-text-size-adjust:100%; text-size-adjust:100% }
    body { margin:0; min-width:320px; color:var(--ink); font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif; background:var(--canvas); letter-spacing:.01em }
    body:before { content:""; position:fixed; inset:0; z-index:-2; pointer-events:none; background:radial-gradient(circle at 6% 0%,rgba(57,96,180,.27),transparent 30rem),radial-gradient(circle at 94% 3%,rgba(78,174,163,.13),transparent 26rem),linear-gradient(145deg,#101826 0%,#0b1018 52%,#0c121b 100%) }
    body:after { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.38; background-image:linear-gradient(rgba(173,199,235,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(173,199,235,.055) 1px,transparent 1px); background-size:38px 38px; mask-image:linear-gradient(#000,transparent 72%); -webkit-mask-image:linear-gradient(#000,transparent 72%) }
    button,input,select,textarea { font:inherit }
    button { cursor:pointer }
    button,.btn,.icon-btn,.map-link,.nav button,label.settings-line,[data-action] { touch-action:manipulation; -webkit-tap-highlight-color:transparent }
    button:disabled { cursor:not-allowed; opacity:.45 }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid rgba(119,161,255,.45); outline-offset:2px }
    .app { width:min(1500px,calc(100% - 32px)); min-height:100vh; margin:0 auto; display:grid; grid-template-columns:248px minmax(0,1fr); gap:24px }
    .sidebar { position:sticky; top:16px; height:calc(100vh - 32px); margin:16px 0; padding:20px 14px 15px; display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line); border-radius:var(--radius-lg); background:linear-gradient(145deg,rgba(28,41,60,.86),rgba(14,22,34,.89)); box-shadow:var(--shadow); backdrop-filter:blur(22px) }
    .sidebar:after { content:""; position:absolute; width:220px; height:220px; top:-136px; right:-104px; border-radius:50%; background:radial-gradient(circle,rgba(119,161,255,.27),transparent 68%); pointer-events:none }
    .brand { position:relative; z-index:1; display:flex; align-items:center; gap:12px; padding:4px 9px 27px }.brand:after { content:""; position:absolute; left:60px; right:11px; bottom:14px; height:1px; background:linear-gradient(90deg,rgba(70,214,176,.55),rgba(119,161,255,.20),transparent) }
    .brand-mark { position:relative; width:46px; height:46px; padding:8px; display:grid; place-items:center; flex:0 0 auto; border-radius:15px; background:linear-gradient(145deg,#5d81dc,#46d6b0); box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 12px 25px rgba(44,103,195,.30) }
    .brand-mark:before { content:""; position:absolute; inset:6px; border:1px solid rgba(255,255,255,.45); border-radius:50%; opacity:.55 }
    .brand-mark:after { content:""; position:absolute; right:-17px; top:20px; width:13px; height:1px; background:linear-gradient(90deg,rgba(70,214,176,.85),transparent) }
    .brand-mark svg { width:100%; height:100%; fill:none; stroke:white; stroke-width:2.45; stroke-linecap:round; stroke-linejoin:round }
    .brand b { display:block; font-family:"Arial Rounded MT Bold","Hiragino Sans",sans-serif; font-size:16px; letter-spacing:-.05em }
    .brand small { display:block; margin-top:4px; font-size:9px; color:var(--faint); font-weight:850; letter-spacing:.15em }
    .nav-label { margin:0 10px 8px; color:var(--faint); font-size:9px; font-weight:900; letter-spacing:.16em }
    .nav { display:grid; gap:4px }
    .nav button { position:relative; width:100%; display:flex; align-items:center; gap:11px; padding:12px 11px; color:var(--muted); border:0; border-radius:12px; background:transparent; text-align:left; font-size:12.5px; font-weight:790; transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease) }
    .nav button:hover { color:var(--ink); background:rgba(255,255,255,.06); transform:translateX(2px) }
    .nav button.active { color:#b9ccff; background:linear-gradient(90deg,rgba(96,145,255,.2),rgba(96,145,255,.03)) }
    .nav button.active:before { content:""; position:absolute; left:0; width:3px; height:18px; border-radius:9px; background:linear-gradient(var(--blue),var(--mint)) }.nav button.active:after { content:"›"; position:absolute; right:10px; color:var(--mint); font-family:"SFMono-Regular",Consolas,monospace; font-size:18px; font-weight:700 }
    .nav-icon { width:18px; display:grid; place-items:center; font-size:16px; font-weight:500 }
    .side-foot { position:relative; z-index:1; margin-top:auto; padding:16px 10px 3px; border-top:1px solid var(--line); color:var(--muted); font-size:10.5px; line-height:1.65 }
    .side-foot b { display:block; color:var(--ink); font-size:10.5px }
    .side-foot span { color:var(--faint) }
    main { min-width:0; padding:27px 4px 48px }
    .topbar { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; padding:0 7px 23px }
    .eyebrow { color:var(--faint); font-size:9px; font-weight:900; letter-spacing:.17em }
    .page-title { margin:6px 0 0; color:var(--ink); font-size:clamp(27px,3vw,40px); line-height:1; letter-spacing:-.065em; font-weight:850 }
    .page-title em { font-style:normal; color:var(--mint) }
.header-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap }
.clock { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; font-weight:760; font-variant-numeric:tabular-nums }
    /* Field FAB: 現場モードでのみ、スクロール位置に依存せずキュー追加を呼び出す。 */
    #addButton.field-fab { position:fixed; right:max(18px,env(safe-area-inset-right)); bottom:max(18px,env(safe-area-inset-bottom)); z-index:90; min-height:48px; padding:0 17px; border-radius:15px; box-shadow:0 13px 28px rgba(4,13,22,.48),0 0 0 1px rgba(213,255,246,.18); transform:translateZ(0) } #addButton.field-fab:active { transform:translateZ(0) scale(.96) }
    .clock b { color:var(--ink); font-size:16px; letter-spacing:-.02em }
    .btn { min-height:40px; border:1px solid var(--line-strong); border-radius:12px; padding:9px 12px; color:var(--muted); background:rgba(255,255,255,.05); font-size:11.5px; font-weight:820; transition:transform .16s var(--ease),background .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease) }
    .btn:hover { color:var(--ink); background:rgba(255,255,255,.1); box-shadow:0 8px 18px rgba(0,0,0,.22); transform:translateY(-1px) }
    .btn:active { transform:scale(.97) }

    .btn.primary:hover { color:#061212; background:linear-gradient(130deg,#76edcd,#42cbb5) }
    .btn.blue { color:#dce8ff; border-color:rgba(119,161,255,.34); background:rgba(73,108,184,.18); box-shadow:none }
    .btn.danger { color:#ff9eaf; border-color:rgba(255,113,141,.29); background:rgba(255,113,141,.09) }
    .btn.small { min-height:33px; padding:6px 9px; border-radius:10px; font-size:10.5px }
    .view { display:none }
    .view.active { display:block; animation:enter .26s var(--ease) both }
    @keyframes enter { from { opacity:0; transform:translateY(7px) } to { opacity:1; transform:translateY(0) } }
    .auto-banner { display:none; align-items:center; gap:11px; margin:0 0 15px; padding:13px 15px; border:1px solid rgba(255,113,141,.38); border-radius:var(--radius-md); color:#ffd5dd; background:linear-gradient(105deg,rgba(255,113,141,.19),rgba(255,113,141,.05)); box-shadow:0 10px 24px rgba(103,27,43,.2) }
    .auto-banner.show { display:flex; animation:handoff .35s var(--ease) both }
    @keyframes handoff { from { opacity:0; transform:translateY(-7px) } to { opacity:1; transform:translateY(0) } }
    .auto-banner .icon { width:28px; height:28px; display:grid; place-items:center; flex:0 0 auto; border-radius:9px; color:#fff; background:rgba(255,113,141,.28); font-size:14px }
    .auto-banner b { display:block; font-size:12px }
    .auto-banner span { display:block; margin-top:3px; color:#deb1ba; font-size:10.5px }
    .field-grid { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(290px,.76fr); gap:17px; align-items:start }
    .glass { border:1px solid var(--line); box-shadow:var(--shadow); background:linear-gradient(145deg,rgba(35,50,71,.75),rgba(17,26,40,.79)); backdrop-filter:blur(18px) }
    .now-card { position:relative; overflow:hidden; padding:25px; border-radius:var(--radius-lg); border-color:rgba(116,163,239,.22); box-shadow:0 25px 56px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.03) }
    .now-card:before { content:""; position:absolute; right:-130px; bottom:-210px; width:370px; height:370px; border-radius:50%; background:radial-gradient(circle,rgba(70,214,176,.15),transparent 67%) }
    .now-card:after { content:""; position:absolute; right:34px; top:-155px; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle,rgba(119,161,255,.17),transparent 68%) }
    .now-card > * { position:relative; z-index:1 }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px }
    .cue-index { position:relative; display:grid; place-items:center; width:35px; height:35px; border:1px solid rgba(119,161,255,.26); border-radius:11px; color:#b5c9ff; background:rgba(119,161,255,.12); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:13px; font-weight:900 }
    .cue-index:before { content:""; position:absolute; inset:6px; border:1px solid rgba(119,161,255,.34); border-radius:50%; opacity:.55 }
    .cue-index:after { content:""; position:absolute; right:-16px; width:12px; height:1px; background:linear-gradient(90deg,rgba(119,161,255,.62),transparent) }
    .status-pill { display:inline-flex; align-items:center; gap:6px; min-height:27px; padding:5px 9px; border-radius:999px; color:#91efd7; background:rgba(70,214,176,.13); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:10px; font-weight:880; letter-spacing:.04em }
    .status-pill:before { content:""; width:6px; height:6px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 4px rgba(70,214,176,.1) }
    .cue-name { max-width:740px; margin:15px 0 0; font-size:clamp(25px,3.3vw,39px); line-height:1.11; letter-spacing:-.055em; word-break:break-word }
    .cue-planned { display:flex; align-items:baseline; flex-wrap:wrap; gap:8px; margin-top:10px; color:var(--muted); font-size:12px; font-weight:730 }
    .cue-planned b { color:var(--ink); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:18px; font-variant-numeric:tabular-nums }
    .timer-row { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-top:22px }
    .countdown { display:flex; align-items:baseline; flex-wrap:wrap; gap:12px }
    .countdown-number { color:var(--mint); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:clamp(55px,8vw,88px); line-height:.85; font-weight:900; letter-spacing:-.085em; font-variant-numeric:tabular-nums }
    .countdown-label { color:var(--muted); font-size:12px; font-weight:850; letter-spacing:.07em }
    .countdown.warn .countdown-number { color:var(--amber) }
    .countdown.over .countdown-number { color:var(--rose) }
    .hero-ring { position:relative; flex:0 0 auto; width:142px; height:142px; margin-right:2px }
    .hero-ring svg { width:100%; height:100%; transform:rotate(-90deg); overflow:visible }
    .hero-ring .ring-bg { stroke:rgba(255,255,255,.08); stroke-width:9 }
    .hero-ring .ring-bar { stroke-width:9; filter:drop-shadow(0 0 5px rgba(70,214,176,.18)) }
    .hero-ring:after { content:""; position:absolute; inset:14px; border:1px solid rgba(119,161,255,.12); border-radius:50%; pointer-events:none }
    .hero-ring-copy { position:absolute; inset:0; display:grid; place-content:center; text-align:center }
    .hero-ring-copy b { color:var(--ink); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:20px; font-weight:880; letter-spacing:-.06em; font-variant-numeric:tabular-nums }
    .hero-ring-copy span { margin-top:1px; color:var(--faint); font-size:8px; font-weight:900; letter-spacing:.13em }
    .cue-detail { display:flex; flex-wrap:wrap; gap:6px; margin-top:13px }
    .tag { padding:5px 9px; border-radius:999px; color:#b5c5d8; background:rgba(255,255,255,.07); font-size:10px; font-weight:800 }
    .tag.mint { color:#8bead4; background:rgba(70,214,176,.12) }
    .tag.amber { color:#f7ce80; background:rgba(242,189,91,.14) }
    .tag.rose { color:#ffa9b9; background:rgba(255,113,141,.13) }
    .map-link { display:inline-flex; align-items:center; gap:6px; min-height:31px; margin-top:12px; padding:6px 9px; border:1px solid rgba(119,161,255,.28); border-radius:9px; color:#bad0ff; background:rgba(119,161,255,.09); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:9.5px; font-weight:850; text-decoration:none; transition:transform .16s var(--ease),background .16s var(--ease) }.map-link:hover { color:#e5edff; background:rgba(119,161,255,.17) }.map-link:active { transform:scale(.97) }.map-link:before { content:"⌖"; color:var(--mint); font-size:13px }
    .event-actions .map-link { min-height:32px; margin-top:0; padding:6px 10px }
    .terminal-banner { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; margin-top:14px; padding:11px 12px; border:1px solid rgba(255,113,141,.45); border-radius:13px; background:linear-gradient(90deg,rgba(255,113,141,.20),rgba(242,189,91,.09),rgba(255,113,141,.04)) }.terminal-symbol { display:grid; width:27px; height:27px; place-items:center; border:1px solid rgba(255,164,181,.55); border-radius:8px; color:#ffd2da; background:rgba(255,113,141,.16); font-family:"SFMono-Regular",Consolas,monospace; font-size:12px; font-weight:900 }.terminal-banner span { display:block; color:#ffb8c5; font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:8.5px; font-weight:900; letter-spacing:.13em }.terminal-banner b { display:block; margin-top:3px; color:#fff1f4; font-size:12px }.terminal-banner small { color:#ffd3a0; font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:9px; font-weight:850; text-align:right }
    .state-rail { display:grid; grid-template-columns:1fr auto; align-items:stretch; gap:1px; overflow:hidden; margin-top:12px; border:1px solid rgba(119,161,255,.16); border-radius:11px; background:rgba(119,161,255,.10) }.state-cell { position:relative; min-width:0; padding:8px 10px; background:rgba(8,15,25,.78) }.state-cell:before { content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:rgba(119,161,255,.4) }.state-cell.now:before { background:var(--mint) }.state-cell.now:after { content:"◈"; position:absolute; right:10px; top:50%; color:rgba(70,214,176,.42); font-family:"SFMono-Regular",Consolas,monospace; font-size:14px; transform:translateY(-50%) }.state-cell.status:before { background:var(--mint) }.state-cell.status.warn:before { background:var(--amber) }.state-cell.status.over:before { background:var(--rose) }.state-cell span { display:block; overflow:hidden; color:var(--faint); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:8px; font-weight:850; letter-spacing:.11em; text-overflow:ellipsis; white-space:nowrap }.state-cell b { display:block; overflow:hidden; margin-top:3px; color:#e5effd; font-size:10.5px; text-overflow:ellipsis; white-space:nowrap }.state-cell.status b { font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:10px }.state-cell.status.warn b { color:#ffdc98 }.state-cell.status.over b { color:#ffb2c1 }
    /* Priority Layer: 時間が足りない場面では必須カットだけを最前面に置く。 */
    .condition-panel { display:flex; align-items:flex-start; gap:10px; margin-top:14px; padding:11px 12px; border:1px solid rgba(119,161,255,.28); border-radius:13px; background:linear-gradient(90deg,rgba(73,108,184,.15),rgba(73,108,184,.035)) }
    .condition-panel.waiting { border-color:rgba(242,189,91,.34); background:linear-gradient(90deg,rgba(242,189,91,.14),rgba(242,189,91,.025)) }
    .condition-symbol { width:25px; height:25px; display:grid; place-items:center; flex:0 0 auto; border:1px solid rgba(119,161,255,.28); border-radius:8px; color:#bfd0ff; background:rgba(119,161,255,.12); font-size:12px }
    .condition-panel.waiting .condition-symbol { color:#ffe0a5; border-color:rgba(242,189,91,.35); background:rgba(242,189,91,.13) }
    .condition-copy { min-width:0; flex:1 }.condition-copy span { display:block; color:var(--faint); font-size:8.5px; font-weight:900; letter-spacing:.13em }.condition-copy b { display:block; margin-top:3px; font-size:11.5px; line-height:1.45 }.condition-copy p { margin:3px 0 0; color:var(--muted); font-size:10px; line-height:1.45 }
    .priority-layer { margin-top:14px; padding:12px; border:1px solid rgba(70,214,176,.20); border-radius:14px; background:linear-gradient(90deg,rgba(70,214,176,.11),rgba(70,214,176,.028)) }
    .priority-head { display:flex; align-items:center; justify-content:space-between; gap:10px }.priority-head span { color:#8bead4; font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:8.5px; font-weight:900; letter-spacing:.14em }.priority-head small { color:var(--muted); font-size:9.5px; font-weight:760 }
    .priority-cut { display:flex; align-items:flex-start; gap:9px; margin-top:8px; padding:9px 10px; border-left:2px solid rgba(255,255,255,.16); background:rgba(255,255,255,.026) }.priority-cut strong { min-width:29px; color:#cbd7e9; font-size:9px; letter-spacing:.08em }.priority-cut p { flex:1; margin:0; color:#dfe9f5; font-size:11px; line-height:1.5 }.priority-cut.must { border-left-color:var(--mint); background:rgba(70,214,176,.08) }.priority-cut.must strong { color:#91efd7 }.priority-cut.recommended { border-left-color:var(--blue) }.priority-cut.optional { border-left-color:rgba(255,255,255,.3) }.priority-suppressed { margin-top:9px; color:#f5cc7e; font-size:10px; line-height:1.45 }
    .must-toggle { min-height:28px; margin-left:auto; padding:5px 8px; border:1px solid rgba(70,214,176,.38); border-radius:9px; color:#08231d; background:var(--mint); font-size:9px; font-weight:900; white-space:nowrap; transition:transform .16s var(--ease),background .16s var(--ease),color .16s var(--ease) }.must-toggle:hover { background:#72edcb }.must-toggle:active { transform:scale(.96) }.must-toggle.undo { color:#9be8d7; border-color:rgba(70,214,176,.28); background:rgba(70,214,176,.10) }

      function clearData() { if(!confirm('この端末に保存した全イベントとキューを削除します。元に戻せません。'))return;const cfg=notificationSettings(),events=[...state.events];if(cfg.subscriptionId){events.forEach(event=>notificationApi('/schedule',{clientId:cfg.deviceId,subscriptionId:cfg.subscriptionId,eventId:event.id,schedules:[]}).catch(()=>{}));notificationApi('/unsubscribe',{clientId:cfg.deviceId,subscriptionId:cfg.subscriptionId}).catch(()=>{});}state={activeEventId:null,ui:{view:'events'},notifications:defaultNotificationSettings(),events:[]};save();render();showToast('全データと、この端末の未送信通知予定を削除しました。'); }

      document.addEventListener('click', e=>{ const button=e.target.closest('[data-action]'); if(!button)return; const a=button.dataset.action; const id=button.dataset.id;
        if(a==='close-modal')closeModal(); else if(a==='dismiss-auto'){previousAutoEvent='';render();} else if(a==='toggle-emergency'){state.ui.emergencyView=!state.ui.emergencyView;save();render();showToast(state.ui.emergencyView?'緊急表示に切り替えました。':'通常表示に戻しました。');} else if(a==='add-queue')openQueueForm(); else if(a==='edit-queue')openQueueForm(id); else if(a==='edit-current'){const q=activeQueue(currentEvent());if(q)openQueueForm(q.id);} else if(a==='open-recipe')openRecipeForm('',id); else if(a==='edit-recipe')openRecipeForm(id); else if(a==='toggle-tag')button.classList.toggle('selected'); else if(a==='create-event')openEventForm(); else if(a==='edit-event')openEventForm(id); else if(a==='open-event'){state.activeEventId=id;state.ui.view='field';save();render();} else if(a==='delete-event')deleteEvent(id); else if(a==='delete-queue')deleteQueue(id); else if(a==='move-queue')moveQueue(id,Number(button.dataset.dir)); else if(a==='shift-queues')shiftQueues(Number(button.dataset.min)); else if(a==='shift-now')shiftQueues(0,true); else if(a==='activate-condition')activateCondition(); else if(a==='record-must')recordMustCut(); else if(a==='undo-must')undoMustCut(); else if(a==='complete-no-duration')completeNoDuration(); else if(a==='complete-terminal')completeTerminal(); else if(a==='skip-current')skipCurrent(); else if(a==='save-push-settings')saveNotificationSettings(); else if(a==='enable-push')enablePushNotifications(); else if(a==='disable-push')disablePushNotifications(); else if(a==='test-push')sendTestPushNotification(); else if(a==='sync-push')syncAllNotificationSchedules().catch(error=>{notificationSettings().lastError=error.message;save();render();showToast(error.message);}); else if(a==='export')exportData(); else if(a==='import')$('#importFile')?.click(); else if(a==='clear')clearData(); });
      document.addEventListener('change',e=>{if(e.target.id==='importFile')importData(e.target.files?.[0]);});
      document.addEventListener('dblclick',e=>{if(e.target.closest('button,.btn,.icon-btn,.map-link,.nav button,label.settings-line,[data-action]'))e.preventDefault();},{passive:false});
      $$('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
      $('#fontSizeBtn').addEventListener('click',cycleFontScale);
      $('#addButton').addEventListener('click',()=>state.ui.view==='events'?openEventForm():state.ui.view==='recipes'?openRecipeForm():openQueueForm());
      $('#eventSettingsBtn').addEventListener('click',openSettings);
      $('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal();});
      document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
      setInterval(()=>{const c=$('#clock');if(c)c.textContent=fullTimeText(new Date());handoffIfDue();const view=state.ui.view;if(view==='field'){refreshNextThirtyBar();const event=currentEvent(),q=activeQueue(event);if(q){const num=$('.countdown-number');const label=$('.countdown-label');const left=remaining(event,q);if(num&&left!==null){num.textContent=left<0?'+'+minuteText(-left):minuteText(left);label.textContent=left<0?'超過':'残り';const parent=num.closest('.countdown');parent.className=`countdown ${countdownClass(left)}`;const ring=$('#heroRingBar');if(ring){const circ=370.7;const r=Math.max(0,Math.min(1,left/(Math.max(1,Number(q.duration)||1))));ring.style.strokeDashoffset=String(circ*(1-r));ring.style.stroke=ringColor(left);const ringCopy=$('.hero-ring-copy b');const ringLabel=$('.hero-ring-copy span');if(ringCopy)ringCopy.textContent=left<0?'+'+Math.ceil(-left):Math.ceil(left);if(ringLabel)ringLabel.textContent=left<0?'OVER':'MIN LEFT';}}}}},1000);
      registerPwa();
      render();
    })();
  </script>
</body>
</html>
