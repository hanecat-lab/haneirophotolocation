<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <meta name="description" content="撮影イベントの時間超過を自動検知し、次のキューへ進む現場向け進行管理アプリ">
  <title>Event Flow Auto Queue</title>
  <style>
    /* Design: ダーク・ミスト・コンソール。現在・次・遅延を最短の視線で判断できる、低照度現場向けの操作面。特大文字は現場の現在キューだけで使い、管理画面の密度は標準に保つ。 */
    :root {
      --canvas:#0b1018; --canvas-soft:#111a27; --panel:rgba(20,30,45,.82); --panel-strong:rgba(27,40,59,.92);
      --ink:#f5f8fc; --muted:#a2b0c4; --faint:#6f7f95; --line:rgba(174,201,237,.14); --line-strong:rgba(174,201,237,.25);
      --mint:#46d6b0; --mint-deep:#22ab8a; --blue:#77a1ff; --violet:#9b8bff; --amber:#f2bd5b; --rose:#ff718d;
      --shadow:0 20px 45px rgba(0,0,0,.34); --radius-lg:24px; --radius-md:16px; --radius-sm:12px;
      --ease:cubic-bezier(.23,1,.32,1);
    }
    * { box-sizing:border-box }
    html { background:var(--canvas); color-scheme:dark; -webkit-text-size-adjust:100%; text-size-adjust:100% }
    body { margin:0; min-width:320px; color:var(--ink); font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif; background:var(--canvas); letter-spacing:.01em }
    body:before { content:""; position:fixed; inset:0; z-index:-2; pointer-events:none; background:radial-gradient(circle at 6% 0%,rgba(57,96,180,.27),transparent 30rem),radial-gradient(circle at 94% 3%,rgba(78,174,163,.13),transparent 26rem),linear-gradient(145deg,#101826 0%,#0b1018 52%,#0c121b 100%) }
    body:after { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.38; background-image:linear-gradient(rgba(173,199,235,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(173,199,235,.055) 1px,transparent 1px); background-size:38px 38px; mask-image:linear-gradient(#000,transparent 72%); -webkit-mask-image:linear-gradient(#000,transparent 72%) }
    button,input,select,textarea { font:inherit }
    button { cursor:pointer }
    button,.btn,.icon-btn,.map-link,.nav button,label.settings-line,[data-action] { touch-action:manipulation; -webkit-tap-highlight-color:transparent }
    button:disabled { cursor:not-allowed; opacity:.45 }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid rgba(119,161,255,.45); outline-offset:2px }
    .app { width:min(1500px,calc(100% - 32px)); min-height:100vh; margin:0 auto; display:grid; grid-template-columns:248px minmax(0,1fr); gap:24px }
    .sidebar { position:sticky; top:16px; height:calc(100vh - 32px); margin:16px 0; padding:20px 14px 15px; display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line); border-radius:var(--radius-lg); background:linear-gradient(145deg,rgba(28,41,60,.86),rgba(14,22,34,.89)); box-shadow:var(--shadow); backdrop-filter:blur(22px) }
    .sidebar:after { content:""; position:absolute; width:220px; height:220px; top:-136px; right:-104px; border-radius:50%; background:radial-gradient(circle,rgba(119,161,255,.27),transparent 68%); pointer-events:none }
    .brand { position:relative; z-index:1; display:flex; align-items:center; gap:12px; padding:4px 9px 27px }.brand:after { content:""; position:absolute; left:60px; right:11px; bottom:14px; height:1px; background:linear-gradient(90deg,rgba(70,214,176,.55),rgba(119,161,255,.20),transparent) }
    .brand-mark { position:relative; width:46px; height:46px; padding:8px; display:grid; place-items:center; flex:0 0 auto; border-radius:15px; background:linear-gradient(145deg,#5d81dc,#46d6b0); box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 12px 25px rgba(44,103,195,.30) }
    .brand-mark:before { content:""; position:absolute; inset:6px; border:1px solid rgba(255,255,255,.45); border-radius:50%; opacity:.55 }
    .brand-mark:after { content:""; position:absolute; right:-17px; top:20px; width:13px; height:1px; background:linear-gradient(90deg,rgba(70,214,176,.85),transparent) }
    .brand-mark svg { width:100%; height:100%; fill:none; stroke:white; stroke-width:2.45; stroke-linecap:round; stroke-linejoin:round }
    .brand b { display:block; font-family:"Arial Rounded MT Bold","Hiragino Sans",sans-serif; font-size:16px; letter-spacing:-.05em }
    .brand small { display:block; margin-top:4px; font-size:9px; color:var(--faint); font-weight:850; letter-spacing:.15em }
    .nav-label { margin:0 10px 8px; color:var(--faint); font-size:9px; font-weight:900; letter-spacing:.16em }
    .nav { display:grid; gap:4px }
    .nav button { position:relative; width:100%; display:flex; align-items:center; gap:11px; padding:12px 11px; color:var(--muted); border:0; border-radius:12px; background:transparent; text-align:left; font-size:12.5px; font-weight:790; transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease) }
    .nav button:hover { color:var(--ink); background:rgba(255,255,255,.06); transform:translateX(2px) }
    .nav button.active { color:#b9ccff; background:linear-gradient(90deg,rgba(96,145,255,.2),rgba(96,145,255,.03)) }
    .nav button.active:before { content:""; position:absolute; left:0; width:3px; height:18px; border-radius:9px; background:linear-gradient(var(--blue),var(--mint)) }.nav button.active:after { content:"›"; position:absolute; right:10px; color:var(--mint); font-family:"SFMono-Regular",Consolas,monospace; font-size:18px; font-weight:700 }
    .nav-icon { width:18px; display:grid; place-items:center; font-size:16px; font-weight:500 }
    .side-foot { position:relative; z-index:1; margin-top:auto; padding:16px 10px 3px; border-top:1px solid var(--line); color:var(--muted); font-size:10.5px; line-height:1.65 }
    .side-foot b { display:block; color:var(--ink); font-size:10.5px }
    .side-foot span { color:var(--faint) }
    main { min-width:0; padding:27px 4px 48px }
    .topbar { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; padding:0 7px 23px }
    .eyebrow { color:var(--faint); font-size:9px; font-weight:900; letter-spacing:.17em }
    .page-title { margin:6px 0 0; color:var(--ink); font-size:clamp(27px,3vw,40px); line-height:1; letter-spacing:-.065em; font-weight:850 }
    .page-title em { font-style:normal; color:var(--mint) }
    .header-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap }
    .clock { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; font-weight:760; font-variant-numeric:tabular-nums }
    .clock b { color:var(--ink); font-size:16px; letter-spacing:-.02em }
    .btn { min-height:40px; border:1px solid var(--line-strong); border-radius:12px; padding:9px 12px; color:var(--muted); background:rgba(255,255,255,.05); font-size:11.5px; font-weight:820; transition:transform .16s var(--ease),background .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease) }
    .btn:hover { color:var(--ink); background:rgba(255,255,255,.1); box-shadow:0 8px 18px rgba(0,0,0,.22); transform:translateY(-1px) }
    .btn:active { transform:scale(.97) }
    .btn.primary { color:#081718; border-color:transparent; background:linear-gradient(130deg,#61e0bf,#39beaa); box-shadow:0 9px 20px rgba(40,191,158,.22) }
    .btn.primary:hover { color:#061212; background:linear-gradient(130deg,#76edcd,#42cbb5) }
    .btn.blue { color:#dce8ff; border-color:rgba(119,161,255,.34); background:rgba(73,108,184,.18); box-shadow:none }
    .btn.danger { color:#ff9eaf; border-color:rgba(255,113,141,.29); background:rgba(255,113,141,.09) }
    .btn.small { min-height:33px; padding:6px 9px; border-radius:10px; font-size:10.5px }
    .view { display:none }
    .view.active { display:block; animation:enter .26s var(--ease) both }
    @keyframes enter { from { opacity:0; transform:translateY(7px) } to { opacity:1; transform:translateY(0) } }
    .auto-banner { display:none; align-items:center; gap:11px; margin:0 0 15px; padding:13px 15px; border:1px solid rgba(255,113,141,.38); border-radius:var(--radius-md); color:#ffd5dd; background:linear-gradient(105deg,rgba(255,113,141,.19),rgba(255,113,141,.05)); box-shadow:0 10px 24px rgba(103,27,43,.2) }
    .auto-banner.show { display:flex; animation:handoff .35s var(--ease) both }
    @keyframes handoff { from { opacity:0; transform:translateY(-7px) } to { opacity:1; transform:translateY(0) } }
    .auto-banner .icon { width:28px; height:28px; display:grid; place-items:center; flex:0 0 auto; border-radius:9px; color:#fff; background:rgba(255,113,141,.28); font-size:14px }
    .auto-banner b { display:block; font-size:12px }
    .auto-banner span { display:block; margin-top:3px; color:#deb1ba; font-size:10.5px }
    .field-grid { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(290px,.76fr); gap:17px; align-items:start }
    .glass { border:1px solid var(--line); box-shadow:var(--shadow); background:linear-gradient(145deg,rgba(35,50,71,.75),rgba(17,26,40,.79)); backdrop-filter:blur(18px) }
    .now-card { position:relative; overflow:hidden; padding:25px; border-radius:var(--radius-lg); border-color:rgba(116,163,239,.22); box-shadow:0 25px 56px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.03) }
    .now-card:before { content:""; position:absolute; right:-130px; bottom:-210px; width:370px; height:370px; border-radius:50%; background:radial-gradient(circle,rgba(70,214,176,.15),transparent 67%) }
    .now-card:after { content:""; position:absolute; right:34px; top:-155px; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle,rgba(119,161,255,.17),transparent 68%) }
    .now-card > * { position:relative; z-index:1 }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px }
    .cue-index { position:relative; display:grid; place-items:center; width:35px; height:35px; border:1px solid rgba(119,161,255,.26); border-radius:11px; color:#b5c9ff; background:rgba(119,161,255,.12); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:13px; font-weight:900 }
    .cue-index:before { content:""; position:absolute; inset:6px; border:1px solid rgba(119,161,255,.34); border-radius:50%; opacity:.55 }
    .cue-index:after { content:""; position:absolute; right:-16px; width:12px; height:1px; background:linear-gradient(90deg,rgba(119,161,255,.62),transparent) }
    .status-pill { display:inline-flex; align-items:center; gap:6px; min-height:27px; padding:5px 9px; border-radius:999px; color:#91efd7; background:rgba(70,214,176,.13); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:10px; font-weight:880; letter-spacing:.04em }
    .status-pill:before { content:""; width:6px; height:6px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 4px rgba(70,214,176,.1) }
    .cue-name { max-width:740px; margin:15px 0 0; font-size:clamp(25px,3.3vw,39px); line-height:1.11; letter-spacing:-.055em; word-break:break-word }
    .cue-planned { display:flex; align-items:baseline; flex-wrap:wrap; gap:8px; margin-top:10px; color:var(--muted); font-size:12px; font-weight:730 }
    .cue-planned b { color:var(--ink); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:18px; font-variant-numeric:tabular-nums }
    .timer-row { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-top:22px }
    .countdown { display:flex; align-items:baseline; flex-wrap:wrap; gap:12px }
    .countdown-number { color:var(--mint); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:clamp(55px,8vw,88px); line-height:.85; font-weight:900; letter-spacing:-.085em; font-variant-numeric:tabular-nums }
    .countdown-label { color:var(--muted); font-size:12px; font-weight:850; letter-spacing:.07em }
    .countdown.warn .countdown-number { color:var(--amber) }
    .countdown.over .countdown-number { color:var(--rose) }
    .hero-ring { position:relative; flex:0 0 auto; width:142px; height:142px; margin-right:2px }
    .hero-ring svg { width:100%; height:100%; transform:rotate(-90deg); overflow:visible }
    .hero-ring .ring-bg { stroke:rgba(255,255,255,.08); stroke-width:9 }
    .hero-ring .ring-bar { stroke-width:9; filter:drop-shadow(0 0 5px rgba(70,214,176,.18)) }
    .hero-ring:after { content:""; position:absolute; inset:14px; border:1px solid rgba(119,161,255,.12); border-radius:50%; pointer-events:none }
    .hero-ring-copy { position:absolute; inset:0; display:grid; place-content:center; text-align:center }
    .hero-ring-copy b { color:var(--ink); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:20px; font-weight:880; letter-spacing:-.06em; font-variant-numeric:tabular-nums }
    .hero-ring-copy span { margin-top:1px; color:var(--faint); font-size:8px; font-weight:900; letter-spacing:.13em }
    .cue-detail { display:flex; flex-wrap:wrap; gap:6px; margin-top:13px }
    .tag { padding:5px 9px; border-radius:999px; color:#b5c5d8; background:rgba(255,255,255,.07); font-size:10px; font-weight:800 }
    .tag.mint { color:#8bead4; background:rgba(70,214,176,.12) }
    .tag.amber { color:#f7ce80; background:rgba(242,189,91,.14) }
    .tag.rose { color:#ffa9b9; background:rgba(255,113,141,.13) }
    .map-link { display:inline-flex; align-items:center; gap:6px; min-height:31px; margin-top:12px; padding:6px 9px; border:1px solid rgba(119,161,255,.28); border-radius:9px; color:#bad0ff; background:rgba(119,161,255,.09); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:9.5px; font-weight:850; text-decoration:none; transition:transform .16s var(--ease),background .16s var(--ease) }.map-link:hover { color:#e5edff; background:rgba(119,161,255,.17) }.map-link:active { transform:scale(.97) }.map-link:before { content:"⌖"; color:var(--mint); font-size:13px }
    .event-actions .map-link { min-height:32px; margin-top:0; padding:6px 10px }
    .terminal-banner { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; margin-top:14px; padding:11px 12px; border:1px solid rgba(255,113,141,.45); border-radius:13px; background:linear-gradient(90deg,rgba(255,113,141,.20),rgba(242,189,91,.09),rgba(255,113,141,.04)) }.terminal-symbol { display:grid; width:27px; height:27px; place-items:center; border:1px solid rgba(255,164,181,.55); border-radius:8px; color:#ffd2da; background:rgba(255,113,141,.16); font-family:"SFMono-Regular",Consolas,monospace; font-size:12px; font-weight:900 }.terminal-banner span { display:block; color:#ffb8c5; font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:8.5px; font-weight:900; letter-spacing:.13em }.terminal-banner b { display:block; margin-top:3px; color:#fff1f4; font-size:12px }.terminal-banner small { color:#ffd3a0; font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:9px; font-weight:850; text-align:right }
    .state-rail { display:grid; grid-template-columns:1fr auto; align-items:stretch; gap:1px; overflow:hidden; margin-top:12px; border:1px solid rgba(119,161,255,.16); border-radius:11px; background:rgba(119,161,255,.10) }.state-cell { position:relative; min-width:0; padding:8px 10px; background:rgba(8,15,25,.78) }.state-cell:before { content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:rgba(119,161,255,.4) }.state-cell.now:before { background:var(--mint) }.state-cell.now:after { content:"◈"; position:absolute; right:10px; top:50%; color:rgba(70,214,176,.42); font-family:"SFMono-Regular",Consolas,monospace; font-size:14px; transform:translateY(-50%) }.state-cell.status:before { background:var(--mint) }.state-cell.status.warn:before { background:var(--amber) }.state-cell.status.over:before { background:var(--rose) }.state-cell span { display:block; overflow:hidden; color:var(--faint); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:8px; font-weight:850; letter-spacing:.11em; text-overflow:ellipsis; white-space:nowrap }.state-cell b { display:block; overflow:hidden; margin-top:3px; color:#e5effd; font-size:10.5px; text-overflow:ellipsis; white-space:nowrap }.state-cell.status b { font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:10px }.state-cell.status.warn b { color:#ffdc98 }.state-cell.status.over b { color:#ffb2c1 }
    /* Priority Layer: 時間が足りない場面では必須カットだけを最前面に置く。 */
    .condition-panel { display:flex; align-items:flex-start; gap:10px; margin-top:14px; padding:11px 12px; border:1px solid rgba(119,161,255,.28); border-radius:13px; background:linear-gradient(90deg,rgba(73,108,184,.15),rgba(73,108,184,.035)) }
    .condition-panel.waiting { border-color:rgba(242,189,91,.34); background:linear-gradient(90deg,rgba(242,189,91,.14),rgba(242,189,91,.025)) }
    .condition-symbol { width:25px; height:25px; display:grid; place-items:center; flex:0 0 auto; border:1px solid rgba(119,161,255,.28); border-radius:8px; color:#bfd0ff; background:rgba(119,161,255,.12); font-size:12px }
    .condition-panel.waiting .condition-symbol { color:#ffe0a5; border-color:rgba(242,189,91,.35); background:rgba(242,189,91,.13) }
    .condition-copy { min-width:0; flex:1 }.condition-copy span { display:block; color:var(--faint); font-size:8.5px; font-weight:900; letter-spacing:.13em }.condition-copy b { display:block; margin-top:3px; font-size:11.5px; line-height:1.45 }.condition-copy p { margin:3px 0 0; color:var(--muted); font-size:10px; line-height:1.45 }
    .priority-layer { margin-top:14px; padding:12px; border:1px solid rgba(70,214,176,.20); border-radius:14px; background:linear-gradient(90deg,rgba(70,214,176,.11),rgba(70,214,176,.028)) }
    .priority-head { display:flex; align-items:center; justify-content:space-between; gap:10px }.priority-head span { color:#8bead4; font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:8.5px; font-weight:900; letter-spacing:.14em }.priority-head small { color:var(--muted); font-size:9.5px; font-weight:760 }
    .priority-cut { display:flex; align-items:flex-start; gap:9px; margin-top:8px; padding:9px 10px; border-left:2px solid rgba(255,255,255,.16); background:rgba(255,255,255,.026) }.priority-cut strong { min-width:29px; color:#cbd7e9; font-size:9px; letter-spacing:.08em }.priority-cut p { flex:1; margin:0; color:#dfe9f5; font-size:11px; line-height:1.5 }.priority-cut.must { border-left-color:var(--mint); background:rgba(70,214,176,.08) }.priority-cut.must strong { color:#91efd7 }.priority-cut.recommended { border-left-color:var(--blue) }.priority-cut.optional { border-left-color:rgba(255,255,255,.3) }.priority-suppressed { margin-top:9px; color:#f5cc7e; font-size:10px; line-height:1.45 }
    .must-toggle { min-height:28px; margin-left:auto; padding:5px 8px; border:1px solid rgba(70,214,176,.38); border-radius:9px; color:#08231d; background:var(--mint); font-size:9px; font-weight:900; white-space:nowrap; transition:transform .16s var(--ease),background .16s var(--ease),color .16s var(--ease) }.must-toggle:hover { background:#72edcb }.must-toggle:active { transform:scale(.96) }.must-toggle.undo { color:#9be8d7; border-color:rgba(70,214,176,.28); background:rgba(70,214,176,.10) }
    .priority-cut.must.completed { border-left-color:#46d6b0; background:rgba(70,214,176,.14); box-shadow:inset 0 0 0 1px rgba(70,214,176,.18) }.priority-cut.must.completed strong { color:#99f0dc }.priority-cut.must.completed p { color:#d6fff4; text-decoration:line-through; text-decoration-color:rgba(153,240,220,.45) }.must-complete-time { display:block; margin-top:3px; color:#8edbc9; font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:8.5px; font-weight:700 }

  <script>

      const fmtDate = s => s ? s.replaceAll('-','.') : '日付未設定';

          recipes:[{id:'r1',queueId:'q3',createdAt:new Date(now.getTime()-86400000).toISOString(),location:'メインホール／ステージ右',subject:'代表挨拶',tags:['寄り','縦','ステージ右','低め','逆光','背景整理'],note:'演台の右から入ると背景が整理される。代表者の手元も1カット残す。'}],
          queues:[

            {id:'q4', title:'集合写真', plannedAt:hm(add(start,17)), duration:7, noDuration:false, isTerminal:false, startMode:'condition', startCondition:'参加者が3列に整列し、主催者が撮影可を出したら', mustShot:'全員の顔が見える正面集合を1カット', mustDone:false, mustCompletedAt:null, recommendedShot:'拍手または自然な表情を1カット', optionalShot:'横位置のバリエーション', area:'メインホール／ステージ前', prep:'段差・前列・背景の抜けを確認', note:'段差・前列の顔かぶりを確認してから撮影。', locked:false, state:'pending', completedAt:null},
            {id:'q5', title:'完全撤収', plannedAt:hm(add(start,32)), duration:0, noDuration:true, isTerminal:true, terminalDeadline:hm(add(start,32)), startMode:'time', startCondition:'', mustShot:'機材・私物・控室の残置がないことを確認', mustDone:false, mustCompletedAt:null, recommendedShot:'撤収導線の記録', optionalShot:'', area:'メインホール／搬出口', prep:'撤収開始。会場規定の時刻までに完全退館。', note:'締切を超えないよう、撮影終了後は撤収を最優先。', locked:true, state:'pending', completedAt:null}

      }
      function normalize(raw) {

        state.events = state.events.map(e => { const inheritedMap=e.mapUrl || (e.queues||[]).find(q=>/^https?:/i.test(q.mapUrl||''))?.mapUrl || ''; return { id:uid(), name:'名称未設定', date:today(), venue:'', mapUrl:inheritedMap, autoAdvance:true, graceMin:0, timeSnap:5, recipes:[], queues:[], closedAt:null, ...e, mapUrl:e.mapUrl||inheritedMap, timeSnap:Number(e.timeSnap)===10?10:5, recipes:Array.isArray(e.recipes)?e.recipes:[], queues:(e.queues||[]).map(q => ({id:uid(),title:'無題のキュー',plannedAt:'',duration:5,noDuration:false,isTerminal:false,terminalDeadline:'',startMode:'time',startCondition:'',mustShot:'',mustDone:false,mustCompletedAt:null,recommendedShot:'',optionalShot:'',area:'',prep:'',note:'',locked:false,state:'pending',completedAt:null,...q})) }; });
        if (!state.activeEventId || !state.events.some(e=>e.id===state.activeEventId)) state.activeEventId = state.events[0]?.id || null;
        return state;
      }
      let state;
      try { state = normalize(JSON.parse(localStorage.getItem(APP_KEY))); } catch { state = defaultState(); }
      let previousAutoEvent = '';
      let toastTimer;
      function save() { localStorage.setItem(APP_KEY, JSON.stringify(state)); }

      function sortedQueues(event) { return [...(event?.queues || [])].sort((a,b) => minutes(a.plannedAt) - minutes(b.plannedAt)); }
      function minutes(t) { if (!/^\d\d:\d\d$/.test(t||'')) return 1e9; const [h,m]=t.split(':').map(Number); return h*60+m; }

      function enhanceQueueTimeControls(event, isNew=false) { const snap=timeSnap(event), time=$('#qTime'), deadline=$('#qDeadline'), duration=$('#qDuration'); [time,deadline].filter(Boolean).forEach(input=>{if(isNew&&input.value)input.value=snapClock(input.value,snap);input.step=String(snap*60);input.addEventListener('change',()=>{input.value=snapClock(input.value,snap);});}); if(duration&&duration.tagName==='INPUT'){const select=document.createElement('select');select.id='qDuration';select.disabled=duration.disabled;select.innerHTML=durationOptions(isNew?snap:duration.value,snap);duration.replaceWith(select);} }

      function empty(icon,title,copy,button='') { return `<div class="empty"><div class="empty-icon">${icon}</div><b>${esc(title)}</b><p>${esc(copy)}</p>${button?`<button class="btn primary" style="margin-top:16px" data-action="${button}">${button==='create-event'?'イベントを作成':'キューを追加'}</button>`:''}</div>`; }

      function mapHref(value) { try { const u=new URL(value||''); return /^https?:$/.test(u.protocol)?u.href:''; } catch { return ''; } }

        let suggested=''; if(!q&&last){const s=queueStart(event,last);if(s)suggested=timeText(new Date(s.getTime()+((last.noDuration||last.isTerminal)?0:(Number(last.duration)||1))*60000));}
        const planned=q?.plannedAt||suggested, deadline=q?.terminalDeadline||planned;
        openModal(`<div class="modal-head"><div><h2 id="modalTitle">${q?'キューを編集':'キューを追加'}</h2><p>通常進行に加え、時間を計らない案内や完全撤収のような終端締切も設定できます。会場地図はイベント管理で設定します。</p></div><button class="modal-close" data-action="close-modal">×</button></div><form id="queueForm"><div class="form-grid"><div class="form-field full"><label>内容</label><input id="qTitle" required value="${esc(q?.title||'')}" placeholder="例: 表彰式・受賞者集合"></div><div class="form-field"><label>開始方式</label><select id="qStartMode"><option value="time" ${(q?.startMode||'time')==='time'?'selected':''}>時刻基準</option><option value="condition" ${q?.startMode==='condition'?'selected':''}>開始条件基準</option><option value="hybrid" ${q?.startMode==='hybrid'?'selected':''}>時刻＋開始条件</option></select></div><div class="form-field"><label>開始予定</label><input id="qTime" type="time" value="${esc(planned)}"></div><div class="form-field full"><label>開始条件</label><input id="qCondition" value="${esc(q?.startCondition||'')}" placeholder="例: 登壇者が整列し、司会が開演を告げたら"></div><p class="form-hint">開始条件基準では、条件成立の時点から所要時間を計測します。時刻＋開始条件では、予定時刻を目安に条件も確認します。</p><div class="form-field"><label>所要（分）</label><input id="qDuration" type="number" min="1" step="1" value="${Number(q?.duration)||5}" ${q?.noDuration?'disabled':''}></div><div class="form-field"><label>場所・エリア</label><input id="qArea" value="${esc(q?.area||'')}" placeholder="例: ステージ右"></div><label class="settings-line"><div><b>所要時間なしの案内キュー</b><span>オープン・最終オーダーなど。タイマー・自動進行の対象から外します。</span></div><span class="switch"><input id="qNoDuration" type="checkbox" ${q?.noDuration?'checked':''}><span></span></span></label><label class="settings-line"><div><b>後続を持たない終端キュー</b><span>完全撤収など。後続へ進まず、締切時刻を強調して手動で完了します。</span></div><span class="switch"><input id="qTerminal" type="checkbox" ${q?.isTerminal?'checked':''}><span></span></span></label><div class="form-field" id="qDeadlineWrap"><label>終端の締切時刻</label><input id="qDeadline" type="time" value="${esc(deadline)}"></div><div class="form-field"><label>移動・準備</label><input id="qPrep" value="${esc(q?.prep||'')}" placeholder="例: レンズ交換・立ち位置確保"></div><div class="form-field full"><label>必須カット</label><input id="qMust" value="${esc(q?.mustShot||'')}" placeholder="例: 登壇者全員が入る引きを最初に1カット"></div><div class="form-field full"><label>推奨カット</label><input id="qRecommended" value="${esc(q?.recommendedShot||'')}" placeholder="例: 代表挨拶の寄りと客席の反応"></div><div class="form-field full"><label>任意カット</label><input id="qOptional" value="${esc(q?.optionalShot||'')}" placeholder="例: 横位置のバリエーション"></div><div class="form-field full"><label>撮影メモ</label><textarea id="qNote" placeholder="例: 引きの全景を先に撮る。フラッシュ禁止。">${esc(q?.note||'')}</textarea></div><label class="settings-line"><div><b>固定時刻として扱う</b><span>再調整時にもこのキューの予定時刻を動かしません。</span></div><span class="switch"><input id="qLocked" type="checkbox" ${q?.locked?'checked':''}><span></span></span></label></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">キャンセル</button><button class="btn primary" type="submit">保存</button></div></form>`);
        enhanceQueueTimeControls(event,!q);
        const updateSpecialFields=()=>{const terminal=$('#qTerminal').checked, noDuration=$('#qNoDuration');if(terminal){noDuration.checked=true;$('#qDuration').disabled=true;}else $('#qDuration').disabled=noDuration.checked;$('#qDeadlineWrap').classList.toggle('hide',!terminal);};
        $('#qNoDuration').addEventListener('change',updateSpecialFields);$('#qTerminal').addEventListener('change',updateSpecialFields);updateSpecialFields();
        $('#queueForm').onsubmit=e=>{e.preventDefault();const title=$('#qTitle').value.trim(),startMode=$('#qStartMode').value,startCondition=$('#qCondition').value.trim(),isTerminal=$('#qTerminal').checked,noDuration=$('#qNoDuration').checked||isTerminal;if(!title){showToast('内容を入力してください。');return;}if(startMode!=='time'&&!startCondition){showToast('開始条件を入力してください。');return;}if(isTerminal&&!$('#qDeadline').value&&!$('#qTime').value){showToast('終端キューには締切時刻を入力してください。');return;}const data={title,startMode,startCondition,plannedAt:$('#qTime').value,duration:noDuration?0:Math.max(1,Number($('#qDuration').value)||5),noDuration,isTerminal,terminalDeadline:isTerminal?($('#qDeadline').value||$('#qTime').value):'',area:$('#qArea').value.trim(),prep:$('#qPrep').value.trim(),mustShot:$('#qMust').value.trim(),recommendedShot:$('#qRecommended').value.trim(),optionalShot:$('#qOptional').value.trim(),note:$('#qNote').value.trim(),locked:$('#qLocked').checked||isTerminal};if(q){Object.assign(q,data);if(q.startMode!=='condition')q.startedAt=null;}else{const fresh={id:uid(),state:'pending',completedAt:null,startedAt:null,mustDone:false,mustCompletedAt:null,...data};event.queues.push(fresh);if(!activeQueue(event)&&!event.closedAt)fresh.state='active';}event.closedAt=null;save();closeModal();render();showToast('キューを保存しました。');};
      }
      function openRecipeForm(recipeId='', queueId='') {
        const event=currentEvent(); if(!event)return;
        const existing=recipeId?(event.recipes||[]).find(r=>r.id===recipeId):null;
        const target=queueId?event.queues.find(q=>q.id===queueId):activeQueue(event)||sortedQueues(event)[0];
        const tags=['引き','寄り','縦','横','ステージ右','センター','客席後方','低め','高め','逆光','混色','フラッシュなし','顔かぶり注意','名札','背景整理','次回も使う'], selected=new Set(existing?.tags||[]);
        openModal(`<div class="modal-head"><div><h2 id="modalTitle">${existing?'構図レシピを編集':'構図レシピを残す'}</h2><p>急ぐ時はタグだけで保存できます。余裕がある時だけ、一言を足してください。</p></div><button class="modal-close" data-action="close-modal">×</button></div><form id="recipeForm"><div class="form-grid"><div class="form-field full"><label>対象キュー</label><select id="rQueue">${sortedQueues(event).map(q=>`<option value="${q.id}" ${(existing?.queueId||target?.id)===q.id?'selected':''}>${esc(q.plannedAt||'--:--')}　${esc(q.title)}</option>`).join('')}</select></div><div class="form-field"><label>場所</label><input id="rLocation" value="${esc(existing?.location||target?.area||event.venue||'')}" placeholder="例: ステージ右"></div><div class="form-field"><label>被写体・ねらい</label><input id="rSubject" value="${esc(existing?.subject||target?.title||'')}" placeholder="例: 代表挨拶の寄り"></div><div class="tag-picker"><h3>定型構図タグ</h3><p>画角、カメラ位置、光、注意点を必要な分だけ押します。</p><div class="tag-options">${tags.map(t=>`<button type="button" class="tag-option ${selected.has(t)?'selected':''}" data-action="toggle-tag" data-tag="${t}">${t}</button>`).join('')}</div></div><div class="form-field full"><label>一言メモ</label><textarea id="rNote" placeholder="例: 演台の右から入ると背景が整理される。">${esc(existing?.note||'')}</textarea></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">キャンセル</button><button class="btn primary" type="submit">${existing?'更新':'保存'}</button></div></form>`);
        $('#recipeForm').onsubmit=e=>{ e.preventDefault(); const picked=$$('.tag-option.selected',$('#recipeForm')).map(b=>b.dataset.tag); const data={queueId:$('#rQueue').value,location:$('#rLocation').value.trim(),subject:$('#rSubject').value.trim(),tags:picked,note:$('#rNote').value.trim()}; if(existing)Object.assign(existing,data);else (event.recipes||=[]).push({id:uid(),createdAt:new Date().toISOString(),...data}); save();closeModal();render();showToast(existing?'構図レシピを更新しました。':'構図レシピを保存しました。'); };
      }
      function openEventForm(id='') { const existing=id?state.events.find(x=>x.id===id):null; openModal(`<div class="modal-head"><div><h2 id="modalTitle">${existing?'イベントを編集':'イベントを作成'}</h2><p>イベント単位で、会場地図・進行表・自動進行の設定を管理します。</p></div><button class="modal-close" data-action="close-modal">×</button></div><form id="eventForm"><div class="form-grid"><div class="form-field full"><label>イベント名</label><input id="eName" required value="${esc(existing?.name||'')}" placeholder="例: 2026 春季カンファレンス"></div><div class="form-field"><label>開催日</label><input id="eDate" type="date" value="${esc(existing?.date||today())}"></div><div class="form-field"><label>会場</label><input id="eVenue" value="${esc(existing?.venue||'')}" placeholder="例: 3F メインホール"></div><div class="form-field full"><label>会場Google マップURL</label><input id="eMap" type="url" value="${esc(existing?.mapUrl||'')}" placeholder="例: https://www.google.com/maps/... "></div><p class="form-hint">地図は「イベントを管理」画面から開きます。現場の撮影キューには表示しません。</p><label class="settings-line"><div><b>時間超過時に次キューへ自動進行</b><span>撮影完了の操作を待たず、予定の終了時刻で切り替えます。</span></div><span class="switch"><input id="eAuto" type="checkbox" ${existing?.autoAdvance!==false?'checked':''}><span></span></span></label><div class="form-field"><label>自動進行までの猶予（分）</label><input id="eGrace" type="number" min="0" max="60" value="${Number(existing?.graceMin)||0}"></div><p class="form-hint">猶予を 0 分にすると、予定終了時刻を過ぎた直後に次のキューへ切り替わります。</p></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">キャンセル</button><button class="btn primary" type="submit">保存</button></div></form>`);
        $('#eventForm').onsubmit=e=>{e.preventDefault();const name=$('#eName').value.trim(),mapUrl=$('#eMap').value.trim();if(!name){showToast('イベント名を入力してください。');return;}if(mapUrl&&!mapHref(mapUrl)){showToast('Google マップURLは http または https の形式で入力してください。');return;}const data={name,date:$('#eDate').value,venue:$('#eVenue').value.trim(),mapUrl,autoAdvance:$('#eAuto').checked,graceMin:Math.max(0,Math.min(60,Number($('#eGrace').value)||0))};if(existing)Object.assign(existing,data);else{const n={id:uid(),queues:[],...data};state.events.push(n);state.activeEventId=n.id;}save();closeModal();render();showToast('イベントを保存しました。');};
      }
      function openSettings() { const event=currentEvent(); if(!event)return; openModal(`<div class="modal-head"><div><h2 id="modalTitle">時間と自動進行の設定</h2><p>キュー編集で使う時間ロールの吸着間隔と、自動進行のルールをイベントごとに調整します。</p></div><button class="modal-close" data-action="close-modal">×</button></div><form id="settingsForm"><div class="form-grid"><div class="form-field full"><label>時間ロールの吸着間隔</label><select id="sTimeSnap"><option value="5" ${timeSnap(event)===5?'selected':''}>5分単位（00・05・10…）</option><option value="10" ${timeSnap(event)===10?'selected':''}>10分単位（00・10・20…）</option></select></div><p class="form-hint">開始予定・終端締切・所要時間は、この間隔でロール選択と自動吸着を行います。</p><label class="settings-line"><div><b>自動進行を有効にする</b><span>予定終了後に、次の待機キューを自動で現在キューにします。</span></div><span class="switch"><input id="sAuto" type="checkbox" ${event.autoAdvance?'checked':''}><span></span></span></label><div class="form-field"><label>自動進行までの猶予（分）</label><input id="sGrace" type="number" min="0" max="60" value="${Number(event.graceMin)||0}"></div><p class="form-hint">「撮影完了」操作は通常運用から外しています。必要なら進行表でスキップ・編集を行えます。</p></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">キャンセル</button><button class="btn primary" type="submit">保存</button></div></form>`);$('#settingsForm').onsubmit=e=>{e.preventDefault();event.autoAdvance=$('#sAuto').checked;event.graceMin=Math.max(0,Math.min(60,Number($('#sGrace').value)||0));event.timeSnap=Number($('#sTimeSnap').value)===10?10:5;save();closeModal();render();showToast(`${event.timeSnap}分単位の時間吸着を保存しました。`);}; }
      function shiftQueues(delta, fromNow=false) { const event=currentEvent(); const active=activeQueue(event); if(!event||!active)return; const qs=sortedQueues(event); const startIndex=qs.findIndex(q=>q.id===active.id); let base=fromNow?new Date():null; qs.slice(startIndex).forEach((q,i)=>{ if(q.locked && !fromNow) return; let t=queueStart(event,q); if(i===0&&fromNow)t=base; else if(fromNow&&i>0){const prev=qs[startIndex+i-1];const pStart=queueStart(event,prev);t=new Date(pStart.getTime()+(Number(prev.duration)||1)*60000);} else t=new Date(t.getTime()+delta*60000);q.plannedAt=timeText(t); });save();render();showToast(fromNow?'現在時刻から未完了キューを組み直しました。':`未完了キューを ${delta>0?'+':''}${delta}分調整しました。`); }
      function activateCondition() { const event=currentEvent(), q=activeQueue(event); if(!event||!q||q.startMode!=='condition'||q.startedAt)return; q.startedAt=new Date().toISOString(); save();render();showToast(`「${q.title}」を開始しました。ここから${q.duration||1}分を計測します。`); }
      function recordMustCut() { const event=currentEvent(), q=activeQueue(event); if(!event||!q||!q.mustShot||q.mustDone)return; q.mustDone=true;q.mustCompletedAt=new Date().toISOString();save();render();showToast('必須カットを撮影済みとして記録しました。'); }
      function undoMustCut() { const event=currentEvent(), q=activeQueue(event); if(!event||!q||!q.mustDone)return; q.mustDone=false;q.mustCompletedAt=null;save();render();showToast('必須カットの記録を取り消しました。'); }
      function completeNoDuration() { const event=currentEvent(),q=activeQueue(event);if(!event||!q||!q.noDuration||q.isTerminal)return;const n=nextQueue(event);q.state='done';q.completedAt=new Date().toISOString();if(n&&n.state==='pending')n.state='active';save();render();showToast(`「${q.title}」を確認済みとして、次のキューへ進めました。`); }
      function completeTerminal() { const event=currentEvent(),q=activeQueue(event);if(!event||!q||!q.isTerminal)return;q.state='done';q.completedAt=new Date().toISOString();event.closedAt=q.completedAt;save();render();showToast(`「${q.title}」を完了し、イベントを終了しました。`); }
      function skipCurrent() { const event=currentEvent(); const q=activeQueue(event); if(!event||!q)return; const n=nextQueue(event); q.state='skipped';q.completedAt=new Date().toISOString(); if(n&&n.state==='pending')n.state='active';save();render();showToast(`「${q.title}」をスキップしました。`); }
      function moveQueue(id,dir) { const event=currentEvent(); const qs=sortedQueues(event);const i=qs.findIndex(q=>q.id===id),j=i+dir;if(!event||i<0||j<0||j>=qs.length)return;const a=qs[i].plannedAt;qs[i].plannedAt=qs[j].plannedAt;qs[j].plannedAt=a;save();render(); }
      function deleteQueue(id) { const event=currentEvent();const q=event?.queues.find(x=>x.id===id);if(!q)return;if(!confirm(`キュー「${q.title}」を削除しますか？`))return;const was=q.state==='active';event.queues=event.queues.filter(x=>x.id!==id);if(was)rebuildActive(event);save();render();showToast('キューを削除しました。'); }
      function deleteEvent(id) { const e=state.events.find(x=>x.id===id);if(!e)return;if(!confirm(`イベント「${e.name}」と全キューを削除しますか？`))return;state.events=state.events.filter(x=>x.id!==id);state.activeEventId=state.events[0]?.id||null;save();render();showToast('イベントを削除しました。'); }
      function exportData() { const data={format:'event-flow-autoqueue',version:1,exportedAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`event-flow-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('バックアップを書き出しました。'); }
      function importData(file) { if(!file)return;const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);if(!confirm('現在のデータを、読み込むバックアップで置き換えますか？'))return;state=normalize(raw.data||raw);save();render();showToast('バックアップを読み込みました。');}catch{showToast('読み込めませんでした。JSONファイルを確認してください。');}};r.readAsText(file); }
      function clearData() { if(!confirm('この端末に保存した全イベントとキューを削除します。元に戻せません。'))return;state={activeEventId:null,ui:{view:'events'},events:[]};save();render();showToast('全データを削除しました。'); }

      document.addEventListener('click', e=>{ const button=e.target.closest('[data-action]'); if(!button)return; const a=button.dataset.action; const id=button.dataset.id;
        if(a==='close-modal')closeModal(); else if(a==='dismiss-auto'){previousAutoEvent='';render();} else if(a==='add-queue')openQueueForm(); else if(a==='edit-queue')openQueueForm(id); else if(a==='edit-current'){const q=activeQueue(currentEvent());if(q)openQueueForm(q.id);} else if(a==='open-recipe')openRecipeForm('',id); else if(a==='edit-recipe')openRecipeForm(id); else if(a==='toggle-tag')button.classList.toggle('selected'); else if(a==='create-event')openEventForm(); else if(a==='edit-event')openEventForm(id); else if(a==='open-event'){state.activeEventId=id;state.ui.view='field';save();render();} else if(a==='delete-event')deleteEvent(id); else if(a==='delete-queue')deleteQueue(id); else if(a==='move-queue')moveQueue(id,Number(button.dataset.dir)); else if(a==='shift-queues')shiftQueues(Number(button.dataset.min)); else if(a==='shift-now')shiftQueues(0,true); else if(a==='activate-condition')activateCondition(); else if(a==='record-must')recordMustCut(); else if(a==='undo-must')undoMustCut(); else if(a==='complete-no-duration')completeNoDuration(); else if(a==='complete-terminal')completeTerminal(); else if(a==='skip-current')skipCurrent(); else if(a==='export')exportData(); else if(a==='import')$('#importFile')?.click(); else if(a==='clear')clearData(); });
      document.addEventListener('change',e=>{if(e.target.id==='importFile')importData(e.target.files?.[0]);});
      document.addEventListener('dblclick',e=>{if(e.target.closest('button,.btn,.icon-btn,.map-link,.nav button,label.settings-line,[data-action]'))e.preventDefault();},{passive:false});
      $$('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
      $('#fontSizeBtn').addEventListener('click',cycleFontScale);
      $('#addButton').addEventListener('click',()=>state.ui.view==='events'?openEventForm():state.ui.view==='recipes'?openRecipeForm():openQueueForm());
      $('#eventSettingsBtn').addEventListener('click',openSettings);
      $('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal();});
      document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
      setInterval(()=>{const c=$('#clock');if(c)c.textContent=fullTimeText(new Date());handoffIfDue();const view=state.ui.view;if(view==='field'){const event=currentEvent(),q=activeQueue(event);if(q){const num=$('.countdown-number');const label=$('.countdown-label');const left=remaining(event,q);if(num&&left!==null){num.textContent=left<0?'+'+minuteText(-left):minuteText(left);label.textContent=left<0?'超過':'残り';const parent=num.closest('.countdown');parent.className=`countdown ${countdownClass(left)}`;const ring=$('#heroRingBar');if(ring){const circ=370.7;const r=Math.max(0,Math.min(1,left/(Math.max(1,Number(q.duration)||1))));ring.style.strokeDashoffset=String(circ*(1-r));ring.style.stroke=ringColor(left);const ringCopy=$('.hero-ring-copy b');const ringLabel=$('.hero-ring-copy span');if(ringCopy)ringCopy.textContent=left<0?'+'+Math.ceil(-left):Math.ceil(left);if(ringLabel)ringLabel.textContent=left<0?'OVER':'MIN LEFT';}}}}},1000);
      render();
    })();
  </script>
