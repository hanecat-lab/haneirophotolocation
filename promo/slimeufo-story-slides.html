<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:"Zen Maru Gothic",sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:0}
.pink{background:radial-gradient(circle at 30% 20%,#FFE3EE 0,#FFC2D6 45%,#F7A8C4 100%)}
.space{background:radial-gradient(circle at 50% 35%,#2a1650 0,#0d0a24 55%,#04030c 100%)}
.cyber{background:radial-gradient(circle at 50% 30%,#0b3a4a 0,#071626 55%,#020812 100%)}
.stars i{position:absolute;border-radius:50%;background:#fff;opacity:.8}
.bub i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 40%,rgba(255,143,171,.25) 70%,rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.5)}
.wrap{position:absolute;left:0;right:0;top:250px;bottom:330px;display:flex;flex-direction:column;align-items:center;gap:36px}
h1{font-size:96px;font-weight:900;line-height:1.18;text-align:center;letter-spacing:2px}
h1 em{font-style:normal}
.sub{font-size:44px;font-weight:700;text-align:center;line-height:1.4}
.phone{width:540px;border-radius:56px;padding:14px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.phone img{width:100%;display:block;border-radius:44px}
.dark .phone{background:#0e1a2a;box-shadow:0 0 60px rgba(0,229,255,.45)}
.tag{display:inline-block;padding:12px 34px;border-radius:999px;font-size:40px;font-weight:900}
.pinkt h1{color:#E2457A;text-shadow:0 0 0 #fff,-4px -4px 0 #fff,4px -4px 0 #fff,-4px 4px 0 #fff,4px 4px 0 #fff,0 10px 24px rgba(226,69,122,.35)}
.pinkt .sub{color:#C2185B}
.spacet h1{text-shadow:0 0 30px rgba(196,132,252,.9)}
.cybert h1{color:#e8feff;text-shadow:0 0 24px #00e5ff}
.cybert .sub{color:#9ff6ff}
.icons{display:flex;gap:60px;align-items:center}
.icons img{width:300px;height:300px;border-radius:70px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.big{font-size:150px}
.cta{margin-top:10px;padding:34px 70px;border-radius:999px;background:linear-gradient(90deg,#FF8FAB,#FFB86B);font-size:64px;font-weight:900;color:#fff;box-shadow:0 14px 40px rgba(255,107,154,.6)}
.arrow{font-size:120px;line-height:1;animation:none}
.url{font-size:30px;opacity:.8;font-weight:700}
.chips{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.chips span{padding:14px 30px;border-radius:999px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);font-size:38px;font-weight:900}
</style></head><body>
<div id="root"></div>
<script>
const s=+(new URLSearchParams(location.search).get('s')||1);
const stars=n=>'<div class="bg stars">'+Array.from({length:n},(_,i)=>{const x=(i*137)%1080,y=(i*251)%1920,r=2+(i%3)*2;return `<i style="left:${x}px;top:${y}px;width:${r}px;height:${r}px;opacity:${.3+(i%5)/8}"></i>`}).join('')+'</div>';
const bubs='<div class="bg bub">'+[[80,180,140],[860,320,110],[120,1500,170],[900,1650,130],[700,120,80],[40,900,90],[950,1050,100]].map(([x,y,r])=>`<i style="left:${x}px;top:${y}px;width:${r}px;height:${r}px"></i>`).join('')+'</div>';
const S={
1:`<div class="bg space"></div>${stars(140)}${bubs}<div class="wrap spacet" style="justify-content:center">
 <div class="icons"><img src="../assets/slimeufo-icon-512.png"></div>
 <h1>きみは<br><span class="big">何秒</span><br>よけきれる？</h1>
 <div class="sub" style="color:#ffd1e3">ぷよ避け ― 宇宙のよけゲー</div></div>`,
2:`<div class="bg pink"></div>${bubs}<div class="wrap pinkt">
 <h1>ぷくぷくバブルを<br>よけるだけ！</h1>
 <div class="phone"><img src="play_bubble_79.png" style="height:1000px;object-fit:cover;object-position:top"></div></div>`,
3:`<div class="bg space"></div>${stars(120)}<div class="wrap spacet">
 <h1>レベルが上がると<br>どんどん速く…！</h1>
 <div class="phone"><img src="play_bubble_159.png" style="height:1000px;object-fit:cover;object-position:top"></div></div>`,
4:`<div class="bg cyber"></div>${stars(100)}<div class="wrap cybert dark">
 <h1>隕石モードは<br>ガチ勢向け</h1>
 <div class="phone"><img src="play_meteor_79.png" style="height:1000px;object-fit:cover;object-position:top"></div></div>`,
5:`<div class="bg pink"></div>${bubs}<div class="wrap pinkt">
 <h1>全国ランキングで<br>1位をねらえ！</h1>
 <div class="phone"><img src="ranking.png" style="height:1000px;object-fit:cover;object-position:top"></div></div>`,
6:`<div class="bg space"></div>${stars(140)}${bubs}<div class="wrap spacet" style="justify-content:center">
 <div class="icons"><img src="../assets/slimeufo-icon-512.png" style="width:240px;height:240px"></div>
 <h1>リンクから<br>すぐ遊べる！</h1>
 <div class="chips"><span>無料</span><span>登録なし</span><span>ブラウザで</span></div>
 <div class="arrow">👇</div>
 <div class="url">hanecat-lab.github.io/haneirophotolocation/slimeufo.html</div></div>`};
document.getElementById('root').innerHTML=S[s];
</script></body></html>
