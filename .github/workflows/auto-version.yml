name: Auto Version Stamp & Deploy

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.glb'
      - 'lib/**'
      - '*.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイ途中で次のpushに打ち切られると、Pages側の同期が中途半端に残り
# 次のデプロイも止まりやすくなるため、実行中のものは最後まで走らせる
# (待機中の古い実行は新しい実行に置き換えられる)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  stamp-and-deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # HTMLのバージョン更新
      - name: Stamp version
        run: |
          VER=$(date +%Y%m%d-%H%M%S)

          for f in *.html
          do
            if grep -q "APP_VERSION" "$f"; then
              sed -i -E \
              "s/APP_VERSION *= *\"[^\"]*\"/APP_VERSION=\"$VER\"/" \
              "$f"
            fi
          done

      # 更新確認
      - name: Verify version
        run: |
          echo "=== APP_VERSION CHECK ==="
          grep -R "APP_VERSION" --include="*.html" .

      # GitHub Pages設定
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 公開ファイル作成
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # デプロイ(Pages側の syncing_files で止まることがあるため、
      # 時間切れ・失敗したら同じ成果物でもう1回だけやり直す)
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
