name: Auto Version Stamp & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'photo-location.html'
      - 'travel-archive-b.html'
      - 'ai-workspace.html'

# GitHub Pages へのデプロイ権限を追加
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  stamp-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp version
        run: |
          VER=$(date +%Y%m%d-%H%M%S)
          CHANGED=$(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' 2>/dev/null || printf 'photo-location.html\ntravel-archive-b.html\nai-workspace.html\n')

          for f in photo-location.html travel-archive-b.html ai-workspace.html; do
            if echo "$CHANGED" | grep -qx "$f"; then
              sed -i "s/const APP_VERSION=\"[^\"]*\"/const APP_VERSION=\"$VER\"/" "$f"
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # [skip ci] を除外し、普通のコミットにする
          git diff --staged --quiet || git commit -m "chore: auto-stamp version"
          git push

      # 以下でPages用の成果物をセットアップしてデプロイを実行
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
