name: Auto Version Stamp & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'photo-location.html'
      - 'travel-archive-b.html'
      - 'ai-workspace.html'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  stamp-and-deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # バージョン番号更新
      - name: Stamp version
        run: |
          VER=$(date +%Y%m%d-%H%M%S)

          for f in photo-location.html travel-archive-b.html ai-workspace.html
          do
            if [ -f "$f" ]; then
              sed -i -E \
              "s/APP_VERSION *= *\"[^\"]*\"/APP_VERSION=\"$VER\"/" \
              "$f"
            fi
          done

      # 更新確認
      - name: Verify version
        run: |
          grep APP_VERSION photo-location.html || true
          grep APP_VERSION travel-archive-b.html || true
          grep APP_VERSION ai-workspace.html || true


      # Pages設定
      - name: Setup Pages
        uses: actions/configure-pages@v5


      # 配布ファイル作成
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'


      # デプロイ
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
