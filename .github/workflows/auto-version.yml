name: Auto Version Stamp & Deploy

on:
  push:
    branches: [main]
    paths:
      - '*.html'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  stamp-and-deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # HTMLのバージョン更新
      - name: Stamp version
        run: |
          VER=$(date +%Y%m%d-%H%M%S)

          for f in *.html
          do
            if grep -q "APP_VERSION" "$f"; then
              sed -i -E \
              "s/APP_VERSION *= *\"[^\"]*\"/APP_VERSION=\"$VER\"/" \
              "$f"
            fi
          done

      # 更新確認
      - name: Verify version
        run: |
          echo "=== APP_VERSION CHECK ==="
          grep -R "APP_VERSION" --include="*.html" .

      # GitHub Pages設定
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 公開ファイル作成
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # デプロイ
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
