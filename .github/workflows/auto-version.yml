name: Auto Version Stamp & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'photo-location.html'
      - 'travel-archive-b.html'
      - 'ai-workspace.html'

permissions:
  contents: read
  pages: write
  id-token: write

# 古いデプロイジョブを自動キャンセルしてキュー詰まりを回避
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  stamp-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. HTML内のバージョン表記のみを書き換え
      - name: Stamp version
        run: |
          VER=$(date +%Y%m%d-%H%M%S)
          for f in photo-location.html travel-archive-b.html ai-workspace.html; do
            if [ -f "$f" ]; then
              sed -i "s/const APP_VERSION=\"[^\"]*\"/const APP_VERSION=\"$VER\"/" "$f"
            fi
          done

      # 2. 書き換えた状態のまま GitHub Pages にデプロイ
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
