<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual Androgynous Humanoids - Chrome & Glass SDF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; }
    #canvas-container { width: 100vw; height: 100vh; }
    .ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      letter-spacing: 0.2em;
      font-family: sans-serif;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="ui-hint">CHROME & GLASS HUMANOIDS • DRAG TO ROTATE</div>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // GLSL Raymarching Shader
    const fragmentShader = `
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_mouse;

      #define MAX_STEPS 128
      #define SURF_DIST 0.001
      #define MAX_DIST 20.0

      // スムースフュージョン
      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      // 回転関数
      mat2 rotX(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
      }

      vec3 rotateX(vec3 p, float a) {
        float s = sin(a), c = cos(a);
        return vec3(p.x, c * p.y - s * p.z, s * p.y + c * p.z);
      }

      vec3 rotateZ(vec3 p, float a) {
        float s = sin(a), c = cos(a);
        return vec3(c * p.x - s * p.y, s * p.x + c * p.y, p.z);
      }

      // 基本形状
      float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
        vec3 pa = p - a, ba = b - a;
        float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
        return length(pa - ba * h) - r;
      }

      float sdEllipsoid(vec3 p, vec3 r) {
        float k0 = length(p/r);
        float k1 = length(p/(r*r));
        return k0*(k0-1.0)/k1;
      }

      float noise(vec3 p) {
        return sin(p.x*10.0 + u_time*3.0) * sin(p.y*10.0 + u_time*2.5) * sin(p.z*10.0 + u_time*3.5) * 0.012;
      }

      // 単体アンドロイドボディのSDF（原点中心）
      float sdHumanoid(vec3 p) {
        float t = u_time * 1.5;
        float fluidEffect = noise(p);

        // 1. 頭部〜首
        float head = sdEllipsoid(p - vec3(0.0, 1.35, 0.0), vec3(0.11, 0.15, 0.12));
        float neck = sdCapsule(p, vec3(0.0, 1.25, 0.0), vec3(0.0, 1.05, 0.0), 0.048);
        float upperHead = smin(head, neck, 0.05);

        // 2. 鎖骨・肩
        float clavicle = sdCapsule(p, vec3(-0.15, 1.05, 0.0), vec3(0.15, 1.05, 0.0), 0.04);
        upperHead = smin(upperHead, clavicle, 0.05);

        // 3. 胴体（中性・フラット）
        float torso = sdEllipsoid(p - vec3(0.0, 0.85, 0.0), vec3(0.13, 0.22, 0.09));
        float waist = sdCapsule(p, vec3(0.0, 0.75, 0.0), vec3(0.0, 0.45, 0.0), 0.088);
        float pelvis = sdEllipsoid(p - vec3(0.0, 0.38, 0.0), vec3(0.125, 0.12, 0.10));

        float bodyCore = smin(torso, waist, 0.08);
        bodyCore = smin(bodyCore, pelvis, 0.08);

        // 4. 動的腕関節
        vec3 pArmL = p - vec3(-0.16, 1.0, 0.0);
        pArmL = rotateX(pArmL, sin(t) * 0.5);
        pArmL = rotateZ(pArmL, cos(t * 0.8) * 0.3 + 0.3);
        float upperArmL = sdCapsule(pArmL, vec3(0.0), vec3(-0.02, -0.3, 0.0), 0.035);
        
        vec3 pForearmL = pArmL - vec3(-0.02, -0.3, 0.0);
        pForearmL = rotateX(pForearmL, sin(t * 1.2) * 0.4 + 0.4);
        float lowerArmL = sdCapsule(pForearmL, vec3(0.0), vec3(-0.02, -0.3, 0.05), 0.028);
        float armL = smin(upperArmL, lowerArmL, 0.04);

        vec3 pArmR = p - vec3(0.16, 1.0, 0.0);
        pArmR = rotateX(pArmR, -cos(t * 0.9) * 0.6);
        pArmR = rotateZ(pArmR, -sin(t * 0.7) * 0.3 - 0.3);
        float upperArmR = sdCapsule(pArmR, vec3(0.0), vec3(0.02, -0.3, 0.0), 0.035);

        vec3 pForearmR = pArmR - vec3(0.02, -0.3, 0.0);
        pForearmR = rotateX(pForearmR, cos(t * 1.1) * 0.4 + 0.4);
        float lowerArmR = sdCapsule(pForearmR, vec3(0.0), vec3(0.02, -0.3, 0.05), 0.028);
        float armR = smin(upperArmR, lowerArmR, 0.04);

        // 5. 動的脚関節
        vec3 pLegL = p - vec3(-0.07, 0.35, 0.0);
        pLegL = rotateX(pLegL, -sin(t * 0.8) * 0.4);
        float thighL = sdCapsule(pLegL, vec3(0.0), vec3(0.0, -0.4, 0.0), 0.052);

        vec3 pCalfL = pLegL - vec3(0.0, -0.4, 0.0);
        pCalfL = rotateX(pCalfL, max(0.0, sin(t * 0.8)) * 0.5);
        float calfL = sdCapsule(pCalfL, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.038);
        float legL = smin(thighL, calfL, 0.04);

        vec3 pLegR = p - vec3(0.07, 0.35, 0.0);
        pLegR = rotateX(pLegR, sin(t * 0.8) * 0.4);
        float thighR = sdCapsule(pLegR, vec3(0.0), vec3(0.0, -0.4, 0.0), 0.052);

        vec3 pCalfR = pLegR - vec3(0.0, -0.4, 0.0);
        pCalfR = rotateX(pCalfR, max(0.0, -sin(t * 0.8)) * 0.5);
        float calfR = sdCapsule(pCalfR, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.038);
        float legR = smin(thighR, calfR, 0.04);

        // 結合（※円形足元溜まりは完全削除）
        float body = smin(upperHead, bodyCore, 0.07);
        body = smin(body, armL, 0.05);
        body = smin(body, armR, 0.05);
        body = smin(body, legL, 0.06);
        body = smin(body, legR, 0.06);

        return body + fluidEffect;
      }

      // シーン全体：クローム（左）とガラス（右）の2体を配置
      vec2 map(vec3 p) {
        p *= 1.35; // スケール調整

        // 左モデル：クローム (ID: 1.0)
        vec3 pChrome = p - vec3(-0.65, -0.3, 0.0);
        float dChrome = sdHumanoid(pChrome);

        // 右モデル：ガラス (ID: 2.0)
        vec3 pGlass = p - vec3(0.65, -0.3, 0.0);
        float dGlass = sdHumanoid(pGlass);

        if (dChrome < dGlass) {
          return vec2(dChrome / 1.35, 1.0);
        } else {
          return vec2(dGlass / 1.35, 2.0);
        }
      }

      // 法線計算
      vec3 calcNormal(vec3 p) {
        float d = map(p).x;
        vec2 e = vec2(0.0008, 0.0);
        vec3 n = d - vec3(
          map(p - e.xyy).x,
          map(p - e.yxy).x,
          map(p - e.yyx).x
        );
        return normalize(n);
      }

      // 背景グリッドグラデーション
      vec3 getBackground(vec3 rd) {
        float bgPattern = sin(rd.x * 12.0) * sin(rd.y * 12.0);
        vec3 baseBg = mix(vec3(0.01, 0.01, 0.03), vec3(0.05, 0.08, 0.15), rd.y * 0.5 + 0.5);
        return baseBg + vec3(0.02, 0.04, 0.08) * smoothstep(0.2, 0.8, bgPattern);
      }

      // レンダリング処理
      vec3 render(vec3 ro, vec3 rd) {
        float dO = 0.0;
        float matID = 0.0;

        for(int i = 0; i < MAX_STEPS; i++) {
          vec3 p = ro + rd * dO;
          vec2 res = map(p);
          float dS = res.x;
          matID = res.y;
          dO += dS;
          if(dS < SURF_DIST || dO > MAX_DIST) break;
        }

        if(dO > MAX_DIST) return getBackground(rd);

        vec3 p = ro + rd * dO;
        vec3 n = calcNormal(p);

        // 1. クローム材質（左）
        if (matID < 1.5) {
          vec3 r = reflect(rd, n);
          float envMap = sin(r.x * 5.0) * sin(r.y * 5.0) * sin(r.z * 5.0);
          envMap = smoothstep(-0.3, 0.7, envMap);

          vec3 col = mix(vec3(0.18, 0.22, 0.28), vec3(0.95, 0.98, 1.0), envMap);
          float fresnel = pow(1.0 - max(0.0, dot(-rd, n)), 3.5);
          col += vec3(0.35, 0.65, 0.95) * fresnel;
          return col;
        } 
        // 2. ガラス透明材質（右）
        else {
          float eta = 1.0 / 1.45; // ガラス屈折率
          vec3 refRay = refract(rd, n, eta);
          vec3 reflectRay = reflect(rd, n);

          // フレネル反射率計算
          float fresnel = pow(1.0 - max(0.0, dot(-rd, n)), 3.0);

          // 屈折光（オブジェクト背景を透過・屈折）
          vec3 refrColor = getBackground(refRay.length() > 0.0 ? refRay : reflectRay);
          refrColor += vec3(0.1, 0.25, 0.4) * 0.3; // 内部サイアン散乱光

          // 反射光（環境・スペキュラ）
          float spec = pow(max(0.0, dot(reflectRay, normalize(vec3(1.0, 2.0, -1.0)))), 32.0);
          vec3 reflColor = vec3(0.9, 0.95, 1.0) * spec + vec3(0.4, 0.7, 1.0) * fresnel;

          return mix(refrColor, reflColor, clamp(fresnel + 0.15, 0.0, 1.0));
        }
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;

        vec3 ro = vec3(0.0, 0.0, 3.8);
        vec3 rd = normalize(vec3(uv, -1.6));

        // フル3D回転制御
        float rotXAngle = u_mouse.y * 1.8;
        float rotYAngle = u_time * 0.2 + u_mouse.x * 3.0;

        ro.yz *= rotX(rotXAngle);
        rd.yz *= rotX(rotXAngle);

        ro.xz *= rotX(rotYAngle);
        rd.xz *= rotX(rotYAngle);

        vec3 col = render(ro, rd);

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({
      vertexShader: `
        void main() {
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: fragmentShader,
      uniforms: {
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        u_time: { value: 0 },
        u_mouse: { value: new THREE.Vector2(0, 0) }
      }
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(plane);

    let isDragging = false;
    let mousePos = { x: 0, y: 0 };

    window.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        mousePos.x += e.movementX * 0.003;
        mousePos.y = Math.max(-0.8, Math.min(0.8, mousePos.y + e.movementY * 0.003));
      }
      material.uniforms.u_mouse.value.set(mousePos.x, mousePos.y);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      material.uniforms.u_time.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
