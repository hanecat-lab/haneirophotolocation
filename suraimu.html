<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Memeshikute Dance: Cat Mischief Run</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; background-color: #020205; font-family: sans-serif; touch-action: none; }
    #canvas-container { width: 100vw; height: 100dvh; }
    
    .ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      max-width: 320px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 10px 8px;
      border-radius: 16px;
      font-size: 11px;
      letter-spacing: 0.05em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      outline: none;
      text-align: center;
    }
    .btn:hover, .btn:active {
      background: rgba(255, 255, 255, 0.3);
    }
    .btn.active {
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      font-weight: bold;
    }

    .bpm-container {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 12px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #fff;
      font-size: 11px;
    }
    .bpm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bpm-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
    }
    .bpm-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #64ffda;
      cursor: pointer;
    }

    .ui-hint {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
      letter-spacing: 0.15em;
      pointer-events: none;
      white-space: nowrap;
    }
    .game-hud {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      min-width: 132px;
      padding: 11px 12px;
      border: 1px solid rgba(100, 255, 218, 0.35);
      border-radius: 16px;
      background: rgba(3, 14, 18, 0.58);
      color: #fff;
      font-size: 11px;
      line-height: 1.45;
      letter-spacing: 0.08em;
      text-align: right;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .game-hud strong { color: #64ffda; font-size: 15px; }
    .game-hud.hidden { display: none; }
    #game-message { color: #b8fff0; font-size: 9px; white-space: nowrap; }
    .panel-toggle {
      flex: none;
      align-self: flex-start;
      padding: 7px 11px;
      border-radius: 14px;
      font-size: 10px;
    }
    .ui-panel.collapsed { right: auto; }
    .ui-panel.collapsed > :not(.panel-toggle) { display: none; }
    .sway-controls {
      position: absolute;
      z-index: 11;
      bottom: 74px;
      left: 50%;
      display: flex;
      gap: 12px;
      transform: translateX(-50%);
    }
    .sway-button {
      width: min(145px, 39vw);
      min-height: 54px;
      border: 1px solid rgba(100, 255, 218, 0.8);
      border-radius: 28px;
      background: rgba(10, 52, 56, 0.72);
      color: #d9fff7;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.18em;
      box-shadow: 0 0 22px rgba(100, 255, 218, 0.22);
      backdrop-filter: blur(10px);
      cursor: pointer;
      touch-action: manipulation;
    }
    .sway-button.expected { background: rgba(100, 255, 218, 0.9); color: #05201d; box-shadow: 0 0 28px rgba(100, 255, 218, 0.72); }
    .sway-button:active { transform: scale(0.94); }
    .sway-controls.hidden { display: none; }
    @media (max-width: 560px) {
      .ui-panel { max-width: calc(100vw - 32px); }
      .game-hud { top: 171px; right: 16px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="game-hud" aria-live="polite">
    SCORE <strong id="score">00000</strong><br>
    COMBO <span id="combo">x0</span><br>
    <span id="game-message">MATCH THE SWAY</span>
  </div>
  <div class="sway-controls" id="sway-controls">
    <button class="sway-button" data-direction="-1" type="button">← LEFT</button>
    <button class="sway-button" data-direction="1" type="button">RIGHT →</button>
  </div>

  <div class="ui-panel">
    <button id="panel-toggle" class="btn panel-toggle" type="button" aria-expanded="true">HIDE CONTROLS</button>
    <div class="btn-group" id="mode-group">
      <button class="btn active" data-mode="0">DANCE</button>
      <button class="btn" data-mode="1">WALK</button>
      <button class="btn" data-mode="2">SLIME</button>
    </div>
    
    <div class="bpm-container">
      <div class="bpm-header">
        <span>BPM</span>
        <span id="bpm-val" style="font-weight: bold; color: #64ffda;">120</span>
      </div>
      <input type="range" id="bpm-slider" class="bpm-slider" min="30" max="1500" value="120" step="1">
    </div>

    <div class="btn-group">
      <button id="btn-light" class="btn active">LIGHT: SIDE</button>
      <button id="btn-rotate" class="btn">ROTATE: OFF</button>
      <button id="btn-game" class="btn active">GAME: ON</button>
    </div>
  </div>

  <div class="ui-hint">モデルと同じ方向のボタンを押そう</div>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(container.clientWidth, container.clientHeight);
    // 4体のSDFをモバイルでも滑らかに描くため、描画解像度は適度に抑える。
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
    container.appendChild(renderer.domElement);

    const fragmentShader = `
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_mouse;
      uniform float u_speed;
      uniform float u_side_light;
      uniform float u_rotate;
      uniform float u_mode;
      uniform float u_cat_offset;
      uniform float u_cat_jump;
      uniform float u_cat_aura;
      uniform float u_human_aura;

      #define MAX_STEPS 72
      #define SURF_DIST 0.0015
      #define MAX_DIST 15.0

      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      mat2 rot(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
      }

      vec3 rotateX(vec3 p, float a) {
        float s = sin(a), c = cos(a);
        return vec3(p.x, c * p.y - s * p.z, s * p.y + c * p.z);
      }

      vec3 rotateY(vec3 p, float a) {
        float s = sin(a), c = cos(a);
        return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z);
      }

      vec3 rotateZ(vec3 p, float a) {
        float s = sin(a), c = cos(a);
        return vec3(c * p.x - s * p.y, s * p.x + c * p.y, p.z);
      }

      float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
        vec3 pa = p - a, ba = b - a;
        float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
        return length(pa - ba * h) - r;
      }

      float sdEllipsoid(vec3 p, vec3 r) {
        float k0 = length(p/r);
        float k1 = length(p/(r*r));
        return k0*(k0-1.0)/max(k1, 0.0001);
      }

      float sdCone(vec3 p, vec2 c, float h) {
        vec2 q = h * vec2(c.x / c.y, -1.0);
        vec2 w = vec2(length(p.xz), p.y);
        vec2 a = w - q * clamp(dot(w, q) / dot(q, q), 0.0, 1.0);
        vec2 b = w - q * vec2(clamp(w.x / q.x, 0.0, 1.0), 1.0);
        float k = sign(q.y);
        float d = min(dot(a, a), dot(b, b));
        float s = max(k * (w.x * q.y - w.y * q.x), k * (w.y - q.y));
        return sqrt(d) * sign(s);
      }

      // --- ヒューマノイド SDF ---
      float sdHumanoid(vec3 p, float modelIndex) {
        float rawTime = u_time * u_speed;
        
        if (u_mode < 0.5) {
          // DANCE
          float cycle = rawTime * 1.2 + modelIndex * 0.5;
          float dir = sin(cycle);
          float sideStep = dir * 0.25;
          float bounce = abs(sin(cycle * 2.0)) * 0.08;

          p.y -= bounce;
          p.x -= sideStep;

          float leanAngle = dir * 0.5236;
          p = rotateZ(p, -leanAngle);

          vec3 pHead = p - vec3(0.0, 1.35, 0.0);
          pHead = rotateY(pHead, -dir * 0.6); 
          pHead = rotateX(pHead, 0.15); 

          float head = sdEllipsoid(pHead, vec3(0.11, 0.15, 0.12));
          float neck = sdCapsule(p, vec3(0.0, 1.25, 0.0), vec3(0.0, 1.05, 0.0), 0.048);
          float upperHead = smin(head, neck, 0.05);
          float clavicle = sdCapsule(p, vec3(-0.16, 1.05, 0.0), vec3(0.16, 1.05, 0.0), 0.04);
          upperHead = smin(upperHead, clavicle, 0.05);

          float torso = sdEllipsoid(p - vec3(0.0, 0.85, 0.0), vec3(0.13, 0.22, 0.09));
          float waist = sdCapsule(p, vec3(0.0, 0.75, 0.0), vec3(0.0, 0.45, 0.0), 0.088);
          float pelvis = sdEllipsoid(p - vec3(0.0, 0.38, 0.0), vec3(0.125, 0.12, 0.10));
          float bodyCore = smin(torso, waist, 0.08);
          bodyCore = smin(bodyCore, pelvis, 0.08);

          float blend = smoothstep(-0.2, 0.2, dir);

          vec3 pArmR = p - vec3(0.16, 1.02, 0.0);
          pArmR = rotateY(pArmR, mix(0.0, -0.9, blend));
          pArmR = rotateZ(pArmR, mix(-0.2, -0.6, blend));
          pArmR = rotateX(pArmR, mix(0.1, -0.4, blend));
          float upperArmR = sdCapsule(pArmR, vec3(0.0), vec3(0.0, -0.24, 0.08), 0.035);
          vec3 pForearmR = pArmR - vec3(0.0, -0.24, 0.08);
          pForearmR = rotateX(pForearmR, mix(0.1, -1.8, blend));
          pForearmR = rotateY(pForearmR, mix(0.0, 0.5, blend));
          float lowerArmR = sdCapsule(pForearmR, vec3(0.0), vec3(-0.05, -0.22, -0.05), 0.030);
          float armR = smin(upperArmR, lowerArmR, 0.03);

          vec3 pArmL = p - vec3(-0.16, 1.02, 0.0);
          pArmL = rotateY(pArmL, mix(0.9, 0.0, blend));
          pArmL = rotateZ(pArmL, mix(0.6, 0.2, blend));
          pArmL = rotateX(pArmL, mix(-0.4, 0.1, blend));
          float upperArmL = sdCapsule(pArmL, vec3(0.0), vec3(0.0, -0.24, 0.08), 0.035);
          vec3 pForearmL = pArmL - vec3(0.0, -0.24, 0.08);
          pForearmL = rotateX(pForearmL, mix(-1.8, 0.1, blend));
          pForearmL = rotateY(pForearmL, mix(-0.5, 0.0, blend));
          float lowerArmL = sdCapsule(pForearmL, vec3(0.0), vec3(0.05, -0.22, -0.05), 0.030);
          float armL = smin(upperArmL, lowerArmL, 0.03);

          vec3 pLegL = p - vec3(-0.07, 0.35, 0.0);
          pLegL = rotateX(pLegL, sin(cycle) * 0.2);
          float thighL = sdCapsule(pLegL, vec3(0.0), vec3(0.0, -0.4, 0.0), 0.052);
          vec3 pCalfL = pLegL - vec3(0.0, -0.4, 0.0);
          pCalfL = rotateX(pCalfL, -abs(sin(cycle)) * 0.8);
          float calfL = sdCapsule(pCalfL, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.038);
          float legL = smin(thighL, calfL, 0.04);

          vec3 pLegR = p - vec3(0.07, 0.35, 0.0);
          pLegR = rotateX(pLegR, -sin(cycle) * 0.2);
          float thighR = sdCapsule(pLegR, vec3(0.0), vec3(0.0, -0.4, 0.0), 0.052);
          vec3 pCalfR = pLegR - vec3(0.0, -0.4, 0.0);
          pCalfR = rotateX(pCalfR, -abs(cos(cycle)) * 0.8);
          float calfR = sdCapsule(pCalfR, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.038);
          float legR = smin(thighR, calfR, 0.04);

          float body = smin(upperHead, bodyCore, 0.07);
          body = smin(body, armL, 0.05);
          body = smin(body, armR, 0.05);
          body = smin(body, legL, 0.06);
          body = smin(body, legR, 0.06);
          return body;
        }
        else if (u_mode < 1.5) {
          // WALK: 人型の前方軸はX軸。画面上では右向き（+X）にそろえる。

          float walkCycle = rawTime * 3.5 + modelIndex * 1.5;
          float bob = abs(sin(walkCycle * 2.0)) * 0.05;
          p.y -= bob;

          p = rotateZ(p, 0.08); // 右向きの進行方向へ前傾

          vec3 pHead = p - vec3(0.0, 1.35, 0.0);
          float head = sdEllipsoid(pHead, vec3(0.11, 0.15, 0.12));
          float neck = sdCapsule(p, vec3(0.0, 1.25, 0.0), vec3(0.0, 1.05, 0.0), 0.048);
          float upperHead = smin(head, neck, 0.05);

          float torso = sdEllipsoid(p - vec3(0.0, 0.85, 0.0), vec3(0.13, 0.22, 0.09));
          float waist = sdCapsule(p, vec3(0.0, 0.75, 0.0), vec3(0.0, 0.45, 0.0), 0.088);
          float pelvis = sdEllipsoid(p - vec3(0.0, 0.38, 0.0), vec3(0.125, 0.12, 0.10));
          float bodyCore = smin(torso, waist, 0.08);
          bodyCore = smin(bodyCore, pelvis, 0.08);

          // 腕と足の振りを進行方向（Z軸回り）に統一
          vec3 pArmR = p - vec3(0.0, 1.0, 0.16);
          pArmR = rotateZ(pArmR, sin(walkCycle) * 0.7);
          float armR = sdCapsule(pArmR, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.035);

          vec3 pArmL = p - vec3(0.0, 1.0, -0.16);
          pArmL = rotateZ(pArmL, -sin(walkCycle) * 0.7);
          float armL = sdCapsule(pArmL, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.035);

          vec3 pLegL = p - vec3(0.0, 0.35, -0.07);
          pLegL = rotateZ(pLegL, -sin(walkCycle) * 0.85);
          float legL = sdCapsule(pLegL, vec3(0.0), vec3(0.0, -0.75, 0.0), 0.045);

          vec3 pLegR = p - vec3(0.0, 0.35, 0.07);
          pLegR = rotateZ(pLegR, sin(walkCycle) * 0.85);
          float legR = sdCapsule(pLegR, vec3(0.0), vec3(0.0, -0.75, 0.0), 0.045);

          float body = smin(upperHead, bodyCore, 0.07);
          body = smin(body, armL, 0.05);
          body = smin(body, armR, 0.05);
          body = smin(body, legL, 0.06);
          body = smin(body, legR, 0.06);
          return body;
        }
        else {
          // SLIME / GLITCH
          float t = rawTime * 1.5;
          float twistAmount = sin(t * 0.8 + modelIndex * 2.0) * 4.0 + cos(t * 0.3) * 3.0;
          p.xz *= rot(p.y * twistAmount);
          p.xy *= rot(sin(t * 0.5) * 0.5);

          vec3 waveP = p;
          float wave1 = sin(waveP.y * 5.0 + t * 3.0) * 0.12;
          float wave2 = cos(waveP.x * 4.0 - t * 2.5) * 0.12;
          float wave3 = sin(waveP.z * 6.0 + t * 3.5) * 0.12;
          p += vec3(wave1, wave2, wave3);

          vec3 pHead = p - vec3(0.0, 1.35, 0.0);
          float head = sdEllipsoid(pHead, vec3(0.12 + wave2 * 0.4, 0.14 + wave1 * 0.4, 0.12));
          float neck = sdCapsule(p, vec3(0.0, 1.25, 0.0), vec3(0.0, 1.05, 0.0), 0.05);
          float upperHead = smin(head, neck, 0.08);

          float torso = sdEllipsoid(p - vec3(0.0, 0.85, 0.0), vec3(0.14 + wave3 * 0.4, 0.24, 0.10));
          float waist = sdCapsule(p, vec3(0.0, 0.75, 0.0), vec3(0.0, 0.45, 0.0), 0.09);
          float pelvis = sdEllipsoid(p - vec3(0.0, 0.38, 0.0), vec3(0.13, 0.13, 0.11));
          float bodyCore = smin(torso, waist, 0.12);
          bodyCore = smin(bodyCore, pelvis, 0.12);

          vec3 pArmR = p - vec3(0.2, 1.0, 0.0);
          pArmR = rotateZ(pArmR, sin(t * 2.5 + p.y * 4.0) * 0.8);
          float armR = sdCapsule(pArmR, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.038);

          vec3 pArmL = p - vec3(-0.2, 1.0, 0.0);
          pArmL = rotateZ(pArmL, -cos(t * 2.5 + p.y * 4.0) * 0.8);
          float armL = sdCapsule(pArmL, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.038);

          vec3 pLegL = p - vec3(-0.1, 0.35, 0.0);
          pLegL = rotateX(pLegL, sin(t * 2.0) * 0.6);
          float legL = sdCapsule(pLegL, vec3(0.0), vec3(0.0, -0.7, 0.0), 0.05);

          vec3 pLegR = p - vec3(0.1, 0.35, 0.0);
          pLegR = rotateX(pLegR, -sin(t * 2.0) * 0.6);
          float legR = sdCapsule(pLegR, vec3(0.0), vec3(0.0, -0.7, 0.0), 0.05);

          float body = smin(upperHead, bodyCore, 0.12);
          body = smin(body, armL, 0.09);
          body = smin(body, armR, 0.09);
          body = smin(body, legL, 0.10);
          body = smin(body, legR, 0.10);

          float glitchNoise = sin(p.x * 15.0 + t * 5.0) * cos(p.y * 15.0 + t * 5.0) * sin(p.z * 15.0) * 0.025;
          return body + glitchNoise;
        }
      }

      // --- 猫型生物 SDF ---
      float sdCatCreature(vec3 p) {
        float rawTime = u_time * u_speed;

        if (u_mode < 0.5) {
          // DANCE
          float danceCycle = rawTime * 1.2;
          p.y -= abs(sin(danceCycle * 2.0)) * 0.06;
          p.x -= sin(danceCycle) * 0.15;
          // 人型の前傾と同じ向きにそろえ、猫だけ逆へ揺れないようにする。
          p = rotateZ(p, -sin(danceCycle) * 0.2);
        } else if (u_mode < 1.5) {
          // WALK: 猫の前方軸はZ軸なので、+X（人型と同じ右向き）へ変換する。
          p = rotateY(p, -1.5708);
          float walkCycle = rawTime * 3.5;
          p.y -= abs(sin(walkCycle * 2.0)) * 0.04;
          p = rotateX(p, -0.05); // 猫のローカル前方へわずかに傾斜
        } else {
          // SLIME
          float t = rawTime * 1.5;
          p.xz *= rot(p.y * 3.0 + sin(t));
          p += vec3(sin(t * 2.0) * 0.1, cos(t * 1.5) * 0.1, sin(t * 2.5) * 0.1);
        }

        vec3 pHead = p - vec3(0.0, 0.35, 0.0);
        float head = sdEllipsoid(pHead, vec3(0.14, 0.12, 0.12));

        vec3 pEarR = pHead - vec3(0.09, 0.1, 0.0);
        pEarR = rotateZ(pEarR, -0.3);
        float earR = sdCone(pEarR, vec2(0.05, 0.12), 0.12);

        vec3 pEarL = pHead - vec3(-0.09, 0.1, 0.0);
        pEarL = rotateZ(pEarL, 0.3);
        float earL = sdCone(pEarL, vec2(0.05, 0.12), 0.12);

        float ears = min(earR, earL);
        float headFull = smin(head, ears, 0.02);

        vec3 pBody = p - vec3(0.0, 0.12, 0.0);
        float body = sdEllipsoid(pBody, vec3(0.12, 0.16, 0.12));

        vec3 pTail = p - vec3(0.0, 0.05, -0.1);
        pTail.x += sin(rawTime * 3.0 + p.y * 5.0) * 0.1;
        float tail = sdCapsule(pTail, vec3(0.0, 0.0, 0.0), vec3(0.0, 0.25, -0.2), 0.025);

        // 猫の前方はローカルZ軸。足はX軸回転で前後（Z方向）に振る。
        float legCycle = rawTime * 3.5;
        vec3 pLegFR = p - vec3(0.0, 0.0, 0.08);
        vec3 pLegFL = p - vec3(0.0, 0.0, -0.08);
        vec3 pLegBR = p - vec3(0.0, 0.0, 0.08);
        vec3 pLegBL = p - vec3(0.0, 0.0, -0.08);

        if (u_mode >= 0.5 && u_mode < 1.5) {
          pLegFR = rotateX(pLegFR, sin(legCycle) * 0.6);
          pLegFL = rotateX(pLegFL, -sin(legCycle) * 0.6);
          pLegBR = rotateX(pLegBR, -sin(legCycle) * 0.6);
          pLegBL = rotateX(pLegBL, sin(legCycle) * 0.6);
        }

        float legFR = sdCapsule(pLegFR - vec3(0.08,0.0,0.0), vec3(0.0), vec3(0.0, -0.18, 0.0), 0.028);
        float legFL = sdCapsule(pLegFL - vec3(-0.08,0.0,0.0), vec3(0.0), vec3(0.0, -0.18, 0.0), 0.028);
        float legBR = sdCapsule(pLegBR - vec3(0.08,0.0,0.0), vec3(0.0), vec3(0.0, -0.18, 0.0), 0.028);
        float legBL = sdCapsule(pLegBL - vec3(-0.08,0.0,0.0), vec3(0.0), vec3(0.0, -0.18, 0.0), 0.028);

        float legs = min(min(legFR, legFL), min(legBR, legBL));

        float cat = smin(headFull, body, 0.05);
        cat = smin(cat, legs, 0.04);
        cat = smin(cat, tail, 0.03);

        return cat;
      }

      vec2 map(vec3 p) {
        p *= 1.35;
        float rawTime = u_time * u_speed;

        float aspect = u_resolution.x / u_resolution.y;
        float spacing = aspect < 1.0 ? 0.65 : 0.85;

        vec3 posChrome = vec3(-spacing * 1.20, -0.15, 0.0);
        vec3 posGlass = vec3(-spacing * 0.40, -0.15, 0.0);
        vec3 posGold = vec3(spacing * 0.40, -0.15, 0.0);
        vec3 posMagenta = vec3(spacing * 1.20, -0.15, 0.0);
        vec3 posCat = vec3(u_cat_offset, -0.35 + u_cat_jump, 0.1);

        // 4人の隊列が完全に左画面外へ抜けてから、右画面外へ戻ってくる。
        if (u_mode >= 0.5 && u_mode < 1.5) {
          float laneScroll = mod(rawTime * 0.26, 6.0) - 3.0;
          posChrome.x -= laneScroll;
          posGlass.x -= laneScroll;
          posGold.x -= laneScroll;
          posMagenta.x -= laneScroll;
        }

        if (u_mode > 1.5) {
          posChrome += vec3(sin(rawTime * 1.5) * 0.45, cos(rawTime * 1.8) * 0.35, sin(rawTime * 1.2) * 0.5);
          posGlass += vec3(-cos(rawTime * 1.3) * 0.5, -sin(rawTime * 1.6) * 0.4, cos(rawTime * 1.4) * 0.45);
          posCat += vec3(cos(rawTime * 2.0) * 0.4, sin(rawTime * 1.4) * 0.4, -sin(rawTime * 1.7) * 0.4);
        }

        float dChrome = sdHumanoid(p - posChrome, 0.0);
        float dGlass = sdHumanoid(p - posGlass, 1.0);
        float dGold = sdHumanoid(p - posGold, 2.0);
        float dMagenta = sdHumanoid(p - posMagenta, 3.0);
        float dCat = sdCatCreature(p - posCat);
        float dCatFriend = 100.0;

        // WALK中だけ、実時間で1分ごとに別の猫が右から左へ横切る。
        if (u_mode >= 0.5 && u_mode < 1.5) {
          float visitTime = mod(u_time, 60.0);
          if (visitTime > 56.0) {
            float visitProgress = (visitTime - 56.0) / 4.0;
            vec3 posCatFriend = vec3(mix(1.65, -1.65, visitProgress), -0.35, 0.1);
            dCatFriend = sdCatCreature(p - posCatFriend);
          }
        }

        float dMin = min(min(dChrome, dGlass), min(min(dGold, dMagenta), min(dCat, dCatFriend)));

        if (dMin == dChrome) return vec2(dChrome / 1.35, 1.0);
        if (dMin == dGlass) return vec2(dGlass / 1.35, 2.0);
        if (dMin == dGold) return vec2(dGold / 1.35, 3.0);
        if (dMin == dMagenta) return vec2(dMagenta / 1.35, 4.0);
        return vec2(min(dCat, dCatFriend) / 1.35, 5.0);
      }

      vec3 calcNormal(vec3 p) {
        float d = map(p).x;
        vec2 e = vec2(0.001, 0.0);
        return normalize(d - vec3(
          map(p - e.xyy).x,
          map(p - e.yxy).x,
          map(p - e.yyx).x
        ));
      }

      // --- WALK用：流星状スピードライン演出 ---
      vec3 getSpeedLines(vec3 rd) {
        if (u_mode < 0.5 || u_mode > 1.5) return vec3(0.0);

        float t = u_time * u_speed * 12.0;
        vec2 st = vec2(rd.x * 8.0 - t, rd.y * 30.0);
        float linePattern = sin(st.y + sin(st.x * 0.2)) * 0.5 + 0.5;
        linePattern = pow(linePattern, 18.0);

        float lineX = fract(rd.x * 3.0 - t * 0.5);
        float mask = smoothstep(0.1, 0.3, lineX) * smoothstep(0.9, 0.7, lineX);

        vec3 lineColor = mix(vec3(0.2, 0.8, 1.0), vec3(0.4, 1.0, 0.7), sin(rd.y * 10.0) * 0.5 + 0.5);
        return lineColor * linePattern * mask * 0.8;
      }

      vec3 getBackground(vec3 rd) {
        float bgPattern = sin(rd.x * 10.0) * sin(rd.y * 10.0);
        vec3 baseBg = mix(vec3(0.01, 0.015, 0.03), vec3(0.04, 0.06, 0.12), rd.y * 0.5 + 0.5);
        vec3 lines = getSpeedLines(rd);
        return baseBg + vec3(0.02, 0.03, 0.05) * smoothstep(0.2, 0.8, bgPattern) + lines;
      }

      // 猫の周りに、コンボに応じて広がる半透明のエメラルド光を重ねる。
      vec3 getCatAura(vec3 ro, vec3 rd) {
        if (u_cat_aura <= 0.001) return vec3(0.0);
        float catSway = sin(u_time * u_speed * 1.2) * 0.11;
        vec3 catCenter = vec3(catSway, -0.08, 0.07);
        vec3 toCat = catCenter - ro;
        float alongRay = max(dot(toCat, rd), 0.0);
        float rayDistance = length(toCat - rd * alongRay);
        float radius = mix(0.12, 0.44, u_cat_aura);
        float halo = 1.0 - smoothstep(radius * 0.25, radius, rayDistance);
        float pulse = 0.72 + 0.28 * sin(u_time * 9.0);
        return vec3(0.08, 1.0, 0.64) * halo * u_cat_aura * pulse * 0.75;
      }

      vec3 getHumanAura(vec3 ro, vec3 rd) {
        if (u_human_aura <= 0.001 || u_mode >= 0.5) return vec3(0.0);
        float rawTime = u_time * u_speed;
        float spacing = (u_resolution.x / u_resolution.y < 1.0) ? 0.65 : 0.85;
        float swayA = sin(rawTime * 1.2) * 0.185;
        float swayB = sin(rawTime * 1.2 + 0.5) * 0.185;
        float swayC = sin(rawTime * 1.2 + 1.0) * 0.185;
        float swayD = sin(rawTime * 1.2 + 1.5) * 0.185;
        vec3 centerA = vec3((-spacing * 1.20 + swayA) / 1.35, 0.44, 0.0);
        vec3 centerB = vec3((-spacing * 0.40 + swayB) / 1.35, 0.44, 0.0);
        vec3 centerC = vec3(( spacing * 0.40 + swayC) / 1.35, 0.44, 0.0);
        vec3 centerD = vec3(( spacing * 1.20 + swayD) / 1.35, 0.44, 0.0);
        float radius = mix(0.19, 0.42, u_human_aura);
        vec3 toA = centerA - ro, toB = centerB - ro;
        vec3 toC = centerC - ro, toD = centerD - ro;
        float distA = length(toA - rd * max(dot(toA, rd), 0.0));
        float distB = length(toB - rd * max(dot(toB, rd), 0.0));
        float distC = length(toC - rd * max(dot(toC, rd), 0.0));
        float distD = length(toD - rd * max(dot(toD, rd), 0.0));
        float halo = max(max(1.0 - smoothstep(radius * 0.25, radius, distA),
                             1.0 - smoothstep(radius * 0.25, radius, distB)),
                         max(1.0 - smoothstep(radius * 0.25, radius, distC),
                             1.0 - smoothstep(radius * 0.25, radius, distD)));
        return vec3(0.28, 0.62, 1.0) * halo * u_human_aura * 0.56;
      }

      vec3 render(vec3 ro, vec3 rd) {
        float dO = 0.0;
        float matID = 0.0;

        for(int i = 0; i < MAX_STEPS; i++) {
          vec3 p = ro + rd * dO;
          vec2 res = map(p);
          float dS = res.x;
          matID = res.y;
          dO += dS;
          if(dS < SURF_DIST || dO > MAX_DIST) break;
        }

        vec3 catAura = getCatAura(ro, rd);
        vec3 humanAura = getHumanAura(ro, rd);
        if(dO > MAX_DIST) return getBackground(rd) + catAura + humanAura;

        vec3 p = ro + rd * dO;
        vec3 n = calcNormal(p);

        vec3 sideLightDir = normalize(vec3(3.5, 0.1, 0.2));
        vec3 frontLightDir = normalize(vec3(0.0, 1.0, 1.0));
        vec3 lightDir = mix(frontLightDir, sideLightDir, u_side_light);
        
        float rawDiff = dot(n, lightDir);
        float diff = max(0.0, rawDiff);
        if (u_side_light > 0.5) diff = pow(diff, 2.2);

        float ambientCoeff = mix(0.15, 0.02, u_side_light);

        if (matID < 1.5) { // クロム
          vec3 r = reflect(rd, n);
          float envMap = smoothstep(-0.3, 0.7, sin(r.x * 5.0) * sin(r.y * 5.0) * sin(r.z * 5.0));
          vec3 baseColor = mix(vec3(0.08, 0.10, 0.14), vec3(0.95, 0.98, 1.0), envMap);
          float spec = pow(max(0.0, dot(r, lightDir)), mix(16.0, 32.0, u_side_light));
          vec3 col = baseColor * (diff + ambientCoeff) + vec3(1.0, 0.9, 0.7) * spec * (0.8 + 1.2 * u_side_light);
          return col + vec3(0.2, 0.45, 0.85) * pow(1.0 - max(0.0, dot(-rd, n)), 3.5) + catAura + humanAura;
        } 
        else if (matID < 2.5) { // ガラス
          vec3 reflectRay = reflect(rd, n);
          vec3 refRay = refract(rd, n, 1.0 / 1.35);
          if (length(refRay) == 0.0) refRay = reflectRay;

          float fresnel = pow(1.0 - max(0.0, dot(-rd, n)), 2.5);
          vec3 refrColor = getBackground(refRay) * (0.3 + 0.7 * (1.0 - u_side_light));
          float spec = pow(max(0.0, dot(reflectRay, lightDir)), 32.0);
          vec3 reflColor = vec3(0.9, 0.95, 1.0) * spec * (1.0 + u_side_light * 1.5) + vec3(0.3, 0.6, 1.0) * fresnel;

          return mix(refrColor, reflColor, clamp(fresnel + 0.15, 0.0, 1.0)) + vec3(0.08, 0.12, 0.18) * diff + catAura + humanAura;
        }
        else if (matID < 3.5) { // ゴールド
          vec3 r = reflect(rd, n);
          float spec = pow(max(0.0, dot(r, lightDir)), 26.0);
          vec3 gold = vec3(1.0, 0.57, 0.08);
          vec3 col = gold * (diff + ambientCoeff * 1.7) + vec3(1.0, 0.86, 0.42) * spec * 1.8;
          return col + gold * pow(1.0 - max(0.0, dot(-rd, n)), 3.0) * 0.45 + catAura + humanAura;
        }
        else if (matID < 4.5) { // マゼンタ
          vec3 r = reflect(rd, n);
          float spec = pow(max(0.0, dot(r, lightDir)), 30.0);
          vec3 magenta = vec3(0.95, 0.12, 0.68);
          vec3 col = magenta * (diff + ambientCoeff * 1.5) + vec3(1.0, 0.68, 0.94) * spec * 1.5;
          return col + magenta * pow(1.0 - max(0.0, dot(-rd, n)), 3.2) * 0.55 + catAura + humanAura;
        }
        else { // エメラルド（猫）
          vec3 reflectRay = reflect(rd, n);
          vec3 refRay = refract(rd, n, 1.0 / 1.45);
          if (length(refRay) == 0.0) refRay = reflectRay;

          float fresnel = pow(1.0 - max(0.0, dot(-rd, n)), 2.0);
          vec3 emeraldTint = vec3(0.1, 0.9, 0.6);
          vec3 refrColor = getBackground(refRay) * emeraldTint;
          float spec = pow(max(0.0, dot(reflectRay, lightDir)), 48.0);
          vec3 reflColor = vec3(0.6, 1.0, 0.8) * spec * 2.0 + emeraldTint * fresnel;

          return mix(refrColor, reflColor, clamp(fresnel + 0.2, 0.0, 1.0)) + emeraldTint * diff * 0.4 + catAura + humanAura;
        }
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;

        float aspect = u_resolution.x / u_resolution.y;
        // 縦長では画角だけを広げ、カメラの中心は常にモデル群の中心に固定する。
        float fovZoom = aspect < 1.0 ? mix(1.35, 1.0, aspect) : 1.0;
        vec3 ro = vec3(0.0, 0.15, 3.8 * fovZoom);
        vec3 rd = normalize(vec3(uv, -1.6));

        float rotXAngle = u_mouse.y * 1.8;
        float rotYAngle = (u_time * 0.2 * u_speed * u_rotate) + u_mouse.x * 3.0;

        ro.yz *= rot(rotXAngle);
        rd.yz *= rot(rotXAngle);
        ro.xz *= rot(rotYAngle);
        rd.xz *= rot(rotYAngle);

        vec3 col = render(ro, rd);
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const uniforms = {
      u_resolution: { value: new THREE.Vector2(container.clientWidth, container.clientHeight) },
      u_time: { value: 0 },
      u_mouse: { value: new THREE.Vector2(0, 0) },
      u_speed: { value: 1.0 },
      u_side_light: { value: 1.0 },
      u_rotate: { value: 0.0 },
      u_mode: { value: 0.0 },
      u_cat_offset: { value: 0.0 },
      u_cat_jump: { value: 0.0 },
      u_cat_aura: { value: 0.0 },
      u_human_aura: { value: 0.0 }
    };

    const material = new THREE.ShaderMaterial({
      vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
      fragmentShader: fragmentShader,
      uniforms: uniforms
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(plane);

    const modeButtons = document.querySelectorAll('#mode-group .btn');
    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        uniforms.u_mode.value = parseFloat(btn.dataset.mode);
        if (uniforms.u_mode.value === 0.0) resetGame();
        syncGameUI();
      });
    });

    const bpmSlider = document.getElementById('bpm-slider');
    const bpmValDisplay = document.getElementById('bpm-val');
    bpmSlider.addEventListener('input', (e) => {
      const bpm = parseFloat(e.target.value);
      bpmValDisplay.textContent = bpm;
      uniforms.u_speed.value = bpm / 120.0;
    });

    const btnLight = document.getElementById('btn-light');
    btnLight.addEventListener('click', () => {
      if (uniforms.u_side_light.value === 1.0) {
        uniforms.u_side_light.value = 0.0;
        btnLight.textContent = "LIGHT: FRONT";
        btnLight.classList.remove('active');
      } else {
        uniforms.u_side_light.value = 1.0;
        btnLight.textContent = "LIGHT: SIDE";
        btnLight.classList.add('active');
      }
    });

    const btnRotate = document.getElementById('btn-rotate');
    btnRotate.addEventListener('click', () => {
      if (uniforms.u_rotate.value === 1.0) {
        uniforms.u_rotate.value = 0.0;
        btnRotate.textContent = "ROTATE: OFF";
        btnRotate.classList.remove('active');
      } else {
        uniforms.u_rotate.value = 1.0;
        btnRotate.textContent = "ROTATE: ON";
        btnRotate.classList.add('active');
      }
    });

    const btnGame = document.getElementById('btn-game');

    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const messageEl = document.getElementById('game-message');
    const gameHud = document.querySelector('.game-hud');
    const swayControls = document.getElementById('sway-controls');
    const swayButtons = document.querySelectorAll('.sway-button');
    const panel = document.querySelector('.ui-panel');
    const panelToggle = document.getElementById('panel-toggle');
    let score = 0, combo = 0, lastSwaySegment = -1, gameEnabled = true, auraPulse = 0;

    function syncGameUI() {
      const playable = gameEnabled && uniforms.u_mode.value === 0.0;
      swayControls.classList.toggle('hidden', !playable);
      gameHud.classList.toggle('hidden', uniforms.u_mode.value !== 0.0);
      swayButtons.forEach(button => button.classList.remove('expected'));
      btnGame.textContent = gameEnabled ? 'GAME: ON' : 'GAME: OFF';
      btnGame.classList.toggle('active', gameEnabled);
      if (!gameEnabled) updateHud('DANCE MODE');
    }

    function updateHud(message) {
      scoreEl.textContent = String(score).padStart(5, '0');
      comboEl.textContent = `x${combo}`;
      if (message) messageEl.textContent = message;
    }
    function resetGame() {
      score = 0; combo = 0; lastSwaySegment = -1; auraPulse = 0;
      updateHud('MATCH THE SWAY');
    }
    function sway(direction) {
      if (!gameEnabled || uniforms.u_mode.value !== 0.0) return;
      const cycle = clock.elapsedTime * uniforms.u_speed.value * 1.2;
      const segment = Math.floor(cycle / Math.PI);
      const expectedDirection = Math.sin(cycle) >= 0.0 ? 1 : -1;
      if (segment === lastSwaySegment) {
        updateHud('次の揺れを待とう');
        return;
      }
      lastSwaySegment = segment;
      if (direction === expectedDirection) {
        combo += 1;
        score += 100 * Math.max(1, combo);
        auraPulse = 1.0;
        updateHud(combo >= 4 ? 'PERFECT SYNC!' : 'SYNCHRO!');
      } else {
        combo = 0;
        updateHud('逆方向！');
      }
    }

    swayButtons.forEach(button => button.addEventListener('click', () => sway(Number(button.dataset.direction))));
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
        e.preventDefault();
        sway(-1);
      } else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
        e.preventDefault();
        sway(1);
      }
    });
    panelToggle.addEventListener('click', () => {
      const collapsed = panel.classList.toggle('collapsed');
      panelToggle.textContent = collapsed ? 'SHOW CONTROLS' : 'HIDE CONTROLS';
      panelToggle.setAttribute('aria-expanded', String(!collapsed));
    });
    btnGame.addEventListener('click', () => {
      gameEnabled = !gameEnabled;
      if (gameEnabled && uniforms.u_mode.value === 0.0) resetGame();
      syncGameUI();
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;
      auraPulse = Math.max(0, auraPulse - delta * 1.7);
      if (gameEnabled && uniforms.u_mode.value === 0.0) {
        const cycle = elapsed * uniforms.u_speed.value * 1.2;
        const expectedDirection = Math.sin(cycle) >= 0.0 ? 1 : -1;
        swayButtons.forEach(button => button.classList.toggle('expected', Number(button.dataset.direction) === expectedDirection));
      }
      material.uniforms.u_time.value = elapsed;
      material.uniforms.u_cat_offset.value = 0.0;
      material.uniforms.u_cat_jump.value = 0.0;
      material.uniforms.u_cat_aura.value = gameEnabled && uniforms.u_mode.value === 0.0
        ? Math.min(1.0, combo / 10.0) * (0.55 + auraPulse * 0.45)
        : 0.0;
      material.uniforms.u_human_aura.value = gameEnabled && uniforms.u_mode.value === 0.0 && combo >= 50
        ? Math.min(1.0, 0.45 + (combo - 50) / 50.0)
        : 0.0;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h);
      material.uniforms.u_resolution.value.set(w, h);
    });
  </script>
</body>
</html>
