<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-1000 Liquid Metal Woman 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; }
    #canvas-container { width: 100vw; height: 100vh; }
    .ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      pointer-events: none;
      letter-spacing: 0.12em;
      font-family: sans-serif;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="ui-hint">LIQUID METAL FORM • DRAG TO ROTATE</div>

  <script type="module">
    import * as THREE from 'three';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Scene & Renderer Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.5, 5.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 2. Lighting & HDR Environment (液体金属のギラつきに必須)
    new RGBELoader().load('https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr', (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = texture;
    });

    const mainLight = new THREE.DirectionalLight(0xffffff, 3.0);
    mainLight.position.set(5, 10, 7);
    scene.add(mainLight);

    const blueRimLight = new THREE.DirectionalLight(0x00aaff, 2.0);
    blueRimLight.position.set(-5, 2, -5);
    scene.add(blueRimLight);

    // 3. T-1000 Chrome Liquid Material (ターミネーター風完全金属)
    const liquidMetalMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xcccccc,
      metalness: 1.0,           // 完全な金属質感
      roughness: 0.04,          // 超極小の粗さ（超鏡面）
      clearcoat: 1.0,
      clearcoatRoughness: 0.02,
      reflectivity: 1.0
    });

    // 4. 高精細女性シルエットメッシュ（高密度頂点ジオメトリ）
    // ※実稼働時はGLTFLoaderで高精度女性人体モデル（.gltf）を読み込んで適用可能
    const femaleBaseGeo = new THREE.CylinderGeometry(0.35, 0.25, 3.2, 128, 256);
    
    // スタイリッシュな女性ボディ（S字ライン・くびれ）へ初期頂点を変形
    const posAttr = femaleBaseGeo.attributes.position;
    const vertexCount = posAttr.count;
    const initialPositions = posAttr.array.slice();

    for (let i = 0; i < vertexCount; i++) {
      const i3 = i * 3;
      let y = initialPositions[i3 + 1]; // 高さ (-1.6 〜 +1.6)
      let x = initialPositions[i3];
      let z = initialPositions[i3 + 2];

      // 人体女性曲線のモデリング数式補正（胸部・ウエスト・ヒップ）
      let bodyShape = 1.0;
      if (y > 0.6) {
        // バストライン（膨らみ）
        bodyShape = 1.2 + Math.sin((y - 0.6) * Math.PI * 2) * 0.25;
      } else if (y > -0.2 && y <= 0.6) {
        // ウエスト（くびれ）
        bodyShape = 0.75 + Math.sin((y + 0.2) * Math.PI) * 0.15;
      } else if (y <= -0.2) {
        // ヒップライン
        bodyShape = 1.1 + Math.cos((y + 0.2) * Math.PI * 1.5) * 0.2;
      }

      posAttr.setX(i, x * bodyShape);
      posAttr.setZ(i, z * bodyShape);
    }
    femaleBaseGeo.computeVertexNormals();

    const womanMesh = new THREE.Mesh(femaleBaseGeo, liquidMetalMaterial);
    scene.add(womanMesh);

    // 5. ターミネーター風「溶け・流動ノイズ」関数
    function getFluidDisplacement(x, y, z, t) {
      // 下から上へ流れる縦方向のウェーブノイズ
      const flowY = y * 3.0 - t * 2.5;
      const wave1 = Math.sin(flowY + x * 2.0) * Math.cos(z * 2.0);
      const wave2 = Math.cos(y * 6.0 - t * 3.0) * 0.5;
      return (wave1 + wave2) * 0.08; // 表面のドロドロとしたうねり量
    }

    // 6. Animation Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      controls.update();

      // ---- 頂点レベルでの流体変形（T-1000の溶融・うねり再生） ----
      const positions = femaleBaseGeo.attributes.position;
      
      for (let i = 0; i < vertexCount; i++) {
        const i3 = i * 3;
        const x = initialPositions[i3];
        const y = initialPositions[i3 + 1];
        const z = initialPositions[i3 + 2];

        // 各頂点を法線方向に「溶けてうねる」動きを合成
        const displacement = getFluidDisplacement(x, y, z, t);

        // 崩れすぎず美しい人型を維持する拡縮計算
        positions.setXYZ(
          i,
          x + x * displacement,
          y + Math.sin(t * 1.5 + y) * 0.02, // 全体が波打つ微振動
          z + z * displacement
        );
      }

      positions.needsUpdate = true;
      femaleBaseGeo.computeVertexNormals(); // 鏡面金属の光反射をリアルタイム再計算

      // 自律的でスムーズな回転
      womanMesh.rotation.y = t * 0.25;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
