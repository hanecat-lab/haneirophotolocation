<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Glass Slime Woman</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #05030d; }
    #canvas-container { width: 100vw; height: 100vh; }
    .ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      pointer-events: none;
      letter-spacing: 0.1em;
      font-family: sans-serif;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="ui-hint">SLIME WOMAN • ROTATE / MOUSE HOVER TO SWAY</div>

  <script type="module">
    import * as THREE from 'three';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 2. Lighting & Environment Map
    new RGBELoader().load('https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr', (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = texture;
    });

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0xff70e0, 2.0);
    rimLight.position.set(-5, -2, -5);
    scene.add(rimLight);

    // 3. Glass Slime Material (透明度の高いピンク・パープルガラス)
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffd6fa,
      transmission: 0.95,
      opacity: 1.0,
      transparent: true,
      roughness: 0.04,
      ior: 1.48,                  // ガラス・液体の強固な屈折
      thickness: 1.2,
      clearcoat: 1.0,
      clearcoatRoughness: 0.02,
      attenuationDistance: 1.0,
      attenuationColor: new THREE.Color(0xff00b7) // 厚み部分が色濃く染まる
    });

    // 4. Slime Woman Group (人型シルエットの構築)
    const womanGroup = new THREE.Group();
    scene.add(womanGroup);

    // 人体の各部位パーツを作成するヘルパー
    function createBodyPart(geo, pos, scale = [1, 1, 1]) {
      const mesh = new THREE.Mesh(geo, glassMaterial);
      mesh.position.set(...pos);
      mesh.scale.set(...scale);
      womanGroup.add(mesh);
      return mesh;
    }

    const sphereGeo = new THREE.SphereGeometry(1, 64, 64);

    // 頭部
    const head = createBodyPart(sphereGeo, [0, 1.8, 0], [0.45, 0.5, 0.45]);
    // 髪の毛（流れるスライム）
    const hair = createBodyPart(sphereGeo, [0, 1.9, -0.1], [0.55, 0.65, 0.55]);

    // 胸部・バスト
    const chest = createBodyPart(sphereGeo, [0, 1.1, 0], [0.45, 0.35, 0.35]);
    const breastL = createBodyPart(sphereGeo, [-0.22, 1.1, 0.25], [0.22, 0.22, 0.22]);
    const breastR = createBodyPart(sphereGeo, [0.22, 1.1, 0.25], [0.22, 0.22, 0.22]);

    // くびれたウエスト（腰）
    const waist = createBodyPart(sphereGeo, [0, 0.6, 0], [0.32, 0.35, 0.3]);

    // ヒップ（骨盤）
    const hips = createBodyPart(sphereGeo, [0, 0.1, 0], [0.48, 0.38, 0.4]);

    // 脚部（下に向かって足元が溶け落ちるグラデーション）
    const legL = createBodyPart(sphereGeo, [-0.22, -0.6, 0], [0.2, 0.5, 0.2]);
    const legR = createBodyPart(sphereGeo, [0.22, -0.6, 0], [0.2, 0.5, 0.2]);
    
    // 足元のスライム溜まり（ベース）
    const puddle = createBodyPart(sphereGeo, [0, -1.2, 0], [1.2, 0.15, 1.2]);

    // 内部コア（心臓・核）
    const coreMat = new THREE.MeshStandardMaterial({
      color: 0xff0055,
      emissive: 0xff0088,
      emissiveIntensity: 3.0
    });
    const core = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 32), coreMat);
    core.position.set(0, 0.8, 0);
    womanGroup.add(core);

    // 5. Animation Loop (生命感ある呼吸・ぽよぽよモーション)
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      controls.update();

      // 全体のゆったりとした浮遊
      womanGroup.position.y = Math.sin(t * 1.5) * 0.08;

      // 胸部・胸の伸縮（ポヨポヨ感）
      const breastPulse = 1.0 + Math.sin(t * 3.0) * 0.05;
      breastL.scale.set(0.22 * breastPulse, 0.22 * (2.0 - breastPulse), 0.22 * breastPulse);
      breastR.scale.set(0.22 * breastPulse, 0.22 * (2.0 - breastPulse), 0.22 * breastPulse);

      // ウエストとうねり
      waist.scale.x = 0.32 * (1.0 + Math.cos(t * 2.0) * 0.04);
      womanGroup.rotation.y = Math.sin(t * 0.8) * 0.15; // ゆったりとした腰振り

      // コアの脈動
      const corePulse = 1.0 + Math.sin(t * 4.0) * 0.2;
      core.scale.set(corePulse, corePulse, corePulse);

      // 足元の溜まり部分のうねり
      puddle.scale.x = 1.2 + Math.sin(t * 2.5) * 0.08;
      puddle.scale.z = 1.2 + Math.cos(t * 2.5) * 0.08;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
