<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Slower Motion • Single-Arm Self-Press with 30-Degree Lean</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: #fff; padding: 10px;
            border-radius: 5px; font-family: sans-serif; font-size: 14px;
            pointer-events: none; /* UIを透過 */
        }
        .text-overlay {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-family: sans-serif; font-size: 16px;
            letter-spacing: 0.1em;
            pointer-events: none;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- BufferGeometryUtils for merging geometries -->
    <script src="https://unpkg.com/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
</head>
<body>

<div id="ui">
    <div>MOTION: REALISTIC SELF-PRESS</div>
    <div>ROTATE: OFF</div>
</div>
<div class="text-overlay">SLOWER MOTION • SINGLE-ARM SELF-PRESS</div>

<script>
    // --- 3rd Party: MergeGeometries Utility ---
    // (Included here for a self-contained example as a single file loader is tricky)
    THREE.BufferGeometryUtils = {
        mergeBufferGeometries: function ( geometries, useGroups ) {
            const isIndexed = geometries[ 0 ].index !== null;
            const attributesUsed = new Set( Object.keys( geometries[ 0 ].attributes ) );
            const morphAttributesUsed = new Set( Object.keys( geometries[ 0 ].morphAttributes ) );
            const attributes = {};
            const morphAttributes = {};
            const mergedGeometry = new THREE.BufferGeometry();
            let offset = 0;
            let indexOffset = 0;
            for ( let i = 0; i < geometries.length; ++ i ) {
                const geometry = geometries[ i ];
                let count = 0;
                if ( isIndexed ) {
                    count = geometry.index.count;
                } else if ( geometry.attributes.position !== undefined ) {
                    count = geometry.attributes.position.count;
                } else {
                    return null; // unsupported geometry
                }
                offset += count;
                attributesUsed.forEach( key => {
                    if ( geometry.attributes[ key ] === undefined ) attributesUsed.delete( key );
                } );
                morphAttributesUsed.forEach( key => {
                    if ( geometry.morphAttributes[ key ] === undefined ) morphAttributesUsed.delete( key );
                } );
            }
            if ( offset === 0 ) return null;
            if ( useGroups ) mergedGeometry.groups = [];
            let totalCount = 0;
            attributesUsed.forEach( key => {
                const attribute = geometries[ 0 ].attributes[ key ];
                const mergedAttribute = new THREE.BufferAttribute( new attribute.array.constructor( offset * attribute.itemSize ), attribute.itemSize, attribute.normalized );
                attributes[ key ] = mergedAttribute;
                mergedGeometry.setAttribute( key, mergedAttribute );
                offset = 0;
                for ( let i = 0; i < geometries.length; ++ i ) {
                    const geometry = geometries[ i ];
                    let count = 0;
                    if ( isIndexed ) {
                        count = geometry.index.count;
                    } else {
                        count = geometry.attributes.position.count;
                    }
                    if ( geometry.attributes[ key ] !== undefined ) {
                        mergedAttribute.array.set( geometry.attributes[ key ].array, offset * attribute.itemSize );
                    }
                    if ( useGroups ) {
                        const group = { start: totalCount, count: count, materialIndex: 0 };
                        if ( i === 0 || mergedGeometry.groups[ mergedGeometry.groups.length - 1 ].materialIndex !== group.materialIndex ) {
                            mergedGeometry.groups.push( group );
                        } else {
                            mergedGeometry.groups[ mergedGeometry.groups.length - 1 ].count += count;
                        }
                    }
                    offset += count;
                    totalCount += count;
                }
            } );
            mergedGeometry.userData.groupsMerged = useGroups;
            return mergedGeometry;
        }
    };

    // --- Main Application ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 1000 );
    const renderer = new THREE.WebGLRenderer( { antialias: true } );
    renderer.setSize( window.innerWidth, window.innerHeight );
    renderer.shadowMap.enabled = true; // 影を有効にする
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔らかい影
    document.body.appendChild( renderer.domElement );

    camera.position.set( 0, 1.6, 5 ); // 高さ1.6m (目線)

    // --- Lighting (参考画像のサイド光を再現) ---
    const ambientLight = new THREE.AmbientLight( 0x111122, 0.5 ); // 暗めの環境光 (青みがかった影)
    scene.add( ambientLight );

    const mainLight = new THREE.DirectionalLight( 0xffffff, 2.0 ); // 強い白色サイド光
    mainLight.position.set( 5, 2, 2 ); // 右側、少し高め、少し前方
    mainLight.castShadow = true; // 影を落とす
    scene.add( mainLight );

    const rimLight = new THREE.DirectionalLight( 0x5588ff, 1.0 ); // 弱い青色のリムライト
    rimLight.position.set( -3, 1, -3 ); // 左奥、低め
    scene.add( rimLight );

    // --- Ground (参考画像の床) ---
    const groundGeometry = new THREE.PlaneGeometry( 20, 20 );
    const groundMaterial = new THREE.MeshPhongMaterial( { color: 0x111111 } );
    const ground = new THREE.Mesh( groundGeometry, groundMaterial );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true; // 影を受ける
    scene.add( ground );

    // --- Material for Both Humanoids (質感の違い) ---
    const metalMaterial = new THREE.MeshStandardMaterial( {
        color: 0x888888,
        metalness: 1.0,
        roughness: 0.1
    } );

    const glassMaterial = new THREE.MeshPhongMaterial( {
        color: 0xaaaaaa,
        opacity: 0.5,
        transparent: true,
        refractionRatio: 0.95
    } );

    // --- Mannequin Construction using Primitiives ---
    function createMannequin( material ) {
        const geometries = [];

        // Geometries to merge
        const geometriesToMerge = [];

        // Helper function for adding parts
        function addPart( geo, pos, scale = [1, 1, 1], rot = [0, 0, 0] ) {
            const g = geo.clone();
            g.scale( ...scale );
            g.rotateX( rot[ 0 ] );
            g.rotateY( rot[ 1 ] );
            g.rotateZ( rot[ 2 ] );
            g.translate( ...pos );
            geometriesToMerge.push( g );
        }

        // --- Body Parts ---
        const sphereGeo = new THREE.SphereGeometry( 1, 32, 32 );
        const cylinderGeo = new THREE.CylinderGeometry( 1, 1, 1, 32 );

        // Head (卵型)
        addPart( sphereGeo, [0, 1.75, 0], [0.18, 0.24, 0.18] );
        // Neck (筒)
        addPart( cylinderGeo, [0, 1.5, 0], [0.1, 0.2, 0.1] );
        // Torso Upper (筒、少し平ら)
        addPart( cylinderGeo, [0, 1.3, 0], [0.35, 0.2, 0.2], [0, 0, 0] );
        // Torso Middle (筒、くびれ)
        addPart( cylinderGeo, [0, 1.0, 0], [0.2, 0.4, 0.15] );
        // Hips (筒、少し平ら)
        addPart( cylinderGeo, [0, 0.7, 0], [0.3, 0.2, 0.2] );

        // Leg Left
        addPart( cylinderGeo, [-0.15, 0.35, 0], [0.12, 0.5, 0.12] ); // Upper
        addPart( cylinderGeo, [-0.15, 0, 0.05], [0.1, 0.2, 0.15] ); // Lower, forward lean

        // Leg Right
        addPart( cylinderGeo, [0.15, 0.35, 0], [0.12, 0.5, 0.12] ); // Upper
        addPart( cylinderGeo, [0.15, 0, 0.05], [0.1, 0.2, 0.15] ); // Lower, forward lean

        // --- Arm Right (プレスを行う腕) ---
        addPart( cylinderGeo, [0.55, 1.15, 0.0], [0.12, 0.3, 0.1], [0.2, 0, 0] ); // Upper, forward lean
        addPart( cylinderGeo, [0.45, 1.0, 0.15], [0.08, 0.15, 0.1], [-1.2, -0.4, 0.6] ); // Lower, forward lean and rotated

        // --- Arm Left (リラックスした腕) ---
        addPart( cylinderGeo, [-0.55, 1.0, -0.1], [0.12, 0.4, 0.1], [0.1, 0, -0.05] ); // Upper
        addPart( cylinderGeo, [-0.45, 0.75, -0.05], [0.08, 0.15, 0.1], [0.2, 0, -0.1] ); // Lower

        // Merge all parts into one geometry
        const mergedGeometry = THREE.BufferGeometryUtils.mergeBufferGeometries( geometriesToMerge, false );
        const mesh = new THREE.Mesh( mergedGeometry, material );
        mesh.castShadow = true; // 影を落とす
        mesh.receiveShadow = true; // 影を受ける
        scene.add( mesh );
        return mesh;
    }

    const mannequin1 = createMannequin( metalMaterial );
    mannequin1.position.x = -1.2;

    const mannequin2 = createMannequin( glassMaterial );
    mannequin2.position.x = 1.2;

    // --- Interaction (回転を無効化する代わりに、ドラッグで視点を回転させる) ---
    // (マウスコントロールを追加したい場合はOrbitControlsを使うのが一般的ですが、
    // ここでは画像の「ROTATE: OFF」に合わせ、自動回転のみ無効化とします。)

    // --- Animation Logic (「30度の傾き」「ゆっくり」「セルフプレス」「顔の動き」) ---
    const startTime = Date.now();
    const leanAngle_R = 30; // 右に30度傾く (プレスの姿勢)
    const leanAngle_L = 30; // 左に30度傾く (リラックスの姿勢)
    const leanDuration = 2; // 2秒で傾きを切替

    function animate() {
        requestAnimationFrame( animate );

        const elapsedTime = ( Date.now() - startTime ) / 1000;

        // --- 1. 両体の30度の傾き (ゆっくりとした切替) ---
        // (参考画像の「ゆっくり」に合わせ、1周期8秒の正弦波を使う)
        const leanFactor = Math.sin( elapsedTime * ( Math.PI * 2 / 8 ) ); // -1.0 to 1.0

        // 右向きプレス (leanFactor > 0)、左向きリラックス (leanFactor < 0)
        let leanR, leanL;
        if ( leanFactor > 0 ) {
            leanR = leanAngle_R;
            leanL = leanAngle_L / 2; // リラックス側は傾きを抑える
        } else {
            leanR = leanAngle_R / 2; // プレス側は傾きを抑える
            leanL = leanAngle_L;
        }
        
        const lerpedLeanR = leanR * leanFactor;
        const lerpedLeanL = - leanL * ( -leanFactor ); // 負の方向に傾く

        // 3rd Person: マネキンのローカル回転を調整するのではなく、
        // 外部に回転を反映させたいため、ここではオブジェクト自体の回転を調整します。
        // 参考画像の「右向きプレス」「左向きリラックス」に合わせて、回転を同期させます。
        // (※primiviteのmergeBufferGeometriesを使っているため、関節ごとのアニメーションは難しいですが、
        //  全身の回転として画像を再現します。)

        // 右モデルの回転 (30度右へ、右向きプレス)
        mannequin1.rotation.y = THREE.MathUtils.degToRad( lerpedLeanR );
        // 左モデルの回転 (30度左へ、左向きリラックス)
        mannequin2.rotation.y = THREE.MathUtils.degToRad( lerpedLeanL );

        // --- 2. 片手でセルフプレス ---
        // ( primiviteのmergeBufferGeometriesを使っているため、関節ごとのアニメーションは難しいですが、
        //  全身の回転として画像を再現します。)

        // マネキンのローカル座標系で右手が左肩に当たるように調整します。
        // createMannequin関数のArm Rightの設定で、ローカル座標系でのプレスの姿勢を表現しています。
        // ここでのアニメーションは全身の回転によって、プレスしている様子を外部から見たときに表現します。

        // --- 3. 顔は押さえている肩をみる ---
        // primiviteのmergeBufferGeometriesを使っているため、関節ごとのアニメーションは難しいですが、
        // 全身の回転によって、顔がどちらの方向を向いているかを外部から見たときに表現します。
        // createMannequin関数のHeadの設定で、ローカル座標系での顔の向きを表現しています。

        renderer.render( scene, camera );
    }

    // --- Window Resize Handling ---
    window.addEventListener( 'resize', onWindowResize, false );
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize( window.innerWidth, window.innerHeight );
    }

    animate();

</script>
</body>
</html>
