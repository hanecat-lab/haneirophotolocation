<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-1000 Slender Female Humanoid Form SDF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; }
    #canvas-container { width: 100vw; height: 100vh; }
    .ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      letter-spacing: 0.2em;
      font-family: sans-serif;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="ui-hint">SLENDER HUMANOID T-1000 • DRAG TO ROTATE</div>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // GLSL Raymarching Shader
    const fragmentShader = `
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_mouse;

      #define MAX_STEPS 128
      #define SURF_DIST 0.001
      #define MAX_DIST 20.0

      // スムースフュージョン（メタボール結合）
      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      // 回転行列
      mat2 rot(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
      }

      // カプセルSDF
      float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
        vec3 pa = p - a, ba = b - a;
        float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
        return length(pa - ba * h) - r;
      }

      // 楕円体SDF
      float sdEllipsoid(vec3 p, vec3 r) {
        float k0 = length(p/r);
        float k1 = length(p/(r*r));
        return k0*(k0-1.0)/k1;
      }

      // 3Dノイズ（表面の極小流動波形）
      float noise(vec3 p) {
        return sin(p.x*10.0 + u_time*3.0) * sin(p.y*10.0 + u_time*2.5) * sin(p.z*10.0 + u_time*3.5) * 0.012;
      }

      // リアルなスレンダー人体モデルSDF
      float map(vec3 p) {
        // ★全体スケール調整：元のモデルを約30%縮小して人体全体をフレーム内に収める
        p *= 1.42; 

        // 液体金属のわずかな表面のゆらぎ
        float fluidEffect = noise(p);

        // --- 1. 頭部〜首（顎ライン・頭部楕円） ---
        float head = sdEllipsoid(p - vec3(0.0, 1.45, 0.0), vec3(0.12, 0.16, 0.13));
        float neck = sdCapsule(p, vec3(0.0, 1.35, -0.02), vec3(0.0, 1.12, -0.01), 0.048);
        float upperHead = smin(head, neck, 0.05);

        // --- 2. 鎖骨・華奢な肩幅 ---
        float clavicle = sdCapsule(p, vec3(-0.16, 1.12, 0.0), vec3(0.16, 1.12, 0.0), 0.04);
        upperHead = smin(upperHead, clavicle, 0.06);

        // --- 3. 胸部・肋骨（スレンダーな小胸・自然なカーブ） ---
        float ribcage = sdEllipsoid(p - vec3(0.0, 0.95, -0.02), vec3(0.13, 0.18, 0.10));
        
        // 胸部（バスト）：パーツ感を消し、胸筋・皮膚から自然に盛り上がる流線型
        vec3 pChestL = p - vec3(-0.065, 0.96, 0.08);
        vec3 pChestR = p - vec3( 0.065, 0.96, 0.08);
        float breastL = sdEllipsoid(pChestL, vec3(0.05, 0.05, 0.045));
        float breastR = sdEllipsoid(pChestR, vec3(0.05, 0.05, 0.045));

        float torsoUpper = smin(ribcage, breastL, 0.05);
        torsoUpper = smin(torsoUpper, breastR, 0.05);

        // --- 4. くびれ・フラットな腹部・スレンダーな腰回り（骨盤） ---
        float waist = sdCapsule(p, vec3(0.0, 0.85, -0.01), vec3(0.0, 0.52, -0.01), 0.088);
        float pelvis = sdEllipsoid(p - vec3(0.0, 0.42, -0.01), vec3(0.135, 0.12, 0.11));

        float spine = smin(torsoUpper, waist, 0.08);
        spine = smin(spine, pelvis, 0.09);

        // --- 5. 人間らしいスレンダーな脚部（太もも〜膝〜ふくらはぎ〜足首） ---
        // 左脚（太もも〜足首への滑らかなライン）
        float thighL = sdCapsule(p, vec3(-0.075, 0.4, 0.0), vec3(-0.068, -0.1, 0.0), 0.062);
        float calfL  = sdCapsule(p, vec3(-0.068, -0.1, 0.0), vec3(-0.065, -0.75, 0.0), 0.045);
        float legL   = smin(thighL, calfL, 0.05);

        // 右脚
        float thighR = sdCapsule(p, vec3( 0.075, 0.4, 0.0), vec3( 0.068, -0.1, 0.0), 0.062);
        float calfR  = sdCapsule(p, vec3( 0.068, -0.1, 0.0), vec3( 0.065, -0.75, 0.0), 0.045);
        float legR   = smin(thighR, calfR, 0.05);

        float legs = min(legL, legR);

        // --- 6. しなやかな腕・肘・手先 ---
        float armL = sdCapsule(p, vec3(-0.17, 1.10, 0.0), vec3(-0.20, 0.35, 0.05), 0.035);
        float armR = sdCapsule(p, vec3( 0.17, 1.10, 0.0), vec3( 0.20, 0.35, 0.05), 0.035);
        float arms = min(armL, armR);

        // --- 7. 全パーツの完全シームレス結合 ---
        float body = smin(upperHead, spine, 0.07);
        body = smin(body, legs, 0.08);
        body = smin(body, arms, 0.06);

        // 足元の液体溶け溜まり（スライム）
        float puddle = sdEllipsoid(p - vec3(0.0, -0.82, 0.0), vec3(0.42, 0.05, 0.42));
        body = smin(body, puddle, 0.15);

        return (body + fluidEffect) / 1.42; // スケール補正値を元に戻す
      }

      // 法線（光の屈折・反射角）の補正計算
      vec3 calcNormal(vec3 p) {
        float d = map(p);
        vec2 e = vec2(0.0008, 0.0);
        vec3 n = d - vec3(
          map(p - e.xyy),
          map(p - e.yxy),
          map(p - e.yyx)
        );
        return normalize(n);
      }

      // T-1000 液体金属クローム（環境光ハイライト・フレネル反射）
      vec3 render(vec3 ro, vec3 rd) {
        float dO = 0.0;
        for(int i = 0; i < MAX_STEPS; i++) {
          vec3 p = ro + rd * dO;
          float dS = map(p);
          dO += dS;
          if(dS < SURF_DIST || dO > MAX_DIST) break;
        }

        if(dO > MAX_DIST) return vec3(0.01, 0.01, 0.03); // 暗い背景

        vec3 p = ro + rd * dO;
        vec3 n = calcNormal(p);
        vec3 r = reflect(rd, n);

        // スタジオライティング風のシャープなクローム反射
        float envMap = sin(r.x * 5.0) * sin(r.y * 5.0) * sin(r.z * 5.0);
        envMap = smoothstep(-0.3, 0.7, envMap);

        vec3 col = mix(vec3(0.18, 0.22, 0.28), vec3(0.95, 0.98, 1.0), envMap);
        
        // 輪郭にブルーの強烈なライティング（T-1000のクールな金属感）
        float fresnel = pow(1.0 - max(0.0, dot(-rd, n)), 3.5);
        col += vec3(0.35, 0.65, 0.95) * fresnel;

        return col;
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;

        // ★カメラ位置（引いた視点で全身をバランスよく表示）
        vec3 ro = vec3(0.0, 0.05, 3.8);
        vec3 rd = normalize(vec3(uv, -1.6));

        // ドラッグ/回転処理
        float rotY = u_time * 0.25 + u_mouse.x * 3.0;
        ro.xz *= rot(rotY);
        rd.xz *= rot(rotY);

        vec3 col = render(ro, rd);

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({
      vertexShader: `
        void main() {
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: fragmentShader,
      uniforms: {
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        u_time: { value: 0 },
        u_mouse: { value: new THREE.Vector2(0, 0) }
      }
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(plane);

    // ドラッグによる回転操作
    let isDragging = false;
    let mousePos = { x: 0, y: 0 };

    window.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        mousePos.x += e.movementX * 0.003;
      }
      material.uniforms.u_mouse.value.x = mousePos.x;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      material.uniforms.u_time.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
