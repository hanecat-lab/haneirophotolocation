<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Slime 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e0a14;
      font-family: sans-serif;
    }
    #webgl-container {
      width: 100vw;
      height: 100vh;
    }
    .ui-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      pointer-events: none;
      letter-spacing: 0.05em;
    }
  </style>
  
  <!-- Import Map for Three.js and Addons -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="webgl-container"></div>
  <div class="ui-hint">Move mouse to control • Click to squish & bounce</div>

  <script type="module">
    import * as THREE from 'three';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    // 1. Scene, Camera, Renderer Setup
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // 2. Lighting & Environment
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(10, 10, 5);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xff70e0, 2, 20);
    pointLight.position.set(-10, -10, -5);
    scene.add(pointLight);

    // Environment Map for realistic Glass/Liquid Reflections
    new RGBELoader().load('https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr', (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = texture;
    });

    // 3. Slime Group & Material Setup
    const slimeGroup = new THREE.Group();
    scene.add(slimeGroup);

    // High quality Physical Material for Slime Gel look
    const slimeMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x70e0ff,
      transmission: 0.92,
      opacity: 1,
      transparent: true,
      roughness: 0.08,
      ior: 1.33,                  // Water Index of Refraction
      thickness: 1.2,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      attenuationDistance: 0.8,
      attenuationColor: new THREE.Color(0x70e0ff)
    });

    const geometry = new THREE.SphereGeometry(1, 64, 64);
    const slimeMesh = new THREE.Mesh(geometry, slimeMaterial);
    slimeGroup.add(slimeMesh);

    // Inner bubble details
    const bubbleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
    const bubble1 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), bubbleMat);
    bubble1.position.set(0.2, 0.3, 0.2);
    slimeGroup.add(bubble1);

    const bubble2 = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), bubbleMat);
    bubble2.position.set(-0.3, -0.2, -0.1);
    slimeGroup.add(bubble2);

    // 4. Interactive State variables
    const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
    let isHovered = false;
    let impulse = 0; // Click impact intensity

    const raycaster = new THREE.Raycaster();
    const mouseVec = new THREE.Vector2();

    // Event Listeners
    window.addEventListener('mousemove', (e) => {
      // Normalize mouse coordinates (-1 to +1)
      mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;

      // World coordinate targets for follow movement
      mouse.targetX = mouseVec.x * 3.5;
      mouse.targetY = mouseVec.y * 2.5;

      // Raycast for hover detection
      raycaster.setFromCamera(mouseVec, camera);
      const intersects = raycaster.intersectObject(slimeMesh);
      
      if (intersects.length > 0) {
        if (!isHovered) {
          isHovered = true;
          document.body.style.cursor = 'pointer';
        }
      } else {
        if (isHovered) {
          isHovered = false;
          document.body.style.cursor = 'auto';
        }
      }
    });

    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouseVec, camera);
      const intersects = raycaster.intersectObject(slimeMesh);
      if (intersects.length > 0) {
        impulse = 1.0; // Trigger squish and spring bounce
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 5. Animation Loop
    const clock = new THREE.Clock();
    const baseScale = 1.3;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      // 1) Smooth lerp to mouse position
      mouse.x += (mouse.targetX - mouse.x) * delta * 4;
      mouse.y += (mouse.targetY - mouse.y) * delta * 4;
      slimeGroup.position.set(mouse.x, mouse.y, 0);

      // 2) Decay click impulse (Spring elasticity)
      impulse += (0 - impulse) * delta * 6;
      const bounce = Math.sin(impulse * Math.PI * 4) * impulse * 0.6;

      // 3) Calculate scale transforms
      const hoverTarget = isHovered ? 1.15 : 1.0;
      
      // X & Z expand on squish (+bounce)
      const scaleX = baseScale * hoverTarget * (1 + Math.sin(t * 3) * 0.05 + bounce);
      // Y compresses then stretches (-bounce)
      const scaleY = baseScale * hoverTarget * (1 + Math.cos(t * 4) * 0.05 - bounce);

      slimeMesh.scale.set(scaleX, scaleY, scaleX);

      // 4) Slight inertia tilt on movement
      const vx = mouse.targetX - mouse.x;
      slimeMesh.rotation.z += (-vx * 0.2 - slimeMesh.rotation.z) * delta * 8;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
