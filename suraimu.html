<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Metal Model Mannequin 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; }
    #canvas-container { width: 100vw; height: 100vh; }
    .ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      pointer-events: none;
      letter-spacing: 0.12em;
      font-family: sans-serif;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="ui-hint">LIQUID METAL MANNEQUIN • DRAG TO ROTATE</div>

  <script type="module">
    import * as THREE from 'three';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Scene & Renderer Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.3, 6.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 2. Lighting & HDR Environment Map
    new RGBELoader().load('https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr', (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = texture;
    });

    const mainLight = new THREE.DirectionalLight(0xffffff, 3.0);
    mainLight.position.set(5, 10, 7);
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x70d0ff, 2.0);
    rimLight.position.set(-5, 2, -5);
    scene.add(rimLight);

    // 3. T-1000 Chrome Liquid Material (超鏡面金属)
    const liquidMetalMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xdcdcdc,
      metalness: 1.0,
      roughness: 0.03,
      clearcoat: 1.0,
      clearcoatRoughness: 0.01,
      reflectivity: 1.0
    });

    // 4. モデルマネキン体型の高精細ジオメトリ構築
    const mannequinGeo = new THREE.CylinderGeometry(0.28, 0.18, 4.0, 128, 256);
    
    const posAttr = mannequinGeo.attributes.position;
    const vertexCount = posAttr.count;
    const initialPositions = posAttr.array.slice();

    // モデルプロポーション（高身長・長頭身・細身・小胸）計算
    for (let i = 0; i < vertexCount; i++) {
      const i3 = i * 3;
      let y = initialPositions[i3 + 1]; // 高さ (-2.0 〜 +2.0)
      let x = initialPositions[i3];
      let z = initialPositions[i3 + 2];

      let bodyShape = 1.0;

      if (y > 1.2) {
        // 頭部・首（細く長く伸ばす）
        bodyShape = 0.55 + Math.sin((y - 1.2) * Math.PI) * 0.1;
      } else if (y > 0.8 && y <= 1.2) {
        // 肩ライン（モデルらしい綺麗な張り）
        bodyShape = 1.2 - (y - 0.8) * 0.8;
      } else if (y > 0.4 && y <= 0.8) {
        // 胸部：小ぶりでフラットなハイファッションライン
        bodyShape = 0.88 + Math.sin((y - 0.4) * Math.PI * 2.5) * 0.08;
      } else if (y > -0.2 && y <= 0.4) {
        // シャープなくびれ（ウエスト）
        bodyShape = 0.65 + (y + 0.2) * 0.15;
      } else if (y > -0.7 && y <= -0.2) {
        // スレンダーなヒップライン
        bodyShape = 0.85 + Math.sin((y + 0.7) * Math.PI) * 0.12;
      } else {
        // 長く細い脚部（裾に向かってスマートに）
        bodyShape = 0.55 + (y + 2.0) * 0.15;
      }

      posAttr.setX(i, x * bodyShape);
      posAttr.setZ(i, z * bodyShape);
    }
    mannequinGeo.computeVertexNormals();

    const mannequinMesh = new THREE.Mesh(mannequinGeo, liquidMetalMaterial);
    scene.add(mannequinMesh);

    // 5. 流動ノイズ（T-1000のぬめりのような表面波形）
    function getFluidDisplacement(x, y, z, t) {
      const flowY = y * 3.5 - t * 2.2;
      const wave1 = Math.sin(flowY + x * 2.5) * Math.cos(z * 2.5);
      const wave2 = Math.cos(y * 7.0 - t * 3.5) * 0.4;
      return (wave1 + wave2) * 0.055; // シャープさを崩さない絶妙なうねり量
    }

    // 6. Animation Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      controls.update();

      // リアルタイム頂点波形計算
      const positions = mannequinGeo.attributes.position;
      
      for (let i = 0; i < vertexCount; i++) {
        const i3 = i * 3;
        const x = initialPositions[i3];
        const y = initialPositions[i3 + 1];
        const z = initialPositions[i3 + 2];

        const displacement = getFluidDisplacement(x, y, z, t);

        positions.setXYZ(
          i,
          x + x * displacement,
          y + Math.sin(t * 1.2 + y) * 0.015,
          z + z * displacement
        );
      }

      positions.needsUpdate = true;
      mannequinGeo.computeVertexNormals();

      // 優雅な自律回転
      mannequinMesh.rotation.y = t * 0.2;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
