<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memeshikute Dance - Dual Humanoids (Advanced Modes)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    .ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 11px;
      letter-spacing: 0.1em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      outline: none;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
    }
    .btn.active {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      font-weight: bold;
    }

    .ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      letter-spacing: 0.2em;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-panel">
    <!-- モード切替ボタン -->
    <div class="btn-group" id="mode-group">
      <button class="btn active" data-mode="0">DANCE</button>
      <button class="btn" data-mode="1">WALK</button>
      <button class="btn" data-mode="2">GLITCH</button>
    </div>
    <!-- 速度切替ボタン -->
    <div class="btn-group" id="speed-group">
      <button class="btn active" data-speed="1.0">1.0x</button>
      <button class="btn" data-speed="2.0">2.0x</button>
      <button class="btn" data-speed="5.0">5.0x</button>
    </div>
    <button id="btn-light" class="btn active">LIGHT: SIDE (強影)</button>
    <button id="btn-rotate" class="btn">ROTATE: OFF (静止)</button>
  </div>

  <div class="ui-hint">DRAG TO ROTATE</div>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const fragmentShader = `
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_mouse;
      uniform float u_speed;
      uniform float u_side_light;
      uniform float u_rotate;
      uniform float u_mode; // 0: DANCE, 1: WALK, 2: GLITCH

      #define MAX_STEPS 96
      #define SURF_DIST 0.0015
      #define MAX_DIST 15.0

      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      mat2 rot(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
      }

      vec3 rotateX(vec3 p, float a) {
        float s = sin(a), c = cos(a);
        return vec3(p.x, c * p.y - s * p.z, s * p.y + c * p.z);
      }

      vec3 rotateY(vec3 p, float a) {
        float s = sin(a), c = cos(a);
        return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z);
      }

      vec3 rotateZ(vec3 p, float a) {
        float s = sin(a), c = cos(a);
        return vec3(c * p.x - s * p.y, s * p.x + c * p.y, p.z);
      }

      float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
        vec3 pa = p - a, ba = b - a;
        float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
        return length(pa - ba * h) - r;
      }

      float sdEllipsoid(vec3 p, vec3 r) {
        float k0 = length(p/r);
        float k1 = length(p/(r*r));
        return k0*(k0-1.0)/max(k1, 0.0001);
      }

      // 疑似ランダム関数（グリッチ用）
      float random(float n) {
        return fract(sin(n) * 43758.5453123);
      }

      // 人形モデルとモーション分岐
      float sdHumanoid(vec3 p, float modelIndex) {
        float rawTime = u_time * u_speed;
        
        // --- モード0: DANCE (女々しくてサビ) ---
        if (u_mode < 0.5) {
          float cycle = rawTime * 1.2 + modelIndex * 0.5;
          float dir = sin(cycle);
          float sideStep = dir * 0.25;
          float bounce = abs(sin(cycle * 2.0)) * 0.08;

          p.y -= bounce;
          p.x -= sideStep;

          float leanAngle = dir * 0.5236; // 30度
          p = rotateZ(p, -leanAngle);

          vec3 pHead = p - vec3(0.0, 1.35, 0.0);
          float headLookDir = -dir; 
          pHead = rotateY(pHead, headLookDir * 0.6); 
          pHead = rotateX(pHead, 0.15); 

          float head = sdEllipsoid(pHead, vec3(0.11, 0.15, 0.12));
          float neck = sdCapsule(p, vec3(0.0, 1.25, 0.0), vec3(0.0, 1.05, 0.0), 0.048);
          float upperHead = smin(head, neck, 0.05);
          float clavicle = sdCapsule(p, vec3(-0.16, 1.05, 0.0), vec3(0.16, 1.05, 0.0), 0.04);
          upperHead = smin(upperHead, clavicle, 0.05);

          float torso = sdEllipsoid(p - vec3(0.0, 0.85, 0.0), vec3(0.13, 0.22, 0.09));
          float waist = sdCapsule(p, vec3(0.0, 0.75, 0.0), vec3(0.0, 0.45, 0.0), 0.088);
          float pelvis = sdEllipsoid(p - vec3(0.0, 0.38, 0.0), vec3(0.125, 0.12, 0.10));
          float bodyCore = smin(torso, waist, 0.08);
          bodyCore = smin(bodyCore, pelvis, 0.08);

          float blend = smoothstep(-0.2, 0.2, dir);

          // 右腕
          vec3 pArmR = p - vec3(0.16, 1.02, 0.0);
          pArmR = rotateY(pArmR, mix(0.0, -0.9, blend));
          pArmR = rotateZ(pArmR, mix(-0.2, -0.6, blend));
          pArmR = rotateX(pArmR, mix(0.1, -0.4, blend));
          float upperArmR = sdCapsule(pArmR, vec3(0.0), vec3(0.0, -0.24, 0.08), 0.035);
          vec3 pForearmR = pArmR - vec3(0.0, -0.24, 0.08);
          pForearmR = rotateX(pForearmR, mix(0.1, -1.8, blend));
          pForearmR = rotateY(pForearmR, mix(0.0, 0.5, blend));
          float lowerArmR = sdCapsule(pForearmR, vec3(0.0), vec3(-0.05, -0.22, -0.05), 0.030);
          float armR = smin(upperArmR, lowerArmR, 0.03);

          // 左腕
          vec3 pArmL = p - vec3(-0.16, 1.02, 0.0);
          pArmL = rotateY(pArmL, mix(0.9, 0.0, blend));
          pArmL = rotateZ(pArmL, mix(0.6, 0.2, blend));
          pArmL = rotateX(pArmL, mix(-0.4, 0.1, blend));
          float upperArmL = sdCapsule(pArmL, vec3(0.0), vec3(0.0, -0.24, 0.08), 0.035);
          vec3 pForearmL = pArmL - vec3(0.0, -0.24, 0.08);
          pForearmL = rotateX(pForearmL, mix(-1.8, 0.1, blend));
          pForearmL = rotateY(pForearmL, mix(-0.5, 0.0, blend));
          float lowerArmL = sdCapsule(pForearmL, vec3(0.0), vec3(0.05, -0.22, -0.05), 0.030);
          float armL = smin(upperArmL, lowerArmL, 0.03);

          // 脚
          vec3 pLegL = p - vec3(-0.07, 0.35, 0.0);
          pLegL = rotateX(pLegL, sin(cycle) * 0.2);
          float thighL = sdCapsule(pLegL, vec3(0.0), vec3(0.0, -0.4, 0.0), 0.052);
          vec3 pCalfL = pLegL - vec3(0.0, -0.4, 0.0);
          pCalfL = rotateX(pCalfL, -abs(sin(cycle)) * 0.8);
          float calfL = sdCapsule(pCalfL, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.038);
          float legL = smin(thighL, calfL, 0.04);

          vec3 pLegR = p - vec3(0.07, 0.35, 0.0);
          pLegR = rotateX(pLegR, -sin(cycle) * 0.2);
          float thighR = sdCapsule(pLegR, vec3(0.0), vec3(0.0, -0.4, 0.0), 0.052);
          vec3 pCalfR = pLegR - vec3(0.0, -0.4, 0.0);
          pCalfR = rotateX(pCalfR, -abs(cos(cycle)) * 0.8);
          float calfR = sdCapsule(pCalfR, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.038);
          float legR = smin(thighR, calfR, 0.04);

          float body = smin(upperHead, bodyCore, 0.07);
          body = smin(body, armL, 0.05);
          body = smin(body, armR, 0.05);
          body = smin(body, legL, 0.06);
          body = smin(body, legR, 0.06);
          return body;
        }
        // --- モード1: WALK (歩行モーション) ---
        else if (u_mode < 1.5) {
          float walkCycle = rawTime * 2.5 + modelIndex * 1.5;
          float bob = abs(sin(walkCycle * 2.0)) * 0.05;
          p.y -= bob;

          // 体幹を前傾させて歩く
          p = rotateX(p, 0.1);

          vec3 pHead = p - vec3(0.0, 1.35, 0.0);
          float head = sdEllipsoid(pHead, vec3(0.11, 0.15, 0.12));
          float neck = sdCapsule(p, vec3(0.0, 1.25, 0.0), vec3(0.0, 1.05, 0.0), 0.048);
          float upperHead = smin(head, neck, 0.05);

          float torso = sdEllipsoid(p - vec3(0.0, 0.85, 0.0), vec3(0.13, 0.22, 0.09));
          float waist = sdCapsule(p, vec3(0.0, 0.75, 0.0), vec3(0.0, 0.45, 0.0), 0.088);
          float pelvis = sdEllipsoid(p - vec3(0.0, 0.38, 0.0), vec3(0.125, 0.12, 0.10));
          float bodyCore = smin(torso, waist, 0.08);
          bodyCore = smin(bodyCore, pelvis, 0.08);

          // 腕の大きく前後のスイング
          vec3 pArmR = p - vec3(0.16, 1.0, 0.0);
          pArmR = rotateX(pArmR, sin(walkCycle) * 0.6);
          float armR = sdCapsule(pArmR, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.035);

          vec3 pArmL = p - vec3(-0.16, 1.0, 0.0);
          pArmL = rotateX(pArmL, -sin(walkCycle) * 0.6);
          float armL = sdCapsule(pArmL, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.035);

          // 脚の交互の踏み出し
          vec3 pLegL = p - vec3(-0.07, 0.35, 0.0);
          pLegL = rotateX(pLegL, -sin(walkCycle) * 0.8);
          float legL = sdCapsule(pLegL, vec3(0.0), vec3(0.0, -0.75, 0.0), 0.045);

          vec3 pLegR = p - vec3(0.07, 0.35, 0.0);
          pLegR = rotateX(pLegR, sin(walkCycle) * 0.8);
          float legR = sdCapsule(pLegR, vec3(0.0), vec3(0.0, -0.75, 0.0), 0.045);

          float body = smin(upperHead, bodyCore, 0.07);
          body = smin(body, armL, 0.05);
          body = smin(body, armR, 0.05);
          body = smin(body, legL, 0.06);
          body = smin(body, legR, 0.06);
          return body;
        }
        // --- モード2: GLITCH (不規則・バグ動作) ---
        else {
          float gTime = rawTime * 3.0;
          float glitchPulse = step(0.8, random(floor(gTime * 5.0) + modelIndex));
          float jitterX = (random(gTime) - 0.5) * glitchPulse * 0.4;
          float jitterY = (random(gTime + 1.0) - 0.5) * glitchPulse * 0.4;

          p.x += jitterX;
          p.y += jitterY;
          p = rotateY(p, (random(gTime + 2.0) - 0.5) * glitchPulse * 2.0);

          vec3 pHead = p - vec3(0.0, 1.35, 0.0);
          float head = sdEllipsoid(pHead, vec3(0.11, 0.15, 0.12));
          float neck = sdCapsule(p, vec3(0.0, 1.25, 0.0), vec3(0.0, 1.05, 0.0), 0.048);
          float upperHead = smin(head, neck, 0.05);

          float torso = sdEllipsoid(p - vec3(0.0, 0.85, 0.0), vec3(0.13, 0.22, 0.09));
          float waist = sdCapsule(p, vec3(0.0, 0.75, 0.0), vec3(0.0, 0.45, 0.0), 0.088);
          float pelvis = sdEllipsoid(p - vec3(0.0, 0.38, 0.0), vec3(0.125, 0.12, 0.10));
          float bodyCore = smin(torso, waist, 0.08);
          bodyCore = smin(bodyCore, pelvis, 0.08);

          // 腕・脚が不規則に折れ曲がる
          vec3 pArmR = p - vec3(0.16, 1.0, 0.0);
          pArmR = rotateX(pArmR, sin(gTime * 3.0) * 1.5);
          float armR = sdCapsule(pArmR, vec3(0.0), vec3(0.0, -0.4, 0.0), 0.035);

          vec3 pArmL = p - vec3(-0.16, 1.0, 0.0);
          pArmL = rotateZ(pArmL, cos(gTime * 4.0) * 1.5);
          float armL = sdCapsule(pArmL, vec3(0.0), vec3(0.0, -0.4, 0.0), 0.035);

          vec3 pLegL = p - vec3(-0.07, 0.35, 0.0);
          float legL = sdCapsule(pLegL, vec3(0.0), vec3(0.0, -0.7, 0.0), 0.045);

          vec3 pLegR = p - vec3(0.07, 0.35, 0.0);
          float legR = sdCapsule(pLegR, vec3(0.0), vec3(0.0, -0.7, 0.0), 0.045);

          float body = smin(upperHead, bodyCore, 0.07);
          body = smin(body, armL, 0.05);
          body = smin(body, armR, 0.05);
          body = smin(body, legL, 0.06);
          body = smin(body, legR, 0.06);
          return body;
        }
      }

      vec2 map(vec3 p) {
        p *= 1.35;
        vec3 pChrome = p - vec3(-0.65, -0.15, 0.0);
        float dChrome = sdHumanoid(pChrome, 0.0);

        vec3 pGlass = p - vec3(0.65, -0.15, 0.0);
        float dGlass = sdHumanoid(pGlass, 1.0);

        if (dChrome < dGlass) {
          return vec2(dChrome / 1.35, 1.0);
        } else {
          return vec2(dGlass / 1.35, 2.0);
        }
      }

      vec3 calcNormal(vec3 p) {
        float d = map(p).x;
        vec2 e = vec2(0.001, 0.0);
        vec3 n = d - vec3(
          map(p - e.xyy).x,
          map(p - e.yxy).x,
          map(p - e.yyx).x
        );
        return normalize(n);
      }

      vec3 getBackground(vec3 rd) {
        float bgPattern = sin(rd.x * 10.0) * sin(rd.y * 10.0);
        vec3 baseBg = mix(vec3(0.01, 0.015, 0.03), vec3(0.04, 0.06, 0.12), rd.y * 0.5 + 0.5);
        return baseBg + vec3(0.02, 0.03, 0.05) * smoothstep(0.2, 0.8, bgPattern);
      }

      vec3 render(vec3 ro, vec3 rd) {
        float dO = 0.0;
        float matID = 0.0;

        for(int i = 0; i < MAX_STEPS; i++) {
          vec3 p = ro + rd * dO;
          vec2 res = map(p);
          float dS = res.x;
          matID = res.y;
          dO += dS;
          if(dS < SURF_DIST || dO > MAX_DIST) break;
        }

        if(dO > MAX_DIST) return getBackground(rd);

        vec3 p = ro + rd * dO;
        vec3 n = calcNormal(p);

        vec3 sideLightDir = normalize(vec3(3.5, 0.1, 0.2));
        vec3 frontLightDir = normalize(vec3(0.0, 1.0, 1.0));
        vec3 lightDir = mix(frontLightDir, sideLightDir, u_side_light);
        
        float rawDiff = dot(n, lightDir);
        float diff = max(0.0, rawDiff);
        if (u_side_light > 0.5) {
          diff = pow(diff, 2.2);
        }

        float ambientCoeff = mix(0.15, 0.02, u_side_light);

        if (matID < 1.5) {
          vec3 r = reflect(rd, n);
          float envMap = sin(r.x * 5.0) * sin(r.y * 5.0) * sin(r.z * 5.0);
          envMap = smoothstep(-0.3, 0.7, envMap);

          vec3 baseColor = mix(vec3(0.08, 0.10, 0.14), vec3(0.95, 0.98, 1.0), envMap);
          float spec = pow(max(0.0, dot(r, lightDir)), mix(16.0, 32.0, u_side_light));
          
          vec3 col = baseColor * (diff + ambientCoeff);
          col += vec3(1.0, 0.9, 0.7) * spec * (0.8 + 1.2 * u_side_light);

          float fresnel = pow(1.0 - max(0.0, dot(-rd, n)), 3.5);
          col += vec3(0.2, 0.45, 0.85) * fresnel * (1.0 - u_side_light * 0.5);
          return col;
        } 
        else {
          vec3 reflectRay = reflect(rd, n);
          vec3 refRay = refract(rd, n, 1.0 / 1.35);

          if (length(refRay) == 0.0) {
            refRay = reflectRay;
          }

          float fresnel = pow(1.0 - max(0.0, dot(-rd, n)), 2.5);

          vec3 refrColor = getBackground(refRay) * (0.3 + 0.7 * (1.0 - u_side_light));
          float spec = pow(max(0.0, dot(reflectRay, lightDir)), 32.0);
          vec3 reflColor = vec3(0.9, 0.95, 1.0) * spec * (1.0 + u_side_light * 1.5) + vec3(0.3, 0.6, 1.0) * fresnel;

          return mix(refrColor, reflColor, clamp(fresnel + 0.15, 0.0, 1.0)) + vec3(0.08, 0.12, 0.18) * diff;
        }
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
        vec3 ro = vec3(0.0, 0.0, 3.8);
        vec3 rd = normalize(vec3(uv, -1.6));

        float rotXAngle = u_mouse.y * 1.8;
        float rotYAngle = (u_time * 0.2 * u_speed * u_rotate) + u_mouse.x * 3.0;

        ro.yz *= rot(rotXAngle);
        rd.yz *= rot(rotXAngle);
        ro.xz *= rot(rotYAngle);
        rd.xz *= rot(rotYAngle);

        vec3 col = render(ro, rd);
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const uniforms = {
      u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      u_time: { value: 0 },
      u_mouse: { value: new THREE.Vector2(0, 0) },
      u_speed: { value: 1.0 },
      u_side_light: { value: 1.0 },
      u_rotate: { value: 0.0 },
      u_mode: { value: 0.0 }
    };

    const material = new THREE.ShaderMaterial({
      vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
      fragmentShader: fragmentShader,
      uniforms: uniforms
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(plane);

    // --- UIイベントリスナー ---
    const modeButtons = document.querySelectorAll('#mode-group .btn');
    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        uniforms.u_mode.value = parseFloat(btn.dataset.mode);
      });
    });

    const speedButtons = document.querySelectorAll('#speed-group .btn');
    speedButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        speedButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        uniforms.u_speed.value = parseFloat(btn.dataset.speed);
      });
    });

    const btnLight = document.getElementById('btn-light');
    btnLight.addEventListener('click', () => {
      if (uniforms.u_side_light.value === 1.0) {
        uniforms.u_side_light.value = 0.0;
        btnLight.textContent = "LIGHT: FRONT (正面光)";
        btnLight.classList.remove('active');
      } else {
        uniforms.u_side_light.value = 1.0;
        btnLight.textContent = "LIGHT: SIDE (強影)";
        btnLight.classList.add('active');
      }
    });

    const btnRotate = document.getElementById('btn-rotate');
    btnRotate.addEventListener('click', () => {
      if (uniforms.u_rotate.value === 1.0) {
        uniforms.u_rotate.value = 0.0;
        btnRotate.textContent = "ROTATE: OFF (静止)";
        btnRotate.classList.remove('active');
      } else {
        uniforms.u_rotate.value = 1.0;
        btnRotate.textContent = "ROTATE: ON (回転中)";
        btnRotate.classList.add('active');
      }
    });

    let isDragging = false;
    let mousePos = { x: 0, y: 0 };
    window.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        mousePos.x += e.movementX * 0.003;
        mousePos.y = Math.max(-0.8, Math.min(0.8, mousePos.y + e.movementY * 0.003));
      }
      material.uniforms.u_mouse.value.set(mousePos.x, mousePos.y);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      material.uniforms.u_time.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
