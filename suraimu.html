<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2 Autonomous Glass Creatures</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #05030a; }
    #canvas-container { width: 100vw; height: 100vh; }
    .ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      pointer-events: none;
      letter-spacing: 0.1em;
      font-family: sans-serif;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="ui-hint">2 CREATURES FREE ROAMING • CLICK TO DISTORT ALL</div>

  <script type="module">
    import * as THREE from 'three';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    // 1. Scene, Camera & Renderer Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    container.appendChild(renderer.domElement);

    // 2. Environment Lighting
    new RGBELoader().load('https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr', (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = texture;
    });

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight1.position.set(5, 8, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x70e0ff, 1.5);
    dirLight2.position.set(-5, -5, -2);
    scene.add(dirLight2);

    // 3. Simple Noise Function
    function getNoise(x, y, z, t) {
      return Math.sin(x * 2.5 + t * 2.0) * Math.cos(y * 2.5 + t * 1.5) * Math.sin(z * 2.5 + t * 1.8);
    }

    // 4. Glass Creature Class (自律行動オブジェクトクラス)
    class GlassCreature {
      constructor({ mainColor, attenuationColor, coreColor, scale = 1.0, initialPos = new THREE.Vector3() }) {
        this.group = new THREE.Group();
        this.baseScale = scale;
        this.timeOffset = Math.random() * 100;

        // 頂点変形用ジオメトリ
        this.geometry = new THREE.SphereGeometry(1.0, 96, 96);
        this.initialPositions = this.geometry.attributes.position.array.slice();

        // 高級ガラスマテリアル
        this.material = new THREE.MeshPhysicalMaterial({
          color: mainColor,
          transmission: 0.96,
          opacity: 1.0,
          transparent: true,
          roughness: 0.03,
          ior: 1.52,
          thickness: 1.4,
          clearcoat: 1.0,
          clearcoatRoughness: 0.02,
          attenuationDistance: 1.2,
          attenuationColor: new THREE.Color(attenuationColor)
        });

        this.glassMesh = new THREE.Mesh(this.geometry, this.material);
        this.group.add(this.glassMesh);

        // 発光する内部コア
        const coreMat = new THREE.MeshStandardMaterial({
          color: coreColor,
          emissive: coreColor,
          emissiveIntensity: 2.0,
          roughness: 0.2
        });
        this.coreMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), coreMat);
        this.group.add(this.coreMesh);

        // 自律移動用パラメータ
        this.position = initialPos.clone();
        this.targetPosition = new THREE.Vector3();
        this.velocity = new THREE.Vector3();
        this.group.position.copy(this.position);
        
        this.setNewTarget();

        scene.add(this.group);
      }

      // 新しい目標地点をランダム設定
      setNewTarget() {
        this.targetPosition.set(
          (Math.random() - 0.5) * 6.5,
          (Math.random() - 0.5) * 4.0,
          (Math.random() - 0.5) * 2.0
        );
      }

      update(delta, time, impulse, mousePos) {
        const t = time + this.timeOffset;

        // 1. 自律徘徊移動（目標地点へふわふわ向かう）
        const dir = new THREE.Vector3().subVectors(this.targetPosition, this.position);
        const dist = dir.length();

        if (dist < 0.5) {
          this.setNewTarget(); // 到着したら次の場所へ
        } else {
          dir.normalize();
          this.velocity.add(dir.multiplyScalar(delta * 1.2)); // 加速
          this.velocity.clampLength(0, 1.5); // 最大速度制限
        }

        // 減衰（空気抵抗）
        this.velocity.multiplyScalar(0.98);
        this.position.addScaledVector(this.velocity, delta);
        this.group.position.copy(this.position);

        // 2. 慣性による回転傾き
        this.group.rotation.z = -this.velocity.x * 0.2;
        this.group.rotation.x = this.velocity.y * 0.1;
        this.group.rotation.y = t * 0.3;

        // 3. 頂点変形（うねり＋衝撃）
        const positions = this.geometry.attributes.position;
        const count = positions.count;

        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          const x = this.initialPositions[i3];
          const y = this.initialPositions[i3 + 1];
          const z = this.initialPositions[i3 + 2];

          const wave = getNoise(x, y, z, t) * 0.12;
          const shock = Math.sin(y * 4.0 + t * 10.0) * impulse * 0.25;
          const displacement = (1.0 + wave + shock) * this.baseScale;

          positions.setXYZ(i, x * displacement, y * displacement, z * displacement);
        }
        positions.needsUpdate = true;
        this.geometry.computeVertexNormals();

        // 4. コアの動的脈動
        this.coreMesh.position.x = Math.sin(t * 2) * 0.12;
        this.coreMesh.position.y = Math.cos(t * 2.5) * 0.12;
        const pulse = (1.0 + Math.sin(t * 4) * 0.15) * this.baseScale;
        this.coreMesh.scale.set(pulse, pulse, pulse);
      }
    }

    // 5. Instantiate 2 Creatures (2匹の生成)
    const creatures = [
      // 1匹目：青緑ガラス
      new GlassCreature({
        mainColor: 0xe0f7fc,
        attenuationColor: 0x33b8ff,
        coreColor: 0x00ffff,
        scale: 1.1,
        initialPos: new THREE.Vector3(-2, 0, 0)
      }),
      // 2匹目：ピンクガラス
      new GlassCreature({
        mainColor: 0xfce0f0,
        attenuationColor: 0xff33a8,
        coreColor: 0xff0077,
        scale: 0.85,
        initialPos: new THREE.Vector3(2, 0, 0)
      })
    ];

    // 6. Global Interaction & Event Listeners
    const mousePos = new THREE.Vector2();
    let globalImpulse = 0;

    window.addEventListener('mousemove', (e) => {
      mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
      mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('click', () => {
      globalImpulse = 1.0; // クリックで2匹同時に波打つ
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. Animation Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      // 全体衝撃値の減衰
      globalImpulse += (0 - globalImpulse) * delta * 4;

      // 2匹の離隔計算（重なり防止）
      const p1 = creatures[0].position;
      const p2 = creatures[1].position;
      const dist = p1.distanceTo(p2);
      const minDist = 2.2; // 近づける最小距離

      if (dist < minDist) {
        const pushDir = new THREE.Vector3().subVectors(p1, p2).normalize();
        const overlap = (minDist - dist) * 0.5;
        p1.addScaledVector(pushDir, overlap);
        p2.addScaledVector(pushDir, -overlap);
      }

      // 各生物のフレーム更新
      creatures.forEach(creature => {
        creature.update(delta, t, globalImpulse, mousePos);
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
