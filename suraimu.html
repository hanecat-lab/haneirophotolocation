<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True T-1000 Liquid Metal Female SDF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    #canvas-container { width: 100vw; height: 100vh; }
    .ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      letter-spacing: 0.2em;
      font-family: sans-serif;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="ui-hint">RAYMARCHED T-1000 FEMALE FORM • DRAG TO ROTATE</div>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // GLSL Raymarching Shader: 完全な数学的人体SDFによるスムーズフュージョン描画
    const fragmentShader = `
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_mouse;

      #define MAX_STEPS 128
      #define SURF_DIST 0.001
      #define MAX_DIST 20.0

      // 滑らかな幾何学結合（Metaballs / Smooth Minimum）
      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      // 回転行列
      mat2 rot(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
      }

      // カプセルSDF
      float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
        vec3 pa = p - a, ba = b - a;
        float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
        return length(pa - ba * h) - r;
      }

      // 楕円体SDF
      float sdEllipsoid(vec3 p, vec3 r) {
        float k0 = length(p/r);
        float k1 = length(p/(r*r));
        return k0*(k0-1.0)/k1;
      }

      // 3Dノイズ（表面の波打ち・溶け）
      float noise(vec3 p) {
        return sin(p.x*8.0 + u_time*3.0) * sin(p.y*8.0 + u_time*2.5) * sin(p.z*8.0 + u_time*3.5) * 0.03;
      }

      // T-1000の解剖学的女性人体の距離関数（SDF）
      float map(vec3 p) {
        // T-1000流動ノイズを変形として追加
        vec3 q = p;
        float fluidEffect = noise(p * 0.8);

        // 1. 頭部〜首
        float head = length(p - vec3(0.0, 1.55, 0.0)) - 0.16;
        float neck = sdCapsule(p, vec3(0.0, 1.5, 0.0), vec3(0.0, 1.25, 0.0), 0.065);
        float upperBody = smin(head, neck, 0.08);

        // 2. 胸部・鎖骨（引き締まったモデルライン）
        float torsoUpper = sdCapsule(p, vec3(0.0, 1.25, 0.0), vec3(0.0, 0.9, 0.0), 0.16);
        
        // 小ぶりでリアルな胸のライン（パーツとして浮かない滑らかな融合）
        vec3 pChestL = p - vec3(-0.085, 1.08, 0.11);
        vec3 pChestR = p - vec3( 0.085, 1.08, 0.11);
        float breastL = sdEllipsoid(pChestL, vec3(0.065, 0.065, 0.055));
        float breastR = sdEllipsoid(pChestR, vec3(0.065, 0.065, 0.055));
        
        torsoUpper = smin(torsoUpper, breastL, 0.06);
        torsoUpper = smin(torsoUpper, breastR, 0.06);

        // 3. シャープなくびれ〜ヒップ（S字曲線）
        float waist = sdCapsule(p, vec3(0.0, 0.9, 0.0), vec3(0.0, 0.5, 0.0), 0.115);
        float hips = sdCapsule(p, vec3(0.0, 0.5, 0.0), vec3(0.0, 0.2, 0.0), 0.165);

        float spine = smin(torsoUpper, waist, 0.1);
        spine = smin(spine, hips, 0.12);

        // 4. スレンダーで長い脚部
        float legL = sdCapsule(p, vec3(-0.09, 0.2, 0.0), vec3(-0.08, -1.2, 0.0), 0.07);
        float legR = sdCapsule(p, vec3( 0.09, 0.2, 0.0), vec3( 0.08, -1.2, 0.0), 0.07);
        float legs = min(legL, legR);

        // 5. 肩・細い腕
        float armL = sdCapsule(p, vec3(-0.18, 1.2, 0.0), vec3(-0.24, 0.3, 0.0), 0.045);
        float armR = sdCapsule(p, vec3( 0.18, 1.2, 0.0), vec3( 0.24, 0.3, 0.0), 0.045);
        float arms = min(armL, armR);

        // 全てのパーツを「なめらかな皮膚/流体」としてスムーズに完全融合
        float body = smin(upperBody, spine, 0.08);
        body = smin(body, legs, 0.12);
        body = smin(body, arms, 0.08);

        // 足元の溶けたスライム溜まり
        float puddle = length(p - vec3(0.0, -1.25, 0.0)) - 0.45;
        puddle = max(puddle, p.y + 1.25);

        body = smin(body, puddle, 0.2);

        return body + fluidEffect;
      }

      // 法線（光の反射角）の計算
      vec3 calcNormal(vec3 p) {
        float d = map(p);
        vec2 e = vec2(0.001, 0.0);
        vec3 n = d - vec3(
          map(p - e.xyy),
          map(p - e.yxy),
          map(p - e.yyx)
        );
        return normalize(n);
      }

      // 液体金属クロームシェーディング（T-1000特有の完全鏡面・反射）
      vec3 render(vec3 ro, vec3 rd) {
        float dO = 0.0;
        for(int i = 0; i < MAX_STEPS; i++) {
          vec3 p = ro + rd * dO;
          float dS = map(p);
          dO += dS;
          if(dS < SURF_DIST || dO > MAX_DIST) break;
        }

        if(dO > MAX_DIST) return vec3(0.01, 0.01, 0.03); // 背景色

        vec3 p = ro + rd * dO;
        vec3 n = calcNormal(p);
        vec3 r = reflect(rd, n); // 反射ベクトル

        // 環境光の偽装（スタジオ照明風の鋭いハイライト）
        float envMap = sin(r.x * 4.0) * sin(r.y * 4.0) * sin(r.z * 4.0);
        envMap = smoothstep(-0.2, 0.8, envMap);

        vec3 col = mix(vec3(0.2, 0.25, 0.3), vec3(0.95, 0.98, 1.0), envMap);
        
        // フレネル反射（輪郭の強い輝き）
        float fresnel = pow(1.0 - max(0.0, dot(-rd, n)), 4.0);
        col += vec3(0.4, 0.7, 1.0) * fresnel;

        return col;
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;

        // カメラ位置と回転
        vec3 ro = vec3(0.0, 0.2, 3.2);
        vec3 rd = normalize(vec3(uv, -1.5));

        // マウス/時間による360度回転
        float rotY = u_time * 0.3 + u_mouse.x * 3.0;
        ro.xz *= rot(rotY);
        rd.xz *= rot(rotY);

        vec3 col = render(ro, rd);

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({
      vertexShader: `
        void main() {
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: fragmentShader,
      uniforms: {
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        u_time: { value: 0 },
        u_mouse: { value: new THREE.Vector2(0, 0) }
      }
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(plane);

    // インタラクション（マウスドラッグ回転）
    let isDragging = false;
    let mousePos = { x: 0, y: 0 };

    window.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        mousePos.x += e.movementX * 0.003;
      }
      material.uniforms.u_mouse.value.x = mousePos.x;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      material.uniforms.u_time.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
