<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural T-1000 Female Mannequin 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; }
    #canvas-container { width: 100vw; height: 100vh; }
    .ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      pointer-events: none;
      letter-spacing: 0.12em;
      font-family: sans-serif;
      text-align: center;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "three/addons/utils/BufferGeometryUtils.js": "https://unpkg.com/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="ui-hint">PROCEDURAL T-1000 MANNEQUIN • DRAG TO ROTATE</div>

  <script type="module">
    import * as THREE from 'three';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

    // 1. Scene & Renderer Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.8, 4.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.5, 0);

    // 2. HDR Environment Lighting
    new RGBELoader().load('https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr', (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = texture;
    });

    const mainLight = new THREE.DirectionalLight(0xffffff, 3.0);
    mainLight.position.set(5, 10, 7);
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x70d0ff, 2.5);
    rimLight.position.set(-5, 2, -5);
    scene.add(rimLight);

    // 3. T-1000 Liquid Metal Material
    const liquidMetalMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xdcdcdc,
      metalness: 1.0,
      roughness: 0.03,
      clearcoat: 1.0,
      clearcoatRoughness: 0.01,
      reflectivity: 1.0
    });

    // 4. コード内で人体パーツ（頭・首・胸・くびれ・腰・脚）を生成して融合する処理
    const geometriesToMerge = [];

    // パーツ作成関数
    function addPart(geo, pos, scale = [1, 1, 1]) {
      const g = geo.clone();
      g.scale(...scale);
      g.translate(...pos);
      geometriesToMerge.push(g);
    }

    const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
    const cylinderGeo = new THREE.CylinderGeometry(1, 1, 1, 64, 64);

    // 【人体各部位のビルド（モデル女性プロポーション）】
    // 頭部（卵型マネキン）
    addPart(sphereGeo, [0, 1.75, 0], [0.18, 0.24, 0.2]);
    // 長く美しい首
    addPart(cylinderGeo, [0, 1.45, 0], [0.08, 0.25, 0.08]);
    // デコルテ・肩のライン
    addPart(cylinderGeo, [0, 1.32, 0], [0.28, 0.08, 0.12]);
    
    // 小ぶりでハイファッションな胸部（バスト）
    addPart(sphereGeo, [-0.09, 1.15, 0.06], [0.085, 0.085, 0.085]); // 左胸
    addPart(sphereGeo, [0.09, 1.15, 0.06], [0.085, 0.085, 0.085]);  // 右胸
    addPart(cylinderGeo, [0, 1.15, -0.01], [0.22, 0.22, 0.12]);    // 胸背部

    // くびれたウエスト
    addPart(cylinderGeo, [0, 0.88, 0], [0.14, 0.28, 0.10]);

    // ヒップ（骨盤）
    addPart(cylinderGeo, [0, 0.62, 0], [0.21, 0.24, 0.14]);

    // 長くスマートな脚部（太もも〜足元へ溶け落ちる）
    addPart(cylinderGeo, [-0.10, 0.22, 0], [0.08, 0.55, 0.08]); // 左脚
    addPart(cylinderGeo, [0.10, 0.22, 0], [0.08, 0.55, 0.08]);  // 右脚
    addPart(cylinderGeo, [0, -0.2, 0], [0.35, 0.12, 0.35]);     // 足元の液体溜まり

    // すべての幾何学パーツを1つの3D人型メッシュに完全結合
    const mergedGeometry = BufferGeometryUtils.mergeGeometries(geometriesToMerge, false);
    mergedGeometry.computeVertexNormals();

    const mannequinMesh = new THREE.Mesh(mergedGeometry, liquidMetalMaterial);
    scene.add(mannequinMesh);

    // 5. 頂点ノイズ（T-1000のぬめり・流動アニメーション）
    const posAttr = mergedGeometry.attributes.position;
    const vertexCount = posAttr.count;
    const initialPositions = posAttr.array.slice();

    function getFluidDisplacement(x, y, z, t) {
      const flowY = y * 4.0 - t * 2.2;
      const wave1 = Math.sin(flowY + x * 3.0) * Math.cos(z * 3.0);
      const wave2 = Math.cos(y * 8.0 - t * 3.0) * 0.4;
      return (wave1 + wave2) * 0.02; // 人体の造形を保つ適度なうねり量
    }

    // 6. Animation Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      controls.update();

      // 結合された人型メッシュの全頂点をリアルタイム変形
      for (let i = 0; i < vertexCount; i++) {
        const i3 = i * 3;
        const x = initialPositions[i3];
        const y = initialPositions[i3 + 1];
        const z = initialPositions[i3 + 2];

        const displacement = getFluidDisplacement(x, y, z, t);

        posAttr.setXYZ(
          i,
          x + x * displacement,
          y + Math.sin(t * 1.5 + y) * 0.008,
          z + z * displacement
        );
      }

      posAttr.needsUpdate = true;
      mergedGeometry.computeVertexNormals(); // 反射光のリアルタイム計算

      // 自律回転
      mannequinMesh.rotation.y = t * 0.2;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
