<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual Androgynous Humanoids - Unhuman Motion (5x Speed)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    .ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 0.1em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      outline: none;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
    }
    .btn.active {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      font-weight: bold;
    }

    .ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      letter-spacing: 0.2em;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-panel">
    <button id="btn-unhuman" class="btn active">MOTION: UNHUMAN (異次元・不気味)</button>
    <button id="btn-speed" class="btn active">SPEED: 2.0x (倍速)</button>
    <button id="btn-light" class="btn active">LIGHT: SIDE (サイド光)</button>
  </div>

  <div class="ui-hint">DRAG TO ROTATE</div>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const fragmentShader = `
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_mouse;
      uniform float u_speed;
      uniform float u_side_light;
      uniform float u_unhuman;

      #define MAX_STEPS 96
      #define SURF_DIST 0.0015
      #define MAX_DIST 15.0

      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      mat2 rot(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
      }

      vec3 rotateX(vec3 p, float a) {
        float s = sin(a), c = cos(a);
        return vec3(p.x, c * p.y - s * p.z, s * p.y + c * p.z);
      }

      vec3 rotateY(vec3 p, float a) {
        float s = sin(a), c = cos(a);
        return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z);
      }

      vec3 rotateZ(vec3 p, float a) {
        float s = sin(a), c = cos(a);
        return vec3(c * p.x - s * p.y, s * p.x + c * p.y, p.z);
      }

      float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
        vec3 pa = p - a, ba = b - a;
        float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
        return length(pa - ba * h) - r;
      }

      float sdEllipsoid(vec3 p, vec3 r) {
        float k0 = length(p/r);
        float k1 = length(p/(r*r));
        return k0*(k0-1.0)/max(k1, 0.0001);
      }

      float noise(vec3 p, float animTime) {
        return sin(p.x*10.0 + animTime*2.0) * sin(p.y*10.0 + animTime*1.7) * sin(p.z*10.0 + animTime*2.3) * 0.01;
      }

      float sdHumanoid(vec3 p, float isGlass) {
        float rawTime = u_time * u_speed * 1.5;

        // 【非人間的要素1：コマ送り（カクカクしたフレームスキップ）】
        float quantTime = floor(rawTime * 8.0) / 8.0;
        float t = mix(rawTime, quantTime, u_unhuman * 0.7);

        // 【非人間的要素2：反転・高次元回転・浮遊】
        float floatOffset = sin(t * 2.5 + isGlass * 3.14) * 0.15 * u_unhuman;
        p.y += floatOffset;

        // 体全体のねじれ
        float spineTwist = sin(t * 3.0 + p.y * 5.0) * 0.6 * u_unhuman;
        p = rotateY(p, spineTwist);

        float fluidEffect = noise(p, t);

        // 頭部
        vec3 pHead = p - vec3(0.0, 1.35, 0.0);
        if (u_unhuman > 0.5) {
          pHead = rotateY(pHead, t * 4.0 * (isGlass > 0.5 ? -1.0 : 1.0));
          pHead = rotateZ(pHead, sin(t * 8.0) * 0.2);
        }
        float head = sdEllipsoid(pHead, vec3(0.11, 0.15, 0.12));
        float neck = sdCapsule(p, vec3(0.0, 1.25, 0.0), vec3(0.0, 1.05, 0.0), 0.048);
        float upperHead = smin(head, neck, 0.05);

        // 鎖骨・肩
        float clavicle = sdCapsule(p, vec3(-0.15, 1.05, 0.0), vec3(0.15, 1.05, 0.0), 0.04);
        upperHead = smin(upperHead, clavicle, 0.05);

        // 胴体
        float torso = sdEllipsoid(p - vec3(0.0, 0.85, 0.0), vec3(0.13, 0.22, 0.09));
        float waist = sdCapsule(p, vec3(0.0, 0.75, 0.0), vec3(0.0, 0.45, 0.0), 0.088);
        float pelvis = sdEllipsoid(p - vec3(0.0, 0.38, 0.0), vec3(0.125, 0.12, 0.10));

        float bodyCore = smin(torso, waist, 0.08);
        bodyCore = smin(bodyCore, pelvis, 0.08);

        // 【非人間的要素3：可動域無視・関節の逆折れ】
        // 左腕
        vec3 pArmL = p - vec3(-0.16, 1.0, 0.0);
        float armAngleX_L = mix(sin(t) * 0.5, sin(t * 4.0) * 2.5, u_unhuman);
        float armAngleZ_L = mix(cos(t * 0.8) * 0.3 + 0.3, sin(t * 5.0) * 1.5, u_unhuman);
        pArmL = rotateX(pArmL, armAngleX_L);
        pArmL = rotateZ(pArmL, armAngleZ_L);
        float upperArmL = sdCapsule(pArmL, vec3(0.0), vec3(-0.02, -0.3, 0.0), 0.035);
        
        vec3 pForearmL = pArmL - vec3(-0.02, -0.3, 0.0);
        float elbowL = mix(sin(t * 1.2) * 0.4 + 0.4, -sin(t * 6.0) * 2.0, u_unhuman);
        pForearmL = rotateX(pForearmL, elbowL);
        float lowerArmL = sdCapsule(pForearmL, vec3(0.0), vec3(-0.02, -0.3, 0.05), 0.028);
        float armL = smin(upperArmL, lowerArmL, 0.04);

        // 右腕
        vec3 pArmR = p - vec3(0.16, 1.0, 0.0);
        float armAngleX_R = mix(-cos(t * 0.9) * 0.6, cos(t * 3.5) * 2.5, u_unhuman);
        float armAngleZ_R = mix(-sin(t * 0.7) * 0.3 - 0.3, -cos(t * 4.5) * 1.5, u_unhuman);
        pArmR = rotateX(pArmR, armAngleX_R);
        pArmR = rotateZ(pArmR, armAngleZ_R);
        float upperArmR = sdCapsule(pArmR, vec3(0.0), vec3(0.02, -0.3, 0.0), 0.035);

        vec3 pForearmR = pArmR - vec3(0.02, -0.3, 0.0);
        float elbowR = mix(cos(t * 1.1) * 0.4 + 0.4, sin(t * 5.5) * 2.2, u_unhuman);
        pForearmR = rotateX(pForearmR, elbowR);
        float lowerArmR = sdCapsule(pForearmR, vec3(0.0), vec3(0.02, -0.3, 0.05), 0.028);
        float armR = smin(upperArmR, lowerArmR, 0.04);

        // 脚
        vec3 pLegL = p - vec3(-0.07, 0.35, 0.0);
        float legAngleL = mix(-sin(t * 0.8) * 0.4, sin(t * 3.0 + 1.5) * 1.8, u_unhuman);
        pLegL = rotateX(pLegL, legAngleL);
        if (u_unhuman > 0.5) pLegL = rotateZ(pLegL, cos(t * 4.0) * 0.8);
        float thighL = sdCapsule(pLegL, vec3(0.0), vec3(0.0, -0.4, 0.0), 0.052);

        vec3 pCalfL = pLegL - vec3(0.0, -0.4, 0.0);
        float kneeL = mix(max(0.0, sin(t * 0.8)) * 0.5, -abs(sin(t * 5.0)) * 1.8, u_unhuman);
        pCalfL = rotateX(pCalfL, kneeL);
        float calfL = sdCapsule(pCalfL, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.038);
        float legL = smin(thighL, calfL, 0.04);

        vec3 pLegR = p - vec3(0.07, 0.35, 0.0);
        float legAngleR = mix(sin(t * 0.8) * 0.4, -sin(t * 3.0) * 1.8, u_unhuman);
        pLegR = rotateX(pLegR, legAngleR);
        if (u_unhuman > 0.5) pLegR = rotateZ(pLegR, -sin(t * 4.0) * 0.8);
        float thighR = sdCapsule(pLegR, vec3(0.0), vec3(0.0, -0.4, 0.0), 0.052);

        vec3 pCalfR = pLegR - vec3(0.0, -0.4, 0.0);
        float kneeR = mix(max(0.0, -sin(t * 0.8)) * 0.5, -abs(cos(t * 5.0)) * 1.8, u_unhuman);
        pCalfR = rotateX(pCalfR, kneeR);
        float calfR = sdCapsule(pCalfR, vec3(0.0), vec3(0.0, -0.45, 0.0), 0.038);
        float legR = smin(thighR, calfR, 0.04);

        float body = smin(upperHead, bodyCore, 0.07);
        body = smin(body, armL, 0.05);
        body = smin(body, armR, 0.05);
        body = smin(body, legL, 0.06);
        body = smin(body, legR, 0.06);

        return body + fluidEffect;
      }

      vec2 map(vec3 p) {
        p *= 1.35;

        vec3 pChrome = p - vec3(-0.65, -0.3, 0.0);
        float dChrome = sdHumanoid(pChrome, 0.0);

        vec3 pGlass = p - vec3(0.65, -0.3, 0.0);
        float dGlass = sdHumanoid(pGlass, 1.0);

        if (dChrome < dGlass) {
          return vec2(dChrome / 1.35, 1.0);
        } else {
          return vec2(dGlass / 1.35, 2.0);
        }
      }

      vec3 calcNormal(vec3 p) {
        float d = map(p).x;
        vec2 e = vec2(0.001, 0.0);
        vec3 n = d - vec3(
          map(p - e.xyy).x,
          map(p - e.yxy).x,
          map(p - e.yyx).x
        );
        return normalize(n);
      }

      vec3 getBackground(vec3 rd) {
        float bgPattern = sin(rd.x * 10.0) * sin(rd.y * 10.0);
        vec3 baseBg = mix(vec3(0.02, 0.03, 0.06), vec3(0.08, 0.12, 0.22), rd.y * 0.5 + 0.5);
        return baseBg + vec3(0.03, 0.06, 0.1) * smoothstep(0.2, 0.8, bgPattern);
      }

      vec3 render(vec3 ro, vec3 rd) {
        float dO = 0.0;
        float matID = 0.0;

        for(int i = 0; i < MAX_STEPS; i++) {
          vec3 p = ro + rd * dO;
          vec2 res = map(p);
          float dS = res.x;
          matID = res.y;
          dO += dS;
          if(dS < SURF_DIST || dO > MAX_DIST) break;
        }

        if(dO > MAX_DIST) return getBackground(rd);

        vec3 p = ro + rd * dO;
        vec3 n = calcNormal(p);

        vec3 sideLightDir = normalize(vec3(2.5, 0.3, 0.8));
        vec3 frontLightDir = normalize(vec3(0.0, 1.0, 1.0));
        vec3 lightDir = mix(frontLightDir, sideLightDir, u_side_light);
        
        float diff = max(0.0, dot(n, lightDir));

        if (matID < 1.5) {
          vec3 r = reflect(rd, n);
          float envMap = sin(r.x * 5.0) * sin(r.y * 5.0) * sin(r.z * 5.0);
          envMap = smoothstep(-0.3, 0.7, envMap);

          vec3 col = mix(vec3(0.18, 0.22, 0.28), vec3(0.95, 0.98, 1.0), envMap);
          
          float spec = pow(max(0.0, dot(r, lightDir)), 16.0);
          col += vec3(0.9, 0.95, 1.0) * diff * 0.5 + vec3(1.0, 0.8, 0.5) * spec * (0.8 + 0.6 * u_side_light);

          float fresnel = pow(1.0 - max(0.0, dot(-rd, n)), 3.5);
          col += vec3(0.35, 0.65, 0.95) * fresnel;
          return col;
        } 
        else {
          vec3 reflectRay = reflect(rd, n);
          vec3 refRay = refract(rd, n, 1.0 / 1.35);

          if (length(refRay) == 0.0) {
            refRay = reflectRay;
          }

          float fresnel = pow(1.0 - max(0.0, dot(-rd, n)), 2.5);

          vec3 refrColor = getBackground(refRay) + vec3(0.05, 0.2, 0.35);
          
          float spec = pow(max(0.0, dot(reflectRay, lightDir)), 32.0);
          vec3 reflColor = vec3(0.9, 0.95, 1.0) * spec * (1.0 + u_side_light * 0.8) + vec3(0.4, 0.7, 1.0) * fresnel;

          return mix(refrColor, reflColor, clamp(fresnel + 0.2, 0.0, 1.0)) + vec3(0.12, 0.18, 0.22) * diff;
        }
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;

        vec3 ro = vec3(0.0, 0.0, 3.8);
        vec3 rd = normalize(vec3(uv, -1.6));

        float rotXAngle = u_mouse.y * 1.8;
        float rotYAngle = u_time * 0.2 * u_speed + u_mouse.x * 3.0;

        ro.yz *= rot(rotXAngle);
        rd.yz *= rot(rotXAngle);

        ro.xz *= rot(rotYAngle);
        rd.xz *= rot(rotYAngle);

        vec3 col = render(ro, rd);

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const uniforms = {
      u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      u_time: { value: 0 },
      u_mouse: { value: new THREE.Vector2(0, 0) },
      u_speed: { value: 2.0 },
      u_side_light: { value: 1.0 },
      u_unhuman: { value: 1.0 }
    };

    const material = new THREE.ShaderMaterial({
      vertexShader: `
        void main() {
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: fragmentShader,
      uniforms: uniforms
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(plane);

    const btnUnhuman = document.getElementById('btn-unhuman');
    const btnSpeed = document.getElementById('btn-speed');
    const btnLight = document.getElementById('btn-light');

    btnUnhuman.addEventListener('click', () => {
      if (uniforms.u_unhuman.value === 1.0) {
        uniforms.u_unhuman.value = 0.0;
        btnUnhuman.textContent = "MOTION: HUMAN (人間的)";
        btnUnhuman.classList.remove('active');
      } else {
        uniforms.u_unhuman.value = 1.0;
        btnUnhuman.textContent = "MOTION: UNHUMAN (異次元・不気味)";
        btnUnhuman.classList.add('active');
      }
    });

    // 1.0x -> 2.0x -> 5.0x の3段階トグル切り替え
    btnSpeed.addEventListener('click', () => {
      if (uniforms.u_speed.value === 1.0) {
        uniforms.u_speed.value = 2.0;
        btnSpeed.textContent = "SPEED: 2.0x (倍速)";
        btnSpeed.classList.add('active');
      } else if (uniforms.u_speed.value === 2.0) {
        uniforms.u_speed.value = 5.0;
        btnSpeed.textContent = "SPEED: 5.0x (超高速)";
        btnSpeed.classList.add('active');
      } else {
        uniforms.u_speed.value = 1.0;
        btnSpeed.textContent = "SPEED: 1.0x (等速)";
        btnSpeed.classList.remove('active');
      }
    });

    btnLight.addEventListener('click', () => {
      if (uniforms.u_side_light.value === 1.0) {
        uniforms.u_side_light.value = 0.0;
        btnLight.textContent = "LIGHT: FRONT (正面光)";
        btnLight.classList.remove('active');
      } else {
        uniforms.u_side_light.value = 1.0;
        btnLight.textContent = "LIGHT: SIDE (サイド光)";
        btnLight.classList.add('active');
      }
    });

    let isDragging = false;
    let mousePos = { x: 0, y: 0 };

    window.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        mousePos.x += e.movementX * 0.003;
        mousePos.y = Math.max(-0.8, Math.min(0.8, mousePos.y + e.movementY * 0.003));
      }
      material.uniforms.u_mouse.value.set(mousePos.x, mousePos.y);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      material.uniforms.u_time.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
