<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>CineMove 3D</title>
<script src="https://unpkg.com/three@0.161.0/build/three.min.js"></script>
<style>
:root{--bg:#09111d;--panel:rgba(255,255,255,.065);--line:rgba(255,255,255,.11);--text:#eaf5ff;--muted:#91a4b7;--blue:#4cc8ff;--blue2:#287cff}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 30% 0,#18283b 0,#0a111c 40%,#070c14 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 14px calc(100px + env(safe-area-inset-bottom));}
header{height:62px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:.4px;font-size:20px}.brand i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,#52d4ff,#286dff);margin-right:8px;box-shadow:0 0 22px #1d8fff80;font-style:normal}.iconbtn,.fab,.control{border:1px solid var(--line);color:var(--text);background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:8px 8px 18px #0008,-4px -4px 14px #ffffff08;cursor:pointer}.iconbtn{width:42px;height:42px;border-radius:14px;font-size:19px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:25px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:16px 18px 35px #0007,-5px -5px 18px #ffffff06;overflow:hidden}
.viewport{height:330px;position:relative}.viewport canvas{display:block;width:100%;height:100%}.badge{position:absolute;top:13px;left:14px;padding:7px 10px;border-radius:999px;background:#07111bcc;border:1px solid var(--line);font-size:11px;color:#b9eaff}.subview{position:absolute;right:13px;bottom:13px;width:120px;height:78px;border-radius:16px;overflow:hidden;border:1px solid #ffffff22;background:#06111b;box-shadow:0 8px 20px #0009}.subview canvas{width:100%;height:100%;display:block}
.motionTitle{padding:15px 4px 7px}.motionTitle h2{margin:0;font-size:22px}.motionTitle p{margin:5px 0 0;color:var(--muted);font-size:12px}
.controls{padding:12px;display:flex;align-items:center;justify-content:center;gap:13px}.control{width:52px;height:52px;border-radius:18px;font-size:18px}.control.primary{width:64px;height:64px;border-radius:22px;background:linear-gradient(145deg,#43caff,#236cff);border:none;box-shadow:0 0 26px #298fff80,8px 10px 20px #0008}.control:active,.iconbtn:active,.fab:active{transform:translate(2px,2px);box-shadow:inset 4px 4px 12px #0008}
.segment{margin:4px 0 14px;padding:5px;background:#050b12aa;border:1px solid var(--line);border-radius:16px;display:flex}.segment button{flex:1;padding:10px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:700}.segment button.active{background:#1a2a3b;color:#e9f9ff;box-shadow:5px 5px 12px #0008,-2px -2px 8px #ffffff08}
.section{margin-top:18px}.sectionHead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 9px}.sectionHead h3{font-size:13px;letter-spacing:1px;color:#a8c0d2;margin:0}.param{padding:13px 15px;margin-bottom:10px}.param label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px}.param b{color:#6ed9ff}input[type=range]{width:100%;accent-color:#42c7ff}
.speed{display:flex;gap:8px}.speed button{flex:1;border:1px solid var(--line);background:#0b1622;color:var(--muted);border-radius:12px;padding:10px;font-weight:700}.speed button.active{color:white;background:#1c5cff}
.library{margin-top:22px}.videoCard{display:flex;gap:12px;padding:11px;margin-bottom:10px}.thumb{width:110px;height:74px;border-radius:15px;background:linear-gradient(135deg,#1d6ca0,#13253e);display:grid;place-items:center;font-size:26px;flex:none}.vbody{min-width:0;flex:1}.vtitle{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{font-size:10px;color:#71879a;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{font-size:10px;padding:4px 7px;border-radius:8px;background:#1788c522;color:#7ddaff;border:1px solid #3bc7ff33}.vactions{display:flex;gap:6px;margin-top:7px}.mini{border:0;border-radius:9px;padding:5px 8px;background:#1b5cff;color:#fff;font-size:10px}.mini.delete{background:#ffffff10;color:#aab9c6}
.fab{position:fixed;right:22px;bottom:24px;width:58px;height:58px;border-radius:50%;font-size:29px;background:linear-gradient(145deg,#49d0ff,#226cff);border:0;box-shadow:0 0 25px #258eff80,10px 10px 22px #0008}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal.show{display:flex}.sheet{width:min(620px,100%);padding:20px;border-radius:28px 28px 20px 20px;background:#101b28;border:1px solid var(--line);box-shadow:0 -20px 60px #000}.sheet h3{margin:0 0 15px}.sheet input,.sheet textarea{width:100%;border:1px solid #ffffff16;background:#07111b;color:#fff;border-radius:14px;padding:13px;margin-bottom:10px;font:inherit}.sheet textarea{min-height:80px}.tagPick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tagPick button{border:1px solid #ffffff18;background:#ffffff08;color:#b8c9d8;padding:8px 10px;border-radius:12px}.tagPick button.active{background:#1979bd;color:#fff}.sheetActions{display:flex;gap:9px}.sheetActions button{flex:1;border:0;padding:13px;border-radius:14px;font-weight:800}.save{background:#2d8fff;color:#fff}.cancel{background:#ffffff10;color:#b9c7d3}
.empty{padding:22px;text-align:center;color:#7890a2;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><i>◉</i>CineMove 3D</div><button class="iconbtn">☰</button></header>

<div class="card viewport" id="view"><div class="badge" id="viewLabel">TOP VIEW · DOLLY IN</div><div class="subview"><canvas id="subCanvas"></canvas></div></div>
<div class="motionTitle"><h2 id="moveName">Dolly In</h2><p id="moveDesc">カメラが被写体へゆっくり近づく</p></div>

<div class="controls"><button class="control" id="prev">‹</button><button class="control primary" id="play">▶</button><button class="control" id="next">›</button></div>
<div class="segment"><button class="active" data-view="top">俯瞰 View</button><button data-view="lens">Lens View</button></div>

<div class="section">
 <div class="sectionHead"><h3>SPEED</h3></div>
 <div class="speed"><button data-speed=".5">0.5x</button><button data-speed="1" class="active">1x</button><button data-speed="2">2x</button></div>
</div>

<div class="section">
 <div class="sectionHead"><h3>CAMERA PARAMETERS</h3></div>
 <div class="card param"><label>移動距離 <b id="distanceVal">4.0m</b></label><input id="distance" type="range" min="2" max="10" step=".1" value="4"></div>
 <div class="card param"><label>カメラ高 <b id="heightVal">1.6m</b></label><input id="height" type="range" min=".5" max="3" step=".1" value="1.6"></div>
 <div class="card param"><label>焦点距離 <b id="focalVal">35mm</b></label><input id="focal" type="range" min="18" max="85" step="1" value="35"></div>
</div>

<div class="library">
 <div class="sectionHead"><h3>REFERENCE VIDEOS</h3><span style="font-size:11px;color:#71879a" id="count"></span></div>
 <div id="videoList"></div>
</div>
</div>

<button class="fab" id="add">＋</button>

<div class="modal" id="modal"><div class="sheet">
<h3>参考動画を追加</h3>
<input id="urlInput" placeholder="YouTube / Instagram / TikTok URL">
<input id="titleInput" placeholder="タイトル（任意）">
<div class="tagPick" id="tagPick"></div>
<textarea id="memoInput" placeholder="メモ"></textarea>
<div class="sheetActions"><button class="cancel" id="cancel">キャンセル</button><button class="save" id="save">保存</button></div>
</div></div>


<script>
/*
 CineMove 3D - Safe Mobile Prototype
 UI controls are initialized independently of Three.js.
 If the local HTML viewer blocks the external CDN, a Canvas fallback still works.
*/
const moves=[
 {id:'dolly',name:'Dolly In',desc:'カメラが被写体へゆっくり近づく'},
 {id:'pan',name:'Pan Right',desc:'その場で被写体を追いながら右へ旋回する'},
 {id:'orbit',name:'Orbit',desc:'被写体を中心に弧を描いて移動する'}
];
const tags=['Dolly In','Dolly Out','Pan','Tilt','Orbit','Close Up','Wide'];

let moveIndex=0, playing=false, speed=1, progress=0, last=performance.now(), viewMode='top';
let selectedTags=['Dolly In'];
let videos=[];

const $=id=>document.getElementById(id);
const play=$('play'), prevBtn=$('prev'), nextBtn=$('next');
const moveNameEl=$('moveName'), moveDescEl=$('moveDesc');
const distanceEl=$('distance'), heightEl=$('height'), focalEl=$('focal');
const distanceValEl=$('distanceVal'), heightValEl=$('heightVal'), focalValEl=$('focalVal');
const modalEl=$('modal'), addBtn=$('add'), cancelBtn=$('cancel'), saveBtn=$('save');
const urlInputEl=$('urlInput'), titleInputEl=$('titleInput'), memoInputEl=$('memoInput');
const tagPickEl=$('tagPick'), videoListEl=$('videoList'), countEl=$('count');
const container=$('view');

try { videos=JSON.parse(localStorage.getItem('cinemove-videos')||'[]'); } catch(e){ videos=[]; }

function currentMove(){ return moves[moveIndex]; }
function setMove(i){
  moveIndex=(i+moves.length)%moves.length;
  progress=0; playing=false; play.textContent='▶';
  moveNameEl.textContent=currentMove().name;
  moveDescEl.textContent=currentMove().desc;
  selectedTags=[currentMove().id==='pan'?'Pan':currentMove().id==='orbit'?'Orbit':'Dolly In'];
  renderTagPick();
  drawFallback();
}
function setPlaying(){
  if(progress>=1) progress=0;
  playing=!playing;
  play.textContent=playing?'Ⅱ':'▶';
}
play.addEventListener('click',setPlaying);
prevBtn.addEventListener('click',()=>setMove(moveIndex-1));
nextBtn.addEventListener('click',()=>setMove(moveIndex+1));

document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); viewMode=b.dataset.view; drawFallback();
}));
document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{
  speed=parseFloat(b.dataset.speed);
  document.querySelectorAll('[data-speed]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
}));
distanceEl.addEventListener('input',()=>{distanceValEl.textContent=parseFloat(distanceEl.value).toFixed(1)+'m';});
heightEl.addEventListener('input',()=>{heightValEl.textContent=parseFloat(heightEl.value).toFixed(1)+'m';});
focalEl.addEventListener('input',()=>{focalValEl.textContent=focalEl.value+'mm'; drawFallback();});

function renderTagPick(){
  tagPickEl.innerHTML='';
  tags.forEach(t=>{
    const b=document.createElement('button'); b.textContent=t;
    if(selectedTags.includes(t)) b.classList.add('active');
    b.addEventListener('click',()=>{
      selectedTags=selectedTags.includes(t)?selectedTags.filter(x=>x!==t):[...selectedTags,t];
      renderTagPick();
    });
    tagPickEl.appendChild(b);
  });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function youtubeThumb(url){
  const m=url.match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{6,})/);
  return m?'https://i.ytimg.com/vi/'+m[1]+'/hqdefault.jpg':'';
}
function renderVideos(){
  countEl.textContent=videos.length+' saved';
  videoListEl.innerHTML='';
  if(!videos.length){
    videoListEl.innerHTML='<div class="card empty">参考動画を追加するとここに保存されます</div>';
    return;
  }
  videos.slice().reverse().forEach(v=>{
    const card=document.createElement('div'); card.className='card videoCard';
    const th=document.createElement('div'); th.className='thumb';
    if(v.thumb){th.style.backgroundImage=`url("${v.thumb}")`;th.style.backgroundSize='cover';th.style.backgroundPosition='center';}
    else th.textContent='▶';
    const body=document.createElement('div'); body.className='vbody';
    body.innerHTML=`<div class="vtitle">${escapeHtml(v.title||'Reference Video')}</div>
    <div class="url">${escapeHtml(v.url)}</div>
    <div class="tags">${(v.tags||[]).map(t=>'<span class="tag">'+escapeHtml(t)+'</span>').join('')}</div>
    <div class="vactions"><button class="mini">3Dで再現</button><button class="mini delete">削除</button></div>`;
    card.append(th,body);
    const buttons=body.querySelectorAll('button');
    buttons[0].addEventListener('click',()=>{
      const t=(v.tags||[])[0]||'';
      setMove(t.includes('Pan')?1:t.includes('Orbit')?2:0);
      window.scrollTo({top:0,behavior:'smooth'});
    });
    buttons[1].addEventListener('click',()=>{
      videos=videos.filter(x=>x.id!==v.id);
      try{localStorage.setItem('cinemove-videos',JSON.stringify(videos));}catch(e){}
      renderVideos();
    });
    videoListEl.appendChild(card);
  });
}
addBtn.addEventListener('click',()=>{modalEl.classList.add('show'); renderTagPick();});
cancelBtn.addEventListener('click',()=>modalEl.classList.remove('show'));
saveBtn.addEventListener('click',()=>{
  const u=urlInputEl.value.trim();
  if(!u){alert('URLを入力してください');return;}
  const platform=/youtube|youtu\.be/i.test(u)?'YouTube':/instagram/i.test(u)?'Instagram':/tiktok/i.test(u)?'TikTok':'Web';
  videos.push({id:Date.now(),url:u,title:titleInputEl.value.trim()||platform+' Reference',tags:[...selectedTags],memo:memoInputEl.value.trim(),thumb:youtubeThumb(u)});
  try{localStorage.setItem('cinemove-videos',JSON.stringify(videos));}catch(e){}
  renderVideos(); modalEl.classList.remove('show');
  urlInputEl.value=''; titleInputEl.value=''; memoInputEl.value='';
});

/* Canvas fallback: works even when local HTML viewer blocks Three.js CDN */
const fallbackCanvas=document.createElement('canvas');
fallbackCanvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;';
container.prepend(fallbackCanvas);
const badge=$('viewLabel'); if(badge) badge.style.zIndex='2';
const sub=$('subCanvas'); // existing sub canvas

function drawScene(ctx,w,h,small=false){
  ctx.clearRect(0,0,w,h);
  const grad=ctx.createLinearGradient(0,0,w,h); grad.addColorStop(0,'#172b3e');grad.addColorStop(1,'#08111a');
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
  const scale=small?0.62:1;
  const cx=w*.50, horizon=h*.52;
  // ground grid
  ctx.strokeStyle='rgba(75,165,215,.20)';ctx.lineWidth=1;
  for(let i=-8;i<=8;i++){
    ctx.beginPath();ctx.moveTo(cx,horizon);ctx.lineTo(cx+i*w*.11,h);ctx.stroke();
  }
  for(let j=1;j<7;j++){
    const y=horizon+(h-horizon)*(j/7)*(j/7);
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
  }
  // subject
  const sy=horizon-18;
  ctx.fillStyle='#86b6ca';ctx.beginPath();ctx.arc(cx,sy-42*scale,18*scale,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#25678c';ctx.fillRect(cx-22*scale,sy-23*scale,44*scale,50*scale);
  ctx.fillRect(cx-18*scale,sy+27*scale,12*scale,42*scale);ctx.fillRect(cx+6*scale,sy+27*scale,12*scale,42*scale);

  // camera position by motion
  let x,y;
  const p=progress;
  if(currentMove().id==='dolly'){x=cx;y=horizon+120-(p*90);}
  else if(currentMove().id==='pan'){x=w*.22;y=horizon+95;}
  else {x=cx+Math.sin(-1+p*2)*w*.28;y=horizon+95;}
  // path
  ctx.strokeStyle='rgba(80,210,255,.75)';ctx.lineWidth=3;ctx.setLineDash([7,6]);
  ctx.beginPath();
  if(currentMove().id==='dolly'){ctx.moveTo(cx,horizon+125);ctx.lineTo(cx,horizon+25);}
  else if(currentMove().id==='pan'){ctx.moveTo(w*.18,horizon+95);ctx.lineTo(w*.35,horizon+95);}
  else {ctx.arc(cx,horizon+10,w*.32,.45*Math.PI,.95*Math.PI);}
  ctx.stroke();ctx.setLineDash([]);
  // camera
  ctx.save();ctx.translate(x,y);
  const ang=Math.atan2((horizon)-y,cx-x);ctx.rotate(ang);
  ctx.fillStyle='#4fcaff';ctx.shadowColor='#38bfff';ctx.shadowBlur=18;
  ctx.fillRect(-18,-11,36,22);ctx.fillStyle='#071018';ctx.fillRect(15,-7,14,14);
  ctx.restore();
  // arrow
  ctx.strokeStyle='#8be5ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(cx,horizon);ctx.stroke();
  ctx.fillStyle='#8be5ff';ctx.font='11px system-ui';ctx.fillText(small?'LENS':'CAMERA',x+10,y-12);
}
function drawFallback(){
  const r=container.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2);
  fallbackCanvas.width=r.width*d;fallbackCanvas.height=r.height*d;
  const ctx=fallbackCanvas.getContext('2d');ctx.setTransform(d,0,0,d,0,0);
  drawScene(ctx,r.width,r.height,false);
  if(sub){
    const sr=sub.getBoundingClientRect();sub.width=sr.width*d;sub.height=sr.height*d;
    const sctx=sub.getContext('2d');sctx.setTransform(d,0,0,d,0,0);
    drawScene(sctx,sr.width,sr.height,true);
  }
  if(badge) badge.textContent=(viewMode==='top'?'TOP VIEW':'LENS VIEW')+' · '+currentMove().name.toUpperCase();
}

/* Try Three.js, but never let failure disable UI */
let threeActive=false;
try{
  if(window.THREE){
    // Keep fallback as the guaranteed renderer in local-file mode.
    // Three.js can be added later without coupling UI event handlers to CDN availability.
    threeActive=true;
  }
}catch(e){ threeActive=false; }

function tick(now){
  const dt=(now-last)/1000;last=now;
  if(playing){
    progress+=dt*speed/3;
    if(progress>=1){progress=1;playing=false;play.textContent='↻';}
  }
  drawFallback();
  requestAnimationFrame(tick);
}
renderVideos();renderTagPick();drawFallback();requestAnimationFrame(tick);
window.addEventListener('resize',drawFallback);
</script>
</body></html>
