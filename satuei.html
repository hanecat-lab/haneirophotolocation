<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMove 3D - Advanced Camera Director</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 880px;
            background: rgba(23, 32, 54, 0.7);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .logo { font-weight: 800; font-size: 18px; color: #fff; }
        .logo span { color: #38bdf8; }

        /* 3D Viewport */
        .viewport-box {
            position: relative;
            width: 100%;
            height: 240px;
            background: #050811;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* Controls Panel */
        .controls-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 4px 4px 10px #070a12;
        }

        .btn-row { display: flex; gap: 10px; }
        .neo-btn {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            border: none;
            color: #fff;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            flex: 1;
            font-size: 12px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .toggle-group {
            display: flex;
            background: #090d16;
            padding: 3px;
            border-radius: 10px;
        }
        .toggle-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .toggle-btn.active {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        /* 9 Presets Grid */
        .presets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
            max-height: 140px;
            overflow-y: auto;
        }
        .preset-chip {
            background: #1e293b;
            color: #94a3b8;
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .preset-chip.active {
            background: #0f172a;
            color: #38bdf8;
            border-color: #38bdf8;
        }

        /* AI Prompt Box */
        .prompt-box {
            background: #090d16;
            border-radius: 12px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .prompt-title { font-size: 10px; font-weight: bold; color: #94a3b8; }
        .copy-btn {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .prompt-text {
            font-family: monospace;
            font-size: 10px;
            color: #38bdf8;
            word-break: break-all;
        }

        /* References Area */
        .video-list {
            margin-top: 10px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .video-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            padding: 8px 10px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .thumb {
            width: 45px;
            height: 35px;
            background: #334155;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-size: 10px;
        }
        .v-info h4 { font-size: 10px; color: #e2e8f0; margin-bottom: 2px;}
        .v-info p { font-size: 8px; color: #64748b;}
        .tag {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 4px;
        }

        .add-btn {
            margin-top: 8px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="logo">CineMove <span>3D Pro</span></div>
            <div style="font-size: 9px; color: #64748b;">NEO-TACTILE UI</div>
        </div>

        <!-- 3D Viewport -->
        <div class="viewport-box">
            <div class="badge" id="current-name">1. Dolly In</div>
            <canvas id="c3d"></canvas>
        </div>

        <!-- Action Controls -->
        <div class="controls-card">
            <div class="btn-row">
                <button class="neo-btn" id="play-btn">PAUSE</button>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="btn-top">俯瞰</button>
                    <button class="toggle-btn" id="btn-lens">レンズ</button>
                </div>
            </div>
        </div>

        <!-- 9 Angle Presets -->
        <div class="presets-grid" id="preset-container"></div>

        <!-- Prompt Output -->
        <div class="prompt-box">
            <div class="prompt-header">
                <span class="prompt-title">AI PROMPT (Sora / Runway / Kling)</span>
                <button class="copy-btn" onclick="copyPrompt()">COPY</button>
            </div>
            <div class="prompt-text" id="prompt-output">cinematic dolly in shot, camera smoothly moving forward towards subject</div>
        </div>

        <!-- Saved References -->
        <div class="video-list">
            <div style="font-size: 9px; color: #94a3b8; font-weight: bold;">SAVED REFERENCES</div>
            <div class="video-card">
                <div class="thumb">▶</div>
                <div class="v-info">
                    <h4>カフェ撮影の寄りカット</h4>
                    <p>youtube.com/shorts/sample1</p>
                    <span class="tag">Dolly In</span>
                </div>
            </div>
        </div>

        <button class="add-btn" onclick="addUrl()">+ ADD REFERENCE URL</button>
    </div>

    <script>
        const presets = [
            { name: '1. Dolly In', prompt: 'cinematic dolly in shot, camera smoothly moving forward towards subject' },
            { name: '2. Dolly Out', prompt: 'cinematic dolly out shot, camera slowly pulling back away from subject' },
            { name: '3. Pan Left/Right', prompt: 'cinematic pan shot, camera panning horizontally across scene' },
            { name: '4. Tilt Up/Down', prompt: 'cinematic tilt up shot, camera tilting vertically from bottom to top' },
            { name: '5. Truck Left/Right', prompt: 'cinematic truck shot, camera moving parallel along side of subject' },
            { name: '6. Orbit 360°', prompt: 'cinematic orbit shot, 360-degree smooth rotational camera movement around subject' },
            { name: '7. Crane Up/Down', prompt: 'cinematic crane shot, camera rising vertically high above subject' },
            { name: '8. Zoom In/Out', prompt: 'cinematic optical zoom in, changing focal length rapidly on subject' },
            { name: '9. Vertigo Zoom', prompt: 'cinematic vertigo effect, dolly zoom pulling back while zooming in, background distortion' }
        ];

        let currentPreset = 0;
        let isPlaying = true;
        let viewMode = 'top';
        let progress = 0;

        const canvas = document.getElementById('c3d');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Render Preset Chips
        const container = document.getElementById('preset-container');
        presets.forEach((p, idx) => {
            const chip = document.createElement('div');
            chip.className = `preset-chip ${idx === 0 ? 'active' : ''}`;
            chip.textContent = p.name;
            chip.onclick = () => selectPreset(idx);
            container.appendChild(chip);
        });

        function selectPreset(idx) {
            currentPreset = idx;
            document.getElementById('current-name').textContent = presets[idx].name;
            document.getElementById('prompt-output').textContent = presets[idx].prompt;
            document.querySelectorAll('.preset-chip').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            progress = 0;
        }

        document.getElementById('play-btn').onclick = function() {
            isPlaying = !isPlaying;
            this.textContent = isPlaying ? 'PAUSE' : 'PLAY';
        };

        document.getElementById('btn-top').onclick = function() {
            viewMode = 'top';
            this.classList.add('active');
            document.getElementById('btn-lens').classList.remove('active');
        };

        document.getElementById('btn-lens').onclick = function() {
            viewMode = 'lens';
            this.classList.add('active');
            document.getElementById('btn-top').classList.remove('active');
        };

        function copyPrompt() {
            const text = document.getElementById('prompt-output').textContent;
            navigator.clipboard.writeText(text);
            alert("プロンプトをコピーしました！");
        }

        function addUrl() {
            const url = prompt("参考URLを入力してください:");
            if (url) alert("URLを保存しました！");
        }

        function project(x, y, z) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2 + 15;
            if (viewMode === 'top') {
                return { x: cx + (x - z) * 15, y: cy + (x + z) * 7.5 - y * 15, scale: 1 };
            } else {
                const scale = 150 / (z + 10);
                return { x: cx + x * scale * 10, y: cy - y * scale * 10, scale: scale };
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isPlaying) {
                progress += 0.015;
                if (progress > 1) progress = 0;
            }

            // Grid
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let i = -4; i <= 4; i++) {
                let p1 = project(i, 0, -4), p2 = project(i, 0, 4);
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                let p3 = project(-4, 0, i), p4 = project(4, 0, i);
                ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
            }

            // Subject
            let pBase = project(0, 0, 0), pTop = project(0, 2, 0);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(pBase.x, pBase.y); ctx.lineTo(pTop.x, pTop.y); ctx.stroke();

            // Camera Trajectory Logic for 9 Angles
            let camX = 0, camY = 1, camZ = 4;
            switch(currentPreset) {
                case 0: camZ = 6 - progress * 4; break; // Dolly In
                case 1: camZ = 2 + progress * 4; break; // Dolly Out
                case 2: camX = (progress - 0.5) * 6; camZ = 4; break; // Pan
                case 3: camY = progress * 3; camZ = 4; break; // Tilt
                case 4: camX = (progress - 0.5) * 6; camZ = 3; break; // Truck
                case 5: // Orbit 360
                    const angle = progress * Math.PI * 2;
                    camX = Math.sin(angle) * 4; camZ = Math.cos(angle) * 4; break;
                case 6: camY = 0.5 + progress * 3.5; camZ = 4; break; // Crane
                case 7: camZ = 4; break; // Zoom (Visualized via line thickness / lens mode scale)
                case 8: camZ = 2 + progress * 4; break; // Vertigo Zoom
            }

            // Camera Node
            let camP = project(camX, camY, camZ);
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(camP.x, camP.y, 6 * (viewMode === 'top' ? 1 : camP.scale), 0, Math.PI * 2);
            ctx.fill();

            // Sight line
            let targetP = project(0, 1, 0);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
            ctx.lineWidth = currentPreset === 7 ? 1 + progress * 3 : 1; // Visual effect for Zoom
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(camP.x, camP.y); ctx.lineTo(targetP.x, targetP.y); ctx.stroke();
            ctx.setLineDash([]);

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
