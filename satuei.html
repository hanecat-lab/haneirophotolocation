<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMove 3D - Interactive Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* アプリ外枠（スマホ風フレーム） */
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 800px;
            background: rgba(23, 32, 54, 0.7);
            border-radius: 36px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ヘッダー */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .logo {
            font-weight: 800;
            font-size: 18px;
            color: #fff;
        }
        .logo span { color: #38bdf8; }

        /* 3Dキャンバス表示領域 */
        .viewport-box {
            position: relative;
            width: 100%;
            height: 250px;
            background: #050811;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* 操作パネル UI */
        .controls-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 16px;
            padding: 12px;
            margin-top: 15px;
            box-shadow: 4px 4px 10px #070a12;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .neo-btn {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            border: none;
            color: #fff;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            flex: 1;
            font-size: 12px;
        }

        .toggle-group {
            display: flex;
            background: #090d16;
            padding: 3px;
            border-radius: 10px;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .toggle-btn.active {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        /* プリセット横スクロール */
        .presets-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0 5px 0;
        }

        .preset-chip {
            background: #1e293b;
            color: #94a3b8;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .preset-chip.active {
            background: #0f172a;
            color: #38bdf8;
            border-color: #38bdf8;
        }

        /* リファレンス動画リスト */
        .video-list {
            margin-top: 15px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .thumb {
            width: 60px;
            height: 45px;
            background: #334155;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-size: 12px;
        }

        .v-info h4 { font-size: 11px; color: #e2e8f0; margin-bottom: 2px;}
        .v-info p { font-size: 9px; color: #64748b;}
        .tag {
            display: inline-block;
            margin-top: 4px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .add-btn {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ヘッダー -->
        <div class="header">
            <div class="logo">CineMove <span>3D</span></div>
            <div style="font-size: 10px; color: #64748b;">NEO-TACTILE UI</div>
        </div>

        <!-- 3Dビューポート -->
        <div class="viewport-box">
            <div class="badge" id="current-name">1. Dolly In (接近)</div>
            <canvas id="c3d"></canvas>
        </div>

        <!-- アクションパネル -->
        <div class="controls-card">
            <div class="btn-row">
                <button class="neo-btn" id="play-btn">PAUSE</button>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="btn-top">俯瞰</button>
                    <button class="toggle-btn" id="btn-lens">レンズ</button>
                </div>
            </div>
        </div>

        <!-- アングルプリセット -->
        <div class="presets-scroll">
            <div class="preset-chip active" onclick="selectPreset(0, '1. Dolly In (接近)')">1. Dolly In</div>
            <div class="preset-chip" onclick="selectPreset(1, '2. Pan Right (右移動)')">2. Pan Right</div>
            <div class="preset-chip" onclick="selectPreset(2, '3. Orbit 360° (周回)')">3. Orbit 360°</div>
            <div class="preset-chip" onclick="selectPreset(3, '4. Low Angle (下から)')">4. Low Angle</div>
        </div>

        <!-- リファレンス動画保管箱 -->
        <div class="video-list">
            <div style="font-size: 10px; color: #94a3b8; font-weight: bold;">SAVED REFERENCES</div>
            
            <div class="video-card">
                <div class="thumb">▶</div>
                <div class="v-info">
                    <h4>カフェ撮影の寄りカット再現</h4>
                    <p>youtube.com/shorts/sample1</p>
                    <span class="tag">Dolly In</span>
                </div>
            </div>

            <div class="video-card">
                <div class="thumb">▶</div>
                <div class="v-info">
                    <h4>モデルを囲む360度シネマティクス</h4>
                    <p>instagram.com/reel/sample2</p>
                    <span class="tag">Orbit 360°</span>
                </div>
            </div>
        </div>

        <button class="add-btn" onclick="addUrl()">+ ADD REFERENCE URL</button>
    </div>

    <!-- 描画スクリプト（完全自作・依存関係ゼロ） -->
    <script>
        const canvas = document.getElementById('c3d');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let isPlaying = true;
        let viewMode = 'top';
        let currentPreset = 0;
        let progress = 0;

        document.getElementById('play-btn').onclick = function() {
            isPlaying = !isPlaying;
            this.textContent = isPlaying ? 'PAUSE' : 'PLAY';
        };

        document.getElementById('btn-top').onclick = function() {
            viewMode = 'top';
            this.classList.add('active');
            document.getElementById('btn-lens').classList.remove('active');
        };

        document.getElementById('btn-lens').onclick = function() {
            viewMode = 'lens';
            this.classList.add('active');
            document.getElementById('btn-top').classList.remove('active');
        };

        function selectPreset(idx, name) {
            currentPreset = idx;
            document.getElementById('current-name').textContent = name;
            document.querySelectorAll('.preset-chip').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            progress = 0;
        }

        function addUrl() {
            const url = prompt("参考にするYouTube / InstagramのURLを入力してください:");
            if (url) alert("URLを保存し、アングルタグと紐付けました！");
        }

        // 3Dから2D画面への変換ロジック
        function project(x, y, z) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2 + 20;

            if (viewMode === 'top') {
                const px = cx + (x - z) * 16;
                const py = cy + (x + z) * 8 - y * 16;
                return { x: px, y: py, scale: 1 };
            } else {
                const fov = 160;
                const scale = fov / (z + 10);
                const px = cx + x * scale * 10;
                const py = cy - y * scale * 10;
                return { x: px, y: py, scale: scale };
            }
        }

        // 描画ループ
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isPlaying) {
                progress += 0.015;
                if (progress > 1) progress = 0;
            }

            // グリッド
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let i = -4; i <= 4; i++) {
                let p1 = project(i, 0, -4);
                let p2 = project(i, 0, 4);
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();

                let p3 = project(-4, 0, i);
                let p4 = project(4, 0, i);
                ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
            }

            // 被写体（人物）
            let pBase = project(0, 0, 0);
            let pTop = project(0, 2, 0);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(pBase.x, pBase.y);
            ctx.lineTo(pTop.x, pTop.y);
            ctx.stroke();

            // カメラアニメーション計算
            let camX = 0, camY = 1, camZ = 4;
            if (currentPreset === 0) { // Dolly In
                camZ = 6 - progress * 4;
            } else if (currentPreset === 1) { // Pan Right
                camX = (progress - 0.5) * 6;
                camZ = 3;
            } else if (currentPreset === 2) { // Orbit
                const angle = progress * Math.PI * 2;
                camX = Math.sin(angle) * 4;
                camZ = Math.cos(angle) * 4;
            } else if (currentPreset === 3) { // Low Angle
                camY = 0.2;
                camZ = 5 - progress * 2;
            }

            // カメラ描画（赤点）
            let camP = project(camX, camY, camZ);
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(camP.x, camP.y, 6 * (viewMode === 'top' ? 1 : camP.scale), 0, Math.PI * 2);
            ctx.fill();

            // 視線ガイド線
            let targetP = project(0, 1, 0);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(camP.x, camP.y);
            ctx.lineTo(targetP.x, targetP.y);
            ctx.stroke();
            ctx.setLineDash([]);

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
