const recomputeStarts=(arr)=>{ 
  let cur=0; 
  return arr.map((c,i)=>{
    const safeDur = Math.max(0.3, c.duration||0.3);
    const n={...c,duration:safeDur,timelineStart:cur}; 
    const transDur = (c._transitionToNext && c._transitionToNext.type!=='none') ? (c._transitionToNext.duration||0.5) : 0;
    if(i < arr.length-1 && transDur>0){
      cur+= Math.max(0.1, safeDur - transDur);
    } else {
      cur+=safeDur;
    }
    return n; 
  }); 
};

  // 比較画面には取り込み済みのvideoを直接表示する。iPhoneのcanvas静止画はシーク後も古いフレームを返すことがある。
  const seekConnectionVideo=(clip,side,cut)=>{
    if(!clip || clip.type==='photo') return Promise.resolve();
    const video=videoRefs.current.get(clip.id);
    if(!video) return Promise.resolve();
    const base=clip._connectionBase || {duration:clip.duration,trimStart:clip.trimStart||0};
    const raw=side==='left' ? base.trimStart+base.duration-cut-0.05 : base.trimStart+cut;
    const maxTime=isFinite(video.duration) && video.duration>0 ? video.duration-0.05 : raw;
    const target=Math.max(0,Math.min(raw,maxTime));
    const last=connectionTargetRef.current.get(clip.id);
    if(last!==undefined && Math.abs(last-target)<0.005){
      return connectionSeekTasksRef.current.get(clip.id)?.promise || Promise.resolve();
    }
    connectionSeekTasksRef.current.get(clip.id)?.stop();
    connectionTargetRef.current.set(clip.id,target);
    let stopped=false,started=false,frameRequest=null;
    let limitTimer=null;
    let finishTask;
    const promise=new Promise(resolve=>{ finishTask=resolve; });
    const stop=()=>{
      if(stopped) return;
      stopped=true;
      video.removeEventListener('seeked',onSeeked);
      video.removeEventListener('loadedmetadata',onMetadata);
      if(frameRequest!==null && video.cancelVideoFrameCallback){
        try{ video.cancelVideoFrameCallback(frameRequest); }catch{}
      }
      clearTimeout(limitTimer);
      try{ video.pause(); }catch{}
      if(connectionSeekTasksRef.current.get(clip.id)?.stop===stop) connectionSeekTasksRef.current.delete(clip.id);
      finishTask();
    };
    const onSeeked=()=>{
      if(stopped || started || video.seeking) return;
      started=true;
      // 入力操作中にミュート再生で実際のフレームを描画させ、そのフレームで止める。
      try{ const playResult=video.play(); if(playResult?.catch) playResult.catch(()=>{}); }catch{}
      if(typeof video.requestVideoFrameCallback==='function'){
        const onPresented=(_now,metadata)=>{
          if(stopped) return;
          if(Math.abs(metadata.mediaTime-target)<0.3) stop();
          else frameRequest=video.requestVideoFrameCallback(onPresented);
        };
        frameRequest=video.requestVideoFrameCallback(onPresented);
      } else {
        clearTimeout(limitTimer);
        limitTimer=setTimeout(()=>{
          stop();
          if(Math.abs(video.currentTime-target)>0.15){ try{ video.currentTime=target; }catch{} }
        },160);
      }
    };
    const onMetadata=()=>{ try{ video.currentTime=target; }catch{} };
    video.addEventListener('seeked',onSeeked);
    video.addEventListener('loadedmetadata',onMetadata);
    connectionSeekTasksRef.current.set(clip.id,{stop,promise});
    limitTimer=setTimeout(()=>{
      if(!stopped){
        stop();
        // callbackが使えない端末でも、表示中のvideoを指定位置に止める。
        if(Math.abs(video.currentTime-target)>0.15){ try{ video.currentTime=target; }catch{} }
      }
    },900);
    try{
      video.muted=true;
      video.playsInline=true;
      if(video.readyState>=1){
        const alreadyThere=Math.abs(video.currentTime-target)<0.04 && !video.seeking;
        video.currentTime=target;
        if(alreadyThere) onSeeked();
      } else video.load();
    }catch{ stop(); }
    return promise;
  };

  const analyzeClipBrightnessContrast = useCallback(async (video, clip)=>{
    const realDur = (video && isFinite(video.duration) && video.duration>0) ? video.duration : (clip.duration + (clip.trimStart||0));
    const startOffset = clip.trimStart||0;
    const duration = Math.min(clip.duration, realDur - startOffset);
    if(duration<=3.1) return {trimStart: startOffset, reason:'short', score:0};
    const sampleStep = 0.2;
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const samples=[];
    const totalSteps = Math.ceil(duration / sampleStep);
    for(let i=0;i<totalSteps;i++){
      const t = i*sampleStep;
      if(t>duration) break;
      const targetTime = startOffset + t;
      await seekVideo(video, targetTime);
      try{
        ctx.drawImage(video, 0, 0, 32, 32);
        const data = ctx.getImageData(0,0,32,32).data;
        let sum=0, sumSq=0, count=0;
        for(let p=0;p<data.length;p+=4){
          const r=data[p], g=data[p+1], b=data[p+2];
          // 輝度 Y
          const y = 0.299*r + 0.587*g + 0.114*b;
          sum+=y;
          sumSq+=y*y;
          count++;
        }
        const avg = sum/count;
        const variance = Math.max(0, sumSq/count - avg*avg);
        const contrast = Math.sqrt(variance);
        // ランタンみたいな「暗い中に明るい」シーンはコントラストが高いので重みを上げる
        // score = 明るさ*0.6 + コントラスト*1.0 + 明るさ*コントラストの相乗効果
        const score = avg*0.6 + contrast*1.2 + (avg*contrast/100)*0.5;
        samples.push({t, avg, contrast, score});
      }catch(e){
        samples.push({t, avg:0, contrast:0, score:0});
      }
    }
    // 3秒窓で最高スコアを探す
    const windowSize = Math.ceil(3 / sampleStep);
    let bestIdx=0, bestScore=-1, bestAvg=0, bestContrast=0;
    for(let i=0;i<=samples.length-windowSize;i++){
      let winScore=0, winAvg=0, winContrast=0;
      for(let j=0;j<windowSize;j++){
        winScore+=samples[i+j].score;
        winAvg+=samples[i+j].avg;
        winContrast+=samples[i+j].contrast;
      }
      winScore/=windowSize;
      winAvg/=windowSize;
      winContrast/=windowSize;
      if(winScore>bestScore){
        bestScore=winScore;
        bestIdx=i;
        bestAvg=winAvg;
        bestContrast=winContrast;
      }
    }
    // スコアのばらつきが小さい場合は中央にフォールバック
    const scores = samples.map(s=>s.score);
    const meanScore = scores.reduce((a,b)=>a+b,0)/Math.max(1,scores.length);
    const stdScore = Math.sqrt(scores.reduce((a,b)=>a+(b-meanScore)*(b-meanScore),0)/Math.max(1,scores.length));
    if(stdScore < 4 || bestScore < 10){
      const mid = duration/2;
      let newTrim = startOffset + mid - 1.5;
      newTrim = Math.max(0, Math.min(newTrim, Math.max(0, realDur-3)));
      return {trimStart:newTrim, reason:'uniform-center', score:bestScore, avg:bestAvg, contrast:bestContrast};
    }
    const bestTime = samples[bestIdx].t;
    let newTrim = startOffset + bestTime;
    newTrim = Math.max(0, Math.min(newTrim, Math.max(0, realDur-3)));
    // 理由を判定
    let reason='bright';
    if(bestContrast > 35 && bestAvg > 60) reason='contrast-lantern';
    else if(bestAvg > 150) reason='bright-sunny';
    else if(bestContrast > 30) reason='contrast';
    return {trimStart:newTrim, reason, score:bestScore, avg:bestAvg, contrast:bestContrast, bestTime};
  },[seekVideo]);

  // 案1: スマート切り出し5ショット - 明るさ+コントラストの高い瞬間を5つ重ならないように抽出
  const analyzeClipForFiveSmart = useCallback(async (video, clip)=>{
    const realDur = (video && isFinite(video.duration) && video.duration>0) ? video.duration : (clip.duration + (clip.trimStart||0));
    const startOffset = clip.trimStart||0;
    const duration = Math.min(clip.duration, realDur - startOffset);
    if(duration<1) return [];
    const sampleStep = 0.2;
    const canvas = document.createElement('canvas');
    canvas.width=32; canvas.height=32;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const samples=[];
    const totalSteps = Math.ceil(duration / sampleStep);
    for(let i=0;i<totalSteps;i++){
      const t = i*sampleStep;
      if(t>=duration) break;
      await seekVideo(video, startOffset+t);
      try{
        ctx.drawImage(video, 0,0,32,32);
        const data = ctx.getImageData(0,0,32,32).data;
        let sum=0,sumSq=0,count=0;
        for(let p=0;p<data.length;p+=4){
          const r=data[p], g=data[p+1], b=data[p+2];
          const y=0.299*r+0.587*g+0.114*b;
          sum+=y; sumSq+=y*y; count++;
        }
        const avg=sum/count;
        const contrast=Math.sqrt(Math.max(0,sumSq/count-avg*avg));
        const score=avg*0.6+contrast*1.2+(avg*contrast/100)*0.5;
        samples.push({t, avg, contrast, score});
      }catch(e){
        samples.push({t, avg:0, contrast:0, score:0});
      }
    }
    // 5つの非重複窓を探す
    const windowSec = 2; // 各ショット2秒
    const windowSize = Math.ceil(windowSec / sampleStep);
    const margin = Math.ceil(1 / sampleStep); // 1秒のマージン
    const used = new Array(samples.length).fill(false);
    const bestWindows=[];
    for(let k=0;k<5;k++){
      let bestIdx=-1, bestScore=-1;
      for(let i=0;i<=samples.length-windowSize;i++){
        let overlap=false;
        for(let j=i;j<i+windowSize;j++){ if(used[j]){ overlap=true; break; } }
        if(overlap) continue;
        let winScore=0;
        for(let j=0;j<windowSize;j++) winScore+=samples[i+j].score;
        winScore/=windowSize;
        if(winScore>bestScore){ bestScore=winScore; bestIdx=i; }
      }
      if(bestIdx===-1) break;
      bestWindows.push({idx:bestIdx, score:bestScore, sample:samples[bestIdx]});
      for(let j=Math.max(0,bestIdx-margin); j<Math.min(samples.length, bestIdx+windowSize+margin); j++) used[j]=true;
    }
    // 時間順にソート
    bestWindows.sort((a,b)=> a.idx - b.idx);
    return bestWindows.map(w=> ({
      time: samples[w.idx].t,
      score: w.score,
      avg: samples[w.idx].avg,
      contrast: samples[w.idx].contrast
    }));
  },[seekVideo]);

  // Web Audio APIで生成する簡易BGM（外部URLが全部失敗した時の最終手段 - 必ず鳴る）
  const stopWebAudioBgm = useCallback(()=>{
    if(bgmTimeoutRef.current){ try{ clearTimeout(bgmTimeoutRef.current); }catch{} bgmTimeoutRef.current=null; }
    bgmOscillatorsRef.current.forEach(o=>{ try{ o.stop(); o.disconnect && o.disconnect(); }catch{} });
    bgmOscillatorsRef.current=[];
    if(bgmAudioContextRef.current){
      try{ bgmAudioContextRef.current.close(); }catch{}
      bgmAudioContextRef.current=null;
    }
  },[]);
  const playWebAudioBgm = useCallback((type)=>{
    stopWebAudioBgm();
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      bgmAudioContextRef.current=ctx;
      const masterGain = ctx.createGain();
      masterGain.gain.value = bgmVolume*0.35;
      masterGain.connect(ctx.destination);
      if(type==='chill'){
        // Lofi風: 低いサイン波+少しの揺らぎ - ずっと鳴る
        const osc = ctx.createOscillator();
        osc.type='sine';
        osc.frequency.value=110;
        const gain = ctx.createGain();
        gain.gain.value=0.15;
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        bgmOscillatorsRef.current.push(osc);
        const osc2 = ctx.createOscillator();
        osc2.type='triangle';
        osc2.frequency.value=220;
        const gain2 = ctx.createGain();
        gain2.gain.value=0.08;
        osc2.connect(gain2);
        gain2.connect(masterGain);
        osc2.start();
        bgmOscillatorsRef.current.push(osc2);
        // LFOで少し揺らす
        const lfo = ctx.createOscillator();
        lfo.frequency.value=0.3;
        const lfoGain = ctx.createGain();
        lfoGain.gain.value=5;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start();
        bgmOscillatorsRef.current.push(lfo);
      } else if(type==='happy'){
        // Happy: 明るいメジャーコードのアルペジオ - ずっとループ
        let nextNoteTime = ctx.currentTime;
        const scheduleHappyLoop = ()=>{
          if(bgmTrackRef.current!==type) return;
          const now = ctx.currentTime;
          if(now>=nextNoteTime-0.1){
            const freqs=[261.63,329.63,392,523.25,392,329.63];
            const f = freqs[Math.floor(Math.random()*freqs.length)];
            const osc = ctx.createOscillator();
            osc.type='sine';
            osc.frequency.value=f;
            const gain = ctx.createGain();
            gain.gain.value=0;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.18, now+0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now+0.6);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now+0.7);
            nextNoteTime = now + 0.35 + Math.random()*0.2;
          }
          if(bgmTrackRef.current===type){
            bgmTimeoutRef.current = setTimeout(scheduleHappyLoop, 100);
          }
        };
        scheduleHappyLoop();
        // ベース音はずっと鳴る
        const bass = ctx.createOscillator();
        bass.type='sine';
        bass.frequency.value=130.81;
        const bassGain = ctx.createGain();
        bassGain.gain.value=0.06;
        bass.connect(bassGain);
        bassGain.connect(masterGain);
        bass.start();
        bgmOscillatorsRef.current.push(bass);
      } else if(type==='cinematic'){
        // Cinematic: 低いドローン+高いパッド - ずっと鳴る
        const osc = ctx.createOscillator();
        osc.type='sawtooth';
        osc.frequency.value=55;
        const filter = ctx.createBiquadFilter();
        filter.type='lowpass';
        filter.frequency.value=400;
        filter.Q.value=5;
        const gain = ctx.createGain();
        gain.gain.value=0.12;
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        osc.start();
        bgmOscillatorsRef.current.push(osc);
        const osc2 = ctx.createOscillator();
        osc2.type='sine';
        osc2.frequency.value=220;
        const gain2 = ctx.createGain();
        gain2.gain.value=0.08;
        osc2.connect(gain2);
        gain2.connect(masterGain);
        osc2.start();
        bgmOscillatorsRef.current.push(osc2);
        // ゆっくりフィルタを動かす
        const lfo = ctx.createOscillator();
        lfo.frequency.value=0.05;
        const lfoGain = ctx.createGain();
        lfoGain.gain.value=200;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();
        bgmOscillatorsRef.current.push(lfo);
      }
    }catch(e){ console.warn('WebAudio BGM failed', e); }
  },[bgmVolume, stopWebAudioBgm]);

      bgmAudioRef.current.loop=true; // ループを確実に

              const p = bgmAudioRef.current.play();

            }catch{ playWebAudioBgm(bgmTrack); }

            });
          }
        }catch{}
      };
    }
    bgmAudioRef.current.loop=true;
    bgmAudioRef.current.volume=bgmVolume;
    // playing中またはBGMタブで選択直後でも再生

            });
          }
        }
      }catch{
        if(bgmTrackRef.current===bgmTrack){

        }

    },150);
  },[bgmTrack, bgmVolume, playWebAudioBgm, stopWebAudioBgm]);

        clearTimeout(pending.timer);
        materialDragRef.current=null;
      }
      return;
    }
    const container = materialListRef.current;
    if(!container) return;
    const filtered=Array.from(container.querySelectorAll('.material-order-row'))
      .filter(el=>el.getAttribute('data-clip-id')!==pending.id);
    let overIndex=filtered.length;
    for(let i=0;i<filtered.length;i++){
      const cr = filtered[i].getBoundingClientRect();
      if(e.clientY < cr.top+cr.height/2){ overIndex=i; break; }
    }
    pending.toIndex=overIndex;
    setDropIndicator(overIndex);
    if(e.clientY>window.innerHeight-72) window.scrollBy(0,20);
    else if(e.clientY<72) window.scrollBy(0,-20);

  const handleTextPointerMove = useCallback((e)=>{
    if(!draggingText) return;
    const deltaX = e.clientX - draggingText.startX;
    const deltaTime = deltaX / timelineZoom;
    let updated;
    if(draggingText.type==='left'){
      const newStart = Math.max(0, Math.min(draggingText.origStart + deltaTime, draggingText.origEnd - 0.2));
      updated=textsRef.current.map(t=> t.id===draggingText.id ? withTextTiming(t,newStart,t.end,draggingText.wasAttached) : t);
    } else if(draggingText.type==='right'){

      updated=textsRef.current.map(t=> t.id===draggingText.id ? withTextTiming(t,t.start,newEnd,draggingText.wasAttached) : t);
    } else if(draggingText.type==='move'){
      const dur = draggingText.origEnd - draggingText.origStart;
      let newStart = draggingText.origStart + deltaTime;
      newStart = Math.max(0, Math.min(newStart, durationRef.current - dur));

      )
    ),
    quickPeekId && (()=>{
      const list=clips;
      const index=list.findIndex(item=>item.id===quickPeekId);
      const clip=index>=0 ? list[index] : null;
      if(!clip) return null;
      const isPhoto=clip.type==='photo';
      const adjusted=(clip.trimStart||0)>0 || (clip._connectionInCut||0)>0 || (clip._connectionOutCut||0)>0;
      const start=Math.max(0,clip.trimStart||0);
      const end=start+Math.max(0.3,clip.duration||0.3);
      const quickPeekFilter=getClipPreviewFilter(clip,activeFilter,filterIntensity);
      return React.createElement('div', {
        className:'fixed inset-0 z-[110] bg-black/50 flex items-center justify-center p-5',
        onClick:e=>{ if(e.target===e.currentTarget) closeQuickPeek(); }
      },
        React.createElement('div', {
          role:'dialog', 'aria-modal':true, 'aria-label':`${clip.name}のクイック確認`,
          className:'material-quick-peek-card relative bg-[#fbf8f2] text-black p-2.5 pb-3 rounded-[4px] shadow-2xl',
          style:{width:'min(74vw,280px)',touchAction:'none'},
          onClick:e=>e.stopPropagation(),
          onPointerDown:beginQuickPeekGesture,
          onPointerUp:finishQuickPeekGesture
        },
          React.createElement('div', {
            className:'relative w-full aspect-[9/16] bg-black overflow-hidden flex items-center justify-center cursor-pointer',
            onClick:()=>{ if(!quickPeekSkipTapRef.current) toggleQuickPeekPlayback(); }
          },
            isPhoto ? React.createElement('img', {
              src:clip.url, alt:clip.name, draggable:false,
              className:'w-full h-full object-contain',
              style:{filter:quickPeekFilter}
            }) : React.createElement('video', {
              key:clip.id, ref:quickPeekVideoRef, src:clip.url, muted:true, playsInline:true, autoPlay:true,
              className:'w-full h-full object-contain',
              style:{filter:quickPeekFilter},
              onLoadedMetadata:e=>beginQuickPeekSample(e.currentTarget,clip),
              onPlay:()=>setQuickPeekPlaying(true),
              onPause:()=>setQuickPeekPlaying(false),
              onEnded:()=>setQuickPeekPlaying(false),
              onTimeUpdate:e=>{
                if(e.currentTarget.currentTime>=end-0.02){
                  e.currentTarget.pause();
                  try{ e.currentTarget.currentTime=start; }catch{}
                  setQuickPeekPlaying(false);
                }
              },
              'aria-label':`${clip.name}の動画`
            }),
            !isPhoto && !quickPeekPlaying && React.createElement('div', {
              className:'absolute inset-0 flex items-center justify-center pointer-events-none'
            }, React.createElement('div', {className:'w-11 h-11 rounded-full bg-white/90 text-black flex items-center justify-center text-[17px] pl-0.5 shadow-lg'}, '▶')),
            React.createElement('div', {className:'absolute top-2 left-2 rounded-full bg-black/65 text-white text-[9px] font-mono px-2 py-1'}, `${index+1} / ${list.length}`)
          ),
          React.createElement('div', {className:'flex items-start gap-2 mt-2 px-0.5'},
            React.createElement('div', {className:'flex-1 min-w-0'},
              React.createElement('div', {className:'text-[12px] font-bold truncate'}, clip.name),
              React.createElement('div', {className:'text-[10px] text-black/55 mt-0.5 flex items-center gap-1.5'},
                React.createElement('span', null, isPhoto?'写真':`${clip.duration.toFixed(1)}秒`),
                adjusted && React.createElement('span', {className:'rounded-full border border-black/15 px-1.5 py-0.5'}, 'カット調整済み')
              )
            ),
            React.createElement('button', {
              onClick:closeQuickPeek,
              className:'w-7 h-7 rounded-full bg-black/5 text-[14px] text-black/55 flex items-center justify-center shrink-0',
              'aria-label':'クイック確認を閉じる'
            }, '×')
          ),
          React.createElement('div', {className:'text-[9px] text-black/40 text-center mt-2'}, isPhoto?'左右スワイプで前後・下へスワイプで閉じる':'タップで再生／停止・左右スワイプで前後')
        )
      );
    })(),
    connectionEditor && (()=>{
      const list=clipsRef.current;
      const left=list.find(c=>c.id===connectionEditor.leftId);
      const right=list.find(c=>c.id===connectionEditor.rightId);
      if(!left || (connectionEditor.rightId && !right)) return null;
      const overlap=left._transitionToNext?.type && left._transitionToNext.type!=='none' ? (left._transitionToNext.duration||0.5) : 0;
      const leftBase=left._connectionBase || {duration:left.duration};
      const rightBase=right?._connectionBase || (right ? {duration:right.duration} : null);
      const leftMax=left.type==='photo' ? 0 : Math.max(0,Math.floor(Math.min(2,leftBase.duration-(left._connectionInCut||0)-Math.max(0.3,overlap+0.1))*10)/10);
      const rightMax=!right || right.type==='photo' ? 0 : Math.max(0,Math.floor(Math.min(2,rightBase.duration-(right._connectionOutCut||0)-0.3)*10)/10);
      return React.createElement('div', {
        className:'fixed inset-0 z-[120] bg-black/80 flex items-center justify-center p-4',
        onClick:()=>setConnectionEditor(null)
      }, React.createElement('div', {
        role:'dialog', 'aria-modal':true, 'aria-label':'カットのつながりを確認',
        className:'w-full max-w-md rounded-2xl border border-white/15 bg-[#111113] p-4 shadow-2xl',
        onClick:e=>e.stopPropagation()
      },
        React.createElement('div', {className:'flex items-center justify-between gap-2'},
          React.createElement('div', {className:'text-[14px] font-bold'}, '次につながるカットを探す'),
          right && React.createElement('button', {onClick:resetConnection, className:'shrink-0 text-[10px] text-white/60 underline'}, '調整をリセット')
        ),
        React.createElement('div', {className:'text-[11px] text-white/50 mt-1 mb-3'}, right ? '前のラストと次の冒頭を見比べて、境目を決める。' : 'このラストにつながる、次の一枚を撮ってみる。'),
        React.createElement('div', {className:right ? 'grid grid-cols-2 gap-2' : 'grid grid-cols-1 gap-2'},
          (right ? [[left,'left','前のラスト'],[right,'right','次の冒頭']] : [[left,'left','このカットのラスト']]).map(([clip,side,label])=>
            React.createElement('div', {key:clip.id, className:'min-w-0'},
              React.createElement('div', {className:'aspect-square bg-black rounded-lg overflow-hidden flex items-center justify-center text-[10px] text-white/40'},
                clip.type==='photo' ? React.createElement('img', {src:clip.url, alt:label, className:'w-full h-full object-contain'}) : React.createElement('div', {
                  ref:side==='left' ? connectionLeftSlotRef : connectionRightSlotRef,
                  className:'w-full h-full'
                })
              ),
              React.createElement('div', {className:'text-[11px] text-white/75 mt-1'}, label),
              React.createElement('div', {className:'text-[10px] text-white/40 truncate'}, clip.name)
            )
          )
        ),
        right && leftMax>0 && React.createElement('label', {className:'block text-[11px] text-white/70 mt-4'},
          `前の終わりを ${connectionEditor.outCut.toFixed(1)} 秒早める`,
          React.createElement('input', {
            type:'range', min:0, max:leftMax, step:0.1, value:connectionEditor.outCut,
            onChange:e=>{
              const cut=Number(e.target.value);
              seekConnectionVideo(left,'left',cut);
              setConnectionEditor(prev=>({...prev,outCut:cut}));
            },
            className:'w-full accent-violet-500', 'aria-label':'前の終わりを早める'
          })
        ),
        right && rightMax>0 && React.createElement('label', {className:'block text-[11px] text-white/70 mt-2'},
          `次の始まりを ${connectionEditor.inCut.toFixed(1)} 秒遅らせる`,
          React.createElement('input', {
            type:'range', min:0, max:rightMax, step:0.1, value:connectionEditor.inCut,
            onChange:e=>{
              const cut=Number(e.target.value);
              seekConnectionVideo(right,'right',cut);
              setConnectionEditor(prev=>({...prev,inCut:cut}));
            },
            className:'w-full accent-violet-500', 'aria-label':'次の始まりを遅らせる'
          })
        ),
        React.createElement('div', {className:'flex gap-2 mt-4'},
          React.createElement('button', {onClick:()=>setConnectionEditor(null), className:'flex-1 h-10 rounded-full bg-white/10 text-[12px]'}, '戻る'),
          right ? React.createElement('button', {onClick:applyConnection, className:'flex-1 h-10 rounded-full bg-white text-black text-[12px] font-bold'}, 'この境目から試写') : React.createElement('label', {className:'flex-1 h-10 rounded-full bg-white text-black text-[12px] font-bold flex items-center justify-center cursor-pointer'},
            '次の動画を追加',
            React.createElement('input', {type:'file', accept:'video/*', className:'hidden', onChange:e=>{ if(e.target.files?.length){ setConnectionEditor(null); handleVideoUpload(e.target.files); e.target.value=''; } }})
          )
        ),
        !right && React.createElement('label', {className:'mt-2 w-full h-9 rounded-full border border-white/20 text-white/75 text-[11px] flex items-center justify-center cursor-pointer'},
          '次の写真を追加',
          React.createElement('input', {type:'file', accept:'image/*', className:'hidden', onChange:e=>{ if(e.target.files?.length){ setConnectionEditor(null); handleVideoUpload(e.target.files); e.target.value=''; } }})
        )
      ));
    })(),
    // きら - 保存成功時のミント粒子
    ...kiraParticles.map(p=> [React.createElement('div', {
      key:p.id,
      className:'kira-particle',
      style:{left:`${p.x}px`, top:`${p.y}px`, animationDelay:`${p.delay}ms`, position:'fixed'}
    })]),
    // ポラロイド排出演出
    isPolaroidEject && React.createElement('div', {className:'polaroid-eject'},
      React.createElement('div', {className:'w-full h-16 bg-black/10 rounded mb-2 flex items-center justify-center text-[10px] text-black/30'}, 'Haneiro'),
      React.createElement('div', {className:'text-[8px] text-black/40 text-center', style:{fontFamily:'Zen Maru Gothic, sans-serif'}}, 'Viewfinder')
    )
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>

<div class="mood-selector" id="moodSelector" aria-label="気分を切り替える">
  <button class="mood-step-button mood-step-prev" type="button" data-direction="-1" aria-label="前の気分へ"><span aria-hidden="true">‹</span></button>
  <div class="mood-dial-core">
    <span class="mood-brand" aria-hidden="true">VLOG STUDIO</span>
    <div class="mood-dial-window">
      <button class="mood-btn active" type="button" data-mood="quiet">静か</button>
      <button class="mood-btn" type="button" data-mood="bouncy">弾む</button>
      <button class="mood-btn" type="button" data-mood="emo">エモい</button>
    </div>
  </div>
  <button class="mood-step-button mood-step-next" type="button" data-direction="1" aria-label="次の気分へ"><span aria-hidden="true">›</span></button>
</div>

<div class="desk-stack" id="deskStack">
  <div class="desk-polaroid" style="--r:-2deg"><div class="mini" style="background:linear-gradient(180deg,#FFFEFB,#FFFBF5)"></div><div class="mini-label">NO FILM</div></div>
</div>

<div class="developing-overlay" id="developingOverlay">
  <div class="developing-paper"><div style="width:100%;height:78%;background:#0a0a0b"></div><div style="padding:6px;font-family:'JetBrains Mono';font-size:8px">HANEIRO — <span id="devDate"></span></div></div>
  <div class="developing-text">DEVELOPING... 現像中</div>
  <div style="font-family:'JetBrains Mono';font-size:10px;color:rgba(255,251,245,0.6);margin-top:8px">Tap to close</div>
</div>

<script>
// Feature 1 & 2 vanilla JS
(function(){
  document.getElementById('devDate').textContent=new Date().toLocaleDateString();
  

  // Audio
  let audioCtx=null;
  function getCtx(){
    if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch{} }
    return audioCtx;
  }
  function shutter(){
    const ctx=getCtx(); if(!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='square'; o.frequency.setValueAtTime(800,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200,ctx.currentTime+0.08);
    g.gain.setValueAtTime(0.4,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.12);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.13);
    setTimeout(()=>{
      const o2=ctx.createOscillator(), g2=ctx.createGain();
      o2.type='square'; o2.frequency.setValueAtTime(1200,ctx.currentTime);
      o2.frequency.exponentialRampToValueAtTime(400,ctx.currentTime+0.05);
      g2.gain.setValueAtTime(0.25,ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);
      o2.connect(g2); g2.connect(ctx.destination); o2.start(); o2.stop(ctx.currentTime+0.09);
    },60);
  }
  function focusBeep(){
    const ctx=getCtx(); if(!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(1800,ctx.currentTime);
    g.gain.setValueAtTime(0.14,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.18);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.2);
  }
  function plop(){
    const ctx=getCtx(); if(!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(220,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80,ctx.currentTime+0.25);
    g.gain.setValueAtTime(0.28,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.32);
  }
  function mechanicalCardClick(){
    const ctx=getCtx(); if(!ctx) return;
    try{ if(ctx.state==='suspended') ctx.resume(); }catch{}
    const now=ctx.currentTime;

    // 金属スイッチが落ちる短い「カチ」
    const tick=ctx.createOscillator(), tickGain=ctx.createGain();
    tick.type='square';
    tick.frequency.setValueAtTime(1350,now);
    tick.frequency.exponentialRampToValueAtTime(380,now+0.024);
    tickGain.gain.setValueAtTime(0.095,now);
    tickGain.gain.exponentialRampToValueAtTime(0.0001,now+0.032);
    tick.connect(tickGain); tickGain.connect(ctx.destination);
    tick.start(now); tick.stop(now+0.036);

    // 接点の小さな摩擦音
    const noiseLength=Math.max(1,Math.floor(ctx.sampleRate*0.014));
    const noiseBuffer=ctx.createBuffer(1,noiseLength,ctx.sampleRate);
    const noiseData=noiseBuffer.getChannelData(0);
    for(let i=0;i<noiseLength;i++) noiseData[i]=(Math.random()*2-1)*(1-i/noiseLength);
    const noise=ctx.createBufferSource(), noiseFilter=ctx.createBiquadFilter(), noiseGain=ctx.createGain();
    noise.buffer=noiseBuffer;
    noiseFilter.type='highpass';
    noiseFilter.frequency.setValueAtTime(1700,now);
    noiseGain.gain.setValueAtTime(0.045,now);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001,now+0.018);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
    noise.start(now); noise.stop(now+0.02);

    // スイッチが戻る低い「コト」
    const latch=ctx.createOscillator(), latchGain=ctx.createGain();
    latch.type='triangle';
    latch.frequency.setValueAtTime(190,now+0.032);
    latch.frequency.exponentialRampToValueAtTime(105,now+0.073);
    latchGain.gain.setValueAtTime(0.05,now+0.032);
    latchGain.gain.exponentialRampToValueAtTime(0.0001,now+0.078);
    latch.connect(latchGain); latchGain.connect(ctx.destination);
    latch.start(now+0.032); latch.stop(now+0.082);
  }

  // Mood - with direct visual feedback
  const saved=localStorage.getItem('haneiro_mood')||'quiet';
  function applyMood(m){
    document.documentElement.setAttribute('data-mood', m);
    document.body.setAttribute('data-mood', m);
    const canvas=document.getElementById('main-canvas')||document.querySelector('canvas');
    const previewWrap=document.querySelector('.polaroid-wrapper .preview-wrap')||document.querySelector('.preview-wrap');
    const polaroid=document.querySelector('.polaroid-wrapper');
    if(canvas){
      // ムードフィルターは画像描画時だけ適用し、紙色の余白は変色させない。
      canvas.style.filter='none';
    }
    if(polaroid){
      if(m==='quiet'){ polaroid.style.background='#F5F3EF'; polaroid.style.backgroundImage='radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.9) 0%, transparent 50%), linear-gradient(180deg, #FFFEFB 0%, #F5F3EF 18%, #F0EDE8 100%)'; }
      else if(m==='bouncy'){ polaroid.style.background='#FFF6EB'; polaroid.style.backgroundImage='radial-gradient(ellipse at 20% 10%, rgba(255,214,168,0.3) 0%, transparent 50%), linear-gradient(180deg, #FFFBF5 0%, #FFF6EB 18%, #FFE8CC 100%)'; }
      else if(m==='emo'){ polaroid.style.background='#EEF1FF'; polaroid.style.backgroundImage='radial-gradient(ellipse at 20% 10%, rgba(155,181,255,0.25) 0%, transparent 50%), linear-gradient(180deg, #F5F7FF 0%, #EEF1FF 18%, #DDE3FF 100%)'; }
    }
    if(previewWrap){
      if(m==='quiet'){ previewWrap.style.background='#F5F3EF'; }
      else if(m==='bouncy'){ previewWrap.style.background='#FFF6EB'; }
      else if(m==='emo'){ previewWrap.style.background='#EEF1FF'; }
    }
    window.dispatchEvent(new CustomEvent('haneiro:moodchange',{detail:{mood:m}}));
  }
  const moodOrder=['quiet','bouncy','emo'];
  const moodNames={quiet:'静か',bouncy:'弾む',emo:'エモい'};
  const moodSelector=document.getElementById('moodSelector');
  const moodPrevButton=moodSelector.querySelector('.mood-step-prev');
  const moodNextButton=moodSelector.querySelector('.mood-step-next');
  let currentMood=moodOrder.includes(saved)?saved:'quiet';
  let moodPointer=null;
  let suppressMoodClick=false;
  function paintMoodDial(m){
    currentMood=m;
    const index=moodOrder.indexOf(m);
    const previousMood=moodOrder[(index-1+moodOrder.length)%moodOrder.length];
    const nextMood=moodOrder[(index+1)%moodOrder.length];
    moodSelector.dataset.currentMood=m;
    [[moodPrevButton,previousMood],[moodNextButton,nextMood]].forEach(([button,targetMood])=>{
      button.disabled=!targetMood;
      if(targetMood){
        button.dataset.targetMood=targetMood;
        button.setAttribute('aria-label',`${moodNames[targetMood]}へ切り替え`);
      }else{
        button.removeAttribute('data-target-mood');
        button.setAttribute('aria-label','これ以上の気分はありません');
      }
    });
    document.querySelectorAll('.mood-btn').forEach(b=>{
      const active=b.dataset.mood===m;
      b.classList.toggle('active',active);
      b.setAttribute('aria-pressed',active?'true':'false');
      b.setAttribute('aria-hidden',active?'false':'true');
      b.tabIndex=active?0:-1;
      if(active) b.setAttribute('aria-label',`現在の気分は${moodNames[m]}。タップまたは左右スワイプで切り替え`);
    });
  }
  function nudgeMoodEdge(direction){
    const cls=direction>0?'dial-edge-next':'dial-edge-prev';
    moodSelector.classList.remove('dial-edge-next','dial-edge-prev');
    void moodSelector.offsetWidth;
    moodSelector.classList.add(cls);
    setTimeout(()=>moodSelector.classList.remove(cls),210);
  }
  function switchMood(direction){
    const from=moodOrder.indexOf(currentMood);
    const to=(from+direction+moodOrder.length)%moodOrder.length;
    const m=moodOrder[to];
    moodSelector.classList.remove('dial-next','dial-prev');
    void moodSelector.offsetWidth;
    moodSelector.classList.add(direction>0?'dial-next':'dial-prev');
    localStorage.setItem('haneiro_mood',m);
    paintMoodDial(m);
    applyMood(m);
    focusBeep();
    setTimeout(()=>moodSelector.classList.remove('dial-next','dial-prev'),230);
  }
  applyMood(currentMood);
  paintMoodDial(currentMood);
  moodSelector.addEventListener('click',e=>{
    if(suppressMoodClick){ suppressMoodClick=false; return; }
    const stepButton=e.target.closest('.mood-step-button');
    if(stepButton){
      switchMood(Number(stepButton.dataset.direction));
      return;
    }
    if(e.target.closest('.mood-btn')||e.target.closest('.mood-dial-core')) switchMood(1);
  });
  moodSelector.addEventListener('pointerdown',e=>{
    moodPointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};
  });
  moodSelector.addEventListener('pointermove',e=>{
    if(!moodPointer||moodPointer.id!==e.pointerId) return;
    const dx=e.clientX-moodPointer.x,dy=e.clientY-moodPointer.y;
    if(Math.abs(dx)>8||Math.abs(dy)>8) moodPointer.moved=true;
  });
  moodSelector.addEventListener('pointerup',e=>{
    if(!moodPointer||moodPointer.id!==e.pointerId) return;
    const dx=e.clientX-moodPointer.x,dy=e.clientY-moodPointer.y;
    const moved=moodPointer.moved;
    moodPointer=null;
    if(Math.abs(dx)>=26&&Math.abs(dx)>Math.abs(dy)*1.25){
      suppressMoodClick=true;
      switchMood(dx<0?1:-1);
      setTimeout(()=>{ suppressMoodClick=false; },320);
    }else if(moved){
      suppressMoodClick=true;
      setTimeout(()=>{ suppressMoodClick=false; },320);
    }
  });
  moodSelector.addEventListener('pointercancel',()=>{ moodPointer=null; });
  moodSelector.addEventListener('keydown',e=>{
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
    e.preventDefault();
    switchMood(e.key==='ArrowLeft'?-1:1);
  });
  let moodWheelAt=0;
  moodSelector.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)||Math.abs(e.deltaX)<8) return;
    e.preventDefault();
    const now=performance.now();
    if(now-moodWheelAt<280) return;
    moodWheelAt=now;
    switchMood(e.deltaX>0?1:-1);
  },{passive:false});

  // Developing overlay
  const devOverlay=document.getElementById('developingOverlay');
  function showDeveloping(){
    devOverlay.classList.add('active');
    shutter();
    setTimeout(()=>devOverlay.classList.remove('active'), 2200);
  }
  devOverlay.addEventListener('click', ()=>devOverlay.classList.remove('active'));

  // 最近確認した素材トレイ
  const desk=document.getElementById('deskStack');
  let deskItems=[];
  let activeDeskClipId=null;
  try{
    const s=localStorage.getItem('haneiro_desk');
    if(s){
      const parsed=JSON.parse(s);
      // 旧版の画像だけの装飾カードは、素材へ戻れないため引き継がない。
      if(Array.isArray(parsed)) deskItems=parsed.filter(item=>item&&item.clipId&&item.thumb).slice(-6);
    }
  }catch{}
  activeDeskClipId=deskItems.length ? deskItems[deskItems.length-1].clipId : null;
  function saveDesk(){
    try{ localStorage.setItem('haneiro_desk',JSON.stringify(deskItems.slice(-6))); }catch{}
  }
  function renderDesk(){
    desk.replaceChildren();
    if(deskItems.length===0){
      desk.innerHTML='<div class="desk-polaroid" style="--r:-2deg"><div class="mini" style="background:linear-gradient(180deg,#FFFEFB,#FFFBF5)"></div><div class="mini-label">NO FILM</div></div>';
      return;
    }
    deskItems.slice(-6).forEach((item,index)=>{
      const card=document.createElement('div');
      card.className=`desk-polaroid${item.clipId===activeDeskClipId?' current':''}`;
      card.style.setProperty('--r',`${(index-2)*3}deg`);
      card.dataset.clipId=String(item.clipId);
      card.setAttribute('role','button');
      card.setAttribute('tabindex','0');
      card.setAttribute('aria-label',`${item.name||'素材'}を確認`);
      const mini=document.createElement('div');
      mini.className='mini';
      mini.style.backgroundImage=`url(${item.thumb})`;
      mini.style.backgroundSize='cover';
      mini.style.backgroundPosition='center';
      const label=document.createElement('div');
      label.className='mini-label';
      label.textContent=item.label||(item.type==='photo'?'PHOTO':'VIDEO');
      card.append(mini,label);
      const open=()=>{
        const current=deskItems.find(entry=>String(entry.clipId)===String(item.clipId));
        if(!current) return;
        deskItems=[...deskItems.filter(entry=>String(entry.clipId)!==String(item.clipId)),current].slice(-6);
        activeDeskClipId=current.clipId;
        saveDesk();
        renderDesk();
        mechanicalCardClick();
        window.dispatchEvent(new CustomEvent('haneiro:openrecentmaterial',{detail:{clipId:current.clipId}}));
      };
      card.addEventListener('click',open);
      card.addEventListener('keydown',event=>{
        if(event.key==='Enter'||event.key===' '){ event.preventDefault(); open(); }
      });
      desk.appendChild(card);
    });
  }
  window.addEventListener('haneiro:recentmaterial',event=>{
    const item=event.detail;
    if(!item?.clipId||!item.thumb) return;
    deskItems=[...deskItems.filter(entry=>String(entry.clipId)!==String(item.clipId)),item].slice(-6);
    activeDeskClipId=item.clipId;
    saveDesk();
    renderDesk();
  });
  window.addEventListener('haneiro:removerecentmaterial',event=>{
    const clipId=event.detail?.clipId;
    if(!clipId) return;
    deskItems=deskItems.filter(item=>String(item.clipId)!==String(clipId));
    if(String(activeDeskClipId)===String(clipId)) activeDeskClipId=deskItems.length ? deskItems[deskItems.length-1].clipId : null;
    saveDesk();
    renderDesk();
  });
  window.addEventListener('haneiro:clearrecentmaterials',()=>{
    deskItems=[];
    activeDeskClipId=null;
    saveDesk();
    renderDesk();
  });
  saveDesk();
  renderDesk();

  // Polaroid physics - wait for polaroid wrapper
  function attachPhysics(){
    const wrap=document.querySelector('.polaroid-wrapper');
    if(!wrap) { setTimeout(attachPhysics, 500); return; }
    wrap.classList.add('physics');
    // add fiber light
    if(!wrap.querySelector('.fiber-light')){
      const fl=document.createElement('div'); fl.className='fiber-light'; wrap.appendChild(fl);
    }
    let dragging=false, startX=0, startY=0;
    wrap.addEventListener('pointerdown', e=>{
      // シアター/ファインダー中は物理ドラッグ無効
      const isFullscreen = document.body.style.overflow==='hidden' || document.querySelector('.theater-mode') || document.querySelector('.finder-mode') || document.querySelector('.hikariyomi-mode');
      if(isFullscreen) return;
      if(e.target.closest('button')) return;
      dragging=true;
      startX=e.clientX; startY=e.clientY;
      wrap.classList.add('dragging','touching');
      try{ wrap.setPointerCapture(e.pointerId); }catch{}
    });
    wrap.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dx=e.clientX-startX, dy=e.clientY-startY;
      const r=dx*0.03;
      wrap.style.transform=`translate(${dx*0.15}px, ${dy*0.15}px) rotate(${r}deg)`;
      const rect=wrap.getBoundingClientRect();
      const fx=((e.clientX-rect.left)/rect.width)*100;
      const fy=((e.clientY-rect.top)/rect.height)*100;
      wrap.style.setProperty('--fx', fx+'%');
      wrap.style.setProperty('--fy', fy+'%');
    });
    const endDrag=(e)=>{
      if(!dragging) return;
      dragging=false;
      wrap.classList.remove('dragging','touching');
      wrap.style.transform='';
      plop();
    };
    wrap.addEventListener('pointerup', endDrag);
    wrap.addEventListener('pointercancel', endDrag);
    wrap.addEventListener('click', ()=>{ if(!dragging) focusBeep(); });
  }
  attachPhysics();
})();
</script>
</body>
</html>
