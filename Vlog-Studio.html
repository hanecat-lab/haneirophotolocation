/* Haneiro Viewfinder - ポラロイドファインダー */
:root{
  --haneiro-mint: #A7F3D0;
  --haneiro-peach: #FFD6C0;
  --haneiro-blue: #BAE6FD;
  --haneiro-base: #0e0e10;
  --haneiro-base-2: #111113;
  --haneiro-polaroid: #FFFBF5;
}

html,body,#root{ background:#0a0a0b !important; margin:0; min-height:100%; height:100%; overscroll-behavior:none; }
body::before{ content:''; position:fixed; inset:0; background:#0a0a0b; z-index:-1; pointer-events:none; }
[data-scrollable]{ overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }

/* ポラロイドwrapper */
.polaroid-wrapper{
  background: var(--haneiro-polaroid);
  padding:12px 12px 36px;
  box-shadow:0 12px 40px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
  border-radius:4px;
  position:relative;
  contain: layout paint;
  transform-origin:center center;
  width:min(92vw, calc(78vh * var(--aspect, 1.777) + 24px));
  margin:12px auto;
  min-height:min(58vh, 480px);
  display:flex;
  flex-direction:column;
}
.polaroid-wrapper .preview-wrap{
  flex:1;
  width:100% !important;
  margin:0 !important;
  min-height:0;
}
.polaroid-wrapper.yurayura{
  will-change:transform;
}
.polaroid-wrapper::after{
  content:'';
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  width:40px;
  height:4px;
  background:linear-gradient(90deg, transparent, rgba(0,0,0,0.08), transparent);
  border-radius:2px;
}

/* ゆらゆら - 待機時のみ */
@keyframes yurayura{
  0%,100%{ transform:rotate(-1deg); }
  50%{ transform:rotate(1deg); }
}
.polaroid-wrapper.yurayura{
  animation: yurayura 4s ease-in-out infinite;
}
.polaroid-wrapper.yurayura.paused{
  animation-play-state: paused;
}



/* #3 Polaroid Theater Mode - Mock-03完全再現版 v2 - アニメーション & 白枠修正 */
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Caveat:wght@500;600&display=swap');
.handwritten { font-family: "Caveat", cursive; }
@keyframes polaroidIn{
  0%{ transform: translateY(calc(28px + var(--drag-y, 0px))) scale(0.9) rotate(-1deg); opacity: 0; }
  60%{ transform: translateY(calc(-6px + var(--drag-y, 0px))) scale(1.06) rotate(-1deg); opacity: 1; }
  100%{ transform: translateY(var(--drag-y, 0px)) scale(1.05) rotate(-1deg); opacity: 1; }
}
@keyframes overlayIn{
  0%{ opacity: 0; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); }
  100%{ opacity: 1; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
}
@keyframes hintBounce{
  0%, 100%{ transform: translateY(0); opacity: 0.85; }
  50%{ transform: translateY(4px); opacity: 0.5; }
}
@keyframes grainShift{
  0%{ transform: translate(0,0); }
  100%{ transform: translate(-1%, 1%); }
}

.polaroid-wrapper.theater-mode{
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;
  background: #000 !important;
  z-index: 80 !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 0 !important;
  margin: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  animation: none !important;
  will-change: transform;
  overscroll-behavior: none;
  touch-action: pan-y;
}
.polaroid-wrapper.theater-mode .theater-bg{
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: -1;
  animation: overlayIn 0.6s ease-out forwards;
}
.polaroid-wrapper.theater-mode .theater-bg::after{
  content:'';
  position:absolute;
  inset:0;
  background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.06) 0%, transparent 60%);
  pointer-events:none;
}
.polaroid-wrapper.theater-mode .preview-wrap{
  width: min(92vw, calc(88vh * var(--aspect, 1.777))) !important;
  max-width: 92vw;
  max-height: 72vh;
  aspect-ratio: var(--aspect, 16/9);
  margin: 0 auto !important;
  /* 白枠を厚く: 上22px 左右24px 下88px（画像では白枠が太い） */
  padding: 22px 24px 88px 24px !important;
  background: #FFFBF5 !important;
  background-image: 
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.9) 0%, transparent 60%),
    linear-gradient(180deg, #FFFEFA 0%, #FFFBF5 15%, #FFF8F0 100%) !important;
  border-radius: 3px !important;
  box-shadow: 
    0 1px 1px rgba(0,0,0,0.1),
    0 8px 24px rgba(0,0,0,0.2),
    0 25px 80px rgba(0,0,0,0.6),
    0 12px 40px rgba(0,0,0,.5) !important;
  display: flex !important;
  flex-direction: column !important;
  position: relative !important;
  will-change: transform;
  /* アニメーションを正確に再現 */
  animation: polaroidIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
  transform-origin: center center;
  /* ドラッグ用の変数を維持 */
  --drag-y: 0px;
}
.polaroid-wrapper.theater-mode .preview-wrap{
  /* 最終状態を保持しつつドラッグも効くように */
  transform: scale(1.05) rotate(-1deg) translateY(var(--drag-y, 0px)) !important;
}
.polaroid-wrapper.theater-mode .preview-wrap{
  /* アニメーション終了後はこのtransformを適用 */
  animation: polaroidIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
}
.polaroid-wrapper.theater-mode .preview-wrap #main-canvas{
  flex: 1;
  width: 100% !important;
  height: auto !important;
  aspect-ratio: var(--aspect, 16/9);
  background: #0a0a0b !important;
  border-radius: 1px !important;
  object-fit: contain !important;
  box-shadow: inset 0 0 80px rgba(0,0,0,0.12);
}
.polaroid-wrapper.theater-mode .preview-wrap .viewfinder-overlay{
  top: 22px !important;
  left: 24px !important;
  right: 24px !important;
  bottom: 88px !important;
  border-radius: 1px;
  overflow: hidden;
}
.polaroid-wrapper.theater-mode.dragging .preview-wrap{
  transition: none !important;
  animation: none !important;
  transform: scale(1.05) rotate(-1deg) translateY(var(--drag-y, 0px)) !important;
}
.polaroid-wrapper.theater-mode::after{display:none !important;}

/* Polaroid footer inside preview-wrap - 白枠内の下部 */

/* ポラロイド内部の緑プログレスバー - 画像では白枠の下部に細いミント線 */

  top:12px;
  left:12px;
  display:flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  font-weight:700;
  color:#ff3b30;
  letter-spacing:0.05em;
}
.viewfinder-overlay .rec::before{
  content:'';
  width:8px;
  height:8px;
  background:#ff3b30;
  border-radius:50%;
  animation: recBlink 1.5s ease-in-out infinite;
}
@keyframes recBlink{
  0%,100%{ opacity:1; }
  50%{ opacity:0.2; }
}
.viewfinder-overlay .settings{
  position:absolute;
  top:12px;
  right:12px;
  font-size:10px;
  color:rgba(255,255,255,0.8);
  font-family:monospace;
  letter-spacing:0.02em;
}
.viewfinder-overlay .focus-frame{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:28%;
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,0.6);
  border-radius:2px;
}
.viewfinder-overlay .focus-frame::before,
.viewfinder-overlay .focus-frame::after{
  content:'';
  position:absolute;
  width:14px;
  height:14px;
  border-color:rgba(255,255,255,0.9);
  border-style:solid;
}
.viewfinder-overlay .focus-frame::before{
  top:-2px;
  left:-2px;
  border-width:2px 0 0 2px;
  border-top-left-radius:3px;
}
.viewfinder-overlay .focus-frame::after{
  bottom:-2px;
  right:-2px;
  border-width:0 2px 2px 0;
  border-bottom-right-radius:3px;
}
.viewfinder-overlay .focus-frame .corner-tl,
.viewfinder-overlay .focus-frame .corner-tr,
.viewfinder-overlay .focus-frame .corner-bl,
.viewfinder-overlay .focus-frame .corner-br{
  position:absolute;
  width:14px;
  height:14px;
  border-color:rgba(255,255,255,0.9);
  border-style:solid;
}
.viewfinder-overlay .focus-frame .corner-tl{ top:-2px; left:-2px; border-width:2px 0 0 2px; border-top-left-radius:3px; }
.viewfinder-overlay .focus-frame .corner-tr{ top:-2px; right:-2px; border-width:2px 2px 0 0; border-top-right-radius:3px; }
.viewfinder-overlay .focus-frame .corner-bl{ bottom:-2px; left:-2px; border-width:0 0 2px 2px; border-bottom-left-radius:3px; }
.viewfinder-overlay .focus-frame .corner-br{ bottom:-2px; right:-2px; border-width:0 2px 2px 0; border-bottom-right-radius:3px; }

.viewfinder-overlay .grid{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:1fr 1fr 1fr;
  opacity:0.15;
}
.viewfinder-overlay .grid div{
  border-right:1px solid rgba(255,255,255,0.3);
  border-bottom:1px solid rgba(255,255,255,0.3);
}
.viewfinder-overlay .grid div:nth-child(3n){ border-right:none; }
.viewfinder-overlay .grid div:nth-child(n+7){ border-bottom:none; }

@keyframes piku{

  40%{ transform:translate(-50%,-50%) scale(1.15); }
  100%{ transform:translate(-50%,-50%) scale(1); }
}
.viewfinder-overlay .focus-frame.piku{
  animation: piku 0.4s cubic-bezier(0.34,1.56,0.64,1);
}

/* シャッター - Haneiroスタイル */
.haneiro-shutter{
  width:clamp(60px,18vw,72px);
  height:clamp(60px,18vw,72px);
  border-radius:50%;
  background:#fff;
  border:3px solid transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  position:relative;
  contain: layout paint;
  transition: border-color 0.2s, transform 0.15s;
  box-shadow:0 4px 20px rgba(0,0,0,0.3), 0 0 0 4px rgba(255,255,255,0.1);
}
.haneiro-shutter.idle{
  border-color:rgba(255,255,255,0.9);
}
.haneiro-shutter.playing{
  border-color:#ff3b30;
  background:#fff;
}
.haneiro-shutter:active{
  transform:scale(0.92);
}

/* こきゅう - 呼吸 */
@keyframes kokyu{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.04); }
}
.haneiro-shutter.kokyu{
  animation: kokyu 2.5s ease-in-out infinite;
}
.haneiro-shutter.kokyu.paused{
  animation-play-state: paused;
}

/* ぱく + フラッシュ */
@keyframes paku{
  0%{ transform:scale(1); }
  50%{ transform:scale(0.92); }
  100%{ transform:scale(1); }
}
.haneiro-shutter.paku{
  animation: paku 0.15s ease-out;
}
.flash-overlay{
  position:fixed;
  inset:0;
  background:#fff;
  pointer-events:none;
  z-index:9999;
  opacity:0;
}
@keyframes flash{
  0%{ opacity:0.8; }
  100%{ opacity:0; }
}
.flash-overlay.flash{
  animation: flash 0.2s ease-out;
}

/* ぴこん - ボタンタップ */
@keyframes pikon{
  0%{ transform:scale(0.9); }
  40%{ transform:scale(1.15); }
  60%{ transform:scale(0.95); }
  100%{ transform:scale(1); }
}
.pikon{
  animation: pikon 0.35s cubic-bezier(0.34,1.56,0.64,1);
}

/* ふわっと - タイムラインclip */
.timeline-clip{
  position:relative;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  contain: layout paint;
}
.timeline-clip::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
  opacity:0;
  transition: opacity 0.2s ease;
  pointer-events:none;
  z-index:-1;
}
.timeline-clip:hover:not(.dragging),
.timeline-clip.active:not(.dragging){
  transform:translateY(-3px);
}
.timeline-clip:hover:not(.dragging)::after,
.timeline-clip.active:not(.dragging)::after{
  opacity:1;
}

/* フィルム風タイムライン - パーフォレーション */
.timeline-film{
  position:relative;
  background:#0e0e10;
  border-radius:12px;
  padding:8px 12px;
}
.timeline-film::before,
.timeline-film::after{
  content:'';
  position:absolute;
  top:0;
  bottom:0;
  width:12px;
  background-image: radial-gradient(circle, rgba(255,255,255,0.15) 2px, transparent 2.5px);
  background-size:12px 16px;
  background-repeat:repeat-y;
  background-position:center;
  opacity:0.6;
}
.timeline-film::before{ left:0; }
.timeline-film::after{ right:0; }

/* きら - 保存成功時のミント粒子 */
@keyframes kira{
  0%{ transform:translateY(0) scale(0); opacity:1; }
  20%{ transform:translateY(-8px) scale(1.4); opacity:1; }
  100%{ transform:translateY(-28px) scale(0); opacity:0; }

.kira-particle{
  position:absolute;
  width:8px;
  height:8px;

  border-radius:50%;
  pointer-events:none;
  z-index:100;
  animation: kira 0.6s ease-out forwards;
}

/* なみ - BGM波形 */
@keyframes nami{
  0%,100%{ transform:scaleY(0.6); }
  50%{ transform:scaleY(1.3); }
}
.nami-bar{
  width:3px;
  height:16px;
  background:var(--haneiro-mint);
  border-radius:2px;
  display:inline-block;
  margin:0 2px;
  animation: nami 2s ease-in-out infinite;
  transform-origin:bottom;
}
.nami-bar:nth-child(2){ animation-delay:0.2s; }
.nami-bar:nth-child(3){ animation-delay:0.4s; }

/* ボタン - Haneiroスタイル */
.haneiro-btn{
  min-height:44px;
  border-radius:18px;
  font-family:'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight:600;
  font-size:14px;
  background:var(--haneiro-mint);
  color:#0e0e10;
  border:none;

.haneiro-btn.blue{ background:var(--haneiro-blue); }
.haneiro-btn.white{ background:#fff; color:#0e0e10; }
.haneiro-btn.dark{ background:#111113; color:#fff; border:1px solid rgba(255,255,255,0.15); }
.haneiro-btn:active{
  transform:scale(0.97);

/* ポラロイド排出演出 */
@keyframes polaroidEject{
  0%{ transform:translateY(20px) rotate(0deg) scale(0.8); opacity:0; }
  20%{ transform:translateY(0) rotate(-2deg) scale(1); opacity:1; }
  80%{ transform:translateY(-10px) rotate(1deg) scale(1); opacity:1; }
  100%{ transform:translateY(-40px) rotate(0deg) scale(0.9); opacity:0; }
}
.polaroid-eject{
  position:fixed;

/* タイプライター風 */
@keyframes typewriter{

.typewriter{

  useEffect(()=>{
    document.documentElement.style.background='#0a0a0b';

  const drawFrame = useCallback((t)=>{
    const c = canvasRef.current;
    if(!c) return;
    const ctx = c.getContext('2d', {alpha:false});
    if(!ctx) return;
    let cw=c.width, ch=c.height;
    if(cw<10) { try{ c.width=640; cw=640; }catch{} }
    if(ch<10) { try{ c.height=360; ch=360; }catch{} }
    if(cw<10||ch<10) { cw=640; ch=360; }
    const clipsNow = clipsRef.current;
    const textsNow = textsRef.current;
    
    // 背景を常に描画（黒防止）
    ctx.filter='none';
    ctx.globalAlpha=1;
    if(canvasRef.current) canvasRef.current.style.filter='none';
    ctx.fillStyle='#111113';
    ctx.fillRect(0,0,cw,ch);
    
    if(clipsNow.length===0){
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.font=`bold ${Math.max(16, Math.round(ch*0.05))}px sans-serif`;
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText('📹 動画・写真を追加してください', cw/2, ch/2);
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.font=`${Math.max(12, Math.round(ch*0.035))}px sans-serif`;
      ctx.fillText('下のボタンから追加', cw/2, ch/2 + 24);
      lastFrameHasVideoRef.current=false;
      return;
    }
    
    let activeClip=null;
    let nextClip=null;
    let localTime=0;
    let transitionProgress=0;
    let inTransition=false;
    let transitionType='none';
    let transitionDuration=0;
    
    for(let i=0;i<clipsNow.length;i++){
      const clip = clipsNow[i];
      if(t>=clip.timelineStart && t<clip.timelineStart+clip.duration){
        activeClip=clip;
        localTime=t-clip.timelineStart;
        const trans = clip._transitionToNext;
        if(trans && trans.type!=='none' && i+1<clipsNow.length){
          const transDur = trans.duration||0.5;
          const timeToEnd = (clip.timelineStart+clip.duration) - t;
          if(timeToEnd<=transDur+0.01 && timeToEnd>=-0.01){
            inTransition=true;
            nextClip=clipsNow[i+1];
            transitionType=trans.type;
            transitionDuration=transDur;
            transitionProgress=Math.min(1, Math.max(0, 1 - (timeToEnd/transDur)));
          }
        }
        break;
      }
    }
    
    if(!activeClip){
      if(t>=durationRef.current-0.1 && clipsNow.length>0){
        activeClip=clipsNow[clipsNow.length-1];
        localTime=Math.max(0, activeClip.duration-0.05);
      } else if(clipsNow.length>0){
        activeClip=clipsNow[0];
        localTime=0;
      } else {
        return;
      }
    }
    
    const drawSingleClip = (clip, lTime, alpha=1, offsetX=0, offsetY=0, scale=1)=>{
      if(!clip) return false;
      const isPhoto = clip.type==='photo';
      try{
        ctx.globalAlpha=alpha;
        if(isPhoto){
          const img=photoRefs.current.get(clip.id);
          if(!img || !img.complete || !img.naturalWidth || img.naturalWidth<2){
            return false;
          }
          let zoom = clip._photoZoom||1.0;
          let pan = clip._photoPan||'center';
          const progress = lTime / Math.max(0.1, clip.duration);
          if(pan==='kenburns-in') zoom = 1.0 + progress*0.15;
          else if(pan==='kenburns-out') zoom = 1.15 - progress*0.15;
          zoom *= scale;
          const iw=img.naturalWidth||16;
          const ih=img.naturalHeight||9;
          const ir=iw/ih;
          const cr=cw/ch;
          let dw,dh,dx,dy;
          const verticalMode = clip._verticalMode || 'contain-black';
          const isVerticalFrame = verticalPriority && aspectMode==='9:16';
          const isHorizontalContent = ir >= 1;
          
          if(isVerticalFrame && isHorizontalContent){
            if(verticalMode==='contain-black'){
              dw=cw*zoom; dh=cw/ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY;
              ctx.fillStyle='#000';
              ctx.fillRect(0,0,cw,dy);
              ctx.fillRect(0,dy+dh,cw,ch-(dy+dh));
            } else if(verticalMode==='blur-bg'){
              const bgZoom = Math.max(cw/iw, ch/ih) * 1.2;
              const bgW = iw*bgZoom; const bgH = ih*bgZoom;
              const bgX = (cw-bgW)/2; const bgY = (ch-bgH)/2;
              ctx.save();
              ctx.filter='blur(20px) brightness(0.6)';
              ctx.globalAlpha=0.8;
              try{ ctx.drawImage(img, bgX, bgY, bgW, bgH); }catch{}
              ctx.restore();
              ctx.globalAlpha=alpha;
              dw=cw*zoom*0.92; dh=cw*0.92/ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY;
            } else if(verticalMode==='vertical-crop'){
              const targetAspect = 9/16;
              let sx, sy, sw, sh;
              if(ir > targetAspect){ sh = ih; sw = ih * targetAspect; sx = (iw - sw)/2; sy = 0; }
              else { sw = iw; sh = iw / targetAspect; sx = 0; sy = (ih - sh)/2; }
              dw=cw*zoom; dh=ch*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY;
              ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
              return true;
            } else {
              if(ir>cr){ dh=ch*zoom; dw=ch*ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
              else{ dw=cw*zoom; dh=cw/ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
            }
          } else {
            if(fitMode==='cover'){
              if(ir>cr){ dh=ch*zoom; dw=ch*ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
              else{ dw=cw*zoom; dh=cw/ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
            } else {
              if(ir>cr){ dw=cw*zoom; dh=cw/ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
              else{ dh=ch*zoom; dw=ch*ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
            }
          }
          if(pan==='kenburns-in'){
            dx += (progress-0.5)*cw*0.05;
            dy += (progress-0.5)*ch*0.05;
          }
          ctx.drawImage(img,dx,dy,dw,dh);
          return true;
        } else {
          const v=videoRefs.current.get(clip.id);
          if(!v || v.readyState<1) return false;
          try{
            const trimStart = clip.trimStart || 0;
            const targetTime = trimStart + lTime;
            if(Math.abs(v.currentTime - targetTime) > 0.3){
              v.currentTime = Math.max(0, Math.min(targetTime, (v.duration||999)-0.1));
            }
          }catch{}
          let vr = 16/9;
          try{ vr = (v.videoWidth && v.videoHeight) ? v.videoWidth/v.videoHeight : 16/9; }catch{}
          const cr=cw/ch;
          let dw,dh,dx,dy;
          const verticalMode = clip._verticalMode || 'contain-black';
          const isVerticalFrame = verticalPriority && aspectMode==='9:16';
          const isHorizontalContent = vr >= 1;
          
          if(isVerticalFrame && isHorizontalContent){
            if(verticalMode==='contain-black'){
              dw=cw*scale; dh=cw/vr*scale; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY;
              ctx.fillStyle='#000';
              ctx.fillRect(0,0,cw,dy);
              ctx.fillRect(0,dy+dh,cw,ch-(dy+dh));
            } else if(verticalMode==='blur-bg'){
              const bgZoom = Math.max(cw/(v.videoWidth||16), ch/(v.videoHeight||9)) * 1.2;
              const bgW = (v.videoWidth||16)*bgZoom; const bgH = (v.videoHeight||9)*bgZoom;
              const bgX = (cw-bgW)/2; const bgY = (ch-bgH)/2;
              ctx.save();
              ctx.filter='blur(20px) brightness(0.6)';
              ctx.globalAlpha=0.8;
              try{ ctx.drawImage(v, bgX, bgY, bgW, bgH); }catch{}
              ctx.restore();
              ctx.globalAlpha=alpha;
              dw=cw*scale*0.92; dh=cw*0.92/vr*scale; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY;
            } else if(verticalMode==='vertical-crop'){
              dw=cw*scale; dh=ch*scale; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY;
              const targetAspect = 9/16;
              const vw = v.videoWidth||16; const vh = v.videoHeight||9;
              let sx, sy, sw, sh;
              if(vr > targetAspect){ sh = vh; sw = vh * targetAspect; sx = (vw - sw)/2; sy = 0; }
              else { sw = vw; sh = vw / targetAspect; sx = 0; sy = (vh - sh)/2; }
              ctx.drawImage(v, sx, sy, sw, sh, dx, dy, dw, dh);
              return true;
            } else {
              if(vr>cr){ dh=ch*scale; dw=ch*vr*scale; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
              else{ dw=cw*scale; dh=cw/vr*scale; dx=0 + offsetX; dy=(ch-dh)/2 + offsetY; }
            }
          } else {
            if(fitMode==='cover'){
              if(vr>cr){ dh=ch*scale; dw=ch*vr*scale; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
              else{ dw=cw*scale; dh=cw/vr*scale; dx=0 + offsetX; dy=(ch-dh)/2 + offsetY; }
            } else {
              if(vr>cr){ dw=cw*scale; dh=cw/vr*scale; dx=0 + offsetX; dy=(ch-dh)/2 + offsetY; }
              else{ dh=ch*scale; dw=ch*vr*scale; dx=(cw-dw)/2 + offsetX; dy=0 + offsetY; }
            }
          }
          ctx.drawImage(v,dx,dy,dw,dh);
          return true;
        }
      }catch(e){
        return false;
      }finally{
        ctx.globalAlpha=1;
      }
    };
    
    try{
      ctx.filter='none';
      ctx.globalAlpha=1;
      if(canvasRef.current) canvasRef.current.style.filter='none';
    }catch{}
    
    const clipFilterId = activeClip._filter || activeClip._filterId || activeFilterRef.current;
    const f = FILTERS.find(x=> x.id===clipFilterId);
    let css = 'none';
    const currentIntensity = filterIntensityRef.current;
    if(f && f.id!=='none' && currentIntensity>0){
      if(currentIntensity===100) css = f.css;
      else{
        const factor = currentIntensity/100;
        if(factor>=0.08) css = f.css;
      }
    }
    ctx.filter = css;
    
    if(inTransition && nextClip){
      const prog = transitionProgress;
      const fromClip = activeClip;
      const toClip = nextClip;
      const transStart = fromClip.timelineStart + fromClip.duration - transitionDuration;
      const toLocal = Math.max(0, t - transStart);
      const fromLocal = localTime;
      
      if(transitionType==='fade'){
        // fromを常に描画、toを上からalphaで重ねる
        const fromDrawn = drawSingleClip(fromClip, fromLocal, 1);
        if(!fromDrawn){
          ctx.fillStyle='#111113';
          ctx.fillRect(0,0,cw,ch);
        }
        if(toClip){
          ctx.filter=css;
          drawSingleClip(toClip, toLocal, prog);
        }
      } else if(transitionType==='white'){
        if(prog<0.5){
          drawSingleClip(fromClip, fromLocal, 1-prog*2);
          ctx.filter='none';
          ctx.globalAlpha=1;
          ctx.fillStyle=`rgba(255,255,255,${prog*2})`;
          ctx.fillRect(0,0,cw,ch);
          ctx.filter=css;
        } else {
          ctx.filter='none';
          ctx.fillStyle=`rgba(255,255,255,${2-prog*2})`;
          ctx.fillRect(0,0,cw,ch);
          ctx.filter=css;
          drawSingleClip(toClip, toLocal, (prog-0.5)*2);
        }
      } else if(transitionType==='slide-left'){
        const slideOffset = cw * prog;
        drawSingleClip(fromClip, fromLocal, 1, -slideOffset, 0, 1);
        ctx.filter=css;
        if(toClip){
          drawSingleClip(toClip, toLocal, 1, cw - slideOffset, 0, 1);
        }
      } else if(transitionType==='slide-right'){
        const slideOffset = cw * prog;
        drawSingleClip(fromClip, fromLocal, 1, slideOffset, 0, 1);
        ctx.filter=css;
        if(toClip){
          drawSingleClip(toClip, toLocal, 1, -cw + slideOffset, 0, 1);
        }
      } else if(transitionType==='zoom'){
        const fromScale = 1 + prog*0.5;
        const toScale = 1.5 - prog*0.5;
        drawSingleClip(fromClip, fromLocal, 1, 0, 0, fromScale);
        ctx.filter=css;
        if(toClip){
          drawSingleClip(toClip, toLocal, prog, 0, 0, toScale);
        }
      } else {
        drawSingleClip(fromClip, fromLocal, 1);
      }
    } else {
      drawSingleClip(activeClip, localTime, 1);
    }
    
    ctx.filter='none';
    ctx.globalAlpha=1;
    if(canvasRef.current) canvasRef.current.style.filter='none';
    
    // ぴく - クリップ切替時にピント枠AF
    if(activeClip && activeClip.id !== (window._lastActiveClipId||'')){
      setPikuTrigger(true);
      setTimeout(()=> setPikuTrigger(false), 400);
      window._lastActiveClipId = activeClip.id;
    }

    // テキスト描画
    const activeTexts = textsNow.filter(tx=> t>=tx.start && t<tx.end);
    activeTexts.forEach(txt=>{
      ctx.save();
      const x = (txt.x||50)/100 * cw;
      const y = (txt.y||50)/100 * ch;
      const fontSize = (txt.fontSize||0.06) * ch;
      ctx.font=`${txt.bold?'bold ':''}${fontSize}px ${txt.fontFamily||'sans-serif'}`;
      ctx.fillStyle=txt.color||'#fff';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      if(txt.bgColor && txt.bgColor!=='transparent'){
        const metrics = ctx.measureText(txt.text);
        const pad=8;
        ctx.fillStyle=txt.bgColor;
        ctx.fillRect(x-metrics.width/2-pad, y-fontSize/2-pad, metrics.width+pad*2, fontSize+pad*2);
        ctx.fillStyle=txt.color||'#fff';
      }
      ctx.shadowColor='rgba(0,0,0,0.8)';
      ctx.shadowBlur=4;
      ctx.fillText(txt.text, x, y);
      ctx.restore();
    });
  },[fitMode, filterIntensity]);

  useEffect(()=>{ drawFrameRef.current = drawFrame; },[drawFrame]);

  const syncCanvasSize = useCallback((force=false)=>{
    if(!force && syncScheduledRef.current) return;
    syncScheduledRef.current=true;
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
      syncScheduledRef.current=false;
      const c=canvasRef.current, wrap=previewWrapRef.current;
      if(!c||!wrap) return;
      const isFs = modeRef.current==='fullscreen' || wrap.classList.contains('fullscreen');
      const dpr=window.devicePixelRatio||1;
      let targetW, targetH;
      if(isFs){ 
        // 枠内に収まるように全体が収まるサイズ計算
        const activeClip = clipsRef.current.find(c=> timeRef.current>=c.timelineStart && timeRef.current < c.timelineStart+c.duration) || clipsRef.current[0];
        let contentAspect = 16/9;
        if(activeClip){
          if(activeClip.type==='photo'){
            const img = photoRefs.current.get(activeClip.id);
            if(img && img.naturalWidth && img.naturalHeight){
              contentAspect = img.naturalWidth / img.naturalHeight;
            }
          } else {
            const v = videoRefs.current.get(activeClip.id);
            if(v && v.videoWidth && v.videoHeight){
              contentAspect = v.videoWidth / v.videoHeight;
            }
          }
        }
        const maxW = window.innerWidth * 0.95;
        const maxH = window.innerHeight * 0.90;
        const maxAspect = maxW / maxH;
        if(contentAspect > maxAspect){
          targetW = maxW;
          targetH = maxW / contentAspect;
        } else {
          targetH = maxH;
          targetW = maxH * contentAspect;
        }
        targetW = Math.max(320, targetW);
        targetH = Math.max(180, targetH);
      }
      else {
        const cw=wrap.clientWidth;
        targetW = cw<10 ? 320 : cw;
        if(aspectMode==='9:16'){
          targetH = targetW * 16/9;
        } else {
          targetH = targetW / (aspectRef.current||16/9);
        }
      }
      if(!force && !isFs && playingRef.current){
        drawFrameRef.current(timeRef.current);
        return;
      }
      if(!force && Math.abs(c.width/dpr-targetW)<1.5 && Math.abs(c.height/dpr-targetH)<1.5){
        drawFrameRef.current(timeRef.current);
        return;
      }
      c.width=Math.max(10,targetW*dpr);
      c.height=Math.max(10,targetH*dpr);
      if(isFs){ c.style.width='100vw'; c.style.height='100vh'; }
      else{ c.style.width=targetW+'px'; c.style.height=targetH+'px'; }
      drawFrameRef.current(timeRef.current);
      requestAnimationFrame(()=> drawFrameRef.current(timeRef.current));
    }); });
  },[aspectMode]);

  const tick = useCallback(()=>{
    if(!playingRef.current) return;
    const now=performance.now();
    const last=tick._last||now;
    let delta=(now-last)/1000*playbackRate;
    if(delta>0.15) delta=0.08;
    if(delta<0) delta=0;
    tick._last=now;
    timeRef.current+=delta;
    if(timeRef.current>=durationRef.current-0.02){
      timeRef.current=0;
      if(bgmAudioRef.current){
        try{ bgmAudioRef.current.currentTime = bgmOffsetRef.current; }catch{}
      }
      setCurrentTime(0);
      handleStop();
      return;
    }
    if(Math.abs(timeRef.current - lastDisplayedTimeRef.current) >= 0.08){
      lastDisplayedTimeRef.current = timeRef.current;
      setCurrentTime(timeRef.current);
    }
    const clipsNow = clipsRef.current;
    let active=null;

  const analyzeClipBrightnessContrast = useCallback(async (video, clip)=>{
    const realDur = (video && isFinite(video.duration) && video.duration>0) ? video.duration : (clip.duration + (clip.trimStart||0));
    const startOffset = clip.trimStart||0;
    const duration = Math.min(clip.duration, realDur - startOffset);
    if(duration<=3.1) return {trimStart: startOffset, reason:'short', score:0};
    const sampleStep = 0.2;
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const samples=[];
    const totalSteps = Math.ceil(duration / sampleStep);
    for(let i=0;i<totalSteps;i++){
      const t = i*sampleStep;
      if(t>duration) break;
      const targetTime = startOffset + t;
      await seekVideo(video, targetTime);
      try{
        ctx.drawImage(video, 0, 0, 32, 32);
        const data = ctx.getImageData(0,0,32,32).data;
        let sum=0, sumSq=0, count=0;
        for(let p=0;p<data.length;p+=4){
          const r=data[p], g=data[p+1], b=data[p+2];
          // 輝度 Y
          const y = 0.299*r + 0.587*g + 0.114*b;
          sum+=y;
          sumSq+=y*y;
          count++;
        }
        const avg = sum/count;
        const variance = Math.max(0, sumSq/count - avg*avg);
        const contrast = Math.sqrt(variance);
        // ランタンみたいな「暗い中に明るい」シーンはコントラストが高いので重みを上げる
        // score = 明るさ*0.6 + コントラスト*1.0 + 明るさ*コントラストの相乗効果
        const score = avg*0.6 + contrast*1.2 + (avg*contrast/100)*0.5;
        samples.push({t, avg, contrast, score});
      }catch(e){
        samples.push({t, avg:0, contrast:0, score:0});
      }
    }
    // 3秒窓で最高スコアを探す
    const windowSize = Math.ceil(3 / sampleStep);
    let bestIdx=0, bestScore=-1, bestAvg=0, bestContrast=0;
    for(let i=0;i<=samples.length-windowSize;i++){
      let winScore=0, winAvg=0, winContrast=0;
      for(let j=0;j<windowSize;j++){
        winScore+=samples[i+j].score;
        winAvg+=samples[i+j].avg;
        winContrast+=samples[i+j].contrast;
      }
      winScore/=windowSize;
      winAvg/=windowSize;
      winContrast/=windowSize;
      if(winScore>bestScore){
        bestScore=winScore;
        bestIdx=i;
        bestAvg=winAvg;
        bestContrast=winContrast;
      }
    }
    // スコアのばらつきが小さい場合は中央にフォールバック
    const scores = samples.map(s=>s.score);
    const meanScore = scores.reduce((a,b)=>a+b,0)/Math.max(1,scores.length);
    const stdScore = Math.sqrt(scores.reduce((a,b)=>a+(b-meanScore)*(b-meanScore),0)/Math.max(1,scores.length));
    if(stdScore < 4 || bestScore < 10){
      const mid = duration/2;
      let newTrim = startOffset + mid - 1.5;
      newTrim = Math.max(0, Math.min(newTrim, Math.max(0, realDur-3)));
      return {trimStart:newTrim, reason:'uniform-center', score:bestScore, avg:bestAvg, contrast:bestContrast};
    }
    const bestTime = samples[bestIdx].t;
    let newTrim = startOffset + bestTime;
    newTrim = Math.max(0, Math.min(newTrim, Math.max(0, realDur-3)));
    // 理由を判定
    let reason='bright';
    if(bestContrast > 35 && bestAvg > 60) reason='contrast-lantern';
    else if(bestAvg > 150) reason='bright-sunny';
    else if(bestContrast > 30) reason='contrast';
    return {trimStart:newTrim, reason, score:bestScore, avg:bestAvg, contrast:bestContrast, bestTime};
  },[seekVideo]);

  const analyzeClipForFiveSmart = useCallback(async (video, clip)=>{
    const realDur = (video && isFinite(video.duration) && video.duration>0) ? video.duration : (clip.duration + (clip.trimStart||0));
    const startOffset = clip.trimStart||0;
    const duration = Math.min(clip.duration, realDur - startOffset);
    if(duration<1) return [];
    const sampleStep = 0.2;
    const canvas = document.createElement('canvas');
    canvas.width=32; canvas.height=32;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const samples=[];
    const totalSteps = Math.ceil(duration / sampleStep);
    for(let i=0;i<totalSteps;i++){

          const y=0.299*r+0.587*g+0.114*b;
          sum+=y; sumSq+=y*y; count++;
        }
        const avg=sum/count;
        const contrast=Math.sqrt(Math.max(0,sumSq/count-avg*avg));
        const score=avg*0.6+contrast*1.2+(avg*contrast/100)*0.5;
        samples.push({t, avg, contrast, score});
      }catch(e){
        samples.push({t, avg:0, contrast:0, score:0});
      }
    }
    // 5つの非重複窓を探す
    const windowSec = 2; // 各ショット2秒
    const windowSize = Math.ceil(windowSec / sampleStep);
    const margin = Math.ceil(1 / sampleStep); // 1秒のマージン
    const used = new Array(samples.length).fill(false);
    const bestWindows=[];
    for(let k=0;k<5;k++){
      let bestIdx=-1, bestScore=-1;
      for(let i=0;i<=samples.length-windowSize;i++){
        let overlap=false;
        for(let j=i;j<i+windowSize;j++){ if(used[j]){ overlap=true; break; } }
        if(overlap) continue;
        let winScore=0;
        for(let j=0;j<windowSize;j++) winScore+=samples[i+j].score;
        winScore/=windowSize;
        if(winScore>bestScore){ bestScore=winScore; bestIdx=i; }
      }
      if(bestIdx===-1) break;
      bestWindows.push({idx:bestIdx, score:bestScore, sample:samples[bestIdx]});
      for(let j=Math.max(0,bestIdx-margin); j<Math.min(samples.length, bestIdx+windowSize+margin); j++) used[j]=true;
    }
    // 時間順にソート
    bestWindows.sort((a,b)=> a.idx - b.idx);
    return bestWindows.map(w=> ({
      time: samples[w.idx].t,
      score: w.score,
      avg: samples[w.idx].avg,
      contrast: samples[w.idx].contrast
    }));
  },[seekVideo]);

  const playWebAudioBgm = useCallback((type)=>{
    stopWebAudioBgm();
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      bgmAudioContextRef.current=ctx;
      const masterGain = ctx.createGain();
      masterGain.gain.value = bgmVolume*0.35;
      masterGain.connect(ctx.destination);
      if(type==='chill'){
        // Lofi風: 低いサイン波+少しの揺らぎ - ずっと鳴る
        const osc = ctx.createOscillator();
        osc.type='sine';
        osc.frequency.value=110;
        const gain = ctx.createGain();
        gain.gain.value=0.15;
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        bgmOscillatorsRef.current.push(osc);
        const osc2 = ctx.createOscillator();
        osc2.type='triangle';
        osc2.frequency.value=220;
        const gain2 = ctx.createGain();
        gain2.gain.value=0.08;
        osc2.connect(gain2);
        gain2.connect(masterGain);
        osc2.start();
        bgmOscillatorsRef.current.push(osc2);
        // LFOで少し揺らす
        const lfo = ctx.createOscillator();
        lfo.frequency.value=0.3;
        const lfoGain = ctx.createGain();
        lfoGain.gain.value=5;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start();
        bgmOscillatorsRef.current.push(lfo);
      } else if(type==='happy'){
        // Happy: 明るいメジャーコードのアルペジオ - ずっとループ
        let nextNoteTime = ctx.currentTime;
        const scheduleHappyLoop = ()=>{
          if(bgmTrackRef.current!==type) return;
          const now = ctx.currentTime;
          if(now>=nextNoteTime-0.1){
            const freqs=[261.63,329.63,392,523.25,392,329.63];
            const f = freqs[Math.floor(Math.random()*freqs.length)];
            const osc = ctx.createOscillator();
            osc.type='sine';
            osc.frequency.value=f;
            const gain = ctx.createGain();
            gain.gain.value=0;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.18, now+0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now+0.6);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now+0.7);
            nextNoteTime = now + 0.35 + Math.random()*0.2;
          }
          if(bgmTrackRef.current===type){
            bgmTimeoutRef.current = setTimeout(scheduleHappyLoop, 100);
          }
        };
        scheduleHappyLoop();
        // ベース音はずっと鳴る
        const bass = ctx.createOscillator();
        bass.type='sine';
        bass.frequency.value=130.81;
        const bassGain = ctx.createGain();
        bassGain.gain.value=0.06;
        bass.connect(bassGain);
        bassGain.connect(masterGain);
        bass.start();
        bgmOscillatorsRef.current.push(bass);
      } else if(type==='cinematic'){
        // Cinematic: 低いドローン+高いパッド - ずっと鳴る
        const osc = ctx.createOscillator();
        osc.type='sawtooth';
        osc.frequency.value=55;
        const filter = ctx.createBiquadFilter();
        filter.type='lowpass';
        filter.frequency.value=400;
        filter.Q.value=5;
        const gain = ctx.createGain();
        gain.gain.value=0.12;
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        osc.start();
        bgmOscillatorsRef.current.push(osc);
        const osc2 = ctx.createOscillator();
        osc2.type='sine';
        osc2.frequency.value=220;
        const gain2 = ctx.createGain();
        gain2.gain.value=0.08;
        osc2.connect(gain2);

        // ゆっくりフィルタを動かす

        lfoGain.gain.value=200;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();
