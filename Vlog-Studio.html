  const [swipeIndex, setSwipeIndex] = useState(0);

  const [isFiveShotAnalyzing, setIsFiveShotAnalyzing] = useState(false);
  const [activeFilter, setActiveFilter] = useState('none');
  const [filterIntensity, setFilterIntensity] = useState(100);
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [analyzeProgress, setAnalyzeProgress] = useState(0);
  const [analyzeText, setAnalyzeText] = useState('');
  const [analyzeReason, setAnalyzeReason] = useState('');
  const [bgmTrack, setBgmTrack] = useState('none');
  const [bgmOffset, setBgmOffset] = useState(0);
  const [bgmVolume, setBgmVolume] = useState(0.5);
  const [customBgms, setCustomBgms] = useState([]); // {id, name, url, fileName}
  const [bgmTimelineStart, setBgmTimelineStart] = useState(0);
  const [bgmTimelineDuration, setBgmTimelineDuration] = useState(10);
  const [bgmFadeIn, setBgmFadeIn] = useState(1.0);
  const [bgmFadeOut, setBgmFadeOut] = useState(1.0);
  const [draggingBgmBar, setDraggingBgmBar] = useState(null);
  const [draggingClipId, setDraggingClipId] = useState(null);
  const [confirmModal, setConfirmModal] = useState(null); // {message, onOk, onCancel}
  const [alertModal, setAlertModal] = useState(null); // {message}
  const [draggingText, setDraggingText] = useState(null);
  const [draggingClipBar, setDraggingClipBar] = useState(null);
  const [selectedTextId, setSelectedTextId] = useState(null);
  const [selectedClipIds, setSelectedClipIds] = useState([]);
  const [photoDuration, setPhotoDuration] = useState(2.5);
  const [bulkPhotoDuration, setBulkPhotoDuration] = useState(2.5);
  const [selectedTransition, setSelectedTransition] = useState(null);
  const [defaultTransition, setDefaultTransition] = useState({type:'fade', duration:0.5});

  useEffect(()=>{ clipsRef.current = clips; },[clips]);
  useEffect(()=>{ textsRef.current = texts; },[texts]);
  useEffect(()=>{ modeRef.current = mode; },[mode]);
  useEffect(()=>{ durationRef.current = duration; },[duration]);

  useEffect(()=>{ bgmOffsetRef.current = bgmOffset; },[bgmOffset]);
  useEffect(()=>{ photoDurationRef.current = photoDuration; },[photoDuration]);
  useEffect(()=>{ bulkPhotoDurationRef.current = bulkPhotoDuration; },[bulkPhotoDuration]);
  useEffect(()=>{ defaultTransitionRef.current = defaultTransition; },[defaultTransition]);
  useEffect(()=>{ bgmTrackRef.current = bgmTrack; },[bgmTrack]);
  useEffect(()=>{ bgmTimelineStartRef.current = bgmTimelineStart; },[bgmTimelineStart]);
  useEffect(()=>{ bgmTimelineDurationRef.current = bgmTimelineDuration; },[bgmTimelineDuration]);
  useEffect(()=>{ bgmFadeInRef.current = bgmFadeIn; },[bgmFadeIn]);
  useEffect(()=>{ bgmFadeOutRef.current = bgmFadeOut; },[bgmFadeOut]);

  useEffect(()=>{
    document.documentElement.style.background='#0a0a0b';
    document.body.style.background='#0a0a0b';
    return ()=>{ cancelAnimationFrame(rafTickRef.current); playingRef.current=false; };
  },[]);

  const drawFrame = useCallback((t)=>{
    const c = canvasRef.current;
    if(!c) return;
    const ctx = c.getContext('2d', {alpha:false});
    if(!ctx) return;
    const cw=c.width, ch=c.height;
    if(cw<10||ch<10) return;
    const clipsNow = clipsRef.current;
    const textsNow = textsRef.current;
    let activeClip=null;
    let nextClip=null;
    let localTime=0;
    let transitionProgress=0;
    let inTransition=false;
    let transitionType='none';
    let transitionDuration=0;
    // 通常のアクティブクリップを探す
    for(let i=0;i<clipsNow.length;i++){
      const clip = clipsNow[i];
      if(t>=clip.timelineStart && t<clip.timelineStart+clip.duration){
        activeClip=clip;
        localTime=t-clip.timelineStart;
        // トランジション判定: このクリップの終盤で、次のクリップへのトランジションがあるか
        const trans = clip._transitionToNext;
        if(trans && trans.type!=='none' && i+1<clipsNow.length){
          const transDur = trans.duration||0.5;
          const timeToEnd = (clip.timelineStart+clip.duration) - t;
          if(timeToEnd<=transDur && timeToEnd>0){
            // トランジション中
            inTransition=true;
            nextClip=clipsNow[i+1];
            transitionType=trans.type;
            transitionDuration=transDur;
            transitionProgress=1 - (timeToEnd/transDur); // 0→1
          }
        }
        break;
      }
    }
    if(!activeClip && clipsNow.length>0){
      if(t>=durationRef.current-0.05){
        activeClip=clipsNow[clipsNow.length-1];
        localTime=Math.max(0, activeClip.duration-0.05);
      } else if(t<=0.05){
        activeClip=clipsNow[0];
        localTime=0;
      } else {
        activeClip=clipsNow[0];
        localTime=0;
      }
    }
    // 描画ヘルパー: 単一クリップを描画 - 黒画面対策版
    const drawSingleClip = (clip, lTime, alpha=1, offsetX=0, offsetY=0, scale=1)=>{
      if(!clip) return;
      const isPhoto = clip.type==='photo';
      if(isPhoto){
        const img=photoRefs.current.get(clip.id);
        const isTransitioning = alpha < 0.99 || Math.abs(offsetX) > 0.1 || Math.abs(offsetY) > 0.1;
        if(!img){
          if(isTransitioning){
            // トランジション中は透明でスキップ - fromClipを残す
            ctx.globalAlpha=0;
            return;
          }
          // 画像がまだない場合はプレースホルダー（トランジション外のみ）
          ctx.globalAlpha=alpha*0.5;
          ctx.fillStyle='#1a1a2e';
          ctx.fillRect(0,0,cw,ch);
          ctx.fillStyle='rgba(255,255,255,0.5)';
          ctx.font=`${Math.round(ch*0.04)}px sans-serif`;
          ctx.textAlign='center';
          ctx.fillText('🖼️ Loading...', cw/2, ch/2);
          ctx.globalAlpha=1;
          return;
        }
        if(!img.complete || img.naturalWidth===0 || img.naturalWidth<2){
          if(isTransitioning){
            // 未準備でも薄く表示を試みるかスキップ
            if(alpha < 0.5){
              return; // フェード後半ならスキップして黒防止
            }
            // 前半なら少し薄く表示
          } else {
            ctx.globalAlpha=alpha*0.5;
            ctx.fillStyle='#1a1a2e';
            ctx.fillRect(0,0,cw,ch);
            ctx.globalAlpha=1;
            return;
          }
        }
        // Ken Burns効果
        let zoom = clip._photoZoom||1.0;
        let pan = clip._photoPan||'center';
        const progress = lTime / Math.max(0.1, clip.duration);
        if(pan==='kenburns-in'){
          zoom = 1.0 + progress*0.15;
        } else if(pan==='kenburns-out'){
          zoom = 1.15 - progress*0.15;
        }
        zoom *= scale;
        const iw=img.naturalWidth||img.width||16;
        const ih=img.naturalHeight||img.height||9;
        const ir=iw/ih;
        const cr=cw/ch;
        let dw,dh,dx,dy;
        if(fitMode==='cover'){
          if(ir>cr){ dh=ch*zoom; dw=ch*ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
          else{ dw=cw*zoom; dh=cw/ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
        } else {
          if(ir>cr){ dw=cw*zoom; dh=cw/ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
          else{ dh=ch*zoom; dw=ch*ir*zoom; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
        }
        // fitMode='contain'の場合は中央寄せを正確に
        if(pan==='kenburns-in'){
          dx += (progress-0.5)*cw*0.05;
          dy += (progress-0.5)*ch*0.05;
        }
        ctx.globalAlpha=alpha;
        try{ 
          ctx.drawImage(img,dx,dy,dw,dh); 
        }catch(e){ 
          console.warn('photo draw failed', e); 
        }finally{
          ctx.globalAlpha=1;
        }
      } else {
        const v=videoRefs.current.get(clip.id);
        if(!v){
          ctx.globalAlpha=alpha*0.3;
          ctx.fillStyle='#111';
          ctx.fillRect(0,0,cw,ch);
          ctx.globalAlpha=1;
          return;
        }
        // readyStateが0でも描画を試みる（黒画面防止）
        try{
          const trimStart = clip.trimStart || 0;
          const targetTime = trimStart + lTime;
          const seekThreshold = playingRef.current ? 0.14 : 0.28;
          if(v.readyState>=1 && Math.abs(v.currentTime - targetTime) > seekThreshold){
            try{ v.currentTime = Math.max(0, Math.min(targetTime, (v.duration||999)-0.02)); }catch{}
          }
          let vr = 16/9;
          try{
            vr = (v.videoWidth && v.videoHeight) ? v.videoWidth/v.videoHeight : 16/9;
          }catch{}
          const cr=cw/ch;
          let dw,dh,dx,dy;
          const isCover = fitMode==='cover';
          if(isCover){
            if(vr>cr){ dh=ch*scale; dw=ch*vr*scale; dx=(cw-dw)/2 + offsetX; dy=(ch-dh)/2 + offsetY; }
            else{ dw=cw*scale; dh=cw/vr*scale; dx=0 + offsetX; dy=(ch-dh)/2 + offsetY; }
          } else {
            if(vr>cr){ dw=cw*scale; dh=cw/vr*scale; dx=0 + offsetX; dy=(ch-dh)/2 + offsetY; }
            else{ dh=ch*scale; dw=ch*vr*scale; dx=(cw-dw)/2 + offsetX; dy=0 + offsetY; }
          }
          ctx.globalAlpha=alpha;
          try{
            if(v.readyState>=1){
              try{ 
                // トランジション中はalphaを尊重
                ctx.drawImage(v,dx,dy,dw,dh); 
              }catch(e){ 
                // 描画失敗時は透明でスキップ（黒塗りしない）
                if(alpha>=0.99 && offsetX===0 && offsetY===0){
                  ctx.fillStyle='#0a0a0b';
                  ctx.fillRect(dx,dy,dw,dh);
                }
              }
            } else {
              // 読み込み中はトランジション中なら何も描かない（前のクリップを残す）
              // トランジション中でなければプレースホルダー
              if(alpha<0.99 || offsetX!==0){
                // トランジション中はスキップ
              } else {
                ctx.fillStyle='#111113';
                ctx.fillRect(0,0,cw,ch);
                ctx.fillStyle='rgba(255,255,255,0.3)';
                ctx.font=`${Math.round(ch*0.04)}px sans-serif`;
                ctx.textAlign='center';
                ctx.fillText('📼 Loading...', cw/2, ch/2);
              }
            }
          }finally{
            ctx.globalAlpha=1;
            // filterは外側で管理するのでここではリセットしない（トランジションのfilterを壊さない）
            if(alpha>=0.99){
              ctx.filter='none';
            }
          }
        }catch(e){ console.warn('video draw failed', e); ctx.globalAlpha=1; }
      }
    };

    if(!activeClip){
      ctx.filter='none';
      ctx.fillStyle='#0a0a0b';
      ctx.fillRect(0,0,cw,ch);
      if(clipsNow.length===0){
        ctx.fillStyle='rgba(255,255,255,0.18)';
        ctx.font=`${Math.round(ch*0.05)}px sans-serif`;
        ctx.textAlign='center';
        ctx.fillText('動画・写真を追加してください', cw/2, ch/2);
        lastFrameHasVideoRef.current=false;
      } else {
        // クリップはあるがアクティブが見つからない時は最初のクリップを描画
        const fallback = clipsNow[0];
        ctx.filter='none';
        const clipFilterId = fallback._filter || fallback._filterId || activeFilterRef.current;
        const f = FILTERS.find(x=> x.id===clipFilterId);
        let css = 'none';
        if(f && f.id!=='none'){ css = f.css; }
        ctx.filter = css;
        drawSingleClip(fallback, 0, 1);
        ctx.filter='none';
      }
    } else {
      // 背景
      ctx.filter='none';
      ctx.fillStyle='#0a0a0b';
      ctx.fillRect(0,0,cw,ch);
      const clipFilterId = activeClip._filter || activeClip._filterId || activeFilterRef.current;
      const f = FILTERS.find(x=> x.id===clipFilterId);
      let css = 'none';
      const currentIntensity = filterIntensityRef.current;
      if(f && f.id!=='none' && currentIntensity>0){
        if(currentIntensity===100){
          css = f.css;
        } else {
          const factor = currentIntensity/100;
          if(factor<1){
            if(factor<0.08){
              css = 'none';
            } else {
              const orig = f.css;
              css = orig;
              if(factor<0.9){
                css = `brightness(${0.85 + 0.15*factor}) saturate(${0.5 + 0.5*factor}) ` + css;
              }
            }
          } else {
            css = f.css + ` brightness(${0.9 + 0.1*factor}) saturate(${factor})`;
          }
        }
      }
      ctx.filter = css;
      if(canvasRef.current){
        canvasRef.current.style.filter = 'none';
      }

      if(inTransition && nextClip){
        // トランジション描画 - nextClipシーク追加
        const prog = transitionProgress; // 0→1
        const fromClip = activeClip;
        const toClip = nextClip;
        // toClipが動画なら事前にシーク（黒フレーム防止）- 修正: 重なり考慮
        try{
          if(toClip.type!=='photo'){
            const toV = videoRefs.current.get(toClip.id);
            if(toV && toV.readyState>=1 && !toV.seeking){
              const toTrim = toClip.trimStart||0;
              // トランジション中は負になるので +transitionDuration で補正
              const rawSeek = (t - toClip.timelineStart);
              const correctedSeek = Math.max(0, rawSeek + transitionDuration);
              const target = toTrim + correctedSeek;
              if(Math.abs(toV.currentTime - target) > 0.4){
                toV.currentTime = Math.max(0, Math.min(target, (toV.duration||999)-0.1));
              }
            }
          }
        }catch{}
        // fromのlocalTimeは終盤、toのlocalTimeは最初（重なり考慮）
        const fromLocal = localTime;
        // toLocalは負にならないように補正: トランジション開始時を0とする
        // 通常: toClip.timelineStart = fromClip.timelineStart + fromClip.duration
        // トランジション中: t は fromClip.end - transDur から fromClip.end の間
        // toLocal = t - (fromClip.end - transDur) = t - toClip.start + transDur
        const rawToLocal = (t - toClip.timelineStart);
        const toLocal = Math.max(0, rawToLocal + transitionDuration);
        // 効果別
        if(transitionType==='fade'){
          // クロスフェード - 修正: fromを不透明で描いてからtoを重ねる、黒背景が透けないように
          // まずfromClipを100%で描画
          drawSingleClip(fromClip, fromLocal, 1);
          ctx.filter=css;
          // toClipをprogで上から重ねる（未準備ならスキップでfromが残る）
          if(toClip){
            drawSingleClip(toClip, toLocal, prog);
          }
        } else if(transitionType==='white'){
          // ホワイトフェード - filterリセットとalpha管理を徹底
          if(prog<0.5){
            // fromClipを薄くしながら白を重ねる
            drawSingleClip(fromClip, fromLocal, 1-prog*2);
            const prevFilter = ctx.filter;
            const prevAlpha = ctx.globalAlpha;
            ctx.filter='none';
            ctx.globalAlpha=1;
            ctx.fillStyle=`rgba(255,255,255,${prog*2})`;
            ctx.fillRect(0,0,cw,ch);
            ctx.filter=prevFilter;
            ctx.globalAlpha=prevAlpha;
          } else {
            // 白からtoClipへ
            const prevFilter = ctx.filter;
            const prevAlpha = ctx.globalAlpha;
            ctx.filter='none';
            ctx.globalAlpha=1;
            ctx.fillStyle=`rgba(255,255,255,${(1-prog)*2})`;
            ctx.fillRect(0,0,cw,ch);
            ctx.filter=css;
            ctx.globalAlpha=1;
            drawSingleClip(toClip, toLocal, (prog-0.5)*2);
            ctx.filter=prevFilter;
          }
          ctx.filter=css;
          ctx.globalAlpha=1;
        } else if(transitionType==='slide-left'){
          // 左にスライド
          const offsetFrom = -cw*prog;
          const offsetTo = cw*(1-prog);
          drawSingleClip(fromClip, fromLocal, 1, offsetFrom, 0);
          ctx.filter=css;
          drawSingleClip(toClip, toLocal, 1, offsetTo, 0);
        } else if(transitionType==='slide-right'){
          const offsetFrom = cw*prog;
          const offsetTo = -cw*(1-prog);
          drawSingleClip(fromClip, fromLocal, 1, offsetFrom, 0);
          ctx.filter=css;
          drawSingleClip(toClip, toLocal, 1, offsetTo, 0);
        } else if(transitionType==='zoom'){
          // ズーム
          const scaleFrom = 1 + prog*0.3;
          const scaleTo = 0.7 + prog*0.3;
          const alphaFrom = 1-prog;
          const alphaTo = prog;
          drawSingleClip(fromClip, fromLocal, alphaFrom, 0, 0, scaleFrom);
          ctx.filter=css;
          drawSingleClip(toClip, toLocal, alphaTo, 0, 0, scaleTo);
        } else {
          // デフォルトはフェード
          drawSingleClip(fromClip, fromLocal, 1-prog);
          ctx.filter=css;
          drawSingleClip(toClip, toLocal, prog);
        }
      } else {
        // 通常描画
        drawSingleClip(activeClip, localTime, 1);
      }

      // ときめきエフェクト
      const clipFilterIdForEffect = activeClip._filter || activeClip._filterId || activeFilterRef.current;
      if(clipFilterIdForEffect==='tokimeki' || clipFilterIdForEffect==='tokimeki_heart' || clipFilterIdForEffect==='tokimeki_prism' || clipFilterIdForEffect==='tokimeki_angel'){
        ctx.filter='none';
        const rawIntensity = filterIntensityRef.current/100;
        if(rawIntensity>=0.05){
          const intensity = Math.max(0, Math.min(1.8, rawIntensity));
          const isHeart = clipFilterIdForEffect==='tokimeki_heart';
          const isPrism = clipFilterIdForEffect==='tokimeki_prism';
          const isAngel = clipFilterIdForEffect==='tokimeki_angel';
          ctx.globalCompositeOperation='screen';
          ctx.globalAlpha=(isPrism?0.05:isAngel?0.08:0.07)*intensity;
          const softVeil = ctx.createRadialGradient(cw*0.5, ch*0.45, 0, cw*0.5, ch*0.45, cw*1.2);
          if(isAngel){
            softVeil.addColorStop(0, 'rgba(255,240,250,0.42)');
            softVeil.addColorStop(0.4, 'rgba(200,245,255,0.10)');
            softVeil.addColorStop(1, 'rgba(180,220,255,0)');
          } else if(isPrism){
            softVeil.addColorStop(0, 'rgba(255,245,255,0.32)');
            softVeil.addColorStop(0.5, 'rgba(255,235,240,0.08)');
            softVeil.addColorStop(1, 'rgba(200,230,255,0)');
          } else {
            softVeil.addColorStop(0, 'rgba(255,240,245,0.38)');
            softVeil.addColorStop(0.45, 'rgba(255,232,238,0.12)');
            softVeil.addColorStop(1, 'rgba(255,220,230,0)');
          }
          ctx.fillStyle=softVeil;
          ctx.fillRect(0,0,cw,ch);
          ctx.globalAlpha=1;
          // (簡略化: 玉ボケ等は元のまま)
          ctx.globalCompositeOperation='source-over';
          ctx.filter='none';
        }
      }
      lastFrameHasVideoRef.current=true;
    }
    const activeTexts = (modeRef.current==='textEdit' || modeRef.current==='fullscreen' || modeRef.current==='timeline' || modeRef.current==='swipe') ? textsNow : textsNow.filter(txt=> t>=txt.start && t<=txt.end);
    activeTexts.forEach(txt=>{
      let alpha=1;
      const prog=(t-txt.start)/Math.max(0.01, txt.end-txt.start);
      // フェードイン・アウト
      if(prog<0.15) alpha=prog/0.15; else if(prog>0.85) alpha=(1-prog)/0.15;
      // アニメーション別のアルファ補正
      if(txt.anim==='fade'){
        if(prog<0.25) alpha*=prog/0.25;
        if(prog>0.75) alpha*=(1-prog)/0.25;
      }
      // 完全に透明なら描画スキップ（黒残り防止）
      if(alpha<=0.01) return;
      ctx.save();
      ctx.filter='none';
      ctx.globalAlpha=Math.max(0,Math.min(1,alpha));
      const fontSize = Math.round(ch * (txt.fontSize || 0.06));
      const weight = txt.bold ? 'bold ' : '';
      const familyMap = {
        sans:'"Noto Sans JP", sans-serif',
        serif:'"Noto Serif JP", serif',
        rounded:'"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif',
        pop:'"M PLUS Rounded 1c", sans-serif',
        hand:'"Kosugi Maru", cursive',
        yuji:'"Yuji Syuku", cursive',
        shippori:'"Shippori Mincho", serif',
        reggae:'"Reggae One", cursive',
        dela:'"Dela Gothic One", cursive',
        rock:'"RocknRoll One", sans-serif',
        kiwi:'"Kiwi Maru", serif',
        hachi:'"Hachi Maru Pop", cursive',
        stick:'"Stick", sans-serif'
      };
      const family = familyMap[txt.fontFamily||'sans'] || 'sans-serif';
      ctx.font=`${weight}${fontSize}px ${family}`;
      ctx.textAlign = txt.align || 'center';
      ctx.textBaseline='middle';
      // アニメーションの最終位置を計算（黒残りバグの根本修正）
      const baseX=(txt.x/100)*cw;
      const baseY=(txt.y/100)*ch;
      let finalX=baseX;
      let finalY=baseY;
      if(txt.anim==='bounce'){
        const bounceY = Math.sin(prog*Math.PI*6)* (fontSize*0.18) * (prog<0.35?1:0);
        finalY = baseY + bounceY;
      } else if(txt.anim==='slide'){
        const slideX = (1-prog)*40 * (prog<0.35?1:0);
        finalX = baseX + slideX;
      }
      // 背景
      if(txt.bgColor && txt.bgColor!=='transparent'){
        const metrics = ctx.measureText(txt.text);
        const bgW = metrics.width + fontSize*0.6;
        const bgH = fontSize*1.4;
        let bx = finalX - bgW/2;
        if(txt.align==='left') bx = finalX;
        if(txt.align==='right') bx = finalX - bgW;
        ctx.fillStyle = txt.bgColor;
        ctx.globalAlpha = Math.max(0,Math.min(1,alpha)) * 0.85;
        ctx.fillRect(bx, finalY - bgH/2, bgW, bgH);
        ctx.globalAlpha = Math.max(0,Math.min(1,alpha));
      }
      // 縁取りは最終位置に1回だけ描画（黒残りバグ修正）
      if(txt.outline){
        ctx.shadowColor='rgba(0,0,0,0.75)';
        ctx.shadowBlur=12;
        ctx.lineWidth=Math.max(2, fontSize*0.14);
        ctx.strokeStyle= txt.strokeColor || 'rgba(0,0,0,0.85)';
        ctx.lineJoin='round';
        ctx.miterLimit=2;
        ctx.strokeText(txt.text, finalX, finalY);
      }
      ctx.shadowColor='transparent';
      ctx.shadowBlur=0;
      ctx.fillStyle= txt.color || '#fff';
      ctx.fillText(txt.text, finalX, finalY);
      ctx.restore();
    });
  },[fitMode, filterIntensity]);
  useEffect(()=>{ drawFrameRef.current = drawFrame; },[drawFrame]);

  const syncCanvasSize = useCallback((force=false)=>{
    if(!force && syncScheduledRef.current) return;
    syncScheduledRef.current=true;
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
      syncScheduledRef.current=false;
      const c=canvasRef.current, wrap=previewWrapRef.current;
      if(!c||!wrap) return;
      const isFs = modeRef.current==='fullscreen' || wrap.classList.contains('fullscreen');
      const dpr=window.devicePixelRatio||1;
      let targetW, targetH;
      if(isFs){ targetW=window.innerWidth; targetH=window.innerHeight; }
      else {
        const cw=wrap.clientWidth;
        targetW = cw<10 ? 320 : cw;
        if(aspectMode==='9:16'){
          targetH = targetW * 16/9;
        } else {
          targetH = targetW / (aspectRef.current||16/9);
        }
      }
      if(!force && !isFs && playingRef.current){
        drawFrameRef.current(timeRef.current);
        return;
      }
      if(!force && Math.abs(c.width/dpr-targetW)<1.5 && Math.abs(c.height/dpr-targetH)<1.5){
        drawFrameRef.current(timeRef.current);
        return;
      }
      c.width=Math.max(10,targetW*dpr);
      c.height=Math.max(10,targetH*dpr);
      if(isFs){ c.style.width='100vw'; c.style.height='100vh'; }
      else{ c.style.width=targetW+'px'; c.style.height=targetH+'px'; }
      drawFrameRef.current(timeRef.current);
      requestAnimationFrame(()=> drawFrameRef.current(timeRef.current));
    }); });
  },[aspectMode]);

  const tick = useCallback(()=>{
    if(!playingRef.current) return;
    const now=performance.now();
    const last=tick._last||now;
    let delta=(now-last)/1000*playbackRate;
    if(delta>0.15) delta=0.08;
    if(delta<0) delta=0;
    tick._last=now;
    timeRef.current+=delta;
    if(timeRef.current>=durationRef.current-0.02){
      timeRef.current=0;
      if(bgmAudioRef.current){
        try{ bgmAudioRef.current.currentTime = bgmOffsetRef.current; }catch{}
      }
      setCurrentTime(0);
      handleStop();
      return;
    }
    if(Math.floor(timeRef.current*10)!==Math.floor(currentTime*10)){
      setCurrentTime(timeRef.current);
    }
    const clipsNow = clipsRef.current;
    let active=null;
    let local=0;
    for(const clip of clipsNow){
      if(timeRef.current>=clip.timelineStart && timeRef.current<clip.timelineStart+clip.duration){
        active=clip;
        local=timeRef.current-clip.timelineStart;
        break;
      }
    }
    if(active){
      const v=videoRefs.current.get(active.id);
      if(v){
        const target = (active.trimStart||0)+local;
        if(Math.abs(v.currentTime-target)>0.14){
          try{ v.currentTime=target; }catch{}
        }
        if(v.paused){
          try{ const p=v.play(); if(p&&p.catch) p.catch(()=>{}); }catch{}
        }
      }
      clipsNow.forEach(c=>{
        if(c.id!==active.id){
          const ov=videoRefs.current.get(c.id);
          const av=videoRefs.current.get(active.id);
          if(ov && ov!==av && !ov.paused){
            try{ ov.pause(); }catch{}
          }
        }
      });
    }
    if(bgmAudioRef.current && bgmTrack!=='none'){
      const bgmTarget = timeRef.current + bgmOffsetRef.current;
      if(Math.abs(bgmAudioRef.current.currentTime - bgmTarget) > 0.3){
        try{ bgmAudioRef.current.currentTime = Math.max(0, bgmTarget); }catch{}
      }
    }
    drawFrameRef.current(timeRef.current);
    rafTickRef.current=requestAnimationFrame(tick);
  },[playbackRate, currentTime, bgmTrack]);

  const handlePlay = useCallback(()=>{
    if(playingRef.current) return;
    if(timeRef.current>=durationRef.current-0.05){
      timeRef.current=0;
      setCurrentTime(0);
      clipsRef.current.forEach(clip=>{
        const v=videoRefs.current.get(clip.id);
        if(v){
          try{ v.currentTime = clip.trimStart||0; }catch{}
        }
      });
      if(bgmAudioRef.current){
        try{ bgmAudioRef.current.currentTime = bgmOffsetRef.current; }catch{}
      }
    }
    cancelAnimationFrame(rafTickRef.current);
    playingRef.current=true;
    setIsPlaying(true);
    tick._last=performance.now();
    // 解析後の再生停止バグ修正: 再生前に全videoのreadyStateを確認して必要なら少し待つ
    let needsWait=false;
    clipsRef.current.forEach(clip=>{
      const v=videoRefs.current.get(clip.id);
      if(v){
        const local=timeRef.current-clip.timelineStart;
        if(local>=0 && local<clip.duration){
          const target=(clip.trimStart||0)+local;
          try{ 
            if(Math.abs(v.currentTime-target)>0.25){
              v.currentTime=target;
              needsWait=true;
            }
          }catch{}
        }
        // iOSでvideoがended状態だとplayできないことがあるのでloadし直さずcurrentTimeをリセット
        try{
          if(v.ended){
            v.currentTime = clip.trimStart||0;
          }
        }catch{}
      }
    });
    if(bgmAudioRef.current && bgmTrack!=='none'){
      try{ bgmAudioRef.current.play().catch(()=>{}); }catch{}
    }
    // 少し待ってからtick開始（seek完了待ち）
    const startDelay = needsWait ? 120 : 30;
    setTimeout(()=>{
      if(playingRef.current){
        // 再生直前にアクティブクリップのvideoを確実にplay
        const clipsNow = clipsRef.current;
        let active=null, local=0;
        for(const clip of clipsNow){
          if(timeRef.current>=clip.timelineStart && timeRef.current<clip.timelineStart+clip.duration){
            active=clip; local=timeRef.current-clip.timelineStart; break;
          }
        }
        if(active){
          const v=videoRefs.current.get(active.id);
          if(v){
            try{
              const target=(active.trimStart||0)+local;
              v.currentTime=target;
              const p=v.play();
              if(p&&p.then) p.catch(()=>{});
            }catch{}
          }
        }
        rafTickRef.current=requestAnimationFrame(tick);
      }
    }, startDelay);
  },[tick, bgmTrack]);

  const handleStop = useCallback(()=>{
    playingRef.current=false;
    setIsPlaying(false);
    tick._last=0;
    cancelAnimationFrame(rafTickRef.current);
    videoRefs.current.forEach(v=>{ try{ v.pause(); }catch{} });
    if(bgmAudioRef.current){ try{ bgmAudioRef.current.pause(); }catch{} }
    drawFrameRef.current(timeRef.current);
  },[]);

  const setModeSafe = useCallback((m)=>{
    modeRef.current=m;
    setMode(m);
    if(m==='fullscreen'){
      setTimeout(()=> syncCanvasSize(true), 50);
      setTimeout(()=> syncCanvasSize(true), 220);
    } else if(m==='normal'){
      setTimeout(()=> syncCanvasSize(true), 80);
    }
  },[syncCanvasSize]);

  const addText = useCallback(()=>{
    const id=Math.random().toString(36).slice(2);
    const t = timeRef.current;
    const existingCount = textsRef.current.filter(tx=> Math.abs(tx.start - t) < 0.1).length;
    const offset = existingCount * 0.2;
    const newItem={ 
      id, text:'新しいテキスト', 
      start:Math.max(0,t+offset), end:Math.max(0.2,t+offset+2), 
      x:50, y:50 + existingCount*8, 
      font:0, anim:'fade',

  const seekVideo = useCallback((video, time)=>{
    return new Promise(res=>{

  const analyzeClipBrightnessContrast = useCallback(async (video, clip)=>{
    const realDur = (video && isFinite(video.duration) && video.duration>0) ? video.duration : (clip.duration + (clip.trimStart||0));
    const startOffset = clip.trimStart||0;
    const duration = Math.min(clip.duration, realDur - startOffset);
    if(duration<=3.1) return {trimStart: startOffset, reason:'short', score:0};
    const sampleStep = 0.2;
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const samples=[];
    const totalSteps = Math.ceil(duration / sampleStep);
    for(let i=0;i<totalSteps;i++){
      const t = i*sampleStep;
      if(t>duration) break;
      const targetTime = startOffset + t;
      await seekVideo(video, targetTime);
      try{
        ctx.drawImage(video, 0, 0, 32, 32);
        const data = ctx.getImageData(0,0,32,32).data;
        let sum=0, sumSq=0, count=0;
        for(let p=0;p<data.length;p+=4){
          const r=data[p], g=data[p+1], b=data[p+2];
          // 輝度 Y
          const y = 0.299*r + 0.587*g + 0.114*b;
          sum+=y;
          sumSq+=y*y;
          count++;
        }
        const avg = sum/count;
        const variance = Math.max(0, sumSq/count - avg*avg);
        const contrast = Math.sqrt(variance);
        // ランタンみたいな「暗い中に明るい」シーンはコントラストが高いので重みを上げる
        // score = 明るさ*0.6 + コントラスト*1.0 + 明るさ*コントラストの相乗効果
        const score = avg*0.6 + contrast*1.2 + (avg*contrast/100)*0.5;
        samples.push({t, avg, contrast, score});
      }catch(e){
        samples.push({t, avg:0, contrast:0, score:0});
      }
    }
    // 3秒窓で最高スコアを探す
    const windowSize = Math.ceil(3 / sampleStep);
    let bestIdx=0, bestScore=-1, bestAvg=0, bestContrast=0;
    for(let i=0;i<=samples.length-windowSize;i++){
      let winScore=0, winAvg=0, winContrast=0;
      for(let j=0;j<windowSize;j++){
        winScore+=samples[i+j].score;
        winAvg+=samples[i+j].avg;
        winContrast+=samples[i+j].contrast;
      }
      winScore/=windowSize;
      winAvg/=windowSize;
      winContrast/=windowSize;
      if(winScore>bestScore){
        bestScore=winScore;
        bestIdx=i;
        bestAvg=winAvg;
        bestContrast=winContrast;
      }
    }
    // スコアのばらつきが小さい場合は中央にフォールバック
    const scores = samples.map(s=>s.score);
    const meanScore = scores.reduce((a,b)=>a+b,0)/Math.max(1,scores.length);
    const stdScore = Math.sqrt(scores.reduce((a,b)=>a+(b-meanScore)*(b-meanScore),0)/Math.max(1,scores.length));
    if(stdScore < 4 || bestScore < 10){
      const mid = duration/2;
      let newTrim = startOffset + mid - 1.5;
      newTrim = Math.max(0, Math.min(newTrim, Math.max(0, realDur-3)));
      return {trimStart:newTrim, reason:'uniform-center', score:bestScore, avg:bestAvg, contrast:bestContrast};
    }
    const bestTime = samples[bestIdx].t;
    let newTrim = startOffset + bestTime;
    newTrim = Math.max(0, Math.min(newTrim, Math.max(0, realDur-3)));
    // 理由を判定
    let reason='bright';
    if(bestContrast > 35 && bestAvg > 60) reason='contrast-lantern';
    else if(bestAvg > 150) reason='bright-sunny';
    else if(bestContrast > 30) reason='contrast';
    return {trimStart:newTrim, reason, score:bestScore, avg:bestAvg, contrast:bestContrast, bestTime};
  },[seekVideo]);

  // 案1: スマート切り出し5ショット - 明るさ+コントラストの高い瞬間を5つ重ならないように抽出
  const analyzeClipForFiveSmart = useCallback(async (video, clip)=>{
    const realDur = (video && isFinite(video.duration) && video.duration>0) ? video.duration : (clip.duration + (clip.trimStart||0));
    const startOffset = clip.trimStart||0;
    const duration = Math.min(clip.duration, realDur - startOffset);
    if(duration<1) return [];
    const sampleStep = 0.2;
    const canvas = document.createElement('canvas');
    canvas.width=32; canvas.height=32;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const samples=[];
    const totalSteps = Math.ceil(duration / sampleStep);
    for(let i=0;i<totalSteps;i++){
      const t = i*sampleStep;
      if(t>=duration) break;
      await seekVideo(video, startOffset+t);
      try{
        ctx.drawImage(video, 0,0,32,32);
        const data = ctx.getImageData(0,0,32,32).data;
        let sum=0,sumSq=0,count=0;
        for(let p=0;p<data.length;p+=4){
          const r=data[p], g=data[p+1], b=data[p+2];
          const y=0.299*r+0.587*g+0.114*b;
          sum+=y; sumSq+=y*y; count++;
        }
        const avg=sum/count;
        const contrast=Math.sqrt(Math.max(0,sumSq/count-avg*avg));
        const score=avg*0.6+contrast*1.2+(avg*contrast/100)*0.5;
        samples.push({t, avg, contrast, score});
      }catch(e){
        samples.push({t, avg:0, contrast:0, score:0});
      }
    }
    // 5つの非重複窓を探す
    const windowSec = 2; // 各ショット2秒
    const windowSize = Math.ceil(windowSec / sampleStep);
    const margin = Math.ceil(1 / sampleStep); // 1秒のマージン
    const used = new Array(samples.length).fill(false);
    const bestWindows=[];
    for(let k=0;k<5;k++){
      let bestIdx=-1, bestScore=-1;
      for(let i=0;i<=samples.length-windowSize;i++){
        let overlap=false;
        for(let j=i;j<i+windowSize;j++){ if(used[j]){ overlap=true; break; } }
        if(overlap) continue;
        let winScore=0;
        for(let j=0;j<windowSize;j++) winScore+=samples[i+j].score;
        winScore/=windowSize;
        if(winScore>bestScore){ bestScore=winScore; bestIdx=i; }
      }
      if(bestIdx===-1) break;
      bestWindows.push({idx:bestIdx, score:bestScore, sample:samples[bestIdx]});
      for(let j=Math.max(0,bestIdx-margin); j<Math.min(samples.length, bestIdx+windowSize+margin); j++) used[j]=true;
    }
    // 時間順にソート
    bestWindows.sort((a,b)=> a.idx - b.idx);
    return bestWindows.map(w=> ({
      time: samples[w.idx].t,
      score: w.score,
      avg: samples[w.idx].avg,
      contrast: samples[w.idx].contrast
    }));
  },[seekVideo]);

  const playWebAudioBgm = useCallback((type)=>{
    stopWebAudioBgm();

      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      bgmAudioContextRef.current=ctx;
      const masterGain = ctx.createGain();
      masterGain.gain.value = bgmVolume*0.35;
      masterGain.connect(ctx.destination);
      if(type==='chill'){
        // Lofi風: 低いサイン波+少しの揺らぎ - ずっと鳴る
        const osc = ctx.createOscillator();
        osc.type='sine';
        osc.frequency.value=110;
        const gain = ctx.createGain();
        gain.gain.value=0.15;
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        bgmOscillatorsRef.current.push(osc);
        const osc2 = ctx.createOscillator();
        osc2.type='triangle';
        osc2.frequency.value=220;
        const gain2 = ctx.createGain();
        gain2.gain.value=0.08;
        osc2.connect(gain2);
        gain2.connect(masterGain);
        osc2.start();
        bgmOscillatorsRef.current.push(osc2);
        // LFOで少し揺らす
        const lfo = ctx.createOscillator();
        lfo.frequency.value=0.3;
        const lfoGain = ctx.createGain();
        lfoGain.gain.value=5;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start();
        bgmOscillatorsRef.current.push(lfo);
      } else if(type==='happy'){
        // Happy: 明るいメジャーコードのアルペジオ - ずっとループ
        let nextNoteTime = ctx.currentTime;
        const scheduleHappyLoop = ()=>{
          if(bgmTrackRef.current!==type) return;
          const now = ctx.currentTime;
          if(now>=nextNoteTime-0.1){
            const freqs=[261.63,329.63,392,523.25,392,329.63];
            const f = freqs[Math.floor(Math.random()*freqs.length)];
            const osc = ctx.createOscillator();
            osc.type='sine';
            osc.frequency.value=f;
            const gain = ctx.createGain();
            gain.gain.value=0;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.18, now+0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now+0.6);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now+0.7);
            nextNoteTime = now + 0.35 + Math.random()*0.2;
          }
          if(bgmTrackRef.current===type){
            setTimeout(scheduleHappyLoop, 100);
          }
        };
        scheduleHappyLoop();
        // ベース音はずっと鳴る
        const bass = ctx.createOscillator();
        bass.type='sine';
        bass.frequency.value=130.81;
        const bassGain = ctx.createGain();
        bassGain.gain.value=0.06;
        bass.connect(bassGain);
        bassGain.connect(masterGain);
        bass.start();
        bgmOscillatorsRef.current.push(bass);
      } else if(type==='cinematic'){
        // Cinematic: 低いドローン+高いパッド - ずっと鳴る
        const osc = ctx.createOscillator();
        osc.type='sawtooth';
        osc.frequency.value=55;
        const filter = ctx.createBiquadFilter();
        filter.type='lowpass';
        filter.frequency.value=400;
        filter.Q.value=5;
        const gain = ctx.createGain();
        gain.gain.value=0.12;
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        osc.start();
        bgmOscillatorsRef.current.push(osc);
        const osc2 = ctx.createOscillator();
        osc2.type='sine';
        osc2.frequency.value=220;
        const gain2 = ctx.createGain();
        gain2.gain.value=0.08;
        osc2.connect(gain2);
        gain2.connect(masterGain);
        osc2.start();
        bgmOscillatorsRef.current.push(osc2);
        // ゆっくりフィルタを動かす
        const lfo = ctx.createOscillator();
        lfo.frequency.value=0.05;
        const lfoGain = ctx.createGain();
        lfoGain.gain.value=200;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();
        bgmOscillatorsRef.current.push(lfo);
      }
    }catch(e){ console.warn('WebAudio BGM failed', e); }

    let overIndex = filtered.length; // デフォルトは末尾
    for(let i=0;i<filtered.length;i++){
      const cr = filtered[i].getBoundingClientRect();
      const mid = cr.top + cr.height/2;
      if(e.clientY < mid){ overIndex = i; break; }

  const handleClipBarPointerMove = useCallback((e)=>{
    if(!draggingClipBar) return;
    const deltaX = e.clientX - draggingClipBar.startX;
    const deltaTime = (deltaX / draggingClipBar.containerWidth) * durationRef.current;
    const clip = clipsRef.current.find(c=> c.id===draggingClipBar.id);
    if(!clip) return;
    if(draggingClipBar.type==='move'){
      let newStart = draggingClipBar.origStart + deltaTime;
      newStart = Math.max(0, Math.min(newStart, durationRef.current - clip.duration));
      const arr=[...clipsRef.current];
      const fromIdx=arr.findIndex(c=> c.id===draggingClipBar.id);
      // 他のクリップの中央を基準に挿入位置を決定（上→下バグ修正）
      let toIdx = arr.length-1;
      // fromを除外したリストで判定
      const others = arr.filter((_,i)=> i!==fromIdx);
      let insertPos = others.length;
      for(let i=0;i<others.length;i++){
        const otherMid = others[i].timelineStart + others[i].duration/2;
        if(newStart + clip.duration/2 < otherMid){
          insertPos = i;
          break;
        }
      }
      // insertPosを元の配列のインデックスに変換
      if(fromIdx < insertPos){
        toIdx = insertPos;
        // 削除後の配列では1つずれるので、削除前に調整
        if(toIdx > fromIdx) toIdx = insertPos;
      } else {
        toIdx = insertPos;
      }
      // 0.25秒以上動いたら並び替え実行
      if(Math.abs(deltaTime)>0.15 && toIdx!==fromIdx){
        const [moved]=arr.splice(fromIdx,1);
        const finalIdx = fromIdx < toIdx ? Math.max(0, toIdx- (toIdx>fromIdx?0:0)) : toIdx;

        setDraggingClipBar(prev=> prev ? {...prev, origStart: recomputed.find(c=>c.id===draggingClipBar.id)?.timelineStart||0, startX: e.clientX } : prev);
      }
    } else if(draggingClipBar.type==='right'){
      const newDur = Math.max(0.3, draggingClipBar.origDuration + deltaTime);
      setClips(prev=>{
        const arr=prev.map(c=> c.id===draggingClipBar.id ? {...c, duration:newDur} : c);
        const recomputed=recomputeStarts(arr);
        setDuration(Math.max(...recomputed.map(c=>c.timelineStart+c.duration)));

      });
