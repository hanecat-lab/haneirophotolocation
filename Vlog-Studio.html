<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Vlog Studio v11 - タイムライン編集に動画バー表示</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@400;700&family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@400;700&family=Reggae+One&family=Dela+Gothic+One&family=RocknRoll+One&family=Kiwi+Maru:wght@400;500&family=Hachi+Maru+Pop&family=Stick&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class' }</script>
<style>
html,body,#root{ background:#0a0a0b !important; margin:0; min-height:100%; height:100%; overscroll-behavior:none; }
body::before{ content:''; position:fixed; inset:0; background:#0a0a0b; z-index:-1; pointer-events:none; }
[data-scrollable]{ overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
#main-canvas{ background:#0a0a0b; display:block; touch-action:none; }
.preview-wrap{ width:min(92vw, calc(56vh * var(--aspect, 1.777))); aspect-ratio:var(--aspect,16/9); margin:8px auto; border-radius:12px; background:#000; position:relative; overflow:hidden; flex-shrink:0; }
.preview-wrap.fullscreen{ position:fixed !important; inset:0 !important; z-index:80 !important; width:100vw !important; height:100vh !important; aspect-ratio:auto !important; margin:0 !important; border-radius:0 !important; }
.filler-black{ background:#0a0a0b; min-height:240px; }
</style>
</head>
<body class="bg-[#0a0a0b] text-white">
<div id="root"></div>
<script type="module">
import React, { useRef, useState, useEffect, useCallback } from 'https://esm.sh/react@18.2.0';
import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';

const FILTERS = [
  {id:'none', name:'なし', desc:'オリジナル', css:'none', dot:'⚪️', previewBg:'linear-gradient(135deg,#222,#444)'},
  {id:'clean', name:'窓際クリーン', desc:'明るく清潔・白い光', css:'brightness(1.35) contrast(1.15) saturate(1.35) sepia(0.02)', dot:'☀️', previewBg:'linear-gradient(135deg,#fff,#dbeafe)'},
  {id:'tokimeki', name:'ときめき6枚羽根', desc:'柔らかく煌めくピンク', css:'brightness(1.4) contrast(0.85) saturate(1.8) sepia(0.12) hue-rotate(-12deg)', dot:'💖', previewBg:'linear-gradient(135deg,#ffd1dc,#ffe4ec)'},
  {id:'cinema', name:'シネマ', desc:'映画のような深み・ティール&オレンジ', css:'contrast(1.45) brightness(0.82) saturate(0.55) sepia(0.35) hue-rotate(-18deg)', dot:'🎬', previewBg:'linear-gradient(135deg,#0f172a,#fb923c)'},
  {id:'vintage', name:'ヴィンテージ', desc:'懐かしい暖色・フィルム', css:'sepia(0.75) contrast(1.25) brightness(1.15) saturate(0.65) hue-rotate(-10deg)', dot:'📷', previewBg:'linear-gradient(135deg,#fde68a,#d97706)'},
  {id:'mono', name:'モノクロ', desc:'白黒・クール・高コントラスト', css:'grayscale(1) contrast(1.5) brightness(1.15)', dot:'◼️', previewBg:'linear-gradient(135deg,#e5e7eb,#111827)'},
  {id:'sepia', name:'セピア', desc:'褐色・レトロ・濃いめ', css:'sepia(1) contrast(1.25) brightness(1.1) saturate(0.6) hue-rotate(-5deg)', dot:'🟤', previewBg:'linear-gradient(135deg,#d6b48c,#5a3e1b)'},
  {id:'cool', name:'クールブルー', desc:'青み・涼しげ・強い', css:'brightness(1.15) contrast(1.25) saturate(0.5) hue-rotate(200deg) sepia(0.25)', dot:'💧', previewBg:'linear-gradient(135deg,#60a5fa,#1e40af)'},
  {id:'warm', name:'ウォームオレンジ', desc:'暖かみ・夕焼け・強い', css:'brightness(1.25) contrast(1.15) saturate(1.8) sepia(0.4) hue-rotate(-25deg)', dot:'🔥', previewBg:'linear-gradient(135deg,#fdba74,#dc2626)'},
  {id:'vivid', name:'鮮やか', desc:'彩度MAX・ポップ・ビビッド', css:'saturate(2.5) contrast(1.35) brightness(1.12) hue-rotate(2deg)', dot:'🌈', previewBg:'linear-gradient(135deg,#f472b6,#facc15,#34d399)'},
  {id:'faded', name:'フェード', desc:'淡い・柔らか・白っぽ・マット', css:'brightness(1.4) contrast(0.65) saturate(0.45) sepia(0.12)', dot:'☁️', previewBg:'linear-gradient(135deg,#f3f4f6,#9ca3af)'},
  {id:'night', name:'ナイト', desc:'夜・ムーディ・ダーク', css:'brightness(0.6) contrast(1.5) saturate(0.5) hue-rotate(240deg) sepia(0.3)', dot:'🌙', previewBg:'linear-gradient(135deg,#1e1b4b,#312e81)'},
  {id:'sakura', name:'サクラ', desc:'桜色・ふんわり・ピンク強め', css:'brightness(1.3) contrast(0.85) saturate(1.8) hue-rotate(-20deg) sepia(0.18)', dot:'🌸', previewBg:'linear-gradient(135deg,#fbcfe8,#ec4899)'},
  {id:'emerald', name:'エメラルド', desc:'緑が鮮やか・自然・濃い', css:'brightness(1.15) contrast(1.25) saturate(2) hue-rotate(45deg)', dot:'🌿', previewBg:'linear-gradient(135deg,#6ee7b7,#065f46)'},
];

function App(){
  const canvasRef = useRef(null);
  const previewWrapRef = useRef(null);
  const videoRefs = useRef(new Map());
  const bgmAudioRef = useRef(null);
  const rafTickRef = useRef(0);
  const playingRef = useRef(false);
  const timeRef = useRef(0);
  const aspectRef = useRef(16/9);
  const isDraggingRef = useRef(false);
  const dragTargetRef = useRef(null);
  const syncScheduledRef = useRef(false);
  const timelineClipsRef = useRef(null);
  const timelineTextsRef = useRef(null);
  const timelineEditHorizontalRef = useRef(null);

  const clipsRef = useRef([]);
  const textsRef = useRef([]);
  const modeRef = useRef('normal');
  const durationRef = useRef(3);
  const drawFrameRef = useRef(()=>{});
  const lastFrameHasVideoRef = useRef(false);
  const activeFilterRef = useRef('none');
  const filterIntensityRef = useRef(100);
  const bgmOffsetRef = useRef(0);

  const [clips, setClips] = useState([]);
  const [texts, setTexts] = useState([]);
  const [currentTime, setCurrentTime] = useState(0);
  const [duration, setDuration] = useState(3);
  const [isPlaying, setIsPlaying] = useState(false);
  const [activeTab, setActiveTab] = useState('material');
  const [mode, setMode] = useState('normal');
  const [ghost, setGhost] = useState(null);
  const [dropIndicator, setDropIndicator] = useState(null);
  const [playbackRate, setPlaybackRate] = useState(1);
  const [aspectMode, setAspectMode] = useState('9:16');
  const [fitMode, setFitMode] = useState('cover');
  const [showSwipe, setShowSwipe] = useState(false);
  const [swipeIndex, setSwipeIndex] = useState(0);
  const [fiveShotMode, setFiveShotMode] = useState(false);
  const [activeFilter, setActiveFilter] = useState('none');
  const [filterIntensity, setFilterIntensity] = useState(100);
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [analyzeProgress, setAnalyzeProgress] = useState(0);
  const [analyzeText, setAnalyzeText] = useState('');
  const [analyzeReason, setAnalyzeReason] = useState('');
  const [bgmTrack, setBgmTrack] = useState('none');
  const [bgmOffset, setBgmOffset] = useState(0);
  const [bgmVolume, setBgmVolume] = useState(0.5);
  const [draggingClipId, setDraggingClipId] = useState(null);
  const [draggingText, setDraggingText] = useState(null);
  const [draggingClipBar, setDraggingClipBar] = useState(null);
  const [selectedTextId, setSelectedTextId] = useState(null);

  useEffect(()=>{ clipsRef.current = clips; },[clips]);
  useEffect(()=>{ textsRef.current = texts; },[texts]);
  useEffect(()=>{ modeRef.current = mode; },[mode]);
  useEffect(()=>{ durationRef.current = duration; },[duration]);
  useEffect(()=>{ activeFilterRef.current = activeFilter; drawFrameRef.current(timeRef.current); },[activeFilter]);
  useEffect(()=>{ bgmOffsetRef.current = bgmOffset; },[bgmOffset]);

  useEffect(()=>{
    document.documentElement.style.background='#0a0a0b';
    document.body.style.background='#0a0a0b';
    return ()=>{ cancelAnimationFrame(rafTickRef.current); playingRef.current=false; };
  },[]);

  const drawFrame = useCallback((t)=>{
    const c = canvasRef.current;
    if(!c) return;
    const ctx = c.getContext('2d', {alpha:false});
    if(!ctx) return;
    const cw=c.width, ch=c.height;
    if(cw<10||ch<10) return;
    const clipsNow = clipsRef.current;
    const textsNow = textsRef.current;
    let activeClip=null;
    let localTime=0;
    for(const clip of clipsNow){
      if(t>=clip.timelineStart && t<clip.timelineStart+clip.duration){
        activeClip=clip;
        localTime=t-clip.timelineStart;
        break;
      }
    }
    if(!activeClip && clipsNow.length>0){
      if(t>=durationRef.current-0.05){
        activeClip=clipsNow[clipsNow.length-1];
        localTime=Math.max(0, activeClip.duration-0.05);
      } else if(t<=0.05){
        activeClip=clipsNow[0];
        localTime=0;
      } else {
        activeClip=clipsNow[0];
        localTime=0;
      }
    }
    if(!activeClip){
      if(clipsNow.length===0){
        ctx.filter='none';
        ctx.fillStyle='#0a0a0b';
        ctx.fillRect(0,0,cw,ch);
        ctx.fillStyle='rgba(255,255,255,0.18)';
        ctx.font=`${Math.round(ch*0.05)}px sans-serif`;
        ctx.textAlign='center';
        ctx.fillText('動画を追加してください', cw/2, ch/2);
        lastFrameHasVideoRef.current=false;
      }
    } else {
      const v=videoRefs.current.get(activeClip.id);
      if(v){
        try{
          const trimStart = activeClip.trimStart || 0;
          const targetTime = trimStart + localTime;
          const seekThreshold = playingRef.current ? 0.14 : 0.28;
          if(Math.abs(v.currentTime - targetTime) > seekThreshold){
            try{ v.currentTime = Math.max(0, Math.min(targetTime, (v.duration||999)-0.02)); }catch{}
          }
          if(v.readyState>=1){
            // 背景はフィルターなしで塗る
            ctx.filter='none';
            ctx.fillStyle='#0a0a0b';
            ctx.fillRect(0,0,cw,ch);
            const f = FILTERS.find(x=> x.id===activeFilterRef.current);
            // 強度を反映: 100%がベース、0%でnone、200%でさらに強く
            let css = f ? f.css : 'none';
            if(f && f.id!=='none' && filterIntensity!==100){
              const factor = filterIntensity/100;
              if(factor<1){
                // 弱める: noneに近づけるためopacityで調整はできないので、filterを薄めるにはglobalAlphaではなく、css自体を弱める近似
                // 簡易的に brightness と saturate を factor で補正
                css = `brightness(${0.8 + 0.2*factor + (f.id==='clean'||f.id==='vivid'?0.2*factor:0)}) ` + css;
              } else {
                css = css + ` brightness(${0.9 + 0.1*factor}) saturate(${factor})`;
              }
            }
            ctx.filter = css;
            // CSS filterはcanvas全体にかかるためテキストも暗くなるバグがあるので使わない
            // ctx.filterのみで動画に適用
            if(canvasRef.current){
              canvasRef.current.style.filter = 'none';
            }
            const vr = (v.videoWidth && v.videoHeight) ? v.videoWidth/v.videoHeight : 16/9;
            const cr=cw/ch;
            let dw,dh,dx,dy;
            const isCover = fitMode==='cover';
            if(isCover){
              if(vr>cr){ dh=ch; dw=ch*vr; dx=(cw-dw)/2; dy=0; }
              else{ dw=cw; dh=cw/vr; dx=0; dy=(ch-dh)/2; }
            } else {
              if(vr>cr){ dw=cw; dh=cw/vr; dx=0; dy=(ch-dh)/2; }
              else{ dh=ch; dw=ch*vr; dx=(cw-dw)/2; dy=0; }
            }
            ctx.drawImage(v,dx,dy,dw,dh);
            if(activeFilterRef.current==='tokimeki'){
              ctx.filter='none';
              ctx.globalCompositeOperation='screen';
              const grad = ctx.createRadialGradient(cw*0.75, ch*0.25, 0, cw*0.75, ch*0.25, cw*0.8);
              grad.addColorStop(0, 'rgba(255,200,220,0.22)');
              grad.addColorStop(0.3, 'rgba(255,255,255,0.08)');
              grad.addColorStop(1, 'rgba(0,0,0,0)');
              ctx.fillStyle=grad;
              ctx.fillRect(0,0,cw,ch);
              ctx.globalAlpha=0.18;
              ctx.fillStyle='white';
              for(let i=0;i<6;i++){
                const ang = (i/6)*Math.PI*2;
                const x = cw*0.75 + Math.cos(ang)*20;
                const y = ch*0.25 + Math.sin(ang)*20;
                ctx.beginPath();
                ctx.arc(x,y,2,0,Math.PI*2);
                ctx.fill();
              }
              ctx.globalAlpha=1;
              ctx.globalCompositeOperation='source-over';
            } else {
              ctx.filter='none';
            }
            lastFrameHasVideoRef.current=true;
            if(!playingRef.current && v.videoWidth){
              aspectRef.current=v.videoWidth/v.videoHeight;
              previewWrapRef.current?.style.setProperty('--aspect', String(aspectRef.current));
            }
          }
        }catch(e){}
      }
    }
    const activeTexts = (modeRef.current==='textEdit' || modeRef.current==='fullscreen' || modeRef.current==='timeline' || modeRef.current==='swipe') ? textsNow : textsNow.filter(txt=> t>=txt.start && t<=txt.end);
    activeTexts.forEach(txt=>{
      let alpha=1;
      const prog=(t-txt.start)/Math.max(0.01, txt.end-txt.start);
      // フェードイン・アウト
      if(prog<0.15) alpha=prog/0.15; else if(prog>0.85) alpha=(1-prog)/0.15;
      // アニメーション別のアルファ補正
      if(txt.anim==='fade'){
        if(prog<0.25) alpha*=prog/0.25;
        if(prog>0.75) alpha*=(1-prog)/0.25;
      }
      // 完全に透明なら描画スキップ（黒残り防止）
      if(alpha<=0.01) return;
      ctx.save();
      ctx.filter='none';
      ctx.globalAlpha=Math.max(0,Math.min(1,alpha));
      const fontSize = Math.round(ch * (txt.fontSize || 0.06));
      const weight = txt.bold ? 'bold ' : '';
      const familyMap = {
        sans:'"Noto Sans JP", sans-serif',
        serif:'"Noto Serif JP", serif',
        rounded:'"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif',
        pop:'"M PLUS Rounded 1c", sans-serif',
        hand:'"Kosugi Maru", cursive',
        yuji:'"Yuji Syuku", cursive',
        shippori:'"Shippori Mincho", serif',
        reggae:'"Reggae One", cursive',
        dela:'"Dela Gothic One", cursive',
        rock:'"RocknRoll One", sans-serif',
        kiwi:'"Kiwi Maru", serif',
        hachi:'"Hachi Maru Pop", cursive',
        stick:'"Stick", sans-serif'
      };
      const family = familyMap[txt.fontFamily||'sans'] || 'sans-serif';
      ctx.font=`${weight}${fontSize}px ${family}`;
      ctx.textAlign = txt.align || 'center';
      ctx.textBaseline='middle';
      // アニメーションの最終位置を計算（黒残りバグの根本修正）
      const baseX=(txt.x/100)*cw;
      const baseY=(txt.y/100)*ch;
      let finalX=baseX;
      let finalY=baseY;
      if(txt.anim==='bounce'){
        const bounceY = Math.sin(prog*Math.PI*6)* (fontSize*0.18) * (prog<0.35?1:0);
        finalY = baseY + bounceY;
      } else if(txt.anim==='slide'){
        const slideX = (1-prog)*40 * (prog<0.35?1:0);
        finalX = baseX + slideX;
      }
      // 背景
      if(txt.bgColor && txt.bgColor!=='transparent'){
        const metrics = ctx.measureText(txt.text);
        const bgW = metrics.width + fontSize*0.6;
        const bgH = fontSize*1.4;
        let bx = finalX - bgW/2;
        if(txt.align==='left') bx = finalX;
        if(txt.align==='right') bx = finalX - bgW;
        ctx.fillStyle = txt.bgColor;
        ctx.globalAlpha = Math.max(0,Math.min(1,alpha)) * 0.85;
        ctx.fillRect(bx, finalY - bgH/2, bgW, bgH);
        ctx.globalAlpha = Math.max(0,Math.min(1,alpha));
      }
      // 縁取りは最終位置に1回だけ描画（黒残りバグ修正）
      if(txt.outline){
        ctx.shadowColor='rgba(0,0,0,0.75)';
        ctx.shadowBlur=12;
        ctx.lineWidth=Math.max(2, fontSize*0.14);
        ctx.strokeStyle= txt.strokeColor || 'rgba(0,0,0,0.85)';
        ctx.lineJoin='round';
        ctx.miterLimit=2;
        ctx.strokeText(txt.text, finalX, finalY);
      }
      ctx.shadowColor='transparent';
      ctx.shadowBlur=0;
      ctx.fillStyle= txt.color || '#fff';
      ctx.fillText(txt.text, finalX, finalY);
      ctx.restore();
    });
  },[fitMode, filterIntensity]);
  useEffect(()=>{ drawFrameRef.current = drawFrame; },[drawFrame]);

  const syncCanvasSize = useCallback((force=false)=>{
    if(!force && syncScheduledRef.current) return;
    syncScheduledRef.current=true;
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
      syncScheduledRef.current=false;
      const c=canvasRef.current, wrap=previewWrapRef.current;
      if(!c||!wrap) return;
      const isFs = modeRef.current==='fullscreen' || wrap.classList.contains('fullscreen');
      const dpr=window.devicePixelRatio||1;
      let targetW, targetH;
      if(isFs){ targetW=window.innerWidth; targetH=window.innerHeight; }
      else {
        const cw=wrap.clientWidth;
        targetW = cw<10 ? 320 : cw;
        if(aspectMode==='9:16'){
          targetH = targetW * 16/9;
        } else {
          targetH = targetW / (aspectRef.current||16/9);
        }
      }
      if(!force && !isFs && playingRef.current){
        drawFrameRef.current(timeRef.current);
        return;
      }
      if(!force && Math.abs(c.width/dpr-targetW)<1.5 && Math.abs(c.height/dpr-targetH)<1.5){
        drawFrameRef.current(timeRef.current);
        return;
      }
      c.width=Math.max(10,targetW*dpr);
      c.height=Math.max(10,targetH*dpr);
      if(isFs){ c.style.width='100vw'; c.style.height='100vh'; }
      else{ c.style.width=targetW+'px'; c.style.height=targetH+'px'; }
      drawFrameRef.current(timeRef.current);
      requestAnimationFrame(()=> drawFrameRef.current(timeRef.current));
    }); });
  },[aspectMode]);

  const tick = useCallback(()=>{
    if(!playingRef.current) return;
    const now=performance.now();
    const last=tick._last||now;
    let delta=(now-last)/1000*playbackRate;
    if(delta>0.15) delta=0.08;
    if(delta<0) delta=0;
    tick._last=now;
    timeRef.current+=delta;
    if(timeRef.current>=durationRef.current-0.02){
      timeRef.current=0;
      if(bgmAudioRef.current){
        try{ bgmAudioRef.current.currentTime = bgmOffsetRef.current; }catch{}
      }
      setCurrentTime(0);
      handleStop();
      return;
    }
    if(Math.floor(timeRef.current*10)!==Math.floor(currentTime*10)){
      setCurrentTime(timeRef.current);
    }
    const clipsNow = clipsRef.current;
    let active=null;
    let local=0;
    for(const clip of clipsNow){
      if(timeRef.current>=clip.timelineStart && timeRef.current<clip.timelineStart+clip.duration){
        active=clip;
        local=timeRef.current-clip.timelineStart;
        break;
      }
    }
    if(active){
      const v=videoRefs.current.get(active.id);
      if(v){
        const target = (active.trimStart||0)+local;
        if(Math.abs(v.currentTime-target)>0.14){
          try{ v.currentTime=target; }catch{}
        }
        if(v.paused){
          try{ const p=v.play(); if(p&&p.catch) p.catch(()=>{}); }catch{}
        }
      }
      clipsNow.forEach(c=>{
        if(c.id!==active.id){
          const ov=videoRefs.current.get(c.id);
          const av=videoRefs.current.get(active.id);
          if(ov && ov!==av && !ov.paused){
            try{ ov.pause(); }catch{}
          }
        }
      });
    }
    if(bgmAudioRef.current && bgmTrack!=='none'){
      const bgmTarget = timeRef.current + bgmOffsetRef.current;
      if(Math.abs(bgmAudioRef.current.currentTime - bgmTarget) > 0.3){
        try{ bgmAudioRef.current.currentTime = Math.max(0, bgmTarget); }catch{}
      }
    }
    drawFrameRef.current(timeRef.current);
    rafTickRef.current=requestAnimationFrame(tick);
  },[playbackRate, currentTime, bgmTrack]);

  const handlePlay = useCallback(()=>{
    if(playingRef.current) return;
    if(timeRef.current>=durationRef.current-0.05){
      timeRef.current=0;
      setCurrentTime(0);
      clipsRef.current.forEach(clip=>{
        const v=videoRefs.current.get(clip.id);
        if(v){
          try{ v.currentTime = clip.trimStart||0; }catch{}
        }
      });
      if(bgmAudioRef.current){
        try{ bgmAudioRef.current.currentTime = bgmOffsetRef.current; }catch{}
      }
    }
    cancelAnimationFrame(rafTickRef.current);
    playingRef.current=true;
    setIsPlaying(true);
    tick._last=performance.now();
    clipsRef.current.forEach(clip=>{
      const v=videoRefs.current.get(clip.id);
      if(v){
        const local=timeRef.current-clip.timelineStart;
        if(local>=0 && local<clip.duration){
          const target=(clip.trimStart||0)+local;
          try{ if(Math.abs(v.currentTime-target)>0.2) v.currentTime=target; }catch{}
        }
      }
    });
    if(bgmAudioRef.current && bgmTrack!=='none'){
      try{ bgmAudioRef.current.play().catch(()=>{}); }catch{}
    }
    setTimeout(()=>{
      if(playingRef.current){
        rafTickRef.current=requestAnimationFrame(tick);
      }
    }, 30);
  },[tick, bgmTrack]);

  const handleStop = useCallback(()=>{
    playingRef.current=false;
    setIsPlaying(false);
    tick._last=0;
    cancelAnimationFrame(rafTickRef.current);
    videoRefs.current.forEach(v=>{ try{ v.pause(); }catch{} });
    if(bgmAudioRef.current){ try{ bgmAudioRef.current.pause(); }catch{} }
    drawFrameRef.current(timeRef.current);
  },[]);

  const setModeSafe = useCallback((m)=>{
    modeRef.current=m;
    setMode(m);
    if(m==='fullscreen'){
      setTimeout(()=> syncCanvasSize(true), 50);
      setTimeout(()=> syncCanvasSize(true), 220);

  const seekVideo = useCallback((video, time)=>{

      let done=false;

  const analyzeClipBrightnessContrast = useCallback(async (video, clip)=>{
    const realDur = (video && isFinite(video.duration) && video.duration>0) ? video.duration : (clip.duration + (clip.trimStart||0));
    const startOffset = clip.trimStart||0;
    const duration = Math.min(clip.duration, realDur - startOffset);
    if(duration<=3.1) return {trimStart: startOffset, reason:'short', score:0};
    const sampleStep = 0.2;
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const samples=[];
    const totalSteps = Math.ceil(duration / sampleStep);
    for(let i=0;i<totalSteps;i++){
      const t = i*sampleStep;
      if(t>duration) break;
      const targetTime = startOffset + t;
      await seekVideo(video, targetTime);
      try{
        ctx.drawImage(video, 0, 0, 32, 32);
        const data = ctx.getImageData(0,0,32,32).data;
        let sum=0, sumSq=0, count=0;
        for(let p=0;p<data.length;p+=4){
          const r=data[p], g=data[p+1], b=data[p+2];
          // 輝度 Y
          const y = 0.299*r + 0.587*g + 0.114*b;
          sum+=y;
          sumSq+=y*y;
          count++;
        }
        const avg = sum/count;
        const variance = Math.max(0, sumSq/count - avg*avg);
        const contrast = Math.sqrt(variance);
        // ランタンみたいな「暗い中に明るい」シーンはコントラストが高いので重みを上げる
        // score = 明るさ*0.6 + コントラスト*1.0 + 明るさ*コントラストの相乗効果
        const score = avg*0.6 + contrast*1.2 + (avg*contrast/100)*0.5;
        samples.push({t, avg, contrast, score});
      }catch(e){
        samples.push({t, avg:0, contrast:0, score:0});
      }
    }
    // 3秒窓で最高スコアを探す
    const windowSize = Math.ceil(3 / sampleStep);
    let bestIdx=0, bestScore=-1, bestAvg=0, bestContrast=0;
    for(let i=0;i<=samples.length-windowSize;i++){
      let winScore=0, winAvg=0, winContrast=0;
      for(let j=0;j<windowSize;j++){
        winScore+=samples[i+j].score;
        winAvg+=samples[i+j].avg;
        winContrast+=samples[i+j].contrast;
      }
      winScore/=windowSize;
      winAvg/=windowSize;
      winContrast/=windowSize;
      if(winScore>bestScore){
        bestScore=winScore;
        bestIdx=i;
        bestAvg=winAvg;
        bestContrast=winContrast;
      }
    }
    // スコアのばらつきが小さい場合は中央にフォールバック
    const scores = samples.map(s=>s.score);
    const meanScore = scores.reduce((a,b)=>a+b,0)/Math.max(1,scores.length);
    const stdScore = Math.sqrt(scores.reduce((a,b)=>a+(b-meanScore)*(b-meanScore),0)/Math.max(1,scores.length));
    if(stdScore < 4 || bestScore < 10){
      const mid = duration/2;
      let newTrim = startOffset + mid - 1.5;
      newTrim = Math.max(0, Math.min(newTrim, Math.max(0, realDur-3)));
      return {trimStart:newTrim, reason:'uniform-center', score:bestScore, avg:bestAvg, contrast:bestContrast};
    }
    const bestTime = samples[bestIdx].t;
    let newTrim = startOffset + bestTime;
    newTrim = Math.max(0, Math.min(newTrim, Math.max(0, realDur-3)));
    // 理由を判定
    let reason='bright';
    if(bestContrast > 35 && bestAvg > 60) reason='contrast-lantern';
    else if(bestAvg > 150) reason='bright-sunny';
    else if(bestContrast > 30) reason='contrast';
    return {trimStart:newTrim, reason, score:bestScore, avg:bestAvg, contrast:bestContrast, bestTime};
  },[seekVideo]);

  const handleGood3Sec = useCallback(async ()=>{
    if(clipsRef.current.length===0) return;

    setIsAnalyzing(true);
    setAnalyzeProgress(0);
    setAnalyzeText('明るさ+コントラストを解析中...');
    setAnalyzeReason('');
    const newClips=[];
    let reasons=[];
    for(let idx=0; idx<clipsRef.current.length; idx++){
      const c = clipsRef.current[idx];
      const v = videoRefs.current.get(c.id);
      setAnalyzeText(`解析中 ${idx+1}/${clipsRef.current.length}: ${c.name.slice(0,12)}...`);
      setAnalyzeProgress(Math.round((idx/clipsRef.current.length)*100));
      if(!v || c.duration<=3.1){
        newClips.push(c);
        reasons.push('short');
        continue;
      }
      try{
        // 一時停止
        try{ v.pause(); }catch{}
        const result = await analyzeClipBrightnessContrast(v, c);
        newClips.push({...c, trimStart: result.trimStart, duration:3, _analyzeReason: result.reason, _analyzeScore: result.score});
        reasons.push(result.reason);
        if(idx===0){
          setAnalyzeReason(result.reason);

      }catch(e){
        // 失敗時は中央
        const mid = c.duration/2;
        let newTrim = (c.trimStart||0) + mid - 1.5;
        const realDur = (v && isFinite(v.duration) && v.duration>0) ? v.duration : (c.duration + (c.trimStart||0));
        newTrim = Math.max(0, Math.min(newTrim, Math.max(0, realDur-3)));
        newClips.push({...c, trimStart:newTrim, duration:3, _analyzeReason:'fallback-center'});
        reasons.push('fallback');
      }
    }
    const recomputed = recomputeStarts(newClips);
    recomputed.forEach(nc=>{
      const v = videoRefs.current.get(nc.id);
      if(v){
        try{ v.currentTime = nc.trimStart||0; if(!v.paused) v.pause(); }catch{}
      }
    });
    setClips(recomputed);
    const maxEnd=recomputed.length ? Math.max(...recomputed.map(c=>c.timelineStart+c.duration)) : 3;
    setDuration(maxEnd);
    durationRef.current=maxEnd;
    timeRef.current=0;
    setCurrentTime(0);
    lastFrameHasVideoRef.current=false;
    setAnalyzeProgress(100);
    // 理由表示
    const reasonMap = {
      'bright':'☀️ 最も明るい瞬間',
      'bright-sunny':'☀️ 窓際クリーンな明るさ',
      'contrast':'✨ 明暗差が大きいエモい瞬間',
      'contrast-lantern':'🏮 ランタンみたいに暗い中に光る瞬間',
      'uniform-center':'真ん中（明るさが均一だったため）',
      'short':'短いのでそのまま',
      'fallback-center':'中央（解析失敗のフォールバック）'
    };
    const mainReason = reasons[0] || 'bright';
    setAnalyzeText(`完了: ${reasonMap[mainReason]||mainReason} を3秒抽出`);
    setTimeout(()=> { drawFrameRef.current(0); }, 30);
    setTimeout(()=> { drawFrameRef.current(0); syncCanvasSize(true); setIsAnalyzing(false); }, 500);

    let overIndex = filtered.length; // デフォルトは末尾
    for(let i=0;i<filtered.length;i++){
      const cr = filtered[i].getBoundingClientRect();
      const mid = cr.top + cr.height/2;
      if(e.clientY < mid){ overIndex = i; break; }

    setDropIndicator(overIndex);

  const handleClipPointerUp = useCallback((e)=>{

      // filtered基準のtoIndexをそのまま使う（削除後の配列に直接挿入）
      const insertAt = Math.max(0, Math.min(toIndex, arr.length));
      arr.splice(insertAt,0,moved);

    e.stopPropagation();
    const container = timelineEditHorizontalRef.current;
    if(!container) return;
    const clip = clipsRef.current.find(c=> c.id===clipId);
    if(!clip) return;
    setDraggingClipBar({
      id: clipId,
      type, // move | left | right
      startX: e.clientX,

      origDuration: clip.duration,

  const handleClipBarPointerMove = useCallback((e)=>{
    if(!draggingClipBar) return;
    const deltaX = e.clientX - draggingClipBar.startX;
    const deltaTime = (deltaX / draggingClipBar.containerWidth) * durationRef.current;
    const clip = clipsRef.current.find(c=> c.id===draggingClipBar.id);
    if(!clip) return;
    if(draggingClipBar.type==='move'){
      let newStart = draggingClipBar.origStart + deltaTime;
      newStart = Math.max(0, Math.min(newStart, durationRef.current - clip.duration));
      const arr=[...clipsRef.current];
      const fromIdx=arr.findIndex(c=> c.id===draggingClipBar.id);
      // 他のクリップの中央を基準に挿入位置を決定（上→下バグ修正）
      let toIdx = arr.length-1;
      // fromを除外したリストで判定
      const others = arr.filter((_,i)=> i!==fromIdx);
      let insertPos = others.length;
      for(let i=0;i<others.length;i++){
        const otherMid = others[i].timelineStart + others[i].duration/2;
        if(newStart + clip.duration/2 < otherMid){
          insertPos = i;
          break;
        }
      }
      // insertPosを元の配列のインデックスに変換
      if(fromIdx < insertPos){
        toIdx = insertPos;
        // 削除後の配列では1つずれるので、削除前に調整
        if(toIdx > fromIdx) toIdx = insertPos;
      } else {
        toIdx = insertPos;
      }
      // 0.25秒以上動いたら並び替え実行
      if(Math.abs(deltaTime)>0.15 && toIdx!==fromIdx){
        const [moved]=arr.splice(fromIdx,1);
        const finalIdx = fromIdx < toIdx ? Math.max(0, toIdx- (toIdx>fromIdx?0:0)) : toIdx;
        // 正しくは filtered基準で挿入
        const filtered = arr; // fromを削除済み
        filtered.splice(insertPos,0,moved);
        const recomputed=recomputeStarts(filtered);
        setClips(recomputed);
        setDraggingClipBar(prev=> prev ? {...prev, origStart: recomputed.find(c=>c.id===draggingClipBar.id)?.timelineStart||0, startX: e.clientX } : prev);
      }
    } else if(draggingClipBar.type==='right'){
      const newDur = Math.max(0.3, draggingClipBar.origDuration + deltaTime);
      setClips(prev=>{
        const arr=prev.map(c=> c.id===draggingClipBar.id ? {...c, duration:newDur} : c);
        const recomputed=recomputeStarts(arr);
        setDuration(Math.max(...recomputed.map(c=>c.timelineStart+c.duration)));
        durationRef.current=Math.max(...recomputed.map(c=>c.timelineStart+c.duration));
        return recomputed;
      });
    } else if(draggingClipBar.type==='left'){
      // 左端トリム: trimStartを増やし、durationを減らし、timelineStartを進める
      const newTrim = Math.max(0, draggingClipBar.origTrimStart + deltaTime);
      const maxTrim = draggingClipBar.origTrimStart + draggingClipBar.origDuration - 0.3;
      const clampedTrim = Math.min(newTrim, maxTrim);
      const deltaTrim = clampedTrim - draggingClipBar.origTrimStart;
      const newDur = draggingClipBar.origDuration - deltaTrim;
      const newStart = draggingClipBar.origStart + deltaTrim;
      setClips(prev=>{
        const arr=prev.map(c=> c.id===draggingClipBar.id ? {...c, trimStart:clampedTrim, duration:newDur, timelineStart:newStart} : c);
        const recomputed=recomputeStarts(arr);
        setDuration(Math.max(...recomputed.map(c=>c.timelineStart+c.duration)));
        durationRef.current=Math.max(...recomputed.map(c=>c.timelineStart+c.duration));
        return recomputed;
      });
    }
  },[draggingClipBar]);

            onPointerUp:handleTextPointerUp
          },
            React.createElement('div', {className:'flex h-[48px] items-center', style:{width:`${Math.max(400, duration*80)}px`}},
              texts.map(t=>{
                const left=(t.start/duration)*100;
                const w=((t.end-t.start)/duration)*100;
                const isDragging = draggingText && draggingText.id===t.id;
                return React.createElement('div', {
                  key:t.id,
                  className:`absolute top-2 h-8 rounded-lg border text-[9px] flex items-center select-none ${isDragging?'bg-yellow-400 border-white z-10':'bg-yellow-500/30 border-yellow-500'}`,
                  style:{left:`${left}%`, width:`${Math.max(5,w)}%`}
                },
                  React.createElement('div', {
                    onPointerDown:e=> handleTextPointerDown(e, t.id, 'left'),
                    className:'w-4 h-full bg-yellow-500/60 flex items-center justify-center cursor-ew-resize touch-none'
                  }, '‹'),
                  React.createElement('div', {
                    onPointerDown:e=> handleTextPointerDown(e, t.id, 'move'),
                    className:'flex-1 h-full flex items-center px-1 truncate cursor-grab touch-none'
                  }, t.text.slice(0,8)),
                  React.createElement('div', {
                    onPointerDown:e=> handleTextPointerDown(e, t.id, 'right'),
                    className:'w-4 h-full bg-yellow-500/60 flex items-center justify-center cursor-ew-resize touch-none'
                  }, '›')
                );
              })
            ),
            React.createElement('div', {className:'absolute top-0 bottom-0 w-[2px] bg-white/60 pointer-events-none', style:{left:`${(currentTime/duration)*100}%`}})
          )
        ),
        // 縦リスト（並び替え用）
        React.createElement('div', {className:'p-3'},
          React.createElement('div', {className:'text-[11px] text-white/60 mb-2'}, 'CLIPS縦リスト: 長押しドラッグで順序変更'),
          React.createElement('div', {ref:timelineClipsRef, className:'flex flex-col gap-2 mb-6', onPointerMove:handleClipPointerMove, onPointerUp:handleClipPointerUp},
            clips.map((c,i)=>
              React.createElement('div', {
                key:c.id,
                'data-clip-id': c.id,
                onPointerDown:e=> handleClipPointerDown(e, c.id),
                className:`h-[56px] rounded-xl bg-[#111113] border flex items-center px-3 relative select-none touch-none ${draggingClipId===c.id?'opacity-40 border-violet-500':'border-white/10'}`
              },
                dropIndicator===i && React.createElement('div', {className:'absolute left-0 top-0 bottom-0 w-[4px] bg-violet-500 rounded-full'}),
                React.createElement('div', {className:'w-10 h-10 rounded-lg bg-black flex items-center justify-center mr-2'}, '📼'),
                React.createElement('div', {className:'flex-1 min-w-0'},
                  React.createElement('div', {className:'text-[12px] truncate'}, c.name),
                  React.createElement('div', {className:'text-[11px] text-white/50'}, `${c.timelineStart.toFixed(1)}s → ${(c.timelineStart+c.duration).toFixed(1)}s`)
                ),
                React.createElement('div', {className:'text-[10px] text-white/30'}, '≡')
              )
            )
          ),
          React.createElement('div', {className:'mt-4 p-3 rounded-xl bg-white/5 text-[11px] text-white/50'},
            '使い方: 上の横バーで紫=動画、黄=テキストの位置を把握。動画バーの ‹ › でトリム、中央で移動（並び替え）。テキストも同様にドラッグで開始・終了・位置を変更。変更はプレビューに即時反映。'
          ),
          React.createElement('button', {onClick:()=> setModeSafe('normal'), className:'mt-6 w-full h-12 rounded-full bg-white text-black font-bold'}, '✓ 完了してメインに戻る'),
          React.createElement('div', {className:'h-[200px] bg-[#0a0a0b]'})
        )
      )
    )
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
