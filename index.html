<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1028">
  <title>5</title>
  <style>
    :root {
      --ink: #071028;
      --navy: #111d46;
      --violet: #43329a;
      --aqua: #54e0dc;
      --peach: #ffbd8b;
      --sun: #ffd25f;
      --pink: #ff7694;
      --white: #fffdf8;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #060a1d;
      font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .app {
      isolation: isolate;
      position: relative;
      width: 100%;
      height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(84, 224, 220, .18), transparent 31%),
        radial-gradient(circle at 8% 73%, rgba(255, 118, 148, .25), transparent 36%),
        radial-gradient(circle at 93% 70%, rgba(255, 210, 95, .2), transparent 34%),
        linear-gradient(160deg, #101f57 0%, #182b67 43%, #251f60 100%);
    }

    .app::before,
    .app::after {
      content: "";
      pointer-events: none;
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .8;
      z-index: -1;
    }

    .app::before {
      width: 15rem;
      height: 15rem;
      top: 10%;
      left: -6rem;
      background: radial-gradient(circle, rgba(255, 185, 132, .6), rgba(255, 185, 132, 0) 69%);
      animation: drift 7s ease-in-out infinite alternate;
    }

    .app::after {
      width: 19rem;
      height: 19rem;
      bottom: -6rem;
      right: -8rem;
      background: radial-gradient(circle, rgba(113, 93, 236, .56), rgba(113, 93, 236, 0) 68%);
      animation: drift 8s ease-in-out infinite alternate-reverse;
    }

    .sparkle-field,
    .sparkle-field::before,
    .sparkle-field::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 13% 22%, rgba(255,255,255,.9) 0 2px, transparent 2.5px),
        radial-gradient(circle at 85% 18%, rgba(255,230,155,.95) 0 2px, transparent 2.5px),
        radial-gradient(circle at 81% 46%, rgba(213,251,255,.9) 0 1.5px, transparent 2px),
        radial-gradient(circle at 17% 73%, rgba(255,208,218,.95) 0 1.5px, transparent 2px),
        radial-gradient(circle at 51% 88%, rgba(255,255,255,.85) 0 1.5px, transparent 2px);
      opacity: .85;
    }

    .sparkle-field::before,
    .sparkle-field::after { content: ""; animation: twinkle 2.5s ease-in-out infinite alternate; }
    .sparkle-field::after { animation-delay: -1.1s; opacity: .5; transform: scale(1.18); }

    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      padding: max(1.4rem, env(safe-area-inset-top)) 1.35rem max(1.25rem, env(safe-area-inset-bottom));
    }

    .ring {
      grid-row: 1 / 4;
      width: min(77vw, 19rem);
      aspect-ratio: 1;
      border-radius: 50%;
      position: relative;
      align-self: center;
      justify-self: center;
      background: conic-gradient(from -90deg, rgba(255,255,255,.88), rgba(84,224,220,.95), rgba(255,118,148,.92), rgba(255,210,95,.96), rgba(255,255,255,.88));
      padding: 5px;
      box-shadow: 0 18px 50px rgba(3, 9, 35, .38), 0 0 0 7px rgba(255,255,255,.1);
      transition: transform .3s ease, opacity .35s ease;
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 11px;
      border-radius: inherit;
      background: rgba(14, 27, 79, .8);
      box-shadow: inset 0 2px 16px rgba(255,255,255,.14);
    }

    .ring::after {
      content: "";
      position: absolute;
      inset: -15px;
      border-radius: inherit;
      background: radial-gradient(circle, rgba(255,255,255,.21), transparent 67%);
      opacity: .7;
      z-index: -1;
      animation: aura 2.6s ease-in-out infinite alternate;
    }

    .mascot-button {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: transparent;
      color: inherit;
    }

    .mascot-wrap {
      position: relative;
      width: 68%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 14px 10px rgba(4, 8, 38, .3));
      transform-origin: center bottom;
    }

    .mascot-wrap.is-bouncing { animation: mascotBounce 1s cubic-bezier(.31,.03,.4,1) infinite !important; will-change: transform; }

    .mascot-shadow {
      position: absolute;
      bottom: -10%;
      width: 55%;
      height: 10%;
      border-radius: 50%;
      background: rgba(3, 8, 37, .32);
      filter: blur(6px);
      transition: transform .14s ease, opacity .14s ease;
    }

    .mascot-shadow.is-bouncing { animation: shadowPulse 1s cubic-bezier(.31,.03,.4,1) infinite !important; }

    svg { overflow: visible; display: block; width: 100%; height: 100%; }

    .mascot-body { fill: url(#bodyGradient); stroke: rgba(255,255,255,.8); stroke-width: 3; }
    .mascot-shine { fill: rgba(255,255,255,.48); }
    .mascot-cheek { fill: rgba(255,115,154,.48); }
    .face { fill: #202452; }
    .star { fill: #fff2bd; filter: drop-shadow(0 1px 4px rgba(255,217,100,.6)); }

    .counter {
      position: absolute;
      z-index: 4;
      top: 50%;
      left: 50%;
      display: grid;
      place-items: center;
      width: 48%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      color: var(--white);
      font-weight: 900;
      font-size: clamp(4rem, 20vw, 6.6rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.1em;
      text-indent: -.1em;
      text-shadow: 0 4px 0 rgba(32, 32, 89, .32), 0 0 24px rgba(255,255,255,.54);
      background: rgba(26, 41, 103, .65);
      box-shadow: inset 0 1px 10px rgba(255,255,255,.32), 0 9px 25px rgba(4,8,38,.2);
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
    }

    .counter.pop { animation: numberPop .45s cubic-bezier(.1,.8,.22,1); }
    .app.is-finale .counter { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
    .app.is-finale .ring { opacity: .12; transform: scale(.8); }

    .control {
      grid-row: 3;
      align-self: end;
      position: relative;
      z-index: 4;
      width: 4.4rem;
      height: 4.4rem;
      display: grid;
      place-items: center;
      padding: 0;
      border: 3px solid rgba(255,255,255,.86);
      border-radius: 50%;
      color: #17215a;
      background: linear-gradient(145deg, #fff5cf, #ffbd8b);
      box-shadow: 0 11px 22px rgba(5,8,38,.32), inset 0 1px 0 rgba(255,255,255,.8);
      cursor: pointer;
      transition: transform .2s ease, opacity .25s ease;
    }

    .control:active { transform: scale(.93); }
    .control:focus-visible, .mascot-button:focus-visible { outline: 4px solid #fff; outline-offset: 6px; }

    .control-icon {
      width: 0;
      height: 0;
      margin-left: .28rem;
      border-top: .65rem solid transparent;
      border-bottom: .65rem solid transparent;
      border-left: 1rem solid currentColor;
    }

    .app.is-counting .control { opacity: 0; pointer-events: none; transform: translateY(1rem); }
    .app.is-finale .control { opacity: 1; pointer-events: auto; }
    .app.is-finale .control-icon {
      width: 1.5rem;
      height: 1.5rem;
      margin: 0;
      border: solid currentColor;
      border-width: 0 0 4px 4px;
      border-radius: 50%;
      transform: rotate(45deg);
    }
    .app.is-finale .control-icon::after {
      content: "";
      position: absolute;
      width: 0;
      height: 0;
      margin: .95rem 0 0 .95rem;
      border-top: .32rem solid transparent;
      border-bottom: .32rem solid transparent;
      border-left: .48rem solid currentColor;
      transform: rotate(-45deg);
    }

    #fireworks {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s ease;
    }

    .app.is-finale #fireworks { opacity: 1; }

    .settings-toggle {
      position: absolute;
      z-index: 8;
      left: max(1rem, env(safe-area-inset-left));
      bottom: max(1rem, env(safe-area-inset-bottom));
      width: 2.8rem;
      height: 2.8rem;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(180, 232, 255, .68);
      border-radius: .78rem;
      color: #d7f8ff;
      background: linear-gradient(145deg, rgba(255,255,255,.3), rgba(15,46,99,.55)), rgba(28,79,139,.45);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 7px 17px rgba(3,8,36,.3), 0 0 9px rgba(92,214,255,.18);
      backdrop-filter: blur(8px) saturate(140%);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .settings-toggle svg { width: 1.46rem; height: 1.46rem; }
    .settings-toggle:active { transform: scale(.92); }
    .settings-toggle:focus-visible, .option-button:focus-visible, .panel-tab:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .settings-toggle[aria-expanded="true"] { background: linear-gradient(145deg, rgba(229,254,255,.48), rgba(40,130,187,.55)); box-shadow: inset 0 1px 0 rgba(255,255,255,.78), 0 0 14px rgba(102,229,255,.48); }

    .option-dock {
      position: absolute;
      z-index: 7;
      left: max(1rem, env(safe-area-inset-left));
      bottom: calc(max(1rem, env(safe-area-inset-bottom)) + 3.25rem);
      width: min(15.2rem, calc(100vw - 2rem));
      display: grid;
      gap: .48rem;
      padding: .52rem;
      border: 1px solid rgba(179,232,255,.48);
      border-radius: 1rem;
      background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(8,28,72,.5)), rgba(16,50,108,.34);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 25px rgba(3,8,36,.25);
      backdrop-filter: blur(11px) saturate(145%);
      opacity: 0;
      pointer-events: none;
      transform: translateY(.55rem) scale(.96);
      transform-origin: left bottom;
      transition: opacity .2s ease, transform .2s ease;
    }
    .option-dock.is-open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .option-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: .3rem; }
    .panel-tab {
      position: relative;
      min-width: 0;
      height: 2.15rem;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(171,225,255,.42);
      border-radius: .52rem;
      color: #aeeeff;
      background: rgba(11,39,88,.38);
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .panel-tab svg { width: 1.18rem; height: 1.18rem; }
    .panel-tab[aria-selected="true"] { border-color: rgba(182,247,255,.92); color: #efffff; background: rgba(91,194,244,.28); box-shadow: inset 0 0 8px rgba(126,229,255,.22), 0 0 6px rgba(99,222,255,.23); transform: translateY(-1px); }
    .panel-tab[aria-selected="true"]::after { content: ""; position: absolute; bottom: .2rem; width: .72rem; height: 1px; background: #d8ffff; box-shadow: 0 0 5px #7eeaff; }
    .option-panel { display: none; grid-template-columns: repeat(5, 2.15rem); justify-content: space-between; gap: .35rem; }
    .option-panel.is-active { display: grid; }
    .option-panel[data-panel="launch"] { grid-template-columns: repeat(4, 2.15rem); }
    .option-panel[data-panel="finale"] { grid-template-columns: repeat(3, 2.15rem); }

    .option-button {
      width: 2.15rem;
      height: 2.15rem;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: .62rem;
      color: #1c2b68;
      background: rgba(255,255,255,.82);
      box-shadow: 0 4px 10px rgba(3,8,36,.18);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .option-button svg { width: 1.3rem; height: 1.3rem; overflow: visible; }
    .option-button:active { transform: scale(.9); }
    .option-button[aria-pressed="true"] { border-color: #ffcc69; background: #fff4cf; transform: translateY(-2px); }
    .app.is-counting .option-dock, .app.is-counting .settings-toggle { opacity: 0; pointer-events: none; transform: translateY(.6rem); }

    .palette-mark { display: flex; gap: 2px; align-items: center; }
    .palette-mark i { width: .47rem; height: .47rem; border-radius: 50%; display: block; }
    .palette-mark.sunset i:nth-child(1), .palette-mark.candy i:nth-child(3) { background:#ff846c; }
    .palette-mark.sunset i:nth-child(2) { background:#ffd36d; }
    .palette-mark.sunset i:nth-child(3) { background:#d27bd9; }
    .palette-mark.ocean i:nth-child(1) { background:#5be4e1; }
    .palette-mark.ocean i:nth-child(2) { background:#79a8ff; }
    .palette-mark.ocean i:nth-child(3) { background:#b28cf2; }
    .palette-mark.candy i:nth-child(1) { background:#ff96ba; }
    .palette-mark.candy i:nth-child(2) { background:#8de6cb; }
    .palette-mark.gold i:nth-child(1) { background:#fff2aa; }
    .palette-mark.gold i:nth-child(2) { background:#ffbf50; }
    .palette-mark.gold i:nth-child(3) { background:#ff804d; }
    .palette-mark.aurora i:nth-child(1) { background:#72f2c2; }
    .palette-mark.aurora i:nth-child(2) { background:#72b8ff; }
    .palette-mark.aurora i:nth-child(3) { background:#e09aff; }

    .firework-mark { position: relative; width: 1.45rem; height: 1.45rem; display: block; }
    .firework-mark::before, .firework-mark::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
    .firework-mark.burst::before { background: repeating-conic-gradient(#ff9b78 0 8deg, transparent 8deg 30deg); }
    .firework-mark.burst::after { inset: .48rem; background: #ffcb76; }
    .firework-mark.willow::before { border: 3px dotted #76c6ff; border-top-color: transparent; transform: rotate(12deg) scale(.9); }
    .firework-mark.willow::after { width: .15rem; height: .82rem; inset: .2rem auto auto .65rem; border-radius: .2rem; background: #8de6cb; box-shadow: -.38rem .22rem 0 -.04rem #8de6cb, .38rem .22rem 0 -.04rem #8de6cb; }
    .firework-mark.ring::before { border: 3px solid #ba9bff; box-shadow: inset 0 0 0 3px transparent; }
    .firework-mark.ring::after { inset: .4rem; border: 2px solid #76e7ed; }
    .firework-mark.chrysanthemum::before { background: repeating-conic-gradient(#ffd476 0 4deg, transparent 4deg 11deg); }
    .firework-mark.chrysanthemum::after { inset: .38rem; border: 2px solid #fff0a8; box-shadow: 0 0 5px #ffb65e; }
    .firework-mark.heart::before { background: #ff8fb4; clip-path: polygon(50% 92%, 10% 55%, 1% 31%, 9% 12%, 27% 8%, 50% 28%, 73% 8%, 91% 12%, 99% 31%, 90% 55%); }
    .firework-mark.heart::after { inset: .52rem; background: #fff1f6; }

    .shot-mark { display: flex; align-items: flex-end; justify-content: center; gap: 2px; width: 1.5rem; height: 1.45rem; }
    .shot-mark i { display: block; width: .22rem; height: .94rem; border-radius: .25rem .25rem .1rem .1rem; background: linear-gradient(#fff1a2, #ff8b71); box-shadow: 0 0 3px #ffb265; }
    .shot-mark i::before { content: ""; display: block; width: 0; height: 0; margin: -.3rem 0 0 -.05rem; border-left: .16rem solid transparent; border-right: .16rem solid transparent; border-bottom: .34rem solid #7f4ced; }

    .grand-mark { position: relative; width: 1.5rem; height: 1.45rem; display: block; }
    .grand-mark::before, .grand-mark::after { content: ""; position: absolute; border-radius: 50%; background: repeating-conic-gradient(#ffbd69 0 9deg, transparent 9deg 28deg); filter: drop-shadow(0 0 2px #ffd86c); }
    .grand-mark.crown::before { width: 1.25rem; height: 1.25rem; left: .12rem; top: .16rem; }
    .grand-mark.crown::after { width: .45rem; height: .45rem; left: .53rem; top: .56rem; background: #fff2aa; }
    .grand-mark.twin::before { width: .78rem; height: .78rem; left: 0; top: .2rem; }
    .grand-mark.twin::after { width: .78rem; height: .78rem; right: 0; top: .46rem; }
    .grand-mark.cascade::before { width: .62rem; height: .62rem; left: .02rem; top: .08rem; }
    .grand-mark.cascade::after { width: .62rem; height: .62rem; right: .03rem; bottom: .05rem; }

    .frequency-mark { position: relative; width: 1.5rem; height: 1.45rem; display: grid; place-items: center; }
    .frequency-mark i { position: absolute; display: block; width: .34rem; height: .34rem; border-radius: 50%; background: #ffbd69; box-shadow: 0 0 3px #ffd76c; }
    .frequency-mark.fast i:nth-child(1) { left: .10rem; top: .54rem; } .frequency-mark.fast i:nth-child(2) { right: .10rem; top: .54rem; }
    .frequency-mark.medium i:nth-child(1) { left: .06rem; top: .54rem; } .frequency-mark.medium i:nth-child(2) { left: .58rem; top: .15rem; } .frequency-mark.medium i:nth-child(3) { right: .06rem; bottom: .12rem; }
    .frequency-mark.slow i:nth-child(1) { left: .04rem; top: .56rem; } .frequency-mark.slow i:nth-child(2) { left: .42rem; top: .16rem; } .frequency-mark.slow i:nth-child(3) { right: .12rem; bottom: .16rem; } .frequency-mark.slow i:nth-child(4) { left: .56rem; bottom: .02rem; } .frequency-mark.slow i:nth-child(5) { right: .01rem; top: .52rem; }

    .formation-mark { position: relative; width: 1.5rem; height: 1.45rem; display: block; }
    .formation-mark i { position: absolute; display: block; width: .24rem; height: .84rem; border-radius: .2rem .2rem .08rem .08rem; background: linear-gradient(#fff4a8, #ff8c71); box-shadow: 0 0 3px #ffb665; }
    .formation-mark i::before { content: ""; position: absolute; left: -.05rem; top: -.28rem; width: 0; height: 0; border-left: .17rem solid transparent; border-right: .17rem solid transparent; border-bottom: .32rem solid #8961ed; }
    .formation-mark.fan i:nth-child(1) { left: .63rem; bottom: .06rem; transform: rotate(-25deg); } .formation-mark.fan i:nth-child(2) { left: .63rem; bottom: .09rem; } .formation-mark.fan i:nth-child(3) { left: .63rem; bottom: .06rem; transform: rotate(25deg); }
    .formation-mark.line i:nth-child(1) { left: .15rem; bottom: .12rem; } .formation-mark.line i:nth-child(2) { left: .63rem; bottom: .12rem; } .formation-mark.line i:nth-child(3) { right: .15rem; bottom: .12rem; }
    .formation-mark.triangle i:nth-child(1) { left: .17rem; bottom: .08rem; } .formation-mark.triangle i:nth-child(2) { right: .17rem; bottom: .08rem; } .formation-mark.triangle i:nth-child(3) { left: .63rem; top: .12rem; }
    .formation-mark.comet i:nth-child(1) { left: .15rem; bottom: .08rem; transform: rotate(-31deg); } .formation-mark.comet i:nth-child(2) { left: .63rem; bottom: .32rem; transform: rotate(-31deg); } .formation-mark.comet i:nth-child(3) { right: .15rem; top: .06rem; transform: rotate(-31deg); }

    /* Transparent instrument-panel treatment for all firework controls. */
    .palette-option, .firework-option, .shot-option, .finale-option, .frequency-option, .formation-option {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid rgba(180, 227, 255, .48);
      border-radius: .58rem;
      color: #bdeeff;
      background: linear-gradient(145deg, rgba(255,255,255,.22), rgba(255,255,255,.035) 39%, rgba(8, 22, 62, .48) 40%), rgba(31, 72, 130, .31);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.38), inset 0 0 0 1px rgba(7,22,60,.22), 0 5px 13px rgba(3,8,36,.22);
      backdrop-filter: blur(8px) saturate(145%);
    }
    .palette-option::before, .firework-option::before, .shot-option::before, .finale-option::before, .frequency-option::before, .formation-option::before {
      content: "";
      position: absolute;
      inset: .22rem;
      z-index: 0;
      border: 1px solid rgba(181,233,255,.23);
      border-radius: .36rem;
      background: linear-gradient(90deg, rgba(160,237,255,.24) 1px, transparent 1px), linear-gradient(rgba(160,237,255,.24) 1px, transparent 1px);
      background-size: .32rem .32rem;
      mask-image: linear-gradient(135deg, #000, transparent 82%);
      opacity: .7;
      pointer-events: none;
    }
    .palette-option > *, .firework-option > *, .shot-option > *, .finale-option > *, .frequency-option > *, .formation-option > * { position: relative; z-index: 1; }
    .palette-option[aria-pressed="true"], .firework-option[aria-pressed="true"], .shot-option[aria-pressed="true"], .finale-option[aria-pressed="true"], .frequency-option[aria-pressed="true"], .formation-option[aria-pressed="true"] {
      border-color: rgba(168,246,255,.96);
      color: #effeff;
      background: linear-gradient(145deg, rgba(226,252,255,.34), rgba(125,222,255,.15) 42%, rgba(12,44,96,.61)), rgba(38,113,176,.38);
      box-shadow: 0 0 0 1px rgba(159,241,255,.25), 0 0 13px rgba(91,225,255,.36), inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 15px rgba(101,214,255,.2);
      transform: translateY(-2px);
    }
    .palette-option[aria-pressed="true"]::after, .firework-option[aria-pressed="true"]::after, .shot-option[aria-pressed="true"]::after, .finale-option[aria-pressed="true"]::after, .frequency-option[aria-pressed="true"]::after, .formation-option[aria-pressed="true"]::after {
      content: "";
      position: absolute;
      right: .25rem;
      top: .25rem;
      z-index: 2;
      width: .22rem;
      height: .22rem;
      border-radius: 50%;

    .formation-mark { border: 1px solid rgba(177,232,255,.5); border-radius: .35rem; background: linear-gradient(90deg, transparent 48%, rgba(172,238,255,.38) 49% 51%, transparent 52%); }

    .app[data-firework-style="ring"] .bloom { background: radial-gradient(circle, #fffdf4 0 4%, var(--bloom) 5% 8%, transparent 9% 34%, var(--bloom) 35% 38%, transparent 39%); }
    .app[data-firework-style="willow"] .bloom { border-radius: 46% 46% 52% 52%; background: radial-gradient(circle, #fffdf4 0 4%, var(--bloom) 5% 8%, transparent 9%), repeating-conic-gradient(from 180deg, var(--bloom) 0 4deg, transparent 4deg 16deg); }
    .app[data-firework-style="chrysanthemum"] .bloom { background: radial-gradient(circle, #fffdf4 0 3%, var(--bloom) 4% 7%, transparent 8%), repeating-conic-gradient(from 0deg, var(--bloom) 0 3deg, transparent 3deg 9deg); filter: drop-shadow(0 0 9px var(--bloom)); }
    .app[data-firework-style="heart"] .bloom { border-radius: 0; background: radial-gradient(circle at 50% 42%, #fff9fa 0 3%, var(--bloom) 4% 9%, transparent 10%), repeating-conic-gradient(from 225deg, var(--bloom) 0 5deg, transparent 5deg 20deg); clip-path: polygon(50% 96%, 6% 56%, 0 33%, 9% 12%, 27% 7%, 50% 27%, 73% 7%, 91% 12%, 100% 33%, 94% 56%); }

    .app[data-palette="ocean"] {
      background:
        radial-gradient(circle at 50% 0%, rgba(89, 232, 226, .22), transparent 33%),
        radial-gradient(circle at 6% 75%, rgba(96, 139, 255, .28), transparent 36%),

    .app[data-palette="gold"] {

        radial-gradient(circle at 50% 0%, rgba(255, 232, 151, .26), transparent 35%),

    .firework-blooms {
      position: absolute;
      inset: 0;
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .app.is-finale .firework-blooms { opacity: 1; }

    .bloom {
      --bloom: #ffca63;
      position: absolute;
      width: clamp(6.5rem, 28vw, 9.5rem);
      aspect-ratio: 1;
      border-radius: 50%;
      opacity: 0;
      background:
        radial-gradient(circle, #fffdf4 0 4%, var(--bloom) 5% 8%, transparent 9%),
        repeating-conic-gradient(from 2deg, var(--bloom) 0 5deg, transparent 5deg 18deg);
      filter: drop-shadow(0 0 7px var(--bloom));
      transform: scale(.1);
      transform-origin: center;
    }

    .bloom.one { top: 14%; left: 6%; --bloom: var(--bloom-one, #ffbe70); }
    .bloom.two { top: 21%; right: 5%; --bloom: var(--bloom-two, #76e7ed); }
    .bloom.three { top: 48%; left: 34%; --bloom: var(--bloom-three, #ff84b2); }
    .bloom.grand { top: 17%; left: 50%; width: clamp(10.5rem, 46vw, 15rem); --bloom: var(--bloom-grand, #fff0a8); filter: drop-shadow(0 0 12px var(--bloom)) drop-shadow(0 0 28px rgba(255,255,255,.42)); transform: translateX(-50%) scale(.08); }
    .bloom.grand-alt { top: 29%; right: 9%; width: clamp(8.5rem, 35vw, 12rem); --bloom: var(--bloom-grand-alt, #ff9fc3); filter: drop-shadow(0 0 10px var(--bloom)); transform: scale(.08); }
    .app.is-finale .bloom { animation: burstBloom 2.7s ease-out infinite; }
    .app.is-finale .bloom.two { animation-delay: -.9s; }
    .app.is-finale .bloom.three { animation-delay: -1.8s; }
    .app.is-finale .bloom.grand, .app.is-finale .bloom.grand-alt { animation: none; }
    .app.grand-burst[data-finale-style="crown"] .bloom.grand { animation: grandBloom 2.7s cubic-bezier(.12,.7,.22,1) both; }
    .app.grand-burst[data-finale-style="twin"] .bloom.grand { top: 18%; left: 29%; width: clamp(8.6rem, 35vw, 12rem); animation: grandTwinLeft 2.6s cubic-bezier(.12,.7,.22,1) both; }
    .app.grand-burst[data-finale-style="twin"] .bloom.grand-alt { top: 24%; right: 7%; animation: grandTwinRight 2.6s cubic-bezier(.12,.7,.22,1) both .18s; }
    .app.grand-burst[data-finale-style="cascade"] .bloom.grand { top: 12%; left: 18%; width: clamp(7.8rem, 31vw, 10.5rem); animation: grandCascadeOne 2.55s cubic-bezier(.12,.7,.22,1) both; }
    .app.grand-burst[data-finale-style="cascade"] .bloom.grand-alt { top: 39%; right: 9%; width: clamp(8.4rem, 34vw, 11.5rem); animation: grandCascadeTwo 2.55s cubic-bezier(.12,.7,.22,1) both .3s; }
    .app.grand-burst .bloom.one, .app.grand-burst .bloom.two, .app.grand-burst .bloom.three { animation-duration: 1.9s; filter: drop-shadow(0 0 10px var(--bloom)); }
    .app.golden-crown .bloom.grand { top: 11%; left: 50%; width: clamp(12rem, 53vw, 17rem); clip-path: none; border-radius: 50%; background: radial-gradient(circle, #fffdf2 0 3%, #fff3a8 4% 8%, transparent 9%), repeating-conic-gradient(from 0deg, #fff7c1 0 2deg, #ffc85a 2deg 6deg, transparent 6deg 12deg); filter: drop-shadow(0 0 16px #ffe69a) drop-shadow(0 0 32px rgba(255,190,77,.55)); animation: goldenCrown 2.75s cubic-bezier(.12,.7,.22,1) both; }
    .app.golden-crown .bloom.grand-alt { top: 29%; right: 9%; width: clamp(7.3rem, 30vw, 10rem); clip-path: none; border-radius: 50%; background: radial-gradient(circle, #fffdf2 0 4%, #ffc85a 5% 9%, transparent 10%), repeating-conic-gradient(from 0deg, #ffc85a 0 3deg, transparent 3deg 13deg); animation: goldenCrownAlt 2.35s cubic-bezier(.12,.7,.22,1) both .19s; }

    .stardust-field { position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; }
    .stardust-field .star-dot { position: absolute; width: .3rem; height: .3rem; border-radius: 50%; background: #fff9d8; box-shadow: 0 0 8px #ffe78b, 0 0 16px rgba(255,205,92,.8); opacity: 0; transform: scale(.2); }
    .stardust-field .star-dot:nth-child(1) { left: 15%; top: 20%; --delay: 0s; } .stardust-field .star-dot:nth-child(2) { left: 34%; top: 12%; --delay: .22s; } .stardust-field .star-dot:nth-child(3) { left: 55%; top: 26%; --delay: .11s; } .stardust-field .star-dot:nth-child(4) { left: 76%; top: 16%; --delay: .34s; } .stardust-field .star-dot:nth-child(5) { left: 84%; top: 42%; --delay: .16s; } .stardust-field .star-dot:nth-child(6) { left: 64%; top: 55%; --delay: .43s; } .stardust-field .star-dot:nth-child(7) { left: 39%; top: 48%; --delay: .28s; } .stardust-field .star-dot:nth-child(8) { left: 20%; top: 60%; --delay: .52s; }
    .app.stardust .stardust-field { opacity: 1; }
    .app.stardust .star-dot { animation: stardustGlow 2.55s ease-out both; animation-delay: var(--delay); }

    @keyframes burstBloom {
      0%, 7% { opacity: 0; transform: scale(.06) rotate(0deg); }
      22% { opacity: 1; transform: scale(.88) rotate(10deg); }
      55% { opacity: .92; transform: scale(1.06) rotate(24deg); }
      100% { opacity: 0; transform: scale(1.34) rotate(38deg); }
    }

    @keyframes grandBloom {
      0%, 8% { opacity: 0; transform: translateX(-50%) scale(.06) rotate(-8deg); }
      20% { opacity: 1; transform: translateX(-50%) scale(.76) rotate(2deg); }
      38% { opacity: 1; transform: translateX(-50%) scale(1.04) rotate(14deg); }
      65% { opacity: .82; transform: translateX(-50%) scale(1.2) rotate(25deg); }
      100% { opacity: 0; transform: translateX(-50%) scale(1.42) rotate(34deg); }
    }

    @keyframes grandTwinLeft {
      0%, 9% { opacity: 0; transform: translateX(-50%) scale(.06) rotate(-12deg); }
      31% { opacity: 1; transform: translateX(-50%) scale(1.04) rotate(12deg); }
      65% { opacity: .86; transform: translateX(-50%) scale(1.22) rotate(28deg); }
      100% { opacity: 0; transform: translateX(-50%) scale(1.42) rotate(42deg); }
    }

    @keyframes grandTwinRight {
      0%, 9% { opacity: 0; transform: scale(.06) rotate(14deg); }
      31% { opacity: 1; transform: scale(1.03) rotate(-14deg); }
      65% { opacity: .86; transform: scale(1.2) rotate(-28deg); }
      100% { opacity: 0; transform: scale(1.4) rotate(-42deg); }
    }

    @keyframes grandCascadeOne {
      0%, 10% { opacity: 0; transform: translateX(-50%) scale(.06) rotate(-6deg); }
      30% { opacity: 1; transform: translateX(-50%) scale(1.06) rotate(12deg); }
      72% { opacity: .8; transform: translateX(-50%) scale(1.36) rotate(31deg); }
      100% { opacity: 0; transform: translateX(-50%) scale(1.52) rotate(39deg); }
    }

    @keyframes grandCascadeTwo {
      0%, 10% { opacity: 0; transform: scale(.06) rotate(6deg); }
      30% { opacity: 1; transform: scale(1.08) rotate(-12deg); }
      72% { opacity: .8; transform: scale(1.34) rotate(-31deg); }
      100% { opacity: 0; transform: scale(1.5) rotate(-39deg); }
    }

    @keyframes goldenCrown {
      0%, 8% { opacity: 0; transform: translateX(-50%) scale(.05) rotate(-10deg); }
      24% { opacity: 1; transform: translateX(-50%) scale(.86) rotate(4deg); }
      48% { opacity: 1; transform: translateX(-50%) scale(1.14) rotate(17deg); }
      75% { opacity: .86; transform: translateX(-50%) scale(1.34) rotate(31deg); }
      100% { opacity: 0; transform: translateX(-50%) scale(1.55) rotate(43deg); }
    }

    @keyframes goldenCrownAlt {
      0%, 10% { opacity: 0; transform: scale(.05) rotate(10deg); }
      30% { opacity: 1; transform: scale(1.04) rotate(-8deg); }
      72% { opacity: .82; transform: scale(1.32) rotate(-25deg); }
      100% { opacity: 0; transform: scale(1.48) rotate(-35deg); }
    }

    @keyframes stardustGlow {
      0%, 12% { opacity: 0; transform: scale(.15); }
      35% { opacity: .98; transform: scale(1.35); }
      60% { opacity: .85; transform: scale(.82); }
      100% { opacity: 0; transform: translateY(1.25rem) scale(.2); }
    }

    @keyframes mascotBounce {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      12% { transform: translateY(0) scale(1.08, .91); }
      44% { transform: translateY(-20%) scale(.95, 1.06); }
      64% { transform: translateY(-20%) scale(1.02, .98); }
      83% { transform: translateY(0) scale(.98, 1.02); }
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: .35; }
      44%, 64% { transform: scale(.55); opacity: .15; }
    }

    @keyframes numberPop {
      0% { transform: translate(-50%, -50%) scale(.6); opacity: .2; }
      60% { transform: translate(-50%, -50%) scale(1.14); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes aura { from { transform: scale(.9); opacity: .42; } to { transform: scale(1.08); opacity: .76; } }
    @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(2rem,-1.5rem,0) scale(1.16); } }
    @keyframes twinkle { from { opacity: .35; } to { opacity: .95; } }

    @media (min-aspect-ratio: 9/13) and (min-width: 700px) {
      .app { width: min(100vw, 30rem); height: min(100svh, 52rem); border-radius: 2.4rem; box-shadow: 0 30px 90px rgba(0,0,0,.5); }
      body { background: radial-gradient(circle at 50%, #18245b, #060a1d 70%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .mascot-wrap.is-bouncing, .mascot-shadow.is-bouncing { animation-duration: 1s !important; animation-iteration-count: infinite !important; }
    }
  </style>
</head>

        <button class="option-button shot-option" type="button" data-shots="1" aria-label="花火を1発同時に打ち上げる" aria-pressed="true"><span class="shot-mark" aria-hidden="true"><i></i></span></button><button class="option-button shot-option" type="button" data-shots="2" aria-label="花火を2発同時に打ち上げる" aria-pressed="false"><span class="shot-mark" aria-hidden="true"><i></i><i></i></span></button><button class="option-button shot-option" type="button" data-shots="3" aria-label="花火を3発同時に打ち上げる" aria-pressed="false"><span class="shot-mark" aria-hidden="true"><i></i><i></i><i></i></span></button><button class="option-button formation-option" type="button" data-formation="fan" aria-label="扇形の打ち上げ隊形" aria-pressed="true"><span class="formation-mark fan" aria-hidden="true"><i></i><i></i><i></i></span></button><button class="option-button formation-option" type="button" data-formation="line" aria-label="横一列の打ち上げ隊形" aria-pressed="false"><span class="formation-mark line" aria-hidden="true"><i></i><i></i><i></i></span></button><button class="option-button formation-option" type="button" data-formation="triangle" aria-label="三角形の打ち上げ隊形" aria-pressed="false"><span class="formation-mark triangle" aria-hidden="true"><i></i><i></i><i></i></span></button><button class="option-button formation-option" type="button" data-formation="comet" aria-label="流星列の打ち上げ隊形" aria-pressed="false"><span class="formation-mark comet" aria-hidden="true"><i></i><i></i><i></i></span></button>
      </div>
      <div class="option-panel" role="tabpanel" data-panel="finale">
        <button class="option-button finale-option" type="button" data-finale="crown" aria-label="中央大玉の豪華花火" aria-pressed="true"><span class="grand-mark crown" aria-hidden="true"></span></button><button class="option-button finale-option" type="button" data-finale="twin" aria-label="双輪の豪華花火" aria-pressed="false"><span class="grand-mark twin" aria-hidden="true"></span></button><button class="option-button finale-option" type="button" data-finale="cascade" aria-label="流星の豪華花火" aria-pressed="false"><span class="grand-mark cascade" aria-hidden="true"></span></button><button class="option-button frequency-option" type="button" data-frequency="2" aria-label="豪華花火を2回ごとに打ち上げる" aria-pressed="false"><span class="frequency-mark fast" aria-hidden="true"><i></i><i></i></span></button><button class="option-button frequency-option" type="button" data-frequency="4" aria-label="豪華花火を4回ごとに打ち上げる" aria-pressed="true"><span class="frequency-mark medium" aria-hidden="true"><i></i><i></i><i></i></span></button><button class="option-button frequency-option" type="button" data-frequency="6" aria-label="豪華花火を6回ごとに打ち上げる" aria-pressed="false"><span class="frequency-mark slow" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></button>
      </div>
    </div>
    <div class="firework-blooms" aria-hidden="true">
      <span class="bloom one"></span>
      <span class="bloom two"></span>
      <span class="bloom three"></span>
      <span class="bloom grand"></span>

    <div class="stardust-field" aria-hidden="true"><i class="star-dot"></i><i class="star-dot"></i><i class="star-dot"></i><i class="star-dot"></i><i class="star-dot"></i><i class="star-dot"></i><i class="star-dot"></i><i class="star-dot"></i></div>
    <section class="stage" aria-live="polite">
      <div class="ring">
        <button class="mascot-button" id="mascotButton" type="button" aria-label="カウントダウンを開始">
          <div class="mascot-wrap" aria-hidden="true">
            <div class="mascot-shadow"></div>
            <svg id="mascotSvg" viewBox="0 0 220 220" role="img" aria-hidden="true">
              <defs><linearGradient id="bodyGradient" x1="30" y1="15" x2="184" y2="204" gradientUnits="userSpaceOnUse"><stop stop-color="#fff3bf"/><stop offset=".45" stop-color="#ffbd8b"/><stop offset="1" stop-color="#ff7197"/></linearGradient></defs>
              <path class="star" d="M57 46l5 13 14 2-11 9 3 14-11-8-12 8 4-14-11-9 14-2z"/><path class="star" d="M169 44l3 8 9 2-7 6 2 9-8-5-8 5 2-9-7-6 9-2z"/>
              <path class="mascot-body" d="M110 34C71 34 43 66 43 106c0 39 28 72 67 84 39-12 67-45 67-84 0-40-28-72-67-72Z"/>
              <ellipse class="mascot-shine" cx="81" cy="75" rx="19" ry="29" transform="rotate(28 81 75)"/><ellipse class="mascot-cheek" cx="74" cy="126" rx="14" ry="8"/><ellipse class="mascot-cheek" cx="146" cy="126" rx="14" ry="8"/>
              <circle class="face" cx="82" cy="104" r="7"/><circle class="face" cx="138" cy="104" r="7"/><path class="face" d="M89 131c12 13 30 13 42 0" fill="none" stroke="#202452" stroke-width="7" stroke-linecap="round"/><circle fill="white" cx="80" cy="102" r="2"/><circle fill="white" cx="136" cy="102" r="2"/>
            </svg>
          </div>
        </button>
      </div>
      <output class="counter" id="counter" aria-label="5">5</output>
      <button class="control" id="controlButton" type="button" aria-label="カウントダウンを開始">
        <span class="control-icon" aria-hidden="true"></span>
      </button>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const duration = 5;
      const app = document.getElementById('app');
      const counter = document.getElementById('counter');
      const controlButton = document.getElementById('controlButton');
      const mascotButton = document.getElementById('mascotButton');
      const canvas = document.getElementById('fireworks');
      const ctx = canvas.getContext('2d', { alpha: true });
      const mascotSvg = document.getElementById('mascotSvg');
      const mascotWrap = document.querySelector('.mascot-wrap');
      const mascotShadow = document.querySelector('.mascot-shadow');
      const motifButtons = [...document.querySelectorAll('.motif-option')];
      const paletteButtons = [...document.querySelectorAll('.palette-option')];
      const fireworkButtons = [...document.querySelectorAll('.firework-option')];
      const shotButtons = [...document.querySelectorAll('.shot-option')];
      const finaleButtons = [...document.querySelectorAll('.finale-option')];
      const frequencyButtons = [...document.querySelectorAll('.frequency-option')];
      const formationButtons = [...document.querySelectorAll('.formation-option')];
      const settingsToggle = document.getElementById('settingsToggle');
      const optionDock = document.getElementById('optionDock');
      const panelTabs = [...document.querySelectorAll('.panel-tab')];
      const optionPanels = [...document.querySelectorAll('.option-panel')];
      const palettes = {
        sunset: { hues: [24, 48, 294, 344], blooms: ['#ffbe70', '#d782ed', '#ff84b2'] },
        ocean: { hues: [178, 202, 224, 268], blooms: ['#65e7df', '#79a8ff', '#b28cf2'] },
        candy: { hues: [328, 350, 148, 280], blooms: ['#ff98bd', '#8de6cb', '#f8a3ff'] },
        gold: { hues: [12, 28, 43, 52], blooms: ['#ffbd5d', '#fff0a8', '#ff8f55'] },
        aurora: { hues: [158, 190, 222, 287], blooms: ['#72f2c2', '#72b8ff', '#e09aff'] }
      };
      let activePalette = palettes.sunset;
      const fireworkTypes = {
        burst: { count: 18, minSpeed: 1.9, maxSpeed: 3.4, gravity: .05, drag: .987, decay: .038 },
        willow: { count: 16, minSpeed: 1.5, maxSpeed: 2.8, gravity: .095, drag: .982, decay: .03 },
        ring: { count: 18, minSpeed: 2.8, maxSpeed: 3.1, gravity: .012, drag: .994, decay: .042 },
        chrysanthemum: { count: 20, minSpeed: 2.1, maxSpeed: 3.8, gravity: .045, drag: .988, decay: .033 },
        heart: { count: 18, minSpeed: 1.6, maxSpeed: 3.2, gravity: .058, drag: .986, decay: .037 }
      };
      const grandPatterns = {
        crown: [[.50, .17, true], [.27, .29, false], [.73, .29, false]],
        twin: [[.32, .23, true], [.68, .23, false], [.50, .15, false]],
        cascade: [[.26, .18, true], [.50, .29, false], [.74, .40, false]]
      };
      const launchFormations = {
        fan: [[.22, .34], [.50, .22], [.78, .34]],
        line: [[.22, .29], [.50, .29], [.78, .29]],
        triangle: [[.24, .38], [.76, .38], [.50, .18]],
        comet: [[.26, .43], [.50, .30], [.74, .17]]
      };
      let activeFirework = 'burst';
      let activeFinalePattern = 'crown';
      let activeLaunchFormation = 'fan';
      let simultaneousShots = 1;
      let grandBurstEvery = 4;
      let launchGroupCount = 0;
      let grandBurstTimer = 0;
      let goldenCrownTimer = 0;
      let stardustTimer = 0;
      let finaleSequenceTimers = [];

      let state = 'idle';
      let countdownFrame = 0;
      let fireworksFrame = 0;
      let lastFireworkFrame = 0;
      let fireworksInterval = 0;
      let countdownStartedAt = 0;
      let shownNumber = duration;
      let rockets = [];
      let particles = [];
      let flashes = [];
      let secondaryBursts = [];
      let groundReflections = [];
      const particleLimit = 54;
      const maximumSimultaneousShots = 3;
      const frameInterval = 1000 / 24;

      function setCounter(value) {
        counter.textContent = String(value);
        counter.setAttribute('aria-label', String(value));
        counter.classList.remove('pop');
        void counter.offsetWidth;
        counter.classList.add('pop');
      }

      function setSettingsOpen(isOpen) {
        optionDock.classList.toggle('is-open', isOpen);
        settingsToggle.setAttribute('aria-expanded', String(isOpen));
        settingsToggle.setAttribute('aria-label', isOpen ? '設定を閉じる' : '設定を開く');
      }

      function selectSettingsPanel(name) {
        panelTabs.forEach((tab) => tab.setAttribute('aria-selected', String(tab.dataset.panelTarget === name)));
        optionPanels.forEach((panel) => panel.classList.toggle('is-active', panel.dataset.panel === name));
      }

      function resizeCanvas() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }

      function startMascotBounce() {
        mascotWrap.classList.remove('is-bouncing');
        mascotShadow.classList.remove('is-bouncing');
        void mascotWrap.offsetWidth;
        mascotWrap.classList.add('is-bouncing');
        mascotShadow.classList.add('is-bouncing');
      }

      function stopMascotBounce() {
        mascotWrap.classList.remove('is-bouncing');
        mascotShadow.classList.remove('is-bouncing');
      }

      function startCountdown() {
        stopFireworks();
        setSettingsOpen(false);
        state = 'counting';
        shownNumber = duration;
        setCounter(duration);
        app.classList.remove('is-finale');
        app.classList.add('is-counting');
        startMascotBounce();
        controlButton.setAttribute('aria-label', 'カウントダウン中');
        mascotButton.setAttribute('aria-label', 'カウントダウン中');
        countdownStartedAt = performance.now();
        cancelAnimationFrame(countdownFrame);
        countdownFrame = requestAnimationFrame(tickCountdown);
      }

      function tickCountdown(now) {
        const elapsed = (now - countdownStartedAt) / 1000;
        const remaining = Math.max(0, Math.ceil(duration - elapsed));
        if (remaining !== shownNumber && remaining > 0) {
          shownNumber = remaining;
          setCounter(remaining);
        }
        if (elapsed >= duration) {
          startFinale();
          return;
        }
        countdownFrame = requestAnimationFrame(tickCountdown);
      }

      function pickRocketHues() {
        const paletteHues = activePalette.hues;
        const start = Math.floor(Math.random() * paletteHues.length);
        return [
          paletteHues[start],
          paletteHues[(start + 1) % paletteHues.length],
          paletteHues[(start + 2) % paletteHues.length]
        ];
      }

      function createRocket(xRatio = Math.random() * .66 + .17, yRatio = Math.random() * .24 + .15, grand = false, forcedHues = null) {
        if (rockets.length >= maximumSimultaneousShots) return;
        const hues = forcedHues || pickRocketHues();
        const launchScale = grand ? .98 + Math.random() * .14 : .88 + Math.random() * .2;
        rockets.push({
          x: canvas.width * (.18 + Math.random() * .64),
          y: canvas.height + 18,
          vx: (xRatio * canvas.width - canvas.width * .5) * (grand ? .009 : .012),
          vy: (grand ? -12.4 : -10.5 - Math.random() * 1.5) * launchScale,
          targetY: canvas.height * yRatio,
          hue: hues[0],
          trailHue: hues[1],
          launchHue: hues[2],
          flicker: Math.random() * Math.PI * 2,
          hues,
          fireworkType: activeFirework,
          grand
        });
      }

      function addGroundReflection(x, hue, strength = 1) {
        groundReflections.push({ xRatio: x / canvas.width, hue, alpha: .26 * strength, radius: canvas.width * (.13 + strength * .045), drift: Math.random() * Math.PI * 2 });
        if (groundReflections.length > 2) groundReflections.shift();
      }

      function queueSecondaryBurst(rocket) {
        secondaryBursts.push({
          x: rocket.x,
          y: rocket.y,
          hue: rocket.hues[2],
          warmHue: rocket.hues[1],
          due: performance.now() + (rocket.grand ? 330 : 250),
          alpha: rocket.grand ? .9 : .7,
          radius: rocket.grand ? 10 : 7,
          rays: rocket.grand ? 7 : 5,
          reflected: false
        });
        if (secondaryBursts.length > 2) secondaryBursts.shift();
      }

      function explode(rocket) {
        const profile = fireworkTypes[rocket.fireworkType];
        const available = Math.max(0, particleLimit - particles.length);
        const desiredCount = rocket.grand ? Math.min(42, profile.count * 2 + 6) : profile.count;
        const count = Math.min(desiredCount, available);
        flashes.push({ x: rocket.x, y: rocket.y, radius: rocket.grand ? 46 : 31, alpha: rocket.grand ? 1 : .82, hue: rocket.hues[0], warmHue: rocket.hues[1], rays: rocket.grand ? 8 : 6 });
        if (flashes.length > 2) flashes.shift();
        addGroundReflection(rocket.x, rocket.hues[0], rocket.grand ? 1.18 : .72);
        if (rocket.grand || rocket.fireworkType === 'chrysanthemum' || Math.random() < .42) queueSecondaryBurst(rocket);
        const offset = Math.random() * Math.PI * 2;
        const layerScales = [.58, .94, 1.34];
        for (let i = 0; i < count; i += 1) {
          const layer = i % layerScales.length;
          const layerScale = layerScales[layer] * (rocket.grand ? 1.12 : 1);
          const angle = offset + (Math.PI * 2 * i) / count + (Math.random() - .5) * (rocket.grand ? .045 : (rocket.fireworkType === 'chrysanthemum' ? .035 : .11));
          const baseSpeed = profile.minSpeed + Math.random() * (profile.maxSpeed - profile.minSpeed);
          const speed = baseSpeed * layerScale * (rocket.grand ? 1.42 : 1);
          const heartT = (Math.PI * 2 * i) / count;
          const heartScale = speed * .25;
          const heartX = 16 * Math.sin(heartT) ** 3 * heartScale;
          const heartY = -(13 * Math.cos(heartT) - 5 * Math.cos(2 * heartT) - 2 * Math.cos(3 * heartT) - Math.cos(4 * heartT)) * heartScale;
          const ember = i % 7 === 0 || (layer === 0 && i % 5 === 0);
          const willow = (rocket.grand && i % 5 === 0) || (rocket.fireworkType === 'willow' && i % 3 === 0);
          const warmHue = 39 + Math.random() * 16;
          particles.push({
            x: rocket.x, y: rocket.y, px: rocket.x, py: rocket.y,
            vx: rocket.fireworkType === 'heart' ? heartX : Math.cos(angle) * speed, vy: rocket.fireworkType === 'heart' ? heartY : Math.sin(angle) * speed,
            hue: willow ? warmHue : rocket.hues[i % rocket.hues.length], alpha: 1, decay: (((rocket.grand ? profile.decay * .83 : profile.decay) * (layer === 0 ? .72 : .92)) + Math.random() * .007) * (willow ? .58 : 1),
            gravity: profile.gravity, drag: profile.drag, size: (rocket.grand ? 1.55 : 1.1) + Math.random() * (rocket.grand ? 1.15 : 1.1) + layer * .16,
            ember,
            willow,
            warmHue,
            coolHue: (rocket.hues[(i + 1) % rocket.hues.length] + 360) % 360,
            branch: !willow && rocket.fireworkType !== 'heart' && i % (rocket.grand ? 4 : 6) === 0,
            branchAngle: angle + (Math.random() > .5 ? 1 : -1) * (.42 + Math.random() * .28),
            shimmer: Math.random() * Math.PI * 2
          });
        }
      }

      function drawFireworks(timestamp) {
        if (!app.classList.contains('is-finale')) return;
        if (timestamp - lastFireworkFrame < frameInterval) {
          fireworksFrame = requestAnimationFrame(drawFireworks);
          return;
        }
        lastFireworkFrame = timestamp;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(8, 13, 40, .255)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = 'lighter';

        for (let i = groundReflections.length - 1; i >= 0; i -= 1) {
          const reflection = groundReflections[i];
          const reflectX = canvas.width * reflection.xRatio;
          const reflectY = canvas.height * .91;
          const gradient = ctx.createRadialGradient(reflectX, reflectY, 0, reflectX, reflectY, reflection.radius);
          gradient.addColorStop(0, `hsla(${reflection.hue}, 100%, 88%, ${reflection.alpha})`);
          gradient.addColorStop(.32, `hsla(${reflection.hue}, 100%, 66%, ${reflection.alpha * .42})`);
          gradient.addColorStop(1, `hsla(${reflection.hue}, 100%, 55%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.ellipse(reflectX, reflectY, reflection.radius, canvas.height * .046, 0, 0, Math.PI * 2);
          ctx.fill();
          reflection.radius *= 1.045;
          reflection.alpha -= .024;
          if (reflection.alpha <= 0) groundReflections.splice(i, 1);
        }

        for (let i = rockets.length - 1; i >= 0; i -= 1) {
          const rocket = rockets[i];
          const px = rocket.x;
          const py = rocket.y;
          rocket.x += rocket.vx;
          rocket.y += rocket.vy;
          rocket.vy += .1;
          const pulse = .78 + Math.sin(timestamp * .018 + rocket.flicker) * .16;
          const tailX = px - rocket.vx * (rocket.grand ? 1.7 : 1.35);
          const tailY = py - rocket.vy * (rocket.grand ? 1.7 : 1.35);
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(rocket.x, rocket.y);
          ctx.lineWidth = rocket.grand ? 4.8 : 3.25;
          ctx.strokeStyle = `hsla(${rocket.trailHue}, 100%, 62%, ${.24 * pulse})`;
          ctx.shadowBlur = rocket.grand ? 18 : 12;
          ctx.shadowColor = `hsl(${rocket.trailHue}, 100%, 67%)`;
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(rocket.x, rocket.y);
          ctx.lineWidth = rocket.grand ? 2.5 : 1.7;
          ctx.strokeStyle = `hsla(${rocket.launchHue}, 100%, 76%, ${.9 * pulse})`;
          ctx.shadowBlur = rocket.grand ? 10 : 7;
          ctx.shadowColor = `hsl(${rocket.launchHue}, 100%, 75%)`;
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(rocket.x, rocket.y);
          ctx.lineWidth = rocket.grand ? 1.08 : .74;
          ctx.strokeStyle = 'rgba(255,253,230,.99)';
          ctx.shadowBlur = 5;
          ctx.shadowColor = 'rgba(255,255,238,.98)';
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(rocket.x, rocket.y, rocket.grand ? 3 : 2.1, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,254,236,.98)';
          ctx.fill();
          if (rocket.vy > -.2 || rocket.y <= rocket.targetY) {
            explode(rocket);
            rockets.splice(i, 1);
          }
        }

        for (let i = flashes.length - 1; i >= 0; i -= 1) {
          const flash = flashes[i];
          const gradient = ctx.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, flash.radius);
          gradient.addColorStop(0, `hsla(${flash.hue}, 100%, 100%, ${flash.alpha})`);
          gradient.addColorStop(.1, `hsla(${flash.warmHue}, 100%, 90%, ${flash.alpha * .92})`);
          gradient.addColorStop(.28, `hsla(${flash.hue}, 100%, 73%, ${flash.alpha * .56})`);
          gradient.addColorStop(1, `hsla(${flash.hue}, 100%, 55%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(flash.x, flash.y, flash.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = flash.alpha * 1.05;
          ctx.strokeStyle = `hsla(${flash.warmHue}, 100%, 90%, ${flash.alpha * .54})`;
          ctx.shadowBlur = 8;
          ctx.shadowColor = `hsl(${flash.hue}, 100%, 72%)`;
          for (let ray = 0; ray < flash.rays; ray += 1) {
            const rayAngle = (Math.PI * 2 * ray) / flash.rays + .18;
            ctx.beginPath();
            ctx.moveTo(flash.x, flash.y);
            ctx.lineTo(flash.x + Math.cos(rayAngle) * flash.radius * .7, flash.y + Math.sin(rayAngle) * flash.radius * .7);
            ctx.stroke();
          }
          flash.radius *= 1.16;
          flash.alpha -= .19;
          if (flash.alpha <= 0) flashes.splice(i, 1);
        }

        for (let i = secondaryBursts.length - 1; i >= 0; i -= 1) {
          const burst = secondaryBursts[i];
          if (timestamp < burst.due) continue;
          if (!burst.reflected) {
            addGroundReflection(burst.x, burst.hue, .58);
            burst.reflected = true;
          }
          const gradient = ctx.createRadialGradient(burst.x, burst.y, 0, burst.x, burst.y, burst.radius);
          gradient.addColorStop(0, `hsla(${burst.warmHue}, 100%, 100%, ${burst.alpha})`);
          gradient.addColorStop(.25, `hsla(${burst.hue}, 100%, 82%, ${burst.alpha * .7})`);
          gradient.addColorStop(1, `hsla(${burst.hue}, 100%, 58%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(burst.x, burst.y, burst.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = Math.max(.5, burst.alpha * 1.1);
          ctx.strokeStyle = `hsla(${burst.warmHue}, 100%, 92%, ${burst.alpha * .72})`;
          ctx.shadowBlur = 7;
          ctx.shadowColor = `hsl(${burst.hue}, 100%, 73%)`;
          for (let ray = 0; ray < burst.rays; ray += 1) {
            const angle = (Math.PI * 2 * ray) / burst.rays + .12;
            ctx.beginPath();
            ctx.moveTo(burst.x, burst.y);
            ctx.lineTo(burst.x + Math.cos(angle) * burst.radius * .88, burst.y + Math.sin(angle) * burst.radius * .88);
            ctx.stroke();
          }
          burst.radius *= 1.19;
          burst.alpha -= .115;
          if (burst.alpha <= 0) secondaryBursts.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const particle = particles[i];
          particle.px = particle.x;
          particle.py = particle.y;
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.vx *= particle.drag * (particle.ember ? .996 : (particle.willow ? .976 : 1));
          particle.vy += particle.gravity * (particle.willow ? 2.45 : (particle.ember ? 1.32 : 1));
          particle.alpha -= particle.decay;
          const alpha = Math.max(0, particle.alpha);
          const heat = Math.max(0, Math.min(1, alpha * 1.18));
          const fadingHue = (particle.ember || particle.willow) ? particle.warmHue : particle.hue + (particle.coolHue - particle.hue) * (1 - heat) * .24;
          const lightness = particle.willow ? 58 + heat * 38 : (particle.ember ? 66 + heat * 26 : 54 + heat * 39);
          const tailX = particle.px - particle.vx * (particle.willow ? 1.22 : (particle.ember ? .38 : .68));
          const tailY = particle.py - particle.vy * (particle.willow ? 1.22 : (particle.ember ? .38 : .68));
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(particle.x, particle.y);
          ctx.lineWidth = particle.willow ? particle.size * 1.9 : (particle.ember ? particle.size * 1.42 : particle.size * 1.7);
          ctx.strokeStyle = `hsla(${fadingHue}, 100%, ${lightness}%, ${alpha * (particle.willow ? .3 : .2)})`;
          ctx.shadowBlur = particle.willow ? 10 : (particle.ember ? 8 : 6);
          ctx.shadowColor = `hsl(${fadingHue}, 100%, ${Math.min(80, lightness)}%)`;
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(particle.px, particle.py);
          ctx.lineTo(particle.x, particle.y);
          ctx.lineWidth = particle.willow ? particle.size * .72 : (particle.ember ? particle.size * .72 : particle.size);
          ctx.strokeStyle = `hsla(${fadingHue}, 100%, ${lightness}%, ${alpha * (particle.willow ? .86 : 1)})`;
          ctx.stroke();
          if (particle.branch && alpha > .28) {
            const branchLength = particle.size * (3.2 + alpha * 3.4);
            const bend = particle.branchAngle + Math.sin(timestamp * .01 + particle.shimmer) * .16;
            ctx.beginPath();
            ctx.moveTo(particle.x - particle.vx * .22, particle.y - particle.vy * .22);
            ctx.lineTo(particle.x + Math.cos(bend) * branchLength, particle.y + Math.sin(bend) * branchLength + particle.gravity * 8);
            ctx.lineWidth = Math.max(.42, particle.size * .32);
            ctx.strokeStyle = `hsla(${particle.warmHue}, 100%, 82%, ${alpha * .58})`;
            ctx.shadowBlur = 4;
            ctx.shadowColor = `hsl(${particle.warmHue}, 100%, 74%)`;
            ctx.stroke();
          }
          if ((particle.ember || alpha > .7) && alpha > .18) {
            const sparkle = .7 + Math.sin(timestamp * .028 + particle.shimmer) * .3;
            ctx.beginPath();
            ctx.arc(particle.x, particle.y, Math.max(.48, particle.size * .34 * sparkle), 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${particle.ember ? particle.warmHue : fadingHue}, 100%, 94%, ${alpha * (particle.ember ? .82 : .42)})`;
            ctx.fill();
          }
          if (particle.alpha <= 0) particles.splice(i, 1);
        }

        ctx.shadowBlur = 0;
        fireworksFrame = requestAnimationFrame(drawFireworks);
      }

      function triggerGrandBloom() {
        app.classList.remove('grand-burst');
        void app.offsetWidth;
        app.classList.add('grand-burst');
        clearTimeout(grandBurstTimer);
        grandBurstTimer = window.setTimeout(() => app.classList.remove('grand-burst'), 2800);
      }

      function queueFinaleStep(callback, delay) {
        finaleSequenceTimers.push(window.setTimeout(callback, delay));
      }

      function clearFinaleSequence() {
        finaleSequenceTimers.forEach((timer) => clearTimeout(timer));
        finaleSequenceTimers = [];
        clearTimeout(goldenCrownTimer);
        clearTimeout(stardustTimer);
        app.classList.remove('golden-crown', 'stardust');
      }

      function launchFanRapidFire() {
        const rapidFan = [[.18, .35], [.50, .20], [.82, .35]];
        rapidFan.forEach(([x, y], index) => queueFinaleStep(() => createRocket(x, y, false), index * 300));
      }

      function launchGoldenCrown() {
        const goldHues = [48, 42, 26];
        app.classList.remove('golden-crown');
        void app.offsetWidth;
        app.classList.add('golden-crown');
        createRocket(.50, .16, true, goldHues);
        queueFinaleStep(() => createRocket(.27, .31, false, goldHues), 170);
        queueFinaleStep(() => createRocket(.73, .31, false, goldHues), 340);
        clearTimeout(goldenCrownTimer);
        goldenCrownTimer = window.setTimeout(() => app.classList.remove('golden-crown'), 3000);
      }

      function triggerStardust() {
        app.classList.remove('stardust');
        void app.offsetWidth;
        app.classList.add('stardust');
        clearTimeout(stardustTimer);
        stardustTimer = window.setTimeout(() => app.classList.remove('stardust'), 3300);
      }

      function beginContinuousFinale() {
        launchShotGroup();
        clearInterval(fireworksInterval);
        fireworksInterval = window.setInterval(() => {
          if (rockets.length < simultaneousShots && particles.length < 32) launchShotGroup();
        }, 420);
      }

      function beginFinaleSequence() {
        launchFanRapidFire();
        queueFinaleStep(launchGoldenCrown, 2250);
        queueFinaleStep(triggerStardust, 5100);
        queueFinaleStep(beginContinuousFinale, 6450);
      }

      function launchShotGroup() {
        const positions = launchFormations[activeLaunchFormation];
        launchGroupCount += 1;
        const isGrandBurst = launchGroupCount % grandBurstEvery === 0;
        if (isGrandBurst) {
          triggerGrandBloom();
          const pattern = grandPatterns[activeFinalePattern];
          for (let index = 0; index < simultaneousShots; index += 1) {
            const [x, y, grand] = pattern[index];
            createRocket(x, y, grand);
          }
          return;
        }
        for (let index = 0; index < simultaneousShots; index += 1) {
          const [x, y] = positions[index];
          createRocket(x, y);
        }
      }

      function startFinale() {
        cancelAnimationFrame(countdownFrame);
        state = 'finale';
        app.classList.remove('is-counting');
        app.classList.add('is-finale');
        stopMascotBounce();
        controlButton.setAttribute('aria-label', 'もう一度');
        mascotButton.setAttribute('aria-label', 'もう一度');
        resizeCanvas();
        rockets = [];
        particles = [];
        flashes = [];
        secondaryBursts = [];
        groundReflections = [];
        launchGroupCount = 0;
        app.classList.remove('grand-burst');
        lastFireworkFrame = 0;
        clearFinaleSequence();
        clearInterval(fireworksInterval);
        cancelAnimationFrame(fireworksFrame);
        fireworksFrame = requestAnimationFrame(drawFireworks);
        beginFinaleSequence();
      }

      function stopFireworks() {
        clearInterval(fireworksInterval);
        clearTimeout(grandBurstTimer);
        clearFinaleSequence();
        app.classList.remove('grand-burst');
        fireworksInterval = 0;
        fireworksFrame = 0;
        rockets = [];
        particles = [];
        flashes = [];
        secondaryBursts = [];
        groundReflections = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function activate() {
        if (state === 'counting') return;
        startCountdown();
      }

      function applyMotif(motif) {
        const motifs = {
          drop: '<defs><linearGradient id="bodyGradient" x1="30" y1="15" x2="184" y2="204" gradientUnits="userSpaceOnUse"><stop stop-color="#fff3bf"/><stop offset=".45" stop-color="#ffbd8b"/><stop offset="1" stop-color="#ff7197"/></linearGradient></defs><path class="star" d="M57 46l5 13 14 2-11 9 3 14-11-8-12 8 4-14-11-9 14-2z"/><path class="star" d="M169 44l3 8 9 2-7 6 2 9-8-5-8 5 2-9-7-6 9-2z"/><path class="mascot-body" d="M110 34C71 34 43 66 43 106c0 39 28 72 67 84 39-12 67-45 67-84 0-40-28-72-67-72Z"/><ellipse class="mascot-shine" cx="81" cy="75" rx="19" ry="29" transform="rotate(28 81 75)"/><ellipse class="mascot-cheek" cx="74" cy="126" rx="14" ry="8"/><ellipse class="mascot-cheek" cx="146" cy="126" rx="14" ry="8"/><circle class="face" cx="82" cy="104" r="7"/><circle class="face" cx="138" cy="104" r="7"/><path d="M89 131c12 13 30 13 42 0" fill="none" stroke="#202452" stroke-width="7" stroke-linecap="round"/><circle fill="white" cx="80" cy="102" r="2"/><circle fill="white" cx="136" cy="102" r="2"/>',
          cat: '<defs><linearGradient id="bodyGradient" x1="46" y1="34" x2="175" y2="192" gradientUnits="userSpaceOnUse"><stop stop-color="#d7f7ff"/><stop offset=".5" stop-color="#89b8ff"/><stop offset="1" stop-color="#a282ef"/></linearGradient></defs><path class="mascot-body" d="M57 88 44 44l39 20a75 75 0 0 1 54 0l39-20-13 44a68 68 0 1 1-106 0Z"/><path class="mascot-shine" d="M74 80c11-15 28-23 45-23-27 10-38 29-39 49-12-3-19-13-6-26Z"/><ellipse class="mascot-cheek" cx="75" cy="137" rx="15" ry="9"/><ellipse class="mascot-cheek" cx="145" cy="137" rx="15" ry="9"/><circle class="face" cx="84" cy="116" r="7"/><circle class="face" cx="136" cy="116" r="7"/><path d="M100 135c6 6 14 6 20 0M110 127l4 4 4-4" fill="none" stroke="#202452" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 134 51 128m27 14-27 7m93-15 27-6m-27 14 27 7" fill="none" stroke="#202452" stroke-width="4" stroke-linecap="round"/><circle fill="white" cx="82" cy="114" r="2"/><circle fill="white" cx="134" cy="114" r="2"/>',
          bunny: '<defs><linearGradient id="bodyGradient" x1="48" y1="18" x2="176" y2="194" gradientUnits="userSpaceOnUse"><stop stop-color="#fff8fd"/><stop offset=".5" stop-color="#ffb4d5"/><stop offset="1" stop-color="#b69cf5"/></linearGradient></defs><path class="mascot-body" d="M69 92C55 54 62 24 77 24c14 0 16 31 15 61a70 70 0 0 1 36 0c-1-30 1-61 15-61 15 0 22 30 8 68a67 67 0 1 1-82 0Z"/><path fill="#e982b1" opacity=".6" d="M76 33c8 8 6 34 5 43-12-22-10-37-5-43Zm68 0c5 6 7 21-5 43-1-9-3-35 5-43Z"/><ellipse class="mascot-shine" cx="82" cy="110" rx="15" ry="25" transform="rotate(30 82 110)"/><ellipse class="mascot-cheek" cx="77" cy="147" rx="14" ry="8"/><ellipse class="mascot-cheek" cx="143" cy="147" rx="14" ry="8"/><circle class="face" cx="87" cy="126" r="7"/><circle class="face" cx="133" cy="126" r="7"/><path d="M102 147c6 8 10 8 16 0M108 138l2 3 2-3" fill="none" stroke="#202452" stroke-width="5" stroke-linecap="round"/><circle fill="white" cx="85" cy="124" r="2"/><circle fill="white" cx="131" cy="124" r="2"/>'
        };
        mascotSvg.innerHTML = motifs[motif];
        motifButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.motif === motif)));
      }

      function applyPalette(name) {
        activePalette = palettes[name];
        app.dataset.palette = name === 'sunset' ? '' : name;
        app.style.setProperty('--bloom-one', activePalette.blooms[0]);
        app.style.setProperty('--bloom-two', activePalette.blooms[1]);
        app.style.setProperty('--bloom-three', activePalette.blooms[2]);
        app.style.setProperty('--bloom-grand', activePalette.blooms[1]);
        app.style.setProperty('--bloom-grand-alt', activePalette.blooms[2]);
        paletteButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.palette === name)));
      }

      function applyFireworkType(type) {
        activeFirework = type;
        app.dataset.fireworkStyle = type === 'burst' ? '' : type;
        fireworkButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.firework === type)));
      }

      function applySimultaneousShots(count) {
        simultaneousShots = Math.min(maximumSimultaneousShots, Math.max(1, count));
        shotButtons.forEach((button) => button.setAttribute('aria-pressed', String(Number(button.dataset.shots) === simultaneousShots)));
      }

      function applyFinalePattern(pattern) {
        activeFinalePattern = pattern;
        app.dataset.finaleStyle = pattern;
        finaleButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.finale === pattern)));
      }

      function applyGrandFrequency(frequency) {
        grandBurstEvery = frequency;
        frequencyButtons.forEach((button) => button.setAttribute('aria-pressed', String(Number(button.dataset.frequency) === grandBurstEvery)));
      }

      function applyLaunchFormation(formation) {
        activeLaunchFormation = formation;
        app.dataset.launchFormation = formation;
        formationButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.formation === formation)));
      }

      settingsToggle.addEventListener('click', () => setSettingsOpen(!optionDock.classList.contains('is-open')));
      panelTabs.forEach((tab) => tab.addEventListener('click', () => selectSettingsPanel(tab.dataset.panelTarget)));
      motifButtons.forEach((button) => button.addEventListener('click', () => applyMotif(button.dataset.motif)));
      paletteButtons.forEach((button) => button.addEventListener('click', () => applyPalette(button.dataset.palette)));
      fireworkButtons.forEach((button) => button.addEventListener('click', () => applyFireworkType(button.dataset.firework)));
      shotButtons.forEach((button) => button.addEventListener('click', () => applySimultaneousShots(Number(button.dataset.shots))));
      finaleButtons.forEach((button) => button.addEventListener('click', () => applyFinalePattern(button.dataset.finale)));
      frequencyButtons.forEach((button) => button.addEventListener('click', () => applyGrandFrequency(Number(button.dataset.frequency))));
      formationButtons.forEach((button) => button.addEventListener('click', () => applyLaunchFormation(button.dataset.formation)));
      controlButton.addEventListener('click', activate);
      mascotButton.addEventListener('click', activate);
      window.addEventListener('resize', () => { if (state === 'finale') resizeCanvas(); }, { passive: true });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state === 'finale') stopFireworks();
      });

      setCounter(duration);
    })();
  </script>
</body>
