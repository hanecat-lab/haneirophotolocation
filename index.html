<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>iPhone Web Push サンプル</title>
</head>
<body>
  <h1>iPhone Web Push サンプル</h1>
  <p id="status">ホーム画面に追加後、「通知を有効化」をタップしてください。</p>
  <button id="enablePush">通知を有効化</button>

  <script>
    // サーバーで生成したVAPID公開鍵（URL-safe Base64）に差し替えます。
    const VAPID_PUBLIC_KEY = 'YOUR_VAPID_PUBLIC_KEY';

    function base64UrlToUint8Array(base64Url) {
      const padding = '='.repeat((4 - base64Url.length % 4) % 4);
      const base64 = (base64Url + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      return Uint8Array.from(raw, char => char.charCodeAt(0));
    }

    async function enablePush() {
      const status = document.querySelector('#status');

      // iPhoneではホーム画面に追加したWebアプリで操作するよう案内します。
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        status.textContent = 'この環境ではWeb Pushを利用できません。iOS 16.4以降で、ホーム画面に追加したWebアプリとして開いてください。';
        return;
      }

      // 通知許可は、必ずこのボタンのタップなどユーザー操作中に要求します。
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        status.textContent = '通知は許可されませんでした。iPhoneの設定から後で変更できます。';
        return;
      }

      const registration = await navigator.serviceWorker.register('/sw.js');
      const readyRegistration = await navigator.serviceWorker.ready;

      let subscription = await readyRegistration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await readyRegistration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: base64UrlToUint8Array(VAPID_PUBLIC_KEY)
        });
      }

      // HTML単体ではなく、同一オリジンのサーバーにsubscriptionを保存する必要があります。
      const response = await fetch('/api/push/subscriptions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(subscription)
      });
      if (!response.ok) throw new Error('購読情報の保存に失敗しました');

      status.textContent = '通知を有効化しました。アプリを閉じていても、サーバーからのWeb Push通知を受信できます。';
    }

    document.querySelector('#enablePush').addEventListener('click', () => {
      enablePush().catch(error => {
        console.error(error);
        document.querySelector('#status').textContent = `設定に失敗しました: ${error.message}`;
      });
    });
  </script>
</body>
</html>
