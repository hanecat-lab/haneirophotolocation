<!DOCTYPE html>
<html lang="ja">
<head>
<!-- 雛形: management/app-template.html（バージョン管理はこのリポジトリの方式に合わせている） -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon01.png">
<title>CardCull</title>
<style>
  :root {
    --bg: #07090d;
    --bg2: #10151c;
    --text: #e8edf2;
    --text2: #8b98a5;
    --accent: #5ce1ff;
    --accent2: #9b8cff;
    --danger: #ff6b81;
    --glass-b: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 12% 18%, rgba(92,225,255,.16), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(155,140,255,.15), transparent 46%),
      radial-gradient(circle at 60% 8%, rgba(92,225,255,.06), transparent 35%);
  }
  .glass {
    background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-b);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 12px 40px rgba(0,0,0,.45);
    border-radius: 22px;
  }
  button {
    font: inherit; color: var(--text);
    background: rgba(255,255,255,.06);
    border: 1px solid var(--glass-b); border-radius: 999px;
    padding: 10px 18px; cursor: pointer;
    transition: background .15s, border-color .15s, box-shadow .15s, color .15s;
  }
  button:hover { background: rgba(255,255,255,.12); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary {
    background: linear-gradient(135deg, rgba(92,225,255,.28), rgba(155,140,255,.22));
    border-color: rgba(92,225,255,.55);
    box-shadow: 0 0 24px rgba(92,225,255,.22);
  }
  button.primary:hover { box-shadow: 0 0 32px rgba(92,225,255,.38); }
  button.small { padding: 6px 12px; font-size: .8rem; }
  .muted { color: var(--text2); }

  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }
  .screen.center.on { display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }

  /* ===== 開く画面 ===== */
  .card { width: min(460px, 100%); padding: 36px 32px; text-align: center; }
  .logo { font-size: 1.9rem; font-weight: 700; letter-spacing: .06em; }
  .logo b { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { margin: 12px 0 28px; line-height: 1.7; font-size: .9rem; color: var(--text2); }
  #openBtn { font-size: 1.05rem; padding: 14px 34px; }
  .opts { text-align: left; margin: 0 0 24px; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
  .optrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .optrow > .k { width: 4.2em; flex: none; font-size: .8rem; color: var(--text2); }
  #destName { flex: 1; min-width: 0; font-size: .9rem; word-break: break-all; }
  .optnote { font-size: .72rem; color: var(--text2); line-height: 1.6; }
  .linkbtn { background: none; border: none; padding: 0; border-radius: 0; color: var(--accent); font-size: .72rem; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .linkbtn:hover { background: none; }
  .badge.done { border-color: rgba(120,220,150,.5); color: #8fe3a8; }
  #openStatus { margin-top: 18px; min-height: 1.4em; font-size: .85rem; color: var(--text2); }

  /* ===== 選別画面 ===== */
  #topbar {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 16px; right: 16px;
    height: 54px; border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 12px;
  }
  #fname { font-weight: 600; font-size: 1rem; letter-spacing: .02em; }
  #fblock { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  #exif { font-size: .72rem; color: var(--text2); white-space: nowrap; font-variant-numeric: tabular-nums; min-height: 1em; }
  #badges { display: flex; gap: 6px; }
  .badge { font-size: .68rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--glass-b); color: var(--text2); }
  .badge.jpg { border-color: rgba(92,225,255,.5); color: var(--accent); }
  .badge.raw { border-color: rgba(155,140,255,.55); color: var(--accent2); }
  #ftime { font-size: .8rem; color: var(--text2); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  #viewSeg { display: flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--glass-b); background: rgba(255,255,255,.04); }
  #viewSeg button { border: none; background: none; padding: 5px 12px; font-size: .78rem; color: var(--text2); }
  #viewSeg button.on { background: rgba(255,255,255,.12); color: var(--text); }
  #viewSeg button[data-v=kept].on { color: var(--accent); }
  #viewSeg button[data-v=dropped].on { color: var(--danger); }

  #grid { position: absolute; inset: 0; display: none; gap: 8px; }
  .cell { position: relative; min-width: 0; min-height: 0; border-radius: 12px; overflow: hidden; cursor: pointer;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); }
  .cell canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .cell .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: .75rem; color: var(--text2); }
  .cell .nm { position: absolute; left: 8px; bottom: 6px; font-size: .7rem; color: rgba(255,255,255,.85); text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; }
  .cell .mk { position: absolute; top: 7px; left: 7px; padding: 2px 9px; border-radius: 999px; font-size: .68rem; font-weight: 700; letter-spacing: .08em;
    background: rgba(0,0,0,.55); display: none; pointer-events: none; color: var(--danger); border: 1px solid rgba(255,107,129,.55); }
  #grid[data-mode=keep] .mk, #cmp[data-mode=keep] .mk { color: var(--accent); border-color: rgba(92,225,255,.6); }
  .cell.mark .mk { display: block; }
  .cell.cur { border-color: rgba(92,225,255,.85); box-shadow: 0 0 0 1px rgba(92,225,255,.85), 0 0 22px rgba(92,225,255,.3); }
  #gridRow { display: flex; align-items: center; gap: 6px; }
  .cell.burst::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--bc); z-index: 1; pointer-events: none; }
  .badge.burst { border-color: rgba(155,140,255,.55); color: var(--accent2); }
  #cmp { position: absolute; inset: 0; display: none; gap: 8px; cursor: grab; touch-action: none; }
  #cmp.drag { cursor: grabbing; }
  .pane img { position: absolute; max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #stage.comparing #zoomTag { display: block; }
  #gridN { width: 104px; accent-color: var(--accent); }
  @media (max-width: 1100px) { #ftime { display: none; } }
  @media (max-width: 820px) { #badges { display: none; } }
  #stage { position: absolute; top: calc(78px + env(safe-area-inset-top)); bottom: calc(132px + env(safe-area-inset-bottom)); left: 16px; right: 16px; }
  #photo { width: 100%; height: 100%; object-fit: contain; display: block; transition: filter .15s, opacity .15s; cursor: zoom-in; }
  #zoom { position: absolute; inset: 0; overflow: auto; display: none; cursor: grab; border-radius: 12px; scrollbar-width: thin; }
  #zoom.drag { cursor: grabbing; }
  #zoom img { display: block; max-width: none; margin: 0 auto; user-select: none; -webkit-user-drag: none; }
  #zoomTag { position: absolute; top: 10px; right: 10px; padding: 5px 14px; font-size: .75rem; border-radius: 999px; display: none; pointer-events: none; }
  #stage.zoomed #zoom, #stage.zoomed #zoomTag { display: block; }
  #stage.zoomed #photo { visibility: hidden; }
  /* 選別したときのめくる演出（前の写真が左端を軸にめくれて消える） */
  .flip { position: absolute; z-index: 5; pointer-events: none; transform-origin: left center; backface-visibility: hidden; will-change: transform, opacity; }
  .flip img { display: block; width: 100%; height: 100%; object-fit: fill; }
  .flip i { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.6)); opacity: 0; }
  .flip.drop { box-shadow: 0 0 0 2px rgba(255,107,129,.75), 0 0 30px rgba(255,107,129,.45); }
  .flip.keep { box-shadow: 0 0 0 2px rgba(92,225,255,.75), 0 0 30px rgba(92,225,255,.4); }
  .flip.hold { box-shadow: 0 0 0 2px rgba(239,212,157,.75), 0 0 30px rgba(239,212,157,.4); }
  #noimg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--text2); line-height: 1.8; }

  #bar {
    position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(680px, calc(100% - 32px)); height: 100px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px;
  }
  #pos { position: absolute; top: 0; left: 24px; right: 24px; height: 2px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
  #posFill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .nav { width: 44px; height: 44px; padding: 0; font-size: 1.4rem; line-height: 1; flex: none; }
  .side { flex: 1; min-width: 0; }
  .side.left { text-align: left; }
  .side.right { text-align: right; }
  .side .big { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .side .sm { font-size: .72rem; color: var(--text2); margin-top: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #dropBtn {
    width: 78px; height: 78px; flex: none; padding: 0; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 2px solid rgba(92,225,255,.75);
    background: radial-gradient(circle at 50% 35%, rgba(92,225,255,.22), rgba(92,225,255,.04) 70%);
    box-shadow: 0 0 28px rgba(92,225,255,.35), inset 0 0 18px rgba(92,225,255,.18);
  }
  #dropBtn .lbl { font-size: 1rem; font-weight: 700; letter-spacing: .1em; }
  #dropBtn .key { font-size: .6rem; color: var(--text2); letter-spacing: .05em; }
  #dropBtn.is-dropped {
    border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.04);
    box-shadow: none; color: var(--text2);
  }

  #note {
    position: fixed; left: 50%; bottom: calc(132px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px);
    padding: 7px 8px 7px 16px; border-radius: 999px; font-size: .85rem; z-index: 51;
    display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px);
    opacity: 0; visibility: hidden; transition: opacity .18s, transform .18s, visibility .18s;
  }
  #note.on { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
  #note .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #note.drop { border-color: rgba(255,107,129,.55); }
  #note.drop .dot { background: var(--danger); box-shadow: 0 0 10px rgba(255,107,129,.8); }
  #note.keep { border-color: rgba(92,225,255,.55); }
  #note.keep .dot { background: var(--accent); box-shadow: 0 0 10px rgba(92,225,255,.8); }
  #note .key { font-size: .68rem; color: var(--text2); margin-left: 4px; }
  #toast {
    position: fixed; left: 50%; bottom: calc(132px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 10px 14px 10px 18px; border-radius: 999px; font-size: .85rem;
    display: none; align-items: center; gap: 12px; z-index: 50; max-width: calc(100% - 32px);
  }
  #toast.on { display: flex; }

  /* ===== コピー画面 ===== */
  .copycard { width: min(560px, 100%); padding: 28px; margin: auto; }
  .copycard h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .tile { padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
  .tile .v { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: .75rem; color: var(--text2); margin-top: 2px; }
  .tile.keep .v { color: var(--accent); }
  .row { margin-bottom: 18px; }
  .row > .k { font-size: .78rem; color: var(--text2); margin-bottom: 8px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: inline-block; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--glass-b); font-size: .85rem; cursor: pointer; }
  .seg input:checked + span { border-color: rgba(92,225,255,.6); color: var(--accent); background: rgba(92,225,255,.10); }
  .dest { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #cpDest { font-size: .9rem; word-break: break-all; }
  .sub { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: .85rem; flex-wrap: wrap; }
  input[type=text] {
    font: inherit; color: var(--text); background: rgba(255,255,255,.05);
    border: 1px solid var(--glass-b); border-radius: 10px; padding: 7px 10px; font-size: .85rem; width: 180px;
  }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
  #cpWarn { font-size: .8rem; color: var(--danger); min-height: 1.2em; margin-top: 8px; }

  #cpRun { display: none; text-align: center; }
  .ring { position: relative; width: 150px; height: 150px; margin: 4px auto 16px; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .bgc { stroke: rgba(255,255,255,.08); }
  .ring .fg { stroke: url(#rg); stroke-linecap: round; stroke-dasharray: 339.292; stroke-dashoffset: 339.292; }
  .ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  #cpLine1 { font-variant-numeric: tabular-nums; }
  #cpLine2 { font-size: .8rem; color: var(--text2); margin-top: 6px; font-variant-numeric: tabular-nums; }
  #cpCur { font-size: .75rem; color: var(--text2); margin-top: 6px; min-height: 1.2em; word-break: break-all; }

  #cpDone { display: none; }
  #cpResult { line-height: 1.9; font-size: .92rem; }
  #cpFails { margin-top: 10px; max-height: 160px; overflow: auto; font-size: .78rem; color: var(--danger); line-height: 1.6; }
  .hint { margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-size: .82rem; line-height: 1.7; background: rgba(92,225,255,.06); border: 1px solid rgba(92,225,255,.25); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  /* 判断と移動の操作。写真表示の配色は既存のまま。 */
  #topbar { height: auto; min-height: 54px; flex-wrap: wrap; padding: 8px 12px; gap: 6px; }
  #viewSeg { flex-wrap: wrap; border-radius: 14px; }
  #viewSeg button { padding: 5px 8px; }
  /* Header/footer reserve only their measured size; the photo gets all remaining space. */
  #s-cull { --photo-top: 78px; --photo-bottom: 142px; }
  #stage { top: var(--photo-top); bottom: var(--photo-bottom); left: 10px; right: 10px; }
  #bar {
    width: min(1000px, calc(100% - 20px)); height: auto; min-height: 0;
    bottom: calc(8px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: 38px minmax(0, 1fr) 52px minmax(0, 1fr) 38px;
    grid-template-rows: 20px auto auto; gap: 4px 8px; padding: 4px 12px 7px;
  }
  #pos { position: relative; grid-column: 1 / -1; top: auto; left: auto; right: auto; height: 20px; overflow: visible; background: none; }
  #posFill { position: absolute; top: 8px; height: 4px; border-radius: 3px; pointer-events: none; }
  #seek { touch-action: none; position: absolute; inset: 0; width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; background: transparent; }
  #bar > .nav { width: 38px; height: 38px; font-size: 1.3rem; }
  #dropBtn { width: 48px; height: 48px; justify-self: center; gap: 0; }
  #dropBtn .lbl { font-size: .85rem; }
  #dropBtn .key { font-size: .55rem; }
  #reviewTools { position: static; grid-column: 1 / -1; display: grid; grid-template-columns: max-content 1fr; align-items: center; gap: 5px 12px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,.08); }
  #reviewStat { display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: .68rem; color: var(--text2); }
  .reviewCount { display: inline-flex; gap: 5px; align-items: baseline; }
  .reviewCount b { font-size: .76rem; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .reviewCount[data-state=hold] b { color: #e8c98b; }
  .reviewCount[data-state=keep] b { color: var(--accent); }
  .reviewCount[data-state=drop] b { color: #ca929e; }
  .reviewActions { display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
  #reviewTools button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 28px; padding: 4px 9px; font-size: .72rem; line-height: 1; white-space: nowrap; border-radius: 8px; box-shadow: none; }
  #reviewTools button[hidden] { display: none; }
  #reviewTools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #reviewTools kbd { font: inherit; font-size: .59rem; min-width: 15px; padding: 2px 3px; border-radius: 4px; border: 1px solid rgba(255,255,255,.12); color: var(--text2); text-align: center; }
  #firstBtn { color: var(--text2); border-color: transparent; background: transparent; }
  #firstBtn:hover { background: rgba(255,255,255,.06); color: var(--text); }
  #holdBtn { background: rgba(255,255,255,.025); border-color: rgba(255,255,255,.12); }
  #holdBtn[aria-pressed=true] { color: #efd49d; border-color: rgba(239,212,157,.4); background: rgba(239,212,157,.09); }
  #reviewBtn { color: #b7f1fc; border-color: rgba(92,225,255,.32); background: rgba(92,225,255,.10); }
  #reviewBtn:hover { background: rgba(92,225,255,.18); }
  #burstBtn { color: var(--text2); background: rgba(255,255,255,.025); }
  #burstBtn[aria-pressed=true] { color: #c9bfff; border-color: rgba(155,140,255,.45); background: rgba(155,140,255,.12); }
  #burstCommit { grid-column: 1 / -1; justify-self: end; }
  #prepStatus { font-size: .7rem; color: var(--text2); }
  #prepStatus { max-width: 100%; }
  #fullscreenBtn { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  #fullscreenBtn[aria-pressed=true] { color: var(--accent); border-color: rgba(92,225,255,.45); background: rgba(92,225,255,.08); }
  #note, #toast { bottom: var(--notice-bottom, calc(142px + env(safe-area-inset-bottom))); }
  .cell .decision { position: absolute; top: 7px; right: 7px; padding: 2px 7px; background: rgba(0,0,0,.65); border-radius: 8px; font-size: .7rem; pointer-events: none; }
  .cell[data-decision=hold] .decision { color: #ffd580; }
  .cell[data-decision=keep] .decision { color: var(--accent); }
  .cell[data-decision=drop] .decision { color: var(--danger); }
  .burst-pick { position: absolute; left: 7px; top: 34px; display: flex; align-items: center; gap: 5px; padding: 5px 8px; background: rgba(0,0,0,.7); border-radius: 8px; font-size: .72rem; z-index: 2; }
  .burst-pick input { accent-color: var(--accent); width: 18px; height: 18px; }
  .copy-options { display: grid; gap: 9px; margin: 16px 0; font-size: .85rem; }
  #cpWarn { line-height: 1.7; }
  @media(max-width: 640px) {
    #topbar { gap: 4px; left: 8px; right: 8px; padding: 6px 8px; }
    #modeBtn { font-size: .7rem; }
    #stage { left: 6px; right: 6px; }
    #bar { grid-template-columns: 30px minmax(0, 1fr) 44px minmax(0, 1fr) 30px; gap: 3px 5px; padding: 3px 8px 6px; }
    #bar > .nav { width: 30px; height: 34px; }
    #dropBtn { width: 42px; height: 42px; }
    .side .big { font-size: .8rem; } #keepSize { font-size: .62rem; } #gridN { width: 65px; }
    #reviewTools { grid-template-columns: 1fr; gap: 5px; }
    #reviewStat { justify-content: center; gap: 12px; font-size: .65rem; }
    .reviewActions { justify-content: center; flex-wrap: wrap; }
    #reviewTools button { font-size: .68rem; padding: 4px 7px; }
    #burstCommit { justify-self: stretch; }
  }
</style>
</head>
<body>

<!-- ===== 1. カードを開く ===== -->
<section id="s-open" class="screen center on">
  <div class="card glass">
    <div class="logo">Card<b>Cull</b></div>
    <p class="lead">選別しているあいだに、残す写真を裏でコピー。<br>コピー済みの写真は表示しません。</p>
    <div class="opts">

<script>
"use strict";
// Keep the fitted photograph between the controls without a fixed blank band.
let photoLayoutFrame=0;
function schedulePhotoLayout(){
  if(photoLayoutFrame) return;
  photoLayoutFrame=requestAnimationFrame(()=>{
    photoLayoutFrame=0;
    const screen=document.getElementById('s-cull');
    if(!screen.classList.contains('on')) return;
    const header=document.getElementById('topbar').getBoundingClientRect();
    const footer=document.getElementById('bar').getBoundingClientRect();
    screen.style.setProperty('--photo-top', Math.ceil(header.bottom+8)+'px');
    screen.style.setProperty('--photo-bottom', Math.ceil(innerHeight-footer.top+8)+'px');
    document.documentElement.style.setProperty('--notice-bottom', Math.ceil(innerHeight-footer.top+10)+'px');
  });
}
const photoLayoutObserver=new ResizeObserver(schedulePhotoLayout);
for(const id of ['topbar','bar']) photoLayoutObserver.observe(document.getElementById(id));
new MutationObserver(schedulePhotoLayout).observe(document.getElementById('s-cull'),{attributes:true,attributeFilter:['class']});
window.addEventListener('resize',schedulePhotoLayout);
window.visualViewport?.addEventListener('resize',schedulePhotoLayout);

// ===== 基本設定 =====
const APP_NAME = 'CardCull';
const APP_KEY  = 'cardcull_v1';          // localStorage のキー
const APP_VERSION="dev"; /* GitHub Actionsが自動更新するため手動で変更しない */

/* ===== 自動更新（photo-location.html と同じ方式） ===== */
async function checkForUpdate(){
  try{
    const res=await fetch(location.href.split("?")[0]+"?_v="+Date.now(),{cache:"no-store"});
    if(!res.ok) return;
    const txt=await res.text();
    const m=txt.match(/APP_VERSION\s*=\s*"([^"]+)"/);   /* 「APP_VERSION=\"」と直接書くと公開時の書き換えで壊れる */
    if(m && m[1] && m[1]!==APP_VERSION) showUpdateBanner();
  }catch(e){}
}
function showUpdateBanner(){
  if(document.getElementById("updateBanner")) return;
  const b=document.createElement("div");
  b.id="updateBanner";
  b.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9999;background:#1565c0;color:#fff;display:flex;align-items:center;padding:10px 14px;gap:10px;font-size:13px;";
  b.innerHTML='<span style="flex:1;">🆕 新しいバージョンがあります</span>'
    +'<button onclick="location.reload(true)" style="background:#fff;color:#1565c0;border:none;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:13px;">更新する</button>'
    +'<button onclick="this.parentElement.remove()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 4px;">×</button>';
  document.body.prepend(b);
}
setTimeout(checkForUpdate,3000);
setInterval(checkForUpdate,60*60*1000);
(function(){
  const v=document.createElement('div');
  v.id='appVerBadge';
  v.textContent='ver.'+APP_VERSION;
  v.style.cssText='position:fixed;bottom:4px;left:6px;font-size:10px;color:#888;opacity:.6;z-index:9998;pointer-events:none;';
  document.body.appendChild(v);
})();

// ===== localStorage 保存・読込 =====
function loadState(){
  try { return JSON.parse(localStorage.getItem(APP_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveState(state){
  try { localStorage.setItem(APP_KEY, JSON.stringify(state)); } catch(e){}
}

// ===== 共通 =====
const $=id=>document.getElementById(id);
const JPG_EXT=new Set(['jpg','jpeg']);
const RAW_EXT=new Set(['nef','nrw','arw','cr2','cr3','raf','orf','rw2','dng','pef']);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); }
function fmtBytes(b){ return b>=1e9 ? (b/1e9).toFixed(1)+' GB' : Math.round(b/1e6)+' MB'; }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(ms){ const d=new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtTime(ms){ const d=new Date(ms); return fmtDate(ms)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function fmtDur(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h ? h+':'+pad(m)+':'+pad(x) : m+':'+pad(x); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let toastTimer=0;
function toast(msg,actLabel,act){
  $('toastMsg').textContent=msg;
  const b=$('toastAct');
  if(actLabel){ b.textContent=actLabel; b.style.display=''; b.onclick=()=>{ act(); $('toast').classList.remove('on'); }; }
  else b.style.display='none';
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('toast').classList.remove('on'), actLabel?6000:2500);
}
/* クリックしたボタンにフォーカスを残さない（Space キーでボタンが押されるのを防ぐ） */
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) b.blur(); });

// Browser fullscreen hides tabs and the address bar; it requires a click or key press.
let fullscreenBusy=false;
function syncFullscreenButton(){
  const active=!!document.fullscreenElement, button=$('fullscreenBtn');
  button.setAttribute('aria-pressed',String(active));
  button.querySelector('span').textContent=active ? '全画面を解除' : '全画面';
  button.title=active ? '全画面を解除（F または Esc）' : '全画面表示（F）。タブ・アドレスバーを隠す';
  schedulePhotoLayout();
}
async function toggleFullscreen(){
  if(fullscreenBusy) return;
  if(!document.documentElement.requestFullscreen || !document.exitFullscreen || document.fullscreenEnabled===false){
    toast('Chromeのメニューから全画面表示に切り替えてください'); return;
  }
  fullscreenBusy=true; $('fullscreenBtn').disabled=true;
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen({navigationUI:'hide'});
  }catch(e){
    toast('全画面にできませんでした。Chromeのメニューから全画面表示に切り替えてください');
  }finally{
    fullscreenBusy=false; $('fullscreenBtn').disabled=false; syncFullscreenButton();
  }
}
$('fullscreenBtn').onclick=toggleFullscreen;
document.addEventListener('fullscreenchange',syncFullscreenButton);
syncFullscreenButton();

// ===== 状態 =====
let cardDir=null;      // カードのフォルダ
let cardSig='';        // 選別状態の保存キー
let allGroups=[];      // カードの全写真。1枚 = { key, stem, files:[...], jpg, time, date, dropped, already, seen, copied, bgDone }
let groups=[];         // 選別の対象（コピー済みを隠しているときは除く）
let prepGeneration=0, prepRunning=false, prepFailed=0;
const burstSelections=new Set();
let showAlready=false; // コピー済みの写真も表示するか
let idx=0;
let view='all';        // 表示: all / kept（残すだけ）/ dropped（外すだけ）
let pickMode='drop';   // 選び方: drop（すべて残した状態から外す）/ keep（すべて外した状態から残す）
const prefs=loadState().prefs||{};
const BURST=13;          // gridN がこの値のときは「連写ごとの表示」
const BURST_GAP=2000;    // 撮影時刻の間隔がこれ以下なら同じ連写とみなす（ミリ秒）
let gridN=Math.min(BURST,Math.max(1,prefs.gridN|0||1));   // 一度に表示する枚数（1 = 1枚表示）
let lastGridN=Math.min(BURST,Math.max(2,prefs.lastGridN|0||6));


function decision(g){ return g.decision || 'unreviewed'; }
const DECISION_LABEL={unreviewed:'未確認',hold:'保留',keep:'採用',drop:'除外'};
function setDecision(g,value){
  g.decision=value;
  g.dropped=value==='drop' || (value==='unreviewed' && pickMode==='keep');
}
function snapshot(g){ return {g,prev:g.dropped,decision:decision(g)}; }
function restoreItem(it){
  it.g.dropped=it.prev;
  it.g.decision=it.decision || (it.prev?'drop':'unreviewed');
}
function canCopy(g,background=false){
  const d=decision(g);
  if(d==='drop') return false;
  if(background) return d==='keep';
  return d==='keep' || (d==='hold' && $('includeHeld').checked) || (d==='unreviewed' && $('includeUnreviewed').checked);
}
function cancelPreparation(){ prepGeneration++; prepRunning=false; }
function updateReviewUI(){
  const cur=groups[idx];
  const counts={unreviewed:0,hold:0,keep:0,drop:0};
  for(const g of allGroups) counts[decision(g)]++;
  for(const el of $('reviewStat').querySelectorAll('[data-count]')) el.textContent=counts[el.dataset.count];
  $('decisionBadge').textContent=cur ? DECISION_LABEL[decision(cur)] : '';
  const held=!!cur && decision(cur)==='hold';
  $('holdBtn').querySelector('.btnLabel').textContent=held ? '保留を解除' : '保留';
  $('holdBtn').setAttribute('aria-pressed',String(held));
  const list=visibleList(), pos=list.indexOf(idx);
  $('seek').max=String(Math.max(0,list.length-1));
  $('seek').value=String(Math.max(0,pos));
  $('seek').disabled=list.length<2;
  $('seek').setAttribute('aria-valuetext',list.length ? (pos+1)+' / '+list.length+'枚' : '対象なし');
  $('firstBtn').disabled=pos<=0;
  $('posFill').style.width=(list.length>1 ? Math.max(0,pos)/(list.length-1)*100 : 0)+'%';
  $('burstBtn').disabled=prepRunning;
  $('burstBtn').querySelector('.btnLabel').textContent=prepRunning ? '連写を準備中' : (gridN===BURST?'1枚表示':'連写表示');
  $('burstBtn').setAttribute('aria-pressed',String(gridN===BURST));
  $('burstCommit').hidden=gridN!==BURST || prepRunning;
  const mem=cur ? burstMembers.get(cur.burst)||[] : [];
  const n=mem.filter(g=>burstSelections.has(g.key)).length;
  $('burstCommit').textContent='選んだ '+n+'枚を残して次へ';
  $('burstCommit').disabled=!n;
  const hid=allGroups.filter(g=>g.already).length;
  $('hidBtn').style.display=hid?'':'none';
  $('hidBtn').textContent='コピー済み '+hid+'枚を'+(showAlready?'隠す':'表示');
}
async function prepareInBackground(list,token){
  prepFailed=0;
  const pending=new Set(list);
  let completed=0;
  while(pending.size && token===prepGeneration){
    // Current position and its neighbours go first; the displayed order stays fixed.
    const ordered=groups.slice(idx).concat(groups.slice(0,idx));
    const batch=ordered.filter(g=>pending.has(g)).slice(0,8);
    if(!batch.length) batch.push(...[...pending].slice(0,8));
    await Promise.all(batch.map(async g=>{
      try{
        const f=g.jpg || g.files[0];
        const ex=g.exif!==undefined ? g.exif : await readExif(f.file,g.jpg?73728:131072).catch(()=>null);
        if(token!==prepGeneration) return;
        g.exif=ex;
        g.time=ex && ex.ms!=null ? ex.ms : g.time;
        g.date=fmtDate(g.time);
        g.already=await isAlready(g,getMode());
        if(token!==prepGeneration) return;
        g.ready=true;
      }catch(e){ if(token===prepGeneration){ g.prepError=e.message||String(e); prepFailed++; } }
    }));
    if(token!==prepGeneration) return;
    for(const g of batch){ pending.delete(g); completed++; }
    $('prepStatus').textContent='連写・コピー済み確認 '+completed+' / '+list.length;
    if(groups[idx]) $('ftime').textContent=fmtTime(groups[idx].time);
    updateReviewUI();
    if($('s-copy').classList.contains('on') && !copying) copyRefresh();
    await new Promise(r=>setTimeout(r,0));
  }
  if(token!==prepGeneration) return;
  // Only now enable burst actions. No global sorting or automatic hiding during culling.
  assignBursts(list); buildBursts(); prepRunning=false;
  $('prepStatus').textContent=prepFailed ? '確認失敗 '+prepFailed+'枚・カードを開き直してください' : '準備完了';
  if($('s-cull').classList.contains('on')) render();
  if($('s-copy').classList.contains('on') && !copying) copyRefresh();
}

// ===== 1. カードを開く =====
$('openStatus').textContent='';   // スクリプトが動いた印
if(!('showDirectoryPicker' in window)){
  $('openBtn').disabled=true;
  $('openStatus').textContent='このブラウザでは使えません。Mac の Chrome または Edge で開いてください。';
}
$('openBtn').onclick=openCard;

/* ----- 保存先（IndexedDB に覚えておく） ----- */
let destDir=null, destOK=false;
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('cardcull',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function kvGet(k){
  try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }); }
  catch(e){ return undefined; }
}
async function kvSet(k,v){
  try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res; }); }
  catch(e){}
}
function updDestUI(){
  const can='showDirectoryPicker' in window;
  $('destName').textContent=destDir ? destDir.name : '未選択';
  $('destName').classList.toggle('muted',!destDir);
  $('destBtn').textContent=destDir ? '変更' : '選ぶ';
  $('destBtn').disabled=!can;
  $('permBtn').style.display=(destDir && !destOK) ? '' : 'none';
  $('openBtn').disabled=!can || !destOK;
  if(can) $('openStatus').textContent=destOK ? '' : (destDir ? '［使用を許可］を押すと、前回の保存先を使います。' : '先に保存先を選んでください。');
}
(async()=>{
  const h=await kvGet('dest');
  if(h && h.queryPermission){
    destDir=h;
    try { destOK=(await h.queryPermission({mode:'readwrite'}))==='granted'; } catch(e){ destOK=false; }
  }
  updDestUI();
})();
$('destBtn').onclick=async()=>{
  let d;

/* 連写の組: 撮影時刻を全写真ぶん読み（JPEG は先頭 72KB だけ）、間隔が BURST_GAP 以下なら同じ組 */
async function readTimes(list){
  for(let i=0;i<list.length;i+=8){
    await Promise.all(list.slice(i,i+8).map(async g=>{
      const f=g.jpg || g.files[0];
      try { g.exif=await readExif(f.file, g.jpg?73728:131072); } catch(e){ g.exif=null; }
    }));
    $('openStatus').textContent='撮影時刻を読み込み中… '+Math.min(i+8,list.length)+' / '+list.length;
  }
}
function assignBursts(list){
  let b=0, prev=null;
  for(const g of list){
    const t=(g.exif && g.exif.ms!=null) ? g.exif.ms : g.time;
    if(prev==null || Math.abs(t-prev)>BURST_GAP) b++;
    g.burst=b; prev=t;
  }
}
let burstMembers=new Map();   // 連写の組の番号 -> 選別の対象になっている写真（並び順）
function buildBursts(){
  burstMembers=new Map();
  for(const g of groups){ let a=burstMembers.get(g.burst); if(!a) burstMembers.set(g.burst,a=[]); a.push(g); }
}

async function walk(dir,path,out,st){
  for await (const [name,h] of dir.entries()){
    if(name.startsWith('.')) continue;   // 隠しファイル・._ファイル
    if(h.kind==='directory'){ await walk(h,path+name+'/',out,st); continue; }
    const dot=name.lastIndexOf('.');
    const ext=dot>0 ? name.slice(dot+1).toLowerCase() : '';
    if(JPG_EXT.has(ext)||RAW_EXT.has(ext)) out.push({path,name,stem:name.slice(0,dot),ext,h,file:null});
    else st.other++;
    if((out.length+st.other)%200===0) $('openStatus').textContent='探しています… '+out.length+'件';
  }
}

async function openCard(){

    await walk(dir,'',found,st);

      await Promise.all(found.slice(i,i+32).map(async f=>{ f.file=await f.h.getFile(); }));
      $('openStatus').textContent='情報を読み込み中… '+Math.min(i+32,found.length)+' / '+found.length;
    }

    const map=new Map();

      let g=map.get(key);
      if(!g){ g={key,stem:f.stem,files:[],jpg:null,time:Infinity,dropped:false}; map.set(key,g); }
      g.files.push(f);

      g.time=Math.min(g.time,f.file.lastModified);
    }
    const list=[...map.values()];
    list.sort((a,b)=>a.time-b.time || (a.key<b.key?-1:a.key>b.key?1:0));
    if(!list.length){

    await stopBg();

    cardSig=[dir.name,list.length,list[0].key,list[list.length-1].key,total].join('|');
    clearCache(); clearThumbs(); dateDirs.clear();
    // Show photographs before all EXIF and destination checks complete.
    prepRunning=true; prepFailed=0;

    allGroups=list; showAlready=true;

    $('prepStatus').textContent='連写・コピー済み確認 0 / '+list.length;
    show('s-cull'); render(); startBg();
    const token=prepGeneration;
    void prepareInBackground(list,token).catch(e=>{
      if(token!==prepGeneration) return;
      prepRunning=false; prepFailed++;
      $('prepStatus').textContent='確認に失敗しました。カードを開き直してください';
      updateReviewUI();

    else if(st.other) toast(list.length+'枚を読み込みました（動画など '+st.other+'件は対象外）');

  }catch(e){
    $('openStatus').textContent='読み込めませんでした: '+(e.message||e);
  }finally{
    $('openBtn').disabled=false;
  }

// ===== 選別状態の保存・復元 =====
function restoreSession(){
  const s=(loadState().sessions||{})[cardSig];
  if(!s) return 0;
  const set=new Set(s.dropped||[]);
  pickMode=s.mode==='keep'?'keep':'drop';
  $('includeUnreviewed').checked=pickMode==='drop';
  for(const g of allGroups){
    const saved=s.decisions && s.decisions[g.key];
    setDecision(g,['unreviewed','hold','keep','drop'].includes(saved) ? saved : (s.decisions ? 'unreviewed' : (set.has(g.key)?'drop':'unreviewed')));
  }
  let j=s.key ? groups.findIndex(g=>g.key===s.key) : -1;
  if(j<0) j=Math.min(Math.max(0,s.idx|0),groups.length-1);
  idx=j;
  // Position is not evidence that earlier photos were reviewed.
  return groups.filter(marked).length;
}
let saveTimer=0;
function saveSoon(){
  clearTimeout(saveTimer);

  if(!signature) return;
  const session={decisions:Object.fromEntries(allGroups.filter(g=>decision(g)!=='unreviewed').map(g=>[g.key,decision(g)])),dropped:allGroups.filter(g=>g.dropped).map(g=>g.key),idx,key:groups[idx]?groups[idx].key:'',mode:pickMode,t:Date.now()};
  saveTimer=setTimeout(()=>{

    const keys=Object.keys(sessions).sort((a,b)=>sessions[b].t-sessions[a].t);

// ===== 2. 選別 =====
const cache=new Map();   // key -> { url, im }
function load(g){
  let c=cache.get(g.key);
  if(!c){
    const url=URL.createObjectURL(g.jpg.file);
    const im=new Image(); im.decoding='async'; im.src=url;
    im.decode().catch(()=>{});
    c={url,im}; cache.set(g.key,c);
  }
  return c;
}
function clearCache(){
  for(const c of cache.values()){ URL.revokeObjectURL(c.url); c.im.src=''; }
  cache.clear();
}
function match(g){ return !!g && (view==='all' || (view==='kept' ? decision(g)==='keep' : view==='dropped' ? decision(g)==='drop' : decision(g)===view)); }
function findFrom(start,dir){
  for(let j=start;j>=0&&j<groups.length;j+=dir) if(match(groups[j])) return j;
  return -1;
}
function prefetch(){
  const keep=new Set([groups[idx].key]);
  let j=idx;
  for(let n=0;n<4;n++){ j=findFrom(j+1,1); if(j<0) break; const g=groups[j]; keep.add(g.key); if(g.jpg) load(g); }
  j=findFrom(idx-1,-1);
  if(j>=0){ const g=groups[j]; keep.add(g.key); if(g.jpg) load(g); }
  for(const [k,c] of cache){ if(!keep.has(k)){ URL.revokeObjectURL(c.url); c.im.src=''; cache.delete(k); } }
}
function keptStats(mode){
  let n=0,files=0,bytes=0,dropped=0;
  for(const g of groups){
    if(decision(g)==='drop'){ dropped++; continue; }
    if(!canCopy(g)) continue;
    const fs=filesFor(g,mode);
    if(!fs.length) continue;
    n++; files+=fs.length;
    for(const f of fs) bytes+=f.file.size;
  }
  return {n,files,bytes,dropped};
}

  const photo=$('photo'), noimg=$('noimg'), grid=$('grid');

/* ----- 等倍表示（画像の1ピクセル = 画面の1ピクセル） ----- */
let zoomed=false, zoomFx=.5, zoomFy=.5;   // 表示中心の位置（写真の幅・高さに対する割合）
function setZoom(on,fx,fy){
  if(on && (gridN>1 || !groups[idx] || !groups[idx].jpg)) return;
  zoomed=on;
  if(on){ zoomFx=fx==null?.5:fx; zoomFy=fy==null?.5:fy; }
  render();

function applyZoom(){
  const z=$('zoom'), zi=$('zimg'), url=$('photo').getAttribute('src');
  $('stage').classList.add('zoomed');
  const place=()=>{
    const dpr=window.devicePixelRatio||1;
    zi.style.width=(zi.naturalWidth/dpr)+'px';
    zi.style.height=(zi.naturalHeight/dpr)+'px';
    const fx=zoomFx, fy=zoomFy;   // scroll イベントで書き換わる前の値を使う

    z.scrollTop=fy*zi.offsetHeight-z.clientHeight/2;

// 写真をクリックした位置を中心に等倍にする
$('photo').addEventListener('click',e=>{

  if(!nw) return;
  const k=Math.min(r.width/nw,r.height/nh), dw=nw*k, dh=nh*k;
  const cl=v=>Math.min(1,Math.max(0,v));
  setZoom(true, cl((e.clientX-r.left-(r.width-dw)/2)/dw), cl((e.clientY-r.top-(r.height-dh)/2)/dh));
});
// 次の写真へ移っても同じ位置を等倍で見られるよう、表示中心を覚えておく
$('zoom').addEventListener('scroll',()=>{

// ドラッグで移動、動かさずにクリックしたら戻る（トラックパッドのスクロールでも移動できる）
let zdrag=null;
$('zoom').addEventListener('pointerdown',e=>{

/* ----- 撮影情報（シャッター速度・絞り・ISO・焦点距離・露出補正） -----
   JPEG（なければ RAW）の先頭 128KB だけを読み、EXIF から取り出す。 */
async function readExif(file,bytes){
  const buf=await file.slice(0,bytes||131072).arrayBuffer();
  const dv=new DataView(buf), L=dv.byteLength;
  let tiff=-1;
  if(L>4 && dv.getUint16(0)===0xFFD8){          // JPEG: APP1 "Exif" を探す
    let p=2;
    while(p+10<=L){
      const m=dv.getUint16(p);
      if((m&0xFF00)!==0xFF00 || m===0xFFDA) break;
      if(m===0xFFE1 && dv.getUint32(p+4)===0x45786966){ tiff=p+10; break; }
      p+=2+dv.getUint16(p+2);
    }
  }else tiff=0;                                  // NEF などは TIFF 形式
  if(tiff<0 || tiff+8>L) return null;
  const le=dv.getUint16(tiff)===0x4949;
  const ok=(o,n)=>tiff+o+n<=L;
  const u16=o=>dv.getUint16(tiff+o,le), u32=o=>dv.getUint32(tiff+o,le), s32=o=>dv.getInt32(tiff+o,le);
  if(u16(2)!==42) return null;
  const ifd=off=>{
    const out={};
    if(!ok(off,2)) return out;
    const n=u16(off);
    for(let i=0;i<n;i++){ const e=off+2+i*12; if(!ok(e,12)) break; out[u16(e)]={type:u16(e+2),cnt:u32(e+4),vo:e+8}; }
    return out;
  };
  const val=en=>{
    if(!en) return null;
    const size={3:2,4:4,5:8,10:8}[en.type];
    if(!size) return null;
    const off=size*en.cnt>4 ? u32(en.vo) : en.vo;
    if(!ok(off,size)) return null;
    if(en.type===3) return u16(off);
    if(en.type===4) return u32(off);
    if(en.type===5){ const d=u32(off+4); return d ? u32(off)/d : null; }
    const d=s32(off+4); return d ? s32(off)/d : null;
  };
  const str=en=>{
    if(!en || en.type!==2) return null;
    const off=en.cnt>4 ? u32(en.vo) : en.vo;
    if(!ok(off,en.cnt)) return null;
    let r=''; for(let i=0;i<en.cnt;i++){ const c=dv.getUint8(tiff+off+i); if(!c) break; r+=String.fromCharCode(c); }
    return r;
  };
  const ep=val(ifd(u32(4))[0x8769]);   // Exif IFD への位置
  if(!ep) return null;
  const ex=ifd(ep);
  // 撮影時刻（DateTimeOriginal + SubSecTimeOriginal）をミリ秒に
  let ms=null;
  const dt=str(ex[0x9003]), m=dt && dt.match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
  if(m){
    ms=new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();
    const sub=str(ex[0x9291]);
    if(sub && /^\d+$/.test(sub.trim())) ms+=Math.round(parseFloat('0.'+sub.trim())*1000);
  }
  return { t:val(ex[0x829A]), f:val(ex[0x829D]), iso:val(ex[0x8827]), fl:val(ex[0x920A]), ev:val(ex[0x9204]), ms };
}
function fmtExif(x){
  if(!x) return '';
  const a=[];
  if(x.t) a.push(x.t>=0.3 ? (Math.round(x.t*10)/10)+'秒' : '1/'+Math.round(1/x.t));
  if(x.f) a.push('f/'+(x.f<10 ? (Math.round(x.f*10)/10) : Math.round(x.f)));
  if(x.iso) a.push('ISO '+x.iso);
  if(x.fl) a.push(Math.round(x.fl)+'mm');
  if(x.ev && Math.abs(x.ev)>=0.05) a.push((x.ev>0?'+':'')+(Math.round(x.ev*10)/10)+'EV');
  return a.join('　');
}
function showExif(g){
  $('exif').textContent=g.exif ? fmtExif(g.exif) : '';
  if(g.exif!==undefined || g.exifBusy) return;
  const f=g.jpg || g.files[0];
  g.exifBusy=true;
  readExif(f.file).catch(()=>null).then(x=>{
    g.exif=x; g.exifBusy=false;
    if(groups[idx]===g) $('exif').textContent=fmtExif(x);
  });
}

function confirmLeaving(){
  // Sequential single-photo review keeps the original reject-and-advance workflow.
  const g=groups[idx];
  if(gridN===1 && pickMode==='drop' && g && g.seen && decision(g)==='unreviewed') setDecision(g,'keep');
}
function step(dir){
  const j=findFrom(idx+dir,dir);
  confirmLeaving();
  if(j>=0) idx=j;
  afterDecision();
}
function jump(j){ if(j>=0 && j<groups.length){ idx=j; render(); saveSoon(); } }
function afterDecision(){
  if(!match(groups[idx])){
    const j=findFrom(idx+1,1)>=0 ? findFrom(idx+1,1) : findFrom(idx-1,-1);
    if(j>=0) idx=j; else view='all';
  }
  render(); saveSoon();
}
/* ----- 選別して次へ進んだときの、めくる演出（1枚表示のみ） -----
   前の写真の複製を重ね、左端を軸にめくって消す。縁の色で判断を示す（除外=赤・採用=シアン・保留=黄）。
   「視差効果を減らす」が有効なときは、めくらずに短くフェードする。 */
let flipEl=null, flipTimer=0;
function flipFrom(kind){
  endFlip();
  if(gridN!==1 || zoomed) return;
  const photo=$('photo');
  if(photo.style.display==='none' || !photo.getAttribute('src') || !photo.naturalWidth) return;
  const st=$('stage'), r=photo.getBoundingClientRect(), sr=st.getBoundingClientRect();
  const k=Math.min(r.width/photo.naturalWidth, r.height/photo.naturalHeight);
  const w=photo.naturalWidth*k, h=photo.naturalHeight*k;
  const el=document.createElement('div');
  el.className='flip '+kind;
  el.style.left=(r.left-sr.left+(r.width-w)/2)+'px'; el.style.top=(r.top-sr.top+(r.height-h)/2)+'px';
  el.style.width=w+'px'; el.style.height=h+'px';
  const im=photo.cloneNode(); im.removeAttribute('id');
  const shade=document.createElement('i');
  el.append(im,shade);
  st.appendChild(el); flipEl=el;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur=reduce ? 160 : 420;
  if(el.animate){
    if(reduce) el.animate([{opacity:1},{opacity:0}],{duration:dur,easing:'ease-out',fill:'forwards'});
    else{
      el.animate([
        {transform:'perspective(1800px) rotateY(0deg)',opacity:1},
        {transform:'perspective(1800px) rotateY(-55deg)',opacity:1,offset:.6},
        {transform:'perspective(1800px) rotateY(-90deg)',opacity:0}
      ],{duration:dur,easing:'cubic-bezier(.3,0,.4,1)',fill:'forwards'});
      shade.animate([{opacity:0},{opacity:.55}],{duration:dur,easing:'ease-in',fill:'forwards'});
    }
  }
  flipTimer=setTimeout(endFlip,dur+60);   // アニメーションが進まない環境でも必ず消す
}
function endFlip(){ clearTimeout(flipTimer); if(flipEl){ flipEl.remove(); flipEl=null; } }
// 判断を変えて表示を更新する。次の写真へ進んだときだけめくる
function decideAndFlip(from,kind){
  flipFrom(kind);
  afterDecision();
  if(idx===from) endFlip();
}

function toggle(){
  const g=groups[idx]; if(!g) return;
  const it=snapshot(g), from=idx;
  const target=pickMode==='drop'?'drop':'keep';
  setDecision(g,decision(g)===target ? (target==='drop'?'keep':'drop') : target);
  if(view==='all' && decision(g)===target){ const j=findFrom(idx+1,1); if(j>=0) idx=j; }
  decideAndFlip(from,decision(g));
  if(idx!==from && gridN===1) showNote(g.stem+' を'+(g.dropped?'外しました':'残しました'),g.dropped,[it],g);
}
function holdCurrent(){
  const g=groups[idx]; if(!g) return;
  const it=snapshot(g), from=idx;
  setDecision(g,decision(g)==='hold'?'unreviewed':'hold');
  if(decision(g)==='hold'){ const j=findFrom(idx+1,1); if(j>=0) idx=j; }
  decideAndFlip(from,decision(g));
  showNote(g.stem+'：'+DECISION_LABEL[decision(g)],false,[it],g);
}
function confirmVisible(){
  const current=groups[idx]; if(!current) return;
  const items=allGroups.filter(g=>screenKeys.has(g.key) && decision(g)==='unreviewed').map(snapshot);
  for(const it of items) setDecision(it.g,'keep');
  afterDecision();
  if(items.length) showNote(items.length+'枚を採用にしました',false,items,current);
  else toast('表示中に未確認の写真はありません');
}
$('holdBtn').onclick=holdCurrent;
$('reviewBtn').onclick=confirmVisible;
$('firstBtn').onclick=()=>jump(findFrom(0,1));

/* ----- 前の写真の結果を知らせる通知（3秒で消える・取り消せる） ----- */
let noteAct=null, noteTimer=0, noteHover=false;
// items: [{g, prev}]（取り消しで戻す写真と元の状態）、back: 取り消したら表示する写真
function showNote(msg,isDrop,items,back){

  $('noteMsg').textContent=msg;

  n.classList.toggle('drop',isDrop); n.classList.toggle('keep',!isDrop);
  $('toast').classList.remove('on');
  n.classList.add('on');

}
function armNote(){ clearTimeout(noteTimer); if(!noteHover) noteTimer=setTimeout(hideNote,3000); }
function hideNote(){ clearTimeout(noteTimer); noteAct=null; $('note').classList.remove('on'); }
function undoNote(){
  const a=noteAct;
  if(!a) return;
  hideNote();
  for(const it of a.items) restoreItem(it);   // 印を元に戻し、その写真へ戻る
  const j=groups.indexOf(a.back);
  if(j>=0){ if(!match(a.back)) view='all'; jump(j); } else { render(); saveSoon(); }
}
$('noteUndo').onclick=undoNote;
$('note').addEventListener('mouseenter',()=>{ noteHover=true; clearTimeout(noteTimer); });
$('note').addEventListener('mouseleave',()=>{ noteHover=false; if(noteAct) armNote(); });
function setView(v){
  hideNote();
  const old=view; view=v;
  if(!groups.some(match)){ view=old; toast('この条件の写真はありません'); return; }
  if(!match(groups[idx])){ let j=findFrom(idx,1); if(j<0) j=findFrom(idx,-1); idx=j; }
  render(); saveSoon();
}

// 印が付いている（＝初期状態から変えた）写真か: 外すを選ぶでは外した写真、残すを選ぶでは残した写真
function marked(g){ return decision(g)===(pickMode==='drop'?'drop':'keep'); }
function markWord(){ return pickMode==='drop' ? '外す' : '残す'; }
function setPickMode(m){
  hideNote();
  if(m===pickMode) return;
  pickMode=m;
  $('includeUnreviewed').checked=m==='drop';
  for(const g of allGroups) if(decision(g)==='unreviewed') setDecision(g,'unreviewed');
  render(); saveSoon();
  toast(m==='keep' ? '採用する写真を選びます。これまでの判断は保持します' : '不要な写真を外します。これまでの判断は保持します');
}

$('modeBtn').onclick=()=>setPickMode(pickMode==='drop'?'keep':'drop');

/* ----- 一覧表示（2〜12枚） ----- */
const thumbs=new Map();   // key -> canvas（縮小した画像。古い順に捨てる）
const THUMB_MAX=60, THUMB_PX=800;
let thumbQ=[], thumbBusy=0, thumbGen=0, gridCols=1;
function clearThumbs(){ thumbs.clear(); thumbQ=[]; thumbGen++; for(const g of allGroups){ g.thumbFail=false; g.thumbBusy=false; } }
function visibleList(){ const a=[]; for(let i=0;i<groups.length;i++) if(match(groups[i])) a.push(i); return a; }
async function makeThumb(g){
  const url=URL.createObjectURL(g.jpg.file);
  const im=new Image();
  try{
    im.src=url;
    await im.decode();
    const k=Math.min(1,THUMB_PX/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*k));
    c.height=Math.max(1,Math.round(im.naturalHeight*k));
    const ctx=c.getContext('2d');
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(im,0,0,c.width,c.height);
    return c;
  }catch(e){ return null; }
  finally{ im.src=''; URL.revokeObjectURL(url); }
}
function placeThumb(g,c){
  const cell=$('grid').querySelector('.cell[data-key="'+CSS.escape(g.key)+'"]');
  const ph=cell && cell.querySelector('.ph');
  if(!ph) return;
  if(c) ph.replaceWith(c); else ph.textContent='読み込めません';
}
function queueThumbs(list){
  thumbQ=list.filter(g=>g.jpg && !g.thumbFail && !thumbs.has(g.key));
  pumpThumbs();
}
function pumpThumbs(){
  while(thumbBusy<2 && thumbQ.length){   // カードからの読み込みは同時に2枚まで
    const g=thumbQ.shift();
    if(g.thumbBusy || thumbs.has(g.key)) continue;
    const gen=thumbGen;
    g.thumbBusy=true; thumbBusy++;
    makeThumb(g).then(c=>{
      if(gen!==thumbGen) return;   // 別のカードを開いた後
      if(c){
        thumbs.set(g.key,c);
        while(thumbs.size>THUMB_MAX) thumbs.delete(thumbs.keys().next().value);
      }else g.thumbFail=true;
      placeThumb(g,c);
    }).finally(()=>{ g.thumbBusy=false; thumbBusy--; pumpThumbs(); });
  }
}
function renderGrid(){
  const grid=$('grid'), list=visibleList();
  let pos=list.indexOf(idx); if(pos<0) pos=0;
  let start, page;
  if(gridN===BURST){
    // 1ページ = 1つの連写（13枚以上は12枚ずつに分ける）
    const b=groups[list[pos]].burst;
    let s0=pos; while(s0>0 && groups[list[s0-1]].burst===b) s0--;
    let e0=pos; while(e0+1<list.length && groups[list[e0+1]].burst===b) e0++;
    start=s0+Math.floor((pos-s0)/12)*12;
    page=list.slice(start,Math.min(e0+1,start+12));
  }else{
    start=Math.floor(pos/gridN)*gridN;
    page=list.slice(start,start+gridN);
  }
  const count=gridN===BURST ? page.length : gridN;
  screenKeys=new Set(page.map(i=>groups[i].key));
  for(const i of page) groups[i].seen=true;
  updBg(); bgKick();
  if(cmpOn){ grid.style.display='none'; grid.textContent=''; renderCompare(page); return; }
  $('cmp').style.display='none'; $('stage').classList.remove('comparing');
  // 3:2 の写真が一番大きく見える列数を選ぶ
  const W=$('stage').clientWidth, H=$('stage').clientHeight, gap=8;
  let best=1, bestW=-1;
  for(let c=1;c<=count;c++){
    const r=Math.ceil(count/c);
    const w=Math.min((W-(c-1)*gap)/c, (H-(r-1)*gap)/r*1.5);
    if(w>bestW){ bestW=w; best=c; }
  }
  gridCols=best;
  grid.style.gridTemplateColumns='repeat('+best+',minmax(0,1fr))';
  grid.style.gridTemplateRows='repeat('+Math.ceil(count/best)+',minmax(0,1fr))';
  grid.dataset.mode=pickMode;
  grid.textContent='';
  for(const i of page){
    const x=groups[i];
    const cell=document.createElement('div');
    cell.className='cell'+(i===idx?' cur':'')+(marked(x)?' mark':'');
    cell.dataset.i=i; cell.dataset.key=x.key;
    const bm=burstMembers.get(x.burst);
    if(bm && bm.length>1){ cell.classList.add('burst'); cell.style.setProperty('--bc', x.burst%2 ? 'var(--accent2)' : 'var(--accent)'); }   // 同じ連写は同じ色の線
    const c=thumbs.get(x.key);
    if(c){ thumbs.delete(x.key); thumbs.set(x.key,c); cell.appendChild(c); }   // 使った順に並べ直す
    else{
      const ph=document.createElement('div'); ph.className='ph';
      ph.textContent=x.jpg ? (x.thumbFail?'読み込めません':'') : x.files[0].ext.toUpperCase()+' のみ';
      cell.appendChild(ph);
    }
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=x.stem;
    const mk=document.createElement('div'); mk.className='mk'; mk.textContent=markWord();
    cell.append(nm,mk);
    cell.dataset.decision=decision(x);
    const status=document.createElement('span'); status.className='decision'; status.textContent=DECISION_LABEL[decision(x)]; cell.append(status);
    if(gridN===BURST && !prepRunning){
      const label=document.createElement('label'); label.className='burst-pick';
      const box=document.createElement('input'); box.type='checkbox'; box.checked=burstSelections.has(x.key); box.dataset.pick=x.key;
      box.setAttribute('aria-label',x.stem+'を連写の採用候補にする');
      label.append(box,document.createTextNode('残す候補')); cell.append(label);
    }
    grid.appendChild(cell);
  }
  // 表示中のページを先に、次のページを後に読み込む
  queueThumbs(page.concat(list.slice(start+page.length,start+page.length+12)).map(i=>groups[i]));
}

/* ----- 並べて等倍で比較（全部の写真が同じ位置を表示し、一緒に動く） -----
   4枚までは全部、5枚以上は選択中とその次（組の最後なら前）の2枚 */
let cmpOn=false, cmpIds=[];
const cmpCache=new Map();   // key -> objectURL
function setCompare(on){
  if(on && gridN===1) return;
  cmpOn=on;
  if(!on) clearCmp();
  render();
}
function clearCmp(){
  for(const u of cmpCache.values()) URL.revokeObjectURL(u);
  cmpCache.clear();
  cmpIds=[];
  const c=$('cmp'); c.textContent=''; c.dataset.keys=''; c.style.display='none';
  $('stage').classList.remove('comparing');
}
function renderCompare(page){
  const pos=page.indexOf(idx);
  let ids;
  if(page.length<=4) ids=page.slice();
  else if(cmpIds.includes(idx) && cmpIds.every(i=>page.includes(i))) ids=cmpIds;   // 2枚の中で選択を移しただけなら並びはそのまま
  else{
    const other=page[pos+1]!==undefined ? page[pos+1] : page[pos-1];
    ids=[idx,other].filter(v=>v!==undefined).sort((a,b)=>a-b);
  }
  cmpIds=ids;
  const cmp=$('cmp');
  cmp.style.display='grid';
  $('stage').classList.add('comparing');
  $('zoomTag').textContent='等倍で比較　ドラッグで全部いっしょに移動　Z・Esc で戻る';
  const keys=ids.map(i=>groups[i].key).join('|');
  if(cmp.dataset.keys!==keys){
    cmp.dataset.keys=keys;
    const keep=new Set(ids.map(i=>groups[i].key));
    for(const [k,u] of cmpCache) if(!keep.has(k)){ URL.revokeObjectURL(u); cmpCache.delete(k); }
    const cols=ids.length<=3 ? ids.length : 2;
    cmp.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';
    cmp.style.gridTemplateRows='repeat('+Math.ceil(ids.length/cols)+',minmax(0,1fr))';
    cmp.textContent='';
    for(const i of ids){
      const x=groups[i];
      const pane=document.createElement('div');
      pane.className='cell pane'; pane.dataset.i=i;
      if(x.jpg){
        let u=cmpCache.get(x.key);
        if(!u){ u=URL.createObjectURL(x.jpg.file); cmpCache.set(x.key,u); }
        const im=new Image(); im.draggable=false; im.onload=placePanes; im.src=u;
        pane.appendChild(im);
      }else{
        const ph=document.createElement('div'); ph.className='ph'; ph.textContent='JPEG がないため表示できません'; pane.appendChild(ph);
      }
      const nm=document.createElement('div'); nm.className='nm'; nm.textContent=x.stem;
      const mk=document.createElement('div'); mk.className='mk'; mk.textContent=markWord();
      pane.append(nm,mk);
      cmp.appendChild(pane);
    }
  }
  cmp.dataset.mode=pickMode;
  for(const pane of cmp.querySelectorAll('.pane')){
    const i=+pane.dataset.i;
    pane.classList.toggle('cur',i===idx);
    pane.classList.toggle('mark',marked(groups[i]));
    pane.querySelector('.mk').textContent=markWord();
  }
  placePanes();
}
function placePanes(){
  const dpr=window.devicePixelRatio||1;
  for(const pane of $('cmp').querySelectorAll('.pane')){
    const im=pane.querySelector('img');
    if(!im || !im.naturalWidth) continue;
    const W=pane.clientWidth, H=pane.clientHeight, iw=im.naturalWidth/dpr, ih=im.naturalHeight/dpr;
    im.style.width=iw+'px'; im.style.height=ih+'px';
    const cx=iw<=W ? iw/2 : Math.min(iw-W/2,Math.max(W/2,zoomFx*iw));
    const cy=ih<=H ? ih/2 : Math.min(ih-H/2,Math.max(H/2,zoomFy*ih));
    im.style.left=(W/2-cx)+'px'; im.style.top=(H/2-cy)+'px';
  }
}
// 共通の表示中心を、最初の写真で見える範囲に収める（端で引っかからないように）
function cmpRef(){
  const pane=$('cmp').querySelector('.pane'), im=pane && pane.querySelector('img');
  return (im && im.naturalWidth) ? {W:pane.clientWidth,H:pane.clientHeight,iw:im.offsetWidth,ih:im.offsetHeight} : null;
}
function cmpMove(fx,fy){
  const r=cmpRef(); if(!r) return;
  const cl=(v,half)=>half>=.5 ? .5 : Math.min(1-half,Math.max(half,v));
  zoomFx=cl(fx,r.W/2/r.iw); zoomFy=cl(fy,r.H/2/r.ih);
  placePanes();
}
let cdrag=null;
$('cmp').addEventListener('pointerdown',e=>{
  const r=cmpRef();
  cdrag={x:e.clientX,y:e.clientY,fx:zoomFx,fy:zoomFy,moved:false,iw:r?r.iw:1,ih:r?r.ih:1,pane:e.target.closest('.pane')};
  $('cmp').setPointerCapture(e.pointerId); $('cmp').classList.add('drag');
});
$('cmp').addEventListener('pointermove',e=>{
  if(!cdrag) return;
  const dx=e.clientX-cdrag.x, dy=e.clientY-cdrag.y;
  if(Math.abs(dx)+Math.abs(dy)>4) cdrag.moved=true;
  cmpMove(cdrag.fx-dx/cdrag.iw, cdrag.fy-dy/cdrag.ih);
});
$('cmp').addEventListener('pointerup',()=>{
  const d=cdrag; cdrag=null; $('cmp').classList.remove('drag');
  if(d && !d.moved && d.pane){ const i=+d.pane.dataset.i; if(i!==idx) jump(i); }   // クリックした写真を選択
});
$('cmp').addEventListener('pointercancel',()=>{ cdrag=null; $('cmp').classList.remove('drag'); });
$('cmp').addEventListener('wheel',e=>{   // トラックパッドのスクロールでも一緒に移動
  e.preventDefault();
  const r=cmpRef(); if(!r) return;
  cmpMove(zoomFx+e.deltaX/r.iw, zoomFy+e.deltaY/r.ih);
},{passive:false});

/* ----- 連写の操作 ----- */
// Shift + Space: この1枚だけ残し、同じ連写のほかは外す（組の中にとどまる）
function onlyKeep(){
  const cur=groups[idx]; if(!cur) return;
  const mem=burstMembers.get(cur.burst) || [cur];
  if(prepRunning){ toast('連写の準備中です'); return; }
  const items=mem.map(snapshot);
  for(const g of mem) setDecision(g,g===cur?'keep':'drop');
  render(); saveSoon();
  showNote(cur.stem+' だけ残しました（連写 '+mem.length+'枚中 '+(mem.length-1)+'枚を外す）', false, items, cur);
}
// Tab / Shift + Tab: 次 / 前の連写の先頭へ
function nextBurst(dir){
  if(prepRunning){ toast('連写の準備中です'); return; }
  const cur=groups[idx]; if(!cur) return;
  if(dir>0){
    for(let j=idx+1;j<groups.length;j++) if(groups[j].burst!==cur.burst && match(groups[j])) return jump(j);
    return;
  }
  let j=idx-1;
  while(j>=0 && (groups[j].burst===cur.burst || !match(groups[j]))) j--;
  if(j<0) return;
  const b=groups[j].burst;
  let first=j;
  for(let k=j-1;k>=0 && groups[k].burst===b;k--) if(match(groups[k])) first=k;
  jump(first);
}
function setGrid(n){
  endFlip();
  if(n===BURST && prepRunning){ toast('連写の準備中です。通常の一覧は利用できます'); return; }
  if(n>1) hideNote();
  n=Math.min(BURST,Math.max(1,n|0));
  if(n===1 && cmpOn){ cmpOn=false; clearCmp(); }
  gridN=n; if(n>1) lastGridN=n;
  const st=loadState(); st.prefs=Object.assign(st.prefs||{},{gridN,lastGridN}); saveState(st);
  render();
}
function moveBy(d){
  const list=visibleList(), pos=list.indexOf(idx);
  if(pos<0) return;
  const np=Math.max(0,Math.min(list.length-1,pos+d));
  if(np!==pos) jump(list[np]);
}
let lastClick={i:-1,t:0};
$('grid').addEventListener('click',e=>{
  if(e.target.closest('.burst-pick')) return;
  const cell=e.target.closest('.cell'); if(!cell) return;
  const i=+cell.dataset.i, now=Date.now();
  if(i===lastClick.i && now-lastClick.t<400){ lastClick={i:-1,t:0}; idx=i; setGrid(1); return; }   // ダブルクリックで1枚表示
  lastClick={i,t:now};
  if(i!==idx) jump(i);
});
$('grid').addEventListener('change',e=>{
  const box=e.target.closest('input[data-pick]'); if(!box) return;
  if(box.checked) burstSelections.add(box.dataset.pick); else burstSelections.delete(box.dataset.pick);
  updateReviewUI();
});
$('burstCommit').onclick=()=>{
  const cur=groups[idx]; if(!cur || prepRunning) return;
  const mem=burstMembers.get(cur.burst)||[cur];
  if(!mem.some(g=>burstSelections.has(g.key))) return;
  const items=mem.map(snapshot);
  for(const g of mem){ setDecision(g,burstSelections.has(g.key)?'keep':'drop'); burstSelections.delete(g.key); }
  const n=mem.filter(g=>decision(g)==='keep').length;
  nextBurst(1); afterDecision();
  showNote('連写から '+n+'枚を採用しました',false,items,cur);
};
$('gridN').addEventListener('input',e=>setGrid(+e.target.value));
$('gridN').addEventListener('change',e=>e.target.blur());
let resizeTimer=0;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{ if($('s-cull').classList.contains('on') && gridN>1) render(); },120);
});

$('dropBtn').onclick=toggle;
$('prevBtn').onclick=()=>step(-1);
$('nextBtn').onclick=()=>step(1);
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('toCopyBtn').onclick=()=>{ hideNote(); openCopy(); };
$('hidBtn').onclick=toggleAlready;
$('closeBtn').onclick=async()=>{ saveSoon(); hideNote(); cancelPreparation(); await stopBg(); cmpOn=false; clearCmp(); clearCache(); clearThumbs(); show('s-open'); updDestUI(); };

document.addEventListener('keydown',e=>{
  if(!$('s-cull').classList.contains('on')) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(e.target && ['seek','includeHeld','includeUnreviewed'].includes(e.target.id)) return;
  if(e.target && e.target.id==='gridN') e.target.blur();
  if((k==='f'||k==='F') && !e.target?.closest('input,textarea,select,[contenteditable=true]')){ e.preventDefault(); if(!e.repeat) void toggleFullscreen(); }
  else if(k===' ' && e.shiftKey){ e.preventDefault(); if(!e.repeat) onlyKeep(); }
  else if(k==='h'||k==='H'){ e.preventDefault(); if(!e.repeat) holdCurrent(); }
  else if(k==='r'||k==='R'){ e.preventDefault(); if(!e.repeat) confirmVisible(); }
  else if(k==='Tab'){ e.preventDefault(); nextBurst(e.shiftKey?-1:1); }
  else if(k===' '||k==='x'||k==='X'||(k==='ArrowDown'&&gridN===1)){ e.preventDefault(); if(!e.repeat) toggle(); }
  else if(k==='ArrowRight'){ e.preventDefault(); step(1); }
  else if(k==='ArrowLeft'){ e.preventDefault(); step(-1); }
  else if(k==='ArrowDown'){ e.preventDefault(); moveBy(gridCols); }
  else if(k==='ArrowUp' && gridN>1){ e.preventDefault(); moveBy(-gridCols); }
  else if(k==='Enter'){ e.preventDefault(); setGrid(gridN===1?lastGridN:1); }
  else if(k==='+'||k==='='){ e.preventDefault(); setGrid(gridN+1); }
  else if(k==='-'){ e.preventDefault(); setGrid(gridN-1); }
  else if((k==='z'||k==='Z') && gridN===1){ e.preventDefault(); setZoom(!zoomed); }
  else if(k==='z'||k==='Z'){ e.preventDefault(); setCompare(!cmpOn); }
  else if(k==='Escape' && cmpOn){ e.preventDefault(); setCompare(false); }
  else if(k==='Escape' && zoomed){ e.preventDefault(); setZoom(false); }
  else if(k==='Backspace' && noteAct){ e.preventDefault(); undoNote(); }
  else if(k==='Home'){ e.preventDefault(); jump(findFrom(0,1)); }
  else if(k==='End'){ e.preventDefault(); jump(findFrom(groups.length-1,-1)); }
});
document.addEventListener('keyup',e=>{
  if(e.key===' ' && $('s-cull').classList.contains('on')) e.preventDefault();
});

// ===== 3. コピー =====
let copying=false, abortCtl=null;
function getMode(){ return document.querySelector('input[name=mode]:checked').value; }
function filesFor(g,mode){
  if(mode==='raw') return g.files.filter(f=>RAW_EXT.has(f.ext));
  if(mode==='jpg') return g.files.filter(f=>JPG_EXT.has(f.ext));
  return g.files;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ----- 撮影日のフォルダ ----- */
const dateDirs=new Map();   // 'YYYY-MM-DD' -> フォルダ
async function getDateDir(date,create){
  let h=dateDirs.get(date);
  if(h) return h;
  try { h=await destDir.getDirectoryHandle(date,{create}); }
  catch(e){ if(e.name==='NotFoundError') return null; throw e; }
  dateDirs.set(date,h);
  return h;
}
async function exists(dir,name){
  try { const h=await dir.getFileHandle(name); return await h.getFile(); }
  catch(e){
    if(e.name==='NotFoundError') return null;
    if(e.name==='TypeMismatchError') return {size:-1};   // 同名のフォルダがある
    throw e;
  }
}

/* ----- C. コピー済みの判定（保存先に同じ名前・同じサイズのファイルがそろっている写真） ----- */
async function isAlready(g,mode){
  const fs=filesFor(g,mode);
  if(!fs.length) return false;
  const dir=await getDateDir(g.date,false);
  if(!dir) return false;
  for(const f of fs){ const ex=await exists(dir,f.name); if(!ex || ex.size!==f.file.size) return false; }
  return true;
}
async function checkAlready(list){
  const m=getMode();
  for(let i=0;i<list.length;i+=16){
    await Promise.all(list.slice(i,i+16).map(async g=>{ try { g.already=await isAlready(g,m); } catch(e){ g.already=false; } }));
    $('openStatus').textContent='コピー済みを確認中… '+Math.min(i+16,list.length)+' / '+list.length;
  }
}
function applyFilter(keepKey){
  const cur=keepKey ? allGroups.find(g=>g.key===keepKey) : null;
  groups=allGroups.filter(g=>showAlready || !g.already);
  buildBursts();
  let j=cur ? groups.indexOf(cur) : -1;
  if(j<0 && cur){ j=groups.findIndex(g=>g.time>=cur.time); if(j<0) j=groups.length-1; }
  idx=Math.max(0,j);
}
function toggleAlready(){
  const cur=groups[idx];
  if(showAlready && allGroups.every(g=>g.already)){ toast('すべてコピー済みのため隠せません'); return; }
  showAlready=!showAlready;
  hideNote();
  applyFilter(cur ? cur.key : null);
  if(!match(groups[idx])) view='all';
  render(); saveSoon();
}

/* ----- 1枚分（JPEG と NEF）の保存名を決める -----
   同じ名前・同じサイズのファイルが既にあればコピー済みとして飛ばす。
   同じ名前でサイズが違う（カメラの連番が一周した等）場合は、組ごと _1, _2… を付ける。 */
async function decideNames(dir,fs){
  const names=new Map(), skip=new Set();
  let conflict=false;
  for(const f of fs){
    const ex=await exists(dir,f.name);
    if(ex){ if(ex.size===f.file.size) skip.add(f); else conflict=true; }
    names.set(f,f.name);
  }
  if(!conflict) return {names,skip,renamed:false};
  const base=fs[0].stem;
  for(let n=1;;n++){
    const s=base+'_'+n;
    let free=true;
    for(const f of fs){ if(await exists(dir,s+f.name.slice(f.stem.length))){ free=false; break; } }
    if(free){
      for(const f of fs) names.set(f,s+f.name.slice(f.stem.length));
      return {names,skip:new Set(),renamed:true};
    }
  }
}
async function copyOne(dir,name,file,onBytes,signal){
  const fh=await dir.getFileHandle(name,{create:true});
  let ok=false;
  try{
    const w=await fh.createWritable();
    const counter=new TransformStream({transform(ch,ctl){ onBytes(ch.byteLength); ctl.enqueue(ch); }});
    await file.stream().pipeThrough(counter).pipeTo(w,{signal});
    const out=await fh.getFile();
    if(out.size!==file.size) throw new Error('サイズ不一致 ('+out.size+' / '+file.size+')');
    ok=true;
  }finally{
    if(!ok){ try { await dir.removeEntry(name); } catch(e){} }   // 途中までのファイルを残さない
  }
}
/* 1枚分をその撮影日のフォルダへコピーする。このアプリがコピーしたファイルは g.copied に記録する */
async function copyGroup(g,signal,onBytes){
  const res={copied:0,skipped:0,renamed:false,failed:[]};
  const fs=filesFor(g,getMode());
  const dir=await getDateDir(g.date,true);
  const d=await decideNames(dir,fs);
  res.renamed=d.renamed;
  for(const f of fs){
    if(signal.aborted) return res;
    if(d.skip.has(f)){ res.skipped++; onBytes(f.file.size,true); continue; }
    const name=d.names.get(f);
    try{
      await copyOne(dir,name,f.file,n=>onBytes(n,false),signal);
      g.copied.push({dir,name});
      res.copied++;
    }catch(e){
      if(signal.aborted) return res;
      res.failed.push(f.path+f.name+' : '+(e.message||e));
    }
  }
  if(!res.failed.length && !signal.aborted) g.bgDone=true;
  return res;
}
/* 外した写真について、このアプリがコピーしたファイルを保存先から消す */
let removedFiles=0;
async function removeCopies(g){
  for(const c of g.copied){ try { await c.dir.removeEntry(c.name); removedFiles++; } catch(e){} }
  g.copied=[]; g.bgDone=false;
}

/* ----- A. 選別しながら裏でコピー -----
   画面から消えた（見終わった）「残す」写真を1枚ずつコピーする。
   移動した直後 1.5 秒はプレビューの読み込みを優先して止める。 */
const NAV_PAUSE=1500;
let bgOn=false, bgBusy=false, bgCur=null, bgAbort=null, bgFailN=0, lastNav=0, screenKeys=new Set();
function startBg(){
  if(!destDir || !groups.length) return;
  bgOn=true; bgAbort=new AbortController();
  bgKick();
}
async function stopBg(){
  bgOn=false;
  if(bgAbort) bgAbort.abort();
  while(bgBusy) await sleep(50);
}
function bgKick(){
  if(!bgOn || bgBusy) return;
  bgBusy=true;
  bgRun().finally(()=>{ bgBusy=false; bgCur=null; updBg(); });
}
async function bgRun(){
  while(bgOn){
    const wait=lastNav+NAV_PAUSE-performance.now();
    if(wait>0){ await sleep(wait); continue; }
    const d=allGroups.find(g=>(decision(g)==='drop' || (decision(g)==='hold' && !$('includeHeld').checked)) && g.copied.length);
    if(d){ await removeCopies(d); updBg(); continue; }
    const m=getMode();
    const g=groups.find(g=>g.ready && canCopy(g,true) && !g.already && !g.bgDone && !g.bgFail && !screenKeys.has(g.key) && filesFor(g,m).length);
    if(!g) break;
    bgCur=g; updBg();
    try{
      const r=await copyGroup(g,bgAbort.signal,()=>{});
      if(r.failed.length){ g.bgFail=true; bgFailN++; }
    }catch(e){
      if(!bgAbort.signal.aborted){ g.bgFail=true; bgFailN++; }
    }
    bgCur=null; updBg();
  }
}
function updBg(){
  const m=getMode();
  let tot=0, done=0;
  for(const g of groups){
    if(!canCopy(g,true) || g.already || !filesFor(g,m).length) continue;
    tot++; if(g.bgDone) done++;
  }
  $('bgStat').textContent=tot ? '裏でコピー '+done+' / '+tot+(bgCur?'　コピー中':'')+(bgFailN?'　失敗 '+bgFailN:'') : '';
}

/* ----- コピー画面（残りをまとめてコピー） ----- */
function remainingJobs(){
  const m=getMode();
  return groups.filter(g=>g.ready && canCopy(g) && !g.already && !g.bgDone && filesFor(g,m).length);
}
async function openCopy(){
  await stopBg();
  $('cpSetup').style.display=''; $('cpRun').style.display='none'; $('cpDone').style.display='none';
  $('cpWarn').textContent='';
  show('s-copy');
  copyRefresh();
}
function copyRefresh(){
  const m=getMode(), s=keptStats(m);
  let rf=0, rb=0;
  for(const g of remainingJobs()) for(const f of filesFor(g,m)){ rf++; rb+=f.file.size; }
  const bgN=groups.filter(g=>canCopy(g) && !g.already && g.bgDone).length;
  $('cpKeep').textContent=s.n+'枚';
  $('cpKeepSub').textContent='裏でコピー済み '+bgN+'枚・残り '+rf+'ファイル（'+fmtBytes(rb)+'）';
  $('cpDrop').textContent=s.dropped+'枚';
  const unchecked=groups.filter(g=>decision(g)==='unreviewed').length;
  const held=groups.filter(g=>decision(g)==='hold').length;
  $('cpUnreviewed').textContent='（'+unchecked+'枚）';
  $('cpHeld').textContent='（'+held+'枚）';
  $('cpStart').disabled=prepRunning || !!prepFailed;
  $('cpWarn').textContent=prepRunning ? '撮影日・コピー済みを確認中です。準備が終わるとコピーできます。' : prepFailed ? '確認に失敗した写真があります。カードを開き直してください。' : '未確認 '+unchecked+'枚は'+($('includeUnreviewed').checked?'コピーします':'コピーしません')+'。保留 '+held+'枚は'+($('includeHeld').checked?'コピーします':'コピーしません')+'。';
  $('cpDest').textContent=destDir.name+' / 撮影日ごとのフォルダ　（'+MODE_LABEL[m]+'）';
}
function backToCull(){ if(copying) return; show('s-cull'); render(); startBg(); }
$('includeUnreviewed').onchange=copyRefresh;
$('includeHeld').onchange=copyRefresh;
$('backBtn').onclick=backToCull;
$('cpStart').onclick=startCopy;
$('cpCancel').onclick=()=>{ if(abortCtl) abortCtl.abort(); };

async function startCopy(){
  if(prepRunning || prepFailed || copying) return;
  $('cpStart').disabled=true;
  await stopBg();
  $('cpStart').disabled=false;
  const m=getMode();
  copying=true; abortCtl=new AbortController();
  $('cpSetup').style.display='none'; $('cpRun').style.display='block'; $('cpDone').style.display='none';
  let wake=null;
  try { wake=await navigator.wakeLock.request('screen'); } catch(e){}
  const removed0=removedFiles;
  for(const g of allGroups) if(!canCopy(g) && g.copied.length) await removeCopies(g);   // 外した写真のコピーを消す
  let bgFiles=0;
  for(const g of groups) if(canCopy(g)) bgFiles+=g.copied.length;
  const jobs=remainingJobs();
  let total=0; for(const g of jobs) for(const f of filesFor(g,m)) total+=f.file.size;

  const res={copied:0,skipped:0,renamed:0,failed:[]};
  let done=0, moved=0, cur='';
  const t0=performance.now();
  const tick=()=>{
    const p=total ? done/total : 1;
    $('ringFg').style.strokeDashoffset=(339.292*(1-p)).toFixed(2);
    $('cpPct').textContent=Math.floor(p*100)+'%';
    const sec=(performance.now()-t0)/1000;
    const speed=sec>0.5 ? moved/sec : 0;
    $('cpLine1').textContent=fmtBytes(done)+' / '+fmtBytes(total);
    $('cpLine2').textContent=(speed ? (speed/1e6).toFixed(0)+' MB/s　残り '+fmtDur((total-done)/speed) : '計測中…')+'　経過 '+fmtDur(sec);
    $('cpCur').textContent=cur;
  };
  const timer=setInterval(tick,250);
  tick();
  try{
    for(const g of jobs){
      if(abortCtl.signal.aborted) break;
      cur=g.date+' / '+g.stem;
      try{
        const r=await copyGroup(g,abortCtl.signal,(n,skip)=>{ done+=n; if(!skip) moved+=n; });
        res.copied+=r.copied; res.skipped+=r.skipped; if(r.renamed) res.renamed++;
        res.failed.push(...r.failed);
      }catch(e){
        if(abortCtl.signal.aborted) break;
        res.failed.push(g.stem+' : '+(e.message||e));
      }
    }
  }finally{
    clearInterval(timer); tick();
    copying=false;
    if(wake) try { await wake.release(); } catch(e){}
  }
  const aborted=abortCtl.signal.aborted;
  const sec=(performance.now()-t0)/1000;
  const removed=removedFiles-removed0;
  $('cpRun').style.display='none'; $('cpDone').style.display='block';
  $('cpSetup').style.display=(aborted||res.failed.length)?'':'none';   // やり直せるように
  if(aborted||res.failed.length) copyRefresh();
  $('cpResult').innerHTML=
    '<b>'+(aborted?'中止しました':(res.failed.length?'完了（失敗あり）':'完了'))+'</b>　'+fmtDur(sec)+'<br>'
    +(bgFiles?'裏でコピー済み '+bgFiles+'ファイル<br>':'')
    +'今回コピー '+res.copied+'ファイル<br>'
    +(res.skipped?'飛ばした（同じファイルが既にある） '+res.skipped+'ファイル<br>':'')
    +(res.renamed?'名前に _番号 を付けた写真 '+res.renamed+'枚<br>':'')
    +(removed?'外した写真のコピーを消した '+removed+'ファイル<br>':'')
    +(res.failed.length?'失敗 '+res.failed.length+'ファイル':'');
  $('cpFails').innerHTML=res.failed.map(esc).join('<br>');
  const dates=[...new Set(groups.filter(g=>canCopy(g) && !g.already && g.bgDone).map(g=>g.date))];
  $('cpHint').innerHTML=aborted
    ? 'もう一度［残りをコピー］を押すと、コピー済みのファイルは飛ばして続きから始めます。'
    : 'Lightroom Classic の［読み込み］で、上部の方式を<b>「追加」</b>にして、保存先のフォルダを選んでください。撮影日ごとのフォルダに分かれているので、<b>「サブフォルダーを含める」</b>をオンにします。<br>'
      +esc(destDir.name)+(dates.length?' / '+esc(dates.join('、')):'');
}
$('againBtn').onclick=backToCull;
$('newCardBtn').onclick=async()=>{ cancelPreparation(); await stopBg(); clearCache(); clearThumbs(); show('s-open'); updDestUI(); };
window.addEventListener('beforeunload',e=>{ if(copying || bgCur){ e.preventDefault(); e.returnValue=''; } });
</script>
