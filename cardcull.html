<!DOCTYPE html>
<html lang="ja">
<head>
<!-- 雛形: management/app-template.html（バージョン管理はこのリポジトリの方式に合わせている） -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon01.png">
<title>CardCull</title>
<style>
  :root {
    --bg: #07090d;
    --bg2: #10151c;
    --text: #e8edf2;
    --text2: #8b98a5;
    --accent: #5ce1ff;
    --accent2: #9b8cff;
    --danger: #ff6b81;
    --glass-b: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 12% 18%, rgba(92,225,255,.16), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(155,140,255,.15), transparent 46%),
      radial-gradient(circle at 60% 8%, rgba(92,225,255,.06), transparent 35%);
  }
  .glass {
    background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-b);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 12px 40px rgba(0,0,0,.45);
    border-radius: 22px;
  }
  button {
    font: inherit; color: var(--text);
    background: rgba(255,255,255,.06);
    border: 1px solid var(--glass-b); border-radius: 999px;
    padding: 10px 18px; cursor: pointer;
    transition: background .15s, border-color .15s, box-shadow .15s, color .15s;
  }
  button:hover { background: rgba(255,255,255,.12); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary {
    background: linear-gradient(135deg, rgba(92,225,255,.28), rgba(155,140,255,.22));
    border-color: rgba(92,225,255,.55);
    box-shadow: 0 0 24px rgba(92,225,255,.22);
  }
  button.primary:hover { box-shadow: 0 0 32px rgba(92,225,255,.38); }
  button.small { padding: 6px 12px; font-size: .8rem; }
  .muted { color: var(--text2); }

  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }
  .screen.center.on { display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }

  /* ===== 開く画面 ===== */
  .card { width: min(460px, 100%); padding: 36px 32px; text-align: center; }
  .logo { font-size: 1.9rem; font-weight: 700; letter-spacing: .06em; }
  .logo b { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { margin: 12px 0 28px; line-height: 1.7; font-size: .9rem; color: var(--text2); }
  #openBtn { font-size: 1.05rem; padding: 14px 34px; }
  #openStatus { margin-top: 18px; min-height: 1.4em; font-size: .85rem; color: var(--text2); }

  /* ===== 選別画面 ===== */
  #topbar {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 16px; right: 16px;
    height: 54px; border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 12px;
  }
  #fname { font-weight: 600; font-size: 1rem; letter-spacing: .02em; }
  #badges { display: flex; gap: 6px; }
  .badge { font-size: .68rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--glass-b); color: var(--text2); }
  .badge.jpg { border-color: rgba(92,225,255,.5); color: var(--accent); }
  .badge.raw { border-color: rgba(155,140,255,.55); color: var(--accent2); }
  #ftime { font-size: .8rem; color: var(--text2); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  #filterBtn.on { border-color: rgba(255,107,129,.6); color: var(--danger); }

  #stage { position: absolute; top: calc(78px + env(safe-area-inset-top)); bottom: calc(132px + env(safe-area-inset-bottom)); left: 16px; right: 16px; }
  #photo { width: 100%; height: 100%; object-fit: contain; display: block; transition: filter .15s, opacity .15s; }
  #stage.dropped #photo { filter: grayscale(1) brightness(.35); }
  #noimg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--text2); line-height: 1.8; }
  #dropTag {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 10px 26px; font-size: 1.1rem; font-weight: 700; letter-spacing: .2em;
    color: var(--danger); border-color: rgba(255,107,129,.5); display: none; border-radius: 999px;
  }
  #stage.dropped #dropTag { display: block; }

  #bar {
    position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(680px, calc(100% - 32px)); height: 100px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px;
  }
  #pos { position: absolute; top: 0; left: 24px; right: 24px; height: 2px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
  #posFill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .nav { width: 44px; height: 44px; padding: 0; font-size: 1.4rem; line-height: 1; flex: none; }
  .side { flex: 1; min-width: 0; }
  .side.left { text-align: left; }
  .side.right { text-align: right; }
  .side .big { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .side .sm { font-size: .72rem; color: var(--text2); margin-top: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #dropBtn {
    width: 78px; height: 78px; flex: none; padding: 0; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 2px solid rgba(92,225,255,.75);
    background: radial-gradient(circle at 50% 35%, rgba(92,225,255,.22), rgba(92,225,255,.04) 70%);
    box-shadow: 0 0 28px rgba(92,225,255,.35), inset 0 0 18px rgba(92,225,255,.18);
  }
  #dropBtn .lbl { font-size: 1rem; font-weight: 700; letter-spacing: .1em; }
  #dropBtn .key { font-size: .6rem; color: var(--text2); letter-spacing: .05em; }
  #dropBtn.is-dropped {
    border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.04);
    box-shadow: none; color: var(--text2);
  }

  #toast {
    position: fixed; left: 50%; bottom: calc(132px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 10px 14px 10px 18px; border-radius: 999px; font-size: .85rem;
    display: none; align-items: center; gap: 12px; z-index: 50; max-width: calc(100% - 32px);
  }
  #toast.on { display: flex; }

  /* ===== コピー画面 ===== */
  .copycard { width: min(560px, 100%); padding: 28px; margin: auto; }
  .copycard h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .tile { padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
  .tile .v { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: .75rem; color: var(--text2); margin-top: 2px; }
  .tile.keep .v { color: var(--accent); }
  .row { margin-bottom: 18px; }
  .row > .k { font-size: .78rem; color: var(--text2); margin-bottom: 8px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: inline-block; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--glass-b); font-size: .85rem; cursor: pointer; }
  .seg input:checked + span { border-color: rgba(92,225,255,.6); color: var(--accent); background: rgba(92,225,255,.10); }
  .dest { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #cpDest { font-size: .9rem; word-break: break-all; }
  .sub { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: .85rem; flex-wrap: wrap; }
  input[type=text] {
    font: inherit; color: var(--text); background: rgba(255,255,255,.05);
    border: 1px solid var(--glass-b); border-radius: 10px; padding: 7px 10px; font-size: .85rem; width: 180px;
  }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
  #cpWarn { font-size: .8rem; color: var(--danger); min-height: 1.2em; margin-top: 8px; }

  #cpRun { display: none; text-align: center; }
  .ring { position: relative; width: 150px; height: 150px; margin: 4px auto 16px; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .bgc { stroke: rgba(255,255,255,.08); }
  .ring .fg { stroke: url(#rg); stroke-linecap: round; stroke-dasharray: 339.292; stroke-dashoffset: 339.292; }
  .ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  #cpLine1 { font-variant-numeric: tabular-nums; }
  #cpLine2 { font-size: .8rem; color: var(--text2); margin-top: 6px; font-variant-numeric: tabular-nums; }
  #cpCur { font-size: .75rem; color: var(--text2); margin-top: 6px; min-height: 1.2em; word-break: break-all; }

  #cpDone { display: none; }
  #cpResult { line-height: 1.9; font-size: .92rem; }
  #cpFails { margin-top: 10px; max-height: 160px; overflow: auto; font-size: .78rem; color: var(--danger); line-height: 1.6; }
  .hint { margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-size: .82rem; line-height: 1.7; background: rgba(92,225,255,.06); border: 1px solid rgba(92,225,255,.25); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<!-- ===== 1. カードを開く ===== -->
<section id="s-open" class="screen center on">
  <div class="card glass">
    <div class="logo">Card<b>Cull</b></div>
    <p class="lead">カードを開いて、外す写真だけ選ぶ。<br>残した写真を JPEG・NEF の組でまとめてコピー。</p>
    <button id="openBtn" class="primary">カードを開く</button>
    <div id="openStatus">この表示が消えない場合、スクリプトが動いていません（プレビュー表示の可能性）。Chrome で直接開いてください。</div>
  </div>
</section>

<!-- ===== 2. 選別 ===== -->
<section id="s-cull" class="screen">
  <div id="stage">
    <img id="photo" alt="">
    <div id="noimg"></div>
    <div id="dropTag" class="glass">外す</div>
  </div>

  <div id="topbar" class="glass">
    <button id="closeBtn" class="small" title="別のカードを開く">‹ カード</button>
    <span id="fname"></span>
    <span id="badges"></span>
    <span id="ftime"></span>
    <span class="spacer"></span>
    <button id="filterBtn" class="small">外したものだけ</button>
    <button id="toCopyBtn" class="small primary">コピーへ →</button>
  </div>

  <div id="bar" class="glass">
    <div id="pos"><i id="posFill"></i></div>
    <button class="nav" id="prevBtn" aria-label="前へ">‹</button>
    <div class="side left"><div class="big" id="counter">0 / 0</div><div class="sm">← → 移動</div></div>
    <button id="dropBtn"><span class="lbl">外す</span><span class="key">Space</span></button>
    <div class="side right"><div class="big" id="keepStat">残す 0枚</div><div class="sm" id="keepSize">0 MB</div></div>
    <button class="nav" id="nextBtn" aria-label="次へ">›</button>
  </div>
</section>

<!-- ===== 3. コピー ===== -->
<section id="s-copy" class="screen center">
  <div class="copycard glass">
    <h2><button id="backBtn" class="small">‹ 選別</button>コピー</h2>

    <div id="cpSetup">
      <div class="tiles">
        <div class="tile keep"><div class="v" id="cpKeep">0枚</div><div class="k" id="cpKeepSub">0ファイル・0 MB</div></div>
        <div class="tile"><div class="v" id="cpDrop">0枚</div><div class="k">外す（コピーしない）</div></div>
      </div>

      <div class="row">
        <div class="k">コピーするファイル</div>
        <div class="seg">
          <label><input type="radio" name="mode" value="both" checked><span>JPEG + NEF</span></label>
          <label><input type="radio" name="mode" value="raw"><span>NEF のみ</span></label>
          <label><input type="radio" name="mode" value="jpg"><span>JPEG のみ</span></label>
        </div>
      </div>

      <div class="row">
        <div class="k">保存先</div>
        <div class="dest">
          <button id="destBtn" class="small">フォルダを選ぶ</button>
          <span id="cpDest" class="muted">未選択</span>
        </div>
        <label class="sub"><input type="checkbox" id="cpSub" checked>中にフォルダを作る <input type="text" id="cpSubName"></label>
      </div>

      <div class="actions">
        <button id="cpStart" class="primary" disabled>コピー開始</button>
      </div>
      <div id="cpWarn"></div>
    </div>

    <div id="cpRun">
      <div class="ring">
        <svg width="150" height="150" viewBox="0 0 120 120">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ce1ff"/><stop offset="1" stop-color="#9b8cff"/></linearGradient></defs>
          <circle class="bgc" cx="60" cy="60" r="54"/>
          <circle class="fg" id="ringFg" cx="60" cy="60" r="54"/>
        </svg>
        <div class="pct" id="cpPct">0%</div>
      </div>
      <div id="cpLine1"></div>
      <div id="cpLine2"></div>
      <div id="cpCur"></div>
      <div class="actions" style="justify-content:center;margin-top:18px">
        <button id="cpCancel">中止</button>
      </div>
    </div>

    <div id="cpDone">
      <div id="cpResult"></div>
      <div id="cpFails"></div>
      <div class="hint" id="cpHint"></div>
      <div class="actions" style="margin-top:18px">
        <button id="againBtn">選別に戻る</button>
        <button id="newCardBtn" class="primary">別のカードを開く</button>
      </div>
    </div>
  </div>
</section>

<div id="toast" class="glass"><span id="toastMsg"></span><button id="toastAct" class="small" style="display:none"></button></div>

<script>
"use strict";
// ===== 基本設定 =====
const APP_NAME = 'CardCull';
const APP_KEY  = 'cardcull_v1';          // localStorage のキー
const APP_VERSION="dev"; /* GitHub Actionsが自動更新するため手動で変更しない */

/* ===== 自動更新（photo-location.html と同じ方式） ===== */
async function checkForUpdate(){
  try{
    const res=await fetch(location.href.split("?")[0]+"?_v="+Date.now(),{cache:"no-store"});
    if(!res.ok) return;
    const txt=await res.text();
    const m=txt.match(/APP_VERSION\s*=\s*"([^"]+)"/);   /* 「APP_VERSION=\"」と直接書くと公開時の書き換えで壊れる */
    if(m && m[1] && m[1]!==APP_VERSION) showUpdateBanner();
  }catch(e){}
}
function showUpdateBanner(){
  if(document.getElementById("updateBanner")) return;
  const b=document.createElement("div");
  b.id="updateBanner";
  b.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9999;background:#1565c0;color:#fff;display:flex;align-items:center;padding:10px 14px;gap:10px;font-size:13px;";
  b.innerHTML='<span style="flex:1;">🆕 新しいバージョンがあります</span>'
    +'<button onclick="location.reload(true)" style="background:#fff;color:#1565c0;border:none;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:13px;">更新する</button>'
    +'<button onclick="this.parentElement.remove()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 4px;">×</button>';
  document.body.prepend(b);
}
setTimeout(checkForUpdate,3000);
setInterval(checkForUpdate,60*60*1000);
(function(){
  const v=document.createElement('div');
  v.id='appVerBadge';
  v.textContent='ver.'+APP_VERSION;
  v.style.cssText='position:fixed;bottom:4px;left:6px;font-size:10px;color:#888;opacity:.6;z-index:9998;pointer-events:none;';
  document.body.appendChild(v);
})();

// ===== localStorage 保存・読込 =====
function loadState(){
  try { return JSON.parse(localStorage.getItem(APP_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveState(state){
  try { localStorage.setItem(APP_KEY, JSON.stringify(state)); } catch(e){}
}

// ===== 共通 =====
const $=id=>document.getElementById(id);
const JPG_EXT=new Set(['jpg','jpeg']);
const RAW_EXT=new Set(['nef','nrw','arw','cr2','cr3','raf','orf','rw2','dng','pef']);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); }
function fmtBytes(b){ return b>=1e9 ? (b/1e9).toFixed(1)+' GB' : Math.round(b/1e6)+' MB'; }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(ms){ const d=new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtTime(ms){ const d=new Date(ms); return fmtDate(ms)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function fmtDur(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h ? h+':'+pad(m)+':'+pad(x) : m+':'+pad(x); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let toastTimer=0;
function toast(msg,actLabel,act){
  $('toastMsg').textContent=msg;
  const b=$('toastAct');
  if(actLabel){ b.textContent=actLabel; b.style.display=''; b.onclick=()=>{ act(); $('toast').classList.remove('on'); }; }
  else b.style.display='none';
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('toast').classList.remove('on'), actLabel?6000:2500);
}
/* クリックしたボタンにフォーカスを残さない（Space キーでボタンが押されるのを防ぐ） */
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) b.blur(); });

// ===== 状態 =====
let cardDir=null;      // カードのフォルダ
let cardSig='';        // 選別状態の保存キー
let groups=[];         // 1枚 = { key, stem, files:[...], jpg, time, dropped }
let idx=0;
let filterDropped=false;

// ===== 1. カードを開く =====
$('openStatus').textContent='';   // スクリプトが動いた印
if(!('showDirectoryPicker' in window)){
  $('openBtn').disabled=true;
  $('openStatus').textContent='このブラウザでは使えません。Mac の Chrome または Edge で開いてください。';
}
$('openBtn').onclick=openCard;
/* フォルダ選択が開けなかった理由を画面に出す（埋め込み表示・file:// などの切り分け用） */
function pickerError(e){
  let framed; try { framed=window.top!==window; } catch(x){ framed=true; }
  return 'フォルダ選択を開けませんでした: '+e.name+': '+e.message
    +'（埋め込み表示: '+(framed?'はい':'いいえ')+' / '+location.protocol+'）';
}

async function walk(dir,path,out,st){
  for await (const [name,h] of dir.entries()){
    if(name.startsWith('.')) continue;   // 隠しファイル・._ファイル
    if(h.kind==='directory'){ await walk(h,path+name+'/',out,st); continue; }
    const dot=name.lastIndexOf('.');
    const ext=dot>0 ? name.slice(dot+1).toLowerCase() : '';
    if(JPG_EXT.has(ext)||RAW_EXT.has(ext)) out.push({path,name,stem:name.slice(0,dot),ext,h,file:null});
    else st.other++;
    if((out.length+st.other)%200===0) $('openStatus').textContent='探しています… '+out.length+'件';
  }
}

async function openCard(){
  let dir;
  try { dir=await window.showDirectoryPicker({id:'cardcull-card',mode:'read'}); }
  catch(e){ if(e.name!=='AbortError') $('openStatus').textContent=pickerError(e); return; }   // AbortError = キャンセル
  $('openBtn').disabled=true;
  $('openStatus').textContent='探しています…';
  try{
    const found=[], st={other:0};
    await walk(dir,'',found,st);
    for(let i=0;i<found.length;i+=32){
      await Promise.all(found.slice(i,i+32).map(async f=>{ f.file=await f.h.getFile(); }));
      $('openStatus').textContent='情報を読み込み中… '+Math.min(i+32,found.length)+' / '+found.length;
    }
    // 同じフォルダ・同じ名前（拡張子違い）を 1 枚にまとめる
    const map=new Map();
    for(const f of found){
      const key=f.path+f.stem.toUpperCase();
      let g=map.get(key);
      if(!g){ g={key,stem:f.stem,files:[],jpg:null,time:Infinity,dropped:false}; map.set(key,g); }
      g.files.push(f);
      if(!g.jpg && JPG_EXT.has(f.ext)) g.jpg=f;
      g.time=Math.min(g.time,f.file.lastModified);
    }
    const list=[...map.values()];
    list.sort((a,b)=>a.time-b.time || (a.key<b.key?-1:a.key>b.key?1:0));
    if(!list.length){
      $('openStatus').textContent='JPEG / RAW が見つかりませんでした。カードのルート（または DCIM）を選んでください。';
      return;
    }
    cardDir=dir; groups=list; idx=0; filterDropped=false;
    let total=0; for(const f of found) total+=f.file.size;
    cardSig=[dir.name,list.length,list[0].key,list[list.length-1].key,total].join('|');
    clearCache();
    const restored=restoreSession();
    $('openStatus').textContent='';
    show('s-cull');
    render();
    if(restored>0) toast('前回の選別を復元しました（外す '+restored+'枚）','リセット',resetSession);
    else if(st.other) toast(list.length+'枚を読み込みました（動画など '+st.other+'件は対象外）');
  }catch(e){
    $('openStatus').textContent='読み込めませんでした: '+(e.message||e);
  }finally{
    $('openBtn').disabled=false;
  }
}

// ===== 選別状態の保存・復元 =====
function restoreSession(){
  const s=(loadState().sessions||{})[cardSig];
  if(!s) return 0;
  const set=new Set(s.dropped||[]);
  let n=0;
  for(const g of groups) if(set.has(g.key)){ g.dropped=true; n++; }
  idx=Math.min(Math.max(0,s.idx|0),groups.length-1);
  return n;
}
let saveTimer=0;
function saveSoon(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const state=loadState();
    const sessions=state.sessions||{};
    sessions[cardSig]={dropped:groups.filter(g=>g.dropped).map(g=>g.key),idx,t:Date.now()};
    const keys=Object.keys(sessions).sort((a,b)=>sessions[b].t-sessions[a].t);
    for(const k of keys.slice(10)) delete sessions[k];   // 直近10枚のカードだけ残す
    state.sessions=sessions;
    saveState(state);
  },400);
}
function resetSession(){
  for(const g of groups) g.dropped=false;
  idx=0; filterDropped=false;
  render(); saveSoon();
}

// ===== 2. 選別 =====
const cache=new Map();   // key -> { url, im }
function load(g){
  let c=cache.get(g.key);
  if(!c){
    const url=URL.createObjectURL(g.jpg.file);
    const im=new Image(); im.decoding='async'; im.src=url;
    im.decode().catch(()=>{});
    c={url,im}; cache.set(g.key,c);
  }
  return c;
}
function clearCache(){
  for(const c of cache.values()){ URL.revokeObjectURL(c.url); c.im.src=''; }
  cache.clear();
}
function match(g){ return !filterDropped || g.dropped; }
function findFrom(start,dir){
  for(let j=start;j>=0&&j<groups.length;j+=dir) if(match(groups[j])) return j;
  return -1;
}
function prefetch(){
  const keep=new Set([groups[idx].key]);
  let j=idx;
  for(let n=0;n<4;n++){ j=findFrom(j+1,1); if(j<0) break; const g=groups[j]; keep.add(g.key); if(g.jpg) load(g); }
  j=findFrom(idx-1,-1);
  if(j>=0){ const g=groups[j]; keep.add(g.key); if(g.jpg) load(g); }
  for(const [k,c] of cache){ if(!keep.has(k)){ URL.revokeObjectURL(c.url); c.im.src=''; cache.delete(k); } }
}
function keptStats(mode){
  let n=0,files=0,bytes=0,dropped=0;
  for(const g of groups){
    if(g.dropped){ dropped++; continue; }
    const fs=filesFor(g,mode);
    if(!fs.length) continue;
    n++; files+=fs.length;
    for(const f of fs) bytes+=f.file.size;
  }
  return {n,files,bytes,dropped};
}
function render(){
  const g=groups[idx];
  if(!g) return;
  $('fname').textContent=g.stem;
  $('badges').innerHTML=g.files.map(f=>'<span class="badge '+(JPG_EXT.has(f.ext)?'jpg':'raw')+'">'+esc(f.ext.toUpperCase())+'</span>').join('');
  $('ftime').textContent=fmtTime(g.time);
  $('counter').textContent=(idx+1)+' / '+groups.length;
  const s=keptStats('both');
  $('keepStat').textContent='残す '+s.n+'枚';
  $('keepSize').textContent=fmtBytes(s.bytes)+(s.dropped?'　外す '+s.dropped+'枚':'');
  $('posFill').style.width=((idx+1)/groups.length*100)+'%';
  $('dropBtn').classList.toggle('is-dropped',g.dropped);
  $('dropBtn').querySelector('.lbl').textContent=g.dropped?'戻す':'外す';
  $('stage').classList.toggle('dropped',g.dropped);
  $('filterBtn').classList.toggle('on',filterDropped);
  const photo=$('photo'), noimg=$('noimg');
  if(g.jpg){
    noimg.style.display='none'; photo.style.display='';
    const c=load(g);
    if(photo.getAttribute('src')!==c.url) photo.src=c.url;
  }else{
    photo.style.display='none'; photo.removeAttribute('src');
    noimg.style.display='flex';
    noimg.innerHTML=esc(g.stem)+'<br>JPEG がないためプレビューできません';
  }
  prefetch();
}
$('photo').onerror=()=>{
  if(!$('photo').getAttribute('src')) return;
  $('photo').style.display='none';
  $('noimg').style.display='flex';
  $('noimg').textContent='読み込めませんでした（カードが外れていませんか？）';
};
function step(dir){
  const j=findFrom(idx+dir,dir);
  if(j>=0){ idx=j; render(); saveSoon(); }
}
function jump(j){ if(j>=0){ idx=j; render(); saveSoon(); } }
function toggle(){
  const g=groups[idx];
  g.dropped=!g.dropped;
  render(); saveSoon();
  if(g.dropped && !filterDropped) step(1);   // 外したら次へ
}
function toggleFilter(){
  if(!filterDropped){
    if(!groups.some(g=>g.dropped)){ toast('外した写真はありません'); return; }
    filterDropped=true;
    if(!groups[idx].dropped){ let j=findFrom(idx,1); if(j<0) j=findFrom(idx,-1); idx=j; }
  }else filterDropped=false;
  render();
}
$('dropBtn').onclick=toggle;
$('prevBtn').onclick=()=>step(-1);
$('nextBtn').onclick=()=>step(1);
$('filterBtn').onclick=toggleFilter;
$('toCopyBtn').onclick=openCopy;
$('closeBtn').onclick=()=>{ clearCache(); show('s-open'); };

document.addEventListener('keydown',e=>{
  if(!$('s-cull').classList.contains('on')) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(k===' '||k==='x'||k==='X'||k==='ArrowDown'){ e.preventDefault(); if(!e.repeat) toggle(); }
  else if(k==='ArrowRight'){ e.preventDefault(); step(1); }
  else if(k==='ArrowLeft'){ e.preventDefault(); step(-1); }
  else if(k==='Home'){ e.preventDefault(); jump(findFrom(0,1)); }
  else if(k==='End'){ e.preventDefault(); jump(findFrom(groups.length-1,-1)); }
});
document.addEventListener('keyup',e=>{
  if(e.key===' ' && $('s-cull').classList.contains('on')) e.preventDefault();
});

// ===== 3. コピー =====
let destDir=null;
let copying=false, abortCtl=null;
function getMode(){ return document.querySelector('input[name=mode]:checked').value; }
function filesFor(g,mode){
  if(mode==='raw') return g.files.filter(f=>RAW_EXT.has(f.ext));
  if(mode==='jpg') return g.files.filter(f=>JPG_EXT.has(f.ext));
  return g.files;
}
function openCopy(){
  $('cpSetup').style.display=''; $('cpRun').style.display='none'; $('cpDone').style.display='none';
  $('cpWarn').textContent='';
  const first=groups.find(g=>!g.dropped);
  if(first) $('cpSubName').value=fmtDate(first.time);
  show('s-copy');
  copyRefresh();
}
function copyRefresh(){
  const s=keptStats(getMode());
  $('cpKeep').textContent=s.n+'枚';
  $('cpKeepSub').textContent=s.files+'ファイル・'+fmtBytes(s.bytes);
  $('cpDrop').textContent=s.dropped+'枚';
  $('cpDest').textContent=destDir ? destDir.name : '未選択';
  $('cpDest').classList.toggle('muted',!destDir);
  $('cpStart').disabled=!destDir || s.files===0;
}
document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=copyRefresh);
$('backBtn').onclick=()=>{ if(!copying){ show('s-cull'); render(); } };

$('destBtn').onclick=async()=>{
  let d;
  try { d=await window.showDirectoryPicker({id:'cardcull-dest',mode:'readwrite'}); }
  catch(e){ if(e.name!=='AbortError') $('cpWarn').textContent=pickerError(e); return; }
  try{
    if(cardDir && (await cardDir.isSameEntry(d) || await cardDir.resolve(d))){
      $('cpWarn').textContent='カードの中には保存できません。Mac 側のフォルダを選んでください。';
      return;
    }
  }catch(e){}
  $('cpWarn').textContent='';
  destDir=d;
  copyRefresh();
};

async function exists(dir,name){
  try { const h=await dir.getFileHandle(name); return await h.getFile(); }
  catch(e){
    if(e.name==='NotFoundError') return null;
    if(e.name==='TypeMismatchError') return {size:-1};   // 同名のフォルダがある
    throw e;
  }
}
/* 1枚分（JPEG と NEF）の保存名を決める。
   同じ名前・同じサイズのファイルが既にあればコピー済みとして飛ばす。
   同じ名前でサイズが違う（カメラの連番が一周した等）場合は、組ごと _1, _2… を付ける。 */
async function decideNames(dir,fs){
  const names=new Map(), skip=new Set();
  let conflict=false;
  for(const f of fs){
    const ex=await exists(dir,f.name);
    if(ex){ if(ex.size===f.file.size) skip.add(f); else conflict=true; }
    names.set(f,f.name);
  }
  if(!conflict) return {names,skip,renamed:false};
  const base=fs[0].stem;
  for(let n=1;;n++){
    const s=base+'_'+n;
    let free=true;
    for(const f of fs){ if(await exists(dir,s+f.name.slice(f.stem.length))){ free=false; break; } }
    if(free){
      for(const f of fs) names.set(f,s+f.name.slice(f.stem.length));
      return {names,skip:new Set(),renamed:true};
    }
  }
}
async function copyOne(dir,name,file,onBytes){
  const fh=await dir.getFileHandle(name,{create:true});
  let ok=false;
  try{
    const w=await fh.createWritable();
    const counter=new TransformStream({transform(ch,ctl){ onBytes(ch.byteLength); ctl.enqueue(ch); }});
    await file.stream().pipeThrough(counter).pipeTo(w,{signal:abortCtl.signal});
    const out=await fh.getFile();
    if(out.size!==file.size) throw new Error('サイズ不一致 ('+out.size+' / '+file.size+')');
    ok=true;
  }finally{
    if(!ok){ try { await dir.removeEntry(name); } catch(e){} }   // 途中までのファイルを残さない
  }
}

$('cpStart').onclick=startCopy;
$('cpCancel').onclick=()=>{ if(abortCtl) abortCtl.abort(); };

async function startCopy(){
  const mode=getMode();
  let target=destDir;
  try{
    if($('cpSub').checked){
      const name=$('cpSubName').value.trim().replace(/[\/\\:*?"<>|]/g,'_');
      if(name) target=await destDir.getDirectoryHandle(name,{create:true});
    }
  }catch(e){ $('cpWarn').textContent='保存先を開けませんでした: '+(e.message||e); return; }

  const jobs=[]; let total=0;
  for(const g of groups){
    if(g.dropped) continue;
    const fs=filesFor(g,mode);
    if(!fs.length) continue;
    jobs.push(fs);
    for(const f of fs) total+=f.file.size;
  }

  $('cpSetup').style.display='none'; $('cpRun').style.display='block'; $('cpDone').style.display='none';
  copying=true; abortCtl=new AbortController();
  let wake=null;
  try { wake=await navigator.wakeLock.request('screen'); } catch(e){}

  const res={copied:0,skipped:0,renamed:0,failed:[]};
  let done=0, moved=0, cur='';
  const t0=performance.now();
  const tick=()=>{
    const p=total ? done/total : 1;
    $('ringFg').style.strokeDashoffset=(339.292*(1-p)).toFixed(2);
    $('cpPct').textContent=Math.floor(p*100)+'%';
    const sec=(performance.now()-t0)/1000;
    const speed=sec>0.5 ? moved/sec : 0;
    $('cpLine1').textContent=fmtBytes(done)+' / '+fmtBytes(total);
    $('cpLine2').textContent=(speed ? (speed/1e6).toFixed(0)+' MB/s　残り '+fmtDur((total-done)/speed) : '計測中…')+'　経過 '+fmtDur(sec);
    $('cpCur').textContent=cur;
  };
  const timer=setInterval(tick,250);
  tick();
  try{
    for(const fs of jobs){
      if(abortCtl.signal.aborted) break;
      const d=await decideNames(target,fs);
      if(d.renamed) res.renamed++;
      for(const f of fs){
        if(abortCtl.signal.aborted) break;
        if(d.skip.has(f)){ res.skipped++; done+=f.file.size; continue; }
        cur=f.path+f.name;
        try{
          await copyOne(target,d.names.get(f),f.file,n=>{ done+=n; moved+=n; });
          res.copied++;
        }catch(e){
          if(abortCtl.signal.aborted) break;
          res.failed.push(f.path+f.name+' : '+(e.message||e));
        }
      }
    }
  }catch(e){
    res.failed.push('保存先の確認に失敗: '+(e.message||e));
  }finally{
    clearInterval(timer); tick();
    copying=false;
    if(wake) try { await wake.release(); } catch(e){}
  }
  const aborted=abortCtl.signal.aborted;
  const sec=(performance.now()-t0)/1000;
  $('cpRun').style.display='none'; $('cpDone').style.display='block';
  $('cpSetup').style.display=(aborted||res.failed.length)?'':'none';   // やり直せるように
  $('cpResult').innerHTML=
    '<b>'+(aborted?'中止しました':(res.failed.length?'完了（失敗あり）':'完了'))+'</b>　'+fmtDur(sec)+'<br>'
    +'コピー '+res.copied+'ファイル<br>'
    +(res.skipped?'飛ばした（同じファイルが既にある） '+res.skipped+'ファイル<br>':'')
    +(res.renamed?'名前に _番号 を付けた写真 '+res.renamed+'枚<br>':'')
    +(res.failed.length?'失敗 '+res.failed.length+'ファイル':'');
  $('cpFails').innerHTML=res.failed.map(esc).join('<br>');
  const folder=esc(destDir.name+(target!==destDir?' / '+target.name:''));
  $('cpHint').innerHTML=aborted
    ? 'もう一度［コピー開始］を押すと、コピー済みのファイルは飛ばして続きから始めます。'
    : 'Lightroom Classic の［読み込み］で、上部の方式を<b>「追加」</b>にして、このフォルダを選んでください。<br>'+folder;
}
$('againBtn').onclick=()=>{ show('s-cull'); render(); };
$('newCardBtn').onclick=()=>{ clearCache(); show('s-open'); };
window.addEventListener('beforeunload',e=>{ if(copying){ e.preventDefault(); e.returnValue=''; } });
</script>

</body>
</html>
