<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日陰シミュレーター / Compass v3.1</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif}#scene{width:100%;height:100%}.panel{position:fixed;z-index:10;left:10px;right:10px;background:rgba(15,15,15,.92);backdrop-filter:blur(12px);border:1px solid #333;border-radius:12px;box-shadow:0 5px 20px #0009}.top{top:10px;padding:9px 11px;font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.yellow{color:#ffd700;font-weight:700}.green{color:#00ff66;font-weight:700}.hud{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding:5px 8px;border:1px solid #064d2a;border-radius:7px;background:#0009;font-family:monospace}.hud strong{font-size:15px;color:#00ff66}.strip{color:#777;letter-spacing:5px}.strip b{color:#00ff66;text-shadow:0 0 7px #0f6}.bottom{bottom:10px;padding:9px 10px}.time{display:flex;align-items:center;gap:8px}.time output{font:bold 15px monospace;color:#00ff66;min-width:45px}.time input{flex:1;accent-color:#00ff66}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}.ctrl{margin:0}.ctrl label{display:flex;justify-content:space-between;font-size:10px;color:#ccc}.ctrl output{color:#00ff66;font-weight:700}.ctrl input{width:100%;accent-color:#00ff66}.buttons{display:flex;gap:6px;margin-top:6px}.buttons button{flex:1}.btn{border:0;border-radius:7px;height:34px;color:#fff;font-weight:700;background:#287be5}.btn.purple{background:#9b59b6}.btn.red{background:#d94b3d}.btn.dark{background:#292929;border:1px solid #444;color:#ddd;font-size:10px}.btn.active{background:#e67e22;border-color:#f39c12}.mini{height:27px;font-size:10px}.mode{color:#00ff66;font-size:11px;margin-top:5px}.cal{display:flex;gap:5px;margin-top:6px}.cal button{flex:1}.hint{color:#aaa;font-size:10px;line-height:1.45;margin-top:6px}
</style>
</head>
<body>
<a-scene id="scene" embedded vr-mode-ui="enabled:false" shadow="type:pcfsoft">
  <a-entity id="camera" camera position="0 5 12" orbit-controls="target:0 1 0;enableDamping:true;dampingFactor:.12;rotateSpeed:.55;zoomSpeed:1;panSpeed:.7;minDistance:.5;maxDistance:60;maxPolarAngle:1.56"></a-entity>
  <a-entity id="world-root">
    <a-entity id="sun-light" light="type:directional;intensity:1.3;castShadow:true;shadowCameraTop:40;shadowCameraBottom:-40;shadowCameraLeft:-40;shadowCameraRight:40;shadowMapWidth:2048;shadowMapHeight:2048" position="10 20 10"></a-entity>
    <a-light type="ambient" intensity=".45"></a-light>
    <a-plane id="ground" position="0 0 0" rotation="-90 0 0" width="50" height="50" material="color:#e5e5e5;roughness:.85" shadow="receive:true"></a-plane>
    <a-entity id="markers">
      <a-text value="N" position="0 .03 -22" align="center" color="#e74c3c" scale="3 3 3" rotation="-90 0 0"></a-text><a-text value="E" position="22 .03 0" align="center" color="#333" scale="2.5 2.5 2.5" rotation="-90 0 -90"></a-text><a-text value="S" position="0 .03 22" align="center" color="#3498db" scale="2.5 2.5 2.5" rotation="-90 0 180"></a-text><a-text value="W" position="-22 .03 0" align="center" color="#333" scale="2.5 2.5 2.5" rotation="-90 0 90"></a-text>
    </a-entity>
    <a-entity id="walls"></a-entity>
    <a-entity id="humans"></a-entity>
    <a-entity id="preview-container" visible="false"></a-entity>
  </a-entity>
</a-scene>
<div class="panel top"><div class="row"><span id="sunInfo" class="yellow">太陽: --</span><button id="sensorBtn" class="btn mini">🧭 センサーを開始</button></div><div class="hud"><span>向き <strong id="headingText">N (0°)</strong></span><span class="strip" id="strip">NW N NE E SE S SW W</span></div><div id="mode" class="mode">手動モード / スライダーで基準方位を調整</div><div id="sensorDebug" class="hint">raw: -- / offset: -- / calibrated: -- / filtered: --</div><div class="cal"><button id="calBtn" class="btn dark mini">現在の向きを0°に再設定</button><button id="stopBtn" class="btn dark mini">センサー停止</button></div></div>

<div class="panel bottom">
  <div id="timeSection" class="time">
    <span>時刻</span><output id="timeOut">12:00</output><input id="time" type="range" min="300" max="1140" value="720">
  </div>
  <div id="settingSection" class="settings-grid" style="display:none;">
    <div class="ctrl"><label>壁高 <output id="whOut">3.0m</output></label><input id="wh" type="range" min="1" max="15" step=".5" value="3"></div>
    <div class="ctrl"><label>壁幅 <output id="wwOut">4.0m</output></label><input id="ww" type="range" min=".5" max="20" step=".5" value="4"></div>
    <div class="ctrl"><label>壁回転 <output id="wrOut">0°</output></label><input id="wr" type="range" min="0" max="359" value="0"></div>
    <div class="ctrl"><label>身長 <output id="hhOut">160cm</output></label><input id="hh" type="range" min="120" max="200" value="160"></div>
  </div>
  <div class="buttons">
    <button id="settingsBtn" class="btn dark">⚙ 設定</button>
    <button id="viewBtn" class="btn purple">👤 人目線</button>
    <button id="wallBtn" class="btn">壁を追加</button>
    <button id="humanBtn" class="btn purple">人を追加</button>
    <button id="clearBtn" class="btn red">全削除</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id), root=$('world-root'), light=$('sun-light'), wallsEl=$('walls'), humansEl=$('humans'), previewEl=$('preview-container'), sceneEl=$('scene'), cameraEl=$('camera');
let walls=[],humans=[],heading=0,rawHeading=null,latestRawHeading=null,offset=0,tracking=false,raf=0,sourceType='none';
let placingType=null, lastIntersectPoint = null;
let currentHumanViewIndex = -1; // -1: 通常俯瞰, 0以上: 対象人物のインデックス
const lat=34.27,lon=135.38;

function norm(v){return (v%360+360)%360} function signed(v){return ((v+180)%360+360)%360-180}
function dir(v){return ['N','NE','E','SE','S','SW','W','NW'][Math.floor((norm(v)+22.5)/45)%8]}
function updateHUD(v){
  v=norm(v);
  $('headingText').textContent=`${dir(v)} (${Math.round(v)}°)`;
  const names=['N','NE','E','SE','S','SW','W','NW'];
  $('strip').innerHTML=names.map(n=>n===dir(v)?`<b>${n}</b>`:n).join(' ');
}
function updateDebug(raw,calibrated){$('sensorDebug').textContent=`source: ${sourceType} / raw: ${raw==null?'--':raw.toFixed(1)+'°'} / offset: ${offset.toFixed(1)}° / calibrated: ${calibrated==null?'--':calibrated.toFixed(1)+'°'} / filtered: ${heading.toFixed(1)}°`}
function setHeading(v){heading=norm(v); updateHUD(heading);}
function circularLowPass(target,alpha=.38){const targetNorm=norm(target),difference=Math.abs(signed(targetNorm-heading));if(difference>30){resetCircularFilter(targetNorm);return}const r=targetNorm*Math.PI/180;const s=Math.sin(r),c=Math.cos(r);filterSin=(1-alpha)*filterSin+alpha*s;filterCos=(1-alpha)*filterCos+alpha*c;heading=norm(Math.atan2(filterSin,filterCos)*180/Math.PI)}
function resetCircularFilter(value){const r=norm(value)*Math.PI/180;filterSin=Math.sin(r);filterCos=Math.sin(r);heading=norm(value)}
function requestRender(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;root.setAttribute('rotation',`0 ${heading} 0`);updateHUD(heading);updateSimulation()})}

// カメラを通常（俯瞰）に戻す処理
function resetCameraView(){
  currentHumanViewIndex = -1;
  cameraEl.setAttribute('position', '0 5 12');
  cameraEl.setAttribute('orbit-controls', 'target: 0 1 0; minDistance: 0.5; maxDistance: 60');
  $('viewBtn').textContent = '👤 人目線';
  $('viewBtn').classList.remove('active');
}

// 複数人の目線切替・首振り視点設定
$('viewBtn').onclick = () => {
  if(humans.length === 0){
    alert('人物が配置されていません。先に「人を追加」してください。');
    return;
  }
  currentHumanViewIndex++;
  if(currentHumanViewIndex >= humans.length){
    resetCameraView();
    return;
  }
  
  const h = humans[currentHumanViewIndex];
  const eyeHeight = h.h * 0.9;
  // カメラを人の頭の位置にセット
  cameraEl.setAttribute('position', `${h.x} ${eyeHeight} ${h.z}`);
  // 注視点をすぐ直前に置き、minDistance/maxDistanceを極小化して「その場での首振り」にする
  cameraEl.setAttribute('orbit-controls', `target: ${h.x} ${eyeHeight} ${+h.z - 0.1}; minDistance: 0.01; maxDistance: 0.1`);
  
  $('viewBtn').textContent = `👤 人${currentHumanViewIndex + 1}目線`;
  $('viewBtn').classList.add('active');
};

let dragging=false, lastPointerX=0;
sceneEl.addEventListener('pointerdown',e=>{
  if(placingType) return;
  dragging=true; lastPointerX=e.clientX;
  sceneEl.setPointerCapture?.(e.pointerId);
});
sceneEl.addEventListener('pointermove',e=>{
  if(placingType || !dragging) return;
  const dx=e.clientX-lastPointerX; lastPointerX=e.clientX;
  resetCircularFilter(heading-dx*.35); requestRender();
});
sceneEl.addEventListener('pointerup',()=>dragging=false);

document.querySelectorAll('.panel').forEach(panel => {
  ['pointerdown', 'pointermove', 'click', 'touchstart', 'touchmove', 'touchend'].forEach(eventType => panel.addEventListener(eventType, e => e.stopPropagation()));
});

const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function updateMouseCoords(e){
  const rect = sceneEl.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

window.addEventListener('pointermove', e => {
  if(!placingType) return;
  updateMouseCoords(e);
  if(!sceneEl.camera) return;
  raycaster.setFromCamera(mouse, sceneEl.camera);
  const targetPoint = new THREE.Vector3();
  raycaster.ray.intersectPlane(groundPlane, targetPoint);
  if(targetPoint){
    lastIntersectPoint = targetPoint;
    const rotRad = -heading * Math.PI / 180;
    const localX = targetPoint.x * Math.cos(rotRad) - targetPoint.z * Math.sin(rotRad);
    const localZ = targetPoint.x * Math.sin(rotRad) + targetPoint.z * Math.cos(rotRad);
    previewEl.setAttribute('position', `${localX.toFixed(2)} 0 ${localZ.toFixed(2)}`);
  }
});

window.addEventListener('click', e => {
  if(!placingType || !lastIntersectPoint || e.target.closest('.panel')) return;
  const rotRad = -heading * Math.PI / 180;
  const localX = lastIntersectPoint.x * Math.cos(rotRad) - lastIntersectPoint.z * Math.sin(rotRad);
  const localZ = lastIntersectPoint.x * Math.sin(rotRad) + lastIntersectPoint.z * Math.cos(rotRad);
  if(placingType === 'wall'){
    walls.push({x: localX.toFixed(1), z: localZ.toFixed(1), h: +$('wh').value, w: +$('ww').value, r: +$('wr').value});
    renderWalls();
  } else if(placingType === 'human'){
    humans.push({x: localX.toFixed(1), z: localZ.toFixed(1), h: +$('hh').value/100});
    renderHumans();
  }
  placingType = null; previewEl.setAttribute('visible', 'false');
  $('mode').textContent = '手動モード / スライダーで基準方位を調整';
});

function startPlacement(type, e){
  // 配置モード開始時は操作性を担保するため自動で俯瞰に戻す
  if(currentHumanViewIndex !== -1) resetCameraView();
  
  placingType = type; previewEl.innerHTML = ''; previewEl.setAttribute('visible', 'true');
  if(type === 'wall'){
    const h = +$('wh').value, w = +$('ww').value, r = +$('wr').value;
    const obj = document.createElement('a-box');
    obj.setAttribute('position', `0 ${h/2} 0`); obj.setAttribute('width', w); obj.setAttribute('height', h); obj.setAttribute('depth', '.2'); obj.setAttribute('rotation', `0 ${r} 0`); obj.setAttribute('material', 'color:#d35400;opacity:0.5;transparent:true');
    previewEl.appendChild(obj);
    $('mode').textContent = '設置モード: 地面をクリックして壁を配置';
  } else if(type === 'human'){
    const h = +$('hh').value / 100; const r = document.createElement('a-entity');
    r.setAttribute('scale', `${h/1.6} ${h/1.6} ${h/1.6}`);
    [[.24,.24,.24,0,1.48],[.36,.5,.18,0,1.11],[.12,.76,.14,-.1,.38],[.12,.76,.14,.1,.38],[.1,.48,.1,-.24,1.1],[.1,.48,.1,.24,1.1]].forEach(p=>{
      const obj = document.createElement('a-box'); obj.setAttribute('width', p[0]); obj.setAttribute('height', p[1]); obj.setAttribute('depth', p[2]); obj.setAttribute('position', `${p[3]} ${p[4]} 0`); obj.setAttribute('material', 'color:#8e44ad;opacity:0.5;transparent:true'); r.appendChild(obj);
    });
    previewEl.appendChild(r);
    $('mode').textContent = '設置モード: 地面をクリックして人を配置';
  }
}

$('settingsBtn').onclick = () => {
  const isSetting = $('settingSection').style.display === 'none';
  $('settingSection').style.display = isSetting ? 'grid' : 'none';
  $('timeSection').style.display = isSetting ? 'none' : 'flex';
  $('settingsBtn').classList.toggle('active', isSetting);
  $('settingsBtn').textContent = isSetting ? '⏳ 時刻に戻る' : '⚙ 設定';
};
$('wallBtn').onclick = (e) => startPlacement('wall', e);
$('humanBtn').onclick = (e) => startPlacement('human', e);
$('clearBtn').onclick = () => {walls=[]; humans=[]; renderWalls(); renderHumans(); resetCameraView();};

function renderWalls(){wallsEl.innerHTML='';walls.forEach(w=>{const e=document.createElement('a-box');e.setAttribute('position',`${w.x} ${w.h/2} ${w.z}`);e.setAttribute('width',w.w);e.setAttribute('height',w.h);e.setAttribute('depth','.2');e.setAttribute('rotation',`0 ${w.r} 0`);e.setAttribute('material','color:#d35400;roughness:.6');e.setAttribute('shadow','cast:true;receive:true');wallsEl.appendChild(e)})}
function renderHumans(){humansEl.innerHTML='';humans.forEach(h=>{const r=document.createElement('a-entity');r.setAttribute('position',`${h.x} 0 ${h.z}`);r.setAttribute('scale',`${h.h/1.6} ${h.h/1.6} ${h.h/1.6}`);[[.24,.24,.24,0,1.48],[.36,.5,.18,0,1.11],[.12,.76,.14,-.1,.38],[.12,.76,.14,.1,.38],[.1,.48,.1,-.24,1.1],[.1,.48,.1,.24,1.1]].forEach(p=>{const e=document.createElement('a-box');e.setAttribute('width',p[0]);e.setAttribute('height',p[1]);e.setAttribute('depth',p[2]);e.setAttribute('position',`${p[3]} ${p[4]} 0`);e.setAttribute('material','color:#8e44ad');e.setAttribute('shadow','cast:true;receive:true');r.appendChild(e)});humansEl.appendChild(r)})}

function updateSimulation(){
  const minutes=+$('time').value, h=Math.floor(minutes/60), m=minutes%60;
  $('timeOut').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const d = new Date(Date.UTC(2026, 7, 6, h, m, 0) - (9 * 60 * 60 * 1000));
  const s=SunCalc.getPosition(d,lat,lon), az=s.azimuth+Math.PI, alt=s.altitude, dist=40;
  const x=dist*Math.cos(alt)*Math.sin(az), y=dist*Math.sin(alt), z=-dist*Math.cos(alt)*Math.cos(az);
  light.setAttribute('position',`${x} ${y} ${z}`);
  $('sunInfo').textContent=`太陽高度 ${(alt*180/Math.PI).toFixed(1)}° / 方位 ${norm(az*180/Math.PI).toFixed(1)}°`;
}
resetCircularFilter(0);setHeading(0);updateSimulation();
</script>
</body>
</html>
