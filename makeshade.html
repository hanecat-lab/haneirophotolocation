<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR影シミュレーター V2 - 仮想の壁で日当たりチェック</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.2/suncalc.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: #000; color: #fff; overflow: hidden; }
        .ui-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 12px;
            width: 90%; max-width: 400px; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #ccc; }
        input[type="time"], input[type="range"], button, input[type="number"] {
            width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px;
        }
        input[type="time"], input[type="number"] { background: #333; color: #fff; }
        button { background: #4CAF50; color: white; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:active { transform: scale(0.98); }
        #place-wall-btn.active { background: #f44336; }
        .height-val { float: right; color: #4CAF50; font-weight: bold; }
        .top-info {
            position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7);
            padding: 10px; border-radius: 8px; font-size: 12px; z-index: 1000;
        }
        .sun-info { color: #FFD700; font-weight: bold; margin-bottom: 4px; }
    </style>
</head>
<body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        <!-- カメラ -->
        <a-camera position="0 1.6 0"></a-camera>

        <!-- 太陽光（影の設定） -->
        <a-light id="sun" type="directional" intensity="0.8" position="0 10 0" 
                 light="castShadow: true; shadowCameraLeft: -10; shadowCameraRight: 10; shadowCameraTop: 10; shadowCameraBottom: -10;"></a-light>
        <a-light type="ambient" intensity="0.4"></a-light>

        <!-- 地面（影だけを受け取る） -->
        <a-plane id="ground" position="0 0 0" rotation="-90 0 0" width="100" height="100" 
                 class="clickable" material="color: #fff; transparent: true; opacity: 0.2;" shadow="receive: true"></a-plane>

        <a-entity id="walls-container"></a-entity>
    </a-scene>

    <div class="top-info">
        <div class="sun-info" id="sun-position">太陽の位置: 計算中...</div>
        <div>緯度: <span id="lat-val">35.69</span> / 経度: <span id="lng-val">139.69</span></div>
    </div>

    <div class="ui-panel">
        <div class="control-group">
            <label>時刻を指定:</label>
            <input type="time" id="time-input" value="12:00">
        </div>

        <div class="control-group">
            <label>壁の高さ: <span class="height-val" id="height-display">3.0m</span></label>
            <input type="range" id="wall-height" min="1" max="15" value="3" step="0.5">
        </div>

        <button id="place-wall-btn">壁を配置する (OFF)</button>
        <button id="clear-walls-btn" style="background: #555;">すべて削除</button>
        <div style="font-size: 11px; color: #888; text-align: center; margin-top: 8px;">
            ※配置をONにして地面をタップしてください
        </div>
    </div>

    <script>
        const sunLight = document.getElementById('sun');
        const wallsContainer = document.getElementById('walls-container');
        const heightDisplay = document.getElementById('height-display');
        const placeBtn = document.getElementById('place-wall-btn');
        const ground = document.getElementById('ground');
        
        let isPlacing = false;
        let currentHeight = 3.0;
        let latitude = 35.6895;
        let longitude = 139.6917;

        // GPS取得（可能な場合）
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                latitude = pos.coords.latitude;
                longitude = pos.coords.longitude;
                document.getElementById('lat-val').textContent = latitude.toFixed(2);
                document.getElementById('lng-val').textContent = longitude.toFixed(2);
                updateSun();
            });
        }

        // 高さレバーの更新
        document.getElementById('wall-height').addEventListener('input', (e) => {
            currentHeight = parseFloat(e.target.value);
            heightDisplay.textContent = currentHeight.toFixed(1) + 'm';
        });

        // 配置モード切り替え
        placeBtn.addEventListener('click', () => {
            isPlacing = !isPlacing;
            placeBtn.textContent = isPlacing ? '地面をタップして配置' : '壁を配置する (OFF)';
            placeBtn.className = isPlacing ? 'active' : '';
        });

        // 地面クリック時の処理
        ground.addEventListener('click', (evt) => {
            if (!isPlacing) return;
            
            // クリックされた座標を取得
            const point = evt.detail.intersection.point;
            createWall(point.x, point.z);
            
            // 配置モードを終了
            isPlacing = false;
            placeBtn.textContent = '壁を配置する (OFF)';
            placeBtn.className = '';
        });

        function createWall(x, z) {
            const wall = document.createElement('a-box');
            wall.setAttribute('position', `${x} ${currentHeight/2} ${z}`);
            wall.setAttribute('width', '2');
            wall.setAttribute('height', currentHeight);
            wall.setAttribute('depth', '0.2');
            wall.setAttribute('material', 'color: #8B4513; roughness: 0.8;');
            wall.setAttribute('shadow', 'cast: true; receive: true;');
            wallsContainer.appendChild(wall);
        }

        document.getElementById('clear-walls-btn').addEventListener('click', () => {
            wallsContainer.innerHTML = '';
        });

        // 太陽位置の更新
        function updateSun() {
            const timeStr = document.getElementById('time-input').value;
            const [h, m] = timeStr.split(':').map(Number);
            const date = new Date();
            date.setHours(h, m, 0, 0);

            const sun = SunCalc.getPosition(date, latitude, longitude);
            const alt = sun.altitude * (180 / Math.PI);
            const azi = sun.azimuth * (180 / Math.PI);

            // A-Frameの座標系に合わせて回転を設定
            // 太陽の向き（ライトの向き）を調整
            sunLight.setAttribute('rotation', `${-alt} ${azi + 180} 0`);
            
            document.getElementById('sun-position').textContent = 
                `太陽: 高度 ${alt.toFixed(1)}° / 方位 ${(azi + 180).toFixed(1)}°`;
        }

        document.getElementById('time-input').addEventListener('input', updateSun);
        updateSun();
    </script>
</body>
</html>
