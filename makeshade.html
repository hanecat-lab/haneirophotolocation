<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日陰シミュレーター - 安定描画版</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- SunCalc -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #222; font-family: sans-serif; color: #fff; }
        
        /* 3D描画キャンバスを確実に全画面表示 */
        #main-scene { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* 上部情報パネル */
        .top-panel {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 8px;
            font-size: 12px; z-index: 10; display: flex; justify-content: space-between; align-items: center;
        }

        /* 下部コントロールパネル */
        .ui-panel {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 15, 15, 0.95); border-top-left-radius: 16px; border-top-right-radius: 16px;
            padding: 12px 16px; z-index: 10; box-shadow: 0 -4px 20px rgba(0,0,0,0.8);
            max-height: 45vh; overflow-y: auto;
        }
        
        .panel-header {
            font-weight: bold; font-size: 13px; color: #4CAF50; text-align: center; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #333;
        }

        .control-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
        .control-group { margin-bottom: 6px; }
        label { display: block; font-size: 11px; color: #aaa; margin-bottom: 1px; }
        input[type="time"], select, button {
            width: 100%; padding: 6px; border: none; border-radius: 6px; font-size: 12px;
        }
        input[type="time"], select { background: #333; color: #fff; text-align: center; font-weight: bold; }
        input[type="range"] { width: 100%; accent-color: #4CAF50; }
        
        button { background: #4CAF50; color: white; font-weight: bold; cursor: pointer; padding: 8px; }
        button.secondary { background: #2196F3; }
        button.danger { background: #f44336; }
        button.dark { background: #444; font-size: 11px; padding: 5px; }

        .val-display { float: right; color: #4CAF50; font-weight: bold; }
        .camera-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 6px; }
    </style>
</head>
<body>

    <!-- A-Frameシーン（AR.jsを完全排除） -->
    <a-scene id="main-scene" embedded raycaster="objects: .clickable" cursor="rayOrigin: mouse">
        <a-entity id="camera-rig" position="0 8 12">
            <a-camera id="camera" look-controls="enabled: true" position="0 0 0"></a-camera>
        </a-entity>

        <a-light type="directional" intensity="1.2" position="10 20 10"></a-light>
        <a-light type="ambient" intensity="0.6"></a-light>

        <!-- 地面 (Y=0, 50m x 50m) -->
        <a-plane id="ground" position="0 0 0" rotation="-90 0 0" width="50" height="50" 
                 class="clickable" material="color: #dcdcdc; roughness: 1;"></a-plane>

        <!-- 方位表示 -->
        <a-entity id="compass-indicators">
            <a-text value="N (北)" position="0 0.02 -25" align="center" color="red" scale="3 3 3" rotation="-90 0 0"></a-text>
            <a-text value="S (南)" position="0 0.02 25" align="center" color="blue" scale="3 3 3" rotation="-90 0 180"></a-text>
            <a-text value="E (東)" position="25 0.02 0" align="center" color="black" scale="3 3 3" rotation="-90 0 -90"></a-text>
            <a-text value="W (西)" position="-25 0.02 0" align="center" color="black" scale="3 3 3" rotation="-90 0 90"></a-text>
        </a-entity>

        <a-entity id="walls-container"></a-entity>
        <a-entity id="sun-rays-container"></a-entity>
        <a-entity id="shadows-container"></a-entity>
    </a-scene>

    <div class="top-panel">
        <div id="sun-info" style="color:#FFD700; font-weight:bold;">太陽: 計算中...</div>
    </div>

    <div class="ui-panel" id="ui-panel">
        <div class="panel-header">⚙️ 3D日陰シミュレーター</div>

        <div class="control-row">
            <div style="flex: 1;">
                <label>表示切替:</label>
                <select id="display-mode">
                    <option value="both">影 ＋ 太陽光線</option>
                    <option value="shadow">影ポリゴンのみ</option>
                    <option value="rays">太陽光線のみ</option>
                    <option value="none">非表示</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label>時刻指定:</label>
                <input type="time" id="time-input" value="12:00">
            </div>
        </div>

        <div class="camera-presets">
            <button class="dark" onclick="setCameraPreset('top')">真上視点</button>
            <button class="dark" onclick="setCameraPreset('diagonal')">斜め45°</button>
            <button class="dark" onclick="setCameraPreset('front')">正面視点</button>
        </div>

        <div class="control-group">
            <label>壁の高さ: <span class="val-display" id="h-val">3.0m</span></label>
            <input type="range" id="wall-height" min="1" max="15" value="3" step="0.5">
        </div>
        <div class="control-group">
            <label>壁の幅: <span class="val-display" id="w-val">4.0m</span></label>
            <input type="range" id="wall-width" min="0.5" max="20" value="4" step="0.5">
        </div>
        <div class="control-group">
            <label>壁の厚み: <span class="val-display" id="d-val">0.2m</span></label>
            <input type="range" id="wall-depth" min="0.1" max="2" value="0.2" step="0.1">
        </div>
        <div class="control-group">
            <label>壁の回転: <span class="val-display" id="r-val">0°</span></label>
            <input type="range" id="wall-rot" min="0" max="360" value="0" step="1">
        </div>
        <div class="control-group">
            <label>地面からの高さ: <span class="val-display" id="y-val">0.0m</span></label>
            <input type="range" id="wall-y" min="-2" max="5" value="0" step="0.1">
        </div>

        <div style="display: flex; gap: 6px; margin-top: 8px;">
            <button id="place-wall-btn" class="secondary" style="flex: 2;">地面をタップして壁を配置</button>
            <button id="clear-walls-btn" class="danger" style="flex: 1;">すべて削除</button>
        </div>
    </div>

    <script>
        class ShadowRenderer {
            static update(walls, sunDir, sunAlt, shadowsContainer, sunRaysContainer, displayMode) {
                shadowsContainer.innerHTML = '';
                sunRaysContainer.innerHTML = '';

                if (sunAlt <= 0) return;

                const lenXZ = Math.sqrt(sunDir.x * sunDir.x + sunDir.z * sunDir.z);
                const dx = lenXZ > 0 ? -sunDir.x / lenXZ : 0;
                const dz = lenXZ > 0 ? -sunDir.z / lenXZ : 0;
                const shadowLenFactor = 1.0 / Math.tan(sunAlt);

                walls.forEach(wall => {
                    const topY = wall.height + wall.yOffset;
                    const totalShadowLen = wall.height * shadowLenFactor;

                    if (displayMode === 'both' || displayMode === 'rays') {
                        const rayLine = document.createElement('a-entity');
                        rayLine.setAttribute('line', `start: ${wall.x} ${topY} ${wall.z}; end: ${wall.x + sunDir.x * 0.4} ${topY + sunDir.y * 0.4} ${wall.z + sunDir.z * 0.4}; color: #FFD700;`);
                        sunRaysContainer.appendChild(rayLine);
                    }

                    if (displayMode === 'both' || displayMode === 'shadow') {
                        const shadowEl = document.createElement('a-entity');
                        const centerX = wall.x + dx * (totalShadowLen / 2);
                        const centerZ = wall.z + dz * (totalShadowLen / 2);
                        const angle = Math.atan2(sunDir.x, sunDir.z) * (180 / Math.PI);

                        shadowEl.setAttribute('position', `${centerX} 0.02 ${centerZ}`);
                        shadowEl.setAttribute('rotation', `-90 ${angle} 0`);
                        shadowEl.setAttribute('geometry', `primitive: plane; width: ${wall.width}; height: ${wall.depth + totalShadowLen};`);
                        shadowEl.setAttribute('material', 'color: #000000; opacity: 0.45; transparent: true; shader: flat;');
                        
                        shadowsContainer.appendChild(shadowEl);
                    }
                });
            }
        }

        let walls = [];
        let isPlacing = false;
        let latitude = 34.27, longitude = 135.38;

        const groundEl = document.getElementById('ground');
        const cameraRig = document.getElementById('camera-rig');
        const wallsContainer = document.getElementById('walls-container');
        const shadowsContainer = document.getElementById('shadows-container');
        const sunRaysContainer = document.getElementById('sun-rays-container');
        const timeInput = document.getElementById('time-input');
        const displayModeSelect = document.getElementById('display-mode');

        function setCameraPreset(type) {
            if (type === 'top') {
                cameraRig.setAttribute('position', '0 25 0.01');
                cameraRig.setAttribute('rotation', '-90 0 0');
            } else if (type === 'diagonal') {
                cameraRig.setAttribute('position', '0 12 18');
                cameraRig.setAttribute('rotation', '-30 0 0');
            } else if (type === 'front') {
                cameraRig.setAttribute('position', '0 3 15');
                cameraRig.setAttribute('rotation', '0 0 0');
            }
        }

        function getInputs() {
            return {
                height: parseFloat(document.getElementById('wall-height').value),
                width: parseFloat(document.getElementById('wall-width').value),
                depth: parseFloat(document.getElementById('wall-depth').value),
                rot: parseFloat(document.getElementById('wall-rot').value),
                yOffset: parseFloat(document.getElementById('wall-y').value)
            };
        }

        ['wall-height', 'wall-width', 'wall-depth', 'wall-rot', 'wall-y'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                const val = e.target.value;
                document.getElementById(id.replace('wall-', '') + '-val').textContent = val + (id === 'wall-rot' ? '°' : 'm');
                if (walls.length > 0) {
                    Object.assign(walls[walls.length - 1], getInputs());
                    updateWallsDOM();
                    updateSimulation();
                }
            });
        });

        document.getElementById('place-wall-btn').addEventListener('click', () => {
            isPlacing = true;
            alert('画面内の地面（Ground）をタップしてください。');
        });

        groundEl.addEventListener('click', (evt) => {
            if (!isPlacing) return;
            const pt = evt.detail.intersection.point;
            walls.push({ x: pt.x, z: pt.z, ...getInputs() });
            isPlacing = false;
            updateWallsDOM();
            updateSimulation();
        });

        document.getElementById('clear-walls-btn').addEventListener('click', () => {
            walls = [];
            updateWallsDOM();
            updateSimulation();
        });

        function updateWallsDOM() {
            wallsContainer.innerHTML = '';
            walls.forEach(w => {
                const box = document.createElement('a-box');
                box.setAttribute('position', `${w.x} ${(w.height / 2) + w.yOffset} ${w.z}`);
                box.setAttribute('width', w.width);
                box.setAttribute('height', w.height);
                box.setAttribute('depth', w.depth);
                box.setAttribute('rotation', `0 ${w.rot} 0`);
                box.setAttribute('material', 'color: #8B4513; roughness: 0.7;');
                wallsContainer.appendChild(box);
            });
        }

        function updateSimulation() {
            const [h, m] = timeInput.value.split(':').map(Number);
            const date = new Date();
            date.setHours(h, m, 0, 0);

            const sun = SunCalc.getPosition(date, latitude, longitude);
            const alt = sun.altitude;
            const azi = sun.azimuth + Math.PI;

            const dist = 35;
            const sunX = dist * Math.cos(alt) * Math.sin(azi);
            const sunY = dist * Math.sin(alt);
            const sunZ = -dist * Math.cos(alt) * Math.cos(azi);

            document.getElementById('sun-info').textContent = 
                `太陽高度: ${(alt * 180 / Math.PI).toFixed(1)}° / 方位: ${(azi * 180 / Math.PI).toFixed(1)}°`;

            ShadowRenderer.update(walls, {x: sunX, y: sunY, z: sunZ}, alt, shadowsContainer, sunRaysContainer, displayModeSelect.value);
        }

        timeInput.addEventListener('input', updateSimulation);
        displayModeSelect.addEventListener('change', updateSimulation);
        updateSimulation();
    </script>
</body>
</html>
