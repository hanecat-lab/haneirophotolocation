<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Solar & Direction Viewer</title>
  <!-- A-Frame & Orbit Controls CDN -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    /* 上部 UI パネル */
    #ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 999;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .info-row {
      font-size: 13px;
      color: #ffcc00;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .hud-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .direction-badge {
      color: #00ff88;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:active {
      background: rgba(0, 255, 136, 0.3);
      border-color: #00ff88;
    }

    /* 下部 時刻スライダー パネル */
    #bottom-panel {
      position: absolute;
      bottom: 20px;
      left: 10px;
      right: 10px;
      z-index: 999;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 12px 16px 8px 16px;
      color: #fff;
    }
    .time-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .time-label {
      font-size: 14px;
      font-weight: bold;
      color: #00ff88;
      width: 80px;
    }
    .time-slider {
      flex: 1;
      accent-color: #00ff88;
    }
    /* バージョン情報表示 (最下部右側) */
    .version-row {
      text-align: right;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      font-family: monospace;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- UI オーバーレイ -->
  <div id="ui-panel">
    <div class="info-row" id="solar-info">太陽高度 --° / 方位 --°</div>
    <div class="hud-row">
      向き <span class="direction-badge" id="hud-dir">N (0°)</span>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="setPresetDirection('N')">北 (N)</button>
      <button class="btn" onclick="setPresetDirection('E')">東 (E)</button>
      <button class="btn" onclick="setPresetDirection('S')">南 (S)</button>
      <button class="btn" onclick="setPresetDirection('W')">西 (W)</button>
    </div>
  </div>

  <div id="bottom-panel">
    <div class="time-row">
      <div class="time-label">時刻 <span id="time-display">12:00</span></div>
      <input type="range" id="time-range" class="time-slider" min="6" max="18" step="0.25" value="12" oninput="updateSunPosition(this.value)">
    </div>
    <!-- バージョン表示エリア -->
    <div class="version-row">
      ver: <span id="version-display">--</span>
    </div>
  </div>

  <!-- A-Frame 3D シーン -->
  <a-scene embedded vr-mode-ui="enabled: false">
    <a-assets></a-assets>

    <!-- ワールドルート (建物・地面・太陽光を配置) -->
    <a-entity id="world-root" rotation="0 0 0">
      <!-- 地面 (コンパスガイド描画) -->
      <a-circle position="0 0 0" rotation="-90 0 0" radius="10" color="#ffffff" material="roughness: 0.8"></a-circle>
      <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="7" radius-outer="7.05" color="#00ff88"></a-ring>
      <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="9.9" radius-outer="10" color="#00ff88"></a-ring>

      <!-- 方位テキストガイド (-Zが北) -->
      <a-text value="N (北)" position="0 0.1 -8" rotation="-90 0 0" align="center" color="#ff4444" scale="2 2 2"></a-text>
      <a-text value="S (南)" position="0 0.1 8" rotation="-90 180 0" align="center" color="#4488ff" scale="2 2 2"></a-text>
      <a-text value="E (東)" position="8 0.1 0" rotation="-90 -90 0" align="center" color="#00ff88" scale="2 2 2"></a-text>
      <a-text value="W (西)" position="-8 0.1 0" rotation="-90 90 0" align="center" color="#00ff88" scale="2 2 2"></a-text>

      <!-- 簡易建物のサンプル (日影確認用です) -->
      <a-box position="0 2 0" width="3" height="4" depth="3" color="#4a5568" shadow="cast: true; receive: true"></a-box>

      <!-- 修正①: 太陽光のターゲットとして指定するエンティティ -->
      <a-entity id="sunTarget" position="0 0 0"></a-entity>
      
      <!-- 修正①: targetプロパティを追加し、常にsunTarget(ワールド中心)を向くように設定 -->
      <a-entity id="sun-light" light="type: directional; target: #sunTarget; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048; intensity: 1.2" position="0 20 10"></a-entity>
      <a-light type="ambient" intensity="0.4" color="#ffffff"></a-light>
    </a-entity>

    <!-- OrbitControls カメラ -->
    <a-entity id="orbitCamera" 
              camera 
              position="0 12 18" 
              orbit-controls="target: 0 0 0; enableDamping: true; dampingFactor: 0.12; rotateSpeed: 0.55; minDistance: 1; maxDistance: 60; maxPolarAngle: 1.56" 
              active="true">
    </a-entity>
  </a-scene>

  <script>
    // 修正⑧: APP_VERSIONを更新
    const APP_VERSION = "20260807-Rev2";
    let isCompassActive = false;

    // 磁気連動を停止する処理（今回はUI実装外ですが既存維持）
    const stopCompass = () => {
      isCompassActive = false;
    };

    /**
     * 修正⑨: updateHUD() の説明コメント
     * HUD(ヘッドアップディスプレイ)上の方位表示と角度を8方向に変換して更新する
     * 修正⑤, ⑥: 8方向の配列で管理し、最も近い方向へ四捨五入で割り当て
     * @param {number} deg - 方位角(度)
     */
    const updateHUD = (deg) => {
      const hudDir = document.getElementById('hud-dir');
      const directions = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      
      // 角度を0〜359度の範囲に正規化
      const normalizedDeg = ((deg % 360) + 360) % 360;
      
      // 45度区切りで最も近いインデックスを取得
      const index = Math.round(normalizedDeg / 45) % 8;
      const label = directions[index];
      
      hudDir.innerText = `${label} (${Math.round(normalizedDeg)}°)`;
    };

    /**
     * 修正⑨: calculateSunPosition() の説明コメント
     * 修正⑦: 太陽の位置、高度、方位を計算する処理を独立した関数に分離
     * 将来的にSunCalcライブラリ等に差し替えやすいよう、必要な情報をオブジェクトで返却する
     * @param {number} hour - 24時間表記の時刻
     * @returns {Object} 太陽の高度、方位、およびX,Y,Z座標
     */
    const calculateSunPosition = (hour) => {
      // 簡易太陽軌道計算 (6:00=東 -> 12:00=南高角 -> 18:00=西)
      const rad = ((hour - 6) / 12) * Math.PI; 
      
      // 座標の近似計算
      const x = -25 * Math.cos(rad);
      const y = 25 * Math.sin(rad);
      const z = 10 * Math.sin(rad);

      // 高度・方位角の計算
      const altitude = Math.max(0, Math.sin(rad) * 75);
      const azimuth = 90 + (hour - 6) * 15;

      return { altitude, azimuth, x, y, z };
    };

    /**
     * 修正⑨: setPresetDirection() の説明コメント
     * 指定した方角（N, E, S, W）が画面奥になるように OrbitControls を回転させる
     * 直接位置を書き換えず、内部の極座標(spherical)を更新することで跳ね戻りを防止する
     * @param {string} targetDir - 指定方角
     */
    window.setPresetDirection = (targetDir) => {
      if (isCompassActive) stopCompass();

      const worldRoot = document.getElementById('world-root');
      const orbitCam = document.getElementById('orbitCamera');
      
      // ワールド回転を 0 に固定
      worldRoot.setAttribute('rotation', '0 0 0');

      // 指定方角が「画面奥（上）」を向く theta 角度を設定 (-Z軸が北)
      let targetTheta = 0;
      let headingDeg = 0;
      
      switch(targetDir) {
        case 'N': targetTheta = 0;            headingDeg = 0;   break;
        case 'E': targetTheta = -Math.PI / 2; headingDeg = 90;  break;
        case 'S': targetTheta = Math.PI;      headingDeg = 180; break;
        case 'W': targetTheta = Math.PI / 2;  headingDeg = 270; break;
      }

      const orbitComp = orbitCam.components['orbit-controls'];
      if (orbitComp && orbitComp.controls) {
        const controls = orbitComp.controls;
        
        if (controls.spherical) {
          // 修正②: ユーザーが変更した俯瞰角(phi)と距離(radius)を保持する
          const phi = controls.spherical.phi;
          const radius = controls.spherical.radius;

          // 修正③: position.setによる直接の座標書き換えを廃止し、極座標パラメータのみ更新
          controls.spherical.theta = targetTheta;
          controls.spherical.phi = phi;
          controls.spherical.radius = radius;
          controls.spherical.makeSafe();

          // 修正③: 最後に controls.update() で内部状態と同期・反映
          controls.update();
        }
      }

      updateHUD(headingDeg);
    };

    /**
     * 修正⑨: updateSunPosition() の説明コメント
     * スライダー入力に応じて太陽位置の算出関数を呼び出し、
     * 光源の移動・角度設定・UIテキストの更新を行う
     * @param {string|number} val - スライダーから渡される時間
     */
    const updateSunPosition = (val) => {
      const hours = parseFloat(val);
      
      // 修正④: 11:60対策の時刻計算ロジック
      const totalMinutes = Math.round(hours * 60);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      document.getElementById('time-display').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

      // 修正⑦: 太陽位置計算関数の呼び出し
      const sunPos = calculateSunPosition(hours);

      const sunLight = document.getElementById('sun-light');
      if (sunLight) {
        // Y座標は地平線下にならないよう 0.1 を下限とする
        sunLight.setAttribute('position', `${sunPos.x} ${Math.max(sunPos.y, 0.1)} ${sunPos.z}`);
        
        // 修正①: DirectionalLightを常にワールド中心へ照射する
        if (sunLight.object3D) {
          sunLight.object3D.lookAt(0, 0, 0);
        }
      }

      // 高度・方位角の計算表示 (小数点第1位まで)
      const altDisp = (Math.round(sunPos.altitude * 10) / 10).toFixed(1);
      const azmDisp = (Math.round(sunPos.azimuth * 10) / 10).toFixed(1);
      document.getElementById('solar-info').innerText = `太陽高度 ${altDisp}° / 方位 ${azmDisp}°`;
    };

    // 初期起動時の処理
    window.addEventListener('load', () => {
      const versionEl = document.getElementById('version-display');
      if (versionEl) {
        versionEl.innerText = APP_VERSION;
      }
      
      updateSunPosition(12);
    });
  </script>
</body>
</html>
