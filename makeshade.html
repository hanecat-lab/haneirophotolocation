<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日陰シミュレーター / Compass v2</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif}#scene{width:100%;height:100%}.panel{position:fixed;z-index:10;left:10px;right:10px;background:rgba(15,15,15,.88);backdrop-filter:blur(10px);border:1px solid #333;border-radius:12px;box-shadow:0 5px 20px #0009}.top{top:10px;padding:9px 11px;font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.yellow{color:#ffd700;font-weight:700}.green{color:#00ff66;font-weight:700}.hud{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding:5px 8px;border:1px solid #064d2a;border-radius:7px;background:#0009;font-family:monospace}.hud strong{font-size:15px;color:#00ff66}.strip{color:#777;letter-spacing:5px}.strip b{color:#00ff66;text-shadow:0 0 7px #0f6}.bottom{bottom:10px;padding:9px 10px}.time{display:flex;align-items:center;gap:8px}.time output{font:bold 16px monospace;color:#00ff66}.time input{flex:1;accent-color:#00ff66}.buttons{display:flex;gap:6px;margin-top:7px}.buttons button{flex:1}.settings{bottom:125px;padding:10px;display:none;max-height:44vh;overflow:auto}.settings.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ctrl{margin:4px 0}.ctrl label{display:flex;justify-content:space-between;font-size:10px;color:#ccc}.ctrl output{color:#00ff66;font-weight:700}.ctrl input{width:100%;accent-color:#00ff66}.btn{border:0;border-radius:7px;height:34px;color:#fff;font-weight:700;background:#287be5}.btn.purple{background:#9b59b6}.btn.red{background:#d94b3d}.btn.dark{background:#292929;border:1px solid #444;color:#ddd;font-size:10px}.mini{height:27px;font-size:10px}.mode{color:#00ff66;font-size:11px;margin-top:5px}.cal{display:flex;gap:5px;margin-top:6px}.cal button{flex:1}.hint{color:#aaa;font-size:10px;line-height:1.45;margin-top:6px}
</style>
</head>
<body>
<a-scene id="scene" embedded vr-mode-ui="enabled:false" shadow="type:pcfsoft">
  <a-entity id="camera" camera position="0 5 12" orbit-controls="target:0 1 0;enableDamping:true;dampingFactor:.12;rotateSpeed:.55;zoomSpeed:1;panSpeed:.7;minDistance:.5;maxDistance:60;maxPolarAngle:1.56"></a-entity>
  <!-- 物理座標系を一つにするため、地面・物体・太陽ライトを同じ world-root に置く -->
  <a-entity id="world-root">
    <a-entity id="sun-light" light="type:directional;intensity:1.3;castShadow:true;shadowCameraTop:25;shadowCameraBottom:-25;shadowCameraLeft:-25;shadowCameraRight:25;shadowMapWidth:2048;shadowMapHeight:2048" position="10 20 10"></a-entity>
    <a-light type="ambient" intensity=".45"></a-light>
    <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" material="color:#e5e5e5;roughness:.85" shadow="receive:true"></a-plane>
    <a-entity id="markers">
      <a-text value="N" position="0 .03 -22" align="center" color="#e74c3c" scale="3 3 3" rotation="-90 0 0"></a-text><a-text value="E" position="22 .03 0" align="center" color="#333" scale="2.5 2.5 2.5" rotation="-90 0 -90"></a-text><a-text value="S" position="0 .03 22" align="center" color="#3498db" scale="2.5 2.5 2.5" rotation="-90 0 180"></a-text><a-text value="W" position="-22 .03 0" align="center" color="#333" scale="2.5 2.5 2.5" rotation="-90 0 90"></a-text>
    </a-entity>
    <a-entity id="walls"></a-entity><a-entity id="humans"></a-entity>
  </a-entity>
</a-scene>
<div class="panel top"><div class="row"><span id="sunInfo" class="yellow">太陽: --</span><button id="sensorBtn" class="btn mini">🧭 センサーを開始</button></div><div class="hud"><span>向き <strong id="headingText">N (0°)</strong></span><span class="strip" id="strip">NW N NE E SE S SW W</span></div><div id="mode" class="mode">手動モード / スライダーで基準方位を調整</div><div id="sensorDebug" class="hint">raw: -- / offset: -- / calibrated: -- / filtered: --</div><div class="cal"><button id="calBtn" class="btn dark mini">現在の向きを0°に再設定</button><button id="stopBtn" class="btn dark mini">センサー停止</button></div><div class="hint">センサーは画面の長辺を上にした状態で使うと安定します。青い「センサー開始」はHTTPSまたはlocalhostで実行してください。</div></div>
<div id="settings" class="panel settings"><div class="grid"><div class="ctrl"><label>ワールド回転 <output id="rotOut">0°</output></label><input id="rot" type="range" min="0" max="359.9" step=".1" value="0"></div><div class="ctrl"><label>壁の高さ <output id="whOut">3.0m</output></label><input id="wh" type="range" min="1" max="15" step=".5" value="3"></div><div class="ctrl"><label>壁の幅 <output id="wwOut">4.0m</output></label><input id="ww" type="range" min=".5" max="20" step=".5" value="4"></div><div class="ctrl"><label>壁の回転 <output id="wrOut">0°</output></label><input id="wr" type="range" min="0" max="359" value="0"></div><div class="ctrl"><label>人の身長 <output id="hhOut">160cm</output></label><input id="hh" type="range" min="120" max="200" value="160"></div></div><button id="settingsClose" class="btn dark mini">設定を閉じる</button></div>
<div class="panel bottom"><div class="time"><span>時刻</span><output id="timeOut">12:00</output><input id="time" type="range" min="300" max="1140" value="720"></div><div class="buttons"><button id="settingsBtn" class="btn dark">⚙ 設定</button><button id="wallBtn" class="btn">壁を追加</button><button id="humanBtn" class="btn purple">人を追加</button><button id="clearBtn" class="btn red">全削除</button></div></div>
<script>
const $=id=>document.getElementById(id), root=$('world-root'), light=$('sun-light'), wallsEl=$('walls'), humansEl=$('humans');
let walls=[],humans=[],heading=0,rawHeading=null,latestRawHeading=null,offset=0,tracking=false,raf=0,lastT=performance.now(),lastRenderHeading=0,manual=true,orientationEventName=null,filterSin=0,filterCos=1,dragging=false,lastPointerX=0,sourceType='none';
const lat=34.27,lon=135.38;
function norm(v){return (v%360+360)%360} function signed(v){return ((v+180)%360+360)%360-180}
function dir(v){return ['N','NE','E','SE','S','SW','W','NW'][Math.floor((norm(v)+22.5)/45)%8]}
function updateHUD(v){v=norm(v);$('headingText').textContent=`${dir(v)} (${Math.round(v)}°)`;const names=['N','NE','E','SE','S','SW','W','NW'];$('strip').innerHTML=names.map(n=>n===dir(v)?`<b>${n}</b>`:n).join(' ');$('rotOut').textContent=`${v.toFixed(1)}°`;$('rot').value=v} function updateDebug(raw,calibrated){$('sensorDebug').textContent=`source: ${sourceType} / raw: ${raw==null?'--':raw.toFixed(1)+'°'} / offset: ${offset.toFixed(1)}° / calibrated: ${calibrated==null?'--':calibrated.toFixed(1)+'°'} / filtered: ${heading.toFixed(1)}°`}
function setHeading(v){heading=norm(v); updateHUD(heading);}
function circularLowPass(target,alpha=.38){const targetNorm=norm(target),difference=Math.abs(signed(targetNorm-heading));if(difference>30){resetCircularFilter(targetNorm);return}const r=targetNorm*Math.PI/180;const s=Math.sin(r),c=Math.cos(r);filterSin=(1-alpha)*filterSin+alpha*s;filterCos=(1-alpha)*filterCos+alpha*c;heading=norm(Math.atan2(filterSin,filterCos)*180/Math.PI)}
function resetCircularFilter(value){const r=norm(value)*Math.PI/180;filterSin=Math.sin(r);filterCos=Math.cos(r);heading=norm(value)}
function requestRender(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;root.setAttribute('rotation',`0 ${heading} 0`);updateHUD(heading);updateSimulation()})}
function screenAngle(){return (screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:((window.orientation||0)+360)%360}
function readHeading(e){
  let raw=null;
  if(typeof e.webkitCompassHeading==='number'&&isFinite(e.webkitCompassHeading)){raw=norm(e.webkitCompassHeading);sourceType='iOS compass'}
  else if((e.absolute===true||orientationEventName==='deviceorientationabsolute')&&typeof e.alpha==='number'&&isFinite(e.alpha)){raw=norm(360-e.alpha+screenAngle());sourceType='absolute alpha'}
  else if(typeof e.alpha==='number'&&isFinite(e.alpha)){raw=norm(360-e.alpha+screenAngle());sourceType='relative alpha';if($('mode').textContent.indexOf('相対値')<0)$('mode').textContent='警告: 相対alphaのみ / 絶対北ではありません'}
  if(raw==null)return;
  latestRawHeading=raw;
  if(rawHeading===null){rawHeading=raw;offset=signed(raw-heading)}
  /* オフセット適用はこの1か所だけ。raw - offset を正規化してからベクトルLPFへ渡す */
  const calibrated=norm(raw-offset);circularLowPass(calibrated);updateDebug(raw,calibrated);requestRender();
}
async function startSensor(){
 try{if(typeof DeviceOrientationEvent==='undefined'){throw Error('この端末はDeviceOrientationに対応していません')}
  if(typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw Error('センサー許可が得られませんでした')}
  rawHeading=null;latestRawHeading=null;resetCircularFilter(heading);tracking=true;manual=false;orientationEventName=('ondeviceorientationabsolute' in window)?'deviceorientationabsolute':'deviceorientation';window.addEventListener(orientationEventName,readHeading,true);$('mode').textContent=`センサーモード / ${orientationEventName==='deviceorientationabsolute'?'絶対方位イベント':'deviceorientation'} / ベクトルLPF`;$('sensorBtn').textContent='🧭 センサー同期中';
 }catch(e){$('mode').textContent='開始失敗: '+e.message+'（手動モードを継続）';manual=true}
}
function stopSensor(){tracking=false;manual=true;rawHeading=null;latestRawHeading=null;if(orientationEventName)window.removeEventListener(orientationEventName,readHeading,true);orientationEventName=null;$('sensorBtn').textContent='🧭 センサーを開始';$('mode').textContent='手動モード / スライダーで基準方位を調整'}
$('sensorBtn').onclick=startSensor;$('stopBtn').onclick=stopSensor;$('calBtn').onclick=()=>{if(latestRawHeading!==null){offset=signed(latestRawHeading-heading);resetCircularFilter(heading);updateDebug(latestRawHeading,heading);$('mode').textContent=sourceType==='relative alpha'?'警告: 相対alphaのため絶対方位の基準にはなりません':'基準方位をリセット済み / センサー同期中'}else{resetCircularFilter(0);setHeading(0);$('mode').textContent='まだセンサー値がありません / Nへリセット'}};
$('rot').oninput=e=>{if(tracking)stopSensor();resetCircularFilter(+e.target.value);setHeading(+e.target.value);requestRender()};
/* センサーが使えないPCでも、シーン上のドラッグで方位を確認できる */
$('scene').addEventListener('pointerdown',e=>{if(tracking)return;dragging=true;lastPointerX=e.clientX;$('scene').setPointerCapture?.(e.pointerId)});
$('scene').addEventListener('pointermove',e=>{if(!dragging||tracking)return;const dx=e.clientX-lastPointerX;lastPointerX=e.clientX;resetCircularFilter(heading-dx*.35);requestRender()});
$('scene').addEventListener('pointerup',()=>dragging=false);$('scene').addEventListener('pointercancel',()=>dragging=false);
$('settingsBtn').onclick=()=>$('settings').classList.toggle('open');$('settingsClose').onclick=()=>$('settings').classList.remove('open');
function val(id,out,suffix){$(id).oninput=e=>$(out).textContent=e.target.value+suffix} val('wh','whOut','m');val('ww','wwOut','m');val('wr','wrOut','°');val('hh','hhOut','cm');
$('time').oninput=updateSimulation;
$('wallBtn').onclick=()=>{walls.push({x:(Math.random()*10-5).toFixed(1),z:(Math.random()*10-5).toFixed(1),h:+$('wh').value,w:+$('ww').value,r:+$('wr').value});renderWalls()};
$('humanBtn').onclick=()=>{humans.push({x:(Math.random()*10-5).toFixed(1),z:(Math.random()*10-5).toFixed(1),h:+$('hh').value/100});renderHumans()};$('clearBtn').onclick=()=>{walls=[];humans=[];renderWalls();renderHumans()};
function renderWalls(){wallsEl.innerHTML='';walls.forEach(w=>{const e=document.createElement('a-box');e.setAttribute('position',`${w.x} ${w.h/2} ${w.z}`);e.setAttribute('width',w.w);e.setAttribute('height',w.h);e.setAttribute('depth','.2');e.setAttribute('rotation',`0 ${w.r} 0`);e.setAttribute('material','color:#d35400;roughness:.6');e.setAttribute('shadow','cast:true;receive:true');wallsEl.appendChild(e)})}
function renderHumans(){humansEl.innerHTML='';humans.forEach(h=>{const r=document.createElement('a-entity');r.setAttribute('position',`${h.x} 0 ${h.z}`);r.setAttribute('scale',`${h.h/1.6} ${h.h/1.6} ${h.h/1.6}`);[[.24,.24,.24,0,1.48],[.36,.5,.18,0,1.11],[.12,.76,.14,-.1,.38],[.12,.76,.14,.1,.38],[.1,.48,.1,-.24,1.1],[.1,.48,.1,.24,1.1]].forEach(p=>{const e=document.createElement('a-box');e.setAttribute('width',p[0]);e.setAttribute('height',p[1]);e.setAttribute('depth',p[2]);e.setAttribute('position',`${p[3]} ${p[4]} 0`);e.setAttribute('material','color:#8e44ad');e.setAttribute('shadow','cast:true;receive:true');r.appendChild(e)});humansEl.appendChild(r)})}
function updateSimulation(){const minutes=+$('time').value,h=Math.floor(minutes/60),m=minutes%60;$('timeOut').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;/* 和歌山付近の日本標準時(JST=UTC+9)として計算。端末のタイムゾーンに依存しない */const now=new Date(),d=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate(),h-9,m,0));const s=SunCalc.getPosition(d,lat,lon),az=s.azimuth+Math.PI,alt=s.altitude,dist=40;const x=dist*Math.cos(alt)*Math.sin(az),y=dist*Math.sin(alt),z=-dist*Math.cos(alt)*Math.cos(az);/* light is inside world-root: local solar vector is rotated exactly once with the scene */light.setAttribute('position',`${x} ${y} ${z}`);$('sunInfo').textContent=`太陽高度 ${ (alt*180/Math.PI).toFixed(1)}° / 方位 ${norm(az*180/Math.PI).toFixed(1)}°`}
resetCircularFilter(0);setHeading(0);updateDebug(null,null);updateSimulation();
</script><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"4edd5f8ec12a48cfa682ab8261b80a79"}' crossorigin="anonymous"></script>
</body></html>
