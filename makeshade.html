<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR影シミュレーター - 仮想の壁で日当たりチェック</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.2/suncalc.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        #scene-container {
            width: 100vw;
            height: 100vh;
        }

        .ui-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="time"],
        input[type="range"],
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            transition: background 0.3s;
        }

        input[type="time"] {
            background: #333;
            color: #fff;
        }

        input[type="range"] {
            padding: 5px;
        }

        button:hover {
            background: #45a049;
        }

        button:active {
            background: #3d8b40;
        }

        .info-text {
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
            text-align: center;
        }

        .top-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            z-index: 100;
        }

        .sun-info {
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .instruction {
            font-size: 12px;
            color: #aaa;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <!-- カメラ -->
        <a-camera position="0 1.6 0"></a-camera>

        <!-- 照明 -->
        <a-light id="sun" type="directional" intensity="1" position="0 10 0"></a-light>
        <a-light type="ambient" intensity="0.5"></a-light>

        <!-- 地面（影を受け取る） -->
        <a-plane id="ground" position="0 0 0" rotation="-90 0 0" width="100" height="100" 
                 material="color: #888; transparent: true; opacity: 0.3;"></a-plane>

        <!-- 壁を配置するコンテナ -->
        <a-entity id="walls-container"></a-entity>
    </a-scene>

    <!-- UI パネル -->
    <div class="ui-panel">
        <div class="control-group">
            <label for="time-input">時刻を指定:</label>
            <input type="time" id="time-input" value="12:00">
        </div>

        <div class="control-group">
            <label for="latitude-input">緯度:</label>
            <input type="number" id="latitude-input" value="35.6895" step="0.0001" 
                   style="width: 100%; padding: 8px; border-radius: 5px; border: none;">
        </div>

        <div class="control-group">
            <label for="longitude-input">経度:</label>
            <input type="number" id="longitude-input" value="139.6917" step="0.0001"
                   style="width: 100%; padding: 8px; border-radius: 5px; border: none;">
        </div>

        <div class="control-group">
            <label for="wall-height">壁の高さ (m):</label>
            <input type="range" id="wall-height" min="1" max="10" value="3" step="0.5">
            <span id="height-display">3m</span>
        </div>

        <button id="place-wall-btn">壁を配置 (タップ後、画面をクリック)</button>
        <button id="clear-walls-btn">すべてクリア</button>

        <div class="info-text">
            💡 時刻を変更すると、影がリアルタイムに動きます
        </div>
    </div>

    <!-- トップ情報パネル -->
    <div class="top-info">
        <div class="sun-info" id="sun-position">太陽の位置: 計算中...</div>
        <div class="instruction">
            ✓ 壁を配置ボタンを押す<br>
            ✓ AR画面をクリック<br>
            ✓ 時刻を変更して影を確認
        </div>
    </div>

    <script>
        // グローバル変数
        let scene = document.querySelector('a-scene');
        let wallsContainer = document.getElementById('walls-container');
        let sunLight = document.getElementById('sun');
        let wallCount = 0;
        let isPlacingWall = false;
        let currentWallHeight = 3;

        // 初期化
        window.addEventListener('load', () => {
            updateSunPosition();
            setupEventListeners();
        });

        // イベントリスナーの設定
        function setupEventListeners() {
            document.getElementById('time-input').addEventListener('change', updateSunPosition);
            document.getElementById('latitude-input').addEventListener('change', updateSunPosition);
            document.getElementById('longitude-input').addEventListener('change', updateSunPosition);
            document.getElementById('wall-height').addEventListener('input', (e) => {
                currentWallHeight = parseFloat(e.target.value);
                document.getElementById('height-display').textContent = currentWallHeight + 'm';
            });
            document.getElementById('place-wall-btn').addEventListener('click', enableWallPlacement);
            document.getElementById('clear-walls-btn').addEventListener('click', clearAllWalls);
            
            // AR画面のクリックで壁を配置
            scene.addEventListener('click', placeWallOnClick);
        }

        // 太陽の位置を計算してライトを更新
        function updateSunPosition() {
            const timeInput = document.getElementById('time-input').value;
            const latitude = parseFloat(document.getElementById('latitude-input').value);
            const longitude = parseFloat(document.getElementById('longitude-input').value);

            // 時刻を解析
            const [hours, minutes] = timeInput.split(':').map(Number);
            const now = new Date();
            now.setHours(hours, minutes, 0, 0);

            // SunCalcで太陽の位置を計算
            const sunPosition = SunCalc.getPosition(now, latitude, longitude);
            const altitude = sunPosition.altitude; // 高度（ラジアン）
            const azimuth = sunPosition.azimuth;   // 方位角（ラジアン）

            // ラジアンから度に変換
            const altitudeDeg = (altitude * 180 / Math.PI);
            const azimuthDeg = (azimuth * 180 / Math.PI);

            // Unityライクな座標系に変換
            // 方位角: 北=0°, 東=90°, 南=180°, 西=270°
            // A-Frameでは: Y軸回転 = 方位角, X軸回転 = -高度
            const rotationX = -altitudeDeg;
            const rotationY = azimuthDeg;

            // ライトの回転を更新
            sunLight.setAttribute('rotation', `${rotationX} ${rotationY} 0`);

            // 情報パネルを更新
            const sunInfo = document.getElementById('sun-position');
            sunInfo.textContent = `太陽の位置: 高度 ${altitudeDeg.toFixed(1)}°, 方位 ${azimuthDeg.toFixed(1)}°`;
        }

        // 壁配置モードを有効化
        function enableWallPlacement() {
            isPlacingWall = !isPlacingWall;
            const btn = document.getElementById('place-wall-btn');
            btn.textContent = isPlacingWall ? '配置モード: ON (クリック)' : '壁を配置 (タップ後、画面をクリック)';
            btn.style.background = isPlacingWall ? '#FF6B6B' : '#4CAF50';
        }

        // AR画面をクリックして壁を配置
        function placeWallOnClick(event) {
            if (!isPlacingWall) return;

            // ランダムな位置に壁を配置（-5 ～ 5 の範囲）
            const x = (Math.random() - 0.5) * 8;
            const z = -3 - Math.random() * 2; // カメラの前方

            createWall(x, z);
            isPlacingWall = false;
            document.getElementById('place-wall-btn').textContent = '壁を配置 (タップ後、画面をクリック)';
            document.getElementById('place-wall-btn').style.background = '#4CAF50';
        }

        // 壁を作成
        function createWall(x, z) {
            wallCount++;
            const wallId = `wall-${wallCount}`;

            const wall = document.createElement('a-box');
            wall.setAttribute('id', wallId);
            wall.setAttribute('position', `${x} ${currentWallHeight / 2} ${z}`);
            wall.setAttribute('width', '2');
            wall.setAttribute('height', currentWallHeight);
            wall.setAttribute('depth', '0.2');
            wall.setAttribute('material', 'color: #8B4513; metalness: 0.3; roughness: 0.7;');
            wall.setAttribute('shadow', 'cast: true; receive: true;');

            // 壁をクリックして削除できるように
            wall.addEventListener('click', (e) => {
                e.stopPropagation();
                wall.remove();
            });

            wallsContainer.appendChild(wall);
        }

        // すべての壁をクリア
        function clearAllWalls() {
            wallsContainer.innerHTML = '';
            wallCount = 0;
        }

        // 定期的に太陽位置を更新（時刻が変わった場合など）
        setInterval(() => {
            // 必要に応じて定期更新
        }, 1000);
    </script>
</body>
</html>
