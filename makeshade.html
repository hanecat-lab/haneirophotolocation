<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Solar & Direction Viewer</title>
  <!-- A-Frame & Orbit Controls CDN -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    /* 上部 UI パネル */
    #ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 999;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .info-row {
      font-size: 13px;
      color: #ffcc00;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .hud-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .direction-badge {
      color: #00ff88;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:active {
      background: rgba(0, 255, 136, 0.3);
      border-color: #00ff88;
    }

    /* 下部 時刻スライダー パネル */
    #bottom-panel {
      position: absolute;
      bottom: 20px;
      left: 10px;
      right: 10px;
      z-index: 999;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 12px 16px 8px 16px;
      color: #fff;
    }
    .time-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .time-label {
      font-size: 14px;
      font-weight: bold;
      color: #00ff88;
      width: 80px;
    }
    .time-slider {
      flex: 1;
      accent-color: #00ff88;
    }
    /* バージョン情報表示 (最下部右側) */
    .version-row {
      text-align: right;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      font-family: monospace;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- UI オーバーレイ -->
  <div id="ui-panel">
    <div class="info-row" id="solar-info">太陽高度 --° / 方位 --°</div>
    <div class="hud-row">
      向き <span class="direction-badge" id="hud-dir">N (0°)</span>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="setPresetDirection('N')">北 (N)</button>
      <button class="btn" onclick="setPresetDirection('E')">東 (E)</button>
      <button class="btn" onclick="setPresetDirection('S')">南 (S)</button>
      <button class="btn" onclick="setPresetDirection('W')">西 (W)</button>
    </div>
  </div>

  <div id="bottom-panel">
    <div class="time-row">
      <div class="time-label">時刻 <span id="time-display">12:00</span></div>
      <input type="range" id="time-range" class="time-slider" min="6" max="18" step="0.25" value="12" oninput="updateSunPosition(this.value)">
    </div>
    <!-- バージョン表示エリア -->
    <div class="version-row">
      ver: <span id="version-display">--</span>
    </div>
  </div>

  <!-- A-Frame 3D シーン -->
  <a-scene embedded vr-mode-ui="enabled: false">
    <a-assets></a-assets>

    <!-- ワールドルート (建物・地面・太陽光を配置) -->
    <a-entity id="world-root" rotation="0 0 0">
      <!-- 地面 (コンパスガイド描画) -->
      <a-circle position="0 0 0" rotation="-90 0 0" radius="10" color="#ffffff" material="roughness: 0.8"></a-circle>
      <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="7" radius-outer="7.05" color="#00ff88"></a-ring>
      <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="9.9" radius-outer="10" color="#00ff88"></a-ring>

      <!-- 方位テキストガイド (-Zが北) -->
      <a-text value="N (北)" position="0 0.1 -8" rotation="-90 0 0" align="center" color="#ff4444" scale="2 2 2"></a-text>
      <a-text value="S (南)" position="0 0.1 8" rotation="-90 180 0" align="center" color="#4488ff" scale="2 2 2"></a-text>
      <a-text value="E (東)" position="8 0.1 0" rotation="-90 -90 0" align="center" color="#00ff88" scale="2 2 2"></a-text>
      <a-text value="W (西)" position="-8 0.1 0" rotation="-90 90 0" align="center" color="#00ff88" scale="2 2 2"></a-text>

      <!-- 簡易建物のサンプル (日影確認用) -->
      <a-box position="0 2 0" width="3" height="4" depth="3" color="#4a5568" shadow="cast: true; receive: true"></a-box>

      <!-- 太陽光（平行光源） -->
      <a-entity id="sun-light" light="type: directional; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048; intensity: 1.2" position="0 20 10"></a-entity>
      <a-light type="ambient" intensity="0.4" color="#ffffff"></a-light>
    </a-entity>

    <!-- OrbitControls カメラ -->
    <a-entity id="orbitCamera" 
              camera 
              position="0 12 18" 
              orbit-controls="target: 0 0 0; enableDamping: true; dampingFactor: 0.12; rotateSpeed: 0.55; minDistance: 1; maxDistance: 60; maxPolarAngle: 1.56" 
              active="true">
    </a-entity>
  </a-scene>

  <script>
    const APP_VERSION = "20260807-071500";
    let isCompassActive = false;

    function stopCompass() {
      isCompassActive = false;
    }

    // HUD の表示更新
    function updateHUD(deg) {
      const hudDir = document.getElementById('hud-dir');
      let label = 'N';
      if (deg === 90) label = 'E';
      if (deg === 180) label = 'S';
      if (deg === 270) label = 'W';
      hudDir.innerText = `${label} (${deg}°)`;
    }

    // OrbitControls の内部極座標(spherical)を直接更新する方角変更関数
    window.setPresetDirection = function(targetDir) {
      if (isCompassActive) stopCompass();

      const worldRoot = document.getElementById('world-root');
      const orbitCam = document.getElementById('orbitCamera');
      
      // 1. ワールド回転を 0 に固定（日影・太陽位置の絶対座標を保護）
      worldRoot.setAttribute('rotation', '0 0 0');

      // 2. 指定方角が「画面奥（上）」を向く theta 角度を設定 (-Z軸が北)
      let targetTheta = 0, headingDeg = 0;
      switch(targetDir) {
        case 'N': targetTheta = 0;                 headingDeg = 0;   break; // 南から北を見る
        case 'E': targetTheta = -Math.PI / 2;      headingDeg = 90;  break; // 西から東を見る
        case 'S': targetTheta = Math.PI;           headingDeg = 180; break; // 北から南を見る
        case 'W': targetTheta = Math.PI / 2;       headingDeg = 270; break; // 東から西を見る
      }

      // 3. OrbitControls の内部パラメータを同期・書き換え
      const orbitComp = orbitCam.components['orbit-controls'];
      if (orbitComp && orbitComp.controls) {
        const controls = orbitComp.controls;
        
        const radius = controls.getDistance ? controls.getDistance() : 21.63;
        const phi = Math.atan2(18, 12); // 上下俯瞰アングル

        if (controls.spherical) {
          controls.spherical.theta = targetTheta;
          controls.spherical.phi = phi;
          controls.spherical.radius = radius;
          controls.spherical.makeSafe();
        }

        // カメラ位置の再計算と反映
        controls.object.position.set(
          radius * Math.sin(phi) * Math.sin(targetTheta),
          radius * Math.cos(phi),
          radius * Math.sin(phi) * Math.cos(targetTheta)
        );

        controls.target.set(0, 0, 0);
        controls.update(); // キャッシュ同期（跳ね戻り防止）
      }

      updateHUD(headingDeg);
    };

    // 太陽位置（日影）の計算とアニメーション
    function updateSunPosition(val) {
      const hours = parseFloat(val);
      const hInt = Math.floor(hours);
      const mInt = Math.round((hours - hInt) * 60);
      document.getElementById('time-display').innerText = `${String(hInt).padStart(2, '0')}:${String(mInt).padStart(2, '0')}`;

      // 簡易太陽軌道計算 (6:00=東 -> 12:00=南高角 -> 18:00=西)
      const rad = ((hours - 6) / 12) * Math.PI; 
      const sunX = -25 * Math.cos(rad);
      const sunY = 25 * Math.sin(rad);
      const sunZ = 10 * Math.sin(rad);

      const sunLight = document.getElementById('sun-light');
      if (sunLight) {
        sunLight.setAttribute('position', `${sunX} ${Math.max(sunY, 0.1)} ${sunZ}`);
      }

      // 高度・方位角の計算表示
      const alt = Math.max(0, Math.round((Math.sin(rad) * 75) * 10) / 10);
      const azm = Math.round((90 + (hours - 6) * 15) * 10) / 10;
      document.getElementById('solar-info').innerText = `太陽高度 ${alt}° / 方位 ${azm}°`;
    }

    // 初期起動時の処理
    window.addEventListener('load', () => {
      // APP_VERSION を画面最下部に反映
      const versionEl = document.getElementById('version-display');
      if (versionEl) {
        versionEl.innerText = APP_VERSION;
      }
      
      updateSunPosition(12);
    });
  </script>
</body>
</html>
