<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日陰シミュレーター / Complete Master v5.1</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif}#scene{width:100%;height:100%}.panel{position:fixed;z-index:10;left:10px;right:10px;background:rgba(15,15,15,.92);backdrop-filter:blur(12px);border:1px solid #333;border-radius:12px;box-shadow:0 5px 20px #0009}.top{top:10px;padding:9px 11px;font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.yellow{color:#ffd700;font-weight:700}.hud{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding:5px 8px;border:1px solid #064d2a;border-radius:7px;background:#0009;font-family:monospace}.hud strong{font-size:15px;color:#00ff66}.strip{color:#777;letter-spacing:5px}.strip b{color:#00ff66;text-shadow:0 0 7px #0f6}.bottom{bottom:10px;padding:9px 10px}.time{display:flex;align-items:center;gap:8px}.time output{font:bold 15px monospace;color:#00ff66;min-width:45px}.time input{flex:1;accent-color:#00ff66}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}.ctrl label{display:flex;justify-content:space-between;font-size:10px;color:#ccc}.ctrl output{color:#00ff66;font-weight:700}.ctrl input{width:100%;accent-color:#00ff66}.buttons{display:flex;gap:6px;margin-top:6px}.buttons button{flex:1}.btn{border:0;border-radius:7px;height:34px;color:#fff;font-weight:700;background:#287be5}.btn.purple{background:#9b59b6}.btn.red{background:#d94b3d}.btn.dark{background:#292929;border:1px solid #444;color:#ddd;font-size:10px}.btn.active{background:#e67e22;border-color:#f39c12}.mode{color:#00ff66;font-size:11px;margin-top:5px}
.dir-preset{display:flex;gap:4px;margin-top:5px}.dir-preset button{flex:1;background:#222;border:1px solid #444;color:#00ff66;font-weight:bold;border-radius:4px;height:24px;font-size:11px}
.dir-preset button:active{background:#00ff66;color:#000}

#dpad{position:fixed;bottom:180px;left:15px;z-index:20;display:none;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:4px;background:rgba(0,0,0,.4);padding:6px;border-radius:12px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1)}
#dpad button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;touch-action:manipulation;display:flex;align-items:center;justify-content:center;padding:0}
#dpad button:active{background:#00ff66}
#dpad button:active .arrow{background:#000}
.arrow{width:16px;height:16px;background:#fff;pointer-events:none}
.up-arrow{clip-path:polygon(50% 10%, 10% 90%, 90% 90%)}
.down-arrow{clip-path:polygon(10% 10%, 90% 10%, 50% 90%)}
.left-arrow{clip-path:polygon(90% 10%, 10% 50%, 90% 90%)}
.right-arrow{clip-path:polygon(10% 10%, 90% 50%, 10% 90%)}

#dpad .up{grid-column:2;grid-row:1}#dpad .left{grid-column:1;grid-row:2}#dpad .right{grid-column:3;grid-row:2}#dpad .down{grid-column:2;grid-row:3}
#selectedNotice{display:none;background:#e67e22;color:#fff;padding:4px 8px;border-radius:5px;font-size:10px;margin-top:4px;text-align:center;font-weight:bold}
.compass-btn{background:#e74c3c!important;color:#fff!important}
.compass-btn.active{background:#2ecc71!important}
</style>
</head>
<body>
<a-scene id="scene" embedded vr-mode-ui="enabled:false" shadow="type:pcfsoft" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
  <a-entity id="orbitCamera" camera position="0 12 18" orbit-controls="target:0 0 0;enableDamping:true;dampingFactor:.12;rotateSpeed:.55;zoomSpeed:1;panSpeed:.7;minDistance:.5;maxDistance:60;maxPolarAngle:1.56" active="true"></a-entity>
  <a-entity id="fpsRig" position="0 1.44 0">
    <a-entity id="fpsCamera" camera look-controls="pointerLockEnabled:false;touchEnabled:true" wasd-controls="acceleration:15" active="false"></a-entity>
  </a-entity>
  
  <a-entity id="world-root" rotation="0 0 0">
    <a-entity id="sun-light" light="type:directional;intensity:1.3;castShadow:true;shadowCameraTop:40;shadowCameraBottom:-40;shadowCameraLeft:-40;shadowCameraRight:40;shadowMapWidth:2048;shadowMapHeight:2048" position="10 20 10"></a-entity>
    <a-light type="ambient" intensity=".45"></a-light>
    <a-plane id="ground" class="clickable" position="0 0 0" rotation="-90 0 0" width="50" height="50" material="color:#e5e5e5;roughness:.85" shadow="receive:true"></a-plane>
    
    <a-entity id="markers">
      <a-ring position="0 .02 0" rotation="-90 0 0" radius-inner="9.9" radius-outer="10" material="color:#00ff66;opacity:0.6;transparent:true"></a-ring>
      <a-ring position="0 .02 0" rotation="-90 0 0" radius-inner="19.9" radius-outer="20" material="color:#00ff66;opacity:0.3;transparent:true"></a-ring>
      
      <!-- 基準方位（絶対座標: Nは-Z方向） -->
      <a-text value="N (北)" position="0 .03 -10.5" align="center" color="#e74c3c" scale="2.5 2.5 2.5" rotation="-90 0 0"></a-text>
      <a-text value="E (東)" position="10.5 .03 0" align="center" color="#333" scale="2 2 2" rotation="-90 0 -90"></a-text>
      <a-text value="S (南)" position="0 .03 10.5" align="center" color="#3498db" scale="2 2 2" rotation="-90 0 180"></a-text>
      <a-text value="W (西)" position="-10.5 .03 0" align="center" color="#333" scale="2 2 2" rotation="-90 0 90"></a-text>
    </a-entity>
    
    <a-entity id="walls"></a-entity>
    <a-entity id="humans"></a-entity>
    
    <a-box id="previewWall" material="color:#00ff66;transparent:true;opacity:0.5" depth="0.2" visible="false"></a-box>
    <a-entity id="previewHuman" visible="false">
      <a-sphere position="0 1.408 0" radius="0.16" material="color:#00ff66;transparent:true;opacity:0.5"></a-sphere>
      <a-box position="0 0.88 0" width="0.448" height="0.704" depth="0.256" material="color:#00ff66;transparent:true;opacity:0.5"></a-box>
      <a-cylinder position="-0.288 0.88 0" radius="0.056" height="0.64" material="color:#00ff66;transparent:true;opacity:0.5"></a-cylinder>
      <a-cylinder position="0.288 0.88 0" radius="0.056" height="0.64" material="color:#00ff66;transparent:true;opacity:0.5"></a-cylinder>
      <a-cylinder position="-0.128 0.288 0" radius="0.072" height="0.576" material="color:#00ff66;transparent:true;opacity:0.5"></a-cylinder>
      <a-cylinder position="0.128 0.288 0" radius="0.072" height="0.576" material="color:#00ff66;transparent:true;opacity:0.5"></a-cylinder>
    </a-entity>
  </a-entity>
</a-scene>

<div id="dpad" aria-hidden="true">
  <button class="up" id="btnFwd"><div class="arrow up-arrow"></div></button>
  <button class="left" id="btnLeft"><div class="arrow left-arrow"></div></button>
  <button class="right" id="btnRight"><div class="arrow right-arrow"></div></button>
  <button class="down" id="btnBwd"><div class="arrow down-arrow"></div></button>
</div>

<div class="panel top">
  <div class="row"><span id="sunInfo" class="yellow">太陽: --</span></div>
  <div class="hud"><span>向き <strong id="headingText">N (0°)</strong></span><span class="strip" id="strip">NW N NE E SE S SW W</span></div>
  <div class="dir-preset">
    <button onclick="setPresetDirection('N')">北 (N)</button>
    <button onclick="setPresetDirection('E')">東 (E)</button>
    <button onclick="setPresetDirection('S')">南 (S)</button>
    <button onclick="setPresetDirection('W')">西 (W)</button>
    <button id="compassToggleBtn" class="compass-btn" onclick="toggleCompass()">🧭 磁気連動 OFF</button>
  </div>
  <div id="mode" class="mode">手動モード / 「🧭 磁気連動」でスマホの向きと動同期</div>
  <div id="selectedNotice">選択中: スライダーで変更 / 地面タップで解除</div>
</div>

<div class="panel bottom">
  <div id="timeSection" class="time"><span>時刻</span><output id="timeOut">12:00</output><input id="time" type="range" min="300" max="1140" value="720"></div>
  <div id="settingSection" class="settings-grid" style="display:none;">
    <div class="ctrl"><label>壁高 <output id="whOut">3.0m</output></label><input id="wh" type="range" min="1" max="15" step=".5" value="3"></div>
    <div class="ctrl"><label>壁幅 <output id="wwOut">4.0m</output></label><input id="ww" type="range" min=".5" max="20" step=".5" value="4"></div>
    <div class="ctrl"><label>壁回転 <output id="wrOut">0°</output></label><input id="wr" type="range" min="0" max="359" value="0"></div>
    <div class="ctrl"><label>身長 <output id="hhOut">160cm</output></label><input id="hh" type="range" min="120" max="200" value="160"></div>
  </div>
  <div class="buttons">
    <button id="settingsBtn" class="btn dark">⚙ 設定</button>
    <button id="fpsBtn" class="btn purple">🎮 FPS一人称</button>
    <button id="wallBtn" class="btn">壁を追加</button>
    <button id="humanBtn" class="btn purple">人を追加</button>
    <button id="deleteBtn" class="btn red">選択削除</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id), wallsEl=$('walls'), humansEl=$('humans'), light=$('sun-light');
const previewWall=$('previewWall'), previewHuman=$('previewHuman'), sceneEl=$('scene'), worldRoot=$('world-root');
const orbitCam=$('orbitCamera');
let wallObjects=[], humanObjects=[], isFps=false, moveState={fwd:0,bwd:0,left:0,right:0}, selectedEl=null;
let pendingType = null;
let isCompassActive = false;
const lat=34.27, lon=135.38;

function norm(v){return (v%360+360)%360}
function dir(v){return ['N','NE','E','SE','S','SW','W','NW'][Math.floor((norm(v)+22.5)/45)%8]}
function updateHUD(v){
  v=norm(v); $('headingText').textContent=`${dir(v)} (${Math.round(v)}°)`;
  $('strip').innerHTML=['N','NE','E','SE','S','SW','W','NW'].map(n=>n===dir(v)?`<b>${n}</b>`:n).join(' ');
}

// 方角プリセット操作：ワールドは0°固定とし、カメラ位置を移動して指定方角を画面奥に表示
window.setPresetDirection = function(targetDir) {
  if (isCompassActive) stopCompass(); // プリセット選択時は磁気連動をオフ

  // 1. ワールド回転を0°に完全固定（日影・太陽位置の絶対座標を維持）
  worldRoot.setAttribute('rotation', '0 0 0');

  // 2. 指定方角が「画面奥（中央）」に見える観測地点へカメラ座標を設定
  let camX = 0, camZ = 18, headingDeg = 0;
  switch(targetDir) {
    case 'N': camX = 0;   camZ = 18;  headingDeg = 0;   break; // 南(Z=18)から北(-Z)を見る
    case 'E': camX = -18; camZ = 0;   headingDeg = 90;  break; // 西(X=-18)から東(+X)を見る
    case 'S': camX = 0;   camZ = -18; headingDeg = 180; break; // 北(Z=-18)から南(+Z)を見る
    case 'W': camX = 18;  camZ = 0;   headingDeg = 270; break; // 東(X=18)から西(-X)を見る
  }

  // 3. OrbitControls の内部座標とターゲットを直接同期更新
  const orbitComp = orbitCam.components['orbit-controls'];
  if (orbitComp && orbitComp.controls) {
    orbitComp.controls.object.position.set(camX, 12, camZ);
    orbitComp.controls.target.set(0, 0, 0);
    orbitComp.controls.update(); // 視点情報の同期を即座に適用
  } else {
    orbitCam.setAttribute('position', `${camX} 12 ${camZ}`);
  }

  updateHUD(headingDeg);
};



function toggleCompass() {
  if (isCompassActive) {
    stopCompass();
  } else {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(response => {
          if (response === 'granted') startCompass();
          else alert('磁気センサーの利用が拒否されました。');
        })
        .catch(console.error);
    } else {
      startCompass();
    }
  }
}

function startCompass() {
  if ('ondeviceorientationabsolute' in window) {
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
  } else {
    window.addEventListener('deviceorientation', handleOrientation, true);
  }
  isCompassActive = true;
  const btn = $('compassToggleBtn');
  btn.textContent = '🧭 磁気連動 ON';
  btn.classList.add('active');
  $('mode').textContent = '屋外モード: スマホの方向に合わせて3D北軸が同期中';
}

function stopCompass() {
  window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
  window.removeEventListener('deviceorientation', handleOrientation, true);
  isCompassActive = false;
  const btn = $('compassToggleBtn');
  btn.textContent = '🧭 磁気連動 OFF';
  btn.classList.remove('active');
  $('mode').textContent = '手動モード / 「🧭 磁気連動」でスマホの向きと動同期';
}

function handleOrientation(e) {
  if (!isCompassActive) return;
  let heading = null;

  if (e.webkitCompassHeading !== undefined) {
    heading = e.webkitCompassHeading;
  } else if (e.alpha !== null) {
    heading = 360 - e.alpha;
  }

  if (heading !== null) {
    // 磁気センサー連動時はワールドを逆回転させて自分の向きと一致させる
    worldRoot.setAttribute('rotation', `0 ${-heading} 0`);
    updateHUD(heading);
  }
}

function updatePreviewAndSelected() {
  const w = +$('ww').value, h = +$('wh').value, r = +$('wr').value, hh = +$('hh').value / 100;
  
  previewWall.setAttribute('width', w);
  previewWall.setAttribute('height', h);
  previewWall.setAttribute('rotation', `0 ${r} 0`);
  previewHuman.setAttribute('scale', `${hh/1.6} ${hh/1.6} ${hh/1.6}`);

  if (selectedEl) {
    if (selectedEl.tagName.toLowerCase() === 'a-box') {
      selectedEl.setAttribute('width', w);
      selectedEl.setAttribute('height', h);
      selectedEl.setAttribute('rotation', `0 ${r} 0`);
      const pos = selectedEl.getAttribute('position');
      selectedEl.setAttribute('position', `${pos.x} ${h/2} ${pos.z}`);
      const obj = wallObjects.find(o => o.el === selectedEl);
      if(obj) obj.radius = Math.max(w, 0.5) / 2;
    } else if (selectedEl.dataset.type === 'human') {
      selectedEl.setAttribute('scale', `${hh/1.6} ${hh/1.6} ${hh/1.6}`);
      const obj = humanObjects.find(o => o.el === selectedEl);
      if(obj) obj.h = hh;
    }
  }
}

$('wh').oninput = e => { $('whOut').textContent = e.target.value + 'm'; updatePreviewAndSelected(); };
$('ww').oninput = e => { $('wwOut').textContent = e.target.value + 'm'; updatePreviewAndSelected(); };
$('wr').oninput = e => { $('wrOut').textContent = e.target.value + '°'; updatePreviewAndSelected(); };
$('hh').oninput = e => { $('hhOut').textContent = e.target.value + 'cm'; updatePreviewAndSelected(); };

$('wallBtn').onclick = () => {
  if (isFps) {
    const pos = getFpsSpawnPos(); createWall(pos.x, pos.z);
  } else {
    pendingType = 'wall';
    hidePreviews();
    $('mode').textContent = '画面をなぞってプレビューを確認し、タップで配置';
  }
};

$('humanBtn').onclick = () => {
  if (isFps) {
    const pos = getFpsSpawnPos(); createHuman(pos.x, pos.z);
  } else {
    pendingType = 'human';
    hidePreviews();
    $('mode').textContent = '画面をなぞってプレビューを確認し、タップで配置';
  }
};

function getFpsSpawnPos() {
  const fpsRig = $('fpsRig'), fpsCam = $('fpsCamera');
  const rigPos = fpsRig.getAttribute('position');
  const camRot = fpsCam.getAttribute('rotation') || { y: 0 };
  const yaw = camRot.y * Math.PI / 180;
  return { x: rigPos.x - Math.sin(yaw) * 2.5, z: rigPos.z - Math.cos(yaw) * 2.5 };
}

function hidePreviews() {
  previewWall.setAttribute('visible', false);
  previewHuman.setAttribute('visible', false);
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function handlePointerMove(e) {
  if (!pendingType || isFps) return;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  
  const camera = sceneEl.camera;
  if (!camera) return;

  const rect = sceneEl.getBoundingClientRect();
  mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const groundObj = $('ground').object3D;
  const intersects = raycaster.intersectObject(groundObj, true);

  if (intersects.length > 0) {
    const pt = intersects[0].point;
    updatePreviewAndSelected();
    if (pendingType === 'wall') {
      const h = +$('wh').value;
      previewWall.setAttribute('position', `${pt.x} ${h/2} ${pt.z}`);
      previewWall.setAttribute('visible', true);
      previewHuman.setAttribute('visible', false);
    } else if (pendingType === 'human') {
      previewHuman.setAttribute('position', `${pt.x} 0 ${pt.z}`);
      previewHuman.setAttribute('visible', true);
      previewWall.setAttribute('visible', false);
    }
  }
}

window.addEventListener('pointermove', handlePointerMove);
window.addEventListener('touchmove', handlePointerMove);
window.addEventListener('pointerdown', handlePointerMove);
window.addEventListener('touchstart', handlePointerMove);

$('ground').addEventListener('click', (e) => {
  if (selectedEl) { deselectObject(); return; }
  if (!pendingType || isFps) return;

  const pt = e.detail.intersection ? e.detail.intersection.point : { x: 0, z: 0 };
  if (pendingType === 'wall') createWall(pt.x, pt.z);
  else if (pendingType === 'human') createHuman(pt.x, pt.z);

  pendingType = null;
  hidePreviews();
  $('mode').textContent = '手動モード / 「🧭 磁気連動」でスマホの向きと動同期';
});

function createWall(x, z) {
  const w = +$('ww').value, h = +$('wh').value, r = +$('wr').value;
  const wall = document.createElement('a-box');
  wall.classList.add('clickable');
  wall.dataset.originalColor = '#7f8c8d';
  wall.setAttribute('position', `${x} ${h/2} ${z}`);
  wall.setAttribute('width', w); wall.setAttribute('height', h); wall.setAttribute('depth', 0.2);
  wall.setAttribute('rotation', `0 ${r} 0`);
  wall.setAttribute('material', 'color:#7f8c8d;roughness:0.6');
  wall.setAttribute('shadow', 'cast:true;receive:true');
  wall.addEventListener('click', (evt) => { evt.stopPropagation(); selectObject(wall); });
  wallsEl.appendChild(wall);
  wallObjects.push({ el: wall, x: x, z: z, radius: Math.max(w, 0.5) / 2 });
}

function createHuman(x, z) {
  const hh = +$('hh').value / 100;
  const human = document.createElement('a-entity');
  human.classList.add('clickable');
  human.dataset.type = 'human';
  human.setAttribute('position', `${x} 0 ${z}`);
  human.setAttribute('scale', `${hh/1.6} ${hh/1.6} ${hh/1.6}`);

  const baseH = 1.6;
  const head = document.createElement('a-sphere');
  head.dataset.originalColor = '#f1c40f';
  head.setAttribute('position', `0 ${baseH * 0.88} 0`);
  head.setAttribute('radius', baseH * 0.1);
  head.setAttribute('material', 'color:#f1c40f');
  head.setAttribute('shadow', 'cast:true');
  
  const body = document.createElement('a-box');
  body.dataset.originalColor = '#e74c3c';
  body.setAttribute('position', `0 ${baseH * 0.55} 0`);
  body.setAttribute('width', baseH * 0.28);
  body.setAttribute('height', baseH * 0.44);
  body.setAttribute('depth', baseH * 0.16);
  body.setAttribute('material', 'color:#e74c3c');
  body.setAttribute('shadow', 'cast:true');

  const armL = document.createElement('a-cylinder');
  armL.dataset.originalColor = '#e74c3c';
  armL.setAttribute('position', `${-baseH * 0.18} ${baseH * 0.55} 0`);
  armL.setAttribute('radius', baseH * 0.035);
  armL.setAttribute('height', baseH * 0.4);
  armL.setAttribute('material', 'color:#e74c3c');
  armL.setAttribute('shadow', 'cast:true');

  const armR = document.createElement('a-cylinder');
  armR.dataset.originalColor = '#e74c3c';
  armR.setAttribute('position', `${baseH * 0.18} ${baseH * 0.55} 0`);
  armR.setAttribute('radius', baseH * 0.035);
  armR.setAttribute('height', baseH * 0.4);
  armR.setAttribute('material', 'color:#e74c3c');
  armR.setAttribute('shadow', 'cast:true');

  const legL = document.createElement('a-cylinder');
  legL.dataset.originalColor = '#2980b9';
  legL.setAttribute('position', `${-baseH * 0.08} ${baseH * 0.18} 0`);
  legL.setAttribute('radius', baseH * 0.045);
  legL.setAttribute('height', baseH * 0.36);
  legL.setAttribute('material', 'color:#2980b9');
  legL.setAttribute('shadow', 'cast:true');

  const legR = document.createElement('a-cylinder');
  legR.dataset.originalColor = '#2980b9';
  legR.setAttribute('position', `${baseH * 0.08} ${baseH * 0.18} 0`);
  legR.setAttribute('radius', baseH * 0.045);
  legR.setAttribute('height', baseH * 0.36);
  legR.setAttribute('material', 'color:#2980b9');
  legR.setAttribute('shadow', 'cast:true');

  human.appendChild(head); human.appendChild(body);
  human.appendChild(armL); human.appendChild(armR);
  human.appendChild(legL); human.appendChild(legR);
  
  human.addEventListener('click', (evt) => { evt.stopPropagation(); selectObject(human); });

  humansEl.appendChild(human);
  humanObjects.push({ el: human, h: hh, x: x, z: z });
}

function selectObject(el) {
  if (selectedEl) deselectObject();
  selectedEl = el;
  
  const highlightColor = '#ff9800';
  if (el.tagName.toLowerCase() === 'a-box') {
    el.setAttribute('material', 'color', highlightColor);
  } else if (el.dataset.type === 'human') {
    el.querySelectorAll('a-sphere, a-box, a-cylinder').forEach(child => {
      child.setAttribute('material', 'color', highlightColor);
    });
  }

  $('settingSection').style.display = 'grid';
  $('timeSection').style.display = 'none';
  $('settingsBtn').textContent = '⏳ 時刻に戻る';

  if (el.tagName.toLowerCase() === 'a-box') {
    const w = el.getAttribute('width'), h = el.getAttribute('height'), rot = el.getAttribute('rotation');
    $('ww').value = w; $('wwOut').textContent = w + 'm';
    $('wh').value = h; $('whOut').textContent = h + 'm';
    $('wr').value = rot.y; $('wrOut').textContent = rot.y + '°';
  } else if (el.dataset.type === 'human') {
    const scale = el.getAttribute('scale');
    const hhVal = Math.round(scale.x * 160);
    $('hh').value = hhVal; $('hhOut').textContent = hhVal + 'cm';
  }

  $('selectedNotice').style.display = 'block';
}

function deselectObject() {
  if (!selectedEl) return;

  if (selectedEl.tagName.toLowerCase() === 'a-box') {
    selectedEl.setAttribute('material', 'color', selectedEl.dataset.originalColor || '#7f8c8d');
  } else if (selectedEl.dataset.type === 'human') {
    selectedEl.querySelectorAll('a-sphere, a-box, a-cylinder').forEach(child => {
      if (child.dataset.originalColor) {
        child.setAttribute('material', 'color', child.dataset.originalColor);
      }
    });
  }

  selectedEl = null;
  $('selectedNotice').style.display = 'none';
}

$('deleteBtn').onclick = () => {
  if (selectedEl) {
    selectedEl.remove();
    wallObjects = wallObjects.filter(o => o.el !== selectedEl);
    humanObjects = humanObjects.filter(o => o.el !== selectedEl);
    deselectObject();
  } else {
    if(confirm('全削除しますか？')){
      wallsEl.innerHTML = ''; humansEl.innerHTML = '';
      wallObjects = []; humanObjects = [];
    }
  }
};

$('fpsBtn').onclick = () => {
  isFps = !isFps;
  pendingType = null;
  hidePreviews();
  const fpsCam = $('fpsCamera'), fpsRig = $('fpsRig'), dpad = $('dpad');
  if(isFps){
    if(humanObjects.length > 0){
      const lastH = humanObjects[humanObjects.length - 1];
      fpsRig.setAttribute('position', `${lastH.x} ${lastH.h * 0.9} ${lastH.z}`);
    } else {
      fpsRig.setAttribute('position', '0 1.44 0');
    }
    orbitCam.setAttribute('camera', 'active', false);
    fpsCam.setAttribute('camera', 'active', true);
    dpad.style.display = 'grid';
    $('fpsBtn').textContent = '🚁 俯瞰視点';
    $('fpsBtn').classList.add('active');
    $('mode').textContent = 'FPSモード: 視線の先2.5mに生成されます';
  } else {
    fpsCam.setAttribute('camera', 'active', false);
    orbitCam.setAttribute('camera', 'active', true);
    dpad.style.display = 'none';
    $('fpsBtn').textContent = '🎮 FPS一人称';
    $('fpsBtn').classList.remove('active');
    $('mode').textContent = '手動モード / 「🧭 磁気連動」でスマホの向きと動同期';
  }
};

function bindTouch(id, key){
  const el = $(id);
  const start = (e) => { e.preventDefault(); moveState[key] = 1; };
  const end = (e) => { e.preventDefault(); moveState[key] = 0; };
  el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
  el.addEventListener('mousedown', start); el.addEventListener('mouseup', end); el.addEventListener('mouseleave', end);
}
bindTouch('btnFwd', 'fwd'); bindTouch('btnBwd', 'bwd'); bindTouch('btnLeft', 'left'); bindTouch('btnRight', 'right');

function stepFPS(){
  if(isFps){
    const fpsCam = $('fpsCamera'), fpsRig = $('fpsRig');
    const rigPos = fpsRig.getAttribute('position'), camRot = fpsCam.getAttribute('rotation');

    if(moveState.fwd || moveState.bwd || moveState.left || moveState.right){
      const speed = 0.12, yaw = (camRot ? camRot.y : 0) * Math.PI / 180;
      let dx = 0, dz = 0;
      if(moveState.fwd){ dx -= Math.sin(yaw)*speed; dz -= Math.cos(yaw)*speed; }
      if(moveState.bwd){ dx += Math.sin(yaw)*speed; dz += Math.cos(yaw)*speed; }
      if(moveState.left){ dx -= Math.cos(yaw)*speed; dz += Math.sin(yaw)*speed; }
      if(moveState.right){ dx += Math.cos(yaw)*speed; dz -= Math.sin(yaw)*speed; }

      let nextX = Math.max(-24, Math.min(24, rigPos.x + dx));
      let nextZ = Math.max(-24, Math.min(24, rigPos.z + dz));

      for (let wall of wallObjects) {
        const dist = Math.hypot(nextX - wall.x, nextZ - wall.z);
        if (dist < wall.radius + 0.4) { nextX = rigPos.x; nextZ = rigPos.z; break; }
      }
      fpsRig.setAttribute('position', `${nextX} ${rigPos.y} ${nextZ}`);
    }
  }
  requestAnimationFrame(stepFPS);
}
stepFPS();

document.querySelectorAll('.panel, #dpad').forEach(p => {
  ['pointerdown','click','touchstart'].forEach(e => p.addEventListener(e, ev => ev.stopPropagation()));
});

$('settingsBtn').onclick = () => {
  const isS = $('settingSection').style.display === 'none';
  $('settingSection').style.display = isS ? 'grid' : 'none';
  $('timeSection').style.display = isS ? 'none' : 'flex';
  $('settingsBtn').textContent = isS ? '⏳ 時刻に戻る' : '⚙ 設定';
};

$('time').oninput = updateSimulation;
function updateSimulation(){
  const minutes = +$('time').value, h = Math.floor(minutes/60), m = minutes%60;
  $('timeOut').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const d = new Date(Date.UTC(2026, 7, 6, h, m, 0) - (9 * 60 * 60 * 1000));
  const s = SunCalc.getPosition(d, lat, lon), az = s.azimuth + Math.PI, alt = s.altitude, dist = 40;
  light.setAttribute('position', `${dist*Math.cos(alt)*Math.sin(az)} ${dist*Math.sin(alt)} ${-dist*Math.cos(alt)*Math.cos(az)}`);
  $('sunInfo').textContent = `太陽高度 ${(alt*180/Math.PI).toFixed(1)}° / 方位 ${norm(az*180/Math.PI).toFixed(1)}°`;
}

// 初期実行：デフォルトで「北 (N)」視点にセット
setTimeout(() => setPresetDirection('N'), 100);
updateSimulation();
</script>
