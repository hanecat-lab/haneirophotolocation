<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D日陰シミュレーター - ハイグレード版</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; }
        
        #main-scene { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        .top-bar {
            position: fixed; top: 10px; left: 10px; right: 10px;
            background: rgba(15,15,15,0.9); border-radius: 12px;
            font-size: 11px; z-index: 100; display: flex; flex-direction: column; gap: 4px; padding: 8px 14px;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .top-bar-row { display: flex; justify-content: space-between; align-items: center; }
        .info-text { color: #FFD700; font-weight: bold; font-size: 11px; }
        .status-mode { font-size: 11px; color: #00FF66; font-weight: bold; }
        .compass-btn {
            background: #222; color: #00FF66; border: 1px solid #00FF66; border-radius: 6px; 
            font-size: 10px; font-weight: bold; cursor: pointer; padding: 4px 10px;
        }

        .bottom-ui-wrapper {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            padding: 0 10px 12px 10px; pointer-events: none;
        }

        .drawer-panel {
            pointer-events: auto; 
            width: 100%; background: rgba(20, 20, 20, 0.96); border-radius: 14px;
            padding: 12px 16px; box-shadow: 0 -4px 25px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.15); max-height: 38vh; overflow-y: auto;
            backdrop-filter: blur(10px);
            transition: max-height 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.3s ease;
        }
        .drawer-panel.collapsed { max-height: 0; opacity: 0; padding: 0 16px; overflow: hidden; border: none; }

        .drawer-toggle {
            pointer-events: auto;
            background: rgba(20,20,20,0.9); color: #fff; border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 18px; font-size: 10px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(6px);
        }

        .bottom-controls, .confirm-ui {
            pointer-events: auto; width: 100%;
            display: flex; flex-direction: column; gap: 8px;
            background: rgba(15, 15, 15, 0.96); padding: 10px 12px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.8);
        }

        .confirm-ui { display: none; border-color: #00FF66; flex-direction: row; box-shadow: 0 6px 20px rgba(0,255,102,0.25); }
        
        .time-control-box { display: flex; flex-direction: column; gap: 4px; }
        .time-header { display: flex; justify-content: space-between; align-items: center; }
        .time-title { font-size: 10px; color: #aaa; font-weight: bold; }
        .time-display { color: #00FF66; font-size: 16px; font-weight: bold; font-family: monospace; }
        
        .time-slider-container { display: flex; align-items: center; gap: 8px; }
        .time-slider-container span { font-size: 10px; color: #888; }
        input[type="range"].time-slider { flex: 1; height: 24px; accent-color: #00FF66; cursor: pointer; }

        .btn-group { display: flex; gap: 6px; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
        .control-group { margin-bottom: 4px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; margin-bottom: 3px; }
        .val-display { color: #00FF66; font-weight: bold; }
        
        input[type="range"] { width: 100%; height: 18px; accent-color: #00FF66; }
        
        button { cursor: pointer; display: flex; align-items: center; justify-content: center; border: none; border-radius: 8px; transition: all 0.2s; }
        button.action-btn { flex: 2; background: #007AFF; color: white; font-size: 11px; font-weight: bold; height: 38px; }
        button.purple-btn { flex: 2; background: #9b59b6; color: white; font-size: 11px; font-weight: bold; height: 38px; }
        button.danger-btn { flex: 1; background: #e74c3c; color: white; font-size: 11px; font-weight: bold; height: 38px; }
        button.dark-btn { background: #2a2a2a; color: #ddd; font-size: 10px; height: 28px; border: 1px solid rgba(255,255,255,0.05); }

        .confirm-ui .btn-ok { flex: 2; background: #00FF66; color: #000; height: 44px; font-size: 14px; font-weight: bold; }
        .confirm-ui .btn-cancel { flex: 1; background: #e74c3c; color: white; height: 44px; font-size: 12px; font-weight: bold; }

        .camera-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <a-scene id="main-scene" embedded vr-mode-ui="enabled: false" shadow="type: pcfsoft">
        
        <a-entity id="camera" camera
                  position="0 1.6 5"
                  orbit-controls="
                      target: 0 1.5 0;
                      enableDamping: true;
                      dampingFactor: 0.12;
                      rotateSpeed: 0.8;
                      zoomSpeed: 1.2;
                      panSpeed: 0.8;
                      minDistance: 0.3;
                      maxDistance: 60;
                      maxPolarAngle: 1.56;
                  ">
        </a-entity>

        <a-entity id="sun-light" light="type: directional; intensity: 1.3; castShadow: true; shadowCameraTop: 25; shadowCameraBottom: -25; shadowCameraLeft: -25; shadowCameraRight: 25; shadowMapWidth: 2048; shadowMapHeight: 2048;" position="10 20 10"></a-entity>
        <a-light type="ambient" intensity="0.45"></a-light>

        <a-plane id="ground" position="0 0 0" rotation="-90 0 0" width="50" height="50" 
                 material="color: #e5e5e5; roughness: 0.85;" shadow="receive: true"></a-plane>

        <a-entity id="compass-indicators">
            <a-text value="N" position="0 0.02 -20" align="center" color="#e74c3c" scale="2.5 2.5 2.5" rotation="-90 0 0"></a-text>
            <a-text value="S" position="0 0.02 20" align="center" color="#3498db" scale="2.5 2.5 2.5" rotation="-90 0 180"></a-text>
            <a-text value="E" position="20 0.02 0" align="center" color="#333" scale="2.5 2.5 2.5" rotation="-90 0 -90"></a-text>
            <a-text value="W" position="-20 0.02 0" align="center" color="#333" scale="2.5 2.5 2.5" rotation="-90 0 90"></a-text>
        </a-entity>

        <a-entity id="guide-preview" position="0 0 0" visible="false">
            <a-box id="guide-box" material="color: #00FF66; opacity: 0.65; transparent: true;"></a-box>
            <a-ring rotation="-90 0 0" radius-inner="0.3" radius-outer="0.5" material="color: #00FF66; opacity: 0.85; transparent: true;"></a-ring>
        </a-entity>

        <a-entity id="walls-container"></a-entity>
        <a-entity id="humans-container"></a-entity>
    </a-scene>

    <div class="top-bar">
        <div class="top-bar-row">
            <div id="sun-info" class="info-text">高度: -- / 方位: --</div>
            <button id="compass-btn" class="compass-btn">🧭 方位同期</button>
        </div>
        <div id="status-mode" class="status-mode">通常状態</div>
    </div>

    <div class="bottom-ui-wrapper">
        <div id="drawer-panel" class="drawer-panel collapsed">
            <div id="panel-normal-content">
                <div class="control-group">
                    <label>視点切り替え</label>
                    <div class="camera-presets">
                        <button class="dark-btn" onclick="setCameraPreset('eye')">目線(1.6m)</button>
                        <button class="dark-btn" onclick="setCameraPreset('diagonal')">斜め</button>
                        <button class="dark-btn" onclick="setCameraPreset('front')">正面</button>
                        <button class="dark-btn" onclick="setCameraPreset('top')">真上</button>
                    </div>
                </div>
                <div class="grid-2col">
                    <div class="control-group">
                        <label>壁の高さ <span class="val-display" id="val-wall-height">3.0m</span></label>
                        <input type="range" id="wall-height" min="1" max="15" value="3" step="0.5">
                    </div>
                    <div class="control-group">
                        <label>壁の幅 <span class="val-display" id="val-wall-width">4.0m</span></label>
                        <input type="range" id="wall-width" min="0.5" max="20" value="4" step="0.5">
                    </div>
                </div>
                <div class="grid-2col">
                    <div class="control-group">
                        <label>壁の回転 <span class="val-display" id="val-wall-rot">0°</span></label>
                        <input type="range" id="wall-rot" min="0" max="360" value="0" step="1">
                    </div>
                    <div class="control-group">
                        <label>壁の厚み <span class="val-display" id="val-wall-depth">0.2m</span></label>
                        <input type="range" id="wall-depth" min="0.1" max="2" value="0.2" step="0.1">
                    </div>
                </div>
                <div class="control-group">
                    <label>箱型棒人間の身長 <span id="human-h-val" class="val-display">160cm</span></label>
                    <input id="human-height" type="range" min="120" max="200" step="1" value="160">
                </div>
            </div>

            <div id="panel-placing-content" style="display:none;">
                <div class="grid-2col">
                    <div class="control-group">
                        <label>配置 X軸 <span class="val-display" id="val-pos-x">0.0m</span></label>
                        <input type="range" id="pos-x" min="-15" max="15" value="0" step="0.5">
                    </div>
                    <div class="control-group">
                        <label>配置 Z軸 <span class="val-display" id="val-pos-z">0.0m</span></label>
                        <input type="range" id="pos-z" min="-15" max="15" value="0" step="0.5">
                    </div>
                </div>
                <div id="placing-wall-extra" class="grid-2col">
                    <div class="control-group">
                        <label>壁の回転 <span class="val-display" id="val-wall-rot-p">0°</span></label>
                        <input type="range" id="wall-rot-p" min="0" max="360" value="0" step="1">
                    </div>
                </div>
            </div>
        </div>

        <button id="drawer-toggle" class="drawer-toggle">⚙️ 設定パネルを開く</button>

        <div id="bottom-controls" class="bottom-controls">
            <div class="time-control-box">
                <div class="time-header">
                    <span class="time-title">時刻指定</span>
                    <span id="time-text" class="time-display">12:00</span>
                </div>
                <div class="time-slider-container">
                    <span>05:00</span>
                    <input type="range" id="time-slider" class="time-slider" min="300" max="1140" value="720" step="1">
                    <span>19:00</span>
                </div>
            </div>

            <div class="btn-group">
                <button id="place-wall-btn" class="action-btn">壁を配置</button>
                <button id="place-human-btn" class="purple-btn">人を配置 (<span id="btn-human-val">160cm</span>)</button>
                <button id="clear-walls-btn" class="danger-btn">全削除</button>
            </div>
        </div>

        <div id="confirm-ui" class="confirm-ui">
            <button id="confirm-place-btn" class="btn-ok">✅ ここに決定</button>
            <button id="cancel-place-btn" class="btn-cancel">キャンセル</button>
        </div>
    </div>

    <script>
        let isPlacing = false;
        let isPlacingHuman = false;
        
        let walls = [];
        let humans = [];
        const humanSetting = { height: 1.6 };
        let latitude = 34.27, longitude = 135.38;
        let smoothedHeading = 0;

        const cameraEl = document.getElementById('camera');
        const wallsContainer = document.getElementById('walls-container');
        const humansContainer = document.getElementById('humans-container');
        const sunLight = document.getElementById('sun-light');
        const timeSlider = document.getElementById('time-slider');
        const timeText = document.getElementById('time-text');
        
        const drawerPanel = document.getElementById('drawer-panel');
        const drawerToggle = document.getElementById('drawer-toggle');
        const bottomControls = document.getElementById('bottom-controls');
        const confirmUi = document.getElementById('confirm-ui');
        const statusModeEl = document.getElementById('status-mode');
        
        const panelNormalContent = document.getElementById('panel-normal-content');
        const panelPlacingContent = document.getElementById('panel-placing-content');
        const placingWallExtra = document.getElementById('placing-wall-extra');
        
        const guidePreview = document.getElementById('guide-preview');
        const guideBox = document.getElementById('guide-box');

        window.addEventListener('DOMContentLoaded', () => {
            setCameraPreset('eye');
        });

        drawerToggle.addEventListener('click', () => {
            const isCollapsed = drawerPanel.classList.toggle('collapsed');
            drawerToggle.textContent = isCollapsed ? '⚙️ 設定パネルを開く' : '✖ 閉じる';
        });

        function updateUIState() {
            if (isPlacing || isPlacingHuman) {
                bottomControls.style.display = 'none';
                confirmUi.style.display = 'flex';
                guidePreview.setAttribute('visible', 'true');
                
                panelNormalContent.style.display = 'none';
                panelPlacingContent.style.display = 'block';
                placingWallExtra.style.display = isPlacing ? 'grid' : 'none';

                drawerPanel.classList.remove('collapsed');
                drawerToggle.textContent = '✖ 閉じる（調整パネル）';
                
                statusModeEl.textContent = isPlacing ? '📍 壁の配置調整中' : '📍 人の配置調整中';
                updatePreviewState();
            } else {
                bottomControls.style.display = 'flex';
                confirmUi.style.display = 'none';
                guidePreview.setAttribute('visible', 'false');
                
                panelNormalContent.style.display = 'block';
                panelPlacingContent.style.display = 'none';
                
                statusModeEl.textContent = '通常状態（カメラ・時刻自由操作）';
                drawerPanel.classList.add('collapsed');
                drawerToggle.textContent = '⚙️ 設定パネルを開く';
            }
        }

        function updatePreviewState() {
            const px = parseFloat(document.getElementById('pos-x').value);
            const pz = parseFloat(document.getElementById('pos-z').value);
            guidePreview.setAttribute('position', `${px} 0 ${pz}`);

            if (isPlacing) {
                const inputs = getInputs();
                guideBox.setAttribute('position', `0 ${inputs.height / 2} 0`);
                guideBox.setAttribute('width', inputs.width);
                guideBox.setAttribute('height', inputs.height);
                guideBox.setAttribute('depth', inputs.depth);
                guideBox.setAttribute('rotation', `0 ${inputs.rot} 0`);
            } else if (isPlacingHuman) {
                const h = humanSetting.height;
                guideBox.setAttribute('position', `0 ${h / 2} 0`);
                guideBox.setAttribute('width', '0.4');
                guideBox.setAttribute('height', h);
                guideBox.setAttribute('depth', '0.2');
                guideBox.setAttribute('rotation', '0 0 0');
            }
        }

        document.getElementById('place-wall-btn').addEventListener('click', () => {
            isPlacing = true; isPlacingHuman = false; updateUIState();
        });

        document.getElementById('place-human-btn').addEventListener('click', () => {
            isPlacingHuman = true; isPlacing = false; updateUIState();
        });

        document.getElementById('cancel-place-btn').addEventListener('click', () => {
            isPlacing = false; isPlacingHuman = false; updateUIState();
        });

        document.getElementById('confirm-place-btn').addEventListener('click', () => {
            const pos = guidePreview.getAttribute('position');

            if (isPlacing) {
                walls.push({ x: pos.x, z: pos.z, ...getInputs() });
                updateWallsDOM();
            } else if (isPlacingHuman) {
                humans.push({ x: pos.x, z: pos.z, height: humanSetting.height });
                updateHumansDOM();
            }
            isPlacing = false; isPlacingHuman = false;
            updateUIState();
        });

        document.getElementById('clear-walls-btn').addEventListener('click', () => {
            walls = []; humans = [];
            isPlacing = false; isPlacingHuman = false;
            setCameraPreset('eye');
            updateUIState(); updateWallsDOM(); updateHumansDOM();
        });

        function getInputs() {
            const rotVal = isPlacing ? parseFloat(document.getElementById('wall-rot-p').value) : parseFloat(document.getElementById('wall-rot').value);
            return {
                height: parseFloat(document.getElementById('wall-height').value),
                width: parseFloat(document.getElementById('wall-width').value),
                depth: parseFloat(document.getElementById('wall-depth').value),
                rot: rotVal
            };
        }

        document.getElementById('wall-rot').addEventListener('input', (e) => {
            document.getElementById('val-wall-rot').textContent = e.target.value + '°';
            document.getElementById('wall-rot-p').value = e.target.value;
            document.getElementById('val-wall-rot-p').textContent = e.target.value + '°';
        });
        document.getElementById('wall-rot-p').addEventListener('input', (e) => {
            document.getElementById('val-wall-rot-p').textContent = e.target.value + '°';
            document.getElementById('wall-rot').value = e.target.value;
            document.getElementById('val-wall-rot').textContent = e.target.value + '°';
            updatePreviewState();
        });

        const sliders = [
            { id: 'pos-x', valId: 'val-pos-x', unit: 'm' },
            { id: 'pos-z', valId: 'val-pos-z', unit: 'm' },
            { id: 'wall-height', valId: 'val-wall-height', unit: 'm' },
            { id: 'wall-width', valId: 'val-wall-width', unit: 'm' },
            { id: 'wall-depth', valId: 'val-wall-depth', unit: 'm' }
        ];

        sliders.forEach(item => {
            document.getElementById(item.id).addEventListener('input', (e) => {
                document.getElementById(item.valId).textContent = e.target.value + item.unit;
                updatePreviewState();
            });
        });

        document.getElementById('human-height').addEventListener('input', (e) => {
            const valCm = e.target.value;
            humanSetting.height = valCm / 100;
            document.getElementById('human-h-val').textContent = valCm + 'cm';
            document.getElementById('btn-human-val').textContent = valCm + 'cm';
            updatePreviewState();
        });

        function updateWallsDOM() {
            wallsContainer.innerHTML = '';
            walls.forEach(w => {
                const box = document.createElement('a-box');
                box.setAttribute('position', `${w.x} ${w.height / 2} ${w.z}`);
                box.setAttribute('width', w.width);
                box.setAttribute('height', w.height);
                box.setAttribute('depth', w.depth);
                box.setAttribute('rotation', `0 ${w.rot} 0`);
                box.setAttribute('material', 'color: #d35400; roughness: 0.6;');
                box.setAttribute('shadow', 'cast: true; receive: true');
                wallsContainer.appendChild(box);
            });
        }

        function updateHumansDOM() {
            humansContainer.innerHTML = '';
            humans.forEach((h) => {
                const root = document.createElement('a-entity');
                root.setAttribute('position', `${h.x} 0 ${h.z}`);
                const scale = h.height / 1.6;
                root.setAttribute('scale', `${scale} ${scale} ${scale}`);

                const parts = [
                    { w: '0.24', h: '0.24', d: '0.24', y: 1.48, x: 0 },
                    { w: '0.36', h: '0.50', d: '0.18', y: 1.11, x: 0 },
                    { w: '0.12', h: '0.76', d: '0.14', y: 0.38, x: -0.10 },
                    { w: '0.12', h: '0.76', d: '0.14', y: 0.38, x: 0.10 },
                    { w: '0.10', h: '0.48', d: '0.10', y: 1.10, x: -0.24 },
                    { w: '0.10', h: '0.48', d: '0.10', y: 1.10, x: 0.24 }
                ];

                parts.forEach(p => {
                    const el = document.createElement('a-box');
                    el.setAttribute('width', p.w); el.setAttribute('height', p.h); el.setAttribute('depth', p.d);
                    el.setAttribute('position', `${p.x} ${p.y} 0`);
                    el.setAttribute('material', 'color: #8E44AD; roughness: 0.5;');
                    el.setAttribute('shadow', 'cast: true; receive: true');
                    root.appendChild(el);
                });
                humansContainer.appendChild(root);
            });
        }

        function setCameraPreset(type) {
            if (type === 'eye') {
                cameraEl.setAttribute('position', '0 1.6 4');
                cameraEl.setAttribute('orbit-controls', 'target', '0 1.5 0');
            } else if (type === 'diagonal') {
                cameraEl.setAttribute('position', '0 12 18');
                cameraEl.setAttribute('orbit-controls', 'target', '0 1 0');
            } else if (type === 'front') {
                cameraEl.setAttribute('position', '0 3 15');
                cameraEl.setAttribute('orbit-controls', 'target', '0 1.5 0');
            } else if (type === 'top') {
                cameraEl.setAttribute('position', '0 25 0.01');
                cameraEl.setAttribute('orbit-controls', 'target', '0 0 0');
            }
        }

        document.getElementById('compass-btn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        document.getElementById('compass-btn').textContent = '🧭 同期中';
                    }
                }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
                document.getElementById('compass-btn').textContent = '🧭 同期中';
            }
        });

        function handleOrientation(e) {
            let heading = e.webkitCompassHeading !== undefined ? e.webkitCompassHeading : (e.alpha !== null ? 360 - e.alpha : 0);
            let diff = heading - smoothedHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            smoothedHeading += diff * 0.1;
            
            if (cameraEl) {
                cameraEl.setAttribute('orbit-controls', 'target', '0 1.5 0');
                cameraEl.setAttribute('rotation', `0 ${-smoothedHeading} 0`);
            }
        }

        function updateSimulation() {
            const totalMinutes = parseInt(timeSlider.value, 10);
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            timeText.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            const date = new Date();
            date.setHours(h, m, 0, 0);

            const sun = SunCalc.getPosition(date, latitude, longitude);
            const dist = 40;
            const sunX = -dist * Math.cos(sun.altitude) * Math.sin(sun.azimuth);
            const sunY = dist * Math.sin(sun.altitude);
            const sunZ = dist * Math.cos(sun.altitude) * Math.cos(sun.azimuth);

            sunLight.setAttribute('position', `${sunX} ${sunY} ${sunZ}`);
            
            const altDeg = (sun.altitude * 180 / Math.PI).toFixed(1);
            const aziDeg = ((sun.azimuth * 180 / Math.PI + 180) % 360).toFixed(1);
            document.getElementById('sun-info').innerHTML = `高度: ${altDeg}° / 方位: ${aziDeg}°`;
        }

        timeSlider.addEventListener('input', updateSimulation);
        updateSimulation();
    </script>
</body>
</html>
