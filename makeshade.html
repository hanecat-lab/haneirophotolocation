<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影シミュレーター V3 - 3D/AR対応版</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.2/suncalc.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: #222; color: #fff; overflow: hidden; }
        .ui-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 12px;
            width: 90%; max-width: 400px; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #ccc; }
        input[type="time"], input[type="range"], button {
            width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px;
        }
        input[type="time"] { background: #333; color: #fff; }
        button { background: #4CAF50; color: white; font-weight: bold; cursor: pointer; margin-top: 5px; }
        #place-wall-btn.active { background: #f44336; }
        .height-val { float: right; color: #4CAF50; font-weight: bold; }
        .top-info {
            position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7);
            padding: 10px; border-radius: 8px; font-size: 12px; z-index: 1000;
        }
        .error-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,0,0,0.8); padding: 20px; border-radius: 10px;
            text-align: center; z-index: 2000; display: none; width: 80%;
        }
    </style>
</head>
<body>
    <div id="camera-error" class="error-msg">
        カメラが起動できませんでした。<br>
        HTTPS環境で開くか、ブラウザのカメラ権限を確認してください。<br><br>
        <button onclick="this.parentElement.style.display='none'" style="background:#333">3Dモードで続行</button>
    </div>

    <a-scene shadow="type: pcfsoft" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        <a-sky color="#444"></a-sky>

        <a-entity id="camera-rig" position="0 0 5">
            <a-camera look-controls wasd-controls position="0 1.6 0"></a-camera>
        </a-entity>

        <a-light id="sun" type="directional" intensity="1.0" position="0 20 0" 
                 light="castShadow: true; shadowCameraLeft: -20; shadowCameraRight: 20; shadowCameraTop: 20; shadowCameraBottom: -20; shadowMapHeight: 2048; shadowMapWidth: 2048;"></a-light>
        <a-light type="ambient" intensity="0.4"></a-light>

        <a-plane id="ground" position="0 0 0" rotation="-90 0 0" width="50" height="50" 
                 class="clickable" material="color: #666; roughness: 1;" shadow="receive: true"></a-plane>

        <a-entity id="walls-container"></a-entity>
    </a-scene>

    <div class="top-info">
        <div id="sun-position" style="color:#FFD700; font-weight:bold;">太陽の位置を計算中...</div>
        <div id="geo-info">位置情報: 取得中...</div>
    </div>

    <div class="ui-panel">
        <div class="control-group">
            <label>時刻を指定:</label>
            <input type="time" id="time-input" value="12:00">
        </div>

        <div class="control-group">
            <label>壁の高さ: <span class="height-val" id="height-display">3.0m</span></label>
            <input type="range" id="wall-height" min="1" max="15" value="3" step="0.5">
        </div>

        <button id="place-wall-btn">壁を配置する (OFF)</button>
        <button id="clear-walls-btn" style="background: #555;">すべて削除</button>
    </div>

    <script>
        const sunLight = document.getElementById('sun');
        const wallsContainer = document.getElementById('walls-container');
        const heightDisplay = document.getElementById('height-display');
        const placeBtn = document.getElementById('place-wall-btn');
        const ground = document.getElementById('ground');
        
        let isPlacing = false;
        let currentHeight = 3.0;
        let latitude = 34.2709; 
        let longitude = 135.3850;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                latitude = pos.coords.latitude;
                longitude = pos.coords.longitude;
                document.getElementById('geo-info').textContent = `位置: ${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
                updateSun();
            }, () => {
                document.getElementById('geo-info').textContent = "位置: 紀の川市(デフォルト)";
                updateSun();
            });
        } else {
            updateSun();
        }

        document.getElementById('wall-height').addEventListener('input', (e) => {
            currentHeight = parseFloat(e.target.value);
            heightDisplay.textContent = currentHeight.toFixed(1) + 'm';
        });

        placeBtn.addEventListener('click', () => {
            isPlacing = !isPlacing;
            placeBtn.textContent = isPlacing ? '地面をタップして配置' : '壁を配置する (OFF)';
            placeBtn.className = isPlacing ? 'active' : '';
        });

        ground.addEventListener('click', (evt) => {
            if (!isPlacing) return;
            const point = evt.detail.intersection.point;
            createWall(point.x, point.z);
            isPlacing = false;
            placeBtn.textContent = '壁を配置する (OFF)';
            placeBtn.className = '';
        });

        function createWall(x, z) {
            const wall = document.createElement('a-box');
            wall.setAttribute('position', `${x} ${currentHeight/2} ${z}`);
            wall.setAttribute('width', '2');
            wall.setAttribute('height', currentHeight);
            wall.setAttribute('depth', '0.2');
            wall.setAttribute('material', 'color: #8B4513; roughness: 0.8;');
            wall.setAttribute('shadow', 'cast: true; receive: true;');
            wallsContainer.appendChild(wall);
        }

        document.getElementById('clear-walls-btn').addEventListener('click', () => {
            wallsContainer.innerHTML = '';
        });

        function updateSun() {
            try {
                if (typeof SunCalc === 'undefined') {
                    throw new Error('SunCalcが読み込まれていません');
                }

                const timeStr = document.getElementById('time-input').value;
                const [h, m] = timeStr.split(':').map(Number);
                const date = new Date();
                date.setHours(h, m, 0, 0);

                const sun = SunCalc.getPosition(date, latitude, longitude);
                const alt = sun.altitude; 
                const azi = sun.azimuth; 

                const distance = 30;
                const x = distance * Math.cos(alt) * Math.sin(azi);
                const y = distance * Math.sin(alt);
                const z = distance * Math.cos(alt) * Math.cos(azi);

                if (y < 0) {
                    sunLight.setAttribute('intensity', 0);
                } else {
                    sunLight.setAttribute('intensity', 1.0);
                }

                sunLight.setAttribute('position', `${x} ${y} ${z}`);

                const altDeg = alt * (180 / Math.PI);
                let aziDeg = (azi * (180 / Math.PI)) + 180;
                
                document.getElementById('sun-position').textContent = 
                    `太陽: 高度 ${altDeg.toFixed(1)}° / 方位 ${aziDeg.toFixed(1)}°`;
            } catch (err) {
                console.error(err);
                document.getElementById('sun-position').textContent = `エラー: ${err.message}`;
            }
        }

        document.getElementById('time-input').addEventListener('input', updateSun);
    </script>
</body>
</html>
