<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日陰シミュレーター / FPS Ultimate v3.0</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif;user-select:none}#scene{width:100%;height:100%}.panel{position:fixed;z-index:10;left:10px;right:10px;background:rgba(15,15,15,.92);backdrop-filter:blur(12px);border:1px solid #333;border-radius:12px;box-shadow:0 5px 20px #0009}.top{top:10px;padding:9px 11px;font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.yellow{color:#ffd700;font-weight:700}.hud{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding:5px 8px;border:1px solid #064d2a;border-radius:7px;background:#0009;font-family:monospace}.hud strong{font-size:15px;color:#00ff66}.strip{color:#777;letter-spacing:5px}.strip b{color:#00ff66;text-shadow:0 0 7px #0f6}.bottom{bottom:10px;padding:9px 10px}.time{display:flex;align-items:center;gap:8px}.time output{font:bold 15px monospace;color:#00ff66;min-width:45px}.time input{flex:1;accent-color:#00ff66}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}.ctrl label{display:flex;justify-content:space-between;font-size:10px;color:#ccc}.ctrl output{color:#00ff66;font-weight:700}.ctrl input{width:100%;accent-color:#00ff66}.buttons{display:flex;gap:6px;margin-top:6px}.buttons button{flex:1}.btn{border:0;border-radius:7px;height:34px;color:#fff;font-weight:700;background:#287be5}.btn.purple{background:#9b59b6}.btn.red{background:#d94b3d}.btn.dark{background:#292929;border:1px solid #444;color:#ddd;font-size:10px}.btn.active{background:#e67e22;border-color:#f39c12}.mode{color:#00ff66;font-size:11px;margin-top:5px}
#dpad{position:fixed;bottom:105px;left:15px;z-index:20;display:none;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:4px;background:rgba(0,0,0,.4);padding:6px;border-radius:12px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1)}
#dpad button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:bold;border-radius:6px;touch-action:manipulation}
#dpad button:active{background:#00ff66;color:#000}
#dpad .up{grid-column:2;grid-row:1}#dpad .left{grid-column:1;grid-row:2}#dpad .right{grid-column:3;grid-row:2}#dpad .down{grid-column:2;grid-row:3}
#selectedNotice{display:none;background:#e67e22;color:#fff;padding:4px 8px;border-radius:5px;font-size:10px;margin-top:4px;text-align:center;font-weight:bold}
</style>
</head>
<body>
<a-scene id="scene" embedded vr-mode-ui="enabled:false" shadow="type:pcfsoft" cursor="rayOrigin: mouse" raycaster="objects: .interactable">
  <a-entity id="orbitCamera" camera position="0 5 12" orbit-controls="target:0 1 0;enableDamping:true;dampingFactor:.12;rotateSpeed:.55;zoomSpeed:1;panSpeed:.7;minDistance:.5;maxDistance:60;maxPolarAngle:1.56" active="true"></a-entity>
  <a-entity id="fpsRig" position="0 1.44 0">
    <a-entity id="fpsCamera" camera look-controls="pointerLockEnabled:false;touchEnabled:true" wasd-controls="acceleration:15" active="false"></a-entity>
  </a-entity>
  <a-entity id="world-root">
    <a-entity id="sun-light" light="type:directional;intensity:1.3;castShadow:true;shadowCameraTop:40;shadowCameraBottom:-40;shadowCameraLeft:-40;shadowCameraRight:40;shadowMapWidth:2048;shadowMapHeight:2048" position="10 20 10"></a-entity>
    <a-light type="ambient" intensity=".45"></a-light>
    <a-plane id="ground" position="0 0 0" rotation="-90 0 0" width="50" height="50" material="color:#e5e5e5;roughness:.85" shadow="receive:true"></a-plane>
    <a-entity id="markers">
      <a-text value="N" position="0 .03 -22" align="center" color="#e74c3c" scale="3 3 3" rotation="-90 0 0"></a-text><a-text value="E" position="22 .03 0" align="center" color="#333" scale="2.5 2.5 2.5" rotation="-90 0 -90"></a-text><a-text value="S" position="0 .03 22" align="center" color="#3498db" scale="2.5 2.5 2.5" rotation="-90 0 180"></a-text><a-text value="W" position="-22 .03 0" align="center" color="#333" scale="2.5 2.5 2.5" rotation="-90 0 90"></a-text>
    </a-entity>
    <a-entity id="walls"></a-entity>
    <a-entity id="humans"></a-entity>
  </a-entity>
</a-scene>

<div id="dpad">
  <button class="up" id="btnFwd">▲</button><button class="left" id="btnLeft">◄</button><button class="right" id="btnRight">►</button><button class="down" id="btnBwd">▼</button>
</div>

<div class="panel top">
  <div class="row"><span id="sunInfo" class="yellow">太陽: --</span></div>
  <div class="hud"><span>向き <strong id="headingText">N (0°)</strong></span><span class="strip" id="strip">NW N NE E SE S SW W</span></div>
  <div id="mode" class="mode">手動モード / スライダーで基準方位を調整</div>
  <div id="selectedNotice">選択中: タップで選択解除 / 削除可能</div>
</div>

<div class="panel bottom">
  <div id="timeSection" class="time"><span>時刻</span><output id="timeOut">12:00</output><input id="time" type="range" min="300" max="1140" value="720"></div>
  <div id="settingSection" class="settings-grid" style="display:none;">
    <div class="ctrl"><label>壁高 <output id="whOut">3.0m</output></label><input id="wh" type="range" min="1" max="15" step=".5" value="3"></div>
    <div class="ctrl"><label>壁幅 <output id="wwOut">4.0m</output></label><input id="ww" type="range" min=".5" max="20" step=".5" value="4"></div>
    <div class="ctrl"><label>壁回転 <output id="wrOut">0°</output></label><input id="wr" type="range" min="0" max="359" value="0"></div>
    <div class="ctrl"><label>身長 <output id="hhOut">160cm</output></label><input id="hh" type="range" min="120" max="200" value="160"></div>
  </div>
  <div class="buttons">
    <button id="settingsBtn" class="btn dark">⚙ 設定</button>
    <button id="fpsBtn" class="btn purple">🎮 FPS一人称</button>
    <button id="wallBtn" class="btn">壁を追加</button>
    <button id="humanBtn" class="btn purple">人を追加</button>
    <button id="deleteBtn" class="btn red">選択削除</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id), wallsEl=$('walls'), humansEl=$('humans'), light=$('sun-light');
let wallObjects=[], humanObjects=[], isFps=false, moveState={fwd:0,bwd:0,left:0,right:0}, selectedEl=null;
const lat=34.27, lon=135.38;

function norm(v){return (v%360+360)%360}
function dir(v){return ['N','NE','E','SE','S','SW','W','NW'][Math.floor((norm(v)+22.5)/45)%8]}
function updateHUD(v){
  v=norm(v); $('headingText').textContent=`${dir(v)} (${Math.round(v)}°)`;
  $('strip').innerHTML=['N','NE','E','SE','S','SW','W','NW'].map(n=>n===dir(v)?`<b>${n}</b>`:n).join(' ');
}

$('wh').oninput = e => $('whOut').textContent = e.target.value + 'm';
$('ww').oninput = e => $('wwOut').textContent = e.target.value + 'm';
$('wr').oninput = e => $('wrOut').textContent = e.target.value + '°';
$('hh').oninput = e => $('hhOut').textContent = e.target.value + 'cm';

// 視点前方の設置位置算出 (FPS時はカメラ前2m、俯瞰時は中心)
function getSpawnPosition() {
  if (!isFps) return { x: 0, z: 0 };
  const fpsRig = $('fpsRig'), fpsCam = $('fpsCamera');
  const rigPos = fpsRig.getAttribute('position');
  const camRot = fpsCam.getAttribute('rotation') || { y: 0 };
  const yaw = camRot.y * Math.PI / 180;
  return {
    x: rigPos.x - Math.sin(yaw) * 2.5,
    z: rigPos.z - Math.cos(yaw) * 2.5
  };
}

// オブジェクト選択処理
function selectObject(el) {
  if (selectedEl) deselectObject();
  selectedEl = el;
  el.setAttribute('data-orig-color', el.getAttribute('material').color);
  el.setAttribute('material', 'color', '#ff3333');
  $('selectedNotice').style.display = 'block';
}

function deselectObject() {
  if (!selectedEl) return;
  const origColor = selectedEl.getAttribute('data-orig-color') || '#7f8c8d';
  selectedEl.setAttribute('material', 'color', origColor);
  selectedEl = null;
  $('selectedNotice').style.display = 'none';
}

// 壁追加
$('wallBtn').onclick = () => {
  const w = +$('ww').value, h = +$('wh').value, r = +$('wr').value;
  const pos = getSpawnPosition();
  const wall = document.createElement('a-box');
  wall.classList.add('interactable');
  wall.setAttribute('position', `${pos.x} ${h/2} ${pos.z}`);
  wall.setAttribute('width', w); wall.setAttribute('height', h); wall.setAttribute('depth', 0.2);
  wall.setAttribute('rotation', `0 ${r} 0`);
  wall.setAttribute('material', 'color:#7f8c8d;roughness:0.6');
  wall.setAttribute('shadow', 'cast:true;receive:true');
  
  wall.addEventListener('click', (e) => { e.stopPropagation(); selectObject(wall); });
  wallsEl.appendChild(wall);
  wallObjects.push({ el: wall, x: pos.x, z: pos.z, radius: Math.max(w, 0.5) / 2 });
};

// 人追加
$('humanBtn').onclick = () => {
  const h = +$('hh').value / 100;
  const pos = getSpawnPosition();
  const human = document.createElement('a-entity');
  
  const body = document.createElement('a-cylinder');
  body.classList.add('interactable');
  body.setAttribute('position', `${pos.x} ${h*0.45} ${pos.z}`);
  body.setAttribute('radius', 0.18); body.setAttribute('height', h*0.9);
  body.setAttribute('material', 'color:#e74c3c');
  body.setAttribute('shadow', 'cast:true;receive:true');
  
  const head = document.createElement('a-sphere');
  head.setAttribute('position', `${pos.x} ${h*0.95} ${pos.z}`);
  head.setAttribute('radius', 0.12);
  head.setAttribute('material', 'color:#f1c40f');
  head.setAttribute('shadow', 'cast:true;receive:true');

  body.addEventListener('click', (e) => { e.stopPropagation(); selectObject(body); });

  human.appendChild(body); human.appendChild(head);
  humansEl.appendChild(human);
  humanObjects.push({ el: human, h: h, x: pos.x, z: pos.z });
};

// 選択削除（全削除から個別削除へレベルアップ）
$('deleteBtn').onclick = () => {
  if (selectedEl) {
    const parent = selectedEl.parentElement;
    if (parent && parent !== wallsEl) {
      parent.remove(); // 人オブジェクトの場合
    } else {
      selectedEl.remove(); // 壁オブジェクトの場合
    }
    wallObjects = wallObjects.filter(o => o.el !== selectedEl);
    deselectObject();
  } else {
    // 未選択時は確認後全削除
    if(confirm('選択されたオブジェクトがありません。全削除しますか？')){
      wallsEl.innerHTML = ''; humansEl.innerHTML = '';
      wallObjects = []; humanObjects = [];
    }
  }
};

// 地面タップで選択解除
$('ground').addEventListener('click', deselectObject);

// FPSモード切り替え
$('fpsBtn').onclick = () => {
  isFps = !isFps;
  const orbitCam = $('orbitCamera'), fpsCam = $('fpsCamera'), fpsRig = $('fpsRig'), dpad = $('dpad');
  if(isFps){
    if(humanObjects.length > 0){
      const lastH = humanObjects[humanObjects.length - 1];
      fpsRig.setAttribute('position', `${lastH.x} ${lastH.h * 0.9} ${lastH.z}`);
    } else {
      fpsRig.setAttribute('position', '0 1.44 0');
    }
    orbitCam.setAttribute('camera', 'active', false);
    fpsCam.setAttribute('camera', 'active', true);
    dpad.style.display = 'grid';
    $('fpsBtn').textContent = '🚁 俯瞰視点';
    $('fpsBtn').classList.add('active');
  } else {
    fpsCam.setAttribute('camera', 'active', false);
    orbitCam.setAttribute('camera', 'active', true);
    dpad.style.display = 'none';
    $('fpsBtn').textContent = '🎮 FPS一人称';
    $('fpsBtn').classList.remove('active');
  }
};

function bindTouch(id, key){
  const el = $(id);
  const start = (e) => { e.preventDefault(); moveState[key] = 1; };
  const end = (e) => { e.preventDefault(); moveState[key] = 0; };
  el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
  el.addEventListener('mousedown', start); el.addEventListener('mouseup', end); el.addEventListener('mouseleave', end);
}
bindTouch('btnFwd', 'fwd'); bindTouch('btnBwd', 'bwd'); bindTouch('btnLeft', 'left'); bindTouch('btnRight', 'right');

// コリジョン（壁との衝突）判定付きFPS移動処理
function stepFPS(){
  if(isFps){
    const fpsRig = $('fpsRig'), fpsCam = $('fpsCamera');
    const rigPos = fpsRig.getAttribute('position'), camRot = fpsCam.getAttribute('rotation');
    if(camRot) updateHUD(-camRot.y);

    if(moveState.fwd || moveState.bwd || moveState.left || moveState.right){
      const speed = 0.12, yaw = (camRot ? camRot.y : 0) * Math.PI / 180;
      let dx = 0, dz = 0;
      if(moveState.fwd){ dx -= Math.sin(yaw)*speed; dz -= Math.cos(yaw)*speed; }
      if(moveState.bwd){ dx += Math.sin(yaw)*speed; dz += Math.cos(yaw)*speed; }
      if(moveState.left){ dx -= Math.cos(yaw)*speed; dz += Math.sin(yaw)*speed; }
      if(moveState.right){ dx += Math.cos(yaw)*speed; dz -= Math.sin(yaw)*speed; }

      let nextX = Math.max(-24, Math.min(24, rigPos.x + dx));
      let nextZ = Math.max(-24, Math.min(24, rigPos.z + dz));

      // 簡易円形コリジョン判定（壁すり抜け防止）
      for (let wall of wallObjects) {
        const dist = Math.hypot(nextX - wall.x, nextZ - wall.z);
        if (dist < wall.radius + 0.4) {
          nextX = rigPos.x;
          nextZ = rigPos.z;
          break;
        }
      }

      fpsRig.setAttribute('position', `${nextX} ${rigPos.y} ${nextZ}`);
    }
  }
  requestAnimationFrame(stepFPS);
}
stepFPS();

document.querySelectorAll('.panel, #dpad').forEach(p => {
  ['pointerdown','click','touchstart'].forEach(e => p.addEventListener(e, ev => ev.stopPropagation()));
});

$('settingsBtn').onclick = () => {
  const isS = $('settingSection').style.display === 'none';
  $('settingSection').style.display = isS ? 'grid' : 'none';
  $('timeSection').style.display = isS ? 'none' : 'flex';
  $('settingsBtn').textContent = isS ? '⏳ 時刻に戻る' : '⚙ 設定';
};

$('time').oninput = updateSimulation;
function updateSimulation(){
  const minutes = +$('time').value, h = Math.floor(minutes/60), m = minutes%60;
  $('timeOut').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const d = new Date(Date.UTC(2026, 7, 6, h, m, 0) - (9 * 60 * 60 * 1000));
  const s = SunCalc.getPosition(d, lat, lon), az = s.azimuth + Math.PI, alt = s.altitude, dist = 40;
  light.setAttribute('position', `${dist*Math.cos(alt)*Math.sin(az)} ${dist*Math.sin(alt)} ${-dist*Math.cos(alt)*Math.cos(az)}`);
  $('sunInfo').textContent = `太陽高度 ${(alt*180/Math.PI).toFixed(1)}° / 方位 ${norm(az*180/Math.PI).toFixed(1)}°`;
}
updateSimulation();
</script>
</body>
</html>
