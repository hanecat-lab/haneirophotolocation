  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
  (() => {
    const KEY = 'social-orbit-github-pages-v1';

    const choicesPeople = selected => state.people.map(p=>`<label class="check"><input type="checkbox" name="personIds" value="${p.id}" ${selected.includes(p.id)?'checked':''}>${beacon(p)}<span>${esc(p.name)}</span><small>${esc(p.interest)}</small></label>`).join('');
    const choicesActions = selected => active().map(a=>`<label class="check"><input type="checkbox" name="actionIds" value="${a.id}" ${selected.includes(a.id)?'checked':''}><span style="grid-column:2/4">${esc(a.title)}</span><small>${labelDate(a.date)}</small></label>`).join('')||'<p class="field-help">未完了の出来事はありません。</p>';
    const renderModal = () => { if(!modal)return ''; if(modal.type==='theme'){ const t=modal.id?state.themes.find(x=>x.id===modal.id):null, v=t||{title:'',purpose:'',status:'育てる',reviewDate:date(30),personIds:[],actionIds:[],notes:''}; return modalTemplate(t?'関係テーマを編集':'関係テーマを作る','RELATIONSHIP THEME',`<form class="form" data-form="theme"><input type="hidden" name="id" value="${esc(t?.id||'')}"><div class="field-group"><label>テーマ名</label><input class="field" name="title" required autofocus value="${esc(v.title)}" placeholder="例：展示から続く会話"></div><div class="field-group"><label>このテーマの目的</label><textarea class="field" name="purpose" placeholder="例：展示を入口に、相手の考えていることを聞く。">${esc(v.purpose)}</textarea></div><div class="two"><div class="field-group"><label>状態</label><select class="field" name="status">${['育てる','進行中','待機','完了'].map(s=>`<option ${v.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field-group"><label>見直し日</label><input class="field" type="date" name="reviewDate" value="${esc(v.reviewDate)}"></div></div><fieldset class="checkset"><legend>関連する人物</legend>${choicesPeople(v.personIds)}</fieldset><fieldset class="checkset"><legend>関連する未完了の出来事</legend>${choicesActions(v.actionIds)}</fieldset><div class="field-group"><label>メモ（任意）</label><textarea class="field" name="notes" placeholder="個別のタグにしない、今の機会や手触りを残せます。">${esc(v.notes)}</textarea></div><p class="field-help">テーマは、人物を分類するタグではありません。今の目的・機会・関心が変わった時に編集、完了、アーカイブできます。</p><div class="modal-actions">${t?`<button type="button" class="btn danger" data-theme-delete="${t.id}">削除</button>`:''}<button type="button" class="btn" data-close>キャンセル</button><button class="btn primary">${t?'変更を保存':'テーマを作る'}</button></div></form>`)}
      if(modal.type==='action')return modalTemplate('次の一手を置く','NEXT MOMENT',`<form class="form" data-form="action"><div class="field-group"><label>相手</label><select class="field" name="personId">${state.people.map(p=>`<option value="${p.id}" ${p.id===state.ui.selected?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field-group"><label>行動</label><input class="field" name="title" required autofocus placeholder="例：展示の感想を返す"></div><div class="two"><div class="field-group"><label>日付</label><input class="field" type="date" name="date" value="${today()}" required></div><div class="field-group"><label>種類</label><select class="field" name="category"><option>連絡</option><option>会う</option><option>確認</option></select></div></div><div class="field-group"><label>この行動の根拠</label><textarea class="field" name="reason" placeholder="例：前回の話題、約束、気にかけたい理由"></textarea></div><div class="modal-actions"><button type="button" class="btn" data-close>キャンセル</button><button class="btn primary">＋ 追加する</button></div></form>`);
      if(modal.type==='log')return modalTemplate('接点を記録','CONTACT LOG',`<form class="form" data-form="log"><div class="two"><div class="field-group"><label>種類</label><select class="field" name="kind"><option>連絡</option><option>会う</option><option>メモ</option><option>気づき</option><option>SNS</option><option>約束</option></select></div><div class="field-group"><label>日付</label><input class="field" type="date" name="date" value="${today()}"></div></div><div class="field-group"><label>記録</label><textarea class="field" name="note" required autofocus placeholder="一文から記録できます。例：展示の感想を送り、次は音の話を聞いてみたい。"></textarea></div><p class="field-help">「気づき」は事実の断定ではなく、自分の観察メモです。</p><div class="modal-actions"><button type="button" class="btn" data-close>キャンセル</button><button class="btn primary">✓ 保存する</button></div></form>`);
      if(modal.type==='inbox')return modalTemplate('後で思い出す','QUIET INBOX',`<form class="form" data-form="inbox"><p class="field-help">人物・日付・テーマが決まっていなくても、一文だけ残せます。通知は送らず、アプリを開いた時にだけ静かに再表示します。</p><div class="field-group"><label>忘れたくないこと</label><textarea class="field" name="title" required autofocus placeholder="例：次の写真展の情報を、優斗さんに伝えたい。"></textarea></div><div class="two"><div class="field-group"><label>人物（任意）</label><select class="field" name="personId"><option value="">あとで決める</option>${state.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field-group"><label>次に見る日</label><input class="field" type="date" name="reviewDate" value="${date(7)}"></div></div><div class="modal-actions"><button type="button" class="btn" data-close>キャンセル</button><button class="btn primary">▣ 受信箱に入れる</button></div></form>`);
      return modalTemplate('人物を軌道に置く','NEW BEACON',`<form class="form" data-form="person"><div class="field-group"><label>名前</label><input class="field" name="name" required autofocus placeholder="例：山田 花子"></div><div class="two"><div class="field-group"><label>呼び名・SNS ID</label><input class="field" name="handle" placeholder="例：@hanako"></div><div class="field-group"><label>関係性</label><select class="field" name="relationship"><option>新しい</option><option>育てる</option><option>親しい</option><option>仕事</option></select></div></div><div class="field-group"><label>肩書き・接点</label><input class="field" name="role" placeholder="例：ライター / 読書会で知り合う"></div><div class="field-group"><label>共通の関心</label><input class="field" name="interest" placeholder="例：展示、静かなカフェ"></div><div class="modal-actions"><button type="button" class="btn" data-close>キャンセル</button><button class="btn primary">＋ 人物を追加</button></div></form>`);
    };
    const render = () => { const view={orbit:orbitView,people:peopleView,events:eventsView,context:contextView,settings:settingsView}[state.ui.view]||orbitView; document.querySelector('#app').innerHTML=`<div class="shell">${nav()}<main>${home()}${tabs()}${view()}</main>${detail()}</div>${renderModal()}`; save() };
    function setView(v){state.ui.view=v;render()}
    function openPerson(id){state.ui.selected=id;state.ui.view='orbit';render()}
    function completeAction(id){const a=state.actions.find(x=>x.id===id);if(!a)return;a.status='completed';a.completedAt=today();render();notify('出来事を完了にしました')}
    function deferAction(id){const a=state.actions.find(x=>x.id===id);if(!a)return;const d=new Date(a.date+'T12:00:00');d.setDate(d.getDate()+3);a.date=d.toISOString().slice(0,10);a.status='deferred';render();notify('3日後へ延期しました')}
    function archiveTheme(id){const t=state.themes.find(x=>x.id===id);if(!t)return;t.previousStatus=t.status;t.status='アーカイブ';t.archivedAt=today();render();notify('テーマをアーカイブしました')}
    function completeTheme(id){const t=state.themes.find(x=>x.id===id);if(!t)return;t.status='完了';t.completedAt=today();render();notify('テーマを完了にしました')}
    function restoreTheme(id){const t=state.themes.find(x=>x.id===id);if(!t)return;t.status=t.previousStatus&&t.previousStatus!=='アーカイブ'?t.previousStatus:'待機';t.archivedAt='';render();notify('テーマを復元しました')}
    function submit(form){const fd=new FormData(form), type=form.dataset.form;if(type==='theme'){const id=fd.get('id')||uid('t');const actionIds=[...new Set(fd.getAll('actionIds').map(String))];const personIds=[...new Set([...fd.getAll('personIds').map(String),...actionIds.map(id=>state.actions.find(a=>a.id===id)?.personId).filter(Boolean)])];let t=state.themes.find(x=>x.id===id);const obj={id,title:String(fd.get('title')).trim(),purpose:String(fd.get('purpose')).trim()||'今の目的を記録してください。',status:String(fd.get('status')),reviewDate:String(fd.get('reviewDate')),personIds,actionIds,notes:String(fd.get('notes')).trim(),createdAt:t?.createdAt||today(),completedAt:t?.completedAt||'',archivedAt:t?.archivedAt||'',previousStatus:t?.previousStatus||''};if(obj.status==='完了'&&!obj.completedAt)obj.completedAt=today();if(t)Object.assign(t,obj);else state.themes.unshift(obj);modal=null;state.ui.view='context';render();notify(t?'テーマを更新しました':'関係テーマを作成しました');return}
      if(type==='action'){state.actions.push({id:uid('a'),personId:String(fd.get('personId')),title:String(fd.get('title')).trim(),date:String(fd.get('date')),reason:String(fd.get('reason')).trim()||'自分で設定した次のきっかけ',category:String(fd.get('category')),status:'scheduled'});modal=null;render();notify('次の一手を追加しました');return}
      if(type==='log'){const p=person(state.ui.selected);state.logs.push({id:uid('l'),personId:p.id,kind:String(fd.get('kind')),date:String(fd.get('date')),note:String(fd.get('note')).trim()});p.last=labelDate(String(fd.get('date')));modal=null;render();notify('接点ログを保存しました');return}
      if(type==='inbox'){state.inbox.unshift({id:uid('i'),title:String(fd.get('title')).trim(),personId:String(fd.get('personId'))||'',reviewDate:String(fd.get('reviewDate')),status:'open',createdAt:today()});modal=null;render();notify('後で思い出す受信箱に入れました');return}
      if(type==='person'){const n=state.people.length,name=String(fd.get('name')).trim(),p={id:uid('p'),name,handle:String(fd.get('handle')).trim()||'@handle',role:String(fd.get('role')).trim()||'関係を記録',relationship:String(fd.get('relationship')),color:COLORS[n%COLORS.length],interest:String(fd.get('interest')).trim()||'まだ記録なし',connection:'接点を記録してください',last:'まだ記録がありません',x:21+(n*19)%61,y:25+(n*17)%54};state.people.push(p);state.ui.selected=p.id;modal=null;render();notify(name+'さんを軌道に追加しました')}
    }
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return; if(b.dataset.view!==undefined)return setView(b.dataset.view); if(b.dataset.openPerson!==undefined)return openPerson(b.dataset.openPerson); if(b.dataset.modal!==undefined){modal={type:b.dataset.modal};return render()} if(b.dataset.close!==undefined){modal=null;return render()} if(b.dataset.actionComplete!==undefined)return completeAction(b.dataset.actionComplete);if(b.dataset.actionDefer!==undefined)return deferAction(b.dataset.actionDefer);if(b.dataset.actionCancel!==undefined){const a=state.actions.find(x=>x.id===b.dataset.actionCancel);if(a){a.status='cancelled';render();notify('出来事を取り消しました')}return}if(b.dataset.focusLater!==undefined){state.focusSnoozes[b.dataset.focusLater]=date(7);render();notify('一週間後に、また候補として表示します');return}if(b.dataset.inboxArchive!==undefined){const i=state.inbox.find(x=>x.id===b.dataset.inboxArchive);if(i){i.status='archived';render();notify('受信箱から保管しました')}return}if(b.dataset.themeFilter!==undefined){state.ui.themeFilter=b.dataset.themeFilter;return render()}if(b.dataset.themeEdit!==undefined){modal={type:'theme',id:b.dataset.themeEdit};return render()}if(b.dataset.themeComplete!==undefined)return completeTheme(b.dataset.themeComplete);if(b.dataset.themeArchive!==undefined)return archiveTheme(b.dataset.themeArchive);if(b.dataset.themeRestore!==undefined)return restoreTheme(b.dataset.themeRestore);if(b.dataset.themeDelete!==undefined){if(confirm('このテーマを削除しますか？人物や出来事は削除されません。')){state.themes=state.themes.filter(t=>t.id!==b.dataset.themeDelete);modal=null;render();notify('テーマを削除しました')}return}if(b.dataset.toast!==undefined)return notify(b.dataset.toast);if(b.dataset.export!==undefined){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='social-orbit-'+today()+'.json';a.click();URL.revokeObjectURL(url);notify('データを書き出しました');return}if(b.dataset.import!==undefined)return document.querySelector('#restore-file').click();if(b.dataset.reset!==undefined){if(confirm('すべての記録を初期サンプルに戻します。よろしいですか？')){state=seed();modal=null;render();notify('初期サンプルに戻しました')}}});
    document.addEventListener('submit',e=>{const form=e.target;if(form.matches('[data-form]')){e.preventDefault();submit(form)}});
    document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){state.ui.personQuery=e.target.value;render()}});
    document.querySelector('#restore-file').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!Array.isArray(parsed.people)||!Array.isArray(parsed.actions)||!Array.isArray(parsed.logs))throw Error();state=normalise(parsed);render();notify('データを復元しました')}catch{notify('Social OrbitのJSONファイルを選択してください')}};reader.readAsText(file);e.target.value=''});
    render();
  })();
  </script>
</body>
</html>
