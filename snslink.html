    }
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return; if(b.dataset.view!==undefined)return setView(b.dataset.view); if(b.dataset.openPerson!==undefined)return openPerson(b.dataset.openPerson); if(b.dataset.motionToggle!==undefined)return setMotion(!state.settings.motion); if(b.dataset.mode!==undefined)return setAppearance('mode',b.dataset.mode); if(b.dataset.colorTheme!==undefined)return setAppearance('colorTheme',b.dataset.colorTheme); if(b.dataset.personRelationship!==undefined){const p=person(b.dataset.personId);if(p){p.relationship=b.dataset.personRelationship;render();notify(`${p.name}さんとの関係性を「${p.relationship}」に設定しました`)}return} if(b.dataset.modal!==undefined){modal={type:b.dataset.modal};return render()} if(b.dataset.close!==undefined){modal=null;return render()} if(b.dataset.actionComplete!==undefined)return completeAction(b.dataset.actionComplete);if(b.dataset.actionDefer!==undefined)return deferAction(b.dataset.actionDefer);if(b.dataset.actionCancel!==undefined){const a=state.actions.find(x=>x.id===b.dataset.actionCancel);if(a){a.status='cancelled';render();notify('出来事を取り消しました')}return}if(b.dataset.focusLater!==undefined){state.focusSnoozes[b.dataset.focusLater]=date(7);render();notify('一週間後に、また候補として表示します');return}if(b.dataset.inboxArchive!==undefined){const i=state.inbox.find(x=>x.id===b.dataset.inboxArchive);if(i){i.status='archived';render();notify('受信箱から保管しました')}return}if(b.dataset.themeFilter!==undefined){state.ui.themeFilter=b.dataset.themeFilter;return render()}if(b.dataset.themeEdit!==undefined){modal={type:'theme',id:b.dataset.themeEdit};return render()}if(b.dataset.themeComplete!==undefined)return completeTheme(b.dataset.themeComplete);if(b.dataset.themeArchive!==undefined)return archiveTheme(b.dataset.themeArchive);if(b.dataset.themeRestore!==undefined)return restoreTheme(b.dataset.themeRestore);if(b.dataset.themeDelete!==undefined){if(confirm('このテーマを削除しますか？人物や出来事は削除されません。')){state.themes=state.themes.filter(t=>t.id!==b.dataset.themeDelete);modal=null;render();notify('テーマを削除しました')}return}if(b.dataset.toast!==undefined)return notify(b.dataset.toast);if(b.dataset.export!==undefined){const backup={format:'social-orbit-backup',formatVersion:2,exportedAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='social-orbit-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);notify('バックアップを書き出しました');return}if(b.dataset.import!==undefined)return document.querySelector('#restore-file').click();if(b.dataset.reset!==undefined){if(confirm('すべての記録と表示設定を初期サンプルに戻します。よろしいですか？')){state=seed();modal=null;render();notify('初期サンプルに戻しました')}}});
    document.addEventListener('submit',e=>{const form=e.target;if(form.matches('[data-form]')){e.preventDefault();submit(form)}});
    document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){state.ui.personQuery=e.target.value;render()}});
    const viewOrder=['orbit','people','events','context'];
    let touchStart=null;
    document.addEventListener('touchstart',e=>{
      if(e.touches.length!==1||e.target.closest('input,textarea,select,button,.modal'))return;
      const touch=e.touches[0], row=e.target.closest('[data-swipe-action]');
      touchStart={x:touch.clientX,y:touch.clientY,row,actionId:row?.dataset.swipeAction||'',moved:false};
    },{passive:true});
    document.addEventListener('touchmove',e=>{
      if(!touchStart||e.touches.length!==1)return;
      const touch=e.touches[0],dx=touch.clientX-touchStart.x,dy=touch.clientY-touchStart.y;
      if(Math.abs(dx)>12)touchStart.moved=true;
      if(touchStart.row&&Math.abs(dx)>Math.abs(dy)&&dx<-54){touchStart.row.classList.add('swipe-ready');}
      else if(touchStart.row){touchStart.row.classList.remove('swipe-ready');}
    },{passive:true});
    document.addEventListener('touchend',e=>{
      if(!touchStart)return;
      const touch=e.changedTouches[0],dx=touch.clientX-touchStart.x,dy=touch.clientY-touchStart.y,row=touchStart.row;
      if(row){row.classList.remove('swipe-ready');if(dx<-92&&Math.abs(dx)>Math.abs(dy)*1.5){const actionId=touchStart.actionId;row.classList.add('swipe-confirm');touchStart=null;setTimeout(()=>completeAction(actionId),160);return;}}
      if(!touchStart.moved&&Math.abs(dx)<20){touchStart=null;return;}
      if(Math.abs(dx)>86&&Math.abs(dx)>Math.abs(dy)*1.45&&!e.target.closest('.tabs,.orbit,.detail,.theme-card')){
        const current=viewOrder.indexOf(state.ui.view),step=dx<0?1:-1,next=viewOrder[(current+step+viewOrder.length)%viewOrder.length];
        setView(next);notify(dx<0?'次の画面へ移動しました':'前の画面へ移動しました');
      }
      touchStart=null;
    },{passive:true});
    document.addEventListener('click',e=>{const field=e.target.closest?.('[data-orbit-field]');if(field&&!e.target.closest('button'))wakeOrbit(field)});
    document.addEventListener('keydown',e=>{
      const row=e.target.closest?.('[data-swipe-action]');
      if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();completeAction(row.dataset.swipeAction);return;}
      const field=e.target.closest?.('[data-orbit-field]');
      if(field&&(e.key==='Enter'||e.key===' ')){e.preventDefault();wakeOrbit(field);}
    });
    document.querySelector('#restore-file').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result),data=parsed?.format==='social-orbit-backup'?parsed.data:parsed;if(!Array.isArray(data?.people)||!Array.isArray(data?.actions)||!Array.isArray(data?.logs))throw Error();state=normalise(data);render();notify('バックアップを読み込みました')}catch{notify('Social OrbitのバックアップJSONを選択してください')}};reader.readAsText(file);e.target.value=''});
    render();
  })();
  </script>
</body>
