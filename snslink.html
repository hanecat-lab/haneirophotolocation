/* Quick capture: a quiet tray, separate from the daily ritual. */
.shiori-tabs{grid-template-columns:repeat(5,minmax(0,1fr))}.capture-entry{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(115deg,#b387ff12,#71e7ff08);margin:0 0 22px}.capture-entry .button{font-size:12px;min-height:42px;padding:8px 12px}.capture-entry small{color:var(--muted);font-size:11px}.capture-actions,.place-scopes{display:flex;gap:8px;flex-wrap:wrap}.place-scopes{margin-bottom:16px}.place-scopes .button{font-size:12px;min-height:42px}.place-scopes .active{border-color:var(--cyan);color:var(--cyan)}.self-place-label{color:var(--cyan)}.capture-actions{margin-top:14px;align-items:center}.capture-actions .button{font-size:12px;min-height:42px}.capture-menu{margin-left:auto}.capture-menu summary{font-size:12px;color:var(--muted);cursor:pointer;min-height:42px;display:flex;align-items:center}.capture-menu[open]{width:100%}.capture-original{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.85}.capture-url{display:block;overflow-wrap:anywhere;color:var(--muted);font-size:11px;margin-top:8px}.capture-context{font-size:11px;color:var(--muted);margin-top:9px}.capture-summary{font-size:12px;line-height:1.8;color:var(--muted);margin:0 0 16px}.organize-preview{padding:12px 15px;border:1px solid var(--line);border-radius:16px;margin:0 0 16px;background:var(--soft)}.organize-preview p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.reference-link{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;min-height:40px;overflow-wrap:anywhere}.reference-link svg{width:14px;height:14px}.duplicate-choice{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}@media(max-width:650px){.shiori-tabs{gap:4px}.shiori-tabs button{flex-direction:column;gap:3px;padding:7px 2px;font-size:10px}.capture-entry{padding:10px;flex-wrap:wrap}.capture-entry small{width:100%;order:2}.capture-entry .button{font-size:11px}.place-scopes .button{font-size:11px;padding:8px 10px}.capture-original{font-size:13px}}

/* A quiet continuation card, after the plant and before today's people. */
.resume-card{margin:0 0 20px;position:relative;overflow:hidden;padding:16px 18px;border-radius:22px;transform:scale(var(--card-press,1));transform-origin:center;isolation:isolate}.resume-copy h3{font-size:16px;margin:5px 0 7px}.resume-copy p{font-size:12px;line-height:1.8;color:var(--muted);overflow-wrap:anywhere}.resume-copy .eyebrow{font-size:8px;letter-spacing:2px}.resume-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.resume-actions .button{min-height:40px;font-size:11px;padding:8px 10px}.resume-menu{margin-left:auto}.resume-menu summary{font-size:11px;min-height:40px;display:flex;align-items:center;color:var(--muted);cursor:pointer}.resume-menu[open]{width:100%}.resume-more{color:var(--muted)!important}.draft-status{font-size:11px;line-height:1.8;color:var(--muted);margin:12px 0 0}.draft-status[data-error=true]{color:#ffaab6}.draft-person-tools .button{min-height:35px;font-size:11px;padding:6px 0}.capture-flight{position:fixed;width:26px;height:32px;display:grid;place-items:center;border:1px solid #c6acff99;border-radius:9px;background:linear-gradient(140deg,#b381ff66,#71e7ff22);box-shadow:inset 0 1px 0 #fff8,0 0 18px #b381ff66;color:#f3eaff;pointer-events:none;backdrop-filter:blur(5px)}.capture-flight svg{width:17px;height:17px}.person-card{transform:scale(var(--card-press,1))}.person-card:after,.resume-card:after{content:"";position:absolute;inset:0;background:radial-gradient(circle 85px at var(--touch-x,50%) var(--touch-y,50%),#c5b1ff29,transparent 85%);opacity:0;pointer-events:none;z-index:4;transition:opacity .16s cubic-bezier(.16,1,.3,1)}.glass-is-pressed:after{opacity:1}.shiori-tabs{perspective:700px;align-items:center}.shiori-tabs button{position:relative;transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s cubic-bezier(.16,1,.3,1)}.shiori-tabs button.active{transform:translateY(-2px) translateZ(5px) scale(var(--press-scale,1));z-index:1}.shiori-panel{transform-origin:50% 10%;min-width:0}body[data-motion=off] .resume-card,body[data-motion=off] .person-card,body[data-motion=off] .shiori-tabs button.active{transform:none}body[data-motion=off] .person-card:after,body[data-motion=off] .resume-card:after{display:none}body[data-motion=gentle] .shiori-tabs button.active{transform:translateY(-1px)}#toast:not(.show) .button{pointer-events:none}#toast .button{pointer-events:auto;margin-left:8px;min-height:30px;padding:3px 7px;color:#e3fffb;font-size:11px}.resume-card .button svg{width:15px;height:15px}:root[data-theme=light] .draft-status[data-error=true]{color:#9c304c}@media(max-width:650px){.resume-card{padding:14px 16px;margin-bottom:17px}.resume-copy h3{font-size:15px}.resume-copy p{font-size:11px}}

document.querySelector('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>20*1024*1024)throw Error('20MB以下のバックアップJSONを選んでください');const data=JSON.parse(await file.text()),raw=['hitome-backup','social-orbit-backup'].includes(data.format)?data.data:data,imported=normalise(raw);if(!confirm(`${imported.people.length}人の記録を読み込み、現在の記録を置き換えます。現在の記録は先にJSONで書き出します。よろしいですか？`))return;exportData('hitome-before-import');clearTimeout(draftTimer);draftSession=null;draftPersonReturn=null;organizePersonReturn=null;draftRestoreRequest=null;state=imported;state.legacyImported=data.format==='social-orbit-backup'||raw.version!==3;storageProblem='';document.querySelector('#storage-error').classList.add('hide');view='today';filter='high';categoryFilter='all';query='';logFilter='all';notesTab='memo';placeScope='all';savedQuery='';savedReturnPerson='';calendarAnchor=today();calendarSelected=today();if(!['list','week','month'].includes(state.settings.calendarView))state.settings.calendarView='list';closeDialog();render();toast('記録を引き継ぎました')}catch(err){toast(err instanceof SyntaxError?'JSONの内容を読み込めませんでした。元のバックアップを選んでください':err.message)}});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
dialog.addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
function resume(){syncMotion();if(document.visibilityState==='hidden')return;queueHitomeSync();if(dayKey!==today()){dayKey=today();render()}else if(state.pending){render()}}
window.addEventListener('focus',resume);document.addEventListener('visibilitychange',resume);window.addEventListener('pageshow',resume);setInterval(()=>{if(document.visibilityState!=='hidden'&&dayKey!==today()){dayKey=today();render()}},30000);
window.addEventListener('storage',e=>{if(e.key===PUSH_DEVICE_KEY){clearTimeout(pushSyncTimer);clearTimeout(pushRetryTimer);pushStorageError='別のタブで通知設定が変更されました。再読み込みしてください。';refreshPushUI()}if(e.key===KEY){clearTimeout(pushSyncTimer);clearTimeout(pushRetryTimer);storageProblem='別のタブで記録が変更されました。上書きを防ぐため保存を停止しています。このページを再読み込みしてください。';showStorageError();toast('別のタブで変更されました。再読み込みしてください。')}});
let pressed=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('button,a.button');if(!el||el.disabled||e.button>0)return;const r=el.getBoundingClientRect();lastEffectPoint={x:e.clientX||r.left+r.width/2,y:e.clientY||r.top+r.height/2};if(el.matches('.dock-item')){if(motionEnabled())el.style.setProperty('--press-scale','.97');return}if(!motionEnabled()||cardTouch?.trigger===el)return;pressed=el;el.style.setProperty('--press-scale','.97');if(el.matches('.open-instagram')){el.classList.add('is-touching');meltInstagram(el);setTimeout(()=>el.classList.remove('is-touching'),550)}if(el.matches('.liquid-pill,.button.primary')){const color=el.matches('.liquid-pill')?priorityColors[el.dataset.filter]:'#b381ff';pulseMesh(color,lastEffectPoint)}});
function releasePress(){document.querySelectorAll('.dock-item').forEach(el=>el.style.removeProperty('--press-scale'));if(!pressed)return;const el=pressed;pressed=null;el.style.removeProperty('--press-scale');if(el.isConnected&&motionEnabled()&&!el.matches('.liquid-pill'))animate(el,springFrames(0,0,.97),{duration:380})}
document.addEventListener('pointerup',releasePress);document.addEventListener('pointercancel',releasePress);
document.addEventListener('pointermove',moveLivingMagnet);
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||!matchMedia('(hover:hover) and (pointer:fine)').matches||!motionEnabled())return;const el=e.target.closest('.liquid-pill,.button.primary:not(.open-instagram)');if(!el)return;const r=el.getBoundingClientRect();el.style.setProperty('--mag-x',Math.max(-3,Math.min(3,(e.clientX-r.left-r.width/2)*.04))+'px');el.style.setProperty('--mag-y',Math.max(-2,Math.min(2,(e.clientY-r.top-r.height/2)*.055))+'px')});
document.addEventListener('pointerout',e=>{const el=e.target.closest('.liquid-pill,.button.primary');if(el&&!el.contains(e.relatedTarget)){el.style.removeProperty('--mag-x');el.style.removeProperty('--mag-y')}});

reducedMotion.addEventListener?.('change',syncMotion);
if(storageProblem)showStorageError();render();refreshPushUI();
const notifiedTask=new URLSearchParams(location.search).get('hitome-task');if(notifiedTask)openNotificationTask(notifiedTask);
if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='HITOME_OPEN_TASK'&&typeof e.data.taskId==='string')openNotificationTask(e.data.taskId)});
window.addEventListener('online',()=>{pushRetryCount=0;queueHitomeSync()});setInterval(()=>{if(document.visibilityState!=='hidden')queueHitomeSync()},60000);
})();
</script>
</body>
