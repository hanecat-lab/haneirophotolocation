<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171b1d" />
  <title>Lightfield — スタンドアロン版</title>
  <style>
    :root{--ink:#171b1d;--panel:#161b1b;--line:rgba(255,255,255,.14);--sun:#e0a83a;--key:#67aef5;--fill:#bff4e9;--muted:#9ba2a1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#171b1d;color:#f6f5f0}button,input{font:inherit}button{border:0;cursor:pointer}.shell{height:100dvh;min-height:620px;background:#1b2021}.scene{position:absolute;inset:0}.scene canvas{display:block;width:100%;height:100%;touch-action:none}.bar{position:absolute;z-index:2;top:16px;left:16px;display:flex;align-items:center;gap:9px}.mark{display:grid;place-items:center;width:34px;height:34px;background:#e7e1d5;color:#171b1d;border-radius:9px;font-weight:800}.title p{margin:0;color:#c6cfc9;font:700 9px ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em}.title h1{margin:1px 0 0;font:700 18px ui-monospace,SFMono-Regular,monospace;letter-spacing:.04em}.badge{display:flex;align-items:center;gap:5px;margin-left:8px;padding:8px 10px;background:rgba(22,27,27,.82);border:1px solid rgba(224,168,58,.5);color:#ffd784;font:700 11px ui-monospace,SFMono-Regular,monospace}.readout{position:absolute;z-index:2;left:16px;top:72px;border-left:2px solid var(--sun);background:rgba(23,28,29,.76);padding:8px 10px;font-size:11px}.readout small{display:block;color:#c9c0ab;font:700 9px ui-monospace,SFMono-Regular,monospace;letter-spacing:.1em;margin-bottom:3px}.scale{position:absolute;z-index:2;top:128px;left:16px;width:220px;height:18px;display:flex;justify-content:space-between;border-top:1px solid rgba(28,34,33,.45);padding-top:5px;color:#35403d;font:700 8px ui-monospace,SFMono-Regular,monospace}.scale:before{content:"";position:absolute;top:-4px;inset-inline:0;height:4px;background:repeating-linear-gradient(90deg,rgba(30,36,35,.56) 0 1px,transparent 1px 16px)}.scale i{position:absolute;top:-8px;width:2px;height:13px;background:var(--sun)}.drawer{position:absolute;z-index:3;right:0;top:0;bottom:0;width:338px;overflow:auto;padding:24px 20px;background:linear-gradient(140deg,#192020,#111616);border-left:1px solid var(--line);box-shadow:-16px 0 35px rgba(0,0,0,.25)}.eyebrow{margin:0 0 3px;color:#bfc7c3;font:700 9px ui-monospace,SFMono-Regular,monospace;letter-spacing:.1em}.drawer h2{margin:0;font-size:20px;letter-spacing:-.04em}.section{padding:15px 0;border-top:1px solid rgba(255,255,255,.1)}.section:first-of-type{margin-top:17px}.label{display:flex;justify-content:space-between;margin-bottom:9px;font-size:12px;font-weight:700}.label small{color:#87918e;font:500 9px ui-monospace,SFMono-Regular,monospace;letter-spacing:.09em}.two{display:grid;grid-template-columns:1fr 1fr;gap:4px}.mode,.pose{min-height:38px;background:#111616;border:1px solid var(--line);color:#adb6b3;font-size:11px;font-weight:700}.mode.active,.pose.active{border-color:rgba(224,168,58,.65);color:#ffe3a8;background:rgba(224,168,58,.1);box-shadow:inset 0 -2px var(--sun)}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.inputs input{min-width:0;background:#111616;border:1px solid var(--line);color:#ebeee9;padding:7px;font:11px ui-monospace,SFMono-Regular,monospace}.slider{margin:9px 0}.slider div{display:flex;justify-content:space-between;font-size:11px;color:#c6cfcc}.slider strong{color:#e9eff0;font:600 11px ui-monospace,SFMono-Regular,monospace}.slider input{width:100%;accent-color:var(--key)}.sun-range{accent-color:var(--sun)!important}.lights{display:flex;flex-direction:column;gap:5px}.light{display:flex;align-items:center;gap:8px;padding:9px 8px;background:rgba(255,255,255,.025);border:1px solid var(--line);cursor:pointer}.light.selected{border-color:rgba(103,174,245,.7);background:rgba(103,174,245,.1)}.light span{flex:1;font-size:12px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--key)}.fill{background:var(--fill)}.rim{background:#b9d3ff}.light input{accent-color:var(--key)}.hint{margin-top:10px;padding:10px;border-left:2px solid var(--sun);background:rgba(0,0,0,.18);color:#d8dcd6;font-size:10px;line-height:1.55}.hint strong{display:block;color:#ffe3a8;font-size:11px}@media(max-width:720px){.drawer{top:auto;left:0;width:auto;height:50dvh;padding:16px}.bar{top:12px;left:12px}.readout{top:64px;left:12px}.scale{top:120px;left:12px}.scene{bottom:45dvh}.drawer h2{font-size:18px}.section{padding:11px 0}.slider{margin:6px 0}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
</head>
<body>
  <main class="shell">
    <div id="scene" class="scene"></div>
    <header class="bar"><div class="mark">◒</div><div class="title"><p>LIGHTING SKETCHBOOK</p><h1>Lightfield</h1></div><span class="badge" id="modeBadge">☀ 屋外</span></header>
    <div class="readout"><small>SOLAR POSITION</small><strong id="solarText">計算中</strong></div>
    <div class="scale" id="scale"><span>N</span><span>45</span><span>E</span><span>135</span><span>S</span><span>225</span><span>W</span><span>315</span><i></i></div>
    <aside class="drawer">
      <p class="eyebrow">STANDALONE HTML</p><h2>影を比べる</h2>
      <section class="section"><div class="label"><span>太陽の向きを読む</span><small>SUN / AMBIENT</small></div><div class="two"><button class="mode active" id="outdoor">☀ 屋外</button><button class="mode" id="indoor">◐ 屋内</button></div><div class="inputs"><input type="date" id="date" /><input type="time" id="time" /></div><div class="inputs"><input type="number" id="lat" step="0.001" placeholder="緯度" /><input type="number" id="lng" step="0.001" placeholder="経度" /></div></section>
      <section class="section"><div class="label"><span>被写体の姿勢</span><small>POSE</small></div><div class="two" id="poses"><button class="pose active" data-pose="standing">直立</button><button class="pose" data-pose="crouching">しゃがみ</button><button class="pose" data-pose="seated">椅子</button><button class="pose" data-pose="leaning">壁にもたれ</button></div></section>
      <section class="section"><div class="label"><span>ストロボ</span><small>UP TO 3</small></div><div class="lights" id="lightList"></div><div id="lightControls"></div><div class="hint"><strong>フィルを足して影を比べる。</strong>太陽・キーでできた影側にフィル2を配置し、光量を動かして変化を確認します。</div></section>
    </aside>
  </main>
  <script type="module">
    import * as THREE from 'three'; import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    const host=document.querySelector('#scene'), scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(42,1,.1,100), renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.08; host.append(renderer.domElement); camera.position.set(4.4,2.65,5.2);
    const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,1,0); controls.enableDamping=true; controls.maxPolarAngle=Math.PI/2.02;
    const material=new THREE.MeshStandardMaterial({color:'#cbd0cf',roughness:.84});
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:'#aaa89e',roughness:.95}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground,new THREE.HemisphereLight('#dbe7ea','#716d63',.68));
    const wall=new THREE.Mesh(new THREE.PlaneGeometry(4.8,3.4),new THREE.MeshStandardMaterial({color:'#b8b3a9',roughness:.9}));wall.position.set(0,1.7,-1.15);wall.receiveShadow=true;scene.add(wall);
    const sun=new THREE.DirectionalLight('#ffe1a2',2);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=sun.shadow.camera.bottom=-6;sun.shadow.camera.right=sun.shadow.camera.top=6;sun.target.position.set(0,1,0);scene.add(sun,sun.target);
    function limb(a,b,r){const d=new THREE.Vector3().subVectors(b,a),m=new THREE.Mesh(new THREE.CapsuleGeometry(r,Math.max(.04,d.length()-r*2),10,16),material);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.castShadow=true;return m}
    function mannequin(pose){const g=new THREE.Group(),leg=(h,k,a)=>g.add(limb(h,k,.13),limb(k,a,.112)),arm=(s,e,h)=>g.add(limb(s,e,.09),limb(e,h,.075));let p=new THREE.Vector3(0,1,0),s=new THREE.Vector3(0,1.72,0),n=new THREE.Vector3(0,1.93,0),head=new THREE.Vector3(0,2.2,0);if(pose==='standing'){leg(new THREE.Vector3(-.22,1,0),new THREE.Vector3(-.25,.52,.03),new THREE.Vector3(-.25,.09,.08));leg(new THREE.Vector3(.22,1,0),new THREE.Vector3(.25,.52,.03),new THREE.Vector3(.25,.09,.08));arm(new THREE.Vector3(-.34,1.7,0),new THREE.Vector3(-.48,1.22,.02),new THREE.Vector3(-.4,.88,.03));arm(new THREE.Vector3(.34,1.7,0),new THREE.Vector3(.48,1.22,.02),new THREE.Vector3(.4,.88,.03))}if(pose==='crouching'){p.set(0,.88,.08);s.set(0,1.45,-.08);n.set(0,1.64,-.12);head.set(0,1.88,-.16);leg(new THREE.Vector3(-.22,.88,.08),new THREE.Vector3(-.5,.52,.25),new THREE.Vector3(-.32,.1,.48));leg(new THREE.Vector3(.22,.88,.08),new THREE.Vector3(.5,.52,.25),new THREE.Vector3(.32,.1,.48));arm(new THREE.Vector3(-.33,1.43,-.08),new THREE.Vector3(-.58,1.08,.03),new THREE.Vector3(-.45,.76,.16));arm(new THREE.Vector3(.33,1.43,-.08),new THREE.Vector3(.58,1.08,.03),new THREE.Vector3(.45,.76,.16))}if(pose==='seated'){p.set(0,.84,.16);s.set(0,1.5,.12);n.set(0,1.7,.1);head.set(0,1.96,.08);leg(new THREE.Vector3(-.22,.84,.16),new THREE.Vector3(-.22,.57,.72),new THREE.Vector3(-.22,.1,.72));leg(new THREE.Vector3(.22,.84,.16),new THREE.Vector3(.22,.57,.72),new THREE.Vector3(.22,.1,.72));arm(new THREE.Vector3(-.34,1.48,.12),new THREE.Vector3(-.58,1.13,.18),new THREE.Vector3(-.45,.92,.54));arm(new THREE.Vector3(.34,1.48,.12),new THREE.Vector3(.58,1.13,.18),new THREE.Vector3(.45,.92,.54))}if(pose==='leaning'){p.set(0,1.05,.05);s.set(0,1.65,-.3);n.set(0,1.82,-.36);head.set(0,2.08,-.4);leg(new THREE.Vector3(-.22,1.05,.05),new THREE.Vector3(-.32,.55,.18),new THREE.Vector3(-.3,.1,.42));leg(new THREE.Vector3(.22,1.05,.05),new THREE.Vector3(.32,.55,.18),new THREE.Vector3(.3,.1,.42));arm(new THREE.Vector3(-.32,1.64,-.3),new THREE.Vector3(-.67,1.44,-.6),new THREE.Vector3(-.8,1.09,-.75));arm(new THREE.Vector3(.32,1.64,-.3),new THREE.Vector3(.63,1.28,-.51),new THREE.Vector3(.65,.96,-.38))}g.add(limb(p,s,.22),limb(s,n,.13));const h=new THREE.Mesh(new THREE.SphereGeometry(.23,18,16),material);h.position.copy(head);h.castShadow=true;g.add(h);return g}
    let active='key',pose='standing',outdoors=true,model=mannequin(pose);scene.add(model);const data=[{id:'key',label:'ストロボ 1',role:'key',on:true,angle:45,distance:2.2,height:2.4,power:74,softness:62},{id:'fill',label:'フィル 2',role:'fill',on:false,angle:-42,distance:2.8,height:1.65,power:32,softness:78},{id:'rim',label:'リム 3',role:'rim',on:false,angle:152,distance:2.6,height:2.2,power:46,softness:35}];
    const calibrate={key:42,fill:90,rim:50},kits=data.map(()=>{const t=new THREE.Object3D(),l=new THREE.SpotLight('#fff6e7',0,10,Math.PI/5.4,.34,1.45);l.castShadow=true;l.shadow.mapSize.set(512,512);scene.add(l,t);return{l,t}});const color={key:'#67aef5',fill:'#bff4e9',rim:'#b9d3ff'};
    const now=new Date();document.querySelector('#date').value=now.toISOString().slice(0,10);document.querySelector('#time').value='16:30';document.querySelector('#lat').value='35.681';document.querySelector('#lng').value='139.767';
    function calcLight(x){return x.on?calibrate[x.role]*Math.pow(Math.max(0,Math.min(1,x.power/100)),.72):0}function updateScene(){const date=new Date(document.querySelector('#date').value+'T'+document.querySelector('#time').value),lat=+document.querySelector('#lat').value||35.681,lng=+document.querySelector('#lng').value||139.767,pos=window.SunCalc.getPosition(date,lat,lng),alt=pos.altitude*180/Math.PI,azi=(pos.azimuth+Math.PI)*180/Math.PI,a=THREE.MathUtils.degToRad(Math.max(alt,0)),z=THREE.MathUtils.degToRad(azi);sun.position.set(Math.sin(z)*Math.cos(a)*14,Math.max(.2,Math.sin(a)*14),-Math.cos(z)*Math.cos(a)*14);sun.intensity=outdoors&&alt>0?2:0;scene.background=new THREE.Color(outdoors?'#d4d0c7':'#424548');ground.material.color.set(outdoors?'#aaa89e':'#7f7e7a');wall.visible=!outdoors||pose==='leaning';document.querySelector('#solarText').textContent=outdoors?(alt>0?'高度 '+alt.toFixed(0)+'° / 方位 '+azi.toFixed(0)+'°':'太陽は地平線下'):'太陽光を無効化';document.querySelector('#scale i').style.left=Math.min(94,Math.max(6,azi/3.6))+'%';kits.forEach((k,i)=>{const x=data[i],r=THREE.MathUtils.degToRad(x.angle),p=new THREE.Vector3(Math.sin(r)*x.distance,x.height,Math.cos(r)*x.distance);k.l.position.copy(p);k.t.position.set(0,1.3,0);k.l.target=k.t;k.l.intensity=calcLight(x);k.l.decay=x.role==='fill'?1.15:2;k.l.angle=THREE.MathUtils.lerp(.34,.78,x.softness/100);k.l.penumbra=THREE.MathUtils.lerp(.08,.82,x.softness/100)})}
    function renderControls(){const list=document.querySelector('#lightList'),controls=document.querySelector('#lightControls');list.innerHTML='';data.forEach(x=>{const row=document.createElement('div');row.className='light '+(x.id===active?'selected':'');row.innerHTML='<i class="dot '+x.role+'"></i><span>'+x.label+'</span><input type="checkbox" '+(x.on?'checked':'')+' aria-label="'+x.label+'を切り替える">';row.onclick=()=>{active=x.id;renderControls()};row.querySelector('input').onclick=e=>e.stopPropagation();row.querySelector('input').onchange=e=>{x.on=e.target.checked;active=x.id;updateScene();renderControls()};list.append(row)});const x=data.find(v=>v.id===active);controls.innerHTML=['power|光量|0|100|1|%','angle|方向|-180|180|1|°','distance|距離|0.8|5|0.1|m','height|高さ|0.4|4|0.1|m','softness|やわらかさ|0|100|1|%'].map(v=>{const[a,b,min,max,step,suffix]=v.split('|');return '<div class="slider"><div><span>'+b+'</span><strong id="v-'+a+'">'+x[a]+suffix+'</strong></div><input type="range" data-k="'+a+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+x[a]+'"></div>'}).join('');controls.querySelectorAll('input').forEach(el=>el.oninput=e=>{const k=e.target.dataset.k;x[k]=+e.target.value;document.querySelector('#v-'+k).textContent=x[k]+(k==='power'||k==='softness'?'%':k==='angle'?'°':'m');updateScene()})}
    document.querySelectorAll('#poses button').forEach(b=>b.onclick=()=>{pose=b.dataset.pose;scene.remove(model);model=mannequin(pose);scene.add(model);document.querySelectorAll('#poses button').forEach(v=>v.classList.toggle('active',v===b));updateScene()});document.querySelector('#outdoor').onclick=()=>{outdoors=true;document.querySelector('#outdoor').classList.add('active');document.querySelector('#indoor').classList.remove('active');document.querySelector('#modeBadge').textContent='☀ 屋外';updateScene()};document.querySelector('#indoor').onclick=()=>{outdoors=false;document.querySelector('#indoor').classList.add('active');document.querySelector('#outdoor').classList.remove('active');document.querySelector('#modeBadge').textContent='◐ 屋内';updateScene()};document.querySelectorAll('#date,#time,#lat,#lng').forEach(e=>e.oninput=updateScene);
    function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);renderer.setPixelRatio(Math.min(devicePixelRatio,2))}addEventListener('resize',resize);resize();renderControls();updateScene();(function loop(){controls.update();renderer.render(scene,camera);requestAnimationFrame(loop)})();
  </script>
</body>
</html>
