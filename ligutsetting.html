  <style>
    :root{--ink:#171b1d;--panel:#161b1b;--line:rgba(255,255,255,.14);--sun:#e0a83a;--key:#67aef5;--fill:#bff4e9;--muted:#9ba2a1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#171b1d;color:#f6f5f0}button,input{font:inherit}button{border:0;cursor:pointer}.shell{height:100dvh;min-height:620px;background:#1b2021}.scene{position:absolute;inset:0}.scene canvas{display:block;width:100%;height:100%;touch-action:none}.bar{position:absolute;z-index:2;top:16px;left:16px;display:flex;align-items:center;gap:9px}.mark{display:grid;place-items:center;width:34px;height:34px;background:#e7e1d5;color:#171b1d;border-radius:9px;font-weight:800}.title p{margin:0;color:#c6cfc9;font:700 9px ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em}.title h1{margin:1px 0 0;font:700 18px ui-monospace,SFMono-Regular,monospace;letter-spacing:.04em}.badge{display:flex;align-items:center;gap:5px;margin-left:8px;padding:8px 10px;background:rgba(22,27,27,.82);border:1px solid rgba(224,168,58,.5);color:#ffd784;font:700 11px ui-monospace,SFMono-Regular,monospace}.readout{position:absolute;z-index:2;left:16px;top:60px;display:flex;align-items:center;gap:5px;padding:6px 9px;background:rgba(22,27,27,.8);border:1px solid rgba(224,168,58,.4);color:#ffd784;font:700 10px ui-monospace,SFMono-Regular,monospace}.scale{position:absolute;z-index:2;top:98px;left:16px;width:220px;height:18px;display:flex;justify-content:space-between;border-top:1px solid rgba(28,34,33,.45);padding-top:5px;color:#35403d;font:700 8px ui-monospace,SFMono-Regular,monospace}.scale:before{content:"";position:absolute;top:-4px;inset-inline:0;height:4px;background:repeating-linear-gradient(90deg,rgba(30,36,35,.56) 0 1px,transparent 1px 16px)}.scale i{position:absolute;top:-8px;width:2px;height:13px;background:var(--sun)}.drawer{position:absolute;z-index:3;right:0;top:0;bottom:0;width:338px;overflow:auto;padding:24px 20px;background:linear-gradient(140deg,#192020,#111616);border-left:1px solid var(--line);box-shadow:-16px 0 35px rgba(0,0,0,.25)}.eyebrow{margin:0 0 3px;color:#bfc7c3;font:700 9px ui-monospace,SFMono-Regular,monospace;letter-spacing:.1em}.drawer h2{margin:0;font-size:20px;letter-spacing:-.04em}.section{padding:12px 0;border-top:1px solid rgba(255,255,255,.1)}.section:first-of-type{margin-top:17px}.label{display:flex;justify-content:space-between;margin-bottom:9px;font-size:12px;font-weight:700}.label small{color:#87918e;font:500 9px ui-monospace,SFMono-Regular,monospace;letter-spacing:.09em}.two{display:grid;grid-template-columns:1fr 1fr;gap:4px}.mode,.pose{min-height:38px;background:#111616;border:1px solid var(--line);color:#adb6b3;font-size:11px;font-weight:700}.mode.active,.pose.active{border-color:rgba(224,168,58,.65);color:#ffe3a8;background:rgba(224,168,58,.1);box-shadow:inset 0 -2px var(--sun)}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.inputs input{min-width:0;background:#111616;border:1px solid var(--line);color:#ebeee9;padding:7px;font:11px ui-monospace,SFMono-Regular,monospace}.slider{margin:7px 0}.slider div{display:flex;justify-content:space-between;font-size:11px;color:#c6cfcc}.slider strong{color:#e9eff0;font:600 11px ui-monospace,SFMono-Regular,monospace}.slider input{width:100%;accent-color:var(--key)}.sun-range{accent-color:var(--sun)!important}.hidden{display:none}.lights{display:flex;flex-direction:column;gap:5px}.light{display:flex;align-items:center;gap:8px;padding:9px 8px;background:rgba(255,255,255,.025);border:1px solid var(--line);cursor:pointer}.light.selected{border-color:rgba(103,174,245,.7);background:rgba(103,174,245,.1)}.light span{flex:1;font-size:12px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--key)}.fill{background:var(--fill)}.rim{background:#b9d3ff}.light .toggle-wrap{display:flex;align-items:center;gap:6px}.light .toggle-wrap small{font:700 9px ui-monospace,SFMono-Regular,monospace;color:#87918e}.light.enabled .toggle-wrap small{color:#c9e1ff}.light input{accent-color:var(--key);width:16px;height:16px;margin:0}.hint{margin-top:10px;padding:10px;border-left:2px solid var(--sun);background:rgba(0,0,0,.18);color:#d8dcd6;font-size:10px;line-height:1.55}.hint strong{display:block;color:#ffe3a8;font-size:11px}@media(max-width:720px){.drawer{top:auto;left:0;width:auto;height:38dvh;padding:14px}.bar{top:12px;left:12px}.readout{top:52px;left:12px}.scale{top:86px;left:12px}.scene{bottom:33dvh}.drawer h2{font-size:18px}.section{padding:9px 0}.slider{margin:5px 0}}
  </style>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>

<body>
  <main class="shell">
    <div id="scene" class="scene"></div>
    <header class="bar"><div class="mark">◒</div><div class="title"><p>LIGHTING SKETCHBOOK</p><h1>Lightfield</h1></div><span class="badge" id="modeBadge">☀ 屋外</span></header>
    <div class="readout">☉ <strong id="solarText">計算中</strong></div>
    <div class="scale" id="scale"><span>N</span><span>45</span><span>E</span><span>135</span><span>S</span><span>225</span><span>W</span><span>315</span><i></i></div>
    <aside class="drawer">
      <p class="eyebrow">STANDALONE HTML</p><h2>影を比べる</h2>
      <section class="section"><div class="label"><span>太陽の向きを読む</span><small>SUN / AMBIENT</small></div><div class="two"><button class="mode active" data-bg="outdoor">☀ 屋外</button><button class="mode" data-bg="indoor">◐ 屋内</button><button class="mode" data-bg="white">⬜ 白ホリ</button><button class="mode" data-bg="black">⬛ 黒ホリ</button></div><div class="slider hidden" id="mannequinColorRow"><div><span>マネキンの色</span><strong id="v-mannequinColor">#d6d7d2</strong></div><input type="color" id="mannequinColor" value="#d6d7d2" /></div><div class="inputs"><input type="date" id="date" style="grid-column:1/-1" /></div><div class="slider"><div><span>時刻</span><strong id="v-time">16:30</strong></div><input type="range" id="time" class="sun-range" min="0" max="1439" step="1" value="990" /></div><div class="inputs"><input type="number" id="lat" step="0.001" placeholder="緯度" /><input type="number" id="lng" step="0.001" placeholder="経度" /></div></section>
      <section class="section"><div class="label"><span>被写体の姿勢</span><small>POSE</small></div><div class="two" id="poses"><button class="pose active" data-pose="standing">直立</button><button class="pose" data-pose="crouching">しゃがみ</button><button class="pose" data-pose="seated">椅子</button><button class="pose" data-pose="leaning">壁にもたれ</button><button class="pose" data-pose="armsCrossed" style="grid-column:1/-1">腕組み</button></div></section>
      <section class="section"><div class="label"><span>カメラの露出</span><small>ISO / F / SHUTTER</small></div><div class="slider"><div><span>ISO感度</span><strong id="v-iso">400</strong></div><input type="range" id="isoR" min="0" max="9" step="1" value="3" /></div><div class="slider"><div><span>絞り</span><strong id="v-fstop">F4</strong></div><input type="range" id="fstopR" min="0" max="10" step="1" value="4" /></div><div class="slider"><div><span>シャッター速度</span><strong id="v-shutter">1/125</strong></div><input type="range" id="shutterR" class="sun-range" min="0" max="11" step="1" value="5" /></div><div class="hint" id="expoReadout"></div></section>
      <section class="section"><div class="label"><span>ストロボ</span><small>UP TO 3</small></div><button class="mode active" id="markerToggle" style="width:100%;margin-bottom:8px">● 位置マーカー表示</button><div class="lights" id="lightList"></div><div id="lightControls"></div><div class="hint"><strong>フィルを足して影を比べる。</strong>太陽・キーでできた影側にフィル2を配置し、光量を動かして変化を確認します。</div></section>
    </aside>
  </main>
  <script type="module">
    import * as THREE from 'three'; import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    const host=document.querySelector('#scene'), scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(42,1,.1,100), renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.08; host.append(renderer.domElement); camera.position.set(4.4,2.65,5.2);
    const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,1,0); controls.enableDamping=true; controls.maxPolarAngle=Math.PI/2.02;
    const material=new THREE.MeshStandardMaterial({color:'#d6d7d2',roughness:.76,metalness:.015});
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:'#aaa89e',roughness:.95}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;const hemi=new THREE.HemisphereLight('#dbe7ea','#716d63',.68);scene.add(ground,hemi);
    const wall=new THREE.Mesh(new THREE.PlaneGeometry(9,5),new THREE.MeshStandardMaterial({color:'#b8b3a9',roughness:.9}));wall.position.set(0,2.5,-1.15);wall.receiveShadow=true;scene.add(wall);
    const chair=new THREE.Mesh(new THREE.BoxGeometry(.5,.46,.5),new THREE.MeshStandardMaterial({color:'#8b8985',roughness:.85}));chair.position.set(0,.23,.14);chair.castShadow=true;chair.receiveShadow=true;scene.add(chair);
    const sun=new THREE.DirectionalLight('#ffe1a2',2);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=sun.shadow.camera.bottom=-6;sun.shadow.camera.right=sun.shadow.camera.top=6;sun.target.position.set(0,1,0);scene.add(sun,sun.target);
    /* ======================================================================
       撮影用マネキン — 人体モデル生成システム
       比率(P) → 骨格(buildSkeleton) → ポーズ(POSES) → 断面ロフト(loft) → 面
       この区画だけが人体形状を担当する。ライト/影/UI/太陽計算とは独立。
       ====================================================================== */

    const MAN_HEIGHT = 1.80;                        // 全高[m]。寸法は全て全高=1.0の比率で保持しここで実寸化する

    // --- STEP 1: 人体比率（すべて全高=1.0 に正規化） ----------------------
    const P = {
      // 基準高さ（床からの比率）
      CROWN:0.998, CHIN:0.862, SKULL_BASE:0.892, NECK:0.872,
      NECK_ROOT:0.848, GIRDLE:0.818, SHOULDER_J:0.805, CHEST:0.740, RIB:0.700,
      ABDOMEN:0.665, WAIST:0.625, HIP:0.530, CROTCH:0.470,
      ELBOW:0.625, WRIST:0.485, KNEE:0.285, ANKLE:0.039,
      // 左右オフセット（関節位置）
      SHOULDER_X:0.087, HIP_X:0.048,
      // 頭部の左右／前後の半値（上下は CROWN と CHIN から導出する）
      HEAD_W:0.047, HEAD_D:0.059,
      // 足
      FOOT_LEN:0.143, HEEL_LEN:0.027, FOOT_W:0.031
    };
    // 骨長は比率から導出する。ポーズが変わってもこの値は不変（STEP 22 の保証）
    P.THIGH      = P.HIP - P.KNEE;          // 大腿
    P.SHANK      = P.KNEE - P.ANKLE;        // 下腿
    P.UPPER_ARM  = P.SHOULDER_J - P.ELBOW;  // 上腕
    P.FOREARM    = P.ELBOW - P.WRIST;       // 前腕
    P.HAND       = 0.098;                   // 手
    P.HEAD_C     = (P.CROWN+P.CHIN)/2;      // 頭部中心の高さ
    P.HEAD_H     = (P.CROWN-P.CHIN)/2;      // 頭部の上下半値

    const H = MAN_HEIGHT, D2R = Math.PI/180;
    const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);

    // --- 断面テーブル -------------------------------------------------------
    // 各 station = { y:高さ比率, z:前後オフセット, w:左右半幅, dF:前方厚み, dB:後方厚み, n:超楕円指数 }
    // 胸・腹・腰・骨盤・肩甲帯・首はすべて「1本のロフトの station」であり独立オブジェクトではない
    const TRUNK = [
      // 下端は大腿と同じ断面まで絞り込み、開いたまま大腿ロフトの内側で終わらせる
      // station はほぼ等間隔に置く。間隔が急に詰まると平滑化が効かず横筋が出る。
      // 下端は左右の大腿が十分重なる高さで開いたまま終わらせ、股間のVは大腿の内側面が作る
      { y:P.CROTCH,    z: 0.004, w:0.0850,dF:0.043, dB:0.046, n:2.1, sep:0.046, pinch:0.76 },
      { y:0.487,       z: 0.002, w:0.0965,dF:0.054, dB:0.061, n:2.1, sep:0.040, pinch:0.55 },
      { y:0.504,       z: 0.000, w:0.1025,dF:0.061, dB:0.070, n:2.2, sep:0.030, pinch:0.36 },  // 骨盤の最大幅（大転子）
      { y:0.522,       z:-0.003, w:0.1050,dF:0.066, dB:0.077, n:2.2, sep:0.019, pinch:0.20 },  // 臀部の最大厚み
      { y:0.545,       z:-0.001, w:0.1010,dF:0.067, dB:0.074, n:2.3, sep:0.008, pinch:0.07 },
      { y:0.572,       z: 0.004, w:0.0910,dF:0.066, dB:0.062, n:2.3 },
      { y:0.600,       z: 0.007, w:0.0845,dF:0.064, dB:0.056, n:2.4 },
      { y:P.WAIST,     z: 0.008, w:0.081, dF:0.062, dB:0.054, n:2.4 },  // 腰（最も細い）
      { y:P.ABDOMEN,   z: 0.005, w:0.084, dF:0.067, dB:0.056, n:2.4 },  // 腹
      { y:P.RIB,       z: 0.000, w:0.088, dF:0.071, dB:0.060, n:2.5 },  // 上腹／肋骨下端
      { y:P.CHEST,     z:-0.004, w:0.088, dF:0.073, dB:0.063, n:2.5 },  // 胸郭（前方に厚い）
      { y:0.782,       z:-0.008, w:0.089, dF:0.067, dB:0.065, n:2.5 },  // 胸郭上部（胴体の最大幅）
      { y:0.806,       z:-0.009, w:0.086, dF:0.061, dB:0.063, n:2.5 },
      { y:P.GIRDLE,    z:-0.010, w:0.080, dF:0.057, dB:0.061, n:2.4 },  // 肩甲帯（肩幅は腕側の三角筋が作る）
      { y:0.834,       z:-0.011, w:0.066, dF:0.047, dB:0.055, n:2.3 },  // 僧帽筋の傾斜
      { y:P.NECK_ROOT, z:-0.010, w:0.048, dF:0.040, dB:0.048, n:2.2 },  // 胸郭→首へ連続して細くなる
      { y:P.NECK,      z:-0.005, w:0.033, dF:0.031, dB:0.035, n:2.1 },  // 首
      { y:P.SKULL_BASE,z:-0.002, w:0.031, dF:0.029, dB:0.034, n:2.0 }   // 頭蓋底（頭部と重なって連続する）
    ];

    // 脚: t は 大腿(0→1) / 下腿(0→1)。断面の前後差でふくらはぎの膨らみを作る
    const LEG = [
      { seg:'thigh', t: 0.05, w:0.0535,dF:0.052, dB:0.069, n:2.2 },  // 骨盤の中で開いたまま始める（後面は臀部へつなぐ）
      { seg:'thigh', t: 0.20, w:0.0518,dF:0.051, dB:0.058, n:2.2 },  // 大腿上部（太い）
      { seg:'thigh', t: 0.42, w:0.0470,dF:0.047, dB:0.048, n:2.2 },
      { seg:'thigh', t: 0.68, w:0.041, dF:0.041, dB:0.042, n:2.2 },
      { seg:'thigh', t: 0.93, w:0.034, dF:0.036, dB:0.034, n:2.3 },  // 膝上（細くなる）
      { seg:'shank', t: 0.02, w:0.036, dF:0.037, dB:0.031, n:2.5 },  // 膝（横に広く後面は扁平）
      { seg:'shank', t: 0.18, w:0.036, dF:0.031, dB:0.044, n:2.2 },  // ふくらはぎ（後方に膨らむ）
      { seg:'shank', t: 0.40, w:0.032, dF:0.028, dB:0.037, n:2.2 },
      { seg:'shank', t: 0.70, w:0.024, dF:0.023, dB:0.026, n:2.2 },
      { seg:'shank', t: 1.00, w:0.019, dF:0.020, dB:0.022, n:2.2 }   // 足首
    ];

    // 腕: t は 上腕(0→1) / 前腕(0→1) / 手(0→1)。肩甲帯の中から始めて三角筋の丸みを作る
    const ARM = [
      { seg:'upper', t:-0.03, ox:-0.017, w:0.032, dF:0.033, dB:0.033, n:2.2 },  // 肩甲帯の中から立ち上げる
      { seg:'upper', t: 0.03, w:0.042, dF:0.042, dB:0.042, n:2.2 },  // 三角筋（肩の丸み）
      { seg:'upper', t: 0.26, w:0.037, dF:0.037, dB:0.038, n:2.2 },  // 上腕（肩側が太い）
      { seg:'upper', t: 0.60, w:0.029, dF:0.029, dB:0.030, n:2.2 },
      { seg:'upper', t: 0.92, w:0.025, dF:0.025, dB:0.025, n:2.3 },  // 肘の手前で細くなる
      { seg:'fore',  t: 0.04, w:0.026, dF:0.025, dB:0.026, n:2.4 },  // 肘
      { seg:'fore',  t: 0.26, w:0.026, dF:0.025, dB:0.027, n:2.2 },  // 前腕の膨らみ
      { seg:'fore',  t: 0.62, w:0.021, dF:0.020, dB:0.021, n:2.2 },
      { seg:'fore',  t: 1.00, w:0.015, dF:0.013, dB:0.014, n:2.3 },  // 手首（細い）
      { seg:'hand',  t: 0.30, w:0.014, dF:0.025, dB:0.023, n:2.7 },  // 手（扁平な板・手のひらは体側を向く）
      { seg:'hand',  t: 0.72, w:0.013, dF:0.024, dB:0.021, n:2.7 },
      { seg:'hand',  t: 1.00, w:0.008, dF:0.016, dB:0.014, n:2.7 }
    ];

    /* ----------------------------------------------------------------------
       STEP 3: 断面ロフト
       背骨ポリラインに沿って断面リングを押し出し、連続した1枚の面を作る。
       球やカプセルは使わない。
       ---------------------------------------------------------------------- */

    // 非一様（弦長パラメータ化）Catmull-Rom。Barry-Goldman 形。
    // station の間隔が不均一でも行き過ぎず、背骨が逆行して面が折り返すのを防ぐ
    function crNU(t0,t1,t2,t3,p0,p1,p2,p3,t){
      const L=(ta,tb,pa,pb)=>{const d=tb-ta;return Math.abs(d)<1e-9?pa:((tb-t)*pa+(t-ta)*pb)/d;};
      const a1=L(t0,t1,p0,p1), a2=L(t1,t2,p1,p2), a3=L(t2,t3,p2,p3);
      const b1=L(t0,t2,a1,a2), b2=L(t1,t3,a2,a3);
      return L(t1,t2,b1,b2);
    }
    // stations から「弦長ノット」と、そのノット上での補間関数を作る
    function splineOf(stations){
      const N=stations.length, kn=[0];
      for(let i=1;i<N;i++) kn[i]=kn[i-1]+Math.max(1e-4,Math.sqrt(stations[i].p.distanceTo(stations[i-1].p)));
      const knot=i=>i<0?2*kn[0]-kn[1]:i>N-1?2*kn[N-1]-kn[N-2]:kn[i];
      const at=(u,get)=>{
        let i=0; while(i<N-2&&kn[i+1]<u) i++;
        const g=k=>get(stations[Math.min(N-1,Math.max(0,k))]);
        return crNU(knot(i-1),knot(i),knot(i+1),knot(i+2),g(i-1),g(i),g(i+1),g(i+2),u);
      };
      return {total:kn[N-1],at};
    }

    // 超楕円断面（前後非対称）。n が大きいほど角張り、2 で楕円。
    // 極角でパラメータ化した radial superellipse なので、頂点が円周に均等に載る。
    // sep   : 断面を左右2つの葉に割る量（骨盤→大腿の移行に使う）
    // pinch : 中央（前面・背面）を凹ませる量。臀部の谷と股間の溝を作る
    function ringPoint(theta,w,dF,dB,n,sep,pinch){
      sep=sep||0; pinch=pinch||0;
      const c=Math.cos(theta), s=Math.sin(theta), wc=Math.max(1e-4,w-sep);
      const k=Math.pow(Math.pow(Math.abs(c),n)+Math.pow(Math.abs(s),n),-1/n);
      const dMid=(dF+dB)/2, dAsym=(dF-dB)/2;
      let a=wc*c*k, b=(dMid+dAsym*s)*s*k;
      if(sep>0) a+=sep*Math.tanh(a/(0.35*wc));      // 連続なまま左右へ寄せる
      if(pinch>0){ const t=a/w/0.32; b*=1-pinch*Math.exp(-t*t); }
      return [a,b];
    }

    /**
     * stations: [{p:Vector3, w, dF, dB, n}]（近位→遠位）
     * opts: { seg:分割数, radial:円周分割, capStart, capEnd, front:初期前方ベクトル }
     */
    function loft(stations,opts){
      opts=opts||{};
      const RAD=opts.radial||28, SEG=opts.seg||(stations.length-1)*6;
      const capS=opts.capStart!==false, capE=opts.capEnd!==false;
      const front=opts.front||V3(0,0,1);
      const sp=splineOf(stations);

      // 1) 背骨と断面パラメータをサンプリング
      const pts=[],prm=[];
      for(let i=0;i<=SEG;i++){
        const u=sp.total*i/SEG;
        pts.push(V3(sp.at(u,s=>s.p.x),sp.at(u,s=>s.p.y),sp.at(u,s=>s.p.z)));
        prm.push({
          w:sp.at(u,s=>s.w), dF:sp.at(u,s=>s.dF),
          dB:sp.at(u,s=>s.dB), n:sp.at(u,s=>s.n),
          sep:sp.at(u,s=>s.sep||0), pinch:sp.at(u,s=>s.pinch||0)
        });
      }
      // 1b) 断面パラメータを平滑化する。
      //     Catmull-Rom は節点で曲率が不連続になり、滑らかな面に横縞の陰影が出るため。
      const relax=(key,passes)=>{
        for(let k=0;k<passes;k++){
          const a=prm.map(o=>o[key]);
          for(let i=1;i<SEG;i++) prm[i][key]=0.25*a[i-1]+0.5*a[i]+0.25*a[i+1];
        }
      };
      ['w','dF','dB','n','sep','pinch'].forEach(k=>relax(k,16));

      // 2) 平行移動フレーム（ねじれ防止）
      const T=[],B=[],N=[];
      for(let i=0;i<=SEG;i++){
        const a=pts[Math.max(0,i-1)], b=pts[Math.min(SEG,i+1)];
        T.push(V3().subVectors(b,a).normalize());
      }
      B[0]=V3().copy(front).addScaledVector(T[0],-front.dot(T[0]));
      if(B[0].lengthSq()<1e-8) B[0].set(1,0,0).addScaledVector(T[0],-T[0].x);
      B[0].normalize();
      for(let i=1;i<=SEG;i++){
        const q=new THREE.Quaternion().setFromUnitVectors(T[i-1],T[i]);
        B[i]=B[i-1].clone().applyQuaternion(q).normalize();
      }
      for(let i=0;i<=SEG;i++) N[i]=V3().crossVectors(T[i],B[i]).normalize();

      // 3) 頂点生成（継ぎ目は頂点を共有するので法線が割れない）
      const pos=[],idx=[];
      const push=(v)=>{pos.push(v.x,v.y,v.z);return pos.length/3-1;};
      const rings=[];
      const makeRing=(i,scale,slide)=>{
        const row=[],c=pts[i].clone().addScaledVector(T[i],slide||0);
        for(let j=0;j<RAD;j++){
          const th=j/RAD*Math.PI*2;
          const[a,b]=ringPoint(th,prm[i].w*scale,prm[i].dF*scale,prm[i].dB*scale,prm[i].n,Math.max(0,prm[i].sep)*scale,Math.max(0,prm[i].pinch));
          row.push(push(V3().copy(c).addScaledVector(N[i],a).addScaledVector(B[i],b)));
        }
        return row;
      };
      // 開始側の丸めキャップ
      if(capS){
        const r0=Math.min(prm[0].w,(prm[0].dF+prm[0].dB)/2);
        const CS=8;
        for(let k=CS;k>=1;k--){
          const a=k/CS*Math.PI/2;
          rings.push(makeRing(0,Math.cos(a),-Math.sin(a)*r0));
        }
      }
      for(let i=0;i<=SEG;i++) rings.push(makeRing(i,1,0));
      if(capE){
        const r1=Math.min(prm[SEG].w,(prm[SEG].dF+prm[SEG].dB)/2);
        const CS=8;
        for(let k=1;k<=CS;k++){
          const a=k/CS*Math.PI/2;
          rings.push(makeRing(SEG,Math.cos(a),Math.sin(a)*r1));
        }
      }
      for(let r=0;r<rings.length-1;r++){
        for(let j=0;j<RAD;j++){
          const j2=(j+1)%RAD, a=rings[r][j], b=rings[r][j2], c=rings[r+1][j2], d=rings[r+1][j];
          idx.push(a,d,b, b,d,c);
        }
      }
      const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }

    /* ----------------------------------------------------------------------
       STEP 2: 骨格
       standing を基準に、ポーズは関節角として与える。
       骨長 × 方向ベクトルの前進計算なので、どのポーズでも骨長は変化しない。
       ---------------------------------------------------------------------- */

    // 下向き(0,-1,0)を基準に pitch(前が正) / abduct(外側が正) で方向を作る
    function dir(pitch,abduct,side){
      const v=V3(0,-1,0);
      v.applyAxisAngle(V3(0,0,1),side*abduct*D2R);
      v.applyAxisAngle(V3(1,0,0),-pitch*D2R);
      return v;
    }

    // 4姿勢。人体そのものは作り直さず、この角度だけが変わる
    const POSES = {
      standing : { rootY:P.HIP, rootZ: 0.00, spine:  2, head: 0,
                   hip: -1, knee:  3, ankle:  0, footPitch: 0,
                   armPitch:  3, armAbduct:  9, elbow:  6, wristPitch: 4 },
      crouching: { rootY:0.215, rootZ: 0.05, spine: 46, head:-40,
                   hip:104, knee:-146, ankle: 40, footPitch: 0,
                   armPitch: 40, armAbduct:-16, elbow:108, wristPitch: 62 },
      seated   : { rootY:0.300, rootZ:-0.02, spine:  6, head: -5,
                   hip: 86, knee:-86, ankle:  2, footPitch: 0,
                   armPitch:  8, armAbduct: 16, elbow: 32, wristPitch: 6 },
      leaning  : { rootY:P.HIP-0.012, rootZ:-0.54, spine: -8, head:  6,
                   // 支持脚(R)は直立寄り。逃がす脚(L)は前を通って交差させる（壁にもたれる体重移動）
                   hip: -1, knee:  3, ankle:  0, footPitch: 0,
                   hipL: 26, kneeL:-38, ankleL: 0, footPitchL: 0,
                   hipAbductL:-22, kneeAbductL:-10,
                   // 支持脚側の腕(R)は背中の後ろに回す。逃がす脚側の腕(L)は軽く曲げて腰の高さに寄せる（上背部を壁に預ける）
                   armPitch:  6, armAbduct: 10, elbow: 10, wristPitch: 4,
                   armPitchR: -9, armAbductR: -9, elbowR: 22, wristPitchR:-15,
                   armPitchL: 12, armAbductL:-18, elbowL: 20, wristPitchL: 8 },
      armsCrossed: { rootY:P.HIP, rootZ: 0.00, spine:  2, head: 0,
                   // 支持脚(L)は直立のまま。右脚(R)だけ軽く膝を緩めた寛いだ立ち方にする
                   hip: -1, knee:  3, ankle:  0, footPitch: 0,
                   hipR:  8, kneeR:-18,
                   // elbowAbduct で前腕だけをほぼ真横に倒し、上腹部の前で左右の前腕を重ねる。
                   // 手は前腕の延長のまま反対側の肘まで届かせる（wristAbduct を同値にする）
                   armPitch: 26, armAbduct:  9, elbow: 60, wristPitch: 0,
                   elbowAbduct:-84, wristAbduct:-84,
                   // 右腕を上・手前、左腕を下・奥にして重なりを作る
                   armPitchR: 32, elbowR: 58,
                   armPitchL: 22, elbowL: 68 }
    };

    /**
     * 胴体チェーン: 骨盤(HIP)を基点に、上へ行くほど脊柱の回転を強める。
     * 各セグメントは長さを保ったまま回されるので、胴体長はポーズで変わらない。
     */
    function bendTrunk(pose){
      const root=V3(0,pose.rootY*H,pose.rootZ*H);
      const top=P.SKULL_BASE-P.HIP;
      const ease=y=>{const t=THREE.MathUtils.clamp(y/top,0,1);return t*t*(3-2*t);};
      const local=TRUNK.map(s=>({s,l:V3(0,(s.y-P.HIP)*H,s.z*H),a:pose.spine*ease(s.y-P.HIP)*D2R}));
      let anchor=0;
      for(let i=1;i<local.length;i++) if(Math.abs(local[i].s.y-P.HIP)<Math.abs(local[anchor].s.y-P.HIP)) anchor=i;
      const out=new Array(local.length);
      out[anchor]={p:root.clone(),a:local[anchor].a};
      const rot=(v,a)=>v.clone().applyAxisAngle(V3(1,0,0),a);   // 正の角度で前傾する
      for(let i=anchor+1;i<local.length;i++){
        const d=V3().subVectors(local[i].l,local[i-1].l);
        out[i]={p:out[i-1].p.clone().add(rot(d,local[i].a)),a:local[i].a};
      }
      for(let i=anchor-1;i>=0;i--){
        const d=V3().subVectors(local[i].l,local[i+1].l);
        out[i]={p:out[i+1].p.clone().add(rot(d,local[i].a)),a:local[i].a};
      }
      return out;
    }
    // 胴体チェーン上の任意の高さの位置と回転を取り出す
    function atHeight(chain,y){
      for(let i=0;i<chain.length-1;i++){
        const a=TRUNK[i].y,b=TRUNK[i+1].y;
        if(y>=a&&y<=b){
          const f=(y-a)/(b-a);
          return {p:chain[i].p.clone().lerp(chain[i+1].p,f),a:THREE.MathUtils.lerp(chain[i].a,chain[i+1].a,f)};
        }
      }
      return {p:chain[chain.length-1].p.clone(),a:chain[chain.length-1].a};
    }

    /** 骨格生成: 名前付きジョイント一式を返す */
    function buildSkeleton(poseName){
      const q=POSES[poseName]||POSES.standing, chain=bendTrunk(q), J={_chain:chain,_pose:q};
      const off=(base,x,y,z)=>base.p.clone().add(V3(x,y,z).applyAxisAngle(V3(1,0,0),base.a));

      const pelvis=atHeight(chain,P.HIP), girdle=atHeight(chain,P.GIRDLE), skull=atHeight(chain,P.SKULL_BASE);
      J.pelvis=pelvis.p.clone();
      J.chest=atHeight(chain,P.CHEST).p.clone();
      J.neck=atHeight(chain,P.NECK).p.clone();
      J.head=off(skull,0,(P.HEAD_C-P.SKULL_BASE)*H,-0.004*H);
      J.headAngle=skull.a+q.head*D2R;

      [['L',-1],['R',1]].forEach(([S,sg])=>{
        // 左右非対称ポーズ用：q.xxxL/xxxR があればそちらを優先し、無ければ左右共通のq.xxxを使う
        const o=k=>q[k+S]??q[k];
        const qHip=o('hip'), qKnee=o('knee'), qFootPitch=o('footPitch');
        const qHipAbduct=q['hipAbduct'+S]??1.2, qKneeAbduct=q['kneeAbduct'+S]??0.6;
        const qArmPitch=o('armPitch'), qArmAbduct=o('armAbduct'), qElbow=o('elbow'), qWristPitch=o('wristPitch');
        // 前腕・手の外転は既定では上腕の0.5倍/0.3倍。腕組みのように前腕だけ体の前へ倒す場合は個別に上書きする
        const qElbowAbduct=q['elbowAbduct'+S]??q.elbowAbduct??qArmAbduct*0.5, qWristAbduct=q['wristAbduct'+S]??q.wristAbduct??qArmAbduct*0.3;
        // 脚: 股関節 → 膝 → 足首 → 爪先（固定骨長のFK）
        const hip=off(pelvis,sg*P.HIP_X*H,-0.006*H,0);
        const knee=hip.clone().addScaledVector(dir(qHip,qHipAbduct,sg),P.THIGH*H);
        const ankle=knee.clone().addScaledVector(dir(qHip+qKnee,qKneeAbduct,sg),P.SHANK*H);
        const toe=ankle.clone().add(V3(0,0,1).applyAxisAngle(V3(1,0,0),-qFootPitch*D2R).multiplyScalar((P.FOOT_LEN-P.HEEL_LEN)*H));
        J['hip'+S]=hip; J['knee'+S]=knee; J['ankle'+S]=ankle; J['foot'+S]=toe;
        // 腕: 肩 → 肘 → 手首 → 手
        const sh=off(girdle,sg*P.SHOULDER_X*H,(P.SHOULDER_J-P.GIRDLE)*H,0.004*H);
        const el=sh.clone().addScaledVector(dir(qArmPitch,qArmAbduct,sg),P.UPPER_ARM*H);
        const wr=el.clone().addScaledVector(dir(qArmPitch+qElbow,qElbowAbduct,sg),P.FOREARM*H);
        const hd=wr.clone().addScaledVector(dir(qArmPitch+qElbow+qWristPitch,qWristAbduct,sg),P.HAND*H);
        J['shoulder'+S]=sh; J['elbow'+S]=el; J['hand'+S]=hd; J['wrist'+S]=wr;
      });
      return J;
    }

    /* ----------------------------------------------------------------------
       STEP 4-9: ボリューム生成
       ---------------------------------------------------------------------- */

    // 胴体: 骨盤 → 腰 → 腹 → 胸郭 → 肩甲帯 → 首 → 頭蓋底 を1本のロフトで作る
    function buildTrunk(J){
      const stations=J._chain.map((c,i)=>({p:c.p.clone(),w:TRUNK[i].w*H,dF:TRUNK[i].dF*H,dB:TRUNK[i].dB*H,n:TRUNK[i].n,sep:(TRUNK[i].sep||0)*H,pinch:TRUNK[i].pinch||0}));
      return loft(stations,{radial:36,seg:140,capStart:false});
    }

    // 脚: 股関節 → 大腿 → 膝 → ふくらはぎ → 足首 を1本のロフトで作る
    function buildLeg(J,S){
      const hip=J['hip'+S],knee=J['knee'+S],ankle=J['ankle'+S];
      const sg=S==='L'?-1:1;
      const stations=LEG.map(s=>{
        const a=s.seg==='thigh'?hip:knee, b=s.seg==='thigh'?knee:ankle;
        const p=a.clone().lerp(b,s.t);
        if(s.ox) p.x+=sg*s.ox*H;   // 骨盤側は内側へ寄せて腰との段差をなくす
        return {p,w:s.w*H,dF:s.dF*H,dB:s.dB*H,n:s.n};
      });
      return loft(stations,{radial:26,seg:64,capStart:false});
    }

    // 腕: 肩甲帯の内側 → 三角筋 → 上腕 → 肘 → 前腕 → 手首 → 手 を1本のロフトで作る
    function buildArm(J,S){
      const sh=J['shoulder'+S],el=J['elbow'+S],wr=J['wrist'+S],hd=J['hand'+S];
      const pair={upper:[sh,el],fore:[el,wr],hand:[wr,hd]};
      const sg=S==='L'?-1:1;
      const stations=ARM.map(s=>{
        const[a,b]=pair[s.seg];
        const p=a.clone().lerp(b,s.t);
        if(s.ox) p.x+=sg*s.ox*H;   // 付け根は内側へ寄せ、開口を胴体の中に隠す
        return {p,w:s.w*H,dF:s.dF*H,dB:s.dB*H,n:s.n};
      });
      return loft(stations,{radial:22,seg:60});
    }

    /* ----------------------------------------------------------------------
       STEP 13-17: 頭部
       頭蓋と顔面を1枚の連続した面として生成する。
       目玉・眉毛・唇・鼻を別Geometryで貼らない。すべて同じ面の変位で作る。
       ---------------------------------------------------------------------- */
    function buildHead(){
      const RU=52, RV=40;
      const HW=P.HEAD_W*H, HH=P.HEAD_H*H, HD=P.HEAD_D*H, S=H/1.8;
      const gauss=(v,c,s)=>Math.exp(-((v-c)/s)*((v-c)/s));
      const smooth=(a,b,t)=>{const x=THREE.MathUtils.clamp((t-a)/(b-a),0,1);return x*x*(3-2*x);};
      const pos=[],idx=[];
      for(let iv=0;iv<=RV;iv++){
        const phi=iv/RV*Math.PI, uy=Math.cos(phi), ur=Math.sin(phi);
        for(let iu=0;iu<RU;iu++){
          const th=iu/RU*Math.PI*2;                 // th=0 が正面(+Z)
          const ux=ur*Math.sin(th), uz=ur*Math.cos(th);
          let px=ux*HW, py=uy*HH, pz=uz*HD;

          // 頭蓋: 下方を顎に向かって絞る／後頭部をわずかに膨らませる
          const jaw=smooth(-0.26,-0.98,uy);
          px*=1-0.36*jaw;
          if(pz<0){ pz*=(1-0.30*jaw)*(1+0.07*gauss(uy,0.12,0.55)); }
          else {                                     // 顔面は球より平らな「面」にする
            const face=Math.max(0,uz)*smooth(0.44,0.02,uy);   // 眉から下の顔面
            pz*=(1-0.20*jaw)*(1-0.09*Math.max(0,uz)-0.11*face);
          }

          // 顔の座標（-1..1）。正面ほど効き、側面へ滑らかに消える
          const fx=px/HW, fy=py/HH, fw=Math.max(0,uz);
          let d=0;
          d+=0.0105*gauss(fy,0.13,0.10)*gauss(fx,0,0.60);                        // 眉骨
          d-=0.0105*(gauss(fx,0.42,0.21)+gauss(fx,-0.42,0.21))*gauss(fy,0.00,0.13);  // 眼窩（浅い後退）
          d+=0.0275*gauss(fx,0,0.12)*smooth(0.26,-0.04,fy)*smooth(-0.42,-0.26,fy);   // 鼻根→鼻梁→鼻先
          d+=0.0070*(gauss(fx,0.150,0.08)+gauss(fx,-0.150,0.08))*gauss(fy,-0.29,0.07); // 小鼻
          d+=0.0090*(gauss(fx,0.54,0.30)+gauss(fx,-0.54,0.30))*gauss(fy,-0.20,0.26);   // 頬
          d-=0.0055*gauss(fy,-0.52,0.11)*gauss(fx,0,0.34);                       // 口元（わずかな後退）
          d+=0.0095*gauss(fy,-0.84,0.15)*gauss(fx,0,0.30);                       // 顎の丸み
          pz+=d*S*fw;

          pos.push(px,py,pz);
        }
      }
      for(let iv=0;iv<RV;iv++)for(let iu=0;iu<RU;iu++){
        const a=iv*RU+iu,b=iv*RU+(iu+1)%RU,c=(iv+1)*RU+(iu+1)%RU,e=(iv+1)*RU+iu;
        idx.push(a,e,b, b,e,c);
      }
      const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }

    // 足: 踵 → 甲 → 爪先
    function buildFoot(J,S){
      const ankle=J['ankle'+S],toe=J['foot'+S];
      const fwd=V3().subVectors(toe,ankle).setY(0).normalize();
      const p=(fz,fy)=>ankle.clone().addScaledVector(fwd,fz*H).add(V3(0,fy*H,0));
      const stations=[
        {p:p(-P.HEEL_LEN,0.010),      w:0.022,dF:0.018,dB:0.018,n:2.3},
        {p:p(-P.HEEL_LEN*0.3,-0.005), w:0.027,dF:0.024,dB:0.024,n:2.4},
        {p:p(0.022,-0.019),           w:0.030,dF:0.022,dB:0.022,n:2.5},
        {p:p(0.072,-0.026),           w:P.FOOT_W,dF:0.014,dB:0.014,n:2.6},
        {p:p(P.FOOT_LEN-P.HEEL_LEN,-0.028), w:0.024,dF:0.009,dB:0.009,n:2.6}
      ].map(s=>({p:s.p,w:s.w*H,dF:s.dF*H,dB:s.dB*H,n:s.n}));
      return loft(stations,{radial:22,seg:40,front:V3(0,1,0)});
    }

    /* ----------------------------------------------------------------------
       組み立て
       ---------------------------------------------------------------------- */
    const meshCache={};
    function buildMannequin(poseName){
      const g=new THREE.Group(), J=buildSkeleton(poseName);
      // 影は落とすが自身では受けない（曲面が細かいため、受影にするとシャドウアクネが出る）
      const add=geo=>{const m=new THREE.Mesh(geo,material);m.castShadow=true;g.add(m);};
      add(buildTrunk(J));
      ['L','R'].forEach(S=>{add(buildLeg(J,S));add(buildFoot(J,S));add(buildArm(J,S));});
      const head=new THREE.Mesh(buildHead(),material);
      head.position.copy(J.head); head.rotation.x=J.headAngle;
      head.castShadow=true; g.add(head);
      // 接地: どのポーズでも最下点が床(y=0)に来るようにする
      const box=new THREE.Box3().setFromObject(g);
      g.position.y=-box.min.y;
      return g;
    }
    function mannequin(pose){
      return meshCache[pose]||(meshCache[pose]=buildMannequin(pose));
    }
    let active='key',pose='standing',bgMode='outdoor',manualMannequinColor=false,showMarkers=true,model=mannequin(pose);scene.add(model);
    const BG_PRESET={
      outdoor:{ground:'#aaa89e',wall:'#b8b3a9',bg:'#d4d0c7',hemiGround:'#716d63',mannequin:'#d6d7d2'},
      indoor :{ground:'#7f7e7a',wall:'#8b8985',bg:'#424548',hemiGround:'#5a5a58',mannequin:'#d6d7d2'},
      white  :{ground:'#eeeeea',wall:'#eeeeea',bg:'#f0f0ec',hemiGround:'#cfcfc9',mannequin:'#8f8f8b'},
      black  :{ground:'#141414',wall:'#141414',bg:'#101010',hemiGround:'#0c0c0c',mannequin:'#d6d7d2'}
    };
    const data=[{id:'key',label:'ストロボ 1',role:'key',on:true,angle:45,distance:2.2,height:2.4,gn:60,powerStop:8,zoom:1,softness:62},{id:'fill',label:'フィル 2',role:'fill',on:false,angle:-42,distance:2.8,height:1.65,gn:60,powerStop:8,zoom:0,softness:78},{id:'rim',label:'リム 3',role:'rim',on:false,angle:152,distance:2.6,height:2.2,gn:60,powerStop:8,zoom:2,softness:35}];
    const POWER_STOPS=['1/1','1/2','1/4','1/8','1/16','1/32','1/64','1/128','1/256'];
    const ZOOM_STOPS=[24,28,35,50,70,80,105];
    const zoomHalfAngle=mm=>Math.atan(21.6/mm);   // 対角画角の近似。SpotLight.angleは半角
    const color={key:'#67aef5',fill:'#bff4e9',rim:'#b9d3ff'};
    const calibrate={key:42,fill:90,rim:50},kits=data.map(x=>{const t=new THREE.Object3D(),l=new THREE.SpotLight('#fff6e7',0,10,Math.PI/5.4,.34,1.45);l.castShadow=true;l.shadow.mapSize.set(512,512);const marker=new THREE.Mesh(new THREE.SphereGeometry(.045,16,12),new THREE.MeshBasicMaterial({color:color[x.role]}));marker.visible=false;scene.add(l,t,marker);return{l,t,marker}});
    const now=new Date();document.querySelector('#date').value=now.toISOString().slice(0,10);document.querySelector('#lat').value='35.681';document.querySelector('#lng').value='139.767';
    function timeStr(mins){const h=Math.floor(mins/60),m=mins%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
    /* ----------------------------------------------------------------------
       カメラ露出。LIGHT_SETUP_COACH_standalone.html の exposureStops() を移植:
         e = powerStops - 2*log2(distance) - 2*log2(aperture) + log2(iso/100)
         if (!isStrobe) e += log2(shutterSeconds)
       距離の項は移さない。SpotLight の decay=2 でレンダラ側が逆二乗減衰を
       既に計算しており、二重計上になるため。
       シャッターは環境光にのみ効く（同調速度内では発光時間の方が十分短い）。
       ---------------------------------------------------------------------- */
    const ISO_STOPS=[50,100,200,400,800,1600,3200,6400,12800,25600];
    const F_STOPS=[1,1.4,2,2.8,4,5.6,8,11,16,22,32];
    const SHUTTER_STOPS=[1/4,1/8,1/15,1/30,1/60,1/125,1/250,1/500,1/1000,1/2000,1/4000,1/8000];
    const SYNC_SPEED=1/250;                       // これより速いと同調速度を超える
    const EXPO_REF={iso:400,fstop:4,shutter:1/125}; // 基準（ここでは係数が 1.0 = 現状の見た目）
    const flashEV =(iso,f)=>Math.log2(iso/100)-2*Math.log2(f);
    const REF_FLASH=flashEV(EXPO_REF.iso,EXPO_REF.fstop), REF_AMBIENT=REF_FLASH+Math.log2(EXPO_REF.shutter);
    let expo={iso:EXPO_REF.iso,fstop:EXPO_REF.fstop,shutter:EXPO_REF.shutter,flash:1,ambient:1,dFlash:0,dAmbient:0};
    function calcExposure(){
      const iso=ISO_STOPS[+document.querySelector('#isoR').value],
            fstop=F_STOPS[+document.querySelector('#fstopR').value],
            shutter=SHUTTER_STOPS[+document.querySelector('#shutterR').value];
      const dFlash=flashEV(iso,fstop)-REF_FLASH, dAmbient=flashEV(iso,fstop)+Math.log2(shutter)-REF_AMBIENT;
      expo={iso,fstop,shutter,flash:Math.pow(2,dFlash),ambient:Math.pow(2,dAmbient),dFlash,dAmbient};
      const den=Math.round(1/shutter), sgn=v=>(v>0?'+':'')+v.toFixed(1);
      document.querySelector('#v-iso').textContent=iso;
      document.querySelector('#v-fstop').textContent='F'+fstop;
      document.querySelector('#v-shutter').textContent='1/'+den;
      document.querySelector('#expoReadout').innerHTML=
        '<strong>環境光 '+sgn(dAmbient)+'段 / ストロボ '+sgn(dFlash)+'段</strong>'+
        'シャッターは環境光だけに効きます。ストロボの明るさは絞りとISOで決まります。'+
        (shutter<SYNC_SPEED?'<br>⚠ 1/'+den+' は同調速度 1/250 より速く、実機ではストロボが画面の一部しか写りません。':'');
    }
    /* ガイドナンバー方式。GN=絞りF値×距離(ISO100/m)の定義から、現在の絞り・ISOに対して
       必要なF値を出し、カメラの実際の絞りとの段数差をそのまま光量倍率にする。
       expo.flash（絞り・ISOだけの簡易近似）はここでは使わない。距離・GN・段数を直接見るため。 */
    function lightPhysics(x){
      const powerFraction=Math.pow(2,-x.powerStop);
      const effectiveGN=x.gn*Math.sqrt(powerFraction);
      const requiredF=effectiveGN/x.distance*Math.sqrt(expo.iso/100);
      const stopsDiff=2*Math.log2(requiredF/expo.fstop);
      return{requiredF,stopsDiff};
    }
    function calcLight(x){if(!x.on)return 0;return calibrate[x.role]*Math.pow(2,lightPhysics(x).stopsDiff)}
    function renderLightExpo(){
      const el=document.querySelector('#lightExpo');if(!el)return;
      const x=data.find(v=>v.id===active);if(!x)return;
      const{requiredF,stopsDiff}=lightPhysics(x),sgn=v=>(v>0?'+':'')+v.toFixed(1);
      const verdict=Math.abs(stopsDiff)<0.3?'適正露出':stopsDiff>0?'オーバー':'アンダー';
      el.innerHTML='<strong>必要F値 F'+requiredF.toFixed(1)+'</strong> → 現在の絞りF'+expo.fstop+'に対して '+sgn(stopsDiff)+'段（'+verdict+'）';
    }function updateScene(){const timeVal=+document.querySelector('#time').value,date=new Date(document.querySelector('#date').value+'T'+timeStr(timeVal)),lat=+document.querySelector('#lat').value||35.681,lng=+document.querySelector('#lng').value||139.767,pos=window.SunCalc.getPosition(date,lat,lng),alt=pos.altitude*180/Math.PI,azi=(pos.azimuth+Math.PI)*180/Math.PI,a=THREE.MathUtils.degToRad(Math.max(alt,0)),z=THREE.MathUtils.degToRad(azi);sun.position.set(Math.sin(z)*Math.cos(a)*14,Math.max(.2,Math.sin(a)*14),-Math.cos(z)*Math.cos(a)*14);const outdoors=bgMode==='outdoor',preset=BG_PRESET[bgMode];sun.intensity=outdoors&&alt>0?2:0;calcExposure();renderer.toneMappingExposure=1.08*expo.ambient;scene.background=new THREE.Color(preset.bg).multiplyScalar(Math.min(4,expo.ambient));ground.material.color.set(preset.ground);wall.material.color.set(preset.wall);hemi.groundColor.set(preset.hemiGround);wall.visible=!outdoors||pose==='leaning';chair.visible=pose==='seated';document.querySelector('#solarText').textContent=outdoors?(alt>0?'高度 '+alt.toFixed(0)+'° / 方位 '+azi.toFixed(0)+'°':'太陽は地平線下'):'太陽光を無効化';document.querySelector('#scale i').style.left=Math.min(94,Math.max(6,azi/3.6))+'%';kits.forEach((k,i)=>{const x=data[i],r=THREE.MathUtils.degToRad(x.angle),p=new THREE.Vector3(Math.sin(r)*x.distance,x.height,Math.cos(r)*x.distance);k.l.position.copy(p);k.t.position.set(0,1.3,0);k.l.target=k.t;k.l.intensity=calcLight(x);k.l.decay=x.role==='fill'?1.15:2;k.l.angle=zoomHalfAngle(ZOOM_STOPS[x.zoom]);k.l.penumbra=THREE.MathUtils.lerp(.08,.82,x.softness/100);k.marker.position.copy(p);k.marker.visible=x.on&&showMarkers});renderLightExpo()}
    function renderControls(){const list=document.querySelector('#lightList'),controls=document.querySelector('#lightControls');list.innerHTML='';data.forEach(x=>{const row=document.createElement('div');row.className='light '+(x.id===active?'selected ':'')+(x.on?'enabled':'');row.innerHTML='<i class="dot '+x.role+'"></i><span>'+x.label+'</span><div class="toggle-wrap"><small>'+(x.on?'ON':'OFF')+'</small><input type="checkbox" '+(x.on?'checked':'')+' aria-label="'+x.label+'を切り替える"></div>';row.onclick=()=>{active=x.id;renderControls()};row.querySelector('input').onclick=e=>e.stopPropagation();row.querySelector('input').onchange=e=>{x.on=e.target.checked;active=x.id;updateScene();renderControls()};list.append(row)});const x=data.find(v=>v.id===active);
    controls.innerHTML=
      '<div class="slider"><div><span>ガイドナンバー</span><strong id="v-gn">GN'+x.gn+'</strong></div><input type="range" data-k="gn" min="17" max="96" step="1" value="'+x.gn+'"></div>'+
      '<div class="slider"><div><span>発光量</span><strong id="v-powerStop">'+POWER_STOPS[x.powerStop]+'</strong></div><input type="range" data-k="powerStop" min="0" max="8" step="1" value="'+(8-x.powerStop)+'"></div>'+
      '<div class="slider"><div><span>ズーム</span><strong id="v-zoom">'+ZOOM_STOPS[x.zoom]+'mm</strong></div><input type="range" data-k="zoom" min="0" max="'+(ZOOM_STOPS.length-1)+'" step="1" value="'+x.zoom+'"></div>'+
      ['angle|方向|-180|180|1|°','distance|距離|0.8|5|0.1|m','height|高さ|0.4|4|0.1|m','softness|エッジのやわらかさ|0|100|1|%'].map(v=>{const[a,b,min,max,step,suffix]=v.split('|');return '<div class="slider"><div><span>'+b+'</span><strong id="v-'+a+'">'+x[a]+suffix+'</strong></div><input type="range" data-k="'+a+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+x[a]+'"></div>'}).join('')+
      '<div class="hint" id="lightExpo"></div>';
    controls.querySelectorAll('input[data-k]').forEach(el=>el.oninput=e=>{
      const k=e.target.dataset.k;
      if(k==='powerStop'){x.powerStop=8-e.target.value;document.querySelector('#v-powerStop').textContent=POWER_STOPS[x.powerStop]}
      else if(k==='zoom'){x.zoom=+e.target.value;document.querySelector('#v-zoom').textContent=ZOOM_STOPS[x.zoom]+'mm'}
      else if(k==='gn'){x.gn=+e.target.value;document.querySelector('#v-gn').textContent='GN'+x.gn}
      else{x[k]=+e.target.value;document.querySelector('#v-'+k).textContent=x[k]+(k==='softness'?'%':k==='angle'?'°':'m')}
      updateScene();
    });
    renderLightExpo();}
    document.querySelectorAll('#poses button').forEach(b=>b.onclick=()=>{pose=b.dataset.pose;scene.remove(model);model=mannequin(pose);scene.add(model);document.querySelectorAll('#poses button').forEach(v=>v.classList.toggle('active',v===b));updateScene()});const BADGE={outdoor:'☀ 屋外',indoor:'◐ 屋内',white:'⬜ 白ホリ',black:'⬛ 黒ホリ'};
    function setBgMode(mode){bgMode=mode;document.querySelectorAll('[data-bg]').forEach(v=>v.classList.toggle('active',v.dataset.bg===mode));document.querySelector('#modeBadge').textContent=BADGE[mode];document.querySelector('#mannequinColorRow').classList.toggle('hidden',mode!=='white'&&mode!=='black');if(!manualMannequinColor){material.color.set(BG_PRESET[mode].mannequin);document.querySelector('#mannequinColor').value='#'+material.color.getHexString();document.querySelector('#v-mannequinColor').textContent='#'+material.color.getHexString()}updateScene()}
    document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>setBgMode(b.dataset.bg));
    document.querySelector('#mannequinColor').oninput=e=>{manualMannequinColor=true;material.color.set(e.target.value);document.querySelector('#v-mannequinColor').textContent=e.target.value};document.querySelector('#time').oninput=e=>{document.querySelector('#v-time').textContent=timeStr(+e.target.value);updateScene()};document.querySelectorAll('#date,#lat,#lng,#isoR,#fstopR,#shutterR').forEach(e=>e.oninput=updateScene);document.querySelector('#markerToggle').onclick=e=>{showMarkers=!showMarkers;e.target.classList.toggle('active',showMarkers);e.target.textContent=(showMarkers?'● ':'○ ')+'位置マーカー表示';updateScene()};
    function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);renderer.setPixelRatio(Math.min(devicePixelRatio,2))}addEventListener('resize',resize);resize();renderControls();updateScene();(function loop(){controls.update();renderer.render(scene,camera);requestAnimationFrame(loop)})();
  </script>
