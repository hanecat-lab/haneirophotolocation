html,body{

  width:100%;
  height:28px
}

/* スライム：押すと縦横でつぶれる */

.puyo{
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, background .18s ease;
  will-change:transform;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent
}

.puyo:active,.puyo.is-press{
  transform:scale(.92,1.08)
}

.puyo.is-jelly{
  animation:jelly .62s cubic-bezier(.34,1.56,.64,1)
}

.puyo.is-bounce{
  animation:puyoBounce .68s cubic-bezier(.34,1.56,.64,1)
}

@keyframes jelly{
  0%{
    transform:scale(.92,1.08)
  }

  28%{
    transform:scale(1.08,.92)
  }

  48%{
    transform:scale(.96,1.04)
  }

  66%{
    transform:scale(1.03,.97)
  }

  82%{
    transform:scale(.99,1.01)
  }

  100%{
    transform:scale(1,1)
  }
}

@keyframes puyoBounce{
  0%{
    transform:scale(.9,1.1)
  }

  30%{
    transform:scale(1.12,.88)
  }

  52%{
    transform:scale(.95,1.05)
  }

  72%{
    transform:scale(1.04,.96)
  }

  100%{
    transform:scale(1,1)
  }
}

@keyframes canvasShake{
  0%{
    transform:scale(.97,1.03) rotate(-.4deg)
  }

  32%{
    transform:scale(1.03,.97) rotate(.5deg)
  }

  58%{
    transform:scale(.98,1.02) rotate(-.2deg)
  }

  82%{
    transform:scale(1.01,.99)
  }

  100%{
    transform:scale(1,1) rotate(0deg)
  }
}

@keyframes floatSoft{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-4px)
  }
}

@keyframes wobble{
  0%,100%{
    transform:scale(1,1)
  }

  25%{
    transform:scale(1.08,.9)
  }

  50%{
    transform:scale(.94,1.07)
  }

  75%{
    transform:scale(1.03,.97)
  }
}

.canvas-jelly{
  animation:canvasShake .62s cubic-bezier(.34,1.56,.64,1)
}

.exporting{
  animation:wobble .55s cubic-bezier(.34,1.56,.64,1) infinite
}

.float-soft{
  animation:floatSoft 3.2s ease-in-out infinite
}

/* 端末の「アニメーションを減らす」設定があっても、アプリ内では同じアニメーションを強制する */

@media (prefers-reduced-motion: reduce){
  .puyo,.puyo.is-jelly,.puyo.is-bounce,.canvas-jelly,.exporting,.float-soft{
    animation-duration:.62s !important;
    animation-iteration-count:1 !important;
    animation-play-state:running !important;
    transition-duration:.18s !important
  }

  .puyo.is-jelly{
    animation-name:jelly !important
  }

  .puyo.is-bounce{
    animation-name:puyoBounce !important
  }

  .canvas-jelly{
    animation-name:canvasShake !important
  }

  .exporting{
    animation-name:wobble !important;
    animation-iteration-count:infinite !important
  }

  .float-soft{
    animation-name:floatSoft !important;
    animation-duration:3.2s !important;
    animation-iteration-count:infinite !important
  }
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.range-label{
  font-size:12px;
  font-weight:700;
  color:var(--muted)
}

.active\:cursor-grabbing:active{
  cursor: grabbing;
}
