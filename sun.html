<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LuminaCam Pro</title>
  <style>
    :root {
      --primary-color: #0a84ff;
      --bg-glass: rgba(28, 28, 30, 0.65);
      --border-glass: rgba(255, 255, 255, 0.18);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.6);
      --accent-yellow: #ffd60a;
      --accent-green: #30d158;
      --accent-red: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      color: var(--text-main);
    }

    /* フルスクリーンViewport */
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ビデオ・Canvasレイヤー構造 */
    #video-feed, #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #video-feed { z-index: 1; }
    #ar-canvas { z-index: 2; pointer-events: auto; }

    /* UIオーバーレイレイヤー */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
    }

    .interactive { pointer-events: auto; }

    /* iOS風ガラスパネル */
    .glass-card {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* ヘッダー情報表示エリア */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .title-group h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .title-group p {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* リアルタイムステータスグリッド */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      font-mono: SF Mono, monospace;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
    }

    .status-label { color: var(--text-sub); }
    .status-value { font-weight: 600; }

    /* 中央ARレティクル・照準表示 */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }
    .crosshair::before, .crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
    }
    .crosshair::before { top: 19px; left: -10px; width: 60px; height: 2px; }
    .crosshair::after { top: -10px; left: 19px; width: 2px; height: 60px; }

    /* コントロール・手動補正パネル */
    .bottom-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .slider-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-container label {
      font-size: 12px;
      width: 70px;
      color: var(--text-sub);
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      height: 4px;
      border-radius: 2px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* iOSスタイルのシステムボタン */
    .ios-btn {
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
    }

    .ios-btn:active {
      transform: scale(0.96);
      opacity: 0.8;
    }

    .ios-btn.secondary {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: none;
    }

    .ios-btn.warning {
      background: var(--accent-yellow);
      color: #000;
    }

    /* モーダル表示（初期許可権限オーバーレイ） */
    #permission-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }

    #permission-modal h2 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    #permission-modal p {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* 通知バナー */
    .toast {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 69, 58, 0.9);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      z-index: 9;
      opacity: 0;
      transition: opacity 0.3px ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div id="app-container">
  <!-- カメラフィードとARキャンバス -->
  <video id="video-feed" autoplay playsinline muted></video>
  <canvas id="ar-canvas"></canvas>
  
  <div class="crosshair"></div>
  <div id="toast" class="toast">警告通知</div>

  <!-- UIレイヤー -->
  <div class="ui-layer">
    <!-- 上部ステータスパネル -->
    <div class="top-bar glass-card interactive">
      <div style="width: 100%;">
        <div class="title-group">
          <h1>LuminaCam Pro</h1>
          <p>AR Sun Position & Luminance Analyzer</p>
        </div>
        <div class="status-grid">
          <div class="status-item"><span class="status-label">方位角 (Heading):</span><span id="st-heading" class="status-value">---°</span></div>
          <div class="status-item"><span class="status-label">太陽高度 (Alt):</span><span id="st-sun-alt" class="status-value">--°</span></div>
          <div class="status-item"><span class="status-label">太陽方位 (Azimuth):</span><span id="st-sun-az" class="status-value">--°</span></div>
          <div class="status-item"><span class="status-label">推定輝度 (Lux):</span><span id="st-lux" class="status-value">-- EV</span></div>
          <div class="status-item"><span class="status-label">緯度/経度:</span><span id="st-coords" class="status-value">-- , --</span></div>
          <div class="status-item"><span class="status-label">補正オフセット:</span><span id="st-offset" class="status-value">0°</span></div>
        </div>
      </div>
    </div>

    <!-- 下部操作パネル -->
    <div class="bottom-bar glass-card interactive">
      <div class="control-row">
        <div class="slider-container">
          <label>方位手動微調</label>
          <input type="range" id="heading-offset-slider" min="-180" max="180" value="0">
        </div>
        <button id="btn-reset-offset" class="ios-btn secondary" style="padding: 6px 12px; font-size: 11px;">リセット</button>
      </div>

      <div class="control-row">
        <button id="btn-toggle-mode" class="ios-btn secondary">手動タップ位置指定: OFF</button>
        <button id="btn-calibrate-ae" class="ios-btn warning">AE基準輝度校正</button>
      </div>
    </div>
  </div>

  <!-- 初回パーミッション起動モーダル -->
  <div id="permission-modal">
    <h2>LuminaCam Pro</h2>
    <p>AR描画・光量解析を有効にするため、カメラ・GPS位置情報・ジャイロ（コンパス）センサーの利用を許可してください。</p>
    <button id="btn-start" class="ios-btn" style="padding: 14px 32px; font-size: 16px;">アプリを起動する</button>
  </div>
</div>
<script>
/**
 * LuminaCam Pro - Core Logic Engine
 * 太陽演算・センサーステート管理
 */
const AppState = {
  lat: 35.6812, // デフォルト東京
  lng: 139.7671,
  gpsAvailable: false,
  heading: 0,
  rawHeading: 0,
  headingOffset: 0,
  pitch: 0,
  roll: 0,
  sunAltitude: 0,
  sunAzimuth: 0,
  luminanceEV: 0,
  aeCalibrationOffset: 0,
  manualTargetOverride: false,
  manualTargetX: 0,
  manualTargetY: 0
};

// UI Element Referencing
const elStHeading = document.getElementById('st-heading');
const elStSunAlt = document.getElementById('st-sun-alt');
const elStSunAz = document.getElementById('st-sun-az');
const elStLux = document.getElementById('st-lux');
const elStCoords = document.getElementById('st-coords');
const elStOffset = document.getElementById('st-offset');
const sliderOffset = document.getElementById('heading-offset-slider');
const btnResetOffset = document.getElementById('btn-reset-offset');
const btnToggleMode = document.getElementById('btn-toggle-mode');
const btnCalibrateAE = document.getElementById('btn-calibrate-ae');
const btnStart = document.getElementById('btn-start');
const modalPermission = document.getElementById('permission-modal');
const toastEl = document.getElementById('toast');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 3000);
}

/* ==========================================================================
   1. 天文学的 太陽位置計算アルゴリズム (NOA簡易アルゴリズム準拠)
   ========================================================================== */
function calculateSunPosition(lat, lng, date = new Date()) {
  const rad = Math.PI / 180;
  const deg = 180 / Math.PI;

  // ユリウス日計算
  const year = date.getUTCFullYear();
  const month = date.getUTCMonth() + 1;
  const day = date.getUTCDate();
  const hours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;

  let d = 367 * year - Math.floor(7 * (year + Math.floor((month + 9) / 12)) / 4) +
          Math.floor(275 * month / 9) + day - 730531.5 + hours / 24;

  // 太陽の黄経・平均近点角
  let w = 282.9404 + 4.70935e-5 * d;
  let M = (356.0470 + 0.9856002585 * d) % 360;
  if (M < 0) M += 360;
  
  let L = (w + M) % 360;
  let e = 0.016709 - 1.151e-9 * d;
  
  // 離心近点角 (Kepler方程式の近似)
  let E = M + deg * e * Math.sin(M * rad) * (1 + e * Math.cos(M * rad));
  
  // 太陽の直交座標 (黄道面)
  let x = Math.cos(E * rad) - e;
  let y = Math.sin(E * rad) * Math.sqrt(1 - e * e);
  
  let r = Math.sqrt(x * x + y * y);
  let v = Math.atan2(y, x) * deg;
  let lon = (v + w) % 360;

  // 赤道傾斜角
  let oblecl = 23.4393 - 3.563e-7 * d;

  // 赤道座標系への変換 (赤経RA, 赤緯Dec)
  let xequat = Math.cos(lon * rad);
  let yequat = Math.sin(lon * rad) * Math.cos(oblecl * rad);
  let zequat = Math.sin(lon * rad) * Math.sin(oblecl * rad);

  let RA = Math.atan2(yequat, xequat) * deg;
  let Decl = Math.asin(zequat) * deg;

  // 地方時角 (GMST & LST)
  let GMST0 = (L + 180) % 360;
  let LST = (GMST0 + hours * 15 + lng) % 360;
  let HA = (LST - RA);

  // 地平座標系への変換 (高度 Altitude, 方位角 Azimuth)
  let HA_rad = HA * rad;
  let Lat_rad = lat * rad;
  let Decl_rad = Decl * rad;

  let sinAlt = Math.sin(Lat_rad) * Math.sin(Decl_rad) + Math.cos(Lat_rad) * Math.cos(Decl_rad) * Math.cos(HA_rad);
  let altitude = Math.asin(sinAlt) * deg;

  let cosAz = (Math.sin(Decl_rad) - Math.sin(Lat_rad) * Math.sin(altitude * rad)) / (Math.cos(Lat_rad) * Math.cos(altitude * rad));
  let azimuth = Math.acos(Math.min(1, Math.max(-1, cosAz))) * deg;

  if (Math.sin(HA_rad) > 0) {
    azimuth = 360 - azimuth;
  }

  return {
    altitude: altitude,
    azimuth: azimuth
  };
}

/* ==========================================================================
   2. WebAPI・GPS・コンパス・デバイスモーション連動処理
   ========================================================================== */
function initGeolocation() {
  if (!("geolocation" in navigator)) {
    showToast("GPS非対応のブラウザです。デフォルト位置を使用します。");
    updateSunCalculations();
    return;
  }

  const options = {
    enableHighAccuracy: true,
    timeout: 8000,
    maximumAge: 0
  };

  navigator.geolocation.watchPosition(
    (pos) => {
      AppState.lat = pos.coords.latitude;
      AppState.lng = pos.coords.longitude;
      AppState.gpsAvailable = true;
      elStCoords.textContent = `${AppState.lat.toFixed(3)}, ${AppState.lng.toFixed(3)}`;
      updateSunCalculations();
    },
    (err) => {
      console.warn("GPSエラー:", err.message);
      AppState.gpsAvailable = false;
      elStCoords.textContent = `${AppState.lat.toFixed(3)}, ${AppState.lng.toFixed(3)} (固定)`;
      showToast("GPS取得失敗。代替位置座標を適用中");
      updateSunCalculations();
    },
    options
  );
}

function updateSunCalculations() {
  const sunPos = calculateSunPosition(AppState.lat, AppState.lng);
  AppState.sunAltitude = sunPos.altitude;
  AppState.sunAzimuth = sunPos.azimuth;

  elStSunAlt.textContent = `${sunPos.altitude.toFixed(1)}°`;
  elStSunAz.textContent = `${sunPos.azimuth.toFixed(1)}°`;
}

function handleDeviceOrientation(event) {
  let heading = null;

  // iOS Safari 固有プロパティ (True North / Magnetic North)
  if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
    heading = event.webkitCompassHeading;
  } else if (event.alpha !== null) {
    // Android / 標準定義 (0度 = 北)
    heading = 360 - event.alpha;
  }

  if (heading !== null) {
    AppState.rawHeading = heading;
    // 手動補正オフセットの適用
    let corrected = (heading + AppState.headingOffset) % 360;
    if (corrected < 0) corrected += 360;
    
    AppState.heading = corrected;
    elStHeading.textContent = `${Math.round(corrected)}°`;
  }

  if (event.beta !== null && event.gamma !== null) {
    AppState.pitch = event.beta;  // 端末の前後の傾き
    AppState.roll = event.gamma;   // 端末の左右の傾き
  }
}

async function requestSensorPermissions() {
  // iOS 13+ ジャイロ・コンパスパーミッションの明確なリクエスト
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const permissionState = await DeviceOrientationEvent.requestPermission();
      if (permissionState === 'granted') {
        window.addEventListener('deviceorientation', handleDeviceOrientation, true);
      } else {
        showToast("コンパスの利用許可が拒否されました");
      }
    } catch (error) {
      console.error("Orientation permission error:", error);
    }
  } else {
    // Android / 旧iOS
    window.addEventListener('deviceorientationabsolute', handleDeviceOrientation, true) ||
    window.addEventListener('deviceorientation', handleDeviceOrientation, true);
  }

  // カメラ権限＆映像取得
  initCamera();
  // GPS開始
  initGeolocation();
}

async function initCamera() {
  const video = document.getElementById('video-feed');
  const constraints = {
    video: {
      facingMode: { exact: "environment" },
      width: { ideal: 1920 },
      height: { ideal: 1080 }
    },
    audio: false
  };

  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
  } catch (err) {
    console.warn("背面カメラ取得失敗、標準カメラへ切り替え:", err);
    try {
      const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = fallbackStream;
    } catch (e) {
      showToast("カメラフィードの起動に失敗しました");
    }
  }
}
</script>
<script>
/**
 * LuminaCam Pro - Rendering & Luminance Analysis Engine
 */
const canvas = document.getElementById('ar-canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const video = document.getElementById('video-feed');

// オフスクリーンCanvas（画像輝度データ高速抽出用）
const analysisCanvas = document.createElement('canvas');
const analysisCtx = analysisCanvas.getContext('2d', { willReadFrequently: true });
analysisCanvas.width = 160;
analysisCanvas.height = 120;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* ==========================================================================
   1. 画像輝度解析・カメラAE補正アルゴリズム
   ========================================================================== */
function analyzeLuminance() {
  if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

  // オフスクリーンCanvasに低解像度で転写して処理負荷低減
  analysisCtx.drawImage(video, 0, 0, analysisCanvas.width, analysisCanvas.height);
  const imgData = analysisCtx.getImageData(0, 0, analysisCanvas.width, analysisCanvas.height);
  const data = imgData.data;

  let totalLuminance = 0;
  let maxLuminance = 0;
  const length = data.length;

  // ITU-R BT.709 規格に基づく相対輝度算出（RGB重み付け）
  for (let i = 0; i < length; i += 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];
    
    // 輝度計算 L = 0.2126 * R + 0.7152 * G + 0.0722 * B
    const Y = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    totalLuminance += Y;
    if (Y > maxLuminance) maxLuminance = Y;
  }

  const avgLuminance = totalLuminance / (length / 4);

  // 近似EV値の導出（カメラAE補正オフセットを加味）
  // 輝度(0-255)を対数スケーリングして露光値表現に変換
  let calculatedEV = Math.log2((avgLuminance / 255) * 100 + 1) * 2 + AppState.aeCalibrationOffset;
  if (isNaN(calculatedEV) || calculatedEV < 0) calculatedEV = 0;

  AppState.luminanceEV = calculatedEV;
  elStLux.textContent = `${calculatedEV.toFixed(1)} EV (Max:${Math.round(maxLuminance)})`;
}

/* ==========================================================================
   2. AR描画・太陽描画ロジック
   ========================================================================== */
function drawAROverlay() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  // カメラ視角 (FOV) 概算設定
  const fovH = 60 * (Math.PI / 180); // 水平FOV 60度
  const fovV = fovH * (canvas.height / canvas.width);

  let sunX = 0;
  let sunY = 0;
  let isSunVisible = false;

  if (AppState.manualTargetOverride) {
    // 手動タップ追従モード
    sunX = AppState.manualTargetX;
    sunY = AppState.manualTargetY;
    isSunVisible = true;
  } else {
    // 方位角とピッチ角からAR空間上のXY座標へプロジェクション計算
    let deltaAzimuth = AppState.sunAzimuth - AppState.heading;
    
    // -180 〜 180 度の範囲へ正則化
    while (deltaAzimuth > 180) deltaAzimuth -= 360;
    while (deltaAzimuth < -180) deltaAzimuth += 360;

    const deltaAzimuthRad = deltaAzimuth * (Math.PI / 180);
    const deltaAltRad = (AppState.sunAltitude - (AppState.pitch - 45)) * (Math.PI / 180); // 端末所持角度のフォールバック補正

    sunX = cx + (deltaAzimuthRad / (fovH / 2)) * (canvas.width / 2);
    sunY = cy - (deltaAltRad / (fovV / 2)) * (canvas.height / 2);

    // 画面内判定
    if (Math.abs(deltaAzimuth) < 90) {
      isSunVisible = true;
    }
  }

  // 太陽プロジェクションおよび光のビーム効果描画
  if (isSunVisible) {
    const pulse = Math.sin(Date.now() / 200) * 5;
    const baseRadius = 25 + (AppState.luminanceEV * 1.5);

    // 外光グローエフェクト
    const gradient = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, baseRadius + 30 + pulse);
    gradient.addColorStop(0, 'rgba(255, 255, 220, 0.95)');
    gradient.addColorStop(0.3, 'rgba(255, 214, 10, 0.6)');
    gradient.addColorStop(0.8, 'rgba(255, 159, 10, 0.2)');
    gradient.addColorStop(1, 'rgba(255, 149, 0, 0)');

    ctx.beginPath();
    ctx.arc(sunX, sunY, baseRadius + 40 + pulse, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // 太陽コア
    ctx.beginPath();
    ctx.arc(sunX, sunY, baseRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffd60a';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0; // リセット

    // タグテキスト描画
    ctx.font = 'bold 12px SF Pro Text, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText(`SUN (${AppState.sunAltitude.toFixed(1)}°)`, sunX, sunY - baseRadius - 12);
  }

  // 画面中央コンパスインジケータ（水平ガイド）
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, cy);
  ctx.lineTo(canvas.width, cy);
  ctx.stroke();
}

/* ==========================================================================
   3. メインアニメーションループ & イベントハンドラー
   ========================================================================== */
function mainLoop() {
  analyzeLuminance();
  drawAROverlay();
  requestAnimationFrame(mainLoop);
}

// 画面タップによる手動ターゲット位置決定 (フォールバック)
canvas.addEventListener('click', (e) => {
  if (!AppState.manualTargetOverride) return;

  const rect = canvas.getBoundingClientRect();
  AppState.manualTargetX = e.clientX - rect.left;
  AppState.manualTargetY = e.clientY - rect.top;

  showToast(`太陽位置を画面タップ位置に手動固定: (${Math.round(AppState.manualTargetX)}, ${Math.round(AppState.manualTargetY)})`);
});

// コントロールリスナーの設定
sliderOffset.addEventListener('input', (e) => {
  AppState.headingOffset = parseFloat(e.target.value);
  elStOffset.textContent = `${AppState.headingOffset}°`;
});

btnResetOffset.addEventListener('click', () => {
  AppState.headingOffset = 0;
  sliderOffset.value = 0;
  elStOffset.textContent = `0°`;
  showToast("方位オフセットをリセットしました");
});

btnToggleMode.addEventListener('click', () => {
  AppState.manualTargetOverride = !AppState.manualTargetOverride;
  if (AppState.manualTargetOverride) {
    btnToggleMode.textContent = "手動タップ位置指定: ON";
    btnToggleMode.classList.remove('secondary');
    btnToggleMode.classList.add('warning');
    // 初期値を中央にセット
    AppState.manualTargetX = canvas.width / 2;
    AppState.manualTargetY = canvas.height / 2;
    showToast("画面タップで太陽位置を指定できます");
  } else {
    btnToggleMode.textContent = "手動タップ位置指定: OFF";
    btnToggleMode.classList.remove('warning');
    btnToggleMode.classList.add('secondary');
    showToast("自動方位・センサートラッキングに戻りました");
  }
});

btnCalibrateAE.addEventListener('click', () => {
  // 自動露出の標準からズレを修正するキャリブレーション
  AppState.aeCalibrationOffset = 2.5; // 標準露出オフセット値に規定
  showToast("現在のカメラ露出状態を基準として再校正しました");
});

btnStart.addEventListener('click', () => {
  modalPermission.style.display = 'none';
  requestSensorPermissions();
  mainLoop();
});
</script>
