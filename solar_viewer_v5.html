<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>日陰シミュレーター / Mobile Master v5.22</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>

  <script>
    // ─── 影の品質設定 ────────────────────────────────────────────────
    // シェーダー側の #define と JS 側のシャドウカメラ設定は必ず同じ値から作る。
    // ズレると半影の幅が距離に対して合わなくなる。
    const SHADOW_CFG = (function () {
      const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      return {
        halfExtent: 30,              // 正射影シャドウカメラの半幅[m]（この外の物は影を落とさない）
        near: 0.5,
        far: 120,                    // 光源は原点から半径40なので余裕を見た値
        mapSize: coarse ? 2048 : 4096,
        bias: -0.0004,               // シャドウアクネ対策（負値で受光面を手前に寄せる）
        normalBias: 0.03,            // 法線方向のずらし。斜面のアクネとピーターパン現象の両対策
        sunTan: 0.00925,             // tan(太陽の視直径 0.53°)。半影 = 遮蔽物までの距離 × これ
        maxPenumbra: 0.4             // 半影幅の上限[m]。ブロッカー探索半径もこれに一致させる
      };
    })();

    // ─── ソフトシャドウ（PCSS）──────────────────────────────────────
    // three r147 の SHADOWMAP_TYPE_PCF_SOFT は shadow.radius を参照しない固定 9 タップで、
    // 遮蔽物からの距離によらず常に同じ太さにしかぼけない（PCF も UV 空間で一定幅）。
    // 「離れるほど輪郭がぼやける」を出すには半影幅を距離から計算する必要があるので、
    // getShadow を PCSS（ブロッカー探索 → 可変半径 PCF）に差し替える。
    // 平行光源のシャドウカメラは正射影なので、深度差はそのまま実距離に比例する。
    (function installPCSS() {
      const c = SHADOW_CFG;
      const frustumW = c.halfExtent * 2;
      const depthRange = c.far - c.near;
      const maxRadiusUV = c.maxPenumbra / frustumW;

      const PCSS_GLSL = `
      #define PCSS_BLOCKER_SAMPLES 12
      #define PCSS_PCF_SAMPLES 16
      #define PCSS_DEPTH_RANGE ${depthRange.toFixed(4)}
      #define PCSS_FRUSTUM_W ${frustumW.toFixed(4)}
      #define PCSS_SUN_TAN ${c.sunTan.toFixed(6)}
      #define PCSS_MAX_RADIUS_UV ${maxRadiusUV.toFixed(8)}
      vec2 pcssOffset( const in float i, const in float total, const in float startAngle ) {
        float angle = startAngle + i * ( PI2 * 5.0 / total );
        float r = pow( ( i + 0.5 ) / total, 0.75 );
        return vec2( cos( angle ), sin( angle ) ) * r;
      }
      float pcssFindBlocker( sampler2D shadowMap, const in vec2 uv, const in float zReceiver, const in float startAngle ) {
        float sum = 0.0;
        float count = 0.0;
        for ( int i = 0; i < PCSS_BLOCKER_SAMPLES; i ++ ) {
          vec2 o = pcssOffset( float( i ), float( PCSS_BLOCKER_SAMPLES ), startAngle ) * PCSS_MAX_RADIUS_UV;
          float d = unpackRGBAToDepth( texture2D( shadowMap, uv + o ) );
          if ( d < zReceiver ) { sum += d; count += 1.0; }
        }
        if ( count < 0.5 ) return -1.0;
        return sum / count;
      }
      float PCSS( sampler2D shadowMap, vec2 shadowMapSize, vec4 coords ) {
        vec2 uv = coords.xy;
        float z = coords.z;
        float startAngle = rand( uv ) * PI2;
        float zBlocker = pcssFindBlocker( shadowMap, uv, z, startAngle );
        if ( zBlocker < 0.0 ) return 1.0;
        float occluderDist = ( z - zBlocker ) * PCSS_DEPTH_RANGE;
        float radius = clamp( occluderDist * PCSS_SUN_TAN / PCSS_FRUSTUM_W, 1.0 / shadowMapSize.x, PCSS_MAX_RADIUS_UV );
        float shadow = 0.0;
        for ( int i = 0; i < PCSS_PCF_SAMPLES; i ++ ) {
          vec2 o = pcssOffset( float( i ), float( PCSS_PCF_SAMPLES ), startAngle ) * radius;
          shadow += texture2DCompare( shadowMap, uv + o, z );
        }
        return shadow / float( PCSS_PCF_SAMPLES );
      }
      `;

      // 差し込み位置は three のバージョンに依存する。見つからないまま素通りすると
      // 「パッチが当たっていないのに動いて見える」状態になるので、その場で失敗させる。
      const anchorFn = 'float getShadow( sampler2D shadowMap,';
      const anchorBranch = '#if defined( SHADOWMAP_TYPE_PCF )\n';
      let src = THREE.ShaderChunk.shadowmap_pars_fragment;
      if (src.indexOf(anchorFn) === -1 || src.indexOf(anchorBranch) === -1) {
        console.error('[shadow] PCSS パッチの差し込み位置が見つかりません (three r' + THREE.REVISION + ')。ソフトシャドウは無効です。');
        return;
      }
      src = src.replace(anchorFn, PCSS_GLSL + anchorFn);
      src = src.replace(anchorBranch, 'return PCSS( shadowMap, shadowMapSize, shadowCoord );\n' + anchorBranch);
      THREE.ShaderChunk.shadowmap_pars_fragment = src;
    })();
  </script>

  <style>
    :root {
      --panel-bg: rgba(18, 18, 18, 0.92);
      --accent-color: #00ff88;
      --danger-color: #ff4444;
      --info-color: #287be5;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100dvh; margin: 0; padding: 0; overflow: hidden;
      background-color: #0a0a0a; color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    .panel {
      position: fixed; z-index: 10;
      left: calc(10px + var(--safe-left)); right: calc(10px + var(--safe-right));
      background: var(--panel-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); padding: 12px 16px; touch-action: auto;
    }
    .top-panel { top: calc(10px + var(--safe-top)); }
    .bottom-panel { bottom: calc(10px + var(--safe-bottom)); }
    .info-row { font-size: 12px; color: #ffd700; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .hud-box { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 255, 136, 0.2); border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; }
    .hud-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .hud-main strong { font-size: 16px; color: var(--accent-color); font-family: monospace; }
    .compass-strip { font-size: 10px; color: #777; letter-spacing: 4px; text-align: center; font-family: monospace; }
    .compass-strip b { color: var(--accent-color); text-shadow: 0 0 5px var(--accent-color); }
    .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
    .btn { border: 0; border-radius: 8px; height: 36px; color: #fff; font-weight: bold; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
    .btn:active { opacity: 0.7; }
    .btn-dir { background: #333; color: var(--accent-color); border: 1px solid #444; }
    .btn-primary { background: var(--info-color); }
    .btn-purple { background: #9b59b6; }
    .btn-danger { background: var(--danger-color); }
    .btn-dark { background: #222; border: 1px solid #444; color: #ccc; }
    .compass-toggle { grid-column: span 4; background: #e74c3c; margin-top: 4px; }
    .compass-toggle.active { background: #2ecc71; }
    .time-row { display: flex; align-items: center; gap: 12px; width: 100%; }
    .date-input { flex: 1; min-width: 0; height: 32px; background: rgba(0,0,0,0.4); color: var(--accent-color); border: 1px solid #444; border-radius: 8px; padding: 0 8px; font-size: 13px; font-family: monospace; }
    .geo-btn { flex: 0 0 96px; height: 32px; }
    .geo-info { font-size: 10px; color: #888; text-align: right; }
    .calib-info { font-size: 10px; color: #888; text-align: center; margin-top: 4px; }
    .calib-info.calibrated { color: var(--accent-color); }
    .calib-info button { background: none; border: 0; color: #e74c3c; font-size: 10px; text-decoration: underline; cursor: pointer; padding: 0 0 0 6px; }
    .btn:disabled { opacity: 0.4; }
    .verify-section { margin-bottom: 12px; }
    .verify-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #ccc; padding: 3px 0; }
    .verify-row strong { color: var(--accent-color); font-family: monospace; font-size: 13px; }
    .verify-measure { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 6px; }
    /* min-width:0 が無いと入力欄が縮まずパネル外へはみ出す */
    .verify-measure label { min-width: 0; display: flex; align-items: center; gap: 4px; font-size: 11px; color: #ccc; white-space: nowrap; }
    .verify-measure input { flex: 1; min-width: 0; height: 30px; background: rgba(0,0,0,0.4); color: var(--accent-color); border: 1px solid #444; border-radius: 6px; padding: 0 6px; font-size: 13px; font-family: monospace; }
    .verify-result { font-size: 11px; color: #ffd700; background: rgba(0,0,0,0.35); border-radius: 6px; padding: 6px 8px; line-height: 1.5; }
    .verify-result.mismatch { color: #ff8a65; }
    /* 影の先端までの距離。3Dの線・マーカーと同じ黄色で対応が分かるようにする */
    #tip-readout { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: #ccc; background: rgba(0,0,0,0.35); border-radius: 6px; padding: 4px 8px; margin-bottom: 8px; }
    #tip-readout strong { color: #ffd700; font-family: monospace; font-size: 12px; }
    /* 誤りではなく「この条件では精度が落ちる」という但し書きなので、mismatch より控えめにする */
    .verify-lowsun { font-size: 10px; color: #b0a070; line-height: 1.4; margin-top: 4px; }
    .verify-note { font-size: 9px; color: #777; line-height: 1.5; margin-top: 4px; }
    .verify-note b { color: #999; }
    .verify-note-toggle { margin-top: 6px; }
    .verify-note-toggle summary { font-size: 10px; color: #777; cursor: pointer; list-style: none; }
    .verify-note-toggle summary::-webkit-details-marker { display: none; }
    .verify-note-toggle summary::before { content: '▶ '; font-size: 8px; }
    .verify-note-toggle[open] summary::before { content: '▼ '; }
    .time-label { font-size: 14px; font-weight: bold; color: var(--accent-color); min-width: 45px; }
    .slider { flex: 1; height: 30px; accent-color: var(--accent-color); }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .ctrl-item label { display: flex; justify-content: space-between; font-size: 11px; color: #ccc; margin-bottom: 4px; }
    .ctrl-item output { color: var(--accent-color); font-weight: bold; }
    /* 壁の4項目(高さ/幅/奥行/回転)は同時に出すと縦に長くなるので、タブで選んだ1本だけ出す。
       チップの配色は .task-btn.active と揃える */
    .dim-tabs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
    .dim-tab { background: #222; border: 1px solid #444; border-radius: 6px; color: #ccc; font-size: 10px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
    .dim-tab span { color: var(--accent-color); font-weight: bold; font-size: 10px; }
    .dim-tab.active { background: var(--info-color); border-color: var(--info-color); color: #fff; }
    .dim-tab.active span { color: #fff; }
    .ctrl-dim { grid-column: 1 / -1; display: none; }
    .ctrl-dim.dim-active { display: block; }
    #dpad { position: fixed; bottom: 265px; left: calc(20px + var(--safe-left)); z-index: 20; display: none; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); gap: 4px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 14px; backdrop-filter: blur(8px); transition: bottom 0.15s ease; }
    #dpad button { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 13px; border-radius: 7px; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #dpad button:active { background: var(--accent-color); color: #000; }
    .dp-up { grid-column: 2; grid-row: 1; }
    .dp-left { grid-column: 1; grid-row: 2; }
    .dp-right { grid-column: 3; grid-row: 2; }
    .dp-down { grid-column: 2; grid-row: 3; }
    /* 「選択中」通知は単独の全幅バーをやめ、位置を移動ボタンと同じ行に収める。
       2行の小さい文字にして、ボタン側の残り幅を確保する */
    .notice-compact { background: #e67e22; color: #fff; border-radius: 8px; font-size: 9px; line-height: 1.3; font-weight: bold; display: flex; align-items: center; justify-content: center; text-align: center; }
    .placing-row { display: none; align-items: center; gap: 8px; background: #e67e22; padding: 2px 8px; border-radius: 6px; margin-bottom: 8px; }
    .placing-row #placing-status { flex: 1; text-align: left; color: #fff; font-size: 7px; font-weight: bold; }
    .placing-row #placing-repeat { font-size: 8px; }
    .btn-cancel-outline { flex-shrink: 0; height: 17px; padding: 0 12px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.6); border-radius: 6px; color: #fff; font-weight: bold; font-size: 7px; cursor: pointer; }
    /* タスクバー。機能ごとに必要な操作だけを1つ開く（同時に複数開かない）。
       常時表示は太陽情報・向きの数値・時刻スライダーのみ。 */
    .task-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .task-btn { border: 1px solid #444; border-radius: 8px; height: 44px; background: #222; color: #ccc; font-size: 10px; line-height: 1.3; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .task-btn .ico { font-size: 16px; }
    .task-btn.active { background: var(--info-color); border-color: var(--info-color); color: #fff; }
    .task-btn:disabled { opacity: 0.4; }
    .task-section { margin-top: 10px; }
    /* .task-btn.active と同じ配色だけを流用する（.task-btn 自体はレイアウトが
       column/44px 固定で .btn-group 内の他ボタンと合わないため、色だけ切り出す） */
    #repeat-place-btn.active { background: var(--info-color); border-color: var(--info-color); color: #fff; }
    @media (orientation: landscape) and (max-height: 500px) {
      .top-panel { width: 220px; right: auto; }
      .bottom-panel { left: 240px; }
      #dpad { bottom: 20px; left: auto; right: calc(20px + var(--safe-right)); }
    }
  </style>
</head>
<body>

  <div class="panel top-panel">
    <div class="info-row">
      <span id="sun-info">太陽: --</span>
      <span id="version-display">v5.22</span>
    </div>
    <div class="hud-box">
      <div class="hud-main"><span>向き</span><strong id="heading-text">N (0°)</strong></div>
    </div>
    <div class="task-bar">
      <button id="task-heading-btn" class="task-btn" data-task="heading"><span class="ico">🧭</span>方位</button>
      <button id="task-place-btn" class="task-btn" data-task="place"><span class="ico">➕</span>配置</button>
      <button id="task-verify-btn" class="task-btn" data-task="verify"><span class="ico">📏</span>検証</button>
      <button id="toggle-fps-btn" class="task-btn"><span class="ico">🎮</span>FPS視点</button>
    </div>
  </div>

  <div id="dpad">
    <button class="dp-up" id="btn-fwd">▲</button>
    <button class="dp-left" id="btn-left">◄</button>
    <button class="dp-right" id="btn-right">►</button>
    <button class="dp-down" id="btn-bwd">▼</button>
  </div>

  <div class="panel bottom-panel">
    <div class="time-row">
      <span class="time-label" id="time-display">12:00</span>
      <input id="time-range" class="slider" type="range" min="180" max="1320" value="720">
    </div>

    <div id="section-heading" class="task-section" style="display:none;">
      <div class="compass-strip" id="compass-strip">NW N NE E SE S SW W</div>
      <div class="btn-group">
        <button class="btn btn-dir" onclick="setWorldDirection(0)">北</button>
        <button class="btn btn-dir" onclick="setWorldDirection(90)">東</button>
        <button class="btn btn-dir" onclick="setWorldDirection(180)">南</button>
        <button class="btn btn-dir" onclick="setWorldDirection(270)">西</button>
        <button id="compass-btn" class="btn compass-toggle" onclick="toggleCompass()">🧭 磁気連動 OFF</button>
      </div>
      <div class="time-row" style="margin-bottom: 6px;">
        <span class="time-label" id="heading-out">0°</span>
        <input id="heading-range" class="slider" type="range" min="0" max="359" value="0">
      </div>
      <button id="sun-calib-btn" class="btn btn-dark" style="width: 100%;">☀ 実際の影に合わせる</button>
      <div class="calib-info" id="calib-info">未校正</div>
      <!-- 日付・現在地は太陽方位の計算そのものを左右する入力なので、方位タスクにまとめる -->
      <div class="time-row" style="margin-top: 10px;">
        <input id="date-input" class="date-input" type="date">
        <button id="geo-btn" class="btn btn-dark geo-btn">📍 現在地</button>
      </div>
      <div class="geo-info" id="geo-info">位置: 東京 (35.6895, 139.6917)</div>
    </div>

    <div id="section-place" class="task-section" style="display:none;">
      <div id="settings-section" class="settings-grid" style="display:none;">
        <!-- 壁の4項目は同時に4本出すと画面が埋まるので、タブで選んだ1本だけを表示する。
             データの持ち方(id/oninput)は既存のまま変えず、displayの切り替えだけで済ませる(updateDimTabs) -->
        <div class="dim-tabs" id="dim-tabs">
          <button class="dim-tab active" data-dim="wh">壁高<span id="dim-wh-val">3.0m</span></button>
          <button class="dim-tab" data-dim="ww">壁幅<span id="dim-ww-val">4.0m</span></button>
          <button class="dim-tab" data-dim="wd">奥行<span id="dim-wd-val">0.2m</span></button>
          <button class="dim-tab" data-dim="wr">回転<span id="dim-wr-val">0°</span></button>
        </div>
        <div class="ctrl-item ctrl-wall ctrl-dim dim-active" data-dim="wh"><label>壁高 <output id="wh-out">3.0m</output></label><input id="wh-range" class="slider" type="range" min="1" max="15" step="0.5" value="3"></div>
        <div class="ctrl-item ctrl-wall ctrl-dim" data-dim="ww"><label>壁幅 <output id="ww-out">4.0m</output></label><input id="ww-range" class="slider" type="range" min="0.5" max="20" step="0.5" value="4"></div>
        <div class="ctrl-item ctrl-wall ctrl-dim" data-dim="wd"><label>奥行 <output id="wd-out">0.2m</output></label><input id="wd-range" class="slider" type="range" min="0.1" max="5" step="0.1" value="0.2"></div>
        <div class="ctrl-item ctrl-wall ctrl-dim" data-dim="wr"><label>壁回転 <output id="wr-out">0°</output></label><input id="wr-range" class="slider" type="range" min="0" max="359" value="0"></div>
        <div class="ctrl-item ctrl-human"><label>身長 <output id="hh-out">160cm</output></label><input id="hh-range" class="slider" type="range" min="120" max="200" value="160"></div>
      </div>
      <!-- busy(配置中/移動中)は❌+状態ラベル+連続アイコンを1行で表示。selected/idleではここは隠す -->
      <div id="placing-row" class="placing-row">
        <span id="placing-status">配置中</span><span id="placing-repeat" title="連続で追加中" style="display:none;"> 🔁</span>
        <button id="cancel-place-btn" class="btn-cancel-outline" title="配置をキャンセル">キャンセル</button>
      </div>
      <!-- 影の先端までの距離。3Dに寝かせた文字は読めないので数値はここに出す（updateShadowTip） -->
      <div id="tip-readout" style="display:none;"><span>影の先端まで</span><strong id="tip-dist">--</strong></div>
      <!-- selectedのみ: 選択中の1個に対する操作。以前は「選択中」通知が単独の全幅バーだったが、
           位置を移動ボタンと同じ行に収めて1行減らす -->
      <div class="btn-group" id="place-selected-actions" style="display:none;">
        <div id="selected-notice" class="notice-compact" style="grid-column: span 3;">選択中<br>地面タップで解除</div>
        <button id="move-btn" class="btn btn-dark" style="grid-column: span 1; font-size: 10px; padding: 0 2px;">📍移動</button>
      </div>
      <!-- busy以外(idle/selected)で常に出す: 新規追加。選択中でも塞がない動線として残す -->
      <div class="btn-group" id="place-general-actions">
        <button id="add-wall-btn" class="btn btn-primary">壁を追加</button>
        <button id="add-human-btn" class="btn btn-purple">人を追加</button>
        <!-- ONのまま次回に持ち越さないよう、配置タブを離れた瞬間に自動でOFFへ戻す(applyActiveTask) -->

        <!-- selectedのみ(このボタンだけ独自にupdatePlaceViewで表示制御。他3つはidle/selectedで常時) -->

      </div>

      <div class="btn-group" id="place-idle-actions">
        <button id="clear-all-btn" class="btn btn-danger" style="grid-column: span 2; background: #880000;">全削除</button>

    <div id="section-verify" class="task-section verify-section" style="display:none;">
      <div class="verify-row"><span>影の方位</span><strong id="vf-shadow-az">--</strong></div>

      <div class="verify-row"><span id="vf-example-label">身長160cmの人の影</span><strong id="vf-example">--</strong></div>
      <div class="verify-measure">
        <label>物体の高さ<input id="vf-height" type="number" step="0.1" min="0" placeholder="1.6" inputmode="decimal">m</label>
        <label>実測した影<input id="vf-length" type="number" step="0.1" min="0" placeholder="3.2" inputmode="decimal">m</label>
      </div>
      <div class="verify-result" id="vf-result">高さと影の長さを入れると、その影になる時刻を逆算します</div>
      <div class="verify-lowsun" id="vf-lowsun" style="display:none;">太陽高度が低いため、影の長さは小さな誤差でも大きく変わります</div>
      <details class="verify-note-toggle">
        <summary>この検証についての注意事項</summary>
        <div class="verify-note">
          原点から30mより外のものは影を落としません／地面は平面として扱っています／
          影の<b>濃さ</b>は物理的な値ではありません。照合するのは<b>向きと長さ</b>です。
        </div>
      </details>
    </div>
  </div>

  <a-scene id="main-scene" vr-mode-ui="enabled: false" shadow="type: pcfsoft" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <a-assets></a-assets>
    <a-entity id="orbit-camera" camera position="0 10 20" orbit-controls="target: 0 0 0; enableDamping: true; dampingFactor: 0.15; rotateSpeed: 0.6; minDistance: 1; maxDistance: 80; maxPolarAngle: 1.5" active="true"></a-entity>
    <a-entity id="fps-rig" position="0 1.6 0">
      <!-- look-controls は使わない。タッチだと onTouchMove が yaw しか動かさず、
           検証したい足元の影を見下ろせないため、見回しは自前で yaw+pitch を扱う（bindLook）。
           wasd-controls もリグ内でカメラを別に動かし D-pad と二重になるので外す。 -->

      <a-plane id="ground" class="clickable" position="0 0 0" rotation="-90 0 0" width="100" height="100" material="color: #222; roughness: 0.9" shadow="receive: true"></a-plane>
      <!-- 尺度の土台。1m/5mのマス目を敷いて、写真と見比べる時に長さを目で読めるようにする。
           #world-root の子なので方位を回すとマス目も一緒に回り、N/S/E/W と向きが揃う。
           .clickable を付けないので地面タップの当たり判定は奪わない（中身は initGrid() で作る） -->
      <a-entity id="ground-grid"></a-entity>
      <a-entity id="guide-markers">
        <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="9.95" radius-outer="10.05" material="color: #00ff88; opacity: 0.4; transparent: true"></a-ring>
        <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="19.95" radius-outer="20.05" material="color: #00ff88; opacity: 0.2; transparent: true"></a-ring>
        <a-text value="N" position="0 0.1 -10.5" align="center" color="#ff4444" scale="3 3 3" rotation="-90 0 0"></a-text>
        <a-text value="E" position="10.5 0.1 0" align="center" color="#00ff88" scale="2.5 2.5 2.5" rotation="-90 0 -90"></a-text>
        <a-text value="S" position="0 0.1 10.5" align="center" color="#4488ff" scale="2.5 2.5 2.5" rotation="-90 0 180"></a-text>
        <a-text value="W" position="-10.5 0.1 0" align="center" color="#00ff88" scale="2.5 2.5 2.5" rotation="-90 0 90"></a-text>
        <!-- リングは描いてあっても何mか読めないので数値を振る。方位ラベルと重ならない北東側に置く -->
        <a-text value="10m" position="7.07 0.1 -7.07" align="center" color="#00ff88" scale="1.6 1.6 1.6" rotation="-90 0 45" opacity="0.7"></a-text>
        <a-text value="20m" position="14.14 0.1 -14.14" align="center" color="#00ff88" scale="1.6 1.6 1.6" rotation="-90 0 45" opacity="0.5"></a-text>
      </a-entity>
      <!-- 選択中のオブジェクトの影がどこまで届くかを示す（中身は initShadowTip() で作る） -->
      <a-entity id="shadow-tip" visible="false"></a-entity>
      <a-entity id="walls-container"></a-entity>
      <a-entity id="humans-container"></a-entity>
      <!-- 接地部のオクルージョン。オブジェクトの子にすると .clickable の当たり判定が
           足元まで広がって地面タップを塞ぐので、独立したコンテナで管理する -->
      <a-entity id="contact-shadows"></a-entity>
      <a-box id="preview-wall" material="color: #ff9800; transparent: true; opacity: 0.5" depth="0.2" visible="false"></a-box>
      <!-- 中身は buildHumanParts() で実体と同じ形を組む -->

  <script>
    const $ = id => document.getElementById(id);
    const sceneEl = $('main-scene');
    const worldRoot = $('world-root');
    const wallsContainer = $('walls-container');
    const humansContainer = $('humans-container');
    const sunLight = $('sun-light');
    const previewWall = $('preview-wall');
    const previewHuman = $('preview-human');
    let humanObjects = [], isFps = false, isCompassActive = false, selectedEl = null, pendingType = null, moveState = { fwd: 0, bwd: 0, left: 0, right: 0 };
    let compassHandler = null, compassEventName = null, targetHeading = null, smoothHeading = null;
    let LAT = 35.6895, LON = 139.6917;
    const norm = v => (v % 360 + 360) % 360;
    const getDirName = v => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.floor((norm(v) + 22.5) / 45) % 8];

    function updateHUD(deg) {
      deg = norm(deg);
      $('heading-text').textContent = `${getDirName(deg)} (${Math.round(deg)}°)`;
      const dirs = ['NW', 'N', 'NE', 'E', 'SE', 'S', 'SW', 'W'];
      $('compass-strip').innerHTML = dirs.map(d => d === getDirName(deg) ? `<b>${d}</b>` : d).join(' ');
    }

    // ─── シャドウ品質の適用 ─────────────────────────────────────────
    function initShadowQuality() {
      const c = SHADOW_CFG;
      sunLight.setAttribute('light', {
        shadowMapWidth: c.mapSize, shadowMapHeight: c.mapSize,
        shadowCameraLeft: -c.halfExtent, shadowCameraRight: c.halfExtent,
        shadowCameraTop: c.halfExtent, shadowCameraBottom: -c.halfExtent,
        shadowCameraNear: c.near, shadowCameraFar: c.far,
        shadowBias: c.bias
      });
      // normalBias は A-Frame の light スキーマにないので three 側へ直接入れる。
      // updateShadow() は normalBias を触らないので上書きされない。
      const l = sunLight.components.light && sunLight.components.light.light;
      if (l && l.shadow) l.shadow.normalBias = c.normalBias;
    }

    // ─── コンタクトシャドウ（接地部のオクルージョン）─────────────────
    // 太陽の落とす影とは別物で、環境光が接地部で遮られる分の落ち込みを表す。
    // 乗算ブレンドの板を接地面に敷き、太陽方向に依らず常に接地感を出す。
    const SELECT_COLOR = '#ff9800';   // 選択中の色。プレビューも同じ色を使う
    const CONTACT_Y = 0.012;        // 地面(0)とガイドリング(0.02)の間に置く
    const CONTACT_DARKEST = 60;     // 最も濃い部分のグレー値(0-255)
    const CONTACT_WALL_SPREAD = 0.35; // 壁の両端に広げる量[m]
    const CONTACT_HUMAN_SIZE = 0.7;   // 身長160cm時の足元の広がり[m]

    function makeAOTexture(build) {
      const s = 128, cv = document.createElement('canvas');
      cv.width = cv.height = s;
      const ctx = cv.getContext('2d'), img = ctx.createImageData(s, s);
      for (let y = 0; y < s; y++) {
        for (let x = 0; x < s; x++) {
          const a = build((x + 0.5) / s, (y + 0.5) / s);   // 0(遮蔽なし)〜1(最も濃い)
          const g = Math.round(255 - a * (255 - CONTACT_DARKEST));
          const i = (y * s + x) * 4;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = g;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // 壁: 壁に垂直な方向へ減衰させる。長い壁でも根元が均一に濃くなるよう、
    // 長手方向は端の 15% だけで抜く。
    const wallAOTex = makeAOTexture((u, v) => {
      const across = Math.pow(1 - Math.abs(v - 0.5) * 2, 2.2);
      const along = Math.min(1, (1 - Math.abs(u - 0.5) * 2) / 0.25);
      return across * along;
    });
    // 人: 足元の等方な落ち込み
    const humanAOTex = makeAOTexture((u, v) => {
      const r = Math.min(1, Math.hypot(u - 0.5, v - 0.5) * 2);
      return Math.pow(1 - r, 2.2);
    });

    const contactGeo = new THREE.PlaneGeometry(1, 1);
    function contactMaterial(tex) {
      return new THREE.MeshBasicMaterial({
        map: tex, blending: THREE.MultiplyBlending,
        transparent: true, depthWrite: false, toneMapped: false
      });
    }
    const wallAOMat = contactMaterial(wallAOTex), humanAOMat = contactMaterial(humanAOTex);

    function attachContact(el, mat) {
      const m = new THREE.Mesh(contactGeo, mat);
      m.castShadow = false; m.receiveShadow = false;
      m.renderOrder = 2;
      m.rotation.order = 'YXZ';   // 寝かせた板を世界のY軸まわりに回すため
      el.__contact = m;
      $('contact-shadows').object3D.add(m);
      // 生成直後のエンティティはまだ初期化されておらず getAttribute が既定値を返すので待つ
      if (el.hasLoaded) syncContact(el);
      else el.addEventListener('loaded', () => syncContact(el), { once: true });
    }

    function syncContact(el) {
      const m = el.__contact;
      if (!m) return;
      const p = el.getAttribute('position');
      m.position.set(p.x, CONTACT_Y, p.z);
      if (el.dataset.type === 'human') {
        const s = el.getAttribute('scale').x;
        m.scale.set(CONTACT_HUMAN_SIZE * s, CONTACT_HUMAN_SIZE * s, 1);
        m.rotation.set(-Math.PI / 2, 0, 0);
      } else {
        m.scale.set(+el.getAttribute('width') + CONTACT_WALL_SPREAD * 2, +el.getAttribute('depth') + CONTACT_WALL_SPREAD * 2, 1);
        m.rotation.set(-Math.PI / 2, THREE.MathUtils.degToRad(el.getAttribute('rotation').y), 0);
      }
      // 位置・寸法が変わる操作はここを必ず通るので、影の先端もまとめて追従させる
      updateShadowTip();
    }

    function removeContact(el) {
      if (!el.__contact) return;
      $('contact-shadows').object3D.remove(el.__contact);
      el.__contact = null;
    }

    // ─── 地面グリッド（尺度）─────────────────────────────────────────
    // 現実の写真と見比べる時、画面から長さを読む手がかりが要る。
    // 1mの細線と5mの太線を重ね、マス目を数えれば距離が概算できるようにする。
    // GridHelper は LineSegments なので影の授受はせず、.clickable でもないので
    // 地面タップのレイキャストにも入らない。
    const GRID_Y = 0.006;   // 地面(0)とコンタクトシャドウ(0.012)の間
    function initGrid() {
      // 目線視点では遠くのマス目が地平線に潰れて縞ノイズになるので、細かい線ほど狭く敷く。
      // 範囲は既存の目印に合わせる: 1mは内側のガイドリング(10m)まで、
      // 5mはシャドウカメラの半幅(この外は影を落とさない)まで。
      const add = (cell, half, opacity) => {
        const g = new THREE.GridHelper(half * 2, half * 2 / cell, 0x00ff88, 0x00ff88);
        g.position.y = GRID_Y;
        g.material.transparent = true;
        g.material.opacity = opacity;
        g.material.depthWrite = false;
        $('ground-grid').object3D.add(g);
      };
      add(1, 10, 0.10);
      add(5, SHADOW_CFG.halfExtent, 0.22);
    }

    // ─── 影の先端 ───────────────────────────────────────────────────
    // 現場で見ているのは「影がどこまで来るか」なので、選択中のオブジェクトについて
    // 根元から先端までの線と距離を出す。長さは検証カードと同じ 1/tan(高度) を使う。
    // 全部に出すと画面が埋まるので選択中の1つだけに絞る。
    const STRIDE_RATIO = 0.45;    // 1歩 ≈ 身長 × これ。歩測は桁を掴むための単位なので目安に留める
    const LOW_SUN_DEG = 15;       // これ未満は 1/tan の効きが急で、影長の誤差が大きくなる
    let tipLine = null, tipRing = null;

    function initShadowTip() {
      const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      tipLine = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.9, depthWrite: false }));
      $('shadow-tip').object3D.add(tipLine);
      tipRing = document.createElement('a-ring');
      tipRing.setAttribute('rotation', '-90 0 0');
      tipRing.setAttribute('radius-inner', '0.18');
      tipRing.setAttribute('radius-outer', '0.3');
      tipRing.setAttribute('material', 'color: #ffd700; opacity: 0.9; transparent: true');
      $('shadow-tip').appendChild(tipRing);
    }

    // 3Dの地面に寝かせた文字は、目線に近い角度から見ると潰れて読めない。
    // 距離の数値はパネル側（#tip-readout）に出し、3D空間には線と先端マーカーだけを描く。
    function updateShadowTip() {
      const host = $('shadow-tip'), out = $('tip-readout');
      if (!host || !tipLine) return;
      // 選択が無い／太陽が地平線下なら出すものが無い。
      // 移動中は実体が移動前の位置に留まったまま隠れているので、古い位置の影を描かない
      if (!selectedEl || movingEl || !sunState.aboveHorizon) {
        host.setAttribute('visible', false);
        if (out) out.style.display = 'none';
        return;
      }
      const p = selectedEl.getAttribute('position');
      const h = selectedEl.dataset.type === 'wall'
        ? +selectedEl.getAttribute('height')
        : selectedEl.getAttribute('scale').x * 1.6;
      const L = h / Math.tan(sunState.altDeg * Math.PI / 180);
      // #sun-light と同じローカル座標系。太陽へ向かう水平方向が (sin(az), -cos(az)) なので影はその逆
      const az = sunState.azDeg * Math.PI / 180;
      const tx = p.x - L * Math.sin(az), tz = p.z + L * Math.cos(az);
      const pos = tipLine.geometry.attributes.position;
      pos.setXYZ(0, p.x, GRID_Y, p.z);
      pos.setXYZ(1, tx, GRID_Y, tz);
      pos.needsUpdate = true;
      tipLine.geometry.computeBoundingSphere();
      tipRing.setAttribute('position', `${tx} ${GRID_Y} ${tz}`);
      host.setAttribute('visible', true);
      if (out) {
        // 入力側が歩測精度なので 0.1m 刻みまで。cm は出さない
        const strideM = (+$('hh-range').value / 100) * STRIDE_RATIO;
        $('tip-dist').textContent = `${L.toFixed(1)}m（≈${Math.round(L / strideM)}歩）`;
        out.style.display = 'flex';
      }
    }

    // ─── 太陽の状態 ─────────────────────────────────────────────────
    // 方位校正と検証カードの両方が参照するので、使い捨てにせずここに持つ。
    let sunState = { altDeg: 0, azDeg: 0, aboveHorizon: false };

    // 「その日の何分か」から Date を作る。
    // 端末のローカルタイムゾーンで解釈する（JST 固定をやめ、現在地取得と整合させる）
    function simDate(minutes) {
      const h = Math.floor(minutes / 60), m = minutes % 60;
      const now = new Date();
      const ymd = ($('date-input').value || '').split('-').map(Number);
      return (ymd.length === 3 && ymd.every(Number.isFinite))
        ? new Date(ymd[0], ymd[1] - 1, ymd[2], h, m, 0)
        : new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    }

    // 指定時刻の太陽高度・方位[度]。方位は真北基準・時計回り
    function sunAt(minutes) {
      const p = SunCalc.getPosition(simDate(minutes), LAT, LON);
      return { altDeg: p.altitude * 180 / Math.PI, azDeg: norm((p.azimuth + Math.PI) * 180 / Math.PI) };
    }

    function updateSimulation() {
      const minutes = +$('time-range').value, h = Math.floor(minutes / 60), m = minutes % 60;
      $('time-display').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      const s = sunAt(minutes);
      sunState = { altDeg: s.altDeg, azDeg: s.azDeg, aboveHorizon: s.altDeg > 0 };
      const az = s.azDeg * Math.PI / 180, alt = s.altDeg * Math.PI / 180, dist = 40;
      sunLight.setAttribute('position', `${dist * Math.cos(alt) * Math.sin(az)} ${dist * Math.sin(alt)} ${-dist * Math.cos(alt) * Math.cos(az)}`);
      // 地平線下では光源が地面より下に来て下から照らしてしまうので、消灯して影も止める
      const aboveHorizon = sunState.aboveHorizon;
      sunLight.setAttribute('light', 'intensity', aboveHorizon ? 1.3 : 0);
      // castShadow を setAttribute で変えるとスライダー操作のたびにシャドウマップが
      // 再構成されるので、three のライトへ直接入れる
      const l = sunLight.components.light && sunLight.components.light.light;
      if (l) l.castShadow = aboveHorizon;
      $('sun-info').textContent = aboveHorizon
        ? `太陽高度 ${s.altDeg.toFixed(1)}° / 方位 ${s.azDeg.toFixed(1)}°`
        : `太陽: 地平線下 (${s.altDeg.toFixed(1)}°)`;
      updateCalibUI();
      updateVerifyCard();
    }

    function createWall(x, z, dims) {
      const w = dims ? dims.w : +$('ww-range').value;
      const h = dims ? dims.h : +$('wh-range').value;
      const d = dims ? dims.d : +$('wd-range').value;
      const r = dims ? dims.r : +$('wr-range').value;
      const wall = document.createElement('a-box');
      wall.classList.add('clickable');
      wall.dataset.originalColor = '#7f8c8d';
      wall.dataset.type = 'wall';
      wall.setAttribute('position', `${x} ${h/2} ${z}`);
      wall.setAttribute('width', w); wall.setAttribute('height', h); wall.setAttribute('depth', d);
      wall.setAttribute('rotation', `0 ${r} 0`);
      wall.setAttribute('material', 'color: #7f8c8d; roughness: 0.6');
      wall.setAttribute('shadow', 'cast: true; receive: true');
      wall.addEventListener('click', e => { e.stopPropagation(); selectObject(wall); });
      wallsContainer.appendChild(wall);
      attachContact(wall, wallAOMat);
    }

const HUMAN_PARTS = [

  // 黒い外形
  { tag:'a-sphere', pos:'0 1.5 0', rad:0.16, col:'#111111' },
  { tag:'a-box', pos:'0 0.85 0', w:0.42, h:0.72, d:0.22, col:'#111111' },

  // 白い本体
  { tag:'a-sphere', pos:'0 1.5 0.03', rad:0.145, col:'#ffffff' },
  { tag:'a-box', pos:'0 0.85 0.03', w:0.36, h:0.66, d:0.18, col:'#ffffff' },

// 左腕 黒ふち
{
 tag:'a-cylinder',
 pos:'-0.25 1.05 0',
 rad:0.05,
 h:0.45,
 rot:'0 0 45',
 col:'#111111'
},

// 左腕 白
{
 tag:'a-cylinder',
 pos:'-0.25 1.05 0',
 rad:0.032,
 h:0.43,
 rot:'0 0 45',
 col:'#ffffff'
},

// 右腕 白
{
 tag:'a-cylinder',
 pos:'0.25 1.05 0',
 rad:0.032,
 h:0.43,
 rot:'0 0 -45',
 col:'#ffffff'
},
  // 右腕 黒ふち
{
 tag:'a-cylinder',
 pos:'0.25 1.05 0',
 rad:0.05,
 h:0.45,
 rot:'0 0 -45',
 col:'#111111'
},


  
  // 足
  { tag:'a-cylinder', pos:'-0.13 0.32 0', rad:0.075, h:0.62, col:'#111111' },
  { tag:'a-cylinder', pos:'-0.13 0.32 0.03', rad:0.055, h:0.58, col:'#ffffff' },

  { tag:'a-cylinder', pos:'0.13 0.32 0', rad:0.075, h:0.62, col:'#111111' },
  { tag:'a-cylinder', pos:'0.13 0.32 0.03', rad:0.055, h:0.58, col:'#ffffff' }

];

    // ghostColor を渡すとプレビュー用の半透明ゴーストになる（影は落とさない）
    function buildHumanParts(container, ghostColor) {
      HUMAN_PARTS.forEach(p => {
        const el = document.createElement(p.tag);
        el.setAttribute('position', p.pos);
        if (p.rad) el.setAttribute('radius', p.rad);
        if (p.w) { el.setAttribute('width', p.w); el.setAttribute('height', p.h); el.setAttribute('depth', p.d); }
        if (p.tag === 'a-cylinder') { el.setAttribute('radius', p.rad); el.setAttribute('height', p.h); }
        if (p.rot) el.setAttribute('rotation', p.rot);
        if (ghostColor) {
          el.setAttribute('material', `color: ${ghostColor}; transparent: true; opacity: 0.5`);
        } else {
          // 陰影を優先するため flat シェーダーは使わず標準シェーダーのままにする
          el.setAttribute('material', `color: ${p.col}`);
          el.dataset.originalColor = p.col;
          el.setAttribute('shadow', 'cast: true');
        }
        container.appendChild(el);
      });
    }

    function createHuman(x, z, heightCm) {
      const hh = (heightCm !== undefined ? heightCm : +$('hh-range').value) / 100;
      const human = document.createElement('a-entity');
      human.classList.add('clickable');
      human.dataset.type = 'human';
      human.setAttribute('position', `${x} 0 ${z}`);
      human.setAttribute('scale', `${hh/1.6} ${hh/1.6} ${hh/1.6}`);
      buildHumanParts(human);
      human.addEventListener('click', e => { e.stopPropagation(); selectObject(human); });
      humansContainer.appendChild(human);
      humanObjects.push({ el: human, x: x, z: z });
      attachContact(human, humanAOMat);
    }

    function selectObject(el) {
      // 目線視点は「見るだけ」。見回しのドラッグ終わりに壁を誤タップしても、
      // 操作パネルが出ないまま選択色だけ付く状態にならないようにする
      if (isFps) return;
      if (movingEl) endMove();
      if (selectedEl) deselectObject();
      if (pendingType) endPlacement();
      selectedEl = el;
      const isWall = el.dataset.type === 'wall';
      if (isWall) el.setAttribute('material', 'color', SELECT_COLOR);
      else el.querySelectorAll('*').forEach(c => c.setAttribute('material', 'color', SELECT_COLOR));
      setSettingsTarget(isWall ? 'wall' : 'human');
      setActiveTask('place');
      if (isWall) {
        const w = el.getAttribute('width'), h = el.getAttribute('height'), d = el.getAttribute('depth'), rot = el.getAttribute('rotation');
        $('ww-range').value = w; $('ww-out').textContent = $('dim-ww-val').textContent = w + 'm';
        $('wh-range').value = h; $('wh-out').textContent = $('dim-wh-val').textContent = h + 'm';
        $('wd-range').value = d; $('wd-out').textContent = $('dim-wd-val').textContent = d + 'm';
        $('wr-range').value = rot.y; $('wr-out').textContent = $('dim-wr-val').textContent = rot.y + '°';
      } else {
        const scale = el.getAttribute('scale').x;
        const hhVal = Math.round(scale * 160);
        $('hh-range').value = hhVal; $('hh-out').textContent = hhVal + 'cm';
      }
      updatePlaceView();
      updateShadowTip();
    }

    function deselectObject() {
      if (!selectedEl) return;
      if (movingEl === selectedEl) endMove();
      if (selectedEl.dataset.type === 'wall') selectedEl.setAttribute('material', 'color', selectedEl.dataset.originalColor);
      else selectedEl.querySelectorAll('*').forEach(c => c.setAttribute('material', 'color', c.dataset.originalColor));
      selectedEl = null;
      setSettingsTarget(null);
      updatePlaceView();
      updateShadowTip();
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const _tmpVec = new THREE.Vector3();

    // レイキャストの交点はワールド座標だが、壁・人・プレビューは回転する #world-root の子なので
    // ローカル座標へ変換してから position に入れる（変換しないと世界回転ぶんズレる）
    function toWorldRootLocal(pt) {
      worldRoot.object3D.updateMatrixWorld();
      return worldRoot.object3D.worldToLocal(_tmpVec.copy(pt));
    }

    // ─── タスクバー ──────────────────────────────────────────────────
    // 「常時使う導線」（太陽情報・向きの数値・時刻スライダー）と「作業ごとの詳細パネル」を
    // 分離する。詳細パネルは 方位/配置/検証 のうちどれか1つだけを開く。状態はこの1変数だけが
    // 持ち、ユーザーの手動タップと selectObject 等の自動遷移が同じ関数を通るようにして、
    // 「どちらが勝つか未定義」という状態を作らない。
    let activeTask = null;   // null | 'heading' | 'place' | 'verify'
    // 遊びで連続配置するためのフラグ。ONを次回セッション/次回タブ訪問に持ち越すと
    // 「見えない設定が生きている」事故のもとになるので、配置タブを離れた瞬間に必ずOFFへ戻す。
    let repeatPlacement = false;

    function applyActiveTask() {
      $('section-heading').style.display = activeTask === 'heading' ? 'block' : 'none';
      $('section-place').style.display = activeTask === 'place' ? 'block' : 'none';
      $('section-verify').style.display = activeTask === 'verify' ? 'block' : 'none';
      $('task-heading-btn').classList.toggle('active', activeTask === 'heading');
      $('task-place-btn').classList.toggle('active', activeTask === 'place');
      $('task-verify-btn').classList.toggle('active', activeTask === 'verify');
      if (activeTask !== 'place') { repeatPlacement = false; $('repeat-place-btn').classList.remove('active'); }
      if (activeTask === 'verify') updateVerifyCard();
      if (activeTask === 'place') updatePlaceView();
      requestAnimationFrame(positionDpad);
    }
    // 自動遷移用。既に開いていても閉じない（selectObject 等からの強制オープン）
    function setActiveTask(name) {
      // 目線視点でも検証タブだけは開ける。配置・移動系は startPlacement/startMove/
      // selectObject 側に個別の isFps ガードがあるので、ここを緩めても漏れて動かない
      if (isFps && name !== 'verify') return;
      activeTask = name;
      applyActiveTask();
    }
    // タスクバーのボタン用。同じものをもう一度押したら閉じる
    function toggleTask(name) { setActiveTask(activeTask === name ? null : name); }
    // 配置中/移動中はキャンセルボタンで抜けてから切り替えてもらう
    // （プレビューが宙に浮いたままタスクが切り替わる、という未定義状態を作らないため）
    function taskBarBusy() { return !!(pendingType || movingEl); }

    // 既存呼び出し互換。設定セクションの表示/非表示という意味だけを持つ
    function showSettings(on) { setActiveTask(on ? 'place' : null); }

    // 対象に関係のないスライダーは隠す。null なら全部出す
    // 壁は高さ/幅/奥行/回転の4本を同時に出すと縦に長くなるので、タブで選んだ1本だけを表示する
    let activeWallDim = 'wh';
    function updateDimTabs() {
      document.querySelectorAll('.ctrl-dim').forEach(e => { e.style.display = (e.dataset.dim === activeWallDim) ? 'block' : 'none'; });
      document.querySelectorAll('.dim-tab').forEach(e => e.classList.toggle('active', e.dataset.dim === activeWallDim));
    }
    function setSettingsTarget(type) {
      document.querySelectorAll('.ctrl-wall').forEach(e => e.style.display = (!type || type === 'wall') ? 'block' : 'none');
      document.querySelectorAll('.ctrl-human').forEach(e => e.style.display = (!type || type === 'human') ? 'block' : 'none');
      // dim-tabs は grid 表示なので、.ctrl-wall と同じ block 指定はできない(別枠で切り替える)
      $('dim-tabs').style.display = (!type || type === 'wall') ? 'grid' : 'none';
      // 人に切り替えた時は壁のタブ状態に触れない（次に壁へ戻った時のためにdisplay:noneのまま残す）
      if (type === 'human') return;
      // 選択対象が変わるたびに壁高へ戻す。前のオブジェクトで回転タブを見ていたのに
      // 次のオブジェクトでも回転タブのまま、という混乱を避ける
      if (type === 'wall') activeWallDim = 'wh';
      updateDimTabs();
    }
    document.querySelectorAll('.dim-tab').forEach(btn => {
      btn.addEventListener('click', () => { activeWallDim = btn.dataset.dim; updateDimTabs(); });
    });

    // 配置タスクの中身を「今何をしている最中か」で1段階さらに絞り込む。
    // pendingType/movingEl/selectedEl から毎回その場で計算し、保存された状態は持たない
    // （状態を複数箇所に持つと更新漏れで表示がズレるため、呼び出し側は更新後にこれを呼ぶだけにする）。
    // busy(配置中/移動中)はキャンセルのみ。selectedは新規追加系ボタンも残す
    // （選択中に別のオブジェクトを追加する操作を塞がないため、隠すのは一時的な作業中だけにする）。
    function updatePlaceView() {
      const busy = !!(pendingType || movingEl);
      // busy をさらに placing/moving に分ける。moving は既に大きさが決まったオブジェクトを
      // 動かすだけなので、スライダーは表示しない（移動は位置だけを決める操作として扱う）。
      // 手前にオブジェクトを置くと下部パネルと重なりやすいため、移動中はパネルを最小化して
      // 干渉を減らす。トレードオフとして、移動しながらの同時サイズ調整はできなくなる
      // （選択状態に戻ってから調整する2ステップになる）。
      const view = busy ? (movingEl ? 'moving' : 'placing') : (selectedEl ? 'selected' : 'idle');
      $('settings-section').style.display = (view === 'idle' || view === 'moving') ? 'none' : 'grid';
      $('placing-row').style.display = (view === 'placing' || view === 'moving') ? 'flex' : 'none';
      $('place-selected-actions').style.display = view === 'selected' ? 'grid' : 'none';
      $('place-general-actions').style.display = (view === 'placing' || view === 'moving') ? 'none' : 'grid';
      // 全削除・配置を保存は、1個を選んで調整している最中に同時に必要になりにくいので
      // idle(何も選んでいない/配置していない)の時だけ出す
      $('place-idle-actions').style.display = view === 'idle' ? 'grid' : 'none';
      // 選択削除は place-general-actions の中にあるが、idle(何も選んでいない)では
      // 削除するものが無いので、この1つだけ selected の時のみ表示する
      $('delete-btn').style.display = view === 'selected' ? 'flex' : 'none';
    }

    function updatePreview() {
      const type = currentPlacementType();
      if (type === 'wall') {
        const h = +$('wh-range').value, p = previewWall.getAttribute('position');
        previewWall.setAttribute('width', +$('ww-range').value);
        previewWall.setAttribute('height', h);
        previewWall.setAttribute('depth', +$('wd-range').value);
        previewWall.setAttribute('rotation', `0 ${+$('wr-range').value} 0`);
        previewWall.setAttribute('position', `${p.x} ${h / 2} ${p.z}`);
      } else if (type === 'human') {
        const s = +$('hh-range').value / 160;
        previewHuman.setAttribute('scale', `${s} ${s} ${s}`);
      }
    }

    // プレビューの初期位置。ドラッグしなくても見えるよう画面中央の地面に出す
    function screenCenterGroundPoint() {
      mouse.set(0, 0);
      raycaster.setFromCamera(mouse, sceneEl.camera);
      const hits = raycaster.intersectObject($('ground').object3D, true);
      return hits.length ? toWorldRootLocal(hits[0].point) : new THREE.Vector3(0, 0, 0);
    }

    // 新規配置中は pendingType、既存オブジェクトの移動中は movingEl が立つ。
    // どちらもプレビュー追従→地面タップで確定、という同じ操作なので type だけ切り替えて共用する。
    let movingEl = null;
    function currentPlacementType() {
      return movingEl ? movingEl.dataset.type : pendingType;
    }

    function startPlacement(type) {
      if (isFps) return;
      if (selectedEl) deselectObject();
      pendingType = type;
      const pt = screenCenterGroundPoint();
      previewWall.setAttribute('visible', type === 'wall');
      previewHuman.setAttribute('visible', type === 'human');
      (type === 'wall' ? previewWall : previewHuman).setAttribute('position', `${pt.x} 0 ${pt.z}`);
      updatePreview();
      setSettingsTarget(type);
      setActiveTask('place');
      $('placing-status').textContent = '配置中';
      $('placing-repeat').style.display = repeatPlacement ? 'inline' : 'none';
      updatePlaceView();
    }

    function endPlacement() {
      pendingType = null;
      previewWall.setAttribute('visible', false);
      previewHuman.setAttribute('visible', false);
      setSettingsTarget(null);
      setActiveTask(null);
      updatePlaceView();
    }

    // 選択済みオブジェクトの位置を動かす。配置と同じプレビュー機構を再利用し、
    // 移動中は元のオブジェクトを隠してゴーストだけ追従させる。
    function startMove() {
      if (!selectedEl || isFps) return;
      movingEl = selectedEl;
      movingEl.setAttribute('visible', false);
      const isWall = movingEl.dataset.type === 'wall';
      const pt = screenCenterGroundPoint();
      (isWall ? previewWall : previewHuman).setAttribute('position', `${pt.x} 0 ${pt.z}`);
      previewWall.setAttribute('visible', isWall);
      previewHuman.setAttribute('visible', !isWall);
      updatePreview();
      $('placing-status').textContent = '移動中';
      $('placing-repeat').style.display = 'none';
      setActiveTask('place');
      updatePlaceView();
      updateShadowTip();
    }

    function endMove() {
      if (!movingEl) return;
      movingEl.setAttribute('visible', true);
      movingEl = null;
      previewWall.setAttribute('visible', false);
      previewHuman.setAttribute('visible', false);
      updatePlaceView();
      updateShadowTip();
    }

    function getGroundPoint(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const rect = sceneEl.getBoundingClientRect();
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, sceneEl.camera);
      const intersects = raycaster.intersectObject($('ground').object3D, true);
      return intersects.length > 0 ? intersects[0].point : null;
    }

    function handlePointer(e) {
      if ((!pendingType && !movingEl) || isFps) return;
      // スライダーをドラッグした指の touchmove/pointermove がここまで伝播すると、
      // その指の画面座標をそのまま地面の交点として拾ってプレビューが暴れる。
      // パネル上で発生したイベントは無視する。
      if (e.target.closest('.panel, #dpad')) return;
      const hit = getGroundPoint(e);
      if (hit) {
        const pt = toWorldRootLocal(hit);
        const type = currentPlacementType();
        if (type === 'wall') {
          previewWall.setAttribute('position', `${pt.x} ${+$('wh-range').value/2} ${pt.z}`);
          previewWall.setAttribute('visible', true); previewHuman.setAttribute('visible', false);
        } else {
          previewHuman.setAttribute('position', `${pt.x} 0 ${pt.z}`);
          previewHuman.setAttribute('visible', true); previewWall.setAttribute('visible', false);
        }
      }
    }

    window.addEventListener('pointermove', handlePointer);
    window.addEventListener('touchmove', handlePointer);

    $('ground').addEventListener('click', e => {
      const hit = e.detail.intersection ? e.detail.intersection.point : null;
      if (movingEl) {
        if (hit) {
          const pt = toWorldRootLocal(hit);
          const y = movingEl.dataset.type === 'wall' ? +movingEl.getAttribute('height') / 2 : 0;
          movingEl.setAttribute('position', `${pt.x} ${y} ${pt.z}`);
          syncContact(movingEl);
          endMove();
        }
        return;
      }
      if (selectedEl) { deselectObject(); return; }
      if (!pendingType || isFps) return;
      if (hit) {
        const pt = toWorldRootLocal(hit);
        const type = pendingType;
        if (type === 'wall') createWall(pt.x, pt.z);
        else createHuman(pt.x, pt.z);
        // 連続で追加がONなら配置モードを抜けず、同じ種類でもう一度配置を始める
        if (repeatPlacement) startPlacement(type); else endPlacement();
      }
    });

    window.setWorldDirection = deg => {
      const v = norm(deg);
      worldRoot.setAttribute('rotation', `0 ${v} 0`);
      updateHUD(v);
      // 手動ダイヤルの表示も追従させる（磁気連動で回った時も含む）
      $('heading-range').value = Math.round(v) % 360;
      $('heading-out').textContent = Math.round(v) + '°';
    };

    // ─── 太陽を基準にした方位校正 ───────────────────────────────────
    // SunCalc の方位は真北基準だが、磁気コンパスが返す値が真北か磁北かは
    // プラットフォーム依存で保証がない（東京の偏角は約7.5度西）。
    // 偏角モデルを積むより、空にある太陽を基準器として使うほうが正確で、
    // 局所的な磁気擾乱（鉄筋・車・磁石）も同時に打ち消せる。
    const CALIB_STORAGE_KEY = 'shadow-sim-calib';
    let headingOffset = 0, calibratedAt = null;

    function saveCalibration() {
      localStorage.setItem(CALIB_STORAGE_KEY, JSON.stringify({
        headingOffset, at: calibratedAt, lat: LAT, lon: LON
      }));
    }

    function loadCalibration() {
      const raw = localStorage.getItem(CALIB_STORAGE_KEY);
      if (!raw) return;
      try {
        const d = JSON.parse(raw);
        if (Number.isFinite(d.headingOffset)) { headingOffset = d.headingOffset; calibratedAt = d.at || null; }
      } catch (e) {
        console.error('[calib] 校正データの読み込みに失敗しました', e);
      }
    }

    function clearCalibration() {
      headingOffset = 0; calibratedAt = null;
      localStorage.removeItem(CALIB_STORAGE_KEY);
      updateCalibUI();
    }
    window.clearCalibration = clearCalibration;

    function updateCalibUI() {
      const btn = $('sun-calib-btn'), info = $('calib-info');
      if (!btn || !info) return;
      // 影が無ければ基準器が無いので校正できない
      btn.disabled = !sunState.aboveHorizon;
      btn.textContent = sunState.aboveHorizon ? '☀ 実際の影に合わせる' : '☀ 校正不可（太陽が地平線下）';
      if (calibratedAt) {
        const t = new Date(calibratedAt);
        info.innerHTML = `校正済み ${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`
          + ` (${headingOffset >= 0 ? '+' : ''}${headingOffset.toFixed(1)}°)`
          + `<button onclick="clearCalibration()">破棄</button>`;
        info.classList.add('calibrated');
      } else {
        info.textContent = '未校正 / スマホの上端を実際の影に向けてタップ';
        info.classList.remove('calibrated');
      }
    }

    function calibrateBySun() {
      if (!sunState.aboveHorizon) return;
      // 影の方位は太陽方位の真裏。スマホの上端をその影に向けている前提で、
      // 画面の上方向＝影の方向 になるよう世界を回す。センサーが無くてもここまでは成立する。
      const shadowAz = norm(sunState.azDeg + 180);
      setWorldDirection(shadowAz);
      // コンパスの生値が取れていれば、そのズレをオフセットとして学習し以後の磁気連動に効かせる
      if (targetHeading !== null) {
        headingOffset = ((shadowAz - targetHeading + 540) % 360) - 180;
        calibratedAt = new Date().toISOString();
        smoothHeading = null;   // 補間を新しい基準へ引き直す
        saveCalibration();
      }
      updateCalibUI();
    }

    function toggleCompass() {
      if (isCompassActive) stopCompass();
      else if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(res => { if (res === 'granted') startCompass(); });
      } else startCompass();
    }
    function startCompass() {
      if (compassHandler) return;
      compassHandler = e => {
        // 0（真北）を捨てないよう Number.isFinite で判定する
        let hd = Number.isFinite(e.webkitCompassHeading) ? e.webkitCompassHeading
               : (Number.isFinite(e.alpha) ? 360 - e.alpha : NaN);
        if (!Number.isFinite(hd)) return;
        targetHeading = norm(hd);
      };
      // 両方に登録すると二重発火して競合するので、絶対方位が使える場合はそちらだけを使う
      compassEventName = ('ondeviceorientationabsolute' in window) ? 'deviceorientationabsolute' : 'deviceorientation';
      window.addEventListener(compassEventName, compassHandler, true);
      isCompassActive = true; $('compass-btn').textContent = '🧭 磁気連動 ON'; $('compass-btn').classList.add('active');
    }
    function stopCompass() {
      if (compassHandler) {
        window.removeEventListener(compassEventName, compassHandler, true);
        compassHandler = null;
      }
      targetHeading = null; smoothHeading = null;
      isCompassActive = false; $('compass-btn').textContent = '🧭 磁気連動 OFF'; $('compass-btn').classList.remove('active');
    }

    // ボトムパネルの高さは開いているタスクによって大きく変わるので、dpad はその都度
    // パネル直上に位置し直す（縦画面のみ。横画面はパネルが左右に分かれるので CSS に任せる）。
    const landscapeMQ = window.matchMedia('(orientation: landscape) and (max-height: 500px)');
    function positionDpad() {
      if (landscapeMQ.matches) { $('dpad').style.bottom = ''; return; }
      const rect = document.querySelector('.bottom-panel').getBoundingClientRect();
      $('dpad').style.bottom = Math.round(window.innerHeight - rect.top + 16) + 'px';
    }
    window.addEventListener('resize', positionDpad);

    // ─── 目線視点の見回し ─────────────────────────────────────────
    // 立ち位置は変えずに首だけ振る操作。磁気連動は「体の向き」として #world-root を
    // 回すので、こちらは「首の向き」としてカメラだけを回す（役割が重ならない）。
    // 俯瞰視点の orbit-controls と同じ canvas を取り合わないよう、
    // リスナーは目線視点に入る時だけ登録し、抜ける時に外す。
    const LOOK_PITCH_LIMIT = 85;   // 真上・真下まで倒すと何を見ているか分からなくなるので手前で止める
    const LOOK_SPEED = 0.2;        // px → 度
    let lookYaw = 0, lookPitch = 0, lookDrag = null;

    function applyLook() {
      // roll は常に 0。地平線が傾くと現実の見え方と対応しなくなる
      $('fps-camera').setAttribute('rotation', `${lookPitch} ${lookYaw} 0`);
    }
    function onLookDown(e) {
      // パネル・D-pad 上で始まった操作は見回しにしない（handlePointer と同じ判定）
      if (e.target.closest('.panel, #dpad')) return;
      lookDrag = { x: e.clientX, y: e.clientY };
    }
    function onLookMove(e) {
      if (!lookDrag) return;
      lookYaw -= (e.clientX - lookDrag.x) * LOOK_SPEED;
      lookPitch = Math.max(-LOOK_PITCH_LIMIT, Math.min(LOOK_PITCH_LIMIT, lookPitch - (e.clientY - lookDrag.y) * LOOK_SPEED));
      lookDrag = { x: e.clientX, y: e.clientY };
      applyLook();
    }
    function onLookUp() { lookDrag = null; }

    function bindLook(on) {
      const m = on ? 'addEventListener' : 'removeEventListener';
      sceneEl.canvas[m]('pointerdown', onLookDown);
      window[m]('pointermove', onLookMove);
      window[m]('pointerup', onLookUp);
      window[m]('pointercancel', onLookUp);
      if (!on) lookDrag = null;
    }

    $('toggle-fps-btn').onclick = () => {
      isFps = !isFps;
      const orbit = $('orbit-camera'), fps = $('fps-camera'), rig = $('fps-rig'), dpad = $('dpad');
      if (isFps) {
        // #fps-rig は #world-root の外なので、人のローカル座標をワールド座標へ変換して渡す
        if (humanObjects.length > 0) {
          const lastHuman = humanObjects[humanObjects.length - 1].el;
          lastHuman.object3D.updateMatrixWorld();
          const wp = lastHuman.object3D.getWorldPosition(new THREE.Vector3());
          rig.setAttribute('position', `${wp.x} 1.6 ${wp.z}`);
        }
        orbit.setAttribute('camera', 'active', false); fps.setAttribute('camera', 'active', true); dpad.style.display = 'grid';
        $('toggle-fps-btn').innerHTML = '<span class="ico">🚁</span>俯瞰視点'; $('toggle-fps-btn').classList.add('active');
        // 入るたびに水平へ戻す。時刻を送りながら影を比べる時、基準の画角が毎回同じになる
        lookPitch = 0; applyLook();
        bindLook(true);
        // FPS中は配置・方位パネルを開けない。setActiveTask は isFps を見て
        // verify 以外を no-op にするため、ここでは直接 activeTask を書き換えて閉じる
        activeTask = null; applyActiveTask();
      } else {
        bindLook(false);
        fps.setAttribute('camera', 'active', false); orbit.setAttribute('camera', 'active', true); dpad.style.display = 'none';
        $('toggle-fps-btn').innerHTML = '<span class="ico">🎮</span>FPS視点'; $('toggle-fps-btn').classList.remove('active');
      }
      $('task-heading-btn').disabled = isFps;
      $('task-place-btn').disabled = isFps;
      // 検証タブだけは目線視点でも開ける。実際の影と見比べる作業の中核なので塞がない
    };

    function bindMove(id, k) {
      const el = $(id);
      const p = e => { e.preventDefault(); moveState[k] = 1; };
      const r = e => { e.preventDefault(); moveState[k] = 0; };
      el.addEventListener('touchstart', p); el.addEventListener('touchend', r);
      el.addEventListener('mousedown', p); el.addEventListener('mouseup', r); el.addEventListener('mouseleave', r);
    }
    bindMove('btn-fwd', 'fwd'); bindMove('btn-bwd', 'bwd'); bindMove('btn-left', 'left'); bindMove('btn-right', 'right');

    const FPS_MOVE_SPEED = 7.2;   // units/秒。60fps時の従来の体感速度に合わせた値
    let lastStepTime = null;
    function step() {
      const now = performance.now();
      // dt の上限を 0.05s に丸め、タブ非アクティブから復帰した直後などに一気に動くのを防ぐ。
      // 初回フレームは dt=0 にして移動・追従をスキップする。
      const dt = lastStepTime === null ? 0 : Math.min((now - lastStepTime) / 1000, 0.05);
      lastStepTime = now;

      // 磁気センサーの生値は毎フレーム跳ねるので、最短回り方向へ補間して反映する。
      // 60fps基準で従来と同じ追従速度になるよう、フレームレートに依らない指数減衰にする。
      if (isCompassActive && targetHeading !== null) {
        // 太陽で学習したオフセットを生値に足してから補間する
        const corrected = norm(targetHeading + headingOffset);
        if (smoothHeading === null) smoothHeading = corrected;
        const diff = ((corrected - smoothHeading + 540) % 360) - 180;
        const factor = 1 - Math.pow(0.85, dt * 60);
        smoothHeading = norm(smoothHeading + diff * factor);
        setWorldDirection(smoothHeading);
      }
      if (isFps) {
        const rig = $('fps-rig'), cam = $('fps-camera'), pos = rig.getAttribute('position'), rot = cam.getAttribute('rotation');
        if (moveState.fwd || moveState.bwd || moveState.left || moveState.right) {
          const move = FPS_MOVE_SPEED * dt, y = (rot ? rot.y : 0) * Math.PI / 180;
          let dx = 0, dz = 0;
          if (moveState.fwd) { dx -= Math.sin(y)*move; dz -= Math.cos(y)*move; }
          if (moveState.bwd) { dx += Math.sin(y)*move; dz += Math.cos(y)*move; }
          if (moveState.left) { dx -= Math.cos(y)*move; dz += Math.sin(y)*move; }
          if (moveState.right) { dx += Math.cos(y)*move; dz -= Math.sin(y)*move; }
          rig.setAttribute('position', `${pos.x + dx} ${pos.y} ${pos.z + dz}`);
        }
      }
      requestAnimationFrame(step);
    }
    step();

    $('add-wall-btn').onclick = () => startPlacement('wall');
    $('add-human-btn').onclick = () => startPlacement('human');
    $('repeat-place-btn').onclick = () => {
      repeatPlacement = !repeatPlacement;
      $('repeat-place-btn').classList.toggle('active', repeatPlacement);
    };
    $('move-btn').onclick = () => startMove();
    $('cancel-place-btn').onclick = () => { if (movingEl) endMove(); else endPlacement(); };
    window.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (movingEl) endMove();
      else if (pendingType) endPlacement();
      else if (selectedEl) deselectObject();
    });
    $('delete-btn').onclick = () => { if (selectedEl) {
      if (movingEl === selectedEl) endMove();
      humanObjects = humanObjects.filter(o => o.el !== selectedEl);
      removeContact(selectedEl);
      selectedEl.remove(); deselectObject();
    } };
    $('clear-all-btn').onclick = () => { if (confirm('すべてのオブジェクトを削除しますか？')) { wallsContainer.innerHTML = ''; humansContainer.innerHTML = ''; $('contact-shadows').object3D.clear(); humanObjects = []; deselectObject(); } };

    // ─── 幾何量の検証カード ─────────────────────────────────────────
    // 比較していいのは向きと長さだけ。明るさ（環境光0.5／直射1.3）は物理的な照度比ではない。
    // 影の長さ比は 1/tan(高度) で、高度が分かれば長さが決まる（逆も同じ）。
    function updateVerifyCard() {
      if (!$('vf-shadow-az')) return;
      if (sunState.aboveHorizon) {
        const shadowAz = norm(sunState.azDeg + 180);
        const ratio = 1 / Math.tan(sunState.altDeg * Math.PI / 180);
        const hh = +$('hh-range').value;
        $('vf-shadow-az').textContent = `${getDirName(shadowAz)} (${shadowAz.toFixed(1)}°)`;
        $('vf-ratio').textContent = `高さ1mあたり ${ratio.toFixed(2)}m`;
        $('vf-example-label').textContent = `身長${hh}cmの人の影`;
        $('vf-example').textContent = `${(ratio * hh / 100).toFixed(2)}m`;
      } else {
        $('vf-shadow-az').textContent = '--';
        $('vf-ratio').textContent = '--';
        $('vf-example').textContent = '--';
      }
      // 影長は 1/tan(高度) なので、高度が低いほど同じ角度誤差でも長さが大きく振れる。
      // 数字だけ出して信頼度の差を黙っているのは誤解のもとなので、低い時だけ添える。
      $('vf-lowsun').style.display =
        (sunState.aboveHorizon && sunState.altDeg < LOW_SUN_DEG) ? 'block' : 'none';
      updateVerifyResult();
      updateShadowTip();
    }

    // 実測の影長から太陽高度を逆算し、その高度になる時刻を当日内から探す。
    // 差を度で見せるより「何時頃の影か」のほうが原因（時刻/日付/現在地）に直結する。
    function updateVerifyResult() {
      const out = $('vf-result');
      if (!out) return;
      const setMsg = (text, mismatch) => {
        out.textContent = text;
        out.classList.toggle('mismatch', !!mismatch);
      };
      const h = parseFloat($('vf-height').value), L = parseFloat($('vf-length').value);
      if (!Number.isFinite(h) || !Number.isFinite(L) || h <= 0 || L <= 0) {
        setMsg('高さと影の長さを入れると、その影になる時刻を逆算します', false);
        return;
      }
      if (!sunState.aboveHorizon) {
        setMsg('太陽が地平線下です（日の出前／日没後）。この時刻では逆算できません。', true);
        return;
      }
      const measuredAlt = Math.atan(h / L) * 180 / Math.PI;
      const setMinutes = +$('time-range').value;

      // 1日ぶんの高度を先に引く（以降は配列参照で済む）
      const alt = new Array(1440);
      let peak = -90;
      for (let t = 0; t < 1440; t++) { alt[t] = sunAt(t).altDeg; if (alt[t] > peak) peak = alt[t]; }

      // 高度は南中を挟んで対称なので、同じ高度になる時刻が1日に2つある。
      // 設定時刻を含む「太陽が出ていて高度が単調に変化する区間」だけを探索して取り違えを防ぐ。
      // 南中の分で半日に割る方式は、端末TZと現地の経度が離れて昼が日付をまたぐ場合に破綻する。
      const rising = alt[Math.min(1439, setMinutes + 1)] > alt[setMinutes];
      let from = setMinutes, to = setMinutes;
      while (from > 0 && alt[from - 1] > 0 && (rising ? alt[from - 1] < alt[from] : alt[from - 1] > alt[from])) from--;
      while (to < 1439 && alt[to + 1] > 0 && (rising ? alt[to + 1] > alt[to] : alt[to + 1] < alt[to])) to++;

      let best = null;
      for (let t = from; t <= to; t++) {
        const diff = Math.abs(alt[t] - measuredAlt);
        if (best === null || diff < best.diff) best = { t, diff, alt: alt[t] };
      }
      // その日の最大高度を超える影長比は、時刻のずれでは説明できない
      if (measuredAlt > peak + 0.5) {
        setMsg(`実測から逆算した太陽高度は ${measuredAlt.toFixed(1)}° ですが、`
          + `この日・この場所での最大は ${peak.toFixed(1)}° です。`
          + `時刻ではなく日付か現在地の設定を確認してください。`, true);
        return;
      }
      const hh = String(Math.floor(best.t / 60)).padStart(2, '0');
      const mm = String(best.t % 60).padStart(2, '0');
      const delta = best.t - setMinutes;
      const setHH = String(Math.floor(setMinutes / 60)).padStart(2, '0');
      const setMM = String(setMinutes % 60).padStart(2, '0');
      const base = `実測の影は ${hh}:${mm} 頃の長さです（逆算した太陽高度 ${measuredAlt.toFixed(1)}°／設定は ${setHH}:${setMM}）。`;
      if (Math.abs(delta) <= 5) {
        setMsg(base + ' 設定と一致しています。', false);
      } else {
        setMsg(base + ` ${Math.abs(delta)}分${delta > 0 ? '進めると' : '戻すと'}一致します。`, true);
      }
    }

    // ─── 配置の保存/復元 ────────────────────────────────────────────
    // 保存対象は配置物（壁・人）のみ。時刻/日付/現在地/世界の向きは対象外。
    // 明示的な保存ボタンでのみ保存し、リロード時は自動で復元する。
    const SCENE_STORAGE_KEY = 'shadow-sim-scene';

    function saveScene() {
      const walls = [...wallsContainer.children].map(el => {
        const p = el.getAttribute('position'), rot = el.getAttribute('rotation');
        return { x: p.x, z: p.z, w: +el.getAttribute('width'), h: +el.getAttribute('height'),
                 d: +el.getAttribute('depth'), r: rot.y };
      });
      const humans = [...humansContainer.children].map(el => {
        const p = el.getAttribute('position'), s = el.getAttribute('scale');
        return { x: p.x, z: p.z, heightCm: Math.round(s.x * 160) };
      });
      localStorage.setItem(SCENE_STORAGE_KEY, JSON.stringify({ walls, humans }));
    }

    function loadScene() {
      const raw = localStorage.getItem(SCENE_STORAGE_KEY);
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        (data.walls || []).forEach(w => createWall(w.x, w.z, w));
        (data.humans || []).forEach(h => createHuman(h.x, h.z, h.heightCm));
      } catch (e) {
        console.error('[scene] 保存データの読み込みに失敗しました', e);
      }
    }

    $('save-scene-btn').onclick = () => {
      saveScene();
      const btn = $('save-scene-btn'), original = '💾 配置を保存';
      btn.textContent = '✓ 保存しました';
      setTimeout(() => { btn.textContent = original; }, 1200);
    };
    $('task-heading-btn').onclick = () => {
      if (taskBarBusy()) return;
      toggleTask('heading');
    };
    $('task-place-btn').onclick = () => {
      if (taskBarBusy()) return;
      const willOpen = activeTask !== 'place';
      if (willOpen && !selectedEl) setSettingsTarget(null);
      toggleTask('place');
    };
    $('task-verify-btn').onclick = () => {
      if (taskBarBusy()) return;
      toggleTask('verify');
    };

    $('time-range').oninput = updateSimulation;
    $('date-input').onchange = updateSimulation;

    // 手動ダイヤルは磁気連動より優先する（回した時点で追従を切る）
    $('heading-range').oninput = e => {
      if (isCompassActive) stopCompass();
      setWorldDirection(+e.target.value);
    };
    $('sun-calib-btn').onclick = () => calibrateBySun();
    $('vf-height').oninput = updateVerifyResult;
    $('vf-length').oninput = updateVerifyResult;

    // 取得方式は photo-location.html と同じ（高精度・12秒タイムアウト・エラーコード分岐）
    $('geo-btn').onclick = () => {
      if (!navigator.geolocation) { $('geo-info').textContent = '位置: このブラウザは位置情報に対応していません'; return; }
      $('geo-info').textContent = '位置: 取得中...';
      navigator.geolocation.getCurrentPosition(
        pos => {
          LAT = pos.coords.latitude; LON = pos.coords.longitude;
          $('geo-info').textContent = `位置: ${LAT.toFixed(4)}, ${LON.toFixed(4)} (±${Math.round(pos.coords.accuracy)}m)`;
          updateSimulation();
        },
        err => {
          const msg = { 1: '位置情報の許可が必要です', 2: '位置情報を取得できませんでした', 3: 'タイムアウトしました' };
          $('geo-info').textContent = '位置: ' + (msg[err.code] || 'エラーが発生しました');
        },
        { enableHighAccuracy: true, timeout: 12000 }
      );
    };
    $('wh-range').oninput = e => { $('wh-out').textContent = $('dim-wh-val').textContent = e.target.value + 'm'; if (selectedEl && selectedEl.dataset.type === 'wall') { selectedEl.setAttribute('height', e.target.value); let p = selectedEl.getAttribute('position'); selectedEl.setAttribute('position', `${p.x} ${e.target.value/2} ${p.z}`); updateShadowTip(); } updatePreview(); };
    $('wd-range').oninput = e => { $('wd-out').textContent = $('dim-wd-val').textContent = e.target.value + 'm'; if (selectedEl && selectedEl.dataset.type === 'wall') { selectedEl.setAttribute('depth', e.target.value); syncContact(selectedEl); } updatePreview(); };
    $('ww-range').oninput = e => { $('ww-out').textContent = $('dim-ww-val').textContent = e.target.value + 'm'; if (selectedEl && selectedEl.dataset.type === 'wall') { selectedEl.setAttribute('width', e.target.value); syncContact(selectedEl); } updatePreview(); };
    $('wr-range').oninput = e => { $('wr-out').textContent = $('dim-wr-val').textContent = e.target.value + '°'; if (selectedEl && selectedEl.dataset.type === 'wall') { selectedEl.setAttribute('rotation', `0 ${e.target.value} 0`); syncContact(selectedEl); } updatePreview(); };
    $('hh-range').oninput = e => { $('hh-out').textContent = e.target.value + 'cm'; if (selectedEl && selectedEl.dataset.type === 'human') { let s = e.target.value / 160; selectedEl.setAttribute('scale', `${s} ${s} ${s}`); syncContact(selectedEl); } updatePreview();  updateVerifyCard(); };

    buildHumanParts(previewHuman, SELECT_COLOR);

    window.addEventListener('load', () => {
      const t = new Date();
      $('date-input').value = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
      initShadowQuality();
      initGrid();
      initShadowTip();
      loadCalibration();
      updateSimulation(); updateHUD(0);
      loadScene();
      applyActiveTask();
      positionDpad();
    });
    document.querySelectorAll('.panel, #dpad').forEach(p => { ['pointerdown', 'touchstart', 'click'].forEach(e => p.addEventListener(e, ev => ev.stopPropagation())); });
  </script>
</body>
</html>
