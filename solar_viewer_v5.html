<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>日陰シミュレーター / Mobile Master v5.0</title>
  
  <!-- A-Frame & Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>

  <style>
    :root {
      --panel-bg: rgba(18, 18, 18, 0.92);
      --accent-color: #00ff88;
      --danger-color: #ff4444;
      --info-color: #287be5;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0a0a0a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* 共通パネルスタイル */
    .panel {
      position: fixed;
      z-index: 10;
      left: calc(10px + var(--safe-left));
      right: calc(10px + var(--safe-right));
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      padding: 12px 16px;
      touch-action: auto;
    }

    .top-panel {
      top: calc(10px + var(--safe-top));
    }

    .bottom-panel {
      bottom: calc(10px + var(--safe-bottom));
    }

    /* HUD スタイル */
    .info-row {
      font-size: 12px;
      color: #ffd700;
      font-weight: bold;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }

    .hud-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .hud-main strong {
      font-size: 16px;
      color: var(--accent-color);
      font-family: monospace;
    }

    .compass-strip {
      font-size: 10px;
      color: #777;
      letter-spacing: 4px;
      text-align: center;
      font-family: monospace;
    }

    .compass-strip b {
      color: var(--accent-color);
      text-shadow: 0 0 5px var(--accent-color);
    }

    /* ボタン・コントロール */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      height: 36px;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .btn:active { opacity: 0.7; }
    .btn-dir { background: #333; color: var(--accent-color); border: 1px solid #444; }
    .btn-primary { background: var(--info-color); }
    .btn-purple { background: #9b59b6; }
    .btn-danger { background: var(--danger-color); }
    .btn-dark { background: #222; border: 1px solid #444; color: #ccc; }
    .btn-active { background: #e67e22; border: 1px solid #f39c12; }

    .compass-toggle {
      grid-column: span 4;
      background: #e74c3c;
      margin-top: 4px;
    }
    .compass-toggle.active { background: #2ecc71; }

    .mode-text {
      font-size: 10px;
      color: var(--accent-color);
      text-align: center;
      margin-top: 4px;
    }

    /* 下部パネル詳細 */
    .time-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .time-label {
      font-size: 14px;
      font-weight: bold;
      color: var(--accent-color);
      min-width: 45px;
    }

    .slider {
      flex: 1;
      height: 30px;
      accent-color: var(--accent-color);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .ctrl-item label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #ccc;
      margin-bottom: 4px;
    }

    .ctrl-item output {
      color: var(--accent-color);
      font-weight: bold;
    }

    /* D-PAD (FPS用) */
    #dpad {
      position: fixed;
      bottom: 200px;
      left: calc(20px + var(--safe-left));
      z-index: 20;
      display: none;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
      background: rgba(0,0,0,0.3);
      padding: 8px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
    }

    #dpad button {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 18px;
      border-radius: 8px;
      touch-action: manipulation;
    }

    #dpad button:active { background: var(--accent-color); color: #000; }
    .dp-up { grid-column: 2; grid-row: 1; }
    .dp-left { grid-column: 1; grid-row: 2; }
    .dp-right { grid-column: 3; grid-row: 2; }
    .dp-down { grid-column: 2; grid-row: 3; }

    #selected-notice {
      display: none;
      background: #e67e22;
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 8px;
    }

    /* 横画面対応 */
    @media (orientation: landscape) and (max-height: 500px) {
      .top-panel { width: 220px; right: auto; }
      .bottom-panel { left: 240px; }
      #dpad { bottom: 20px; left: auto; right: calc(20px + var(--safe-right)); }
    }
  </style>
</head>
<body>

  <!-- UI: Top Panel -->
  <div class="panel top-panel">
    <div class="info-row">
      <span id="sun-info">太陽: --</span>
      <span id="version-display">v5.0</span>
    </div>
    <div class="hud-box">
      <div class="hud-main">
        <span>向き</span>
        <strong id="heading-text">N (0°)</strong>
      </div>
      <div class="compass-strip" id="compass-strip">NW N NE E SE S SW W</div>
    </div>
    <div class="btn-group">
      <button class="btn btn-dir" onclick="setWorldDirection(0)">北</button>
      <button class="btn btn-dir" onclick="setWorldDirection(90)">東</button>
      <button class="btn btn-dir" onclick="setWorldDirection(180)">南</button>
      <button class="btn btn-dir" onclick="setWorldDirection(270)">西</button>
      <button id="compass-btn" class="btn compass-toggle" onclick="toggleCompass()">🧭 磁気連動 OFF</button>
    </div>
    <div id="mode-text" class="mode-text">手動モード / タップで配置</div>
    <div id="selected-notice">選択中: スライダーで調整 / 地面タップで解除</div>
  </div>

  <!-- UI: D-PAD -->
  <div id="dpad">
    <button class="dp-up" id="btn-fwd">▲</button>
    <button class="dp-left" id="btn-left">◄</button>
    <button class="dp-right" id="btn-right">►</button>
    <button class="dp-down" id="btn-bwd">▼</button>
  </div>

  <!-- UI: Bottom Panel -->
  <div class="panel bottom-panel">
    <div id="time-section" class="time-section">
      <span class="time-label" id="time-display">12:00</span>
      <input id="time-range" class="slider" type="range" min="300" max="1140" value="720">
    </div>

    <div id="settings-section" class="settings-grid" style="display:none;">
      <div class="ctrl-item">
        <label>壁高 <output id="wh-out">3.0m</output></label>
        <input id="wh-range" class="slider" type="range" min="1" max="15" step="0.5" value="3">
      </div>
      <div class="ctrl-item">
        <label>壁幅 <output id="ww-out">4.0m</output></label>
        <input id="ww-range" class="slider" type="range" min="0.5" max="20" step="0.5" value="4">
      </div>
      <div class="ctrl-item">
        <label>壁回転 <output id="wr-out">0°</output></label>
        <input id="wr-range" class="slider" type="range" min="0" max="359" value="0">
      </div>
      <div class="ctrl-item">
        <label>身長 <output id="hh-out">160cm</output></label>
        <input id="hh-range" class="slider" type="range" min="120" max="200" value="160">
      </div>
    </div>

    <div class="btn-group">
      <button id="toggle-settings-btn" class="btn btn-dark">⚙ 設定</button>
      <button id="toggle-fps-btn" class="btn btn-purple">🎮 FPS視点</button>
      <button id="add-wall-btn" class="btn btn-primary">壁を追加</button>
      <button id="add-human-btn" class="btn btn-purple">人を追加</button>
      <button id="delete-btn" class="btn btn-danger" style="grid-column: span 4; margin-top: 4px;">選択中のオブジェクトを削除</button>
    </div>
  </div>

  <!-- A-Frame Scene -->
  <a-scene id="main-scene" vr-mode-ui="enabled: false" shadow="type: pcfsoft" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <a-assets></a-assets>
    
    <!-- Cameras -->
    <a-entity id="orbit-camera" 
              camera 
              position="0 10 20" 
              orbit-controls="target: 0 0 0; enableDamping: true; dampingFactor: 0.15; rotateSpeed: 0.6; minDistance: 1; maxDistance: 80; maxPolarAngle: 1.5" 
              active="true">
    </a-entity>

    <a-entity id="fps-rig" position="0 1.6 0">
      <a-entity id="fps-camera" camera look-controls="pointerLockEnabled: false; touchEnabled: true" wasd-controls="acceleration: 20" active="false"></a-entity>
    </a-entity>

    <a-sky color="#111"></a-sky>

    <!-- World Root -->
    <a-entity id="world-root" rotation="0 0 0">
      <a-entity id="sun-light" light="type: directional; intensity: 1.3; castShadow: true; shadowCameraTop: 40; shadowCameraBottom: -40; shadowCameraLeft: -40; shadowCameraRight: 40; shadowMapWidth: 2048; shadowMapHeight: 2048" position="10 20 10"></a-entity>
      <a-light type="ambient" intensity="0.5"></a-light>

      <a-plane id="ground" class="clickable" position="0 0 0" rotation="-90 0 0" width="100" height="100" material="color: #222; roughness: 0.9" shadow="receive: true"></a-plane>

      <!-- Markers -->
      <a-entity id="guide-markers">
        <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="9.95" radius-outer="10.05" material="color: #00ff88; opacity: 0.4; transparent: true"></a-ring>
        <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="19.95" radius-outer="20.05" material="color: #00ff88; opacity: 0.2; transparent: true"></a-ring>
        
        <a-text value="N" position="0 0.1 -10.5" align="center" color="#ff4444" scale="3 3 3" rotation="-90 0 0"></a-text>
        <a-text value="E" position="10.5 0.1 0" align="center" color="#00ff88" scale="2.5 2.5 2.5" rotation="-90 0 -90"></a-text>
        <a-text value="S" position="0 0.1 10.5" align="center" color="#4488ff" scale="2.5 2.5 2.5" rotation="-90 0 180"></a-text>
        <a-text value="W" position="-10.5 0.1 0" align="center" color="#00ff88" scale="2.5 2.5 2.5" rotation="-90 0 90"></a-text>
      </a-entity>

      <a-entity id="walls-container"></a-entity>
      <a-entity id="humans-container"></a-entity>

      <!-- Previews -->
      <a-box id="preview-wall" material="color: #00ff88; transparent: true; opacity: 0.5" depth="0.2" visible="false"></a-box>
      <a-entity id="preview-human" visible="false">
        <a-sphere position="0 1.5 0" radius="0.15" material="color: #00ff88; transparent: true; opacity: 0.5"></a-sphere>
        <a-box position="0 0.9 0" width="0.4" height="0.8" depth="0.2" material="color: #00ff88; transparent: true; opacity: 0.5"></a-box>
        <a-cylinder position="-0.15 0.3 0" radius="0.06" height="0.6" material="color: #00ff88; transparent: true; opacity: 0.5"></a-cylinder>
        <a-cylinder position="0.15 0.3 0" radius="0.06" height="0.6" material="color: #00ff88; transparent: true; opacity: 0.5"></a-cylinder>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const $ = id => document.getElementById(id);
    const sceneEl = $('main-scene');
    const worldRoot = $('world-root');
    const wallsContainer = $('walls-container');
    const humansContainer = $('humans-container');
    const sunLight = $('sun-light');
    const previewWall = $('preview-wall');
    const previewHuman = $('preview-human');

    let wallObjects = [], humanObjects = [];
    let isFps = false, isCompassActive = false;
    let selectedEl = null, pendingType = null;
    let moveState = { fwd: 0, bwd: 0, left: 0, right: 0 };
    
    // 位置情報 (デフォルト: 東京近郊)
    const LAT = 35.6895, LON = 139.6917;

    // --- ユーティリティ ---
    const norm = v => (v % 360 + 360) % 360;
    const getDirName = v => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.floor((norm(v) + 22.5) / 45) % 8];

    function updateHUD(deg) {
      deg = norm(deg);
      $('heading-text').textContent = `${getDirName(deg)} (${Math.round(deg)}°)`;
      const dirs = ['NW', 'N', 'NE', 'E', 'SE', 'S', 'SW', 'W'];
      $('compass-strip').innerHTML = dirs.map(d => d === getDirName(deg) ? `<b>${d}</b>` : d).join(' ');
    }

    // --- シミュレーション制御 ---
    function updateSimulation() {
      const minutes = +$('time-range').value;
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      $('time-display').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

      // SunCalcを使用して太陽位置を計算 (日本標準時 JST+9)
      const now = new Date();
      const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0) - (9 * 60 * 60 * 1000));
      const sunPos = SunCalc.getPosition(d, LAT, LON);
      
      const az = sunPos.azimuth + Math.PI; // 南が0のため調整
      const alt = sunPos.altitude;
      const dist = 40;

      const lx = dist * Math.cos(alt) * Math.sin(az);
      const ly = dist * Math.sin(alt);
      const lz = -dist * Math.cos(alt) * Math.cos(az);

      sunLight.setAttribute('position', `${lx} ${ly} ${lz}`);
      $('sun-info').textContent = `太陽高度 ${(alt * 180 / Math.PI).toFixed(1)}° / 方位 ${(norm(az * 180 / Math.PI)).toFixed(1)}°`;
    }

    // --- オブジェクト操作 ---
    function createWall(x, z) {
      const w = +$('ww-range').value, h = +$('wh-range').value, r = +$('wr-range').value;
      const wall = document.createElement('a-box');
      wall.classList.add('clickable');
      wall.dataset.originalColor = '#7f8c8d';
      wall.setAttribute('position', `${x} ${h/2} ${z}`);
      wall.setAttribute('width', w); wall.setAttribute('height', h); wall.setAttribute('depth', 0.2);
      wall.setAttribute('rotation', `0 ${r} 0`);
      wall.setAttribute('material', 'color: #7f8c8d; roughness: 0.6');
      wall.setAttribute('shadow', 'cast: true; receive: true');
      wall.addEventListener('click', e => { e.stopPropagation(); selectObject(wall); });
      wallsContainer.appendChild(wall);
      wallObjects.push({ el: wall, x: x, z: z, radius: Math.max(w, 0.5) / 2 });
    }

    function createHuman(x, z) {
      const hh = +$('hh-range').value / 100;
      const human = document.createElement('a-entity');
      human.classList.add('clickable');
      human.dataset.type = 'human';
      human.setAttribute('position', `${x} 0 ${z}`);
      human.setAttribute('scale', `${hh/1.6} ${hh/1.6} ${hh/1.6}`);

      const parts = [
        { tag: 'a-sphere', pos: '0 1.4 0', rad: 0.15, col: '#f1c40f' },
        { tag: 'a-box', pos: '0 0.85 0', w: 0.4, h: 0.7, d: 0.2, col: '#e74c3c' },
        { tag: 'a-cylinder', pos: '-0.15 0.3 0', rad: 0.06, h: 0.6, col: '#2980b9' },
        { tag: 'a-cylinder', pos: '0.15 0.3 0', rad: 0.06, h: 0.6, col: '#2980b9' }
      ];

      parts.forEach(p => {
        const el = document.createElement(p.tag);
        el.setAttribute('position', p.pos);
        if (p.rad) el.setAttribute('radius', p.rad);
        if (p.w) { el.setAttribute('width', p.w); el.setAttribute('height', p.h); el.setAttribute('depth', p.d); }
        if (p.tag === 'a-cylinder') { el.setAttribute('radius', p.rad); el.setAttribute('height', p.h); }
        el.setAttribute('material', `color: ${p.col}`);
        el.dataset.originalColor = p.col;
        el.setAttribute('shadow', 'cast: true');
        human.appendChild(el);
      });

      human.addEventListener('click', e => { e.stopPropagation(); selectObject(human); });
      humansContainer.appendChild(human);
      humanObjects.push({ el: human, h: hh, x: x, z: z });
    }

    function selectObject(el) {
      if (selectedEl) deselectObject();
      selectedEl = el;
      const highlight = '#ff9800';

      if (el.tagName.toLowerCase() === 'a-box') {
        el.setAttribute('material', 'color', highlight);
      } else {
        el.querySelectorAll('*').forEach(c => c.setAttribute('material', 'color', highlight));
      }

      $('settings-section').style.display = 'grid';
      $('time-section').style.display = 'none';
      $('selected-notice').style.display = 'block';
      $('toggle-settings-btn').textContent = '⏳ 時刻に戻る';

      if (el.tagName.toLowerCase() === 'a-box') {
        const w = el.getAttribute('width'), h = el.getAttribute('height'), rot = el.getAttribute('rotation');
        $('ww-range').value = w; $('ww-out').textContent = w + 'm';
        $('wh-range').value = h; $('wh-out').textContent = h + 'm';
        $('wr-range').value = rot.y; $('wr-out').textContent = rot.y + '°';
      }
    }

    function deselectObject() {
      if (!selectedEl) return;
      if (selectedEl.tagName.toLowerCase() === 'a-box') {
        selectedEl.setAttribute('material', 'color', selectedEl.dataset.originalColor);
      } else {
        selectedEl.querySelectorAll('*').forEach(c => c.setAttribute('material', 'color', c.dataset.originalColor));
      }
      selectedEl = null;
      $('selected-notice').style.display = 'none';
    }

    // --- インタラクション ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function handlePointer(e) {
      if (!pendingType || isFps) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const rect = sceneEl.getBoundingClientRect();
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, sceneEl.camera);
      const groundObj = $('ground').object3D;
      const intersects = raycaster.intersectObject(groundObj, true);

      if (intersects.length > 0) {
        const pt = intersects[0].point;
        if (pendingType === 'wall') {
          const h = +$('wh-range').value;
          previewWall.setAttribute('position', `${pt.x} ${h/2} ${pt.z}`);
          previewWall.setAttribute('visible', true); previewHuman.setAttribute('visible', false);
        } else {
          previewHuman.setAttribute('position', `${pt.x} 0 ${pt.z}`);
          previewHuman.setAttribute('visible', true); previewWall.setAttribute('visible', false);
        }
      }
    }

    window.addEventListener('pointermove', handlePointer);
    window.addEventListener('touchmove', handlePointer);

    $('ground').addEventListener('click', e => {
      if (selectedEl) { deselectObject(); return; }
      if (!pendingType || isFps) return;
      const pt = e.detail.intersection ? e.detail.intersection.point : { x: 0, z: 0 };
      if (pendingType === 'wall') createWall(pt.x, pt.z);
      else createHuman(pt.x, pt.z);
      pendingType = null;
      previewWall.setAttribute('visible', false); previewHuman.setAttribute('visible', false);
      $('mode-text').textContent = '手動モード / タップで配置';
    });

    // --- 方位・コンパス ---
    window.setWorldDirection = deg => {
      worldRoot.setAttribute('rotation', `0 ${norm(deg)} 0`);
      updateHUD(deg);
    };

    function toggleCompass() {
      if (isCompassActive) {
        stopCompass();
      } else {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(res => {
            if (res === 'granted') startCompass();
          });
        } else {
          startCompass();
        }
      }
    }

    function startCompass() {
      const handler = e => {
        let heading = e.webkitCompassHeading || (360 - e.alpha);
        if (heading) setWorldDirection(heading);
      };
      window.addEventListener('deviceorientationabsolute', handler, true);
      window.addEventListener('deviceorientation', handler, true);
      isCompassActive = true;
      $('compass-btn').textContent = '🧭 磁気連動 ON';
      $('compass-btn').classList.add('active');
      $('mode-text').textContent = '磁気連動中: スマホの向きと同期しています';
    }

    function stopCompass() {
      isCompassActive = false;
      $('compass-btn').textContent = '🧭 磁気連動 OFF';
      $('compass-btn').classList.remove('active');
      $('mode-text').textContent = '手動モード / タップで配置';
    }

    // --- FPS制御 ---
    $('toggle-fps-btn').onclick = () => {
      isFps = !isFps;
      const orbit = $('orbit-camera'), fps = $('fps-camera'), rig = $('fps-rig'), dpad = $('dpad');
      if (isFps) {
        if (humanObjects.length > 0) {
          const last = humanObjects[humanObjects.length - 1];
          rig.setAttribute('position', `${last.x} 1.6 ${last.z}`);
        }
        orbit.setAttribute('camera', 'active', false);
        fps.setAttribute('camera', 'active', true);
        dpad.style.display = 'grid';
        $('toggle-fps-btn').textContent = '🚁 俯瞰視点';
        $('toggle-fps-btn').classList.add('btn-active');
      } else {
        fps.setAttribute('camera', 'active', false);
        orbit.setAttribute('camera', 'active', true);
        dpad.style.display = 'none';
        $('toggle-fps-btn').textContent = '🎮 FPS視点';
        $('toggle-fps-btn').classList.remove('btn-active');
      }
    };

    function bindMove(id, key) {
      const el = $(id);
      const press = e => { e.preventDefault(); moveState[key] = 1; };
      const release = e => { e.preventDefault(); moveState[key] = 0; };
      el.addEventListener('touchstart', press); el.addEventListener('touchend', release);
      el.addEventListener('mousedown', press); el.addEventListener('mouseup', release); el.addEventListener('mouseleave', release);
    }
    bindMove('btn-fwd', 'fwd'); bindMove('btn-bwd', 'bwd'); bindMove('btn-left', 'left'); bindMove('btn-right', 'right');

    function step() {
      if (isFps) {
        const rig = $('fps-rig'), cam = $('fps-camera');
        const pos = rig.getAttribute('position'), rot = cam.getAttribute('rotation');
        if (moveState.fwd || moveState.bwd || moveState.left || moveState.right) {
          const speed = 0.15, yaw = (rot ? rot.y : 0) * Math.PI / 180;
          let dx = 0, dz = 0;
          if (moveState.fwd) { dx -= Math.sin(yaw) * speed; dz -= Math.cos(yaw) * speed; }
          if (moveState.bwd) { dx += Math.sin(yaw) * speed; dz += Math.cos(yaw) * speed; }
          if (moveState.left) { dx -= Math.cos(yaw) * speed; dz += Math.sin(yaw) * speed; }
          if (moveState.right) { dx += Math.cos(yaw) * speed; dz -= Math.sin(yaw) * speed; }
          rig.setAttribute('position', `${pos.x + dx} ${pos.y} ${pos.z + dz}`);
        }
      }
      requestAnimationFrame(step);
    }
    step();

    // --- イベントリスナー ---
    $('add-wall-btn').onclick = () => { pendingType = 'wall'; $('mode-text').textContent = '配置場所をタップしてください'; };
    $('add-human-btn').onclick = () => { pendingType = 'human'; $('mode-text').textContent = '配置場所をタップしてください'; };
    $('delete-btn').onclick = () => { if (selectedEl) { selectedEl.remove(); deselectObject(); } };
    
    $('toggle-settings-btn').onclick = () => {
      const isHidden = $('settings-section').style.display === 'none';
      $('settings-section').style.display = isHidden ? 'grid' : 'none';
      $('time-section').style.display = isHidden ? 'none' : 'flex';
      $('toggle-settings-btn').textContent = isHidden ? '⏳ 時刻に戻る' : '⚙ 設定';
    };

    $('time-range').oninput = updateSimulation;
    $('wh-range').oninput = e => { $('wh-out').textContent = e.target.value + 'm'; if (selectedEl) selectObject(selectedEl); };
    $('ww-range').oninput = e => { $('ww-out').textContent = e.target.value + 'm'; if (selectedEl) selectObject(selectedEl); };
    $('wr-range').oninput = e => { $('wr-out').textContent = e.target.value + '°'; if (selectedEl) selectObject(selectedEl); };
    $('hh-range').oninput = e => { $('hh-out').textContent = e.target.value + 'cm'; if (selectedEl) selectObject(selectedEl); };

    window.addEventListener('load', () => {
      updateSimulation();
      updateHUD(0);
    });

    // UIパネル上の操作が3Dシーンに伝播しないようにする
    document.querySelectorAll('.panel, #dpad').forEach(p => {
      ['pointerdown', 'touchstart', 'click'].forEach(e => p.addEventListener(e, ev => ev.stopPropagation()));
    });
  </script>
</body>
</html>
