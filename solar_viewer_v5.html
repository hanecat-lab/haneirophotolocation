<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>日陰シミュレーター / Mobile Master v5.3</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>

  <script>
    // ─── 影の品質設定 ────────────────────────────────────────────────
    // シェーダー側の #define と JS 側のシャドウカメラ設定は必ず同じ値から作る。
    // ズレると半影の幅が距離に対して合わなくなる。
    const SHADOW_CFG = (function () {
      const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      return {
        halfExtent: 30,              // 正射影シャドウカメラの半幅[m]（この外の物は影を落とさない）
        near: 0.5,
        far: 120,                    // 光源は原点から半径40なので余裕を見た値
        mapSize: coarse ? 2048 : 4096,
        bias: -0.0004,               // シャドウアクネ対策（負値で受光面を手前に寄せる）
        normalBias: 0.03,            // 法線方向のずらし。斜面のアクネとピーターパン現象の両対策
        sunTan: 0.00925,             // tan(太陽の視直径 0.53°)。半影 = 遮蔽物までの距離 × これ
        maxPenumbra: 0.4             // 半影幅の上限[m]。ブロッカー探索半径もこれに一致させる
      };
    })();

    // ─── ソフトシャドウ（PCSS）──────────────────────────────────────
    // three r147 の SHADOWMAP_TYPE_PCF_SOFT は shadow.radius を参照しない固定 9 タップで、
    // 遮蔽物からの距離によらず常に同じ太さにしかぼけない（PCF も UV 空間で一定幅）。
    // 「離れるほど輪郭がぼやける」を出すには半影幅を距離から計算する必要があるので、
    // getShadow を PCSS（ブロッカー探索 → 可変半径 PCF）に差し替える。
    // 平行光源のシャドウカメラは正射影なので、深度差はそのまま実距離に比例する。
    (function installPCSS() {
      const c = SHADOW_CFG;
      const frustumW = c.halfExtent * 2;
      const depthRange = c.far - c.near;
      const maxRadiusUV = c.maxPenumbra / frustumW;

      const PCSS_GLSL = `
      #define PCSS_BLOCKER_SAMPLES 12
      #define PCSS_PCF_SAMPLES 16
      #define PCSS_DEPTH_RANGE ${depthRange.toFixed(4)}
      #define PCSS_FRUSTUM_W ${frustumW.toFixed(4)}
      #define PCSS_SUN_TAN ${c.sunTan.toFixed(6)}
      #define PCSS_MAX_RADIUS_UV ${maxRadiusUV.toFixed(8)}
      vec2 pcssOffset( const in float i, const in float total, const in float startAngle ) {
        float angle = startAngle + i * ( PI2 * 5.0 / total );
        float r = pow( ( i + 0.5 ) / total, 0.75 );
        return vec2( cos( angle ), sin( angle ) ) * r;
      }
      float pcssFindBlocker( sampler2D shadowMap, const in vec2 uv, const in float zReceiver, const in float startAngle ) {
        float sum = 0.0;
        float count = 0.0;
        for ( int i = 0; i < PCSS_BLOCKER_SAMPLES; i ++ ) {
          vec2 o = pcssOffset( float( i ), float( PCSS_BLOCKER_SAMPLES ), startAngle ) * PCSS_MAX_RADIUS_UV;
          float d = unpackRGBAToDepth( texture2D( shadowMap, uv + o ) );
          if ( d < zReceiver ) { sum += d; count += 1.0; }
        }
        if ( count < 0.5 ) return -1.0;
        return sum / count;
      }
      float PCSS( sampler2D shadowMap, vec2 shadowMapSize, vec4 coords ) {
        vec2 uv = coords.xy;
        float z = coords.z;
        float startAngle = rand( uv ) * PI2;
        float zBlocker = pcssFindBlocker( shadowMap, uv, z, startAngle );
        if ( zBlocker < 0.0 ) return 1.0;
        float occluderDist = ( z - zBlocker ) * PCSS_DEPTH_RANGE;
        float radius = clamp( occluderDist * PCSS_SUN_TAN / PCSS_FRUSTUM_W, 1.0 / shadowMapSize.x, PCSS_MAX_RADIUS_UV );
        float shadow = 0.0;
        for ( int i = 0; i < PCSS_PCF_SAMPLES; i ++ ) {
          vec2 o = pcssOffset( float( i ), float( PCSS_PCF_SAMPLES ), startAngle ) * radius;
          shadow += texture2DCompare( shadowMap, uv + o, z );
        }
        return shadow / float( PCSS_PCF_SAMPLES );
      }
      `;

      // 差し込み位置は three のバージョンに依存する。見つからないまま素通りすると
      // 「パッチが当たっていないのに動いて見える」状態になるので、その場で失敗させる。
      const anchorFn = 'float getShadow( sampler2D shadowMap,';
      const anchorBranch = '#if defined( SHADOWMAP_TYPE_PCF )\n';
      let src = THREE.ShaderChunk.shadowmap_pars_fragment;
      if (src.indexOf(anchorFn) === -1 || src.indexOf(anchorBranch) === -1) {
        console.error('[shadow] PCSS パッチの差し込み位置が見つかりません (three r' + THREE.REVISION + ')。ソフトシャドウは無効です。');
        return;
      }
      src = src.replace(anchorFn, PCSS_GLSL + anchorFn);
      src = src.replace(anchorBranch, 'return PCSS( shadowMap, shadowMapSize, shadowCoord );\n' + anchorBranch);
      THREE.ShaderChunk.shadowmap_pars_fragment = src;
    })();
  </script>

  <style>
    :root {
      --panel-bg: rgba(18, 18, 18, 0.92);
      --accent-color: #00ff88;
      --danger-color: #ff4444;
      --info-color: #287be5;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100dvh; margin: 0; padding: 0; overflow: hidden;
      background-color: #0a0a0a; color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    .panel {
      position: fixed; z-index: 10;
      left: calc(10px + var(--safe-left)); right: calc(10px + var(--safe-right));
      background: var(--panel-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); padding: 12px 16px; touch-action: auto;
    }
    .top-panel { top: calc(10px + var(--safe-top)); }
    .bottom-panel { bottom: calc(10px + var(--safe-bottom)); }
    .info-row { font-size: 12px; color: #ffd700; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .hud-box { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 255, 136, 0.2); border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; }
    .hud-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .hud-main strong { font-size: 16px; color: var(--accent-color); font-family: monospace; }
    .compass-strip { font-size: 10px; color: #777; letter-spacing: 4px; text-align: center; font-family: monospace; }
    .compass-strip b { color: var(--accent-color); text-shadow: 0 0 5px var(--accent-color); }
    .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
    .btn { border: 0; border-radius: 8px; height: 36px; color: #fff; font-weight: bold; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
    .btn:active { opacity: 0.7; }
    .btn-dir { background: #333; color: var(--accent-color); border: 1px solid #444; }
    .btn-primary { background: var(--info-color); }
    .btn-purple { background: #9b59b6; }
    .btn-danger { background: var(--danger-color); }
    .btn-dark { background: #222; border: 1px solid #444; color: #ccc; }
    .btn-active { background: #e67e22; border: 1px solid #f39c12; }
    .compass-toggle { grid-column: span 4; background: #e74c3c; margin-top: 4px; }
    .compass-toggle.active { background: #2ecc71; }
    .mode-text { font-size: 10px; color: var(--accent-color); text-align: center; margin-top: 4px; }
    .time-section { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .time-row { display: flex; align-items: center; gap: 12px; width: 100%; }
    .date-input { flex: 1; min-width: 0; height: 32px; background: rgba(0,0,0,0.4); color: var(--accent-color); border: 1px solid #444; border-radius: 8px; padding: 0 8px; font-size: 13px; font-family: monospace; }
    .geo-btn { flex: 0 0 96px; height: 32px; }
    .geo-info { font-size: 10px; color: #888; text-align: right; }
    .time-label { font-size: 14px; font-weight: bold; color: var(--accent-color); min-width: 45px; }
    .slider { flex: 1; height: 30px; accent-color: var(--accent-color); }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .ctrl-item label { display: flex; justify-content: space-between; font-size: 11px; color: #ccc; margin-bottom: 4px; }
    .ctrl-item output { color: var(--accent-color); font-weight: bold; }
    #dpad { position: fixed; bottom: 265px; left: calc(20px + var(--safe-left)); z-index: 20; display: none; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 6px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 16px; backdrop-filter: blur(8px); }
    #dpad button { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 18px; border-radius: 8px; touch-action: manipulation; }
    #dpad button:active { background: var(--accent-color); color: #000; }
    .dp-up { grid-column: 2; grid-row: 1; }
    .dp-left { grid-column: 1; grid-row: 2; }
    .dp-right { grid-column: 3; grid-row: 2; }
    .dp-down { grid-column: 2; grid-row: 3; }
    #selected-notice { display: none; background: #e67e22; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 11px; text-align: center; font-weight: bold; margin-bottom: 8px; }
    @media (orientation: landscape) and (max-height: 500px) {
      .top-panel { width: 220px; right: auto; }
      .bottom-panel { left: 240px; }
      #dpad { bottom: 20px; left: auto; right: calc(20px + var(--safe-right)); }
    }
  </style>
</head>
<body>

  <div class="panel top-panel">
    <div class="info-row">
      <span id="sun-info">太陽: --</span>
      <span id="version-display">v5.3</span>
    </div>
    <div class="hud-box">
      <div class="hud-main"><span>向き</span><strong id="heading-text">N (0°)</strong></div>
      <div class="compass-strip" id="compass-strip">NW N NE E SE S SW W</div>
    </div>
    <div class="btn-group">
      <button class="btn btn-dir" onclick="setWorldDirection(0)">北</button>
      <button class="btn btn-dir" onclick="setWorldDirection(90)">東</button>
      <button class="btn btn-dir" onclick="setWorldDirection(180)">南</button>
      <button class="btn btn-dir" onclick="setWorldDirection(270)">西</button>
      <button id="compass-btn" class="btn compass-toggle" onclick="toggleCompass()">🧭 磁気連動 OFF</button>
    </div>
    <div id="mode-text" class="mode-text">手動モード / タップで配置</div>
    <div id="selected-notice">選択中: スライダーで調整 / 地面タップで解除</div>
  </div>

  <div id="dpad">
    <button class="dp-up" id="btn-fwd">▲</button>
    <button class="dp-left" id="btn-left">◄</button>
    <button class="dp-right" id="btn-right">►</button>
    <button class="dp-down" id="btn-bwd">▼</button>
  </div>

  <div class="panel bottom-panel">
    <div id="time-section" class="time-section">
      <div class="time-row">
        <span class="time-label" id="time-display">12:00</span>
        <input id="time-range" class="slider" type="range" min="180" max="1320" value="720">
      </div>
      <div class="time-row">
        <input id="date-input" class="date-input" type="date">
        <button id="geo-btn" class="btn btn-dark geo-btn">📍 現在地</button>
      </div>
      <div class="geo-info" id="geo-info">位置: 東京 (35.6895, 139.6917)</div>
    </div>
    <div id="settings-section" class="settings-grid" style="display:none;">
      <div class="ctrl-item"><label>壁高 <output id="wh-out">3.0m</output></label><input id="wh-range" class="slider" type="range" min="1" max="15" step="0.5" value="3"></div>
      <div class="ctrl-item"><label>壁幅 <output id="ww-out">4.0m</output></label><input id="ww-range" class="slider" type="range" min="0.5" max="20" step="0.5" value="4"></div>
      <div class="ctrl-item"><label>壁回転 <output id="wr-out">0°</output></label><input id="wr-range" class="slider" type="range" min="0" max="359" value="0"></div>
      <div class="ctrl-item"><label>身長 <output id="hh-out">160cm</output></label><input id="hh-range" class="slider" type="range" min="120" max="200" value="160"></div>
    </div>
    <div class="btn-group">
      <button id="toggle-settings-btn" class="btn btn-dark">⚙ 設定</button>
      <button id="toggle-fps-btn" class="btn btn-purple">🎮 FPS視点</button>
      <button id="add-wall-btn" class="btn btn-primary">壁を追加</button>
      <button id="add-human-btn" class="btn btn-purple">人を追加</button>
      <button id="delete-btn" class="btn btn-danger" style="grid-column: span 2; margin-top: 4px;">選択削除</button>
      <button id="clear-all-btn" class="btn btn-danger" style="grid-column: span 2; margin-top: 4px; background: #880000;">全削除</button>
    </div>
  </div>

  <a-scene id="main-scene" vr-mode-ui="enabled: false" shadow="type: pcfsoft" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <a-assets></a-assets>
    <a-entity id="orbit-camera" camera position="0 10 20" orbit-controls="target: 0 0 0; enableDamping: true; dampingFactor: 0.15; rotateSpeed: 0.6; minDistance: 1; maxDistance: 80; maxPolarAngle: 1.5" active="true"></a-entity>
    <a-entity id="fps-rig" position="0 1.6 0">
      <a-entity id="fps-camera" camera look-controls="pointerLockEnabled: false; touchEnabled: true" wasd-controls="acceleration: 20" active="false"></a-entity>
    </a-entity>
    <a-sky color="#111"></a-sky>
    <a-entity id="world-root" rotation="0 0 0">
      <!-- シャドウの解像度・範囲・バイアスは SHADOW_CFG から initShadowQuality() で設定する -->
      <a-entity id="sun-light" light="type: directional; intensity: 1.3; castShadow: true" position="10 20 10"></a-entity>
      <a-light type="ambient" intensity="0.5"></a-light>
      <a-plane id="ground" class="clickable" position="0 0 0" rotation="-90 0 0" width="100" height="100" material="color: #222; roughness: 0.9" shadow="receive: true"></a-plane>
      <a-entity id="guide-markers">
        <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="9.95" radius-outer="10.05" material="color: #00ff88; opacity: 0.4; transparent: true"></a-ring>
        <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="19.95" radius-outer="20.05" material="color: #00ff88; opacity: 0.2; transparent: true"></a-ring>
        <a-text value="N" position="0 0.1 -10.5" align="center" color="#ff4444" scale="3 3 3" rotation="-90 0 0"></a-text>
        <a-text value="E" position="10.5 0.1 0" align="center" color="#00ff88" scale="2.5 2.5 2.5" rotation="-90 0 -90"></a-text>
        <a-text value="S" position="0 0.1 10.5" align="center" color="#4488ff" scale="2.5 2.5 2.5" rotation="-90 0 180"></a-text>
        <a-text value="W" position="-10.5 0.1 0" align="center" color="#00ff88" scale="2.5 2.5 2.5" rotation="-90 0 90"></a-text>
      </a-entity>
      <a-entity id="walls-container"></a-entity>
      <a-entity id="humans-container"></a-entity>
      <!-- 接地部のオクルージョン。オブジェクトの子にすると .clickable の当たり判定が
           足元まで広がって地面タップを塞ぐので、独立したコンテナで管理する -->
      <a-entity id="contact-shadows"></a-entity>
      <a-box id="preview-wall" material="color: #00ff88; transparent: true; opacity: 0.5" depth="0.2" visible="false"></a-box>
      <a-entity id="preview-human" visible="false">
        <a-sphere position="0 1.5 0" radius="0.15" material="color: #00ff88; transparent: true; opacity: 0.5"></a-sphere>
        <a-box position="0 0.9 0" width="0.4" height="0.8" depth="0.2" material="color: #00ff88; transparent: true; opacity: 0.5"></a-box>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const $ = id => document.getElementById(id);
    const sceneEl = $('main-scene');
    const worldRoot = $('world-root');
    const wallsContainer = $('walls-container');
    const humansContainer = $('humans-container');
    const sunLight = $('sun-light');
    const previewWall = $('preview-wall');
    const previewHuman = $('preview-human');
    let wallObjects = [], humanObjects = [], isFps = false, isCompassActive = false, selectedEl = null, pendingType = null, moveState = { fwd: 0, bwd: 0, left: 0, right: 0 };
    let compassHandler = null, compassEventName = null, targetHeading = null, smoothHeading = null;
    let LAT = 35.6895, LON = 139.6917;
    const norm = v => (v % 360 + 360) % 360;
    const getDirName = v => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.floor((norm(v) + 22.5) / 45) % 8];

    function updateHUD(deg) {
      deg = norm(deg);
      $('heading-text').textContent = `${getDirName(deg)} (${Math.round(deg)}°)`;
      const dirs = ['NW', 'N', 'NE', 'E', 'SE', 'S', 'SW', 'W'];
      $('compass-strip').innerHTML = dirs.map(d => d === getDirName(deg) ? `<b>${d}</b>` : d).join(' ');
    }

    // ─── シャドウ品質の適用 ─────────────────────────────────────────
    function initShadowQuality() {
      const c = SHADOW_CFG;
      sunLight.setAttribute('light', {
        shadowMapWidth: c.mapSize, shadowMapHeight: c.mapSize,
        shadowCameraLeft: -c.halfExtent, shadowCameraRight: c.halfExtent,
        shadowCameraTop: c.halfExtent, shadowCameraBottom: -c.halfExtent,
        shadowCameraNear: c.near, shadowCameraFar: c.far,
        shadowBias: c.bias
      });
      // normalBias は A-Frame の light スキーマにないので three 側へ直接入れる。
      // updateShadow() は normalBias を触らないので上書きされない。
      const l = sunLight.components.light && sunLight.components.light.light;
      if (l && l.shadow) l.shadow.normalBias = c.normalBias;
    }

    // ─── コンタクトシャドウ（接地部のオクルージョン）─────────────────
    // 太陽の落とす影とは別物で、環境光が接地部で遮られる分の落ち込みを表す。
    // 乗算ブレンドの板を接地面に敷き、太陽方向に依らず常に接地感を出す。
    const CONTACT_Y = 0.012;        // 地面(0)とガイドリング(0.02)の間に置く
    const CONTACT_DARKEST = 60;     // 最も濃い部分のグレー値(0-255)
    const CONTACT_WALL_SPREAD = 0.35; // 壁の両端に広げる量[m]
    const CONTACT_WALL_DEPTH = 1.1;   // 壁に垂直な方向の広がり[m]
    const CONTACT_HUMAN_SIZE = 0.7;   // 身長160cm時の足元の広がり[m]

    function makeAOTexture(build) {
      const s = 128, cv = document.createElement('canvas');
      cv.width = cv.height = s;
      const ctx = cv.getContext('2d'), img = ctx.createImageData(s, s);
      for (let y = 0; y < s; y++) {
        for (let x = 0; x < s; x++) {
          const a = build((x + 0.5) / s, (y + 0.5) / s);   // 0(遮蔽なし)〜1(最も濃い)
          const g = Math.round(255 - a * (255 - CONTACT_DARKEST));
          const i = (y * s + x) * 4;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = g;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // 壁: 壁に垂直な方向へ減衰させる。長い壁でも根元が均一に濃くなるよう、
    // 長手方向は端の 15% だけで抜く。
    const wallAOTex = makeAOTexture((u, v) => {
      const across = Math.pow(1 - Math.abs(v - 0.5) * 2, 2.2);
      const along = Math.min(1, (1 - Math.abs(u - 0.5) * 2) / 0.25);
      return across * along;
    });
    // 人: 足元の等方な落ち込み
    const humanAOTex = makeAOTexture((u, v) => {
      const r = Math.min(1, Math.hypot(u - 0.5, v - 0.5) * 2);
      return Math.pow(1 - r, 2.2);
    });

    const contactGeo = new THREE.PlaneGeometry(1, 1);
    function contactMaterial(tex) {
      return new THREE.MeshBasicMaterial({
        map: tex, blending: THREE.MultiplyBlending,
        transparent: true, depthWrite: false, toneMapped: false
      });
    }
    const wallAOMat = contactMaterial(wallAOTex), humanAOMat = contactMaterial(humanAOTex);

    function attachContact(el, mat) {
      const m = new THREE.Mesh(contactGeo, mat);
      m.castShadow = false; m.receiveShadow = false;
      m.renderOrder = 2;
      m.rotation.order = 'YXZ';   // 寝かせた板を世界のY軸まわりに回すため
      el.__contact = m;
      $('contact-shadows').object3D.add(m);
      // 生成直後のエンティティはまだ初期化されておらず getAttribute が既定値を返すので待つ
      if (el.hasLoaded) syncContact(el);
      else el.addEventListener('loaded', () => syncContact(el), { once: true });
    }

    function syncContact(el) {
      const m = el.__contact;
      if (!m) return;
      const p = el.getAttribute('position');
      m.position.set(p.x, CONTACT_Y, p.z);
      if (el.dataset.type === 'human') {
        const s = el.getAttribute('scale').x;
        m.scale.set(CONTACT_HUMAN_SIZE * s, CONTACT_HUMAN_SIZE * s, 1);
        m.rotation.set(-Math.PI / 2, 0, 0);
      } else {
        m.scale.set(+el.getAttribute('width') + CONTACT_WALL_SPREAD * 2, CONTACT_WALL_DEPTH, 1);
        m.rotation.set(-Math.PI / 2, THREE.MathUtils.degToRad(el.getAttribute('rotation').y), 0);
      }
    }

    function removeContact(el) {
      if (!el.__contact) return;
      $('contact-shadows').object3D.remove(el.__contact);
      el.__contact = null;
    }

    function updateSimulation() {
      const minutes = +$('time-range').value, h = Math.floor(minutes / 60), m = minutes % 60;
      $('time-display').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      // 端末のローカルタイムゾーンで解釈する（JST 固定をやめ、現在地取得と整合させる）
      const now = new Date();
      const ymd = ($('date-input').value || '').split('-').map(Number);
      const d = (ymd.length === 3 && ymd.every(Number.isFinite))
        ? new Date(ymd[0], ymd[1] - 1, ymd[2], h, m, 0)
        : new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
      const sunPos = SunCalc.getPosition(d, LAT, LON);
      const az = sunPos.azimuth + Math.PI, alt = sunPos.altitude, dist = 40;
      sunLight.setAttribute('position', `${dist * Math.cos(alt) * Math.sin(az)} ${dist * Math.sin(alt)} ${-dist * Math.cos(alt) * Math.cos(az)}`);
      // 地平線下では光源が地面より下に来て下から照らしてしまうので、消灯して影も止める
      const aboveHorizon = alt > 0;
      sunLight.setAttribute('light', 'intensity', aboveHorizon ? 1.3 : 0);
      // castShadow を setAttribute で変えるとスライダー操作のたびにシャドウマップが
      // 再構成されるので、three のライトへ直接入れる
      const l = sunLight.components.light && sunLight.components.light.light;
      if (l) l.castShadow = aboveHorizon;
      $('sun-info').textContent = aboveHorizon
        ? `太陽高度 ${(alt * 180 / Math.PI).toFixed(1)}° / 方位 ${(norm(az * 180 / Math.PI)).toFixed(1)}°`
        : `太陽: 地平線下 (${(alt * 180 / Math.PI).toFixed(1)}°)`;
    }

    function createWall(x, z) {
      const w = +$('ww-range').value, h = +$('wh-range').value, r = +$('wr-range').value;
      const wall = document.createElement('a-box');
      wall.classList.add('clickable');
      wall.dataset.originalColor = '#7f8c8d';
      wall.setAttribute('position', `${x} ${h/2} ${z}`);
      wall.setAttribute('width', w); wall.setAttribute('height', h); wall.setAttribute('depth', 0.2);
      wall.setAttribute('rotation', `0 ${r} 0`);
      wall.setAttribute('material', 'color: #7f8c8d; roughness: 0.6');
      wall.setAttribute('shadow', 'cast: true; receive: true');
      wall.addEventListener('click', e => { e.stopPropagation(); selectObject(wall); });
      wallsContainer.appendChild(wall);
      wallObjects.push({ el: wall, x: x, z: z });
      attachContact(wall, wallAOMat);
    }

    function createHuman(x, z) {
      const hh = +$('hh-range').value / 100;
      const human = document.createElement('a-entity');
      human.classList.add('clickable');
      human.dataset.type = 'human';
      human.setAttribute('position', `${x} 0 ${z}`);
      human.setAttribute('scale', `${hh/1.6} ${hh/1.6} ${hh/1.6}`);
const parts = [

  // 黒い外形
  { tag:'a-sphere', pos:'0 1.5 0', rad:0.16, col:'#111111' },
  { tag:'a-box', pos:'0 0.85 0', w:0.42, h:0.72, d:0.22, col:'#111111' },

  // 白い本体
  { tag:'a-sphere', pos:'0 1.5 0.03', rad:0.145, col:'#ffffff' },
  { tag:'a-box', pos:'0 0.85 0.03', w:0.36, h:0.66, d:0.18, col:'#ffffff' },

// 左腕 黒ふち
{
 tag:'a-cylinder',
 pos:'-0.25 1.05 0',
 rad:0.05,
 h:0.45,
 rot:'0 0 45',
 col:'#111111'
},

// 左腕 白
{
 tag:'a-cylinder',
 pos:'-0.25 1.05 0',
 rad:0.032,
 h:0.43,
 rot:'0 0 45',
 col:'#ffffff'
},

// 右腕 白
{
 tag:'a-cylinder',
 pos:'0.25 1.05 0',
 rad:0.032,
 h:0.43,
 rot:'0 0 -45',
 col:'#ffffff'
},
  // 右腕 黒ふち
{
 tag:'a-cylinder',
 pos:'0.25 1.05 0',
 rad:0.05,
 h:0.45,
 rot:'0 0 -45',
 col:'#111111'
},


  
  // 足
  { tag:'a-cylinder', pos:'-0.13 0.32 0', rad:0.075, h:0.62, col:'#111111' },
  { tag:'a-cylinder', pos:'-0.13 0.32 0.03', rad:0.055, h:0.58, col:'#ffffff' },

  { tag:'a-cylinder', pos:'0.13 0.32 0', rad:0.075, h:0.62, col:'#111111' },
  { tag:'a-cylinder', pos:'0.13 0.32 0.03', rad:0.055, h:0.58, col:'#ffffff' }

];
      parts.forEach(p => {
        const el = document.createElement(p.tag);
        el.setAttribute('position', p.pos);
        if (p.rad) el.setAttribute('radius', p.rad);
        if (p.w) { el.setAttribute('width', p.w); el.setAttribute('height', p.h); el.setAttribute('depth', p.d); }
        if (p.tag === 'a-cylinder') { el.setAttribute('radius', p.rad); el.setAttribute('height', p.h); }
        if(p.rot){
        el.setAttribute('rotation', p.rot);
}          
        // 陰影を優先するため flat シェーダーは使わず標準シェーダーのままにする
        el.setAttribute('material', `color: ${p.col}`);
        el.dataset.originalColor = p.col;
        el.setAttribute('shadow', 'cast: true');
        human.appendChild(el);
      });
      human.addEventListener('click', e => { e.stopPropagation(); selectObject(human); });
      humansContainer.appendChild(human);
      humanObjects.push({ el: human, x: x, z: z });
      attachContact(human, humanAOMat);
    }

    function selectObject(el) {
      if (selectedEl) deselectObject();
      selectedEl = el;
      const highlight = '#ff9800';
      if (el.tagName.toLowerCase() === 'a-box') el.setAttribute('material', 'color', highlight);
      else el.querySelectorAll('*').forEach(c => c.setAttribute('material', 'color', highlight));
      $('settings-section').style.display = 'grid';
      $('time-section').style.display = 'none';
      $('selected-notice').style.display = 'block';
      $('toggle-settings-btn').textContent = '⏳ 時刻に戻る';
      if (el.tagName.toLowerCase() === 'a-box') {
        const w = el.getAttribute('width'), h = el.getAttribute('height'), rot = el.getAttribute('rotation');
        $('ww-range').value = w; $('ww-out').textContent = w + 'm';
        $('wh-range').value = h; $('wh-out').textContent = h + 'm';
        $('wr-range').value = rot.y; $('wr-out').textContent = rot.y + '°';
      } else {
        const scale = el.getAttribute('scale').x;
        const hhVal = Math.round(scale * 160);
        $('hh-range').value = hhVal; $('hh-out').textContent = hhVal + 'cm';
      }
    }

    function deselectObject() {
      if (!selectedEl) return;
      if (selectedEl.tagName.toLowerCase() === 'a-box') selectedEl.setAttribute('material', 'color', selectedEl.dataset.originalColor);
      else selectedEl.querySelectorAll('*').forEach(c => c.setAttribute('material', 'color', c.dataset.originalColor));
      selectedEl = null;
      $('selected-notice').style.display = 'none';
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const _tmpVec = new THREE.Vector3();

    // レイキャストの交点はワールド座標だが、壁・人・プレビューは回転する #world-root の子なので
    // ローカル座標へ変換してから position に入れる（変換しないと世界回転ぶんズレる）
    function toWorldRootLocal(pt) {
      worldRoot.object3D.updateMatrixWorld();
      return worldRoot.object3D.worldToLocal(_tmpVec.copy(pt));
    }

    function getGroundPoint(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const rect = sceneEl.getBoundingClientRect();
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, sceneEl.camera);
      const intersects = raycaster.intersectObject($('ground').object3D, true);
      return intersects.length > 0 ? intersects[0].point : null;
    }

    function handlePointer(e) {
      if (!pendingType || isFps) return;
      const hit = getGroundPoint(e);
      if (hit) {
        const pt = toWorldRootLocal(hit);
        if (pendingType === 'wall') {
          previewWall.setAttribute('position', `${pt.x} ${+$('wh-range').value/2} ${pt.z}`);
          previewWall.setAttribute('visible', true); previewHuman.setAttribute('visible', false);
        } else {
          previewHuman.setAttribute('position', `${pt.x} 0 ${pt.z}`);
          previewHuman.setAttribute('visible', true); previewWall.setAttribute('visible', false);
        }
      }
    }

    window.addEventListener('pointermove', handlePointer);
    window.addEventListener('touchmove', handlePointer);

    $('ground').addEventListener('click', e => {
      if (selectedEl) { deselectObject(); return; }
      if (!pendingType || isFps) return;
      const hit = e.detail.intersection ? e.detail.intersection.point : null;
      if (hit) {
        const pt = toWorldRootLocal(hit);
        if (pendingType === 'wall') createWall(pt.x, pt.z);
        else createHuman(pt.x, pt.z);
        pendingType = null;
        previewWall.setAttribute('visible', false); previewHuman.setAttribute('visible', false);
        $('mode-text').textContent = '手動モード / タップで配置';
      }
    });

    window.setWorldDirection = deg => { worldRoot.setAttribute('rotation', `0 ${norm(deg)} 0`); updateHUD(deg); };
    function toggleCompass() {
      if (isCompassActive) stopCompass();
      else if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(res => { if (res === 'granted') startCompass(); });
      } else startCompass();
    }
    function startCompass() {
      if (compassHandler) return;
      compassHandler = e => {
        // 0（真北）を捨てないよう Number.isFinite で判定する
        let hd = Number.isFinite(e.webkitCompassHeading) ? e.webkitCompassHeading
               : (Number.isFinite(e.alpha) ? 360 - e.alpha : NaN);
        if (!Number.isFinite(hd)) return;
        targetHeading = norm(hd);
      };
      // 両方に登録すると二重発火して競合するので、絶対方位が使える場合はそちらだけを使う
      compassEventName = ('ondeviceorientationabsolute' in window) ? 'deviceorientationabsolute' : 'deviceorientation';
      window.addEventListener(compassEventName, compassHandler, true);
      isCompassActive = true; $('compass-btn').textContent = '🧭 磁気連動 ON'; $('compass-btn').classList.add('active');
    }
    function stopCompass() {
      if (compassHandler) {
        window.removeEventListener(compassEventName, compassHandler, true);
        compassHandler = null;
      }
      targetHeading = null; smoothHeading = null;
      isCompassActive = false; $('compass-btn').textContent = '🧭 磁気連動 OFF'; $('compass-btn').classList.remove('active');
    }

    $('toggle-fps-btn').onclick = () => {
      isFps = !isFps;
      const orbit = $('orbit-camera'), fps = $('fps-camera'), rig = $('fps-rig'), dpad = $('dpad');
      if (isFps) {
        // #fps-rig は #world-root の外なので、人のローカル座標をワールド座標へ変換して渡す
        if (humanObjects.length > 0) {
          const lastHuman = humanObjects[humanObjects.length - 1].el;
          lastHuman.object3D.updateMatrixWorld();
          const wp = lastHuman.object3D.getWorldPosition(new THREE.Vector3());
          rig.setAttribute('position', `${wp.x} 1.6 ${wp.z}`);
        }
        orbit.setAttribute('camera', 'active', false); fps.setAttribute('camera', 'active', true); dpad.style.display = 'grid';
        $('toggle-fps-btn').textContent = '🚁 俯瞰視点'; $('toggle-fps-btn').classList.add('btn-active');
      } else {
        fps.setAttribute('camera', 'active', false); orbit.setAttribute('camera', 'active', true); dpad.style.display = 'none';
        $('toggle-fps-btn').textContent = '🎮 FPS視点'; $('toggle-fps-btn').classList.remove('btn-active');
      }
    };

    function bindMove(id, k) {
      const el = $(id);
      const p = e => { e.preventDefault(); moveState[k] = 1; };
      const r = e => { e.preventDefault(); moveState[k] = 0; };
      el.addEventListener('touchstart', p); el.addEventListener('touchend', r);
      el.addEventListener('mousedown', p); el.addEventListener('mouseup', r); el.addEventListener('mouseleave', r);
    }
    bindMove('btn-fwd', 'fwd'); bindMove('btn-bwd', 'bwd'); bindMove('btn-left', 'left'); bindMove('btn-right', 'right');

    function step() {
      // 磁気センサーの生値は毎フレーム跳ねるので、最短回り方向へ補間して反映する
      if (isCompassActive && targetHeading !== null) {
        if (smoothHeading === null) smoothHeading = targetHeading;
        const diff = ((targetHeading - smoothHeading + 540) % 360) - 180;
        smoothHeading = norm(smoothHeading + diff * 0.15);
        setWorldDirection(smoothHeading);
      }
      if (isFps) {
        const rig = $('fps-rig'), cam = $('fps-camera'), pos = rig.getAttribute('position'), rot = cam.getAttribute('rotation');
        if (moveState.fwd || moveState.bwd || moveState.left || moveState.right) {
          const s = 0.15, y = (rot ? rot.y : 0) * Math.PI / 180;
          let dx = 0, dz = 0;
          if (moveState.fwd) { dx -= Math.sin(y)*s; dz -= Math.cos(y)*s; }
          if (moveState.bwd) { dx += Math.sin(y)*s; dz += Math.cos(y)*s; }
          if (moveState.left) { dx -= Math.cos(y)*s; dz += Math.sin(y)*s; }
          if (moveState.right) { dx += Math.cos(y)*s; dz -= Math.sin(y)*s; }
         const smooth = 0.8;

const newX = pos.x + dx * smooth;
const newZ = pos.z + dz * smooth;

rig.setAttribute('position', `${newX} ${pos.y} ${newZ}`);
        }
      }
      requestAnimationFrame(step);
    }
    step();

    $('add-wall-btn').onclick = () => { pendingType = 'wall'; $('mode-text').textContent = '配置場所をタップしてください'; };
    $('add-human-btn').onclick = () => { pendingType = 'human'; $('mode-text').textContent = '配置場所をタップしてください'; };
    $('delete-btn').onclick = () => { if (selectedEl) { 
      wallObjects = wallObjects.filter(o => o.el !== selectedEl);
      humanObjects = humanObjects.filter(o => o.el !== selectedEl);
      removeContact(selectedEl);
      selectedEl.remove(); deselectObject(); 
    } };
    $('clear-all-btn').onclick = () => { if (confirm('すべてのオブジェクトを削除しますか？')) { wallsContainer.innerHTML = ''; humansContainer.innerHTML = ''; $('contact-shadows').object3D.clear(); wallObjects = []; humanObjects = []; deselectObject(); } };
    $('toggle-settings-btn').onclick = () => {
      const isH = $('settings-section').style.display === 'none';
      $('settings-section').style.display = isH ? 'grid' : 'none';
      $('time-section').style.display = isH ? 'none' : 'flex';
      $('toggle-settings-btn').textContent = isH ? '⏳ 時刻に戻る' : '⚙ 設定';
    };

    $('time-range').oninput = updateSimulation;
    $('date-input').onchange = updateSimulation;

    // 取得方式は photo-location.html と同じ（高精度・12秒タイムアウト・エラーコード分岐）
    $('geo-btn').onclick = () => {
      if (!navigator.geolocation) { $('geo-info').textContent = '位置: このブラウザは位置情報に対応していません'; return; }
      $('geo-info').textContent = '位置: 取得中...';
      navigator.geolocation.getCurrentPosition(
        pos => {
          LAT = pos.coords.latitude; LON = pos.coords.longitude;
          $('geo-info').textContent = `位置: ${LAT.toFixed(4)}, ${LON.toFixed(4)} (±${Math.round(pos.coords.accuracy)}m)`;
          updateSimulation();
        },
        err => {
          const msg = { 1: '位置情報の許可が必要です', 2: '位置情報を取得できませんでした', 3: 'タイムアウトしました' };
          $('geo-info').textContent = '位置: ' + (msg[err.code] || 'エラーが発生しました');
        },
        { enableHighAccuracy: true, timeout: 12000 }
      );
    };
    $('wh-range').oninput = e => { $('wh-out').textContent = e.target.value + 'm'; if (selectedEl && selectedEl.tagName.toLowerCase() === 'a-box') { selectedEl.setAttribute('height', e.target.value); let p = selectedEl.getAttribute('position'); selectedEl.setAttribute('position', `${p.x} ${e.target.value/2} ${p.z}`); } };
    $('ww-range').oninput = e => { $('ww-out').textContent = e.target.value + 'm'; if (selectedEl && selectedEl.tagName.toLowerCase() === 'a-box') { selectedEl.setAttribute('width', e.target.value); syncContact(selectedEl); } };
    $('wr-range').oninput = e => { $('wr-out').textContent = e.target.value + '°'; if (selectedEl && selectedEl.tagName.toLowerCase() === 'a-box') { selectedEl.setAttribute('rotation', `0 ${e.target.value} 0`); syncContact(selectedEl); } };
    $('hh-range').oninput = e => { $('hh-out').textContent = e.target.value + 'cm'; if (selectedEl && selectedEl.dataset.type === 'human') { let s = e.target.value / 160; selectedEl.setAttribute('scale', `${s} ${s} ${s}`); syncContact(selectedEl); } };

    window.addEventListener('load', () => {
      const t = new Date();
      $('date-input').value = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
      initShadowQuality();
      updateSimulation(); updateHUD(0);
    });
    document.querySelectorAll('.panel, #dpad').forEach(p => { ['pointerdown', 'touchstart', 'click'].forEach(e => p.addEventListener(e, ev => ev.stopPropagation())); });
  </script>
</body>
</html>
