<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>プロ・ライティング・ナビ v30-Final</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",monospace}

#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#overlayCanvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none;opacity:0.85;display:none;filter:blur(12px)}

/* UIコントロールパネル */
#topIsland{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;z-index:10;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{background:rgba(20,20,20,0.85);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:6px 10px;border-radius:14px;font-size:10px;font-weight:700;cursor:pointer;backdrop-filter:blur(12px);touch-action:auto}
button.active{background:#00e887;color:#000;border:none}
button.primary{background:#00e887;color:#000;border:none;font-weight:800}

/* 参照サムネイル */
#thumbCard{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));right:12px;width:70px;height:90px;border-radius:12px;border:2px solid #00e887;overflow:hidden;z-index:10;background:#111;box-shadow:0 8px 24px rgba(0,0,0,0.6)}
#thumbImg{width:100%;height:100%;object-fit:cover}

/* アクション・ナビゲーションバッジ */
#navBadge{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:12px;right:92px;background:rgba(0,0,0,0.85);border:1px solid rgba(0,232,135,0.6);color:#00e887;padding:10px 14px;border-radius:16px;font-size:11px;font-weight:bold;z-index:10;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.5)}

#permission{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.95)}
.permission-card{width:min(380px,100%);background:#121212;border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;text-align:center}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="overlayCanvas"></canvas>

<div id="topIsland">
  <button class="primary" onclick="document.getElementById('fileInput').click()">📷 写真読込</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
  
  <div style="display:flex;gap:4px">
    <button id="btnModeExp" class="active" onclick="setMode('exp')">明暗(EV)</button>
    <button id="btnModeCol" onclick="setMode('col')">色調(WB)</button>
  </div>

  <div style="display:flex;gap:4px">
    <button id="btnScaleUp" onclick="setScale('up')">寄</button>
    <button id="btnScaleStd" class="active" onclick="setScale('std')">標準</button>
    <button id="btnScaleWide" onclick="setScale('wide')">引</button>
  </div>
</div>

<div id="thumbCard">
  <div id="thumbPlaceholder" style="font-size:9px;color:#666;text-align:center;margin-top:30px">未読込</div>
  <img id="thumbImg" src="" style="display:none">
</div>

<div id="navBadge">過去写真を読み込み、画面長押しで「光のズレ」をチラ見表示</div>

<div id="permission">
  <div class="permission-card">
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">プロ・ライティング・ナビ v30</div>
    <div style="font-size:12px;color:#aaa;margin-bottom:20px">全機能統合＆全自動ナビゲーション</div>
    <button id="startBtn" class="primary" style="width:100%;padding:14px;border-radius:14px;font-weight:bold">利用を開始</button>
  </div>
</div>

<script>
const video = document.getElementById('camera');
const overlay = document.getElementById('overlayCanvas');
const oCtx = overlay.getContext('2d', {willReadFrequently: true});

// 解析用解像度（32x24：高速処理と影のエッジ検出を両立）
const GW = 32, GH = 24;
const refCanvas = document.createElement('canvas'); refCanvas.width = GW; refCanvas.height = GH;
const rCtx = refCanvas.getContext('2d', {willReadFrequently: true});

const curCanvas = document.createElement('canvas'); curCanvas.width = GW; curCanvas.height = GH;
const cCtx = curCanvas.getContext('2d', {willReadFrequently: true});

let loadedImg = null;
let isPressing = false;
let currentMode = 'exp'; // 'exp' | 'col'
let currentScale = 'std'; // 'up' | 'std' | 'wide'

/* --- モード・スケール変更 --- */
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnModeExp').classList.toggle('active', mode === 'exp');
  document.getElementById('btnModeCol').classList.toggle('active', mode === 'col');
}

function setScale(scale) {
  currentScale = scale;
  document.getElementById('btnScaleUp').classList.toggle('active', scale === 'up');
  document.getElementById('btnScaleStd').classList.toggle('active', scale === 'std');
  document.getElementById('btnScaleWide').classList.toggle('active', scale === 'wide');
}

/* --- タッチ（長押し）イベントの保護 --- */
window.addEventListener('pointerdown', (e) => {
  if(!loadedImg) return;
  if(e.target.tagName !== 'BUTTON' && e.target.id !== 'fileInput') {
    isPressing = true;
    overlay.style.display = 'block';
  }
});
window.addEventListener('pointerup', () => { isPressing = false; overlay.style.display = 'none'; });
window.addEventListener('pointercancel', () => { isPressing = false; overlay.style.display = 'none'; });

function loadImage(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const img = new Image();
    img.onload = () => {
      loadedImg = img;
      document.getElementById('thumbImg').src = evt.target.result;
      document.getElementById('thumbImg').style.display = 'block';
      document.getElementById('thumbPlaceholder').style.display = 'none';

      // 参照画像を解析キャンバスに転写
      rCtx.drawImage(loadedImg, 0, 0, GW, GH);
      document.getElementById('navBadge').textContent = "長押し中：光・色のズレをヒートマップ表示";
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    alert("カメラ起動エラー: " + err.message);
  }
}

async function startApp() {
  await initCamera();
  document.getElementById('permission').style.display = 'none';
  overlay.width = window.innerWidth;
  overlay.height = window.innerHeight;

  window.addEventListener('resize', () => {
    overlay.width = window.innerWidth;
    overlay.height = window.innerHeight;
  });

  requestAnimationFrame(loop);
}

function loop() {
  if (isPressing && loadedImg && video.videoWidth) {
    // 1. スケールに応じたクロップ範囲の計算
    let sFactor = currentScale === 'up' ? 0.7 : (currentScale === 'wide' ? 1.3 : 1.0);
    let sw = Math.min(video.videoWidth, video.videoWidth * sFactor);
    let sh = Math.min(video.videoHeight, video.videoHeight * sFactor);
    let sx = (video.videoWidth - sw) / 2;
    let sy = (video.videoHeight - sh) / 2;

    cCtx.drawImage(video, sx, sy, sw, sh, 0, 0, GW, GH);

    const refData = rCtx.getImageData(0, 0, GW, GH).data;
    const curData = cCtx.getImageData(0, 0, GW, GH).data;

    const diffImg = oCtx.createImageData(GW, GH);
    const d = diffImg.data;

    let totalLumDiff = 0;
    let totalColorDiff = 0;
    let count = 0;

    for (let i = 0; i < refData.length; i += 4) {
      // 輝度計算
      const rL = refData[i] * 0.2126 + refData[i+1] * 0.7152 + refData[i+2] * 0.0722;
      const cL = curData[i] * 0.2126 + curData[i+1] * 0.7152 + curData[i+2] * 0.0722;
      const lumDiff = cL - rL;
      totalLumDiff += lumDiff;

      // 色差計算（R/Bバランスの比較）
      const rColor = refData[i] - refData[i+2]; // 赤 - 青
      const cColor = curData[i] - curData[i+2];
      const colorDiff = cColor - rColor;
      totalColorDiff += colorDiff;

      count++;

      if (currentMode === 'exp') {
        // --- 明暗（Exposure）モード ---
        if (lumDiff > 25) {
          // 明るすぎる（オレンジ）
          d[i] = 255; d[i+1] = 120; d[i+2] = 0; d[i+3] = Math.min(220, lumDiff * 2);
        } else if (lumDiff < -25) {
          // 暗すぎる（ネイビー）
          d[i] = 0; d[i+1] = 100; d[i+2] = 255; d[i+3] = Math.min(220, Math.abs(lumDiff) * 2);
        } else {
          d[i] = 0; d[i+1] = 232; d[i+2] = 135; d[i+3] = 15;
        }
      } else {
        // --- 色調（WB）モード ---
        if (colorDiff > 20) {
          // 赤みが強い / 温かすぎる（アンバー）
          d[i] = 255; d[i+1] = 180; d[i+2] = 0; d[i+3] = Math.min(220, colorDiff * 2);
        } else if (colorDiff < -20) {
          // 青みが強い / 冷たすぎる（シアン）
          d[i] = 0; d[i+1] = 220; d[i+2] = 255; d[i+3] = Math.min(220, Math.abs(colorDiff) * 2);
        } else {
          d[i] = 0; d[i+1] = 232; d[i+2] = 135; d[i+3] = 15;
        }
      }
    }

    // 2. 1行アクションナビゲーションの動的生成
    const avgLum = totalLumDiff / count;
    const avgCol = totalColorDiff / count;
    let actionText = "";

    if (currentMode === 'exp') {
      if (avgLum < -20) actionText = "⚠️ メイン光が弱いです ➔ ストロボ光量を上げてください";
      else if (avgLum > 20) actionText = "⚠️ メイン光が強すぎます ➔ 光量を下げるかライトを離してください";
      else actionText = "✨ 光量はほぼ一致しています！";
    } else {
      if (avgCol < -15) actionText = "⚠️ 影・全体が冷たい（青寄り）です ➔ 色温度を上げるかアンバーフィルター追加";
      else if (avgCol > 15) actionText = "⚠️ 温かすぎ（赤寄り）です ➔ 色温度を下げるかシアン補正してください";
      else actionText = "✨ 色調（WB）はほぼ一致しています！";
    }
    document.getElementById('navBadge').textContent = actionText;

    // 3. 描画
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = GW; tempCanvas.height = GH;
    tempCanvas.getContext('2d').putImageData(diffImg, 0, 0);

    oCtx.clearRect(0, 0, overlay.width, overlay.height);
    oCtx.drawImage(tempCanvas, 0, 0, overlay.width, overlay.height);
  }

  requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick = startApp;
</script>
</body>
</html>
