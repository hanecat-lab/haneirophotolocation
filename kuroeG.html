<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>黒衣モード - プロ・ライティング・アナライザー</title>
<style>
  body { margin:0; background:#000; color:#fff; font-family:monospace; overflow:hidden; }
  #camera { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
  #overlay { position:fixed; inset:0; z-index:5; pointer-events:none; padding:20px; }
  /* プロ用測定表示 */
  #meter { position:absolute; bottom:120px; left:20px; background:rgba(0,0,0,0.7); padding:15px; border-left:3px solid #00e887; }
  .value { font-size:18px; color:#00e887; font-weight:bold; }
  .label { font-size:10px; color:#888; text-transform:uppercase; margin-bottom:5px; }
  /* ヒストグラム風モニター */
  #hist { position:absolute; bottom:20px; left:20px; width:200px; height:60px; background:rgba(0,0,0,0.5); border:1px solid #333; }
  #bar { position:absolute; bottom:0; width:100%; background:rgba(0,232,135,0.3); }
  /* モード切替 */
  #controls { position:fixed; top:40px; right:20px; z-index:10; }
  button { background:#222; color:#fff; border:1px solid #444; padding:10px 20px; cursor:pointer; }
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<div id="overlay">
  <div id="meter">
    <div class="label">Center Luminance</div>
    <div id="valL" class="value">0</div>
    <div class="label" style="margin-top:10px">Contrast Range</div>
    <div id="valC" class="value">0</div>
  </div>
  <div id="hist"><div id="bar"></div></div>
</div>
<div id="controls"><button id="toggleUI">アドバイス表示: ON</button></div>

<script>
  const video = document.getElementById('camera');
  const bar = document.getElementById('bar');
  let showAdvice = true;
  let canvas = document.createElement('canvas');
  let ctx = canvas.getContext('2d', {willReadFrequently: true});

  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>video.srcObject=s);

  function update() {
    if(!video.videoWidth) return requestAnimationFrame(update);
    canvas.width = 160; canvas.height = 90;
    ctx.drawImage(video, 0, 0, 160, 90);
    const data = ctx.getImageData(70, 35, 20, 20).data;
    let sum=0, min=255, max=0;
    for(let i=0; i<data.length; i+=4){
      const v = (data[i]+data[i+1]+data[i+2])/3;
      sum += v; if(v<min) min=v; if(v>max) max=v;
    }
    const lum = Math.round(sum/400);
    const con = Math.round(max-min);
    
    document.getElementById('valL').textContent = lum;
    document.getElementById('valC').textContent = con;
    bar.style.height = (lum/255*100) + '%';
    
    requestAnimationFrame(update);
  }
  
  document.getElementById('toggleUI').onclick = (e) => {
    showAdvice = !showAdvice;
    e.target.textContent = `アドバイス表示: ${showAdvice ? 'ON' : 'OFF'}`;
  };

  update();
</script>
</body>
</html>
