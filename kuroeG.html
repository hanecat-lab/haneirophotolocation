<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>黒衣モード 初心者コーチング版（高感度スポット測光）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#arCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#151515;color:#777;font-size:14px;z-index:0}
#shade{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4),transparent 30%,transparent 60%,rgba(0,0,0,.7));pointer-events:none;z-index:1}
#status{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.8);z-index:5;pointer-events:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#00e887;margin-right:6px;box-shadow:0 0 10px #00e887}
#reticle{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);width:50px;height:50px;border:2px solid rgba(0,232,135,0.7);border-radius:50%;z-index:3;pointer-events:none;transition:transform 0.1s ease}
#reticle:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;background:#00e887;border-radius:50%;transform:translate(-50%,-50%)}
#insight{position:fixed;left:18px;right:18px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));z-index:6}
.card{background:rgba(12,12,12,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.18);border-radius:24px;padding:20px;box-shadow:0 16px 40px rgba(0,0,0,0.4)}
.type{font-size:22px;font-weight:700;color:#fff;letter-spacing:.01em}
.reason{margin-top:8px;font-size:14px;line-height:1.6;color:rgba(255,255,255,0.9)}
.action-tip{margin-top:12px;padding:10px 14px;background:rgba(0,232,135,0.12);border:1px solid rgba(0,232,135,0.3);border-radius:12px;color:#00e887;font-size:13px;font-weight:500}
#more{position:fixed;right:18px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));z-index:7;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,10,.65);color:#fff;font-size:18px}
#panel{position:fixed;left:18px;right:18px;bottom:max(80px,calc(env(safe-area-inset-bottom) + 70px));z-index:8;display:none}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.row b{color:#00e887}
button{font:inherit}
#permission{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,0.82);backdrop-filter:blur(12px)}
.permission-card{width:min(420px,100%);background:rgba(18,18,18,0.98);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.permission-title{font-size:22px;font-weight:700}
.permission-text{margin-top:10px;font-size:14px;line-height:1.7;color:#bbb}
.perm-status{margin-top:18px;padding:12px;border-radius:12px;background:#252525;color:#00e887;font-size:13px}
#startBtn{margin-top:14px;width:100%;border:none;background:#fff;color:#000;border-radius:14px;padding:14px;font-weight:700}
</style>
</head>
<body>
<div id="fallback">カメラを起動しています…</div>
<video id="camera" autoplay playsinline muted></video>
<canvas id="arCanvas"></canvas>
<div id="shade"></div>
<div id="status"><span><i class="dot"></i><span id="state">スポット測光中</span></span><span id="clock">--:--</span></div>
<div id="reticle"></div>

<div id="insight">
  <div class="card">
    <div class="type" id="type">中央の光を分析中…</div>
    <div class="reason" id="reason">照準を合わせた被写体の立体感と影の出方をチェックしています。</div>
    <div class="action-tip" id="actionTip">💡 ガイド：被写体に中央の丸を合わせてみましょう</div>
  </div>
</div>

<button id="more" aria-label="詳細">⋯</button>
<div id="panel">
  <div class="card">
    <div style="font-weight:700;font-size:16px;margin-bottom:6px">中央スポット詳細データ</div>
    <div class="row"><span>中心の明るさ (Luminance)</span><b id="spotBright">解析中</b></div>
    <div class="row"><span>明暗差・立体感 (Contrast)</span><b id="spotContrast">解析中</b></div>
    <div class="row"><span>判定ステータス</span><b id="spotStatus">解析中</b></div>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div class="permission-title">黒衣モード（高感度版）</div>
    <div class="permission-text">カメラを許可して、中央スポット測光によるリアルタイムコーチングを起動します。</div>
    <div id="permStatus" class="perm-status">準備完了</div>
    <button id="startBtn">カメラを許可して始める</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let stream=null;
let lightCanvas=null, lightContext=null;
let spotStats={brightness:120, contrast:20, status:"安定"};

function setupLightAnalysis(){
  if(lightCanvas) return;
  lightCanvas=document.createElement("canvas");
  lightCanvas.width=160;
  lightCanvas.height=90;
  lightContext=lightCanvas.getContext("2d",{willReadFrequently:true});
}

function analyzeSpotLight(){
  const video=$("camera");
  if(!lightContext || !video.videoWidth || $("permission").style.display!=="none") return;
  lightContext.drawImage(video,0,0,160,90);
  
  // 画面中央付近（幅40px, 高さ40px 相当のエリア：x=60..100, y=25..65）をスポット測光
  const subWidth = 40;
  const subHeight = 40;
  const startX = 60;
  const startY = 25;
  
  const imgData = lightContext.getImageData(startX, startY, subWidth, subHeight);
  const pixels = imgData.data;
  
  let sum = 0;
  let minVal = 255;
  let maxVal = 0;
  let count = pixels.length / 4;
  
  for(let i=0; i<pixels.length; i+=4){
    const lum = 0.2126 * pixels[i] + 0.7152 * pixels[i+1] + 0.0722 * pixels[i+2];
    sum += lum;
    if(lum < minVal) minVal = lum;
    if(lum > maxVal) maxVal = lum;
  }
  
  const brightness = sum / count;
  const contrast = maxVal - minVal; // 局所的な明暗差（エッジや陰影の強さ）
  
  let status = "フラット";
  if(contrast > 55) {
    status = "立体感・ドラマチック";
  } else if(contrast > 30) {
    status = "良好なグラデーション";
  } else {
    status = "平坦（フラット）";
  }
  
  spotStats = { brightness, contrast, status };
  updateCoaching();
}

function drawARGuide(){
  const canvas=$("arCanvas");
  const ctx=canvas.getContext("2d");
  if(canvas.width!==window.innerWidth || canvas.height!==window.innerHeight){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
  }
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 中央レティクル周辺に控えめなARエフェクトを描画
  ctx.save();
  ctx.strokeStyle = spotStats.contrast > 40 ? "rgba(0, 232, 135, 0.9)" : "rgba(255, 255, 255, 0.4)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(canvas.width/2, canvas.height/2 - 40, 36, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

async function handleAction(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    $("camera").srcObject=stream;
    $("fallback").style.display="none";
  }catch(e){
    alert("カメラを起動できませんでした。");
    return;
  }

  setupLightAnalysis();
  $("permission").style.display="none";
}

function updateCoaching(){
  const now=new Date();
  $("clock").textContent=now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  
  let title="📸 良い光の捉え方です", reason="被写体に美しい陰影が出ています。", tip="この角度をキープしてシャッターをどうぞ！";
  
  if(spotStats.brightness < 40){
    title="🌙 中心部が暗すぎます";
    reason="光量が不足してディテールがつぶれています。";
    tip="💡 コーチ：少し明るい方向へカメラを向けるか、距離を近づけてみましょう";
  } else if(spotStats.brightness > 215){
    title="☀️ 中心部が白飛び気味です";
    reason="光が強すぎて質感が飛んでしまっています。";
    tip="💡 コーチ：アングルを少しずらして、影の部分を画面に入れてみましょう";
  } else if(spotStats.contrast > 50){
    title="✨ 立体的でドラマチックな光です！";
    reason=`中央の明暗差（コントラスト差: ${Math.round(spotStats.contrast)}）が大きく、被写体の質感が際立っています。`;
    tip="💡 コーチ：影の落ち方が最高です。今すぐ撮影しましょう！";
  } else {
    title="🌥 柔らかく均一な光です";
    reason="全体にフラットに光が回っています（ポートレートや商品撮影に向いています）。";
    tip="💡 コーチ：あえて少し斜めから光を当てるように角度をつけてみましょう";
  }

  $("type").textContent=title;
  $("reason").textContent=reason;
  $("actionTip").textContent=tip;
  
  $("spotBright").textContent = Math.round(spotStats.brightness) + " / 255";
  $("spotContrast").textContent = Math.round(spotStats.contrast) + " (差分)";
  $("spotStatus").textContent = spotStats.status;
  
  drawARGuide();
}

$("more").onclick=()=>{$("panel").style.display=$("panel").style.display==="block"?"none":"block"};
$("startBtn").onclick=handleAction;
setInterval(()=>{ if($("permission").style.display==="none") analyzeSpotLight(); }, 300);
</script>
</body>
</html>
