<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>リアルタイム露出・ストロボシミュレーター</title>
  <style>
    /* ==========================================
       1. 基本スタイル ＆ UIレイアウト (CSS)
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    /* 描画用フルスクリーンCanvasレイヤー */
    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* UIオーバーレイレイヤー */
    #uiLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      pointer-events: none; /* 下のCanvas操作を邪魔しない */
      transition: opacity 0.2s ease;
    }

    /* タッチ操作可能な要素にのみインタラクティブ性を付与 */
    .interactive {
      pointer-events: auto;
    }

    /* ヘッダー・ステータスバー */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .badge {
      font-size: 12px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-ok { background-color: #2e7d32; color: #fff; }
    .badge-warn { background-color: #ed6c02; color: #fff; }
    .badge-danger { background-color: #d32f2f; color: #fff; }

    /* メイン制御パネル */
    .control-panel {
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(12px);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    label {
      font-size: 13px;
      color: #ccc;
      width: 90px;
    }

    select, input, button {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: #007aff;
    }

    .btn {
      background: #007aff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-secondary {
      background: #444;
    }

    /* モーダル表示 */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid #333;
    }

    .modal-card h2 {
      margin-bottom: 12px;
      font-size: 18px;
    }

    .modal-card p {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- 非表示のリアルタイムカメラ入力Videoタグ -->
  <video id="webcam" autoplay playsinline style="display: none;"></video>

  <!-- メインCanvas（映像描画＋ゼブラオーバーレイ＋ROI描画） -->
  <canvas id="viewport" class="interactive"></canvas>

  <!-- UIオーバーレイ層 -->
  <div id="uiLayer">
    <div class="header-bar interactive">
      <div>
        <span style="font-size: 12px; color: #aaa;">環境光適正</span>
        <div id="envEvDisplay" style="font-weight: bold; font-size: 16px;">EV 0.0</div>
      </div>
      <div>
        <span style="font-size: 12px; color: #aaa;">必要ストロボ</span>
        <div id="strobePowerDisplay" style="font-weight: bold; font-size: 16px; color: #4caf50;">1/1</div>
      </div>
      <div id="statusBadge" class="badge badge-ok">NORMAL</div>
    </div>

    <!-- 下部操作パネル -->
    <div class="control-panel interactive">
      <div class="control-row">
        <label for="modeSelect">撮影モード</label>
        <select id="modeSelect" style="flex: 1;">
          <option value="MANUAL">マニュアル (M)</option>
          <option value="APERTURE_PRIORITY">絞り優先 (A)</option>
          <option value="SHUTTER_PRIORITY">シャッター優先 (S)</option>
        </select>
      </div>

      <div class="control-row">
        <label for="apertureInput">絞り (F値)</label>
        <input type="number" id="apertureInput" step="0.1" value="5.6" style="width: 80px;">
        <label for="ssInput" style="width: auto; margin-left: 10px;">SS (秒)</label>
        <input type="text" id="ssInput" value="1/160" style="width: 80px;">
        <label for="isoInput" style="width: auto; margin-left: 10px;">ISO</label>
        <input type="number" id="isoInput" step="50" value="100" style="width: 80px;">
      </div>

      <div class="control-row">
        <label for="gnInput">ストロボ GN</label>
        <input type="number" id="gnInput" value="60" style="width: 80px;">
        <label for="distInput" style="width: auto; margin-left: 10px;">距離 (m)</label>
        <input type="number" id="distInput" step="0.1" value="2.0" style="width: 80px;">
      </div>

      <div class="control-row" style="margin-top: 4px;">
        <button id="saveMySettingsBtn" class="btn btn-secondary" style="flex: 1; font-size: 12px;">マイ標準値として保存</button>
        <button id="resetMySettingsBtn" class="btn btn-secondary" style="flex: 1; font-size: 12px; margin-left: 8px;">標準値をリセット</button>
      </div>
    </div>
  </div>

  <!-- 初回起動パーミッション要求モーダル -->
  <div id="permissionModal" class="modal-overlay">
    <div class="modal-card">
      <h2>カメラアクセス許可</h2>
      <p>リアルタイムで周囲の輝度（EV値）を解析し、最適なストロボ光量とカメラ設定をシミュレーションします。</p>
      <button id="startAppBtn" class="btn" style="width: 100%; padding: 12px;">カメラを起動して開始</button>
    </div>
  </div>

  <script>
    /* ==========================================
       2. 露出計算 ＆ データ永続化エンジン (JS)
       ========================================== */

    class ExposureEngine {
      static LIMITS = {
        MIN_APERTURE: 1.0,
        MAX_APERTURE: 32.0,
        MIN_SS: 1 / 8000,
        MAX_SS: 30.0,
        MIN_ISO: 50,
        MAX_ISO: 102400,
        MIN_STROBE_POWER: 1 / 128,
        MAX_STROBE_POWER: 1.0,
      };

      static DEFAULT_MY_SETTINGS = {
        mode: 'MANUAL',
        aperture: 5.6,
        shutterSpeed: 1 / 160,
        iso: 100,
      };

      static clamp(val, min, max) {
        return Math.min(Math.max(val, min), max);
      }

      static roundToThirdEV(ev) {
        return Math.round(ev * 3) / 3;
      }

      static calculateEV(aperture, shutterSpeed, iso) {
        const safeA = Math.max(aperture, this.LIMITS.MIN_APERTURE);
        const safeSS = Math.max(shutterSpeed, this.LIMITS.MIN_SS);
        const safeISO = Math.max(iso, this.LIMITS.MIN_ISO);

        const ev100 = Math.log2((safeA * safeA) / safeSS);
        const isoShift = Math.log2(safeISO / 100);
        return this.roundToThirdEV(ev100 - isoShift);
      }

      static autoAdjustCamera(inputCamera, targetAmbientEV) {
        const camera = { ...inputCamera };

        if (camera.mode === 'APERTURE_PRIORITY') {
          const isoShift = Math.log2(camera.iso / 100);
          const targetEV100 = targetAmbientEV + isoShift;
          let calculatedSS = (camera.aperture * camera.aperture) / Math.pow(2, targetEV100);

          if (calculatedSS > this.LIMITS.MAX_SS) {
            camera.shutterSpeed = this.LIMITS.MAX_SS;
            const requiredEVShift = Math.log2(calculatedSS / this.LIMITS.MAX_SS);
            camera.iso = this.clamp(
              Math.round(camera.iso * Math.pow(2, requiredEVShift)),
              this.LIMITS.MIN_ISO,
              this.LIMITS.MAX_ISO
            );
          } else {
            camera.shutterSpeed = this.clamp(calculatedSS, this.LIMITS.MIN_SS, this.LIMITS.MAX_SS);
          }
        } else if (camera.mode === 'SHUTTER_PRIORITY') {
          const isoShift = Math.log2(camera.iso / 100);
          const targetEV100 = targetAmbientEV + isoShift;
          const calculatedAperture = Math.sqrt(camera.shutterSpeed * Math.pow(2, targetEV100));

          camera.aperture = this.clamp(calculatedAperture, this.LIMITS.MIN_APERTURE, this.LIMITS.MAX_APERTURE);
        }

        return camera;
      }

      static runSimulation(rawCamera, strobe, targetAmbientEV) {
        const camera = this.autoAdjustCamera(rawCamera, targetAmbientEV);
        const safeDistance = Math.max(strobe.distanceMeter, 0.1);
        const safeGN = Math.max(strobe.guideNumber, 1.0);

        const currentEV = this.calculateEV(camera.aperture, camera.shutterSpeed, camera.iso);
        const ambientDiff = this.roundToThirdEV(currentEV - targetAmbientEV);

        const isoFactor = Math.sqrt(camera.iso / 100);
        const requiredFullPowerF = (safeGN * isoFactor) / safeDistance;
        const rawPowerRatio = Math.pow(camera.aperture / requiredFullPowerF, 2);

        const clampedRatio = this.clamp(
          rawPowerRatio,
          this.LIMITS.MIN_STROBE_POWER,
          this.LIMITS.MAX_STROBE_POWER
        );

        const isStrobeOverLimit =
          rawPowerRatio > this.LIMITS.MAX_STROBE_POWER || rawPowerRatio < this.LIMITS.MIN_STROBE_POWER;

        const isSyncSpeedExceeded = camera.shutterSpeed < strobe.syncSpeedLimit;

        let exposureWarning = 'PERFECT';
        if (ambientDiff > 1.0) exposureWarning = 'OVER';
        if (ambientDiff < -1.0) exposureWarning = 'UNDER';

        return {
          camera,
          environmentEV: targetAmbientEV,
          currentCameraEV: currentEV,
          ambientExposureDiffEV: ambientDiff,
          requiredStrobePowerRatio: rawPowerRatio,
          clampedStrobePowerRatio: clampedRatio,
          strobePowerFractionString: this.formatPowerRatio(clampedRatio, rawPowerRatio),
          isStrobeOverLimit,
          isSyncSpeedExceeded,
          exposureWarning,
        };
      }

      static formatPowerRatio(clamped, raw) {
        const fractions = [
          { ratio: 1.0, label: '1/1' },
          { ratio: 0.5, label: '1/2' },
          { ratio: 0.25, label: '1/4' },
          { ratio: 0.125, label: '1/8' },
          { ratio: 0.0625, label: '1/16' },
          { ratio: 0.03125, label: '1/32' },
          { ratio: 0.015625, label: '1/64' },
          { ratio: 0.0078125, label: '1/128' },
        ];

        const closest = fractions.reduce((prev, curr) =>
          Math.abs(curr.ratio - clamped) < Math.abs(prev.ratio - clamped) ? curr : prev
        );

        if (raw > 1.0) {
          const stopDeficit = this.roundToThirdEV(Math.log2(raw));
          return `${closest.label} (+${stopDeficit}EV 不足)`;
        }
        if (raw < this.LIMITS.MIN_STROBE_POWER) {
          return `${closest.label} (過剰)`;
        }

        return closest.label;
      }
    }

    class UserPreferenceStorage {
      static STORAGE_KEY = 'photo_sim_my_camera_settings_v2';

      static saveMySettings(settings) {
        try {
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(settings));
          return true;
        } catch (e) {
          console.error('保存失敗:', e);
          return false;
        }
      }

      static loadMySettings() {
        try {
          const data = localStorage.getItem(this.STORAGE_KEY);
          if (!data) return ExposureEngine.DEFAULT_MY_SETTINGS;
          const parsed = JSON.parse(data);
          return {
            mode: parsed.mode || 'MANUAL',
            aperture: ExposureEngine.clamp(parsed.aperture, ExposureEngine.LIMITS.MIN_APERTURE, ExposureEngine.LIMITS.MAX_APERTURE),
            shutterSpeed: ExposureEngine.clamp(parsed.shutterSpeed, ExposureEngine.LIMITS.MIN_SS, ExposureEngine.LIMITS.MAX_SS),
            iso: ExposureEngine.clamp(parsed.iso, ExposureEngine.LIMITS.MIN_ISO, ExposureEngine.LIMITS.MAX_ISO),
          };
        } catch (e) {
          return ExposureEngine.DEFAULT_MY_SETTINGS;
        }
      }

      static resetToDefault() {
        try {
          localStorage.removeItem(this.STORAGE_KEY);
        } catch (e) {}
        return ExposureEngine.DEFAULT_MY_SETTINGS;
      }
    }
    /* ==========================================
       3. リアルタイム画像解析 ＆ ゼブラ描画エンジン
       ========================================== */

    class ImageAnalyzer {
      /**
       * 中央ROI（関心領域）の平均輝度(RGB-YUV変換)から環境光EV100を算出
       */
      static calculateAmbientEV(ctx, width, height) {
        // 画面中央の20%x20%領域を抽出
        const roiWidth = Math.max(1, Math.floor(width * 0.2));
        const roiHeight = Math.max(1, Math.floor(height * 0.2));
        const roiX = Math.floor((width - roiWidth) / 2);
        const roiY = Math.floor((height - roiHeight) / 2);

        let imgData;
        try {
          imgData = ctx.getImageData(roiX, roiY, roiWidth, roiHeight);
        } catch (e) {
          return 7.0; // フォールバックEV
        }

        const data = imgData.data;
        let totalLuminance = 0;
        const pixelCount = data.length / 4;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          // ITU-R BT.601 標準相対輝度算出式
          const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
          totalLuminance += luminance;
        }

        const avgLuminance = totalLuminance / pixelCount; // 0 ~ 255

        // 輝度(0-255)をEV値(EV0 ~ EV15)にマッピング
        // ログスケールで対数変換し、露出変化に対応
        const normalizedLum = Math.max(avgLuminance / 255, 0.001);
        const estimatedEV = Math.log2(normalizedLum) * 3 + 9.0;

        return ExposureEngine.roundToThirdEV(ExposureEngine.clamp(estimatedEV, 0, 18));
      }

      /**
       * 露出過不足に応じたゼブラ・赤/青オーバーレイ処理
       */
      static applyZebraPattern(ctx, width, height, ambientDiffEV, frameCount) {
        if (Math.abs(ambientDiffEV) < 0.7) return; // 許容範囲内なら描画スキップ

        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;

        // パフォーマンス確保のため4ピクセルごとに間引き処理
        const step = 4;
        const stripeWidth = 12;

        for (let y = 0; y < height; y += step) {
          for (let x = 0; x < width; x += step) {
            const idx = (y * width + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            const lum = 0.299 * r + 0.587 * g + 0.114 * b;

            // オーバー露出（白飛び箇所を警告描画）
            if (ambientDiffEV > 1.0 && lum > 200) {
              const isStripe = ((x + y + frameCount * 2) % stripeWidth) < (stripeWidth / 2);
              if (isStripe) {
                data[idx] = 255;     // Red
                data[idx + 1] = 30;  // Green
                data[idx + 2] = 30;  // Blue
              }
            }
            // アンダー露出（黒潰れ箇所を青色で警告描画）
            else if (ambientDiffEV < -1.0 && lum < 40) {
              const isStripe = ((x - y + frameCount * 2) % stripeWidth) < (stripeWidth / 2);
              if (isStripe) {
                data[idx] = 30;      // Red
                data[idx + 1] = 100; // Green
                data[idx + 2] = 255; // Blue
              }
            }
          }
        }

        ctx.putImageData(imgData, 0, 0);
      }

      /**
       * 中央測光ターゲット（ROI枠）の描画
       */
      static drawTargetROI(ctx, width, height) {
        const roiWidth = width * 0.2;
        const roiHeight = height * 0.2;
        const roiX = (width - roiWidth) / 2;
        const roiY = (height - roiHeight) / 2;

        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.strokeRect(roiX, roiY, roiWidth, roiHeight);

        // レティクル十字
        ctx.beginPath();
        ctx.moveTo(width / 2 - 10, height / 2);
        ctx.lineTo(width / 2 + 10, height / 2);
        ctx.moveTo(width / 2, height / 2 - 10);
        ctx.lineTo(width / 2, height / 2 + 10);
        ctx.strokeStyle = 'rgba(0, 255, 200, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([]);
        ctx.stroke();

        ctx.restore();
      }
    }

    /* ==========================================
       4. アプリケーション制御 ＆ UIバインディング
       ========================================== */

    class App {
      constructor() {
        this.video = document.getElementById('webcam');
        this.canvas = document.getElementById('viewport');
        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });

        // 保存された設定の読み込み
        this.cameraSettings = UserPreferenceStorage.loadMySettings();
        this.strobeSettings = {
          guideNumber: 60,
          powerRatio: 1.0,
          distanceMeter: 2.0,
          syncSpeedLimit: 1 / 200,
          position: 'front',
        };

        this.frameCount = 0;
        this.isRunning = false;

        this.initUI();
      }

      initUI() {
        // UI初期値の同期
        document.getElementById('modeSelect').value = this.cameraSettings.mode;
        document.getElementById('apertureInput').value = this.cameraSettings.aperture;
        document.getElementById('ssInput').value = this.formatFraction(this.cameraSettings.shutterSpeed);
        document.getElementById('isoInput').value = this.cameraSettings.iso;

        document.getElementById('gnInput').value = this.strobeSettings.guideNumber;
        document.getElementById('distInput').value = this.strobeSettings.distanceMeter;

        // イベントリスナーの登録
        document.getElementById('startAppBtn').addEventListener('click', () => this.startCamera());
        document.getElementById('modeSelect').addEventListener('change', (e) => this.onCameraParamChange());
        document.getElementById('apertureInput').addEventListener('input', () => this.onCameraParamChange());
        document.getElementById('ssInput').addEventListener('input', () => this.onCameraParamChange());
        document.getElementById('isoInput').addEventListener('input', () => this.onCameraParamChange());

        document.getElementById('gnInput').addEventListener('input', () => this.onStrobeParamChange());
        document.getElementById('distInput').addEventListener('input', () => this.onStrobeParamChange());

        document.getElementById('saveMySettingsBtn').addEventListener('click', () => {
          UserPreferenceStorage.saveMySettings(this.cameraSettings);
          alert('現在の設定をマイ標準値として保存しました。');
        });

        document.getElementById('resetMySettingsBtn').addEventListener('click', () => {
          this.cameraSettings = UserPreferenceStorage.resetToDefault();
          this.updateUIFromSettings();
          alert('標準値をリセットしました。');
        });

        window.addEventListener('resize', () => this.resizeCanvas());
      }

      formatFraction(val) {
        if (val < 1) {
          const denominator = Math.round(1 / val);
          return `1/${denominator}`;
        }
        return val.toString();
      }

      parseFraction(str) {
        if (typeof str === 'number') return str;
        if (str.includes('/')) {
          const parts = str.split('/');
          const num = parseFloat(parts[0]);
          const den = parseFloat(parts[1]);
          if (!isNaN(num) && !isNaN(den) && den !== 0) {
            return num / den;
          }
        }
        const parsed = parseFloat(str);
        return isNaN(parsed) ? 1 / 160 : parsed;
      }

      updateUIFromSettings() {
        document.getElementById('modeSelect').value = this.cameraSettings.mode;
        document.getElementById('apertureInput').value = this.cameraSettings.aperture;
        document.getElementById('ssInput').value = this.formatFraction(this.cameraSettings.shutterSpeed);
        document.getElementById('isoInput').value = this.cameraSettings.iso;
      }

      onCameraParamChange() {
        this.cameraSettings.mode = document.getElementById('modeSelect').value;
        this.cameraSettings.aperture = parseFloat(document.getElementById('apertureInput').value) || 5.6;
        this.cameraSettings.shutterSpeed = this.parseFraction(document.getElementById('ssInput').value);
        this.cameraSettings.iso = parseInt(document.getElementById('isoInput').value, 10) || 100;

        // モードによる入力制御（ロック）
        document.getElementById('ssInput').disabled = (this.cameraSettings.mode === 'APERTURE_PRIORITY');
        document.getElementById('apertureInput').disabled = (this.cameraSettings.mode === 'SHUTTER_PRIORITY');
      }

      onStrobeParamChange() {
        this.strobeSettings.guideNumber = parseFloat(document.getElementById('gnInput').value) || 60;
        this.strobeSettings.distanceMeter = parseFloat(document.getElementById('distInput').value) || 2.0;
      }

      resizeCanvas() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      async startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false,
          });
          this.video.srcObject = stream;
          await this.video.play();

          document.getElementById('permissionModal').style.display = 'none';
          this.resizeCanvas();
          this.isRunning = true;
          requestAnimationFrame(() => this.loop());
        } catch (err) {
          alert('カメラの起動に失敗しました。権限を確認してください: ' + err.message);
        }
      }

      loop() {
        if (!this.isRunning) return;

        this.frameCount++;
        const width = this.canvas.width;
        const height = this.canvas.height;

        // 1. カメラ映像のCanvas描画
        this.ctx.drawImage(this.video, 0, 0, width, height);

        // 2. 環境光EVのリアルタイム解析
        const ambientEV = ImageAnalyzer.calculateAmbientEV(this.ctx, width, height);

        // 3. 物理露出・ストロボシミュレーション計算
        const result = ExposureEngine.runSimulation(
          this.cameraSettings,
          this.strobeSettings,
          ambientEV
        );

        // A/S優先モード時の自動計算値をUI入力欄にフィードバック
        if (this.cameraSettings.mode === 'APERTURE_PRIORITY') {
          this.cameraSettings.shutterSpeed = result.camera.shutterSpeed;
          document.getElementById('ssInput').value = this.formatFraction(result.camera.shutterSpeed);
        } else if (this.cameraSettings.mode === 'SHUTTER_PRIORITY') {
          this.cameraSettings.aperture = result.camera.aperture;
          document.getElementById('apertureInput').value = result.camera.aperture.toFixed(1);
        }

        // 4. ゼブラパターン（白飛び・黒潰れ）のオーバーレイ
        ImageAnalyzer.applyZebraPattern(this.ctx, width, height, result.ambientExposureDiffEV, this.frameCount);

        // 5. 中央測光枠の描画
        ImageAnalyzer.drawTargetROI(this.ctx, width, height);

        // 6. UIテキスト表示の更新
        this.updateStatusDisplay(result);

        requestAnimationFrame(() => this.loop());
      }
      /**
       * ヘッダーおよびステータスバッジのリアルタイム更新
       */
      updateStatusDisplay(result) {
        // 環境光EV表示
        document.getElementById('envEvDisplay').textContent = `EV ${result.environmentEV.toFixed(1)}`;

        // 必要ストロボ光量表示
        const strobeText = document.getElementById('strobePowerDisplay');
        strobeText.textContent = result.strobePowerFractionString;

        if (result.isStrobeOverLimit) {
          strobeText.style.color = '#ff9800'; // 警告（オレンジ）
        } else {
          strobeText.style.color = '#4caf50'; // 正常（緑）
        }

        // ステータスバッジの描画更新
        const badge = document.getElementById('statusBadge');

        if (result.isSyncSpeedExceeded) {
          badge.textContent = '幕切れ警告 (SS高速すぎ)';
          badge.className = 'badge badge-danger';
        } else if (result.exposureWarning === 'OVER') {
          badge.textContent = '露出オーバー (+1EV超)';
          badge.className = 'badge badge-warn';
        } else if (result.exposureWarning === 'UNDER') {
          badge.textContent = '露出アンダー (-1EV超)';
          badge.className = 'badge badge-warn';
        } else {
          badge.textContent = '適正露出';
          badge.className = 'badge badge-ok';
        }
      }
    }

    /* ==========================================
       5. エントリポイント (DOMContentLoaded)
       ========================================== */
    window.addEventListener('DOMContentLoaded', () => {
      // アプリケーション初期化
      window.photoApp = new App();
    });
  </script>
</body>
