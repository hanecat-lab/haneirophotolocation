<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>プロ・ライティング・ナビ v19 (ROIエリア枠対応版)</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",monospace}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#111}

/* ターゲット枠 (ROI) */
#roiBox{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:240px;height:240px;border:2px dashed rgba(0,232,135,0.7);border-radius:16px;z-index:3;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,0.35)}
#roiLabel{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:10px;color:#00e887;font-weight:bold;white-space:nowrap;background:rgba(0,0,0,0.7);padding:2px 8px;border-radius:8px}

.spot-pin{position:fixed;width:32px;height:32px;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%);z-index:4;pointer-events:none;display:none;font-size:10px;font-weight:bold;text-align:center;line-height:28px;box-shadow:0 0 10px rgba(0,0,0,0.8)}
#pinKey{border-color:#00e887;background:rgba(0,232,135,0.4);color:#00e887}
#pinShadow{border-color:#ff3b30;background:rgba(255,59,48,0.4);color:#ff3b30}

#autoStatus{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);border:1px solid #00e887;color:#00e887;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:bold;z-index:12;display:none;pointer-events:none}

#dashboard{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:16px;width:calc(100% - 32px);max-width:340px;background:rgba(12,12,12,0.88);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.15);border-radius:18px;padding:12px;z-index:5;display:none}

.dash-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.dash-val{font-size:16px;color:#00e887;font-weight:bold;font-family:monospace}
.dash-label{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px}

#ratioGuide{background:rgba(0,232,135,0.1);border-left:3px solid #00e887;padding:6px 10px;border-radius:0 8px 8px 0;font-size:10px;color:#ddd;margin-top:6px;font-family:monospace}

#permission{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.95)}
.permission-card{width:min(380px,100%);background:#121212;border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;text-align:center}
button.primary{background:#00e887;color:#000;border:none;padding:14px;border-radius:14px;font-weight:bold;cursor:pointer;width:100%}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>

<div id="roiBox">
  <div id="roiLabel">被写体を枠内に配置</div>
</div>

<div id="autoStatus">🎯 枠内エリア限定トラッキング</div>

<div id="pinKey" class="spot-pin">K</div>
<div id="pinShadow" class="spot-pin">S</div>

<div id="dashboard">
  <div class="dash-row">
    <div>
      <div class="dash-label">被写体明暗比</div>
      <div id="valRatio" class="dash-val">1 : ---</div>
    </div>
    <div style="text-align:right">
      <div class="dash-label">解析モード</div>
      <div id="spotModeText" style="font-size:10px;color:#00e887">枠内(ROI)解析</div>
    </div>
  </div>
  <div id="ratioGuide">枠外の背景（ライトや物陰）を無視して被写体のみを解析中。</div>
</div>

<div id="permission">
  <div class="permission-card">
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">プロ・ライティング・ナビ v19</div>
    <div style="font-size:12px;color:#aaa;margin-bottom:20px">ターゲット枠により、背景にピンが飛ぶ現象を完全にシャットアウトします。</div>
    <button id="startBtn" class="primary">利用を開始</button>
  </div>
</div>

<script>
const video = document.getElementById('camera');
const pinKey = document.getElementById('pinKey');
const pinShadow = document.getElementById('pinShadow');
const roiBox = document.getElementById('roiBox');

let canvas = document.createElement('canvas');
let ctx = canvas.getContext('2d', {willReadFrequently: true});

let curKx = 0, curKy = 0, curSx = 0, curSy = 0;
let targetKx = 0, targetKy = 0, targetSx = 0, targetSy = 0;
let smoothRatio = 1;

async function startApp() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 360 } }
    });
    video.srcObject = stream;
    document.getElementById('permission').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    pinKey.style.display = 'block'; pinShadow.style.display = 'block';
    document.getElementById('autoStatus').style.display = 'block';

    curKx = window.innerWidth * 0.5; curKy = window.innerHeight * 0.5;
    curSx = window.innerWidth * 0.5; curSy = window.innerHeight * 0.5;

    await video.play().catch(()=>{});
    requestAnimationFrame(loop);
  } catch (err) {
    alert("起動失敗: " + err.message);
  }
}

function loop() {
  if(!video.videoWidth) { requestAnimationFrame(loop); return; }

  // 画面全体キャンバス
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  canvas.width = 64; canvas.height = 36;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // ROI（画面中央の枠）の比率計算
  const rect = roiBox.getBoundingClientRect();
  const rxMin = Math.floor((rect.left / window.innerWidth) * canvas.width);
  const rxMax = Math.ceil((rect.right / window.innerWidth) * canvas.width);
  const ryMin = Math.floor((rect.top / window.innerHeight) * canvas.height);
  const ryMax = Math.ceil((rect.bottom / window.innerHeight) * canvas.height);

  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  let maxLum = -1, minLum = 256;
  let maxPos = {x: 0, y: 0}, minPos = {x: 0, y: 0};

  // 枠内だけのピクセルを走査
  for (let y = ryMin; y < ryMax; y++) {
    for (let x = rxMin; x < rxMax; x++) {
      if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
      const i = (y * canvas.width + x) * 4;
      const lum = imgData[i] * 0.2126 + imgData[i+1] * 0.7152 + imgData[i+2] * 0.0722;

      // 極端な白飛び（光源）を除外する場合は条件を追加可能
      if (lum > maxLum) { maxLum = lum; maxPos = {x, y}; }
      if (lum < minLum) { minLum = lum; minPos = {x, y}; }
    }
  }

  targetKx = (maxPos.x / canvas.width) * window.innerWidth;
  targetKy = (maxPos.y / canvas.height) * window.innerHeight;
  targetSx = (minPos.x / canvas.width) * window.innerWidth;
  targetSy = (minPos.y / canvas.height) * window.innerHeight;

  const rawRatio = Math.max(1, (maxLum / Math.max(1, minLum)));
  smoothRatio += (rawRatio - smoothRatio) * 0.1;

  // 滑らか補間
  const alpha = 0.15;
  curKx += (targetKx - curKx) * alpha;
  curKy += (targetKy - curKy) * alpha;
  curSx += (targetSx - curSx) * alpha;
  curSy += (targetSy - curSy) * alpha;

  pinKey.style.left = curKx + 'px'; pinKey.style.top = curKy + 'px';
  pinShadow.style.left = curSx + 'px'; pinShadow.style.top = curSy + 'px';

  document.getElementById('valRatio').textContent = `1 : ${smoothRatio.toFixed(1)}`;

  requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick = startApp;
</script>
</body>
</html>
