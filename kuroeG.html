<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>黒衣モード（カメラ起動デバッグ版）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#arCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#151515;color:#777;font-size:14px;z-index:0}
#shade{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4),transparent 30%,transparent 60%,rgba(0,0,0,.7));pointer-events:none;z-index:1}
#status{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.8);z-index:5;pointer-events:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#00e887;margin-right:6px;box-shadow:0 0 10px #00e887}
#reticle{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);width:50px;height:50px;border:2px solid rgba(0,232,135,0.7);border-radius:50%;z-index:3;pointer-events:none}
#modeToggle{position:fixed;top:max(12px,env(safe-area-inset-top));right:16px;z-index:10;background:rgba(20,20,20,0.8);border:1px solid rgba(255,255,255,0.2);color:#00e887;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
#insight{position:fixed;left:18px;right:18px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));z-index:6}
.card{background:rgba(12,12,12,0.88);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.18);border-radius:24px;padding:20px;box-shadow:0 16px 40px rgba(0,0,0,0.4)}
.type{font-size:20px;font-weight:700;color:#fff}
.reason{margin-top:6px;font-size:13px;line-height:1.5;color:rgba(255,255,255,0.9)}
.action-tip{margin-top:10px;padding:10px 14px;background:rgba(0,232,135,0.12);border:1px solid rgba(0,232,135,0.3);border-radius:12px;color:#00e887;font-size:13px;font-weight:500}
button{font:inherit}
#permission{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px)}
.permission-card{width:min(420px,100%);background:rgba(18,18,18,0.98);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px}
.permission-title{font-size:22px;font-weight:700}
.permission-text{margin-top:10px;font-size:14px;line-height:1.7;color:#bbb}
.perm-status{margin-top:18px;padding:12px;border-radius:12px;background:#252525;color:#ff5555;font-size:13px;word-break:break-all}
#startBtn{margin-top:14px;width:100%;border:none;background:#fff;color:#000;border-radius:14px;padding:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="fallback">カメラ待機中…</div>
<video id="camera" autoplay playsinline muted></video>
<canvas id="arCanvas"></canvas>
<div id="shade"></div>
<div id="status"><span><i class="dot"></i><span id="stateName">待機中</span></span><span id="clock">--:--</span></div>
<button id="modeToggle" style="display:none">PRO版に切替</button>
<div id="reticle"></div>

<div id="insight">
  <div class="card">
    <div class="type" id="type">カメラ権限を許可してください</div>
    <div class="reason" id="reason">ボタンを押すとカメラの起動を試みます。</div>
    <div class="action-tip" id="actionTip">💡 ガイド：ポップアップが出たら「許可」を選択してください</div>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div class="permission-title">黒衣モード（デバッグ版）</div>
    <div class="permission-text">ボタンを押してカメラを起動します。もし反応しない場合、下のステータスにエラーが表示されます。</div>
    <div id="permStatus" class="perm-status" style="color:#00e887">準備完了：ボタンを押してください</div>
    <button id="startBtn">カメラを許可して始める</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let stream=null;
let lightCanvas=null, lightContext=null;
let currentMode="coach";
let smoothedBrightness=120, smoothedContrast=30;

function setupLightAnalysis(){
  if(lightCanvas) return;
  lightCanvas=document.createElement("canvas");
  lightCanvas.width=160;
  lightCanvas.height=90;
  lightContext=lightCanvas.getContext("2d",{willReadFrequently:true});
}

function analyzeContext(){
  const video=$("camera");
  if(!lightContext || !video.videoWidth || $("permission").style.display!=="none") return;
  lightContext.drawImage(video,0,0,160,90);
  
  const imgData = lightContext.getImageData(60, 25, 40, 40);
  const pixels = imgData.data;
  let sum = 0, minVal = 255, maxVal = 0, count = pixels.length / 4;
  
  for(let i=0; i<pixels.length; i+=4){
    const lum = 0.2126 * pixels[i] + 0.7152 * pixels[i+1] + 0.0722 * pixels[i+2];
    sum += lum;
    if(lum < minVal) minVal = lum;
    if(lum > maxVal) maxVal = lum;
  }
  
  const rawB = sum / count;
  const rawC = maxVal - minVal;
  smoothedBrightness = smoothedBrightness * 0.75 + rawB * 0.25;
  smoothedContrast = smoothedContrast * 0.75 + rawC * 0.25;

  let d = {};
  if(smoothedBrightness > 210 && smoothedContrast < 60){
    d = { type: "💡 ライト（光源）を直視しています", reason: "被写体に光を当てましょう", status: "光源直視" };
  } else if(smoothedContrast > 60){
    d = { type: "✨ 非常に美しい立体的な光です！", reason: "コントラストが絶妙です", status: "ドラマチック" };
  } else if(smoothedBrightness < 45){
    d = { type: "🌙 光量が不足しています", reason: "もう少し明るい場所へ", status: "光量不足" };
  } else {
    d = { type: "🌥 優しいフラットな光です", reason: "安定した状態です", status: "フラット" };
  }

  $("clock").textContent = new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  if(currentMode === "coach"){
    $("type").textContent = d.type;
    $("reason").textContent = d.reason;
    $("actionTip").style.display = "block";
  } else {
    $("type").textContent = "📊 PRO TELEMETRY";
    $("reason").innerHTML = `明度: ${Math.round(smoothedBrightness)} / 差分: ${Math.round(smoothedContrast)}`;
    $("actionTip").style.display = "none";
  }
}

async function handleAction(){
  $("permStatus").style.color = "#00e887";
  $("permStatus").textContent = "カメラを要求しています…";

  // ブラウザがgetUserMediaをサポートしているかチェック
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $("permStatus.style.color = "#ff5555";
    $("permStatus").textContent = "エラー: このブラウザはカメラAPIに対応していません（HTTPS環境で開いていますか？）";
    return;
  }

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    const videoElem = $("camera");
    videoElem.srcObject = stream;
    
    // ビデオの再生確認
    await videoElem.play().catch(err => {
      console.warn("Autoplay blocked or failed:", err);
    });

    $("fallback").style.display = "none";
    $("permission").style.display = "none";
    $("modeToggle").style.display = "block";
    setupLightAnalysis();
  }catch(e){
    console.error(e);
    $("permStatus").style.color = "#ff5555";
    $("permStatus").innerHTML = `起動失敗: ${e.name} - ${e.message}<br><small>※SafariやChromeの「サイトの設定」でカメラがブロックされていないか確認してください。</small>`;
  }
}

$("modeToggle").onclick = () => {
  if(currentMode === "coach"){
    currentMode = "pro";
    $("modeToggle").textContent = "コーチ版に切替";
    $("stateName").textContent = "PRO版稼働中";
  } else {
    currentMode = "coach";
    $("modeToggle").textContent = "PRO版に切替";
    $("stateName").textContent = "コーチモード稼働中";
  }
};

$("startBtn").onclick = handleAction;
setInterval(()=>{ if($("permission").style.display === "none") analyzeContext(); }, 300);
</script>
</body>
</html>
