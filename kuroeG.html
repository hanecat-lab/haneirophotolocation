<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>黒衣モード 初心者コーチング版</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#arCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#151515;color:#777;font-size:14px;z-index:0}
#shade{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4),transparent 30%,transparent 60%,rgba(0,0,0,.7));pointer-events:none;z-index:1}
#status{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.8);z-index:5;pointer-events:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#00e887;margin-right:6px;box-shadow:0 0 10px #00e887}
#reticle{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);width:44px;height:44px;border:2px solid rgba(255,255,255,0.4);border-radius:50%;z-index:3;pointer-events:none}
#reticle:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;background:#00e887;border-radius:50%;transform:translate(-50%,-50%)}
#insight{position:fixed;left:18px;right:18px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));z-index:6}
.card{background:rgba(12,12,12,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.18);border-radius:24px;padding:20px;box-shadow:0 16px 40px rgba(0,0,0,0.4)}
.type{font-size:22px;font-weight:700;color:#fff;letter-spacing:.01em}
.reason{margin-top:8px;font-size:14px;line-height:1.6;color:rgba(255,255,255,0.9)}
.action-tip{margin-top:12px;padding:10px 14px;background:rgba(0,232,135,0.12);border:1px solid rgba(0,232,135,0.3);border-radius:12px;color:#00e887;font-size:13px;font-weight:500}
#more{position:fixed;right:18px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));z-index:7;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,10,.65);color:#fff;font-size:18px}
#panel{position:fixed;left:18px;right:18px;bottom:max(80px,calc(env(safe-area-inset-bottom) + 70px));z-index:8;display:none}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.row b{color:#00e887}
button{font:inherit}
#permission{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,0.82);backdrop-filter:blur(12px)}
.permission-card{width:min(420px,100%);background:rgba(18,18,18,0.98);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.permission-title{font-size:22px;font-weight:700}
.permission-text{margin-top:10px;font-size:14px;line-height:1.7;color:#bbb}
.perm-status{margin-top:18px;padding:12px;border-radius:12px;background:#252525;color:#00e887;font-size:13px}
#startBtn{margin-top:14px;width:100%;border:none;background:#fff;color:#000;border-radius:14px;padding:14px;font-weight:700}
</style>
</head>
<body>
<div id="fallback">カメラを起動しています…</div>
<video id="camera" autoplay playsinline muted></video>
<canvas id="arCanvas"></canvas>
<div id="shade"></div>
<div id="status"><span><i class="dot"></i><span id="state">コーチング稼働中</span></span><span id="clock">--:--</span></div>
<div id="reticle"></div>

<div id="insight">
  <div class="card">
    <div class="type" id="type">周囲の光を分析中…</div>
    <div class="reason" id="reason">スマホを向けた場所の明るさと光の向きをチェックしています。</div>
    <div class="action-tip" id="actionTip">💡 ガイド：まずは明るい方にカメラを向けてみましょう</div>
  </div>
</div>

<button id="more" aria-label="詳細">⋯</button>
<div id="panel">
  <div class="card">
    <div style="font-weight:700;font-size:16px;margin-bottom:6px">撮影のヒント（詳細データ）</div>
    <div class="row"><span>現在の光の回り方</span><b id="lightDirection">解析中</b></div>
    <div class="row"><span>おすすめのカメラ位置</span><b id="composition">解析中</b></div>
    <div class="row"><span>推奨レンズ</span><b id="lens">標準ズーム</b></div>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div class="permission-title">黒衣モード（初心者版）</div>
    <div class="permission-text">カメラとセンサーを許可して、あなた専属の光のコーチを起動します。</div>
    <div id="permStatus" class="perm-status">準備完了</div>
    <button id="startBtn">カメラを許可して始める</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let lat=34.69, lon=135.50, heading=null, stream=null;
let lightCanvas=null, lightContext=null, lightStats={ready:false, direction:"全体", brightness:120};
let step=1;

function setupLightAnalysis(){
  if(lightCanvas) return;
  lightCanvas=document.createElement("canvas");
  lightCanvas.width=160;
  lightCanvas.height=90;
  lightContext=lightCanvas.getContext("2d",{willReadFrequently:true});
}

function analyzeFrameLight(){
  const video=$("camera");
  if(!lightContext || !video.videoWidth || $("permission").style.display!=="none") return;
  lightContext.drawImage(video,0,0,160,90);
  const pixels=lightContext.getImageData(0,0,160,90).data;
  let leftSum=0, rightSum=0, total=0;
  
  for(let y=0;y<90;y+=2){
    for(let x=0;x<160;x+=2){
      const i=(y*160+x)*4;
      const lum=0.2126*pixels[i]+0.7152*pixels[i+1]+0.0722*pixels[i+2];
      total+=lum;
      if(x<80) leftSum+=lum; else rightSum+=lum;
    }
  }
  const avg = total / 3600;
  const dir = leftSum > rightSum + 5000 ? "左側から強く当たっています" : (rightSum > leftSum + 5000 ? "右側から強く当たっています" : "全体に柔らかく回っています");
  
  lightStats={ready:true, direction:dir, brightness:avg};
  updateCoaching();
}

function drawARGuide(){
  const canvas=$("arCanvas");
  const ctx=canvas.getContext("2d");
  if(canvas.width!==window.innerWidth || canvas.height!==window.innerHeight){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
  }
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(heading==null) return;

  // 簡易的なAR方向ガイド（画面中央に優しく光るガイドを表示）
  ctx.save();
  ctx.strokeStyle="rgba(0, 232, 135, 0.6)";
  ctx.fillStyle="rgba(0, 232, 135, 0.15)";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(canvas.width/2, canvas.height/2 - 40, 30, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

async function handleAction(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    $("camera").srcObject=stream;
    $("fallback").style.display="none";
  }catch(e){
    alert("カメラを起動できませんでした。");
    return;
  }

  try{
    if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
      await DeviceOrientationEvent.requestPermission();
    }
  }catch(e){}

  window.addEventListener("deviceorientationabsolute",orientation,true);
  window.addEventListener("deviceorientation",orientation,true);

  setupLightAnalysis();
  $("permission").style.display="none";
}

function orientation(e){
  let h = e.webkitCompassHeading!=null ? e.webkitCompassHeading : (e.absolute && e.alpha!=null ? (360-e.alpha)%360 : null);
  if(h!=null && isFinite(h)) heading=h;
}

function updateCoaching(){
  const now=new Date();
  $("clock").textContent=now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  
  let title="✨ 綺麗な光のポジションです", reason="被写体に立体感が出る理想的なライティングです。", tip="このままの角度でシャッターを切ってみましょう！";
  
  if(lightStats.brightness < 45){
    title="🌙 少し光が足りません";
    reason="まわりが暗いため、手ブレしやすくなっています。";
    tip="💡 コーチ：できるだけ窓際や明るい光源の方へ一歩移動しましょう";
  } else if(lightStats.brightness > 200){
    title="☀️ 光が強すぎて眩しい状態です";
    reason="ハイライトが白飛びしてディテールが消えかけています。";
    tip="💡 コーチ：少しアングルを斜め下に傾けて調整してみましょう";
  } else {
    title="📸 立体的で美しい光です";
    reason=`光が${lightStats.direction}。被写体の質感が一番引き立つ状態です。`;
    tip="💡 コーチ：被写体との距離を少し変えて表情をアップにしてみましょう";
  }

  $("type").textContent=title;
  $("reason").textContent=reason;
  $("actionTip").textContent=tip;
  
  $("lightDirection").textContent=lightStats.direction;
  $("composition").textContent=lightStats.brightness < 45 ? "明るい場所へ移動" : "正面から少しずらす";
  $("lens").textContent="標準 (35mm〜50mm)";
  
  drawARGuide();
}

$("more").onclick=()=>{$("panel").style.display=$("panel").style.display==="block"?"none":"block"};
$("startBtn").onclick=handleAction;
setInterval(()=>{ if($("permission").style.display==="none") analyzeFrameLight(); }, 1000);
</script>
</body>
</html>
