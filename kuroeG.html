<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>黒衣モード - プロ・ライティング・ナビ v4</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",monospace}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#111}
#fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#151515;color:#777;font-size:14px;z-index:0}

/* 上部統合コントロール */
#topIsland{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;z-index:10;display:none;justify-content:space-between;align-items:center;pointer-events:auto}
.island-group{display:flex;gap:6px}
button{background:rgba(20,20,20,0.85);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:8px 12px;border-radius:16px;font-size:11px;font-weight:700;cursor:pointer;backdrop-filter:blur(12px);transition:all 0.2s}
button:active{transform:scale(0.95)}
button.primary{background:#00e887;color:#000;border:none}
button.active{background:#ff3b30;color:#fff;border:none}

/* 下部統合ダッシュボード */
#dashboard{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:16px;width:calc(100% - 32px);max-width:340px;background:rgba(12,12,12,0.85);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.15);border-radius:18px;padding:14px;pointer-events:auto;z-index:5;display:none;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.dash-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dash-val{font-size:18px;color:#00e887;font-weight:bold;font-family:monospace}
.dash-label{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px}

/* ガイドエリア */
#targetGuide{background:rgba(0,232,135,0.1);border-left:3px solid #00e887;padding:6px 10px;border-radius:0 8px 8px 0;font-size:11px;color:#ddd;margin-bottom:10px;font-family:monospace;display:none;line-height:1.4}

/* 輝度分布マップ */
#distMap{width:100%;height:50px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px 6px 4px 6px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.bar-col{width:18%;background:rgba(255,255,255,0.08);border-radius:2px 2px 0 0;height:100%;display:flex;align-items:flex-end;overflow:hidden}
.bar-fill{width:100%;background:#00e887;height:0%;transition:height 0.1s linear}
.db-label{position:absolute;top:2px;font-size:8px;font-weight:bold;color:#aaa}
#labelD{left:8px}
#labelB{right:8px}

/* 中央ターゲット（状態によって色が変化） */
#reticle{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%);width:55px;height:55px;border:2px solid #00e887;border-radius:50%;z-index:4;pointer-events:none;display:none;box-shadow:0 0 15px rgba(0,232,135,0.3);transition:border-color 0.3s, box-shadow 0.3s}
#reticle.matched{border-color:#00e887;box-shadow:0 0 20px #00e887}
#reticle.mismatched{border-color:#ff9500;box-shadow:0 0 15px rgba(255,149,0,0.4)}

/* リスト・モーダル */
#favModal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px}
.fav-modal-card{width:min(360px,100%);background:#151515;border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:20px;max-height:80vh;display:flex;flex-direction:column}
.fav-list{overflow-y:auto;flex:1;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.fav-item{background:rgba(255,255,255,0.08);padding:10px;border-radius:10px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}

/* 起動許可モーダル */
#permission{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.95);backdrop-filter:blur(16px)}
.permission-card{width:min(380px,100%);background:rgba(18,18,18,0.98);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;text-align:center}
.permission-title{font-size:18px;font-weight:700;margin-bottom:8px}
.permission-text{font-size:12px;line-height:1.6;color:#aaa;margin-bottom:20px}
#startBtn{width:100%;background:#fff;color:#000;border:none;border-radius:14px;padding:14px;font-weight:700;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div id="fallback">カメラ待機中…</div>
<video id="camera" autoplay playsinline muted></video>

<div id="reticle"></div>

<div id="topIsland">
  <button id="saveFavBtn" class="primary">★ Fav保存</button>
  <div class="island-group">
    <button id="lockAeBtn">AE固定: OFF</button>
    <button id="loadFavBtn">一覧</button>
    <button id="modeBtn">フル</button>
  </div>
</div>

<div id="dashboard">
  <div id="targetGuide">TARGET: 未選択</div>
  
  <div class="dash-row">
    <div>
      <div class="dash-label">Center Luminance</div>
      <div id="valL" class="dash-val">0</div>
    </div>
    <div style="text-align:right">
      <div class="dash-label">Contrast Range</div>
      <div id="valC" class="dash-val">0</div>
    </div>
  </div>

  <div id="distMap">
    <span class="db-label" id="labelD">D</span>
    <span class="db-label" id="labelB">B</span>
    <div class="bar-col"><div class="bar-fill" id="b0"></div></div>
    <div class="bar-col"><div class="bar-fill" id="b1"></div></div>
    <div class="bar-col"><div class="bar-fill" id="b2"></div></div>
    <div class="bar-col"><div class="bar-fill" id="b3"></div></div>
    <div class="bar-col"><div class="bar-fill" id="b4"></div></div>
  </div>
</div>

<div id="favModal">
  <div class="fav-modal-card">
    <div style="font-weight:bold;font-size:14px">お気に入りライティング一覧</div>
    <div class="fav-list" id="favListContainer"></div>
    <button id="closeModalBtn" style="background:#333;border:none;padding:10px;border-radius:10px;color:#fff;cursor:pointer">閉じる</button>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div class="permission-title">プロ・ライティング・ナビ v4</div>
    <div class="permission-text">正確なライティング比較のため、AE固定機能を搭載しました。</div>
    <button id="startBtn">計測を始める</button>
  </div>
</div>

<script>
const video = document.getElementById('camera');
const topIsland = document.getElementById('topIsland');
const dashboard = document.getElementById('dashboard');
const reticle = document.getElementById('reticle');
const permission = document.getElementById('permission');
const favModal = document.getElementById('favModal');
const targetGuide = document.getElementById('targetGuide');
const lockAeBtn = document.getElementById('lockAeBtn');

let uiMode = 0; 
let canvas = document.createElement('canvas');
let ctx = canvas.getContext('2d', {willReadFrequently: true});
let favorites = JSON.parse(localStorage.getItem('kuroko_favs_v4') || '[]');
let activeTarget = null;
let isAeLocked = false;
let videoTrack = null;

let currentLum = 0;
let currentCon = 0;

async function startApp() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    videoTrack = stream.getVideoTracks()[0];
    
    permission.style.display = 'none';
    document.getElementById('fallback').style.display = 'none';
    topIsland.style.display = 'flex';
    dashboard.style.display = 'block';
    reticle.style.display = 'block';

    await video.play().catch(()=>{});
    requestAnimationFrame(loop);
  } catch (err) {
    alert("起動失敗: " + err.message);
  }
}

function loop() {
  // バグ対策：ビデオの準備が整っていない場合はスキップ
  if(!video.videoWidth || !video.videoHeight) {
    requestAnimationFrame(loop);
    return;
  }
  
  canvas.width = 160; 
  canvas.height = 90;
  ctx.drawImage(video, 0, 0, 160, 90);
  
  // 中央20x20の輝度・コントラスト計算
  const centerData = ctx.getImageData(70, 35, 20, 20).data;
  let sum=0, min=255, max=0;
  for(let i=0; i<centerData.length; i+=4){
    const v = (centerData[i] * 0.2126 + centerData[i+1] * 0.7152 + centerData[i+2] * 0.0722);
    sum += v; 
    if(v < min) min = v; 
    if(v > max) max = v;
  }
  currentLum = Math.round(sum / 400);
  currentCon = Math.round(max - min);
  
  document.getElementById('valL').textContent = currentLum;
  document.getElementById('valC').textContent = currentCon;

  // 輝度分布ヒストグラム
  const fullData = ctx.getImageData(0, 0, 160, 90).data;
  const bins = [0, 0, 0, 0, 0];
  let totalPixels = fullData.length / 4;

  for(let i=0; i<fullData.length; i+=4){
    const v = (fullData[i] * 0.2126 + fullData[i+1] * 0.7152 + fullData[i+2] * 0.0722);
    if(v < 51) bins[0]++;
    else if(v < 102) bins[1]++;
    else if(v < 153) bins[2]++;
    else if(v < 204) bins[3]++;
    else bins[4]++;
  }

  for(let b=0; b<5; b++){
    const ratio = Math.min(100, Math.round((bins[b] / totalPixels) * 300));
    document.getElementById(`b${b}`).style.height = ratio + '%';
  }

  // 描画ループ内でターゲットガイドとレティクル色を更新（競合バグの防止）
  updateTargetStatus();
  
  requestAnimationFrame(loop);
}

function updateTargetStatus(){
  if(!activeTarget || uiMode === 2){
    targetGuide.style.display = 'none';
    reticle.className = '';
    return;
  }
  
  targetGuide.style.display = 'block';
  const diffL = currentLum - activeTarget.lum;
  const diffC = currentCon - activeTarget.con;
  
  let actionL = diffL > 15 ? "➔ 光量を下げる / 距離を離す" : diffL < -15 ? "➔ 光量を上げる / 距離を寄せる" : "➔ 照度バッチリ";
  let actionC = diffC > 15 ? "➔ ディフューザーで光を和らげる" : diffC < -15 ? "➔ カポック等で影（D）を絞る" : "➔ 質感バッチリ";

  targetGuide.innerHTML = `<b>[${activeTarget.name}]</b><br>照度: ${actionL}<br>質感: ${actionC}`;

  // 目標とのズレが少ない場合はレティクルを緑に固定、ズレが大きい場合はオレンジに変化
  if(Math.abs(diffL) <= 15 && Math.abs(diffC) <= 15){
    reticle.className = 'matched';
  } else {
    reticle.className = 'mismatched';
  }
}

// AE（露出）ロック機能（WebAPIサポート機種のみ、または疑似固定）
lockAeBtn.onclick = async () => {
  if(!videoTrack) return;
  const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
  
  if (capabilities.exposureMode && capabilities.exposureMode.includes('manual')) {
    try {
      isAeLocked = !isAeLocked;
      await videoTrack.applyConstraints({
        advanced: [{ exposureMode: isAeLocked ? 'manual' : 'continuous' }]
      });
      lockAeBtn.textContent = isAeLocked ? "AE固定: ON" : "AE固定: OFF";
      lockAeBtn.className = isAeLocked ? "active" : "";
    } catch(e) {
      alert("お使いのブラウザは完全な露出固定に対応していません");
    }
  } else {
    alert("この端末・ブラウザではハードウェア露出固定がサポートされていません。周囲の明るさを固定して計測してください。");
  }
};

document.getElementById('saveFavBtn').onclick = () => {
  const name = prompt("シチュエーション名を入力してください", "マイライト " + (favorites.length + 1));
  if(!name) return;
  
  const newFav = { id: Date.now(), name: name, lum: currentLum, con: currentCon };
  favorites.push(newFav);
  localStorage.setItem('kuroko_favs_v4', JSON.stringify(favorites));
  
  activeTarget = newFav;
  alert("ターゲットとして保存しました！");
};

document.getElementById('loadFavBtn').onclick = () => {
  const container = document.getElementById('favListContainer');
  container.innerHTML = '';
  
  if(favorites.length === 0){
    container.innerHTML = '<div style="color:#777;text-align:center;padding:20px">保存された光がありません</div>';
  } else {
    favorites.forEach(fav => {
      const div = document.createElement('div');
      div.className = 'fav-item';
      div.innerHTML = `<span><b>${fav.name}</b><br><small style="color:#aaa">L:${fav.lum} / C:${fav.con}</small></span>`;
      div.onclick = () => {
        activeTarget = fav;
        favModal.style.display = 'none';
      };
      container.appendChild(div);
    });
  }
  favModal.style.display = 'flex';
};

document.getElementById('closeModalBtn').onclick = () => favModal.style.display = 'none';

document.getElementById('modeBtn').onclick = () => {
  uiMode = (uiMode + 1) % 3;
  const modeBtn = document.getElementById('modeBtn');

  if(uiMode === 0){
    dashboard.style.display = 'block';
    reticle.style.display = 'block';
    modeBtn.textContent = "フル";
  } else if(uiMode === 1){
    dashboard.style.display = 'none';
    reticle.style.display = 'block';
    modeBtn.textContent = "ミニマル";
  } else {
    dashboard.style.display = 'none';
    reticle.style.display = 'none';
    modeBtn.textContent = "OFF";
  }
};

document.getElementById('startBtn').onclick = startApp;
</script>
</body>
</html>
