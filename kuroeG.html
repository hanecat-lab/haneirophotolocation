<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>プロ・ライティング・ナビ v31-Complete</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",monospace}

#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#overlayCanvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none;opacity:0.85;display:none;filter:blur(10px)}

/* UIレイヤー */
.ui-layer{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)) 12px}
.interactive{pointer-events:auto}

/* ヘッダー・トップバー */
.top-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{background:rgba(20,20,20,0.85);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:6px 10px;border-radius:14px;font-size:10px;font-weight:700;cursor:pointer;backdrop-filter:blur(12px);touch-action:auto}
button.active{background:#00e887;color:#000;border:none}
button.primary{background:#00e887;color:#000;border:none;font-weight:800}

/* 可動パネル（アコーディオン：邪魔なら隠せる） */
#controlPanel{background:rgba(18,18,18,0.92);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:12px;margin-top:8px;width:min(340px,100%);backdrop-filter:blur(16px);max-height:60vh;overflow-y:auto}
.panel-header{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:bold;margin-bottom:8px;cursor:pointer}
.panel-section{border-top:1px solid rgba(255,255,255,0.1);padding-top:8px;margin-top:8px}

/* 色の説明バッジ */
.color-guide{display:flex;gap:12px;font-size:9px;color:#aaa;margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* ボトムエリア */
.bottom-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
#navBadge{background:rgba(0,0,0,0.85);border:1px solid rgba(0,232,135,0.6);color:#00e887;padding:10px 14px;border-radius:16px;font-size:11px;font-weight:bold;flex:1;box-shadow:0 4px 16px rgba(0,0,0,0.5)}
#thumbCard{width:65px;height:85px;border-radius:12px;border:2px solid #00e887;overflow:hidden;background:#111;flex-shrink:0}
#thumbImg{width:100%;height:100%;object-fit:cover}

#permission{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.95)}
.permission-card{width:min(380px,100%);background:#121212;border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;text-align:center}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="overlayCanvas"></canvas>

<div class="ui-layer" id="uiLayer">
  <div>
    <!-- トップ固定バー -->
    <div class="top-bar interactive">
      <button class="primary" onclick="document.getElementById('fileInput').click()">📷 写真読込</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
      
      <button id="btnPin" onclick="togglePin()">固定: OFF</button>
      <button id="btnGhost" onclick="toggleGhost()">ゴースト</button>
      <button id="btnTogglePanel" onclick="toggleControlPanel()">⚙️ 設定パネル</button>

      <div style="display:flex;gap:3px;margin-left:auto">
        <button id="btnModeExp" class="active" onclick="setMode('exp')">EV</button>
        <button id="btnModeCol" onclick="setMode('col')">WB</button>
      </div>
    </div>

    <!-- 隠せる高度設定パネル -->
    <div id="controlPanel" class="interactive" style="display:none">
      <div class="panel-header" onclick="toggleControlPanel()">
        <span>📐 ライティング＆解析設定 (ROI / 多灯)</span>
        <span id="panelArrow">▲ 隠す</span>
      </div>

      <!-- EV / WB 色説明 -->
      <div class="color-guide">
        <span><span class="dot" style="background:#ff7800"></span>オレンジ: 光過剰</span>
        <span><span class="dot" style="background:#0064ff"></span>ネイビー: 光不足</span>
        <span><span class="dot" style="background:#ffb400"></span>アンバー: 温かすぎ</span>
        <span><span class="dot" style="background:#00dcff"></span>シアン: 冷たすぎ</span>
      </div>

      <!-- 1. 太陽シミュレーター -->
      <div class="panel-section">
        <div style="font-size:10px;color:#00e887;font-weight:bold">☀️ 太陽シミュレーター</div>
        <input type="range" min="6" max="18" value="12" style="width:100%" oninput="document.getElementById('sunVal').textContent=this.value+':00'">
        <div style="font-size:9px;color:#888;text-align:right" id="sunVal">12:00</div>
      </div>

      <!-- 2. 多灯ストロボ設定 -->
      <div class="panel-section">
        <div style="font-size:10px;color:#00e887;font-weight:bold">⚡ ストロボ設定 ＆ 照射方向</div>
        <div style="font-size:9px;margin-top:4px">A灯(メイン): <button onclick="setFlash('A', '1/4')">1/4</button> <button class="active" onclick="setFlash('A', '1/64')">1/64</button></div>
        <div style="font-size:9px;margin-top:4px">B灯(サブ): <button onclick="setFlash('B', 'OFF')">OFF</button> <button class="active" onclick="setFlash('B', '1/32')">1/32</button></div>
      </div>

      <!-- 3. 明暗比解析 -->
      <div class="panel-section">
        <div style="font-size:10px;color:#aaa">被写体明暗比: <span id="ratioVal" style="color:#fff;font-weight:bold">1 : 10.4</span></div>
        <div style="font-size:9px;color:#00e887">評価: ドラマチック（1:5以上）</div>
      </div>
    </div>
  </div>

  <!-- ボトム固定バー -->
  <div class="bottom-bar">
    <div id="navBadge" class="interactive">長押しで「光のズレ」オーバーレイ表示（WタップでUI非表示）</div>
    <div id="thumbCard" class="interactive">
      <img id="thumbImg" src="" style="display:none">
    </div>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">プロ・ライティング・ナビ v31</div>
    <div style="font-size:12px;color:#aaa;margin-bottom:20px">高度パネル統合 ＆ UI格納機能</div>
    <button id="startBtn" class="primary" style="width:100%;padding:14px;border-radius:14px;font-weight:bold">利用を開始</button>
  </div>
</div>

<script>
const video = document.getElementById('camera');
const overlay = document.getElementById('overlayCanvas');
const oCtx = overlay.getContext('2d', {willReadFrequently: true});

const GW = 32, GH = 24;
const refCanvas = document.createElement('canvas'); refCanvas.width = GW; refCanvas.height = GH;
const rCtx = refCanvas.getContext('2d', {willReadFrequently: true});
const curCanvas = document.createElement('canvas'); curCanvas.width = GW; curCanvas.height = GH;
const cCtx = curCanvas.getContext('2d', {willReadFrequently: true});

let loadedImg = null;
let isPressing = false;
let currentMode = 'exp';
let panelOpen = false;
let uiVisible = true;

/* --- UI隠し・折りたたみコントロール --- */
function toggleControlPanel() {
  panelOpen = !panelOpen;
  document.getElementById('controlPanel').style.display = panelOpen ? 'block' : 'none';
  document.getElementById('panelArrow').textContent = panelOpen ? '▲ 隠す' : '▼ 展開';
}

// 画面ダブルタップでUI全体を消す/出す
window.addEventListener('dblclick', () => {
  uiVisible = !uiVisible;
  document.getElementById('uiLayer').style.opacity = uiVisible ? '1' : '0';
});

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnModeExp').classList.toggle('active', mode === 'exp');
  document.getElementById('btnModeCol').classList.toggle('active', mode === 'col');
}

/* --- 長押しチラ見UI --- */
window.addEventListener('pointerdown', (e) => {
  if(!loadedImg) return;
  if(!e.target.closest('.interactive')) {
    isPressing = true;
    overlay.style.display = 'block';
  }
});
window.addEventListener('pointerup', () => { isPressing = false; overlay.style.display = 'none'; });

function loadImage(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const img = new Image();
    img.onload = () => {
      loadedImg = img;
      document.getElementById('thumbImg').src = evt.target.result;
      document.getElementById('thumbImg').style.display = 'block';
      rCtx.drawImage(loadedImg, 0, 0, GW, GH);
      document.getElementById('navBadge').textContent = "長押し中：光・色のズレをチラ見可視化";
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

async function startApp() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
  } catch(e) { alert("カメラエラー: " + e.message); }
  
  document.getElementById('permission').style.display = 'none';
  overlay.width = window.innerWidth;
  overlay.height = window.innerHeight;
  requestAnimationFrame(loop);
}

function loop() {
  if (isPressing && loadedImg && video.videoWidth) {
    cCtx.drawImage(video, 0, 0, GW, GH);
    const refData = rCtx.getImageData(0, 0, GW, GH).data;
    const curData = cCtx.getImageData(0, 0, GW, GH).data;
    const diffImg = oCtx.createImageData(GW, GH);
    const d = diffImg.data;

    let totalLumDiff = 0, totalColorDiff = 0, count = 0;

    for (let i = 0; i < refData.length; i += 4) {
      const rL = refData[i] * 0.2126 + refData[i+1] * 0.7152 + refData[i+2] * 0.0722;
      const cL = curData[i] * 0.2126 + curData[i+1] * 0.7152 + curData[i+2] * 0.0722;
      const lumDiff = cL - rL;
      totalLumDiff += lumDiff;

      const colorDiff = (curData[i] - curData[i+2]) - (refData[i] - refData[i+2]);
      totalColorDiff += colorDiff;
      count++;

      if (currentMode === 'exp') {
        if (lumDiff > 25) { d[i]=255; d[i+1]=120; d[i+2]=0; d[i+3]=180; } // オレンジ（過剰）
        else if (lumDiff < -25) { d[i]=0; d[i+1]=100; d[i+2]=255; d[i+3]=180; } // ネイビー（不足）
        else { d[i]=0; d[i+1]=232; d[i+2]=135; d[i+3]=20; }
      } else {
        if (colorDiff > 20) { d[i]=255; d[i+1]=180; d[i+2]=0; d[i+3]=180; } // アンバー（温）
        else if (colorDiff < -20) { d[i]=0; d[i+1]=220; d[i+2]=255; d[i+3]=180; } // シアン（冷）
        else { d[i]=0; d[i+1]=232; d[i+2]=135; d[i+3]=20; }
      }
    }

    const avgLum = totalLumDiff / count;
    const avgCol = totalColorDiff / count;
    let actionText = "";

    if (currentMode === 'exp') {
      if (avgLum < -20) actionText = "⚠️ メイン光不足 ➔ 光量を上げるか近付けてください";
      else if (avgLum > 20) actionText = "⚠️ 光量過剰 ➔ 光量を下げるか離してください";
      else actionText = "✨ 光量はほぼ一致しています！";
    } else {
      if (avgCol < -15) actionText = "⚠️ 冷たすぎ（シアン寄り） ➔ 色温度を上げてください";
      else if (avgCol > 15) actionText = "⚠️ 温かすぎ（アンバー寄り） ➔ 色温度を下げてください";
      else actionText = "✨ 色調（WB）はほぼ一致しています！";
    }
    document.getElementById('navBadge').textContent = actionText;

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = GW; tempCanvas.height = GH;
    tempCanvas.getContext('2d').putImageData(diffImg, 0, 0);

    oCtx.clearRect(0, 0, overlay.width, overlay.height);
    oCtx.drawImage(tempCanvas, 0, 0, overlay.width, overlay.height);
  }
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick = startApp;
</script>
</body>
</html>
