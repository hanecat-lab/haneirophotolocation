<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>プロ・ライティング・ナビ v26</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",monospace}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#111;transition:transform 0.3s ease}
#camera.mirror{transform:scaleX(-1)}
#ghostCanvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none;opacity:0.4;display:none}

/* ターゲット枠 (ROI) */
#roiBox{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px;border:2px dashed rgba(0,232,135,0.8);border-radius:16px;z-index:8;cursor:move;box-shadow:0 0 0 9999px rgba(0,0,0,0.35)}
#roiLabel{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:10px;color:#00e887;font-weight:bold;white-space:nowrap;background:rgba(0,0,0,0.8);padding:2px 8px;border-radius:8px;pointer-events:none}

.spot-pin{position:fixed;width:32px;height:32px;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%);z-index:4;pointer-events:none;display:none;font-size:10px;font-weight:bold;text-align:center;line-height:28px;box-shadow:0 0 10px rgba(0,0,0,0.8);transition:opacity 0.2s}
#pinKey{border-color:#00e887;background:rgba(0,232,135,0.4);color:#00e887}
#pinShadow{border-color:#ff3b30;background:rgba(255,59,48,0.4);color:#ff3b30}

#autoStatus{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);border:1px solid #00e887;color:#00e887;padding:5px 14px;border-radius:20px;font-size:10px;font-weight:bold;z-index:12;display:none;pointer-events:none;white-space:nowrap}

#topIsland{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;z-index:10;display:none;justify-content:space-between;align-items:center}
.island-group{display:flex;gap:6px}
button{background:rgba(20,20,20,0.85);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:8px 12px;border-radius:16px;font-size:11px;font-weight:700;cursor:pointer;backdrop-filter:blur(12px);touch-action:auto}
button.primary{background:#00e887;color:#000;border:none}

#dashboard{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:16px;width:calc(100% - 32px);max-width:340px;background:rgba(12,12,12,0.88);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.15);border-radius:18px;padding:12px;z-index:10;display:none;max-height:60vh;overflow-y:auto;touch-action:pan-y}

.section-panel{background:rgba(255,255,255,0.05);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.panel-title{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:bold;cursor:pointer}

.slider-container{display:flex;align-items:center;gap:8px;margin-top:6px}
input[type=range]{flex:1;-webkit-appearance:none;background:#333;height:4px;border-radius:2px;outline:none;touch-action:auto}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#00e887;cursor:pointer}

.accordion-body{display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.1)}

.strobe-row{display:flex;flex-direction:column;gap:4px;margin-top:6px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.08)}
.strobe-row:last-child{border-bottom:none;padding-bottom:0}
.strobe-hdr{display:flex;justify-content:space-between;align-items:center;font-size:10px}
.chip-group{display:flex;gap:3px;overflow-x:auto}
.chip{padding:3px 6px;background:rgba(255,255,255,0.1);border-radius:6px;font-size:9px;cursor:pointer;border:1px solid transparent;white-space:nowrap;touch-action:auto}
.chip.active{background:#00e887;color:#000;font-weight:bold}

.dash-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.dash-val{font-size:16px;color:#00e887;font-weight:bold;font-family:monospace}
.dash-label{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px}

#ratioGuide{background:rgba(0,232,135,0.1);border-left:3px solid #00e887;padding:6px 10px;border-radius:0 8px 8px 0;font-size:10px;color:#ddd;margin-top:6px;font-family:monospace}

#permission{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.95)}
.permission-card{width:min(380px,100%);background:#121212;border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;text-align:center}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="ghostCanvas"></canvas>

<div id="roiBox">
  <div id="roiLabel">ドラッグで枠移動</div>
</div>

<div id="autoStatus">🎯 枠内高精度トラッキング</div>

<div id="pinKey" class="spot-pin">K</div>
<div id="pinShadow" class="spot-pin">S</div>

<div id="topIsland">
  <button id="lockToggleBtn" class="primary" onclick="toggleLock()">🔒 固定</button>
  <div class="island-group">
    <button id="pinToggleBtn" onclick="togglePinVisibility()">ピン: ON</button>
    <button id="cameraFlipBtn" onclick="flipCamera()">📷 転換</button>
    <button id="ghostToggleBtn" onclick="toggleGhost()">ゴースト</button>
  </div>
</div>

<div id="dashboard">
  <!-- 📐 解析枠調整 -->
  <div class="section-panel">
    <div class="panel-title" onclick="toggleAccordion('roiBody', 'roiToggleIcon')">
      <span>📐 解析枠（ROI）の調整</span>
      <span id="roiToggleIcon" style="font-size:10px;color:#00e887">展開▼</span>
    </div>
    <div id="roiBody" class="accordion-body">
      <div style="font-size:9px;color:#aaa">枠の大きさ</div>
      <div class="slider-container">
        <span style="font-size:8px;color:#888">小</span>
        <input type="range" id="roiSizeSlider" min="120" max="320" step="10" value="200" oninput="updateRoiSize(this.value)">
        <span style="font-size:8px;color:#888">大</span>
      </div>
      <button onclick="resetRoi()" style="width:100%;margin-top:6px;padding:4px;font-size:10px">位置・サイズをリセット</button>
    </div>
  </div>

  <!-- ☀️ 太陽シミュレーター -->
  <div class="section-panel">
    <div class="panel-title" onclick="toggleAccordion('sunBody', 'sunToggleIcon')">
      <span>☀️ 太陽シミュレーター</span>
      <div>
        <span id="simTimeLabel" style="color:#ffcc00;margin-right:6px">12:00</span>
        <span id="sunToggleIcon" style="font-size:10px;color:#00e887">展開▼</span>
      </div>
    </div>
    <div id="sunBody" class="accordion-body">
      <div class="slider-container">
        <span style="font-size:8px;color:#888">6時</span>
        <input type="range" id="timeSlider" min="6" max="18" step="0.5" value="12" oninput="onSunTimeChange(this.value)">
        <span style="font-size:8px;color:#888">18時</span>
      </div>
      <div id="sunInfoText" style="font-size:9px;color:#aaa;margin-top:4px">太陽高度: 90° (南中)</div>
    </div>
  </div>

  <!-- ⚡ ストロボ設定 -->
  <div class="section-panel">
    <div class="panel-title" onclick="toggleAccordion('strobeBody', 'strobeToggleIcon')">
      <span>⚡ ストロボ設定 & 照射方向</span>
      <span id="strobeToggleIcon" style="font-size:10px;color:#00e887">展開▼</span>
    </div>

    <div id="strobeBody" class="accordion-body">
      <div class="strobe-row">
        <div class="strobe-hdr">
          <span style="color:#00e887;font-weight:bold">A灯(メイン)</span>
        </div>
        <div class="strobe-hdr" style="margin-top:2px">
          <span id="strobeA_summary" style="color:#aaa;font-size:9px">出力: 1/4 | 10時(斜前)</span>
        </div>
        <div class="chip-group">
          <div class="chip" onclick="setStrobe('A','power','1/1',this, 1.0)">1/1</div>
          <div class="chip active" onclick="setStrobe('A','power','1/4',this, 0.25)">1/4</div>
          <div class="chip" onclick="setStrobe('A','power','1/16',this, 0.0625)">1/16</div>
          <div class="chip" onclick="setStrobe('A','power','1/64',this, 0.0156)">1/64</div>
        </div>
      </div>

      <div class="strobe-row">
        <div class="strobe-hdr">
          <span style="color:#ff9500;font-weight:bold">B灯(サブ)</span>
        </div>
        <div class="strobe-hdr" style="margin-top:2px">
          <span id="strobeB_summary" style="color:#aaa;font-size:9px">出力: 1/16 | 2時(斜前)</span>
        </div>
        <div class="chip-group">
          <div class="chip" onclick="setStrobe('B','power','OFF',this, 0.0)">OFF</div>
          <div class="chip" onclick="setStrobe('B','power','1/4',this, 0.25)">1/4</div>
          <div class="chip active" onclick="setStrobe('B','power','1/16',this, 0.0625)">1/16</div>
          <div class="chip" onclick="setStrobe('B','power','1/64',this, 0.0156)">1/64</div>
        </div>
      </div>
    </div>
  </div>

  <div class="dash-row">
    <div>
      <div class="dash-label">被写体明暗比</div>
      <div id="valRatio" class="dash-val">1 : ---</div>
    </div>
    <div style="text-align:right">
      <div class="dash-label">ライティング評価</div>
      <div id="spotModeText" style="font-size:10px;color:#00e887">解析中</div>
    </div>
  </div>

  <div id="ratioGuide">解析中...</div>
</div>

<div id="permission">
  <div class="permission-card">
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">プロ・ライティング・ナビ v26</div>
    <div style="font-size:12px;color:#aaa;margin-bottom:20px">ストロボ数値・太陽シミュレーター連動修正版</div>
    <button id="startBtn" class="primary" style="width:100%;padding:14px;border-radius:14px;font-weight:bold">利用を開始</button>
  </div>
</div>

<script>
const video = document.getElementById('camera');
const pinKey = document.getElementById('pinKey');
const pinShadow = document.getElementById('pinShadow');
const roiBox = document.getElementById('roiBox');
const timeSlider = document.getElementById('timeSlider');
const autoStatus = document.getElementById('autoStatus');

let canvas = document.createElement('canvas');
let ctx = canvas.getContext('2d', {willReadFrequently: true});

let isLocked = false;
let isGhostOn = false;
let isPinsVisible = true;
let currentFacingMode = 'environment';
let currentStream = null;

// 計算用数値保持（A灯・B灯の出力値、太陽高度影響度）
let strobeValA = 0.25;
let strobeValB = 0.0625;
let sunFactor = 1.0; // 太陽による補助係数

let strobeState = {
  A: { power: '1/4', dir: '10時(斜前)' },
  B: { power: '1/16', dir: '2時(斜前)' }
};

let curKx = 0, curKy = 0, curSx = 0, curSy = 0;
let targetKx = 0, targetKy = 0, targetSx = 0, targetSy = 0;
let smoothRatio = 1;

/* --- ROIドラッグ操作 --- */
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let roiPosX = window.innerWidth / 2;
let roiPosY = window.innerHeight * 0.4;

roiBox.addEventListener('pointerdown', (e) => {
  isDragging = true;
  dragStartX = e.clientX - roiPosX;
  dragStartY = e.clientY - roiPosY;
  roiBox.setPointerCapture(e.pointerId);
});

roiBox.addEventListener('pointermove', (e) => {
  if(!isDragging) return;
  roiPosX = e.clientX - dragStartX;
  roiPosY = e.clientY - dragStartY;
  roiBox.style.left = roiPosX + 'px';
  roiBox.style.top = roiPosY + 'px';
});

roiBox.addEventListener('pointerup', (e) => {
  isDragging = false;
  try{ roiBox.releasePointerCapture(e.pointerId); }catch(err){}
});

function updateRoiSize(val) {
  roiBox.style.width = val + 'px';
  roiBox.style.height = val + 'px';
}

function resetRoi() {
  roiPosX = window.innerWidth / 2;
  roiPosY = window.innerHeight * 0.4;
  roiBox.style.left = roiPosX + 'px';
  roiBox.style.top = roiPosY + 'px';
  roiBox.style.width = '200px';
  roiBox.style.height = '200px';
  document.getElementById('roiSizeSlider').value = 200;
}

function toggleAccordion(bodyId, iconId) {
  const body = document.getElementById(bodyId);
  const icon = document.getElementById(iconId);
  const isOpen = body.style.display === 'block';
  body.style.display = isOpen ? 'none' : 'block';
  icon.textContent = isOpen ? '展開▼' : '閉じる▲';
}

function togglePinVisibility() {
  isPinsVisible = !isPinsVisible;
  const btn = document.getElementById('pinToggleBtn');
  btn.textContent = isPinsVisible ? "ピン: ON" : "ピン: OFF";
  const displayStyle = isPinsVisible ? 'block' : 'none';
  pinKey.style.display = displayStyle;
  pinShadow.style.display = displayStyle;
}

async function flipCamera() {
  currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
  if (currentFacingMode === 'user') {
    video.classList.add('mirror');
  } else {
    video.classList.remove('mirror');
  }
  await initCamera();
}

function onSunTimeChange(val) {
  const hour = parseFloat(val);
  const hStr = Math.floor(hour).toString().padStart(2, '0');
  const mStr = (hour % 1 === 0 ? '00' : '30');
  document.getElementById('simTimeLabel').textContent = `${hStr}:${mStr}`;
  
  const alt = Math.round(Math.sin((hour - 6) / 12 * Math.PI) * 90);
  document.getElementById('sunInfoText').textContent = `太陽高度: ${alt > 0 ? alt + '°' : '地平線下'}`;

  // 太陽高度に基づく補正係数（夜間・日没時は影が強くなる）
  sunFactor = alt > 0 ? Math.max(0.2, Math.sin((hour - 6) / 12 * Math.PI)) : 0.1;
}

function setStrobe(light, prop, valStr, el, numVal) {
  strobeState[light][prop] = valStr;
  if(light === 'A') strobeValA = numVal;
  if(light === 'B') strobeValB = numVal;

  if(el) {
    const parent = el.parentElement;
    parent.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }
  document.getElementById(`strobe${light}_summary`).textContent = 
    `出力: ${strobeState[light].power} | ${strobeState[light].dir}`;
}

function updateEvaluation(ratio) {
  const modeText = document.getElementById('spotModeText');
  const guide = document.getElementById('ratioGuide');
  
  if (isLocked) {
    modeText.textContent = "固定中";
    modeText.style.color = "#ffcc00";
    return;
  }

  if (ratio < 2.0) {
    modeText.textContent = "フラット(1:2未満)";
    modeText.style.color = "#00e887";
    guide.textContent = "影が非常に浅くナチュラル。ビューティー・商品撮影向き。";
  } else if (ratio <= 4.5) {
    modeText.textContent = "標準ポートレート(1:3〜1:4)";
    modeText.style.color = "#00e887";
    guide.textContent = "立体感と階調のバランスが良い王道のライティング。";
  } else {
    modeText.textContent = "ドラマチック(1:5以上)";
    modeText.style.color = "#ff9500";
    guide.textContent = "陰影が強くシネマティック。影側のディテール損失に注意。";
  }
}

function toggleLock() {
  isLocked = !isLocked;
  const btn = document.getElementById('lockToggleBtn');
  if(isLocked) {
    btn.textContent = "🔓 解除";
    btn.className = "";
    autoStatus.textContent = "🔒 位置・数値を固定中";
    autoStatus.style.borderColor = "#ffcc00"; autoStatus.style.color = "#ffcc00";
  } else {
    btn.textContent = "🔒 固定";
    btn.className = "primary";
    autoStatus.textContent = "🎯 枠内高精度トラッキング";
    autoStatus.style.borderColor = "#00e887"; autoStatus.style.color = "#00e887";
  }
}

function toggleGhost() {
  isGhostOn = !isGhostOn;
  const btn = document.getElementById('ghostToggleBtn');
  const gCanvas = document.getElementById('ghostCanvas');
  if(isGhostOn) {
    btn.style.background = "#00e887"; btn.style.color = "#000";
    gCanvas.style.display = "block";
    gCanvas.width = window.innerWidth; gCanvas.height = window.innerHeight;
    const gCtx = gCanvas.getContext('2d');
    
    if (currentFacingMode === 'user') {
      gCtx.translate(gCanvas.width, 0);
      gCtx.scale(-1, 1);
    }
    gCtx.drawImage(video, 0, 0, gCanvas.width, gCanvas.height);
  } else {
    btn.style.background = "rgba(20,20,20,0.85)"; btn.style.color = "#fff";
    gCanvas.style.display = "none";
  }
}

async function initCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    currentStream = stream;
    video.srcObject = stream;
    video.setAttribute('playsinline', '');
    video.muted = true;
    await video.play().catch(()=>{});
  } catch (err) {
    alert("カメラ起動エラー: " + err.message);
  }
}

async function startApp() {
  await initCamera();
  document.getElementById('permission').style.display = 'none';
  document.getElementById('topIsland').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'block';
  pinKey.style.display = 'block'; pinShadow.style.display = 'block';
  autoStatus.style.display = 'block';

  curKx = window.innerWidth * 0.5; curKy = window.innerHeight * 0.4;
  curSx = window.innerWidth * 0.5; curSy = window.innerHeight * 0.4;

  window.addEventListener('resize', () => {
    if(isGhostOn) {
      const gCanvas = document.getElementById('ghostCanvas');
      gCanvas.width = window.innerWidth; gCanvas.height = window.innerHeight;
    }
  });

  requestAnimationFrame(loop);
}

function getScreenCoords(px, py, canvasW, canvasH) {
  const screenW = window.innerWidth;
  const screenH = window.innerHeight;
  const videoAspect = canvasW / canvasH;
  const screenAspect = screenW / screenH;

  let renderW, renderH, offsetX = 0, offsetY = 0;

  if (screenAspect > videoAspect) {
    renderW = screenW;
    renderH = screenW / videoAspect;
    offsetY = (renderH - screenH) / 2;
  } else {
    renderH = screenH;
    renderW = screenH * videoAspect;
    offsetX = (renderW - screenW) / 2;
  }

  let sx = (px / canvasW) * renderW - offsetX;
  let sy = (py / canvasH) * renderH - offsetY;

  if (currentFacingMode === 'user') {
    sx = screenW - sx;
  }

  return { x: sx, y: sy };
}

function getCanvasPoint(screenX, screenY, canvasW, canvasH) {
  const screenW = window.innerWidth;
  const screenH = window.innerHeight;
  const videoAspect = canvasW / canvasH;
  const screenAspect = screenW / screenH;

  let renderW, renderH, offsetX = 0, offsetY = 0;

  if (screenAspect > videoAspect) {
    renderW = screenW;
    renderH = screenW / videoAspect;
    offsetY = (renderH - screenH) / 2;
  } else {
    renderH = screenH;
    renderW = screenH * videoAspect;
    offsetX = (renderW - screenW) / 2;
  }

  let sx = screenX;
  if (currentFacingMode === 'user') {
    sx = screenW - screenX;
  }

  const px = ((sx + offsetX) / renderW) * canvasW;
  const py = ((screenY + offsetY) / renderH) * canvasH;

  return { x: px, y: py };
}

function loop() {
  if(!video.videoWidth) { requestAnimationFrame(loop); return; }

  canvas.width = 64; canvas.height = 36;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if(!isLocked) {
    const rect = roiBox.getBoundingClientRect();
    
    const roiMinPoint = getCanvasPoint(rect.left, rect.top, canvas.width, canvas.height);
    const roiMaxPoint = getCanvasPoint(rect.right, rect.bottom, canvas.width, canvas.height);

    const rxMin = Math.max(0, Math.floor(Math.min(roiMinPoint.x, roiMaxPoint.x)));
    const rxMax = Math.min(canvas.width, Math.ceil(Math.max(roiMinPoint.x, roiMaxPoint.x)));
    const ryMin = Math.max(0, Math.floor(Math.min(roiMinPoint.y, roiMaxPoint.y)));
    const ryMax = Math.min(canvas.height, Math.ceil(Math.max(roiMinPoint.y, roiMaxPoint.y)));

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    
    let maxLumFiltered = -1, maxLumRaw = -1;
    let minLum = 256;
    let maxPosFiltered = {x: (rxMin+rxMax)/2, y: (ryMin+ryMax)/2};
    let maxPosRaw = {x: (rxMin+rxMax)/2, y: (ryMin+ryMax)/2};
    let minPos = {x: (rxMin+rxMax)/2, y: (ryMin+ryMax)/2};

    for (let y = ryMin; y < ryMax; y++) {
      for (let x = rxMin; x < rxMax; x++) {
        if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
        const i = (y * canvas.width + x) * 4;
        const lum = imgData[i] * 0.2126 + imgData[i+1] * 0.7152 + imgData[i+2] * 0.0722;

        if (lum > maxLumRaw) { maxLumRaw = lum; maxPosRaw = {x, y}; }
        if (lum > maxLumFiltered && lum < 245) { maxLumFiltered = lum; maxPosFiltered = {x, y}; }
        if (lum < minLum) { minLum = lum; minPos = {x, y}; }
      }
    }

    const finalMaxPos = (maxLumFiltered !== -1) ? maxPosFiltered : maxPosRaw;
    const finalMaxLum = (maxLumFiltered !== -1) ? maxLumFiltered : Math.max(1, maxLumRaw);

    const keyCoord = getScreenCoords(finalMaxPos.x, finalMaxPos.y, canvas.width, canvas.height);
    const shadowCoord = getScreenCoords(minPos.x, minPos.y, canvas.width, canvas.height);

    targetKx = keyCoord.x;
    targetKy = keyCoord.y;
    targetSx = shadowCoord.x;
    targetSy = shadowCoord.y;

    // --- 💡 太陽時間 ＆ ストロボ設定連動ロジック ---
    const baseMinLum = Math.max(12, minLum);
    let cameraRatio = finalMaxLum / baseMinLum;

    // ストロボ出力差（A灯 vs B灯）による補正
    let strobeRatioMod = 1.0;
    if (strobeValB > 0) {
      strobeRatioMod = (strobeValA + 0.1) / (strobeValB + 0.05);
    } else {
      strobeRatioMod = (strobeValA + 0.1) * 3.0; // B灯OFFの時は影が深くなる
    }

    // 太陽高度（環境光）による補正（昼間は明るくフラット寄り、夜・地平線下は影が強調される）
    let sunRatioMod = 1.0 / Math.max(0.2, sunFactor);

    // 複合補正を適用した最適明暗比
    const calculatedRatio = Math.max(1.0, cameraRatio * (strobeRatioMod * 0.4) * (sunRatioMod * 0.3));
    smoothRatio += (calculatedRatio - smoothRatio) * 0.15;
  }

  const alpha = 0.15;
  curKx += (targetKx - curKx) * alpha;
  curKy += (targetKy - curKy) * alpha;
  curSx += (targetSx - curSx) * alpha;
  curSy += (targetSy - curSy) * alpha;

  if (isPinsVisible) {
    pinKey.style.left = curKx + 'px'; pinKey.style.top = curKy + 'px';
    pinShadow.style.left = curSx + 'px'; pinShadow.style.top = curSy + 'px';
  }

  document.getElementById('valRatio').textContent = `1 : ${smoothRatio.toFixed(1)}`;
  updateEvaluation(smoothRatio);

  requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick = startApp;
</script>
</body>
</html>
