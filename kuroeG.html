<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>プロ・ライティング・ナビ v41 (スタジオモード搭載)</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",monospace}

#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#overlayCanvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none}

.ui-layer{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)) 12px;transition:opacity 0.2s}
.interactive{pointer-events:auto}

.top-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{background:rgba(20,20,20,0.85);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:6px 9px;border-radius:14px;font-size:10px;font-weight:700;cursor:pointer;backdrop-filter:blur(12px);touch-action:auto}
button.active{background:#00e887;color:#000;border:none}
button.primary{background:#00e887;color:#000;border:none;font-weight:800}

#controlPanel{background:rgba(18,18,18,0.95);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:12px;margin-top:8px;width:min(360px,100%);backdrop-filter:blur(16px);max-height:65vh;overflow-y:auto}
.panel-header{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:bold;margin-bottom:8px;cursor:pointer}
.panel-section{border-top:1px solid rgba(255,255,255,0.1);padding-top:8px;margin-top:8px}

/* モード切替タブ (ロケーション/スタジオ) */
.env-selector-tabs{display:flex;gap:6px;margin-bottom:8px}
.env-btn{flex:1;padding:6px;font-size:10px;font-weight:bold;border-radius:8px;border:1px solid #444;background:#222;color:#888;text-align:center;cursor:pointer}
.env-btn.selected-sun{background:rgba(255,180,0,0.2);color:#ffb400;border-color:#ffb400}
.env-btn.selected-studio{background:rgba(0,232,135,0.2);color:#00e887;border-color:#00e887}

/* 灯具選択タブ */
.light-selector-tabs{display:flex;gap:6px;margin-bottom:8px}
.tab-btn{flex:1;padding:6px;font-size:10px;font-weight:bold;border-radius:8px;border:1px solid #444;background:#222;color:#888;text-align:center;cursor:pointer}
.tab-btn.selected-a{background:rgba(0,232,135,0.2);color:#00e887;border-color:#00e887}
.tab-btn.selected-b{background:rgba(0,191,255,0.2);color:#00bfff;border-color:#00bfff}

/* 8方向ダイアル */
.light-setup-container{display:flex;gap:12px;align-items:center;margin-top:4px}
.pos-map{width:84px;height:84px;border-radius:50%;border:1px dashed rgba(255,255,255,0.3);position:relative;background:rgba(0,0,0,0.4);flex-shrink:0}
.pos-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8px;color:#aaa}
.pos-btn{position:absolute;width:18px;height:18px;border-radius:50%;border:1px solid #666;background:#222;font-size:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transform:translate(-50%,-50%);transition:all 0.15s}
.pos-btn.active-a{background:#00e887;color:#000;border:none;font-weight:bold;scale:1.2;box-shadow:0 0 8px #00e887}
.pos-btn.active-b{background:#00bfff;color:#000;border:none;font-weight:bold;scale:1.2;box-shadow:0 0 8px #00bfff}

.light-ctrl{flex:1;display:flex;flex-direction:column;gap:6px}
.light-row{display:flex;align-items:center;justify-content:space-between;font-size:10px}
.light-select{background:#222;color:#fff;border:1px solid #555;border-radius:6px;padding:2px 4px;font-size:10px}

.bottom-area{display:flex;flex-direction:column;gap:6px;width:100%}
.preset-bar{display:flex;gap:4px;background:rgba(10,10,10,0.8);padding:4px;border-radius:12px;backdrop-filter:blur(10px)}
.preset-btn{flex:1;padding:5px 0;font-size:9px;text-align:center;border-radius:8px;border:none;background:transparent;color:#aaa;transition:all 0.2s}
.preset-btn.active{background:#00e887;color:#000;font-weight:800}

.ratio-bar{background:rgba(10,10,10,0.88);border:1px solid rgba(255,255,255,0.18);border-radius:14px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(12px)}
.ratio-info{font-size:11px;font-weight:bold;color:#aaa}
.ratio-val{color:#fff;font-size:12px;font-weight:bold;margin-left:4px;transition:color 0.2s}
.eval-badge{font-size:10px;font-weight:bold;padding:4px 8px;border-radius:8px;background:rgba(0,232,135,0.2);color:#00e887;border:1px solid rgba(0,232,135,0.4);transition:all 0.2s}

.action-card{background:rgba(15,15,15,0.92);border:1px solid rgba(0,232,135,0.5);border-radius:14px;padding:8px 12px;font-size:11px;font-weight:bold;color:#00e887;backdrop-filter:blur(12px);transition:all 0.2s}
.action-card.flash{animation:cardPulse 0.3s ease-out}

@keyframes cardPulse{
  0%{transform:scale(1);box-shadow:0 0 0px #00e887}
  50%{transform:scale(1.02);box-shadow:0 0 18px #00e887}
  100%{transform:scale(1);box-shadow:0 0 0px #00e887}
}

.bottom-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
#navBadge{background:rgba(0,0,0,0.85);border:1px solid rgba(255,255,255,0.2);color:#ccc;padding:8px 12px;border-radius:14px;font-size:10px;font-weight:bold;flex:1}
#thumbCard{width:60px;height:75px;border-radius:12px;border:2px solid #00e887;overflow:hidden;background:#111;flex-shrink:0}
#thumbImg{width:100%;height:100%;object-fit:cover}

#permission{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.95)}
.permission-card{width:min(380px,100%);background:#121212;border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;text-align:center}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="overlayCanvas"></canvas>

<div class="ui-layer" id="uiLayer">
  <div>
    <div class="top-bar interactive">
      <button class="primary" onclick="document.getElementById('fileInput').click()">📷 写真読込</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
      
      <button id="btnPin" onclick="togglePin()">🔒 固定: OFF</button>
      <button id="btnGhost" onclick="toggleGhost()">👻 ゴースト</button>
      <button id="btnFlip" onclick="switchCamera()">📷 転換</button>
      <button id="btnTracking" class="active" onclick="toggleTracking()">🎯 W追尾</button>
      <button id="btnTogglePanel" onclick="toggleControlPanel()">⚙️ 設定</button>

      <div style="display:flex;gap:2px">
        <button id="btnZoomClose" onclick="setZoom('close')">寄</button>
        <button id="btnZoomStd" class="active" onclick="setZoom('std')">標準</button>
        <button id="btnZoomWide" onclick="setZoom('wide')">引</button>
      </div>

      <div style="display:flex;gap:2px;margin-left:auto">
        <button id="btnModeExp" class="active" onclick="setMode('exp')">EV</button>
        <button id="btnModeCol" onclick="setMode('col')">WB</button>
      </div>
    </div>

    <!-- コントロールパネル -->
    <div id="controlPanel" class="interactive" style="display:none">
      <div class="panel-header" onclick="toggleControlPanel()">
        <span>📐 ライティング＆解析設定</span>
        <span id="panelArrow">▲ 隠す</span>
      </div>

      <!-- 環境設定 (ロケーション vs スタジオ) -->
      <div class="panel-section">
        <div style="font-size:10px;color:#aaa;font-weight:bold;margin-bottom:6px">🌐 撮影環境の選択</div>
        <div class="env-selector-tabs">
          <div class="env-btn" id="btnEnvSun" onclick="setEnvironmentMode('sun')">☀️ 屋外/窓光あり</div>
          <div class="env-btn selected-studio" id="btnEnvStudio" onclick="setEnvironmentMode('studio')">🎬 スタジオ (太陽OFF)</div>
        </div>

        <div id="sunContainer" style="display:none;margin-top:6px">
          <div style="font-size:10px;color:#ffb400;font-weight:bold">☀️ 太陽シミュレーター</div>
          <input type="range" min="6" max="18" value="12" id="sunSlider" style="width:100%" oninput="updateSun(this.value)">
          <div style="font-size:9px;color:#888;text-align:right" id="sunVal">12:00 (太陽高度: 天頂)</div>
        </div>
      </div>

      <div class="panel-section">
        <div style="font-size:10px;color:#00e887;font-weight:bold;margin-bottom:6px">⚡ ストロボ配置 ＆ 光量設定</div>
        
        <!-- 操作対象の明示的選択タブ -->
        <div class="light-selector-tabs">
          <div class="tab-btn selected-a" id="tabLightA" onclick="setActiveTarget('A')">🟢 A灯を配置操作</div>
          <div class="tab-btn" id="tabLightB" onclick="setActiveTarget('B')">🔵 B灯を配置操作</div>
        </div>

        <div class="light-setup-container">
          <div class="pos-map">
            <div class="pos-center">被写体</div>
            <div class="pos-btn" id="p-front" style="top:10%;left:50%" onclick="setLightPos('front')">前</div>
            <div class="pos-btn" id="p-front-right" style="top:20%;left:80%" onclick="setLightPos('front-right')">右前</div>
            <div class="pos-btn" id="p-right" style="top:50%;left:90%" onclick="setLightPos('right')">右</div>
            <div class="pos-btn" id="p-back-right" style="top:80%;left:80%" onclick="setLightPos('back-right')">右後</div>
            <div class="pos-btn" id="p-back" style="top:90%;left:50%" onclick="setLightPos('back')">後</div>
            <div class="pos-btn" id="p-back-left" style="top:80%;left:20%" onclick="setLightPos('back-left')">左後</div>
            <div class="pos-btn" id="p-left" style="top:50%;left:10%" onclick="setLightPos('left')">左</div>
            <div class="pos-btn" id="p-front-left" style="top:20%;left:20%" onclick="setLightPos('front-left')">左前</div>
          </div>

          <div class="light-ctrl">
            <div class="light-row">
              <span style="color:#00e887;font-weight:bold">A灯 (メイン):</span>
              <select class="light-select" id="selFlashA" onchange="onSettingChanged('A', this.value)">
                <option value="OFF">OFF</option>
                <option value="1/1" selected>1/1 (FULL)</option>
                <option value="1/2">1/2</option>
                <option value="1/4">1/4</option>
                <option value="1/8">1/8</option>
                <option value="1/16">1/16</option>
                <option value="1/32">1/32</option>
                <option value="1/64">1/64</option>
                <option value="1/128">1/128</option>
              </select>
            </div>
            <div style="font-size:8px;color:#aaa">配置: <span id="posLabelA">右後 (135°)</span></div>

            <div class="light-row" style="margin-top:6px">
              <span style="color:#00bfff;font-weight:bold">B灯 (サブ):</span>
              <select class="light-select" id="selFlashB" onchange="onSettingChanged('B', this.value)">
                <option value="OFF" selected>OFF</option>
                <option value="1/1">1/1 (FULL)</option>
                <option value="1/2">1/2</option>
                <option value="1/4">1/4</option>
                <option value="1/8">1/8</option>
                <option value="1/16">1/16</option>
                <option value="1/32">1/32</option>
                <option value="1/64">1/64</option>
                <option value="1/128">1/128</option>
              </select>
            </div>
            <div style="font-size:8px;color:#aaa">配置: <span id="posLabelB">右 (90°)</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-area">
    <div class="preset-bar interactive">
      <button class="preset-btn" id="p-flat" onclick="setPreset('flat')">EC・カタログ (1:1.5)</button>
      <button class="preset-btn" id="p-portrait" onclick="setPreset('portrait')">ポートレート (1:3.0)</button>
      <button class="preset-btn active" id="p-dramatic" onclick="setPreset('dramatic')">ドラマチック (1:5.0)</button>
    </div>

    <div class="ratio-bar interactive">
      <div class="ratio-info">明暗比: <span id="ratioVal" class="ratio-val">1 : 1.0</span></div>
      <div id="evalVal" class="eval-badge">解析中...</div>
    </div>

    <div id="actionCard" class="action-card interactive">💡 ACTION: 解析準備中...</div>

    <div class="bottom-bar">
      <div id="navBadge" class="interactive">長押し：差分表示 | Wタップ：UI全消去</div>
      <div id="thumbCard" class="interactive"><img id="thumbImg" src="" style="display:none"></div>
    </div>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">プロ・ライティング・ナビ v41</div>
    <div style="font-size:12px;color:#aaa;margin-bottom:20px">スタジオモード（太陽OFF＆純ストロボ計算）搭載</div>
    <button id="startBtn" class="primary" style="width:100%;padding:14px;border-radius:14px;font-weight:bold">利用を開始</button>
  </div>
</div>

<script>
const video = document.getElementById('camera');
const overlay = document.getElementById('overlayCanvas');
const oCtx = overlay.getContext('2d', {willReadFrequently: true});

const GW = 32, GH = 24;
const refCanvas = document.createElement('canvas'); refCanvas.width = GW; refCanvas.height = GH;
const rCtx = refCanvas.getContext('2d', {willReadFrequently: true});
const curCanvas = document.createElement('canvas'); curCanvas.width = GW; curCanvas.height = GH;
const cCtx = curCanvas.getContext('2d', {willReadFrequently: true});

const freezeCanvas = document.createElement('canvas'); freezeCanvas.width = GW; freezeCanvas.height = GH;
const fCtx = freezeCanvas.getContext('2d', {willReadFrequently: true});

let loadedImg = null;
let isPressing = false;
let currentMode = 'exp';
let panelOpen = false;
let uiVisible = true;

let isLocked = false;
let isGhost = false;
let isTracking = true;
let currentFacingMode = 'environment';
let currentZoom = 'std';

let roi = { x: 0.35, y: 0.3, w: 0.3, h: 0.3 };
let targetHL = { x: 0.5, y: 0.4 };
let targetSD = { x: 0.5, y: 0.5 };
let smoothedRatio = 1.0;

const PRESETS = {
  flat:     { name: 'EC・カタログ', targetRatio: 1.5 },
  portrait: { name: 'ポートレート', targetRatio: 3.0 },
  dramatic: { name: 'ドラマチック', targetRatio: 5.0 }
};
let currentPreset = 'dramatic';

/* 環境モード ('studio' または 'sun') */
let envMode = 'studio'; 
let sunHour = 12;

let flashA = '1/1';
let flashB = 'OFF';

const POS_LABELS = {
  'front': { name: '正面 (0°)', dx: 0, dy: -1 },
  'front-right': { name: '右前 (45°)', dx: 0.7, dy: -0.7 },
  'right': { name: '右 (90°)', dx: 1, dy: 0 },
  'back-right': { name: '右後 (135°)', dx: 0.7, dy: 0.7 },
  'back': { name: '真後 (180°)', dx: 0, dy: 1 },
  'back-left': { name: '左後 (225°)', dx: -0.7, dy: 0.7 },
  'left': { name: '左 (270°)', dx: -1, dy: 0 },
  'front-left': { name: '左前 (315°)', dx: -0.7, dy: -0.7 }
};

let posA = 'back-right';
let posB = 'right';
let activeLightSelect = 'A';

const flashValueMap = {
  'OFF': 0, '1/1': 1.0, '1/2': 0.5, '1/4': 0.25, '1/8': 0.125,
  '1/16': 0.0625, '1/32': 0.03125, '1/64': 0.015625, '1/128': 0.0078125
};

/* --- スタジオ / 太陽環境切り替え --- */
function setEnvironmentMode(mode) {
  envMode = mode;
  document.getElementById('btnEnvSun').className = `env-btn ${mode === 'sun' ? 'selected-sun' : ''}`;
  document.getElementById('btnEnvStudio').className = `env-btn ${mode === 'studio' ? 'selected-studio' : ''}`;
  document.getElementById('sunContainer').style.display = (mode === 'sun') ? 'block' : 'none';
  triggerActionFeedback();
}

/* --- 灯具選択 ＆ 位置指定コントロール --- */
function setActiveTarget(target) {
  activeLightSelect = target;
  document.getElementById('tabLightA').className = `tab-btn ${target === 'A' ? 'selected-a' : ''}`;
  document.getElementById('tabLightB').className = `tab-btn ${target === 'B' ? 'selected-b' : ''}`;
}

function setLightPos(pos) {
  if (activeLightSelect === 'A') {
    posA = pos;
    document.getElementById('posLabelA').textContent = POS_LABELS[pos].name;
  } else {
    posB = pos;
    document.getElementById('posLabelB').textContent = POS_LABELS[pos].name;
  }
  updatePosMapUI();
  triggerActionFeedback();
}

function updatePosMapUI() {
  document.querySelectorAll('.pos-btn').forEach(btn => btn.classList.remove('active-a', 'active-b'));
  if (flashA !== 'OFF') {
    const btnA = document.getElementById(`p-${posA}`);
    if (btnA) btnA.classList.add('active-a');
  }
  if (flashB !== 'OFF') {
    const btnB = document.getElementById(`p-${posB}`);
    if (btnB) btnB.classList.add('active-b');
  }
}

function triggerActionFeedback() {
  const card = document.getElementById('actionCard');
  card.classList.remove('flash');
  void card.offsetWidth;
  card.classList.add('flash');
}

function onSettingChanged(lightType, val) {
  if (lightType === 'A') {
    flashA = val;
  } else if (lightType === 'B') {
    flashB = val;
  }
  updatePosMapUI();
  triggerActionFeedback();
}

function setPreset(pKey) {
  currentPreset = pKey;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`p-${pKey}`).classList.add('active');
  triggerActionFeedback();
}

function updateSun(val) {
  sunHour = parseInt(val);
  const alt = sunHour <= 12 ? (sunHour - 6) * 15 : (18 - sunHour) * 15;
  document.getElementById('sunVal').textContent = `${sunHour}:00 (太陽高度: 約${alt}°)`;
  triggerActionFeedback();
}

/* --- 基本UI ＆ モード制御 --- */
function toggleControlPanel() {
  panelOpen = !panelOpen;
  document.getElementById('controlPanel').style.display = panelOpen ? 'block' : 'none';
  document.getElementById('panelArrow').textContent = panelOpen ? '▲ 隠す' : '▼ 展開';
}

function togglePin() {
  isLocked = !isLocked;
  const btn = document.getElementById('btnPin');
  if (isLocked) {
    fCtx.drawImage(video, 0, 0, GW, GH);
    btn.textContent = '🔒 固定: ON'; btn.classList.add('active');
  } else {
    btn.textContent = '🔒 固定: OFF'; btn.classList.remove('active');
  }
}

function toggleGhost() {
  isGhost = !isGhost;
  document.getElementById('btnGhost').classList.toggle('active', isGhost);
}

function toggleTracking() {
  isTracking = !isTracking;
  document.getElementById('btnTracking').classList.toggle('active', isTracking);
}

async function switchCamera() {
  currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  await startCamera();
}

function setZoom(mode) {
  currentZoom = mode;
  document.getElementById('btnZoomClose').classList.toggle('active', mode === 'close');
  document.getElementById('btnZoomStd').classList.toggle('active', mode === 'std');
  document.getElementById('btnZoomWide').classList.toggle('active', mode === 'wide');

  const cx = roi.x + roi.w / 2, cy = roi.y + roi.h / 2;
  if (mode === 'close') { roi.w = 0.5; roi.h = 0.5; }
  else if (mode === 'std') { roi.w = 0.3; roi.h = 0.3; }
  else if (mode === 'wide') { roi.w = 0.18; roi.h = 0.18; }
  roi.x = Math.max(0, Math.min(1 - roi.w, cx - roi.w / 2));
  roi.y = Math.max(0, Math.min(1 - roi.h, cy - roi.h / 2));
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnModeExp').classList.toggle('active', mode === 'exp');
  document.getElementById('btnModeCol').classList.toggle('active', mode === 'col');
}

window.addEventListener('dblclick', () => {
  uiVisible = !uiVisible;
  document.getElementById('uiLayer').style.opacity = uiVisible ? '1' : '0';
});

let isDraggingRoi = false;
window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.interactive')) return;
  const rect = overlay.getBoundingClientRect();
  const touchX = (e.clientX - rect.left) / rect.width, touchY = (e.clientY - rect.top) / rect.height;
  if (touchX >= roi.x && touchX <= roi.x + roi.w && touchY >= roi.y && touchY <= roi.y + roi.h) {
    isDraggingRoi = true;
  } else { isPressing = true; }
});

window.addEventListener('pointermove', (e) => {
  if (isDraggingRoi) {
    const rect = overlay.getBoundingClientRect();
    const touchX = (e.clientX - rect.left) / rect.width, touchY = (e.clientY - rect.top) / rect.height;
    roi.x = Math.max(0, Math.min(1 - roi.w, touchX - roi.w / 2));
    roi.y = Math.max(0, Math.min(1 - roi.h, touchY - roi.h / 2));
  }
});

window.addEventListener('pointerup', () => { isPressing = false; isDraggingRoi = false; });

function loadImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const img = new Image();
    img.onload = () => {
      loadedImg = img;
      document.getElementById('thumbImg').src = evt.target.result;
      document.getElementById('thumbImg').style.display = 'block';
      rCtx.drawImage(loadedImg, 0, 0, GW, GH);
      document.getElementById('navBadge').textContent = "長押し中：光・色のズレをヒートマップ表示";
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
  } catch (e) { alert("カメラエラー: " + e.message); }
}

async function startApp() {
  await startCamera();
  document.getElementById('permission').style.display = 'none';
  overlay.width = window.innerWidth;
  overlay.height = window.innerHeight;
  window.addEventListener('resize', () => { overlay.width = window.innerWidth; overlay.height = window.innerHeight; });
  updatePosMapUI();
  requestAnimationFrame(loop);
}

/* --- 擬似ライティング・ビジュアルオーバーレイ --- */
function drawVirtualLightingOverlay(W, H) {
  const drawLightGrad = (posKey, power, color) => {
    if (!POS_LABELS[posKey] || power <= 0) return;
    const info = POS_LABELS[posKey];
    const cx = W / 2 + info.dx * (W * 0.38);
    const cy = H / 2 + info.dy * (H * 0.38);
    const radius = Math.max(W, H) * (0.25 + power * 0.45);

    const grad = oCtx.createRadialGradient(cx, cy, 10, cx, cy, radius);
    grad.addColorStop(0, color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');

    oCtx.save();
    oCtx.globalCompositeOperation = 'screen';
    oCtx.fillStyle = grad;
    oCtx.beginPath(); oCtx.arc(cx, cy, radius, 0, Math.PI * 2); oCtx.fill();
    oCtx.restore();
  };

  if (flashA !== 'OFF') drawLightGrad(posA, flashValueMap[flashA], 'rgba(0, 232, 135, 0.3)');
  if (flashB !== 'OFF') drawLightGrad(posB, flashValueMap[flashB], 'rgba(0, 191, 255, 0.25)');
}

/* --- 動的フィードバック ＆ アクション計算 --- */
function updateActionUI(rawRatio) {
  smoothedRatio = smoothedRatio * 0.75 + rawRatio * 0.25;
  const target = PRESETS[currentPreset].targetRatio;
  const diff = smoothedRatio - target;

  const ratioEl = document.getElementById('ratioVal');
  ratioEl.textContent = `1 : ${smoothedRatio.toFixed(1)} (目標 1:${target.toFixed(1)})`;

  const actionEl = document.getElementById('actionCard');
  const badgeEl = document.getElementById('evalVal');

  if (flashA === 'OFF' && flashB === 'OFF') {
    actionEl.textContent = "💡 全灯OFF：ストロボ（A灯またはB灯）を点灯してください";
    actionEl.style.borderColor = "#888"; actionEl.style.color = "#ccc";
    badgeEl.textContent = envMode === 'studio' ? "スタジオ(完全暗転)" : "地光のみ";
    badgeEl.style.background = "rgba(255,255,255,0.1)"; badgeEl.style.color = "#ccc"; badgeEl.style.borderColor = "#888";
    ratioEl.style.color = "#fff";
    return;
  }

  if (Math.abs(diff) <= 0.6) {
    actionEl.textContent = `✨ 【適正】バランス良好です (${envMode === 'studio' ? '🎬スタジオ' : '☀️屋外'})`;
    actionEl.style.borderColor = "#00e887"; actionEl.style.color = "#00e887";
    badgeEl.textContent = "適正"; badgeEl.style.background = "rgba(0,232,135,0.2)";
    badgeEl.style.color = "#00e887"; badgeEl.style.borderColor = "#00e887";
    ratioEl.style.color = "#00e887";
  } else if (diff < -0.6) {
    actionEl.textContent = `💡 【コントラスト不足】メイン光量を「+1〜2Stop」上げるか近づけてください`;
    actionEl.style.borderColor = "#ffb400"; actionEl.style.color = "#ffb400";
    badgeEl.textContent = "フラット"; badgeEl.style.background = "rgba(255,180,0,0.2)";
    badgeEl.style.color = "#ffb400"; badgeEl.style.borderColor = "#ffb400";
    ratioEl.style.color = "#ffb400";
  } else {
    actionEl.textContent = `💡 【影潰れ対策】サブ灯(B灯)を追加/増光するか、レフ板を設置してください`;
    actionEl.style.borderColor = "#ff3366"; actionEl.style.color = "#ff3366";
    badgeEl.textContent = "シャドー潰れ"; badgeEl.style.background = "rgba(255,51,102,0.2)";
    badgeEl.style.color = "#ff3366"; badgeEl.style.borderColor = "#ff3366";
    ratioEl.style.color = "#ff3366";
  }
}

/* --- 解析メインループ --- */
function loop() {
  const W = overlay.width, H = overlay.height;
  oCtx.clearRect(0, 0, W, H);

  if (video.videoWidth) {
    drawVirtualLightingOverlay(W, H);

    if (isGhost && loadedImg) { oCtx.save(); oCtx.globalAlpha = 0.35; oCtx.drawImage(loadedImg, 0, 0, W, H); oCtx.restore(); }

    if (isLocked) cCtx.drawImage(freezeCanvas, 0, 0, GW, GH);
    else cCtx.drawImage(video, 0, 0, GW, GH);
    const curData = cCtx.getImageData(0, 0, GW, GH).data;

    let rxPx = roi.x * W, ryPx = roi.y * H, rwPx = roi.w * W, rhPx = roi.h * H;
    oCtx.strokeStyle = isLocked ? '#ff0055' : '#00e887';
    oCtx.lineWidth = 2; oCtx.setLineDash([4, 4]); oCtx.strokeRect(rxPx, ryPx, rwPx, rhPx); oCtx.setLineDash([]);

    let rx = Math.floor(roi.x * GW), ry = Math.floor(roi.y * GH), rw = Math.floor(roi.w * GW), rh = Math.floor(roi.h * GH);
    let maxL = -1, minL = 999, rawHL = { x: targetHL.x, y: targetHL.y }, rawSD = { x: targetSD.x, y: targetSD.y };

    for (let y = ry; y < ry + rh && y < GH; y++) {
      for (let x = rx; x < rx + rw && x < GW; x++) {
        let idx = (y * GW + x) * 4;
        let lum = curData[idx] * 0.2126 + curData[idx+1] * 0.7152 + curData[idx+2] * 0.0722;
        if (lum > maxL) { maxL = lum; rawHL = { x: (x + 0.5) / GW, y: (y + 0.5) / GH }; }
        if (lum < minL) { minL = lum; rawSD = { x: (x + 0.5) / GW, y: (y + 0.5) / GH }; }
      }
    }
    if (maxL < 0) maxL = 1; if (minL > 255) minL = 1;

    if (isTracking && !isLocked) {
      targetHL.x += (rawHL.x - targetHL.x) * 0.2; targetHL.y += (rawHL.y - targetHL.y) * 0.2;
      targetSD.x += (rawSD.x - targetSD.x) * 0.2; targetSD.y += (rawSD.y - targetSD.y) * 0.2;
    }

    const drawPoint = (pos, color, label) => {
      let px = pos.x * W, py = pos.y * H;
      oCtx.fillStyle = color; oCtx.strokeStyle = '#ffffff'; oCtx.lineWidth = 1.5;
      oCtx.beginPath(); oCtx.arc(px, py, 7, 0, Math.PI * 2); oCtx.stroke();
      oCtx.beginPath(); oCtx.arc(px, py, 3, 0, Math.PI * 2); oCtx.fill();
      oCtx.font = 'bold 10px monospace'; oCtx.fillText(label, px + 10, py + 4);
    };

    drawPoint(targetHL, '#ff3366', '☀️ HL');
    drawPoint(targetSD, '#00bfff', '🌙 SD');

    // 計算式の切替（スタジオモード時は環境光/太陽効果を完全カット）
    let totalFlashEffect = 1.0 + (flashValueMap[flashA] * 3.5) + (flashValueMap[flashB] * 2.0);
    let envEffect = (envMode === 'sun') ? Math.max(0.2, Math.sin(((sunHour - 6) / 12) * Math.PI)) : 1.0;
    
    let rawRatio = (maxL / Math.max(1, minL)) * totalFlashEffect * envEffect;
    
    updateActionUI(rawRatio);

    if (isPressing && loadedImg) {
      const refData = rCtx.getImageData(0, 0, GW, GH).data, diffImg = oCtx.createImageData(GW, GH), d = diffImg.data;
      for (let i = 0; i < refData.length; i += 4) {
        const rL = refData[i] * 0.2126 + refData[i+1] * 0.7152 + refData[i+2] * 0.0722, cL = curData[i] * 0.2126 + curData[i+1] * 0.7152 + curData[i+2] * 0.0722;
        const lumDiff = cL - rL, colorDiff = (curData[i] - curData[i+2]) - (refData[i] - refData[i+2]);
        if (currentMode === 'exp') {
          if (lumDiff > 25) { d[i]=255; d[i+1]=120; d[i+2]=0; d[i+3]=180; } else if (lumDiff < -25) { d[i]=0; d[i+1]=100; d[i+2]=255; d[i+3]=180; } else { d[i]=0; d[i+1]=232; d[i+2]=135; d[i+3]=15; }
        } else {
          if (colorDiff > 20) { d[i]=255; d[i+1]=180; d[i+2]=0; d[i+3]=180; } else if (colorDiff < -20) { d[i]=0; d[i+1]=220; d[i+2]=255; d[i+3]=180; } else { d[i]=0; d[i+1]=232; d[i+2]=135; d[i+3]=15; }
        }
      }
      const tempCanvas = document.createElement('canvas'); tempCanvas.width = GW; tempCanvas.height = GH; tempCanvas.getContext('2d').putImageData(diffImg, 0, 0);
      oCtx.save(); oCtx.globalCompositeOperation = 'source-over'; oCtx.drawImage(tempCanvas, 0, 0, W, H); oCtx.restore();
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick = startApp;
</script>
