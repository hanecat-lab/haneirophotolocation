<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>黒衣モード - プロ・ライティング・アナライザー完全版</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",monospace}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#111}
#fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#151515;color:#777;font-size:14px;z-index:0}

/* オーバーレイUI群 */
#overlay{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom)) 20px;display:none}
#meter{position:absolute;bottom:100px;left:20px;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);padding:14px 18px;border-left:3px solid #00e887;border-radius:0 12px 12px 0;pointer-events:auto}
.value{font-size:20px;color:#00e887;font-weight:bold;font-family:monospace}
.label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}

/* 輝度分布マップ（5段階ヒストグラム） */
#distMap{position:absolute;bottom:20px;left:20px;width:180px;height:65px;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:8px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:auto}
.bar-col{width:24px;background:rgba(255,255,255,0.1);border-radius:3px 3px 0 0;height:100%;display:flex;align-items:flex-end;overflow:hidden}
.bar-fill{width:100%;background:#00e887;height:0%;transition:height 0.1s linear}

/* 中央ターゲット（レティクル） */
#reticle{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);width:60px;height:60px;border:2px solid rgba(0,232,135,0.8);border-radius:50%;z-index:4;pointer-events:none;display:none;box-shadow:0 0 15px rgba(0,232,135,0.3);transition:opacity 0.3s}

/* コントロールボタン群 */
#controls{position:fixed;top:max(16px,env(safe-area-inset-top));right:20px;z-index:10;display:none;display:flex;gap:8px}
button{background:rgba(20,20,20,0.85);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:10px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;backdrop-filter:blur(10px)}
button.primary{background:#00e887;color:#000;border:none}

/* 起動許可モーダル */
#permission{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,0.95);backdrop-filter:blur(16px)}
.permission-card{width:min(400px,100%);background:rgba(18,18,18,0.98);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;text-align:center}
.permission-title{font-size:20px;font-weight:700;margin-bottom:10px}
.permission-text{font-size:13px;line-height:1.6;color:#aaa;margin-bottom:20px}
#startBtn{width:100%;background:#fff;color:#000;border:none;border-radius:14px;padding:14px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 20px rgba(255,255,255,0.3)}
</style>
</head>
<body>
<div id="fallback">カメラ待機中…</div>
<video id="camera" autoplay playsinline muted></video>

<div id="reticle"></div>

<div id="overlay">
  <div id="meter">
    <div class="label">Center Luminance</div>
    <div id="valL" class="value">0</div>
    <div class="label" style="margin-top:6px">Contrast Range</div>
    <div id="valC" class="value">0</div>
  </div>
  
  <div id="distMap" title="輝度分布マップ (暗部〜ハイライト)">
    <div class="bar-col"><div class="bar-fill" id="b0"></div></div>
    <div class="bar-col"><div class="bar-fill" id="b1"></div></div>
    <div class="bar-col"><div class="bar-fill" id="b2"></div></div>
    <div class="bar-col"><div class="bar-fill" id="b3"></div></div>
    <div class="bar-col"><div class="bar-fill" id="b4"></div></div>
  </div>
</div>

<div id="controls">
  <button id="snapBtn" class="primary">SNAP記録</button>
  <button id="modeBtn">モード: フル</button>
</div>

<div id="permission">
  <div class="permission-card">
    <div class="permission-title">アナライザー完全版</div>
    <div class="permission-text">カメラを起動して光の計測を開始します。</div>
    <button id="startBtn">計測を始める</button>
  </div>
</div>

<script>
const video = document.getElementById('camera');
const overlay = document.getElementById('overlay');
const reticle = document.getElementById('reticle');
const controls = document.getElementById('controls');
const permission = document.getElementById('permission');

let uiMode = 0; // 0: フル, 1: ミニマル, 2: フリーダム(非表示)
let canvas = document.createElement('canvas');
let ctx = canvas.getContext('2d', {willReadFrequently: true});
let logs = JSON.parse(localStorage.getItem('kuroko_logs') || '[]');

async function startApp() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: 1280, height: 720 }
    });
    video.srcObject = stream;
    
    permission.style.display = 'none';
    document.getElementById('fallback').style.display = 'none';
    overlay.style.display = 'block';
    reticle.style.display = 'block';
    controls.style.display = 'flex';

    await video.play().catch(()=>{});
    loop();
  } catch (err) {
    alert("起動失敗: " + err.message);
  }
}

function loop() {
  if(!video.videoWidth) {
    requestAnimationFrame(loop);
    return;
  }
  
  canvas.width = 160; 
  canvas.height = 90;
  ctx.drawImage(video, 0, 0, 160, 90);
  
  // 画面全体から輝度分布を計算、中央は詳細サンプリング
  const centerData = ctx.getImageData(70, 35, 20, 20).data;
  let sum=0, min=255, max=0;
  for(let i=0; i<centerData.length; i+=4){
    const v = (centerData[i] * 0.2126 + centerData[i+1] * 0.7152 + centerData[i+2] * 0.0722);
    sum += v; 
    if(v < min) min = v; 
    if(v > max) max = v;
  }
  const lum = Math.round(sum / 400);
  const con = Math.round(max - min);
  
  document.getElementById('valL').textContent = lum;
  document.getElementById('valC').textContent = con;

  // 5段階の輝度分布（簡易ヒストグラムバケット）の算出
  const fullData = ctx.getImageData(0, 0, 160, 90).data;
  const bins = [0, 0, 0, 0, 0];
  let totalPixels = fullData.length / 4;

  for(let i=0; i<fullData.length; i+=4){
    const v = (fullData[i] * 0.2126 + fullData[i+1] * 0.7152 + fullData[i+2] * 0.0722);
    if(v < 51) bins[0]++;
    else if(v < 102) bins[1]++;
    else if(v < 153) bins[2]++;
    else if(v < 204) bins[3]++;
    else bins[4]++;
  }

  for(let b=0; b<5; b++){
    const ratio = Math.min(100, Math.round((bins[b] / totalPixels) * 300));
    document.getElementById(`b${b}`).style.height = ratio + '%';
  }
  
  requestAnimationFrame(loop);
}

// 記録ボタン（学習ログ蓄積）
document.getElementById('snapBtn').onclick = () => {
  const currentLog = {
    time: new Date().toLocaleTimeString(),
    lum: document.getElementById('valL').textContent,
    con: document.getElementById('valC').textContent
  };
  logs.push(currentLog);
  localStorage.setItem('kuroko_logs', JSON.stringify(logs));
  
  const btn = document.getElementById('snapBtn');
  btn.textContent = `記録完了 (${logs.length}件)`;
  setTimeout(() => btn.textContent = "SNAP記録", 1500);
};

// モード切替（フリーダム・スイッチ対応）
document.getElementById('modeBtn').onclick = () => {
  uiMode = (uiMode + 1) % 3;
  const overlayElem = document.getElementById('overlay');
  const reticleElem = document.getElementById('reticle');
  const modeBtn = document.getElementById('modeBtn');

  if(uiMode === 0){
    // フルアナライザー
    overlayElem.style.display = 'block';
    reticleElem.style.display = 'block';
    modeBtn.textContent = "モード: フル";
  } else if(uiMode === 1){
    // ミニマル表示
    document.getElementById('meter').style.display = 'none';
    document.getElementById('distMap').style.display = 'none';
    overlayElem.style.display = 'block';
    reticleElem.style.display = 'block';
    modeBtn.textContent = "モード: ミニマル";
  } else {
    // フリーダム（完全非表示）
    overlayElem.style.display = 'none';
    reticleElem.style.display = 'none';
    document.getElementById('meter').style.display = 'block'; // 復元用
    document.getElementById('distMap').style.display = 'flex';
    modeBtn.textContent = "モード: フリーダム";
  }
};

document.getElementById('startBtn').onclick = startApp;
</script>
</body>
</html>
