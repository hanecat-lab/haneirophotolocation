<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>黒衣モード - プロ・ライティング・アナライザー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",monospace}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#111}
#fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#151515;color:#777;font-size:14px;z-index:0}

/* プロ用測定オーバーレイ */
#overlay{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom)) 20px;display:none}
#meter{position:absolute;bottom:90px;left:20px;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);padding:14px 18px;border-left:3px solid #00e887;border-radius:0 12px 12px 0}
.value{font-size:20px;color:#00e887;font-weight:bold;font-family:monospace}
.label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}

/* ヒストグラム風モニター */
#hist{position:absolute;bottom:20px;left:20px;width:180px;height:50px;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);border-radius:8px;overflow:hidden}
#bar{position:absolute;bottom:0;width:100%;background:rgba(0,232,135,0.4);transition:height 0.1s linear}

/* 中央ターゲット（レティクル） */
#reticle{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);width:60px;height:60px;border:2px solid rgba(0,232,135,0.8);border-radius:50%;z-index:4;pointer-events:none;display:none;box-shadow:0 0 15px rgba(0,232,135,0.3)}

/* モード切替ボタン */
#controls{position:fixed;top:max(16px,env(safe-area-inset-top));right:20px;z-index:10;display:none}
button{background:rgba(20,20,20,0.85);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:10px 16px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(10px)}

/* 起動許可モーダル画面 */
#permission{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,0.95);backdrop-filter:blur(16px)}
.permission-card{width:min(400px,100%);background:rgba(18,18,18,0.98);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;text-align:center}
.permission-title{font-size:20px;font-weight:700;margin-bottom:10px}
.permission-text{font-size:13px;line-height:1.6;color:#aaa;margin-bottom:20px}
#startBtn{width:100%;background:#fff;color:#000;border:none;border-radius:14px;padding:14px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 20px rgba(255,255,255,0.3)}
</style>
</head>
<body>
<div id="fallback">カメラ待機中…</div>
<video id="camera" autoplay playsinline muted></video>

<div id="reticle"></div>

<div id="overlay">
  <div id="meter">
    <div class="label">Center Luminance (輝度)</div>
    <div id="valL" class="value">0</div>
    <div class="label" style="margin-top:8px">Contrast Range (差分)</div>
    <div id="valC" class="value">0</div>
  </div>
  <div id="hist"><div id="bar"></div></div>
</div>

<div id="controls">
  <button id="toggleUI">アナライザー: 表示中</button>
</div>

<div id="permission">
  <div class="permission-card">
    <div class="permission-title">プロ・ライティング・アナライザー</div>
    <div class="permission-text">ボタンをタップして、カメラの測定権限を許可してください。</div>
    <button id="startBtn">アナライザーを起動する</button>
  </div>
</div>

<script>
const video = document.getElementById('camera');
const bar = document.getElementById('bar');
const overlay = document.getElementById('overlay');
const reticle = document.getElementById('reticle');
const controls = document.getElementById('controls');
const permission = document.getElementById('permission');

let showAnalyzer = true;
let canvas = document.createElement('canvas');
let ctx = canvas.getContext('2d', {willReadFrequently: true});

async function startApp() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: 1280, height: 720 }
    });
    video.srcObject = stream;
    
    // 画面切り替え
    permission.style.display = 'none';
    document.getElementById('fallback').style.display = 'none';
    overlay.style.display = 'block';
    reticle.style.display = 'block';
    controls.style.display = 'block';

    await video.play().catch(()=>{});
    loop();
  } catch (err) {
    alert("カメラの起動に失敗しました: " + err.message);
  }
}

function loop() {
  if(!video.videoWidth) {
    requestAnimationFrame(loop);
    return;
  }
  
  canvas.width = 160; 
  canvas.height = 90;
  ctx.drawImage(video, 0, 0, 160, 90);
  
  // 中央付近のピクセルサンプリング
  const data = ctx.getImageData(70, 35, 20, 20).data;
  let sum=0, min=255, max=0;
  for(let i=0; i<data.length; i+=4){
    const v = (data[i] * 0.2126 + data[i+1] * 0.7152 + data[i+2] * 0.0722);
    sum += v; 
    if(v < min) min = v; 
    if(v > max) max = v;
  }
  
  const lum = Math.round(sum / 400);
  const con = Math.round(max - min);
  
  document.getElementById('valL').textContent = lum;
  document.getElementById('valC').textContent = con;
  bar.style.height = Math.min(100, Math.max(0, (lum / 255) * 100)) + '%';
  
  requestAnimationFrame(loop);
}

// UI表示切替ボタン
document.getElementById('toggleUI').onclick = () => {
  showAnalyzer = !showAnalyzer;
  overlay.style.opacity = showAnalyzer ? '1' : '0';
  reticle.style.opacity = showAnalyzer ? '1' : '0';
  document.getElementById('toggleUI').textContent = `アナライザー: ${showAnalyzer ? '表示中' : '非表示'}`;
};

document.getElementById('startBtn').onclick = startApp;
</script>
</body>
</html>
