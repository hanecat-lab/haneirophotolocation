<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>黒衣モード 完全版 (Pro)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#arCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#303030 0,#151515 35%,#050505 75%);color:#777;font-size:14px;z-index:0}
#shade{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 30%,transparent 65%,rgba(0,0,0,.58));pointer-events:none;z-index:1}
#status{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.72);z-index:5;pointer-events:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#00e887;margin-right:6px;box-shadow:0 0 10px #00e887}
#reticle{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);width:38px;height:38px;border:1px solid rgba(255,255,255,.28);border-radius:50%;z-index:3;pointer-events:none}
#reticle:after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
#insight{position:fixed;left:18px;right:18px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));z-index:6}
.card{background:rgba(10,10,10,.76);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:18px 18px 15px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.type{font-size:24px;font-weight:700;letter-spacing:.02em}
.sub{margin-top:5px;font-size:13px;color:rgba(255,255,255,.7)}
.subject{margin-top:10px;font-size:12px;color:#00e887}
.light-reading{margin-top:9px;font-size:12px;color:#f5d77a}
.reason{margin-top:14px;font-size:14px;line-height:1.65;color:rgba(255,255,255,.88)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:12px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.09);color:#ddd}
#more{position:fixed;right:18px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));z-index:7;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,10,.65);color:#fff;font-size:18px}
#panel{position:fixed;left:18px;right:18px;bottom:max(80px,calc(env(safe-area-inset-bottom) + 70px));z-index:8;display:none}
#panel .card{max-height:58vh;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.row b{color:#00e887}
button{font:inherit}
#permission{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.permission-card{width:min(420px,100%);background:rgba(15,15,15,.96);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.permission-title{font-size:24px;font-weight:700}
.permission-text{margin-top:10px;font-size:14px;line-height:1.7;color:#bbb}
.perm-status{margin-top:18px;padding:12px;border-radius:12px;background:#202020;color:#00e887;font-size:13px}
#startBtn{margin-top:14px;width:100%;border:1px solid rgba(255,255,255,.18);background:#fff;color:#000;border-radius:14px;padding:14px;font-weight:700}
.perm-error{margin-top:12px;font-size:12px;line-height:1.6;color:#ff8b8b}
</style>
</head>
<body>
<div id="fallback">カメラを起動すると、ここが「黒衣モード」になります。</div>
<video id="camera" autoplay playsinline muted></video>
<canvas id="arCanvas"></canvas>
<div id="shade"></div>
<div id="status"><span><i class="dot"></i><span id="state">待機中</span></span><span id="clock">--:--</span></div>
<div id="reticle"></div>

<div id="insight">
  <div class="card">
    <div class="type" id="type">周囲を見ています</div>
    <div class="sub" id="sub">カメラと光の状況を解析中</div>
    <div class="subject" id="subject">被写体：光と方角を優先解析中</div>
    <div class="light-reading" id="lightReading">光解析：準備完了</div>
    <div class="reason" id="reason">太陽位置・時間・スマホの向きから最適な撮影条件を導き出します。</div>
    <div class="meta" id="meta">
      <span class="tag">黒衣モード</span>
      <span class="tag">ARガイド稼働中</span>
    </div>
  </div>
</div>

<button id="more" aria-label="詳細">⋯</button>
<div id="panel">
  <div class="card">
    <div style="font-weight:700;font-size:17px;margin-bottom:6px">撮影条件</div>
    <div class="row"><span>太陽高度</span><b id="sunAlt">--</b></div>
    <div class="row"><span>太陽方位</span><b id="sunAz">--</b></div>
    <div class="row"><span>スマホ方位</span><b id="heading">--</b></div>
    <div class="row"><span>太陽との角度</span><b id="angle">--</b></div>
    <div class="row"><span>撮影タイプ</span><b id="detailType">--</b></div>
    <div class="row"><span>光の状態</span><b id="lightScene">--</b></div>
    <div class="row"><span>推奨露出補正</span><b id="exposureAdvice">--</b></div>
    <div class="row"><span>明るい方向</span><b id="lightDirection">--</b></div>
    <div class="row"><span>おすすめレンズ</span><b id="lens">--</b></div>
    <div class="row"><span>構図</span><b id="composition">--</b></div>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div class="permission-title">黒衣モード 完全版</div>
    <div class="permission-text" id="permDesc">
      カメラとセンサーを許可して、AR光ナビゲーションを開始します。
    </div>
    <div id="permStatus" class="perm-status">準備中…</div>
    <button id="startBtn">1. カメラを許可して開始</button>
    <div id="permError" class="perm-error"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let lat=34.69, lon=135.50, heading=null, stream=null;
let lastType="周囲を見ています", lastLightAdvice="";
let lightCanvas=null, lightContext=null, lightStats={
  ready:false, scene:"解析待ち", exposureEv:0, direction:"解析待ち",
  highlight:0, shadow:0
};
let step = 1;

function setupLightAnalysis(){
  if(lightCanvas) return;
  lightCanvas=document.createElement("canvas");
  lightCanvas.width=160;
  lightCanvas.height=90;
  lightContext=lightCanvas.getContext("2d",{willReadFrequently:true});
}

function percentile(values, ratio){
  if(!values.length) return 0;
  const index=Math.min(values.length-1,Math.max(0,Math.floor((values.length-1)*ratio)));
  return values[index];
}

function formatEv(ev){
  const rounded=Math.round(ev*10)/10;
  return `${rounded>0?"+":""}${rounded.toFixed(1)} EV`;
}

function analyzeFrameLight(){
  const video=$("camera");
  if(!lightContext || !video.videoWidth || $("permission").style.display!=="none") return;
  lightContext.drawImage(video,0,0,160,90);
  const pixels=lightContext.getImageData(0,0,160,90).data;
  const values=[], regions={left:[],right:[],top:[],bottom:[]};
  let highlights=0, shadows=0, count=0;
  for(let y=0;y<90;y+=2){
    for(let x=0;x<160;x+=2){
      const i=(y*160+x)*4;
      const r=pixels[i], g=pixels[i+1], b=pixels[i+2];
      const luminance=0.2126*r+0.7152*g+0.0722*b;
      values.push(luminance);
      count++;
      if(luminance>=245) highlights++;
      if(luminance<=18) shadows++;
      if(x<80) regions.left.push(luminance); else regions.right.push(luminance);
      if(y<45) regions.top.push(luminance); else regions.bottom.push(luminance);
    }
  }
  if(!values.length) return;
  values.sort((a,b)=>a-b);
  const p10=percentile(values,.1), p50=percentile(values,.5), p90=percentile(values,.9);
  const brightness=p50;
  let scene="標準光";
  if(brightness<38) scene="低照度";
  else if(brightness>205) scene="高照度";
  else if(p90-p10>145) scene="高コントラスト";

  const averageRegion=(list)=>list.reduce((sum,value)=>sum+value,0)/Math.max(1,list.length);
  const regionValues={
    left:averageRegion(regions.left), right:averageRegion(regions.right),
    top:averageRegion(regions.top), bottom:averageRegion(regions.bottom)
  };
  const sortedRegions=Object.entries(regionValues).sort((a,b)=>b[1]-a[1]);
  const directionLabels={left:"左側から",right:"右側から",top:"上側から",bottom:"下側から"};
  const direction=sortedRegions[0][1]-sortedRegions[3][1]>16 ? directionLabels[sortedRegions[0][0]] : "全体に回っています";
  const exposureEv=Math.max(-2,Math.min(2,Math.log2(118/Math.max(18,brightness))));

  lightStats={
    ready:true, scene, exposureEv, direction,
    highlight:highlights/count*100, shadow:shadows/count*100
  };
  update();
}

function lightAdvice(){
  if(!lightStats.ready) return null;
  if(lightStats.scene==="高コントラスト") return `明暗差が大きい映像です。白飛びを守るため ${formatEv(lightStats.exposureEv)}`;
  if(lightStats.scene==="低照度") return `光量が少ない映像です。${formatEv(lightStats.exposureEv)}を目安に固定してください`;
  return `光は安定しています。${lightStats.direction}の光を活かせます`;
}

// ARガイド描画
function drawARGuide(){
  const canvas = $("arCanvas");
  const ctx = canvas.getContext("2d");
  if(canvas.width !== window.innerWidth || canvas.height !== window.innerHeight){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if(heading == null) return;

  const now = new Date();
  const s = solar(now, lat, lon);
  const angleDiff = ((s.az - heading + 540) % 360) - 180;
  const centerX = canvas.width / 2;
  const xOffset = centerX + (angleDiff / 30) * centerX;

  if(Math.abs(angleDiff) < 90){
    ctx.save();
    ctx.strokeStyle = "rgba(0, 232, 135, 0.8)";
    ctx.fillStyle = "rgba(0, 232, 135, 0.2)";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(xOffset, 100);
    ctx.lineTo(xOffset, canvas.height - 150);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(xOffset, 100, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#00e887";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("☀️ 太陽の方向 (光の向き)", xOffset, 75);
    ctx.restore();
  }
}

async function handleAction(){
  $("permError").textContent="";
  if(step === 1){
    $("permStatus").textContent="📷 カメラを起動しています…";
    try{
      if(!window.isSecureContext || !navigator.mediaDevices){ throw new Error("secure"); }
      stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},
        audio:false
      });
      $("camera").srcObject=stream;
      $("fallback").style.display="none";
    }catch(e){
      $("permError").textContent="カメラを起動できませんでした。HTTPS環境をご確認ください。";
      return;
    }

    if(navigator.geolocation){
      await new Promise(resolve=>{
        navigator.geolocation.getCurrentPosition(
          p=>{ lat=p.coords.latitude; lon=p.coords.longitude; resolve(); },
          ()=>{ resolve(); },
          {enableHighAccuracy:true,timeout:5000}
        );
      });
    }

    setupLightAnalysis();

    step = 2;
    $("permDesc").textContent = "次に、コンパス・センサーを有効にします。";
    $("permStatus").textContent = "準備完了";
    $("startBtn").textContent = "2. センサーを許可して完了";

  } else if(step === 2){
    try{
      if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
        await DeviceOrientationEvent.requestPermission();
      }
    }catch(e){}

    window.addEventListener("deviceorientationabsolute",orientation,true);
    window.addEventListener("deviceorientation",orientation,true);

    $("permission").style.display="none";
    $("state").textContent = "稼働中";
    update();
  }
}

function orientation(e){
  let h;
  if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;
  else if(e.absolute && e.alpha!=null) h=(360-e.alpha)%360;
  if(h!=null && isFinite(h)) heading=h;
  update();
}

function dayOfYear(d){return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/86400000)}
function solar(d,lat,lon){
  const N=dayOfYear(d), hour=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
  const g=2*Math.PI/365*(N-1+(hour-12)/24);
  const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const tz=-d.getTimezoneOffset()/60;
  const tc=eq+4*lon-60*tz;
  const tst=(hour*60+tc+1440)%1440;
  let ha=tst/4-180;
  const phi=lat*Math.PI/180;
  const haR=ha*Math.PI/180;
  const alt=Math.asin(Math.sin(phi)*Math.sin(decl)+Math.cos(phi)*Math.cos(decl)*Math.cos(haR));
  let az=Math.atan2(Math.sin(haR),Math.cos(haR)*Math.sin(phi)-Math.tan(decl)*Math.cos(phi))*180/Math.PI+180;
  return {alt:alt*180/Math.PI,az:(az+360)%360};
}
function diff(a,b){return Math.abs((a-b+540)%360-180)}
function classify(sun){
  const h=heading==null?null:diff(heading,sun.az);
  let type="周囲を見ています", reason="太陽と光の状態から撮影条件を解析しています。", lens="35–50mm", comp="自由";
  const currentLightAdvice=lightAdvice();
  if(sun.alt<2){type="ブルーアワー候補";reason="太陽が地平線下です。空の色と街明かりを組み合わせます。";lens="24–50mm";comp="空を広めに"}
  else if(sun.alt>=2 && sun.alt<10){type="🌅 低い光が狙えます";reason="斜光や長い影が発生しやすい絶好のタイミングです。";lens="35–85mm";comp="影を入れる"}
  else if(h!=null && h<18 && sun.alt<35){type="👤 シルエット向き";reason="半逆光・逆光状態で被写体の輪郭を強調できます。";lens="50–135mm";comp="縦構図"}
  else if(h!=null && h>55 && h<125 && sun.alt<45){type="☀️ サイドライト向き";reason="横からの光で凹凸を立体的に表現できます。";lens="35–85mm";comp="光と影の分離"}
  if(currentLightAdvice && type==="周囲を見ています") reason=currentLightAdvice;
  return {type,reason,lens,comp,angle:h};
}
function update(){
  const now=new Date(), s=solar(now,lat,lon), c=classify(s);
  $("clock").textContent=now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  $("sunAlt").textContent=s.alt.toFixed(1)+"°";
  $("sunAz").textContent=s.az.toFixed(1)+"°";
  $("heading").textContent=heading==null?"--":heading.toFixed(0)+"°";
  $("angle").textContent=c.angle==null?"--":c.angle.toFixed(0)+"°";
  $("detailType").textContent=c.type;
  $("lightScene").textContent=lightStats.ready?lightStats.scene:"解析待ち";
  $("exposureAdvice").textContent=lightStats.ready?formatEv(lightStats.exposureEv):"解析待ち";
  $("lightDirection").textContent=lightStats.ready?lightStats.direction:"解析待ち";
  $("lens").textContent=c.lens;
  $("composition").textContent=c.comp;

  if(c.type!==lastType || currentLightAdvice!==lastLightAdvice){
    $("type").textContent=c.type;
    $("reason").textContent=c.reason;
    lastType=c.type;
  }
  drawARGuide();
}
$("more").onclick=()=>{$("panel").style.display=$("panel").style.display==="block"?"none":"block"};
$("startBtn").onclick=handleAction;
setInterval(update,1000);
setInterval(analyzeFrameLight,500);
</script>
</body>
</html>
