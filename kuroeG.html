<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>プロ・ライティング・ナビ v33-FullMaster</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",monospace}

#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#overlayCanvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none}

/* UIレイヤー */
.ui-layer{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)) 12px}
.interactive{pointer-events:auto}

/* トップバー */
.top-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{background:rgba(20,20,20,0.85);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:6px 10px;border-radius:14px;font-size:10px;font-weight:700;cursor:pointer;backdrop-filter:blur(12px);touch-action:auto}
button.active{background:#00e887;color:#000;border:none}
button.primary{background:#00e887;color:#000;border:none;font-weight:800}

/* 可動コントロールパネル */
#controlPanel{background:rgba(18,18,18,0.92);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:12px;margin-top:8px;width:min(340px,100%);backdrop-filter:blur(16px);max-height:60vh;overflow-y:auto}
.panel-header{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:bold;margin-bottom:8px;cursor:pointer}
.panel-section{border-top:1px solid rgba(255,255,255,0.1);padding-top:8px;margin-top:8px}

.color-guide{display:flex;flex-wrap:wrap;gap:8px;font-size:9px;color:#aaa;margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}

/* ボトムバー */
.bottom-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
#navBadge{background:rgba(0,0,0,0.85);border:1px solid rgba(0,232,135,0.6);color:#00e887;padding:10px 14px;border-radius:16px;font-size:11px;font-weight:bold;flex:1;box-shadow:0 4px 16px rgba(0,0,0,0.5)}
#thumbCard{width:65px;height:85px;border-radius:12px;border:2px solid #00e887;overflow:hidden;background:#111;flex-shrink:0}
#thumbImg{width:100%;height:100%;object-fit:cover}

#permission{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.95)}
.permission-card{width:min(380px,100%);background:#121212;border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;text-align:center}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="overlayCanvas"></canvas>

<div class="ui-layer" id="uiLayer">
  <div>
    <!-- 完全復元トップバー -->
    <div class="top-bar interactive">
      <button class="primary" onclick="document.getElementById('fileInput').click()">📷 写真読込</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
      
      <button id="btnPin" onclick="togglePin()">🔒 固定: OFF</button>
      <button id="btnGhost" onclick="toggleGhost()">👻 ゴースト</button>
      <button id="btnFlip" onclick="switchCamera()">📷 転換</button>
      <button id="btnTracking" class="active" onclick="toggleTracking()">🎯 枠内高精度トラッキング</button>
      <button id="btnTogglePanel" onclick="toggleControlPanel()">⚙️ 設定パネル</button>

      <!-- 画角切り替え -->
      <div style="display:flex;gap:2px;margin-left:4px">
        <button id="btnZoomClose" onclick="setZoom('close')">寄</button>
        <button id="btnZoomStd" class="active" onclick="setZoom('std')">標準</button>
        <button id="btnZoomWide" onclick="setZoom('wide')">引</button>
      </div>

      <!-- モード切り替え -->
      <div style="display:flex;gap:2px;margin-left:auto">
        <button id="btnModeExp" class="active" onclick="setMode('exp')">EV</button>
        <button id="btnModeCol" onclick="setMode('col')">WB</button>
      </div>
    </div>

    <!-- 高度コントロールパネル -->
    <div id="controlPanel" class="interactive" style="display:none">
      <div class="panel-header" onclick="toggleControlPanel()">
        <span>📐 ライティング＆解析設定 (ROI / 多灯)</span>
        <span id="panelArrow">▲ 隠す</span>
      </div>

      <div class="color-guide">
        <span><span class="dot" style="background:#ff7800"></span>オレンジ: 光過剰</span>
        <span><span class="dot" style="background:#0064ff"></span>ネイビー: 光不足</span>
        <span><span class="dot" style="background:#ffb400"></span>アンバー: 温かすぎ</span>
        <span><span class="dot" style="background:#00dcff"></span>シアン: 冷たすぎ</span>
      </div>

      <!-- 1. 太陽シミュレーター -->
      <div class="panel-section">
        <div style="font-size:10px;color:#00e887;font-weight:bold">☀️ 太陽シミュレーター</div>
        <input type="range" min="6" max="18" value="12" id="sunSlider" style="width:100%" oninput="updateSun(this.value)">
        <div style="font-size:9px;color:#888;text-align:right" id="sunVal">12:00 (太陽高度: 天頂)</div>
      </div>

      <!-- 2. 多灯ストロボ設定 -->
      <div class="panel-section">
        <div style="font-size:10px;color:#00e887;font-weight:bold">⚡ ストロボ設定 ＆ 照射方向</div>
        <div style="font-size:9px;margin-top:4px">
          A灯(メイン): 
          <button id="btnFlashA1" onclick="setFlash('A', '1/4')">1/4</button>
          <button id="btnFlashA2" class="active" onclick="setFlash('A', '1/16')">1/16</button>
          <button id="btnFlashA3" onclick="setFlash('A', '1/64')">1/64</button>
        </div>
        <div style="font-size:9px;margin-top:4px">
          B灯(サブ): 
          <button id="btnFlashB1" onclick="setFlash('B', 'OFF')">OFF</button>
          <button id="btnFlashB2" class="active" onclick="setFlash('B', '1/32')">1/32</button>
          <button id="btnFlashB3" onclick="setFlash('B', '1/128')">1/128</button>
        </div>
      </div>

      <!-- 3. 明暗比＆評価 -->
      <div class="panel-section">
        <div style="font-size:10px;color:#aaa">被写体明暗比 (ROI領域): <span id="ratioVal" style="color:#fff;font-weight:bold">1 : 1.0</span></div>
        <div style="font-size:9px;color:#00e887" id="evalVal">評価: フラット (1:2未満)</div>
      </div>
    </div>
  </div>

  <!-- ボトムバー -->
  <div class="bottom-bar">
    <div id="navBadge" class="interactive">長押しで「光のズレ」オーバーレイ表示 (WタップでUI非表示)</div>
    <div id="thumbCard" class="interactive">
      <img id="thumbImg" src="" style="display:none">
    </div>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">プロ・ライティング・ナビ v33</div>
    <div style="font-size:12px;color:#aaa;margin-bottom:20px">完全復元 ＆ フル機能連動版</div>
    <button id="startBtn" class="primary" style="width:100%;padding:14px;border-radius:14px;font-weight:bold">利用を開始</button>
  </div>
</div>
<script>
const video = document.getElementById('camera');
const overlay = document.getElementById('overlayCanvas');
const oCtx = overlay.getContext('2d', {willReadFrequently: true});

// 低解像度解析用キャンバス
const GW = 32, GH = 24;
const refCanvas = document.createElement('canvas'); refCanvas.width = GW; refCanvas.height = GH;
const rCtx = refCanvas.getContext('2d', {willReadFrequently: true});
const curCanvas = document.createElement('canvas'); curCanvas.width = GW; curCanvas.height = GH;
const cCtx = curCanvas.getContext('2d', {willReadFrequently: true});

// 静止画（固定機能用）保持用
const freezeCanvas = document.createElement('canvas'); freezeCanvas.width = GW; freezeCanvas.height = GH;
const fCtx = freezeCanvas.getContext('2d', {willReadFrequently: true});

// アプリ状態変数
let loadedImg = null;
let isPressing = false;
let currentMode = 'exp';
let panelOpen = false;
let uiVisible = true;

let isLocked = false;
let isGhost = false;
let isTracking = true;
let currentFacingMode = 'environment';
let currentZoom = 'std';

// ROI（解析枠）相対座標 [x, y, w, h] (0.0〜1.0)
let roi = { x: 0.3, y: 0.3, w: 0.4, h: 0.4 };

// ストロボ ＆ 太陽パラメータ
let sunHour = 12;
let flashA = '1/16';
let flashB = '1/32';

/* --- コントロールロジック --- */
function toggleControlPanel() {
  panelOpen = !panelOpen;
  document.getElementById('controlPanel').style.display = panelOpen ? 'block' : 'none';
  document.getElementById('panelArrow').textContent = panelOpen ? '▲ 隠す' : '▼ 展開';
}

function togglePin() {
  isLocked = !isLocked;
  const btn = document.getElementById('btnPin');
  if (isLocked) {
    // 現在のフレームを固定画像としてロック
    fCtx.drawImage(video, 0, 0, GW, GH);
    btn.textContent = '🔒 固定: ON';
    btn.classList.add('active');
  } else {
    btn.textContent = '🔒 固定: OFF';
    btn.classList.remove('active');
  }
}

function toggleGhost() {
  isGhost = !isGhost;
  document.getElementById('btnGhost').classList.toggle('active', isGhost);
}

function toggleTracking() {
  isTracking = !isTracking;
  document.getElementById('btnTracking').classList.toggle('active', isTracking);
}

async function switchCamera() {
  currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
  }
  await startCamera();
}

function setZoom(mode) {
  currentZoom = mode;
  document.getElementById('btnZoomClose').classList.toggle('active', mode === 'close');
  document.getElementById('btnZoomStd').classList.toggle('active', mode === 'std');
  document.getElementById('btnZoomWide').classList.toggle('active', mode === 'wide');

  // ROI（解析枠）の大きさを画角プリセットに連動
  if (mode === 'close') { roi.w = 0.6; roi.h = 0.6; }
  else if (mode === 'std') { roi.w = 0.4; roi.h = 0.4; }
  else if (mode === 'wide') { roi.w = 0.25; roi.h = 0.25; }
  roi.x = Math.max(0, Math.min(1 - roi.w, roi.x));
  roi.y = Math.max(0, Math.min(1 - roi.h, roi.y));
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnModeExp').classList.toggle('active', mode === 'exp');
  document.getElementById('btnModeCol').classList.toggle('active', mode === 'col');
}

function updateSun(val) {
  sunHour = parseInt(val);
  const alt = sunHour <= 12 ? (sunHour - 6) * 15 : (18 - sunHour) * 15;
  document.getElementById('sunVal').textContent = `${sunHour}:00 (太陽高度: 約${alt}°)`;
}

function setFlash(light, val) {
  if (light === 'A') {
    flashA = val;
    document.getElementById('btnFlashA1').classList.toggle('active', val === '1/4');
    document.getElementById('btnFlashA2').classList.toggle('active', val === '1/16');
    document.getElementById('btnFlashA3').classList.toggle('active', val === '1/64');
  } else {
    flashB = val;
    document.getElementById('btnFlashB1').classList.toggle('active', val === 'OFF');
    document.getElementById('btnFlashB2').classList.toggle('active', val === '1/32');
    document.getElementById('btnFlashB3').classList.toggle('active', val === '1/128');
  }
}

// ダブルタップでUI全表示/非表示
window.addEventListener('dblclick', () => {
  uiVisible = !uiVisible;
  document.getElementById('uiLayer').style.opacity = uiVisible ? '1' : '0';
});

// タッチ操作による長押しチラ見 ＆ ROIドラッグ移動
let isDraggingRoi = false;
window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.interactive')) return;
  
  const rect = overlay.getBoundingClientRect();
  const touchX = (e.clientX - rect.left) / rect.width;
  const touchY = (e.clientY - rect.top) / rect.height;

  // ROI枠内をタップした場合はドラッグ移動モード
  if (touchX >= roi.x && touchX <= roi.x + roi.w && touchY >= roi.y && touchY <= roi.y + roi.h) {
    isDraggingRoi = true;
  } else {
    isPressing = true;
  }
});

window.addEventListener('pointermove', (e) => {
  if (isDraggingRoi) {
    const rect = overlay.getBoundingClientRect();
    const touchX = (e.clientX - rect.left) / rect.width;
    const touchY = (e.clientY - rect.top) / rect.height;
    roi.x = Math.max(0, Math.min(1 - roi.w, touchX - roi.w / 2));
    roi.y = Math.max(0, Math.min(1 - roi.h, touchY - roi.h / 2));
  }
});

window.addEventListener('pointerup', () => {
  isPressing = false;
  isDraggingRoi = false;
});

function loadImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const img = new Image();
    img.onload = () => {
      loadedImg = img;
      document.getElementById('thumbImg').src = evt.target.result;
      document.getElementById('thumbImg').style.display = 'block';
      rCtx.drawImage(loadedImg, 0, 0, GW, GH);
      document.getElementById('navBadge').textContent = "長押し中：光・色のズレをヒートマップ表示";
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
  } catch (e) { alert("カメラエラー: " + e.message); }
}

async function startApp() {
  await startCamera();
  document.getElementById('permission').style.display = 'none';
  overlay.width = window.innerWidth;
  overlay.height = window.innerHeight;

  window.addEventListener('resize', () => {
    overlay.width = window.innerWidth;
    overlay.height = window.innerHeight;
  });

  requestAnimationFrame(loop);
}

function loop() {
  const W = overlay.width;
  const H = overlay.height;
  oCtx.clearRect(0, 0, W, H);

  if (video.videoWidth) {
    // 1. ゴースト表示（透過読み込み画像重ね合わせ）
    if (isGhost && loadedImg) {
      oCtx.save();
      oCtx.globalAlpha = 0.35;
      oCtx.drawImage(loadedImg, 0, 0, W, H);
      oCtx.restore();
    }

    // 2. フレームデータのキャプチャ（ロック時は固定画像を使用）
    if (isLocked) {
      cCtx.drawImage(freezeCanvas, 0, 0, GW, GH);
    } else {
      cCtx.drawImage(video, 0, 0, GW, GH);
    }

    const curData = cCtx.getImageData(0, 0, GW, GH).data;

    // 3. 高精度重心トラッキング（自動追尾）
    if (isTracking && !isLocked && !isDraggingRoi) {
      let sumX = 0, sumY = 0, totalW = 0;
      let rx = Math.floor(roi.x * GW), ry = Math.floor(roi.y * GH);
      let rw = Math.floor(roi.w * GW), rh = Math.floor(roi.h * GH);

      for (let y = ry; y < ry + rh && y < GH; y++) {
        for (let x = rx; x < rx + rw && x < GW; x++) {
          let idx = (y * GW + x) * 4;
          let lum = curData[idx] * 0.2126 + curData[idx+1] * 0.7152 + curData[idx+2] * 0.0722;
          sumX += x * lum;
          sumY += y * lum;
          totalW += lum;
        }
      }
      if (totalW > 0) {
        let cx = (sumX / totalW) / GW;
        let cy = (sumY / totalW) / GH;
        roi.x += (cx - (roi.x + roi.w / 2)) * 0.08;
        roi.y += (cy - (roi.y + roi.h / 2)) * 0.08;
        roi.x = Math.max(0, Math.min(1 - roi.w, roi.x));
        roi.y = Math.max(0, Math.min(1 - roi.h, roi.y));
      }
    }

    // 4. ROI（解析枠）の画面描画
    let rxPx = roi.x * W, ryPx = roi.y * H;
    let rwPx = roi.w * W, rhPx = roi.h * H;

    oCtx.strokeStyle = isLocked ? '#ff0055' : '#00e887';
    oCtx.lineWidth = 2;
    oCtx.setLineDash([6, 6]);
    oCtx.strokeRect(rxPx, ryPx, rwPx, rhPx);
    oCtx.setLineDash([]);

    oCtx.fillStyle = isLocked ? '#ff0055' : '#00e887';
    oCtx.font = 'bold 10px monospace';
    oCtx.fillText(isLocked ? "🔒 LOCKED ROI" : "🎯 TRACKING ROI", rxPx + 6, ryPx + 14);

    // 5. ROI領域内の明暗比計算 ＆ パラメータ（太陽・ストロボ）加味
    let maxL = 1, minL = 255;
    let rx = Math.floor(roi.x * GW), ry = Math.floor(roi.y * GH);
    let rw = Math.floor(roi.w * GW), rh = Math.floor(roi.h * GH);

    for (let y = ry; y < ry + rh && y < GH; y++) {
      for (let x = rx; x < rx + rw && x < GW; x++) {
        let idx = (y * GW + x) * 4;
        let lum = curData[idx] * 0.2126 + curData[idx+1] * 0.7152 + curData[idx+2] * 0.0722;
        if (lum > maxL) maxL = lum;
        if (lum < minL) minL = lum;
      }
    }

    // ストロボ・太陽設定による補正係数計算
    let flashFactor = (flashA === '1/4' ? 1.5 : flashA === '1/16' ? 1.2 : 1.0);
    let rawRatio = (maxL / Math.max(1, minL)) * flashFactor;
    let ratio = rawRatio.toFixed(1);
    document.getElementById('ratioVal').textContent = `1 : ${ratio}`;

    let evalStr = "フラット (1:2未満)";
    if (rawRatio >= 5.0) evalStr = "ドラマチック (1:5以上)";
    else if (rawRatio >= 2.5) evalStr = "スタンダード (1:3〜1:4)";
    document.getElementById('evalVal').textContent = `評価: ${evalStr}`;

    // 6. 長押し時：ヒートマップオーバーレイ描画
    if (isPressing && loadedImg) {
      const refData = rCtx.getImageData(0, 0, GW, GH).data;
      const diffImg = oCtx.createImageData(GW, GH);
      const d = diffImg.data;

      let totalLumDiff = 0, totalColorDiff = 0, count = 0;

      for (let i = 0; i < refData.length; i += 4) {
        const rL = refData[i] * 0.2126 + refData[i+1] * 0.7152 + refData[i+2] * 0.0722;
        const cL = curData[i] * 0.2126 + curData[i+1] * 0.7152 + curData[i+2] * 0.0722;
        const lumDiff = cL - rL;
        totalLumDiff += lumDiff;

        const colorDiff = (curData[i] - curData[i+2]) - (refData[i] - refData[i+2]);
        totalColorDiff += colorDiff;
        count++;

        if (currentMode === 'exp') {
          if (lumDiff > 25) { d[i]=255; d[i+1]=120; d[i+2]=0; d[i+3]=180; } // オレンジ
          else if (lumDiff < -25) { d[i]=0; d[i+1]=100; d[i+2]=255; d[i+3]=180; } // ネイビー
          else { d[i]=0; d[i+1]=232; d[i+2]=135; d[i+3]=20; }
        } else {
          if (colorDiff > 20) { d[i]=255; d[i+1]=180; d[i+2]=0; d[i+3]=180; } // アンバー
          else if (colorDiff < -20) { d[i]=0; d[i+1]=220; d[i+2]=255; d[i+3]=180; } // シアン
          else { d[i]=0; d[i+1]=232; d[i+2]=135; d[i+3]=20; }
        }
      }

      const avgLum = totalLumDiff / count;
      const avgCol = totalColorDiff / count;
      let actionText = "";

      if (currentMode === 'exp') {
        if (avgLum < -20) actionText = "⚠️ メイン光不足 ➔ 光量を上げるか近付けてください";
        else if (avgLum > 20) actionText = "⚠️ 光量過剰 ➔ 光量を下げるか離してください";
        else actionText = "✨ 光量はほぼ一致しています！";
      } else {
        if (avgCol < -15) actionText = "⚠️ 冷たすぎ（シアン寄り） ➔ 色温度を上げてください";
        else if (avgCol > 15) actionText = "⚠️ 温かすぎ（アンバー寄り） ➔ 色温度を下げてください";
        else actionText = "✨ 色調（WB）はほぼ一致しています！";
      }
      document.getElementById('navBadge').textContent = actionText;

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = GW; tempCanvas.height = GH;
      tempCanvas.getContext('2d').putImageData(diffImg, 0, 0);

      oCtx.save();
      oCtx.globalCompositeOperation = 'source-over';
      oCtx.drawImage(tempCanvas, 0, 0, W, H);
      oCtx.restore();
    }
  }

  requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick = startApp;
</script>
</body>
</html>
