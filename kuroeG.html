<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>プロ・ライティング・ナビ v13 (全機能統合版)</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",monospace}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#111}
#ghostCanvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none;opacity:0.4;display:none}

.spot-pin{position:fixed;width:30px;height:30px;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%);z-index:4;pointer-events:none;display:none;font-size:10px;font-weight:bold;text-align:center;line-height:26px;box-shadow:0 0 10px rgba(0,0,0,0.5)}
#pinKey{border-color:#00e887;background:rgba(0,232,135,0.3);color:#00e887}
#pinShadow{border-color:#ff9500;background:rgba(255,149,0,0.3);color:#ff9500}

#topIsland{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;z-index:10;display:none;justify-content:space-between;align-items:center}
.island-group{display:flex;gap:6px}
button{background:rgba(20,20,20,0.85);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:8px 12px;border-radius:16px;font-size:11px;font-weight:700;cursor:pointer;backdrop-filter:blur(12px)}
button.primary{background:#00e887;color:#000;border:none}
button.active{background:#ff3b30;color:#fff;border:none}

#dashboard{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:16px;width:calc(100% - 32px);max-width:340px;background:rgba(12,12,12,0.88);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.15);border-radius:18px;padding:12px;z-index:5;display:none;max-height:80vh;overflow-y:auto}

.section-panel{background:rgba(255,255,255,0.05);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.panel-title{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:bold;cursor:pointer}

.slider-container{display:flex;align-items:center;gap:8px;margin-top:6px}
input[type=range]{flex:1;-webkit-appearance:none;background:#333;height:4px;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#ffcc00;cursor:pointer}

/* アコーディオンコンテンツ */
.accordion-body{display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.1)}

.strobe-row{display:flex;flex-direction:column;gap:4px;margin-top:6px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.08)}
.strobe-row:last-child{border-bottom:none;padding-bottom:0}
.strobe-hdr{display:flex;justify-content:space-between;align-items:center;font-size:10px}
.chip-group{display:flex;gap:3px;overflow-x:auto}
.chip{padding:3px 6px;background:rgba(255,255,255,0.1);border-radius:6px;font-size:9px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.chip.active{background:#00e887;color:#000;font-weight:bold}
.sensor-btn{background:rgba(0,232,135,0.2);color:#00e887;border:1px solid #00e887;padding:2px 6px;border-radius:6px;font-size:9px;cursor:pointer}

.dash-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.dash-val{font-size:16px;color:#00e887;font-weight:bold;font-family:monospace}
.dash-label{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px}

#ratioGuide{background:rgba(0,232,135,0.1);border-left:3px solid #00e887;padding:6px 10px;border-radius:0 8px 8px 0;font-size:10px;color:#ddd;margin-top:6px;font-family:monospace}

/* モーダル */
#saveModal, #favModal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-card{width:min(340px,100%);background:#151515;border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.modal-input{background:#222;border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:10px;color:#fff;font-size:13px;width:100%;outline:none}
.fav-list{overflow-y:auto;max-height:50vh;display:flex;flex-direction:column;gap:8px}
.fav-item{background:rgba(255,255,255,0.08);padding:10px;border-radius:10px;font-size:11px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}

#permission{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.95)}
.permission-card{width:min(380px,100%);background:#121212;border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;text-align:center}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="ghostCanvas"></canvas>

<div id="pinKey" class="spot-pin">K</div>
<div id="pinShadow" class="spot-pin">S</div>

<div id="topIsland">
  <button id="saveFavBtn" class="primary">★ Fav保存</button>
  <div class="island-group">
    <button id="ghostToggleBtn">ゴースト: OFF</button>
    <button id="loadFavBtn">一覧</button>
  </div>
</div>

<div id="dashboard">
  <!-- ☀️ 1. 太陽シミュレーター（折りたたみ対応） -->
  <div class="section-panel">
    <div class="panel-title" onclick="toggleAccordion('sunBody', 'sunToggleIcon')">
      <span>☀️ 太陽シミュレーター</span>
      <div>
        <span id="simTimeLabel" style="color:#ffcc00;margin-right:6px">現在時刻</span>
        <span id="sunToggleIcon" style="font-size:10px;color:#00e887">展開▼</span>
      </div>
    </div>
    <div id="sunBody" class="accordion-body">
      <div class="slider-container">
        <span style="font-size:8px;color:#888">6時</span>
        <input type="range" id="timeSlider" min="6" max="18" step="0.5" value="12">
        <span style="font-size:8px;color:#888">18時</span>
      </div>
    </div>
  </div>

  <!-- ⚡ 2. ストロボ設定 & 照射方向（折りたたみ対応） -->
  <div class="section-panel">
    <div class="panel-title" onclick="toggleAccordion('strobeBody', 'strobeToggleIcon')">
      <span>⚡ ストロボ設定 & 照射方向</span>
      <span id="strobeToggleIcon" style="font-size:10px;color:#00e887">展開▼</span>
    </div>

    <div id="strobeBody" class="accordion-body">
      <!-- A灯（メイン） -->
      <div class="strobe-row">
        <div class="strobe-hdr">
          <span style="color:#00e887;font-weight:bold">A灯(メイン)</span>
          <button class="sensor-btn" onclick="fetchSensorDirection('A')">📍 端末向けて方向取得</button>
        </div>
        <div class="strobe-hdr" style="margin-top:2px">
          <span id="strobeA_summary" style="color:#aaa;font-size:9px">出力: 1/4 | 10時(斜前)</span>
        </div>
        <div class="chip-group" id="strobeA_power">
          <div class="chip active" onclick="setStrobe('A','power','1/4',this)">1/4</div>
          <div class="chip" onclick="setStrobe('A','power','1/16',this)">1/16</div>
          <div class="chip" onclick="setStrobe('A','power','1/64',this)">1/64</div>
        </div>
        <div class="chip-group" id="strobeA_dir">
          <div class="chip" onclick="setStrobe('A','dir','12時(正面)',this)">12時</div>
          <div class="chip active" onclick="setStrobe('A','dir','10時(斜前)',this)">10時</div>
          <div class="chip" onclick="setStrobe('A','dir','9時(真横)',this)">9時</div>
          <div class="chip" onclick="setStrobe('A','dir','7時(半逆)',this)">7時</div>
        </div>
      </div>

      <!-- B灯（サブ） -->
      <div class="strobe-row">
        <div class="strobe-hdr">
          <span style="color:#ff9500;font-weight:bold">B灯(サブ)</span>
          <button class="sensor-btn" onclick="fetchSensorDirection('B')">📍 端末向けて方向取得</button>
        </div>
        <div class="strobe-hdr" style="margin-top:2px">
          <span id="strobeB_summary" style="color:#aaa;font-size:9px">出力: 1/32 | 2時(斜前)</span>
        </div>
        <div class="chip-group" id="strobeB_power">
          <div class="chip" onclick="setStrobe('B','power','OFF',this)">OFF</div>
          <div class="chip active" onclick="setStrobe('B','power','1/32',this)">1/32</div>
          <div class="chip" onclick="setStrobe('B','power','1/128',this)">1/128</div>
        </div>
        <div class="chip-group" id="strobeB_dir">
          <div class="chip active" onclick="setStrobe('B','dir','2時(斜前)',this)">2時</div>
          <div class="chip" onclick="setStrobe('B','dir','3時(真横)',this)">3時</div>
          <div class="chip" onclick="setStrobe('B','dir','6時(真後)',this)">6時</div>
        </div>
      </div>
    </div>
  </div>

  <div class="dash-row">
    <div>
      <div class="dash-label">計測/予測 比率</div>
      <div id="valRatio" class="dash-val">1 : ---</div>
    </div>
    <div style="text-align:right">
      <div class="dash-label">2点スポット</div>
      <div id="spotModeText" style="font-size:10px;color:#aaa">タップ：キー指定</div>
    </div>
  </div>

  <div id="ratioGuide">画面タップで明暗2点を比率計測できます。</div>
</div>

<!-- Fav保存モーダル -->
<div id="saveModal">
  <div class="modal-card">
    <div style="font-weight:bold;font-size:14px">ライティングの保存</div>
    <input type="text" id="favNameInput" class="modal-input" placeholder="プリセット名">
    <input type="text" id="favMemoInput" class="modal-input" placeholder="メモ">
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:5px">
      <button onclick="document.getElementById('saveModal').style.display='none'" style="background:#333">キャンセル</button>
      <button id="confirmSaveBtn" class="primary">保存する</button>
    </div>
  </div>
</div>

<!-- Fav一覧モーダル -->
<div id="favModal">
  <div class="modal-card">
    <div style="font-weight:bold;font-size:14px">保存データ</div>
    <div class="fav-list" id="favListContainer"></div>
    <button onclick="document.getElementById('favModal').style.display='none'" style="background:#333;margin-top:5px">閉じる</button>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">プロ・ライティング・ナビ v13</div>
    <div style="font-size:12px;color:#aaa;margin-bottom:20px">太陽予測 ＋ ストロボ（センサー付）を必要に応じて展開可能。</div>
    <button id="startBtn" class="primary" style="width:100%;padding:14px;border-radius:14px;font-weight:bold">利用を開始</button>
  </div>
</div>

<script>
const video = document.getElementById('camera');
const ghostCanvas = document.getElementById('ghostCanvas');
const ghostCtx = ghostCanvas.getContext('2d');
const pinKey = document.getElementById('pinKey');
const pinShadow = document.getElementById('pinShadow');
const timeSlider = document.getElementById('timeSlider');

let canvas = document.createElement('canvas');
let ctx = canvas.getContext('2d', {willReadFrequently: true});

let spotStep = 0;
let keyPos = null, shadowPos = null;
let keyLum = 0, shadowLum = 0;

let favorites = JSON.parse(localStorage.getItem('kuroko_favs_v13') || '[]');
let showGhost = false;

let strobeState = {
  A: { power: '1/4', dir: '10時(斜前)' },
  B: { power: '1/32', dir: '2時(斜前)' }
};

// パネル開閉コントロール
function toggleAccordion(bodyId, iconId) {
  const body = document.getElementById(bodyId);
  const icon = document.getElementById(iconId);
  const isOpen = body.style.display === 'block';
  body.style.display = isOpen ? 'none' : 'block';
  icon.textContent = isOpen ? '展開▼' : '閉じる▲';
}

function setStrobe(light, prop, val, el) {
  strobeState[light][prop] = val;
  if(el) {
    const parent = el.parentElement;
    parent.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }
  document.getElementById(`strobe${light}_summary`).textContent = 
    `出力: ${strobeState[light].power} | ${strobeState[light].dir}`;
}

// センサーによる方位自動取得
async function fetchSensorDirection(light) {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') { alert("センサーの利用許可が必要です"); return; }
    } catch(e){}
  }

  const handler = (e) => {
    let heading = e.webkitCompassHeading || (360 - e.alpha);
    if (heading !== undefined && !isNaN(heading)) {
      let clockHour = Math.round(heading / 30) % 12;
      if (clockHour === 0) clockHour = 12;
      
      const dirStr = `${clockHour}時方向(${Math.round(heading)}°)`;
      setStrobe(light, 'dir', dirStr, null);
      alert(`${light}灯の照射方向を [${dirStr}] として自動設定しました`);
      window.removeEventListener('deviceorientation', handler);
    }
  };
  window.addEventListener('deviceorientation', handler);
}

const nowHours = new Date().getHours() + new Date().getMinutes()/60;
timeSlider.value = Math.max(6, Math.min(18, nowHours));

async function startApp() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    document.getElementById('permission').style.display = 'none';
    document.getElementById('topIsland').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'block';

    await video.play().catch(()=>{});
    requestAnimationFrame(loop);
  } catch (err) {
    alert("起動失敗: " + err.message);
  }
}

document.body.onclick = (e) => {
  if(e.target.closest('#topIsland, #dashboard, #saveModal, #favModal, #permission')) return;
  const x = e.clientX, y = e.clientY;

  if (spotStep === 0 || spotStep === 2) {
    keyPos = {x, y};
    pinKey.style.left = x + 'px'; pinKey.style.top = y + 'px';
    pinKey.style.display = 'block'; pinShadow.style.display = 'none';
    shadowPos = null; spotStep = 1;
    document.getElementById('spotModeText').textContent = "タップ：シャドウ指定";
  } else if (spotStep === 1) {
    shadowPos = {x, y};
    pinShadow.style.left = x + 'px'; pinShadow.style.top = y + 'px';
    pinShadow.style.display = 'block'; spotStep = 2;
    document.getElementById('spotModeText').textContent = "タップで再計測";
  }
};

function getLumAtPos(pos) {
  if(!pos || !video.videoWidth) return 0;
  const rx = (pos.x / window.innerWidth) * canvas.width;
  const ry = (pos.y / window.innerHeight) * canvas.height;
  const imgData = ctx.getImageData(Math.max(0, rx-5), Math.max(0, ry-5), 10, 10).data;
  let sum = 0;
  for(let i=0; i<imgData.length; i+=4) {
    sum += (imgData[i] * 0.2126 + imgData[i+1] * 0.7152 + imgData[i+2] * 0.0722);
  }
  return sum / (imgData.length / 4);
}

function loop() {
  if(!video.videoWidth) { requestAnimationFrame(loop); return; }

  canvas.width = 160; canvas.height = 90;
  ctx.drawImage(video, 0, 0, 160, 90);

  // 太陽時刻表示の更新
  const selectedHour = parseFloat(timeSlider.value);
  const hStr = Math.floor(selectedHour).toString().padStart(2, '0');
  const mStr = (selectedHour % 1 === 0 ? '00' : '30');
  document.getElementById('simTimeLabel').textContent = `${hStr}:${mStr}`;

  if (keyPos) keyLum = getLumAtPos(keyPos);
  if (shadowPos) shadowLum = getLumAtPos(shadowPos);

  const guideEl = document.getElementById('ratioGuide');
  const ratioValEl = document.getElementById('valRatio');

  if (spotStep === 2 && shadowLum > 0) {
    const currentRatio = Math.max(1, (keyLum / shadowLum)).toFixed(1);
    ratioValEl.textContent = `1 : ${currentRatio}`;
    guideEl.innerHTML = `<b>[計測 1:${currentRatio}]</b><br>配置メモ：A[${strobeState.A.dir} / ${strobeState.A.power}] B[${strobeState.B.dir} / ${strobeState.B.power}]`;
  } else {
    ratioValEl.textContent = "1 : ---";
    guideEl.innerHTML = `時刻(${hStr}:${mStr}) / A[${strobeState.A.dir}] B[${strobeState.B.dir}]。タップで2点計測。`;
  }

  requestAnimationFrame(loop);
}

// Fav保存
document.getElementById('saveFavBtn').onclick = () => {
  const h = document.getElementById('simTimeLabel').textContent;
  document.getElementById('favNameInput').value = `太陽(${h}) / A:${strobeState.A.dir}`;
  document.getElementById('favMemoInput').value = "";
  document.getElementById('saveModal').style.display = 'flex';
};

document.getElementById('confirmSaveBtn').onclick = () => {
  const snapCanvas = document.createElement('canvas');
  snapCanvas.width = 320; snapCanvas.height = 180;
  snapCanvas.getContext('2d').drawImage(video, 0, 0, 320, 180);

  const newFav = {
    id: Date.now(),
    name: document.getElementById('favNameInput').value.trim(),
    memo: document.getElementById('favMemoInput').value.trim(),
    ratio: document.getElementById('valRatio').textContent,
    strobe: JSON.parse(JSON.stringify(strobeState)),
    image: snapCanvas.toDataURL('image/jpeg', 0.6)
  };

  favorites.push(newFav);
  localStorage.setItem('kuroko_favs_v13', JSON.stringify(favorites));
  document.getElementById('saveModal').style.display = 'none';
};

document.getElementById('loadFavBtn').onclick = () => {
  const container = document.getElementById('favListContainer');
  container.innerHTML = '';
  if (favorites.length === 0) {
    container.innerHTML = '<div style="color:#777;text-align:center;padding:20px">保存データなし</div>';
  } else {
    favorites.forEach(fav => {
      const div = document.createElement('div');
      div.className = 'fav-item';
      const stStr = fav.strobe ? `<br><small style="color:#00e887">A:${fav.strobe.A.dir}(${fav.strobe.A.power}) / B:${fav.strobe.B.dir}(${fav.strobe.B.power})</small>` : '';
      div.innerHTML = `<span><b>${fav.name}</b> (${fav.ratio})${stStr}</span><button style="font-size:10px;padding:4px 8px">適用</button>`;
      div.onclick = () => {
        loadGhostImage(fav.image);
        document.getElementById('favModal').style.display = 'none';
      };
      container.appendChild(div);
    });
  }
  document.getElementById('favModal').style.display = 'flex';
};

function loadGhostImage(src) {
  const img = new Image();
  img.onload = () => {
    ghostCanvas.width = window.innerWidth;
    ghostCanvas.height = window.innerHeight;
    ghostCtx.drawImage(img, 0, 0, ghostCanvas.width, ghostCanvas.height);
    showGhost = true;
    ghostCanvas.style.display = 'block';
    document.getElementById('ghostToggleBtn').textContent = "ゴースト: ON";
    document.getElementById('ghostToggleBtn').className = "active";
  };
  img.src = src;
}

document.getElementById('ghostToggleBtn').onclick = () => {
  showGhost = !showGhost;
  ghostCanvas.style.display = showGhost ? 'block' : 'none';
  document.getElementById('ghostToggleBtn').textContent = showGhost ? "ゴースト: ON" : "ゴースト: OFF";
  document.getElementById('ghostToggleBtn').className = showGhost ? "active" : "";
};

document.getElementById('startBtn').onclick = startApp;
</script>
</body>
</html>
