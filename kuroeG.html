<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>プロ・ライティング・ナビ v42 (露出精度改善版)</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",monospace}

#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#overlayCanvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none}

.ui-layer{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)) 12px;transition:opacity 0.2s}
.interactive{pointer-events:auto}

.top-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{background:rgba(20,20,20,0.85);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:6px 9px;border-radius:14px;font-size:10px;font-weight:700;cursor:pointer;backdrop-filter:blur(12px);touch-action:auto}
button.active{background:#00e887;color:#000;border:none}
button.primary{background:#00e887;color:#000;border:none;font-weight:800}

#controlPanel{background:rgba(18,18,18,0.95);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:12px;margin-top:8px;width:min(360px,100%);backdrop-filter:blur(16px);max-height:65vh;overflow-y:auto}
.panel-header{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:bold;margin-bottom:8px;cursor:pointer}
.panel-section{border-top:1px solid rgba(255,255,255,0.1);padding-top:8px;margin-top:8px}

/* モード切替タブ (ロケーション/スタジオ) */
.env-selector-tabs{display:flex;gap:6px;margin-bottom:8px}
.env-btn{flex:1;padding:6px;font-size:10px;font-weight:bold;border-radius:8px;border:1px solid #444;background:#222;color:#888;text-align:center;cursor:pointer}
.env-btn.selected-sun{background:rgba(255,180,0,0.2);color:#ffb400;border-color:#ffb400}
.env-btn.selected-studio{background:rgba(0,232,135,0.2);color:#00e887;border-color:#00e887}

/* 灯具選択タブ */
.light-selector-tabs{display:flex;gap:6px;margin-bottom:8px}
.tab-btn{flex:1;padding:6px;font-size:10px;font-weight:bold;border-radius:8px;border:1px solid #444;background:#222;color:#888;text-align:center;cursor:pointer}
.tab-btn.selected-a{background:rgba(0,232,135,0.2);color:#00e887;border-color:#00e887}
.tab-btn.selected-b{background:rgba(0,191,255,0.2);color:#00bfff;border-color:#00bfff}

/* 8方向ダイアル */
.light-setup-container{display:flex;gap:12px;align-items:center;margin-top:4px}
.pos-map{width:84px;height:84px;border-radius:50%;border:1px dashed rgba(255,255,255,0.3);position:relative;background:rgba(0,0,0,0.4);flex-shrink:0}
.pos-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8px;color:#aaa}
.pos-btn{position:absolute;width:18px;height:18px;border-radius:50%;border:1px solid #666;background:#222;font-size:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transform:translate(-50%,-50%);transition:all 0.15s}
.pos-btn.active-a{background:#00e887;color:#000;border:none;font-weight:bold;scale:1.2;box-shadow:0 0 8px #00e887}
.pos-btn.active-b{background:#00bfff;color:#000;border:none;font-weight:bold;scale:1.2;box-shadow:0 0 8px #00bfff}

.light-ctrl{flex:1;display:flex;flex-direction:column;gap:6px}
.light-row{display:flex;align-items:center;justify-content:space-between;font-size:10px}
.light-select{background:#222;color:#fff;border:1px solid #555;border-radius:6px;padding:2px 4px;font-size:10px}

.bottom-area{display:flex;flex-direction:column;gap:6px;width:100%}
.preset-bar{display:flex;gap:4px;background:rgba(10,10,10,0.8);padding:4px;border-radius:12px;backdrop-filter:blur(10px)}
.preset-btn{flex:1;padding:5px 0;font-size:9px;text-align:center;border-radius:8px;border:none;background:transparent;color:#aaa;transition:all 0.2s}
.preset-btn.active{background:#00e887;color:#000;font-weight:800}

.ratio-bar{background:rgba(10,10,10,0.88);border:1px solid rgba(255,255,255,0.18);border-radius:14px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(12px)}
.ratio-info{font-size:11px;font-weight:bold;color:#aaa}
.ratio-val{color:#fff;font-size:12px;font-weight:bold;margin-left:4px;transition:color 0.2s}
.eval-badge{font-size:10px;font-weight:bold;padding:4px 8px;border-radius:8px;background:rgba(0,232,135,0.2);color:#00e887;border:1px solid rgba(0,232,135,0.4);transition:all 0.2s}

.action-card{background:rgba(15,15,15,0.92);border:1px solid rgba(0,232,135,0.5);border-radius:14px;padding:8px 12px;font-size:11px;font-weight:bold;color:#00e887;backdrop-filter:blur(12px);transition:all 0.2s}
.action-card.flash{animation:cardPulse 0.3s ease-out}

@keyframes cardPulse{
  0%{transform:scale(1);box-shadow:0 0 0px #00e887}
  50%{transform:scale(1.02);box-shadow:0 0 18px #00e887}
  100%{transform:scale(1);box-shadow:0 0 0px #00e887}
}

.bottom-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
#navBadge{background:rgba(0,0,0,0.85);border:1px solid rgba(255,255,255,0.2);color:#ccc;padding:8px 12px;border-radius:14px;font-size:10px;font-weight:bold;flex:1}
#thumbCard{width:60px;height:75px;border-radius:12px;border:2px solid #00e887;overflow:hidden;background:#111;flex-shrink:0}
#thumbImg{width:100%;height:100%;object-fit:cover}

#permission{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.95)}
.permission-card{width:min(380px,100%);background:#121212;border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:24px;text-align:center}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="overlayCanvas"></canvas>

<div class="ui-layer" id="uiLayer">
  <div>
    <div class="top-bar interactive">
      <button class="primary" onclick="document.getElementById('fileInput').click()">📷 写真読込</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
      
      <button id="btnPin" onclick="togglePin()">🔒 固定: OFF</button>
      <button id="btnGhost" onclick="toggleGhost()">👻 ゴースト</button>
      <button id="btnFlip" onclick="switchCamera()">📷 転換</button>
      <button id="btnTracking" class="active" onclick="toggleTracking()">🎯 W追尾</button>
      <button id="btnTogglePanel" onclick="toggleControlPanel()">⚙️ 設定</button>

      <div style="display:flex;gap:2px">
        <button id="btnZoomClose" onclick="setZoom('close')">寄</button>
        <button id="btnZoomStd" class="active" onclick="setZoom('std')">標準</button>
        <button id="btnZoomWide" onclick="setZoom('wide')">引</button>
      </div>

      <div style="display:flex;gap:2px;margin-left:auto">
        <button id="btnModeExp" class="active" onclick="setMode('exp')">EV</button>
        <button id="btnModeCol" onclick="setMode('col')">WB</button>
      </div>
    </div>

    <!-- コントロールパネル -->
    <div id="controlPanel" class="interactive" style="display:none">
      <div class="panel-header" onclick="toggleControlPanel()">
        <span>📐 ライティング＆解析設定</span>
        <span id="panelArrow">▲ 隠す</span>
      </div>

      <!-- 環境設定 (ロケーション vs スタジオ) -->
      <div class="panel-section">
        <div style="font-size:10px;color:#aaa;font-weight:bold;margin-bottom:6px">🌐 撮影環境の選択</div>
        <div class="env-selector-tabs">
          <div class="env-btn" id="btnEnvSun" onclick="setEnvironmentMode('sun')">☀️ 屋外/窓光あり</div>
          <div class="env-btn selected-studio" id="btnEnvStudio" onclick="setEnvironmentMode('studio')">🎬 スタジオ (太陽OFF)</div>
        </div>

        <div id="sunContainer" style="display:none;margin-top:6px">
          <div style="font-size:10px;color:#ffb400;font-weight:bold">☀️ 太陽シミュレーター</div>
          <input type="range" min="6" max="18" value="12" id="sunSlider" style="width:100%" oninput="updateSun(this.value)">
          <div style="font-size:9px;color:#888;text-align:right" id="sunVal">12:00 (太陽高度: 天頂)</div>
        </div>
      </div>

      <div class="panel-section">
        <div style="font-size:10px;color:#00e887;font-weight:bold;margin-bottom:6px">⚡ ストロボ配置 ＆ 光量設定</div>
        
        <!-- 操作対象の明示的選択タブ -->
        <div class="light-selector-tabs">
          <div class="tab-btn selected-a" id="tabLightA" onclick="setActiveTarget('A')">🟢 A灯を配置操作</div>
          <div class="tab-btn" id="tabLightB" onclick="setActiveTarget('B')">🔵 B灯を配置操作</div>
        </div>

        <div class="light-setup-container">
          <div class="pos-map">
            <div class="pos-center">被写体</div>
            <div class="pos-btn" id="p-front" style="top:10%;left:50%" onclick="setLightPos('front')">前</div>
            <div class="pos-btn" id="p-front-right" style="top:20%;left:80%" onclick="setLightPos('front-right')">右前</div>
            <div class="pos-btn" id="p-right" style="top:50%;left:90%" onclick="setLightPos('right')">右</div>
            <div class="pos-btn" id="p-back-right" style="top:80%;left:80%" onclick="setLightPos('back-right')">右後</div>
            <div class="pos-btn" id="p-back" style="top:90%;left:50%" onclick="setLightPos('back')">後</div>
            <div class="pos-btn" id="p-back-left" style="top:80%;left:20%" onclick="setLightPos('back-left')">左後</div>
            <div class="pos-btn" id="p-left" style="top:50%;left:10%" onclick="setLightPos('left')">左</div>
            <div class="pos-btn" id="p-front-left" style="top:20%;left:20%" onclick="setLightPos('front-left')">左前</div>
          </div>

          <div class="light-ctrl">
            <div class="light-row">
              <span style="color:#00e887;font-weight:bold">A灯 (メイン):</span>
              <select class="light-select" id="selFlashA" onchange="onSettingChanged('A', this.value)">
                <option value="OFF">OFF</option>
                <option value="1/1" selected>1/1 (FULL)</option>
                <option value="1/2">1/2</option>
                <option value="1/4">1/4</option>
                <option value="1/8">1/8</option>
                <option value="1/16">1/16</option>
                <option value="1/32">1/32</option>
                <option value="1/64">1/64</option>
                <option value="1/128">1/128</option>
              </select>
            </div>
            <div style="font-size:8px;color:#aaa">配置: <span id="posLabelA">右後 (135°)</span></div>

            <div class="light-row" style="margin-top:6px">
              <span style="color:#00bfff;font-weight:bold">B灯 (サブ):</span>
              <select class="light-select" id="selFlashB" onchange="onSettingChanged('B', this.value)">
                <option value="OFF" selected>OFF</option>
                <option value="1/1">1/1 (FULL)</option>
                <option value="1/2">1/2</option>
                <option value="1/4">1/4</option>
                <option value="1/8">1/8</option>
                <option value="1/16">1/16</option>
                <option value="1/32">1/32</option>
                <option value="1/64">1/64</option>
                <option value="1/128">1/128</option>
              </select>
            </div>
            <div style="font-size:8px;color:#aaa">配置: <span id="posLabelB">右 (90°)</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-area">
    <div class="preset-bar interactive">
      <button class="preset-btn" id="p-flat" onclick="setPreset('flat')">EC・カタログ (1:1.5)</button>
      <button class="preset-btn" id="p-portrait" onclick="setPreset('portrait')">ポートレート (1:3.0)</button>
      <button class="preset-btn active" id="p-dramatic" onclick="setPreset('dramatic')">ドラマチック (1:5.0)</button>
    </div>

    <div class="ratio-bar interactive">
      <div class="ratio-info">明暗比: <span id="ratioVal" class="ratio-val">1 : 1.0</span></div>
      <div id="evalVal" class="eval-badge">解析中...</div>
    </div>

    <div id="actionCard" class="action-card interactive">💡 ACTION: 解析準備中...</div>

    <div class="bottom-bar">
      <div id="navBadge" class="interactive">長押し：差分表示 | Wタップ：UI全消去</div>
      <div id="thumbCard" class="interactive"><img id="thumbImg" src="" style="display:none"></div>
    </div>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">プロ・ライティング・ナビ v42</div>
    <div style="font-size:12px;color:#aaa;margin-bottom:20px">高精度逆ガンマ算出＆自動露出同期モード搭載</div>
    <button id="startBtn" class="primary" style="width:100%;padding:14px;border-radius:14px;font-weight:bold">利用を開始</button>
  </div>
</div>
<script>
// ==========================================
// 1. 変数定義・アプリケーション状態管理
// ==========================================
const video = document.getElementById('camera');
const canvas = document.getElementById('overlayCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

// 解析用オフスクリーンCanvas
const offCanvas = document.createElement('canvas');
const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

// トラッキング用W（ハイライト/シャドー）データ
let hlPoint = { x: 0, y: 0, val: 0, targetX: 0, targetY: 0 };
let sdPoint = { x: 0, y: 0, val: 0, targetX: 0, targetY: 0 };
let isTrackingActive = true;

// 画面制御・状態パラメータ
let currentFacingMode = 'environment';
let isPinned = false;
let pinnedImageData = null;
let isGhostActive = false;
let ghostImage = null;
let displayMode = 'exp'; // 'exp' (EV差分) | 'col' (WB色温度)
let envMode = 'studio';  // 'studio' | 'sun'
let sunHour = 12;

// ライト（A灯・B灯）設定状態
let activeTargetLight = 'A'; // 'A' or 'B'
let flashA = '1/1';
let flashB = 'OFF';
let lightPosA = 'back-right'; // 初期値: 右後 (135°)
let lightPosB = 'right';      // 初期値: 右 (90°)

// ターゲット目標プリセット
let currentPreset = 'dramatic'; // 'flat' | 'portrait' | 'dramatic'
const presetRatioMap = {
  flat: 1.5,
  portrait: 3.0,
  dramatic: 5.0
};

// 光量値換算テーブル（1/1 = 1.0 〜 1/128 = 0.0078, OFF = 0.0）
const flashValueMap = {
  'OFF': 0.0,
  '1/1': 1.0,
  '1/2': 0.5,
  '1/4': 0.25,
  '1/8': 0.125,
  '1/16': 0.0625,
  '1/32': 0.03125,
  '1/64': 0.015625,
  '1/128': 0.0078125
};

// 位置方向マップ（度数表記およびラベル）
const posAngleMap = {
  'front': { deg: 0, label: '正面 (0°)' },
  'front-right': { deg: 45, label: '右前 (45°)' },
  'right': { deg: 90, label: '右 (90°)' },
  'back-right': { deg: 135, label: '右後 (135°)' },
  'back': { deg: 180, label: '真後 (180°)' },
  'back-left': { deg: 225, label: '左後 (225°)' },
  'left': { deg: 270, label: '左 (270°)' },
  'front-left': { deg: 315, label: '左前 (315°)' }
};

// 長押し・マルチタップ検出用変数
let isLongPressing = false;
let longPressTimer = null;
let lastTapTime = 0;
let isUiHidden = false;

// ==========================================
// 2. 初期化 ＆ カメラ起動処理
// ==========================================
document.getElementById('startBtn').addEventListener('click', async () => {
  document.getElementById('permission').style.display = 'none';
  await startCamera();
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  requestAnimationFrame(loop);
});

// 自動露出（AE）調整制御を試みるカメラ起動
async function startCamera() {
  try {
    const constraints = {
      video: {
        facingMode: currentFacingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 },
        // 利用可能デバイスで自動露出の補正振れ幅を制御する拡張プロパティ
        advanced: [{ exposureMode: 'continuous' }]
      }
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    console.warn("標準カメラ起動失敗。フォールバックで再試行:", e);
    try {
      const fallbackStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacingMode }
      });
      video.srcObject = fallbackStream;
      await video.play();
    } catch (err) {
      alert("カメラの起動に失敗しました: " + err.message);
    }
  }
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  offCanvas.width = 160; // 高速ピクセル解析用（軽量化）
  offCanvas.height = Math.round(160 * (window.innerHeight / window.innerWidth));
}

// カメラ前後反転
async function switchCamera() {
  currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
  }
  await startCamera();
}

// ==========================================
// 3. UIインタラクション・イベントハンドラ
// ==========================================

// コントロールパネル開閉
function toggleControlPanel() {
  const panel = document.getElementById('controlPanel');
  const arrow = document.getElementById('panelArrow');
  if (panel.style.display === 'none') {
    panel.style.display = 'block';
    arrow.textContent = '▲ 隠す';
  } else {
    panel.style.display = 'none';
    arrow.textContent = '⚙️ 設定';
  }
}

// 操作対象ライト設定（A灯/B灯）
function setActiveTarget(target) {
  activeTargetLight = target;
  document.getElementById('tabLightA').className = 'tab-btn' + (target === 'A' ? ' selected-a' : '');
  document.getElementById('tabLightB').className = 'tab-btn' + (target === 'B' ? ' selected-b' : '');
  updatePosDialUI();
}

// 8方向ダイアルUI更新
function updatePosDialUI() {
  const currentPos = (activeTargetLight === 'A') ? lightPosA : lightPosB;
  const activeClass = (activeTargetLight === 'A') ? 'active-a' : 'active-b';

  Object.keys(posAngleMap).forEach(key => {
    const btn = document.getElementById('p-' + key);
    if (btn) {
      btn.className = 'pos-btn' + (key === currentPos ? ' ' + activeClass : '');
    }
  });
}

// ライト配置設定
function setLightPos(posKey) {
  if (activeTargetLight === 'A') {
    lightPosA = posKey;
    document.getElementById('posLabelA').textContent = posAngleMap[posKey].label;
  } else {
    lightPosB = posKey;
    document.getElementById('posLabelB').textContent = posAngleMap[posKey].label;
  }
  updatePosDialUI();
}

// 光量ドロップダウン選択変更
function onSettingChanged(light, val) {
  if (light === 'A') flashA = val;
  if (light === 'B') flashB = val;
}

// 撮影環境設定（スタジオ / 屋外）
function setEnvironmentMode(mode) {
  envMode = mode;
  document.getElementById('btnEnvSun').className = 'env-btn' + (mode === 'sun' ? ' selected-sun' : '');
  document.getElementById('btnEnvStudio').className = 'env-btn' + (mode === 'studio' ? ' selected-studio' : '');
  document.getElementById('sunContainer').style.display = (mode === 'sun') ? 'block' : 'none';
}

function updateSun(val) {
  sunHour = parseFloat(val);
  document.getElementById('sunVal').textContent = `${val}:00 (太陽高度換算)`;
}

// ターゲットプリセット切替
function setPreset(presetKey) {
  currentPreset = presetKey;
  ['flat', 'portrait', 'dramatic'].forEach(p => {
    const btn = document.getElementById('p-' + p);
    if (btn) btn.className = 'preset-btn' + (p === presetKey ? ' active' : '');
  });
}

// モード切替（EV / WB）
function setMode(m) {
  displayMode = m;
  document.getElementById('btnModeExp').className = (m === 'exp') ? 'active' : '';
  document.getElementById('btnModeCol').className = (m === 'col') ? 'active' : '';
}

// W追尾ON/OFF
function toggleTracking() {
  isTrackingActive = !isTrackingActive;
  const btn = document.getElementById('btnTracking');
  btn.className = isTrackingActive ? 'active' : '';
}

// 固定（ピン留め）処理
function togglePin() {
  isPinned = !isPinned;
  const btn = document.getElementById('btnPin');
  if (isPinned) {
    btn.className = 'active';
    btn.textContent = '🔒 固定: ON';
    // 現在のCanvas描画結果をキャッシュ
    pinnedImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  } else {
    btn.className = '';
    btn.textContent = '🔒 固定: OFF';
    pinnedImageData = null;
  }
}

// ゴーストオーバーレイ
function toggleGhost() {
  isGhostActive = !isGhostActive;
  const btn = document.getElementById('btnGhost');
  if (isGhostActive) {
    btn.className = 'active';
    // 現在の画面をゴースト画像として一時キャプチャ
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = video.videoWidth || 640;
    tempCanvas.height = video.videoHeight || 480;
    const tCtx = tempCanvas.getContext('2d');
    tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
    ghostImage = new Image();
    ghostImage.src = tempCanvas.toDataURL('image/png');
  } else {
    btn.className = '';
    ghostImage = null;
  }
}

// クロップ・ズーム切替
function setZoom(level) {
  ['Close', 'Std', 'Wide'].forEach(l => {
    const btn = document.getElementById('btnZoom' + l);
    if (btn) btn.className = '';
  });
  if (level === 'close') {
    document.getElementById('btnZoomClose').className = 'active';
    video.style.transform = 'scale(1.4)';
  } else if (level === 'std') {
    document.getElementById('btnZoomStd').className = 'active';
    video.style.transform = 'scale(1.0)';
  } else if (level === 'wide') {
    document.getElementById('btnZoomWide').className = 'active';
    video.style.transform = 'scale(0.85)';
  }
}

// 画像ファイルの読み込み処理
function loadImage(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      // サムネイルにセット
      const thumb = document.getElementById('thumbImg');
      thumb.src = e.target.result;
      thumb.style.display = 'block';

      // ゴースト用画像として同時に読み込み設定
      ghostImage = img;
      isGhostActive = true;
      document.getElementById('btnGhost').className = 'active';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 長押し・タップによるUI隠し処理のセットアップ
window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.interactive')) return;
  isLongPressing = true;
  longPressTimer = setTimeout(() => {
    if (isLongPressing) {
      // 長押しで差分ヒートマップを強調表示
      document.body.classList.add('diff-boost');
    }
  }, 400);
});

window.addEventListener('pointerup', () => {
  isLongPressing = false;
  clearTimeout(longPressTimer);
  document.body.classList.remove('diff-boost');
});

// 画面ダブルタップでUI一括トグル
window.addEventListener('click', (e) => {
  if (e.target.closest('.interactive')) return;
  const now = Date.now();
  if (now - lastTapTime < 300) {
    isUiHidden = !isUiHidden;
    document.getElementById('uiLayer').style.opacity = isUiHidden ? '0' : '1';
    document.getElementById('uiLayer').style.pointerEvents = isUiHidden ? 'none' : 'auto';
  }
  lastTapTime = now;
});
</script>
<script>
// ==========================================
// 4. 解析計算エンジン (逆ガンマ物理換算 & 比率計算)
// ==========================================

/**
 * 8bit sRGB輝度 (0〜255) を物理光量 (Linear RGB) に変換
 * 逆ガンマ処理: L_linear = (L_sRGB / 255) ^ 2.2
 */
function byteToLinear(byteVal) {
  const norm = Math.max(byteVal, 1.0) / 255.0;
  return Math.pow(norm, 2.2);
}

/**
 * トラッキング位置の決定と逆ガンマ物理光量に基づく明暗比の算出
 */
function analyzeFrame() {
  if (!video.videoWidth || !video.videoHeight) return { ratio: 1.0, maxL: 255, minL: 0 };

  // オフスクリーンCanvasに描画して高速ピクセル解析
  offCtx.drawImage(video, 0, 0, offCanvas.width, offCanvas.height);
  const frameData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
  const data = frameData.data;
  const w = offCanvas.width;
  const h = offCanvas.height;

  let maxLuma = -1;
  let minLuma = 256;
  let maxPos = { x: w / 2, y: h / 3 };
  let minPos = { x: w / 2, y: (h / 3) * 2 };

  // ピクセル走査（輝度計算: Rec.709）
  for (let y = 0; y < h; y += 2) {
    for (let x = 0; x < w; x += 2) {
      const idx = (y * w + x) * 4;
      const r = data[idx];
      const g = data[idx + 1];
      const b = data[idx + 2];
      
      // 輝度（Luma）算出
      const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;

      if (luma > maxLuma) {
        maxLuma = luma;
        maxPos = { x, y };
      }
      if (luma < minLuma) {
        minLuma = luma;
        minPos = { x, y };
      }
    }
  }

  // スクリーン座標系へのスケーリング
  const scaleX = canvas.width / w;
  const scaleY = canvas.height / h;

  // 慣性追尾（スムージングフィルタ: 補間率 0.25）
  hlPoint.targetX = maxPos.x * scaleX;
  hlPoint.targetY = maxPos.y * scaleY;
  sdPoint.targetX = minPos.x * scaleX;
  sdPoint.targetY = minPos.y * scaleY;

  hlPoint.x += (hlPoint.targetX - hlPoint.x) * 0.25;
  hlPoint.y += (hlPoint.targetY - hlPoint.y) * 0.25;
  sdPoint.x += (sdPoint.targetX - sdPoint.x) * 0.25;
  sdPoint.y += (sdPoint.targetY - sdPoint.y) * 0.25;

  hlPoint.val = maxLuma;
  sdPoint.val = minLuma;

  // --------------------------------------------------
  // 【重要修正】逆ガンマ（リニア化）による実測明暗比の算定
  // --------------------------------------------------
  const linHL = byteToLinear(maxLuma);
  const linSD = byteToLinear(minLuma);

  // カメラ映像から直接取得された物理光量比（実測値）
  const measuredRatio = linHL / Math.max(linSD, 0.0001);

  // UI上の設定（A灯・B灯）から算出される理論補正
  const pA = flashValueMap[flashA] || 0.0;
  const pB = flashValueMap[flashB] || 0.0;

  // スタジオモード時は映像の実測値をダイレクト採用、屋外モードでは太陽光モデルを加味
  let calculatedRatio = measuredRatio;

  if (envMode === 'sun') {
    // 太陽高度に基づく補正（12時が最大光量）
    const sunFactor = Math.sin(((sunHour - 6) / 12) * Math.PI);
    const envEffect = Math.max(0.2, sunFactor * 1.5);
    calculatedRatio = measuredRatio * (1.0 + (pA + pB) * 0.5) * envEffect;
  }

  return {
    ratio: Math.max(1.0, calculatedRatio),
    maxL: maxLuma,
    minL: minLuma
  };
}

// ==========================================
// 5. アクション誘導 ＆ 評価ロジック
// ==========================================
function updateActionUI(ratio) {
  const targetRatio = presetRatioMap[currentPreset];
  const diff = ratio - targetRatio;

  const ratioElem = document.getElementById('ratioVal');
  const evalElem = document.getElementById('evalVal');
  const actionElem = document.getElementById('actionCard');

  ratioElem.textContent = `1 : ${ratio.toFixed(1)}`;

  // 許容誤差 ±0.5 以内
  if (Math.abs(diff) <= 0.5) {
    evalElem.textContent = '適正 (TARGET MATCH)';
    evalElem.style.background = 'rgba(0,232,135,0.2)';
    evalElem.style.color = '#00e887';
    evalElem.style.borderColor = 'rgba(0,232,135,0.4)';

    actionElem.textContent = `✨ 理想的なライティングです！ (${currentPreset.toUpperCase()} 達成)`;
    actionElem.style.borderColor = '#00e887';
    actionElem.style.color = '#00e887';
  } else if (diff < -0.5) {
    // コントラスト不足（フラットすぎる）
    evalElem.textContent = 'フラット (LOW CONTRAST)';
    evalElem.style.background = 'rgba(0,191,255,0.2)';
    evalElem.style.color = '#00bfff';
    evalElem.style.borderColor = 'rgba(0,191,255,0.4)';

    const recAction = (activeTargetLight === 'A') 
      ? `💡 ACTION: A灯(メイン)の光量を上げるか、被写体へ近づけてください。`
      : `💡 ACTION: B灯(サブ)を弱めるか、A灯との距離差を広げてください。`;
    
    actionElem.textContent = recAction;
    actionElem.style.borderColor = '#00bfff';
    actionElem.style.color = '#00bfff';
  } else {
    // コントラスト過多（影が濃すぎる）
    evalElem.textContent = 'ハイコントラスト (HARD SHADOW)';
    evalElem.style.background = 'rgba(255,180,0,0.2)';
    evalElem.style.color = '#ffb400';
    evalElem.style.borderColor = 'rgba(255,180,0,0.4)';

    const recAction = (activeTargetLight === 'B')
      ? `💡 ACTION: B灯(サブ)を起こしてシャドー部(影)を補光してください。`
      : `💡 ACTION: A灯(メイン)を弱めるか、アンブレラ/ソフトボックスで拡散してください。`;

    actionElem.textContent = recAction;
    actionElem.style.borderColor = '#ffb400';
    actionElem.style.color = '#ffb400';
  }
}

// ==========================================
// 6. メインフレーム描画ループ
// ==========================================
function loop() {
  // ピン留めモード時はキャッシュ画像を優先描画
  if (isPinned && pinnedImageData) {
    ctx.putImageData(pinnedImageData, 0, 0);
    requestAnimationFrame(loop);
    return;
  }

  // 1. 画面クリア ＆ カメラ映像描画
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // 2. ゴースト重畳表示
  if (isGhostActive && ghostImage) {
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.drawImage(ghostImage, 0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  // 3. フレーム解析
  const analysis = analyzeFrame();
  updateActionUI(analysis.ratio);

  // 4. EV差分ヒートマップ / WBモード オーバーレイ描画
  if (displayMode === 'exp') {
    drawExposureHeatmap(analysis);
  } else if (displayMode === 'col') {
    drawColorBalanceOverlay();
  }

  // 5. W追尾（HL/SD）マーカー描画
  if (isTrackingActive) {
    drawTrackingMarkers();
  }

  // 6. 長押し差分ブーストモード
  if (document.body.classList.contains('diff-boost')) {
    drawDiffBoostOverlay();
  }

  requestAnimationFrame(loop);
}

// ==========================================
// 7. オーバーレイ描画サブ関数
// ==========================================

// EV差分ヒートマップ描画
function drawExposureHeatmap(analysis) {
  ctx.save();
  // ハイライト領域強調（レッド・シアンのグラデーション風）
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255, 60, 60, 0.6)';
  ctx.beginPath();
  ctx.arc(hlPoint.x, hlPoint.y, 24, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(0, 200, 255, 0.6)';
  ctx.beginPath();
  ctx.arc(sdPoint.x, sdPoint.y, 24, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

// WBカラーバランス（疑似色温度）描画
function drawColorBalanceOverlay() {
  ctx.save();
  ctx.font = 'bold 10px monospace';
  ctx.fillStyle = 'rgba(0, 232, 135, 0.8)';
  ctx.fillText('WB: 5600K (DAYLIGHT TARGET)', 14, canvas.height - 120);
  ctx.restore();
}

// W追尾（HL:ハイライト / SD:シャドー）マーカーの描画
function drawTrackingMarkers() {
  ctx.save();

  // --- HL (ハイライト) マーカー ---
  ctx.strokeStyle = '#00e887';
  ctx.fillStyle = '#00e887';
  ctx.lineWidth = 2;

  // ターゲット照準
  ctx.beginPath();
  ctx.arc(hlPoint.x, hlPoint.y, 14, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(hlPoint.x, hlPoint.y, 3, 0, Math.PI * 2);
  ctx.fill();

  // ラベルテキスト
  ctx.font = 'bold 10px monospace';
  ctx.fillText(`HL [${Math.round(hlPoint.val)}]`, hlPoint.x + 18, hlPoint.y + 4);

  // --- SD (シャドー) マーカー ---
  ctx.strokeStyle = '#00bfff';
  ctx.fillStyle = '#00bfff';

  ctx.beginPath();
  ctx.arc(sdPoint.x, sdPoint.y, 14, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(sdPoint.x, sdPoint.y, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillText(`SD [${Math.round(sdPoint.val)}]`, sdPoint.x + 18, sdPoint.y + 4);

  // --- 2点をつなぐベクターライン ---
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(hlPoint.x, hlPoint.y);
  ctx.lineTo(sdPoint.x, sdPoint.y);
  ctx.stroke();

  ctx.restore();
}

// 長押し時の差分強調描画
function drawDiffBoostOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('🔥 差分ハイコントラスト強調モード', 20, 40);
  ctx.restore();
}
</script>
