<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100d0b" />
  <title>Champagne Tower — Glass Study</title>
  <style>
    :root {
      --ink: #f4eee5;
      --muted: #b6aba1;
      --line: rgba(247, 233, 211, .16);
      --panel: rgba(21, 17, 14, .76);
      --gold: #e9c47a;
      --gold-bright: #ffd986;
      --danger: #ffb5a7;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100d0b; }
    body {
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    #app, #viewport { position: fixed; inset: 0; }
    #viewport { background: radial-gradient(circle at 50% 20%, #282018 0%, #17120f 42%, #090807 100%); cursor: grab; touch-action: none; }
    #viewport:active { cursor: grabbing; }
    #viewport canvas { display: block; width: 100%; height: 100%; }
    #grain {
      position: fixed; inset: 0; pointer-events: none; opacity: .095; mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
    }
    .vignette { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 190px 45px rgba(0,0,0,.58); }
    header {
      position: fixed; inset: 0 0 auto 0; z-index: 3; display: flex; align-items: flex-start; justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 24px 0; pointer-events: none;
    }
    .brand { letter-spacing: .15em; text-transform: uppercase; font-size: 10px; line-height: 1.45; color: #d3c6ba; }
    .brand strong { display: block; font-family: Georgia, "Times New Roman", serif; letter-spacing: .08em; font-size: 18px; color: #fff7ea; font-weight: 400; }
    .badge { border: 1px solid rgba(233,196,122,.32); border-radius: 999px; padding: 7px 10px; color: #e9c47a; background: rgba(15,12,10,.5); backdrop-filter: blur(12px); font-size: 10px; letter-spacing: .08em; }
    #control-panel {
      position: fixed; z-index: 4; left: 24px; bottom: max(24px, env(safe-area-inset-bottom)); width: min(348px, calc(100vw - 48px));
      padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); backdrop-filter: blur(18px) saturate(125%); box-shadow: 0 16px 60px rgba(0,0,0,.28);
    }
    .panel-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
    /* 折りたたみ。畳んでも脚数と段数は残すので、操作の存在と情報の両方が見える。 */
    #panel-toggle {
      flex: none; align-self: center; width: 34px; height: 34px; padding: 0; margin: -4px -4px -4px 0;
      display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%;
      color: #d9cdc0; background: transparent; cursor: pointer; transition: color .18s ease, background .18s ease;
    }
    #panel-toggle:hover { color: #251a0a; background: var(--gold); }
    #panel-toggle svg { width: 14px; height: 14px; transition: transform .24s ease; }
    #control-panel.collapsed .panel-top { margin-bottom: 0; }
    #control-panel.collapsed #panel-toggle svg { transform: rotate(180deg); }
    #control-panel.collapsed #panel-body { display: none; }
    .eyebrow { margin: 0 0 3px; color: var(--gold); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 400; letter-spacing: .01em; }
    .glass-count { flex: none; text-align: right; color: #f7e5c0; font-family: Georgia, "Times New Roman", serif; font-size: 23px; line-height: .9; }
    .glass-count span { display: block; margin-top: 5px; color: var(--muted); font-family: inherit; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; }
    .rule { height: 1px; background: var(--line); margin: 0 0 15px; }
    .control-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .control-row + .control-row { margin-top: 13px; }
    .control-label { color: #e4d9ce; font-size: 12px; letter-spacing: .02em; }
    .control-caption { margin-top: 3px; color: #968c83; font-size: 10px; }
    .range-wrap { width: 155px; display: flex; align-items: center; gap: 10px; }
    input[type="range"] { width: 100%; accent-color: var(--gold); cursor: pointer; }
    output { width: 21px; color: var(--gold-bright); font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; }
    .segmented { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .segmented button, .icon-button, #reset-view {
      border: 0; color: #cfc4b8; background: transparent; font: inherit; cursor: pointer; transition: background .18s ease, color .18s ease;
    }
    .segmented button { min-width: 60px; padding: 7px 9px; font-size: 11px; }
    .segmented button + button { border-left: 1px solid var(--line); }
    .segmented button.active { color: #241a0b; background: var(--gold); }
    .switch { position: relative; display: inline-flex; align-items: center; gap: 8px; color: #cfc4b8; font-size: 11px; cursor: pointer; user-select: none; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch-ui { width: 32px; height: 18px; padding: 2px; border: 1px solid rgba(244,238,229,.22); border-radius: 999px; transition: background .2s ease; }
    .switch-ui::after { content: ""; display: block; width: 12px; height: 12px; border-radius: 50%; background: #9d938a; transition: transform .2s ease, background .2s ease; }
    .switch input:checked + .switch-ui { background: #ad8033; border-color: #e9c47a; }
    .switch input:checked + .switch-ui::after { transform: translateX(14px); background: #fff6df; }
    #reset-view { margin-top: 16px; width: 100%; padding: 10px; border: 1px solid rgba(233,196,122,.31); border-radius: 8px; color: #ead09b; font-size: 11px; letter-spacing: .06em; }
    #reset-view:hover { color: #251a0a; background: var(--gold); }
    .hint { position: fixed; z-index: 3; right: 24px; bottom: max(25px, env(safe-area-inset-bottom)); color: rgba(230,220,208,.7); font-size: 10px; letter-spacing: .03em; text-align: right; pointer-events: none; }
    .hint kbd { display: inline-block; margin: 0 2px; padding: 2px 5px; border: 1px solid rgba(245,235,222,.2); border-radius: 4px; font: inherit; color: rgba(255,247,234,.85); }
    #loading, #fallback { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; background: #100d0b; }
    #loading .load-card, #fallback .load-card { text-align: center; padding: 30px; }
    .loading-line { width: 135px; height: 1px; margin: 17px auto 0; overflow: hidden; background: rgba(233,196,122,.18); }
    .loading-line::after { content: ""; display: block; height: 100%; background: #e9c47a; animation: loading 1.2s ease-in-out infinite; }
    @keyframes loading { from { width: 0; margin-left: 0; } 50% { width: 70%; margin-left: 20%; } to { width: 0; margin-left: 100%; } }
    #fallback { display: none; }
    #fallback p { max-width: 360px; color: var(--muted); font-size: 13px; line-height: 1.8; }
    @media (max-width: 660px) {
      header { padding: max(16px, env(safe-area-inset-top)) 16px 0; }
      .brand strong { font-size: 16px; }
      .badge { font-size: 9px; }
      #control-panel { left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: calc(100vw - 24px); padding: 15px; }
      .hint { display: none; }
      .range-wrap { width: 145px; }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="シャンパンタワー3Dプレビュー">
    <div id="viewport" aria-label="3Dシーン。ドラッグで回転、ホイールまたはピンチでズーム"></div>
    <div id="grain"></div><div class="vignette"></div>
    <header>
      <div class="brand"><strong>Champagne Tower</strong>Real Glass Study</div>
      <div class="badge">INTERACTIVE 3D</div>
    </header>
    <section id="control-panel" aria-label="タワー設定">
      <div class="panel-top">
        <div><p class="eyebrow">Configuration</p><h1>静かな祝祭</h1></div>
        <div class="glass-count" id="glassCount">1<span>Coupe glass</span></div>
        <button id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body" aria-label="設定パネルの開閉">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="panel-body">
      <div class="rule"></div>
      <div class="control-row">
        <div><div class="control-label">段数</div><div class="control-caption">1〜10段を自動配置</div></div>
        <div class="range-wrap"><input id="levels" type="range" min="1" max="10" value="1" aria-label="段数" /><output id="levelValue" for="levels">1</output></div>
      </div>
      <div class="control-row">
        <div><div class="control-label">表示モード</div><div class="control-caption">品質確認 / タワー表示</div></div>
        <div class="segmented" role="group" aria-label="表示モード"><button type="button" class="active" data-mode="study">1杯</button><button type="button" data-mode="tower">タワー</button></div>
      </div>
      <div class="control-row">
        <div><div class="control-label">回転演出</div><div class="control-caption">ゆっくりと全体を回転</div></div>
        <label class="switch"><input id="autorotate" type="checkbox" checked /><span class="switch-ui"></span><span>ON</span></label>
      </div>
      <button id="reset-view" type="button">カメラを整える</button>
      </div>
    </section>
    <div class="hint"><kbd>ドラッグ</kbd> 回転　 <kbd>ホイール / ピンチ</kbd> ズーム　 <kbd>2本指</kbd> 移動</div>
    <div id="loading"><div class="load-card"><p class="eyebrow">Preparing the glass</p><div class="loading-line"></div></div></div>
    <div id="fallback"><div class="load-card"><p class="eyebrow">3D Preview Unavailable</p><p>このブラウザでは3D表示を開始できませんでした。WebGL対応の最新ブラウザでお試しください。</p></div></div>
  </main>


  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

    const viewport = document.getElementById('viewport');
    const loading = document.getElementById('loading');
    const fallback = document.getElementById('fallback');
    const levelsInput = document.getElementById('levels');
    const levelValue = document.getElementById('levelValue');
    const glassCount = document.getElementById('glassCount');
    const modeButtons = [...document.querySelectorAll('[data-mode]')];
    const autoInput = document.getElementById('autorotate');
    const resetButton = document.getElementById('reset-view');
    const controlPanel = document.getElementById('control-panel');
    const panelToggle = document.getElementById('panel-toggle');

    // 携帯では設定パネルが画面の4割を占めてタワーを隠すので、初期状態を畳んでおく。
    // 既存CSSも660pxでレイアウトを切り替えているため、同じ境目を使う。選択は記憶する。
    const PANEL_KEY = 'cyanpan.panel';
    function setPanelCollapsed(collapsed, remember = true) {
      controlPanel.classList.toggle('collapsed', collapsed);
      panelToggle.setAttribute('aria-expanded', String(!collapsed));
      if (remember) { try { localStorage.setItem(PANEL_KEY, collapsed ? 'collapsed' : 'open'); } catch (error) { /* プライベートモード等 */ } }
    }
    let storedPanel = null;
    try { storedPanel = localStorage.getItem(PANEL_KEY); } catch (error) { /* 読めなくても既定で動く */ }
    setPanelCollapsed(storedPanel ? storedPanel === 'collapsed' : matchMedia('(max-width: 660px)').matches, false);
    panelToggle.addEventListener('click', () => setPanelCollapsed(!controlPanel.classList.contains('collapsed')));

    let renderer, scene, camera, controls, clock, pmrem;
    let tower = null, room = null, lightRig = null, pour = null, elapsed = 0;
    let materials, geometries;
    const requestState = new URLSearchParams(location.search);
    let currentMode = requestState.get('mode') === 'tower' ? 'tower' : 'study';
    let currentLevels = Math.max(1, Math.min(10, Number.parseInt(requestState.get('levels'), 10) || 1));
    levelsInput.value = currentLevels;
    modeButtons.forEach(button => button.classList.toggle('active', button.dataset.mode === currentMode));

    // 1 unit = 100mm。実寸のクープグラス（口径95mm / 全高130mm / 台座径65mm）をそのまま数値で扱う。
    const GLASS = {
      rimY: 1.30,          // 縁の高さ 130mm
      rimOuter: .4775,     // 口径 95.5mm
      rimThickness: .0125, // 縁の肉厚 2.5mm（折り返しの半径）
      // 鉢は「縁が最も広い一続きの楕円面」。上部を垂直にするとカップに見えてしまう。
      bowlOuterB: .455,    // 鉢外面の深さ方向の半径
      bowlInnerR: .4525,   // 鉢内面の口径側半径（= rimOuter - 縁の肉厚×2）
      bowlInnerB: .418,    // 鉢内面の深さ。外面との差が鉢底のガラス厚 9mm
      stemR: .0315,        // ステム 直径6.3mm
      baseR: .285,         // 台座 直径57mm
      liquidLevel: 1.10,   // 鉢の深さの約5割
      floorY: .882,        // 鉢の内底 = rimY - bowlInnerB
      pitch: .962,         // タワーで縁同士が触れる間隔
      stack: 1.3125        // 縁の頂点。上段の台座はここに載る
    };

    const LIQUID_RX = GLASS.bowlInnerR - .003, LIQUID_RY = GLASS.bowlInnerB - .0025;
    const liquidTopRadius = level => bowlRadiusAt(LIQUID_RX, LIQUID_RY, level);
    // 液体ボディは満タンで1回だけ焼き、液面より上をシェーダで捨てる。個体差(±.006)より上に取る。
    const LIQUID_BAKE = GLASS.liquidLevel + .012;
    const LIQUID_EMPTY = GLASS.rimY - LIQUID_RY; // 鉢の内底

    // 鉢は楕円回転体なので、一定流量でも液面上昇は底ほど速く上ほど遅い。
    // 体積 V(h) = πrx²[(ry - h) - (ry³ - h³)/(3ry²)]（h は縁からの深さ）を逆に解いて
    // 「注いだ量 → 液面高さ」の表を作る。線形補間だと機械的な上がり方になる。
    const bowlVolume = h => Math.PI * LIQUID_RX * LIQUID_RX *
      ((LIQUID_RY - h) - (Math.pow(LIQUID_RY, 3) - h * h * h) / (3 * LIQUID_RY * LIQUID_RY));
    const LEVEL_STEPS = 64;
    const LEVEL_LUT = (() => {
      const full = bowlVolume(GLASS.rimY - GLASS.liquidLevel);
      const table = new Float32Array(LEVEL_STEPS + 1);
      for (let k = 0; k <= LEVEL_STEPS; k++) {
        const want = full * k / LEVEL_STEPS;
        let low = GLASS.rimY - GLASS.liquidLevel, high = LIQUID_RY; // h が大きいほど浅い
        for (let step = 0; step < 26; step++) {
          const mid = (low + high) / 2;
          if (bowlVolume(mid) > want) low = mid; else high = mid;
        }
        table[k] = GLASS.rimY - (low + high) / 2;
      }
      return table;
    })();
    function fillToLevel(fill) {
      const t = THREE.MathUtils.clamp(fill, 0, 1) * LEVEL_STEPS;
      const index = Math.min(LEVEL_STEPS - 1, Math.floor(t));
      return THREE.MathUtils.lerp(LEVEL_LUT[index], LEVEL_LUT[index + 1], t - index);
    }

    // グラスの外側の輪郭。ガラス本体と、そこを伝って垂れる流れの両方が使うので
    // 数値をここに集約する。鉢の外面が軸に向かって曲がり始める角度が neck。
    const COUPE_OUTER = {
      neck: 74,
      baseEdge: [.2595, .0278, .0123],  // 台座のふちの円弧（中心x, 中心y, 半径）
      baseTop: [[.2578, .0398], [.19, .0488], [.113, .0698], [.061, .1075], [.0405, .166]],
      stem: [[.0405, .166], [.0332, .325], [.0315, .50], [.0348, .66], [.047, .775]],
      waist: [[.047, .775], [.073, .823]] // + くびれの終点（= 鉢の外面の開始点）
    };
    const neckPoint = () => [GLASS.rimOuter * Math.cos(THREE.MathUtils.degToRad(COUPE_OUTER.neck)),
                             GLASS.rimY - GLASS.bowlOuterB * Math.sin(THREE.MathUtils.degToRad(COUPE_OUTER.neck))];

    // 縁からあふれた液が伝う道すじ。グラスの外側の輪郭そのものを使う。
    // 段の間隔(1.3125)とグラスの全高(1.30)がほぼ同じで、上段の台座は下段の縁のすぐ上に載る。
    // 自由落下できる隙間が無いので、実物と同じく鉢の外側→ステム→台座を伝わせる。
    const RIVULET_BASE = COUPE_OUTER.baseEdge[1];                // 台座のふち。ここまで伝う
    const RIVULET_BOTTOM = GLASS.liquidLevel - GLASS.stack;      // 下段の液面（局所座標で約 -0.21）
    const RIVULET_R = COUPE_OUTER.baseEdge[0] + COUPE_OUTER.baseEdge[2]; // 台座のふちの半径

    // 注ぎ口からの流れ。真上から垂直に落とすとCG的な棒に見えるので、
    // 注ぎ口から水平に出て自由落下する放物線にする。少し横からグラスへ流れ込む。
    // 1 unit = 100mm なので g = 9.8 m/s² は 98。
    const STREAM_G = 98;
    // 落差を大きく取ると視野に入るのは末端の急な部分だけになり、傾いた直線に見えてしまう。
    // 浅く広い弧にして、曲がっているところを見せる（注ぎ口は縁の73mm上）。
    const STREAM_DROP = 1.15;  // 空のグラスの液面までの落差 115mm
    const STREAM_REACH = 1.45; // 水平距離 145mm
    const STREAM_R0 = .05;     // 注ぎ口の半径 5mm
    const STREAM_TIME = Math.sqrt(2 * STREAM_DROP / STREAM_G);  // 飛行時間 約0.153秒
    const STREAM_VX = STREAM_REACH / STREAM_TIME;               // 水平速度 約9.47
    // 着地は「空のグラスの液面＝軸上」に合わせる。満ちるほど着水点は軌道上を手前へ戻るので、
    // 常に鉢の内側に収まる。満タン位置に合わせると、空のとき軌道が軸を通り越して鉢を突き抜ける。
    const STREAM_END = Math.sqrt(2 * (STREAM_DROP + .05) / STREAM_G);
    const STREAM_SEGMENTS = 48, STREAM_SIDES = 10;
    const STREAM_FALL = 12;    // 注ぎが止まったあと、途切れた側が落ちる速さ

    // 質量保存より断面積×速度が一定なので、半径は速度の平方根に反比例する。
    function streamRadiusAt(t) {
      const speed = Math.hypot(STREAM_VX, STREAM_G * t);
      const physical = STREAM_R0 * Math.sqrt(STREAM_VX / speed);
      // 注ぎ口では本来いちばん太いが、ボトルを描かない以上そこに切り口が出てしまう。
      // §2「見えないボトルから注いでいる」に沿って、始点だけ細らせて湧き出るように見せる。
      const emerge = Math.min(1, (t / STREAM_END) / .10);
      return physical * (.25 + .75 * emerge * emerge * (3 - 2 * emerge));
    }

    // チューブは「中心線 + 半径方向のオフセット」で持つ。頂点シェーダで
    // position + aOffset * 太さ * (1 + 波) とすれば、太さの制御と流れる揺らぎが同じ仕組みで出せる。
    // 軌道は平面内なので、水平の垂線を固定軸にすればねじれの無いフレームになる。
    function createStreamGeometry(direction) {
      const across = new THREE.Vector3(-direction.z, 0, direction.x).normalize();
      const positions = [], offsets = [], normals = [], streams = [], indices = [];
      const centre = new THREE.Vector3(), tangent = new THREE.Vector3();
      const radial = new THREE.Vector3(), up = new THREE.Vector3();
      for (let i = 0; i <= STREAM_SEGMENTS; i++) {
        const t = STREAM_END * i / STREAM_SEGMENTS;
        // 注ぎ口を原点に、水平に出て自由落下する。
        centre.copy(direction).multiplyScalar(STREAM_VX * t);
        centre.y = -.5 * STREAM_G * t * t;
        tangent.copy(direction).multiplyScalar(STREAM_VX);
        tangent.y = -STREAM_G * t;
        tangent.normalize();
        up.crossVectors(tangent, across).normalize(); // ねじれない第2軸
        const radius = streamRadiusAt(t);
        for (let j = 0; j <= STREAM_SIDES; j++) {
          const angle = Math.PI * 2 * j / STREAM_SIDES;
          radial.copy(across).multiplyScalar(Math.cos(angle)).addScaledVector(up, Math.sin(angle));
          positions.push(centre.x, centre.y, centre.z);
          offsets.push(radial.x * radius, radial.y * radius, radial.z * radius);
          normals.push(radial.x, radial.y, radial.z);
          streams.push(i / STREAM_SEGMENTS, radius * .08); // 弧に沿った位置と、揺らぎの振幅
        }
      }
      const ring = STREAM_SIDES + 1;
      for (let i = 0; i < STREAM_SEGMENTS; i++) for (let j = 0; j < STREAM_SIDES; j++) {
        const a = i * ring + j, b = a + ring;
        indices.push(a, b, a + 1, a + 1, b, b + 1);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geometry.setAttribute('aOffset', new THREE.Float32BufferAttribute(offsets, 3));
      geometry.setAttribute('aStream', new THREE.Float32BufferAttribute(streams, 2));
      geometry.setIndex(indices);
      return geometry;
    }

    // 垂れの前進は「毎秒いくら高さが下がるか」ではなく「毎秒いくら道のりを進むか」で決める。
    // 経路は高さ方向で約1.51、実際の道のりは約1.83あり、台座上面は高さ0.14しか下がらないのに
    // 道のりは0.28ある。高さを定速で下げると台座の上だけ液が倍近い速さで外へ走ってしまう。
    // 物理的にも逆で、重力で流れる薄膜は面が寝るほど遅くなる（実物で足元に溜まって見えるのはこのため）。
    const RIVULET_PATH = (() => {
      const points = createRivuletProfile(1);
      const heights = [], distances = [];
      let travelled = 0;
      // 輪郭は下から上へ並ぶので、縁からの道のりにするため逆順に積む。
      for (let i = points.length - 1; i >= 0; i--) {
        if (i < points.length - 1) travelled += points[i].distanceTo(points[i + 1]);
        heights.push(points[i].y);
        distances.push(travelled);
      }
      return { heights, distances, total: travelled };
    })();

    // 縁から測った道のり → 高さ。単調に下る経路なので線形探索を二分で置き換えるまでもない。
    function rivuletHeightAt(distance) {
      const { heights, distances } = RIVULET_PATH;
      const target = THREE.MathUtils.clamp(distance, 0, RIVULET_PATH.total);
      let low = 0, high = distances.length - 1;
      while (high - low > 1) {
        const mid = (low + high) >> 1;
        if (distances[mid] <= target) low = mid; else high = mid;
      }
      const span = distances[high] - distances[low];
      return span > 1e-9 ? THREE.MathUtils.lerp(heights[low], heights[high], (target - distances[low]) / span) : heights[low];
    }
    // 高さ → 縁から測った道のり。下端（台座のふち／下段の液面）を道のりに直すのに使う。
    function rivuletDistanceAt(height) {
      const { heights, distances } = RIVULET_PATH;
      for (let i = 1; i < heights.length; i++) {
        if (heights[i] <= height) {
          const span = heights[i - 1] - heights[i];
          return span > 1e-9 ? THREE.MathUtils.lerp(distances[i - 1], distances[i], (heights[i - 1] - height) / span) : distances[i];
        }
      }
      return RIVULET_PATH.total;
    }

    try { init(); animate(); } catch (error) { console.error(error); loading.style.display = 'none'; fallback.style.display = 'grid'; }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090807);
      scene.fog = new THREE.FogExp2(0x090807, .028);

      camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, .05, 200);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.02;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      viewport.appendChild(renderer.domElement);

      RectAreaLightUniformsLib.init();
      buildEnvironmentMap();
      createSharedAssets();

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = .055;
      controls.maxPolarAngle = Math.PI * .495;
      controls.autoRotate = autoInput.checked;
      controls.autoRotateSpeed = .42;
      controls.screenSpacePanning = true;
      controls.touches.ONE = THREE.TOUCH.ROTATE;
      controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;
      clock = new THREE.Clock();

      addRoom();
      buildTower(currentLevels, currentMode);
      addEventListeners();
      setTimeout(() => { loading.style.opacity = '0'; loading.style.transition = 'opacity .45s'; setTimeout(() => loading.remove(), 480); }, 350);
    }

    // ── 環境マップ ─────────────────────────────────────────────
    // ガラスの見た目は「ガラスに映るもの」で決まる。撮影セットと同じ配置の発光面を組み、
    // PMREM で scene.environment に焼き込む。これが無いとPBRガラスは黒く沈み、プラスチックになる。
    function buildEnvironmentMap() {
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x050404);

      const room = new THREE.Mesh(new THREE.BoxGeometry(26, 14, 26), new THREE.MeshBasicMaterial({ color: 0x060505, side: THREE.BackSide }));
      room.position.y = 5;
      envScene.add(room);

      const emitter = (hex, gain, w, h, x, y, z) => {
        const material = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
        material.color.setHex(hex, THREE.SRGBColorSpace).multiplyScalar(gain);
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
        mesh.position.set(x, y, z); mesh.lookAt(0, 1, 0); envScene.add(mesh);
      };
      emitter(0xfff3dd, 3.3, 5.4, 3.8, 2.3, 4.6, 2.6);   // 大型ソフトライト
      emitter(0xdce9ff, 1.5, 4.2, 5.0, -4.6, 2.2, 1.2);  // 左の寒色リフレクター
      emitter(0xffcf95, 1.3, 3.0, 3.4, 4.4, 1.9, -1.4);  // 右の暖色リフレクター
      emitter(0xffd9a4, 6.2, 2.8, 1.15, 0, 1.05, -3.0);  // 背面ライト（液体を透かす）
      emitter(0xfff0d8, .5, 3.2, 3.2, .4, 6.6, -.6);     // 上部ライト
      emitter(0x120d09, 1.0, 16, 16, 0, -.02, 0);        // 床からの弱い反射

      pmrem = new THREE.PMREMGenerator(renderer);
      const target = pmrem.fromScene(envScene, .012);
      scene.environment = target.texture;
      scene.environmentIntensity = 1.0;
      envScene.traverse(object => { if (object.isMesh) { object.geometry.dispose(); object.material.dispose(); } });
    }

    // ── 背景 ───────────────────────────────────────────────────
    // 撮影のホリゾント紙にあたるグラデーション。上が沈み、グラス背後がわずかに持ち上がる。
    function createBackdropTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 32; canvas.height = 256;
      const context = canvas.getContext('2d');
      const gradient = context.createLinearGradient(0, 0, 0, 256);
      gradient.addColorStop(0, '#070605');
      gradient.addColorStop(.52, '#0d0a08');
      gradient.addColorStop(.78, '#241a12');
      gradient.addColorStop(1, '#120d09');
      context.fillStyle = gradient; context.fillRect(0, 0, 32, 256);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function addRoom() {
      room = new THREE.Group();
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(80, 30), new THREE.MeshBasicMaterial({ map: createBackdropTexture() }));
      backWall.position.set(0, 10, -11); backWall.receiveShadow = true; room.add(backWall);

      // 石材のテーブル面。わずかな鏡面反射だけを残し、映り込みで接地を見せる。
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x070605, roughness: .86, metalness: 0, envMapIntensity: .2 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; room.add(floor);
      scene.add(room);
    }

    // 撮影セットの寸法はグラス1個に合わせてある。タワーが高くなったら、
    // ライトも背景もセットごと同じ倍率で大きくする（照明の見え方を保ったまま被写体だけ大きくなる）。
    function applySceneScale(scale) {
      room.scale.setScalar(scale);
      scene.fog.density = .028 / scale;
      addLights(scale);
    }

    function addLights(scale = 1) {
      if (lightRig) { scene.remove(lightRig); lightRig.traverse(object => { if (object.isLight && object.dispose) object.dispose(); }); }
      lightRig = new THREE.Group();
      lightRig.add(new THREE.HemisphereLight(0x2a3240, 0x120c07, .18));
      // 面光源は位置も寸法も同じ倍率で拡大するので、被写体が受ける照度は変わらない。
      const rect = (hex, intensity, w, h, x, y, z) => {
        const light = new THREE.RectAreaLight(hex, intensity, w * scale, h * scale);
        light.position.set(x * scale, y * scale, z * scale); light.lookAt(0, .9 * scale, 0); lightRig.add(light);
      };
      rect(0xfff3dd, 4.4, 5.4, 3.8, 2.3, 4.6, 2.6);   // 大型ソフトライト
      rect(0xdce9ff, 1.3, 4.2, 5.0, -4.6, 2.2, 1.2);  // 左の反射
      rect(0xffcf95, 1.1, 3.0, 3.4, 4.4, 1.9, -1.4);  // 右の反射
      rect(0xffd9a4, 11, 2.8, 1.15, 0, 1.05, -3.0);   // 背面ライト（液体を透かす）
      rect(0xfff0d8, .6, 3.2, 3.2, .4, 6.6, -.6);     // 上部ライト

      // 接地影のためのスポット。演出ではなく、床にグラスを置くための1灯。
      // 点光源は距離減衰があるので、倍率に合わせて光量を上げる。
      const key = new THREE.SpotLight(0xffeed2, 30 * Math.pow(scale, 1.7), 22 * scale, Math.PI / 9, .95, 1.7);
      key.position.set(1.5 * scale, 6.2 * scale, 2.1 * scale);
      key.target.position.set(0, 0, 0);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.bias = -.0012;
      key.shadow.normalBias = .012 * scale;
      key.shadow.camera.near = 1 * scale; key.shadow.camera.far = 24 * scale;
      lightRig.add(key, key.target);
      scene.add(lightRig);
    }

    // ── ガラス形状 ─────────────────────────────────────────────
    // 外面・内面・縁・底を1本の閉じた輪郭にして、1つの LatheGeometry として回転させる。
    // 厚みが形状として存在するので、屈折と全反射が縁とボウル底に自然に出る。
    function pushSpline(points, controls, steps) {
      const sampled = new THREE.SplineCurve(controls.map(p => new THREE.Vector2(p[0], p[1]))).getPoints(Math.max(2, steps));
      for (let i = 1; i < sampled.length; i++) points.push(sampled[i]);
    }
    // 鉢の楕円面。t=0 が縁、t=90° が軸上（鉢の底）。
    function pushEllipse(points, rx, ry, fromDeg, toDeg, steps) {
      const count = Math.max(2, steps);
      for (let i = 1; i <= count; i++) {
        const t = THREE.MathUtils.degToRad(fromDeg + (toDeg - fromDeg) * (i / count));
        points.push(new THREE.Vector2(rx * Math.cos(t), GLASS.rimY - ry * Math.sin(t)));
      }
    }
    function bowlRadiusAt(rx, ry, y) {
      return rx * Math.sqrt(Math.max(0, 1 - Math.pow((GLASS.rimY - y) / ry, 2)));
    }
    function pushArc(points, cx, cy, radius, from, to, steps) {
      const count = Math.max(2, steps);
      for (let i = 1; i <= count; i++) {
        const angle = from + (to - from) * (i / count);
        points.push(new THREE.Vector2(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius));
      }
    }

    function createCoupeProfile(detail = 1, variance = 0) {
      const rimT = GLASS.rimThickness * (1 + variance);
      const s = n => Math.max(2, Math.round(n * detail));
      const neck = COUPE_OUTER.neck;
      const points = [new THREE.Vector2(0, .0068)];
      // 台座の裏。中央を浅く凹ませ、接地するのは縁だけにする。
      pushSpline(points, [[0, .0068], [.125, .004], [.212, .0058], [.259, .0155]], s(9));
      // 台座の縁。ここに乗るハイライトがガラスの厚みを語る。
      pushArc(points, ...COUPE_OUTER.baseEdge, -Math.PI / 2.1, Math.PI / 2.3, s(9));
      // 台座上面 → ステム付け根へドーム状に立ち上がる。
      pushSpline(points, COUPE_OUTER.baseTop, s(13));
      // ステム。細く長く、上端で鉢の底へ向けてわずかに太る。
      pushSpline(points, COUPE_OUTER.stem, s(14));
      // ステム → 鉢の底のくびれ。
      pushSpline(points, [...COUPE_OUTER.waist, neckPoint()], s(7));
      // 鉢の外面。縁が最も広く、そこから一続きの楕円で底まで回り込む。
      pushEllipse(points, GLASS.rimOuter, GLASS.bowlOuterB, neck, 0, s(24));
      // 縁。外面から内面へ厚み分だけ回り込ませる。
      pushArc(points, GLASS.rimOuter - rimT, GLASS.rimY, rimT, 0, Math.PI, s(14));
      // 鉢の内面 → 内底（軸上で閉じる）。
      pushEllipse(points, GLASS.rimOuter - rimT * 2, GLASS.bowlInnerB, 0, 90, s(26));
      return points;
    }

    function createRivuletProfile(detail = 1) {
      const s = n => Math.max(2, Math.round(n * detail));
      const points = [new THREE.Vector2(RIVULET_R, RIVULET_BOTTOM)]; // 台座のふちから下段へ落ちる糸
      points.push(new THREE.Vector2(RIVULET_R, RIVULET_BASE));
      pushSpline(points, COUPE_OUTER.baseTop, s(10));
      pushSpline(points, COUPE_OUTER.stem, s(11));
      pushSpline(points, [...COUPE_OUTER.waist, neckPoint()], s(6));
      pushEllipse(points, GLASS.rimOuter, GLASS.bowlOuterB, COUPE_OUTER.neck, 0, s(18));
      return offsetOutward(points, .004);
    }

    // 輪郭を法線方向へ逃がす。輪郭は下から上へ進むので、接線を -90° 回すと外向きになる。
    function offsetOutward(points, distance) {
      return points.map((point, index) => {
        const previous = points[Math.max(0, index - 1)], next = points[Math.min(points.length - 1, index + 1)];
        const tx = next.x - previous.x, ty = next.y - previous.y;
        const length = Math.hypot(tx, ty) || 1;
        return new THREE.Vector2(point.x + ty / length * distance, point.y - tx / length * distance);
      });
    }

    // 液体は鉢の内面をわずかに内側へオフセットした楕円面。液面の高さは自由に変えられる。
    function createLiquidProfile(level, detail = 1) {
      const s = n => Math.max(2, Math.round(n * detail));
      const top = THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp((GLASS.rimY - level) / LIQUID_RY, 0, 1)));
      const points = [new THREE.Vector2(0, GLASS.rimY - LIQUID_RY)];
      pushEllipse(points, LIQUID_RX, LIQUID_RY, 90, top, s(20));
      const radius = liquidTopRadius(level);
      points.push(new THREE.Vector2(radius * .994, level)); // 液面。ごく短い面取りで縁を立たせる
      points.push(new THREE.Vector2(0, level));
      return points;
    }

    function createSharedAssets() {
      // ガラス：Alphaを使わず、transmission と実形状の厚みだけで透明感を出す。
      const glassBase = {
        color: 0xffffff, metalness: 0, transmission: 1, ior: 1.5,
        thickness: .028, attenuationColor: new THREE.Color(0xe6f2ea), attenuationDistance: 3.2,
        specularIntensity: 1, envMapIntensity: 1, side: THREE.DoubleSide, transparent: false, depthWrite: true
      };
      materials = {
        // §9 個体差。肉眼で歪みに見えない範囲の roughness 微差。
        glass: [.028, .034, .041].map(roughness => new THREE.MeshPhysicalMaterial({ ...glassBase, roughness })),
        // シャンパンは非透過側に置く。透過マテリアル同士は互いの屈折用バックドロップに載らず、
        // 液体を transmission にするとガラス越しに消えてしまうため。
        // 透明感は「ガラスが液体を屈折させる」ことと、背面ライトを受ける低ラフネスの表面で出す。
        liquid: new THREE.MeshPhysicalMaterial({
          color: 0xe0bc78, metalness: 0, roughness: .095, ior: 1.34,
          emissive: new THREE.Color(0x1d1104), emissiveIntensity: 1,
          clearcoat: .3, clearcoatRoughness: .12, specularIntensity: 1,
          envMapIntensity: 2.1, side: THREE.FrontSide, transparent: false, depthWrite: true
        }),
        // 液面。拡散主体だと平坦なクリーム色の円板になるため、環境を映す光沢面として分離する。
        liquidSurface: new THREE.MeshPhysicalMaterial({
          color: 0x6d4a14, metalness: 0, roughness: .035, ior: 1.34,
          clearcoat: 1, clearcoatRoughness: .04, specularIntensity: 1,
          envMapIntensity: 1.9, side: THREE.FrontSide, transparent: false, depthWrite: true
        }),
        bubble: new THREE.MeshPhysicalMaterial({
          color: 0xfff3d8, metalness: 0, roughness: .045, ior: 1.34,
          clearcoat: 1, clearcoatRoughness: .02, specularIntensity: 1,
          envMapIntensity: 2.2, side: THREE.FrontSide, transparent: false, depthWrite: true
        })
      };
      // 注がれた液面を覆うムース。白すぎるとビールの泡に見えるので淡いクリームで拡散主体にする。
      materials.foam = new THREE.MeshPhysicalMaterial({
        color: 0xe9d8b6, metalness: 0, roughness: .86, ior: 1.34,
        clearcoat: .1, clearcoatRoughness: .45, specularIntensity: .5,
        envMapIntensity: .9, side: THREE.FrontSide, transparent: false, depthWrite: true
      });
      // 注ぎ口からの流れ。可視範囲は「下端=液面, 上端=画角の外」というYの区間なので、
      // 垂れと同じ clipFlowRange をそのまま使える。新しいシェーダは要らない。
      materials.stream = materials.liquid.clone();
      materials.stream.roughness = .05;
      // 垂れる流れ。開いたリボンなので裏から見ても消えないよう DoubleSide にする。
      materials.rivulet = materials.liquid.clone();
      materials.rivulet.side = THREE.DoubleSide;
      materials.rivulet.roughness = .06;
      materials.rivulet.clearcoat = .8;
      // 液面はジオメトリではなくシェーダで決める。385脚が別々の液面を持てて、
      // 追加のドローコールもジオメトリ再生成も要らない。
      clipLiquidAtLevel(materials.liquid);
      clipFlowRange(materials.rivulet);
      clipFoamRing(materials.foam);
      clipStreamRange(materials.stream);
      geometries = {
        glass: new THREE.LatheGeometry(createCoupeProfile(1), 128),
        liquid: new THREE.LatheGeometry(createLiquidProfile(LIQUID_BAKE, 1), 128),
        // タワー用は同じ輪郭の低解像度版。形は変えずに頂点数だけ落とす。
        glassLow: new THREE.LatheGeometry(createCoupeProfile(.45), 44),
        liquidLow: new THREE.LatheGeometry(createLiquidProfile(LIQUID_BAKE, .45), 44),
        // 液面ディスクは単位円。半径は liquidTopRadius(level) をインスタンス行列で反映する。
        surface: new THREE.CircleGeometry(1, 96),
        surfaceLow: new THREE.CircleGeometry(1, 40),
        // 垂れる流れは部分回転の細いリボン。幅は縁で約4.3mm、台座のふちで約2.4mm。
        rivulet: new THREE.LatheGeometry(createRivuletProfile(1), 3, 0, .09),
        rivuletLow: new THREE.LatheGeometry(createRivuletProfile(.5), 3, 0, .09),
        // 注ぎ口からの流れ。自由落下で細まる輪郭を式から焼く。
        // 注ぎの弧。既定カメラに対して横から来る向きに固定する（3D空間に固定。カメラ追従はしない）。
        stream: createStreamGeometry(new THREE.Vector3(-.81, 0, .59)),
        bubble: new THREE.SphereGeometry(1, 12, 8)
      };
    }

    // 液体ボディの「ローカルYが液面より上」を捨てる。液面高さは脚ごとのインスタンス属性。
    // 切り口は平らになるが、そこには光沢面（materials.liquidSurface）が重なるので断面は見えない。
    function clipLiquidAtLevel(material) {
      material.onBeforeCompile = shader => {
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nattribute float aLevel;\nvarying float vLevel;\nvarying float vLocalY;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvLevel = aLevel;\nvLocalY = position.y;');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying float vLevel;\nvarying float vLocalY;')
          .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif (vLocalY > vLevel) discard;');
      };
      material.customProgramCacheKey = () => 'liquid-level-clip';
    }

    // 垂れる流れの「いまどこからどこまで濡れているか」。下端が降りると上から伸び、
    // あふれが止まると上端も降りて垂れ切って消える。
    function clipFlowRange(material) {
      material.onBeforeCompile = shader => {
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nattribute vec2 aFlow;\nvarying vec2 vFlow;\nvarying float vLocalY;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvFlow = aFlow;\nvLocalY = position.y;');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying vec2 vFlow;\nvarying float vLocalY;')
          // 範囲が潰れている＝まだ垂れていない／垂れ切った脚。境界の断面だけが
          // 生き残って細い線に見えるので、明示的に捨てる。
          .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif (vFlow.y <= vFlow.x + 1e-4 || vLocalY < vFlow.x || vLocalY > vFlow.y) discard;');
      };
      material.customProgramCacheKey = () => 'flow-range-clip';
    }

    // 注ぎの弧。区間切りに加えて、太さの制御と流れる揺らぎを同じ頂点シェーダで行う。
    // 中心線(position)と半径方向(aOffset)を分けて持たせてあるので、
    // position + aOffset * 太さ * (1 + 波) で両方が出せる。
    // 垂れが使う clipFlowRange は触らない。
    function clipStreamRange(material) {
      material.userData.uniforms = { uTime: { value: 0 }, uWidth: { value: 1 }, uWave: { value: 1 },
        uFade: { value: new THREE.Color(0, 0, 0) } };
      material.onBeforeCompile = shader => {
        Object.assign(shader.uniforms, material.userData.uniforms);
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>
            attribute vec2 aFlow;
            attribute vec3 aOffset;
            attribute vec2 aStream;
            uniform float uTime;
            uniform float uWidth;
            uniform float uWave;
            varying vec2 vFlow;
            varying float vLocalY;
            varying float vArc;`)
          .replace('#include <begin_vertex>', `#include <begin_vertex>
            vFlow = aFlow;
            // 波が流れ落ちることで、太さのゆらぎとハイライトの移動が同時に出る。
            float wave = sin(aStream.x * 26. - uTime * 7.) * aStream.y * uWave;
            transformed = position + aOffset * uWidth + normalize(aOffset + 1e-6) * wave;
            vLocalY = transformed.y;
            vArc = aStream.x;`);
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nuniform vec3 uFade;\nvarying vec2 vFlow;\nvarying float vLocalY;\nvarying float vArc;')
          .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif (vFlow.y <= vFlow.x + 1e-4 || vLocalY < vFlow.x || vLocalY > vFlow.y) discard;')
          // 上流を周囲の背景輝度へ溶かす。層流のジェットは光を屈折・反射して初めて見えるので、
          // 照らされていない部分が見えないのは正しい描画。弾道は後ろへ延長できず（遡ると頂点で
          // 反転して「下から湧き上がる」軌道になる）、フレームでも10段では隠しきれない。
          // トーンマッピング前＝線形空間で混ぜないと背景と輝度が合わない。
          .replace('#include <tonemapping_fragment>',
            'gl_FragColor.rgb = mix(gl_FragColor.rgb, uFade, 1. - smoothstep(0., .20, vArc));\n#include <tonemapping_fragment>');
      };
      material.customProgramCacheKey = () => 'stream-range-clip';
    }

    // 液面を覆うムース。液面と同じ単位円を重ね、中心からの半径が内側しきい値より小さい所を捨てる。
    // しきい値を動かすだけで「全面 → 縁の輪（コルレット）→ 消える」がひとつの形で出せる。
    // CircleGeometry の頂点は XY 平面で中心から半径1以内なので、length(position.xy) がそのまま 0..1。
    function clipFoamRing(material) {
      material.onBeforeCompile = shader => {
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nattribute float aFoam;\nvarying float vFoam;\nvarying float vRadial;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvFoam = aFoam;\nvRadial = length(position.xy);');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying float vFoam;\nvarying float vRadial;')
          .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nfloat cover = vFoam * vFoam * vFoam;\nif (cover <= .001 || vRadial < 1. - cover) discard;');
      };
      material.customProgramCacheKey = () => 'foam-ring-clip';
    }

    function mulberry32(a) { return function() { let t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

    function createGlass(seed = 0, bubbleCount = 9, detailed = true) {
      const group = new THREE.Group();
      const random = mulberry32(seed * 281 + 17);
      const body = new THREE.Mesh(detailed ? geometries.glass : geometries.glassLow, materials.glass[seed % materials.glass.length]);
      body.castShadow = true;
      group.add(body);

      // 液体と液面は段数によらずタワー側の InstancedMesh がまとめて描く。
      // 気泡。液面に達した泡と、内壁ぎわに集まるコルレット（泡の輪）として置く。
      // 満タン時の液面を基準に組み、実際の液面へはグループごと動かして追従させる。
      const level = GLASS.liquidLevel;
      const bubbles = new THREE.Group();
      for (let i = 0; i < bubbleCount; i++) {
        const edgeBiased = i % 4 !== 0;
        const surfaceR = liquidTopRadius(level);
        const spread = edgeBiased ? surfaceR * (.88 + random() * .095) : surfaceR * (.12 + random() * .68);
        const angle = random() * Math.PI * 2;
        const radius = .0075 + random() * (edgeBiased ? .006 : .0095);
        const y = level + radius * .45;
        const bubble = new THREE.Mesh(geometries.bubble, materials.bubble);
        bubble.scale.setScalar(radius);
        bubble.position.set(Math.cos(angle) * spread, y, Math.sin(angle) * spread);
        bubble.userData = { phase: random() * Math.PI * 2, initialY: y, speed: .08 + random() * .1 };
        bubbles.add(bubble);
      }
      bubbles.userData.isBubbles = true;
      group.add(bubbles);
      group.userData.seed = seed;
      return group;
    }

    // ── 配置 ───────────────────────────────────────────────────
    // 配置ロジックはグラス生成から独立させ、将来の形状（正方形・円形・横長）追加に備える。
    function createLayout(levels) {
      const placements = [];
      for (let level = 0; level < levels; level++) {
        const side = levels - level;
        for (let ix = 0; ix < side; ix++) for (let iz = 0; iz < side; iz++) {
          placements.push({
            x: (ix - (side - 1) / 2) * GLASS.pitch,
            y: level * GLASS.stack,
            z: (iz - (side - 1) / 2) * GLASS.pitch,
            rotation: ((placements.length * 13) % 11 - 5) * .0032, // §9 微小な回転差
            level, ix, iz // カスケードの上下関係を組むために保持する
          });
        }
      }
      return placements;
    }

    // ── 注ぐ演出 ───────────────────────────────────────────────
    // 流体シミュレーションは不要。各グラスに「どれだけ入っているか」を持たせ、
    // 上段から順に、あふれた分を真下の4脚へ配るだけでカスケードになる。
    // 下段ほど脚数が増えるので、実物どおり進行が遅くなる。
    function createPourController(placements, levels) {
      const count = placements.length;
      const fill = new Float32Array(count);
      const amount = new Float32Array(count);
      const level = new Float32Array(count);
      // 垂れの状態。front が濡れている下端、tail が上端。transit は「まだ表面を伝っている途中」の量。
      const front = new Float32Array(count);
      const tail = new Float32Array(count);
      const transit = new Float32Array(count);
      const bottom = new Float32Array(count);
      const foam = new Float32Array(count); // 液面を覆うムース。0=無し, 1=全面
      const variance = new Float32Array(count); // §9 シャンパン量の微差は満タン側に残す
      const random = mulberry32(count * 977 + 31);
      for (let i = 0; i < count; i++) variance[i] = (random() - .5) * .012;

      // 段 L の (ix, iz) を載せている下段の4脚は (ix, iz) (ix+1, iz) (ix, iz+1) (ix+1, iz+1)。
      const key = (l, ix, iz) => l * 1e6 + ix * 1e3 + iz;
      const lookup = new Map();
      const tiers = Array.from({ length: levels }, () => []);
      placements.forEach((item, index) => {
        lookup.set(key(item.level, item.ix, item.iz), index);
        tiers[item.level].push(index);
      });
      const downstream = placements.map(item => item.level === 0 ? null : [
        lookup.get(key(item.level - 1, item.ix, item.iz)),
        lookup.get(key(item.level - 1, item.ix + 1, item.iz)),
        lookup.get(key(item.level - 1, item.ix, item.iz + 1)),
        lookup.get(key(item.level - 1, item.ix + 1, item.iz + 1))
      ]);
      // 各グラスを支えている上段の数。外周ほど少なく、角は1脚しかない。
      const upstreamCount = new Float32Array(count).fill(0);
      downstream.forEach(down => { if (down) for (const j of down) upstreamCount[j]++; });

      // 「この脚から下に、まだどれだけ空きが残っているか」。あふれた分をこれに比例して配る。
      // 均等に4分割すると、角の脚は上段の角1脚からしか供給されず (1/4)^段数 になって永遠に満ちない。
      // 実物では注ぎ手がボトルを動かして空いている側へ注ぎ分けるので、それをモデル化している。
      const need = new Float32Array(count);
      const refreshNeed = () => {
        for (let tier = 0; tier < levels; tier++) { // 下段から積み上げる
          for (const i of tiers[tier]) {
            let remaining = 1 - fill[i];
            const down = downstream[i];
            if (down) for (const j of down) remaining += need[j] / upstreamCount[j];
            need[i] = remaining;
          }
        }
      };

      // 最下段は下にグラスが無いので、垂れは台座のふちで止める。道のりで持つので変換しておく。
      placements.forEach((item, index) => {
        bottom[index] = rivuletDistanceAt(item.level === 0 ? RIVULET_BASE : RIVULET_BOTTOM);
      });

      const top = tiers[levels - 1][0];
      // 1脚なら約3秒、10段385脚で約25秒。下段ほど脚数が増えるので体感の進みは自然に落ちる。
      const POUR_SLOWDOWN = 1.6;
      const rate = (.45 + count / 16) / POUR_SLOWDOWN;
      // 縁から台座のふちまで（道のり約1.4）を約1.1秒で伝う。垂れ切るときはその半分の速さで余韻を残す。
      const FLOW_SPEED = 1.25, DRAIN_SPEED = .6;
      // 注がれた分だけ泡立ち、時間で収まる。流入の細い下段ほど泡が薄くなるのは実物どおり。
      // 上限を1未満にして、注がれ続けている間も中心に液面が残るようにする。
      // 全面が均一なクリームで埋まると、シャンパンでなくカフェラテに見える。
      const FOAM_GAIN = 4, FOAM_DECAY = 4, FOAM_MAX = .92;
      // 伝っている間に溜まった液を一度に落とすと、下段が瞬間的に満杯を通り越す。
      // 伝う時間と同程度の時定数で解放する。指数のままだと裾が十数秒残るので、
      // 毎秒の最低解放量を決めて必ず終わらせる。
      const TRANSIT_DRAIN = 1.1, TRANSIT_MIN = .5;

      const spill = new Float32Array(count); // このフレームであふれている脚
      let pouring = true, flowing = false, foaming = false;
      const topIndex = count - 1; // createLayout は下段から積むので、最後が最上段の1脚
      const refreshLevels = () => {
        for (let i = 0; i < count; i++) level[i] = fillToLevel(fill[i]) + variance[i] * fill[i];
      };

      const controller = {
        fill, level, front, tail, foam, placements, topIndex,
        get pouring() { return pouring; },
        reset(full = false) {
          fill.fill(full ? 1 : 0);
          transit.fill(0);
          // 満タン指定は注ぎ終わって時間がたった姿なので、泡は残っていない。
          foam.fill(0);
          // 満タン指定（?pour=0）では注ぎ終わった後の姿なので、垂れは残さない。
          // front/tail は縁から測った道のり。0 が縁、bottom[i] が下端。
          for (let i = 0; i < count; i++) { front[i] = tail[i] = full ? bottom[i] : 0; }
          pouring = !full;
          refreshLevels();
        },
        update(dt) {
          if (!pouring && !flowing && !foaming) return false;
          const step = Math.min(dt, .25);
          spill.fill(0);
          amount.fill(0);
          // タブ復帰時の巨大な dt で一気に満ちないよう頭を抑える。
          // ここを詰めすぎると低fps端末で実時間より遅くなるので、4fps 相当までは素通しする。
          if (pouring) amount[top] = rate * step;
          refreshNeed();
          for (let tier = levels - 1; tier >= 0; tier--) {
            for (const i of tiers[tier]) {
              const down = downstream[i]; // 最下段は null。あふれは床へ捨てる
              const landed = front[i] >= bottom[i] - 1e-4;
              let send = 0;
              // 伝い終わった脚は、溜まっていた分を一度に落とさず時定数で解放する。
              // 注ぎが止まったあとも残りを流し切りたいので、受け取りの有無とは切り離す。
              if (down && transit[i] > 0 && landed) {
                const released = Math.min(transit[i], Math.max(transit[i] * step / TRANSIT_DRAIN, TRANSIT_MIN * step));
                transit[i] -= released;
                send += released;
              }
              const incoming = amount[i];
              if (incoming > 0) {
                const room = 1 - fill[i];
                if (incoming <= room) fill[i] += incoming;
                else {
                  fill[i] = 1;
                  spill[i] = 1;
                  const over = incoming - room;
                  // 垂れがまだ下端に届いていない間は、液は表面を伝っている途中なので下段へ渡さない。
                  if (down) { if (landed) send += over; else transit[i] += over; }
                }
              }
              if (send <= 0 || !down) continue;
              let total = 0;
              for (const j of down) total += need[j];
              if (total > 1e-6) for (const j of down) amount[j] += send * need[j] / total;
              else for (const j of down) amount[j] += send * .25;
            }
          }
          // 垂れの伸び縮み。あふれている間は上端が縁に留まり、止まると上端も降りて消える。
          flowing = false;
          for (let i = 0; i < count; i++) {
            if (spill[i]) {
              tail[i] = 0;
              front[i] = Math.min(front[i] + FLOW_SPEED * step, bottom[i]);
              flowing = true;
              // front > 0 は「一度でも伝い始めた脚」。これが無いと、垂れ切る側の速度を
              // 下げた時点で、まだあふれていない脚でもリボンが伸び始めてしまう。
            } else if (front[i] > 0 && (tail[i] < bottom[i] || transit[i] > 1e-6)) {
              front[i] = Math.min(front[i] + FLOW_SPEED * step, bottom[i]);
              tail[i] = Math.min(tail[i] + DRAIN_SPEED * step, bottom[i]);
              flowing = true;
            }
          }
          // ムース。この時点の amount[i] は各脚がこのフレームに受け取った量そのもの
          // （上段から順に処理するので、自分の番までに確定している）。
          foaming = false;
          const settle = step / FOAM_DECAY;
          for (let i = 0; i < count; i++) {
            const value = Math.max(0, Math.min(FOAM_MAX, foam[i] + amount[i] * FOAM_GAIN) - settle);
            foam[i] = value;
            if (value > 0) foaming = true;
          }
          // 満杯になった瞬間を数える方式だと、空き容量ぴったりに注がれた脚を数え落とす。
          // 残量の合計で判定する。
          let remaining = 0;
          for (let i = 0; i < count; i++) remaining += 1 - fill[i];
          if (remaining <= 1e-6) pouring = false;
          refreshLevels();
          return true;
        }
      };
      controller.reset(requestState.get('pour') === '0');
      return controller;
    }

    function createInstancedTower(placements) {
      const instances = new THREE.Group();
      const count = placements.length;
      const addLayer = (geometry, material, offsetY = 0, rotationX = 0) => {
        const mesh = new THREE.InstancedMesh(geometry, material, count);
        const position = new THREE.Vector3(); const quaternion = new THREE.Quaternion();
        const scale = new THREE.Vector3(1, 1, 1); const matrix = new THREE.Matrix4(); const euler = new THREE.Euler();
        placements.forEach((item, index) => {
          position.set(item.x, item.y + offsetY, item.z);
          euler.set(rotationX, item.rotation, 0);
          quaternion.setFromEuler(euler);
          matrix.compose(position, quaternion, scale);
          mesh.setMatrixAt(index, matrix);
        });
        mesh.instanceMatrix.needsUpdate = true;
        mesh.castShadow = true;
        instances.add(mesh);
      };
      // 385脚（10段）でも1ドローコールに収める。液体と液面はタワー側でまとめて描く。
      addLayer(geometries.glassLow, materials.glass[0]);

      // 気泡。液面に追従させるため、グラス中心からの相対位置（半径比）で保持する。
      const positions = new Float32Array(count * 2 * 3);
      const base = new Float32Array(count * 2 * 3);
      const random = mulberry32(count * 101 + 7);
      for (let index = 0; index < count; index++) {
        for (let b = 0; b < 2; b++) {
          const angle = random() * Math.PI * 2; const ratio = Math.sqrt(random()) * .78; const at = (index * 2 + b) * 3;
          base[at] = Math.cos(angle) * ratio;
          base[at + 1] = .004 + random() * .006; // 液面からの高さ
          base[at + 2] = Math.sin(angle) * ratio;
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({ color: 0xffeec2, size: .014, transparent: true, opacity: .68, sizeAttenuation: true, depthWrite: false });
      const points = new THREE.Points(geometry, material);
      points.userData.ownGeometry = true;
      points.userData.ownMaterial = true;
      points.userData.bubbleBase = base;
      instances.add(points);
      return instances;
    }

    // 液体・液面は段数によらず InstancedMesh に統一する。脚ごとの液面をインスタンス属性で
    // 持たせるためで、study（1脚）でも count=1 のインスタンスとして描く。
    function createPourLayer(placements, levels, bubbleGroups) {
      const count = placements.length;
      const detailed = levels <= 3;
      const controller = createPourController(placements, levels);

      const geometry = (detailed ? geometries.liquid : geometries.liquidLow).clone();
      const levelAttribute = new THREE.InstancedBufferAttribute(new Float32Array(count), 1);
      geometry.setAttribute('aLevel', levelAttribute);
      const body = new THREE.InstancedMesh(geometry, materials.liquid, count);
      body.castShadow = false; // 影はガラス本体が落とす。液体の影まで液面に追従させる必要をなくす。
      body.userData.ownGeometry = true;

      const surface = new THREE.InstancedMesh(detailed ? geometries.surface : geometries.surfaceLow, materials.liquidSurface, count);
      surface.castShadow = false;

      // 注がれた液面を覆うムース。液面と同じ単位円を重ね、覆う範囲をシェーダで決める。
      const foamGeometry = (detailed ? geometries.surface : geometries.surfaceLow).clone();
      const foamAttribute = new THREE.InstancedBufferAttribute(new Float32Array(count), 1);
      foamGeometry.setAttribute('aFoam', foamAttribute);
      const foamMesh = new THREE.InstancedMesh(foamGeometry, materials.foam, count);
      foamMesh.castShadow = false;
      foamMesh.userData.ownGeometry = true;

      // 注ぎ口からの流れ。最上段の真上に立てる。回転対称なのでカメラが周回しても崩れない。
      // §5 注ぎ位置は3D空間の構造として持つ。TargetGlass が変われば軌道も自動的に追従する。
      const topGlass = placements[placements.length - 1];
      const pourTarget = new THREE.Vector3(topGlass.x, topGlass.y + LIQUID_EMPTY, topGlass.z);
      // ジオメトリは注ぎ口を原点に焼いてあるので、満タンの液面へ着地するよう原点を置く。
      const pourPoint = pourTarget.clone().add(new THREE.Vector3(.81, STREAM_DROP, -.59).multiply(new THREE.Vector3(STREAM_REACH, 1, STREAM_REACH)));
      const streamGeometry = geometries.stream.clone();
      const streamAttribute = new THREE.InstancedBufferAttribute(new Float32Array(2), 2);
      streamGeometry.setAttribute('aFlow', streamAttribute);
      const stream = new THREE.InstancedMesh(streamGeometry, materials.stream, 1);
      stream.castShadow = false;
      stream.userData.ownGeometry = true;
      stream.frustumCulled = false;
      let streamWidth = 0, streamTime = 0; // 注ぎ始めに立ち上げ、終わりに絞る

      // 垂れる流れ。上段の台座は下段4脚の縁に45°ずつの4方向で接しているので、
      // そこを伝った液がそのまま下段のグラスへ落ちる。少しばらつかせて整列感を消す。
      const RIVULETS = 4;
      const rivuletGeometry = (detailed ? geometries.rivulet : geometries.rivuletLow).clone();
      const flowAttribute = new THREE.InstancedBufferAttribute(new Float32Array(count * RIVULETS * 2), 2);
      rivuletGeometry.setAttribute('aFlow', flowAttribute);
      const rivulets = new THREE.InstancedMesh(rivuletGeometry, materials.rivulet, count * RIVULETS);
      rivulets.castShadow = false;
      rivulets.userData.ownGeometry = true;

      // 液体ボディの姿勢は固定。動くのは液面の高さ（属性）だけ。
      const matrix = new THREE.Matrix4(), position = new THREE.Vector3();
      const quaternion = new THREE.Quaternion(), scale = new THREE.Vector3(1, 1, 1), euler = new THREE.Euler();
      placements.forEach((item, index) => {
        position.set(item.x, item.y, item.z);
        euler.set(0, item.rotation, 0);
        matrix.compose(position, quaternion.setFromEuler(euler), scale);
        body.setMatrixAt(index, matrix);
      });
      body.instanceMatrix.needsUpdate = true;

      const jitter = mulberry32(count * 613 + 5);
      placements.forEach((item, index) => {
        position.set(item.x, item.y, item.z);
        for (let r = 0; r < RIVULETS; r++) {
          const angle = Math.PI / 4 + r * Math.PI / 2 + (jitter() - .5) * .42; // 45°ずつ ±12°
          euler.set(0, item.rotation + angle, 0);
          matrix.compose(position, quaternion.setFromEuler(euler), scale);
          rivulets.setMatrixAt(index * RIVULETS + r, matrix);
        }
      });
      rivulets.instanceMatrix.needsUpdate = true;
      tower.add(body, surface, foamMesh, rivulets, stream);

      const flat = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
      const points = tower.getObjectByProperty('isPoints', true);

      function updateStream(topLevel, step) {
        // 注ぎ始めは即座に立ち上げ、終わりは細くなって切れる。
        // 絞り切る前に update() が止まると流れが残るが、注ぎが終わる瞬間は
        // 最後に満ちた脚が液を受け取った直後なので必ず泡が立っており、
        // 泡が引くまでの数秒は更新が続く。0.35秒の絞りはその中に収まる。
        const target = controller.pouring ? 1 : 0;
        const speed = controller.pouring ? 1 / .15 : 1 / .35;
        streamWidth = target > streamWidth
          ? Math.min(target, streamWidth + speed * step)
          : Math.max(target, streamWidth - speed * step);
        // 区間切りはメッシュのローカルYで行う。原点は注ぎ口なので、液面をそこからの相対に直す。
        const localLevel = topGlass.y + topLevel - pourPoint.y;
        const flow = streamAttribute.array;
        flow[0] = localLevel; // 下端は最上段の液面。満ちるほど着水点が軌道上を上へ移動する
        // 注ぎが止まったら、注ぎ口の側から途切れて落ちていく。
        flow[1] = controller.pouring ? .01
          : Math.max(localLevel, Math.min(flow[1], .01) - STREAM_FALL * step);
        streamAttribute.needsUpdate = true;

        // §4 軌道のわずかな揺らぎ。着地点はタワー軸上なので、Y回転させても着地点は動かず
        // 注ぎの向きだけがゆっくり揺れる。注ぎ手の指先の揺れにあたる。
        streamTime += step;
        euler.set(0, Math.sin(streamTime * .9) * .02 + Math.sin(streamTime * .37) * .012, 0);
        // 回転の中心をタワー軸に置くため、注ぎ口をターゲット中心の相対位置として回す。
        position.copy(pourPoint).sub(pourTarget).applyEuler(euler).add(pourTarget);
        matrix.compose(position, quaternion.setFromEuler(euler), scale.set(1, 1, 1));
        stream.setMatrixAt(0, matrix);
        stream.instanceMatrix.needsUpdate = true;

        // §ズーム対応 距離による簡略化。遠距離では波が1画素未満になり、ちらつきの原因にしかならない。
        // 画面上の補正やカメラ追従は行わない（3D空間の位置はそのまま）。
        const uniforms = materials.stream.userData.uniforms;
        const distance = camera.position.distanceTo(pourPoint);
        // 溶かす先は scene.background から取る。ここを黒と書くと、明るいテーマで作り直しになる。
        if (scene.background && scene.background.isColor) uniforms.uFade.value.copy(scene.background);
        uniforms.uTime.value = streamTime;
        uniforms.uWidth.value = Math.max(streamWidth, 1e-4);
        uniforms.uWave.value = THREE.MathUtils.clamp(1 - (distance - 4) / 10, 0, 1);
        stream.visible = streamWidth > .002;
      }
      const layer = {
        controller,
        apply(step = 0) {
          const level = controller.level;
          for (let index = 0; index < count; index++) {
            const item = placements[index];
            levelAttribute.array[index] = level[index];
            // 液面ディスクは半径を液面に合わせる。空のグラスでは半径0になり自然に消える。
            const radius = Math.max(liquidTopRadius(level[index]) * .997, 1e-4);
            position.set(item.x, item.y + level[index] + .0016, item.z);
            matrix.compose(position, flat, scale.set(radius, radius, radius));
            surface.setMatrixAt(index, matrix);
            // ムースは液面のすぐ上。覆う範囲は aFoam がシェーダ側で決める。
            foamAttribute.array[index] = controller.foam[index];
            position.y += .002;
            matrix.compose(position, flat, scale);
            foamMesh.setMatrixAt(index, matrix);
            const group = bubbleGroups[index];
            if (group) {
              const ratio = radius / liquidTopRadius(GLASS.liquidLevel);
              group.position.y = level[index] - GLASS.liquidLevel;
              group.scale.set(ratio, 1, ratio);
              group.visible = level[index] > LIQUID_EMPTY + .012;
            }
          }
          // 制御は道のりで持ち、描画は高さで切るので、ここで変換する。
          // 道のりが大きいほど下なので、front が下端(小さいY)、tail が上端(大きいY)。
          const flow = flowAttribute.array;
          for (let index = 0; index < count; index++) {
            const low = rivuletHeightAt(controller.front[index]);
            const high = rivuletHeightAt(controller.tail[index]);
            for (let r = 0; r < RIVULETS; r++) {
              const at = (index * RIVULETS + r) * 2;
              flow[at] = low;
              flow[at + 1] = high;
            }
          }
          updateStream(controller.level[controller.topIndex], step);
          flowAttribute.needsUpdate = true;
          levelAttribute.needsUpdate = true;
          foamAttribute.needsUpdate = true;
          surface.instanceMatrix.needsUpdate = true;
          foamMesh.instanceMatrix.needsUpdate = true;
          scale.set(1, 1, 1);
          if (points) {
            const base = points.userData.bubbleBase, array = points.geometry.attributes.position.array;
            for (let index = 0; index < count; index++) {
              const item = placements[index], radius = liquidTopRadius(level[index]);
              for (let b = 0; b < 2; b++) {
                const at = (index * 2 + b) * 3;
                array[at] = item.x + base[at] * radius;
                array[at + 1] = item.y + level[index] + base[at + 1];
                array[at + 2] = item.z + base[at + 2] * radius;
              }
            }
            points.geometry.attributes.position.needsUpdate = true;
          }
        }
      };
      layer.apply();
      return layer;
    }

    function buildTower(levels, mode = 'tower') {
      if (tower) { scene.remove(tower); disposeObject(tower); }
      tower = new THREE.Group();
      const study = mode === 'study';
      const actualLevels = study ? 1 : levels;
      const placements = createLayout(actualLevels);
      const bubbleGroups = [];
      if (actualLevels >= 6) {
        tower.add(createInstancedTower(placements));
      } else {
        placements.forEach((item, index) => {
          const glass = createGlass(index + 1, study ? 16 : 7, actualLevels <= 3);
          glass.position.set(item.x, item.y, item.z);
          glass.rotation.y = item.rotation;
          glass.traverse(child => { if (child.userData.isBubbles) bubbleGroups[index] = child; });
          tower.add(glass);
        });
      }
      pour = createPourLayer(placements, actualLevels, bubbleGroups);
      tower.userData = { levels: actualLevels, count: placements.length, study };
      scene.add(tower);
      const towerHeight = (actualLevels - 1) * GLASS.stack + GLASS.rimY;
      applySceneScale(Math.max(1, towerHeight / 1.5));
      renderer.transmissionResolutionScale = study ? 1 : (actualLevels >= 6 ? .5 : .75);
      updateStatus(placements.length, actualLevels, study);
      frameCamera(actualLevels, study, true);
    }

    function disposeObject(object) {
      // マテリアルは共有物なので、そのオブジェクト専用のものだけを解放する。
      object.traverse(child => {
        if (child.userData.ownGeometry && child.geometry) child.geometry.dispose();
        if (child.userData.ownMaterial && child.material) child.material.dispose();
        if (child.isInstancedMesh) child.dispose();
      });
      object.clear();
    }

    function updateStatus(count, levels, study) {
      glassCount.innerHTML = `${count}<span>${study ? 'Coupe glass' : `${levels} tiers · Coupe glasses`}</span>`;
      levelValue.textContent = levelsInput.value;
    }

    // 画角から必要距離を縦横それぞれ求め、大きい方を採用する。10段でも画面からはみ出さない。
    function frameCamera(levels, study, instant = false) {
      const height = (levels - 1) * GLASS.stack + GLASS.rimY;
      const radius = study ? GLASS.rimOuter : levels * GLASS.pitch * .5;
      // 被写体を包む球で距離を決める。カメラを見上げ／見下ろしても収まりが崩れない。
      const margin = study ? 1.32 : 1.06;
      const halfV = THREE.MathUtils.degToRad(camera.fov) / 2;
      const halfH = Math.atan(Math.tan(halfV) * camera.aspect);
      const bounding = Math.hypot(height * .5, radius);
      const distance = bounding / Math.sin(Math.min(halfV, halfH)) * margin;
      const targetY = study ? height * .52 : height * .5;
      const elevation = study ? .17 : .28, azimuth = .62;
      const desired = new THREE.Vector3(
        Math.sin(azimuth) * Math.cos(elevation) * distance,
        targetY + Math.sin(elevation) * distance,
        Math.cos(azimuth) * Math.cos(elevation) * distance
      );
      if (instant) { camera.position.copy(desired); controls.target.set(0, targetY, 0); controls.update(); }
      else animateCamera(desired, new THREE.Vector3(0, targetY, 0));
      controls.minDistance = Math.max(.55, distance * .28);
      controls.maxDistance = distance * 3.2;
    }

    function animateCamera(destination, target) {
      const start = camera.position.clone(); const startTarget = controls.target.clone(); const started = performance.now(); const duration = 570;
      function step(now) { const t = Math.min(1, (now - started) / duration); const eased = 1 - Math.pow(1 - t, 3); camera.position.lerpVectors(start, destination, eased); controls.target.lerpVectors(startTarget, target, eased); controls.update(); if (t < 1) requestAnimationFrame(step); }
      requestAnimationFrame(step);
    }

    function addEventListeners() {
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
        if (tower) frameCamera(tower.userData.levels, tower.userData.study, true);
      });
      levelsInput.addEventListener('input', () => { levelValue.textContent = levelsInput.value; });
      levelsInput.addEventListener('change', () => {
        currentLevels = +levelsInput.value;
        if (currentMode === 'tower') buildTower(currentLevels, 'tower');
      });
      modeButtons.forEach(button => button.addEventListener('click', () => {
        currentMode = button.dataset.mode; modeButtons.forEach(b => b.classList.toggle('active', b === button));
        buildTower(currentLevels, currentMode);
      }));
      autoInput.addEventListener('change', () => { controls.autoRotate = autoInput.checked; });
      resetButton.addEventListener('click', () => frameCamera(tower.userData.levels, tower.userData.study));

      // 画面をタップすると最初から注ぎ直す。カメラのドラッグと区別するため、
      // 押してから離すまでの移動が小さく、時間も短いときだけ発火させる。
      let pressedAt = 0, pressedX = 0, pressedY = 0;
      renderer.domElement.addEventListener('pointerdown', event => {
        pressedAt = performance.now(); pressedX = event.clientX; pressedY = event.clientY;
      });
      renderer.domElement.addEventListener('pointerup', event => {
        const moved = Math.hypot(event.clientX - pressedX, event.clientY - pressedY);
        if (!pour || moved > 6 || performance.now() - pressedAt > 300) return;
        pour.controller.reset();
        pour.apply();
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      elapsed += delta;
      if (pour && pour.controller.update(delta)) pour.apply(delta);
      if (tower) tower.traverse(obj => {
        if (obj.parent && obj.parent.userData.isBubbles) {
          const d = obj.userData;
          obj.position.y = d.initialY + Math.sin(elapsed * d.speed * 4 + d.phase) * .0022;
        }
      });
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
