<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100d0b" />
  <title>Champagne Tower — Glass Study</title>
  <style>
    :root {
      --ink: #f4eee5;
      --muted: #b6aba1;
      --line: rgba(247, 233, 211, .16);
      --panel: rgba(21, 17, 14, .76);
      --gold: #e9c47a;
      --gold-bright: #ffd986;
      --danger: #ffb5a7;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100d0b; }
    body {
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    #app, #viewport { position: fixed; inset: 0; }
    #viewport { background: radial-gradient(circle at 50% 20%, #282018 0%, #17120f 42%, #090807 100%); cursor: grab; touch-action: none; }
    #viewport:active { cursor: grabbing; }
    #viewport canvas { display: block; width: 100%; height: 100%; }
    #grain {
      position: fixed; inset: 0; pointer-events: none; opacity: .095; mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
    }
    .vignette { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 190px 45px rgba(0,0,0,.58); }
    header {
      position: fixed; inset: 0 0 auto 0; z-index: 3; display: flex; align-items: flex-start; justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 24px 0; pointer-events: none;
    }
    .brand { letter-spacing: .15em; text-transform: uppercase; font-size: 10px; line-height: 1.45; color: #d3c6ba; }
    .brand strong { display: block; font-family: Georgia, "Times New Roman", serif; letter-spacing: .08em; font-size: 18px; color: #fff7ea; font-weight: 400; }
    .badge { border: 1px solid rgba(233,196,122,.32); border-radius: 999px; padding: 7px 10px; color: #e9c47a; background: rgba(15,12,10,.5); backdrop-filter: blur(12px); font-size: 10px; letter-spacing: .08em; }
    #control-panel {
      position: fixed; z-index: 4; left: 24px; bottom: max(24px, env(safe-area-inset-bottom)); width: min(348px, calc(100vw - 48px));
      padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); backdrop-filter: blur(18px) saturate(125%); box-shadow: 0 16px 60px rgba(0,0,0,.28);
    }
    .panel-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
    .eyebrow { margin: 0 0 3px; color: var(--gold); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 400; letter-spacing: .01em; }
    .glass-count { flex: none; text-align: right; color: #f7e5c0; font-family: Georgia, "Times New Roman", serif; font-size: 23px; line-height: .9; }
    .glass-count span { display: block; margin-top: 5px; color: var(--muted); font-family: inherit; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; }
    .rule { height: 1px; background: var(--line); margin: 0 0 15px; }
    .control-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .control-row + .control-row { margin-top: 13px; }
    .control-label { color: #e4d9ce; font-size: 12px; letter-spacing: .02em; }
    .control-caption { margin-top: 3px; color: #968c83; font-size: 10px; }
    .range-wrap { width: 155px; display: flex; align-items: center; gap: 10px; }
    input[type="range"] { width: 100%; accent-color: var(--gold); cursor: pointer; }
    output { width: 21px; color: var(--gold-bright); font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; }
    .segmented { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .segmented button, .icon-button, #reset-view {
      border: 0; color: #cfc4b8; background: transparent; font: inherit; cursor: pointer; transition: background .18s ease, color .18s ease;
    }
    .segmented button { min-width: 60px; padding: 7px 9px; font-size: 11px; }
    .segmented button + button { border-left: 1px solid var(--line); }
    .segmented button.active { color: #241a0b; background: var(--gold); }
    .switch { position: relative; display: inline-flex; align-items: center; gap: 8px; color: #cfc4b8; font-size: 11px; cursor: pointer; user-select: none; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch-ui { width: 32px; height: 18px; padding: 2px; border: 1px solid rgba(244,238,229,.22); border-radius: 999px; transition: background .2s ease; }
    .switch-ui::after { content: ""; display: block; width: 12px; height: 12px; border-radius: 50%; background: #9d938a; transition: transform .2s ease, background .2s ease; }
    .switch input:checked + .switch-ui { background: #ad8033; border-color: #e9c47a; }
    .switch input:checked + .switch-ui::after { transform: translateX(14px); background: #fff6df; }
    #reset-view { margin-top: 16px; width: 100%; padding: 10px; border: 1px solid rgba(233,196,122,.31); border-radius: 8px; color: #ead09b; font-size: 11px; letter-spacing: .06em; }
    #reset-view:hover { color: #251a0a; background: var(--gold); }
    .hint { position: fixed; z-index: 3; right: 24px; bottom: max(25px, env(safe-area-inset-bottom)); color: rgba(230,220,208,.7); font-size: 10px; letter-spacing: .03em; text-align: right; pointer-events: none; }
    .hint kbd { display: inline-block; margin: 0 2px; padding: 2px 5px; border: 1px solid rgba(245,235,222,.2); border-radius: 4px; font: inherit; color: rgba(255,247,234,.85); }
    #loading, #fallback { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; background: #100d0b; }
    #loading .load-card, #fallback .load-card { text-align: center; padding: 30px; }
    .loading-line { width: 135px; height: 1px; margin: 17px auto 0; overflow: hidden; background: rgba(233,196,122,.18); }
    .loading-line::after { content: ""; display: block; height: 100%; background: #e9c47a; animation: loading 1.2s ease-in-out infinite; }
    @keyframes loading { from { width: 0; margin-left: 0; } 50% { width: 70%; margin-left: 20%; } to { width: 0; margin-left: 100%; } }
    #fallback { display: none; }
    #fallback p { max-width: 360px; color: var(--muted); font-size: 13px; line-height: 1.8; }
    @media (max-width: 660px) {
      header { padding: max(16px, env(safe-area-inset-top)) 16px 0; }
      .brand strong { font-size: 16px; }
      .badge { font-size: 9px; }
      #control-panel { left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: calc(100vw - 24px); padding: 15px; }
      .hint { display: none; }
      .range-wrap { width: 145px; }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="シャンパンタワー3Dプレビュー">
    <div id="viewport" aria-label="3Dシーン。ドラッグで回転、ホイールまたはピンチでズーム"></div>
    <div id="grain"></div><div class="vignette"></div>
    <header>
      <div class="brand"><strong>Champagne Tower</strong>Real Glass Study</div>
      <div class="badge">INTERACTIVE 3D</div>
    </header>
    <section id="control-panel" aria-label="タワー設定">
      <div class="panel-top">
        <div><p class="eyebrow">Configuration</p><h1>静かな祝祭</h1></div>
        <div class="glass-count" id="glassCount">1<span>Coupe glass</span></div>
      </div>
      <div class="rule"></div>
      <div class="control-row">
        <div><div class="control-label">段数</div><div class="control-caption">1〜10段を自動配置</div></div>
        <div class="range-wrap"><input id="levels" type="range" min="1" max="10" value="1" aria-label="段数" /><output id="levelValue" for="levels">1</output></div>
      </div>
      <div class="control-row">
        <div><div class="control-label">表示モード</div><div class="control-caption">品質確認 / タワー表示</div></div>
        <div class="segmented" role="group" aria-label="表示モード"><button type="button" class="active" data-mode="study">1杯</button><button type="button" data-mode="tower">タワー</button></div>
      </div>
      <div class="control-row">
        <div><div class="control-label">回転演出</div><div class="control-caption">ゆっくりと全体を回転</div></div>
        <label class="switch"><input id="autorotate" type="checkbox" checked /><span class="switch-ui"></span><span>ON</span></label>
      </div>
      <button id="reset-view" type="button">カメラを整える</button>
    </section>
    <div class="hint"><kbd>ドラッグ</kbd> 回転　 <kbd>ホイール / ピンチ</kbd> ズーム　 <kbd>2本指</kbd> 移動</div>
    <div id="loading"><div class="load-card"><p class="eyebrow">Preparing the glass</p><div class="loading-line"></div></div></div>
    <div id="fallback"><div class="load-card"><p class="eyebrow">3D Preview Unavailable</p><p>このブラウザでは3D表示を開始できませんでした。WebGL対応の最新ブラウザでお試しください。</p></div></div>
  </main>


  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

    const viewport = document.getElementById('viewport');
    const loading = document.getElementById('loading');
    const fallback = document.getElementById('fallback');
    const levelsInput = document.getElementById('levels');
    const levelValue = document.getElementById('levelValue');
    const glassCount = document.getElementById('glassCount');
    const modeButtons = [...document.querySelectorAll('[data-mode]')];
    const autoInput = document.getElementById('autorotate');
    const resetButton = document.getElementById('reset-view');

    let renderer, scene, camera, controls, clock, pmrem;
    let tower = null, room = null, lightRig = null;
    let materials, geometries;
    const requestState = new URLSearchParams(location.search);
    let currentMode = requestState.get('mode') === 'tower' ? 'tower' : 'study';
    let currentLevels = Math.max(1, Math.min(10, Number.parseInt(requestState.get('levels'), 10) || 1));
    levelsInput.value = currentLevels;
    modeButtons.forEach(button => button.classList.toggle('active', button.dataset.mode === currentMode));

    // 1 unit = 100mm。実寸のクープグラス（口径95mm / 全高130mm / 台座径65mm）をそのまま数値で扱う。
    const GLASS = {
      rimY: 1.30,          // 縁の高さ 130mm
      rimOuter: .4775,     // 口径 95.5mm
      rimThickness: .0125, // 縁の肉厚 2.5mm（折り返しの半径）
      // 鉢は「縁が最も広い一続きの楕円面」。上部を垂直にするとカップに見えてしまう。
      bowlOuterB: .455,    // 鉢外面の深さ方向の半径
      bowlInnerR: .4525,   // 鉢内面の口径側半径（= rimOuter - 縁の肉厚×2）
      bowlInnerB: .418,    // 鉢内面の深さ。外面との差が鉢底のガラス厚 9mm
      stemR: .0315,        // ステム 直径6.3mm
      baseR: .285,         // 台座 直径57mm
      liquidLevel: 1.10,   // 鉢の深さの約5割
      floorY: .882,        // 鉢の内底 = rimY - bowlInnerB
      pitch: .962,         // タワーで縁同士が触れる間隔
      stack: 1.3125        // 縁の頂点。上段の台座はここに載る
    };

    const LIQUID_RX = GLASS.bowlInnerR - .003, LIQUID_RY = GLASS.bowlInnerB - .0025;
    const liquidTopRadius = level => bowlRadiusAt(LIQUID_RX, LIQUID_RY, level);

    try { init(); animate(); } catch (error) { console.error(error); loading.style.display = 'none'; fallback.style.display = 'grid'; }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090807);
      scene.fog = new THREE.FogExp2(0x090807, .028);

      camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, .05, 200);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.02;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      viewport.appendChild(renderer.domElement);

      RectAreaLightUniformsLib.init();
      buildEnvironmentMap();
      createSharedAssets();

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = .055;
      controls.maxPolarAngle = Math.PI * .495;
      controls.autoRotate = autoInput.checked;
      controls.autoRotateSpeed = .42;
      controls.screenSpacePanning = true;
      controls.touches.ONE = THREE.TOUCH.ROTATE;
      controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;
      clock = new THREE.Clock();

      addRoom();
      buildTower(currentLevels, currentMode);
      addEventListeners();
      setTimeout(() => { loading.style.opacity = '0'; loading.style.transition = 'opacity .45s'; setTimeout(() => loading.remove(), 480); }, 350);
    }

    // ── 環境マップ ─────────────────────────────────────────────
    // ガラスの見た目は「ガラスに映るもの」で決まる。撮影セットと同じ配置の発光面を組み、
    // PMREM で scene.environment に焼き込む。これが無いとPBRガラスは黒く沈み、プラスチックになる。
    function buildEnvironmentMap() {
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x050404);

      const room = new THREE.Mesh(new THREE.BoxGeometry(26, 14, 26), new THREE.MeshBasicMaterial({ color: 0x060505, side: THREE.BackSide }));
      room.position.y = 5;
      envScene.add(room);

      const emitter = (hex, gain, w, h, x, y, z) => {
        const material = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
        material.color.setHex(hex, THREE.SRGBColorSpace).multiplyScalar(gain);
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
        mesh.position.set(x, y, z); mesh.lookAt(0, 1, 0); envScene.add(mesh);
      };
      emitter(0xfff3dd, 3.3, 5.4, 3.8, 2.3, 4.6, 2.6);   // 大型ソフトライト
      emitter(0xdce9ff, 1.5, 4.2, 5.0, -4.6, 2.2, 1.2);  // 左の寒色リフレクター
      emitter(0xffcf95, 1.3, 3.0, 3.4, 4.4, 1.9, -1.4);  // 右の暖色リフレクター
      emitter(0xffd9a4, 6.2, 2.8, 1.15, 0, 1.05, -3.0);  // 背面ライト（液体を透かす）
      emitter(0xfff0d8, .5, 3.2, 3.2, .4, 6.6, -.6);     // 上部ライト
      emitter(0x120d09, 1.0, 16, 16, 0, -.02, 0);        // 床からの弱い反射

      pmrem = new THREE.PMREMGenerator(renderer);
      const target = pmrem.fromScene(envScene, .012);
      scene.environment = target.texture;
      scene.environmentIntensity = 1.0;
      envScene.traverse(object => { if (object.isMesh) { object.geometry.dispose(); object.material.dispose(); } });
    }

    // ── 背景 ───────────────────────────────────────────────────
    // 撮影のホリゾント紙にあたるグラデーション。上が沈み、グラス背後がわずかに持ち上がる。
    function createBackdropTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 32; canvas.height = 256;
      const context = canvas.getContext('2d');
      const gradient = context.createLinearGradient(0, 0, 0, 256);
      gradient.addColorStop(0, '#070605');
      gradient.addColorStop(.52, '#0d0a08');
      gradient.addColorStop(.78, '#241a12');
      gradient.addColorStop(1, '#120d09');
      context.fillStyle = gradient; context.fillRect(0, 0, 32, 256);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function addRoom() {
      room = new THREE.Group();
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(80, 30), new THREE.MeshBasicMaterial({ map: createBackdropTexture() }));
      backWall.position.set(0, 10, -11); backWall.receiveShadow = true; room.add(backWall);

      // 石材のテーブル面。わずかな鏡面反射だけを残し、映り込みで接地を見せる。
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x070605, roughness: .86, metalness: 0, envMapIntensity: .2 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; room.add(floor);
      scene.add(room);
    }

    // 撮影セットの寸法はグラス1個に合わせてある。タワーが高くなったら、
    // ライトも背景もセットごと同じ倍率で大きくする（照明の見え方を保ったまま被写体だけ大きくなる）。
    function applySceneScale(scale) {
      room.scale.setScalar(scale);
      scene.fog.density = .028 / scale;
      addLights(scale);
    }

    function addLights(scale = 1) {
      if (lightRig) { scene.remove(lightRig); lightRig.traverse(object => { if (object.isLight && object.dispose) object.dispose(); }); }
      lightRig = new THREE.Group();
      lightRig.add(new THREE.HemisphereLight(0x2a3240, 0x120c07, .18));
      // 面光源は位置も寸法も同じ倍率で拡大するので、被写体が受ける照度は変わらない。
      const rect = (hex, intensity, w, h, x, y, z) => {
        const light = new THREE.RectAreaLight(hex, intensity, w * scale, h * scale);
        light.position.set(x * scale, y * scale, z * scale); light.lookAt(0, .9 * scale, 0); lightRig.add(light);
      };
      rect(0xfff3dd, 4.4, 5.4, 3.8, 2.3, 4.6, 2.6);   // 大型ソフトライト
      rect(0xdce9ff, 1.3, 4.2, 5.0, -4.6, 2.2, 1.2);  // 左の反射
      rect(0xffcf95, 1.1, 3.0, 3.4, 4.4, 1.9, -1.4);  // 右の反射
      rect(0xffd9a4, 11, 2.8, 1.15, 0, 1.05, -3.0);   // 背面ライト（液体を透かす）
      rect(0xfff0d8, .6, 3.2, 3.2, .4, 6.6, -.6);     // 上部ライト

      // 接地影のためのスポット。演出ではなく、床にグラスを置くための1灯。
      // 点光源は距離減衰があるので、倍率に合わせて光量を上げる。
      const key = new THREE.SpotLight(0xffeed2, 30 * Math.pow(scale, 1.7), 22 * scale, Math.PI / 9, .95, 1.7);
      key.position.set(1.5 * scale, 6.2 * scale, 2.1 * scale);
      key.target.position.set(0, 0, 0);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.bias = -.0012;
      key.shadow.normalBias = .012 * scale;
      key.shadow.camera.near = 1 * scale; key.shadow.camera.far = 24 * scale;
      lightRig.add(key, key.target);
      scene.add(lightRig);
    }

    // ── ガラス形状 ─────────────────────────────────────────────
    // 外面・内面・縁・底を1本の閉じた輪郭にして、1つの LatheGeometry として回転させる。
    // 厚みが形状として存在するので、屈折と全反射が縁とボウル底に自然に出る。
    function pushSpline(points, controls, steps) {
      const sampled = new THREE.SplineCurve(controls.map(p => new THREE.Vector2(p[0], p[1]))).getPoints(Math.max(2, steps));
      for (let i = 1; i < sampled.length; i++) points.push(sampled[i]);
    }
    // 鉢の楕円面。t=0 が縁、t=90° が軸上（鉢の底）。
    function pushEllipse(points, rx, ry, fromDeg, toDeg, steps) {
      const count = Math.max(2, steps);
      for (let i = 1; i <= count; i++) {
        const t = THREE.MathUtils.degToRad(fromDeg + (toDeg - fromDeg) * (i / count));
        points.push(new THREE.Vector2(rx * Math.cos(t), GLASS.rimY - ry * Math.sin(t)));
      }
    }
    function bowlRadiusAt(rx, ry, y) {
      return rx * Math.sqrt(Math.max(0, 1 - Math.pow((GLASS.rimY - y) / ry, 2)));
    }
    function pushArc(points, cx, cy, radius, from, to, steps) {
      const count = Math.max(2, steps);
      for (let i = 1; i <= count; i++) {
        const angle = from + (to - from) * (i / count);
        points.push(new THREE.Vector2(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius));
      }
    }

    function createCoupeProfile(detail = 1, variance = 0) {
      const rimT = GLASS.rimThickness * (1 + variance);
      const s = n => Math.max(2, Math.round(n * detail));
      // 鉢の外面が軸に向かって曲がり始める角度。ここからステムへ繋ぐ。
      const neck = 74;
      const neckPoint = [GLASS.rimOuter * Math.cos(THREE.MathUtils.degToRad(neck)),
                         GLASS.rimY - GLASS.bowlOuterB * Math.sin(THREE.MathUtils.degToRad(neck))];
      const points = [new THREE.Vector2(0, .0068)];
      // 台座の裏。中央を浅く凹ませ、接地するのは縁だけにする。
      pushSpline(points, [[0, .0068], [.125, .004], [.212, .0058], [.259, .0155]], s(9));
      // 台座の縁。ここに乗るハイライトがガラスの厚みを語る。
      pushArc(points, .2595, .0278, .0123, -Math.PI / 2.1, Math.PI / 2.3, s(9));
      // 台座上面 → ステム付け根へドーム状に立ち上がる。
      pushSpline(points, [[.2578, .0398], [.19, .0488], [.113, .0698], [.061, .1075], [.0405, .166]], s(13));
      // ステム。細く長く、上端で鉢の底へ向けてわずかに太る。
      pushSpline(points, [[.0405, .166], [.0332, .325], [.0315, .50], [.0348, .66], [.047, .775]], s(14));
      // ステム → 鉢の底のくびれ。
      pushSpline(points, [[.047, .775], [.073, .823], neckPoint], s(7));
      // 鉢の外面。縁が最も広く、そこから一続きの楕円で底まで回り込む。
      pushEllipse(points, GLASS.rimOuter, GLASS.bowlOuterB, neck, 0, s(24));
      // 縁。外面から内面へ厚み分だけ回り込ませる。
      pushArc(points, GLASS.rimOuter - rimT, GLASS.rimY, rimT, 0, Math.PI, s(14));
      // 鉢の内面 → 内底（軸上で閉じる）。
      pushEllipse(points, GLASS.rimOuter - rimT * 2, GLASS.bowlInnerB, 0, 90, s(26));
      return points;
    }

    // 液体は鉢の内面をわずかに内側へオフセットした楕円面。液面の高さは自由に変えられる。
    function createLiquidProfile(level, detail = 1) {
      const s = n => Math.max(2, Math.round(n * detail));
      const top = THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp((GLASS.rimY - level) / LIQUID_RY, 0, 1)));
      const points = [new THREE.Vector2(0, GLASS.rimY - LIQUID_RY)];
      pushEllipse(points, LIQUID_RX, LIQUID_RY, 90, top, s(20));
      const radius = liquidTopRadius(level);
      points.push(new THREE.Vector2(radius * .994, level)); // 液面。ごく短い面取りで縁を立たせる
      points.push(new THREE.Vector2(0, level));
      return points;
    }

    function createSharedAssets() {
      // ガラス：Alphaを使わず、transmission と実形状の厚みだけで透明感を出す。
      const glassBase = {
        color: 0xffffff, metalness: 0, transmission: 1, ior: 1.5,
        thickness: .028, attenuationColor: new THREE.Color(0xe6f2ea), attenuationDistance: 3.2,
        specularIntensity: 1, envMapIntensity: 1, side: THREE.DoubleSide, transparent: false, depthWrite: true
      };
      materials = {
        // §9 個体差。肉眼で歪みに見えない範囲の roughness 微差。
        glass: [.028, .034, .041].map(roughness => new THREE.MeshPhysicalMaterial({ ...glassBase, roughness })),
        // シャンパンは非透過側に置く。透過マテリアル同士は互いの屈折用バックドロップに載らず、
        // 液体を transmission にするとガラス越しに消えてしまうため。
        // 透明感は「ガラスが液体を屈折させる」ことと、背面ライトを受ける低ラフネスの表面で出す。
        liquid: new THREE.MeshPhysicalMaterial({
          color: 0xe0bc78, metalness: 0, roughness: .095, ior: 1.34,
          emissive: new THREE.Color(0x1d1104), emissiveIntensity: 1,
          clearcoat: .3, clearcoatRoughness: .12, specularIntensity: 1,
          envMapIntensity: 2.1, side: THREE.FrontSide, transparent: false, depthWrite: true
        }),
        // 液面。拡散主体だと平坦なクリーム色の円板になるため、環境を映す光沢面として分離する。
        liquidSurface: new THREE.MeshPhysicalMaterial({
          color: 0x6d4a14, metalness: 0, roughness: .035, ior: 1.34,
          clearcoat: 1, clearcoatRoughness: .04, specularIntensity: 1,
          envMapIntensity: 1.9, side: THREE.FrontSide, transparent: false, depthWrite: true
        }),
        bubble: new THREE.MeshPhysicalMaterial({
          color: 0xfff3d8, metalness: 0, roughness: .045, ior: 1.34,
          clearcoat: 1, clearcoatRoughness: .02, specularIntensity: 1,
          envMapIntensity: 2.2, side: THREE.FrontSide, transparent: false, depthWrite: true
        })
      };
      geometries = {
        glass: new THREE.LatheGeometry(createCoupeProfile(1), 128),
        liquid: new THREE.LatheGeometry(createLiquidProfile(GLASS.liquidLevel, 1), 128),
        // タワー用は同じ輪郭の低解像度版。形は変えずに頂点数だけ落とす。
        glassLow: new THREE.LatheGeometry(createCoupeProfile(.45), 44),
        liquidLow: new THREE.LatheGeometry(createLiquidProfile(GLASS.liquidLevel, .45), 44),
        surface: new THREE.CircleGeometry(liquidTopRadius(GLASS.liquidLevel) * .997, 96),
        surfaceLow: new THREE.CircleGeometry(liquidTopRadius(GLASS.liquidLevel) * .997, 40),
        bubble: new THREE.SphereGeometry(1, 12, 8)
      };
    }

    function mulberry32(a) { return function() { let t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

    function createGlass(seed = 0, bubbleCount = 9, detailed = true) {
      const group = new THREE.Group();
      const random = mulberry32(seed * 281 + 17);
      const body = new THREE.Mesh(detailed ? geometries.glass : geometries.glassLow, materials.glass[seed % materials.glass.length]);
      body.castShadow = true;
      group.add(body);

      const level = GLASS.liquidLevel + (random() - .5) * .012; // §9 シャンパン量の微差
      const liquid = new THREE.Mesh(detailed ? geometries.liquid : geometries.liquidLow, materials.liquid);
      liquid.position.y = level - GLASS.liquidLevel;
      group.add(liquid);
      const surface = new THREE.Mesh(detailed ? geometries.surface : geometries.surfaceLow, materials.liquidSurface);
      surface.rotation.x = -Math.PI / 2; surface.position.y = level + .0016;
      group.add(surface);

      // 気泡。液面に達した泡と、内壁ぎわに集まるコルレット（泡の輪）として置く。
      // 少数に抑え、将来アニメーション化できるよう個体ごとのグループで持つ。
      const bubbles = new THREE.Group();
      for (let i = 0; i < bubbleCount; i++) {
        const edgeBiased = i % 4 !== 0;
        const surfaceR = liquidTopRadius(level);
        const spread = edgeBiased ? surfaceR * (.88 + random() * .095) : surfaceR * (.12 + random() * .68);
        const angle = random() * Math.PI * 2;
        const radius = .0075 + random() * (edgeBiased ? .006 : .0095);
        const y = level + radius * .45;
        const bubble = new THREE.Mesh(geometries.bubble, materials.bubble);
        bubble.scale.setScalar(radius);
        bubble.position.set(Math.cos(angle) * spread, y, Math.sin(angle) * spread);
        bubble.userData = { phase: random() * Math.PI * 2, initialY: y, speed: .08 + random() * .1 };
        bubbles.add(bubble);
      }
      bubbles.userData.isBubbles = true;
      group.add(bubbles);
      group.userData.seed = seed;
      return group;
    }

    // ── 配置 ───────────────────────────────────────────────────
    // 配置ロジックはグラス生成から独立させ、将来の形状（正方形・円形・横長）追加に備える。
    function createLayout(levels) {
      const placements = [];
      for (let level = 0; level < levels; level++) {
        const side = levels - level;
        for (let ix = 0; ix < side; ix++) for (let iz = 0; iz < side; iz++) {
          placements.push({
            x: (ix - (side - 1) / 2) * GLASS.pitch,
            y: level * GLASS.stack,
            z: (iz - (side - 1) / 2) * GLASS.pitch,
            rotation: ((placements.length * 13) % 11 - 5) * .0032 // §9 微小な回転差
          });
        }
      }
      return placements;
    }

    function createInstancedTower(placements) {
      const instances = new THREE.Group();
      const count = placements.length;
      const addLayer = (geometry, material, offsetY = 0, rotationX = 0) => {
        const mesh = new THREE.InstancedMesh(geometry, material, count);
        const position = new THREE.Vector3(); const quaternion = new THREE.Quaternion();
        const scale = new THREE.Vector3(1, 1, 1); const matrix = new THREE.Matrix4(); const euler = new THREE.Euler();
        placements.forEach((item, index) => {
          position.set(item.x, item.y + offsetY, item.z);
          euler.set(rotationX, item.rotation, 0);
          quaternion.setFromEuler(euler);
          matrix.compose(position, quaternion, scale);
          mesh.setMatrixAt(index, matrix);
        });
        mesh.instanceMatrix.needsUpdate = true;
        mesh.castShadow = true;
        instances.add(mesh);
      };
      // 385脚（10段）でも1ドローコールに収める。
      addLayer(geometries.glassLow, materials.glass[0]);
      addLayer(geometries.liquidLow, materials.liquid);
      addLayer(geometries.surfaceLow, materials.liquidSurface, GLASS.liquidLevel + .0016, -Math.PI / 2);

      const bubbles = new Float32Array(count * 2 * 3);
      const random = mulberry32(count * 101 + 7);
      placements.forEach((item, index) => {
        for (let b = 0; b < 2; b++) {
          const angle = random() * Math.PI * 2; const spread = Math.sqrt(random()) * .34; const at = (index * 2 + b) * 3;
          bubbles[at] = item.x + Math.cos(angle) * spread;
          bubbles[at + 1] = item.y + .92 + random() * .2;
          bubbles[at + 2] = item.z + Math.sin(angle) * spread;
        }
      });
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(bubbles, 3));
      const material = new THREE.PointsMaterial({ color: 0xffeec2, size: .014, transparent: true, opacity: .68, sizeAttenuation: true, depthWrite: false });
      const points = new THREE.Points(geometry, material);
      points.userData.dynamicAsset = true;
      instances.add(points);
      return instances;
    }

    function buildTower(levels, mode = 'tower') {
      if (tower) { scene.remove(tower); disposeObject(tower); }
      tower = new THREE.Group();
      const study = mode === 'study';
      const actualLevels = study ? 1 : levels;
      const placements = createLayout(actualLevels);
      if (actualLevels >= 6) {
        tower.add(createInstancedTower(placements));
      } else {
        placements.forEach((item, index) => {
          const glass = createGlass(index + 1, study ? 16 : 7, actualLevels <= 3);
          glass.position.set(item.x, item.y, item.z);
          glass.rotation.y = item.rotation;
          tower.add(glass);
        });
      }
      tower.userData = { levels: actualLevels, count: placements.length, study };
      scene.add(tower);
      const towerHeight = (actualLevels - 1) * GLASS.stack + GLASS.rimY;
      applySceneScale(Math.max(1, towerHeight / 1.5));
      renderer.transmissionResolutionScale = study ? 1 : (actualLevels >= 6 ? .5 : .75);
      updateStatus(placements.length, actualLevels, study);
      frameCamera(actualLevels, study, true);
    }

    function disposeObject(object) {
      object.traverse(child => { if (child.userData.dynamicAsset) { child.geometry.dispose(); child.material.dispose(); } if (child.isInstancedMesh) child.dispose(); });
      object.clear();
    }

    function updateStatus(count, levels, study) {
      glassCount.innerHTML = `${count}<span>${study ? 'Coupe glass' : `${levels} tiers · Coupe glasses`}</span>`;
      levelValue.textContent = levelsInput.value;
    }

    // 画角から必要距離を縦横それぞれ求め、大きい方を採用する。10段でも画面からはみ出さない。
    function frameCamera(levels, study, instant = false) {
      const height = (levels - 1) * GLASS.stack + GLASS.rimY;
      const radius = study ? GLASS.rimOuter : levels * GLASS.pitch * .5;
      // 被写体を包む球で距離を決める。カメラを見上げ／見下ろしても収まりが崩れない。
      const margin = study ? 1.32 : 1.06;
      const halfV = THREE.MathUtils.degToRad(camera.fov) / 2;
      const halfH = Math.atan(Math.tan(halfV) * camera.aspect);
      const bounding = Math.hypot(height * .5, radius);
      const distance = bounding / Math.sin(Math.min(halfV, halfH)) * margin;
      const targetY = study ? height * .52 : height * .5;
      const elevation = study ? .17 : .28, azimuth = .62;
      const desired = new THREE.Vector3(
        Math.sin(azimuth) * Math.cos(elevation) * distance,
        targetY + Math.sin(elevation) * distance,
        Math.cos(azimuth) * Math.cos(elevation) * distance
      );
      if (instant) { camera.position.copy(desired); controls.target.set(0, targetY, 0); controls.update(); }
      else animateCamera(desired, new THREE.Vector3(0, targetY, 0));
      controls.minDistance = Math.max(.55, distance * .28);
      controls.maxDistance = distance * 3.2;
    }

    function animateCamera(destination, target) {
      const start = camera.position.clone(); const startTarget = controls.target.clone(); const started = performance.now(); const duration = 570;
      function step(now) { const t = Math.min(1, (now - started) / duration); const eased = 1 - Math.pow(1 - t, 3); camera.position.lerpVectors(start, destination, eased); controls.target.lerpVectors(startTarget, target, eased); controls.update(); if (t < 1) requestAnimationFrame(step); }
      requestAnimationFrame(step);
    }

    function addEventListeners() {
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
        if (tower) frameCamera(tower.userData.levels, tower.userData.study, true);
      });
      levelsInput.addEventListener('input', () => { levelValue.textContent = levelsInput.value; });
      levelsInput.addEventListener('change', () => {
        currentLevels = +levelsInput.value;
        if (currentMode === 'tower') buildTower(currentLevels, 'tower');
      });
      modeButtons.forEach(button => button.addEventListener('click', () => {
        currentMode = button.dataset.mode; modeButtons.forEach(b => b.classList.toggle('active', b === button));
        buildTower(currentLevels, currentMode);
      }));
      autoInput.addEventListener('change', () => { controls.autoRotate = autoInput.checked; });
      resetButton.addEventListener('click', () => frameCamera(tower.userData.levels, tower.userData.study));
    }

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      if (tower) tower.traverse(obj => {
        if (obj.parent && obj.parent.userData.isBubbles) {
          const d = obj.userData;
          obj.position.y = d.initialY + Math.sin(elapsed * d.speed * 4 + d.phase) * .0022;
        }
      });
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
