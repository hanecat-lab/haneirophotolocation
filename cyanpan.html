<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100d0b" />
  <title>Champagne Tower — Glass Study</title>
  <style>
    :root {
      --ink: #f4eee5;
      --muted: #b6aba1;
      --line: rgba(247, 233, 211, .16);
      --panel: rgba(21, 17, 14, .76);
      --gold: #e9c47a;
      --gold-bright: #ffd986;
      --danger: #ffb5a7;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100d0b; }
    body {
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    #app, #viewport { position: fixed; inset: 0; }
    #viewport { background: radial-gradient(circle at 50% 20%, #282018 0%, #17120f 42%, #090807 100%); cursor: grab; touch-action: none; }
    #viewport:active { cursor: grabbing; }
    #viewport canvas { display: block; width: 100%; height: 100%; }
    #grain {
      position: fixed; inset: 0; pointer-events: none; opacity: .095; mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
    }
    .vignette { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 190px 45px rgba(0,0,0,.58); }
    header {
      position: fixed; inset: 0 0 auto 0; z-index: 3; display: flex; align-items: flex-start; justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 24px 0; pointer-events: none;
    }
    .brand { letter-spacing: .15em; text-transform: uppercase; font-size: 10px; line-height: 1.45; color: #d3c6ba; }
    .brand strong { display: block; font-family: Georgia, "Times New Roman", serif; letter-spacing: .08em; font-size: 18px; color: #fff7ea; font-weight: 400; }
    .badge { border: 1px solid rgba(233,196,122,.32); border-radius: 999px; padding: 7px 10px; color: #e9c47a; background: rgba(15,12,10,.5); backdrop-filter: blur(12px); font-size: 10px; letter-spacing: .08em; }
    #control-panel {
      position: fixed; z-index: 4; left: 24px; bottom: max(24px, env(safe-area-inset-bottom)); width: min(348px, calc(100vw - 48px));
      padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); backdrop-filter: blur(18px) saturate(125%); box-shadow: 0 16px 60px rgba(0,0,0,.28);
    }
    .panel-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
    .eyebrow { margin: 0 0 3px; color: var(--gold); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 400; letter-spacing: .01em; }
    .glass-count { flex: none; text-align: right; color: #f7e5c0; font-family: Georgia, "Times New Roman", serif; font-size: 23px; line-height: .9; }
    .glass-count span { display: block; margin-top: 5px; color: var(--muted); font-family: inherit; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; }
    .rule { height: 1px; background: var(--line); margin: 0 0 15px; }
    .control-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .control-row + .control-row { margin-top: 13px; }
    .control-label { color: #e4d9ce; font-size: 12px; letter-spacing: .02em; }
    .control-caption { margin-top: 3px; color: #968c83; font-size: 10px; }
    .range-wrap { width: 155px; display: flex; align-items: center; gap: 10px; }
    input[type="range"] { width: 100%; accent-color: var(--gold); cursor: pointer; }
    output { width: 21px; color: var(--gold-bright); font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; }
    .segmented { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .segmented button, .icon-button, #reset-view {
      border: 0; color: #cfc4b8; background: transparent; font: inherit; cursor: pointer; transition: background .18s ease, color .18s ease;
    }
    .segmented button { min-width: 60px; padding: 7px 9px; font-size: 11px; }
    .segmented button + button { border-left: 1px solid var(--line); }
    .segmented button.active { color: #241a0b; background: var(--gold); }
    .switch { position: relative; display: inline-flex; align-items: center; gap: 8px; color: #cfc4b8; font-size: 11px; cursor: pointer; user-select: none; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch-ui { width: 32px; height: 18px; padding: 2px; border: 1px solid rgba(244,238,229,.22); border-radius: 999px; transition: background .2s ease; }
    .switch-ui::after { content: ""; display: block; width: 12px; height: 12px; border-radius: 50%; background: #9d938a; transition: transform .2s ease, background .2s ease; }
    .switch input:checked + .switch-ui { background: #ad8033; border-color: #e9c47a; }
    .switch input:checked + .switch-ui::after { transform: translateX(14px); background: #fff6df; }
    #reset-view { margin-top: 16px; width: 100%; padding: 10px; border: 1px solid rgba(233,196,122,.31); border-radius: 8px; color: #ead09b; font-size: 11px; letter-spacing: .06em; }
    #reset-view:hover { color: #251a0a; background: var(--gold); }
    .hint { position: fixed; z-index: 3; right: 24px; bottom: max(25px, env(safe-area-inset-bottom)); color: rgba(230,220,208,.7); font-size: 10px; letter-spacing: .03em; text-align: right; pointer-events: none; }
    .hint kbd { display: inline-block; margin: 0 2px; padding: 2px 5px; border: 1px solid rgba(245,235,222,.2); border-radius: 4px; font: inherit; color: rgba(255,247,234,.85); }
    #loading, #fallback { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; background: #100d0b; }
    #loading .load-card, #fallback .load-card { text-align: center; padding: 30px; }
    .loading-line { width: 135px; height: 1px; margin: 17px auto 0; overflow: hidden; background: rgba(233,196,122,.18); }
    .loading-line::after { content: ""; display: block; height: 100%; background: #e9c47a; animation: loading 1.2s ease-in-out infinite; }
    @keyframes loading { from { width: 0; margin-left: 0; } 50% { width: 70%; margin-left: 20%; } to { width: 0; margin-left: 100%; } }
    #fallback { display: none; }
    #fallback p { max-width: 360px; color: var(--muted); font-size: 13px; line-height: 1.8; }
    @media (max-width: 660px) {
      header { padding: max(16px, env(safe-area-inset-top)) 16px 0; }
      .brand strong { font-size: 16px; }
      .badge { font-size: 9px; }
      #control-panel { left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: calc(100vw - 24px); padding: 15px; }
      .hint { display: none; }
      .range-wrap { width: 145px; }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="シャンパンタワー3Dプレビュー">
    <div id="viewport" aria-label="3Dシーン。ドラッグで回転、ホイールまたはピンチでズーム"></div>
    <div id="grain"></div><div class="vignette"></div>
    <header>
      <div class="brand"><strong>Champagne Tower</strong>Real Glass Study</div>
      <div class="badge">INTERACTIVE 3D</div>
    </header>
    <section id="control-panel" aria-label="タワー設定">
      <div class="panel-top">
        <div><p class="eyebrow">Configuration</p><h1>静かな祝祭</h1></div>
        <div class="glass-count" id="glassCount">1<span>Coupe glass</span></div>
      </div>
      <div class="rule"></div>
      <div class="control-row">
        <div><div class="control-label">段数</div><div class="control-caption">1〜10段を自動配置</div></div>
        <div class="range-wrap"><input id="levels" type="range" min="1" max="10" value="1" aria-label="段数" /><output id="levelValue" for="levels">1</output></div>
      </div>
      <div class="control-row">
        <div><div class="control-label">表示モード</div><div class="control-caption">品質確認 / タワー表示</div></div>
        <div class="segmented" role="group" aria-label="表示モード"><button type="button" class="active" data-mode="study">1杯</button><button type="button" data-mode="tower">タワー</button></div>
      </div>
      <div class="control-row">
        <div><div class="control-label">回転演出</div><div class="control-caption">ゆっくりと全体を回転</div></div>
        <label class="switch"><input id="autorotate" type="checkbox" checked /><span class="switch-ui"></span><span>ON</span></label>
      </div>
      <button id="reset-view" type="button">カメラを整える</button>
    </section>
    <div class="hint"><kbd>ドラッグ</kbd> 回転　 <kbd>ホイール / ピンチ</kbd> ズーム　 <kbd>2本指</kbd> 移動</div>
    <div id="loading"><div class="load-card"><p class="eyebrow">Preparing the glass</p><div class="loading-line"></div></div></div>
    <div id="fallback"><div class="load-card"><p class="eyebrow">3D Preview Unavailable</p><p>このブラウザでは3D表示を開始できませんでした。WebGL対応の最新ブラウザでお試しください。</p></div></div>
  </main>

  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const viewport = document.getElementById('viewport');
    const loading = document.getElementById('loading');
    const fallback = document.getElementById('fallback');
    const levelsInput = document.getElementById('levels');
    const levelValue = document.getElementById('levelValue');
    const glassCount = document.getElementById('glassCount');
    const modeButtons = [...document.querySelectorAll('[data-mode]')];
    const autoInput = document.getElementById('autorotate');
    const resetButton = document.getElementById('reset-view');

    let renderer, scene, camera, controls, clock;
    let tower = null;
    let floor = null;
    let materials, geometries;
    const requestState = new URLSearchParams(location.search);
    let currentMode = requestState.get('mode') === 'tower' ? 'tower' : 'study';
    let currentLevels = Math.max(1, Math.min(10, Number.parseInt(requestState.get('levels'), 10) || 1));
    levelsInput.value = currentLevels;
    modeButtons.forEach(button => button.classList.toggle('active', button.dataset.mode === currentMode));
    const isSmall = matchMedia('(max-width: 660px)').matches;

    try { init(); animate(); } catch (error) { console.error(error); loading.style.display = 'none'; fallback.style.display = 'grid'; }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0e0b09);
      scene.fog = new THREE.FogExp2(0x0e0b09, .072);

      camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, .1, 100);
      camera.position.set(4.8, 3.3, 7.8);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      renderer.transmissionResolutionScale = .58;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      viewport.appendChild(renderer.domElement);
      createSharedAssets();

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = .055;
      controls.minDistance = 2.2;
      controls.maxDistance = 27;
      controls.maxPolarAngle = Math.PI * .49;
      controls.target.set(0, 1.72, 0);
      controls.autoRotate = true;
      controls.autoRotateSpeed = .48;
      controls.screenSpacePanning = true;
      controls.touches.ONE = THREE.TOUCH.ROTATE;
      controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;
      controls.update();
      clock = new THREE.Clock();

      addEnvironment();
      buildTower(currentLevels, currentMode);
      addEventListeners();
      setTimeout(() => { loading.style.opacity = '0'; loading.style.transition = 'opacity .45s'; setTimeout(() => loading.remove(), 480); }, 350);
    }

    function addEnvironment() {
      const env = new THREE.Group();
      // 背景の明暗面を環境反射として使用する、控えめなホテルバーのセット。
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x211a14, roughness: .9, metalness: .03 });
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(24, 12), wallMat);
      backWall.position.set(0, 4.3, -4.9);
      backWall.receiveShadow = true;
      env.add(backWall);

      const leftPanel = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 7), new THREE.MeshStandardMaterial({ color: 0x0b1115, roughness: .34, metalness: .18 }));
      leftPanel.position.set(-4.4, 3.2, -2.4); leftPanel.rotation.y = Math.PI / 3.3; env.add(leftPanel);
      const rightPanel = leftPanel.clone(); rightPanel.material = new THREE.MeshStandardMaterial({ color: 0x2b2118, roughness: .48, metalness: .1 }); rightPanel.position.x = 4.5; rightPanel.rotation.y = -Math.PI / 3.3; env.add(rightPanel);

      const floorMat = new THREE.MeshPhysicalMaterial({ color: 0x1b1511, roughness: .28, metalness: .18, clearcoat: .34, clearcoatRoughness: .28 });
      floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      env.add(floor);

      const rug = new THREE.Mesh(new THREE.CircleGeometry(4.7, 64), new THREE.MeshStandardMaterial({ color: 0x110e0c, roughness: .96 }));
      rug.rotation.x = -Math.PI / 2; rug.position.y = .006; env.add(rug);

      // 遠景の縦方向アクセント。
      const glowMat = new THREE.MeshBasicMaterial({ color: 0x8c5c27, transparent: true, opacity: .21 });
      [-2.45, 2.45].forEach(x => { const glow = new THREE.Mesh(new THREE.PlaneGeometry(.48, 4.9), glowMat); glow.position.set(x, 3.3, -4.85); env.add(glow); });
      scene.add(env);

      const hemi = new THREE.HemisphereLight(0xc4d8ef, 0x2a170b, 1.0); scene.add(hemi);
      addRectLight(0xfff1d0, 4.9, 4.3, 3.2, 5.6, 2.8, 1.9);  // 大型ソフトライト
      addRectLight(0xbcd8ff, 2.2, -3.4, 2.8, 1.8, 1.2, .7); // 左の寒色ハイライト
      addRectLight(0xffc06c, 2.4, 3.7, 2.2, -1.8, 1.0, .7); // 右の暖色ハイライト
      addRectLight(0xffc877, 2.8, 0, 5.7, -3.3, 3.2, .9);   // 背面リムライト
      const key = new THREE.SpotLight(0xffebc6, 780, 18, Math.PI / 5.7, .6, 1.15);
      key.position.set(-1.6, 7.5, 3.5); key.target.position.set(0, 0, 0); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); scene.add(key, key.target);
      const bounce = new THREE.PointLight(0x9ac4ef, 10, 10, 2); bounce.position.set(-1.5, .55, 2.7); scene.add(bounce);
    }

    function addRectLight(color, intensity, x, y, z, width, height) {
      const light = new THREE.RectAreaLight(color, intensity, width, height);
      light.position.set(x, y, z); light.lookAt(0, 1.5, 0); scene.add(light);
    }

    function createSharedAssets() {
      // 厚み・IOR・低いラフネスを持つPBRガラス。4段階の微差を共有プールで持ち、個体差と描画効率を両立する。
      materials = {
        glass: [0, 1, 2, 3].map(i => new THREE.MeshPhysicalMaterial({ color: 0xf7fbff, metalness: 0, roughness: .03 + i * .006, transmission: 1, thickness: .16, ior: 1.49, transparent: true, opacity: 1, clearcoat: 1, clearcoatRoughness: .03, side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 1.55 })),
        edge: new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: .018, transmission: 1, thickness: .2, ior: 1.5, transparent: true, opacity: 1, clearcoat: 1, clearcoatRoughness: .025, side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 1.9 }),
        champagne: new THREE.MeshPhysicalMaterial({ color: 0xb77716, metalness: 0, roughness: .1, transmission: .6, thickness: .5, attenuationColor: 0xca8520, attenuationDistance: 1.25, ior: 1.34, transparent: true, opacity: .94, clearcoat: .4, clearcoatRoughness: .1, side: THREE.DoubleSide, depthWrite: false }),
        surface: new THREE.MeshPhysicalMaterial({ color: 0xd89827, metalness: 0, roughness: .075, transmission: .25, transparent: true, opacity: .72, clearcoat: .65, side: THREE.DoubleSide, depthWrite: false }),
        bubble: new THREE.MeshPhysicalMaterial({ color: 0xfff4c9, roughness: .04, transmission: .92, transparent: true, opacity: .76, ior: 1.1 })
      };
      // 高段数では深度書き込みを有効にしたPBR派生材を用い、何百もの透明面の累積で白飛びしないようにする。
      materials.towerGlass = materials.glass[0].clone();
      materials.towerGlass.transparent = false; materials.towerGlass.depthWrite = true; materials.towerGlass.side = THREE.FrontSide; materials.towerGlass.roughness = .072; materials.towerGlass.transmission = .84;
      materials.towerEdge = materials.edge.clone();
      materials.towerEdge.transparent = false; materials.towerEdge.depthWrite = true; materials.towerEdge.side = THREE.FrontSide; materials.towerEdge.roughness = .035;
      materials.towerChampagne = materials.champagne.clone();
      materials.towerChampagne.transparent = false; materials.towerChampagne.depthWrite = true; materials.towerChampagne.side = THREE.FrontSide;
      const outerPts = [new THREE.Vector2(0, .25), new THREE.Vector2(.28, .25), new THREE.Vector2(.66, .30), new THREE.Vector2(.88, .42), new THREE.Vector2(.96, .56), new THREE.Vector2(.93, .64)];
      const innerPts = [new THREE.Vector2(0, .30), new THREE.Vector2(.24, .30), new THREE.Vector2(.61, .34), new THREE.Vector2(.84, .44), new THREE.Vector2(.91, .55), new THREE.Vector2(.887, .62)];
      const liquidPts = [new THREE.Vector2(0, .315), new THREE.Vector2(.27, .315), new THREE.Vector2(.58, .35), new THREE.Vector2(.80, .45), new THREE.Vector2(.84, .535)];
      geometries = {
        outer: new THREE.LatheGeometry(outerPts, 56), inner: new THREE.LatheGeometry(innerPts, 56), liquid: new THREE.LatheGeometry(liquidPts, 56),
        rim: new THREE.TorusGeometry(.907, .038, 12, 64), bottomDisc: new THREE.CylinderGeometry(.305, .268, .075, 56),
        surface: new THREE.CircleGeometry(.842, 56), stem: new THREE.CylinderGeometry(.065, .08, .98, 32), stemTop: new THREE.SphereGeometry(.12, 28, 20),
        base: new THREE.CylinderGeometry(.64, .48, .072, 56), baseEdge: new THREE.TorusGeometry(.615, .025, 10, 56), bubble: new THREE.SphereGeometry(1, 10, 8)
      };
    }

    function createGlass(seed = 0, bubbleCount = 7) {
      const group = new THREE.Group();
      group.userData.seed = seed;
      const glassMaterial = materials.glass[seed % materials.glass.length];
      const outer = new THREE.Mesh(geometries.outer, glassMaterial); outer.castShadow = true; group.add(outer);
      const inner = new THREE.Mesh(geometries.inner, glassMaterial); inner.renderOrder = 1; group.add(inner);
      // 縁、ボウル底、ステム、台座を独立させて、光が拾う実際のガラス厚を表現する。
      const rim = new THREE.Mesh(geometries.rim, materials.edge); rim.position.y = .62; rim.scale.z = .96; rim.renderOrder = 2; group.add(rim);
      const bottomDisc = new THREE.Mesh(geometries.bottomDisc, materials.edge); bottomDisc.position.y = .262; bottomDisc.renderOrder = 2; group.add(bottomDisc);
      const liquidLevel = .535 + ((seed * 17) % 7) * .002;
      const liquid = new THREE.Mesh(geometries.liquid, materials.champagne); liquid.scale.y = 1 + ((liquidLevel - .535) / .22); liquid.renderOrder = 0; group.add(liquid);
      const surface = new THREE.Mesh(geometries.surface, materials.surface); surface.rotation.x = -Math.PI / 2; surface.position.y = liquidLevel + .001; surface.renderOrder = 2; group.add(surface);
      const stem = new THREE.Mesh(geometries.stem, glassMaterial); stem.position.y = -.25; stem.castShadow = true; stem.renderOrder = 1; group.add(stem);
      const stemTop = new THREE.Mesh(geometries.stemTop, materials.edge); stemTop.scale.y = .72; stemTop.position.y = .24; stemTop.renderOrder = 2; group.add(stemTop);
      const base = new THREE.Mesh(geometries.base, materials.edge); base.position.y = -.765; base.scale.z = 1.03; base.castShadow = true; base.renderOrder = 2; group.add(base);
      const baseEdge = new THREE.Mesh(geometries.baseEdge, materials.edge); baseEdge.rotation.x = Math.PI / 2; baseEdge.position.y = -.727; baseEdge.renderOrder = 3; group.add(baseEdge);
      // 気泡は少数に抑え、個体ごとのグループとして将来的な液体アニメーション拡張に備える。
      const bubbles = new THREE.Group(); const random = mulberry32(seed * 281 + 17);
      for (let i = 0; i < bubbleCount; i++) {
        const y = .33 + random() * (liquidLevel - .36); const radius = Math.sqrt(random()) * (.48 - (y - .28) * .25); const a = random() * Math.PI * 2; const r = .009 + random() * .013;
        const bubble = new THREE.Mesh(geometries.bubble, materials.bubble); bubble.scale.setScalar(r); bubble.position.set(Math.cos(a) * radius, y, Math.sin(a) * radius); bubble.userData = { phase: random() * Math.PI * 2, initialY: y, speed: .08 + random() * .1 }; bubbles.add(bubble);
      }
      bubbles.userData.isBubbles = true; group.add(bubbles); group.position.y = .79; return group;
    }

    function mulberry32(a) { return function() { let t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

    function createInstancedTower(actualLevels) {
      const instances = new THREE.Group();
      const spacing = 1.85;
      const placements = [];
      let count = 0;
      for (let level = 0; level < actualLevels; level++) {
        const side = actualLevels - level;
        for (let ix = 0; ix < side; ix++) {
          for (let iz = 0; iz < side; iz++) {
            placements.push({
              x: (ix - (side - 1) / 2) * spacing + ((level % 2) * .002),
              y: level * 1.44 + .79,
              z: (iz - (side - 1) / 2) * spacing + ((level % 2) * .002),
              rotation: ((count * 13) % 11 - 5) * .0027,
              level: .535 + ((count * 17) % 7) * .002
            });
            count++;
          }
        }
      }
      const addLayer = (geometry, material, offsetY = 0, scale = new THREE.Vector3(1, 1, 1), rotationX = 0, perGlassScaleY = false) => {
        const mesh = new THREE.InstancedMesh(geometry, material, count);
        const position = new THREE.Vector3(); const quaternion = new THREE.Quaternion(); const scaleVector = new THREE.Vector3(); const matrix = new THREE.Matrix4();
        placements.forEach((item, index) => {
          position.set(item.x, item.y + offsetY, item.z);
          quaternion.setFromEuler(new THREE.Euler(rotationX, item.rotation, 0));
          scaleVector.copy(scale);
          if (perGlassScaleY) scaleVector.y *= 1 + ((item.level - .535) / .22);
          matrix.compose(position, quaternion, scaleVector);
          mesh.setMatrixAt(index, matrix);
        });
        mesh.instanceMatrix.needsUpdate = true;
        mesh.renderOrder = 1;
        instances.add(mesh);
      };
      // 高段数時は共有ジオメトリのインスタンシングで、10段（385脚）の描画負荷を抑える。
      // 遠景では内壁・接続部の重複レイヤーを省き、透過・反射・液面・縁の読みやすさを優先する。
      addLayer(geometries.outer, materials.towerGlass);
      addLayer(geometries.rim, materials.towerEdge, .62, new THREE.Vector3(1, 1, .96));
      addLayer(geometries.liquid, materials.towerChampagne, 0, new THREE.Vector3(1, 1, 1), 0, true);
      addLayer(geometries.surface, materials.towerChampagne, .536, new THREE.Vector3(1, 1, 1), -Math.PI / 2);
      addLayer(geometries.stem, materials.towerGlass, -.25);
      addLayer(geometries.base, materials.towerEdge, -.765, new THREE.Vector3(1, 1, 1.03));
      const bubbles = new Float32Array(count * 2 * 3);
      const random = mulberry32(actualLevels * 101);
      placements.forEach((item, index) => {
        for (let b = 0; b < 2; b++) {
          const angle = random() * Math.PI * 2; const radius = Math.sqrt(random()) * .44; const point = (index * 2 + b) * 3;
          bubbles[point] = item.x + Math.cos(angle) * radius;
          bubbles[point + 1] = item.y + .35 + random() * .14;
          bubbles[point + 2] = item.z + Math.sin(angle) * radius;
        }
      });
      const bubbleGeometry = new THREE.BufferGeometry(); bubbleGeometry.setAttribute('position', new THREE.BufferAttribute(bubbles, 3));
      const bubbleMaterial = new THREE.PointsMaterial({ color: 0xffedb0, size: .026, transparent: true, opacity: .72, sizeAttenuation: true, depthWrite: false });
      const bubblePoints = new THREE.Points(bubbleGeometry, bubbleMaterial); bubblePoints.userData.dynamicAsset = true; instances.add(bubblePoints);
      return { group: instances, count };
    }

    function buildTower(levels, mode = 'tower') {
      if (tower) { scene.remove(tower); disposeObject(tower); }
      tower = new THREE.Group();
      const buildAsStudy = mode === 'study';
      const actualLevels = buildAsStudy ? 1 : levels;
      let count = 0;
      if (actualLevels >= 6) {
        const instanced = createInstancedTower(actualLevels);
        tower.add(instanced.group); count = instanced.count;
      } else {
        const spacing = 1.85; const bubbleCount = 7;
        for (let level = 0; level < actualLevels; level++) {
          const side = actualLevels - level; const y = level * 1.44;
          for (let ix = 0; ix < side; ix++) for (let iz = 0; iz < side; iz++) {
            const glass = createGlass(count + 1, bubbleCount);
            glass.position.set((ix - (side - 1) / 2) * spacing + ((level % 2) * .002), y, (iz - (side - 1) / 2) * spacing + ((level % 2) * .002));
            glass.rotation.y = ((count * 13) % 11 - 5) * .0027; tower.add(glass); count++;
          }
        }
      }
      tower.userData = { levels: actualLevels, count, study: buildAsStudy };
      scene.add(tower); updateStatus(count, actualLevels, buildAsStudy); frameCamera(actualLevels, buildAsStudy, true);
    }

    function disposeObject(object) {
      object.traverse(child => { if (child.userData.dynamicAsset) { child.geometry.dispose(); child.material.dispose(); } });
      object.clear();
    }

    function updateStatus(count, levels, study) {
      glassCount.innerHTML = `${count}<span>${study ? 'Coupe glass' : `${levels} tiers · Coupe glasses`}</span>`;
      levelValue.textContent = levelsInput.value;
    }

    function frameCamera(levels, study, instant = false) {
      const height = study ? 2.4 : 1.5 + (levels - 1) * 1.44 + 1.65;
      const width = study ? 2.9 : 1.9 + (levels - 1) * 1.85;
      const distance = Math.max(4.9, Math.max(height * .9, width * 1.23) + 3.45);
      const targetY = study ? 1.25 : Math.max(1.5, height * .44);
      const desired = new THREE.Vector3(distance * .62, targetY + distance * .26, distance * .79);
      if (instant) { camera.position.copy(desired); controls.target.set(0, targetY, 0); controls.update(); }
      else animateCamera(desired, new THREE.Vector3(0, targetY, 0));
      controls.minDistance = Math.max(2.1, distance * .42);
      controls.maxDistance = Math.max(15, distance * 2.1);
    }

    function animateCamera(destination, target) {
      const start = camera.position.clone(); const startTarget = controls.target.clone(); const started = performance.now(); const duration = 570;
      function step(now) { const t = Math.min(1, (now - started) / duration); const eased = 1 - Math.pow(1 - t, 3); camera.position.lerpVectors(start, destination, eased); controls.target.lerpVectors(startTarget, target, eased); controls.update(); if (t < 1) requestAnimationFrame(step); }
      requestAnimationFrame(step);
    }

    function addEventListeners() {
      addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
      levelsInput.addEventListener('input', () => { levelValue.textContent = levelsInput.value; });
      levelsInput.addEventListener('change', () => {
        currentLevels = +levelsInput.value;
        if (currentMode === 'tower') buildTower(currentLevels, 'tower');
      });
      modeButtons.forEach(button => button.addEventListener('click', () => {
        currentMode = button.dataset.mode; modeButtons.forEach(b => b.classList.toggle('active', b === button));
        buildTower(currentLevels, currentMode);
      }));
      autoInput.addEventListener('change', () => { controls.autoRotate = autoInput.checked; });
      resetButton.addEventListener('click', () => frameCamera(tower.userData.levels, tower.userData.study));
    }

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      if (tower) tower.traverse(obj => {
        if (obj.parent && obj.parent.userData.isBubbles) {
          const d = obj.userData;
          obj.position.y = d.initialY + Math.sin(elapsed * d.speed * 4 + d.phase) * .018;
        }
      });
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
