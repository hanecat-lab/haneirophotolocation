<!DOCTYPE html>
<html lang="ja">
<head>
<!-- WBそろえ：ホワイトバランスがばらばらの写真を、白か肌をクリックして揃える単体アプリ。
     補正はカメラのWBと同じく、リニア光でRGBに別々の倍率を掛ける方式（黒は黒のまま）。 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon01.png">
<title>WBそろえ</title>
<style>
  :root {
    --bg: #101418;
    --bg2: #1a2027;
    --text: #e8edf2;
    --text2: #8b98a5;
    --accent: #4dabf7;
    --line: #2a323b;
    --warn: #ffc078;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden; padding: 12px 16px;
    display: grid; grid-template-rows: auto 1fr auto auto; gap: 10px;
  }
  h1 { font-size: 1.1rem; margin-right: 8px; white-space: nowrap; }
  button, .btn {
    background: var(--bg2); color: var(--text);
    border: 1px solid var(--text2); border-radius: 8px;
    padding: 8px 12px; font-size: .85rem; cursor: pointer; white-space: nowrap;
    font-family: inherit; line-height: 1.2;
  }
  button:disabled, .btn.disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); color: #06121d; border-color: var(--accent); font-weight: 600; }
  select { background: var(--bg2); color: var(--text); border: 1px solid var(--text2); border-radius: 6px; padding: 4px 6px; font-family: inherit; }
  .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; border-left: none; }
  .seg button.on { background: var(--accent); color: #06121d; border-color: var(--accent); font-weight: 600; }
  .qual { font-size: .8rem; color: var(--text2); }

  .work { display: grid; grid-template-columns: 1fr 300px; gap: 12px; min-height: 0; }
  .stage {
    position: relative; background: #0a0d10; border-radius: 10px; min-height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #view { display: block; max-width: 100%; max-height: 100%; cursor: crosshair; }
  #empty { color: var(--text2); text-align: center; line-height: 1.8; padding: 24px; font-size: .9rem; }
  #stageMsg {
    position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.65); color: #fff;
    padding: 4px 10px; border-radius: 6px; font-size: .8rem; pointer-events: none;
  }
  #stageMsg:empty { display: none; }
  .stage.drag { outline: 2px dashed var(--accent); outline-offset: -6px; }

  .panel {
    background: var(--bg2); border-radius: 10px; padding: 12px; overflow: auto;
    display: flex; flex-direction: column; gap: 12px; font-size: .82rem; min-height: 0;
  }
  .panel h2 { font-size: .78rem; color: var(--text2); font-weight: 600; margin-bottom: 6px; }
  .help { line-height: 1.6; }
  .help b { color: var(--accent); }
  .info { color: var(--text2); line-height: 1.5; word-break: break-all; }
  #refView { width: 100%; height: auto; display: block; border-radius: 6px; background: #0a0d10; }
  .slider label { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .slider output { font-variant-numeric: tabular-nums; color: var(--text2); }
  .slider input { width: 100%; }
  .slider .ends { display: flex; justify-content: space-between; font-size: .7rem; color: var(--text2); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button { flex: 1; }
  #status { color: var(--warn); line-height: 1.5; min-height: 1.5em; }
  .note { font-size: .72rem; color: var(--text2); line-height: 1.5; }

  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .thumb {
    position: relative; flex: 0 0 auto; padding: 0; background: none;
    border: 2px solid transparent; border-radius: 8px; overflow: hidden;
  }
  .thumb canvas { display: block; height: 104px; width: auto; }
  .thumb.sel { border-color: var(--accent); }
  .thumb .star {
    display: none; position: absolute; left: 4px; top: 4px; background: #ffd43b; color: #2b2100;
    font-size: .68rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
  }
  .thumb.ref .star { display: block; }
  .thumb .dot {
    display: none; position: absolute; right: 5px; top: 5px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px rgba(0,0,0,.5);
  }
  .thumb.adj .dot { display: block; }
  .thumb .tname {
    position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); color: #fff;
    font-size: .65rem; padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .footer { text-align: center; font-size: .7rem; color: var(--text2); }
</style>
</head>
<body>

<header class="top">
  <h1>WBそろえ</h1>
  <label class="btn primary" id="openBtn">写真を読み込む
    <input type="file" id="file" accept="image/*" multiple hidden>
  </label>
  <div class="seg" role="group" aria-label="クリックで合わせるもの">
    <button type="button" data-mode="white" class="on" aria-pressed="true">白をクリック</button>
    <button type="button" data-mode="same" aria-pressed="false">同じものをクリック</button>
    <button type="button" data-mode="skin" aria-pressed="false">肌をクリック</button>
  </div>
  <button type="button" id="autoBtn">自動で基準に寄せる</button>
  <span class="spacer"></span>
  <label class="qual">JPEG画質
    <select id="quality">
      <option value="0.9">90</option>
      <option value="0.95" selected>95</option>
      <option value="0.98">98</option>
    </select>
  </label>
  <button type="button" id="saveOne">この写真を保存</button>
  <button type="button" id="saveZip">全部をZIPで保存</button>
</header>

<main class="work">
  <section class="stage" id="stage">
    <canvas id="view" hidden></canvas>
    <div id="empty">写真をここにドロップするか、「写真を読み込む」から選んでください（複数可）。<br>
      最初に読み込んだ写真が基準（★）になります。</div>
    <div id="stageMsg"></div>
  </section>

  <aside class="panel">
    <div>
      <h2>使い方</h2>
      <div class="help" id="help"></div>
    </div>
    <div>
      <h2>基準写真</h2>
      <canvas id="refView" width="1" height="1"></canvas>
      <div class="info" id="refInfo"></div>
    </div>
    <div>
      <h2>表示中の写真</h2>
      <div class="info" id="curInfo">—</div>
    </div>
    <div class="row">
      <button type="button" id="setRef">★ これを基準にする</button>
    </div>
    <div class="slider">
      <label for="temp">色温度 <output id="tempVal">0</output></label>
      <input type="range" id="temp" min="-100" max="100" step="1" value="0">
      <div class="ends"><span>青く</span><span>黄色く</span></div>
    </div>
    <div class="slider">
      <label for="tint">色かぶり <output id="tintVal">0</output></label>
      <input type="range" id="tint" min="-100" max="100" step="1" value="0">
      <div class="ends"><span>緑に</span><span>マゼンタに</span></div>
    </div>
    <div class="row">
      <button type="button" id="before">押している間 補正前</button>
      <button type="button" id="reset">補正を戻す</button>
    </div>
    <div id="status" role="status"></div>
    <div class="note">
      Shift＋クリックで点を足すと、複数の点の平均で合わせます。<br>
      キー：← → で写真を切り替え、B を押している間は補正前。<br>
      書き出しは元の画素数のJPEGです。EXIF（撮影情報）は付きません。白く飛んだ部分の色は戻せません。
    </div>
  </aside>
</main>

<div class="strip" id="strip"></div>

<div class="footer">ver <span id="app-ver"></span></div>

<script>
// ===== 基本設定 =====
const APP_NAME = 'WBそろえ';
// 公開時に自動で日時へ書き換わる（.github/workflows/auto-version.yml）。手元では "dev"。
const APP_VERSION="dev";
document.getElementById('app-ver').textContent = APP_VERSION;

const $ = id => document.getElementById(id);
const PREVIEW_MAX = 2048;   // 画面表示用の長辺
const THUMB_MAX = 360;      // 一覧・自動推定用の長辺
const T_MAX = 2;            // 色温度の上限（ln(R倍率/B倍率)）
const M_MAX = 1;            // 色かぶりの上限（ln((R,Bの倍率)/G倍率)）
const tick = () => new Promise(r => setTimeout(r, 0));

// ===== 色の計算 =====
// sRGB 8bit → リニア
const LIN = new Float32Array(256);
const LIN6 = new Float64Array(256);
for (let i = 0; i < 256; i++) {
  const c = i / 255;
  LIN[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  LIN6[i] = Math.pow(LIN[i], 6);
}
function toSrgb8(v) {
  if (v <= 0) return 0;
  if (v >= 1) return 255;
  const c = v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
  return Math.round(c * 255);
}
// 色温度 T と色かぶり M から RGB の倍率を作る。灰色の明るさ（輝度）は変えない。
function gainsOf(T, M) {
  const r = Math.exp(T / 2 + M / 3), g = Math.exp(-2 * M / 3), b = Math.exp(-T / 2 + M / 3);
  const y = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return [r / y, g / y, b / y];
}
function makeLuts(g) {
  const l = [new Uint8Array(256), new Uint8Array(256), new Uint8Array(256)];
  for (let c = 0; c < 3; c++) for (let i = 0; i < 256; i++) l[c][i] = toSrgb8(g[c] * LIN[i]);
  return l;
}
const IDENTITY = makeLuts([1, 1, 1]);
function applyLuts(src, dst, luts) {
  const lr = luts[0], lg = luts[1], lb = luts[2];
  for (let i = 0, n = src.length; i < n; i += 4) {
    dst[i] = lr[src[i]]; dst[i + 1] = lg[src[i + 1]]; dst[i + 2] = lb[src[i + 2]]; dst[i + 3] = src[i + 3];
  }
}
const ln = v => Math.log(Math.max(v, 1e-5));
// 元の色 s（リニア）を、補正後に目標の色 t と同じ色味にする T, M。t が無ければ無彩色にする。
function solveTM(s, t) {
  const tt = t || [1, 1, 1];
  const T = (ln(tt[0]) - ln(tt[2])) - (ln(s[0]) - ln(s[2]));
  const M = ((ln(tt[0]) + ln(tt[2])) / 2 - ln(tt[1])) - ((ln(s[0]) + ln(s[2])) / 2 - ln(s[1]));
  return [T, M];
}
// 自動用の光の色の推定（Shades of Gray, p=6）。白飛びと真っ暗な画素は除く。
function estimateIlluminant(d) {
  const a = d.data; let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < a.length; i += 4) {
    const R = a[i], G = a[i + 1], B = a[i + 2];
    if (R >= 250 || G >= 250 || B >= 250 || R + G + B < 30) continue;
    r += LIN6[R]; g += LIN6[G]; b += LIN6[B]; n++;
  }
  if (!n) return null;
  return [Math.pow(r / n, 1 / 6), Math.pow(g / n, 1 / 6), Math.pow(b / n, 1 / 6)];
}
// クリック位置のまわりの平均色（リニア）。白飛びした画素は除く。
function sampleAt(d, cx, cy) {
  const rad = Math.max(2, Math.round(Math.max(d.width, d.height) * 0.004));
  let r = 0, g = 0, b = 0, n = 0, clip = 0;
  for (let y = Math.max(0, cy - rad); y <= Math.min(d.height - 1, cy + rad); y++) {
    for (let x = Math.max(0, cx - rad); x <= Math.min(d.width - 1, cx + rad); x++) {
      const i = (y * d.width + x) * 4, R = d.data[i], G = d.data[i + 1], B = d.data[i + 2];
      if (R >= 250 || G >= 250 || B >= 250) { clip++; continue; }
      r += LIN[R]; g += LIN[G]; b += LIN[B]; n++;
    }
  }
  return n ? { rgb: [r / n, g / n, b / n], clipRate: clip / (n + clip), rad } : null;
}

// ===== 画像の読み込み =====
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('画像を開けません: ' + file.name)); };
    img.src = url;
  });
}
function scaledData(img, max) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight;
  const s = Math.min(1, max / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * s)), h = Math.max(1, Math.round(h0 * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingQuality = 'high';
  x.drawImage(img, 0, 0, w, h);
  return x.getImageData(0, 0, w, h);
}

// ===== 状態 =====
const photos = [];
let selId = null, refId = null, mode = 'white', beforeHeld = false, busy = false, nextId = 1;
// 基準写真で記録した目標の色（元画像のリニア値の合計と点の数）。「同じもの」と「肌」で別々に持つ。
let refAcc = { same: null, skin: null };
const MODE_NAME = { white: '白', same: '同じもの', skin: '肌' };
// 色の合計に1点を足す（Shift＋クリック）か、1点だけにする。
function accAdd(acc, rgb, add) {
  if (!add || !acc) return { sum: rgb.slice(), n: 1 };
  return { sum: acc.sum.map((v, i) => v + rgb[i]), n: acc.n + 1 };
}
const accAvg = acc => acc.sum.map(v => v / acc.n);
const previewCache = new Map();   // id → 表示用 ImageData（直近4枚）
const byId = id => photos.find(p => p.id === id);
const cur = () => byId(selId);

function status(msg) { $('status').textContent = msg || ''; }

async function addFiles(list) {
  const files = [...list].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|tiff?)$/i.test(f.name));
  if (!files.length || busy) return;
  setBusy(true);
  const failed = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    status(`読み込み中 ${i + 1}/${files.length}…`);
    try {
      const img = await loadImage(f);
      const thumb = scaledData(img, THUMB_MAX);
      const p = { id: nextId++, file: f, name: f.name, w: img.naturalWidth, h: img.naturalHeight,
        thumb, est: estimateIlluminant(thumb), T: 0, M: 0, picks: [], acc: null };
      photos.push(p);
      addThumbEl(p);
      if (refId == null) { refId = p.id; drawRefView(); }
      if (selId == null) select(p.id);
    } catch (e) { failed.push(f.name); }
    await tick();
  }
  setBusy(false);
  refreshStrip(); refreshPanel();
  status(failed.length ? `開けなかった写真: ${failed.join(', ')}` : `${files.length}枚を読み込みました。`);
}

// ===== 一覧 =====
function addThumbEl(p) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'thumb'; b.title = p.name;
  const cv = document.createElement('canvas');
  cv.width = p.thumb.width; cv.height = p.thumb.height;
  const star = document.createElement('span'); star.className = 'star'; star.textContent = '★ 基準';
  const dot = document.createElement('span'); dot.className = 'dot';
  const name = document.createElement('span'); name.className = 'tname'; name.textContent = p.name;
  b.append(cv, star, dot, name);
  b.addEventListener('click', () => select(p.id));
  $('strip').append(b);
  p.el = b; p.cv = cv;
  updateThumb(p);
}
function updateThumb(p) {
  const d = new ImageData(p.thumb.width, p.thumb.height);
  applyLuts(p.thumb.data, d.data, makeLuts(gainsOf(p.T, p.M)));
  p.cv.getContext('2d').putImageData(d, 0, 0);
  if (p.id === refId) drawRefView();
}
function refreshStrip() {
  for (const p of photos) {
    p.el.classList.toggle('sel', p.id === selId);
    p.el.classList.toggle('ref', p.id === refId);
    p.el.classList.toggle('adj', p.T !== 0 || p.M !== 0);
  }
}
function drawRefView() {
  const ref = byId(refId), rv = $('refView');
  if (!ref || !ref.cv) { $('refInfo').textContent = 'まだありません'; return; }
  rv.width = ref.cv.width; rv.height = ref.cv.height;
  rv.getContext('2d').drawImage(ref.cv, 0, 0);
  const a = refAcc[mode];
  $('refInfo').textContent = ref.name + (mode === 'white' ? ''
    : `（${MODE_NAME[mode]}：${a ? `記録済み・${a.n}点` : '未記録'}）`);
}

// ===== 表示 =====
async function select(id) {
  selId = id;
  refreshStrip(); refreshPanel();
  const p = cur();
  if (!p) return;
  p.el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  if (previewCache.has(id)) {
    const d = previewCache.get(id); previewCache.delete(id); previewCache.set(id, d);
  } else {
    $('stageMsg').textContent = '表示を準備中…';
    try {
      const img = await loadImage(p.file);
      previewCache.set(id, scaledData(img, PREVIEW_MAX));
      while (previewCache.size > 4) previewCache.delete(previewCache.keys().next().value);
    } catch (e) { status(e.message); return; }
  }
  if (selId === id) drawView();
}
let viewBuf = null;
function drawView() {
  const p = cur(), cv = $('view');
  const src = p && previewCache.get(p.id);
  if (!src) { if (!p) { cv.hidden = true; $('empty').hidden = false; } return; }
  $('empty').hidden = true; cv.hidden = false;
  if (cv.width !== src.width || cv.height !== src.height) { cv.width = src.width; cv.height = src.height; }
  if (!viewBuf || viewBuf.width !== src.width || viewBuf.height !== src.height) viewBuf = new ImageData(src.width, src.height);
  applyLuts(src.data, viewBuf.data, beforeHeld ? IDENTITY : makeLuts(gainsOf(p.T, p.M)));
  const x = cv.getContext('2d');
  x.putImageData(viewBuf, 0, 0);
  if (!beforeHeld) {
    const r = Math.max(6, Math.max(src.width, src.height) * 0.004 * 1.8);
    x.lineWidth = Math.max(2, src.width / 600);
    for (const pk of p.picks) {
      const px = pk.x * src.width, py = pk.y * src.height;
      x.strokeStyle = 'rgba(0,0,0,.8)'; x.beginPath(); x.arc(px, py, r + x.lineWidth, 0, Math.PI * 2); x.stroke();
      x.strokeStyle = { white: '#ffffff', same: '#74c0fc', skin: '#ffa8a8' }[pk.mode];
      x.beginPath(); x.arc(px, py, r, 0, Math.PI * 2); x.stroke();
    }
  }
  $('stageMsg').textContent = beforeHeld ? '補正前' : '';
}
let viewQueued = false;
function queueView() {
  if (viewQueued) return;
  viewQueued = true;
  setTimeout(() => { viewQueued = false; drawView(); }, 0);
}

function refreshPanel() {
  const p = cur(), has = photos.length > 0;
  $('help').innerHTML = {
    white: '<b>白をクリック</b>：白・グレーのもの（紙、カード、白いシャツ）をクリックすると、そこが無彩色になるよう補正します。写真ごとに1回ずつクリックしてください。',
    same: '<b>同じものをクリック</b>：まず基準写真（★）で、ほかの写真にも写っている物（壁、カウンター、カップなど）をクリックして色を記録します。ほかの写真で同じ物をクリックすると、基準と同じ色に合わせます。人以外の物を選ぶと、人の違いに左右されません。',
    skin: '<b>肌をクリック</b>：まず基準写真（★）で肌をクリックして目標の色を記録し、ほかの写真で同じような肌（頬や額）をクリックすると、基準の肌の色に合わせます。人物が違うと、肌の色の差まで照明のせいとして合わせてしまいます。'
  }[mode];
  $('curInfo').textContent = p ? `${p.name}\n${p.w}×${p.h}${p.id === refId ? '（基準）' : ''}` : '—';
  $('curInfo').style.whiteSpace = 'pre-line';
  $('temp').value = p ? Math.round(p.T / T_MAX * 100) : 0;
  $('tint').value = p ? Math.round(p.M / M_MAX * 100) : 0;
  $('tempVal').textContent = $('temp').value;
  $('tintVal').textContent = $('tint').value;
  $('setRef').disabled = busy || !p || p.id === refId;
  for (const id of ['temp', 'tint', 'before', 'reset', 'saveOne']) $(id).disabled = busy || !p;
  $('autoBtn').disabled = busy || photos.length < 2;
  $('saveZip').disabled = busy || !has;
  $('openBtn').classList.toggle('disabled', busy);
  $('file').disabled = busy;
  drawRefView();
}
function setBusy(b) { busy = b; refreshPanel(); }

// T, M を設定する。上限で止めたら true。
// picks を渡すと印も置き換える（null で印と点の記録を消す）。
function setTM(p, T, M, picks) {
  const T2 = Math.max(-T_MAX, Math.min(T_MAX, T)), M2 = Math.max(-M_MAX, Math.min(M_MAX, M));
  p.T = T2; p.M = M2;
  if (picks === null) { p.picks = []; p.acc = null; }
  else if (picks !== undefined) p.picks = picks;
  updateThumb(p); refreshStrip();
  if (p.id === selId) { refreshPanel(); queueView(); }
  return T2 !== T || M2 !== M;
}

// ===== 操作 =====
$('file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });

const stage = $('stage');
window.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drag'); });
window.addEventListener('dragleave', e => { if (e.target === document.documentElement || !e.relatedTarget) stage.classList.remove('drag'); });
window.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('drag'); if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.seg button').forEach(x => {
    x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b));
  });
  refreshPanel();
  status(mode !== 'white' && !refAcc[mode] ? `基準写真（★）で${MODE_NAME[mode]}をクリックしてください。` : '');
}));

$('view').addEventListener('click', e => {
  const p = cur(), src = p && previewCache.get(p.id);
  if (!src || busy) return;
  const r = e.currentTarget.getBoundingClientRect();
  const x = Math.min(src.width - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * src.width)));
  const y = Math.min(src.height - 1, Math.max(0, Math.floor((e.clientY - r.top) / r.height * src.height)));
  const smp = sampleAt(src, x, y);
  if (!smp) { status('白く飛んでいて色が読めません。少し暗い部分をクリックしてください。'); return; }
  if (Math.max(...smp.rgb) < 0.003) { status('暗すぎて色が読めません。もう少し明るい部分をクリックしてください。'); return; }
  const pick = { x: x / src.width, y: y / src.height, mode };
  const add = e.shiftKey;
  const clipNote = smp.clipRate > 0.3 ? '（白飛びが多い場所です。ずれる場合は少し暗い部分で）' : '';
  const nm = MODE_NAME[mode];
  // 「同じもの」「肌」の基準写真では、目標の色を記録するだけで補正はしない。
  if (mode !== 'white' && p.id === refId) {
    refAcc[mode] = accAdd(refAcc[mode], smp.rgb, add);
    p.picks = add && p.picks.every(k => k.mode === mode) ? [...p.picks, pick] : [pick];
    drawView(); refreshPanel();
    status(`基準の${nm}を記録しました（${refAcc[mode].n}点）。ほかの写真で${mode === 'skin' ? '同じような肌' : '同じ物'}をクリックしてください。` + clipNote);
    return;
  }
  if (mode !== 'white' && !refAcc[mode]) { status(`先に基準写真（★）で${nm}をクリックしてください。`); return; }
  const cont = add && p.acc && p.acc.mode === mode;
  const acc = accAdd(cont ? p.acc : null, smp.rgb, cont);
  let target = null;   // null は無彩色（白モード）
  if (mode !== 'white') {
    const ref = byId(refId), g = gainsOf(ref.T, ref.M);
    target = accAvg(refAcc[mode]).map((v, i) => v * g[i]);
  }
  const [T, M] = solveTM(accAvg(acc), target);
  const capped = setTM(p, T, M, cont ? [...p.picks, pick] : [pick]);
  p.acc = { ...acc, mode };
  const what = mode === 'white' ? 'クリックした所が無彩色になるよう補正しました' : `基準の${nm}の色に合わせました`;
  status(`${what}（${acc.n}点の平均）。` + (capped ? '補正の上限で止めました。' : '') + clipNote);
});

$('setRef').addEventListener('click', () => {
  const p = cur(); if (!p) return;
  refId = p.id; refAcc = { same: null, skin: null };
  refreshStrip(); refreshPanel();
  status(mode !== 'white' ? `基準を変えました。この写真で${MODE_NAME[mode]}をクリックして記録してください。` : '基準を変えました。');
});

$('autoBtn').addEventListener('click', () => {
  const ref = byId(refId);
  if (!ref || !ref.est) { status('基準写真の色を推定できませんでした。'); return; }
  const others = photos.filter(p => p.id !== refId && p.est);
  if (others.some(p => p.T !== 0 || p.M !== 0) && !confirm('補正済みの写真も、自動の値で上書きします。よろしいですか？')) return;
  const g = gainsOf(ref.T, ref.M), target = ref.est.map((v, i) => v * g[i]);
  let capped = 0;
  for (const p of others) { const [T, M] = solveTM(p.est, target); if (setTM(p, T, M, null)) capped++; }
  status(`${others.length}枚を基準の色味に寄せました。目安なので、白か肌のクリックで仕上げてください。` + (capped ? `（${capped}枚は上限で止めました）` : ''));
});

function onSlider() {
  const p = cur(); if (!p) return;
  p.T = $('temp').value / 100 * T_MAX;
  p.M = $('tint').value / 100 * M_MAX;
  $('tempVal').textContent = $('temp').value;
  $('tintVal').textContent = $('tint').value;
  updateThumb(p); refreshStrip(); queueView();
}
$('temp').addEventListener('input', onSlider);
$('tint').addEventListener('input', onSlider);

$('reset').addEventListener('click', () => { const p = cur(); if (p) { setTM(p, 0, 0, null); status('補正を戻しました。'); } });

function holdBefore(on) { if (beforeHeld === on) return; beforeHeld = on; drawView(); }
const bb = $('before');
bb.addEventListener('pointerdown', e => { e.preventDefault(); try { bb.setPointerCapture(e.pointerId); } catch {} holdBefore(true); });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) bb.addEventListener(ev, () => holdBefore(false));

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey) return;
  if ((e.key === 'b' || e.key === 'B') && !e.repeat) holdBefore(true);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const i = photos.findIndex(p => p.id === selId), j = i + (e.key === 'ArrowRight' ? 1 : -1);
    if (i >= 0 && j >= 0 && j < photos.length) { e.preventDefault(); select(photos[j].id); }
  }
});
window.addEventListener('keyup', e => { if (e.key === 'b' || e.key === 'B') holdBefore(false); });
window.addEventListener('blur', () => holdBefore(false));

// ===== 書き出し（元の画素数） =====
async function renderFull(p, quality) {
  const img = await loadImage(p.file);
  const w = img.naturalWidth, h = img.naturalHeight;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  // ブラウザが扱えない大きさだと canvas が黙って空になるので、隅に描いて読み返して確かめる。
  const tooBig = new Error(`${w}×${h} の画像はこのブラウザでは大きすぎて扱えません。Chrome でお試しください。`);
  if (!ctx) throw tooBig;
  ctx.fillStyle = '#ff00ff'; ctx.fillRect(w - 1, h - 1, 1, 1);
  const t = ctx.getImageData(w - 1, h - 1, 1, 1).data;
  if (t[0] !== 255 || t[1] !== 0 || t[2] !== 255) { c.width = c.height = 0; throw tooBig; }
  ctx.drawImage(img, 0, 0);
  const luts = makeLuts(gainsOf(p.T, p.M));
  const band = Math.max(1, Math.floor(4000000 / w));
  for (let y = 0; y < h; y += band) {
    const bh = Math.min(band, h - y);
    const d = ctx.getImageData(0, y, w, bh);
    applyLuts(d.data, d.data, luts);
    ctx.putImageData(d, 0, y);
    await tick();
  }
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
  c.width = c.height = 0;
  if (!blob) throw new Error('JPEGを作れませんでした（画像が大きすぎる可能性があります）。');
  return blob;
}
const outName = p => p.name.replace(/\.[^.]+$/, '') + '_wb.jpg';
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
const quality = () => Number($('quality').value);

$('saveOne').addEventListener('click', async () => {
  const p = cur(); if (!p || busy) return;
  setBusy(true); status('書き出し中…');
  try { const b = await renderFull(p, quality()); download(b, outName(p)); status(`保存しました：${outName(p)}（${p.w}×${p.h}）`); }
  catch (e) { status('書き出しに失敗しました：' + e.message); }
  finally { setBusy(false); }
});

// ZIP（無圧縮。JPEGはもう圧縮済みなので縮まない）
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function makeZip(entries) {
  const now = new Date();
  const dtime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const ddate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  for (const { name, blob } of entries) {
    const data = new Uint8Array(await blob.arrayBuffer());
    const crc = crc32(data), size = data.length, nm = enc.encode(name);
    if (offset + 30 + nm.length + size > 0xFFFFFFFF) throw new Error('合計が4GBを超えるため、ZIPを分けてください（写真を減らして書き出し）。');
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dtime, true); lh.setUint16(12, ddate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, nm, blob);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, dtime, true);
    ch.setUint16(14, ddate, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true);
    ch.setUint32(24, size, true); ch.setUint16(28, nm.length, true); ch.setUint16(30, 0, true);
    ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, nm);
    offset += 30 + nm.length + size;
  }
  const cdSize = central.reduce((s, b) => s + b.byteLength, 0);
  if (entries.length > 65535 || offset + cdSize > 0xFFFFFFFF) throw new Error('写真が多すぎるため、ZIPを分けてください。');
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}

$('saveZip').addEventListener('click', async () => {
  if (!photos.length || busy) return;
  setBusy(true);
  try {
    const entries = [], used = new Set();
    for (let i = 0; i < photos.length; i++) {
      const p = photos[i];
      status(`書き出し中 ${i + 1}/${photos.length}：${p.name}`);
      let name = outName(p), k = 2;
      while (used.has(name)) name = outName(p).replace(/_wb\.jpg$/, `_wb_${k++}.jpg`);
      used.add(name);
      entries.push({ name, blob: await renderFull(p, quality()) });
    }
    status('ZIPにまとめています…'); await tick();
    const zip = await makeZip(entries);
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const zname = `${APP_NAME}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.zip`;
    download(zip, zname);
    status(`保存しました：${zname}（${photos.length}枚）`);
  } catch (e) { status('書き出しに失敗しました：' + e.message); }
  finally { setBusy(false); }
});

refreshPanel();
</script>
</body>
</html>
