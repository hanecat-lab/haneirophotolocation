<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1020" />
  <title>LuminaCam — 光を見る4ステップ</title>
  <style>
    /* A camera-first prototype: the live image is always primary; the UI only unlocks one action at a time. */
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&display=swap');
    :root { --ink:#0c1020; --panel:#151b2d; --line:rgba(225,233,255,.15); --text:#f2f5ff; --muted:#a3b0c6; --blue:#4e83ff; --blue-soft:rgba(78,131,255,.16); --green:#90d8a7; --warm:#e6be82; --serif:"Noto Serif JP",serif; --sans:"Noto Sans JP",sans-serif; --mono:"IBM Plex Mono",monospace; --ease:cubic-bezier(.23,1,.32,1); }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:var(--ink); color:var(--text); font-family:var(--sans); }
    button { font:inherit; cursor:pointer; } button:focus-visible { outline:3px solid #a8c3ff; outline-offset:3px; }
    .app { min-height:100svh; display:grid; place-items:center; padding:16px; background:radial-gradient(circle at 50% -15%,#253967 0,transparent 43%),var(--ink); }
    .phone { width:min(100%,480px); min-height:min(880px,calc(100svh - 32px)); position:relative; overflow:hidden; border:1px solid rgba(225,233,255,.18); border-radius:34px; background:#111728; box-shadow:0 28px 100px rgba(0,0,0,.45); }
    .camera { position:absolute; inset:0; overflow:hidden; background:radial-gradient(circle at 65% 22%,#455a92,transparent 35%),linear-gradient(135deg,#1f2947,#111728 60%,#1b2033); }
    .camera video { width:100%; height:100%; object-fit:cover; filter:saturate(.93) contrast(1.02) brightness(.97); }
    .camera::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(8,11,21,.46),transparent 26%,transparent 59%,rgba(8,11,21,.55)); }
    .camera.off::before { content:"カメラ映像の代わりに、目で光を観察するモードです"; position:absolute; z-index:1; left:34px; right:34px; top:42%; padding:14px; border:1px solid var(--line); border-radius:16px; background:rgba(10,14,25,.64); color:#c4d1e9; font-size:12px; line-height:1.75; text-align:center; }
    .topbar { position:absolute; z-index:3; top:max(18px,env(safe-area-inset-top)); left:18px; right:18px; display:flex; justify-content:space-between; align-items:center; }
    .brand { display:flex; align-items:center; gap:8px; color:#e7eeff; font:600 14px var(--serif); letter-spacing:.02em; }
    .brand i { display:block; width:18px; height:21px; border:2px solid var(--blue); border-radius:3px 3px 7px 3px; transform:skewY(-8deg); box-shadow:0 0 18px rgba(78,131,255,.38); }
    .quiet-button { border:1px solid rgba(235,241,255,.2); border-radius:999px; background:rgba(10,14,25,.44); backdrop-filter:blur(10px); color:#dee8ff; padding:8px 11px; font-size:11px; }
    .content { position:relative; z-index:2; min-height:inherit; display:flex; flex-direction:column; justify-content:flex-end; padding:82px 18px max(18px,env(safe-area-inset-bottom)); }
    .launch { justify-content:center; padding:60px 28px 36px; background:linear-gradient(180deg,rgba(12,16,32,.16),rgba(12,16,32,.78)); }
    .launch-card { margin-top:auto; padding:24px 0 8px; }
    .eyebrow { display:flex; gap:8px; align-items:center; color:#aebfff; font:11px var(--mono); letter-spacing:.1em; }.eyebrow::before { content:""; width:20px; height:1px; background:currentColor; }
    h1,h2,p { margin-top:0; } h1 { margin:16px 0 12px; font:clamp(32px,9vw,45px)/1.35 var(--serif); letter-spacing:-.045em; } .body-copy { max-width:350px; color:#c2cde1; font-size:14px; line-height:1.85; }
    .primary { display:flex; justify-content:center; align-items:center; gap:9px; width:100%; min-height:58px; margin-top:25px; border:0; border-radius:18px; color:white; background:var(--blue); box-shadow:0 15px 30px rgba(55,105,225,.3); font-weight:700; transition:.16s var(--ease); }.primary:active,.choice:active,.secondary:active { transform:scale(.975); }.primary:hover { filter:brightness(1.08); }
    .step-chip { display:inline-flex; align-items:center; gap:7px; width:max-content; padding:7px 10px; border:1px solid rgba(212,225,255,.18); border-radius:999px; background:rgba(11,16,28,.45); backdrop-filter:blur(10px); color:#e1eaff; font:11px var(--mono); }.step-chip b { display:grid; place-items:center; width:18px; height:18px; border-radius:50%; background:var(--blue); font-size:10px; }
    .instruction { align-self:center; margin:auto 0 16px; padding:11px 14px; border:1px solid rgba(232,240,255,.17); border-radius:14px; background:rgba(10,14,25,.5); backdrop-filter:blur(12px); color:#eef3ff; font-size:13px; font-weight:600; }.instruction strong { color:#a9c2ff; }
    .guide { position:absolute; z-index:2; top:29%; left:50%; width:67%; height:24%; transform:translateX(-50%); border:1px solid rgba(222,235,255,.62); border-radius:18px; opacity:.9; pointer-events:none; }.guide::before { content:"顔"; position:absolute; top:-12px; left:14px; padding:3px 7px; border-radius:6px; background:rgba(12,16,32,.8); color:#eaf1ff; font-size:11px; }.guide::after { content:"背景"; position:absolute; right:14px; bottom:-12px; padding:3px 7px; border-radius:6px; background:rgba(12,16,32,.8); color:#eaf1ff; font-size:11px; }
    .sheet { width:100%; padding:20px; border:1px solid rgba(232,240,255,.17); border-radius:24px; background:rgba(15,20,35,.9); box-shadow:0 14px 38px rgba(0,0,0,.24); backdrop-filter:blur(22px); animation:rise .24s var(--ease) both; }
    .sheet h2 { margin:8px 0 5px; font:22px/1.45 var(--serif); }.sheet p { margin:0; color:var(--muted); font-size:12px; line-height:1.75; }
    .small-note { margin-top:13px; color:#8d9ab2; font-size:11px; line-height:1.6; }
    .choice-grid { display:grid; gap:9px; margin-top:16px; }.choice { display:grid; grid-template-columns:38px minmax(0,1fr) 18px; align-items:center; gap:11px; width:100%; padding:14px 13px; border:1px solid rgba(228,237,255,.12); border-radius:16px; background:rgba(234,241,255,.045); color:#edf3ff; text-align:left; transition:.16s var(--ease); }.choice:hover,.choice.selected { border-color:rgba(116,159,255,.72); background:var(--blue-soft); }.choice .icon { display:grid; place-items:center; width:38px; height:38px; border-radius:13px; background:rgba(78,131,255,.16); color:#a9c2ff; font-size:19px; }.choice b { display:block; font-size:14px; }.choice small { display:block; margin-top:4px; color:#a6b2c8; font-size:11px; }.choice .arrow { color:#87a9ff; font-size:19px; }
    .action-card { margin-top:14px; padding:18px; border-left:3px solid var(--blue); border-radius:0 16px 16px 0; background:rgba(78,131,255,.14); }.action-card .label { color:#a8c1ff; font:10px var(--mono); letter-spacing:.1em; }.action-card h2 { margin:8px 0 0; font:22px/1.55 var(--serif); }.observe { margin-top:14px; padding-top:13px; border-top:1px solid rgba(220,232,255,.13); color:#b7c4d9; font-size:12px; line-height:1.7; }.observe b { color:#e7efff; }
    .secondary { display:flex; justify-content:center; align-items:center; width:100%; min-height:51px; margin-top:12px; border:1px solid rgba(218,230,255,.18); border-radius:16px; background:rgba(232,239,255,.07); color:#dce7ff; font-size:13px; font-weight:600; }
    .outcomes { display:grid; gap:8px; margin-top:15px; }.outcome { width:100%; padding:13px; border:1px solid rgba(228,237,255,.1); border-radius:14px; background:rgba(228,237,255,.045); color:#e5edff; text-align:left; font-size:13px; }.outcome small { display:block; margin-top:4px; color:#9ca9c0; font-size:11px; }
    .success { text-align:center; }.success .mark { display:grid; place-items:center; width:54px; height:54px; margin:2px auto 16px; border-radius:20px; background:rgba(144,216,167,.16); color:var(--green); font-size:26px; }.success h2 { margin-bottom:8px; }.success .saved-text { margin-top:15px; padding:12px; border-radius:14px; background:rgba(144,216,167,.1); color:#caead4; font-size:12px; line-height:1.7; }
    .status { display:inline-flex; gap:6px; align-items:center; margin-top:14px; color:#a4b2ca; font:10px var(--mono); }.status i { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px rgba(144,216,167,.14); }.status.warn i { background:var(--warm); box-shadow:0 0 0 4px rgba(230,190,130,.12); }
    @keyframes rise { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @media (max-width:390px) { .phone { min-height:calc(100svh - 16px); border-radius:26px; }.app { padding:8px; }.content { padding-left:14px; padding-right:14px; }.sheet { padding:17px; }.launch { padding-left:22px; padding-right:22px; } h1 { font-size:32px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="app"><section class="phone" aria-live="polite"><div id="screen"></div></section></main>
  <script>
    /* Camera-first four-step interaction. No EV, exposure, or simulated measurement values are shown. */
    const screen = document.querySelector('#screen');
    const STORAGE = 'luminacam-four-step-discoveries';
    let stream = null;
    let currentStep = 'launch';
    let selected = null;
    const choices = {
      faceDark: { icon:'◐', title:'顔が暗い', body:'背景の方が明るく、顔が沈んで見えます。', action:'人物を明るい方向へ、少しだけ向ける。', observe:'目元と頬が、背景に負けず見えやすくなったか。' },
      sideDark: { icon:'◑', title:'片側が暗い', body:'顔の左右で、明るさが分かれています。', action:'顔を光の方向へ、少しだけ向ける。', observe:'暗い側の頬が、少しやわらいだか。' },
      faceBright: { icon:'✦', title:'顔は明るい', body:'顔は自然に見えています。', action:'人物を背景から、一歩だけ離す。', observe:'主役が背景から見つけやすくなったか。' }
    };
    function stopCamera() { if (stream) stream.getTracks().forEach(track => track.stop()); stream = null; }
    function hasCameraApi() { return Boolean(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
    function cameraError(error) {
      if (!window.isSecureContext && location.hostname !== 'localhost') return 'カメラを使うには、localhost または HTTPS で開いてください。';
      if (error?.name === 'NotAllowedError') return 'カメラが許可されていません。ブラウザのサイト設定から「カメラ」を許可してください。';
      if (error?.name === 'NotFoundError') return '利用できるカメラが見つかりません。端末の設定をご確認ください。';
      if (error?.name === 'NotReadableError') return 'カメラが他のアプリで使われています。会議アプリなどを閉じてください。';
      return 'カメラを起動できませんでした。手動観察モードで続けられます。';
    }
    async function openCamera() {
      currentStep = 'observe'; render();
      if (!hasCameraApi()) { setStatus('このブラウザではカメラを使えません。手動観察モードで続けます。', true); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
        const video = document.querySelector('#live-video');
        video.srcObject = stream; await video.play();
        document.querySelector('.camera').classList.remove('off');
        setStatus('ライブ映像で観察中', false);
      } catch (error) { setStatus(cameraError(error), true); }
    }
    function setStatus(message, warning) { const node=document.querySelector('#camera-status'); if (node) { node.textContent=message; node.className='status'+(warning?' warn':''); } }
    function openChoices() { currentStep='choose'; render(); }
    function choose(id) { selected=id; currentStep='try'; render(); }
    function finish() { currentStep='finish'; render(); }
    function saveDiscovery() {
      const list = JSON.parse(localStorage.getItem(STORAGE) || '[]');
      list.unshift({ createdAt:new Date().toISOString(), choice:selected, action:choices[selected].action });
      localStorage.setItem(STORAGE, JSON.stringify(list));
      document.querySelector('#saved-message').textContent = '発見を残しました。次に似た光を見つけたとき、ここから思い出せます。';
    }
    function restart() { stopCamera(); selected=null; currentStep='launch'; render(); }
    function cameraLayer() { return `<div class="camera off"><video id="live-video" autoplay muted playsinline></video></div>`; }
    function topbar() { return `<header class="topbar"><div class="brand"><i></i>LuminaCam</div>${currentStep==='launch'?'':`<button class="quiet-button" onclick="restart()">終了</button>`}</header>`; }
    function syncCamera() { const video=document.querySelector("#live-video"); if (stream && video) { video.srcObject=stream; video.play().catch(() => {}); document.querySelector(".camera")?.classList.remove("off"); } }
    function render() {
      if (currentStep === 'launch') {
        screen.innerHTML = `${cameraLayer()}${topbar()}<div class="content launch"><div class="launch-card"><div class="eyebrow">LIGHT, BEFORE SETTINGS</div><h1>光を見て、<br>一つだけ試す。</h1><p class="body-copy">数値を読む前に、カメラ映像の顔と背景を見比べます。最初にすることは、カメラを開くことだけです。</p><button class="primary" onclick="openCamera()">カメラを開く　→</button><div class="status warn"><i></i>カメラは許可を求めます</div></div></div>`;
        return;
      }
      const base = `${cameraLayer()}${topbar()}<div class="guide" aria-hidden="true"></div>`;
      if (currentStep === 'observe') {
        screen.innerHTML = `${base}<div class="content"><span class="step-chip"><b>1</b> 顔と背景を見る</span><div class="instruction"><strong>顔</strong> と <strong>背景</strong> の明るさを見比べる</div><section class="sheet"><div class="eyebrow">STEP 1 / 4</div><h2>まず、映像を見る。</h2><p>説明は読まなくて大丈夫です。画面の枠の中にある顔と、その後ろの背景を見比べてください。</p><button class="primary" onclick="openChoices()">見え方を選ぶ　→</button><div id="camera-status" class="status warn"><i></i>カメラを起動しています</div></section></div>`;
      }
      if (currentStep === 'choose') {
        screen.innerHTML = `${base}<div class="content"><section class="sheet"><span class="step-chip"><b>2</b> 見え方を選ぶ</span><h2>いちばん近い見え方は？</h2><p>言葉どおりに選んでください。間違っても、次の画面で戻れます。</p><div class="choice-grid">${Object.entries(choices).map(([id,item]) => `<button class="choice" onclick="choose('${id}')"><span class="icon">${item.icon}</span><span><b>${item.title}</b><small>${item.body}</small></span><span class="arrow">›</span></button>`).join('')}</div></section></div>`;
      }
      if (currentStep === 'try') {
        const item=choices[selected];
        screen.innerHTML = `${base}<div class="content"><section class="sheet"><span class="step-chip"><b>3</b> 一つだけ試す</span><div class="action-card"><div class="label">次の一手</div><h2>${item.action}</h2><div class="observe"><b>見るところ：</b>${item.observe}</div></div><button class="primary" onclick="finish()">試した　→</button><button class="secondary" onclick="openChoices()">別の見え方を選ぶ</button></section></div>`;
      }
      if (currentStep === 'finish') {
        const item=choices[selected];
        screen.innerHTML = `${base}<div class="content"><section class="sheet success"><span class="step-chip"><b>4</b> 変化を見る</span><div class="mark">✓</div><h2>変化は見えましたか？</h2><p>正解を決める必要はありません。今の映像を見て、顔と背景の関係が少し変わったかだけを確かめます。</p><div class="outcomes"><button class="outcome" onclick="saveDiscovery()">顔が見えやすくなった<small>今の一手を、次の撮影の発見として残す</small></button><button class="outcome" onclick="saveDiscovery()">少し変わった<small>次も同じ一手を試して、変化を比べる</small></button><button class="outcome" onclick="restart()">今回は難しかった<small>光の方向を変えて、最初から見直す</small></button></div><p id="saved-message" class="saved-text">「試した」こと自体が、次の一枚のヒントになります。</p><button class="secondary" onclick="restart()">最初から見る</button></section></div>`;
      }
      syncCamera();
    }
    window.openCamera=openCamera; window.openChoices=openChoices; window.choose=choose; window.finish=finish; window.saveDiscovery=saveDiscovery; window.restart=restart;
    window.addEventListener('beforeunload', stopCamera);
    render();
  </script>
</body>
</html>
