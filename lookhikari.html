<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a2330" />
  <title>LuminaCam — 光の記憶</title>
  <style>
    /* Soft Dusk: camera-first learning, then a quiet personal archive. */
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&display=swap');
    :root { --ink:#2a2330; --panel:#3a3041; --panel-2:#47384a; --line:rgba(255,244,250,.2); --text:#fff9fc; --muted:#eadde5; --pink:#c689ae; --pink-2:#dfa8c4; --pink-soft:rgba(224,164,195,.19); --lilac:#b7a7df; --sage:#b7d7bd; --warm:#ebc88e; --serif:"Noto Serif JP",serif; --sans:"Noto Sans JP",sans-serif; --mono:"IBM Plex Mono",monospace; --ease:cubic-bezier(.23,1,.32,1); }
    * { box-sizing:border-box; } html,body { min-height:100%; margin:0; background:#221d28; color:var(--text); font-family:var(--sans); }
    button { font:inherit; cursor:pointer; } button:focus-visible { outline:3px solid #ffd4e7; outline-offset:3px; }
    .app { min-height:100svh; padding:18px; background:radial-gradient(circle at 50% -10%,#70546e,transparent 43%),linear-gradient(145deg,#211d2b,#322534); }
    .frame { width:min(100%,1040px); min-height:calc(100svh - 36px); margin:0 auto; position:relative; overflow:hidden; border:1px solid rgba(255,243,250,.27); border-radius:32px; background:rgba(43,35,48,.95); box-shadow:0 30px 100px rgba(24,17,27,.48); }
    .brandbar { min-height:70px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px clamp(18px,4vw,32px); border-bottom:1px solid var(--line); background:rgba(52,42,58,.7); backdrop-filter:blur(18px); }
    .brand { display:flex; align-items:center; gap:9px; color:#fff6fa; font:600 17px var(--serif); }.brand i { display:block; width:19px; height:22px; border:2px solid var(--pink-2); border-radius:3px 3px 7px 3px; transform:skewY(-8deg); box-shadow:0 0 18px rgba(223,168,196,.35); }
    .brand small { display:block; margin-top:2px; color:#cdbdca; font:9px var(--mono); letter-spacing:.1em; }.mode { padding:7px 10px; border:1px solid var(--line); border-radius:999px; color:#eadde5; background:rgba(255,244,250,.05); font:10px var(--mono); }
    .main { min-height:calc(100svh - 140px); padding:clamp(20px,4vw,42px) clamp(18px,4vw,44px) 98px; animation:show .22s var(--ease) both; }
    .eyebrow { display:flex; align-items:center; gap:8px; color:#f1c9db; font:10px var(--mono); letter-spacing:.12em; }.eyebrow::before { content:""; width:18px; height:1px; background:currentColor; }
    h1,h2,h3,p { margin-top:0; } h1 { margin:13px 0 11px; font:clamp(30px,5vw,48px)/1.32 var(--serif); letter-spacing:-.04em; } h2 { font:22px/1.45 var(--serif); } h3 { font:16px/1.5 var(--serif); }
    .copy { max-width:600px; color:var(--muted); font-size:14px; line-height:1.85; }.small { color:#cdbdca; font-size:12px; line-height:1.75; }
    .primary,.secondary,.quiet { display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:17px; transition:.16s var(--ease); }.primary { min-height:56px; padding:13px 18px; border:0; background:linear-gradient(135deg,#c689ae,#a66e97); color:white; box-shadow:0 14px 30px rgba(129,73,110,.3); font-weight:700; }.primary:hover { filter:brightness(1.07); }.secondary { min-height:50px; padding:11px 15px; border:1px solid rgba(255,239,248,.22); background:rgba(255,239,248,.08); color:#fff6fa; font-weight:600; }.quiet { padding:0; border:0; background:transparent; color:#f0bfd7; font-size:12px; font-weight:600; }.primary:active,.secondary:active,.quiet:active,.nav-item:active,.choice:active,.note-card:active { transform:scale(.975); }
    .hero { position:relative; overflow:hidden; padding:clamp(27px,5vw,54px); border:1px solid rgba(255,241,249,.18); border-radius:29px; background:linear-gradient(120deg,rgba(79,57,78,.92),rgba(57,44,63,.85)); }.hero::before { content:""; position:absolute; right:-9%; bottom:-36%; width:55%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 40% 35%,rgba(255,210,229,.43),transparent 10%),radial-gradient(circle at 55% 55%,rgba(183,167,223,.3),transparent 48%); filter:blur(1px); }.hero > * { position:relative; }
    .hero .primary { margin-top:20px; }.next-line { display:flex; align-items:center; gap:10px; margin-top:26px; padding:13px 14px; border-left:2px solid var(--pink-2); background:rgba(255,236,247,.07); color:#f8eaf1; font-size:13px; }.next-line b { color:#ffd5e7; }
    .home-grid { display:grid; grid-template-columns:1.35fr .75fr; gap:18px; }.stack { display:grid; gap:18px; }.card { padding:21px; border:1px solid var(--line); border-radius:23px; background:rgba(255,244,250,.055); }.card h2 { margin:6px 0 0; }.card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }.stat { margin-top:15px; padding-top:13px; border-top:1px solid rgba(255,240,248,.13); color:#dccbd6; font-size:12px; line-height:1.75; }.stat b { color:#fff6fa; }.signal { display:flex; align-items:flex-start; gap:10px; margin-top:13px; color:#eadde5; font-size:12px; line-height:1.65; }.signal i { display:grid; flex:0 0 auto; place-items:center; width:22px; height:22px; border-radius:8px; background:rgba(223,168,196,.18); color:#ffd3e5; font-style:normal; }.memory-preview { display:grid; gap:10px; margin-top:14px; }.memory-preview button { display:grid; grid-template-columns:10px 1fr auto; align-items:center; gap:9px; width:100%; padding:10px 0; border:0; border-top:1px solid rgba(255,240,248,.11); background:transparent; color:#f8edf3; text-align:left; font-size:12px; }.memory-preview i { width:8px; height:8px; border-radius:3px 3px 5px 3px; background:var(--pink-2); transform:rotate(45deg); }.memory-preview small { color:#c9b9c6; font-size:11px; }
    .tabbar { position:absolute; z-index:10; right:14px; bottom:max(14px,env(safe-area-inset-bottom)); left:14px; display:grid; grid-template-columns:repeat(4,1fr); gap:5px; padding:7px; border:1px solid rgba(255,242,249,.18); border-radius:22px; background:rgba(51,41,57,.92); box-shadow:0 16px 40px rgba(25,17,27,.32); backdrop-filter:blur(18px); }.nav-item { display:grid; place-items:center; gap:4px; min-height:54px; border:0; border-radius:15px; color:#c9b9c6; background:transparent; font-size:10px; font-weight:600; }.nav-item span { font-size:18px; line-height:1; }.nav-item.active { color:#fff8fb; background:rgba(211,137,176,.2); box-shadow:inset 0 0 0 1px rgba(255,208,229,.12); }
    .camera-screen { position:relative; min-height:calc(100svh - 70px); overflow:hidden; margin:calc(clamp(20px,4vw,42px) * -1) calc(clamp(18px,4vw,44px) * -1) -98px; }.camera { position:absolute; inset:0; overflow:hidden; background:radial-gradient(circle at 65% 22%,#96718b,transparent 35%),linear-gradient(135deg,#5c465e,#292332 60%,#443242); }.camera video { width:100%; height:100%; object-fit:cover; filter:saturate(.93) contrast(1.02) brightness(.98); }.camera::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(37,26,39,.38),transparent 28%,transparent 57%,rgba(37,26,39,.56)); pointer-events:none; }.camera.off::before { content:"カメラ映像の代わりに、目で光を観察するモードです"; position:absolute; z-index:1; top:40%; right:30px; left:30px; padding:14px; border:1px solid var(--line); border-radius:16px; background:rgba(55,42,58,.72); color:#f2e6ee; font-size:12px; line-height:1.75; text-align:center; }.capture-top { position:absolute; z-index:3; top:max(16px,env(safe-area-inset-top)); right:18px; left:18px; display:flex; align-items:center; justify-content:space-between; }.capture-top .quiet { padding:8px 11px; border:1px solid rgba(255,242,249,.23); border-radius:999px; background:rgba(52,40,56,.43); color:#fff4fa; backdrop-filter:blur(10px); }.progress { color:#ffe7f3; font:11px var(--mono); letter-spacing:.1em; }.guide { position:absolute; z-index:2; top:27%; left:50%; width:min(67%,360px); height:23%; transform:translateX(-50%); border:1px solid rgba(255,239,248,.72); border-radius:20px; pointer-events:none; }.guide::before,.guide::after { position:absolute; padding:3px 7px; border-radius:6px; background:rgba(48,35,51,.8); color:#fff3f9; font-size:11px; }.guide::before { content:"顔"; top:-12px; left:14px; }.guide::after { content:"背景"; right:14px; bottom:-12px; }.capture-content { position:relative; z-index:3; min-height:calc(100svh - 70px); display:flex; flex-direction:column; justify-content:flex-end; padding:75px 18px 98px; }.observation { align-self:center; margin:auto 0 14px; padding:11px 14px; border:1px solid rgba(255,240,248,.22); border-radius:14px; background:rgba(56,40,58,.5); color:#fff7fb; backdrop-filter:blur(13px); font-size:13px; font-weight:600; }.observation strong { color:#ffd0e4; }.sheet { width:min(100%,520px); align-self:center; padding:20px; border:1px solid rgba(255,241,249,.2); border-radius:26px; background:rgba(57,43,60,.92); box-shadow:0 16px 46px rgba(24,17,27,.3); backdrop-filter:blur(20px); animation:rise .22s var(--ease) both; }.step { display:inline-flex; align-items:center; gap:7px; padding:6px 10px; border:1px solid rgba(255,236,247,.23); border-radius:999px; color:#fff5fb; background:rgba(79,56,77,.6); font:10px var(--mono); }.step b { display:grid; place-items:center; width:18px; height:18px; border-radius:50%; background:var(--pink); font-size:10px; }.sheet h2 { margin:10px 0 6px; }.sheet p { margin:0; color:#eadde5; font-size:12px; line-height:1.75; }.sheet .primary { width:100%; margin-top:16px; }.camera-status { display:inline-flex; align-items:center; gap:6px; margin-top:12px; color:#eadde5; font:10px var(--mono); }.camera-status i { width:7px; height:7px; border-radius:50%; background:var(--sage); box-shadow:0 0 0 4px rgba(183,215,189,.13); }.camera-status.warn i { background:var(--warm); box-shadow:0 0 0 4px rgba(235,200,142,.12); }
    .choice-grid { display:grid; gap:9px; margin-top:15px; }.choice { display:grid; grid-template-columns:38px minmax(0,1fr) 18px; gap:11px; align-items:center; width:100%; padding:15px; border:1px solid rgba(255,238,248,.15); border-radius:19px; background:rgba(255,244,250,.08); color:#fff8fb; text-align:left; }.choice .icon { display:grid; place-items:center; width:38px; height:38px; border-radius:13px; background:rgba(236,175,207,.2); color:#ffd1e5; font-size:19px; }.choice b { display:block; font-size:14px; }.choice small { display:block; margin-top:4px; color:#e2cfda; font-size:11px; }.choice .arrow { color:#f2bdd6; font-size:19px; }.action-card { margin-top:14px; padding:18px; border-left:3px solid var(--pink-2); border-radius:0 19px 19px 0; background:rgba(229,162,194,.17); }.action-card .label { color:#ffd1e4; font:10px var(--mono); letter-spacing:.1em; }.action-card h2 { margin:7px 0 0; font-size:22px; }.observe { margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,236,247,.17); color:#eadde5; font-size:12px; line-height:1.7; }.observe b { color:#fff8fb; }.outcomes { display:grid; gap:8px; margin-top:15px; }.outcome { width:100%; padding:14px; border:1px solid rgba(255,238,248,.15); border-radius:16px; background:rgba(255,244,250,.08); color:#fff8fb; text-align:left; font-size:13px; }.outcome small { display:block; margin-top:4px; color:#e0cfda; font-size:11px; }.remember { display:grid; place-items:center; width:52px; height:52px; margin:4px auto 14px; border-radius:19px; background:rgba(183,215,189,.18); color:#d9f2de; font-size:26px; }.saved { margin-top:14px; padding:12px; border-radius:14px; background:rgba(183,215,189,.13); color:#dff2e3; font-size:12px; line-height:1.7; }
    .page-title { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; }.page-title h1 { margin-bottom:0; }.page-title .quiet { padding-bottom:5px; }.notes { display:grid; gap:11px; margin-top:22px; }.note-card { display:grid; grid-template-columns:62px minmax(0,1fr) auto; gap:13px; align-items:center; width:100%; padding:11px; border:1px solid var(--line); border-radius:19px; background:rgba(255,244,250,.06); color:#fff7fb; text-align:left; }.note-visual { position:relative; overflow:hidden; width:62px; height:70px; border-radius:13px; background:linear-gradient(135deg,#c290a5,#4a3b62 58%,#33283b); }.note-visual.side { background:linear-gradient(135deg,#bda8d4,#493b55 58%,#372a3e); }.note-visual.soft { background:linear-gradient(135deg,#e4c4a7,#7c5e69 55%,#3d2f42); }.note-visual::after { content:""; position:absolute; right:17px; top:13px; width:26px; height:36px; border-radius:50% 50% 10px 10px; background:rgba(34,27,40,.72); }.note-card .date { color:#d9c8d4; font:10px var(--mono); }.note-card h3 { margin:4px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.note-card p { display:-webkit-box; margin:0; overflow:hidden; color:#d9c8d4; font-size:11px; line-height:1.6; -webkit-line-clamp:2; -webkit-box-orient:vertical; }.bookmark { color:#ffd1e5; font-size:20px; }.detail { margin-top:20px; padding:20px; border:1px solid var(--line); border-radius:23px; background:rgba(255,244,250,.07); }.detail h2 { margin:8px 0 14px; }.detail-row { display:grid; grid-template-columns:27px 1fr; gap:10px; padding:12px 0; border-top:1px solid rgba(255,239,248,.12); }.detail-row:first-of-type { border-top:0; }.detail-row b { display:grid; place-items:center; width:25px; height:25px; border-radius:50%; background:rgba(223,168,196,.18); color:#ffd3e5; font:10px var(--mono); }.detail-row small { color:#e7d6df; font-size:11px; }.detail-row p { margin:4px 0 0; color:#fff5fa; font:14px/1.7 var(--serif); }
    .map { margin-top:24px; overflow-x:auto; }.map-grid { display:grid; grid-template-columns:86px repeat(3,minmax(115px,1fr)); min-width:550px; gap:7px; }.axis { display:flex; align-items:center; justify-content:center; min-height:31px; color:#decbd7; font-size:11px; }.axis.left { justify-content:flex-start; color:#fff5fa; font-family:var(--serif); }.cell { position:relative; min-height:112px; padding:12px; border:1px solid rgba(255,238,248,.11); border-radius:17px; background:rgba(255,244,250,.045); color:#a79aa8; }.cell.active { border-color:rgba(240,187,216,.42); background:rgba(225,164,195,.14); color:#fff5fb; }.cell .pin { position:absolute; top:12px; right:12px; color:#ffd0e4; font-size:19px; }.cell b { display:block; margin-top:28px; font-size:11px; }.cell small { display:block; margin-top:5px; color:inherit; font-size:10px; line-height:1.55; }.map-note { margin-top:20px; padding:17px; border-left:2px solid var(--lilac); border-radius:0 18px 18px 0; background:rgba(183,167,223,.12); }.map-note h3 { margin:7px 0 4px; }.map-note p { margin:0; color:#e5d9e2; font-size:12px; line-height:1.75; }.strategy { margin-top:16px; padding:19px; border:1px solid rgba(255,236,247,.17); border-radius:22px; background:linear-gradient(135deg,rgba(206,137,174,.18),rgba(183,167,223,.12)); }.strategy-head { display:flex; justify-content:space-between; gap:12px; }.strategy h2 { margin:6px 0; }.tags { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }.tags span { padding:5px 8px; border-radius:999px; background:rgba(255,244,250,.13); color:#fff4fa; font-size:10px; }.strategy p { margin:0; color:#eadde5; font-size:12px; line-height:1.75; }
    .empty { display:grid; place-items:center; min-height:260px; margin-top:20px; padding:25px; border:1px dashed rgba(255,239,248,.25); border-radius:23px; color:#ddcad6; text-align:center; }.empty h2 { margin-bottom:8px; }.empty p { margin:0; font-size:12px; line-height:1.75; }
    @keyframes show { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } } @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @media(max-width:760px) { .app { padding:8px; }.frame { min-height:calc(100svh - 16px); border-radius:27px; }.brandbar { min-height:62px; padding:13px 17px; }.main { min-height:calc(100svh - 130px); padding:22px 16px 91px; }.home-grid { grid-template-columns:1fr; }.hero { padding:25px 21px; }.hero h1 { font-size:34px; }.camera-screen { min-height:calc(100svh - 62px); margin:-22px -16px -91px; }.capture-content { min-height:calc(100svh - 62px); padding:70px 14px 92px; }.sheet { padding:18px; }.map-grid { min-width:520px; }.tabbar { right:10px; bottom:max(10px,env(safe-area-inset-bottom)); left:10px; }.nav-item { min-height:50px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }

<body>
  <div class="app"><main class="frame"><header class="brandbar"><div class="brand"><i></i><div>LuminaCam<small>LIGHT MEMORY</small></div></div><span class="mode">LOCAL NOTE</span></header><section id="screen"></section><nav class="tabbar" aria-label="メインメニュー"><button class="nav-item" data-view="home"><span>⌂</span>ホーム</button><button class="nav-item" data-view="capture"><span>◎</span>見る</button><button class="nav-item" data-view="notes"><span>▤</span>ノート</button><button class="nav-item" data-view="map"><span>⌁</span>地図</button></nav></main></div>
  <script>
    /* The camera step is a doorway. The durable value lives in personal memories, notes, maps, and reusable strategies. */
    const screen = document.querySelector('#screen');
    const STORE = 'luminacam-journey-notes-v1';
    const seed = [
      {id:'sunset',date:'8月13日',light:'backlight',label:'逆光',title:'夕方の逆光で人物を撮る',feeling:'背景の色を残したかった',action:'人物を明るい方向へ少し向けた',result:'顔の影がやわらぎ、夕方の色も残った。',next:'次は背景から一歩だけ離してみる。',visual:'backlight'},
      {id:'window',date:'8月10日',light:'side',label:'横からの光',title:'窓際のやわらかい人物',feeling:'肌を自然に見せたかった',action:'顔を窓の方へ少し向けた',result:'暗い側の頬がやわらいだ。',next:'次は背景の距離も比べてみる。',visual:'side'},
      {id:'soft',date:'8月04日',light:'soft',label:'やわらかな光',title:'室内のやわらかい人物',feeling:'落ち着いた雰囲気を残したかった',action:'人物を背景から離した',result:'主役が見つけやすくなった。',next:'次は光の方向を変えずに背景を整える。',visual:'soft'}
    ];
    const choices = {
      backlight:{icon:'◐',title:'顔が背景に沈んで見える',body:'背景の方が明るく、顔が沈んで見えます。',label:'逆光',action:'人物を明るい方向へ、少しだけ向ける。',observe:'目元と頬が、背景に負けず見えやすくなったか。',next:'次は背景から一歩だけ離してみる。',visual:'backlight'},
      side:{icon:'◑',title:'片側の影が気になる',body:'顔の左右で、明るさが分かれています。',label:'横からの光',action:'顔を光の方向へ、少しだけ向ける。',observe:'暗い側の頬が、少しやわらいだか。',next:'次は背景の距離も比べてみる。',visual:'side'},
      soft:{icon:'✦',title:'顔と背景が重なって見える',body:'顔は自然に見えています。',label:'やわらかな光',action:'人物を背景から、一歩だけ離す。',observe:'主役が背景から見つけやすくなったか。',next:'次は光の方向を変えずに背景を整える。',visual:'soft'}
    };
    let notes = loadNotes(); let view='home'; let captureStep='launch'; let selectedLight='soft'; let selectedNote=null; let stream=null; let cameraMessage='';
    function loadNotes(){ try { return JSON.parse(localStorage.getItem(STORE)) || seed; } catch { return seed; } }
    function persist(){ localStorage.setItem(STORE, JSON.stringify(notes)); }
    function escapeText(value){ return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[char])); }
    function stopCamera(){ if(stream) stream.getTracks().forEach(track => track.stop()); stream=null; }
    function navigate(next){ if(next!=='capture') stopCamera(); view=next; selectedNote=null; if(next==='capture') captureStep='launch'; render(); }
    function cameraLayer(){ return `<div class="camera ${stream?'':'off'}"><video id="live-video" autoplay muted playsinline></video></div>`; }
    function syncCamera(){ const video=document.querySelector('#live-video'); if(stream && video){ video.srcObject=stream; video.play().catch(()=>{}); document.querySelector('.camera')?.classList.remove('off'); } }
    function cameraError(error){ if(!window.isSecureContext && location.hostname!=='localhost') return 'カメラを使うには、localhost または HTTPS で開いてください。'; if(error?.name==='NotAllowedError') return 'カメラが許可されていません。ブラウザのサイト設定から許可してください。'; if(error?.name==='NotReadableError') return 'カメラが他のアプリで使われています。会議アプリなどを閉じてください。'; return 'カメラを起動できませんでした。手動観察モードで続けられます。'; }
    async function openCamera(){ view='capture'; captureStep='observe'; cameraMessage='カメラを起動しています'; render(); if(!navigator.mediaDevices?.getUserMedia){ cameraMessage='このブラウザではカメラを利用できません。手動観察モードで続けられます。'; render(); return; } try { stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}); cameraMessage='ライブ映像で観察中'; render(); } catch(error){ cameraMessage=cameraError(error); render(); } }
    function showChoices(){ captureStep='choose'; render(); }
    function chooseLight(id){ selectedLight=id; captureStep='try'; render(); }
    function completeTry(){ captureStep='reflect'; render(); }
    function saveMemory(kind){ const item=choices[selectedLight]; const date=new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric'}).format(new Date()); const result=kind==='clear'?'光の向きを少し変えると、見え方がやわらいだ。':kind==='subtle'?'少し変わった。次も同じ工夫を比べてみたい。':'今回は難しかった。光の方向から見直したい。'; notes.unshift({id:'note-'+Date.now(),date,light:selectedLight,label:item.label,title:`${item.label}で人物を撮る`,feeling:'人物を自然に写したかった',action:item.action.replace('。',''),result,next:item.next,visual:item.visual}); persist(); captureStep='remember'; render(); }
    function latest(){ return notes[0]; }
    function lightCount(light){ return notes.filter(note=>note.light===light).length; }
    function preference(){ const ids=Object.keys(choices); const top=ids.reduce((best,id)=>lightCount(id)>lightCount(best)?id:best,ids[0]); return choices[top]; }
    function home(){ const last=latest(), favorite=preference(); return `<div class="main"><div class="home-grid"><section class="hero"><div class="eyebrow">YOUR LIGHT MEMORY</div><h1>撮ったあとに残るのは、<br>あなたの光の見方。</h1><p class="copy">LuminaCamは一枚を評価するためのアプリではありません。試したこと、心地よかった光、次に試したいことを重ねて、自分らしい撮り方を見つける場所です。</p><button class="primary" onclick="openCamera()">今日の光を見る　→</button><div class="next-line"><b>次に試す：</b>${escapeText(last.next)}</div></section><aside class="stack"><section class="card"><div class="card-head"><div><div class="eyebrow">LATEST MEMORY</div><h2>${escapeText(last.title)}</h2></div><button class="quiet" onclick="openNote('${last.id}')">読む　›</button></div><div class="stat"><b>残したかったこと：</b>${escapeText(last.feeling)}<br><b>気づき：</b>${escapeText(last.result)}</div></section><section class="card"><div class="eyebrow">YOUR TENDENCY</div><h2>${escapeText(favorite.label)}を、よく選んでいます。</h2><div class="signal"><i>✦</i><span>これまでの記録から、<b>${escapeText(favorite.title)}</b>を活かす工夫が少しずつ育っています。</span></div></section></aside></div><section class="card" style="margin-top:18px"><div class="card-head"><div><div class="eyebrow">MEMORY TRAIL</div><h2>最近の光の記憶</h2></div><button class="quiet" onclick="navigate('notes')">ノートを開く　›</button></div><div class="memory-preview">${notes.slice(0,3).map(note=>`<button onclick="openNote('${note.id}')"><i></i><span>${escapeText(note.title)}<small>　${escapeText(note.result)}</small></span><b>›</b></button>`).join('')}</div></section></div>`; }
    function capture(){ const item=choices[selectedLight]; let panel=''; if(captureStep==='launch') panel=`<section class="sheet"><div class="eyebrow">LIGHT, BEFORE SETTINGS</div><h2>光を見て、今の一枚に寄り添う。</h2><p>まずすることは、カメラをひらくことだけです。数値ではなく、今の場面であなたが気になったところを自分の目で見ます。</p><button class="primary" onclick="openCamera()">カメラをひらく　→</button><div class="camera-status"><i></i>必要になったときだけ、カメラの許可をお願いします</div></section>`;
      if(captureStep==='observe') panel=`<section class="sheet"><span class="step"><b>1</b> 気になったところを見る</span><h2>気になったところを、眺めてみる。</h2><p>画面全体を見て、気になったところをそのまま眺めてください。正しい判断はありません。</p><button class="primary" onclick="showChoices()">感じた見え方を選ぶ　→</button><div class="camera-status ${stream?'':'warn'}"><i></i>${escapeText(cameraMessage)}</div></section>`;
      if(captureStep==='choose') panel=`<section class="sheet"><span class="step"><b>2</b> 今の見え方を選ぶ</span><h2>今、気になったのは？</h2><p>答えは一つではありません。あなたが感じたものを選んでください。いつでも戻れます。</p><div class="choice-grid">${Object.entries(choices).map(([id,choice])=>`<button class="choice" onclick="chooseLight('${id}')"><span class="icon">${choice.icon}</span><span><b>${escapeText(choice.title)}</b><small>${escapeText(choice.body)}</small></span><span class="arrow">›</span></button>`).join('')}</div></section>`;
      if(captureStep==='try') panel=`<section class="sheet"><span class="step"><b>3</b> ひとつだけ試してみる</span><div class="action-card"><div class="label">今、できること</div><h2>${escapeText(item.action)}</h2><div class="observe"><b>見るところ：</b>${escapeText(item.observe)}</div></div><button class="primary" onclick="completeTry()">試してみた　→</button><button class="secondary" onclick="showChoices()">感じ方を選び直す</button></section>`;
      if(captureStep==='reflect') panel=`<section class="sheet"><span class="step"><b>4</b> 変化を感じる</span><h2>少し、変わりましたか？</h2><p>うまくいったかを採点しなくて大丈夫です。さっきと少し違って見えるかを感じてみてください。</p><div class="outcomes"><button class="outcome" onclick="saveMemory('clear')">顔が見えやすくなった<small>この工夫を、次の一枚の記憶として残す</small></button><button class="outcome" onclick="saveMemory('subtle')">少し変わった<small>次も同じ工夫を試して、比べてみる</small></button><button class="outcome" onclick="saveMemory('hard')">今回は難しかった<small>光の方向を変えて、また最初から見る</small></button></div></section>`;
      if(captureStep==='remember') panel=`<section class="sheet"><span class="step"><b>✓</b> 記憶に残す</span><div class="remember">⌑</div><h2>光の記憶に残しました。</h2><p>今回の気づきは、撮影ノートと成長マップに加わりました。次に似た光に出会ったとき、あなたの作戦として思い出せます。</p><div class="saved">${escapeText(choices[selectedLight].label)} × 人物のしおりを、あなたの地図に置きました。</div><button class="primary" onclick="navigate('notes')">ノートで振り返る　→</button><button class="secondary" onclick="navigate('map')">成長マップを見る</button></section>`;
      return `<section class="camera-screen">${cameraLayer()}<div class="capture-top"><span class="progress">${captureStep==='launch'?'START':captureStep==='observe'?'1 / 4':captureStep==='choose'?'2 / 4':captureStep==='try'?'3 / 4':'4 / 4'}</span><button class="quiet" onclick="navigate('home')">終了</button></div>${captureStep!=='launch'?'<div class="guide" aria-hidden="true"></div>':''}<div class="capture-content">${captureStep==='observe'?'<div class="observation"><strong>気になったところを、そのまま見る</div>':''}${panel}</div></section>`; }
    function noteRow(note){ return `<button class="note-card" onclick="openNote('${note.id}')"><span class="note-visual ${escapeText(note.visual)}"></span><span><span class="date">${escapeText(note.date)} ・ ${escapeText(note.label)}</span><h3>${escapeText(note.title)}</h3><p>${escapeText(note.result)}</p></span><b class="bookmark">⌑</b></button>`; }
    function notesPage(){ if(selectedNote){ const note=notes.find(item=>item.id===selectedNote); return noteDetail(note); } return `<div class="main"><div class="page-title"><div><div class="eyebrow">FIELD NOTES</div><h1>撮影ノート</h1></div><button class="quiet" onclick="openCamera()">今日の光を見る　›</button></div><p class="copy">撮った結果ではなく、あなたが残したかったこと、試したこと、次に試したいことを残します。</p><section class="notes">${notes.map(noteRow).join('')}</section></div>`; }
    function noteDetail(note){ return `<div class="main"><button class="quiet" onclick="selectedNote=null;render()">← ノート一覧へ</button><section class="detail"><div class="eyebrow">${escapeText(note.date)} ・ ${escapeText(note.label)}</div><h2>${escapeText(note.title)}</h2><div class="detail-row"><b>01</b><div><small>残したかったこと</small><p>${escapeText(note.feeling)}</p></div></div><div class="detail-row"><b>02</b><div><small>試したこと</small><p>${escapeText(note.action)}</p></div></div><div class="detail-row"><b>03</b><div><small>今回の気づき</small><p>${escapeText(note.result)}</p></div></div><div class="detail-row"><b>04</b><div><small>次に試すこと</small><p>${escapeText(note.next)}</p></div></div><button class="primary" style="width:100%;margin-top:16px" onclick="openCamera()">似た光で使ってみる　→</button></section></div>`; }
    function mapPage(){ const favorite=preference(); const config=[['soft','やわらかな光'],['side','横からの光'],['backlight','逆光']]; const cols=['人物','雰囲気','動き']; const strategyNotes=notes.filter(note=>note.light===favorite===undefined?'soft':Object.keys(choices).find(key=>choices[key]===favorite)); const count=lightCount(Object.keys(choices).find(key=>choices[key]===favorite)); return `<div class="main"><div class="page-title"><div><div class="eyebrow">EXPERIENCE MAP</div><h1>あなたの成長マップ</h1></div><button class="quiet" onclick="openCamera()">新しく試す　›</button></div><p class="copy">これは上達の採点表ではありません。どんな光で、何を大切にしてきたかを眺めるための地図です。</p><div class="map"><div class="map-grid"><div></div>${cols.map(col=>`<div class="axis">${col}</div>`).join('')}${config.map(([id,label])=>`<div class="axis left">${label}</div>${cols.map((col,index)=>{const active=index===0&&lightCount(id)>0; const note=notes.find(item=>item.light===id); return `<div class="cell ${active?'active':''}">${active?`<span class="pin">⌑</span><b>${lightCount(id)}つの記憶</b><small>${escapeText(note?.next||'まだ試していません')}</small>`:'<b>まだ試していない</b><small>次に出会ったら、ここにしおりを置けます。</small>'}</div>`}).join('')}`).join('')}</div></div><section class="map-note"><div class="eyebrow">YOUR TENDENCY</div><h3>${escapeText(favorite.label)}を、よく選んでいます。</h3><p>記録から見ると、${escapeText(favorite.title)}ための工夫が、あなたの撮り方として少しずつ育っています。</p></section><section class="strategy"><div class="strategy-head"><div><div class="eyebrow">PERSONAL STRATEGY</div><h2>${escapeText(favorite.label)}で人物を撮る</h2></div><span class="bookmark">⌑</span></div><div class="tags"><span>人物</span><span>${escapeText(favorite.label)}</span><span>手持ち</span></div><p><b>守りたいこと：</b>人物の自然さと、その場の空気感。<br><b>まず試すこと：</b>${escapeText(favorite.action)}</p><button class="secondary" style="width:100%;margin-top:15px" onclick="openCamera()">この作戦で見る　→</button></section></div>`; }
    function render(){ document.querySelectorAll('.nav-item').forEach(button=>button.classList.toggle('active',button.dataset.view===view)); if(view==='home') screen.innerHTML=home(); if(view==='capture') screen.innerHTML=capture(); if(view==='notes') screen.innerHTML=notesPage(); if(view==='map') screen.innerHTML=mapPage(); if(view==='capture') syncCamera(); }
    function openNote(id){ view='notes'; selectedNote=id; render(); }
    document.querySelectorAll('.nav-item').forEach(button=>button.addEventListener('click',()=>navigate(button.dataset.view)));
    window.openCamera=openCamera; window.showChoices=showChoices; window.chooseLight=chooseLight; window.completeTry=completeTry; window.saveMemory=saveMemory; window.navigate=navigate; window.openNote=openNote; window.render=render;
    window.addEventListener('beforeunload',stopCamera); render();
  </script>


  <style>
    /* Observation-first refinement: the instruction can move aside whenever the user wants to inspect the image. */
    .observe-sheet { position:relative; }
    .hide-question { display:inline-flex; align-items:center; gap:6px; margin-left:auto; margin-bottom:13px; padding:7px 9px; border:1px solid rgba(255,238,248,.22); border-radius:999px; background:rgba(255,244,250,.08); color:#ffd0e4; font-size:11px; }
    .hide-question span { font-size:14px; line-height:1; }
    .question-peek { display:flex; align-items:center; justify-content:space-between; gap:10px; width:min(100%,520px); align-self:center; padding:10px 12px; border:1px solid rgba(255,238,248,.2); border-radius:18px; background:rgba(57,43,60,.76); color:#fff6fa; box-shadow:0 12px 35px rgba(24,17,27,.25); backdrop-filter:blur(16px); }
    .question-peek button { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border:0; border-radius:12px; background:rgba(223,168,196,.2); color:#fff5fa; font-size:12px; font-weight:700; }
    .question-peek small { color:#eadde5; font-size:11px; }
    .proposal-purpose { display:grid; gap:9px; margin-top:14px; padding:13px; border-top:1px solid rgba(255,236,247,.16); background:rgba(255,244,250,.06); }
    .proposal-purpose div { display:grid; grid-template-columns:70px 1fr; gap:8px; align-items:start; color:#e9dce4; font-size:11px; line-height:1.65; }
    .proposal-purpose b { color:#ffd0e4; font:10px var(--mono); letter-spacing:.06em; }
    .proposal-purpose span { color:#f8eff4; }
    .observe-hint { max-width:320px; color:#fff6fa; background:rgba(57,43,60,.42); }
    @media(max-width:760px) { .question-peek { margin-bottom:2px; } .proposal-purpose div { grid-template-columns:64px 1fr; } }
  </style>
  <script>
    let observeMinimized = false;
    const originalOpenCameraForObserve = openCamera;
    const proposalDetails = {
      backlight: { purpose: '顔に入る光を少し増やすため', expectation: '目元と頬が、明るい背景に負けず見えやすくなります。' },
      side: { purpose: '片側の影をやわらげるため', expectation: '暗い側の頬や表情が、少し見えやすくなります。' },
      soft: { purpose: '顔の輪郭と背景を重ねすぎないため', expectation: '顔のまわりに余白ができ、主役を見つけやすくなります。' }
    };
    function openObservationCamera() { observeMinimized = false; return originalOpenCameraForObserve(); }
    function toggleQuestion() { observeMinimized = !observeMinimized; render(); }
    function capture() {
      const item = choices[selectedLight];
      const detail = proposalDetails[selectedLight];
      let panel = '';
      if (captureStep === 'launch') panel = `<section class="sheet"><div class="eyebrow">LIGHT, BEFORE SETTINGS</div><h2>光を見て、今の一枚に寄り添う。</h2><p>まずすることは、カメラをひらくことだけです。数値ではなく、今の場面であなたが気になったところを自分の目で見ます。</p><button class="primary" onclick="openCamera()">カメラをひらく　→</button><div class="camera-status"><i></i>必要になったときだけ、カメラの許可をお願いします</div></section>`;
      if (captureStep === 'observe') {
        panel = observeMinimized
          ? `<section class="question-peek"><small>映像を見ている間は、質問をしまっておけます。</small><button onclick="toggleQuestion()">質問を開く <span>↑</span></button></section>`
          : `<section class="sheet observe-sheet"><button class="hide-question" onclick="toggleQuestion()">質問を隠す <span>↓</span></button><span class="step"><b>1</b> 気になったところを見る</span><h2>気になったところを、眺めてみる。</h2><p>画面全体を見て、気になったところをそのまま眺めてください。正しい判断はありません。</p><button class="primary" onclick="showChoices()">感じた見え方を選ぶ　→</button><div class="camera-status ${stream?'':'warn'}"><i></i>${escapeText(cameraMessage)}</div></section>`;
      }
      if (captureStep === 'choose') panel = `<section class="sheet"><span class="step"><b>2</b> 今の見え方を選ぶ</span><h2>今、気になったのは？</h2><p>答えは一つではありません。あなたが感じたものを選んでください。いつでも戻れます。</p><div class="choice-grid">${Object.entries(choices).map(([id,choice])=>`<button class="choice" onclick="chooseLight('${id}')"><span class="icon">${choice.icon}</span><span><b>${escapeText(choice.title)}</b><small>${escapeText(choice.body)}</small></span><span class="arrow">›</span></button>`).join('')}</div></section>`;
      if (captureStep === 'try') panel = `<section class="sheet"><span class="step"><b>3</b> ひとつだけ試してみる</span><div class="action-card"><div class="label">今、できること</div><h2>${escapeText(item.action)}</h2><div class="proposal-purpose"><div><b>ねらい</b><span>${escapeText(detail.purpose)}</span></div><div><b>期待する変化</b><span>${escapeText(detail.expectation)}</span></div></div><div class="observe"><b>見比べるところ：</b>${escapeText(item.observe)}</div></div><button class="primary" onclick="completeTry()">試してみた　→</button><button class="secondary" onclick="showChoices()">感じ方を選び直す</button></section>`;
      if (captureStep === 'reflect') panel = `<section class="sheet"><span class="step"><b>4</b> 変化を感じる</span><h2>少し、変わりましたか？</h2><p>うまくいったかを採点しなくて大丈夫です。さっきと少し違って見えるかを感じてみてください。</p><div class="outcomes"><button class="outcome" onclick="saveMemory('clear')">顔が見えやすくなった<small>この工夫を、次の一枚の記憶として残す</small></button><button class="outcome" onclick="saveMemory('subtle')">少し変わった<small>次も同じ工夫を試して、比べてみる</small></button><button class="outcome" onclick="saveMemory('hard')">今回は難しかった<small>光の方向を変えて、また最初から見る</small></button></div></section>`;
      if (captureStep === 'remember') panel = `<section class="sheet"><span class="step"><b>✓</b> 記憶に残す</span><div class="remember">⌑</div><h2>光の記憶に残しました。</h2><p>今回の気づきは、撮影ノートと成長マップに加わりました。次に似た光に出会ったとき、あなたの作戦として思い出せます。</p><div class="saved">${escapeText(choices[selectedLight].label)} × 人物のしおりを、あなたの地図に置きました。</div><button class="primary" onclick="navigate('notes')">ノートで振り返る　→</button><button class="secondary" onclick="navigate('map')">成長マップを見る</button></section>`;
      return `<section class="camera-screen">${cameraLayer()}<div class="capture-top"><span class="progress">${captureStep==='launch'?'START':captureStep==='observe'?'1 / 4':captureStep==='choose'?'2 / 4':captureStep==='try'?'3 / 4':'4 / 4'}</span><button class="quiet" onclick="navigate('home')">終了</button></div>${captureStep!=='launch'?'<div class="guide" aria-hidden="true"></div>':''}<div class="capture-content">${captureStep==='observe' && !observeMinimized?'<div class="observation observe-hint"><strong>気になったところを、そのまま見る</div>':''}${panel}</div></section>`;
    }
    window.openCamera = openObservationCamera;
    window.toggleQuestion = toggleQuestion;
  </script>
