    @media(max-width:760px){.shell{display:block;padding-bottom:78px}.rail{display:none}.main{padding:18px 16px 24px}.top{margin-bottom:18px}.top-meta{display:none}.hero{min-height:490px;padding:27px 23px}.hero h1{font-size:34px}.light-grid,.strategies,.practice{grid-template-columns:1fr}.light-card{min-height:105px;display:grid;grid-template-columns:44px 1fr;column-gap:12px;align-items:center}.light-card .icon-box{grid-row:span 2}.light-card strong{margin:0}.light-card span{margin:2px 0 0}.capture,.detail,.map-panel,.strategy-panel,.practice-panel{min-height:auto;padding:25px 20px;border-radius:25px}.capture h1{margin-top:30px;font-size:32px}.aside{grid-template-columns:1fr}.orbit{display:none}.note-row{grid-template-columns:68px minmax(0,1fr) auto;gap:11px;min-height:99px}.thumb{width:68px;height:74px}.note-row h3{font-size:14px}.note-row p{font-size:11px}.map-head,.insight{display:grid;grid-template-columns:1fr;align-items:start}.mobile-nav{position:fixed;z-index:10;right:12px;bottom:12px;left:12px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border:1px solid rgba(202,216,255,.13);border-radius:21px;background:rgba(14,18,31,.93);box-shadow:0 20px 45px rgba(0,0,0,.35);backdrop-filter:blur(20px)}.mobile-nav button{display:grid;place-items:center;gap:4px;min-height:52px;border-radius:15px;color:#8390ad;background:transparent;font-size:10px;font-weight:600}.mobile-nav button.active{color:#e8efff;background:rgba(61,123,255,.17)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="rail"><div class="logo" aria-label="LuminaCam"></div><nav class="nav" id="side-nav"></nav><div class="rail-status"><i></i>LOCAL<br>NOTE</div></aside>
    <main class="main"><header class="top"><button class="wordmark" data-tab="home"><span class="logo"></span>LuminaCam</button><div class="top-meta"><span class="pill">◎ FIELD NOTES</span><span>LOCAL-FIRST</span></div></header><div id="app" class="page"></div></main>
  </div>
  <nav class="mobile-nav" id="mobile-nav"></nav>

  <script>
    /* LuminaCam standalone: no build tool or external JS library is required. Camera access needs HTTPS or localhost. */
    const $ = (selector, root=document) => root.querySelector(selector);
    const app = $('#app');
    const STORE_NOTES = 'luminacam-standalone-notes-v1';
    const STORE_STRATEGIES = 'luminacam-standalone-strategies-v1';
    const icons = { home:'⌂', capture:'◎', notes:'▤', map:'⌁', strategies:'✎', practice:'◌' };
    const labels = { home:'ホーム', capture:'撮る', notes:'ノート', map:'地図', strategies:'作戦', practice:'練習' };
    const lightData = {
      'face-dark': { label:'背景より、顔が暗く見える', short:'逆光傾向', sub:'明るい背景に、顔が沈んでいます', icon:'◐', action:'人物を背景から少し離し、顔を明るい方向へ向けてみましょう。', observe:'目元と頬が、背景に負けず見えやすくなったか。', next:'次は、顔を明るい側へもう少し寄せて比べる。' },
      'side-shadow': { label:'顔の片側だけが暗く見える', short:'横からの光', sub:'横からの光で、影がはっきりしています', icon:'◑', action:'人物の顔を、光の方向へ少しだけ向けてみましょう。', observe:'暗い側の頬がやわらいだか。', next:'次は、背景との距離も一歩だけ広げて比べる。' },
      'face-bright': { label:'顔は明るく見えている', short:'やわらかい光', sub:'今の光を、そのまま活かせそうです', icon:'✦', action:'人物と背景の距離を、一歩だけ広げてみましょう。', observe:'主役が背景から見つけやすくなったか。', next:'次は、光の向きはそのまま背景をさらに整理する。' }
    };
    const seedNotes = [
      {id:'seed-backlight',date:'8月13日',title:'夕方の逆光で人物を撮る',intent:'人物を自然に写す',light:'face-dark',lightLabel:'逆光傾向',action:'人物を背景から少し離した',outcome:'subtle',reflection:'背景の色は残った。顔は少し暗い。',next:'顔を明るい側へ少し向けて比べる。',image:'back',used:2,strategy:true},
      {id:'seed-window',date:'8月10日',title:'窓際のやわらかい人物',intent:'人物を自然に写す',light:'side-shadow',lightLabel:'横からの光',action:'顔を窓の方へ少し向けた',outcome:'clear',reflection:'影がやわらぎ、肌が自然に見えた。',next:'背景の距離も変えて、主役の見え方を比べる。',image:'window',used:1,strategy:true},
      {id:'seed-night',date:'8月04日',title:'室内で動きを待つ',intent:'動きを止める',light:'face-bright',lightLabel:'暗い場所',action:'明るい場所で、動きが止まる瞬間を待った',outcome:'clear',reflection:'止まる瞬間なら、手持ちでも表情が残った。',next:'次は、背景の光を入れる位置も探す。',used:0}
    ];
    const seedStrategies = [
      {id:'s-back',title:'夕方の逆光人物',tags:['屋外','逆光','人物','手持ち'],guard:['背景の空気感','肌の自然さ'],steps:['人物を背景から離す','顔を明るい側へ向ける','空の明るさを確認する'],allowance:'少しのノイズ',notes:3,light:'face-dark',image:'back'},
      {id:'s-window',title:'窓際のやわらかい人物',tags:['室内','窓光','人物'],guard:['やわらかな影','目元の明るさ'],steps:['顔を窓へ少し向ける','背景から一歩離す','暗い頬を確認する'],allowance:'少しの影',notes:2,light:'side-shadow',image:'window'}
    ];
    const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; } };
    let notes = read(STORE_NOTES, seedNotes);
    let strategies = read(STORE_STRATEGIES, seedStrategies);
    let tab = 'home', captureStep = 'intro', selectedLight = 'side-shadow', selectedOutcome = null, selectedNote = null, noteFilter = 'all', stream = null;
    const save = () => { localStorage.setItem(STORE_NOTES, JSON.stringify(notes)); localStorage.setItem(STORE_STRATEGIES, JSON.stringify(strategies)); };
    const escape = (s) => String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
    function stopCamera() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; const video = $('#live-video'); if (video) video.srcObject = null; }
    function setCameraMessage(message, tone='warning') {
      const error = $('#camera-error'), diagnostic = $('#camera-diagnostic');
      if (error) error.textContent = message;
      if (diagnostic) { diagnostic.textContent = message; diagnostic.dataset.tone = tone; }
    }
    function cameraEnvironment() {
      const isLocal = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
      return { secure: window.isSecureContext || isLocal, local: isLocal, hasApi: Boolean(navigator.mediaDevices?.getUserMedia) };
    }
    function cameraErrorMessage(error) {
      const environment = cameraEnvironment();
      if (!environment.secure) return 'このページは安全な接続として認識されていません。HTMLをダブルクリックで開かず、localhost または HTTPS で開いてください。';
      if (!environment.hasApi) return 'このブラウザはカメラ機能に対応していません。Chrome、Safari、Edge の最新版でお試しください。';
      if (error?.name === 'NotAllowedError' || error?.name === 'SecurityError') return 'カメラの利用が許可されていません。アドレスバーのサイト設定から「カメラ」を許可してから、もう一度お試しください。';
      if (error?.name === 'NotFoundError' || error?.name === 'OverconstrainedError') return '利用できるカメラが見つかりません。ほかのアプリでカメラを使っていないか、端末のカメラ設定をご確認ください。';
      if (error?.name === 'NotReadableError') return 'カメラが他のアプリに使用されています。会議アプリやカメラアプリを閉じて、もう一度お試しください。';
      return 'カメラの映像を表示できません。下の「利用条件」を確認するか、手動観察モードで続けられます。';
    }
    async function startCamera() {
      const status = $('#camera-status');
      const environment = cameraEnvironment();
      if (!environment.secure || !environment.hasApi) { setCameraMessage(cameraErrorMessage(), 'warning'); return; }
      if(status) status.textContent='● カメラを起動中…';
      try {
        stopCamera();
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        const video = $('#live-video'); video.srcObject = stream; await video.play();
        $('#camera-bg').classList.add('visible'); status.className='cam-status live'; status.innerHTML='<i></i>ライブ映像で観察中'; const toggle=$('#camera-toggle'); if(toggle) toggle.textContent='映像を止める'; setCameraMessage('ライブ映像を表示しています。顔と背景の明るさを見比べてください。', 'success');
      } catch(err) { setCameraMessage(cameraErrorMessage(err), 'warning'); if(status) status.textContent='● 手動観察モード'; stopCamera(); }
    }
    function navigate(next) { if(next !== 'capture') stopCamera(); tab = next; selectedNote = null; if(next === 'capture') captureStep='intro'; render(); }
    function navMarkup(mobile=false) { const ids = mobile ? ['home','capture','notes','map'] : ['home','capture','notes','map','strategies','practice']; return ids.map(id => `<button data-tab="${id}" class="${tab===id?'active':''}" aria-label="${labels[id]}"><span>${icons[id]}</span><span>${labels[id]}</span></button>`).join(''); }
    function renderNavigation() { $('#side-nav').innerHTML=navMarkup(false); $('#mobile-nav').innerHTML=navMarkup(true); }
    function panelHeader(kicker,title,extra='') { return `<div class="map-head"><div><div class="eyebrow">${kicker}</div><h1 class="page-title">${title}</h1></div>${extra}</div>`; }
    function homePage() { const last=notes[0]||seedNotes[0]; return `<div class="grid-home"><section class="panel hero note-rule fold"><span class="hero-light"></span><div class="eyebrow">FIELD NOTE 01</div><h1>今日の一枚から、<br>自分の光の見方を育てる。</h1><p class="copy">数値の前に、何を残したいかを決める。LuminaCamは、今の光で試せる一手をひとつだけ提案し、あなたの発見を次の撮影へ運びます。</p><div class="next-card"><div class="next-label">今からの観察</div><div class="next-body"><strong>人物を自然に写すために、光を30秒見る。</strong><button class="primary" data-action="start">始める　→</button></div></div></section><aside class="side-stack"><section class="card note-rule fold"><div class="map-head"><div><div class="kicker">EXPERIENCE MAP</div><h2>あなたの撮影の地図</h2></div><button class="text" data-tab="map">開く</button></div><div class="trail"><div><b>夕方 × 人物</b>　背景の色を残す</div><div><b>窓光 × 人物</b>　顔を光へ向ける</div><div><b>暗い場所 × 動き</b>　止まる瞬間を待つ</div></div><div class="taste"><div><i>☼</i>最近は、夕方の光 × 人物をよく選んでいます。</div><div><i>▯</i>「背景の空気感」を守る作戦が育っています。</div></div></section><section class="card image-card"><div class="image-copy"><div class="kicker">LAST DISCOVERY</div><h3>${escape(last.title)}</h3><p>${escape(last.next)}</p></div></section></aside></div>`; }
    function capturePage() {
      const d=lightData[selectedLight], step={intro:0,light:1,guide:2,review:3}[captureStep];
      let content='';
      if(captureStep==='intro') content=`<div class="eyebrow" style="margin-top:42px">INTENT FIRST</div><h1>人物を自然に写すために、今の光を30秒だけ見てみましょう。</h1><p class="copy">設定値はまだ要りません。顔と背景の関係を見て、最初に試せる一手を選びます。</p><span class="intent">✦　今回の狙い：人物を自然に写す</span><div class="action-row"><button class="primary" data-action="to-light">光を見てみる　→</button><button id="camera-toggle" class="secondary" data-action="camera">◎ カメラを映す</button><button class="text" data-action="to-light">今は撮る</button></div><p id="camera-error" class="error"></p>`;
      if(captureStep==='light') content=`<div class="eyebrow" style="margin-top:42px">LIGHT CHECK</div><h1>今、顔はどう見えますか？</h1><p class="copy">一番近いものを選んでください。どれか分からないときも、後で変えられます。</p><div class="light-grid">${Object.entries(lightData).map(([id,item])=>`<button class="light-card ${id===selectedLight?'selected':''}" data-light="${id}"><span class="icon-box">${item.icon}</span><strong>${item.label}</strong><span>${item.sub}</span></button>`).join('')}</div><div class="action-row"><button class="primary" data-action="to-guide">一つ試す　→</button><button class="text" data-action="unknown">どれか分からない</button></div>`;
      if(captureStep==='guide') content=`<span class="intent">✦　人物を自然に写す　•　${d.label}</span><h1>まず、ここだけ変えてみましょう。</h1><div class="guide"><span class="number">01</span><p>${d.action}</p><div class="observe"><b>見るところ：</b>${d.observe}</div></div><div class="action-row"><button class="primary" data-action="to-review">✓ 試した</button><button class="secondary" data-action="to-review">今は撮る</button><button class="text" data-action="to-light">別の見え方を選ぶ</button></div>`;
      if(captureStep==='review') content=`<div class="eyebrow" style="margin-top:42px">ONE FRAME REVIEW</div><h1>変化は見えましたか？</h1><p class="copy">正解を決める必要はありません。今の狙いにどれくらい近づいたかを選びます。</p><div class="review-options">${[['clear','顔が見えやすくなった','光と顔の関係が、少し整った。'],['subtle','少し変わった','次の一枚でもう少し比べたい。'],['hard','今回は難しかった','光の方向を見直してみたい。']].map(([id,title,body])=>`<button class="review ${selectedOutcome===id?'selected':''}" data-outcome="${id}"><i>◉</i><span><b>${title}</b><small>${body}</small></span></button>`).join('')}</div>${selectedOutcome?`<div class="discovery"><div class="kicker">TODAY'S DISCOVERY</div><p>${selectedOutcome==='clear'?'光の方へ少し向けると、顔の影がやわらいだ。':selectedOutcome==='subtle'?'光の向きを変えると、顔の見え方が少し変わった。':'今回は難しかった。次は、光の位置から見直してみる。'}</p></div>`:''}<div class="action-row"><button class="primary" data-action="save" ${selectedOutcome?'':'disabled style="opacity:.45"'}>▯ 発見を残す</button><button class="text" data-tab="home">今回は残さない</button></div>`;
      const environment = cameraEnvironment();
      const environmentLabel = !environment.secure ? '要対応：localhost または HTTPS で開く' : !environment.hasApi ? '要対応：対応ブラウザで開く' : '利用可能：カメラの許可を待機中';
      return `<div class="capture-layout"><section class="capture"><div id="camera-bg" class="camera-bg"><video id="live-video" autoplay playsinline muted></video><span class="camera-band"></span></div><div class="steps"><span>OBSERVATION / 0${step+1}</span><span class="dots">${[0,1,2,3].map(i=>`<i class="${i<=step?'active':''}"></i>`).join('')}</span></div><div id="camera-status" class="cam-status"><i></i>手動観察モード</div>${content}</section><aside class="aside"><section class="card note-rule fold"><div class="kicker">LIVE VIEW</div><h2>背景に映像を重ねる</h2><p>端末カメラを使うと、映像の上で顔と背景の明るさを見比べられます。</p><button class="text" style="margin-top:14px" data-action="camera">カメラを映す　→</button><div class="camera-diagnostic"><b>カメラの利用条件</b><span>${environmentLabel}</span><small>HTMLを直接開かず、localhost または HTTPS から開く必要があります。</small></div><div id="camera-diagnostic" class="camera-message" data-tone="neutral">手動観察モードでも、すべての記録機能を利用できます。</div></section><section class="card note-rule fold"><div class="kicker">NOW HOLDING</div><h2>撮影の意図</h2><span class="intent">✦　人物を自然に写す</span><p>設定値の前に、顔と背景の関係を見る。提案は一つだけです。</p></section><section class="card note-rule fold"><div class="kicker">LIGHT RELATION</div><div class="orbit"><span>☼</span></div><p>光の向きを正確に測る必要はありません。目で見える変化から始めます。</p></section></aside></div>`;
    }
    function notesPage() {
      if(selectedNote) return detailPage(selectedNote);
      const active=noteFilter==='all'?notes:notes.filter(n=>n.light===noteFilter);
      return `<div class="grid-page"><section>${panelHeader('FIELD ARCHIVE','撮影ノート','<button class="secondary" data-tab="capture">＋ 新しい観察</button>')}<div class="filters">${[['all','すべて'],['face-dark','逆光傾向'],['side-shadow','横からの光'],['face-bright','やわらかい光']].map(([id,label])=>`<button class="filter ${noteFilter===id?'active':''}" data-filter="${id}">${label}</button>`).join('')}</div><div class="notes">${active.map(n=>`<button class="note-row" data-note="${n.id}"><span class="thumb ${n.image==='back'?'back':n.image==='window'?'window':''}"></span><span><span class="meta">${n.date} ・ ${n.lightLabel}</span><h3>${escape(n.title)}</h3><p>${escape(n.reflection)}</p></span><b class="bookmark">${n.strategy?'▮':'⌑'}</b></button>`).join('')||'<div class="empty"><div><h3>まだこの光のノートはありません。</h3><p>次の観察から、最初のしおりを置きましょう。</p></div></div>'}</div></section><aside class="side-stack"><section class="card image-card"><div class="image-copy"><div class="kicker">YOUR LASTING TASTE</div><h3>やわらかな影を残す。</h3><p>窓際と夕方の光で、人物の自然さをよく守っています。</p></div></section><section class="card note-rule fold"><div class="kicker">NOTE / NOT SCORE</div><h2>写真を採点せず、次の一枚へ。</h2><p class="copy">ノートには、あなたが試したことと、次に試すことだけが残ります。</p></section></aside></div>`;
    }
    function detailPage(n){return `<section class="panel detail note-rule fold"><button class="back" data-action="back-notes">← 撮影ノートへ</button><h1>${escape(n.title)}</h1><div class="detail-meta">${n.date} ・ ${n.lightLabel} ・ 手持ち</div><div class="journal"><div class="entry"><span class="n">01</span><div><h3>✦　今回の狙い</h3><p>${escape(n.intent)}</p><small>次に大切：背景の空気感</small></div></div><div class="entry"><span class="n">02</span><div><h3>☼　そのときの条件</h3><p>${escape(n.lightLabel)}</p><small>顔と背景の明るさを見比べて選びました。</small></div></div><div class="entry"><span class="n">03</span><div><h3>⌁　あなたが試したこと</h3><p>${escape(n.action)}</p></div></div><div class="entry"><span class="n">04</span><div><h3>▯　振り返り</h3><p>${escape(n.reflection)}</p></div></div><div class="entry"><span class="n">05</span><div><h3>☀　次に試すこと</h3><p>${escape(n.next)}</p></div></div></div><div class="action-row"><button class="primary" data-action="reuse" data-light="${n.light}">◎ 似た場面で使う</button><button class="secondary" data-action="grow" data-note="${n.id}">＋ 作戦に育てる</button></div></section>`}
    function mapPage(){const rows=['柔らかい光','横からの光','逆光','暗い場所'],cols=['人物','雰囲気','動き','風景']; const active=[0,1,5,8,11,14], strat=[8,14]; return `<section class="panel map-panel note-rule fold">${panelHeader('EXPERIENCE MAP','あなたの撮影の地図','')}<p class="map-summary">今月、夕方の光で人物を撮る場面をよく選びました。これは成績表ではなく、これまで試してきた場面と、これから広げられる表現の地図です。</p><div class="map-wrap"><div class="map-grid"><div></div>${cols.map(c=>`<div class="axis">${c}</div>`).join('')}${rows.map((r,ri)=>`<div class="axis left">${r}</div>${cols.map((c,ci)=>{const i=ri*4+ci,is=active.includes(i),st=strat.includes(i),light=ri===2?'face-dark':ri===1?'side-shadow':'face-bright';return `<button class="map-cell ${is?'active':''} ${st?'strategy':''}" data-map-light="${light}"><b>${is?(st?'▮':'⌑'):'⌑'}</b><small>${is?(st?'自分の作戦あり':i===0||i===5?'2つの試行':'1つの発見'):'まだ試していない'}</small></button>`}).join('')}`).join('')}</div></div><div class="legend"><span><i></i>まだ試していない</span><span><i class="a"></i>試した</span><span><i class="s"></i>作戦あり</span></div><div class="insight"><div><div class="kicker">RECENT TASTE</div><h3>背景の空気感を残す選択が、多めです。</h3><p>逆光で人物を撮る場面では、顔を整えながら夕方の色を残す作戦を試しています。</p></div><button class="secondary" data-tab="strategies">作戦を見る　›</button></div></section>`}
    function strategiesPage(){return `<section class="panel strategy-panel note-rule fold">${panelHeader('PERSONAL RECIPES','自分の作戦','<button class="secondary" data-tab="notes">▯ ノートを見る</button>')}<p class="map-summary">何を守り、どんな順番で試すか。ノートから育った、あなた自身の撮影レシピです。</p><div class="strategies">${strategies.map(s=>`<article class="strategy"><div class="strategy-img ${s.image==='window'?'window':''}"></div><div class="kicker">${s.notes}つのノートから育ちました</div><h3>${escape(s.title)}</h3><div class="tags">${s.tags.map(t=>`<span>${escape(t)}</span>`).join('')}</div><p><b style="color:#dbe6ff">守るもの：</b>${s.guard.join('・')}</p><footer><span>⌑ ${escape(s.steps[0])}</span><button class="text" data-action="strategy-use" data-light="${s.light}">使う　→</button></footer></article>`).join('')}</div></section>`}
    function practicePage(){const data=[['☼','光を一周見る','同じ人物を、窓に向いた位置と横に立った位置で見比べる。','side-shadow'],['⌁','背景を一歩離す','人物と背景の距離を一歩だけ変え、主役の見え方を観察する。','face-bright'],['⚡','逆光の輪郭を探す','背景から少し離れて、髪や肩の輪郭が見える場所を探す。','face-dark']];return `<section class="panel practice-panel note-rule fold"><div class="eyebrow">60 SECOND PRACTICE</div><h1 class="page-title">光を見る、小さな練習。</h1><p class="map-summary">写真を増やすためではなく、次に出会う光を少しだけ見つけやすくするための短い課題です。</p><div class="practice">${data.map(([i,t,p,l])=>`<article><div class="round">${i}</div><h3>${t}</h3><p>${p}</p><button class="text" data-action="practice" data-light="${l}">この練習を始める　→</button></article>`).join('')}</div></section>`}
    function render(){renderNavigation(); app.innerHTML=tab==='home'?homePage():tab==='capture'?capturePage():tab==='notes'?notesPage():tab==='map'?mapPage():tab==='strategies'?strategiesPage():practicePage(); bindButtons();}
    function handleButton(button) {
      if (button.disabled) return;
      if (button.dataset.tab) { navigate(button.dataset.tab); return; }
      if (button.dataset.action === 'start') { tab='capture'; captureStep='light'; render(); return; }
      if (button.dataset.action === 'to-light') { captureStep='light'; render(); return; }
      if (button.dataset.light) { selectedLight=button.dataset.light; render(); return; }
      if (button.dataset.action === 'to-guide') { captureStep='guide'; render(); return; }
      if (button.dataset.action === 'unknown') { selectedLight='side-shadow'; captureStep='guide'; render(); return; }
      if (button.dataset.action === 'to-review') { captureStep='review'; render(); return; }
      if (button.dataset.outcome) { selectedOutcome=button.dataset.outcome; render(); return; }
      if (button.dataset.action === 'camera') { stream ? stopAndRender() : startCamera(); return; }
      if (button.dataset.filter) { noteFilter=button.dataset.filter; render(); return; }
      if (button.dataset.note) { selectedNote=notes.find(n=>n.id===button.dataset.note); render(); return; }
      if (button.dataset.action === 'back-notes') { selectedNote=null; render(); return; }
      if (button.dataset.mapLight) { noteFilter=button.dataset.mapLight; tab='notes'; render(); return; }
      if (button.dataset.action === 'reuse' || button.dataset.action === 'strategy-use' || button.dataset.action === 'practice') { selectedLight=button.dataset.light; captureStep='guide'; tab='capture'; render(); return; }
      if (button.dataset.action === 'grow') { growStrategy(button.dataset.note); return; }
      if (button.dataset.action === 'save') { saveDiscovery(); }
    }
    function bindButtons() { document.querySelectorAll('button').forEach((button) => { button.onclick = () => handleButton(button); }); }
    function stopAndRender(){stopCamera();render()}
    function saveDiscovery(){ if(!selectedOutcome)return; const d=lightData[selectedLight], state={clear:'変化が見えた。顔の見え方が、背景との関係で変わった。',subtle:'少し変わった。次は同じ一手をもう少し大きく試したい。',hard:'今回は難しかった。光の方向を見直して、別の位置でも試したい。'}[selectedOutcome]; const date=new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric'}).format(new Date()); notes.unshift({id:'note-'+Date.now(),date,title:selectedLight==='face-dark'?'背景の明るい人物を撮る':selectedLight==='side-shadow'?'横からの光で人物を撮る':'やわらかい光で人物を撮る',intent:'人物を自然に写す',light:selectedLight,lightLabel:d.short,action:d.action.replace('みましょう。',''),outcome:selectedOutcome,reflection:state,next:d.next,image:selectedLight==='face-dark'?'back':selectedLight==='side-shadow'?'window':null,used:0}); save(); stopCamera(); selectedNote=notes[0]; tab='notes'; captureStep='intro'; selectedOutcome=null; render(); }
    function growStrategy(id){const n=notes.find(x=>x.id===id);if(!n)return;const exists=strategies.find(s=>s.light===n.light);if(exists){selectedLight=exists.light;captureStep='guide';tab='capture';render();return}strategies.unshift({id:'strategy-'+Date.now(),title:n.light==='face-dark'?'私の逆光人物':n.light==='side-shadow'?'私の窓際人物':'私のやわらかい光',tags:['人物',n.lightLabel,'手持ち'],guard:['顔の自然さ','背景の空気感'],steps:[n.action,'目元と頬を確認する',n.next],allowance:'少しの影',notes:1,light:n.light,image:n.image||'window'});save();tab='strategies';selectedNote=null;render()}
    window.addEventListener('beforeunload',stopCamera);
    render();
  </script>
</body>
</html>
