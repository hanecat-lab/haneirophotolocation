function cleanSavedLink(value,maps=false){
 let raw=String(value||'').trim();if(!raw||raw.length>4096)throw Error(maps?'Googleマップのリンクを貼ってください':'投稿のリンクを貼ってください');
 if(/^(?:www\.)?(?:instagram\.com|maps\.app\.goo\.gl|goo\.gl|g\.page|g\.co|(?:maps\.|www\.)?google\.(?:com|co\.jp))\//i.test(raw))raw='https://'+raw;
 let u;try{u=new URL(raw)}catch{throw Error('https://から始まるリンクを貼ってください')}
 if(!['https:','http:'].includes(u.protocol)||u.username||u.password||!u.hostname.includes('.'))throw Error('開けるWebページのリンクを貼ってください');
 if(u.protocol==='http:')u.protocol='https:';if(u.href.length>4096)throw Error('リンクが長すぎます。共有から短いリンクをコピーしてください');
 if(maps){const h=u.hostname.toLowerCase(),path=u.pathname;const ok=h==='maps.app.goo.gl'&&path.length>1||h==='goo.gl'&&/^\/maps\//.test(path)||h==='g.page'&&path.length>1||h==='g.co'&&/^\/(?:kgs|maps)\//.test(path)||['maps.google.com','maps.google.co.jp'].includes(h)||['google.com','www.google.com','google.co.jp','www.google.co.jp'].includes(h)&&/^\/maps(?:\/|$)/.test(path);if(!ok||u.port)throw Error('Googleマップの「共有」でコピーしたリンクを貼ってください')}
 return u.href;
}
function savedLinkKey(value){const u=new URL(value);u.hash='';u.hostname=u.hostname.replace(/^www\./,'');if(u.hostname==='instagram.com'){u.search='';u.pathname=u.pathname.replace(/\/$/,'')}else for(const key of [...u.searchParams.keys()])if(/^utm_|^(?:igsh|igshid)$/.test(key))u.searchParams.delete(key);return u.href}

function commitLiving(next){if(storageProblem)throw Error('保存が停止しています。記録を書き出してから再読み込みしてください');try{localStorage.setItem(KEY,JSON.stringify(next))}catch{throw Error('記録を保存できませんでした。保存容量を確認してください')}state=next}
function leafDays(){return new Set(state.checks.filter(c=>validDate(c.date)&&c.date<=today()).map(c=>c.date)).size}
function leafGrowth(){return 1+Math.min(8,leafDays())*.01}
function plantView(){const days=leafDays(),leaves=['M35 64C12 63 7 45 7 45c27-3 32 9 28 19Z','M40 48C11 43 15 23 15 23c25-1 28 11 25 25Z','M45 59c12-24 32-17 32-17-3 23-15 24-32 17Z','M51 35C51 8 74 9 74 9c4 18-5 27-23 26Z'];return `<div class="session-garden" role="img" aria-label="確認した${days}日分の植物。日を重ねると少しずつ育ちます"><svg class="session-deco" style="--leaf-growth:${leafGrowth()}" viewBox="0 0 90 94" aria-hidden="true"><path class="plant-stem" d="M30 78c2-25 9-43 33-65"/>${leaves.map((d,i)=>`<path class="plant-leaf ${days>=[1,3,5,7][i]?'grown':''}" d="${d}"/>`).join('')}<path class="plant-pot" d="M19 78h31l-4 12H23Z"/><path d="M17 78h35"/></svg><span class="plant-caption">${days?`${days}日の接点`:'小さな芽'}</span></div>`}

function nextVisit(p){const d=dueDate(p),waiting=validDate(d)&&d>today()&&!p.paused;return `<p class="next-visit ${waiting?'is-waiting':''}" data-next-date="${esc(d)}"><span>${p.paused?'今はお休み中':waiting?`次は${dateLabel(d)}ごろに。`:'そろそろ見る頃。'}</span>${waiting?'<span class="visit-orbit" aria-hidden="true"><i></i></span>':''}</p>`}
function lightHaptic(){if(!motionEnabled()||typeof navigator.vibrate!=='function')return;try{navigator.vibrate(10)}catch{}}
function livingSquish(el){if(!el||!motionEnabled())return;const frames=[];for(let i=0;i<=40;i++){const t=i/40*.52;let scale;if(t<.065)scale=1-.05*(1-Math.pow(1-t/.065,3));else{const u=t-.065,w=Math.sqrt(350-225);scale=1+Math.exp(-15*u)*(-.05*Math.cos(w*u)+(2.15-.75)/w*Math.sin(w*u))}frames.push({transform:`scale(${i===40?1:scale})`,offset:i/40})}return animate(el,state.settings.motion==='gentle'?[{opacity:.82},{opacity:1}]:frames,{duration:state.settings.motion==='gentle'?140:520})}
function livingRipple(el,point=lastEffectPoint){if(!el||!motionEnabled())return;const r=el.getBoundingClientRect(),dot=document.createElement('span');dot.className='living-ripple';dot.setAttribute('aria-hidden','true');dot.style.left=Math.max(4,Math.min(r.width-4,(point?.x||r.left+r.width/2)-r.left))+'px';dot.style.top=Math.max(4,Math.min(r.height-4,(point?.y||r.top+r.height/2)-r.top))+'px';el.append(dot);const a=animate(dot,[{transform:'translate(-50%,-50%) scale(.15)',opacity:.6},{transform:'translate(-50%,-50%) scale(3.5)',opacity:0}],{duration:state.settings.motion==='gentle'?160:500});if(a)a.finished.catch(()=>{}).finally(()=>dot.remove());else dot.remove()}
function popLivingProgress(){const track=document.querySelector('.progress-track');if(!track||!motionEnabled())return;const r=track.getBoundingClientRect(),bubble=document.createElement('span');bubble.className='living-bubble';bubble.style.left=r.right+'px';bubble.style.top=(r.top+r.height/2)+'px';document.querySelector('#effects').append(bubble);const a=animate(bubble,[{transform:'translate(-50%,-50%) scale(.4)',opacity:.7},{transform:'translate(-50%,-50%) scale(1.15)',opacity:.8,offset:.55},{transform:'translate(-50%,-50%) scale(1.7)',opacity:0}],{duration:550});a?.finished.catch(()=>{}).finally(()=>bubble.remove());successEffect({x:r.right,y:r.top+r.height/2})}
function animateLivingSeen(id,from,celebrate,growthBefore=leafGrowth()){
 const target=[...document.querySelectorAll('.card-done[data-key],.person-card[data-key]')].find(el=>el.dataset.key===id);if(target){target.classList.add('is-confirming');livingSquish(target);setTimeout(()=>target.classList.remove('is-confirming'),750)}
 const detail=dialog.open?dialog.querySelector('.detail-actions [data-seen]'):null;if(detail){detail.classList.add('is-confirming');livingSquish(detail);setTimeout(()=>detail.classList.remove('is-confirming'),750)}
 const leaf=document.querySelector('.session-deco'),growth=leafGrowth();if(leaf&&growth>growthBefore&&motionEnabled()){const frames=springFrames(0,0,growthBefore/growth).map(f=>({transform:`scale(${Number(f.transform.match(/scale\(([^)]+)/)?.[1]||1)*growth})`,offset:f.offset}));animate(leaf,frames,{duration:600})}
 const fill=document.querySelector('.progress-fill');if(fill&&motionEnabled()){const to=parseFloat(fill.style.width)||0,frames=springFrames().map(f=>{const scale=Number(f.transform.match(/scale\(([^)]+)/)?.[1]||1),v=(scale-.97)/.03;return {width:Math.max(0,Math.min(100,from+(to-from)*v))+'%',offset:f.offset}});frames[0].width=from+'%';frames[frames.length-1].width=to+'%';const pour=animate(fill,frames,{duration:state.settings.motion==='gentle'?180:600});fill.classList.add('is-pouring');setTimeout(()=>fill.classList.remove('is-pouring'),800);if(celebrate&&pour)pour.finished.then(()=>{if(fill.isConnected)popLivingProgress()}).catch(()=>{})}
}
function livingCalendarSnapshot(){const rect=selector=>document.querySelector(selector)?.getBoundingClientRect();return {view:rect('.calendar-views .active'),day:rect('.calendar-cell.selected')}}
function livingGlide(el,old){if(!el||!old||!motionEnabled())return;const r=el.getBoundingClientRect();if(Math.abs(old.left-r.left)+Math.abs(old.top-r.top)<2)return;const host=el.parentElement,hr=host.getBoundingClientRect(),glass=document.createElement('span');glass.className='living-selection-glass';glass.setAttribute('aria-hidden','true');Object.assign(glass.style,{left:r.left-hr.left+'px',top:r.top-hr.top+'px',width:r.width+'px',height:r.height+'px',borderRadius:getComputedStyle(el).borderRadius});host.append(glass);el.classList.add('is-gliding');const a=animate(glass,springFrames(old.left-r.left,old.top-r.top,old.width/r.width),{duration:460});if(a)a.finished.catch(()=>{}).finally(()=>{glass.remove();el.classList.remove('is-gliding')});else{glass.remove();el.classList.remove('is-gliding')}}
function settleLivingCalendar(old,mode){if(!old||!motionEnabled())return;livingGlide(document.querySelector('.calendar-views .active'),old.view);if(mode==='calendar-select'){const day=document.querySelector('.calendar-cell.selected');livingGlide(day,old.day);livingRipple(day);const panel=document.querySelector('.calendar-selected-day');if(panel)animate(panel,[{transform:'perspective(800px) translateZ(-14px) scale(.985)',opacity:.6},{transform:'perspective(800px) translateZ(0) scale(1)',opacity:1}],{duration:260})}else if(mode==='calendar'||mode==='calendar-range'){const panel=document.querySelector('.calendar-month,.calendar-week,.calendar-agenda');if(panel)animate(panel,[{transform:'perspective(900px) translateZ(-18px) scale(.985)',opacity:.65},{transform:'perspective(900px) translateZ(0) scale(1)',opacity:1}],{duration:300})}}
let livingObserver=null;
function observeLiving(){if(typeof IntersectionObserver!=='function')return;if(!livingObserver)livingObserver=new IntersectionObserver(entries=>entries.forEach(e=>e.target.dataset.livingVisible=String(e.isIntersecting)),{rootMargin:'50px'});livingObserver.disconnect();document.querySelectorAll('.session,.calendar-views,.next-visit,.week-dot,.calendar-cell.is-today,.calendar-week-day.is-today').forEach(el=>livingObserver.observe(el))}
function meltInstagram(el){const fluid=el.querySelector('.instagram-fluid i');if(!fluid||!motionEnabled())return;const r=el.getBoundingClientRect();animate(fluid,[{transform:'scaleX(1)',borderRadius:'18px',opacity:.7},{transform:`scaleX(${Math.min(1,r.height/r.width)})`,borderRadius:'50%',opacity:1,offset:.4},{transform:'scaleX(1)',borderRadius:'18px',opacity:.7}],{duration:state.settings.motion==='gentle'?180:480})}
let livingMagnet=null,magnetFrame=0,magnetPoint=null;
function moveLivingMagnet(e){if(e.pointerType!=='mouse'||!matchMedia('(hover:hover) and (pointer:fine)').matches||!motionEnabled())return;magnetPoint={x:e.clientX,y:e.clientY};if(magnetFrame)return;magnetFrame=requestAnimationFrame(()=>{magnetFrame=0;const point=magnetPoint;let target=null,rect=null;for(const el of document.querySelectorAll('.open-instagram')){const r=el.getBoundingClientRect();if(r.width&&point.x>=r.left-18&&point.x<=r.right+18&&point.y>=r.top-18&&point.y<=r.bottom+18){target=el;rect=r;break}}if(livingMagnet&&livingMagnet!==target){livingMagnet.classList.remove('is-near');livingMagnet.style.removeProperty('--mag-x');livingMagnet.style.removeProperty('--mag-y')}livingMagnet=target;if(target){target.classList.add('is-near');target.style.setProperty('--mag-x',Math.max(-3,Math.min(3,(point.x-rect.left-rect.width/2)*.035))+'px');target.style.setProperty('--mag-y',Math.max(-2,Math.min(2,(point.y-rect.top-rect.height/2)*.04))+'px')}})}

function render(options={}){
 const old=options.animate?sceneSnapshot():[],oldCalendar=options.animate?.startsWith('calendar')?livingCalendarSnapshot():null,returnDraft=document.querySelector('#return-note')?.value,weeklyDraft=document.querySelector('#weekly-note')?.value;stopSceneAnimations();session();document.documentElement.dataset.theme=state.settings.theme;syncMotion();document.querySelector('meta[name="theme-color"]').content=state.settings.theme==='dark'?'#070c1b':'#e8ebf7';
 document.querySelector('#app').innerHTML=`<div class="shell"><aside class="sidebar">${brand()}<nav class="nav" aria-label="メイン">${navItems.map(([v,i,l])=>`<button data-view="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${icon(i)}${l}</button>`).join('')}</nav><div class="side-note"><span class="flower">✳</span>好きな人の今を、<br>自分のペースで。</div><footer><span>ver.${VERSION}</span><span>YOUR PACE.</span></footer></aside><main class="main"><header class="topbar">${brand()}<div class="date-tag">${icon('calendar')}${new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(new Date())}</div><span class="eyebrow add-desktop">A LITTLE CLOSER.</span></header><div class="page-body">${view==='people'?peopleView():view==='notes'?notesView():view==='settings'?settingsView():todayView()}</div></main></div><nav class="bottom-nav" aria-label="メイン">${navItems.map(([v,i,l])=>`<button data-view="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${icon(i)}${l}</button>`).join('')}</nav>`;
 if(returnDraft!==undefined&&document.querySelector('#return-note'))document.querySelector('#return-note').value=returnDraft;if(weeklyDraft!==undefined&&document.querySelector('#weekly-note'))document.querySelector('#weekly-note').value=weeklyDraft;save();settleScene(old,options.animate);settleLivingCalendar(oldCalendar,options.animate);observeLiving();if(options.pill){const b=[...document.querySelectorAll('.liquid-pill')].find(el=>el.dataset.filter===options.pill);if(b){b.classList.add('is-activated');if(motionEnabled())animate(b,springFrames(0,2,.97));b.focus({preventScroll:true})}}
