if('seen'in d)return markSeen(d.seen);if('later'in d)return later(d.later);if('returnSeen'in d)return markSeen(d.returnSeen,document.querySelector('#return-note')?.value||'');if('returnLater'in d)return later(d.returnLater);if('pendingClear'in d){state.pending=null;render();return}
if('photoPick'in d){document.querySelector('#person-photo')?.click();return}if('photoRemove'in d){photoToken++;photoLoading=false;photoDraft='';photoYDraft=50;refreshPhotoEditor();const b=document.querySelector('#person-form button[type=submit]');if(b)b.disabled=false;document.querySelector('#photo-status').textContent='写真を外しました。保存すると反映されます。';return}
if('categoryFilter'in d){categoryFilter=d.categoryFilter;render({animate:'filter'});const b=[...document.querySelectorAll('[data-category-filter]')].find(el=>el.dataset.categoryFilter===categoryFilter);b?.focus({preventScroll:true});return}
if('filter'in d){filter=d.filter;const r=b.getBoundingClientRect();render({animate:'filter',pill:filter});pulseMesh(priorityColors[filter],{x:r.left+r.width/2,y:r.top+r.height/2});return}if('noteAdd'in d)return noteForm();if('note'in d)return noteForm(d.note);if('taskAdd'in d)return taskForm();if('taskPerson'in d)return taskForm(d.taskPerson);if('taskEdit'in d)return taskForm('',d.taskEdit);
if('complete'in d){const a=state.actions.find(a=>a.id===d.complete);if(!a)return;state.actions=state.actions.filter(x=>x.id!==a.id);state.archivedActions.push({...a,status:'archived',completedAt:today()});render();if(dialog.open&&modalPerson)showDetail(modalPerson);successEffect();toast('予定を完了しました');return}
if('taskDelete'in d){if(!confirm('この予定を削除しますか？'))return;state.actions=state.actions.filter(a=>a.id!==d.taskDelete);closeDialog();render();toast('予定を削除しました');return}
if('logDelete'in d){if(!confirm('このメモを削除しますか？'))return;const id=modalPerson;state.logs=state.logs.filter(l=>l.id!==d.logDelete);render();showDetail(id);return}
if('delete'in d){const p=person(d.delete);if(!p||!confirm(`${p.name}さんと、この人のメモ・予定・確認履歴を削除しますか？`))return;const related=new Set([...state.actions,...state.archivedActions].filter(a=>a.personId===d.delete).map(a=>a.id));state.people=state.people.filter(p=>p.id!==d.delete);for(const k of ['logs','actions','archivedActions','checks','inbox'])state[k]=state[k].filter(x=>x.personId!==d.delete);state.themes=state.themes.map(t=>({...t,personIds:(t.personIds||[]).filter(id=>id!==d.delete),actionIds:(t.actionIds||[]).filter(id=>!related.has(id))}));if(state.pending?.personId===d.delete)state.pending=null;closeDialog();render();toast('人物と関連記録を削除しました');return}
if('undo'in d){const id=d.undo,checks=state.checks.filter(c=>c.personId===id),last=checks.at(-1),p=person(id);if(!last||!p||!confirm('最後の「見た」を取り消しますか？ひとことメモは残ります。'))return;state.checks=state.checks.filter(c=>c.id!==last.id);const previous=state.checks.filter(c=>c.personId===id).at(-1);p.lastChecked=previous?.date||last.previousLast||'';const s=state.days[last.date];if(s)s.done=s.done.filter(x=>x!==id);render();showDetail(id);toast('最後の確認を取り消しました');return}
if('export'in d){exportData();toast('JSONを書き出しました');return}if('import'in d){document.querySelector('#import-file').click();return}if('migrationDismiss'in d){state.legacyImported=false;render();return}
});
document.addEventListener('submit',e=>{const f=e.target,fid=f.getAttribute('id');if(!['person-form','note-form','task-form','settings-form','weekly-form'].includes(fid))return;e.preventDefault();const fd=new FormData(f);
try{if(fid==='person-form'){const id=String(fd.get('id')||''),name=String(fd.get('name')||'').trim(),instagram=cleanAccount(fd.get('instagram')),xHandle=cleanAccount(fd.get('xHandle'),'x');if(!name)throw Error('名前・呼び名を入れてください');if(!instagram&&!xHandle)throw Error('InstagramまたはXをひとつ登録してください');const duplicate=state.people.find(p=>p.id!==id&&instagram&&p.instagram.toLowerCase()===instagram.toLowerCase());if(duplicate)throw Error(`このInstagramは「${duplicate.name}」さんとして登録済みです`);if(photoLoading)throw Error('写真の準備が終わるまでお待ちください');const p=person(id),pr=String(fd.get('priority')),values={name,instagram,xHandle,category:String(fd.get('category')),photo:photoDraft,photoY:photoYDraft,priority:pr,interval:Number(fd.get('interval')),interest:String(fd.get('interest')||'').trim(),role:String(fd.get('role')||'').trim(),note:String(fd.get('note')||'').trim(),paused:fd.get('paused')==='on'};persistPerson(values,id);closeDialog();render();toast(p?'この人のペースを更新しました':'リストに追加しました。今日から見にいけます。');return}
if(fid==='note-form'){const id=String(fd.get('personId')),text=String(fd.get('note')||'').trim(),date=String(fd.get('date'));if(!text||!person(id)||!validDate(date))throw Error('人物・日付・メモを確認してください');addMemo(id,text,date,String(fd.get('kind')));closeDialog();render();successEffect();toast('しおりを残しました');return}
if(fid==='task-form'){const id=String(fd.get('id')||''),personId=String(fd.get('personId')),date=String(fd.get('date')),title=String(fd.get('title')||'').trim();if(!title||!person(personId)||!validDate(date))throw Error('人物・予定・日付を確認してください');const a=state.actions.find(a=>a.id===id),data={personId,title,date,eventKind:String(fd.get('eventKind')),reason:String(fd.get('reason')||'').trim()};if(a)Object.assign(a,data);else state.actions.push({id:uid('a'),...data,status:'scheduled',category:'確認',createdAt:new Date().toISOString()});closeDialog();render();successEffect();toast('次のきっかけを置きました');return}
if(fid==='settings-form'){state.settings.limit=Number(fd.get('limit'));state.settings.theme=String(fd.get('theme'));state.settings.motion=String(fd.get('motion')||'full');state.settings.cue=String(fd.get('cue')||'').trim()||'Instagramを開く前に、ひとめを開く';render();toast('自分のペースに整えました');return}
if(fid==='weekly-form'){const text=String(fd.get('note')||'').trim();if(!text)throw Error('残したいことをひとこと入れてください');state.weeklyNotes[weekId()]={text,updatedAt:today()};render();toast('今週のしおりを残しました');return}}catch(err){toast(err.message)}
});
document.addEventListener('change',e=>{if(e.target.matches('input[name=priority]')){document.querySelector('#interval').value=String(intervalDefaults[e.target.value])}if(e.target.id==='person-photo'){loadPhoto(e.target.files[0]);e.target.value='';return}if(e.target.id==='people-sort'){sortMode=e.target.value;render({animate:'filter'});document.querySelector('#people-sort')?.focus({preventScroll:true});return}if(e.target.id==='log-filter'){logFilter=e.target.value;render()}});
let searchComposing=false;function updateSearch(input){query=input.value;const selection=input.selectionStart;render();const next=document.querySelector('#search');if(next){next.focus();next.setSelectionRange(selection,selection)}}
document.addEventListener('compositionstart',e=>{if(e.target.id==='search')searchComposing=true});document.addEventListener('compositionend',e=>{if(e.target.id==='search'){searchComposing=false;updateSearch(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='photo-y'){photoYDraft=Number(e.target.value);document.querySelector('#photo-preview')?.style.setProperty('--photo-y',photoYDraft+'%');return}if(e.target.id==='search'&&!searchComposing&&!e.isComposing)updateSearch(e.target)});
document.querySelector('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>20*1024*1024)throw Error('20MB以下のバックアップJSONを選んでください');const data=JSON.parse(await file.text()),raw=['hitome-backup','social-orbit-backup'].includes(data.format)?data.data:data,imported=normalise(raw);if(!confirm(`${imported.people.length}人の記録を読み込み、現在の記録を置き換えます。現在の記録は先にJSONで書き出します。よろしいですか？`))return;exportData('hitome-before-import');state=imported;state.legacyImported=data.format==='social-orbit-backup'||raw.version!==3;storageProblem='';document.querySelector('#storage-error').classList.add('hide');view='today';filter='high';categoryFilter='all';query='';logFilter='all';closeDialog();render();toast('記録を引き継ぎました')}catch(err){toast(err instanceof SyntaxError?'JSONの内容を読み込めませんでした。元のバックアップを選んでください':err.message)}});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
dialog.addEventListener('cancel',()=>{photoToken++;photoLoading=false;modalPerson='';});
function resume(){syncMotion();if(document.visibilityState==='hidden')return;if(dayKey!==today()){dayKey=today();render()}else if(state.pending){render()}}
window.addEventListener('focus',resume);document.addEventListener('visibilitychange',resume);window.addEventListener('pageshow',resume);setInterval(()=>{if(document.visibilityState!=='hidden'&&dayKey!==today()){dayKey=today();render()}},30000);
window.addEventListener('storage',e=>{if(e.key===KEY){storageProblem='別のタブで記録が変更されました。上書きを防ぐため保存を停止しています。このページを再読み込みしてください。';showStorageError();toast('別のタブで変更されました。再読み込みしてください。')}});
let pressed=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('button,a.button');if(!el||el.disabled||e.button>0)return;const r=el.getBoundingClientRect();lastEffectPoint={x:e.clientX||r.left+r.width/2,y:e.clientY||r.top+r.height/2};if(!motionEnabled())return;pressed=el;el.style.setProperty('--press-scale','.97');if(el.matches('.liquid-pill,.button.primary')){const color=el.matches('.liquid-pill')?priorityColors[el.dataset.filter]:'#b381ff';pulseMesh(color,lastEffectPoint)}});
function releasePress(){if(!pressed)return;const el=pressed;pressed=null;el.style.removeProperty('--press-scale');if(el.isConnected&&motionEnabled()&&!el.matches('.liquid-pill'))animate(el,springFrames(0,0,.97),{duration:380})}
document.addEventListener('pointerup',releasePress);document.addEventListener('pointercancel',releasePress);
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||!matchMedia('(hover:hover) and (pointer:fine)').matches||!motionEnabled())return;const el=e.target.closest('.liquid-pill,.button.primary');if(!el)return;const r=el.getBoundingClientRect();el.style.setProperty('--mag-x',Math.max(-3,Math.min(3,(e.clientX-r.left-r.width/2)*.04))+'px');el.style.setProperty('--mag-y',Math.max(-2,Math.min(2,(e.clientY-r.top-r.height/2)*.055))+'px')});
document.addEventListener('pointerout',e=>{const el=e.target.closest('.liquid-pill,.button.primary');if(el&&!el.contains(e.relatedTarget)){el.style.removeProperty('--mag-x');el.style.removeProperty('--mag-y')}});

reducedMotion.addEventListener?.('change',syncMotion);
if(storageProblem)showStorageError();render();
})();
