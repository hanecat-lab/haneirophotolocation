<script type="module">
import * as THREE from 'three';
// V36ベース + 高品質を維持した軽量化
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(); scene.background=new THREE.Color('#a9d6e8'); scene.fog=new THREE.Fog('#cfeaf3', 120, 520);
const camera=new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 800);
let camTarget=new THREE.Vector3(), camPos=new THREE.Vector3(), camLook=new THREE.Vector3();
scene.add(new THREE.AmbientLight(0xffffff,0.88));
const sun=new THREE.DirectionalLight(0xfff6e0,1.15); sun.position.set(30,55,20); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias=-0.0005; scene.add(sun);

const TRACKS={
  usui:{
    name:'碓氷峠', sub:'登り 9連 0→48m', corners:['START','C1 右','C2 左','C3 右','C4 左','C5 右','C6 左','C7 右','C8 左','C9 右','GOAL'],
    points:[
      new THREE.Vector3(0,0,-60), new THREE.Vector3(0,0,-30), new THREE.Vector3(0,1,0), new THREE.Vector3(0,1,20),
      new THREE.Vector3(12,2,38), new THREE.Vector3(26,3,52), new THREE.Vector3(32,4,68), new THREE.Vector3(24,5,84), new THREE.Vector3(8,6,94), new THREE.Vector3(0,6,100),
      new THREE.Vector3(-12,7,118), new THREE.Vector3(-26,8,132), new THREE.Vector3(-32,9,150), new THREE.Vector3(-24,10,168), new THREE.Vector3(-8,11,178), new THREE.Vector3(0,11,185),
      new THREE.Vector3(12,12,203), new THREE.Vector3(26,13,217), new THREE.Vector3(32,14,235), new THREE.Vector3(24,15,253), new THREE.Vector3(8,16,263), new THREE.Vector3(0,16,270),
      new THREE.Vector3(-14,17,288), new THREE.Vector3(-28,18,302), new THREE.Vector3(-34,19,320), new THREE.Vector3(-26,20,338), new THREE.Vector3(-10,21,348), new THREE.Vector3(0,21,355),
      new THREE.Vector3(14,22,373), new THREE.Vector3(28,23,387), new THREE.Vector3(34,24,405), new THREE.Vector3(26,25,423), new THREE.Vector3(10,26,433), new THREE.Vector3(0,26,440),
      new THREE.Vector3(-14,27,458), new THREE.Vector3(-28,28,472), new THREE.Vector3(-34,29,490), new THREE.Vector3(-26,30,508), new THREE.Vector3(-10,31,518), new THREE.Vector3(0,31,525),
      new THREE.Vector3(16,32,543), new THREE.Vector3(32,33,557), new THREE.Vector3(38,34,575), new THREE.Vector3(30,35,593), new THREE.Vector3(12,36,603), new THREE.Vector3(0,36,610),
      new THREE.Vector3(-16,37,628), new THREE.Vector3(-32,38,642), new THREE.Vector3(-38,39,660), new THREE.Vector3(-30,40,678), new THREE.Vector3(-12,41,688), new THREE.Vector3(0,41,695),
      new THREE.Vector3(16,42,713), new THREE.Vector3(32,43,727), new THREE.Vector3(38,44,745), new THREE.Vector3(30,45,763), new THREE.Vector3(12,46,773), new THREE.Vector3(0,46,780),
      new THREE.Vector3(0,47,810), new THREE.Vector3(0,48,850), new THREE.Vector3(0,48,880),
    ]
  },
  haruna:{
    name:'榛名山', sub:'下り 5連+大バンク 48→0m', corners:['START','C1 右','C2 左','C3 右','C4 左','C5 右','BIG BANK','GOAL'],
    points:[
      new THREE.Vector3(0,48,-60), new THREE.Vector3(0,46,-15), new THREE.Vector3(0,44,15), new THREE.Vector3(2,42,45),
      new THREE.Vector3(18,40,78), new THREE.Vector3(34,37,106), new THREE.Vector3(30,34,136), new THREE.Vector3(8,31,160), new THREE.Vector3(0,29,182),
      new THREE.Vector3(-16,26,210), new THREE.Vector3(-34,23,238), new THREE.Vector3(-30,20,268), new THREE.Vector3(-8,17,290), new THREE.Vector3(0,15,312),
      new THREE.Vector3(18,13,340), new THREE.Vector3(36,10,368), new THREE.Vector3(32,8,398), new THREE.Vector3(8,5,420), new THREE.Vector3(0,4,442),
      new THREE.Vector3(-18,3,470), new THREE.Vector3(-36,2,498), new THREE.Vector3(-32,1,528), new THREE.Vector3(-8,0.5,550), new THREE.Vector3(0,0.3,572),
      new THREE.Vector3(20,0.2,600), new THREE.Vector3(38,0.1,628), new THREE.Vector3(34,0,658), new THREE.Vector3(8,0,680), new THREE.Vector3(0,0,702),
      new THREE.Vector3(-22,0,740), new THREE.Vector3(-58,0,785), new THREE.Vector3(-92,0,835), new THREE.Vector3(-100,0,890), new THREE.Vector3(-68,0,940), new THREE.Vector3(-18,0,975), new THREE.Vector3(0,0,1010), new THREE.Vector3(0,0,1080),
    ]
  }
};

let currentKey='haruna';
let curve, totalLength=0;
const SEGMENTS=640; const ROAD_HALF=3.8; const ROAD_Y=0.02; const GROUND_Y=-0.8; const WALL_OFFSET=0.7;
function getTrackAt(u){
  if(!curve){
    // curveがまだ生成されていない初期フレーム対策
    return {p:new THREE.Vector3(0,0,0), t:new THREE.Vector3(0,0,1), n:new THREE.Vector3(1,0,0)};
  }
  u=THREE.MathUtils.clamp(u,0,1);
  const p=curve.getPointAt(u);
  const t=curve.getTangentAt(u).normalize();
  const n=new THREE.Vector3(-t.z,0,t.x).normalize();
  return {p,t,n};
}
function getTrackAtDist(s){
  if(!curve || !totalLength) return getTrackAt(0);
  return getTrackAt(THREE.MathUtils.clamp(s/totalLength,0,1));
}

// 高品質を維持しつつ軽量化: 1024pxテクスチャ + repeat 2,8 + anisotropy 16 を維持
function makeAsphaltHQ(){
  const c=document.createElement('canvas'); c.width=1024; c.height=1024; const ctx=c.getContext('2d');
  ctx.fillStyle='#7d838b'; ctx.fillRect(0,0,1024,1024);
  // ノイズは多すぎず少なすぎず - V36の900+600を3倍に、6000粒のギラつきは抑える
  for(let i=0;i<2800;i++){ 
    const x=Math.random()*1024, y=Math.random()*1024, s=Math.random()*1.4+0.3;
    ctx.fillStyle=`rgba(255,250,238,${Math.random()*0.06})`; 
    ctx.fillRect(x,y,s,s); 
  }
  for(let i=0;i<1800;i++){ 
    const x=Math.random()*1024, y=Math.random()*1024;
    ctx.fillStyle=`rgba(35,38,44,${Math.random()*0.05})`; 
    ctx.fillRect(x,y,1,1); 
  }
  const tex=new THREE.CanvasTexture(c); 
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; 
  tex.repeat.set(2,8); // 2,8を維持
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy(); // 16を維持
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.minFilter=THREE.LinearMipmapLinearFilter;
  tex.magFilter=THREE.LinearFilter;
  tex.generateMipmaps=true;
  return tex;
}
const asphaltTex=makeAsphaltHQ();

function buildRoad(){
  const verts=[], uvs=[], indices=[];
  for(let i=0;i<=SEGMENTS;i++){
    const u=i/SEGMENTS; const {p,n}=getTrackAt(u); const y=p.y+ROAD_Y;
    verts.push(p.x+n.x*ROAD_HALF, y, p.z+n.z*ROAD_HALF);
    verts.push(p.x-n.x*ROAD_HALF, y, p.z-n.z*ROAD_HALF);
    const v=i/SEGMENTS*(totalLength/5); uvs.push(0,v,1,v);
  }
  for(let i=0;i<SEGMENTS;i++){ const a=i*2,b=a+1,c=a+2,d=a+3; indices.push(a,b,c,b,d,c); }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2)); geo.setIndex(indices); geo.computeVertexNormals(); return geo;
}
let roadMesh, ground, gateGroup, trees=[];
function clearTrack(){
  if(roadMesh) { scene.remove(roadMesh); roadMesh.geometry.dispose(); }
  if(ground) { scene.remove(ground); }
  if(gateGroup) { scene.remove(gateGroup); }
  trees.forEach(g=>scene.remove(g)); trees=[];
  scene.children.filter(o=>o.userData.isWall).forEach(o=>{ scene.remove(o); o.geometry.dispose(); });
}
function rebuildTrack(key){
  currentKey=key;
  const def=TRACKS[key];
  curve=new THREE.CatmullRomCurve3(def.points,false,'catmullrom',0.42);
  totalLength=curve.getLength();
  clearTrack();
  const roadGeo=buildRoad();
  // 高品質維持: 1024pxテクスチャをそのまま使う、roughnessはV36より少し下げてクッキリ
  roadMesh=new THREE.Mesh(roadGeo, new THREE.MeshStandardMaterial({map:asphaltTex, roughness:0.78, metalness:0.04}));
  roadMesh.receiveShadow=true; scene.add(roadMesh);

  const centerLineVerts=[];
  for(let i=0;i<SEGMENTS;i+=2){ if(i%4<2){ const {p}=getTrackAt(i/SEGMENTS); centerLineVerts.push(p.x, p.y+ROAD_Y+0.06, p.z); } }
  const centerGeo=new THREE.BufferGeometry(); centerGeo.setAttribute('position', new THREE.Float32BufferAttribute(centerLineVerts,3));
  const centerLine=new THREE.Line(centerGeo, new THREE.LineDashedMaterial({color:0xffffff, dashSize:1.6, gapSize:1.6})); centerLine.computeLineDistances(); centerLine.userData.isWall=true; scene.add(centerLine);

  let wallLeftVerts=[], wallRightVerts=[];
  for(let i=0;i<=SEGMENTS;i++){ const {p,n}=getTrackAt(i/SEGMENTS); const l=p.clone().add(n.clone().multiplyScalar(ROAD_HALF+WALL_OFFSET)); const r=p.clone().add(n.clone().multiplyScalar(-(ROAD_HALF+WALL_OFFSET))); wallLeftVerts.push(l.x,l.y+ROAD_Y,l.z,l.x,l.y+ROAD_Y+2.2,l.z); wallRightVerts.push(r.x,r.y+ROAD_Y,r.z,r.x,r.y+ROAD_Y+2.2,r.z); }
  function makeWallMeshFixed(verts,col){
    const idx=[]; for(let i=0;i<SEGMENTS;i++){ const a=i*2,b=a+1,c=a+2,d=a+3; idx.push(a,b,c,b,d,c); }

function tick(dt){
  let raw=input.steer+(joyActive?joyVec.x:0);
  steerInput=THREE.MathUtils.clamp(raw,-1,1);
  const eff=steerInput;
  if(wallHitCooldown>0) wallHitCooldown-=dt;

  if(gameState==='ready'){
    const tr=getTrackAtDist(s); const roadY=ROAD_Y;
    catRoot.position.set(tr.p.x, roadY+0.04, tr.p.z);
    groundShadow.position.set(tr.p.x, roadY+0.012, tr.p.z);
    shadowInner.position.set(tr.p.x, roadY+0.016, tr.p.z);
    footShadows.forEach(fs=>fs.position.set(tr.p.x, roadY+0.022, tr.p.z));
    drawTacho(1000,false); drawSpeedo(0,false);
    const cDist=12; const cH=6;
    camTarget.copy(tr.p); camTarget.y+=0.9;
    camPos.copy(tr.p).add(new THREE.Vector3(0,cH,0)).add(tr.t.clone().multiplyScalar(-cDist)); camPos.y=roadY+cH;
    camera.position.lerp(camPos, dt*1.3); camLook.lerp(camTarget, dt*2); camera.lookAt(camLook);
    return;
  }
  if(gameState==='goal'){
    const tr=getTrackAtDist(s);
    catRoot.position.set(tr.p.x, ROAD_Y+0.04, tr.p.z);
    groundShadow.position.set(tr.p.x, ROAD_Y+0.012, tr.p.z);
    return;
  }

  elapsed+=dt;
  if(s/totalLength>=0.985){
    gameState='goal';
    if(!bestTime||elapsed<bestTime) bestTime=elapsed;
    document.getElementById('goalBanner').classList.add('on');
    document.getElementById('goalTime').textContent=`TIME ${elapsed.toFixed(3)} BEST ${bestTime?bestTime.toFixed(3):'--'}`;
    document.getElementById('timeSub').textContent=`BEST ${bestTime.toFixed(3)}`;
    const gt=getTrackAt(0.985); for(let i=0;i<20;i++) spawnHit(gt.p,0xffd54f);
    document.getElementById('touchLayer').style.display='none';
    document.getElementById('startOverlay').style.display='none';
    return;
  }

  if(input.driftJustPressed && Math.abs(eff)>0.15){ isSliding=true; slideDir=Math.sign(eff); slideTime=0; slidePower=1; }

  let tLat, tBank, tRel, tSpd; const base=52;
  if(!isSliding){ tLat=eff*2.6; tBank=eff*0.6; tRel=eff*0.5; tSpd=base; }
  else {
    slideTime+=dt; slidePower=THREE.MathUtils.clamp(1-slideTime/2.2,0,1);
    let adj=0; if(Math.sign(eff)!==0 && Math.sign(eff)!==slideDir) adj=eff*2; else if(Math.sign(eff)===slideDir) adj=eff*0.3;
    tLat=slideDir*(2.8+slideTime*0.5)+adj; tBank=slideDir*0.6+adj*0.25; tRel=slideDir*THREE.MathUtils.degToRad(16+slideTime*9); tSpd=base*(1.12+slidePower*0.22);
    if(slideTime>2.2) isSliding=false;
  }
  lateral=THREE.MathUtils.lerp(lateral,tLat,dt*5); bank=THREE.MathUtils.lerp(bank,tBank,dt*6); relYaw=THREE.MathUtils.lerp(relYaw,tRel,dt*4.5);
  if(speed<tSpd) speed+=30*dt; else speed-=22*dt; speed=THREE.MathUtils.clamp(speed,0,68);

  let hitWall=false, side=0;
  if(lateral>ROAD_HALF-0.12){ hitWall=true; side=1; }
  if(lateral<-ROAD_HALF+0.12){ hitWall=true; side=-1; }
  if(hitWall && wallHitCooldown<=0){
    wallHitCooldown=0.85; isSliding=false; speed*=0.32; lateral=THREE.MathUtils.clamp(lateral,-ROAD_HALF+0.35,ROAD_HALF-0.35); bank=-side*0.9;
    document.getElementById('wallFlash').classList.add('on'); setTimeout(()=>document.getElementById('wallFlash').classList.remove('on'),180);
    const tr=getTrackAtDist(s); const hp=tr.p.clone().add(tr.n.clone().multiplyScalar(lateral)); spawnHit(hp, side<0?0xff4444:0x44ff44); waterLevel=Math.max(0,waterLevel-18); updateCup(); spawnSplash(hp);
    const wr=document.getElementById('cupWrap'); wr.classList.add('hit'); setTimeout(()=>wr.classList.remove('hit'),350);
  }
  lateral=THREE.MathUtils.clamp(lateral,-ROAD_HALF-0.8,ROAD_HALF+0.8);

  s+=speed*dt*0.62;
  const track=getTrackAtDist(s); const worldPos=track.p.clone().add(track.n.clone().multiplyScalar(lateral)); const roadY=track.p.y+ROAD_Y;
  catRoot.position.set(worldPos.x, roadY+0.04, worldPos.z); catRoot.rotation.y=Math.atan2(track.t.x,track.t.z)+relYaw;

  groundShadow.position.set(worldPos.x, roadY+0.012, worldPos.z); groundShadow.rotation.z=-Math.atan2(track.t.x,track.t.z); groundShadow.scale.setScalar(1-Math.abs(bank)*0.1+(isSliding?0.12:0));
  shadowInner.position.set(worldPos.x, roadY+0.016, worldPos.z); shadowInner.rotation.z=groundShadow.rotation.z; shadowInner.scale.setScalar(0.7 - Math.abs(bank)*0.08);
  const legOffsets=[[-.38,.44], [.38,.44], [-.40,-.40], [.40,-.40]];
  footShadows.forEach((fs,i)=>{ const off=legOffsets[i]; const legPos=worldPos.clone().add(new THREE.Vector3(off[0],0,off[1]).applyAxisAngle(new THREE.Vector3(0,1,0), catRoot.rotation.y)); fs.position.set(legPos.x, roadY+0.022, legPos.z); fs.material.opacity = isSliding?0.22:0.42; });

  chai.hips.rotation.z=bank;
  const runPhase=clock.elapsedTime* (speed*0.6 + 6);
  if(!isSliding && speed>2){
    chai.legs.fl.rotation.x=Math.sin(runPhase)*0.45;
    chai.legs.fr.rotation.x=Math.sin(runPhase+Math.PI)*0.45;
    chai.legs.bl.rotation.x=Math.sin(runPhase+Math.PI)*0.35;
    chai.legs.br.rotation.x=Math.sin(runPhase)*0.35;
  }

  const camDist=10.5 - speed*0.03; const camHeight=4.8;
  camTarget.copy(worldPos).add(new THREE.Vector3(0,0.45,0)).add(track.t.clone().multiplyScalar(6));
  camPos.copy(track.p).add(track.t.clone().multiplyScalar(-camDist)).add(new THREE.Vector3(0,camHeight,0)).add(track.n.clone().multiplyScalar(lateral*0.18));
  camPos.y=roadY+camHeight;
  camera.position.lerp(camPos, dt*3.8); camLook.lerp(camTarget, dt*5.2); camera.lookAt(camLook);
  if(hitWall) camera.position.x+=(Math.random()-0.5)*0.7;

  const ind=document.getElementById('indicator'); const warnL=document.getElementById('warnLeft'); const warnR=document.getElementById('warnRight');
  const rpm = 1000 + speed*135 + (isSliding? slidePower*1200 : 0) + Math.sin(clock.elapsedTime*12)* (isSliding?200:40);
  const kmh = speed*3.6;
  drawTacho(rpm, isSliding); drawSpeedo(kmh, isSliding);
  document.getElementById('rpmVal').textContent=`${Math.floor(rpm)} RPM`;
  document.getElementById('spdVal').textContent=`${Math.floor(kmh)} km/h`;
  document.getElementById('waterFill').style.width=(isSliding? slidePower*100 : Math.min(speed/50*30, 30))+'%';
  document.getElementById('slideLabel').textContent=isSliding?`DRIFT ${Math.floor(slidePower*100)}%`: `IDLE`;
  document.getElementById('speedLines').classList.toggle('on', speed>38 || boostTimer>0);

  if(wallHitCooldown>0){ ind.classList.add('on'); ind.textContent=`💧 水 -18% → ${Math.floor(waterLevel)}%`; warnL.classList.remove('on'); warnR.classList.remove('on'); }
  else if(isSliding){ const distToWall = ROAD_HALF - Math.abs(lateral); if(distToWall<1.2){ ind.classList.remove('on'); if(lateral>0){ warnR.classList.add('on'); warnL.classList.remove('on'); } else { warnL.classList.add('on'); warnR.classList.remove('on'); } } else { ind.classList.add('on'); ind.textContent='DRIFT'; warnL.classList.remove('on'); warnR.classList.remove('on'); } }
  else { ind.classList.remove('on'); warnL.classList.remove('on'); warnR.classList.remove('on'); }

  const progress=s/totalLength;
  const def=TRACKS[currentKey];
  const tot=def.corners.length-2; const cIdx=Math.floor(progress*def.corners.length);
  document.getElementById('cornerVal').textContent=`${Math.min(cIdx,tot)}/${tot}`;
  document.getElementById('cornerName').textContent=def.corners[Math.min(cIdx,def.corners.length-1)];
  document.getElementById('debug').innerHTML=`${def.name} ${def.sub}<br>進行:${(progress*100).toFixed(1)}% 高度:${Math.floor(track.p.y)}m<br>水:${Math.floor(waterLevel)}% ${Math.floor(kmh)}km/h`;
  document.getElementById('timeVal').textContent=elapsed.toFixed(3);
}

const miniCanvas=document.getElementById('mini'); const miniCtx=miniCanvas.getContext('2d');
function updateMini(){
  if(!curve) return;
  const w=miniCanvas.width, h=miniCanvas.height; miniCtx.clearRect(0,0,w,h); miniCtx.fillStyle='#dbefc9'; miniCtx.fillRect(0,0,w,h);
  miniCtx.strokeStyle='#3a3f45'; miniCtx.lineWidth=10; miniCtx.lineCap='round'; miniCtx.lineJoin='round'; miniCtx.beginPath();
  for(let i=0;i<=SEGMENTS;i++){ const {p}=getTrackAt(i/SEGMENTS); const x=(p.x+70)/140 * w*0.8 + w*0.1; const y=(1-(p.z-(-60))/(1080-(-60)))*h*0.85 + h*0.07; if(i===0) miniCtx.moveTo(x,y); else miniCtx.lineTo(x,y); }
  miniCtx.stroke(); miniCtx.strokeStyle='#ffffff'; miniCtx.lineWidth=2; miniCtx.stroke();
  const {p}=getTrackAtDist(s);
  const px=(p.x+70)/140 * w*0.8 + w*0.1 - (lateral/10)*6; const py=(1-(p.z-(-60))/(1080-(-60)))*h*0.85 + h*0.07;
  miniCtx.fillStyle='#e89b4c'; miniCtx.beginPath(); miniCtx.arc(px,py,5,0,Math.PI*2); miniCtx.fill();
  const gp=getTrackAt(0.985).p; const gx=(gp.x+70)/140 * w*0.8 + w*0.1; const gy=(1-(gp.z-(-60))/(1080-(-60)))*h*0.85 + h*0.07;
  miniCtx.fillStyle='#ffcc00'; miniCtx.fillRect(gx-4,gy-4,8,8);
}
function animate(){requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),0.033); pollKeys(); tick(dt); updateMini(); renderer.render(scene,camera);}

function setupStart(){
  const overlay=document.getElementById('startOverlay');
  const center=document.getElementById('centerMsg');
  const btnStart=document.getElementById('btnStart');
  const cvs=document.getElementById('c');
  function handleStart(e){ if(gameState!=='ready') return; window.startGame(); e&&e.stopPropagation(); }
  overlay.addEventListener('pointerdown', handleStart, {passive:true});
  center.addEventListener('pointerdown', handleStart, {passive:true});
  btnStart.addEventListener('pointerdown', handleStart, {passive:true});
  cvs.addEventListener('pointerdown', (e)=>{ if(gameState==='ready') handleStart(e); }, {passive:true});
  overlay.addEventListener('click', handleStart);
  center.addEventListener('click', handleStart);
}
setupStart();

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();});
renderer.setSize(innerWidth,innerHeight);
// 初期化順序を修正: curve生成をanimateより前に
rebuildTrack('haruna');
resetRace();
animate();
</script>
