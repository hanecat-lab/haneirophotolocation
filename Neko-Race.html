<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Yomogi&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9d6e8;font-family:"Zen Maru Gothic",system-ui,sans-serif;color:#2b3236;}
  #app{position:relative;width:100%;height:100%;} canvas{display:block;width:100%;height:100%;}
  .topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:10;}
  .pill{pointer-events:auto;backdrop-filter:blur(14px);background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,251,235,.82));border:1px solid rgba(255,255,255,.8);box-shadow:0 10px 30px rgba(40,60,50,.14),0 2px 0 #fff inset;border-radius:18px;padding:10px 14px;}
  .brand{font-weight:900;display:flex;align-items:center;gap:10px;min-width:220px;}
  .hud{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap} .hud .pill{min-width:86px;text-align:center;} .label{font-size:10px;opacity:.7;font-weight:800;letter-spacing:.12em;} .value{font-size:18px;font-weight:900;} .sub{font-size:11px;font-weight:700;color:#6d7b7d;}
  .centerMsg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:9;text-align:center;pointer-events:none;}
  .centerMsg h1{margin:0;font-size:44px;font-weight:900;text-shadow:0 4px 0 #fff,0 10px 22px rgba(0,0,0,.18);} .centerMsg p{margin:10px 0 0;font-family:"Yomogi",cursive;font-weight:700;background:rgba(255,253,248,.88);display:inline-block;padding:6px 14px;border-radius:999px;}
  .bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;z-index:10;gap:10px;pointer-events:none;} .controls{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;}
  .btn{appearance:none;border:0;border-radius:14px;padding:10px 14px;font-weight:900;font-size:13px;background:rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(60,70,60,.18),0 8px 18px rgba(0,0,0,.12);cursor:pointer;}
  .btn.primary{background:linear-gradient(180deg,#ffe9a8,#f7c85b);box-shadow:0 4px 0 #c48a2f,0 8px 18px rgba(120,80,20,.2);}
  .touch{position:absolute;inset:0;z-index:5;display:flex;pointer-events:none;} .touch .zone{flex:1;pointer-events:auto;position:relative;}
  .joy{position:absolute;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,255,255,.35));border:2px solid rgba(255,255,255,.7);display:none;} .joyStick{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:linear-gradient(180deg,#fff,#ffe9a8);box-shadow:0 4px 0 #c8a04a;display:grid;place-items:center;font-size:22px;}
  .driftBtn{position:absolute;right:18px;bottom:18px;width:108px;height:108px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f7c85b 55%,#ef8c4f);box-shadow:0 6px 0 #b86a2e,0 12px 24px rgba(80,40,10,.2),inset 0 2px 0 #fff;display:grid;place-items:center;font-weight:900;font-size:14px;user-select:none;transition:transform .05s}
  .driftBtn.active{transform:scale(0.92)}
  @media (pointer:coarse){.joy{display:block;}} .wallFlash{position:absolute;inset:0;z-index:8;background:rgba(255,50,50,.35);pointer-events:none;opacity:0;transition:opacity .15s} .wallFlash.on{opacity:1}
  .debug{position:absolute;left:12px;top:118px;z-index:9;background:rgba(0,0,0,.88);color:#7CFF7C;padding:8px 12px;border-radius:10px;font-size:11px;font-family:monospace;pointer-events:none;line-height:1.4}
  .indicator{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:9;font-size:36px;font-weight:900;color:#fff;text-shadow:0 3px 0 #000,0 0 16px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .15s;letter-spacing:.08em} .indicator.on{opacity:1}
  .minimap{position:absolute;right:12px;top:78px;width:124px;height:124px;border-radius:18px;overflow:hidden;z-index:9;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 24px rgba(0,0,0,.14);backdrop-filter:blur(10px);} .minimap canvas{width:100%;height:100%;display:block;}
  .speedLines{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:.2s;background:radial-gradient(ellipse at center,transparent 35%,rgba(255,255,255,.18) 72%,rgba(255,255,255,.35) 100%);mix-blend-mode:screen;} .speedLines.on{opacity:1;}
  .goalBanner{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:12;background:linear-gradient(180deg,#fff,#ffe082);border-radius:16px;padding:12px 20px;font-weight:900;font-size:22px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;text-align:center}
  .goalBanner.on{display:block}
  .tacho{width:110px;height:110px;position:relative;display:grid;place-items:center}
  .tacho canvas{width:110px;height:110px;display:block}
  .tacho .rpmVal{position:absolute;bottom:14px;font-size:10px;font-weight:900;color:#333}
  .speedo{width:110px;height:110px;position:relative;display:grid;place-items:center}
  .speedo canvas{width:110px;height:110px;display:block}
  .speedo .spdVal{position:absolute;bottom:14px;font-size:11px;font-weight:900;color:#222}
  .waterBar{width:140px;height:28px;background:rgba(0,0,0,.18);border-radius:999px;overflow:hidden;position:relative;box-shadow:inset 0 2px 6px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.5)}
  .waterFill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(180deg,#7dd8ff,#2a9ed6 60%,#186a9a);transition:width .08s linear;overflow:hidden}
  .waterFill .wave{position:absolute;left:-50%;top:-8px;width:200%;height:28px;background:radial-gradient(ellipse at center,rgba(255,255,255,.55) 0%,transparent 60%);animation:waveMove 1.2s linear infinite, waveBob 0.6s ease-in-out infinite alternate}
  @keyframes waveMove{0%{transform:translateX(0)}100%{transform:translateX(18%)}}
  @keyframes waveBob{0%{transform:translateY(0) scaleY(1)}100%{transform:translateY(2px) scaleY(1.2)}}
  .cupWrap{position:absolute;right:20px;bottom:142px;z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px}

  .paperCup{width:84px;height:96px;position:relative;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
  .cupBody{position:absolute;inset:0;background:linear-gradient(90deg,#fefcf5 0%,#f5eeda 20%,#fffdf5 45%,#efe6cc 100%);border:2px solid #d8c9a8;border-top:3px solid #fff; border-radius:6px 6px 28px 28px / 6px 6px 32px 32px;overflow:hidden}
  .cupBody::before{content:'';position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(180deg,#ffffff,#f0e6c8);border-bottom:1px solid #d8c9a8}
  .cupWater{position:absolute;left:2px;right:2px;bottom:2px;background:linear-gradient(180deg,#9be1ff,#3aaee0 55%,#1e7fb0);border-radius:0 0 26px 26px / 0 0 30px 30px;transition:height .6s cubic-bezier(.3,.8,.3,1);overflow:hidden}
  .cupWater .w1{position:absolute;left:-30%;top:-10px;width:160%;height:18px;background:radial-gradient(ellipse at center,rgba(255,255,255,.7) 0%,transparent 60%);animation:cupWave 1.4s linear infinite}
  .cupWater .w2{position:absolute;left:-20%;top:-4px;width:140%;height:14px;background:radial-gradient(ellipse at center,rgba(255,255,255,.4) 0%,transparent 70%);animation:cupWave 1.9s linear infinite reverse}
  @keyframes cupWave{0%{transform:translateX(0)}100%{transform:translateX(22%)}}
  .cupRim{position:absolute;left:-2px;right:-2px;top:-4px;height:10px;background:linear-gradient(180deg,#fff,#e8dcc0);border:2px solid #d8c9a8;border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  .waterPct{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.3)}
  .cupWrap.low .cupBody{animation:cupShake .15s ease infinite}
  @keyframes cupShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-1deg)}75%{transform:rotate(1deg)}}
  .cupWrap.hit{animation:hitBounce .35s ease}
  @keyframes hitBounce{0%{transform:translateY(0)}30%{transform:translateY(-8px) rotate(-2deg)}60%{transform:translateY(4px) rotate(2deg)}100%{transform:translateY(0)}}

  /* 壁際回避警告 - 中央から移動 */
  .wallWarn{position:absolute;top:50%;z-index:9;pointer-events:none;opacity:0;transform:translateY(-50%) scale(0.9);transition:opacity .18s, transform .18s;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.8);padding:8px 12px;border-radius:12px;backdrop-filter:blur(6px)}
  .wallWarn.on{opacity:1;transform:translateY(-50%) scale(1)}
  .wallWarn.left{left:14px;background:linear-gradient(90deg,rgba(255,60,60,.85),rgba(255,60,60,.25));border-left:4px solid #ff3333}
  .wallWarn.right{right:14px;background:linear-gradient(270deg,rgba(255,60,60,.85),rgba(255,60,60,.25));border-right:4px solid #ff3333}
  .wallWarn .arrow{font-size:22px;animation:arrowPulse .4s ease infinite alternate}
  @keyframes arrowPulse{0%{transform:translateX(0)}100%{transform:translateX(4px)}}
  .wallWarn.right .arrow{animation:arrowPulseR .4s ease infinite alternate}
  @keyframes arrowPulseR{0%{transform:translateX(0)}100%{transform:translateX(-4px)}}
</style>

</div>

<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(); scene.background=new THREE.Color('#a9d6e8'); scene.fog=new THREE.Fog('#cfeaf3', 90, 380);
const camera=new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 800);
let camTarget=new THREE.Vector3(), camPos=new THREE.Vector3(), camLook=new THREE.Vector3();
scene.add(new THREE.AmbientLight(0xffffff,0.82));
const sun=new THREE.DirectionalLight(0xfff6e0,1.25); sun.position.set(30,55,20); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);

const trackPoints=[
  new THREE.Vector3(0,0,-60), new THREE.Vector3(0,0,-30), new THREE.Vector3(0,1,0), new THREE.Vector3(0,1,20),
  new THREE.Vector3(12,2,38), new THREE.Vector3(26,3,52), new THREE.Vector3(32,4,68), new THREE.Vector3(24,5,84), new THREE.Vector3(8,6,94), new THREE.Vector3(0,6,100),
  new THREE.Vector3(-12,7,118), new THREE.Vector3(-26,8,132), new THREE.Vector3(-32,9,150), new THREE.Vector3(-24,10,168), new THREE.Vector3(-8,11,178), new THREE.Vector3(0,11,185),
  new THREE.Vector3(12,12,203), new THREE.Vector3(26,13,217), new THREE.Vector3(32,14,235), new THREE.Vector3(24,15,253), new THREE.Vector3(8,16,263), new THREE.Vector3(0,16,270),
  new THREE.Vector3(-14,17,288), new THREE.Vector3(-28,18,302), new THREE.Vector3(-34,19,320), new THREE.Vector3(-26,20,338), new THREE.Vector3(-10,21,348), new THREE.Vector3(0,21,355),
  new THREE.Vector3(14,22,373), new THREE.Vector3(28,23,387), new THREE.Vector3(34,24,405), new THREE.Vector3(26,25,423), new THREE.Vector3(10,26,433), new THREE.Vector3(0,26,440),
  new THREE.Vector3(-14,27,458), new THREE.Vector3(-28,28,472), new THREE.Vector3(-34,29,490), new THREE.Vector3(-26,30,508), new THREE.Vector3(-10,31,518), new THREE.Vector3(0,31,525),
  new THREE.Vector3(16,32,543), new THREE.Vector3(32,33,557), new THREE.Vector3(38,34,575), new THREE.Vector3(30,35,593), new THREE.Vector3(12,36,603), new THREE.Vector3(0,36,610),
  new THREE.Vector3(-16,37,628), new THREE.Vector3(-32,38,642), new THREE.Vector3(-38,39,660), new THREE.Vector3(-30,40,678), new THREE.Vector3(-12,41,688), new THREE.Vector3(0,41,695),
  new THREE.Vector3(16,42,713), new THREE.Vector3(32,43,727), new THREE.Vector3(38,44,745), new THREE.Vector3(30,45,763), new THREE.Vector3(12,46,773), new THREE.Vector3(0,46,780),
  new THREE.Vector3(0,47,810), new THREE.Vector3(0,48,850), new THREE.Vector3(0,48,880),
];
const cornerNames=['START','C1 右','C2 左','C3 右','C4 左','C5 右','C6 左','C7 右','C8 左','C9 右','GOAL'];
const curve=new THREE.CatmullRomCurve3(trackPoints,false,'catmullrom',0.42);
const totalLength=curve.getLength(); const SEGMENTS=640; const ROAD_HALF=3.8; const ROAD_Y=0.02; const GROUND_Y=-0.8; const WALL_OFFSET=0.7;
function getTrackAt(u){ u=THREE.MathUtils.clamp(u,0,1); const p=curve.getPointAt(u); const t=curve.getTangentAt(u).normalize(); const n=new THREE.Vector3(-t.z,0,t.x).normalize(); return {p,t,n}; }
function getTrackAtDist(s){ return getTrackAt(THREE.MathUtils.clamp(s/totalLength,0,1)); }

function makeAsphaltLight(){
  const c=document.createElement('canvas'); c.width=256; c.height=256; const ctx=c.getContext('2d');
  ctx.fillStyle='#7a828a'; ctx.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){ ctx.fillStyle=`rgba(255,248,235,${Math.random()*0.08})`; ctx.fillRect(Math.random()*256,Math.random()*256,1.2,1.2); }
  for(let i=0;i<600;i++){ ctx.fillStyle=`rgba(40,42,48,${Math.random()*0.07})`; ctx.fillRect(Math.random()*256,Math.random()*256,1,1); }
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(1,32); tex.anisotropy=4; return tex;
}
function buildRoad(){
  const verts=[], uvs=[], indices=[];
  for(let i=0;i<=SEGMENTS;i++){
    const u=i/SEGMENTS; const {p,n}=getTrackAt(u); const y=p.y+ROAD_Y;
    verts.push(p.x+n.x*ROAD_HALF, y, p.z+n.z*ROAD_HALF);
    verts.push(p.x-n.x*ROAD_HALF, y, p.z-n.z*ROAD_HALF);
    const v=i/SEGMENTS*(totalLength/5); uvs.push(0,v,1,v);
  }
  for(let i=0;i<SEGMENTS;i++){ const a=i*2,b=a+1,c=a+2,d=a+3; indices.push(a,b,c,b,d,c); }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2)); geo.setIndex(indices); geo.computeVertexNormals(); return geo;
}
const roadGeo=buildRoad();
const roadMat=new THREE.MeshStandardMaterial({map:makeAsphaltLight(), roughness:0.82, metalness:0.04});
const roadMesh=new THREE.Mesh(roadGeo, roadMat); roadMesh.receiveShadow=true; scene.add(roadMesh);

const centerLineVerts=[];
for(let i=0;i<SEGMENTS;i+=2){ if(i%4<2){ const {p}=getTrackAt(i/SEGMENTS); centerLineVerts.push(p.x, p.y+ROAD_Y+0.05, p.z); } }
const centerGeo=new THREE.BufferGeometry(); centerGeo.setAttribute('position', new THREE.Float32BufferAttribute(centerLineVerts,3));
const centerLine=new THREE.Line(centerGeo, new THREE.LineDashedMaterial({color:0xfff8e0, dashSize:1.8, gapSize:1.8})); centerLine.computeLineDistances(); scene.add(centerLine);

const wallH=2.2; const wallLeftVerts=[], wallRightVerts=[], wallIdx=[];
for(let i=0;i<=SEGMENTS;i++){ const {p,n}=getTrackAt(i/SEGMENTS); const leftP = p.clone().add(n.clone().multiplyScalar(ROAD_HALF+WALL_OFFSET)); const rightP = p.clone().add(n.clone().multiplyScalar(-(ROAD_HALF+WALL_OFFSET))); wallLeftVerts.push(leftP.x, leftP.y+ROAD_Y, leftP.z, leftP.x, leftP.y+ROAD_Y+wallH, leftP.z); wallRightVerts.push(rightP.x, rightP.y+ROAD_Y, rightP.z, rightP.x, rightP.y+ROAD_Y+wallH, rightP.z); }
for(let i=0;i<SEGMENTS;i++){ const a=i*2,b=a+1,c=a+2,d=a+3; wallIdx.push(a,b,c,b,d,c); }
function makeWallMeshFixed(verts, col){
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(verts,3)); g.setIndex(wallIdx); g.computeVertexNormals(); 
  const m=new THREE.MeshStandardMaterial({color:col, roughness:0.45, metalness:0.05, side:THREE.DoubleSide, fog:false}); 
  return new THREE.Mesh(g, m);
}
scene.add(makeWallMeshFixed(wallLeftVerts, 0xe85555));
scene.add(makeWallMeshFixed(wallRightVerts, 0x55bb55));

const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1600), new THREE.MeshStandardMaterial({color:'#7fc16a', roughness:0.95})); ground.rotation.x=-Math.PI/2; ground.position.y=GROUND_Y; ground.position.z=400; ground.receiveShadow=true; scene.add(ground);

const goalU=0.985; const goalTrack=getTrackAt(goalU);
const gateGroup=new THREE.Group(); gateGroup.position.copy(goalTrack.p); gateGroup.position.y+=ROAD_Y; scene.add(gateGroup);
const pillarGeo=new THREE.BoxGeometry(0.6,4.5,0.6); const pillarMat=new THREE.MeshStandardMaterial({color:0xffffff, side:THREE.DoubleSide});
const leftPillar=new THREE.Mesh(pillarGeo, pillarMat); leftPillar.position.set(-(ROAD_HALF+WALL_OFFSET+0.3),2.2,0); leftPillar.castShadow=true; gateGroup.add(leftPillar);
const rightPillar=new THREE.Mesh(pillarGeo, pillarMat); rightPillar.position.set((ROAD_HALF+WALL_OFFSET+0.3),2.2,0); rightPillar.castShadow=true; gateGroup.add(rightPillar);
const topBar=new THREE.Mesh(new THREE.BoxGeometry((ROAD_HALF+WALL_OFFSET)*2+1.2,0.5,0.5), new THREE.MeshStandardMaterial({color:0xffd54f})); topBar.position.set(0,4.2,0); topBar.castShadow=true; gateGroup.add(topBar);

function drawTacho(rpm, isSliding){

  tachoCtx.clearRect(0,0,w,h);

    const x2=cx+Math.cos(angle)*r2, y2=cy+Math.sin(angle)*r2;

  tachoCtx.beginPath(); tachoCtx.arc(cx,cy,R, Math.PI*1.1+Math.PI*0.8*0.77, Math.PI*1.9); tachoCtx.lineWidth=14; tachoCtx.strokeStyle='rgba(255,60,60,.55)'; tachoCtx.stroke();

  tachoCtx.beginPath(); tachoCtx.arc(cx,cy,4,0,Math.PI*2); tachoCtx.fillStyle=isSliding?'#ffaa00':'#ff4444'; tachoCtx.fill();
}

function tick(dt){
  let raw = input.steer + (joyActive? joyVec.x : 0);
  steerInput = THREE.MathUtils.clamp(raw, -1, 1);
  const eff = steerInput;
  if(wallHitCooldown>0) wallHitCooldown-=dt;
  if(boostTimer>0) boostTimer-=dt;

  if(gameState==='ready'){
    const tr=getTrackAtDist(s);
    const roadY = tr.p.y + ROAD_Y;
    catRoot.position.set(tr.p.x, roadY+0.04, tr.p.z);
    groundShadow.position.set(tr.p.x, roadY+0.015, tr.p.z);
    shadowInner.position.set(tr.p.x, roadY+0.018, tr.p.z);
    footShadows.forEach(fs=>{ fs.position.set(tr.p.x, roadY+0.02, tr.p.z); });
    drawTacho(1000, false); drawSpeedo(0,false);
    return;
  }
  if(gameState==='goal'){
    const tr=getTrackAtDist(s);
    const roadY = tr.p.y + ROAD_Y;
    catRoot.position.set(tr.p.x, roadY+0.04, tr.p.z);
    groundShadow.position.set(tr.p.x, roadY+0.015, tr.p.z);
    shadowInner.position.set(tr.p.x, roadY+0.018, tr.p.z);
    return;
  }

  elapsed=clock.getElapsedTime()-startTime;

  if(s/totalLength >= 0.985){
    gameState='goal';
    goalTime=elapsed;
    if(!bestTime || goalTime<bestTime) bestTime=goalTime;
    document.getElementById('goalBanner').classList.add('on');
    document.getElementById('goalTime').textContent=`TIME: ${goalTime.toFixed(3)}秒 BEST: ${bestTime?bestTime.toFixed(3):'--.---'}`;
    document.getElementById('timeSub').textContent=`BEST ${bestTime.toFixed(3)}`;
    for(let i=0;i<30;i++) spawnHit(goalTrack.p, 0xffd54f);
    return;
  }

  if(input.driftJustPressed && Math.abs(eff)>0.15){
    isSliding=true; slideDir=Math.sign(eff); slideTime=0; slidePower=1.0;
  }

  let targetLat, targetBank, targetRel, targetSpeed;
  const baseMax=50 + (boostTimer>0? 18:0);

  if(!isSliding){
    targetLat = eff * 2.8;
    targetBank = eff * 0.65;
    targetRel = eff * 0.55;
    targetSpeed = baseMax;
  } else {
    slideTime+=dt;
    slidePower = THREE.MathUtils.clamp(1 - slideTime/2.5, 0, 1);
    let adjust=0;
    if(Math.sign(eff)!==0 && Math.sign(eff)!==slideDir) adjust = eff * 2.2;
    else if(Math.sign(eff)===slideDir) adjust = eff * 0.4;
    targetLat = slideDir * (3.0 + slideTime*0.6) + adjust;
    targetBank = slideDir * 0.65 + adjust*0.3;
    targetRel = slideDir * THREE.MathUtils.degToRad(18 + slideTime*10);
    targetSpeed = baseMax * (1.15 + slidePower*0.25);
    if(slideTime>2.5) isSliding=false;
  }

  lateral = THREE.MathUtils.lerp(lateral, targetLat, dt*5.5);
  bank = THREE.MathUtils.lerp(bank, targetBank, dt*7);
  relativeAngle = THREE.MathUtils.lerp(relativeAngle, targetRel, dt*5);
  if(speed<targetSpeed) speed+=30*dt; else speed-=24*dt;
  speed=THREE.MathUtils.clamp(speed,0,baseMax*1.2);

  let hitWall=false, hitSide=0;
  if(lateral > ROAD_HALF-0.15){ hitWall=true; hitSide=1; }
  if(lateral < -ROAD_HALF+0.15){ hitWall=true; hitSide=-1; }
  if(hitWall && wallHitCooldown<=0){
    wallHitCooldown=0.9; isSliding=false; speed*=0.28; lateral=THREE.MathUtils.clamp(lateral, -ROAD_HALF+0.4, ROAD_HALF-0.4);
    bank = -hitSide*1.0;
    document.getElementById('wallFlash').classList.add('on');
    setTimeout(()=>document.getElementById('wallFlash').classList.remove('on'), 200);
    const tr=getTrackAtDist(s);
    const hitPos=tr.p.clone().add(tr.n.clone().multiplyScalar(lateral));
    spawnHit(hitPos, hitSide<0?0xff4444:0x44ff44);
    waterLevel=Math.max(0, waterLevel-18);
    updateCup();
    spawnWaterSplash(hitPos);
    const wrap=document.getElementById('cupWrap');
    wrap.classList.add('hit');
    setTimeout(()=>wrap.classList.remove('hit'), 400);
  }
  lateral=THREE.MathUtils.clamp(lateral,-ROAD_HALF-0.9,ROAD_HALF+0.9);

  s+=speed*dt*0.55;
  const track=getTrackAtDist(s);
  const worldPos=track.p.clone().add(track.n.clone().multiplyScalar(lateral));
  const roadY = track.p.y + ROAD_Y;
  catRoot.position.set(worldPos.x, roadY+0.04, worldPos.z);
  catRoot.rotation.y=Math.atan2(track.t.x,track.t.z)+relativeAngle;
  
  groundShadow.position.set(worldPos.x, roadY+0.015, worldPos.z);
  groundShadow.rotation.z=-Math.atan2(track.t.x,track.t.z);
  groundShadow.scale.setScalar(1.0 - Math.abs(bank)*0.12 + (isSliding?0.15:0));
  shadowInner.position.set(worldPos.x, roadY+0.018, worldPos.z);
  shadowInner.rotation.z=groundShadow.rotation.z;
  shadowInner.scale.setScalar(0.7 - Math.abs(bank)*0.08);

  const legOffsets=[[-.38,.44], [.38,.44], [-.40,-.40], [.40,-.40]];
  footShadows.forEach((fs,i)=>{
    const off=legOffsets[i];
    const legPos=worldPos.clone().add(new THREE.Vector3(off[0],0,off[1]).applyAxisAngle(new THREE.Vector3(0,1,0), catRoot.rotation.y));
    fs.position.set(legPos.x, roadY+0.022, legPos.z);
    fs.material.opacity = isSliding?0.22:0.42;
  });

  chai.hips.rotation.z=bank;
  chai.hips.rotation.x=THREE.MathUtils.lerp(chai.hips.rotation.x, isSliding? -0.08 : bank*0.10, dt*5);
  const runPhase=clock.elapsedTime* (speed*0.6 + 6);
  if(!isSliding && speed>2){
    chai.legs.fl.rotation.x=Math.sin(runPhase)*0.45;
    chai.legs.fr.rotation.x=Math.sin(runPhase+Math.PI)*0.45;
    chai.legs.bl.rotation.x=Math.sin(runPhase+Math.PI)*0.35;
    chai.legs.br.rotation.x=Math.sin(runPhase)*0.35;
  } else if(isSliding){
    Object.values(chai.legs).forEach(l=>{ l.rotation.x=THREE.MathUtils.lerp(l.rotation.x, -0.2, dt*6); });
  }
  chai.head.rotation.z=THREE.MathUtils.lerp(chai.head.rotation.z, bank*0.32, dt*6);
  chai.head.rotation.y=THREE.MathUtils.lerp(chai.head.rotation.y, steerInput*0.45, dt*6);
  chai.tails.forEach((seg,i)=>{
    const wag=isSliding? Math.sin(clock.elapsedTime*12+i)*0.4*slidePower : Math.sin(clock.elapsedTime*2.2+i*0.6)*0.22 + (-bank*0.4);
    seg.rotation.y=wag + (isSliding? slideDir*0.25:0);
  });
  if(isSliding && Math.random()<0.6){
    const pos=worldPos.clone().add(track.n.clone().multiplyScalar(0.2)).add(track.t.clone().multiplyScalar(-0.5));
    pos.y=roadY+0.03;
    const g=new THREE.PlaneGeometry(0.22,0.55); const m=new THREE.MeshBasicMaterial({color:'#2a2a2a', transparent:true, opacity:0.6, depthWrite:false, fog:false});
    const mesh=new THREE.Mesh(g,m); mesh.position.copy(pos); mesh.rotation.x=-Math.PI/2; mesh.rotation.z=catRoot.rotation.y; skidGroup.add(mesh);
    setTimeout(()=>skidGroup.remove(mesh), 3000);
  }
  for(let i=hitGroup.children.length-1;i>=0;i--){ const m=hitGroup.children[i]; m.position.add(m.userData.vel.clone().multiplyScalar(dt)); m.userData.vel.y-=6*dt; m.userData.life-=dt*1.4; m.material.opacity=m.userData.life; if(m.userData.life<=0) hitGroup.remove(m); }

  const camDist=10.5 - speed*0.03; const camHeight=4.8;
  camTarget.copy(worldPos).add(new THREE.Vector3(0,0.45,0)).add(track.t.clone().multiplyScalar(6));
  camPos.copy(track.p).add(track.t.clone().multiplyScalar(-camDist)).add(new THREE.Vector3(0,camHeight,0)).add(track.n.clone().multiplyScalar(lateral*0.18));
  camPos.y=roadY+camHeight;
  camera.position.lerp(camPos, dt*3.8); camLook.lerp(camTarget, dt*5.2); camera.lookAt(camLook);
  if(hitWall) camera.position.x+=(Math.random()-0.5)*0.7;

  const ind=document.getElementById('indicator');
  const warnL=document.getElementById('warnLeft');
  const warnR=document.getElementById('warnRight');
  const rpm = 1000 + speed*135 + (isSliding? slidePower*1200 : 0) + Math.sin(clock.elapsedTime*12)* (isSliding?200:40);
  const kmh = speed*3.6;
  drawTacho(rpm, isSliding);
  drawSpeedo(kmh, isSliding);
  document.getElementById('rpmVal').textContent=`${Math.floor(rpm)} RPM`;
  document.getElementById('spdVal').textContent=`${Math.floor(kmh)} km/h`;
  document.getElementById('waterFill').style.width=(isSliding? slidePower*100 : Math.min(speed/50*30, 30))+'%';
  document.getElementById('slideLabel').textContent=isSliding?`DRIFT ${Math.floor(slidePower*100)}%`: `IDLE`;
  document.getElementById('speedLines').classList.toggle('on', speed>38 || boostTimer>0);

  if(wallHitCooldown>0){
    ind.classList.add('on');
    ind.textContent=`💧 水 -18% → ${Math.floor(waterLevel)}%`;
    ind.style.color= waterLevel<=0 ? '#ff3333' : '#33aaff';
    warnL.classList.remove('on'); warnR.classList.remove('on');
  } else if(isSliding){
    const distToWall = ROAD_HALF - Math.abs(lateral);
    if(distToWall<1.2){
      // 壁際警告を左右の端へ移動 - 中央は邪魔しない
      ind.classList.remove('on');
      if(lateral>0){
        // 右壁に近い → 右側に警告
        warnR.classList.add('on'); warnL.classList.remove('on');
      } else {
        warnL.classList.add('on'); warnR.classList.remove('on');
      }
    } else {
      // 中央はDRIFTのみ
      ind.classList.add('on'); ind.textContent='DRIFT'; ind.style.color='#ffffff';
      ind.style.fontSize='38px';
      warnL.classList.remove('on'); warnR.classList.remove('on');
    }
  } else {
    ind.classList.remove('on');
    warnL.classList.remove('on'); warnR.classList.remove('on');
  }

  const progress=s/totalLength;
  const cornerIdx=Math.floor(progress*10);
  document.getElementById('cornerVal').textContent=`${Math.min(cornerIdx,9)}/9`;
  document.getElementById('cornerName').textContent=cornerNames[Math.min(cornerIdx,10)];
  document.getElementById('debug').innerHTML=`水:${Math.floor(waterLevel)}%<br>高度:${Math.floor(track.p.y)}m<br>${Math.floor(kmh)}km/h`;
  document.getElementById('timeVal').textContent=elapsed.toFixed(3);
}

const miniCanvas=document.getElementById('mini'); const miniCtx=miniCanvas.getContext('2d');
function updateMini(){
  const w=miniCanvas.width, h=miniCanvas.height; miniCtx.clearRect(0,0,w,h); miniCtx.fillStyle='#dbefc9'; miniCtx.fillRect(0,0,w,h);
  miniCtx.strokeStyle='#3a3f45'; miniCtx.lineWidth=10; miniCtx.lineCap='round'; miniCtx.lineJoin='round'; miniCtx.beginPath();
  for(let i=0;i<=SEGMENTS;i++){ const {p}=getTrackAt(i/SEGMENTS); const x=(p.x+70)/140 * w*0.8 + w*0.1; const y=(1-(p.z-(-60))/(940-(-60)))*h*0.85 + h*0.07; if(i===0) miniCtx.moveTo(x,y); else miniCtx.lineTo(x,y); }
  miniCtx.stroke(); miniCtx.strokeStyle='#ffffff'; miniCtx.lineWidth=2; miniCtx.stroke();
  const {p}=getTrackAtDist(s);
  const px=(p.x+70)/140 * w*0.8 + w*0.1 - (lateral/10)*6; const py=(1-(p.z-(-60))/(940-(-60)))*h*0.85 + h*0.07;
  miniCtx.fillStyle='#e89b4c'; miniCtx.beginPath(); miniCtx.arc(px,py,5,0,Math.PI*2); miniCtx.fill();
  const gp=getTrackAt(0.985).p; const gx=(gp.x+70)/140 * w*0.8 + w*0.1; const gy=(1-(gp.z-(-60))/(940-(-60)))*h*0.85 + h*0.07;
  miniCtx.fillStyle='#ffcc00'; miniCtx.fillRect(gx-4,gy-4,8,8);
}
function animate(){requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),0.033); pollKeys(); tick(dt); updateMini(); renderer.render(scene,camera);}
animate();
document.getElementById('btnStart').addEventListener('click', startRace);
document.getElementById('btnRestart').addEventListener('click', restart);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();});
renderer.setSize(innerWidth,innerHeight);
resetRace();
</script>
