<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒人間ジャンプゲーム - 200点インターバル撤廃版</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
            box-sizing: border-box;
            padding: 5px;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #f0f0f0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 800px;
            height: auto;
            max-height: 62vh;
            object-fit: contain;
            cursor: pointer;
            image-rendering: -webkit-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-top: 10px;
            padding: 0 5px;
            box-sizing: border-box;
        }
        .controls button {
            flex: 1;
            margin: 0 4px;
            padding: 10px 4px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            background-color: #eeeeee;
            color: #1a1a1a;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.1s;
        }
        .controls button:active {
            background-color: #cccccc;
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }
        .btn-small-text {
            font-size: 10px;
            color: #666;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <button id="btn-left">速い (0.2秒)<span class="btn-small-text">画面左 / A・←</span></button>
            <button id="btn-center">ふんわり (0.4秒)<span class="btn-small-text">画面中央 / S・↓</span></button>
            <button id="btn-right">超ふんわり (0.6秒)<span class="btn-small-text">画面右 / D・→・Space</span></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // スムージング無効化
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;
        ctx.msImageSmoothingEnabled = false;

        const btnLeft = document.getElementById('btn-left');
        const btnCenter = document.getElementById('btn-center');
        const btnRight = document.getElementById('btn-right');

        // 地面の位置
        const groundY = 300;

        // プレイヤー設定
        const player = {
            x: 100,
            y: groundY,
            width: 30,
            height: 60,
            vy: 0,
            
            // ジャンプ設定
            jumpPowerSuperSlow: -23.33,
            gravitySuperSlow: 1.333,
            jumpPowerSlow: -35.0,  
            gravitySlow: 3.0,   
            jumpPowerFast: -72.0, 
            gravityFast: 12.0,   
            
            currentGravity: 12.0, 
            isJumping: false
        };

        // 障害物・演出パーティクルの設定
        let obstacles = [];
        let crackers = [];  
        let fireworks = []; 
        let godParticles = []; 
        
        let obstacleSpeed = 5;
        let spawnTimer = 0;
        let nextSpawnInterval = 100;
        let pendingDoubleJump = 0; 

        let score = 0;
        let highScore = 0;
        let isGameOver = false;
        let hasTriggered100Celebration = false;
        let hasTriggered200Celebration = false;
        let hasTriggered300Celebration = false; 

        // 速度変化システム用変数
        let speedMode = 'normal';
        let targetNextMode = ''; 
        let modeTimer = 0;
        let modeDuration = 180;  
        let prepareTimer = 0;    
        let actionMessage = '';
        let warningTimer = 0; 
        let intervalTimer = 0; 

        function getRandomModeDuration() {
            if (score >= 200) {
                return Math.floor(Math.random() * (420 - 300 + 1)) + 300;
            } else if (score >= 100) {
                return Math.floor(Math.random() * (600 - 300 + 1)) + 300;
            } else {
                return Math.floor(Math.random() * (360 - 180 + 1)) + 180; 
            }
        }

        // --- 超・派手クラッカー発動関数（100点） ---
        function triggerCracker() {
            const colors = ['#ff0055', '#00ffcc', '#ffff00', '#ff5500', '#00ff00', '#0088ff', '#ff00ff', '#ffffff'];
            const spawnPoints = [
                { x: 100, y: 150 }, 
                { x: 400, y: 100 }, 
                { x: 700, y: 150 }
            ];

            spawnPoints.forEach(pt => {
                for (let i = 0; i < 100; i++) {
                    const angle = Math.random() * Math.PI - Math.PI / 2;
                    const speed = Math.random() * 12 + 3;
                    crackers.push({
                        x: pt.x,
                        y: pt.y,
                        vx: Math.cos(angle) * speed * (pt.x === 400 ? (Math.random() - 0.5) * 2 : (pt.x < 400 ? 1 : -1)),
                        vy: Math.sin(angle) * speed - 4,
                        sizeW: Math.random() * 10 + 4,
                        sizeH: Math.random() * 6 + 3,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 1.0,
                        rotation: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.3,
                        shapeType: Math.random() > 0.5 ? 'rect' : 'line'
                    });
                }
            });
        }

        // --- 花火発動関数（200点） ---
        function triggerFireworks() {
            const colors = ['#ff2244', '#44ff44', '#4488ff', '#ffff44', '#ff44ff', '#44ffff', '#ffaa00'];
            const fireworkCenters = [
                { x: 250, y: 120 },
                { x: 550, y: 100 },
                { x: 400, y: 160 }
            ];

            fireworkCenters.forEach((center, index) => {
                setTimeout(() => {
                    if (isGameOver) return;
                    for (let i = 0; i < 70; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 7 + 2;
                        fireworks.push({
                            x: center.x,
                            y: center.y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            size: Math.random() * 5 + 3,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            alpha: 1.0
                        });
                    }
                }, index * 400);
            });
        }

        // --- 神演出発動関数（300点） ---
        function triggerGodCelebration() {
            const godColors = ['#ff00ff', '#00ffff', '#ffff00', '#ff8800', '#00ff88', '#ffffff'];
            
            for (let i = 0; i < 150; i++) {
                godParticles.push({
                    x: Math.random() * canvas.width * 1.5,
                    y: Math.random() * -canvas.height,
                    vx: -(Math.random() * 6 + 4), 
                    vy: Math.random() * 6 + 4,
                    size: Math.random() * 4 + 2,
                    color: godColors[Math.floor(Math.random() * godColors.length)],
                    alpha: Math.random() * 0.8 + 0.2,
                    isShootingStar: true
                });
            }

            for (let i = 0; i < 100; i++) {
                godParticles.push({
                    x: Math.random() * canvas.width,
                    y: groundY,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -(Math.random() * 8 + 2), 
                    size: Math.random() * 6 + 3,
                    color: godColors[Math.floor(Math.random() * godColors.length)],
                    alpha: 1.0,
                    isShootingStar: false
                });
            }
        }

        // --- 操作系関数 ---
        function doJump(type) {
            if (!player.isJumping && !isGameOver) {
                if (type === 'fast') {
                    player.vy = player.jumpPowerFast;
                    player.currentGravity = player.gravityFast;
                } else if (type === 'slow') {
                    player.vy = player.jumpPowerSlow;
                    player.currentGravity = player.gravitySlow;
                } else if (type === 'superSlow') {
                    player.vy = player.jumpPowerSuperSlow;
                    player.currentGravity = player.gravitySuperSlow;
                }
                player.isJumping = true;
            } else if (isGameOver) {
                resetGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                e.preventDefault();
                doJump('fast');
            } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                e.preventDefault();
                doJump('slow');
            } else if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                doJump('superSlow');
            }
        });

        canvas.addEventListener('mousedown', handleCanvasTap);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            handleCanvasTap(e.touches[0]);
        }, { passive: false });

        function handleCanvasTap(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const x = (e.clientX - rect.left) * scaleX;
            const third = canvas.width / 3;

            if (x < third) {
                doJump('fast');
            } else if (x < third * 2) {
                doJump('slow');
            } else {
                doJump('superSlow');
            }
        }

        btnLeft.addEventListener('mousedown', () => doJump('fast'));
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('fast'); }, { passive: false });
        btnCenter.addEventListener('mousedown', () => doJump('slow'));
        btnCenter.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('slow'); }, { passive: false });
        btnRight.addEventListener('mousedown', () => doJump('superSlow'));
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('superSlow'); }, { passive: false });


        // --- ゲーム進行関数 ---
        function resetGame() {
            obstacles = [];
            crackers = [];
            fireworks = [];
            godParticles = [];
            obstacleSpeed = 5;
            spawnTimer = 0;
            nextSpawnInterval = 100;
            pendingDoubleJump = 0;
            score = 0;
            speedMode = 'normal';
            targetNextMode = '';
            modeTimer = 0;
            modeDuration = getRandomModeDuration();
            prepareTimer = 0;
            warningTimer = 0;
            intervalTimer = 0;
            actionMessage = '';
            hasTriggered100Celebration = false;
            hasTriggered200Celebration = false;
            hasTriggered300Celebration = false;
            isGameOver = false;
            loop();
        }

        function drawStickman(x, y) {
            const rx = Math.round(x);
            const ry = Math.round(y);

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;

            ctx.beginPath(); ctx.arc(rx + 15, ry - 50, 10, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 40); ctx.lineTo(rx + 15, ry - 15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 30); ctx.lineTo(rx, ry - 20); ctx.moveTo(rx + 15, ry - 30); ctx.lineTo(rx + 30, ry - 20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 15); ctx.lineTo(rx, ry); ctx.moveTo(rx + 15, ry - 15); ctx.lineTo(rx + 30, ry); ctx.stroke();
        }

        function
