<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒人間ジャンプゲーム - 高さ統一・0.4秒版</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #f0f0f0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            max-width: 100%;
            height: auto;
            cursor: pointer;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 20px;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .controls button {
            flex: 1;
            margin: 0 10px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background-color: #eeeeee;
            color: #1a1a1a;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.1s;
        }
        .controls button:active {
            background-color: #cccccc;
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }
        .btn-small-text {
            font-size: 12px;
            color: #666;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <button id="btn-left">速いジャンプ (0.1秒)<span class="btn-small-text">画面左タップ / 左キー</span></button>
            <button id="btn-right">ふんわりジャンプ (0.4秒)<span class="btn-small-text">画面右タップ / 右キー</span></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        // 地面の位置
        const groundY = 300;

        // プレイヤー設定（高さは同じで、滞空時間が異なるように物理演算を設定）
        const player = {
            x: 100,
            y: groundY,
            width: 30,
            height: 60,
            vy: 0,
            
            // ふんわりジャンプ（0.4秒: 高さを同じにしつつ時間を倍にするため、初速半分・重力1/4）
            jumpPowerSlow: -35,  
            gravitySlow: 3.0,   
            
            // 速いジャンプ（0.1秒）
            jumpPowerFast: -140, 
            gravityFast: 48.0,   
            
            currentGravity: 12.0, // 現在適用されている重力
            isJumping: false
        };

        // 障害物の設定
        let obstacles = [];
        let obstacleSpeed = 5;
        let spawnTimer = 0;
        let nextSpawnInterval = 60;

        let score = 0;
        let highScore = 0;
        let isGameOver = false;

        // 速度変化システム用変数
        let speedMode = 'normal';
        let modeTimer = 0;
        let actionMessage = '';
        let messageTimer = 0;

        // --- 操作系関数 ---
        // ジャンプ処理（ジャンプの種類によって初速と重力を切り替える）
        function doJump(type) {
            if (!player.isJumping && !isGameOver) {
                if (type === 'fast') {
                    player.vy = player.jumpPowerFast;
                    player.currentGravity = player.gravityFast;
                } else {
                    player.vy = player.jumpPowerSlow;
                    player.currentGravity = player.gravitySlow;
                }
                player.isJumping = true;
            } else if (isGameOver) {
                resetGame();
            }
        }

        // キーボード操作
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                e.preventDefault();
                doJump('fast');
            } else if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                doJump('slow');
            }
        });

        // 画面（Canvas）のタップ/クリック操作
        canvas.addEventListener('mousedown', handleCanvasTap);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            handleCanvasTap(e.touches[0]);
        }, { passive: false });

        function handleCanvasTap(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            
            // 画面の左半分なら速いジャンプ、右半分ならふんわりジャンプ
            if (x < rect.width / 2) {
                doJump('fast');
            } else {
                doJump('slow');
            }
        }

        // 下部ボタンの操作
        btnLeft.addEventListener('mousedown', () => doJump('fast'));
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('fast'); }, { passive: false });
        
        btnRight.addEventListener('mousedown', () => doJump('slow'));
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('slow'); }, { passive: false });


        // --- ゲーム進行関数 ---
        function resetGame() {
            obstacles = [];
            obstacleSpeed = 5;
            spawnTimer = 0;
            nextSpawnInterval = 60;
            score = 0;
            speedMode = 'normal';
            modeTimer = 0;
            actionMessage = '';
            messageTimer = 0;
            isGameOver = false;
            loop();
        }

        function drawStickman(x, y) {
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            // 頭
            ctx.beginPath(); ctx.arc(x + 15, y - 50, 10, 0, Math.PI * 2); ctx.stroke();
            // 胴体
            ctx.beginPath(); ctx.moveTo(x + 15, y - 40); ctx.lineTo(x + 15, y - 15); ctx.stroke();
            // 腕
            ctx.beginPath(); ctx.moveTo(x + 15, y - 30); ctx.lineTo(x, y - 20); ctx.moveTo(x + 15, y - 30); ctx.lineTo(x + 30, y - 20); ctx.stroke();
            // 脚
            ctx.beginPath(); ctx.moveTo(x + 15, y - 15); ctx.lineTo(x, y); ctx.moveTo(x + 15, y - 15); ctx.lineTo(x + 30, y); ctx.stroke();
        }

        function update() {
            if (isGameOver) return;

            // 物理演算（現在設定されている重力を加算）
            player.vy += player.currentGravity;
            player.y += player.vy;

            // 着地判定
            if (player.y >= groundY) {
                player.y = groundY;
                player.vy = 0;
                player.isJumping = false;
            }

            // 速度変化システム（5点ごと）
            if (score >= 5) {
                modeTimer++;
                if (modeTimer > 350 && speedMode === 'normal') {
                    speedMode = 'prepare_slow';
                    actionMessage = '⚠️ まもなくスローダウン！（2秒間クリアタイム）';
                    messageTimer = 140; 
                    modeTimer = 0;
                } else if (modeTimer > 350 && speedMode === 'slow') {
                    speedMode = 'prepare_fast';
                    actionMessage = '⚠️ まもなくスピードアップ！（2秒間クリアタイム）';
                    messageTimer = 140;
                    modeTimer = 0;
                }
                if (speedMode === 'prepare_slow' && modeTimer > 120) {
                    speedMode = 'slow'; modeTimer = 0;
                } else if (speedMode === 'prepare_fast' && modeTimer > 120) {
                    speedMode = 'fast'; modeTimer = 0;
                } else if ((speedMode === 'slow' || speedMode === 'fast') && modeTimer > 400) {
                    speedMode = 'normal'; modeTimer = 0;
                }
            }

            if (messageTimer > 0) {
                messageTimer--;
                if (messageTimer === 0) actionMessage = '';
            }

            // 障害物のスピード
            let baseSpeed = 5 + Math.floor(score / 5);
            if (speedMode === 'slow') obstacleSpeed = 3;
            else if (speedMode === 'fast') obstacleSpeed = baseSpeed + 2;
            else obstacleSpeed = baseSpeed;

            // 障害物生成（予告フェーズは停止）
            if (speedMode !== 'prepare_slow' && speedMode !== 'prepare_fast') {
                spawnTimer++;
                if (spawnTimer >= nextSpawnInterval) {
                    let obsColor = (speedMode === 'slow') ? '#3388ff' : (speedMode === 'fast') ? '#ff33cc' : '#ff4444';
                    obstacles.push({
                        x: canvas.width,
                        y: groundY - 32,
                        width: 12,
                        height: 32,
                        color: obsColor
                    });
                    spawnTimer = 0;
                    nextSpawnInterval = Math.floor(Math.random() * 40) + 30;
                }
            }

            // 障害物の移動・当たり判定
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacleSpeed;

                const hitBoxX = player.x + 8;
                const hitBoxWidth = player.width - 16;
                const hitBoxY = player.y - player.height + 10;
                const hitBoxHeight = player.height - 28;

                if (
                    hitBoxX < obstacles[i].x + obstacles[i].width &&
                    hitBoxX + hitBoxWidth > obstacles[i].x &&
                    hitBoxY < obstacles[i].y + obstacles[i].height &&
                    hitBoxY + hitBoxHeight > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                if (obstacles[i].x < -obstacles[i].width) {
                    obstacles.splice(i, 1);
                    score++;
                }
            }

            if (score > highScore) highScore = score;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(800, groundY); ctx.stroke();

            // 障害物
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            // 棒人間
            drawStickman(player.x, player.y);

            // メッセージ
            if (actionMessage !== '') {
                ctx.fillStyle = '#ffaa00';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(actionMessage, canvas.width / 2, 100);
                ctx.textAlign = 'left';
            }

            // スコア
            ctx.fillStyle = '#333333';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('SCORE: ' + score, 30, 40);
            ctx.fillText('HI-SCORE: ' + highScore, 200, 40);

            // ゲームオーバー
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.font = '20px sans-serif';
                ctx.fillText('スコア: ' + score + '  /  ハイスコア: ' + highScore, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('画面タップ または ボタン/キー入力でリトライ', canvas.width / 2, canvas.height / 2 + 60);
                
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        // 初回起動
        loop();
    </script>
</body>
</html>
