<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒人間ジャンプゲーム</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #f0f0f0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 地面の位置
        const groundY = 300;

        // プレイヤー（棒人間）の設定（ジャンプ高さを2.5倍にしつつ、重力強化で0.1秒のシャープさを維持）
        const player = {
            x: 100,
            y: groundY,
            width: 30,
            height: 60,
            vy: 0,
            jumpPower: -60, // 高さを2.5倍スケールに強化
            gravity: 12.0,  // 重力も強化してキビキビした動きを維持
            isJumping: false
        };

        // 障害物の設定
        let obstacles = [];
        let obstacleSpeed = 5;
        let spawnTimer = 0;
        let nextSpawnInterval = 60;

        let score = 0;
        let highScore = 0;
        let isGameOver = false;

        // 速度変化のシステム管理用変数
        let speedMode = 'normal'; // 'normal', 'prepare_slow', 'slow', 'prepare_fast', 'fast'
        let modeTimer = 0;
        let actionMessage = '';
        let messageTimer = 0;

        // キー入力リスナー
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault(); // 画面スクロール防止
                if (!player.isJumping && !isGameOver) {
                    player.vy = player.jumpPower;
                    player.isJumping = true;
                } else if (isGameOver) {
                    resetGame();
                }
            }
        });

        // タップ/クリックでもジャンプ対応
        canvas.addEventListener('click', () => {
            if (!player.isJumping && !isGameOver) {
                player.vy = player.jumpPower;
                player.isJumping = true;
            } else if (isGameOver) {
                resetGame();
            }
        });

        // ゲームリセット
        function resetGame() {
            obstacles = [];
            obstacleSpeed = 5;
            spawnTimer = 0;
            nextSpawnInterval = 60;
            score = 0;
            speedMode = 'normal';
            modeTimer = 0;
            actionMessage = '';
            messageTimer = 0;
            isGameOver = false;
            loop();
        }

        // 棒人間の描画関数
        function drawStickman(x, y) {
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;

            // 頭
            ctx.beginPath();
            ctx.arc(x + 15, y - 50, 10, 0, Math.PI * 2);
            ctx.stroke();

            // 胴体
            ctx.beginPath();
            ctx.moveTo(x + 15, y - 40);
            ctx.lineTo(x + 15, y - 15);
            ctx.stroke();

            // 腕
            ctx.beginPath();
            ctx.moveTo(x + 15, y - 30);
            ctx.lineTo(x, y - 20);
            ctx.moveTo(x + 15, y - 30);
            ctx.lineTo(x + 30, y - 20);
            ctx.stroke();

            // 脚
            ctx.beginPath();
            ctx.moveTo(x + 15, y - 15);
            ctx.lineTo(x, y);
            ctx.moveTo(x + 15, y - 15);
            ctx.lineTo(x + 30, y);
            ctx.stroke();
        }

        // 更新処理
        function update() {
            if (isGameOver) return;

            // 物理演算（ジャンプと重力）
            player.vy += player.gravity;
            player.y += player.vy;

            // 地面との着地判定
            if (player.y >= groundY) {
                player.y = groundY;
                player.vy = 0;
                player.isJumping = false;
            }

            // スコアが5以上になったら、サイクル管理を開始
            if (score >= 5) {
                modeTimer++;
                if (modeTimer > 350 && speedMode === 'normal') {
                    speedMode = 'prepare_slow';
                    actionMessage = '⚠️ まもなくスローダウン！（2秒間クリアタイム）';
                    messageTimer = 140; 
                    modeTimer = 0;
                } else if (modeTimer > 350 && speedMode === 'slow') {
                    speedMode = 'prepare_fast';
                    actionMessage = '⚠️ まもなくスピードアップ！（2秒間クリアタイム）';
                    messageTimer = 140;
                    modeTimer = 0;
                }

                // 予告フェーズ（約2秒 = 120フレーム）が経過したら実際の速度へ変化
                if (speedMode === 'prepare_slow' && modeTimer > 120) {
                    speedMode = 'slow';
                    modeTimer = 0;
                } else if (speedMode === 'prepare_fast' && modeTimer > 120) {
                    speedMode = 'fast';
                    modeTimer = 0;
                } else if ((speedMode === 'slow' || speedMode === 'fast') && modeTimer > 400) {
                    speedMode = 'normal';
                    modeTimer = 0;
                }
            }

            // メッセージタイマーの減算
            if (messageTimer > 0) {
                messageTimer--;
                if (messageTimer === 0) actionMessage = '';
            }

            // スピードの決定
            let baseSpeed = 5 + Math.floor(score / 5);
            if (speedMode === 'slow') {
                obstacleSpeed = 3;
            } else if (speedMode === 'fast') {
                obstacleSpeed = baseSpeed + 2;
            } else {
                obstacleSpeed = baseSpeed;
            }

            // 予告フェーズの間は障害物生成を2秒間ストップ
            if (speedMode !== 'prepare_slow' && speedMode !== 'prepare_fast') {
                spawnTimer++;
                if (spawnTimer >= nextSpawnInterval) {
                    let obsColor = '#ff4444';
                    if (speedMode === 'slow') {
                        obsColor = '#3388ff';
                    } else if (speedMode === 'fast') {
                        obsColor = '#ff33cc';
                    }

                    obstacles.push({
                        x: canvas.width,
                        y: groundY - 32,
                        width: 12,
                        height: 32,
                        color: obsColor
                    });
                    spawnTimer = 0;
                    nextSpawnInterval = Math.floor(Math.random() * 40) + 30;
                }
            }

            // 障害物の移動・判定処理
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacleSpeed;

                // 当たり判定
                const hitBoxX = player.x + 8;
                const hitBoxWidth = player.width - 16;
                const hitBoxY = player.y - player.height + 10;
                const hitBoxHeight = player.height - 28;

                if (
                    hitBoxX < obstacles[i].x + obstacles[i].width &&
                    hitBoxX + hitBoxWidth > obstacles[i].x &&
                    hitBoxY < obstacles[i].y + obstacles[i].height &&
                    hitBoxY + hitBoxHeight > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                // 画面外に出た障害物を削除 ＆ スコア加算
                if (obstacles[i].x < -obstacles[i].width) {
                    obstacles.splice(i, 1);
                    score++;
                }
            }

            // ハイスコア更新
            if (score > highScore) {
                highScore = score;
            }
        }

        // 描画処理
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面を描画
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(800, groundY);
            ctx.stroke();

            // 障害物を描画
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            // 棒人間を描画
            drawStickman(player.x, player.y);

            // 予告メッセージの描画
            if (actionMessage !== '') {
                ctx.fillStyle = '#ffaa00';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(actionMessage, canvas.width / 2, 100);
                ctx.textAlign = 'left';
            }

            // スコア表描画
            ctx.fillStyle = '#333333';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('SCORE: ' + score, 30, 40);
            ctx.fillText('HI-SCORE: ' + highScore, 200, 40);

            // ゲームオーバー表示
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.font = '20px sans-serif';
                ctx.fillText('スコア: ' + score + '  /  ハイスコア: ' + highScore, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('スペースキー または タップでリトライ', canvas.width / 2, canvas.height / 2 + 60);
                
                ctx.textAlign = 'left';
            }
        }

        // メインゲームループ
        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        // 初回描画とゲーム開始
        loop();
    </script>

</body>
</html>
