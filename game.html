<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒人間ジャンプゲーム</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #f0f0f0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 地面の位置
        const groundY = 300;

        // プレイヤー（棒人間）の設定
        const player = {
            x: 100,
            y: groundY,
            width: 30,
            height: 60,
            vy: 0,
            jumpPower: -12,
            gravity: 0.6,
            isJumping: false
        };

        // 障害物の設定
        const obstacle = {
            x: 800,
            y: groundY - 40,
            width: 20,
            height: 40,
            speed: 5
        };

        let score = 0;
        let highScore = 0;
        let isGameOver = false;

        // キー入力リスナー
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault(); // 画面スクロール防止
                if (!player.isJumping && !isGameOver) {
                    player.vy = player.jumpPower;
                    player.isJumping = true;
                } else if (isGameOver) {
                    resetGame();
                }
            }
        });

        // タップ/クリックでもジャンプ対応
        canvas.addEventListener('click', () => {
            if (!player.isJumping && !isGameOver) {
                player.vy = player.jumpPower;
                player.isJumping = true;
            } else if (isGameOver) {
                resetGame();
            }
        });

        // ゲームリセット
        function resetGame() {
            obstacle.x = 800;
            obstacle.speed = 5;
            score = 0;
            isGameOver = false;
            loop();
        }

        // 棒人間の描画関数
        function drawStickman(x, y) {
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;

            // 頭
            ctx.beginPath();
            ctx.arc(x + 15, y - 50, 10, 0, Math.PI * 2);
            ctx.stroke();

            // 胴体
            ctx.beginPath();
            ctx.moveTo(x + 15, y - 40);
            ctx.lineTo(x + 15, y - 15);
            ctx.stroke();

            // 腕
            ctx.beginPath();
            ctx.moveTo(x + 15, y - 30);
            ctx.lineTo(x, y - 20);
            ctx.moveTo(x + 15, y - 30);
            ctx.lineTo(x + 30, y - 20);
            ctx.stroke();

            // 脚
            ctx.beginPath();
            ctx.moveTo(x + 15, y - 15);
            ctx.lineTo(x, y);
            ctx.moveTo(x + 15, y - 15);
            ctx.lineTo(x + 30, y);
            ctx.stroke();
        }

        // 更新処理
        function update() {
            if (isGameOver) return;

            // 物理演算（ジャンプと重力）
            player.vy += player.gravity;
            player.y += player.vy;

            // 地面との着地判定
            if (player.y >= groundY) {
                player.y = groundY;
                player.vy = 0;
                player.isJumping = false;
            }

            // 障害物の移動
            obstacle.x -= obstacle.speed;
            if (obstacle.x < -obstacle.width) {
                obstacle.x = 800;
                score++;
                // スコアに応じてスピードアップ
                obstacle.speed = 5 + Math.floor(score / 5);
            }

            // ハイスコア更新
            if (score > highScore) {
                highScore = score;
            }

            // 当たり判定
            if (
                player.x < obstacle.x + obstacle.width &&
                player.x + player.width > obstacle.x &&
                player.y - player.height < obstacle.y + obstacle.height &&
                player.y > obstacle.y
            ) {
                isGameOver = true;
            }
        }

        // 描画処理
        function draw() {
            // 画面クリア
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面を描画
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(800, groundY);
            ctx.stroke();

            // 障害物を描画
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

            // 棒人間を描画
            drawStickman(player.x, player.y);

            // スコア表（スコア ＆ ハイスコア）描画
            ctx.fillStyle = '#333333';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('SCORE: ' + score, 30, 40);
            ctx.fillText('HI-SCORE: ' + highScore, 200, 40);

            // ゲームオーバー表示
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.font = '20px sans-serif';
                ctx.fillText('スコア: ' + score + '  /  ハイスコア: ' + highScore, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('スペースキー または タップでリトライ', canvas.width / 2, canvas.height / 2 + 60);
                
                ctx.textAlign = 'left';
            }
        }

        // メインゲームループ
        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        // 初回描画（スタート前）
        draw();
        
        // ゲーム開始は最初のジャンプ、または自動開始する場合はloop()を呼ぶ
        loop();
    </script>

</body>
</html>
