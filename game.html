<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒人間ジャンプゲーム - 残像・ブレ軽減版</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
            box-sizing: border-box;
            padding: 5px;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #f0f0f0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 800px;
            height: auto;
            max-height: 62vh;
            object-fit: contain;
            cursor: pointer;
            image-rendering: -webkit-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-top: 10px;
            padding: 0 5px;
            box-sizing: border-box;
        }
        .controls button {
            flex: 1;
            margin: 0 4px;
            padding: 10px 4px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            background-color: #eeeeee;
            color: #1a1a1a;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.1s;
        }
        .controls button:active {
            background-color: #cccccc;
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }
        .btn-small-text {
            font-size: 10px;
            color: #666;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <button id="btn-left">速い (0.2秒)<span class="btn-small-text">画面左 / A・←</span></button>
            <button id="btn-center">ふんわり (0.4秒)<span class="btn-small-text">画面中央 / S・↓</span></button>
            <button id="btn-right">超ふんわり (0.6秒)<span class="btn-small-text">画面右 / D・→・Space</span></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // スムージング無効化（ドットをくっきり保つ）
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;
        ctx.msImageSmoothingEnabled = false;

        const btnLeft = document.getElementById('btn-left');
        const btnCenter = document.getElementById('btn-center');
        const btnRight = document.getElementById('btn-right');

        // 地面の位置
        const groundY = 300;

        // プレイヤー設定
        const player = {
            x: 100,
            y: groundY,
            width: 30,
            height: 60,
            vy: 0,
            
            // 超ふんわりジャンプ（0.6秒：最高到達点 約216px）
            jumpPowerSuperSlow: -23.33,
            gravitySuperSlow: 1.333,

            // ふんわりジャンプ（0.4秒：最高到達点 約216px）
            jumpPowerSlow: -35.0,  
            gravitySlow: 3.0,   
            
            // 速いジャンプ（0.2秒：最高到達点 約216px）
            jumpPowerFast: -72.0, 
            gravityFast: 12.0,   
            
            currentGravity: 12.0, 
            isJumping: false
        };

        // 障害物の設定
        let obstacles = [];
        let obstacleSpeed = 5;
        let spawnTimer = 0;
        let nextSpawnInterval = 60;

        let score = 0;
        let highScore = 0;
        let isGameOver = false;

        // 速度変化システム用変数
        let speedMode = 'normal';
        let targetNextMode = ''; 
        let modeTimer = 0;
        let modeDuration = 360;  // 各モードの持続時間（4秒〜12秒の間でランダム決定）
        let prepareTimer = 0;    // 予告（1.0秒間）カウント用タイマー
        let actionMessage = '';

        // モードの持続時間を4秒〜12秒（240〜720フレーム）でランダム生成する関数
        function getRandomModeDuration() {
            return Math.floor(Math.random() * (720 - 240 + 1)) + 240;
        }

        // --- 操作系関数 ---
        function doJump(type) {
            if (!player.isJumping && !isGameOver) {
                if (type === 'fast') {
                    player.vy = player.jumpPowerFast;
                    player.currentGravity = player.gravityFast;
                } else if (type === 'slow') {
                    player.vy = player.jumpPowerSlow;
                    player.currentGravity = player.gravitySlow;
                } else if (type === 'superSlow') {
                    player.vy = player.jumpPowerSuperSlow;
                    player.currentGravity = player.gravitySuperSlow;
                }
                player.isJumping = true;
            } else if (isGameOver) {
                resetGame();
            }
        }

        // キーボード操作
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                e.preventDefault();
                doJump('fast');
            } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                e.preventDefault();
                doJump('slow');
            } else if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                doJump('superSlow');
            }
        });

        // 画面タップ操作
        canvas.addEventListener('mousedown', handleCanvasTap);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            handleCanvasTap(e.touches[0]);
        }, { passive: false });

        function handleCanvasTap(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const x = (e.clientX - rect.left) * scaleX;
            const third = canvas.width / 3;

            if (x < third) {
                doJump('fast');
            } else if (x < third * 2) {
                doJump('slow');
            } else {
                doJump('superSlow');
            }
        }

        // ボタン操作
        btnLeft.addEventListener('mousedown', () => doJump('fast'));
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('fast'); }, { passive: false });
        
        btnCenter.addEventListener('mousedown', () => doJump('slow'));
        btnCenter.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('slow'); }, { passive: false });

        btnRight.addEventListener('mousedown', () => doJump('superSlow'));
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('superSlow'); }, { passive: false });


        // --- ゲーム進行関数 ---
        function resetGame() {
            obstacles = [];
            obstacleSpeed = 5;
            spawnTimer = 0;
            nextSpawnInterval = 60;
            score = 0;
            speedMode = 'normal';
            targetNextMode = '';
            modeTimer = 0;
            modeDuration = getRandomModeDuration();
            prepareTimer = 0;
            actionMessage = '';
            isGameOver = false;
            loop();
        }

        function drawStickman(x, y) {
            const rx = Math.round(x);
            const ry = Math.round(y);

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(rx + 15, ry - 50, 10, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 40); ctx.lineTo(rx + 15, ry - 15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 30); ctx.lineTo(rx, ry - 20); ctx.moveTo(rx + 15, ry - 30); ctx.lineTo(rx + 30, ry - 20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 15); ctx.lineTo(rx, ry); ctx.moveTo(rx + 15, ry - 15); ctx.lineTo(rx + 30, ry); ctx.stroke();
        }

        function update() {
            if (isGameOver) return;

            // 物理演算
            player.vy += player.currentGravity;
            player.y += player.vy;

            // 着地判定
            if (player.y >= groundY) {
                player.y = groundY;
                player.vy = 0;
                player.isJumping = false;
            }

            // --- ランダム速度変化システム ---
            if (score >= 5) {
                if (!speedMode.startsWith('prepare_')) {
                    modeTimer++;
                    
                    if (modeTimer > modeDuration) {
                        if (obstacles.length === 0) {
                            prepareTimer = 0;
                            
                            const candidateModes = ['normal', 'slow', 'fast'].filter(m => m !== speedMode);
                            targetNextMode = candidateModes[Math.floor(Math.random() * candidateModes.length)];

                            if (targetNextMode === 'slow') {
                                speedMode = 'prepare_slow';
                                actionMessage = '⚠️ まもなくスローダウン！（1.0秒）';
                            } else if (targetNextMode === 'fast') {
                                speedMode = 'prepare_fast';
                                actionMessage = '⚠️ まもなくスピードアップ！（1.0秒）';
                            } else {
                                speedMode = 'prepare_normal';
                                actionMessage = '⚠️ まもなく標準スピード！（1.0秒）';
                            }
                        }
                    }
                } else {
                    prepareTimer++;
                    if (prepareTimer >= 60) {
                        speedMode = targetNextMode;
                        actionMessage = '';
                        modeTimer = 0;
                        prepareTimer = 0;
                        modeDuration = getRandomModeDuration();
                    }
                }
            }

            // スコア上昇による基本スピード
            let baseSpeed = 5 + Math.floor(score / 5);

            // モードに応じた障害物スピードの適用
            if (speedMode === 'slow') {
                obstacleSpeed = 3; 
            } else if (speedMode === 'fast') {
                obstacleSpeed = baseSpeed + 4; 
            } else {
                obstacleSpeed = baseSpeed; 
            }

            // 障害物生成
            const isWaitingForClear = (!speedMode.startsWith('prepare_') && modeTimer > modeDuration);
            if (!speedMode.startsWith('prepare_') && !isWaitingForClear) {
                spawnTimer++;
                if (spawnTimer >= nextSpawnInterval) {
                    let obsColor = (speedMode === 'slow') ? '#3388ff' : (speedMode === 'fast') ? '#ff33cc' : '#ff4444';
                    obstacles.push({
                        x: canvas.width,
                        y: groundY - 32,
                        width: 16,  // ★幅を12pxから16pxに少し太くして高速移動時の二重見えを防止
                        height: 32,
                        color: obsColor
                    });
                    spawnTimer = 0;
                    nextSpawnInterval = Math.floor(Math.random() * 40) + 30;
                }
            }

            // 障害物の移動・当たり判定
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacleSpeed;

                const hitBoxX = player.x + 8;
                const hitBoxWidth = player.width - 16;
                const hitBoxY = player.y - player.height + 10;
                const hitBoxHeight = player.height - 28;

                if (
                    hitBoxX < obstacles[i].x + obstacles[i].width &&
                    hitBoxX + hitBoxWidth > obstacles[i].x &&
                    hitBoxY < obstacles[i].y + obstacles[i].height &&
                    hitBoxY + hitBoxHeight > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                if (obstacles[i].x < -obstacles[i].width) {
                    obstacles.splice(i, 1);
                    score++;
                }
            }

            if (score > highScore) highScore = score;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(800, groundY); ctx.stroke();

            // 障害物（Math.roundでピクセル単位にスナップ）
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(Math.round(obs.x), Math.round(obs.y), obs.width, obs.height);
            });

            // 棒人間
            drawStickman(player.x, player.y);

            // メッセージ
            if (actionMessage !== '') {
                ctx.fillStyle = '#ffaa00';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(actionMessage, canvas.width / 2, 100);
                ctx.textAlign = 'left';
            }

            // スコア
            ctx.fillStyle = '#333333';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('SCORE: ' + score, 30, 40);
            ctx.fillText('HI-SCORE: ' + highScore, 200, 40);

            // ゲームオーバー
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.font = '20px sans-serif';
                ctx.fillText('スコア: ' + score + '  /  ハイスコア: ' + highScore, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('画面タップ または ボタン/キー入力でリトライ', canvas.width / 2, canvas.height / 2 + 60);
                
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        // 初回起動
        loop();
    </script>
</body>
</html>
