<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒人間ジャンプゲーム - 究極の激流モード</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
            box-sizing: border-box;
            padding: 5px;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #f0f0f0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 800px;
            height: auto;
            max-height: 62vh;
            object-fit: contain;
            cursor: pointer;
            image-rendering: -webkit-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-top: 10px;
            padding: 0 5px;
            box-sizing: border-box;
        }
        .controls button {
            flex: 1;
            margin: 0 4px;
            padding: 10px 4px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            background-color: #eeeeee;
            color: #1a1a1a;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.1s;
        }
        .controls button:active {
            background-color: #cccccc;
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }
        .btn-small-text {
            font-size: 10px;
            color: #666;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <button id="btn-left">速い (0.2秒)<span class="btn-small-text">画面左 / A・←</span></button>
            <button id="btn-center">ふんわり (0.4秒)<span class="btn-small-text">画面中央 / S・↓</span></button>
            <button id="btn-right">超ふんわり (0.6秒)<span class="btn-small-text">画面右 / D・→・Space</span></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;
        ctx.msImageSmoothingEnabled = false;

        const btnLeft = document.getElementById('btn-left');
        const btnCenter = document.getElementById('btn-center');
        const btnRight = document.getElementById('btn-right');

        const groundY = 300;

        const player = {
            x: 100,
            y: groundY,
            width: 30,
            height: 60,
            vy: 0,
            jumpPowerSuperSlow: -23.33,
            gravitySuperSlow: 1.333,
            jumpPowerSlow: -35.0,  
            gravitySlow: 3.0,   
            jumpPowerFast: -72.0, 
            gravityFast: 12.0,   
            currentGravity: 12.0, 
            isJumping: false
        };

        let obstacles = [];
        let crackers = [];  
        let fireworks = []; 
        let godParticles = []; 
        
        let obstacleSpeed = 5;
        let spawnTimer = 0;
        let nextSpawnInterval = 100;
        let pendingDoubleJump = 0; 

        let score = 0;
        let highScore = 0;
        let isGameOver = false;
        let hasTriggered100Celebration = false;
        let hasTriggered200Celebration = false;
        let hasTriggered300Celebration = false; 

        let speedMode = 'normal';
        let targetNextMode = ''; 
        let modeTimer = 0;
        let modeDuration = 180;  
        let prepareTimer = 0;    
        let actionMessage = '';
        let warningTimer = 0; 

        function getRandomModeDuration() {
            if (score >= 200) {
                return Math.floor(Math.random() * (420 - 300 + 1)) + 300;
            } else if (score >= 100) {
                return Math.floor(Math.random() * (600 - 300 + 1)) + 300;
            } else {
                return Math.floor(Math.random() * (360 - 180 + 1)) + 180; 
            }
        }

        function triggerCracker() {
            const colors = ['#ff0055', '#00ffcc', '#ffff00', '#ff5500', '#00ff00', '#0088ff', '#ff00ff', '#ffffff'];
            const spawnPoints = [{ x: 100, y: 150 }, { x: 400, y: 100 }, { x: 700, y: 150 }];
            spawnPoints.forEach(pt => {
                for (let i = 0; i < 100; i++) {
                    const angle = Math.random() * Math.PI - Math.PI / 2;
                    const speed = Math.random() * 12 + 3;
                    crackers.push({
                        x: pt.x, y: pt.y,
                        vx: Math.cos(angle) * speed * (pt.x === 400 ? (Math.random() - 0.5) * 2 : (pt.x < 400 ? 1 : -1)),
                        vy: Math.sin(angle) * speed - 4,
                        sizeW: Math.random() * 10 + 4, sizeH: Math.random() * 6 + 3,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 1.0, rotation: Math.random() * Math.PI * 2, vRot: (Math.random() - 0.5) * 0.3,
                        shapeType: Math.random() > 0.5 ? 'rect' : 'line'
                    });
                }
            });
        }
        function triggerFireworks() {
            const colors = ['#ff2244', '#44ff44', '#4488ff', '#ffff44', '#ff44ff', '#44ffff', '#ffaa00'];
            const fireworkCenters = [{ x: 250, y: 120 }, { x: 550, y: 100 }, { x: 400, y: 160 }];
            fireworkCenters.forEach((center, index) => {
                setTimeout(() => {
                    if (isGameOver) return;
                    for (let i = 0; i < 70; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 7 + 2;
                        fireworks.push({
                            x: center.x, y: center.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                            size: Math.random() * 5 + 3, color: colors[Math.floor(Math.random() * colors.length)], alpha: 1.0
                        });
                    }
                }, index * 400);
            });
        }

        function triggerGodCelebration() {
            const godColors = ['#ff00ff', '#00ffff', '#ffff00', '#ff8800', '#00ff88', '#ffffff'];
            for (let i = 0; i < 150; i++) {
                godParticles.push({
                    x: Math.random() * canvas.width * 1.5, y: Math.random() * -canvas.height,
                    vx: -(Math.random() * 6 + 4), vy: Math.random() * 6 + 4,
                    size: Math.random() * 4 + 2, color: godColors[Math.floor(Math.random() * godColors.length)],
                    alpha: Math.random() * 0.8 + 0.2, isShootingStar: true
                });
            }
            for (let i = 0; i < 100; i++) {
                godParticles.push({
                    x: Math.random() * canvas.width, y: groundY,
                    vx: (Math.random() - 0.5) * 4, vy: -(Math.random() * 8 + 2), 
                    size: Math.random() * 6 + 3, color: godColors[Math.floor(Math.random() * godColors.length)],
                    alpha: 1.0, isShootingStar: false
                });
            }
        }

        function doJump(type) {
            if (!player.isJumping && !isGameOver) {
                if (type === 'fast') {
                    player.vy = player.jumpPowerFast; player.currentGravity = player.gravityFast;
                } else if (type === 'slow') {
                    player.vy = player.jumpPowerSlow; player.currentGravity = player.gravitySlow;
                } else if (type === 'superSlow') {
                    player.vy = player.jumpPowerSuperSlow; player.currentGravity = player.gravitySuperSlow;
                }
                player.isJumping = true;
            } else if (isGameOver) {
                resetGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); doJump('fast'); }
            else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); doJump('slow'); }
            else if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); doJump('superSlow'); }
        });

        canvas.addEventListener('mousedown', handleCanvasTap);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleCanvasTap(e.touches[0]); }, { passive: false });

        function handleCanvasTap(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const x = (e.clientX - rect.left) * scaleX;
            if (x < canvas.width / 3) doJump('fast');
            else if (x < canvas.width / 3 * 2) doJump('slow');
            else doJump('superSlow');
        }

        btnLeft.addEventListener('mousedown', () => doJump('fast'));
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('fast'); }, { passive: false });
        btnCenter.addEventListener('mousedown', () => doJump('slow'));
        btnCenter.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('slow'); }, { passive: false });
        btnRight.addEventListener('mousedown', () => doJump('superSlow'));
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('superSlow'); }, { passive: false });

        function resetGame() {
            obstacles = []; crackers = []; fireworks = []; godParticles = [];
            obstacleSpeed = 5; spawnTimer = 0; nextSpawnInterval = 100; pendingDoubleJump = 0;
            score = 0; speedMode = 'normal'; targetNextMode = '';
            modeTimer = 0; modeDuration = getRandomModeDuration();
            prepareTimer = 0; warningTimer = 0; actionMessage = '';
            hasTriggered100Celebration = false; hasTriggered200Celebration = false; hasTriggered300Celebration = false;
            isGameOver = false;
            loop();
        }

        function drawStickman(x, y) {
            const rx = Math.round(x); const ry = Math.round(y);
            ctx.strokeStyle = '#000000'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(rx + 15, ry - 50, 10, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 40); ctx.lineTo(rx + 15, ry - 15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 30); ctx.lineTo(rx, ry - 20); ctx.moveTo(rx + 15, ry - 30); ctx.lineTo(rx + 30, ry - 20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 15); ctx.lineTo(rx, ry); ctx.moveTo(rx + 15, ry - 15); ctx.lineTo(rx + 30, ry); ctx.stroke();
        }

        function update() {
            if (isGameOver) return;

            player.vy += player.currentGravity;
            player.y += player.vy;

            if (player.y >= groundY) {
                player.y = groundY; player.vy = 0; player.isJumping = false;
            }

            if (score >= 100 && !hasTriggered100Celebration) { hasTriggered100Celebration = true; triggerCracker(); }
            if (score >= 200 && !hasTriggered200Celebration) { hasTriggered200Celebration = true; triggerFireworks(); }
            if (score >= 300 && !hasTriggered300Celebration) { hasTriggered300Celebration = true; triggerGodCelebration(); }

            if (score >= 300) obstacleSpeed = 8.5;
            else if (score >= 200) obstacleSpeed = 7.5;
            else if (score >= 100) obstacleSpeed = 6.5;
            else obstacleSpeed = 5 + Math.floor(score / 20) * 0.4;

            if (prepareTimer > 0) {
                prepareTimer--;
                if (prepareTimer === 0) {
                    speedMode = targetNextMode;
                    if (speedMode === 'fast') actionMessage = '⚡【速い】モード！';
                    else if (speedMode === 'slow') actionMessage = '🍃【ふんわり】モード！';
                    else if (speedMode === 'superSlow') actionMessage = '🪶【超ふんわり】モード！';
                    setTimeout(() => { actionMessage = ''; }, 1000);
                }
            } else if (warningTimer > 0) {
                warningTimer--;
                if (warningTimer === 0) {
                    const modes = ['fast', 'slow', 'superSlow'];
                    let next;
                    do { next = modes[Math.floor(Math.random() * modes.length)]; } while (next === speedMode);
                    targetNextMode = next;
                    
                    if (score >= 200) {
                        prepareTimer = 0; speedMode = targetNextMode;
                        if (speedMode === 'fast') actionMessage = '⚡【速い】モード！';
                        else if (speedMode === 'slow') actionMessage = '🍃【ふんわり】モード！';
                        else if (speedMode === 'superSlow') actionMessage = '🪶【超ふんわり】モード！';
                        setTimeout(() => { actionMessage = ''; }, 1000);
                    } else if (score >= 100) {
                        prepareTimer = 18; 
                    } else {
                        prepareTimer = 42; 
                    }
                    modeTimer = 0; modeDuration = getRandomModeDuration();
                }
            } else {
                modeTimer++;
                if (modeTimer >= modeDuration) warningTimer = 30; 
            }

            // 警告中や準備中（インターバル）は障害物を生成しない
            if (warningTimer === 0 && prepareTimer === 0) {
                spawnTimer++;
            }

            let currentSpawnLimit = nextSpawnInterval;
            if (score >= 200) {
                currentSpawnLimit = Math.max(45, nextSpawnInterval - Math.floor((score - 200) / 10) * 2);
            }

            if (spawnTimer >= currentSpawnLimit) {
                spawnTimer = 0;
                let h = 40; let type = 'normal'; let isDouble = false;

                if (score >= 100 && Math.random() < 0.35) isDouble = true;

                if (speedMode === 'fast') h = Math.random() < 0.5 ? 40 : 65;
                else if (speedMode === 'slow') h = Math.random() < 0.5 ? 35 : 75;
                else if (speedMode === 'superSlow') h = Math.random() < 0.5 ? 30 : 90;
                else h = Math.random() < 0.5 ? 40 : 60;

                if (isDouble) {
                    obstacles.push({ x: canvas.width, y: groundY - 40, width: 20, height: 40, passed: false });
                    pendingDoubleJump = 35; 
                } else if (pendingDoubleJump > 0) {
                    pendingDoubleJump--;
                    obstacles.push({ x: canvas.width, y: groundY - 75, width: 20, height: 35, passed: false });
                } else {
                    obstacles.push({ x: canvas.width, y: groundY - h, width: 20, height: h, passed: false });
                }

                let baseInterval = 100 - Math.floor(score / 5);
                if (score >= 200) baseInterval = Math.floor(Math.random() * 25) + 40; 
                else baseInterval = Math.max(55, baseInterval);
                nextSpawnInterval = baseInterval + Math.floor(Math.random() * 30) - 15;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= obstacleSpeed;

                if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
                    player.y > obs.y && player.y - player.height < obs.y + obs.height) {
                    isGameOver = true;
                    if (score > highScore) highScore = score;
                }

                if (!obs.passed && obs.x + obs.width < player.x) { obs.passed = true; score++; }
                if (obs.x + obs.width < 0) obstacles.splice(i, 1);
            }

            for (let i = crackers.length - 1; i >= 0; i--) {
                let c = crackers[i];
                c.x += c.vx; c.y += c.vy; c.vy += 0.4; c.rotation += c.vRot; c.alpha -= 0.012;
                if (c.alpha <= 0 || c.y > canvas.height) crackers.splice(i, 1);
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                let f = fireworks[i];
                f.x += f.vx; f.y += f.vy; f.vy += 0.15; f.alpha -= 0.015;
                if (f.alpha <= 0) fireworks.splice(i, 1);
            }

            for (let i = godParticles.length - 1; i >= 0; i--) {
                let gp = godParticles[i];
                gp.x += gp.vx; gp.y += gp.vy;
                if (!gp.isShootingStar) gp.vy += 0.2; 
                gp.alpha -= 0.005;
                if (gp.alpha <= 0 || gp.y > canvas.height + 50) godParticles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = '#f0f0f0'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#333333'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

            drawStickman(player.x, player.y);

            ctx.fillStyle = '#ff3344';
            obstacles.forEach(obs => {
                ctx.fillRect(Math.round(obs.x), Math.round(obs.y), obs.width, obs.height);
                ctx.strokeStyle = '#990011'; ctx.lineWidth = 2;
                ctx.strokeRect(Math.round(obs.x), Math.round(obs.y), obs.width, obs.height);
            });

            crackers.forEach(c => {
                ctx.save(); ctx.translate(Math.round(c.x), Math.round(c.y)); ctx.rotate(c.rotation);
                ctx.globalAlpha = Math.max(0, c.alpha); ctx.fillStyle = c.color; ctx.strokeStyle = c.color;
                if (c.shapeType === 'rect') ctx.fillRect(-c.sizeW / 2, -c.sizeH / 2, c.sizeW, c.sizeH);
                else { ctx.beginPath(); ctx.moveTo(-c.sizeW, 0); ctx.lineTo(c.sizeW, 0); ctx.lineWidth = 3; ctx.stroke(); }
                ctx.restore();
            });

            fireworks.forEach(f => {
                ctx.save(); ctx.globalAlpha = Math.max(0, f.alpha); ctx.fillStyle = f.color;
                ctx.beginPath(); ctx.arc(Math.round(f.x), Math.round(f.y), f.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            });

            godParticles.forEach(gp => {
                ctx.save(); ctx.globalAlpha = Math.max(0, gp.alpha); ctx.fillStyle = gp.color;
                ctx.beginPath(); ctx.arc(Math.round(gp.x), Math.round(gp.y), gp.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            });

            ctx.fillStyle = '#333333'; ctx.font = 'bold 20px sans-serif';
            ctx.fillText(`SCORE: ${score}`, 20, 40); ctx.fillText(`HIGH SCORE: ${highScore}`, 20, 70);

            let modeText = '通常モード'; let modeColor = '#333333';
            if (speedMode === 'fast') { modeText = '⚡ 速いモード'; modeColor = '#ff3344'; }
            else if (speedMode === 'slow') { modeText = '🍃 ふんわりモード'; modeColor = '#00aa55'; }
            else if (speedMode === 'superSlow') { modeText = '🪶 超ふんわりモード'; modeColor = '#0066ff'; }

            ctx.fillStyle = modeColor; ctx.font = 'bold 18px sans-serif';
            ctx.fillText(modeText, canvas.width - 200, 40);

            if (warningTimer > 0) {
                ctx.fillStyle = Math.floor(warningTimer / 5) % 2 === 0 ? '#ff0000' : '#ffaa00';
                ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('⚠️ WARNING ⚠️', canvas.width / 2, 130); ctx.textAlign = 'left';
            } else if (prepareTimer > 0) {
                ctx.fillStyle = '#ff8800'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('まもなくモード切替...', canvas.width / 2, 130); ctx.textAlign = 'left';
            }

            if (actionMessage) {
                ctx.fillStyle = '#ff0055'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(actionMessage, canvas.width / 2, 170); ctx.textAlign = 'left';
            }

            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = 'bold 18px sans-serif'; ctx.fillText('クリック または キー/ボタン押下でリトライ', canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update(); draw();
            if (!isGameOver) requestAnimationFrame(loop);
        }

        resetGame();
    </script>
</body>
</html>
