<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒人間ジャンプゲーム - 2秒インターバル厳格化版</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #f0f0f0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            max-width: 100%;
            height: auto;
            cursor: pointer;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            padding: 0 5px;
            box-sizing: border-box;
        }
        .controls button {
            flex: 1;
            margin: 0 5px;
            padding: 12px 5px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            background-color: #eeeeee;
            color: #1a1a1a;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.1s;
        }
        .controls button:active {
            background-color: #cccccc;
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }
        .btn-small-text {
            font-size: 11px;
            color: #666;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <button id="btn-left">速い (0.1秒)<span class="btn-small-text">画面左 / A・←</span></button>
            <button id="btn-center">ふんわり (0.4秒)<span class="btn-small-text">画面中央 / S・↓</span></button>
            <button id="btn-right">超ふんわり (0.6秒)<span class="btn-small-text">画面右 / D・→・Space</span></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btnLeft = document.getElementById('btn-left');
        const btnCenter = document.getElementById('btn-center');
        const btnRight = document.getElementById('btn-right');

        // 地面の位置
        const groundY = 300;

        // プレイヤー設定
        const player = {
            x: 100,
            y: groundY,
            width: 30,
            height: 60,
            vy: 0,
            
            // 超ふんわりジャンプ（0.6秒）
            jumpPowerSuperSlow: -23.33,
            gravitySuperSlow: 1.333,

            // ふんわりジャンプ（0.4秒）
            jumpPowerSlow: -35.0,  
            gravitySlow: 3.0,   
            
            // 速いジャンプ（0.1秒）
            jumpPowerFast: -140.0, 
            gravityFast: 48.0,   
            
            currentGravity: 12.0, 
            isJumping: false
        };

        // 障害物の設定
        let obstacles = [];
        let obstacleSpeed = 5;
        let spawnTimer = 0;
        let nextSpawnInterval = 60;

        let score = 0;
        let highScore = 0;
        let isGameOver = false;

        // 速度変化システム用変数
        let speedMode = 'normal';
        let modeTimer = 0;
        let prepareTimer = 0; // 予告（2秒間）のカウント専用タイマー
        let actionMessage = '';

        // --- 操作系関数 ---
        function doJump(type) {
            if (!player.isJumping && !isGameOver) {
                if (type === 'fast') {
                    player.vy = player.jumpPowerFast;
                    player.currentGravity = player.gravityFast;
                } else if (type === 'slow') {
                    player.vy = player.jumpPowerSlow;
                    player.currentGravity = player.gravitySlow;
                } else if (type === 'superSlow') {
                    player.vy = player.jumpPowerSuperSlow;
                    player.currentGravity = player.gravitySuperSlow;
                }
                player.isJumping = true;
            } else if (isGameOver) {
                resetGame();
            }
        }

        // キーボード操作
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                e.preventDefault();
                doJump('fast');
            } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                e.preventDefault();
                doJump('slow');
            } else if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                doJump('superSlow');
            }
        });

        // 画面タップ操作
        canvas.addEventListener('mousedown', handleCanvasTap);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            handleCanvasTap(e.touches[0]);
        }, { passive: false });

        function handleCanvasTap(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const third = rect.width / 3;

            if (x < third) {
                doJump('fast');
            } else if (x < third * 2) {
                doJump('slow');
            } else {
                doJump('superSlow');
            }
        }

        // ボタン操作
        btnLeft.addEventListener('mousedown', () => doJump('fast'));
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('fast'); }, { passive: false });
        
        btnCenter.addEventListener('mousedown', () => doJump('slow'));
        btnCenter.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('slow'); }, { passive: false });

        btnRight.addEventListener('mousedown', () => doJump('superSlow'));
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('superSlow'); }, { passive: false });


        // --- ゲーム進行関数 ---
        function resetGame() {
            obstacles = [];
            obstacleSpeed = 5;
            spawnTimer = 0;
            nextSpawnInterval = 60;
            score = 0;
            speedMode = 'normal';
            modeTimer = 0;
            prepareTimer = 0;
            actionMessage = '';
            isGameOver = false;
            loop();
        }

        function drawStickman(x, y) {
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(x + 15, y - 50, 10, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + 15, y - 40); ctx.lineTo(x + 15, y - 15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + 15, y - 30); ctx.lineTo(x, y - 20); ctx.moveTo(x + 15, y - 30); ctx.lineTo(x + 30, y - 20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + 15, y - 15); ctx.lineTo(x, y); ctx.moveTo(x + 15, y - 15); ctx.lineTo(x + 30, y); ctx.stroke();
        }

        function update() {
            if (isGameOver) return;

            // 物理演算
            player.vy += player.currentGravity;
            player.y += player.vy;

            // 着地判定
            if (player.y >= groundY) {
                player.y = groundY;
                player.vy = 0;
                player.isJumping = false;
            }

            // --- 速度変化システム（5点以上で発動） ---
            if (score >= 5) {
                if (!speedMode.startsWith('prepare_')) {
                    modeTimer++;
                    // 各モードが約6秒（360フレーム）持続したら予告フェーズへ
                    if (modeTimer > 360) {
                        prepareTimer = 0;
                        if (speedMode === 'normal') {
                            speedMode = 'prepare_slow';
                            actionMessage = '⚠️ まもなくスローダウン！（2秒間クリアタイム）';
                        } else if (speedMode === 'slow') {
                            speedMode = 'prepare_fast';
                            actionMessage = '⚠️ まもなくスピードアップ！（2秒間クリアタイム）';
                        } else if (speedMode === 'fast') {
                            speedMode = 'prepare_slow';
                            actionMessage = '⚠️ まもなくスローダウン！（2秒間クリアタイム）';
                        }
                    }
                } else {
                    // 予告（2秒間＝120フレーム）の待機処理
                    prepareTimer++;
                    if (prepareTimer >= 120) {
                        if (speedMode === 'prepare_slow') speedMode = 'slow';
                        else if (speedMode === 'prepare_fast') speedMode = 'fast';
                        else if (speedMode === 'prepare_normal') speedMode = 'normal';
                        
                        actionMessage = '';
                        modeTimer = 0;
                        prepareTimer = 0;
                    }
                }
            }

            // 障害物のスピード設定（予告中も直前の速度を維持）
            let baseSpeed = 5 + Math.floor(score / 5);
            if (speedMode === 'slow' || speedMode === 'prepare_fast') obstacleSpeed = 3;
            else if (speedMode === 'fast' || speedMode === 'prepare_slow') obstacleSpeed = baseSpeed + 2;
            else obstacleSpeed = baseSpeed;

            // 障害物生成（予告フェーズ中は生成しない）
            if (!speedMode.startsWith('prepare_')) {
                spawnTimer++;
                if (spawnTimer >= nextSpawnInterval) {
                    let obsColor = (speedMode === 'slow') ? '#3388ff' : (speedMode === 'fast') ? '#ff33cc' : '#ff4444';
                    obstacles.push({
                        x: canvas.width,
                        y: groundY - 32,
                        width: 12,
                        height: 32,
                        color: obsColor
                    });
                    spawnTimer = 0;
                    nextSpawnInterval = Math.floor(Math.random() * 40) + 30;
                }
            }

            // 障害物の移動・当たり判定
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacleSpeed;

                const hitBoxX = player.x + 8;
                const hitBoxWidth = player.width - 16;
                const hitBoxY = player.y - player.height + 10;
                const hitBoxHeight = player.height - 28;

                if (
                    hitBoxX < obstacles[i].x + obstacles[i].width &&
                    hitBoxX + hitBoxWidth > obstacles[i].x &&
                    hitBoxY < obstacles[i].y + obstacles[i].height &&
                    hitBoxY + hitBoxHeight > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                if (obstacles[i].x < -obstacles[i].width) {
                    obstacles.splice(i, 1);
                    score++;
                }
            }

            if (score > highScore) highScore = score;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(800, groundY); ctx.stroke();

            // 障害物
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            // 棒人間
            drawStickman(player.x, player.y);

            // メッセージ
            if (actionMessage !== '') {
                ctx.fillStyle = '#ffaa00';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(actionMessage, canvas.width / 2, 100);
                ctx.textAlign = 'left';
            }

            // スコア
            ctx.fillStyle = '#333333';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('SCORE: ' + score, 30, 40);
            ctx.fillText('HI-SCORE: ' + highScore, 200, 40);

            // ゲームオーバー
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.font = '20px sans-serif';
                ctx.fillText('スコア: ' + score + '  /  ハイスコア: ' + highScore, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('画面タップ または ボタン/キー入力でリトライ', canvas.width / 2, canvas.height / 2 + 60);
                
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        // 初回起動
        loop();
    </script>
</body>
</html>
