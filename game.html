<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒人間ジャンプゲーム - 序盤ゆったり・得点スピードアップ版</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
            box-sizing: border-box;
            padding: 5px;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #f0f0f0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 800px;
            height: auto;
            max-height: 62vh;
            object-fit: contain;
            cursor: pointer;
            image-rendering: -webkit-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-top: 10px;
            padding: 0 5px;
            box-sizing: border-box;
        }
        .controls button {
            flex: 1;
            margin: 0 4px;
            padding: 10px 4px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            background-color: #eeeeee;
            color: #1a1a1a;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.1s;
        }
        .controls button:active {
            background-color: #cccccc;
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }
        .btn-small-text {
            font-size: 10px;
            color: #666;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <button id="btn-left">速い (0.2秒)<span class="btn-small-text">画面左 / A・←</span></button>
            <button id="btn-center">ふんわり (0.4秒)<span class="btn-small-text">画面中央 / S・↓</span></button>
            <button id="btn-right">超ふんわり (0.6秒)<span class="btn-small-text">画面右 / D・→・Space</span></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // スムージング無効化
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;
        ctx.msImageSmoothingEnabled = false;

        const btnLeft = document.getElementById('btn-left');
        const btnCenter = document.getElementById('btn-center');
        const btnRight = document.getElementById('btn-right');

        // 地面の位置
        const groundY = 300;

        // プレイヤー設定
        const player = {
            x: 100,
            y: groundY,
            width: 30,
            height: 60,
            vy: 0,
            
            // ジャンプ設定
            jumpPowerSuperSlow: -23.33,
            gravitySuperSlow: 1.333,
            jumpPowerSlow: -35.0,  
            gravitySlow: 3.0,   
            jumpPowerFast: -72.0, 
            gravityFast: 12.0,   
            
            currentGravity: 12.0, 
            isJumping: false
        };

        // 障害物・演出パーティクルの設定
        let obstacles = [];
        let crackers = [];  
        let fireworks = []; 
        let godParticles = []; 
        
        let obstacleSpeed = 5;
        let spawnTimer = 0;
        let nextSpawnInterval = 100;
        let extraObstacleTimer = 0; // 詰めた間隔で挟む追加障害物の待機フレーム

        let score = 0;
        let highScore = 0;
        let isGameOver = false;
        let hasTriggered100Celebration = false;
        let hasTriggered200Celebration = false;
        let hasTriggered300Celebration = false; 

        // 速度変化システム用変数
        let speedMode = 'fast';
        let targetNextMode = '';
        let modeTimer = 0;
        let modeDuration = 180;
        let prepareTimer = 0;
        let actionMessage = '';
        let warningTimer = 0;
        let pendingSwitch = false; // 障害物が画面から消えるまで切り替えを保留

        function getRandomModeDuration() {
            if (score >= 200) {
                // 200点以上：4秒〜12秒のランダム (240〜720フレーム)
                return Math.floor(Math.random() * (720 - 240 + 1)) + 240;
            }
            // 200点未満：6秒〜15秒のランダム (360〜900フレーム)
            return Math.floor(Math.random() * (900 - 360 + 1)) + 360;
        }

        // --- 超・派手クラッカー発動関数（100点） ---
        function triggerCracker() {
            const colors = ['#ff0055', '#00ffcc', '#ffff00', '#ff5500', '#00ff00', '#0088ff', '#ff00ff', '#ffffff'];
            const spawnPoints = [
                { x: 100, y: 150 }, 
                { x: 400, y: 100 }, 
                { x: 700, y: 150 }
            ];

            spawnPoints.forEach(pt => {
                for (let i = 0; i < 100; i++) {
                    const angle = Math.random() * Math.PI - Math.PI / 2;
                    const speed = Math.random() * 12 + 3;
                    crackers.push({
                        x: pt.x,
                        y: pt.y,
                        vx: Math.cos(angle) * speed * (pt.x === 400 ? (Math.random() - 0.5) * 2 : (pt.x < 400 ? 1 : -1)),
                        vy: Math.sin(angle) * speed - 4,
                        sizeW: Math.random() * 10 + 4,
                        sizeH: Math.random() * 6 + 3,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 1.0,
                        rotation: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.3,
                        shapeType: Math.random() > 0.5 ? 'rect' : 'line'
                    });
                }
            });
        }

        // --- 花火発動関数（200点） ---
        function triggerFireworks() {
            const colors = ['#ff2244', '#44ff44', '#4488ff', '#ffff44', '#ff44ff', '#44ffff', '#ffaa00'];
            const fireworkCenters = [
                { x: 250, y: 120 },
                { x: 550, y: 100 },
                { x: 400, y: 160 }
            ];

            fireworkCenters.forEach((center, index) => {
                setTimeout(() => {
                    if (isGameOver) return;
                    for (let i = 0; i < 70; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 7 + 2;
                        fireworks.push({
                            x: center.x,
                            y: center.y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            size: Math.random() * 5 + 3,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            alpha: 1.0
                        });
                    }
                }, index * 400);
            });
        }

        // --- 神演出発動関数（300点） ---
        function triggerGodCelebration() {
            const godColors = ['#ff00ff', '#00ffff', '#ffff00', '#ff8800', '#00ff88', '#ffffff'];
            
            for (let i = 0; i < 150; i++) {
                godParticles.push({
                    x: Math.random() * canvas.width * 1.5,
                    y: Math.random() * -canvas.height,
                    vx: -(Math.random() * 6 + 4), 
                    vy: Math.random() * 6 + 4,
                    size: Math.random() * 4 + 2,
                    color: godColors[Math.floor(Math.random() * godColors.length)],
                    alpha: Math.random() * 0.8 + 0.2,
                    isShootingStar: true
                });
            }

            for (let i = 0; i < 100; i++) {
                godParticles.push({
                    x: Math.random() * canvas.width,
                    y: groundY,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -(Math.random() * 8 + 2), 
                    size: Math.random() * 6 + 3,
                    color: godColors[Math.floor(Math.random() * godColors.length)],
                    alpha: 1.0,
                    isShootingStar: false
                });
            }
        }

        // --- 操作系関数 ---
        function doJump(type) {
            if (!player.isJumping && !isGameOver) {
                if (type === 'fast') {
                    player.vy = player.jumpPowerFast;
                    player.currentGravity = player.gravityFast;
                } else if (type === 'slow') {
                    player.vy = player.jumpPowerSlow;
                    player.currentGravity = player.gravitySlow;
                } else if (type === 'superSlow') {
                    player.vy = player.jumpPowerSuperSlow;
                    player.currentGravity = player.gravitySuperSlow;
                }
                player.isJumping = true;
            } else if (isGameOver) {
                resetGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                e.preventDefault();
                doJump('fast');
            } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                e.preventDefault();
                doJump('slow');
            } else if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                doJump('superSlow');
            }
        });

        canvas.addEventListener('mousedown', handleCanvasTap);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            handleCanvasTap(e.touches[0]);
        }, { passive: false });

        function handleCanvasTap(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const x = (e.clientX - rect.left) * scaleX;
            const third = canvas.width / 3;

            if (x < third) {
                doJump('fast');
            } else if (x < third * 2) {
                doJump('slow');
            } else {
                doJump('superSlow');
            }
        }

        btnLeft.addEventListener('mousedown', () => doJump('fast'));
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('fast'); }, { passive: false });
        btnCenter.addEventListener('mousedown', () => doJump('slow'));
        btnCenter.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('slow'); }, { passive: false });
        btnRight.addEventListener('mousedown', () => doJump('superSlow'));
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); doJump('superSlow'); }, { passive: false });


        // --- ゲーム進行関数 ---
        function resetGame() {
            obstacles = [];
            crackers = [];
            fireworks = [];
            godParticles = [];
            obstacleSpeed = 5;
            spawnTimer = 0;
            nextSpawnInterval = 100;
            extraObstacleTimer = 0;
            score = 0;
            speedMode = 'fast';
            targetNextMode = '';
            modeTimer = 0;
            modeDuration = getRandomModeDuration();
            prepareTimer = 0;
            warningTimer = 0;
            pendingSwitch = false;
            actionMessage = '';
            hasTriggered100Celebration = false;
            hasTriggered200Celebration = false;
            hasTriggered300Celebration = false;
            isGameOver = false;
            loop();
        }

        function drawStickman(x, y) {
            const rx = Math.round(x);
            const ry = Math.round(y);

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;

            ctx.beginPath(); ctx.arc(rx + 15, ry - 50, 10, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 40); ctx.lineTo(rx + 15, ry - 15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 30); ctx.lineTo(rx, ry - 20); ctx.moveTo(rx + 15, ry - 30); ctx.lineTo(rx + 30, ry - 20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rx + 15, ry - 15); ctx.lineTo(rx, ry); ctx.moveTo(rx + 15, ry - 15); ctx.lineTo(rx + 30, ry); ctx.stroke();
        }

        function update() {
            if (isGameOver) return;

            player.vy += player.currentGravity;
            player.y += player.vy;

            if (player.y >= groundY) {
                player.y = groundY;
                player.vy = 0;
                player.isJumping = false;
            }

            // クラッカー更新
            for (let i = crackers.length - 1; i >= 0; i--) {
                let c = crackers[i];
                c.x += c.vx;
                c.y += c.vy;
                c.vy += 0.35;
                c.vx *= 0.98;
                c.rotation += c.vRot;
                c.alpha -= 0.004;
                if (c.alpha <= 0 || c.y > groundY + 20) crackers.splice(i, 1);
            }

            // 花火更新
            for (let i = fireworks.length - 1; i >= 0; i--) {
                let f = fireworks[i];
                f.x += f.vx;
                f.y += f.vy;
                f.vy += 0.15;
                f.alpha -= 0.012;
                if (f.alpha <= 0) fireworks.splice(i, 1);
            }

            // 神演出パーティクル更新
            for (let i = godParticles.length - 1; i >= 0; i--) {
                let gp = godParticles[i];
                gp.x += gp.vx;
                gp.y += gp.vy;
                if (!gp.isShootingStar) {
                    gp.vy += 0.1; 
                    gp.alpha -= 0.008;
                } else {
                    gp.alpha -= 0.004; 
                }
                if (gp.alpha <= 0 || gp.y > canvas.height + 50) {
                    godParticles.splice(i, 1);
                }
            }

            // --- モード切り替え制御（WARNING → 準備 → 障害物クリア待ち → 切り替え） ---
            if (pendingSwitch) {
                if (obstacles.length === 0) {
                    speedMode = targetNextMode;
                    pendingSwitch = false;
                    if (speedMode === 'fast') actionMessage = '⚡【速い】モード！';
                    else if (speedMode === 'slow') actionMessage = '🍃【ふんわり】モード！';
                    else if (speedMode === 'superSlow') actionMessage = '🪶【超ふんわり】モード！';
                    setTimeout(() => { actionMessage = ''; }, 1000);
                }
            } else if (prepareTimer > 0) {
                prepareTimer--;
                if (prepareTimer === 0) {
                    pendingSwitch = true;
                }
            } else if (warningTimer > 0) {
                warningTimer--;
                if (warningTimer === 0) {
                    const modes = ['fast', 'slow', 'superSlow'];
                    let next;
                    do {
                        next = modes[Math.floor(Math.random() * modes.length)];
                    } while (next === speedMode);
                    targetNextMode = next;

                    // 200点以上はインターバルなし、100点以上は0.3秒(18F)、100点未満は0.7秒(42F)
                    if (score >= 200) {
                        prepareTimer = 0;
                        pendingSwitch = true;
                    } else if (score >= 100) {
                        prepareTimer = 18;
                    } else {
                        prepareTimer = 42;
                    }
                    modeTimer = 0;
                    modeDuration = getRandomModeDuration();
                }
            } else {
                modeTimer++;
                if (modeTimer >= modeDuration) {
                    warningTimer = 30; // 0.5秒の警告
                }
            }

            // スピードの管理（10点ごとに標準速度が上昇、モードで加減速）
            let baseSpeed = 5 + Math.floor(score / 10) * 0.2;
            if (speedMode === 'fast') {
                obstacleSpeed = baseSpeed + 4;
            } else if (speedMode === 'superSlow') {
                obstacleSpeed = Math.max(2, baseSpeed - 5);
            } else {
                obstacleSpeed = baseSpeed;
            }

            // --- 障害物スポーン管理 ---
            if (warningTimer === 0 && prepareTimer === 0 && !pendingSwitch) {
                let obsColor = (speedMode === 'slow') ? '#3388ff' : (speedMode === 'fast') ? '#ff33cc' : '#ff4444';

                spawnTimer++;
                if (spawnTimer >= nextSpawnInterval) {
                    obstacles.push({
                        x: canvas.width,
                        y: groundY - 32,
                        width: 16,
                        height: 32,
                        color: obsColor
                    });
                    spawnTimer = 0;

                    // 100点未満は密度低め（スカスカ）、100点以上は超高密度
                    let minInterval = score >= 100 ? 18 : 70;
                    let maxInterval = score >= 100 ? 35 : 130;

                    // 低速時は障害物が当たり判定ゾーンに留まる時間が伸びるため、間隔を速度に応じて広げる
                    const speedSafeMinInterval = Math.ceil(30 / obstacleSpeed) + 17;
                    if (speedSafeMinInterval > minInterval) {
                        maxInterval += speedSafeMinInterval - minInterval;
                        minInterval = speedSafeMinInterval;
                    }

                    nextSpawnInterval = Math.floor(Math.random() * (maxInterval - minInterval + 1)) + minInterval;

                    // 時々、通常より詰めた間隔で追加の障害物を挟む（既存の最小間隔は下回らない）
                    if (extraObstacleTimer === 0 && Math.random() < 0.3 && nextSpawnInterval > minInterval) {
                        extraObstacleTimer = Math.floor(Math.random() * (nextSpawnInterval - minInterval)) + minInterval;
                    }
                }

                if (extraObstacleTimer > 0) {
                    extraObstacleTimer--;
                    if (extraObstacleTimer === 0) {
                        obstacles.push({
                            x: canvas.width,
                            y: groundY - 32,
                            width: 16,
                            height: 32,
                            color: obsColor
                        });
                    }
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacleSpeed;

                const hitBoxX = player.x + 8;
                const hitBoxWidth = player.width - 16;
                const hitBoxY = player.y - player.height + 10;
                const hitBoxHeight = player.height - 28;

                if (
                    hitBoxX < obstacles[i].x + obstacles[i].width &&
                    hitBoxX + hitBoxWidth > obstacles[i].x &&
                    hitBoxY < obstacles[i].y + obstacles[i].height &&
                    hitBoxY + hitBoxHeight > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                if (obstacles[i].x < -obstacles[i].width) {
                    obstacles.splice(i, 1);
                    score++;

                    if (score === 100 && !hasTriggered100Celebration) {
                        hasTriggered100Celebration = true;
                        triggerCracker();
                        actionMessage = '🎉 祝！スコア100達成！（5〜10秒ランダムモード開始）';
                        setTimeout(() => { if (actionMessage.includes('スコア100')) actionMessage = ''; }, 3000);
                    }

                    if (score === 200 && !hasTriggered200Celebration) {
                        hasTriggered200Celebration = true;
                        triggerFireworks();
                        actionMessage = '🎆 祝！スコア200達成！（6秒ランダムモード開始）';
                        setTimeout(() => { if (actionMessage.includes('スコア200')) actionMessage = ''; }, 4000);
                    }

                    if (score === 300 && !hasTriggered300Celebration) {
                        hasTriggered300Celebration = true;
                        triggerGodCelebration();
                        actionMessage = '🌟 神・領域到達！ 300点おめでとう！ 🌟';
                        setTimeout(() => { if (actionMessage.includes('300点')) actionMessage = ''; }, 5000);
                    }
                }
            }

            if (score > highScore) highScore = score;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(800, groundY); ctx.stroke();

            // 障害物描画
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(Math.round(obs.x), Math.round(obs.y), obs.width, obs.height);
            });

            // クラッカー描画
            crackers.forEach(c => {
                ctx.save();
                ctx.translate(Math.round(c.x), Math.round(c.y));
                ctx.rotate(c.rotation);
                ctx.globalAlpha = Math.max(0, c.alpha);
                ctx.fillStyle = c.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = c.color;

                if (c.shapeType === 'rect') {
                    ctx.fillRect(-c.sizeW / 2, -c.sizeH / 2, c.sizeW, c.sizeH);
                } else {
                    ctx.fillRect(-c.sizeW, -2, c.sizeW * 2, 4);
                }
                ctx.restore();
            });

            // 花火描画
            fireworks.forEach(f => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(Math.round(f.x), Math.round(f.y), f.size, 0, Math.PI * 2);
                ctx.fillStyle = f.color;
                ctx.globalAlpha = Math.max(0, f.alpha);
                ctx.fill();
                ctx.restore();
            });

            // 神演出パーティクル描画
            godParticles.forEach(gp => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(Math.round(gp.x), Math.round(gp.y), gp.size, 0, Math.PI * 2);
                ctx.fillStyle = gp.color;
                ctx.globalAlpha = Math.max(0, gp.alpha);
                ctx.shadowBlur = 10;
                ctx.shadowColor = gp.color;
                ctx.fill();
                ctx.restore();
            });

            // 棒人間描画
            drawStickman(player.x, player.y);

            // モード名表示（右上）
            let modeText = '⚡ 速いモード';
            let modeColor = '#ff3344';
            if (speedMode === 'slow') {
                modeText = '🍃 ふんわりモード';
                modeColor = '#00aa55';
            } else if (speedMode === 'superSlow') {
                modeText = '🪶 超ふんわりモード';
                modeColor = '#0066ff';
            }
            ctx.fillStyle = modeColor;
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText(modeText, canvas.width - 200, 40);

            // メッセージ表示
            if (warningTimer > 0) {
                ctx.fillStyle = Math.floor(warningTimer / 5) % 2 === 0 ? '#ff0000' : '#ffaa00';
                ctx.font = 'bold 26px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('⚠️ WARNING ⚠️', canvas.width / 2, 100);
                ctx.textAlign = 'left';
            } else if (prepareTimer > 0 || pendingSwitch) {
                ctx.fillStyle = '#ff8800';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('まもなくモード切替...', canvas.width / 2, 100);
                ctx.textAlign = 'left';
            } else if (score >= 200) {
                ctx.fillStyle = '#ff2200';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('⚡ WARNING: 超高密度地帯 ⚡', canvas.width / 2, 100);
                ctx.textAlign = 'left';
            } else if (actionMessage !== '') {
                ctx.fillStyle = actionMessage.includes('神・領域') ? '#00ffff' : (actionMessage.includes('花火') ? '#ff3366' : '#ffaa00');
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(actionMessage, canvas.width / 2, 100);
                ctx.textAlign = 'left';
            }

            // スコア
            ctx.fillStyle = '#333333';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('SCORE: ' + score, 30, 40);
            ctx.fillText('HI-SCORE: ' + highScore, 200, 40);

            // ゲームオーバー
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.font = '20px sans-serif';
                ctx.fillText('スコア: ' + score + '  /  ハイスコア: ' + highScore, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('画面タップ または ボタン/キー入力でリトライ', canvas.width / 2, canvas.height / 2 + 60);
                
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        // 初回起動
        loop();
    </script>
</body>
</html>
