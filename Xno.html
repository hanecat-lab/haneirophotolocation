<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X分割カルーセルメーカー（ドラッグ＆一括保存対応）</title>
  <!-- JSZipライブラリ (ZIP一括圧縮用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 850px; margin: 20px auto; padding: 0 15px; color: #333; }
    .box { border: 2px dashed #ccc; padding: 20px; text-align: center; margin-bottom: 20px; border-radius: 8px; }
    .controls { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; background: #f5f5f5; padding: 15px; border-radius: 8px; align-items: center; }
    .control-item { display: flex; flex-direction: column; gap: 5px; }
    .recommend-badge { background: #1da1f2; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
    
    /* プレビュー表示エリア (ドラッグ可能) */
    #previewWrapper { text-align: center; margin: 20px 0; background: #222; padding: 15px; border-radius: 8px; user-select: none; }
    #mainCanvas { max-width: 100%; height: auto; border: 1px solid #555; cursor: grab; }
    #mainCanvas:active { cursor: grabbing; }
    
    /* ボタンエリア */
    .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
    button { background: #1da1f2; color: white; border: none; padding: 12px 24px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 1em; }
    button:hover { background: #0d8ddb; }
    button.zip-btn { background: #17bf63; }
    button.zip-btn:hover { background: #129c50; }

    /* 結果プレビュー */
    #resultContainer { display: flex; gap: 10px; overflow-x: auto; margin-top: 20px; padding-bottom: 10px; }
    .result-item { flex: 0 0 auto; text-align: center; }
    .result-item img { max-height: 200px; border: 1px solid #ddd; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>X分割カルーセルメーカー</h1>
  <p style="font-size: 0.9em; color: #666;">画像をドラッグして位置を微調整できます。完成画像はZIPで一括保存可能です。</p>
  
  <div class="box">
    <input type="file" id="imageInput" accept="image/jpeg, image/png, image/webp">
  </div>

  <div id="settings" style="display:none;">
    <div class="controls">
      <div class="control-item">
        <label>分割数:</label>
        <select id="splitCount">
          <option value="2">2分割</option>
          <option value="3">3分割</option>
          <option value="4">4分割</option>
        </select>
      </div>

      <div class="control-item">
        <label>1コマの比率:</label>
        <select id="aspectRatio">
          <option value="1.0">1:1 (スクエア)</option>
          <option value="0.8">4:5 (縦長)</option>
          <option value="0.75">3:4 (縦長)</option>
          <option value="0.5625">9:16 (フル縦長)</option>
        </select>
      </div>

      <div class="control-item">
        <label>背景（余白）の色:</label>
        <select id="bgColor">
          <option value="#000000">黒</option>
          <option value="#ffffff">白</option>
        </select>
      </div>

      <div class="control-item">
        <span id="recommendText" class="recommend-badge"></span>
      </div>
    </div>

    <!-- プレビュー（キャンバスドラッグ対応） -->
    <div id="previewWrapper">
      <canvas id="mainCanvas"></canvas>
      <p style="color: #aaa; font-size: 0.85em; margin-top: 5px;">↑ 枠内をドラッグ（スワイプ）して画像の位置を調整できます</p>
    </div>

    <div class="btn-group">
      <button id="processBtn">分割プレビュー生成</button>
      <button id="zipDownloadBtn" class="zip-btn" style="display:none;">まとめてZIP保存</button>
    </div>
  </div>

  <div id="resultContainer"></div>

<script>
  let loadedImage = null;
  let generatedDataUrls = []; // ZIP出力用

  // ドラッグ操作用の変数
  let imgOffsetX = 0;
  let imgOffsetY = 0;
  let isDragging = false;
  let startX = 0;
  let startY = 0;

  const ratios = [
    { label: '1:1', val: 1.0 },
    { label: '4:5', val: 0.8 },
    { label: '3:4', val: 0.75 },
    { label: '9:16', val: 9/16 }
  ];
  const counts = [2, 3, 4];

  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');

  // 画像読み込み
  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      imgOffsetX = 0;
      imgOffsetY = 0;
      document.getElementById('settings').style.display = 'block';
      document.getElementById('zipDownloadBtn').style.display = 'none';
      document.getElementById('resultContainer').innerHTML = '';
      autoSelectMinPaddingPattern(img.width, img.height);
      updatePreview();
    };
    img.src = URL.createObjectURL(file);
  });

  // 自動パターン判定
  function autoSelectMinPaddingPattern(imgWidth, imgHeight) {
    const R = imgWidth / imgHeight;
    let minDifference = Infinity;
    let bestCount = 2;
    let bestRatioVal = 1.0;

    counts.forEach(count => {
      ratios.forEach(r => {
        const F = r.val * count;
        const diff = Math.abs(R - F);
        if (diff < minDifference) {
          minDifference = diff;
          bestCount = count;
          bestRatioVal = r.val;
        }
      });
    });

    document.getElementById('splitCount').value = bestCount;
    document.getElementById('aspectRatio').value = bestRatioVal;

    const chosenF = bestRatioVal * bestCount;
    const paddingPercent = Math.abs(1 - (Math.min(R, chosenF) / Math.max(R, chosenF))) * 100;
    
    document.getElementById('recommendText').innerText = 
      `おすすめ: ${bestCount}分割 (余白約 ${paddingPercent.toFixed(1)}%)`;
  }

  // イベント
  document.getElementById('splitCount').addEventListener('change', () => { imgOffsetX = 0; imgOffsetY = 0; updatePreview(); });
  document.getElementById('aspectRatio').addEventListener('change', () => { imgOffsetX = 0; imgOffsetY = 0; updatePreview(); });
  document.getElementById('bgColor').addEventListener('change', updatePreview);

  // マウス/タッチ ドラッグ処理
  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', drag);
  canvas.addEventListener('mouseup', endDrag);
  canvas.addEventListener('mouseleave', endDrag);

  canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
  canvas.addEventListener('touchmove', (e) => drag(e.touches[0]));
  canvas.addEventListener('touchend', endDrag);

  function startDrag(e) {
    if (!loadedImage) return;
    isDragging = true;
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    startX = e.clientX * scale - imgOffsetX;
    startY = e.clientY * scale - imgOffsetY;
  }

  function drag(e) {
    if (!isDragging) return;
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    imgOffsetX = e.clientX * scale - startX;
    imgOffsetY = e.clientY * scale - startY;
    updatePreview();
  }

  function endDrag() { isDragging = false; }

  // プレビュー再描画
  function updatePreview() {
    if (!loadedImage) return;

    const count = parseInt(document.getElementById('splitCount').value);
    const aspect = parseFloat(document.getElementById('aspectRatio').value);
    const bgColor = document.getElementById('bgColor').value;

    const R = loadedImage.width / loadedImage.height;
    const F = aspect * count;

    let targetW, targetH;
    if (R > F) {
      targetW = loadedImage.width;
      targetH = targetW / F;
    } else {
      targetH = loadedImage.height;
      targetW = targetH * F;
    }

    canvas.width = targetW;
    canvas.height = targetH;

    // 背景描画
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, targetW, targetH);

    // 画像描画（ドラッグオフセット反映）
    const baseDrawX = (targetW - loadedImage.width) / 2;
    const baseDrawY = (targetH - loadedImage.height) / 2;
    ctx.drawImage(loadedImage, baseDrawX + imgOffsetX, baseDrawY + imgOffsetY);

    // 赤色分割線
    const pieceW = targetW / count;
    ctx.strokeStyle = '#ff3333';
    ctx.lineWidth = Math.max(2, targetW / 400);
    ctx.setLineDash([10, 5]);

    for (let i = 1; i < count; i++) {
      const lineX = pieceW * i;
      ctx.beginPath();
      ctx.moveTo(lineX, 0);
      ctx.lineTo(lineX, targetH);
      ctx.stroke();
    }
  }

  // 画像分割処理
  document.getElementById('processBtn').addEventListener('click', () => {
    if (!loadedImage) return;

    const count = parseInt(document.getElementById('splitCount').value);
    const aspect = parseFloat(document.getElementById('aspectRatio').value);
    const container = document.getElementById('resultContainer');
    container.innerHTML = '';
    generatedDataUrls = [];

    const pieceW = canvas.width / count;

    for (let i = 0; i < count; i++) {
      const exportCanvas = document.createElement('canvas');
      const piecePixelW = 1080;
      const piecePixelH = piecePixelW / aspect;
      
      exportCanvas.width = piecePixelW;
      exportCanvas.height = piecePixelH;
      const exportCtx = exportCanvas.getContext('2d');

      const sx = i * pieceW;

      // プレビューの描画結果から正確にスライス
      exportCtx.drawImage(canvas, sx, 0, pieceW, canvas.height, 0, 0, piecePixelW, piecePixelH);

      const dataUrl = exportCanvas.toDataURL('image/jpeg', 0.92);
      generatedDataUrls.push(dataUrl);

      // 個別プレビュー表示
      const itemDiv = document.createElement('div');
      itemDiv.className = 'result-item';
      
      const imgElem = document.createElement('img');
      imgElem.src = dataUrl;
      
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `x_split_${i + 1}.jpg`;
      link.innerText = `${i + 1}枚目を保存`;
      link.style.display = 'block';
      link.style.marginTop = '5px';

      itemDiv.appendChild(imgElem);
      itemDiv.appendChild(link);
      container.appendChild(itemDiv);
    }

    // ZIPダウンロードボタン表示
    document.getElementById('zipDownloadBtn').style.display = 'inline-block';
  });

  // ZIP一括保存処理
  document.getElementById('zipDownloadBtn').addEventListener('click', () => {
    if (generatedDataUrls.length === 0) return;

    const zip = new JSZip();
    
    generatedDataUrls.forEach((dataUrl, idx) => {
      // Base64からバイナリ抽出
      const base64Data = dataUrl.replace(/^data:image\/jpeg;base64,/, "");
      zip.file(`x_split_${idx + 1}.jpg`, base64Data, { base64: true });
    });

    zip.generateAsync({ type: "blob" }).then((content) => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = "x_carousel_images.zip";
      link.click();
    });
  });
</script>
</body>
</html>
