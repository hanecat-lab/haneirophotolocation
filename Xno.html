<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X分割カルーセルメーカー（100%パディング対応）</title>
  <style>
    body { font-family: sans-serif; max-width: 850px; margin: 20px auto; padding: 0 15px; color: #333; }
    .box { border: 2px dashed #ccc; padding: 20px; text-align: center; margin-bottom: 20px; border-radius: 8px; }
    .controls { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; background: #f5f5f5; padding: 15px; border-radius: 8px; align-items: center; }
    .control-item { display: flex; flex-direction: column; gap: 5px; }
    .recommend-badge { background: #1da1f2; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
    
    /* プレビュー表示エリア */
    #previewWrapper { text-align: center; margin: 20px 0; background: #222; padding: 15px; border-radius: 8px; }
    #mainCanvas { max-width: 100%; height: auto; border: 1px solid #555; }
    .slider-box { margin-top: 10px; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
    
    /* 書き出し結果 */
    #resultContainer { display: flex; gap: 10px; overflow-x: auto; margin-top: 20px; padding-bottom: 10px; }
    .result-item { flex: 0 0 auto; text-align: center; }
    .result-item img { max-height: 200px; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #1da1f2; color: white; border: none; padding: 12px 24px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 1em; }
    button:hover { background: #0d8ddb; }
  </style>
</head>
<body>

  <h1>X分割カルーセルメーカー</h1>
  
  <div class="box">
    <input type="file" id="imageInput" accept="image/jpeg, image/png, image/webp">
  </div>

  <div id="settings" style="display:none;">
    <div class="controls">
      <div class="control-item">
        <label>分割モード:</label>
        <select id="fitMode">
          <option value="crop">切り抜き（クロップ）</option>
          <option value="pad" selected>余白を追加（元画像100%維持）</option>
        </select>
      </div>

      <div class="control-item" id="bgColorGroup">
        <label>余白の色:</label>
        <select id="bgColor">
          <option value="#000000">黒</option>
          <option value="#ffffff">白</option>
        </select>
      </div>

      <div class="control-item">
        <label>分割数:</label>
        <select id="splitCount">
          <option value="2">2分割</option>
          <option value="3">3分割</option>
          <option value="4">4分割</option>
        </select>
      </div>

      <div class="control-item">
        <label>1コマの比率:</label>
        <select id="aspectRatio">
          <option value="1.0">1:1 (スクエア)</option>
          <option value="0.8">4:5 (縦長)</option>
          <option value="0.75">3:4 (縦長)</option>
          <option value="0.5625">9:16 (フル縦長)</option>
        </select>
      </div>

      <div class="control-item">
        <span id="recommendText" class="recommend-badge"></span>
      </div>
    </div>

    <!-- 切り取り位置プレビュー -->
    <div id="previewWrapper">
      <canvas id="mainCanvas"></canvas>
      <div class="slider-box" id="sliderGroup">
        <label for="offsetSlider">位置調整:</label>
        <input type="range" id="offsetSlider" min="0" max="100" value="50" style="width: 60%;">
      </div>
    </div>

    <div style="text-align: center; margin-top: 15px;">
      <button id="processBtn">分割書き出し</button>
    </div>
  </div>

  <div id="resultContainer"></div>

<script>
  let loadedImage = null;
  let currentCrop = { startX: 0, startY: 0, cropW: 0, cropH: 0 };

  const ratios = [
    { label: '1:1', val: 1.0 },
    { label: '4:5', val: 0.8 },
    { label: '3:4', val: 0.75 },
    { label: '9:16', val: 9/16 }
  ];
  const counts = [2, 3, 4];

  // 画像読み込み
  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      document.getElementById('settings').style.display = 'block';
      autoSelectBestPattern(img.width, img.height);
      updatePreview();
    };
    img.src = URL.createObjectURL(file);
  });

  // 自動判定
  function autoSelectBestPattern(imgWidth, imgHeight) {
    const R = imgWidth / imgHeight;
    let bestRetention = -1, bestCount = 2, bestRatioVal = 1.0;

    counts.forEach(count => {
      ratios.forEach(r => {
        const F = r.val * count;
        const retention = Math.min(R, F) / Math.max(R, F);
        if (retention > bestRetention || (Math.abs(retention - bestRetention) < 0.0001 && count > bestCount)) {
          bestRetention = retention;
          bestCount = count;
          bestRatioVal = r.val;
        }
      });
    });

    document.getElementById('splitCount').value = bestCount;
    document.getElementById('aspectRatio').value = bestRatioVal;
    updateRecommendText();
  }

  function updateRecommendText() {
    const mode = document.getElementById('fitMode').value;
    if (mode === 'pad') {
      document.getElementById('recommendText').innerText = `元画像 100% 保持 (余白補正)`;
    } else {
      const R = loadedImage.width / loadedImage.height;
      const count = parseInt(document.getElementById('splitCount').value);
      const aspect = parseFloat(document.getElementById('aspectRatio').value);
      const F = aspect * count;
      const retention = Math.min(R, F) / Math.max(R, F);
      document.getElementById('recommendText').innerText = `残存率: ${(retention * 100).toFixed(1)}%`;
    }
  }

  // イベントリスナー
  document.getElementById('fitMode').addEventListener('change', () => {
    const isPad = document.getElementById('fitMode').value === 'pad';
    document.getElementById('bgColorGroup').style.display = isPad ? 'flex' : 'none';
    document.getElementById('sliderGroup').style.display = isPad ? 'none' : 'flex';
    updateRecommendText();
    updatePreview();
  });
  document.getElementById('bgColor').addEventListener('change', updatePreview);
  document.getElementById('splitCount').addEventListener('change', () => { updateRecommendText(); updatePreview(); });
  document.getElementById('aspectRatio').addEventListener('change', () => { updateRecommendText(); updatePreview(); });
  document.getElementById('offsetSlider').addEventListener('input', updatePreview);

  // プレビュー描画処理
  function updatePreview() {
    if (!loadedImage) return;

    const mode = document.getElementById('fitMode').value;
    const count = parseInt(document.getElementById('splitCount').value);
    const aspect = parseFloat(document.getElementById('aspectRatio').value);
    const bgColor = document.getElementById('bgColor').value;
    const sliderVal = parseInt(document.getElementById('offsetSlider').value) / 100;

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    const R = loadedImage.width / loadedImage.height;
    const F = aspect * count;

    if (mode === 'pad') {
      // 100%残すための余白キャンバスサイズ計算
      let targetW, targetH;
      if (R > F) {
        targetW = loadedImage.width;
        targetH = targetW / F;
      } else {
        targetH = loadedImage.height;
        targetW = targetH * F;
      }

      canvas.width = targetW;
      canvas.height = targetH;

      // 背景塗りつぶし
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, targetW, targetH);

      // 中央配置
      const drawX = (targetW - loadedImage.width) / 2;
      const drawY = (targetH - loadedImage.height) / 2;
      ctx.drawImage(loadedImage, drawX, drawY);

      currentCrop = { startX: 0, startY: 0, cropW: targetW, cropH: targetH };

      // 分割線（赤破線）
      const pieceW = targetW / count;
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = Math.max(2, targetW / 400);
      ctx.setLineDash([10, 5]);

      for (let i = 1; i < count; i++) {
        const lineX = pieceW * i;
        ctx.beginPath();
        ctx.moveTo(lineX, 0);
        ctx.lineTo(lineX, targetH);
        ctx.stroke();
      }

    } else {
      // クロップモード
      canvas.width = loadedImage.width;
      canvas.height = loadedImage.height;
      ctx.drawImage(loadedImage, 0, 0);

      let cropW, cropH, startX = 0, startY = 0;
      if (R > F) {
        cropH = loadedImage.height;
        cropW = cropH * F;
        startX = (loadedImage.width - cropW) * sliderVal;
      } else {
        cropW = loadedImage.width;
        cropH = cropW / F;
        startY = (loadedImage.height - cropH) * sliderVal;
      }

      currentCrop = { startX, startY, cropW, cropH };

      // 枠外を暗くする
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, canvas.width, startY);
      ctx.fillRect(0, startY + cropH, canvas.width, canvas.height - (startY + cropH));
      ctx.fillRect(0, startY, startX, cropH);
      ctx.fillRect(startX + cropW, startY, canvas.width - (startX + cropW), cropH);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(2, canvas.width / 300);
      ctx.strokeRect(startX, startY, cropW, cropH);

      const pieceW = cropW / count;
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = Math.max(2, canvas.width / 400);
      ctx.setLineDash([10, 5]);

      for (let i = 1; i < count; i++) {
        const lineX = startX + (pieceW * i);
        ctx.beginPath();
        ctx.moveTo(lineX, startY);
        ctx.lineTo(lineX, startY + cropH);
        ctx.stroke();
      }
    }
  }

  // 書き出し処理
  document.getElementById('processBtn').addEventListener('click', () => {
    if (!loadedImage) return;

    const count = parseInt(document.getElementById('splitCount').value);
    const aspect = parseFloat(document.getElementById('aspectRatio').value);
    const container = document.getElementById('resultContainer');
    container.innerHTML = '';

    const previewCanvas = document.getElementById('mainCanvas');
    const pieceW = currentCrop.cropW / count;

    for (let i = 0; i < count; i++) {
      const canvas = document.createElement('canvas');
      const piecePixelW = 1080;
      const piecePixelH = piecePixelW / aspect;
      
      canvas.width = piecePixelW;
      canvas.height = piecePixelH;
      const ctx = canvas.getContext('2d');

      const sx = currentCrop.startX + (i * pieceW);
      const sy = currentCrop.startY;

      // プレビューの描画状態（余白付与済みまたは元画像）から切り出し
      ctx.drawImage(previewCanvas, sx, sy, pieceW, currentCrop.cropH, 0, 0, piecePixelW, piecePixelH);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

      const itemDiv = document.createElement('div');
      itemDiv.className = 'result-item';
      
      const imgElem = document.createElement('img');
      imgElem.src = dataUrl;
      
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `x_split_${i + 1}.jpg`;
      link.innerText = `${i + 1}枚目を保存`;
      link.style.display = 'block';
      link.style.marginTop = '5px';

      itemDiv.appendChild(imgElem);
      itemDiv.appendChild(link);
      container.appendChild(itemDiv);
    }
  });
</script>
</body>
</html>
