<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Carousel Studio</title>
  <!-- JSZipライブラリ (ZIP一括圧縮用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    /* X (Twitter) ダークモードの配色規約 */
    :root {
      --bg-color: #000000;
      --card-bg: #16181c;
      --border-color: #2f3336;
      --text-main: #e7e9ea;
      --text-sub: #71767b;
      --x-blue: #1d9bf0;
      --x-blue-hover: #1a8cd8;
      --x-green: #00ba72;
      --x-green-hover: #00a062;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); max-width: 800px; margin: 0 auto; padding: 20px 16px; }

    /* ヘッダー */
    header { border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 20px; }
    h1 { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .subtitle { color: var(--text-sub); font-size: 0.85rem; margin-top: 4px; }

    /* ドラッグ＆ドロップ領域 */
    .upload-box { border: 2px dashed var(--border-color); background: var(--card-bg); padding: 30px; text-align: center; border-radius: 16px; margin-bottom: 20px; }
    .upload-box input[type="file"] { display: none; }
    .file-label { background-color: var(--text-main); color: #000; padding: 8px 16px; border-radius: 9999px; font-weight: 700; font-size: 0.9rem; cursor: pointer; display: inline-block; }
    .file-label:hover { opacity: 0.9; }

    /* コントロールエリア */
    .controls-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 16px; }

    /* タブ切り替え（X風） */
    .tab-group { display: flex; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 9999px; padding: 4px; }
    .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-sub); padding: 8px 0; border-radius: 9999px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--x-blue); color: #fff; }

    /* 設定ドロップダウン群 */
    .select-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .control-item { display: flex; flex-direction: column; gap: 6px; }
    .control-item label { font-size: 0.75rem; color: var(--text-sub); font-weight: 700; }
    select { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; outline: none; }
    select:focus { border-color: var(--x-blue); }

    /* バッジ */
    .recommend-badge { background: rgba(29, 155, 240, 0.1); color: var(--x-blue); border: 1px solid var(--x-blue); padding: 6px 12px; border-radius: 9999px; font-size: 0.8rem; font-weight: 700; text-align: center; }

    /* プレビュー表示キャンバス */
    #previewWrapper { text-align: center; background: #000; border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; user-select: none; }
    #mainCanvas { max-width: 100%; height: auto; border-radius: 8px; cursor: grab; }
    #mainCanvas:active { cursor: grabbing; }

    /* アクションボタン */
    .btn-group { display: flex; justify-content: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .btn { background: var(--x-blue); color: #fff; border: none; padding: 10px 20px; border-radius: 9999px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--x-blue-hover); }
    .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: rgba(239, 243, 244, 0.1); }
    .btn-zip { background: var(--x-green); }
    .btn-zip:hover { background: var(--x-green-hover); }

    /* 結果出力ギャラリー */
    #resultContainer { display: flex; gap: 12px; overflow-x: auto; margin-top: 20px; padding-bottom: 10px; }
    .result-item { flex: 0 0 auto; text-align: center; background: var(--card-bg); border: 1px solid var(--border-color); padding: 8px; border-radius: 12px; }
    .result-item img { max-height: 180px; border-radius: 6px; }
    .result-item a { color: var(--x-blue); text-decoration: none; font-size: 0.8rem; font-weight: 700; display: block; margin-top: 6px; }
    .result-item a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      X Carousel Studio
    </h1>
    <p class="subtitle">カルーセル画像をドラッグ調整＆1クリックで一括ダウンロードできます</p>
  </header>
  
  <div class="upload-box">
    <label for="imageInput" class="file-label">画像を選択</label>
    <input type="file" id="imageInput" accept="image/jpeg, image/png, image/webp">
  </div>

  <div id="settings" style="display:none;">
    <div class="controls-container">
      <!-- 処理モード選択（X風ピルタブ） -->
      <div class="tab-group">
        <button id="tabPad" class="tab-btn active">余白を追加（100%保持）</button>
        <button id="tabCrop" class="tab-btn">切り抜き（クロップ）</button>
      </div>

      <div class="select-grid">
        <div class="control-item">
          <label>分割数</label>
          <select id="splitCount">
            <option value="2">2分割</option>
            <option value="3">3分割</option>
            <option value="4">4分割</option>
          </select>
        </div>

        <div class="control-item">
          <label>1コマのアスペクト比</label>
          <select id="aspectRatio">
            <option value="1.0">1:1 (スクエア)</option>
            <option value="0.8">4:5 (縦長)</option>
            <option value="0.75">3:4 (縦長)</option>
            <option value="0.5625">9:16 (フル縦長)</option>
          </select>
        </div>

        <div class="control-item" id="bgColorGroup">
          <label>背景（余白）カラー</label>
          <select id="bgColor">
            <option value="#000000">ブラック (#000000)</option>
            <option value="#ffffff">ホワイト (#ffffff)</option>
          </select>
        </div>
      </div>

      <div id="recommendText" class="recommend-badge"></div>
    </div>

    <!-- プレビューエリア -->
    <div id="previewWrapper">
      <canvas id="mainCanvas"></canvas>
      <div style="margin-top: 12px; display: flex; justify-content: center; gap: 12px; align-items: center;">
        <span style="color: var(--text-sub); font-size: 0.8rem;">ドラッグして位置調整</span>
        <button id="resetPosBtn" class="btn btn-secondary" style="padding: 4px 12px; font-size: 0.75rem;">中央に戻す</button>
      </div>
    </div>

    <div class="btn-group">
      <button id="processBtn" class="btn">分割プレビュー生成</button>
      <button id="zipDownloadBtn" class="btn btn-zip" style="display:none;">まとめてZIP保存</button>
    </div>
  </div>

  <div id="resultContainer"></div>

<script>
  let loadedImage = null;
  let generatedDataUrls = [];
  let fitMode = 'pad'; // 'pad' or 'crop'

  let imgOffsetX = 0;
  let imgOffsetY = 0;
  let isDragging = false;
  let startX = 0;
  let startY = 0;

  const ratios = [
    { label: '1:1', val: 1.0 },
    { label: '4:5', val: 0.8 },
    { label: '3:4', val: 0.75 },
    { label: '9:16', val: 9/16 }
  ];
  const counts = [2, 3, 4];

  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');

  // 画像読み込み
  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      resetOffset();
      document.getElementById('settings').style.display = 'block';
      document.getElementById('zipDownloadBtn').style.display = 'none';
      document.getElementById('resultContainer').innerHTML = '';
      autoSelectMinPaddingPattern(img.width, img.height);
      updatePreview();
    };
    img.src = URL.createObjectURL(file);
  });

  function resetOffset() {
    imgOffsetX = 0;
    imgOffsetY = 0;
  }

  // 自動判定
  function autoSelectMinPaddingPattern(imgWidth, imgHeight) {
    const R = imgWidth / imgHeight;
    let minDifference = Infinity;
    let bestCount = 2;
    let bestRatioVal = 1.0;

    counts.forEach(count => {
      ratios.forEach(r => {
        const F = r.val * count;
        const diff = Math.abs(R - F);
        if (diff < minDifference) {
          minDifference = diff;
          bestCount = count;
          bestRatioVal = r.val;
        }
      });
    });

    document.getElementById('splitCount').value = bestCount;
    document.getElementById('aspectRatio').value = bestRatioVal;
    updateRecommendText();
  }

  function updateRecommendText() {
    if (fitMode === 'pad') {
      document.getElementById('recommendText').innerText = `おすすめモード: 余白追加（原音・原画ママ100%保持）`;
    } else {
      const R = loadedImage.width / loadedImage.height;
      const count = parseInt(document.getElementById('splitCount').value);
      const aspect = parseFloat(document.getElementById('aspectRatio').value);
      const F = aspect * count;
      const retention = Math.min(R, F) / Math.max(R, F);
      document.getElementById('recommendText').innerText = `画像保持率: ${(retention * 100).toFixed(1)}%`;
    }
  }

  // モードタブ切替
  document.getElementById('tabPad').addEventListener('click', () => {
    fitMode = 'pad';
    document.getElementById('tabPad').classList.add('active');
    document.getElementById('tabCrop').classList.remove('active');
    document.getElementById('bgColorGroup').style.display = 'flex';
    resetOffset();
    updateRecommendText();
    updatePreview();
  });

  document.getElementById('tabCrop').addEventListener('click', () => {
    fitMode = 'crop';
    document.getElementById('tabCrop').classList.add('active');
    document.getElementById('tabPad').classList.remove('active');
    document.getElementById('bgColorGroup').style.display = 'none';
    resetOffset();
    updateRecommendText();
    updatePreview();
  });

  document.getElementById('splitCount').addEventListener('change', () => { resetOffset(); updateRecommendText(); updatePreview(); });
  document.getElementById('aspectRatio').addEventListener('change', () => { resetOffset(); updateRecommendText(); updatePreview(); });
  document.getElementById('bgColor').addEventListener('change', updatePreview);
  document.getElementById('resetPosBtn').addEventListener('click', () => { resetOffset(); updatePreview(); });

  // ドラッグ操作
  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', drag);
  canvas.addEventListener('mouseup', endDrag);
  canvas.addEventListener('mouseleave', endDrag);

  canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
  canvas.addEventListener('touchmove', (e) => drag(e.touches[0]));
  canvas.addEventListener('touchend', endDrag);

  function startDrag(e) {
    if (!loadedImage) return;
    isDragging = true;
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    startX = e.clientX * scale - imgOffsetX;
    startY = e.clientY * scale - imgOffsetY;
  }

  function drag(e) {
    if (!isDragging) return;
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    imgOffsetX = e.clientX * scale - startX;
    imgOffsetY = e.clientY * scale - startY;
    updatePreview();
  }

  function endDrag() { isDragging = false; }

  // プレビュー描画
  function updatePreview() {
    if (!loadedImage) return;

    const count = parseInt(document.getElementById('splitCount').value);
    const aspect = parseFloat(document.getElementById('aspectRatio').value);
    const bgColor = document.getElementById('bgColor').value;

    const R = loadedImage.width / loadedImage.height;
    const F = aspect * count;

    if (fitMode === 'pad') {
      let targetW, targetH;
      if (R > F) {
        targetW = loadedImage.width;
        targetH = targetW / F;
      } else {
        targetH = loadedImage.height;
        targetW = targetH * F;
      }

      canvas.width = targetW;
      canvas.height = targetH;

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, targetW, targetH);

      const drawX = (targetW - loadedImage.width) / 2 + imgOffsetX;
      const drawY = (targetH - loadedImage.height) / 2 + imgOffsetY;
      ctx.drawImage(loadedImage, drawX, drawY);

      const pieceW = targetW / count;
      ctx.strokeStyle = '#1d9bf0';
      ctx.lineWidth = Math.max(2, targetW / 400);
      ctx.setLineDash([8, 6]);

      for (let i = 1; i < count; i++) {
        const lineX = pieceW * i;
        ctx.beginPath();
        ctx.moveTo(lineX, 0);
        ctx.lineTo(lineX, targetH);
        ctx.stroke();
      }

    } else {
      let cropW, cropH;
      if (R > F) {
        cropH = loadedImage.height;
        cropW = cropH * F;
      } else {
        cropW = loadedImage.width;
        cropH = cropW / F;
      }

      canvas.width = cropW;
      canvas.height = cropH;

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, cropW, cropH);

      let drawW, drawH;
      if (R > F) {
        drawH = cropH;
        drawW = drawH * R;
      } else {
        drawW = cropW;
        drawH = drawW / R;
      }

      const drawX = (cropW - drawW) / 2 + imgOffsetX;
      const drawY = (cropH - drawH) / 2 + imgOffsetY;

      ctx.drawImage(loadedImage, drawX, drawY, drawW, drawH);

      const pieceW = cropW / count;
      ctx.strokeStyle = '#1d9bf0';
      ctx.lineWidth = Math.max(2, cropW / 400);
      ctx.setLineDash([8, 6]);

      for (let i = 1; i < count; i++) {
        const lineX = pieceW * i;
        ctx.beginPath();
        ctx.moveTo(lineX, 0);
        ctx.lineTo(lineX, cropH);
        ctx.stroke();
      }
    }
  }

  // 分割書き出し
  document.getElementById('processBtn').addEventListener('click', () => {
    if (!loadedImage) return;

    const count = parseInt(document.getElementById('splitCount').value);
    const aspect = parseFloat(document.getElementById('aspectRatio').value);
    const container = document.getElementById('resultContainer');
    container.innerHTML = '';
    generatedDataUrls = [];

    const pieceW = canvas.width / count;

    for (let i = 0; i < count; i++) {
      const exportCanvas = document.createElement('canvas');
      const piecePixelW = 1080;
      const piecePixelH = piecePixelW / aspect;
      
      exportCanvas.width = piecePixelW;
      exportCanvas.height = piecePixelH;
      const exportCtx = exportCanvas.getContext('2d');

      const sx = i * pieceW;

      exportCtx.drawImage(canvas, sx, 0, pieceW, canvas.height, 0, 0, piecePixelW, piecePixelH);

      const dataUrl = exportCanvas.toDataURL('image/jpeg', 0.92);
      generatedDataUrls.push(dataUrl);

      const itemDiv = document.createElement('div');
      itemDiv.className = 'result-item';
      
      const imgElem = document.createElement('img');
      imgElem.src = dataUrl;
      
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `x_split_${i + 1}.jpg`;
      link.innerText = `${i + 1}枚目を保存`;

      itemDiv.appendChild(imgElem);
      itemDiv.appendChild(link);
      container.appendChild(itemDiv);
    }

    document.getElementById('zipDownloadBtn').style.display = 'inline-block';
  });

  // ZIP一括保存
  document.getElementById('zipDownloadBtn').addEventListener('click', () => {
    if (generatedDataUrls.length === 0) return;

    const zip = new JSZip();
    
    generatedDataUrls.forEach((dataUrl, idx) => {
      const base64Data = dataUrl.replace(/^data:image\/jpeg;base64,/, "");
      zip.file(`x_split_${idx + 1}.jpg`, base64Data, { base64: true });
    });

    zip.generateAsync({ type: "blob" }).then((content) => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = "x_carousel_images.zip";
      link.click();
    });
  });
</script>
</body>
</html>
