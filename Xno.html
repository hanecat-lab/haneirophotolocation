<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Carousel Studio Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #16181c;
      --border-color: #2f3336;
      --text-main: #e7e9ea;
      --text-sub: #71767b;
      --x-blue: #1d9bf0;
      --x-green: #00ba72;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); max-width: 800px; margin: 0 auto; padding: 20px 16px; }

    header { border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 20px; }
    h1 { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .subtitle { color: var(--text-sub); font-size: 0.85rem; margin-top: 4px; }

    .upload-box { border: 2px dashed var(--border-color); background: var(--card-bg); padding: 25px; text-align: center; border-radius: 16px; margin-bottom: 20px; }
    .upload-box input[type="file"] { display: none; }
    .file-label { background-color: var(--text-main); color: #000; padding: 8px 18px; border-radius: 9999px; font-weight: 700; font-size: 0.9rem; cursor: pointer; display: inline-block; }

    .controls-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 16px; }

    .tab-group { display: flex; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 9999px; padding: 4px; }
    .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-sub); padding: 8px 0; border-radius: 9999px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .tab-btn.active { background: var(--x-blue); color: #fff; }

    .select-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
    .control-item { display: flex; flex-direction: column; gap: 6px; }
    .control-item label { font-size: 0.75rem; color: var(--text-sub); font-weight: 700; }
    select { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; }

    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-main); cursor: pointer; margin-top: 4px; }

    #previewWrapper { text-align: center; background: #000; border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; user-select: none; }
    #mainCanvas { max-width: 100%; height: auto; border-radius: 8px; cursor: grab; }
    #mainCanvas:active { cursor: grabbing; }

    /* 位置・ズーム調整ツールバー */
    .adjust-toolbar { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .zoom-control { display: flex; align-items: center; gap: 10px; background: var(--card-bg); padding: 6px 14px; border-radius: 9999px; border: 1px solid var(--border-color); }
    .zoom-control label { font-size: 0.75rem; color: var(--text-sub); font-weight: 700; }
    .zoom-btn { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); width: 28px; height: 28px; border-radius: 50%; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .zoom-btn:hover { background: var(--border-color); }
    .zoom-control input[type="range"] { width: 100px; accent-color: var(--x-blue); }

    .align-btn-group { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .sm-btn { padding: 5px 12px; font-size: 0.75rem; font-weight: 700; }

    .btn-group { display: flex; justify-content: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .btn { background: var(--x-blue); color: #fff; border: none; padding: 10px 20px; border-radius: 9999px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-zip { background: var(--x-green); }

    /* 結果ギャラリー＆ポストコピー */
    #postTemplateBox { display: none; background: var(--card-bg); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 12px; margin-top: 20px; align-items: center; justify-content: space-between; }
    #postTemplateText { font-size: 0.85rem; color: var(--text-main); }

    #resultContainer { display: flex; gap: 12px; overflow-x: auto; margin-top: 16px; padding-bottom: 10px; }
    .result-item { flex: 0 0 auto; text-align: center; background: var(--card-bg); border: 1px solid var(--border-color); padding: 8px; border-radius: 12px; position: relative; }
    .result-item img { max-height: 220px; border-radius: 6px; }
    .badge-num { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.75); color: #fff; font-size: 0.75rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
    .result-item a { color: var(--x-blue); text-decoration: none; font-size: 0.8rem; font-weight: 700; display: block; margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      X Carousel Studio Pro
    </h1>
    <p class="subtitle">ドラッグ調整・ズーム・自動センタリング・ZIP保存対応</p>
  </header>
  
  <div class="upload-box">
    <label for="imageInput" class="file-label">画像を選択</label>
    <input type="file" id="imageInput" accept="image/jpeg, image/png, image/webp">
  </div>

  <div id="settings" style="display:none;">
    <div class="controls-container">
      <div class="tab-group">
        <button id="tabPad" class="tab-btn active">余白追加（100%保持）</button>
        <button id="tabCrop" class="tab-btn">切り抜き（クロップ）</button>
      </div>

      <div class="select-grid">
        <div class="control-item">
          <label>分割数</label>
          <select id="splitCount">
            <option value="2">2分割</option>
            <option value="3" selected>3分割</option>
            <option value="4">4分割</option>
          </select>
        </div>

        <div class="control-item">
          <label>1コマの比率</label>
          <select id="aspectRatio">
            <option value="0.3333">1:3 (超縦長・3連ポスト用)</option>
            <option value="0.8">4:5 (縦長)</option>
            <option value="0.75">3:4 (縦長)</option>
            <option value="1.0">1:1 (スクエア)</option>
          </select>
        </div>

        <div class="control-item" id="bgColorGroup">
          <label>背景カラー</label>
          <select id="bgColor">
            <option value="#000000">ブラック</option>
            <option value="#ffffff">ホワイト</option>
          </select>
        </div>
      </div>

      <!-- スワイプ誘導フック -->
      <label class="checkbox-item">
        <input type="checkbox" id="seamlessHook" checked>
        <span>スワイプ誘導フックを自動付与（境界線をシームレス接続）</span>
      </label>
    </div>

    <div id="previewWrapper">
      <canvas id="mainCanvas"></canvas>
      
      <!-- 調整ツールバー（ズーム＆整列機能） -->
      <div class="adjust-toolbar">
        <div class="zoom-control">
          <label>拡大率</label>
          <button id="zoomOutBtn" class="zoom-btn">－</button>
          <input type="range" id="zoomRange" min="0.5" max="3" step="0.05" value="1">
          <button id="zoomInBtn" class="zoom-btn">＋</button>
          <span id="zoomVal" style="font-size: 0.75rem; min-width: 38px;">100%</span>
        </div>

        <div class="align-btn-group">
          <button id="alignYBtn" class="btn btn-secondary sm-btn">↕ 上下中央に整える</button>
          <button id="alignXBtn" class="btn btn-secondary sm-btn">↔ 左右中央に整える</button>
          <button id="resetPosBtn" class="btn btn-secondary sm-btn">元に戻す</button>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button id="processBtn" class="btn">分割プレビュー生成</button>
      <button id="zipDownloadBtn" class="btn btn-zip" style="display:none;">まとめてZIP保存</button>
    </div>

    <!-- 投稿文テンプレートコピー -->
    <div id="postTemplateBox">
      <span id="postTemplateText">👈 スワイプして続きを見る（全3枚）</span>
      <button id="copyTextBtn" class="btn btn-secondary" style="padding: 4px 12px; font-size: 0.75rem;">投稿文をコピー</button>
    </div>
  </div>

  <div id="resultContainer"></div>

<script>
  let loadedImage = null;
  let generatedDataUrls = [];
  let fitMode = 'pad';

  let imgOffsetX = 0;
  let imgOffsetY = 0;
  let imgScale = 1.0; // 拡大倍率
  let isDragging = false;
  let startX = 0;
  let startY = 0;

  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      resetOffset();
      document.getElementById('settings').style.display = 'block';
      document.getElementById('zipDownloadBtn').style.display = 'none';
      document.getElementById('postTemplateBox').style.display = 'none';
      document.getElementById('resultContainer').innerHTML = '';
      updatePreview();
    };
    img.src = URL.createObjectURL(file);
  });

  function resetOffset() {
    imgOffsetX = 0;
    imgOffsetY = 0;
    imgScale = 1.0;
    document.getElementById('zoomRange').value = 1;
    document.getElementById('zoomVal').innerText = '100%';
  }

  document.getElementById('tabPad').addEventListener('click', () => {
    fitMode = 'pad';
    document.getElementById('tabPad').classList.add('active');
    document.getElementById('tabCrop').classList.remove('active');
    document.getElementById('bgColorGroup').style.display = 'flex';
    resetOffset(); updatePreview();
  });

  document.getElementById('tabCrop').addEventListener('click', () => {
    fitMode = 'crop';
    document.getElementById('tabCrop').classList.add('active');
    document.getElementById('tabPad').classList.remove('active');
    document.getElementById('bgColorGroup').style.display = 'none';
    resetOffset(); updatePreview();
  });

  document.getElementById('splitCount').addEventListener('change', () => { resetOffset(); updatePreview(); });
  document.getElementById('aspectRatio').addEventListener('change', () => { resetOffset(); updatePreview(); });
  document.getElementById('bgColor').addEventListener('change', updatePreview);
  
  // 整列・リセット系ボタン
  document.getElementById('alignYBtn').addEventListener('click', () => {
    imgOffsetY = 0; // 上下の中央
    updatePreview();
  });

  document.getElementById('alignXBtn').addEventListener('click', () => {
    imgOffsetX = 0; // 左右の中央
    updatePreview();
  });

  document.getElementById('resetPosBtn').addEventListener('click', () => {
    resetOffset();
    updatePreview();
  });

  // ズーム（拡大縮小）コントロール
  const zoomRange = document.getElementById('zoomRange');
  const zoomVal = document.getElementById('zoomVal');

  zoomRange.addEventListener('input', (e) => {
    imgScale = parseFloat(e.target.value);
    zoomVal.innerText = `${Math.round(imgScale * 100)}%`;
    updatePreview();
  });

  document.getElementById('zoomInBtn').addEventListener('click', () => {
    let newVal = Math.min(3, parseFloat(zoomRange.value) + 0.1);
    zoomRange.value = newVal;
    imgScale = newVal;
    zoomVal.innerText = `${Math.round(imgScale * 100)}%`;
    updatePreview();
  });

  document.getElementById('zoomOutBtn').addEventListener('click', () => {
    let newVal = Math.max(0.5, parseFloat(zoomRange.value) - 0.1);
    zoomRange.value = newVal;
    imgScale = newVal;
    zoomVal.innerText = `${Math.round(imgScale * 100)}%`;
    updatePreview();
  });

  // ドラッグ操作
  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', drag);
  canvas.addEventListener('mouseup', endDrag);
  canvas.addEventListener('mouseleave', endDrag);
  canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
  canvas.addEventListener('touchmove', (e) => drag(e.touches[0]));
  canvas.addEventListener('touchend', endDrag);

  function startDrag(e) {
    if (!loadedImage) return;
    isDragging = true;
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    startX = e.clientX * scale - imgOffsetX;
    startY = e.clientY * scale - imgOffsetY;
  }

  function drag(e) {
    if (!isDragging) return;
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    imgOffsetX = e.clientX * scale - startX;
    imgOffsetY = e.clientY * scale - startY;
    updatePreview();
  }

  function endDrag() { isDragging = false; }

  // 点線を含まない基本画像を描画
  function renderBaseCanvas() {
    if (!loadedImage) return;

    const count = parseInt(document.getElementById('splitCount').value);
    const aspect = parseFloat(document.getElementById('aspectRatio').value);
    const bgColor = document.getElementById('bgColor').value;

    const R = loadedImage.width / loadedImage.height;
    const F = aspect * count;

    if (fitMode === 'pad') {
      let targetW = R > F ? loadedImage.width : loadedImage.height * F;
      let targetH = R > F ? targetW / F : loadedImage.height;

      canvas.width = targetW;
      canvas.height = targetH;

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, targetW, targetH);

      let drawW = loadedImage.width * imgScale;
      let drawH = loadedImage.height * imgScale;

      ctx.drawImage(
        loadedImage, 
        (targetW - drawW) / 2 + imgOffsetX, 
        (targetH - drawH) / 2 + imgOffsetY,
        drawW,
        drawH
      );
    } else {
      let cropW = R > F ? loadedImage.height * F : loadedImage.width;
      let cropH = R > F ? cropW / F : loadedImage.height;

      canvas.width = cropW;
      canvas.height = cropH;

      let drawW = (R > F ? cropH * R : cropW) * imgScale;
      let drawH = (R > F ? cropH : cropW / R) * imgScale;

      ctx.drawImage(
        loadedImage, 
        (cropW - drawW) / 2 + imgOffsetX, 
        (cropH - drawH) / 2 + imgOffsetY, 
        drawW, 
        drawH
      );
    }
  }

  // 画面プレビュー更新（基本描画 ＋ 点線ガイド）
  function updatePreview() {
    renderBaseCanvas();
    if (!loadedImage) return;

    const count = parseInt(document.getElementById('splitCount').value);
    const pieceW = canvas.width / count;

    // プレビュー用ガイドライン（点線）
    ctx.strokeStyle = '#1d9bf0';
    ctx.lineWidth = Math.max(2, canvas.width / 400);
    ctx.setLineDash([8, 6]);

    for (let i = 1; i < count; i++) {
      ctx.beginPath();
      ctx.moveTo(pieceW * i, 0);
      ctx.lineTo(pieceW * i, canvas.height);
      ctx.stroke();
    }
  }

  // 分割書き出し処理
  document.getElementById('processBtn').addEventListener('click', () => {
    if (!loadedImage) return;

    renderBaseCanvas();

    const count = parseInt(document.getElementById('splitCount').value);
    const aspect = parseFloat(document.getElementById('aspectRatio').value);
    const container = document.getElementById('resultContainer');
    
    container.innerHTML = '';
    generatedDataUrls = [];

    const pieceW = canvas.width / count;

    for (let i = 0; i < count; i++) {
      const exportCanvas = document.createElement('canvas');
      const piecePixelW = 1080;
      const piecePixelH = piecePixelW / aspect;
      
      exportCanvas.width = piecePixelW;
      exportCanvas.height = piecePixelH;
      const exportCtx = exportCanvas.getContext('2d');

      let sx = i * pieceW;
      let sw = pieceW;
      
      exportCtx.drawImage(canvas, sx, 0, sw, canvas.height, 0, 0, piecePixelW, piecePixelH);

      const dataUrl = exportCanvas.toDataURL('image/jpeg', 0.92);
      generatedDataUrls.push(dataUrl);

      const itemDiv = document.createElement('div');
      itemDiv.className = 'result-item';
      
      const badge = document.createElement('div');
      badge.className = 'badge-num';
      badge.innerText = `${i + 1}/${count}`;

      const imgElem = document.createElement('img');
      imgElem.src = dataUrl;
      
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `x_carousel_${i + 1}.jpg`;
      link.innerText = `保存する`;

      itemDiv.appendChild(badge);
      itemDiv.appendChild(imgElem);
      itemDiv.appendChild(link);
      container.appendChild(itemDiv);
    }

    updatePreview();

    const templateText = `👈 スワイプして続きを見る（全${count}枚）`;
    document.getElementById('postTemplateText').innerText = templateText;
    document.getElementById('postTemplateBox').style.display = 'flex';
    document.getElementById('zipDownloadBtn').style.display = 'inline-block';
  });

  // クリップボードコピー
  document.getElementById('copyTextBtn').addEventListener('click', () => {
    const text = document.getElementById('postTemplateText').innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert('投稿文テキストをコピーしました！');
    });
  });

  // ZIPダウンロード
  document.getElementById('zipDownloadBtn').addEventListener('click', () => {
    if (generatedDataUrls.length === 0) return;

    const zip = new JSZip();
    generatedDataUrls.forEach((dataUrl, idx) => {
      const base64Data = dataUrl.replace(/^data:image\/jpeg;base64,/, "");
      zip.file(`x_carousel_${idx + 1}.jpg`, base64Data, { base64: true });
    });

    zip.generateAsync({ type: "blob" }).then((content) => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = "x_carousel_images.zip";
      link.click();
    });
  });
</script>
</body>
</html>
