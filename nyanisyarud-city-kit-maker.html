<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.161.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.161.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
// わかにゃん駅前の「箱ハリボテ」建物キットを作り、1つのGLBに書き出す。
// 長さの単位はm。建物の原点は敷地の中心の地面、正面(看板の板)は+zを向く。
const INK='#3a2b24';
let seed=11;const rand=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};const rr=(a,b)=>a+(b-a)*rand();
const DENS={v:1};
// ---------- 絵の道具(キャンバスの座標はm・y下向き) ----------
function cv(wm,hm,ppm){const px=ppm*DENS.v,c=document.createElement('canvas');c.width=Math.max(4,Math.round(wm*px));c.height=Math.max(4,Math.round(hm*px));const g=c.getContext('2d');g.setTransform(c.width/wm,0,0,c.height/hm,0,0);g.lineJoin='round';g.lineCap='round';return {c,g};}
const fill=(g,color)=>{g.fillStyle=color;g.fill();};
const ink=(g,lw=.07,color=INK)=>{g.strokeStyle=color;g.lineWidth=lw;g.stroke();};
function wob(g,pts,close=true,j=.03){g.beginPath();pts.forEach(([x,y],i)=>{x+=rr(-j,j);y+=rr(-j,j);i?g.lineTo(x,y):g.moveTo(x,y);});if(close)g.closePath();}
function wrect(g,x,y,w,h,j=.03){const pts=[],seg=(x0,y0,x1,y1)=>{const n=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/.7));for(let i=0;i<n;i++)pts.push([x0+(x1-x0)*i/n,y0+(y1-y0)*i/n]);};seg(x,y,x+w,y);seg(x+w,y,x+w,y+h);seg(x+w,y+h,x,y+h);seg(x,y+h,x,y);wob(g,pts,true,j);}
function speckle(g,x,y,w,h,n){for(let i=0;i<n;i++){g.fillStyle=rand()<.5?`rgba(60,40,20,${rand()*.08})`:`rgba(255,250,235,${rand()*.1})`;const s=rr(.02,.06);g.fillRect(x+rand()*w,y+rand()*h,s,s);}}
function cardboard(g,x,y,w,h,base='#c99c68'){
  g.fillStyle=base;g.fillRect(x,y,w,h);
  for(let u=x;u<x+w;u+=.16){g.fillStyle=`rgba(95,62,30,${.045+rand()*.04})`;g.fillRect(u,y,.045,h);}
  for(let i=0;i<w*h*.5;i++){g.fillStyle=`rgba(${rand()<.5?'110,75,40':'236,206,160'},${rand()*.10})`;g.beginPath();g.ellipse(x+rand()*w,y+rand()*h,rr(.2,.9),rr(.1,.4),rand()*3,0,Math.PI*2);g.fill();}
  speckle(g,x,y,w,h,w*h*18);
}
function poster(g,x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h);for(let i=0;i<h*5;i++){g.fillStyle=rand()<.5?`rgba(255,255,255,${rand()*.07})`:`rgba(0,0,0,${rand()*.045})`;g.fillRect(x+rr(-.5,w*.3),y+rand()*h,rr(w*.3,w),rr(.04,.14));}}
function tape(g,x,y,w,h,a=0){g.save();g.translate(x,y);g.rotate(a);g.fillStyle='rgba(238,224,172,.88)';g.fillRect(-w/2,-h/2,w,h);g.fillStyle='rgba(255,255,255,.28)';g.fillRect(-w/2,-h/2,w,h*.3);g.restore();}
function text(g,str,x,y,size,font,color,align='center',maxW){g.font=`${font.includes('Zen')?'900 ':''}${size}px ${font}`;g.textAlign=align;g.textBaseline='middle';g.fillStyle=color;if(maxW)g.fillText(str,x,y,maxW);else g.fillText(str,x,y);}
function vtext(g,str,x,yc,size,font,color,step=1.08){const chars=[...str],y0=yc-(chars.length-1)*size*step/2;chars.forEach((ch,i)=>{if(ch==='ー'){g.save();g.translate(x,y0+i*size*step);g.rotate(Math.PI/2);text(g,ch,0,0,size,font,color);g.restore();}else text(g,ch,x,y0+i*size*step,size,font,color);});}
function catSil(g,cx,by,s){
  g.fillStyle='rgba(32,26,32,.88)';g.beginPath();g.ellipse(cx,by-s*.32,s*.28,s*.33,0,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(cx,by-s*.76,s*.2,0,Math.PI*2);g.fill();
  for(const k of [-1,1]){g.beginPath();g.moveTo(cx+k*s*.19,by-s*.84);g.lineTo(cx+k*s*.14,by-s*1.04);g.lineTo(cx+k*s*.04,by-s*.92);g.fill();}
  g.strokeStyle='rgba(32,26,32,.88)';g.lineWidth=s*.08;g.beginPath();g.moveTo(cx+s*.24,by-s*.08);g.quadraticCurveTo(cx+s*.62,by-s*.12,cx+s*.5,by-s*.5);g.stroke();
}
function windowPane(g,x,y,w,h,o={}){
  wrect(g,x-.09,y-.09,w+.18,h+.18,.02);fill(g,o.frame||'#f6f1e6');ink(g,.05);
  const grd=g.createLinearGradient(x,y,x+w,y+h);grd.addColorStop(0,o.lit?'#ffeeb0':'#6d8fae');grd.addColorStop(1,o.lit?'#f3c871':'#3d5874');g.fillStyle=grd;g.fillRect(x,y,w,h);
  if(o.curtain){g.fillStyle=o.curtain;g.fillRect(x,y,w*.26,h);g.fillRect(x+w*.74,y,w*.26,h);}
  if(o.cat)catSil(g,x+w*.5,y+h,Math.min(w,h)*.62);
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=.06;g.beginPath();g.moveTo(x+w*.14,y+h*.72);g.lineTo(x+w*.42,y+h*.2);g.stroke();
  if(o.bar!==false){g.strokeStyle=o.frame||'#f6f1e6';g.lineWidth=.07;g.beginPath();g.moveTo(x+w/2,y);g.lineTo(x+w/2,y+h);g.stroke();}
  g.strokeStyle=INK;g.lineWidth=.035;g.strokeRect(x,y,w,h);
  if(o.decal){text(g,o.decal,x+w/2,y+h*.5,Math.min(h*.36,w/(o.decal.length*.95)),"'Zen Maru Gothic'",o.decalColor||'#fff');}
}
function earPlate(g,x,y,w,h,bg,ears=true){
  if(ears)for(const k of [-1,1]){const ex=x+w/2+k*w*.33;wob(g,[[ex-k*w*.13,y+.03],[ex+k*w*.01,y-h*.36-.1],[ex+k*w*.13,y+.03]],true,.02);fill(g,bg);ink(g,.05);
    g.beginPath();g.moveTo(ex-k*w*.07,y);g.lineTo(ex+k*w*.005,y-h*.22);g.lineTo(ex+k*w*.07,y);g.closePath();fill(g,'rgba(242,170,175,.9)');}
  wrect(g,x,y,w,h,.02);fill(g,bg);ink(g,.06);
}
function stamp(g,x,y,w,h,str,color,rot=0){g.save();g.translate(x,y);g.rotate(rot);g.globalAlpha=.78;g.strokeStyle=color;g.lineWidth=.08;g.strokeRect(-w/2,-h/2,w,h);text(g,str,0,h*.03,h*.62,"'Zen Maru Gothic'",color,'center',w*.9);g.restore();g.globalAlpha=1;}
function paw(g,x,y,s,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y+s*.18,s*.42,s*.34,0,0,Math.PI*2);g.fill();for(const [dx,dy] of [[-.42,-.22],[-.15,-.48],[.15,-.48],[.42,-.22]]){g.beginPath();g.ellipse(x+dx*s,y+dy*s,s*.15,s*.19,dx*.6,0,Math.PI*2);g.fill();}}
// ---------- 板の輪郭(m・y上向き) ----------
const extOf=o=>{const xs=o.map(p=>p[0]),ys=o.map(p=>p[1]);return {u0:Math.min(...xs),u1:Math.max(...xs),v0:Math.min(...ys),v1:Math.max(...ys)};};
function outlinePath(g,o,e){g.beginPath();o.forEach(([x,y],i)=>{const X=x-e.u0,Y=e.v1-y;i?g.lineTo(X,Y):g.moveTo(X,Y);});g.closePath();}
function boardCanvas(outline,ppm,draw,line=.13){const e=extOf(outline),W=e.u1-e.u0,H=e.v1-e.v0,{c,g}=cv(W,H,ppm);g.save();outlinePath(g,outline,e);g.clip();draw(g,W,H,e);g.restore();outlinePath(g,outline,e);ink(g,line);return c;}
// ---------- 共通の面 ----------
function backTex(){const {c,g}=cv(10,10,24);g.fillStyle='#cdc2ab';g.fillRect(0,0,10,10);
  for(let u=0;u<10;u+=.16){g.fillStyle=`rgba(110,95,70,${.03+rand()*.03})`;g.fillRect(u,0,.045,10);}
  speckle(g,0,0,10,10,1200);g.fillStyle='rgba(150,130,100,.16)';g.fillRect(0,4.6,10,.8);return c;}
function roofTex(){const {c,g}=cv(10,10,36);cardboard(g,0,0,10,10,'#bf9562');g.strokeStyle='rgba(80,52,25,.6)';g.lineWidth=.06;g.beginPath();g.moveTo(0,5);g.lineTo(10,5);g.stroke();
  g.fillStyle='rgba(176,125,62,.55)';g.fillRect(0,4.45,10,1.1);g.fillStyle='rgba(255,255,255,.2)';g.fillRect(0,4.5,10,.25);
  for(const x of [2,8]){g.fillStyle='rgba(176,125,62,.5)';g.fillRect(x-.45,0,.9,10);}
  stamp(g,5,7.7,2.6,.8,'天地無用','#b8322a',.03);return c;}
function cardTex(){const {c,g}=cv(6,6,24);g.fillStyle='#cdc2ab';g.fillRect(0,0,6,6);for(let u=0;u<6;u+=.16){g.fillStyle=`rgba(110,95,70,${.03+rand()*.03})`;g.fillRect(u,0,.045,6);}speckle(g,0,0,6,6,500);return c;}
function edgeTex(){const {c,g}=cv(4,.5,64);g.fillStyle='#e2c38f';g.fillRect(0,0,4,.5);g.fillStyle='#b98b55';g.fillRect(0,0,4,.07);g.fillRect(0,.43,4,.07);g.strokeStyle='#a57947';g.lineWidth=.035;g.beginPath();for(let x=0;x<=4;x+=.02){const y=.25+Math.sin(x*28)*.15;x?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();return c;}
function woodTex(){const {c,g}=cv(.5,4,64);g.fillStyle='#c38c55';g.fillRect(0,0,.5,4);for(let i=0;i<14;i++){g.strokeStyle=`rgba(110,64,28,${.15+rand()*.2})`;g.lineWidth=.012;g.beginPath();const x=rand()*.5;g.moveTo(x,0);g.bezierCurveTo(x+rr(-.05,.05),1.3,x+rr(-.05,.05),2.6,x+rr(-.04,.04),4);g.stroke();}return c;}
function bagTex(){const {c,g}=cv(1,1,64);g.fillStyle='#a99f88';g.fillRect(0,0,1,1);speckle(g,0,0,1,1,60);g.strokeStyle='rgba(70,60,45,.5)';g.lineWidth=.03;g.strokeRect(.06,.06,.88,.88);return c;}
// ---------- 建物ごとの面 ----------
const SHOP={W:8,H:6.5,D:7,board:[[-4.2,0],[4.2,0],[4.2,7],[3,7],[3,7.6],[1.6,7.6],[1.6,8.2],[-1.6,8.2],[-1.6,7.6],[-3,7.6],[-3,7],[-4.2,7]]};
function umeFlower(g,x,y,r){for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;g.beginPath();g.arc(x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,r*.45,0,Math.PI*2);fill(g,'#f5a7b8');ink(g,.04);}paw(g,x,y+r*.05,r*.42,'#c94c64');}
function shopFront(){return boardCanvas(SHOP.board,40,g=>{
  poster(g,0,0,8.4,8.2,'#f1e3c3');poster(g,0,0,8.4,1.2,'#79a56c');g.fillStyle='#f7f1e1';g.fillRect(0,1.1,8.4,.1);umeFlower(g,4.2,.6,.36);
  windowPane(g,1.0,1.62,2.2,1.25,{curtain:'#f3c1c8',cat:true});windowPane(g,5.2,1.62,2.2,1.25,{curtain:'#f3c1c8'});
  for(const x of [1.0,5.2]){wrect(g,x-.1,2.95,2.4,.32,.02);fill(g,'#8a5a3a');ink(g,.04);for(let i=0;i<7;i++){g.beginPath();g.arc(x+.15+i*.33,2.88,.12,0,Math.PI*2);fill(g,['#e2534f','#f5a7b8','#ffd34d'][i%3]);}}
  earPlate(g,.6,3.55,7.2,1.05,'#5b3a29');text(g,'梅にゃ堂',4.2,4.1,.82,"'Yuji Syuku'",'#f7e6b5');tape(g,.75,3.58,.6,.18,-.45);tape(g,7.65,3.58,.6,.18,.45);
  for(let i=0;i<14;i++){g.fillStyle=i%2?'#f8f1e6':'#d9534f';g.fillRect(i*.6,4.75,.6,.6);}
  g.beginPath();for(let i=0;i<14;i++)g.arc(i*.6+.3,5.35,.3,0,Math.PI);fill(g,'#d9534f');g.strokeStyle=INK;g.lineWidth=.05;g.strokeRect(0,4.75,8.4,.6);
  g.fillStyle='#4a392f';g.fillRect(.45,5.7,7.5,2.5);
  for(const y of [6.55,7.35]){g.fillStyle='#8a6242';g.fillRect(.6,y,7.2,.08);}
  for(let i=0;i<9;i++){const x=.85+i*.78;wrect(g,x,6.05,.42,.5,.01);fill(g,'rgba(240,235,225,.75)');ink(g,.025);g.beginPath();g.arc(x+.21,6.36,.11,0,Math.PI*2);fill(g,'#d63c3c');}
  for(let i=0;i<4;i++){const x=1.1+i*1.7;wrect(g,x,7.55,1.3,.65,.02);fill(g,'#b98a5a');ink(g,.03);for(let k=0;k<4;k++){g.beginPath();g.arc(x+.22+k*.29,7.5,.15,0,Math.PI*2);fill(g,'#f39a2b');}}
  poster(g,0,5.7,.45,2.5,'#b98a5a');poster(g,7.95,5.7,.45,2.5,'#b98a5a');
});}
function shopSleeve(){return boardCanvas([[0,0],[1.1,0],[1.1,2.8],[.95,2.8],[.82,3.15],[.68,2.8],[.42,2.8],[.28,3.15],[.15,2.8],[0,2.8]],60,(g,W,H)=>{poster(g,0,0,W,H,'#fbf6ea');g.strokeStyle='#c8312f';g.lineWidth=.08;g.strokeRect(.1,.42,W-.2,H-.52);vtext(g,'うめぼし',W/2,H*.58,.5,"'Yuji Syuku'",'#c8312f');});}
function shopSide(left){const W=7,H=6.5,{c,g}=cv(W,H,26);cardboard(g,0,0,W,H);
  const x=1.4,y=1.1,w=4.2,h=3.1;g.save();g.translate(x+w/2,y+h/2);g.rotate(left?-.04:.05);wrect(g,-w/2,-h/2,w,h,.02);fill(g,'#fbf3df');ink(g,.05);
  if(left){for(const [dx,dy] of [[-.9,.15],[-.2,.35],[.55,.1]]){g.beginPath();g.arc(dx,dy+.4,.42,0,Math.PI*2);fill(g,'#f39a2b');ink(g,.04);g.beginPath();g.ellipse(dx+.12,dy-.05,.16,.07,-.5,0,Math.PI*2);fill(g,'#5f9a4a');}text(g,'みかん',0,-.85,.8,"'Yuji Syuku'",'#d46a12');}
  else{g.beginPath();g.ellipse(-.9,.4,.62,.72,0,0,Math.PI*2);fill(g,'rgba(235,240,245,.9)');ink(g,.04);for(let i=0;i<6;i++){g.beginPath();g.arc(-1.15+(i%3)*.25,.25+Math.floor(i/3)*.35,.12,0,Math.PI*2);fill(g,'#d63c3c');}text(g,'紀州',.75,-.65,.55,"'Yuji Syuku'",'#7a3a2a');text(g,'うめぼし',.75,.35,.62,"'Yuji Syuku'",'#c8312f');}
  g.restore();tape(g,x+.1,y+.1,.8,.26,-.7);tape(g,x+w-.1,y+.1,.8,.26,.7);tape(g,x+.1,y+h-.1,.8,.26,.7);tape(g,x+w-.1,y+h-.1,.8,.26,-.7);return c;}
const BLDG={W:10,H:16,D:9,board:[[-5.2,0],[5.2,0],[5.2,16.4],[2.3,16.4],[2.3,17.4],[-2.3,17.4],[-2.3,16.4],[-5.2,16.4]]};
function bldgFront(){return boardCanvas(BLDG.board,40,g=>{
  poster(g,0,0,10.4,17.4,'#cfd9df');poster(g,0,1,.4,16.4,'#b9c6cf');poster(g,10,1,.4,16.4,'#b9c6cf');
  wrect(g,2.95,.12,4.5,.8,.02);fill(g,'#fbf8f1');ink(g,.05);text(g,'にゃんこビル',5.2,.54,.52,"'Zen Maru Gothic'",'#3b4a5a');
  for(const y of [1.25,4.35,7.45,10.55,13.65]){g.fillStyle='#9fb0bb';g.fillRect(0,y,10.4,.14);}
  const decals=[['ねこカフェ','#f39ab8'],['カラオケ','#ffd65a'],['ねこ整体','#9fd59a'],['にゃん八','#ff8d6e']];
  for(let f=0;f<4;f++){const y=1.75+f*3.1;for(let k=0;k<3;k++){const o={};if(k===0){o.decal=decals[f][0];o.decalColor=decals[f][1];o.bar=false;}if(f===0&&k===2)o.cat=true;if(f===2&&k===1)o.curtain='#d9ecd2';if(f===1&&k===2)o.lit=true;windowPane(g,1.0+k*3.05,y,2.3,1.75,o);}}
  wrect(g,.3,13.9,9.8,1.0,.02);fill(g,'#c8312f');ink(g,.06);text(g,'中華そば にゃん八',5.2,14.42,.62,"'Yuji Syuku'",'#fff4e0');
  g.fillStyle='#3d332e';g.fillRect(3.3,15.05,3.8,2.35);
  for(let k=0;k<3;k++){wrect(g,3.3+k*1.27,15.0,1.22,.95,.015);fill(g,'#b8282a');ink(g,.04);paw(g,3.9+k*1.27,15.48,.32,'rgba(255,240,225,.9)');}
  g.strokeStyle='#c49a6c';g.lineWidth=.1;g.strokeRect(3.35,15.95,3.7,1.45);g.beginPath();g.moveTo(5.2,15.95);g.lineTo(5.2,17.4);g.stroke();
  for(const x of [2.55,7.85]){g.beginPath();g.ellipse(x,15.75,.34,.46,0,0,Math.PI*2);fill(g,'#e0463c');ink(g,.04);g.fillStyle='#2b2422';g.fillRect(x-.22,15.24,.44,.09);g.fillRect(x-.22,16.17,.44,.09);}
});}
function bldgSleeve(){const o=[[0,0],[1.4,0],[1.4,9],[1.22,9],[1.06,9.42],[.9,9],[.5,9],[.34,9.42],[.18,9],[0,9]];return boardCanvas(o,48,(g,W,H)=>{
  const panels=[['ねこカフェ','#f39ab8','#fff'],['カラオケ','#2f5fa8','#ffe36a'],['ねこ整体','#5aa267','#fff']];const top=.42,ph=(H-top)/3;
  panels.forEach(([t,bg,fg],i)=>{poster(g,0,top+i*ph,W,ph,bg);g.strokeStyle=INK;g.lineWidth=.05;g.strokeRect(.04,top+i*ph,W-.08,ph);vtext(g,t,W/2,top+i*ph+ph/2,Math.min(.55,ph/(t.length*1.15)),"'Zen Maru Gothic'",fg);});
  g.fillStyle='#f39ab8';g.fillRect(0,0,W,top);});}
function bldgSide(left){const W=9,H=16,{c,g}=cv(W,H,22);cardboard(g,0,0,W,H);g.fillStyle='rgba(120,128,135,.85)';g.fillRect(left?.5:8.3,0,.22,H);
  const x=.9,y=1.0,w=7.2,h=5.4;wrect(g,x,y,w,h,.03);fill(g,left?'#bfe3f3':'#f6d76b');ink(g,.07);
  if(left){wrect(g,x+.7,y+1.3,1.7,3.6,.02);fill(g,'#fbfbf7');ink(g,.05);g.fillStyle='#2f6fb0';g.fillRect(x+.85,y+1.05,1.4,.4);catFace(g,x+1.55,y+3.2,.55);text(g,'にゃんこ牛乳',x+4.8,y+2.7,.78,"'Zen Maru Gothic'",'#2b5c8a','center',4.2);}

}
